<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Дерево інженерного вибору IPC: від архітектурних вимог до системного примітиву</text>
<rect x="269.4" y="54.0" width="481.3" height="32.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="510.0" y="74.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Головна вимога: обсяг даних, характер передачі та межі безпеки</tspan></text>
<line x1="340.0" y1="90.0" x2="180.0" y2="135.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="510.0" y1="90.0" x2="510.0" y2="135.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="680.0" y1="90.0" x2="840.0" y2="135.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="240.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="700">Масивні дані / нуль копій</text>
<text x="510.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7e22ce" text-anchor="middle" font-weight="700">Керування / FDs / безпека</text>
<text x="780.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">Потоки байтів / черги</text>
<rect x="30.0" y="140.0" width="300.0" height="475.0" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.2"/>
<text x="180.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">1. Швидкість та Обсяг даних</text>
<rect x="87.4" y="188.5" width="185.3" height="43.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="180.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Потрібна ізоляція у пісочниці</tspan><tspan x="180.0" dy="13.0">чи відкрите системне ім'я?</tspan></text>
<line x1="180.0" y1="240.0" x2="180.0" y2="270.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="69.9" y="276.7" width="220.3" height="66.6" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="180.0" y="294.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">memfd_create() + mmap + seals</tspan><tspan x="180.0" dy="12.3">• Анонімний дескриптор у RAM</tspan><tspan x="180.0" dy="12.3">• fcntl(F_ADD_SEALS, F_SEAL_WRITE)</tspan><tspan x="180.0" dy="12.3">• Ідеально для передачі у sandbox</tspan></text>
<rect x="69.8" y="372.9" width="220.4" height="54.2" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="180.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">POSIX shm (shm_open + mmap)</tspan><tspan x="180.0" dy="12.3">• Файл у віртуальній пам'яті /dev/shm</tspan><tspan x="180.0" dy="12.3">• Доступ за правами користувача/групи</tspan></text>
<line x1="180.0" y1="435.0" x2="180.0" y2="465.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="83.4" y="486.7" width="193.3" height="66.6" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="180.0" y="504.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Обов'язкова сигналізація:</tspan><tspan x="180.0" dy="12.3">• eventfd (готовність для epoll)</tspan><tspan x="180.0" dy="12.3">• Robust Futex / Pthread Mutex</tspan><tspan x="180.0" dy="12.3">• Lockless Ring Buffer (SPSC)</tspan></text>
<rect x="70.8" y="570.0" width="218.4" height="30.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="180.0" y="588.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Вибір: Спільна пам'ять + eventfd</tspan></text>
<rect x="360.0" y="140.0" width="300.0" height="475.0" rx="8" fill="#f8fafc" stroke="#7e22ce" stroke-width="1.2"/>
<text x="510.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7e22ce" text-anchor="middle" font-weight="700">2. Керування, FDs та Безпека</text>
<rect x="411.6" y="188.5" width="196.7" height="43.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="510.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Топологія зв'язку:</tspan><tspan x="510.0" dy="13.0">батько-дитина чи клієнт-сервер?</tspan></text>
<line x1="510.0" y1="240.0" x2="510.0" y2="270.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="391.0" y="276.7" width="237.9" height="66.6" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="510.0" y="294.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Unix Domain Socket (SEQPACKET)</tspan><tspan x="510.0" dy="12.3">• Межі повідомлень без розриву потоку</tspan><tspan x="510.0" dy="12.3">• SO_PEERCRED: перевірка UID/GID ядра</tspan><tspan x="510.0" dy="12.3">• SCM_RIGHTS: передача дескрипторів</tspan></text>
<rect x="410.7" y="372.9" width="198.7" height="54.2" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="510.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">socketpair(AF_UNIX, STREAM)</tspan><tspan x="510.0" dy="12.3">• Без створення файлу на диску</tspan><tspan x="510.0" dy="12.3">• Двоспрямований надійний зв'язок</tspan></text>
<line x1="510.0" y1="435.0" x2="510.0" y2="465.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="397.1" y="486.7" width="225.8" height="66.6" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="510.0" y="504.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Системні переваги:</tspan><tspan x="510.0" dy="12.3">• Автоматичний EOF / POLLHUP при краху</tspan><tspan x="510.0" dy="12.3">• Рідне мультиплексування в epoll</tspan><tspan x="510.0" dy="12.3">• Безпечне розділення привілеїв</tspan></text>
<rect x="397.7" y="570.0" width="224.6" height="30.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="510.0" y="588.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Вибір: UDS (головний IPC у Linux)</tspan></text>
<rect x="690.0" y="140.0" width="300.0" height="475.0" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="1.2"/>
<text x="840.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">3. Потоки або Пріоритети</text>
<rect x="741.6" y="188.5" width="196.7" height="43.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="840.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">Односпрямований потік байтів</tspan><tspan x="840.0" dy="13.0">чи дискретні пріоритетні черги?</tspan></text>
<line x1="840.0" y1="240.0" x2="840.0" y2="270.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="738.7" y="276.7" width="202.6" height="66.6" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="840.0" y="294.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">Pipes / FIFO (pipe2, mkfifo)</tspan><tspan x="840.0" dy="12.3">• Простий односпрямований потік</tspan><tspan x="840.0" dy="12.3">• Атомарність запису до 4 КБ</tspan><tspan x="840.0" dy="12.3">• SIGPIPE та EOF при закритті</tspan></text>
<rect x="721.7" y="372.9" width="236.6" height="54.2" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="840.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">POSIX Message Queues (mq_open)</tspan><tspan x="840.0" dy="12.3">• Пріоритетизація повідомлень (0..32767)</tspan><tspan x="840.0" dy="12.3">• Збереження меж кожного пакета</tspan></text>
<line x1="840.0" y1="435.0" x2="840.0" y2="465.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="727.1" y="486.7" width="225.8" height="66.6" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="840.0" y="504.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">Особливості експлуатації:</tspan><tspan x="840.0" dy="12.3">• Pipe: без збереження меж повідомлень</tspan><tspan x="840.0" dy="12.3">• MQ: незручний mq_notify для epoll;</tspan><tspan x="840.0" dy="12.3">  повідомлення зависають у ядрі</tspan></text>
<rect x="733.9" y="570.0" width="212.2" height="30.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="840.0" y="588.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">Вибір: Pipes для CLI; MQ для RT</tspan></text>
</svg>