name: Deploy site to GitHub Pages

# Деплой сайту-бібліотеки на GitHub Pages.
# Пошуковий індекс (search-index.json + search-fulltext.json) будується ТУТ, на кожен
# push у main, тож він завжди свіжий — руками нічого оновлювати не треба.
# ВАЖЛИВО: у Settings → Pages → Source треба обрати «GitHub Actions» (один раз).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; новіший скасовує старий у черзі.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build search index
        run: node scripts/build-search-index.js

      # Збираємо сайт у _site, виключаючи службові теки (щоб .git у прод не потрапляв).
      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='node_modules' \
            ./ _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
