name: Deploy site to GitHub Pages

# Деплой сайту-бібліотеки на GitHub Pages.
# Пошуковий індекс (search-index.json + search-fulltext.json) будується ТУТ, на кожен
# push у main, тож він завжди свіжий — руками нічого оновлювати не треба.
# ВАЖЛИВО: у Settings → Pages → Source треба обрати «GitHub Actions» (один раз).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; новіший скасовує старий у черзі.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build search index
        run: node src/front/build-search-index.js

      # Сайт = рушій (src/front/*) у КОРЕНІ _site + дерево контенту root/ поруч.
      # Явний allowlist, а не rsync усього кореня: інакше в прод їде все, що лежить
      # у репо, включно з авторським конвеєром і файлами, які ігнорує git.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r src/front/. _site/
          # Генератори фігур і кеш Python у прод не їдуть: сайт фетчить лише .md, .json
          # і .svg, а `figs.py` важить 72 МБ і живе для автора, не для читача.
          rsync -a --exclude='.git' --exclude='*.py' --exclude='__pycache__' \
                --exclude='*.pyc' --exclude='*.log' root/ _site/root/
          rm -f _site/build-search-index.js
          echo "--- _site ---"; ls _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
