<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 650 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="650" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="320.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому час вимірюють до наносекунд</text>
<text x="320.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">дальність = час польоту × швидкість світла</text>
<text x="320.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">c ≈ 300 000 км/с  =  30 см за наносекунду</text>
<text x="210.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">промах годинника</text>
<text x="480.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">бреше дальність на</text>
<rect x="150.0" y="130.0" width="120.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="155.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">1 нс</tspan></text>
<line x1="282.0" y1="150.0" x2="418.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="422.0" y="130.0" width="150.0" height="40.0" rx="6" fill="#fdeeee" stroke="#c0392b" stroke-width="1.5"/><text x="497.0" y="155.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="497.0" dy="0.0">30 см</tspan></text>
<rect x="150.0" y="186.0" width="120.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="211.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">1 мкс</tspan></text>
<line x1="282.0" y1="206.0" x2="418.0" y2="206.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="422.0" y="186.0" width="150.0" height="40.0" rx="6" fill="#fdeeee" stroke="#c0392b" stroke-width="1.5"/><text x="497.0" y="211.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="497.0" dy="0.0">300 м</tspan></text>
<rect x="150.0" y="242.0" width="120.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="267.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">1 мс</tspan></text>
<line x1="282.0" y1="262.0" x2="418.0" y2="262.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="422.0" y="242.0" width="150.0" height="40.0" rx="6" fill="#fdeeee" stroke="#c0392b" stroke-width="1.5"/><text x="497.0" y="267.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="497.0" dy="0.0">300 км</tspan></text>
<rect x="20.0" y="332.0" width="600.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="320.0" y="353.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Щоб дальність була точна до метрів, час треба знати до наносекунд — тому на супутниках атомні годинники.</tspan></text>
</svg>