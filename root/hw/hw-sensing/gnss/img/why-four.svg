<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 670 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="670" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="330.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому потрібні щонайменше чотири супутники</text>
<text x="165.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">якби годинник був ідеальний</text>
<rect x="40.0" y="88.0" width="250.0" height="96.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="165.0" y="113.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">3 невідомі:</tspan><tspan x="165.0" dy="18.2"> x, y, z</tspan><tspan x="165.0" dy="18.2"></tspan><tspan x="165.0" dy="18.2">3 рівняння → 3 супутники</tspan></text>
<line x1="305.0" y1="150.0" x2="360.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="332.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">але він</text>
<text x="332.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">дешевий</text>
<text x="500.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">насправді: годинник бреше на Δt</text>
<rect x="375.0" y="88.0" width="250.0" height="96.0" rx="6" fill="#fdeeee" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="113.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">4 невідомі:</tspan><tspan x="500.0" dy="18.2"> x, y, z і Δt</tspan><tspan x="500.0" dy="18.2"></tspan><tspan x="500.0" dy="18.2">4 рівняння → 4 супутники</tspan></text>
<line x1="40.0" y1="210.0" x2="620.0" y2="210.0" stroke="#dddddd" stroke-width="1.0"/>
<text x="330.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">кожна виміряна дальність зміщена на ОДНЕ й те саме c·Δt:</text>
<text x="330.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">ρ₁ = (справжня d₁) + c·Δt</text>
<text x="330.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">ρ₂ = (справжня d₂) + c·Δt</text>
<text x="330.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">ρ₃ = (справжня d₃) + c·Δt</text>
<text x="330.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">ρ₄ = (справжня d₄) + c·Δt   ← цей «оплачує» Δt</text>
<rect x="20.0" y="390.0" width="620.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="330.0" y="408.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">Спільне зміщення — четверта невідома; додавши один супутник, приймач обчислює і місце, і власну похибку часу.</tspan></text>
</svg>