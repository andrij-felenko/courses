<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двопровідний вимір: опір дротів зливається з вимірюваним</text>
<text x="440.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">ті самі дроти несуть струм І ВИМІРЮЮТЬ напругу — омметр бачить R_дрт + R_x + R_дрт</text>
<circle cx="120.0" cy="215.0" r="46.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.2"/>
<text x="120.0" y="230.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="46" fill="#27ae60" text-anchor="middle" font-weight="700">Ω</text>
<text x="120.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">омметр (2 клеми)</text>
<line x1="166.0" y1="189.0" x2="300.0" y2="189.0" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="325.0" y="179.0" width="70.0" height="20.0" rx="3" fill="#fafafa" stroke="#c0392b" stroke-width="2.0"/>
<text x="360.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">R_дрт</text>
<line x1="395.0" y1="189.0" x2="614.0" y2="189.0" stroke="#1a1a1a" stroke-width="2.4"/>
<line x1="614.0" y1="189.0" x2="614.0" y2="175.0" stroke="#1a1a1a" stroke-width="2.4"/>
<line x1="166.0" y1="241.0" x2="300.0" y2="241.0" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="325.0" y="231.0" width="70.0" height="20.0" rx="3" fill="#fafafa" stroke="#c0392b" stroke-width="2.0"/>
<text x="360.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">R_дрт</text>
<line x1="395.0" y1="241.0" x2="614.0" y2="241.0" stroke="#1a1a1a" stroke-width="2.4"/>
<line x1="614.0" y1="241.0" x2="614.0" y2="255.0" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="592.0" y="175.0" width="44.0" height="80.0" rx="4" fill="#eef7f0" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="614.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">R_x</text>
<text x="674.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="674.0" dy="0.0">вимірюваний</tspan><tspan x="674.0" dy="13.0">(малий!)</tspan></text>
<text x="360.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">→ І тече тут →</text>
<text x="360.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">← І тече тут ←</text>
<rect x="150.0" y="330.0" width="580.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="440.0" y="351.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Струм тече ЧЕРЕЗ дроти, тож на кожному падає І·R_дрт. Той самий дріт міряє напругу —</tspan><tspan x="440.0" dy="14.3">тому омметр зчитує R_дрт + R_x + R_дрт. Коли R_x — міліоми, а дроти — десяті ома,</tspan><tspan x="440.0" dy="14.3">уся «вимірювана» величина — це майже самі дроти. Вимір зіпсовано.</tspan></text>
</svg>