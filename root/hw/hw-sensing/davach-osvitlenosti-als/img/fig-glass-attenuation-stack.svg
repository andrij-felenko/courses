<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оптичний стек: затухання у склі, кут зору (FOV) та паразитна перехресна завада</text>
<rect x="60.0" y="55.0" width="640.0" height="45.0" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
<text x="380.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle" font-weight="700">Захисне скло / Екран (Gorilla Glass, тонування T_glass = 5% ... 15%)</text>
<text x="380.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#075985" text-anchor="middle">Коефіцієнт корекції скла: K_glass = 1 / T_glass (наприклад, 1 / 0.10 = 10.0x)</text>
<rect x="60.0" y="100.0" width="230.0" height="20.0" rx="6" fill="#1e293b" stroke="#333333" stroke-width="1.0"/>
<rect x="470.0" y="100.0" width="230.0" height="20.0" rx="6" fill="#1e293b" stroke="#333333" stroke-width="1.0"/>
<text x="175.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">Чорне маскувальне чорнило</text>
<text x="585.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">Чорне маскувальне чорнило</text>
<text x="380.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">Оптична апертура (Aperture: 1.5–2.5 мм)</text>
<rect x="60.0" y="120.0" width="640.0" height="130.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="130.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Повітряний зазор (Air Gap: 0.5–1.2 мм)</text>
<polygon points="290,120 470,120 405,230 355,230" fill="#fef9c3" stroke="#eab308" stroke-width="1.2" opacity="0.6"/>
<text x="380.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle" font-weight="700">Конус прийому світла</text>
<text x="380.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#a16207" text-anchor="middle" font-weight="700">FOV ≈ ±50°</text>
<rect x="310.0" y="120.0" width="30.0" height="130.0" rx="6" fill="#334155" stroke="#333333" stroke-width="1.5"/>
<rect x="420.0" y="120.0" width="30.0" height="130.0" rx="6" fill="#334155" stroke="#333333" stroke-width="1.5"/>
<text x="250.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="middle" font-weight="700">Оптичний
бар'єр</text>
<text x="505.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="middle" font-weight="700">Оптичний
бар'єр</text>
<rect x="340.0" y="230.0" width="80.0" height="20.0" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6"/>
<text x="380.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle" font-weight="700">ALS IC</text>
<rect x="560.0" y="225.0" width="70.0" height="25.0" rx="3" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
<text x="595.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">OLED / LED</text>
<rect x="60.0" y="250.0" width="640.0" height="35.0" rx="2" fill="#15803d" stroke="#14532d" stroke-width="1.8"/>
<text x="150.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Друкована плата (Main PCB)</text>
<line x1="595.0" y1="225.0" x2="520.0" y2="65.0" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,2"/>
<line x1="520.0" y1="65.0" x2="450.0" y2="140.0" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,2"/>
<text x="575.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle" font-weight="700">Паразитне внутрішнє відбиття
(відсікається бар'єром)</text>
<rect x="60.0" y="305.0" width="640.0" height="105.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="380.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">Три золоті правила механічної та оптичної інтеграції ALS:</text>
<text x="380.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">1. Мінімальний Air Gap (&lt; 0.8 мм): збільшення зазору звужує FOV і вимагає ширшої апертури.</text>
<text x="380.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">2. Оптичний бар'єр (Gasket): виключає засвічення від сусідніх пікселів екрана крізь товщу скла.</text>
<text x="380.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">3. Калібрування затемненого скла: чорнило сильніше пропускає ІЧ, тому формула вимагає нового зважування.</text>
</svg>