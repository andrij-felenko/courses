<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Принцип чоперної стабілізації модулятора АЦП (Chopper Stabilization)</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Перемикання фаз модулює сигнал, а синхронна демодуляція віднімає дрейф зміщення нуля і шум 1/f</text>

  <!-- ЛІВА ПАНЕЛЬ: Фаза 1 -->
  <rect x="30" y="75" width="435" height="230" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="75" width="435" height="34" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Фаза 1 (Φ1): Пряме підключення входу</text>

  <!-- Входи Фази 1 -->
  <text x="45" y="155" font-size="12" font-weight="bold" fill="#1a1a1a">+Vin</text>
  <text x="45" y="215" font-size="12" font-weight="bold" fill="#1a1a1a">-Vin</text>
  <line x1="85" y1="150" x2="135" y2="150" stroke="#2457d6" stroke-width="2"/>
  <line x1="85" y1="210" x2="135" y2="210" stroke="#2457d6" stroke-width="2"/>

  <!-- Модулятор 1 -->
  <rect x="135" y="130" width="60" height="100" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="165" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">CHOP 1</text>
  <line x1="195" y1="150" x2="235" y2="150" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="195" y1="210" x2="235" y2="210" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Підсилювач з Vos -->
  <path d="M 245,125 L 315,180 L 245,235 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="265" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">+A</text>
  <circle cx="285" cy="155" r="3" fill="#c0392b"/>
  <text x="295" y="150" font-size="11" font-weight="bold" fill="#c0392b">+Vos</text>

  <line x1="315" y1="180" x2="355" y2="180" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>

  <!-- Демодулятор 1 -->
  <rect x="355" y="145" width="60" height="70" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="385" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">CHOP 2</text>

  <!-- Вихід 1 -->
  <line x1="415" y1="180" x2="445" y2="180" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <text x="247" y="280" text-anchor="middle" font-size="12" font-family="monospace" font-weight="bold" fill="#2457d6">V_out(Φ1) = +Vin + Vos</text>

  <!-- ПРАВА ПАНЕЛЬ: Фаза 2 -->
  <rect x="495" y="75" width="435" height="230" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="495" y="75" width="435" height="34" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Фаза 2 (Φ2): Інверсне перехресне підключення</text>

  <!-- Входи Фази 2 -->
  <text x="510" y="155" font-size="12" font-weight="bold" fill="#1a1a1a">+Vin</text>
  <text x="510" y="215" font-size="12" font-weight="bold" fill="#1a1a1a">-Vin</text>
  <line x1="550" y1="150" x2="600" y2="150" stroke="#2457d6" stroke-width="2"/>
  <line x1="550" y1="210" x2="600" y2="210" stroke="#2457d6" stroke-width="2"/>

  <!-- Модулятор 2 -->
  <rect x="600" y="130" width="60" height="100" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="630" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">CHOP 1</text>
  <!-- Перехрещені лінії -->
  <line x1="660" y1="150" x2="700" y2="210" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="660" y1="210" x2="700" y2="150" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Підсилювач з Vos 2 -->
  <path d="M 710,125 L 780,180 L 710,235 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="730" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">+A</text>
  <circle cx="750" cy="155" r="3" fill="#c0392b"/>
  <text x="760" y="150" font-size="11" font-weight="bold" fill="#c0392b">+Vos</text>

  <line x1="780" y1="180" x2="820" y2="180" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>

  <!-- Демодулятор 2 -->
  <rect x="820" y="145" width="60" height="70" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="850" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">CHOP 2</text>

  <!-- Вихід 2 -->
  <line x1="880" y1="180" x2="910" y2="180" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <text x="712" y="280" text-anchor="middle" font-size="12" font-family="monospace" font-weight="bold" fill="#2457d6">V_out(Φ2) = -(-Vin + Vos) = +Vin - Vos</text>

  <!-- НИЖНЯ ПАНЕЛЬ: Усереднення -->
  <rect x="30" y="325" width="900" height="115" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Результат цифрового усереднення фільтром децимації (Sinc-фільтр)</text>

  <rect x="180" y="365" width="600" height="42" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="392" text-anchor="middle" font-size="13" font-family="monospace" font-weight="bold" fill="#1a1a1a">V_res = [V_out(Φ1) + V_out(Φ2)] / 2 = [(Vin + Vos) + (Vin - Vos)] / 2 = Vin</text>

  <text x="480" y="426" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">✓ Дрейф зміщення нуля Vos та 1/f флікер-шум повністю взаємно знищуються</text>
</svg>
