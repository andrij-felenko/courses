<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Складові температурного дрейфу передавальної характеристики АЦП</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Температура зміщує нуль (Offset), змінює нахил (Gain) та локально деформує криву перетворення (INL)</text>

  <!-- ПАНЕЛЬ 1: Дрейф зміщення -->
  <rect x="30" y="75" width="280" height="360" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="75" width="280" height="34" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="170" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Дрейф зміщення нуля (Offset)</text>
  <text x="170" y="125" text-anchor="middle" font-size="12" fill="#6b7280">Паралельний зсув кривої</text>

  <!-- Осі 1 -->
  <line x1="65" y1="330" x2="285" y2="330" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <line x1="65" y1="330" x2="65" y2="145" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="270" y="348" text-anchor="end" font-size="11" fill="#6b7280">Вхід Vin</text>
  <text x="75" y="155" text-anchor="start" font-size="11" fill="#6b7280">Код</text>

  <!-- Лінії 1 -->
  <line x1="80" y1="315" x2="260" y2="175" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="80" y1="265" x2="260" y2="125" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="100" y1="300" x2="100" y2="252" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="110" y="190" font-size="12" font-weight="bold" fill="#c0392b">+ΔV_os</text>

  <!-- Підсумок 1 -->
  <rect x="45" y="370" width="250" height="50" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="170" y="390" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Постійна адитивна похибка</text>
  <text x="170" y="408" text-anchor="middle" font-size="11" fill="#1a1a1a">однакова для всіх напруг</text>

  <!-- ПАНЕЛЬ 2: Дрейф масштабу -->
  <rect x="340" y="75" width="280" height="360" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="340" y="75" width="280" height="34" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Дрейф масштабу (Gain)</text>
  <text x="480" y="125" text-anchor="middle" font-size="12" fill="#6b7280">Зміна крутизни нахилу</text>

  <!-- Осі 2 -->
  <line x1="375" y1="330" x2="595" y2="330" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <line x1="375" y1="330" x2="375" y2="145" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="580" y="348" text-anchor="end" font-size="11" fill="#6b7280">Вхід Vin</text>
  <text x="385" y="155" text-anchor="start" font-size="11" fill="#6b7280">Код</text>

  <!-- Лінії 2 -->
  <line x1="390" y1="315" x2="570" y2="175" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="390" y1="315" x2="570" y2="225" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>
  <line x1="560" y1="182" x2="560" y2="220" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="495" y="195" font-size="12" font-weight="bold" fill="#c0392b">ΔGain</text>

  <!-- Підсумок 2 -->
  <rect x="355" y="370" width="250" height="50" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="480" y="390" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Мультиплікативна похибка</text>
  <text x="480" y="408" text-anchor="middle" font-size="11" fill="#1a1a1a">максимум біля повної шкали</text>

  <!-- ПАНЕЛЬ 3: Дрейф нелінійності -->
  <rect x="650" y="75" width="280" height="360" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="650" y="75" width="280" height="34" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="790" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Дрейф нелінійності (INL)</text>
  <text x="790" y="125" text-anchor="middle" font-size="12" fill="#6b7280">Викривлення форми характеристики</text>

  <!-- Осі 3 -->
  <line x1="685" y1="330" x2="905" y2="330" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <line x1="685" y1="330" x2="685" y2="145" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="890" y="348" text-anchor="end" font-size="11" fill="#6b7280">Вхід Vin</text>
  <text x="695" y="155" text-anchor="start" font-size="11" fill="#6b7280">Код</text>

  <!-- Лінії 3 -->
  <line x1="700" y1="315" x2="880" y2="175" stroke="#2457d6" stroke-width="2.5"/>
  <path d="M 700,315 Q 745,295 790,245 T 880,175" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4" fill="none"/>
  <line x1="760" y1="268" x2="760" y2="245" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="770" y="215" font-size="12" font-weight="bold" fill="#c0392b">ΔINL</text>

  <!-- Підсумок 3 -->
  <rect x="665" y="370" width="250" height="50" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="790" y="390" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Нелінійне викривлення</text>
  <text x="790" y="408" text-anchor="middle" font-size="11" fill="#1a1a1a">не усувається простим множенням</text>
</svg>
