<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Температурна характеристика Bandgap VREF та метод коробки (Box Method)</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Параболічна залежність напруги обмежується прямокутником граничних відхилень для розрахунку ppm/°C</text>

  <!-- ЛІВА ЧАСТИНА: Графік -->
  <rect x="30" y="75" width="550" height="355" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="75" width="550" height="34" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="305" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Крива термокомпенсації зонного стабілізатора</text>

  <!-- Коробка Box Method -->
  <rect x="110" y="160" width="410" height="150" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="315" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Метод коробки (Box Method Bounding Rectangle)</text>

  <!-- Осі координат -->
  <line x1="80" y1="360" x2="550" y2="360" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <line x1="80" y1="360" x2="80" y2="125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="315" y="410" text-anchor="middle" font-size="11" fill="#6b7280">Температура T (°C)</text>
  <text x="90" y="135" text-anchor="start" font-size="11" fill="#6b7280">Напруга Vref (В)</text>

  <!-- Позначки осей -->
  <line x1="110" y1="355" x2="110" y2="365" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="110" y="380" text-anchor="middle" font-size="11" fill="#1a1a1a">-40 °C (Tmin)</text>

  <line x1="280" y1="355" x2="280" y2="365" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#1a1a1a">+25 °C (T0)</text>

  <line x1="520" y1="355" x2="520" y2="365" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="520" y="380" text-anchor="middle" font-size="11" fill="#1a1a1a">+125 °C (Tmax)</text>

  <line x1="75" y1="160" x2="85" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="70" y="164" text-anchor="end" font-size="11" fill="#1a1a1a">Vmax</text>

  <line x1="75" y1="310" x2="85" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="70" y="314" text-anchor="end" font-size="11" fill="#1a1a1a">Vmin</text>

  <!-- Параболічна крива Vref(T) -->
  <path d="M 110,310 Q 280,135 520,310" fill="none" stroke="#c0392b" stroke-width="3"/>
  <circle cx="280" cy="160" r="4" fill="#c0392b"/>
  <text x="280" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Точка нульового ТКН</text>

  <!-- Стрілки розмірів коробки -->
  <line x1="535" y1="165" x2="535" y2="305" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)" marker-start="url(#arr-blue)"/>
  <text x="545" y="240" font-size="11" font-weight="bold" fill="#2457d6">ΔVref</text>

  <line x1="115" y1="330" x2="515" y2="330" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)" marker-start="url(#arr-blue)"/>
  <text x="315" y="325" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">ΔT = Tmax - Tmin</text>

  <!-- ПРАВА ЧАСТИНА: Формула і фізика -->
  <!-- Блок формули -->
  <rect x="600" y="75" width="330" height="170" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="600" y="75" width="330" height="34" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="765" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Розрахунок температурного дрейфу</text>

  <rect x="615" y="120" width="300" height="50" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="765" y="142" text-anchor="middle" font-size="12" font-family="monospace" font-weight="bold" fill="#2457d6">TC = (ΔVref / (Vnom · ΔT)) · 10⁶</text>
  <text x="765" y="158" text-anchor="middle" font-size="11" fill="#6b7280">одиниця вимірювання: ppm/°C</text>

  <text x="615" y="190" font-size="11" fill="#1a1a1a">ΔVref — максимальний розмах (Vmax - Vmin)</text>
  <text x="615" y="210" font-size="11" fill="#1a1a1a">ΔT — робочий температурний діапазон</text>
  <text x="615" y="230" font-size="11" fill="#1a1a1a">Vnom — номінальна вихідна напруга VREF</text>

  <!-- Блок фізики -->
  <rect x="600" y="260" width="330" height="170" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="600" y="260" width="330" height="34" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="765" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Фізична природа нелінійності</text>

  <text x="615" y="312" font-size="11" fill="#1a1a1a">• Vbe(T) має негативний нахил: -2 мВ/°C (CTAT)</text>
  <text x="615" y="332" font-size="11" fill="#1a1a1a">• ΔVbe(T) має позитивний нахил: +k/q·ln(N) (PTAT)</text>
  <text x="615" y="352" font-size="11" fill="#1a1a1a">• Член T·ln(T) формує параболічну кривизну</text>

  <rect x="615" y="370" width="300" height="48" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="765" y="388" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Типові показники дрейфу:</text>
  <text x="765" y="406" text-anchor="middle" font-size="11" fill="#1a1a1a">Вбудовані: 20–50 ppm/°C · Зовнішні: 0.5–5 ppm/°C</text>
</svg>
