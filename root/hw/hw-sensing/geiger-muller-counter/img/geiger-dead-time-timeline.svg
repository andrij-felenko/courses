<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часова динаміка: Мертвий час (Dead Time) та час відновлення трубки</text>
<line x1="80.0" y1="220.0" x2="760.0" y2="220.0" stroke="#333333" stroke-width="1.5"/>
<line x1="80.0" y1="220.0" x2="80.0" y2="80.0" stroke="#333333" stroke-width="1.5"/>
<text x="765.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="start" font-weight="700">t</text>
<text x="70.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Чутливість трубки до нової іонізації</text>
<line x1="120.0" y1="240.0" x2="120.0" y2="90.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,2"/>
<circle cx="120.0" cy="110.0" r="8.0" fill="#fee2e2" stroke="#c0392b" stroke-width="1.8"/>
<text x="120.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">1-ша частинка (розряд)</text>
<rect x="120.0" y="120.0" width="180.0" height="100.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.0"/>
<text x="210.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">МЕРТВИЙ ЧАС  τ_dead</text>
<text x="198.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle">≈ 50 .. 150 мкс</text>
<text x="210.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="middle">Чутливість = 0% (іонний чохол блокує поле)</text>
<line x1="220.0" y1="250.0" x2="220.0" y2="130.0" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,2"/>
<circle cx="220.0" cy="150.0" r="6.0" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.4"/>
<text x="220.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4b5563" text-anchor="middle" font-weight="700">Частинка 2 (ПРОПУЩЕНА!)</text>
<rect x="300.0" y="120.0" width="200.0" height="100.0" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.0"/>
<path d="M 300,220 C 360,200 440,130 500,120" fill="none" stroke="#ca8a04" stroke-width="2.5"/>
<text x="400.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle" font-weight="700">ЧАС ВІДНОВЛЕННЯ  τ_rec</text>
<text x="400.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#854d0e" text-anchor="middle">≈ 100 .. 300 мкс</text>
<text x="400.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#854d0e" text-anchor="middle">Іони нейтралізуються на катоді</text>
<rect x="500.0" y="120.0" width="160.0" height="100.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.0"/>
<text x="580.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">ПОВНА ГОТОВНІСТЬ</text>
<text x="580.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">100% амплітуда</text>
<rect x="80.0" y="270.0" width="680.0" height="200.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="100.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Математична модель поправки на пропущені відліки:</text>
<text x="120.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="start" font-weight="700">Непаралізовна модель (Non-paralyzable):</text>
<text x="140.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">N_true = N_meas / [ 1 − N_meas · τ ]</text>
<text x="140.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">При τ = 100 мкс і N_meas = 1 000 с⁻¹:    N_true = 1000 / (1 − 0.1) = 1 111 с⁻¹ (+11.1% недообліку)</text>
<text x="140.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">При τ = 100 мкс і N_meas = 5 000 с⁻¹:    N_true = 5000 / (1 − 0.5) = 10 000 с⁻¹ (+100% недообліку)</text>
<text x="120.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="700">Паралізовна небезпека (Paralyzable saturation):</text>
<text x="140.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="start" font-weight="700">У надвисоких полях кожна нова частинка подовжує мертвий стан: лічильник показує 0 CPM у смертельній зоні!</text>
</svg>