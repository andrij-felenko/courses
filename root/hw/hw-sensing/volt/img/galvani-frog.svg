  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="400.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Гальвані, 1780-ті: чому смикається лапка мертвої жаби?</text>
<text x="400.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">контакт двох металів через тканину — і мертвий м'яз скорочується</text>
<rect x="470.0" y="90.0" width="26.0" height="300.0" rx="2" fill="#cfd3d6" stroke="#8a8f93" stroke-width="2"/>
<text x="483.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#6b7075" text-anchor="middle" font-weight="bold" font-style="normal">залізна огорожа</text>
<path d="M470,150 q-40,-6 -52,18" fill="none" stroke="#c9a23a" stroke-width="5"/>
<text x="360.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c9a23a" text-anchor="middle" font-weight="bold" font-style="normal">латунний гачок</text>
<path d="M418,168 L398,250 L452,322" fill="none" stroke="#caa98f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="452.0" cy="322.0" r="9.0" fill="#caa98f" stroke="#a98" stroke-width="2"/>
<text x="372.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">нерв + м'яз</text>
<line x1="452.0" y1="322.0" x2="470.0" y2="322.0" stroke="#caa98f" stroke-width="6" stroke-linecap="round"/>
<path d="M462,300 q12,8 6,22" fill="none" stroke="#c0271e" stroke-width="1.6"/>
<path d="M472,300 q12,8 6,22" fill="none" stroke="#c0271e" stroke-width="1.6"/>
<path d="M482,300 q12,8 6,22" fill="none" stroke="#c0271e" stroke-width="1.6"/>
<text x="540.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">смик!</text>
<text x="300.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">латунь → тканина → залізо</text>
<text x="300.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">= замкнена петля двох металів</text>
<rect x="70.0" y="360.0" width="660.0" height="56.0" rx="10" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="400.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Гальвані: електрика захована в самій тканині — «тваринна електрика».</text>
<text x="400.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тіло — наче крихітна лейденська банка, що зберігає життєву силу.</text>
</svg>
