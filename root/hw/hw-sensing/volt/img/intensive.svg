<svg xmlns="http://www.w3.org/2000/svg" width="820" height="410" viewBox="0 0 820 410">
<rect width="820" height="410" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="410.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Вольт не залежить від кількості заряду</text>
<text x="410.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">та сама напруга 1.5 В: більше заряду — більше енергії, але джоулів НА КУЛОН — порівну</text>
<rect x="50.0" y="92.0" width="300.0" height="230.0" rx="12" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="200.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">джерело 1.5 В</text>
<rect x="110.0" y="140.0" width="180.0" height="16.0" rx="3" fill="#fdeeee" stroke="#c0271e" stroke-width="1.6"/>
<text x="200.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1 Кл</text>
<line x1="200.0" y1="196.0" x2="200.0" y2="250.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="200.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">→ 1.5 Дж</text>
<text x="200.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">1.5 Дж ÷ 1 Кл = 1.5 В</text>
<rect x="470.0" y="92.0" width="300.0" height="230.0" rx="12" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="620.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">джерело 1.5 В</text>
<rect x="530.0" y="140.0" width="180.0" height="16.0" rx="3" fill="#fdeeee" stroke="#c0271e" stroke-width="1.6"/>
<text x="620.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">10 Кл</text>
<line x1="620.0" y1="196.0" x2="620.0" y2="250.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="620.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">→ 15 Дж</text>
<text x="620.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">15 Дж ÷ 10 Кл = 1.5 В</text>
<text x="410.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Енергія масштабується із зарядом — а відношення енергія/заряд (це й є напруга) лишається 1.5 В.</text>
<text x="410.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому напруга — «інтенсивна» величина: вона характеризує джерело, а не порцію заряду.</text>
</svg>
