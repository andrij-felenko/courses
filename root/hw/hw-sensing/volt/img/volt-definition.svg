<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400">
<rect width="820" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="410.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Головна думка: 1 вольт = 1 джоуль на кулон</text>
<text x="410.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вольт каже, скільки енергії несе КОЖЕН кулон заряду</text>
<rect x="90.0" y="130.0" width="150.0" height="18.0" rx="3" fill="#fdeeee" stroke="#c0271e" stroke-width="2"/>
<text x="165.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">V = 1 В</text>
<rect x="90.0" y="300.0" width="150.0" height="18.0" rx="3" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="165.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">V = 0</text>
<rect x="150.0" y="150.0" width="40.0" height="26.0" rx="4" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<text x="170.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1 Кл</text>
<line x1="170.0" y1="178.0" x2="170.0" y2="296.0" stroke="#1b1b1b" stroke-width="2.6" marker-end="url(#aInk)"/>
<text x="196.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">падає на 1 В</text>
<path d="M150,300 l 8,-10 l 4,8 l 8,-12 l 4,10 l 6,-8" fill="none" stroke="#c0271e" stroke-width="2"/>
<text x="170.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1 Дж</text>
<rect x="330.0" y="150.0" width="440.0" height="150.0" rx="12" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="550.0" y="205.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1 Кл  ×  1 В  =  1 Дж</text>
<text x="550.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1 В  ≡  1 Дж / Кл</text>
<text x="550.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(вольт — це енергія на одиницю заряду)</text>
</svg>
