<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420">
<rect width="780" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="390.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Лужна батарейка AA зсередини: цинк, MnO₂ і 1.5 В</text>
<text x="390.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">напругу задає пара цинк–діоксид мангану; розмір дає лише ємність і струм</text>
<rect x="168.0" y="150.0" width="420.0" height="150.0" rx="10" fill="#dfe3e7" stroke="#8a949e" stroke-width="2.4"/>
<rect x="178.0" y="160.0" width="400.0" height="28.0" rx="0" fill="#5b5048" stroke="none" stroke-width="0"/>
<rect x="178.0" y="262.0" width="400.0" height="28.0" rx="0" fill="#5b5048" stroke="none" stroke-width="0"/>
<line x1="180.0" y1="192.0" x2="576.0" y2="192.0" stroke="#cfc8bd" stroke-width="1.6" stroke-linecap="round"/>
<line x1="180.0" y1="258.0" x2="576.0" y2="258.0" stroke="#cfc8bd" stroke-width="1.6" stroke-linecap="round"/>
<rect x="180.0" y="194.0" width="396.0" height="62.0" rx="0" fill="#cdd6dc" stroke="none" stroke-width="0"/>
<line x1="158.0" y1="225.0" x2="518.0" y2="225.0" stroke="#b8860b" stroke-width="4" stroke-linecap="round"/>
<rect x="588.0" y="203.0" width="18.0" height="44.0" rx="3" fill="#cfd3d8" stroke="#8a949e" stroke-width="2"/>
<text x="597.0" y="197.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<rect x="146.0" y="150.0" width="22.0" height="150.0" rx="3" fill="#cfd3d8" stroke="#8a949e" stroke-width="2"/>
<text x="157.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">−</text>
<text x="378.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">катод: MnO₂ + вуглець  (+)</text>
<text x="378.0" y="229.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">анод: цинк-гель + KOH  (−)</text>
<text x="378.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">катод: MnO₂ + вуглець  (+)</text>
<text x="254.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a6508" text-anchor="middle" font-weight="bold" font-style="normal">колектор</text>
<text x="378.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">сталевий корпус = катодний контакт (+)</text>
<line x1="146.0" y1="261.0" x2="108.0" y2="261.0" stroke="#1f47b5" stroke-width="2.2" marker-end="url(#aBlue)"/>
<text x="104.0" y="265.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">e⁻</text>
<line x1="648.0" y1="261.0" x2="606.0" y2="261.0" stroke="#1f47b5" stroke-width="2.2" marker-end="url(#aBlue)"/>
<text x="652.0" y="265.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">e⁻</text>
<text x="390.0" y="317.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">e⁻ виходять з −, повертаються в + через навантаження; усередині заряд несуть іони OH⁻</text>
<rect x="70.0" y="364.0" width="640.0" height="44.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="390.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Zn → ZnO (віддає e⁻) на аноді;  2MnO₂ → Mn₂O₃ (бере e⁻) на катоді.</text>
<text x="390.0" y="403.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Різниця їхніх «хімічних висот» = ≈1.5 Дж на кожен кулон = 1.5 В (§1.1.5). Розмір тут ні до чого.</text>
</svg>
