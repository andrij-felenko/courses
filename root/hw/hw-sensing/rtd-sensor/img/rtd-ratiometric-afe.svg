<text x="300.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#92400e" text-anchor="middle">0.05%, 5 ppm/°C</text>
<line x1="350.0" y1="105.0" x2="410.0" y2="105.0" stroke="#2457d6" stroke-width="2.2"/>
<line x1="350.0" y1="105.0" x2="390.0" y2="105.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="410.0" y="85.0" width="100.0" height="40.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.4"/>
<text x="460.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Pt100 / Pt1000</text>
<text x="460.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">R_RTD (сенсор)</text>
<line x1="510.0" y1="105.0" x2="560.0" y2="105.0" stroke="#333333" stroke-width="2.2"/>
<line x1="560.0" y1="105.0" x2="560.0" y2="140.0" stroke="#333333" stroke-width="2.2"/>
<line x1="545.0" y1="140.0" x2="575.0" y2="140.0" stroke="#333333" stroke-width="2.2"/>
<line x1="550.0" y1="145.0" x2="570.0" y2="145.0" stroke="#333333" stroke-width="1.8"/>
<line x1="555.0" y1="150.0" x2="565.0" y2="150.0" stroke="#333333" stroke-width="1.4"/>
<text x="560.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#4b5563" text-anchor="middle" font-weight="700">GND</text>
<rect x="200.0" y="195.0" width="360.0" height="210.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.6"/>
<text x="380.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">24-бітний прецизійний ΣΔ АЦП (ADS1248 / MAX31865)</text>
<line x1="270.0" y1="125.0" x2="270.0" y2="250.0" stroke="#d97706" stroke-width="1.4" stroke-dasharray="3,3"/>
<line x1="330.0" y1="125.0" x2="330.0" y2="250.0" stroke="#d97706" stroke-width="1.4" stroke-dasharray="3,3"/>
<rect x="220.0" y="240.0" width="140.0" height="36.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="290.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle" font-weight="700">REFP − REFN (V_REF)</text>
<line x1="430.0" y1="125.0" x2="430.0" y2="250.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3,3"/>
<line x1="490.0" y1="125.0" x2="490.0" y2="250.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3,3"/>
<rect x="400.0" y="240.0" width="140.0" height="36.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="470.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">AINP − AINN (V_RTD)</text>
<rect x="220.0" y="300.0" width="320.0" height="80.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="360.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ядро ділення напруг АЦП:</text>
<text x="360.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Код = (V_RTD / V_REF) · 2²³ = (R_RTD / R_REF) · 2²³</text>
<text x="360.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4b5563" text-anchor="middle">Шум і температурний дрейф I_EXC повністю скорочуються!</text>
<rect x="590.0" y="70.0" width="220.0" height="340.0" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
<text x="700.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Математика раціометрії</text>
<text x="604.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Напруга на RTD:</text>
<text x="604.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">   V_RTD = I_EXC · R_RTD</text>
<text x="604.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"></text>
<text x="604.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Опорна напруга:</text>
<text x="604.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">   V_REF = I_EXC · R_REF</text>
<text x="604.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"></text>
<text x="604.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Відлік АЦП:</text>
<text x="604.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">   Code = V_RTD / V_REF</text>
<text x="604.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">   Code = R_RTD / R_REF</text>
<text x="604.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"></text>
<text x="604.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">Висновок:</text>
<text x="604.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="start">• Струм I_EXC скорочується</text>
<text x="604.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="start">• Дрейф джерела = 0 похибки</text>
<text x="604.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="start">• Точність залежить лише</text>
<text x="604.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  від стабільності R_REF</text>
</svg>