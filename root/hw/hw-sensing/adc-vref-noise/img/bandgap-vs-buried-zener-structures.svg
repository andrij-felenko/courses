<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Фізика шуму еталонів: поверхневий Bandgap проти підповерхневого Buried Zener</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Заглиблення робочого p-n переходу в об'єм кремнію ізолює струм від оксидних пасток і усуває флікер-шум 1/f</text>

  <!-- ================= ЛІВА ПАНЕЛЬ: Bandgap (Поверхневий) ================= -->
  <rect x="30" y="75" width="435" height="425" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="45" y="90" width="405" height="32" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="111" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Зонна структура (Bandgap BJT / CMOS)</text>

  <!-- Напівпровідниковий розріз Bandgap -->
  <!-- Оксид SiO2 -->
  <rect x="65" y="140" width="365" height="24" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <text x="247" y="156" text-anchor="middle" font-size="12" fill="#1a1a1a">Пасивуючий оксидний шар (SiO2)</text>

  <!-- Межа поділу з пастками (червоний пунктир) -->
  <line x1="65" y1="164" x2="430" y2="164" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="247" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Поверхневі рекомбінаційні пастки та дефекти ґратки</text>

  <!-- Кремнієва підкладка / емітер і база -->
  <rect x="65" y="190" width="365" height="110" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  
  <!-- Емітер N+ -->
  <rect x="90" y="190" width="90" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="135" y="217" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Емітер (N+)</text>

  <!-- База P -->
  <rect x="200" y="190" width="100" height="70" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="250" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">База (P)</text>

  <!-- Колектор N (Підкладка) -->
  <rect x="320" y="190" width="95" height="95" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="367" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Колектор (N)</text>

  <!-- Стрілка струму через поверхню -->
  <path d="M 135,235 C 135,275 230,270 245,260" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="247" y="322" text-anchor="middle" font-size="12" fill="#c0392b">Струм протікає впритул до оксиду</text>

  <!-- Характеристики Bandgap -->
  <rect x="45" y="340" width="405" height="145" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="364" font-size="13" font-weight="bold" fill="#1a1a1a">• Шум 0.1–10 Гц:</text>
  <text x="185" y="364" font-size="13" fill="#c0392b">10 – 50 мкВ (від піку до піку)</text>
  <text x="60" y="392" font-size="13" font-weight="bold" fill="#1a1a1a">• Кутова частота 1/f:</text>
  <text x="210" y="392" font-size="13" fill="#c0392b">100 Гц – 1 кГц (висока)</text>
  <text x="60" y="420" font-size="13" font-weight="bold" fill="#1a1a1a">• Довготривалий дрейф:</text>
  <text x="225" y="420" font-size="13" fill="#6b7280">20 – 50 ppm / 1000 год</text>
  <text x="60" y="448" font-size="13" font-weight="bold" fill="#1a1a1a">• Мінімальне живлення:</text>
  <text x="225" y="448" font-size="13" fill="#27ae60">1.2 – 2.7 В (мікропотужне)</text>
  <text x="60" y="474" font-size="13" font-weight="bold" fill="#1a1a1a">• Сфера застосування:</text>
  <text x="210" y="474" font-size="13" fill="#1a1a1a">АЦП до 16 розрядів, батарейні схеми</text>

  <!-- ================= ПРАВА ПАНЕЛЬ: Buried Zener (Підповерхневий) ================= -->
  <rect x="495" y="75" width="435" height="425" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="510" y="90" width="405" height="32" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="111" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Підповерхневий стабілітрон (Buried Zener)</text>

  <!-- Напівпровідниковий розріз Buried Zener -->
  <!-- Оксид SiO2 -->
  <rect x="530" y="140" width="365" height="24" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <text x="712" y="156" text-anchor="middle" font-size="12" fill="#1a1a1a">Пасивуючий оксидний шар (SiO2)</text>

  <!-- Захисний дифузійний шар P+ (ізолятор поверхні) -->
  <rect x="530" y="164" width="365" height="32" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Захисний поверхневий шар P+ (ізолює оксид)</text>

  <!-- Кремнієва підкладка -->
  <rect x="530" y="196" width="365" height="104" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>

  <!-- Заглиблена область пробою N+ / P+ -->
  <rect x="610" y="215" width="205" height="55" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="712" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Заглиблений p-n перехід (Buried Junction)</text>
  <text x="712" y="258" text-anchor="middle" font-size="12" fill="#27ae60">Локалізований лавинний пробій в об'ємі</text>

  <!-- Стрілка струму у глибині -->
  <path d="M 570,285 L 610,245" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="712" y="322" text-anchor="middle" font-size="12" fill="#27ae60">Струм тече в чистому об'ємі кремнію</text>

  <!-- Характеристики Buried Zener -->
  <rect x="510" y="340" width="405" height="145" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="364" font-size="13" font-weight="bold" fill="#1a1a1a">• Шум 0.1–10 Гц:</text>
  <text x="650" y="364" font-size="13" fill="#27ae60">0.5 – 2.0 мкВ (ультранизький)</text>
  <text x="525" y="392" font-size="13" font-weight="bold" fill="#1a1a1a">• Кутова частота 1/f:</text>
  <text x="675" y="392" font-size="13" fill="#27ae60">1 – 5 Гц (майже відсутній)</text>
  <text x="525" y="420" font-size="13" font-weight="bold" fill="#1a1a1a">• Довготривалий дрейф:</text>
  <text x="690" y="420" font-size="13" fill="#27ae60">0.5 – 2 ppm / 1000 год</text>
  <text x="525" y="448" font-size="13" font-weight="bold" fill="#1a1a1a">• Мінімальне живлення:</text>
  <text x="690" y="448" font-size="13" fill="#c0392b">7.0 – 12.0 В (потребує 1–5 мА)</text>
  <text x="525" y="474" font-size="13" font-weight="bold" fill="#1a1a1a">• Сфера застосування:</text>
  <text x="675" y="474" font-size="13" fill="#1a1a1a">Прецизійні АЦП 24–32 біти, еталони</text>
</svg>
