<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Мультиплікативна модуляція шуму опорної напруги (VREF)</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Шум еталона масштабує крок квантування: розкид вихідного коду пропорційний рівню сигналу</text>

  <!-- Ліва панель: Структурна схема та математична модель -->
  <rect x="24" y="66" width="440" height="374" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="90" font-size="14" font-weight="700" fill="#1a1a1a">Математична модель передачі шуму VREF</text>

  <!-- Блок VREF -->
  <rect x="40" y="112" width="130" height="54" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="105" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Джерело VREF</text>
  <text x="105" y="152" text-anchor="middle" font-size="12" fill="#1a1a1a">V_REF0 + v_n(t)</text>

  <!-- Блок Вхідного сигналу -->
  <rect x="40" y="196" width="130" height="54" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="105" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Вхідний сигнал</text>
  <text x="105" y="236" text-anchor="middle" font-size="12" fill="#1a1a1a">V_in (чистий)</text>

  <!-- Лінії до АЦП -->
  <line x1="170" y1="139" x2="230" y2="139" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="180" y="131" font-size="12" fill="#c0392b">VREF</text>

  <line x1="170" y1="223" x2="230" y2="223" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="184" y="215" font-size="12" fill="#2457d6">VIN</text>

  <!-- Блок АЦП -->
  <rect x="238" y="112" width="90" height="138" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <text x="283" y="174" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">АЦП</text>
  <text x="283" y="194" text-anchor="middle" font-size="12" fill="#6b7280">(N біт)</text>

  <!-- Вихід з АЦП -->
  <line x1="328" y1="181" x2="380" y2="181" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="390" y="185" font-size="12" font-weight="700" fill="#27ae60">D_out</text>

  <!-- Формульний блок -->
  <rect x="36" y="272" width="416" height="74" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="292" font-size="12" font-weight="700" fill="#1a1a1a">Рівняння вихідного коду АЦП:</text>
  <text x="48" y="312" font-size="12" fill="#1a1a1a">D_out = 2^N · V_in / (V_REF0 + v_n(t))</text>
  <text x="48" y="332" font-size="12" fill="#2457d6">D_out ≈ (2^N · V_in / V_REF0) · [1 - v_n(t) / V_REF0]</text>

  <!-- Висновок лівої панелі -->
  <rect x="36" y="356" width="416" height="72" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="48" y="374" font-size="12" font-weight="700" fill="#2457d6">Залежність дисперсії коду від амплітуди сигналу:</text>
  <text x="48" y="394" font-size="12" fill="#1a1a1a">σ_code = D_out · (σ_vref / V_REF0)  ~  V_in</text>
  <text x="48" y="412" font-size="12" fill="#6b7280">Шум VREF діє як мультиплікативний коефіцієнт передачі</text>

  <!-- Права панель: Часові діаграми розкиду коду -->
  <rect x="480" y="66" width="456" height="374" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="496" y="90" font-size="14" font-weight="700" fill="#1a1a1a">Розкид вихідного коду при різних рівнях V_in</text>

  <!-- Рівень 1: V_in = 0 В -->
  <rect x="496" y="104" width="424" height="96" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="508" y="122" font-size="12" font-weight="700" fill="#27ae60">1. V_in = 0 В (0% шкали) — Шум VREF не впливає</text>
  <line x1="510" y1="160" x2="800" y2="160" stroke="#6b7280" stroke-width="1"/>
  <path d="M510,160 L540,160 L570,160 L600,160 L630,160 L660,160 L690,160 L720,160 L750,160 L780,160" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="810" y="164" font-size="12" font-weight="700" fill="#27ae60">σ = 0 LSB</text>
  <text x="508" y="188" font-size="12" fill="#6b7280">Код фіксований: множення шуму на нуль дає чистий нуль</text>

  <!-- Рівень 2: V_in = 0.5 * V_FS -->
  <rect x="496" y="210" width="424" height="106" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="508" y="228" font-size="12" font-weight="700" fill="#2457d6">2. V_in = 0.5 · V_FS (50% шкали) — Помірний шум</text>
  <line x1="510" y1="264" x2="800" y2="264" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <path d="M510,264 L530,260 L550,267 L570,262 L590,269 L610,258 L630,266 L650,261 L670,268 L690,260 L710,267 L730,263 L750,268 L770,261 L790,264" fill="none" stroke="#2457d6" stroke-width="1.8"/>
  <text x="810" y="268" font-size="12" font-weight="700" fill="#2457d6">σ = 1.5 LSB</text>
  <text x="508" y="294" font-size="12" fill="#6b7280">Шум опорної напруги передається з коефіцієнтом 0.5</text>
  <text x="508" y="308" font-size="12" fill="#6b7280">Деградація SNR помірна (-6 дБ відносно максимуму)</text>

  <!-- Рівень 3: V_in = V_FS -->
  <rect x="496" y="324" width="424" height="106" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="508" y="342" font-size="12" font-weight="700" fill="#c0392b">3. V_in = V_FS (100% шкали) — Максимальний шум</text>
  <line x1="510" y1="378" x2="800" y2="378" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <path d="M510,378 L530,366 L550,388 L570,368 L590,392 L610,362 L630,386 L650,364 L670,390 L690,366 L710,388 L730,362 L750,392 L770,366 L790,378" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="810" y="382" font-size="12" font-weight="700" fill="#c0392b">σ = 3.0 LSB</text>
  <text x="508" y="408" font-size="12" fill="#6b7280">Шум VREF повністю проникає у вихідний код</text>
  <text x="508" y="422" font-size="12" fill="#6b7280">Найгірша точка системи: максимальна втрата ENOB</text>
</svg>
