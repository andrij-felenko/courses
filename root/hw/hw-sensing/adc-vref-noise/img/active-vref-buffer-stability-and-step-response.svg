<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Стійкість активного буфера VREF та перехідна характеристика</text>
  <text x="480" y="46" text-anchor="middle" font-size="13" fill="#6b7280">Схема In-Loop компенсації усуває дзвін і гарантує встановлення напруги до 0.5 LSB за час такту CDAC</text>

  <!-- Ліва панель: Принципова схема -->
  <rect x="24" y="62" width="440" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="84" font-size="14" font-weight="700" fill="#1a1a1a">Схема буфера з подвійним зворотним зв'язком</text>

  <!-- Вхід V_REF_IN -->
  <text x="36" y="224" font-size="12" font-weight="700" fill="#1a1a1a">V_IN</text>
  <line x1="70" y1="220" x2="110" y2="220" stroke="#1a1a1a" stroke-width="2"/>

  <!-- ОП: вершини (110, 160), (110, 250), (170, 205) -->
  <polygon points="110,160 110,250 170,205" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="116" y="186" font-size="14" font-weight="700" fill="#2457d6">-</text>
  <text x="116" y="226" font-size="14" font-weight="700" fill="#2457d6">+</text>
  <text x="130" y="208" font-size="12" font-weight="700" fill="#2457d6">ОП</text>

  <!-- Вихід ОП до вузла A -->
  <line x1="170" y1="205" x2="210" y2="205" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="210" cy="205" r="3" fill="#1a1a1a"/>

  <!-- Резистор R_iso -->
  <rect x="220" y="197" width="36" height="16" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="210" y1="205" x2="220" y2="205" stroke="#1a1a1a" stroke-width="2"/>
  <text x="238" y="191" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">R_iso</text>

  <!-- Вузол B (Вихід) -->
  <line x1="256" y1="205" x2="300" y2="205" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="300" cy="205" r="3" fill="#1a1a1a"/>
  <line x1="300" y1="205" x2="360" y2="205" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="370" y="209" font-size="12" font-weight="700" fill="#27ae60">VREF</text>

  <!-- Конденсатор C_L -->
  <line x1="300" y1="205" x2="300" y2="245" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="288" y1="245" x2="312" y2="245" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="288" y1="251" x2="312" y2="251" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="300" y1="251" x2="300" y2="265" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="292" y1="265" x2="308" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="320" y="252" font-size="12" font-weight="700" fill="#1a1a1a">C_L (47 мкФ)</text>

  <!-- Петля DC: R_f -->
  <line x1="300" y1="205" x2="300" y2="110" stroke="#27ae60" stroke-width="2"/>
  <line x1="300" y1="110" x2="220" y2="110" stroke="#27ae60" stroke-width="2"/>
  <rect x="175" y="102" width="45" height="16" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="197" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">R_f (10 кОм)</text>
  <line x1="175" y1="110" x2="90" y2="110" stroke="#27ae60" stroke-width="2"/>
  <line x1="90" y1="110" x2="90" y2="182" stroke="#27ae60" stroke-width="2"/>
  <line x1="90" y1="182" x2="110" y2="182" stroke="#27ae60" stroke-width="2"/>

  <!-- Петля AC: C_f -->
  <line x1="210" y1="205" x2="210" y2="145" stroke="#2457d6" stroke-width="2"/>
  <line x1="210" y1="145" x2="175" y2="145" stroke="#2457d6" stroke-width="2"/>
  <line x1="175" y1="138" x2="175" y2="152" stroke="#2457d6" stroke-width="2"/>
  <line x1="170" y1="138" x2="170" y2="152" stroke="#2457d6" stroke-width="2"/>
  <text x="172" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">C_f (1 мкФ)</text>
  <line x1="170" y1="145" x2="100" y2="145" stroke="#2457d6" stroke-width="2"/>
  <line x1="100" y1="145" x2="100" y2="182" stroke="#2457d6" stroke-width="2"/>
  <circle cx="100" cy="182" r="2.5" fill="#2457d6"/>

  <!-- Інфокарти внизу лівої панелі -->
  <rect x="36" y="295" width="416" height="64" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="48" y="315" font-size="12" font-weight="700" fill="#2457d6">Умова стійкості петлі зворотного зв'язку:</text>
  <text x="48" y="333" font-size="12" fill="#1a1a1a">C_f ≥ C_L · (R_iso / R_f)  →  C_f ≥ 47 мкФ · (2.2 / 10000)</text>
  <text x="48" y="349" font-size="12" fill="#6b7280">Гарантує фазовий запас PM &gt; 60° при роботі на 47 мкФ</text>

  <rect x="36" y="367" width="416" height="64" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="387" font-size="12" font-weight="700" fill="#1a1a1a">Роль ізолюючого резистора R_iso:</text>
  <text x="48" y="405" font-size="12" fill="#1a1a1a">Відокремлює велику ємність C_L від виходу ОП,</text>
  <text x="48" y="421" font-size="12" fill="#1a1a1a">формуючи нуль відновлення фази f_zero = 1/(2π·R_iso·C_L)</text>

  <!-- Права панель: Часова діаграма відновлення напруги -->
  <rect x="480" y="62" width="456" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="496" y="84" font-size="14" font-weight="700" fill="#1a1a1a">Перехідний процес під час такту перемикання CDAC</text>

  <!-- Верхній підграфік: Струм комутації i_dyn(t) -->
  <line x1="510" y1="160" x2="900" y2="160" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="510" y1="160" x2="510" y2="105" stroke="#6b7280" stroke-width="1.5"/>
  <text x="506" y="100" font-size="12" font-weight="700" fill="#1a1a1a">i_dyn (мА)</text>
  <text x="860" y="174" font-size="12" fill="#6b7280">Час t</text>

  <!-- Імпульс струму -->
  <path d="M510,160 L540,160 L545,115 L555,115 L560,160 L900,160" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="570" y="125" font-size="12" font-weight="700" fill="#1a1a1a">Пік струму 20 мА</text>
  <text x="570" y="141" font-size="12" fill="#6b7280">(перемикання CDAC)</text>

  <!-- Нижній підграфік: Напруга VREF(t) -->
  <line x1="510" y1="260" x2="900" y2="260" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="510" y1="280" x2="510" y2="190" stroke="#6b7280" stroke-width="1.5"/>
  <text x="506" y="195" font-size="12" font-weight="700" fill="#1a1a1a">ΔV_ref</text>
  <text x="860" y="274" font-size="12" fill="#6b7280">Час t</text>

  <!-- Коридор точності ±0.5 LSB -->
  <rect x="510" y="254" width="390" height="12" fill="#e9f7ef" stroke="#27ae60" stroke-dasharray="2 2" stroke-width="1"/>
  <text x="820" y="250" font-size="12" font-weight="700" fill="#27ae60">±0.5 LSB</text>

  <!-- Крива без компенсації (Дзвін / незгасаючі коливання) -->
  <path d="M510,260 L540,260 L545,285 L565,220 L585,280 L605,235 L625,275 L645,245 L665,268 L685,255 L705,263 L725,260" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="3 2"/>
  <text x="680" y="225" font-size="12" font-weight="700" fill="#c0392b">Без C_f: тривалий дзвін</text>

  <!-- Крива з In-Loop компенсацією (Швидке плавне відновлення) -->
  <path d="M510,260 L540,260 L548,272 L565,262 L580,260 L900,260" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="590" y="278" font-size="12" font-weight="700" fill="#2457d6">З In-Loop: встановлення &lt; 50 нс</text>

  <!-- Інфокарти внизу правої панелі -->
  <rect x="496" y="295" width="424" height="64" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="508" y="315" font-size="12" font-weight="700" fill="#c0392b">Наслідки роботи без компенсації:</text>
  <text x="508" y="333" font-size="12" fill="#1a1a1a">Коливання виходять за межі 0.5 LSB на момент фіксації біта,</text>
  <text x="508" y="349" font-size="12" fill="#1a1a1a">що спричиняє спотворення коду та появу помилкових бітів</text>

  <rect x="496" y="367" width="424" height="64" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="508" y="387" font-size="12" font-weight="700" fill="#27ae60">Результат застосування In-Loop компенсації:</text>
  <text x="508" y="405" font-size="12" fill="#1a1a1a">Повна відсутність автоколивань, аперіодичне відновлення</text>
  <text x="508" y="421" font-size="12" fill="#1a1a1a">та збереження 100% точності 24-розрядного перетворення</text>
</svg>
