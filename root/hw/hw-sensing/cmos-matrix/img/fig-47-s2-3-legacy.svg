<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420"
     viewBox="0 0 960 420" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="420" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Спадок CCD: від плівки до цифри — і до Нобеля</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">CCD витіснив плівку й десятиліттями правив у камерах і телескопах; Нобель з фізики 2009</text>
<line x1="90" y1="205" x2="875" y2="205" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="150" y1="187" x2="150" y2="199" stroke="#6b7280" stroke-width="1" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="150" cy="205" r="7" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="150" y="165" font-size="11" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">1969</text>
<text x="150" y="181" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Бойл і Сміт</text>
<text x="150" y="231" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">накидали CCD за годину</text>
<line x1="360" y1="187" x2="360" y2="199" stroke="#6b7280" stroke-width="1" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="360" cy="205" r="7" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="360" y="165" font-size="11" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">1970–90-ті</text>
<text x="360" y="181" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">революція</text>
<text x="360" y="231" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">цифрове фото без плівки</text>
<line x1="570" y1="187" x2="570" y2="199" stroke="#6b7280" stroke-width="1" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="570" cy="205" r="7" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="570" y="165" font-size="11" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">телескопи</text>
<text x="570" y="181" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">«Габбл» і Ко</text>
<text x="570" y="231" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">очі науки на десятиліття</text>
<line x1="780" y1="187" x2="780" y2="199" stroke="#6b7280" stroke-width="1" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="780" cy="205" r="7" fill="#d98a00" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="780" y="165" font-size="11" fill="#b06b00" text-anchor="middle" font-weight="bold" font-style="normal">2009</text>
<text x="780" y="181" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">НОБЕЛЬ</text>
<text x="780" y="231" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">з фізики, за CCD</text>
<rect x="225" y="300" width="510" height="62" rx="10" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.4"/>
<text x="480" y="324" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">А потім прийшов дешевий швидкий CMOS (Фоссум) — і забрав масовий ринок.</text>
<text x="480" y="345" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">CCD лишився там, де над усе якість: великі телескопи, наукові камери.</text>
</svg>
