<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура матричної компенсації перехресного оптичного засвічення</text>
<rect x="40.0" y="65.0" width="160.0" height="48.0" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.5"/>
<text x="120.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Raw UVA</text>
<text x="120.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Канал UV-A + паразитне ІЧ</text>
<line x1="200.0" y1="89.0" x2="235.0" y2="89.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="127.0" width="160.0" height="48.0" rx="6" fill="#fdf7f0" stroke="#e67e22" stroke-width="1.5"/>
<text x="120.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e67e22" text-anchor="middle" font-weight="700">Raw UVB</text>
<text x="120.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Канал UV-B + паразитне ІЧ</text>
<line x1="200.0" y1="151.0" x2="235.0" y2="151.0" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="189.0" width="160.0" height="48.0" rx="6" fill="#f2f9f4" stroke="#27ae60" stroke-width="1.5"/>
<text x="120.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Raw VIS</text>
<text x="120.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Канал видимого світла</text>
<line x1="200.0" y1="213.0" x2="235.0" y2="213.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="251.0" width="160.0" height="48.0" rx="6" fill="#fbf5fc" stroke="#8e44ad" stroke-width="1.5"/>
<text x="120.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="middle" font-weight="700">Raw IR</text>
<text x="120.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Канал ближнього ІЧ</text>
<line x1="200.0" y1="275.0" x2="235.0" y2="275.0" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="240.0" y="65.0" width="320.0" height="234.0" rx="8" fill="#f8fafc" stroke="#2457d6" stroke-width="1.8"/>
<text x="400.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Матричний процесор компенсації (DSP)</text>
<line x1="260.0" y1="103.0" x2="540.0" y2="103.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="260.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Віднімання паразитних засвіток:</text>
<rect x="250.8" y="151.8" width="298.4" height="22.5" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="400.0" y="166.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">UVA_comp = Raw_UVA − a·VIS − b·IR − Offset_A</tspan></text>
<rect x="250.8" y="201.8" width="298.4" height="22.5" rx="6" fill="#ffffff" stroke="#e67e22" stroke-width="1.5"/><text x="400.0" y="216.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">UVB_comp = Raw_UVB − c·VIS − d·IR − Offset_B</tspan></text>
<text x="400.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">де a, b, c, d — калібрувальні коефіцієнти матриці</text>
<line x1="560.0" y1="163.0" x2="600.0" y2="163.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="560.0" y1="213.0" x2="600.0" y2="213.0" stroke="#e67e22" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="605.0" y="95.0" width="200.0" height="175.0" rx="8" fill="#fdfaf3" stroke="#d4ac0d" stroke-width="1.8"/>
<text x="705.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b7950b" text-anchor="middle" font-weight="700">Обчислення UVI</text>
<line x1="620.0" y1="129.0" x2="790.0" y2="129.0" stroke="#d4ac0d" stroke-width="1.0"/>
<text x="705.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">UVI = kA·UVA + kB·UVB</tspan><tspan x="705.0" dy="13.8"></tspan><tspan x="705.0" dy="13.8">Масштабування:</tspan><tspan x="705.0" dy="13.8">1 UVI = 25 мВт/м²</tspan><tspan x="705.0" dy="13.8">еритемної опроміненості</tspan></text>
<rect x="625.0" y="223.0" width="160.0" height="32.0" rx="4" fill="#e74c3c" stroke="#ffffff" stroke-width="1.0"/>
<text x="705.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">UVI: 0 .. 11+ (WHO)</text>
<text x="410.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Паразитний відгук на сонячне видиме та ІЧ випромінювання компенсується лінійною матрицею коефіцієнтів у реальному часі</text>
</svg>