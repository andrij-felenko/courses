<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спектральні діапазони ультрафіолету та проникнення крізь атмосферу</text>
<rect x="25.0" y="52.0" width="182.0" height="296.0" rx="8" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.8"/>
<text x="116.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">UV-C</text>
<text x="116.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">100–280 нм</text>
<text x="116.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Енергія: 4.43–12.4 еВ</text>
<line x1="35.0" y1="120.0" x2="197.0" y2="120.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="116.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Атмосферний бар'єр:</text>
<text x="116.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="116.0" dy="0.0">Повністю поглинається</tspan><tspan x="116.0" dy="13.1">киснем O₂ та озоном O₃</tspan><tspan x="116.0" dy="13.1">у стратосфері.</tspan></text>
<line x1="40.0" y1="224.0" x2="192.0" y2="224.0" stroke="#c0392b" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="116.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">На рівні землі:</text>
<text x="116.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="116.0" dy="0.0">0% доходить до поверхні</tspan><tspan x="116.0" dy="13.1">(джерела: бактерицидні лампи)</tspan></text>
<rect x="221.0" y="52.0" width="182.0" height="296.0" rx="8" fill="#fdf7f0" stroke="#e67e22" stroke-width="1.8"/>
<text x="312.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e67e22" text-anchor="middle" font-weight="700">UV-B</text>
<text x="312.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">280–315 нм</text>
<text x="312.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Енергія: 3.94–4.43 еВ</text>
<line x1="231.0" y1="120.0" x2="393.0" y2="120.0" stroke="#e67e22" stroke-width="1.0"/>
<text x="312.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Атмосферний бар'єр:</text>
<text x="312.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="312.0" dy="0.0">На 90–95% поглинається</tspan><tspan x="312.0" dy="13.1">озоновим шаром (смуги Хаггінса).</tspan><tspan x="312.0" dy="13.1">Висока фотохімічна енергія.</tspan></text>
<line x1="236.0" y1="224.0" x2="388.0" y2="224.0" stroke="#e67e22" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="312.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">На рівні землі:</text>
<text x="312.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="312.0" dy="0.0">5–10% на поверхні Землі</tspan><tspan x="312.0" dy="13.1">Головна причина опіків і ДНК-мутацій</tspan></text>
<rect x="417.0" y="52.0" width="182.0" height="296.0" rx="8" fill="#f0f6fc" stroke="#2980b9" stroke-width="1.8"/>
<text x="508.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2980b9" text-anchor="middle" font-weight="700">UV-A</text>
<text x="508.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">315–400 нм</text>
<text x="508.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Енергія: 3.10–3.94 еВ</text>
<line x1="427.0" y1="120.0" x2="589.0" y2="120.0" stroke="#2980b9" stroke-width="1.0"/>
<text x="508.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Атмосферний бар'єр:</text>
<text x="508.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="508.0" dy="0.0">Майже не поглинається</tspan><tspan x="508.0" dy="13.1">озоном і вільно доходить</tspan><tspan x="508.0" dy="13.1">до рівня моря.</tspan></text>
<line x1="432.0" y1="224.0" x2="584.0" y2="224.0" stroke="#2980b9" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="508.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">На рівні землі:</text>
<text x="508.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="508.0" dy="0.0">&gt;90–95% усього сонячного УФ</tspan><tspan x="508.0" dy="13.1">Спричиняє старіння шкіри та засмагу</tspan></text>
<rect x="613.0" y="52.0" width="182.0" height="296.0" rx="8" fill="#f2f9f4" stroke="#27ae60" stroke-width="1.8"/>
<text x="704.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Видиме світло</text>
<text x="704.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">400–700 нм</text>
<text x="704.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Енергія: 1.77–3.10 еВ</text>
<line x1="623.0" y1="120.0" x2="785.0" y2="120.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="704.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Атмосферний бар'єр:</text>
<text x="704.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="704.0" dy="0.0">Повна прозорість атмосфери.</tspan><tspan x="704.0" dy="13.1">Сприймається оком людини</tspan><tspan x="704.0" dy="13.1">як кольори веселки.</tspan></text>
<line x1="628.0" y1="224.0" x2="780.0" y2="224.0" stroke="#27ae60" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="704.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">На рівні землі:</text>
<text x="704.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="704.0" dy="0.0">Оптичний потік у 100–1000 разів</tspan><tspan x="704.0" dy="13.1">перевищує потік УФ-B</tspan></text>
<text x="410.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Озоновий шар відтинає весь UV-C і левову частку UV-B; проте саме залишкові фотони UV-B несуть найбільшу біологічну загрозу</text>
</svg>