<svg xmlns="http://www.w3.org/2000/svg" width="900" height="336" viewBox="0 0 900 336">
<rect width="900" height="336" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="450.0" y="27.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Похибка через обчислення: R = V / I</text>
<text x="450.0" y="47.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">коли результат рахують із двох вимірів, відносні похибки додаються</text>
<rect x="70.0" y="90.0" width="200.0" height="70.0" rx="9" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.7"/>
<text x="170.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">V = 5.00 В</text>
<text x="170.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">± 1 %</text>
<text x="305.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">÷</text>
<rect x="340.0" y="90.0" width="200.0" height="70.0" rx="9" fill="#fdeeee" stroke="#c0271e" stroke-width="1.7"/>
<text x="440.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">I = 2.00 мА</text>
<text x="440.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">± 1.5 %</text>
<line x1="545.0" y1="125.0" x2="612.0" y2="125.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="578.0" y="113.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">=</text>
<rect x="620.0" y="86.0" width="210.0" height="78.0" rx="9" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.9"/>
<text x="725.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">R = 2.50 кОм</text>
<text x="725.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">± 2.5 %  (±0.06 кОм)</text>
<rect x="80.0" y="196.0" width="740.0" height="54.0" rx="8" fill="#f3f6fb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="450.0" y="217.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ΔR/R ≈ ΔV/V + ΔI/I = 1% + 1.5% = 2.5%  (для множення й ділення складають ВІДНОСНІ похибки)</text>
<text x="450.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">А для додавання й віднімання — складають АБСОЛЮТНІ (бо відсотки там не «множаться»).</text>
<rect x="80.0" y="264.0" width="740.0" height="44.0" rx="8" fill="#fff5ea" stroke="#e08030" stroke-width="1.4"/>
<text x="450.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Висновок: похибка результату ЗАВЖДИ більша за похибку кожного виміру — не забувайте її переносити.</text>
</svg>
