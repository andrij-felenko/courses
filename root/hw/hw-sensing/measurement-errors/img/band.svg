<text x="360.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.2" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">нахил = a%</text>
<text x="680.0" y="78.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Відносна похибка Δ/X</text>
<line x1="520.0" y1="332.0" x2="520.0" y2="92.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
