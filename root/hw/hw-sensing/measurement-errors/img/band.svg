<text x="450.0" y="27.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві частини похибки: відсоток показу + «одиниці» (counts)</text>
<text x="450.0" y="47.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Δ = a%·X + b·LSD: відсоток росте з показом, «одиниці» — стала підлога</text>
<text x="255.0" y="78.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Абсолютна похибка Δ</text>
<line x1="95.0" y1="332.0" x2="95.0" y2="92.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="89.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">Δ</text>
<line x1="95.0" y1="332.0" x2="440.0" y2="332.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="440.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="end" font-weight="normal" font-style="normal">показ X →</text>
<polygon points="95.0,332.0 95.0,288.0 430.0,150.0 430.0,332.0" fill="#eef3fb" stroke="none" stroke-width="0"/>
