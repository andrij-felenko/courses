<text x="856.0" y="293.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.2" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">a% (межа на великому показі)</text>
<polyline points="545.0,110.0 560.0,140.0 582.0,175.0 612.0,208.0 655.0,238.0 715.0,268.0 785.0,288.0 858.0,300.0" fill="none" stroke="#c0271e" stroke-width="2.8"/>
<text x="690.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">малий показ →</text>
<text x="690.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">велика відносна похибка!</text>
<rect x="120.0" y="360.0" width="660.0" height="32.0" rx="7" fill="#f3f6fb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="450.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Правило: показ має ЗАПОВНЮВАТИ діапазон — тоді частка «одиниць» мала, а відносна похибка — близька до a%.</text>
