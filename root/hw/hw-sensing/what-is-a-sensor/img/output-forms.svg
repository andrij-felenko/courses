<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 710 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="710" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Форми вихідного сигналу давача — і чим читати кожну</text>
<rect x="28.0" y="64.0" width="644.0" height="46.0" rx="6" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1.0"/>
<text x="46.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">напруга</text>
<text x="326.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">просто на АЦП; боїться завад і падіння на дротах</text>
<rect x="28.0" y="118.0" width="644.0" height="46.0" rx="6" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1.0"/>
<text x="46.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">струм 4–20 мА</text>
<text x="326.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">однаковий уздовж кола → стійкий на відстані</text>
<rect x="28.0" y="172.0" width="644.0" height="46.0" rx="6" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1.0"/>
<text x="46.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">зміна R / C</text>
<text x="326.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">потребує дільника чи моста, далі АЦП</text>
<rect x="28.0" y="226.0" width="644.0" height="46.0" rx="6" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1.0"/>
<text x="46.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">частота / період</text>
<text x="326.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">рахує таймер — точно, без аналогу</text>
<rect x="28.0" y="280.0" width="644.0" height="46.0" rx="6" fill="#fbfbfb" stroke="#e4e4e4" stroke-width="1.0"/>
<text x="46.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">цифрове число</text>
<text x="326.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">давач уже містить АЦП; читаємо готове</text>
<line x1="210.0" y1="97.0" x2="300.0" y2="77.0" stroke="#27ae60" stroke-width="2.2"/>
<rect x="210.0" y="132.0" width="90.0" height="22.0" rx="4" fill="none" stroke="#c0392b" stroke-width="1.6"/>
<line x1="218.0" y1="143.0" x2="288.0" y2="143.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<polyline points="210,196 217.5,188 232.5,204 247.5,188 262.5,204 277.5,188 292.5,204 300,196" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="210,262 210,240 225,240 225,262 240,262 240,240 255,240 255,262 270,262 270,240 285,240 285,262 300,262" fill="none" stroke="#2457d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="255.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6a4ea8" text-anchor="middle" font-weight="700">0 1 0 1 1 0</text>
