<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 895 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="895" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цифровий тракт обчислення True RMS у реальному часі на мікроконтролері</text>
<rect x="25.0" y="90.0" width="115.0" height="95.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.5"/><text x="82.5" y="119.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="82.5" dy="0.0">АЦП (ADC)</tspan><tspan x="82.5" dy="14.3">Відліки x[n]</tspan><tspan x="82.5" dy="14.3">f_s ≥ 10 кГц</tspan><tspan x="82.5" dy="14.3">12..16 біт</tspan></text>
<line x1="140.0" y1="137.0" x2="175.0" y2="137.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="175.0" y="80.0" width="165.0" height="115.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="257.5" y="113.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="257.5" dy="0.0">DC-Blocker (IIR)</tspan><tspan x="257.5" dy="13.7">y[n] = x[n] - x[n-1]</tspan><tspan x="257.5" dy="13.7">       + α·y[n-1]</tspan><tspan x="257.5" dy="13.7">Усунення V_ref/2</tspan><tspan x="257.5" dy="13.7">та зміщення нуля</tspan></text>
<line x1="340.0" y1="137.0" x2="375.0" y2="137.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="357.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">y[n]</text>
<rect x="375.0" y="80.0" width="145.0" height="115.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="447.5" y="113.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="447.5" dy="0.0">Квадратор (MAC)</tspan><tspan x="447.5" dy="13.7">Accum += y[n]²</tspan><tspan x="447.5" dy="13.7">Фіксована: 64-біт</tspan><tspan x="447.5" dy="13.7">Рухома: FPU</tspan><tspan x="447.5" dy="13.7">Q15/Q31 множення</tspan></text>
<line x1="520.0" y1="137.0" x2="555.0" y2="137.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="537.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">∑ y²</text>
<rect x="555.0" y="80.0" width="155.0" height="115.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="632.5" y="113.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="632.5" dy="0.0">Zero-Crossing &amp;</tspan><tspan x="632.5" dy="13.7">Синхронізація</tspan><tspan x="632.5" dy="13.7">Підрахунок N</tspan><tspan x="632.5" dy="13.7">точно за M періодів</tspan><tspan x="632.5" dy="13.7">(без витоку спектра)</tspan></text>
<line x1="710.0" y1="137.0" x2="745.0" y2="137.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="745.0" y="80.0" width="110.0" height="115.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="800.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">Корінь</tspan><tspan x="800.0" dy="12.3">(Root)</tspan><tspan x="800.0" dy="12.3">Mean = ∑y² / N</tspan><tspan x="800.0" dy="12.3">RMS = √Mean</tspan><tspan x="800.0" dy="12.3">Q-sqrt / Newton</tspan></text>
<line x1="855.0" y1="137.0" x2="875.0" y2="137.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="25.0" y="225.0" width="400.0" height="195.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="40.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">1. Усунення постійної складової (DC Offset):</text>
<text x="40.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Катастрофічне скасування у двопрохідній формулі:</text>
<text x="40.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">  Var = E[x²] - (E[x])²  ⇒ при малій AC і великій DC</text>
<text x="40.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">  віднімання двох близьких великих чисел нищить молодші біти!</text>
<text x="40.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• Однопрохідний рекурсивний IIR фільтр (DC-Blocker):</text>
<text x="40.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  y[n] = x[n] - x[n-1] + α · y[n-1],  де α = 1 - 2π(f_c/f_s)</text>
<text x="40.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  При f_s = 10 кГц, f_c = 2 Гц: α ≈ 0.9987 (або Q15: 32725)</text>
<text x="40.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start">  Зрізає дрейф нуля, не вимагаючи збереження всього масиву в RAM.</text>
<rect x="455.0" y="225.0" width="400.0" height="195.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="470.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">2. Синхронізація вибірки (Zero-Crossing):</text>
<text x="470.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Несинхронне прямокутне вікно (наприклад, рівно 1000 семплів):</text>
<text x="470.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">  Якщо вікно містить 5.3 періоду сигналу, неповний залишок (0.3 T)</text>
<text x="470.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">  дає пульсації показу RMS (Spectral Leakage / биття) до 5..10%.</text>
<text x="470.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• Когерентне інтегрування за M повних періодів:</text>
<text x="470.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  Компаратор або програмний гістерезисний Zero-Cross детектор</text>
<text x="470.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  замикає накопичення суми квадратів строго при переході через нуль.</text>
<text x="470.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start">  Результат: похибка усереднення падає практично до рівня шуму АЦП.</text>
</svg>