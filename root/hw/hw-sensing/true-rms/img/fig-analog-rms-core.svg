<svg xmlns="http://www.w3.org/2000/svg" viewBox="-35.34 -10 950.14 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-35.34" y="-10" width="950.14" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний True RMS конвертер: ядро непрямого обчислення (Implicit Core)</text>
<text x="40.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Вхідний
сигнал
V_in(t)</text>
<line x1="65.0" y1="150.0" x2="115.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="115.0" y="115.0" width="130.0" height="70.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Прецизійний</tspan><tspan x="180.0" dy="14.3">випрямляч</tspan><tspan x="180.0" dy="14.3">|V_in|</tspan></text>
<line x1="245.0" y1="150.0" x2="295.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="270.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">|V_in|</text>
<rect x="295.0" y="105.0" width="175.0" height="90.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="382.5" y="139.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="382.5" dy="0.0">Логарифмічне ядро</tspan><tspan x="382.5" dy="15.0">(Log-Antilog Cell)</tspan><tspan x="382.5" dy="15.0">I_c = V_in² / V_out</tspan></text>
<line x1="470.0" y1="150.0" x2="520.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="495.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">I_c(t)</text>
<rect x="520.0" y="115.0" width="140.0" height="70.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Фільтр середнього</tspan><tspan x="590.0" dy="14.3">(Low-Pass Filter)</tspan><tspan x="590.0" dy="14.3">I_avg = Avg(I_c)</tspan></text>
<line x1="590.0" y1="185.0" x2="590.0" y2="230.0" stroke="#333333" stroke-width="1.8"/>
<line x1="575.0" y1="230.0" x2="605.0" y2="230.0" stroke="#27ae60" stroke-width="2.2"/>
<line x1="575.0" y1="236.0" x2="605.0" y2="236.0" stroke="#27ae60" stroke-width="2.2"/>
<line x1="590.0" y1="236.0" x2="590.0" y2="260.0" stroke="#333333" stroke-width="1.8"/>
<line x1="580.0" y1="260.0" x2="600.0" y2="260.0" stroke="#333333" stroke-width="2.0"/>
<line x1="584.0" y1="264.0" x2="596.0" y2="264.0" stroke="#333333" stroke-width="1.6"/>
<line x1="588.0" y1="268.0" x2="592.0" y2="268.0" stroke="#333333" stroke-width="1.2"/>
<text x="640.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">C_AV (Averaging
Capacitor)</text>
<line x1="660.0" y1="150.0" x2="710.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="710.0" y="115.0" width="110.0" height="70.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="765.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="765.0" dy="0.0">Вихідний</tspan><tspan x="765.0" dy="14.3">буфер</tspan><tspan x="765.0" dy="14.3">V_out</tspan></text>
<line x1="820.0" y1="150.0" x2="845.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="835.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">V_out</text>
<line x1="765.0" y1="185.0" x2="765.0" y2="305.0" stroke="#7c3aed" stroke-width="1.8"/>
<line x1="765.0" y1="305.0" x2="382.0" y2="305.0" stroke="#7c3aed" stroke-width="1.8"/>
<line x1="382.0" y1="305.0" x2="382.0" y2="195.0" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="570.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6d28d9" text-anchor="middle" font-weight="700">Петля зворотного зв'язку ділення на V_out:  V_out = Avg( V_in² / V_out )  ⇒  V_out² = Avg(V_in²)  ⇒  V_out = √( Avg(V_in²) )</text>
<rect x="40.0" y="345.0" width="780.0" height="45.0" rx="4" fill="#f8fafc" stroke="#333333" stroke-width="1.0"/>
<text x="430.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Чому непрямий метод (Implicit): пряме обчислення V_in² звужує динамічний діапазон (1 мВ² = 1 мкВ — тоне в шумах).</text>
<text x="430.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Непряме ділення в лог-ядрі тримає внутрішні напруги в масштабі першого степеня, забезпечуючи динамічний діапазон &gt; 60 дБ.</text>
</svg>