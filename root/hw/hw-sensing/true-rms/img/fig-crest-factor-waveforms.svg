<text x="45.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="start" font-weight="700">Метрологічна межа апаратних RMS-перетворювачів (AD736, AD8436, LTC1966):</text>
<text x="45.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Динамічний діапазон піків: піковий вхід не може перевищувати шини живлення (V_pk ≤ V_supply - 1.5V). При CF = 5 шкала вимірювання RMS падає у 5 разів!</text>
<text x="45.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Смуга пропускання ядра: високий CF означає потужні гармоніки (f_h &gt;&gt; f_0). Смуга пропускання AD736 спадає з 200 кГц (CF=1) до &lt;10 кГц (CF=5).</text>
<text x="45.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="start" font-weight="700">3. Додаткова похибка нелінійності: паспорт гарантує похибку 0.3% при CF=1..2, але додає +1.5% при CF=3 та +3..5% при CF=5.</text>
