<text x="440.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чверть-, напів- і повний міст: чутливість і лінійність</text>
<text x="440.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">більше активних плечей — більший сигнал; протилежні пари ще й роблять вихід точно лінійним</text>
<rect x="60.0" y="108.0" width="760.0" height="72.0" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1.4"/>
<text x="80.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Чверть-міст</text>
<text x="80.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">1 активне плече</text>
<text x="296.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">V_вих = (V/4)·(ΔR/R)</text>
<text x="296.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">нелінійність ~(ΔR/R)/2</text>
<rect x="600.0" y="132.0" width="48.0" height="24.0" rx="4" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="658.0" y="149.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">×1</text>
<rect x="60.0" y="194.0" width="760.0" height="72.0" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1.4"/>
<text x="80.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#e08030" text-anchor="start" font-weight="bold" font-style="normal">Напівміст</text>
<text x="80.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">2 плеча (протилежні)</text>
<text x="296.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">V_вих = (V/2)·(ΔR/R)</text>
<text x="296.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">×2; нелінійність гаситься</text>
<rect x="600.0" y="218.0" width="96.0" height="24.0" rx="4" fill="#e08030" stroke="#e08030" stroke-width="0"/>
<text x="706.0" y="235.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="start" font-weight="bold" font-style="normal">×2</text>
<rect x="60.0" y="280.0" width="760.0" height="72.0" rx="8" fill="#fafafa" stroke="#cccccc" stroke-width="1.4"/>
<text x="80.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Повний міст</text>
<text x="80.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">4 активні плеча</text>
<text x="296.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">V_вих = V·(ΔR/R)</text>
<text x="296.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">×4; ТОЧНО лінійний</text>
