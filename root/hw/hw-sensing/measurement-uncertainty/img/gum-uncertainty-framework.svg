<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура оцінювання сумарної невизначеності (GUM Framework)</text>
<rect x="40.0" y="60.0" width="380.0" height="150.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="60.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="start" font-weight="700">Оцінювання за Типом A (Статистичне)</text>
<text x="60.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Базується на серії N незалежних повторних спостережень</text>
<text x="60.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Вибіркове середнє: x̄ = (1/N) Σ x_k</text>
<text x="60.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Вибіркова дисперсія (Бессель): s² = Σ(x_k − x̄)² / (N − 1)</text>
<text x="60.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="start" font-weight="700">➜ Стандартна невизначеність: u_A = s / √N</text>
<rect x="480.0" y="60.0" width="380.0" height="150.0" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
<text x="500.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#854d0e" text-anchor="start" font-weight="700">Оцінювання за Типом B (Апріорне)</text>
<text x="500.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Паспорти, сертифікати калібрування, крок АЦП, термодрейф</text>
<text x="500.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Рівномірний (прямокутний) [−a, +a]: u_B = a / √3</text>
<text x="500.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Трикутний розподіл [−a, +a]: u_B = a / √6</text>
<text x="500.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Нормальний паспортний (довідковий k): u_B = U_spec / k</text>
<line x1="230.0" y1="210.0" x2="410.0" y2="250.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="670.0" y1="210.0" x2="490.0" y2="250.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="180.0" y="250.0" width="540.0" height="100.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="450.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">Сумарна стандартна невизначеність (Combined Uncertainty)</text>
<text x="450.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Модель вимірювання: Y = f(X₁, X₂, ..., X_m),  c_i = ∂f/∂x_i (чутливість)</text>
<text x="450.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">u_c(y) = √ [ Σ (c_i · u(x_i))² + 2 Σ c_i c_j cov(x_i, x_j) ]</text>
<line x1="450.0" y1="350.0" x2="450.0" y2="385.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="180.0" y="385.0" width="540.0" height="75.0" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
<text x="450.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9d174d" text-anchor="middle" font-weight="700">Розширена невизначеність (Expanded Uncertainty): U = k · u_c(y)</text>
<text x="450.0" y="431.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">k = 2.00 для довірчої ймовірності P ≈ 95.45% (або t-коефіцієнт Стьюдента за Велчем-Саттерзвейтом)</text>
<text x="450.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Метрологічний запис результату:  Y = ȳ ± U  (з вказанням k та P)</text>
</svg>