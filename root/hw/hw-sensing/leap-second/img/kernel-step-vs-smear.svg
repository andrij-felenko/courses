<text x="420.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обробка високосної секунди: POSIX Step Jump проти Leap Smear</text>
<line x1="420.0" y1="50.0" x2="420.0" y2="460.0" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="6,4"/>
<rect x="25.0" y="52.0" width="375.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="212.5" y="68.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="212.5" dy="0.0">1. POSIX Step Jump (Повтор секунди)</tspan><tspan x="212.5" dy="15.6">Стандартна поведінка ядра Linux / Unix</tspan></text>
<line x1="40.0" y1="150.0" x2="385.0" y2="150.0" stroke="#333333" stroke-width="1.5"/>
<line x1="360.0" y1="150.0" x2="390.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="70.0" y1="142.0" x2="70.0" y2="158.0" stroke="#333333" stroke-width="2.0"/>
<text x="70.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">23:59:58</text>
