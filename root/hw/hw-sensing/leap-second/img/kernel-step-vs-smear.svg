<text x="145.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">23:59:59</text>
<line x1="225.0" y1="142.0" x2="225.0" y2="158.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="225.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">23:59:59</text>
