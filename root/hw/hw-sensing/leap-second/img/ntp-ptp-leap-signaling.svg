<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сигналізація та поширення прапорців високосної секунди в мережі</text>
<rect x="40.0" y="55.0" width="760.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="74.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">1. Міжнародна служба IERS (Bulletin C) та супутники GNSS (GPS/Galileo)</tspan><tspan x="420.0" dy="15.0">Публікують повідомлення про подію за 6 місяців (IERS) або за тижні через навігаційні кадри (GNSS Δt_LS)</tspan></text>
<line x1="420.0" y1="101.0" x2="420.0" y2="125.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="125.0" width="760.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="147.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">2. Первинні сервери синхронізації (NTP Stratum 1 / PTP Grandmaster Clock)</tspan><tspan x="420.0" dy="15.0">Встановлюють прапорці сповіщення у заголовках мережевих пакетів за 24 години до настання події</tspan></text>
<line x1="420.0" y1="177.0" x2="420.0" y2="205.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="205.0" width="365.0" height="115.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="222.5" y="238.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="222.5" dy="0.0">NTPv4 (RFC 5905) — поле Leap Indicator:</tspan><tspan x="222.5" dy="13.7">• LI = 00 (0b00): нормальна робота (без стрибка)</tspan><tspan x="222.5" dy="13.7">• LI = 01 (0b01): остання хвилина доби має 61 с (+1)</tspan><tspan x="222.5" dy="13.7">• LI = 10 (0b10): остання хвилина доби має 59 с (−1)</tspan><tspan x="222.5" dy="13.7">• LI = 11 (0b11): розсинхрон / стан тривоги</tspan></text>
<rect x="435.0" y="205.0" width="365.0" height="115.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="617.5" y="238.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="617.5" dy="0.0">PTP (IEEE 1588) — прапорці повідомлень Announce:</tspan><tspan x="617.5" dy="13.7">• leap61: прапорець додавання +1 с наприкінці доби</tspan><tspan x="617.5" dy="13.7">• leap59: прапорець видалення 1 с наприкінці доби</tspan><tspan x="617.5" dy="13.7">• currentUtcOffsetValid: чинність зсуву TAI−UTC</tspan><tspan x="617.5" dy="13.7">• currentUtcOffset: поточний зсув (37 с)</tspan></text>
<line x1="222.5" y1="320.0" x2="222.5" y2="345.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="617.5" y1="320.0" x2="617.5" y2="345.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="345.0" width="760.0" height="110.0" rx="6" fill="#fef5e7" stroke="#d35400" stroke-width="1.5"/><text x="420.0" y="383.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">4. Клієнтська операційна система (Ядро Linux та демон chrony / ntpd / ptp4l)</tspan><tspan x="420.0" dy="13.7">• Системний виклик adjtimex(&amp;tx) встановлює статус STA_INS у struct timex</tspan><tspan x="420.0" dy="13.7">• Автомат станів ядра: TIME_OK → TIME_INS (очікування) → TIME_OOP (секунда 23:59:60) → TIME_WAIT → TIME_OK</tspan><tspan x="420.0" dy="13.7">• У режимі Leap Smear прапорець LI скидається в 00, а ядро плавно підлаштовує частоту без переходу в TIME_OOP</tspan></text>
</svg>