<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Торцеве позиціювання магніту та мостова схема вимірювання кута</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Діаметральний магніт на валу створює вектор поля B, а два мости формують квадратурні сигнали sin/cos</text>

  <!-- Ліва панель: Торцеве кріплення магніту -->
  <rect x="30" y="75" width="420" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="240" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Торцевий монтаж (End-of-Shaft)</text>

  <!-- Вал -->
  <rect x="190" y="125" width="100" height="70" rx="4" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="240" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Вал приводу</text>

  <!-- Діаметральний магніт -->
  <rect x="195" y="195" width="45" height="35" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="217" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">N</text>

  <rect x="240" y="195" width="45" height="35" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="262" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">S</text>

  <!-- Повітряний зазор -->
  <line x1="160" y1="230" x2="160" y2="260" stroke="#6b7280" stroke-dasharray="2,2"/>
  <line x1="150" y1="230" x2="170" y2="230" stroke="#6b7280"/>
  <line x1="150" y1="260" x2="170" y2="260" stroke="#6b7280"/>
  <text x="140" y="249" text-anchor="end" font-size="12" fill="#6b7280">Зазор 0.5–1.5 мм</text>

  <!-- Мікросхема сенсора -->
  <rect x="160" y="260" width="160" height="45" rx="4" fill="#1a1a1a"/>
  <rect x="175" y="265" width="130" height="35" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="240" y="287" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">AMR / Hall Сенсорна матриця</text>

  <!-- Друкована плата (PCB) -->
  <rect x="100" y="305" width="280" height="15" rx="2" fill="#27ae60" stroke="#1a1a1a"/>
  <text x="240" y="340" text-anchor="middle" font-size="12" fill="#1a1a1a">Друкована плата керування (PCB)</text>

  <!-- Векторне поле -->
  <rect x="50" y="365" width="380" height="75" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="65" y="388" font-size="12" font-weight="bold" fill="#1a1a1a">Вектор планарного магнітного поля B:</text>
  <text x="65" y="408" font-size="12" fill="#1a1a1a">B_x = B₀ · cos(θ)    [горизонтальна складова]</text>
  <text x="65" y="426" font-size="12" fill="#1a1a1a">B_y = B₀ · sin(θ)    [вертикальна складова]</text>

  <!-- Права панель: Мостова схема та векторне обчислення -->
  <rect x="470" y="75" width="460" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="700" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Мостова топологія та блок арктангенса</text>

  <!-- Міст 1 (Косинусний міст) -->
  <rect x="495" y="125" width="180" height="105" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="585" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Міст 1 (0° / Cos)</text>
  <text x="585" y="172" text-anchor="middle" font-size="12" fill="#1a1a1a">4 резистори AMR</text>
  <text x="585" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">V_cos = V₀ · cos(2θ)</text>

  <!-- Міст 2 (Синусний міст, розвернутий на 45°) -->
  <rect x="495" y="245" width="180" height="105" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="585" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Міст 2 (45° / Sin)</text>
  <text x="585" y="292" text-anchor="middle" font-size="12" fill="#1a1a1a">Зсув на 45° (ел. 90°)</text>
  <text x="585" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">V_sin = V₀ · sin(2θ)</text>

  <!-- Стрілки від мостів до DSP блоку -->
  <line x1="675" y1="175" x2="735" y2="215" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="675" y1="295" x2="735" y2="255" stroke="#27ae60" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Блок обчислення кута DSP / CORDIC -->
  <rect x="745" y="185" width="165" height="105" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="827" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">DSP / CORDIC</text>
  <text x="827" y="235" text-anchor="middle" font-size="12" fill="#2457d6">atan2(V_sin, V_cos)</text>
  <text x="827" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">θ = ½ · atan2</text>

  <!-- Пояснення знизу правої панелі -->
  <rect x="495" y="365" width="415" height="75" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="510" y="388" font-size="12" font-weight="bold" fill="#1a1a1a">Переваги магнітного торцевого зчитування:</text>
  <text x="510" y="408" font-size="12" fill="#1a1a1a">1. Повна ізоляція від пилу, бруду, води та мастильних рідин.</text>
  <text x="510" y="426" font-size="12" fill="#1a1a1a">2. Диференціальний міст усуває температурний дрейф опору.</text>
</svg>
