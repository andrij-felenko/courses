<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="white"/>
  
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Гармонійний розклад сигнальних спотворень квадратури</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Зсув нуля генерує похибку першої гармоніки (1θ), а амплітудно-фазовий розбаланс — подвійну гармоніку (2θ)</text>

  <!-- Left Panel: Offset 1theta -->
  <rect x="30" y="65" width="435" height="410" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="88" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">1. Постійне зміщення нуля (Offset → 1θ)</text>

  <!-- Lissajous Shift (Left top) -->
  <rect x="45" y="105" width="405" height="155" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <!-- Axes -->
  <line x1="70" y1="180" x2="230" y2="180" stroke="#6b7280" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="235" y="184" font-size="12" fill="#6b7280">V_c</text>
  <line x1="145" y1="245" x2="145" y2="115" stroke="#6b7280" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="145" y="112" font-size="12" fill="#6b7280" text-anchor="middle">V_s</text>

  <!-- Ideal circle (centered 145,180, r=48) -->
  <circle cx="145" cy="180" r="48" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Shifted circle (centered 160, 168, offset +15, -12) -->
  <circle cx="160" cy="168" r="48" fill="none" stroke="#c0392b" stroke-width="2"/>
  <!-- Offset vector -->
  <line x1="145" y1="180" x2="158" y2="170" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="168" y="162" font-size="12" font-weight="bold" fill="#c0392b">(x₀, y₀)</text>

  <!-- Right text in left top box -->
  <text x="265" y="135" font-size="12" font-weight="bold" fill="#1a1a1a">Модель сигналів:</text>
  <text x="265" y="155" font-size="12" fill="#1a1a1a">V_c = cos(θ) + x₀</text>
  <text x="265" y="175" font-size="12" fill="#1a1a1a">V_s = sin(θ) + y₀</text>
  <text x="265" y="205" font-size="12" font-weight="bold" fill="#c0392b">Амплітуда 1θ:</text>
  <text x="265" y="225" font-size="12" fill="#c0392b">Δθ_max = √(x₀² + y₀²)</text>

  <!-- Waveform 1theta (Left bottom) -->
  <rect x="45" y="270" width="405" height="190" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="290" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кутова похибка Δθ(θ): рівно 1 період на 360°</text>

  <!-- Graph axes -->
  <line x1="65" y1="365" x2="420" y2="365" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="425" y="369" font-size="12" fill="#6b7280">θ</text>
  <line x1="75" y1="425" x2="75" y2="305" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="60" y="315" font-size="12" fill="#6b7280">Δθ</text>

  <!-- Ticks and angle labels (x=90, 165, 240, 315, 390) -->
  <line x1="90" y1="361" x2="90" y2="369" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="165" y1="361" x2="165" y2="369" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="240" y1="361" x2="240" y2="369" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="315" y1="361" x2="315" y2="369" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="390" y1="361" x2="390" y2="369" stroke="#6b7280" stroke-width="1.5"/>

  <text x="90" y="385" font-size="12" fill="#6b7280" text-anchor="middle">0°</text>
  <text x="165" y="385" font-size="12" fill="#6b7280" text-anchor="middle">90°</text>
  <text x="240" y="385" font-size="12" fill="#6b7280" text-anchor="middle">180°</text>
  <text x="315" y="385" font-size="12" fill="#6b7280" text-anchor="middle">270°</text>
  <text x="390" y="385" font-size="12" fill="#6b7280" text-anchor="middle">360°</text>

  <!-- 1theta Sine wave (90,365 -> 165,325 -> 240,365 -> 315,405 -> 390,365) -->
  <path d="M 90 365 C 125 325, 130 325, 165 325 C 200 325, 205 365, 240 365 C 275 365, 280 405, 315 405 C 350 405, 355 365, 390 365" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Formula below graph -->
  <text x="247" y="445" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="middle">Δθ_1θ = y₀ · cos(θ) − x₀ · sin(θ)</text>

  <!-- Right Panel: Imbalance & Non-orthogonality 2theta -->
  <rect x="485" y="65" width="445" height="410" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="707" y="88" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Дисбаланс амплітуд та фази (Gain / Phase → 2θ)</text>

  <!-- Lissajous Ellipse (Right top) -->
  <rect x="500" y="105" width="415" height="155" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <!-- Axes -->
  <line x1="525" y1="180" x2="685" y2="180" stroke="#6b7280" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="690" y="184" font-size="12" fill="#6b7280">V_c</text>
  <line x1="600" y1="245" x2="600" y2="115" stroke="#6b7280" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="600" y="112" font-size="12" fill="#6b7280" text-anchor="middle">V_s</text>

  <!-- Ideal circle -->
  <circle cx="600" cy="180" r="48" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Deformed ellipse -->
  <ellipse cx="600" cy="180" rx="54" ry="40" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Right text in right top box -->
  <text x="715" y="135" font-size="12" font-weight="bold" fill="#1a1a1a">Модель сигналів:</text>
  <text x="715" y="155" font-size="12" fill="#1a1a1a">V_c = cos(θ + δφ)</text>
  <text x="715" y="175" font-size="12" fill="#1a1a1a">V_s = (1 + δk) · sin(θ)</text>
  <text x="715" y="205" font-size="12" font-weight="bold" fill="#2457d6">Амплітуда 2θ:</text>
  <text x="715" y="225" font-size="12" fill="#2457d6">Δθ_max = ½ · √(δk² + δφ²)</text>

  <!-- Waveform 2theta (Right bottom) -->
  <rect x="500" y="270" width="415" height="190" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="707" y="290" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кутова похибка Δθ(θ): рівно 2 періоди на 360°</text>

  <!-- Graph axes -->
  <line x1="520" y1="365" x2="875" y2="365" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="880" y="369" font-size="12" fill="#6b7280">θ</text>
  <line x1="530" y1="425" x2="530" y2="305" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="515" y="315" font-size="12" fill="#6b7280">Δθ</text>

  <!-- Ticks and angle labels (x=545, 625, 705, 785, 865) -->
  <line x1="545" y1="361" x2="545" y2="369" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="625" y1="361" x2="625" y2="369" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="705" y1="361" x2="705" y2="369" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="785" y1="361" x2="785" y2="369" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="865" y1="361" x2="865" y2="369" stroke="#6b7280" stroke-width="1.5"/>

  <text x="545" y="385" font-size="12" fill="#6b7280" text-anchor="middle">0°</text>
  <text x="625" y="385" font-size="12" fill="#6b7280" text-anchor="middle">90°</text>
  <text x="705" y="385" font-size="12" fill="#6b7280" text-anchor="middle">180°</text>
  <text x="785" y="385" font-size="12" fill="#6b7280" text-anchor="middle">270°</text>
  <text x="865" y="385" font-size="12" fill="#6b7280" text-anchor="middle">360°</text>

  <!-- 2theta Sine wave (545,365 -> 585,335 -> 625,365 -> 665,395 -> 705,365 -> 745,335 -> 785,365 -> 825,395 -> 865,365) -->
  <path d="M 545 365 C 565 335, 565 335, 585 335 C 605 335, 605 365, 625 365 C 645 365, 645 395, 665 395 C 685 395, 685 365, 705 365 C 725 365, 725 335, 745 335 C 765 335, 765 365, 785 365 C 805 365, 805 395, 825 395 C 845 395, 845 365, 865 365" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Formula below graph -->
  <text x="707" y="445" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="middle">Δθ_2θ = ½ · δk · sin(2θ) − ½ · δφ · cos(2θ)</text>
</svg>
