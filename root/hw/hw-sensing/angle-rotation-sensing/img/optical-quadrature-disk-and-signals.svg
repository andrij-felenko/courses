<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Оптичний растровий диск та формування квадратурних сигналів A, B, Z</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Зсув фаз 90° між каналами A і B визначає напрямок обертання, а мітка Z фіксує абсолютний нуль</text>

  <!-- Ліва панель: Будова растрового диска -->
  <rect x="30" y="75" width="420" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="240" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Конструкція растрового диска</text>

  <!-- Диск зміщено трохи вниз -->
  <circle cx="240" cy="255" r="115" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <circle cx="240" cy="255" r="88" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="240" cy="255" r="60" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="240" cy="255" r="28" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="240" cy="255" r="7" fill="#1a1a1a"/>
  <line x1="328.0" y1="255.0" x2="355.0" y2="255.0" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="316.2" y1="277.8" x2="339.6" y2="284.8" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="302.2" y1="299.0" x2="321.3" y2="312.5" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="277.8" y1="316.2" x2="284.8" y2="339.6" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="255.0" y1="328.0" x2="255.0" y2="355.0" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="225.0" y1="328.0" x2="225.0" y2="355.0" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="202.2" y1="316.2" x2="195.2" y2="339.6" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="177.8" y1="299.0" x2="158.7" y2="312.5" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="163.8" y1="277.8" x2="140.4" y2="284.8" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="152.0" y1="255.0" x2="125.0" y2="255.0" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="163.8" y1="232.2" x2="140.4" y2="225.2" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="177.8" y1="211.0" x2="158.7" y2="197.5" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="202.2" y1="193.8" x2="195.2" y2="170.4" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="225.0" y1="182.0" x2="225.0" y2="155.0" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="255.0" y1="182.0" x2="255.0" y2="155.0" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="277.8" y1="193.8" x2="284.8" y2="170.4" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="302.2" y1="211.0" x2="321.3" y2="197.5" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="316.2" y1="232.2" x2="339.6" y2="225.2" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Індексний сектор Z -->
  <rect x="236" y="168" width="8" height="26" fill="#c0392b" rx="2"/>

  <!-- Зчитувальна головка (винесена вище над диском) -->
  <rect x="180" y="112" width="120" height="26" rx="4" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="240" y="129" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Оптопара A/B/Z</text>

  <!-- Підписи доріжок ліворуч -->
  <rect x="50" y="390" width="380" height="50" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="65" y="410" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">Доріжка A/B:</tspan> N регулярних штрихів по колу</text>
  <text x="65" y="428" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">Доріжка Z (Index):</tspan> 1 мітка на 360° для хоумінгу</text>

  <!-- Права панель: Часова діаграма квадратурних сигналів -->
  <rect x="470" y="75" width="460" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="700" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Квадратурні імпульси та декодування 4x</text>

  <!-- Сітка часових станів -->
  <line x1="560" y1="135" x2="560" y2="345" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="620" y1="135" x2="620" y2="345" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="680" y1="135" x2="680" y2="345" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="740" y1="135" x2="740" y2="345" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="800" y1="135" x2="800" y2="345" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="860" y1="135" x2="860" y2="345" stroke="#d0d7de" stroke-dasharray="3,3"/>

  <!-- Сигнал A -->
  <text x="490" y="165" font-size="13" font-weight="bold" fill="#2457d6">Канал A</text>
  <polyline points="530,175 560,175 560,145 680,145 680,175 800,175 800,145 910,145" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Сигнал B (зсув 90° / на 60px) -->
  <text x="490" y="235" font-size="13" font-weight="bold" fill="#27ae60">Канал B</text>
  <polyline points="530,245 620,245 620,215 740,215 740,245 860,245 860,215 910,215" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Сигнал Z (Індекс) -->
  <text x="490" y="305" font-size="13" font-weight="bold" fill="#c0392b">Канал Z</text>
  <polyline points="530,315 680,315 680,285 740,285 740,315 910,315" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Позначення періоду T та фазового зсуву 90° -->
  <line x1="560" y1="126" x2="620" y2="126" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="590" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">90° (T/4)</text>

  <line x1="560" y1="192" x2="800" y2="192" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="680" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Період T (360° / N)</text>

  <!-- Інформаційна плашка знизу правої панелі -->
  <rect x="490" y="355" width="420" height="85" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="505" y="375" font-size="12" font-weight="bold" fill="#1a1a1a">4 стани на період T (учетверіння роздільності 4x):</text>
  <text x="505" y="395" font-size="12" fill="#1a1a1a">Послідовність CW (за стрілкою): <tspan font-weight="bold" fill="#2457d6">00 → 10 → 11 → 01 → 00</tspan> (+1)</text>
  <text x="505" y="413" font-size="12" fill="#1a1a1a">Послідовність CCW (проти стрілки): <tspan font-weight="bold" fill="#c0392b">00 → 01 → 11 → 10 → 00</tspan> (−1)</text>
  <text x="505" y="431" font-size="12" fill="#6b7280">Заборонений перехід: 00 ⇄ 11 або 01 ⇄ 10 (помилка шуму)</text>
</svg>
