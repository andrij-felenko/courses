<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Порівняння абсолютних енкодерів: Двійковий код проти коду Грея</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Код Грея змінює рівно 1 біт між сусідніми секторами, усуваючи катастрофічні помилки гонки розрядів</text>

  <!-- Ліва панель: Двійковий код (Проблема) -->
  <rect x="30" y="75" width="435" height="380" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="247" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">Двійковий код (Гонка розрядів)</text>

  <!-- Схема переходу 011 -> 100 -->
  <rect x="50" y="120" width="395" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="70" y="145" font-size="13" font-weight="bold" fill="#1a1a1a">Перехід між секторами 3 (011₂) та 4 (100₂):</text>

  <rect x="70" y="160" width="80" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="110" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Сектор 3 (011)</text>

  <line x1="160" y1="175" x2="220" y2="175" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <rect x="230" y="160" width="80" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="270" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Сектор 4 (100)</text>

  <!-- Небезпечний проміжний стан -->
  <rect x="70" y="205" width="355" height="50" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="85" y="225" font-size="12" font-weight="bold" fill="#c0392b">Одночасна зміна 3 бітів (011 → 100):</text>
  <text x="85" y="243" font-size="12" fill="#1a1a1a">При перекосі фотодіодів зчитується <tspan font-weight="bold" fill="#c0392b">111 (7)</tspan> або <tspan font-weight="bold" fill="#c0392b">000 (0)</tspan>!</text>

  <!-- Таблиця секторів двійкового коду -->
  <rect x="50" y="285" width="395" height="155" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="70" y="308" font-size="12" font-weight="bold" fill="#1a1a1a">Послідовність 3-бітного двійкового коду:</text>
  <text x="70" y="330" font-size="12" fill="#1a1a1a">0: <tspan font-family="monospace">000</tspan>  |  1: <tspan font-family="monospace">001</tspan>  |  2: <tspan font-family="monospace">010</tspan>  |  3: <tspan font-family="monospace">011</tspan></text>
  <text x="70" y="350" font-size="12" fill="#1a1a1a">4: <tspan font-family="monospace">100</tspan>  |  5: <tspan font-family="monospace">101</tspan>  |  6: <tspan font-family="monospace">110</tspan>  |  7: <tspan font-family="monospace">111</tspan></text>
  <text x="70" y="380" font-size="12" fill="#c0392b"><tspan font-weight="bold">Недолік:</tspan> Дистанція Геммінга сягає N біт (d = 3).</text>
  <text x="70" y="400" font-size="12" fill="#6b7280">Викликає критичні викиди координат у сервоприводі.</text>

  <!-- Права панель: Код Грея (Розв'язок) -->
  <rect x="495" y="75" width="435" height="380" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#27ae60">Код Грея (Безпечне перемикання)</text>

  <!-- Схема переходу 010 -> 110 -->
  <rect x="515" y="120" width="395" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="535" y="145" font-size="13" font-weight="bold" fill="#1a1a1a">Перехід між сусідніми секторами (дистанція d = 1):</text>

  <rect x="535" y="160" width="80" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="575" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Сектор 3 (010)</text>

  <line x1="625" y1="175" x2="685" y2="175" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="695" y="160" width="80" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="735" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Сектор 4 (110)</text>

  <!-- Безпечний стан -->
  <rect x="535" y="205" width="355" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="550" y="225" font-size="12" font-weight="bold" fill="#27ae60">Змінюється рівно 1 біт (010 → 110):</text>
  <text x="550" y="243" font-size="12" fill="#1a1a1a">Помилка на межі зчитування: не більше <tspan font-weight="bold" fill="#27ae60">±1 кванта</tspan>!</text>

  <!-- Таблиця секторів коду Грея -->
  <rect x="515" y="285" width="395" height="155" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="535" y="308" font-size="12" font-weight="bold" fill="#1a1a1a">Послідовність 3-бітного коду Грея:</text>
  <text x="535" y="330" font-size="12" fill="#1a1a1a">0: <tspan font-family="monospace">000</tspan>  |  1: <tspan font-family="monospace">001</tspan>  |  2: <tspan font-family="monospace">011</tspan>  |  3: <tspan font-family="monospace">010</tspan></text>
  <text x="535" y="350" font-size="12" fill="#1a1a1a">4: <tspan font-family="monospace">110</tspan>  |  5: <tspan font-family="monospace">111</tspan>  |  6: <tspan font-family="monospace">101</tspan>  |  7: <tspan font-family="monospace">100</tspan></text>
  <text x="535" y="380" font-size="12" fill="#27ae60"><tspan font-weight="bold">Перевага:</tspan> Апаратне перетворення Gray → Bin через XOR.</text>
  <text x="535" y="400" font-size="12" fill="#6b7280">Гарантує абсолютну надійність у цифрових сервосистемах.</text>
</svg>
