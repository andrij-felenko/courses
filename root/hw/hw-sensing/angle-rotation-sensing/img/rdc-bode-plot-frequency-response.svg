<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Частотна характеристика (ЛАЧХ і ЛФЧХ) контуру стеження Type II</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Смуга пропускання контуру RDC (f_BW ≈ 500 Гц) та запас стійкості за фазою (PM = 48°)</text>

  <!-- ЛІВА ЧАСТИНА: Графіки ЛАЧХ і ЛФЧХ -->
  <g transform="translate(30, 75)">
    <!-- 1. Графік ЛАЧХ (Magnitude) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="580" height="180" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
      <text x="20" y="22" font-size="13" font-weight="bold" fill="#2457d6">Логарифмічна АЧХ: |G_closed(jω)| [дБ]</text>
      
      <!-- Сітка і осі -->
      <!-- 0 dB лінія -->
      <line x1="60" y1="55" x2="550" y2="55" stroke="#1a1a1a" stroke-width="1"/>
      <text x="50" y="59" text-anchor="end" font-size="12" fill="#1a1a1a">0 дБ</text>

      <!-- −20 dB лінія -->
      <line x1="60" y1="105" x2="550" y2="105" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="50" y="109" text-anchor="end" font-size="12" fill="#6b7280">−20 дБ</text>

      <!-- −40 dB лінія -->
      <line x1="60" y1="155" x2="550" y2="155" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="50" y="159" text-anchor="end" font-size="12" fill="#6b7280">−40 дБ</text>

      <!-- Вертикальні частотні мітки -->
      <!-- 10 Hz (x=100) -->
      <line x1="100" y1="35" x2="100" y2="165" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="100" y="175" text-anchor="middle" font-size="12" fill="#6b7280">10 Гц</text>

      <!-- 100 Hz (x=240) -->
      <line x1="240" y1="35" x2="240" y2="165" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="240" y="175" text-anchor="middle" font-size="12" fill="#6b7280">100 Гц</text>

      <!-- f_BW = 500 Hz (x=380) -->
      <line x1="380" y1="35" x2="380" y2="165" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 2"/>
      <text x="380" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">f_BW = 500 Гц</text>

      <!-- 2 kHz (x=500) -->
      <line x1="500" y1="35" x2="500" y2="165" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="500" y="175" text-anchor="middle" font-size="12" fill="#6b7280">2 кГц</text>

      <!-- Крива ЛАЧХ: плоска 0 dB до 300 Hz, спад −3dB на 500 Hz, далі −40 dB/dec -->
      <path d="M 60 55 L 280 55 Q 350 55 380 65 Q 440 95 540 160" fill="none" stroke="#2457d6" stroke-width="2.5"/>

      <!-- Точка зрізу −3 dB -->
      <circle cx="380" cy="65" r="4" fill="#c0392b"/>
      <text x="395" y="60" font-size="12" font-weight="bold" fill="#c0392b">−3 дБ</text>
      <text x="470" y="130" font-size="12" fill="#2457d6">−40 дБ/дек</text>
    </g>

    <!-- 2. Графік ЛФЧХ (Phase) -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="580" height="185" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
      <text x="20" y="22" font-size="13" font-weight="bold" fill="#27ae60">Логарифмічна ФЧХ: arg(G(jω)) [град]</text>
      
      <!-- 0° лінія -->
      <line x1="60" y1="45" x2="550" y2="45" stroke="#1a1a1a" stroke-width="1"/>
      <text x="50" y="49" text-anchor="end" font-size="12" fill="#1a1a1a">0°</text>

      <!-- −90° лінія -->
      <line x1="60" y1="95" x2="550" y2="95" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="50" y="99" text-anchor="end" font-size="12" fill="#6b7280">−90°</text>

      <!-- −180° лінія -->
      <line x1="60" y1="145" x2="550" y2="145" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="50" y="149" text-anchor="end" font-size="12" fill="#6b7280">−180°</text>

      <!-- Вертикальна лінія зрізу f_BW -->
      <line x1="380" y1="30" x2="380" y2="160" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 2"/>

      <!-- Крива ЛФЧХ: 0° на низьких, спадає до −132° на частоті зрізу (PM = 180 - 132 = 48°) -->
      <path d="M 60 45 L 200 48 Q 300 65 380 118 Q 450 155 540 165" fill="none" stroke="#27ae60" stroke-width="2.5"/>

      <!-- Стрілка запасу стійкості за фазою (PM = 48°) -->
      <line x1="380" y1="118" x2="380" y2="145" stroke="#27ae60" stroke-width="2"/>
      <polygon points="380,118 376,126 384,126" fill="#27ae60"/>
      <polygon points="380,145 376,137 384,137" fill="#27ae60"/>
      
      <rect x="395" y="120" width="130" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
      <text x="460" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Запас PM = 48°</text>
    </g>
  </g>

  <!-- ПРАВА ЧАСТИНА: Метрологічний аналіз контуру -->
  <g transform="translate(630, 75)">
    <rect x="0" y="0" width="300" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="0" y="0" width="300" height="38" rx="8" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
    <text x="150" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Властивості контуру Type II</text>

    <!-- Характеристика 1 -->
    <rect x="15" y="55" width="270" height="65" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="25" y="75" font-size="12" font-weight="bold" fill="#2457d6">1. Нульове динамічне відставання:</text>
    <text x="25" y="93" font-size="12" fill="#1a1a1a">Два інтегратори в розімкненому контурі</text>
    <text x="25" y="108" font-size="12" fill="#6b7280">забезпечують e_pos = 0 при ω = const</text>

    <!-- Характеристика 2 -->
    <rect x="15" y="130" width="270" height="65" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="25" y="150" font-size="12" font-weight="bold" fill="#27ae60">2. Стійкість та запас за фазою:</text>
    <text x="25" y="168" font-size="12" fill="#1a1a1a">Запас фази PM = 45°…60° гарантує</text>
    <text x="25" y="183" font-size="12" fill="#6b7280">відсутність перерегулювання та резонансу</text>

    <!-- Характеристика 3 -->
    <rect x="15" y="205" width="270" height="65" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="25" y="225" font-size="12" font-weight="bold" fill="#c0392b">3. Фільтрація шумів несної:</text>
    <text x="25" y="243" font-size="12" fill="#1a1a1a">Спад −40 дБ/дек пригнічує завади</text>
    <text x="25" y="258" font-size="12" fill="#6b7280">частоти збудження 10 кГц на > 50 дБ</text>

    <!-- Характеристика 4 -->
    <rect x="15" y="280" width="270" height="85" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="25" y="302" font-size="12" font-weight="bold" fill="#27ae60">Синтез параметрів регулятора:</text>
    <text x="25" y="322" font-size="12" fill="#1a1a1a">• ω_n = 2π · f_BW = 3140 рад/с</text>
    <text x="25" y="340" font-size="12" fill="#1a1a1a">• Kp = 2 · ζ · ω_n   (ζ ≈ 0.707)</text>
    <text x="25" y="358" font-size="12" fill="#1a1a1a">• Ki = ω_n²</text>
  </g>
</svg>
