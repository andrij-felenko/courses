<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Компенсація зовнішнього магнітного поля завади мостом сенсорів Холла</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Диференціальне віднімання синфазної завади: V_out = V₁ − V₂ = 2·k·B_sig (B_ext повністю скорочується)</text>

  <!-- ЛІВА ЧАСТИНА: Геометрія магнітного поля та сенсорів -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="430" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="0" y="0" width="430" height="38" rx="8" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
    <text x="215" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Розподіл корисного поля та поля завади</text>

    <!-- Тіло магніту (Диполь N / S) -->
    <g transform="translate(115, 45)">
      <text x="100" y="16" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Обертовий дипольний магніт</text>
      <rect x="0" y="25" width="100" height="40" rx="3" fill="#c0392b" stroke="#962d22" stroke-width="1"/>
      <text x="50" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">N</text>
      <rect x="100" y="25" width="100" height="40" rx="3" fill="#2457d6" stroke="#1b43a8" stroke-width="1"/>
      <text x="150" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">S</text>
    </g>

    <!-- Зовнішнє синфазне поле завади (B_ext) - стрілки вниз -->
    <g transform="translate(45, 125)">
      <text x="170" y="14" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Однорідне поле завади B_ext (наприклад, струми інвертора)</text>
      <line x1="0" y1="20" x2="0" y2="50" stroke="#c0392b" stroke-width="2"/>
      <polygon points="0,50 -4,42 4,42" fill="#c0392b"/>
      <line x1="170" y1="20" x2="170" y2="50" stroke="#c0392b" stroke-width="2"/>
      <polygon points="170,50 166,42 174,42" fill="#c0392b"/>
      <line x1="340" y1="20" x2="340" y2="50" stroke="#c0392b" stroke-width="2"/>
      <polygon points="340,50 336,42 344,42" fill="#c0392b"/>
    </g>

    <!-- Пара диференціальних сенсорів Холла (H1 та H2) -->
    <g transform="translate(65, 190)">
      <!-- Сенсор H1 (під полюсом N) -->
      <rect x="0" y="0" width="120" height="70" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
      <text x="60" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Сенсор Холла H1</text>
      <text x="60" y="42" text-anchor="middle" font-size="12" fill="#1a1a1a">B₁ = +B_sig + B_ext</text>
      <text x="60" y="60" text-anchor="middle" font-size="12" fill="#6b7280">(Поле N: +B_sig)</text>

      <!-- Сенсор H2 (під полюсом S) -->
      <rect x="180" y="0" width="120" height="70" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
      <text x="240" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Сенсор Холла H2</text>
      <text x="240" y="42" text-anchor="middle" font-size="12" fill="#1a1a1a">B₂ = −B_sig + B_ext</text>
      <text x="240" y="60" text-anchor="middle" font-size="12" fill="#6b7280">(Поле S: −B_sig)</text>
    </g>

    <!-- Пояснення внизу лівої панелі -->
    <text x="215" y="295" text-anchor="middle" font-size="12" fill="#1a1a1a">• Корисне поле магніту діє на сенсори ПРОТИФАЗНО (+/−)</text>
    <text x="215" y="315" text-anchor="middle" font-size="12" fill="#c0392b">• Поле завади B_ext діє на обидва сенсори СИНФАЗНО (+/+)</text>
    <text x="215" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Відповідає автомобільним вимогам ISO 26262</text>
  </g>

  <!-- ПРАВА ЧАСТИНА: Структурна схема диференціального віднімання -->
  <g transform="translate(490, 75)">
    <rect x="0" y="0" width="440" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="0" y="0" width="440" height="38" rx="8" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
    <text x="220" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Електричне віднімання завади</text>

    <!-- Блок підсилювача-віднімача -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="400" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
      
      <!-- Входи V1 та V2 -->
      <line x1="30" y1="45" x2="110" y2="45" stroke="#27ae60" stroke-width="2"/>
      <polygon points="110,45 102,41 102,49" fill="#27ae60"/>
      <text x="20" y="40" font-size="12" font-weight="bold" fill="#27ae60">V₁ (+)</text>

      <line x1="30" y1="105" x2="110" y2="105" stroke="#2457d6" stroke-width="2"/>
      <polygon points="110,105 102,101 102,109" fill="#2457d6"/>
      <text x="20" y="100" font-size="12" font-weight="bold" fill="#2457d6">V₂ (−)</text>

      <!-- Символ диференціального підсилювача -->
      <polygon points="120,25 240,75 120,125" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
      <text x="140" y="55" font-size="14" font-weight="bold" fill="#2457d6">+</text>
      <text x="140" y="105" font-size="14" font-weight="bold" fill="#2457d6">−</text>
      <text x="175" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Diff Amp</text>

      <!-- Вихід V_out -->
      <line x1="240" y1="75" x2="310" y2="75" stroke="#27ae60" stroke-width="2"/>
      <polygon points="310,75 302,71 302,79" fill="#27ae60"/>
      <text x="320" y="80" font-size="12" font-weight="bold" fill="#27ae60">V_out</text>
    </g>

    <!-- Математичний блок компенсації -->
    <g transform="translate(20, 215)">
      <rect x="0" y="0" width="400" height="145" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
      <text x="15" y="24" font-size="12" font-weight="bold" fill="#27ae60">Математичне скорочення синфазної завади:</text>
      
      <text x="15" y="48" font-size="12" fill="#1a1a1a">• V₁ = k · (+B_sig + B_ext)</text>
      <text x="15" y="68" font-size="12" fill="#1a1a1a">• V₂ = k · (−B_sig + B_ext)</text>
      
      <line x1="15" y1="78" x2="385" y2="78" stroke="#27ae60" stroke-width="1"/>

      <text x="15" y="98" font-size="12" font-weight="bold" fill="#2457d6">V_out = V₁ − V₂ = k·(B_sig − (−B_sig)) + k·(B_ext − B_ext)</text>
      <text x="15" y="118" font-size="13" font-weight="bold" fill="#27ae60">V_out = 2 · k · B_sig + 0  (Завада B_ext придушена на &gt; 40 дБ)</text>
      <text x="15" y="136" font-size="12" fill="#6b7280">Для квадри 4 сенсорів: ортогональні пари дають sin(θ) та cos(θ)</text>
    </g>
  </g>
</svg>
