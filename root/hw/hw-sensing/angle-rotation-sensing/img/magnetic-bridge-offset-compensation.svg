<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Автонульова корекція зміщення мостового магнітного сенсора</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Схема модульованої автокомпенсації (Auto-Zero) для усунення постійного зсуву нуля та 1/f шуму ОП</text>

  <!-- БЛОК 1: Мостовий магніточутливий сенсор (AMR / TMR) -->
  <g transform="translate(30, 85)">
    <rect x="0" y="0" width="220" height="270" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="36" rx="8" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
    <text x="110" y="23" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Міст Вітстона (TMR/AMR)</text>

    <!-- Живлення моста -->
    <text x="110" y="60" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">V_DD (+3.3V)</text>
    <line x1="110" y1="65" x2="110" y2="85" stroke="#c0392b" stroke-width="1.5"/>

    <!-- Резистори моста (Ромб) -->
    <!-- Верхній вузол (110, 85) -->
    <!-- Лівий вузол (45, 145) -->
    <!-- Правий вузол (175, 145) -->
    <!-- Нижній вузол (110, 205) -->
    
    <line x1="110" y1="85" x2="45" y2="145" stroke="#2457d6" stroke-width="1.5"/>
    <line x1="110" y1="85" x2="175" y2="145" stroke="#2457d6" stroke-width="1.5"/>
    <line x1="45" y1="145" x2="110" y2="205" stroke="#2457d6" stroke-width="1.5"/>
    <line x1="175" y1="145" x2="110" y2="205" stroke="#2457d6" stroke-width="1.5"/>

    <!-- Плашки резисторів -->
    <rect x="62" y="102" width="28" height="16" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
    <text x="76" y="114" text-anchor="middle" font-size="12" fill="#1a1a1a">R1</text>

    <rect x="130" y="102" width="28" height="16" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
    <text x="144" y="114" text-anchor="middle" font-size="12" fill="#1a1a1a">R2</text>

    <rect x="62" y="172" width="28" height="16" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
    <text x="76" y="184" text-anchor="middle" font-size="12" fill="#1a1a1a">R3</text>

    <rect x="130" y="172" width="28" height="16" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
    <text x="144" y="184" text-anchor="middle" font-size="12" fill="#1a1a1a">R4</text>

    <!-- Земля моста -->
    <line x1="110" y1="205" x2="110" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="110" y="240" text-anchor="middle" font-size="12" fill="#1a1a1a">GND</text>

    <!-- Вихідні точки моста -->
    <circle cx="45" cy="145" r="4" fill="#2457d6"/>
    <circle cx="175" cy="145" r="4" fill="#2457d6"/>
    <text x="35" y="135" font-size="12" font-weight="bold" fill="#2457d6">V+</text>
    <text x="180" y="135" font-size="12" font-weight="bold" fill="#2457d6">V-</text>
  </g>

  <!-- Лінії від моста до модулятора -->
  <line x1="205" y1="230" x2="275" y2="185" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="250" y1="230" x2="275" y2="235" stroke="#2457d6" stroke-width="1.5"/>

  <!-- БЛОК 2: Вхідний комутатор-модулятор (Chopper Clock f_ch) -->
  <g transform="translate(275, 115)">
    <rect x="0" y="0" width="130" height="180" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="65" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Комутатор CH1</text>
    <text x="65" y="42" text-anchor="middle" font-size="12" fill="#6b7280">Модуляція f_ch</text>

    <!-- Стан ключів -->
    <rect x="15" y="60" width="100" height="35" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="65" y="77" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Фаза Φ1</text>
    <text x="65" y="90" text-anchor="middle" font-size="12" fill="#6b7280">Пряме V_in</text>

    <rect x="15" y="110" width="100" height="35" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="65" y="127" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Фаза Φ2</text>
    <text x="65" y="140" text-anchor="middle" font-size="12" fill="#6b7280">Інверсне -V_in</text>

    <text x="65" y="168" text-anchor="middle" font-size="12" fill="#1a1a1a">CLK: 100 кГц</text>
  </g>

  <!-- Лінії до підсилювача -->
  <line x1="405" y1="185" x2="445" y2="185" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="405" y1="235" x2="445" y2="235" stroke="#2457d6" stroke-width="1.5"/>

  <!-- БЛОК 3: Підсилювач із власною напругою зсуву V_os -->
  <g transform="translate(445, 115)">
    <rect x="0" y="0" width="160" height="180" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="80" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Підсилювач (A_v)</text>
    <text x="80" y="42" text-anchor="middle" font-size="12" fill="#6b7280">з напругою зсуву</text>

    <!-- Символ трикутника ОП -->
    <polygon points="25,70 25,150 115,110" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
    <text x="45" y="95" font-size="14" font-weight="bold" fill="#2457d6">+</text>
    <text x="45" y="130" font-size="14" font-weight="bold" fill="#2457d6">−</text>

    <!-- Генератор V_os -->
    <circle cx="135" cy="110" r="14" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="135" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">V_os</text>

    <text x="80" y="168" text-anchor="middle" font-size="12" fill="#c0392b">Зсув нуля ОП</text>
  </g>

  <!-- Лінія до демодулятора -->
  <line x1="605" y1="205" x2="640" y2="205" stroke="#2457d6" stroke-width="1.5"/>

  <!-- БЛОК 4: Вихідний демодулятор CH2 та ФНЧ -->
  <g transform="translate(640, 115)">
    <rect x="0" y="0" width="140" height="180" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="70" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Демодулятор CH2</text>
    <text x="70" y="42" text-anchor="middle" font-size="12" fill="#6b7280">Синхронне множення</text>

    <rect x="15" y="60" width="110" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="70" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">ФНЧ (LPF)</text>
    <text x="70" y="93" text-anchor="middle" font-size="12" fill="#6b7280">Виділення DC</text>

    <rect x="15" y="115" width="110" height="45" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
    <text x="70" y="133" text-anchor="middle" font-size="12" fill="#1a1a1a">V_sig відновлено</text>
    <text x="70" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">V_os → зрізано</text>
  </g>

  <!-- Лінія до виходу -->
  <line x1="780" y1="205" x2="815" y2="205" stroke="#27ae60" stroke-width="2"/>
  <polygon points="815,205 807,200 807,210" fill="#27ae60"/>

  <!-- Вихідний блок результату -->
  <g transform="translate(815, 140)">
    <rect x="0" y="0" width="115" height="130" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="57" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Вихідний сигнал</text>
    
    <text x="57" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">V_out(θ)</text>
    <text x="57" y="75" text-anchor="middle" font-size="12" fill="#2457d6">A·sin(θ)</text>
    <text x="57" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Offset ≈ 0</text>
  </g>

  <!-- Нижня плашка з математичним механізмом -->
  <g transform="translate(30, 375)">
    <rect x="0" y="0" width="900" height="85" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
    <text x="25" y="24" font-size="12" font-weight="bold" fill="#1a1a1a">Математичний принцип усунення зміщення нуля:</text>
    <text x="25" y="46" font-size="12" fill="#1a1a1a">• Модуляція переносить корисний сигнал моста на частоту комутації f_ch, залишаючи постійний зсув V_os на низькій частоті</text>
    <text x="25" y="68" font-size="12" fill="#6b7280">• Вихідний демодулятор і фільтр низьких частот (ФНЧ) повністю фільтрують промодульовану складову зміщення, залишаючи чистий синус</text>
  </g>
</svg>
