<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Архітектура RDC-перетворювача з контуром стеження другого порядку</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Замкнений контур із тригонометричним відніманням, демодулятором та PI-фільтром оцінює кут θ та швидкість ω</text>

  <!-- Головна панель контуру стеження -->
  <rect x="25" y="75" width="910" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Входи від резольвера -->
  <rect x="45" y="110" width="130" height="60" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="110" y="133" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Вхід Sin</text>
  <text x="110" y="153" text-anchor="middle" font-size="12" fill="#1a1a1a">sin(θ) · sin(ωt)</text>

  <rect x="45" y="240" width="130" height="60" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="110" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Вхід Cos</text>
  <text x="110" y="283" text-anchor="middle" font-size="12" fill="#1a1a1a">cos(θ) · sin(ωt)</text>

  <!-- Блок тригонометричного помножувача та віднімання -->
  <rect x="215" y="110" width="165" height="190" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="297" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Фазовий дискримінатор</text>
  <text x="297" y="170" text-anchor="middle" font-size="12" fill="#27ae60">sin(θ) · cos(φ)</text>
  <text x="297" y="195" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">−</text>
  <text x="297" y="220" text-anchor="middle" font-size="12" fill="#2457d6">cos(θ) · sin(φ)</text>
  <text x="297" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">= sin(θ − φ) · sin(ωt)</text>
  <text x="297" y="280" text-anchor="middle" font-size="12" fill="#6b7280">Різниця фаз (θ − φ)</text>

  <!-- Стрілки від входів до помножувачів -->
  <line x1="175" y1="140" x2="215" y2="140" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="175" y1="270" x2="215" y2="270" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Блок синхронного демодулятора (PSD) -->
  <rect x="420" y="160" width="130" height="90" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="485" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Демодулятор</text>
  <text x="485" y="208" text-anchor="middle" font-size="12" fill="#1a1a1a">Фазочутливий ФНЧ</text>
  <text x="485" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">ε ≈ θ − φ</text>

  <!-- Стрілка від дискримінатора до демодулятора -->
  <line x1="380" y1="205" x2="420" y2="205" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Блок регулятора PI (Loop Filter) -->
  <rect x="585" y="160" width="140" height="90" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="655" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">PI-фільтр контуру</text>
  <text x="655" y="208" text-anchor="middle" font-size="12" fill="#1a1a1a">F(s) = K_p + K_i / s</text>
  <text x="655" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Вихід: швидкість ω</text>

  <!-- Стрілка від демодулятора до PI -->
  <line x1="550" y1="205" x2="585" y2="205" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Блок цифрового інтегратора (VCO / Інтегратор) -->
  <rect x="760" y="160" width="150" height="90" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="835" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Інтегратор 1/s</text>
  <text x="835" y="208" text-anchor="middle" font-size="12" fill="#2457d6">φ = ∫ ω dt</text>
  <text x="835" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Оцінка кута φ</text>

  <!-- Стрілка від PI до інтегратора -->
  <line x1="725" y1="205" x2="760" y2="205" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Блок зворотного зв'язку CORDIC / Sin-Cos генератор -->
  <rect x="420" y="320" width="305" height="60" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="572" y="343" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Генератор функцій (ROM / CORDIC)</text>
  <text x="572" y="365" text-anchor="middle" font-size="12" fill="#2457d6">Обчислення sin(φ) та cos(φ) за поточною оцінкою кута</text>

  <!-- Лінія зворотного зв'язку від Інтегратора до CORDIC -->
  <path d="M 835 250 L 835 350 L 725 350" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Лінія від CORDIC назад до дискримінатора -->
  <path d="M 420 350 L 297 350 L 297 300" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Нижня інформаційна плашка -->
  <rect x="45" y="395" width="870" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="423" font-size="12" font-weight="bold" fill="#1a1a1a">Властивість контуру Type II:</text>
  <text x="240" y="423" font-size="12" fill="#1a1a1a">Два інтегратори забезпечують нульову статичну похибку положення за постійної швидкості обертання вала (ω = const).</text>
</svg>
