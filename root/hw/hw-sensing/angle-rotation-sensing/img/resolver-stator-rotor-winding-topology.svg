<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Електромагнітна топологія безщіткового резольвера</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Безконтактне трансформаторне живлення ротора та просторова квадратура вихідних обмоток статора</text>

  <!-- Section 1: Rotary Transformer (Left) -->
  <rect x="25" y="70" width="280" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="165" y="95" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Обертовий трансформатор</text>
  <text x="165" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Безконтактне живлення ротора (без щіток)</text>

  <!-- Excitation Input -->
  <rect x="45" y="130" width="240" height="45" rx="5" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="165" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Збудження (Статорні виводи R1–R2):</text>
  <text x="165" y="166" font-size="12" fill="#1a1a1a" text-anchor="middle">V_exc(t) = V_ref · sin(ω_c · t)   [2–10 кГц]</text>

  <!-- Transformer Diagram -->
  <rect x="45" y="185" width="105" height="60" rx="4" fill="white" stroke="#2457d6"/>
  <text x="97" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Первинна</text>
  <text x="97" y="228" font-size="11" fill="#6b7280" text-anchor="middle">(нерухома)</text>

  <!-- Magnetic Coupling Gap -->
  <line x1="155" y1="190" x2="155" y2="240" stroke="#d0d7de" stroke-width="2" stroke-dasharray="2,2"/>
  <line x1="165" y1="190" x2="165" y2="240" stroke="#d0d7de" stroke-width="2" stroke-dasharray="2,2"/>
  <text x="160" y="258" font-size="11" fill="#6b7280" text-anchor="middle">Зазор</text>

  <rect x="175" y="185" width="110" height="60" rx="4" fill="white" stroke="#27ae60"/>
  <text x="230" y="210" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Вторинна</text>
  <text x="230" y="228" font-size="11" fill="#6b7280" text-anchor="middle">(обертова)</text>

  <!-- Info Box Left -->
  <rect x="35" y="275" width="260" height="175" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="45" y="297" font-size="12" font-weight="bold" fill="#1a1a1a">Переваги відсутності щіток:</text>
  <text x="45" y="319" font-size="12" fill="#1a1a1a">• Нульове механічне тертя й знос</text>
  <text x="45" y="339" font-size="12" fill="#1a1a1a">• Відсутність іскроутворення</text>
  <text x="45" y="359" font-size="12" fill="#1a1a1a">• Робота в мастилі та вакуумі</text>
  <text x="45" y="379" font-size="12" fill="#1a1a1a">• Вібростійкість до 50–100 g</text>
  <text x="45" y="407" font-size="12" fill="#6b7280">Передає напругу несучої частоти</text>
  <text x="45" y="425" font-size="12" fill="#2457d6">на вимірювальну обмотку ротора</text>

  <!-- Section 2: Resolver Main Topology (Middle) -->
  <rect x="320" y="70" width="310" height="395" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="475" y="95" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Просторова орієнтація</text>
  <text x="475" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Роторна котушка + 2 статорні обмотки 90°</text>

  <!-- Stator Quadrature Diagram -->
  <circle cx="475" cy="190" r="60" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="475" cy="190" r="3" fill="#1a1a1a"/>

  <!-- Cosine Winding S1-S3 (Vertical) -->
  <line x1="475" y1="130" x2="475" y2="150" stroke="#c0392b" stroke-width="3"/>
  <line x1="475" y1="230" x2="475" y2="250" stroke="#c0392b" stroke-width="3"/>
  <text x="475" y="124" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">S1 (Cos+)</text>
  <text x="475" y="262" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">S3 (Cos−)</text>

  <!-- Sine Winding S2-S4 (Horizontal) -->
  <line x1="415" y1="190" x2="435" y2="190" stroke="#27ae60" stroke-width="3"/>
  <line x1="515" y1="190" x2="535" y2="190" stroke="#27ae60" stroke-width="3"/>
  <text x="390" y="194" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">S4 (Sin−)</text>
  <text x="560" y="194" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">S2 (Sin+)</text>

  <!-- Rotor Winding (Rotated by angle theta) -->
  <line x1="440" y1="215" x2="510" y2="165" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="515" y="158" font-size="12" font-weight="bold" fill="#2457d6">θ (Ротор)</text>

  <!-- Info Box Middle -->
  <rect x="335" y="275" width="280" height="175" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="345" y="297" font-size="12" font-weight="bold" fill="#1a1a1a">Закон електромагнітної індукції:</text>
  <text x="345" y="319" font-size="12" fill="#1a1a1a">Взаємна індуктивність обмоток:</text>
  <text x="345" y="339" font-size="12" fill="#1a1a1a">• M_cos(θ) = M₀ · cos(θ)</text>
  <text x="345" y="359" font-size="12" fill="#1a1a1a">• M_sin(θ) = M₀ · sin(θ)</text>
  <text x="345" y="387" font-size="12" fill="#6b7280">Просторово розподілені обмотки</text>
  <text x="345" y="407" font-size="12" fill="#6b7280">фільтрують просторові гармоніки</text>
  <text x="345" y="433" font-size="12" font-weight="bold" fill="#27ae60">Кутовий зсув обмоток: строго 90.0°</text>

  <!-- Section 3: Modulated Output Signals (Right) -->
  <rect x="645" y="70" width="290" height="395" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="790" y="95" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Вихідні сигнали RDC</text>
  <text x="790" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Амплітудно-модульовані напруги</text>

  <!-- Cosine Output Formula Box -->
  <rect x="660" y="130" width="260" height="60" rx="5" fill="white" stroke="#c0392b"/>
  <text x="670" y="150" font-size="12" font-weight="bold" fill="#c0392b">Канал косинуса (S1–S3):</text>
  <text x="670" y="172" font-size="12" fill="#1a1a1a">V_cos(t) = k·V_ref·cos(θ)·sin(ω_c·t)</text>

  <!-- Sine Output Formula Box -->
  <rect x="660" y="200" width="260" height="60" rx="5" fill="white" stroke="#27ae60"/>
  <text x="670" y="220" font-size="12" font-weight="bold" fill="#27ae60">Канал синуса (S2–S4):</text>
  <text x="670" y="242" font-size="12" fill="#1a1a1a">V_sin(t) = k·V_ref·sin(θ)·sin(ω_c·t)</text>

  <!-- Summary Features Box -->
  <rect x="660" y="275" width="260" height="175" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="670" y="297" font-size="12" font-weight="bold" fill="#1a1a1a">Метрологічні властивості:</text>
  <text x="670" y="319" font-size="12" fill="#27ae60">✓ Нечутливість до зсуву нуля (AC)</text>
  <text x="670" y="339" font-size="12" fill="#27ae60">✓ Температури: −55 °C … +150 °C</text>
  <text x="670" y="359" font-size="12" fill="#27ae60">✓ Стійкість до радіації та ЕМЗ</text>
  <text x="670" y="387" font-size="12" fill="#6b7280">Огинаючі несучої несуть точне</text>
  <text x="670" y="407" font-size="12" fill="#6b7280">значення кута положення ротора θ</text>
  <text x="670" y="433" font-size="12" font-weight="bold" fill="#2457d6">Готові для RDC-контуру стеження</text>

  <!-- Connecting Arrows -->
  <path d="M 305,150 L 320,150" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 630,190 L 645,190" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
</svg>
