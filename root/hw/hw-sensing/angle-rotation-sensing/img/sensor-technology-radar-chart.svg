<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Порівняльний радарний профіль технологій кутових сенсорів</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Багатофакторна оцінка оптичних, інтегральних магнітних та резольверних енкодерів (шкала 1..10)</text>

  <!-- ЛІВА ЧАСТИНА: Радарна діаграма (Центр 260, 260) -->
  <g transform="translate(0, 0)">
    <!-- Концентричні кола/полігони рівнів 2, 4, 6, 8, 10 -->
    <!-- Центр: (260, 260), R = 150 -->
    <!-- 6 осей (кут кроку 60°):
         Вісь 0 (Вгору, 270°/90°): (260, 110) - Точність/Роздільність
         Вісь 1 (Вправо-вгору, 330°): (390, 185) - Макс. швидкість
         Вісь 2 (Вправо-вниз, 30°): (390, 335) - Компактність/Маса
         Вісь 3 (Вниз, 90°): (260, 410) - Економічність/Ціна
         Вісь 4 (Вліво-вниз, 150°): (130, 335) - Стійкість до бруду
         Вісь 5 (Вліво-вгору, 210°): (130, 185) - Термо- та вібростійкість
    -->
    
    <!-- Сітка рівнів (шестикутники) -->
    <!-- Рівень 10 (R=150) -->
    <polygon points="260,110 390,185 390,335 260,410 130,335 130,185" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <!-- Рівень 8 (R=120) -->
    <polygon points="260,140 364,200 364,320 260,380 156,320 156,200" fill="#ffffff" stroke="#e1e4e8" stroke-width="1"/>
    <!-- Рівень 6 (R=90) -->
    <polygon points="260,170 338,215 338,305 260,350 182,305 182,215" fill="#f4f6f8" stroke="#e1e4e8" stroke-width="1"/>
    <!-- Рівень 4 (R=60) -->
    <polygon points="260,200 312,230 312,290 260,320 208,290 208,230" fill="#ffffff" stroke="#e1e4e8" stroke-width="1"/>
    <!-- Рівень 2 (R=30) -->
    <polygon points="260,230 286,245 286,275 260,290 234,275 234,245" fill="#f4f6f8" stroke="#e1e4e8" stroke-width="1"/>

    <!-- Осі координат -->
    <line x1="260" y1="260" x2="260" y2="110" stroke="#d0d7de" stroke-width="1"/>
    <line x1="260" y1="260" x2="390" y2="185" stroke="#d0d7de" stroke-width="1"/>
    <line x1="260" y1="260" x2="390" y2="335" stroke="#d0d7de" stroke-width="1"/>
    <line x1="260" y1="260" x2="260" y2="410" stroke="#d0d7de" stroke-width="1"/>
    <line x1="260" y1="260" x2="130" y2="335" stroke="#d0d7de" stroke-width="1"/>
    <line x1="260" y1="260" x2="130" y2="185" stroke="#d0d7de" stroke-width="1"/>

    <!-- Текстові підписи осей (з достатнім відступом) -->
    <text x="260" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Точність і роздільність</text>
    <text x="405" y="185" font-size="12" font-weight="bold" fill="#1a1a1a">Макс. швидкість</text>
    <text x="405" y="345" font-size="12" font-weight="bold" fill="#1a1a1a">Компактність</text>
    <text x="260" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Економічність</text>
    <text x="115" y="345" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">Стійкість до бруду</text>
    <text x="115" y="185" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">Термостійкість</text>

    <!-- Полігон 1: ОПТИЧНІ ЕНКОДЕРИ (Синій #2457d6) -->
    <!-- Бали: Точність=10 (R=150->260,110), Швидкість=8 (R=120->364,200), Компактність=5 (R=75->325,297), Ціна=5 (R=75->260,335), Бруд=3 (R=45->221,282), Термо=4 (R=60->208,230) -->
    <polygon points="260,110 364,200 325,297 260,335 221,282 208,230" fill="#2457d6" fill-opacity="0.25" stroke="#2457d6" stroke-width="2.5"/>
    <circle cx="260" cy="110" r="3" fill="#2457d6"/>
    <circle cx="364" cy="200" r="3" fill="#2457d6"/>

    <!-- Полігон 2: МАГНІТНІ IC (Зелений #27ae60) -->
    <!-- Бали: Точність=6 (R=90->260,170), Швидкість=7 (R=105->351,207), Компактність=10 (R=150->390,335), Ціна=9 (R=135->260,395), Бруд=8 (R=120->156,320), Термо=7 (R=105->169,207) -->
    <polygon points="260,170 351,207 390,335 260,395 156,320 169,207" fill="#27ae60" fill-opacity="0.25" stroke="#27ae60" stroke-width="2.5"/>
    <circle cx="390" cy="335" r="3" fill="#27ae60"/>
    <circle cx="260" cy="395" r="3" fill="#27ae60"/>

    <!-- Полігон 3: РЕЗОЛЬВЕРИ (Червоний #c0392b) -->
    <!-- Бали: Точність=7 (R=105->260,155), Швидкість=9 (R=135->377,192), Компактність=4 (R=60->312,290), Ціна=4 (R=60->260,320), Бруд=10 (R=150->130,335), Термо=10 (R=150->130,185) -->
    <polygon points="260,155 377,192 312,290 260,320 130,335 130,185" fill="#c0392b" fill-opacity="0.25" stroke="#c0392b" stroke-width="2.5"/>
    <circle cx="130" cy="335" r="3" fill="#c0392b"/>
    <circle cx="130" cy="185" r="3" fill="#c0392b"/>
  </g>

  <!-- ПРАВА ЧАСТИНА: Легенда та інженерні рекомендації -->
  <g transform="translate(540, 75)">
    <rect x="0" y="0" width="390" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="0" y="0" width="390" height="38" rx="8" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
    <text x="195" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Порівняльна характеристика класів</text>

    <!-- Картка Оптичних -->
    <g transform="translate(15, 50)">
      <rect x="0" y="0" width="360" height="90" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
      <rect x="10" y="10" width="12" height="12" rx="2" fill="#2457d6"/>
      <text x="30" y="21" font-size="12" font-weight="bold" fill="#2457d6">Оптичні растрові енкодери</text>
      <text x="10" y="42" font-size="12" fill="#1a1a1a">• Перевага: максимальна точність (до 26 біт) та поділ</text>
      <text x="10" y="62" font-size="12" fill="#6b7280">• Обмеження: вразливість до пилу, конденсату, вібрацій</text>
      <text x="10" y="80" font-size="12" font-weight="bold" fill="#1a1a1a">Сфера: верстати ЧПК, напівпровідникові лінії, оптика</text>
    </g>

    <!-- Картка Магнітних -->
    <g transform="translate(15, 150)">
      <rect x="0" y="0" width="360" height="90" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
      <rect x="10" y="10" width="12" height="12" rx="2" fill="#27ae60"/>
      <text x="30" y="21" font-size="12" font-weight="bold" fill="#27ae60">Інтегральні магнітні IC (Hall / AMR / TMR)</text>
      <text x="10" y="42" font-size="12" fill="#1a1a1a">• Перевага: мініатюрність, дешевизна, стійкість до бруду</text>
      <text x="10" y="62" font-size="12" fill="#6b7280">• Обмеження: помірна точність (12..14 біт), вплив полів</text>
      <text x="10" y="80" font-size="12" font-weight="bold" fill="#1a1a1a">Сфера: сервоприводи BLDC, робототехніка, автоелектроніка</text>
    </g>

    <!-- Картка Резольверів -->
    <g transform="translate(15, 250)">
      <rect x="0" y="0" width="360" height="95" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
      <rect x="10" y="10" width="12" height="12" rx="2" fill="#c0392b"/>
      <text x="30" y="21" font-size="12" font-weight="bold" fill="#c0392b">Електромагнітні резольвери</text>
      <text x="10" y="42" font-size="12" fill="#1a1a1a">• Перевага: абсолютна надійність, діапазон −55...+150°C</text>
      <text x="10" y="62" font-size="12" fill="#6b7280">• Обмеження: габарити, маса, потреба у платі RDC</text>
      <text x="10" y="80" font-size="12" font-weight="bold" fill="#1a1a1a">Сфера: тягові електромобілі (EV), авіація, важка індустрія</text>
    </g>

    <text x="195" y="365" text-anchor="middle" font-size="12" fill="#6b7280">Вибір визначається компромісом точності та середовища</text>
  </g>
</svg>
