<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Архітектура контуру стеження Type II (Tracking Loop)</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Безинерційне відновлення кута й швидкості вала за принципом фазового автопідстроювання частоти (PLL)</text>

  <!-- Вхідні сигнали (Зліва) -->
  <g transform="translate(30, 95)">
    <rect x="0" y="0" width="130" height="150" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="65" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Вхідні канали</text>
    
    <rect x="15" y="45" width="100" height="35" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
    <text x="65" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">sin(θ)</text>

    <rect x="15" y="95" width="100" height="35" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
    <text x="65" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">cos(θ)</text>
  </g>

  <!-- Лінії передачі від сенсора до фазового детектора -->
  <line x1="160" y1="157" x2="200" y2="157" stroke="#2457d6" stroke-width="2"/>
  <polygon points="200,157 192,152 192,162" fill="#2457d6"/>

  <line x1="160" y1="207" x2="200" y2="207" stroke="#2457d6" stroke-width="2"/>
  <polygon points="200,207 192,202 192,212" fill="#2457d6"/>

  <!-- Блок 1: Фазовий детектор (Cross-Multiplier) -->
  <g transform="translate(200, 95)">
    <rect x="0" y="0" width="160" height="150" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="80" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Фазовий детектор</text>
    <text x="80" y="42" text-anchor="middle" font-size="12" fill="#6b7280">Перехресний добуток</text>

    <rect x="10" y="55" width="140" height="40" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="70" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">sin(θ)·cos(φ)</text>
    <text x="70" y="90" text-anchor="middle" font-size="12" fill="#1a1a1a">− cos(θ)·sin(φ)</text>

    <rect x="10" y="105" width="140" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="70" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">e_φ ≈ sin(θ − φ)</text>
  </g>

  <!-- Лінія помилки фази до ПІ-регулятора -->
  <line x1="360" y1="170" x2="410" y2="170" stroke="#27ae60" stroke-width="2"/>
  <polygon points="410,170 402,165 402,175" fill="#27ae60"/>
  <text x="385" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">e_φ</text>

  <!-- Блок 2: ПІ-регулятор швидкості (PI Filter) -->
  <g transform="translate(410, 80)">
    <rect x="0" y="0" width="190" height="180" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="95" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">ПІ-регулятор контуру</text>

    <!-- Пропорційна гілка Kp -->
    <rect x="15" y="45" width="90" height="35" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
    <text x="60" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Kp · e_φ</text>

    <!-- Інтегральна гілка Ki/s -->
    <rect x="15" y="100" width="90" height="35" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
    <text x="60" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Ki · ∫ e_φ dt</text>

    <!-- Суматор -->
    <circle cx="150" cy="90" r="16" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
    <text x="150" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">+</text>

    <!-- Лінії всередині ПІ -->
    <line x1="105" y1="62" x2="135" y2="82" stroke="#2457d6" stroke-width="1.5"/>
    <line x1="105" y1="117" x2="135" y2="98" stroke="#2457d6" stroke-width="1.5"/>

    <text x="95" y="160" text-anchor="middle" font-size="12" fill="#6b7280">Фільтрація шумів</text>
  </g>

  <!-- Лінія швидкості до інтегратора кута -->
  <line x1="600" y1="170" x2="650" y2="170" stroke="#2457d6" stroke-width="2"/>
  <polygon points="650,170 642,165 642,175" fill="#2457d6"/>

  <!-- Вихід оцінки швидкості зверху -->
  <line x1="625" y1="170" x2="625" y2="110" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="625" y1="110" x2="800" y2="110" stroke="#2457d6" stroke-width="1.5"/>
  <polygon points="800,110 792,105 792,115" fill="#2457d6"/>
  
  <rect x="800" y="90" width="130" height="40" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="865" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Швидкість ω_est</text>
  <text x="865" y="123" text-anchor="middle" font-size="12" fill="#6b7280">Без затримки (Type II)</text>

  <!-- Блок 3: Цифровий інтегратор кута (NCO / 1/s) -->
  <g transform="translate(650, 140)">
    <rect x="0" y="0" width="120" height="65" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
    <text x="60" y="24" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Інтегратор 1/s</text>
    <text x="60" y="44" text-anchor="middle" font-size="12" fill="#1a1a1a">φ = ∫ ω dt</text>
  </g>

  <!-- Вихід оцінки кута -->
  <line x1="770" y1="172" x2="800" y2="172" stroke="#27ae60" stroke-width="2"/>
  <polygon points="800,172 792,167 792,177" fill="#27ae60"/>

  <rect x="800" y="152" width="130" height="40" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="865" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Кут φ_est</text>
  <text x="865" y="185" text-anchor="middle" font-size="12" fill="#6b7280">Нульова похибка</text>

  <!-- Зворотний зв'язок (Feedback Generator: CORDIC / LUT) -->
  <path d="M 710 205 L 710 320 L 460 320" fill="none" stroke="#6b7280" stroke-width="2"/>
  <polygon points="460,320 468,315 468,325" fill="#6b7280"/>

  <g transform="translate(250, 280)">
    <rect x="0" y="0" width="200" height="80" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="100" y="24" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Генератор функцій</text>
    <text x="100" y="44" text-anchor="middle" font-size="12" fill="#6b7280">CORDIC / Синтезатор</text>
    <text x="100" y="64" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">sin(φ_est), cos(φ_est)</text>
  </g>

  <path d="M 250 320 L 180 320 L 180 220 L 200 220" fill="none" stroke="#6b7280" stroke-width="2"/>
  <polygon points="200,220 192,215 192,225" fill="#6b7280"/>

  <!-- Нижня інформаційна плашка -->
  <g transform="translate(30, 395)">
    <rect x="0" y="0" width="900" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="25" y="25" font-size="12" font-weight="bold" fill="#1a1a1a">• Два інтегратори в прямому тракті гарантують нульове динамічне відставання кута при постійній швидкості обертання</text>
    <text x="25" y="47" font-size="12" fill="#6b7280">• ПІ-фільтр другого порядку ефективно пригнічує високочастотний шум квантування АЦП та нелінійні гармоніки сенсора</text>
  </g>
</svg>
