<svg xmlns="http://www.w3.org/2000/svg" width="920" height="270" viewBox="0 0 920 270">
<rect width="920" height="270" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тридцять років до синього — і світло змінилося</text>
<text x="83.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1960-ті</text>
<rect x="14.0" y="88.0" width="138.0" height="116.0" rx="8" fill="#fbfbfb" stroke="#c9d3dc" stroke-width="1.6"/>
<text x="83.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">червоний і зелений</text>
<text x="83.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">світлодіоди готові</text>
<text x="83.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(§2.5.7)</text>
<line x1="153.0" y1="146.0" x2="165.0" y2="146.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<text x="235.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1960–80-ті</text>
<rect x="166.0" y="88.0" width="138.0" height="116.0" rx="8" fill="#fbeeee" stroke="#c9d3dc" stroke-width="1.6"/>
<text x="235.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">синій НЕ дається:</text>
<text x="235.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">GaN не вміють ні</text>
<text x="235.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вирощувати, ні легувати</text>
<line x1="305.0" y1="146.0" x2="317.0" y2="146.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<text x="387.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1986 · Нагоя</text>
<rect x="318.0" y="88.0" width="138.0" height="116.0" rx="8" fill="#eef6ef" stroke="#c9d3dc" stroke-width="1.6"/>
<text x="387.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Акасакі й Амано:</text>
<text x="387.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">якісний GaN</text>
<text x="387.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">на сапфірі</text>
<line x1="457.0" y1="146.0" x2="469.0" y2="146.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<text x="539.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1989 · Нагоя</text>
<rect x="470.0" y="88.0" width="138.0" height="116.0" rx="8" fill="#eef6ef" stroke="#c9d3dc" stroke-width="1.6"/>
<text x="539.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вони ж: p-тип GaN</text>
<text x="539.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(магній + промінь)</text>
<text x="539.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">— остання цеглина</text>
<line x1="609.0" y1="146.0" x2="621.0" y2="146.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<text x="691.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1993–94 · Nichia</text>
<rect x="622.0" y="88.0" width="138.0" height="116.0" rx="8" fill="#e9eefb" stroke="#c9d3dc" stroke-width="1.6"/>
<text x="691.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Накамура: ЯСКРАВИЙ</text>
<text x="691.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">синій на InGaN —</text>
<text x="691.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">у виробництво</text>
<line x1="761.0" y1="146.0" x2="773.0" y2="146.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<text x="843.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2014</text>
<rect x="774.0" y="88.0" width="138.0" height="116.0" rx="8" fill="#f4eef6" stroke="#c9d3dc" stroke-width="1.6"/>
<text x="843.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Нобель з фізики</text>
<text x="843.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">трьом — за світло,</text>
<text x="843.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">що змінило побут</text>
<text x="460.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Червоний світив із 1960-х; на синій — найенергійніший видимий фотон — пішло ще тридцять років.</text>
</svg>
