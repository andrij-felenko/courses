<text x="430.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Так десяток ніжок керує сотнею світлодіодів — годинники, брелоки, LED-кільця там, де ніжок обмаль.</text>
