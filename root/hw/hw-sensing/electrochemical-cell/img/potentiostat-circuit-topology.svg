<line x1="815.0" y1="215.0" x2="830.0" y2="215.0" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="835.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start" font-weight="700">V_out → АЦП</text>
<rect x="50.0" y="360.0" width="780.0" height="85.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="440.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Основні інваріанти схеми потенціостата:</text>
<text x="440.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">1. V_RE стабілізується петлею CA на рівні V_bias відносно WE (I_RE = 0 pA, тому нема IR-падіння).</text>
<text x="440.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle">2. TIA утримує WE на потенціалі V_ref. Вихідна напруга: V_out = V_ref ± I_WE · R_f.</text>
</svg>