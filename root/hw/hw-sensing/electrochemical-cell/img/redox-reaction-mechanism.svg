<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кінетика реакцій на трифазній межі розділу фаз (газ / каталізатор / електроліт)</text>
<rect x="24.0" y="50.0" width="395.0" height="350.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/>
<text x="221.5" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">Окиснення CO (Робочий електрод WE)</text>
<text x="221.5" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">CO + H₂O → CO₂ + 2H⁺ + 2e⁻  (n = 2)</text>
<rect x="44.0" y="110.0" width="355.0" height="170.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="44.0" y="110.0" width="355.0" height="45.0" rx="6" fill="#fef9c3" stroke="#fde047" stroke-width="1.0"/>
<text x="221.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle">Газова фаза: молекули CO дифундують крізь пори</text>
<rect x="44.0" y="155.0" width="355.0" height="30.0" rx="6" fill="#334155" stroke="#1e293b" stroke-width="1.0"/>
<text x="221.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Твердий каталізатор (Pt-чорнь) — провідник електронів</text>
<rect x="44.0" y="185.0" width="355.0" height="95.0" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.0"/>
<text x="221.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">Рідкий електроліт (H₂SO₄ / H₂O) — провідник іонів H⁺</text>
<line x1="114.0" y1="145.0" x2="114.0" y2="165.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="114.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">CO</text>
<line x1="144.0" y1="170.0" x2="204.0" y2="170.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="174.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">2e⁻ → коло</text>
<line x1="114.0" y1="185.0" x2="114.0" y2="230.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="144.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">2H⁺ (в розчин)</text>
<line x1="294.0" y1="170.0" x2="294.0" y2="135.0" stroke="#1e293b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="294.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">CO₂ (вихід)</text>
<rect x="39.0" y="309.5" width="365.0" height="61.0" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/><text x="221.5" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="221.5" dy="0.0">Реакція на протилежному CE (відновлення кисню):</tspan><tspan x="221.5" dy="13.0">½O₂ + 2H⁺ + 2e⁻ → H₂O</tspan><tspan x="221.5" dy="13.0">Сумарно: CO + ½O₂ → CO₂ (мікропаливний елемент).</tspan><tspan x="221.5" dy="13.0">Струм виходить з WE у зовнішнє коло (I_WE &gt; 0).</tspan></text>
<rect x="441.0" y="50.0" width="395.0" height="350.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/>
<text x="638.5" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Відновлення O₂ або NO₂ (Катодний процес)</text>
<text x="638.5" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">O₂ + 4H⁺ + 4e⁻ → 2H₂O  або  NO₂ + 2H⁺ + 2e⁻ → NO + H₂O</text>
<rect x="461.0" y="110.0" width="355.0" height="170.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="461.0" y="110.0" width="355.0" height="45.0" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="638.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">Газова фаза: O₂ або NO₂ дифундує до каталізатора</text>
<rect x="461.0" y="155.0" width="355.0" height="30.0" rx="6" fill="#334155" stroke="#1e293b" stroke-width="1.0"/>
<text x="638.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Твердий каталізатор (Pt / Au) під негативним зміщенням</text>
<rect x="461.0" y="185.0" width="355.0" height="95.0" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.0"/>
<text x="638.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">Електроліт постачає іони H⁺ або OH⁻</text>
<line x1="531.0" y1="145.0" x2="531.0" y2="165.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="531.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">O₂</text>
<line x1="661.0" y1="170.0" x2="591.0" y2="170.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="626.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">4e⁻ з кола</text>
<line x1="531.0" y1="245.0" x2="531.0" y2="195.0" stroke="#15803d" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="566.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">4H⁺ (споживаються)</text>
<line x1="721.0" y1="185.0" x2="721.0" y2="235.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="721.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">2H₂O утворюється</text>
<rect x="456.0" y="309.5" width="365.0" height="61.0" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="638.5" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="638.5" dy="0.0">Реакція на протилежному CE (окиснення води):</tspan><tspan x="638.5" dy="13.0">2H₂O → O₂ + 4H⁺ + 4e⁻</tspan><tspan x="638.5" dy="13.0">Потребує негативного зміщення V_bias (наприклад, −600 мВ).</tspan><tspan x="638.5" dy="13.0">Струм входить у WE із зовнішнього кола (I_WE &lt; 0).</tspan></text>
</svg>