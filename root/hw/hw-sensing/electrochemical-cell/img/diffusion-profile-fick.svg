<svg xmlns="http://www.w3.org/2000/svg" viewBox="-35.98 -10 875.98 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-35.98" y="-10" width="875.98" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дифузійне обмеження швидкості: профіль концентрації газу в капілярі</text>
<rect x="90.0" y="70.0" width="420.0" height="240.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<line x1="90.0" y1="250.0" x2="510.0" y2="250.0" stroke="#f1f5f9" stroke-width="1.0"/>
<line x1="90.0" y1="190.0" x2="510.0" y2="190.0" stroke="#f1f5f9" stroke-width="1.0"/>
<line x1="90.0" y1="130.0" x2="510.0" y2="130.0" stroke="#f1f5f9" stroke-width="1.0"/>
<line x1="90.0" y1="70.0" x2="510.0" y2="70.0" stroke="#f1f5f9" stroke-width="1.0"/>
<line x1="90.0" y1="310.0" x2="530.0" y2="310.0" stroke="#1e293b" stroke-width="1.8"/>
<line x1="530.0" y1="310.0" x2="545.0" y2="310.0" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="535.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Відстань у капілярі (x)</text>
<line x1="90.0" y1="310.0" x2="90.0" y2="55.0" stroke="#1e293b" stroke-width="1.8"/>
<line x1="90.0" y1="55.0" x2="90.0" y2="45.0" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="75.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="end" font-weight="700">Концентрація C(x)</text>
<line x1="90.0" y1="310.0" x2="90.0" y2="316.0" stroke="#1e293b" stroke-width="1.5"/>
<text x="90.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">x = 0 (Повітря)</text>
<line x1="510.0" y1="310.0" x2="510.0" y2="316.0" stroke="#1e293b" stroke-width="1.5"/>
<text x="510.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">x = δ (Каталізатор WE)</text>
<line x1="90.0" y1="110.0" x2="510.0" y2="310.0" stroke="#c0392b" stroke-width="3.0"/>
<circle cx="90.0" cy="110.0" r="5.0" fill="#c0392b" stroke="#1e293b" stroke-width="1.5"/>
<text x="100.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">C_bulk (зовнішня концентрація газу)</text>
<circle cx="510.0" cy="310.0" r="5.0" fill="#d97706" stroke="#1e293b" stroke-width="1.5"/>
<text x="495.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="end" font-weight="700">C_surface ≈ 0</text>
<rect x="90.0" y="345.0" width="420.0" height="30.0" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="300.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle">Капілярний бар'єр завдовжки δ (дифузійний опір R_diff = δ / (D·A))</text>
<rect x="540.0" y="70.0" width="275.0" height="295.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/>
<text x="677.5" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Виведення струму комірки</text>
<rect x="550.0" y="129.8" width="255.0" height="190.3" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="677.5" y="146.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="677.5" dy="0.0">1. Закон дифузії Фіка:</tspan><tspan x="677.5" dy="13.7">J = -D · (dC/dx) = D · C_bulk / δ</tspan><tspan x="677.5" dy="13.7"></tspan><tspan x="677.5" dy="13.7">2. Закон Фарадея:</tspan><tspan x="677.5" dy="13.7">I = n · F · A · J</tspan><tspan x="677.5" dy="13.7"></tspan><tspan x="677.5" dy="13.7">3. Граничний струм:</tspan><tspan x="677.5" dy="13.7">I = (n·F·A·D / δ) · C_bulk</tspan><tspan x="677.5" dy="13.7"></tspan><tspan x="677.5" dy="13.7">ВИСНОВОК:</tspan><tspan x="677.5" dy="13.7">Оскільки n, F, A, D, δ — сталі,</tspan><tspan x="677.5" dy="13.7">струм I СТРОГО ЛІНІЙНИЙ</tspan><tspan x="677.5" dy="13.7">до концентрації газу C_bulk!</tspan></text>
</svg>