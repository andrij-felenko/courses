<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="16.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішня будова амперометричної триелектродної газової комірки</text>
<rect x="50.0" y="75.0" width="440.0" height="375.0" rx="10" fill="#f8fafc" stroke="#333333" stroke-width="2.0"/>
<rect x="240.0" y="50.0" width="60.0" height="25.0" rx="3" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/>
<line x1="270.0" y1="33.0" x2="270.0" y2="50.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="270.0" y="27.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Аналізований газ (CO, O₂, NO₂)</text>
<rect x="90.0" y="95.0" width="360.0" height="18.0" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.2"/>
<text x="270.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle">Гідрофобна пориста PTFE-мембрана</text>
<rect x="90.0" y="120.0" width="360.0" height="22.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="270.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">Робочий електрод (WE): Pt-чорнь / каталізатор</text>
<rect x="100.0" y="155.0" width="340.0" height="35.0" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="270.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">Селективний хімічний фільтр (поглинач SO₂, H₂S, VOC)</text>
<rect x="80.0" y="205.0" width="380.0" height="195.0" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="270.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Рідкий кислотний електроліт (H₂SO₄) у пористому ґноті</text>
<rect x="110.0" y="255.0" width="320.0" height="22.0" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="270.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">Електрод порівняння (RE): стабільний потенціал (I = 0)</text>
<rect x="110.0" y="330.0" width="320.0" height="22.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="270.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Допоміжний електрод (CE): балансує струм комірки</text>
<line x1="130.0" y1="142.0" x2="130.0" y2="470.0" stroke="#d97706" stroke-width="2.0"/>
<circle cx="130.0" cy="470.0" r="5.0" fill="#d97706" stroke="#333333" stroke-width="1.5"/>
<text x="130.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">WE</text>
<line x1="270.0" y1="277.0" x2="270.0" y2="470.0" stroke="#15803d" stroke-width="2.0"/>
<circle cx="270.0" cy="470.0" r="5.0" fill="#15803d" stroke="#333333" stroke-width="1.5"/>
<text x="270.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">RE</text>
<line x1="410.0" y1="352.0" x2="410.0" y2="470.0" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="410.0" cy="470.0" r="5.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<text x="410.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">CE</text>
<rect x="525.0" y="75.0" width="310.0" height="375.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="680.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Функції електродів</text>
<rect x="540.0" y="121.3" width="280.0" height="63.4" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="680.0" y="136.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">WE (Робочий електрод):</tspan><tspan x="680.0" dy="13.7">Трикапілярна межа газ/метал/рідина.</tspan><tspan x="680.0" dy="13.7">Тут іде окиснення CO чи відновлення O₂.</tspan><tspan x="680.0" dy="13.7">Струм I_WE строго ∝ концентрації газу.</tspan></text>
<rect x="540.0" y="211.3" width="280.0" height="63.4" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="680.0" y="226.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">RE (Електрод порівняння):</tspan><tspan x="680.0" dy="13.7">Неполяризовний електрод з фіксованим</tspan><tspan x="680.0" dy="13.7">потенціалом рівноваги. Струм у RE = 0,</tspan><tspan x="680.0" dy="13.7">тому падіння I·R на ньому немає.</tspan></text>
<rect x="536.3" y="301.3" width="287.3" height="63.4" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="680.0" y="316.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">CE (Допоміжний електрод):</tspan><tspan x="680.0" dy="13.7">Замикає струмове коло в електроліті.</tspan><tspan x="680.0" dy="13.7">Потенціостат жене через CE струм I_CE = -I_WE,</tspan><tspan x="680.0" dy="13.7">утримуючи напругу між WE та RE стабільною.</tspan></text>
<rect x="540.0" y="392.0" width="280.0" height="46.0" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="680.0" y="405.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Дифузійне обмеження:</tspan><tspan x="680.0" dy="13.0">Швидкість реакції на каталізаторі &gt;&gt; дифузії.</tspan><tspan x="680.0" dy="13.0">Тому струм лінійно пропорційний [Газу].</tspan></text>
</svg>