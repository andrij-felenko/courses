<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Калібрування проти повірки: вимірювання проти оцінки відповідності</text>
<text x="430.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">калібрування знаходить функцію й невизначеність; повірка виносить юридичний вердикт допуску</text>
<line x1="430.0" y1="70.0" x2="430.0" y2="335.0" stroke="#dcdcdc" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="103.2" y="68.0" width="233.6" height="53.9" rx="6" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/><text x="220.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Калібрування (Calibration)</tspan><tspan x="220.0" dy="16.9">ISO/IEC 17025</tspan></text>
<rect x="45.0" y="140.0" width="350.0" height="185.0" rx="6" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/>
<text x="60.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• Визначає фактичний відгук y = f(x)</text>
<text x="60.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Розраховує зміщення: Δ(x) = y_вим − x_етал</text>
<text x="60.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Оцінює розширену невизначеність: U(k=2)</text>
<text x="60.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Видає: Калібрувальний сертифікат з таблицею</text>
<text x="60.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2980b9" text-anchor="start" font-weight="700">• Результат: математична модель поправки</text>
<text x="60.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">НЕ виносить вердикту «придатний / непридатний»</text>
<rect x="507.1" y="68.0" width="265.8" height="53.9" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="640.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Повірка / Оцінка відповідності</tspan><tspan x="640.0" dy="16.9">Verification / Legal Metrology</tspan></text>
<rect x="465.0" y="140.0" width="350.0" height="185.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="480.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• Порівнює похибку з допуском: |Δ| ≤ MPE</text>
<text x="480.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Враховує правила прийняття рішень (ILAC-G8)</text>
<text x="480.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Застосовує захисні смуги проти хибного ризику</text>
<text x="480.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Видає: Свідоцтво про повірку або тавро</text>
<text x="480.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• Результат: Бінарне рішення (Pass / Fail)</text>
<text x="480.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">Юридичний дозвіл на комерційне використання</text>
</svg>