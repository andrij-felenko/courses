<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг метрологічної простежуваності (Traceability Chain)</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">від фундаментальних квантових констант SI до робочих цехових приладів</text>
<rect x="140.0" y="75.0" width="610.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<text x="155.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Визначення SI та квантові еталони</text>
<text x="155.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Константи h, e, c, Δν_Cs • ефект Джозефсона (KJ), квантовий холлівський опір (RK)</text>
<rect x="625.0" y="85.0" width="115.0" height="24.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="682.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">u ~ 10⁻⁸–10⁻¹⁰</text>
<line x1="445.0" y1="141.0" x2="445.0" y2="151.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="140.0" y="151.0" width="610.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#d35400" stroke-width="2.0"/>
<text x="155.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="start" font-weight="700">Національні метрологічні інститути (NMI)</text>
<text x="155.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">BIPM, NIST, PTB, Укрметртестстандарт • первинні лабораторні квантові системи</text>
<rect x="625.0" y="161.0" width="115.0" height="24.0" rx="4" fill="#ffffff" stroke="#d35400" stroke-width="1.2"/>
<text x="682.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">u ~ 10⁻⁷–10⁻⁸</text>
<line x1="445.0" y1="217.0" x2="445.0" y2="227.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="140.0" y="227.0" width="610.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#2980b9" stroke-width="2.0"/>
<text x="155.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2980b9" text-anchor="start" font-weight="700">Акредитовані калібрувальні лабораторії (ISO/IEC 17025)</text>
<text x="155.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Опорні міри напруги (Fluke 732B/C, LTZ1000), прецизійні міри опору (Thomas 1 Ω)</text>
<rect x="625.0" y="237.0" width="115.0" height="24.0" rx="4" fill="#ffffff" stroke="#2980b9" stroke-width="1.2"/>
<text x="682.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2980b9" text-anchor="middle" font-weight="700">u ~ 10⁻⁶ (ppm)</text>
<line x1="445.0" y1="293.0" x2="445.0" y2="303.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="140.0" y="303.0" width="610.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/>
<text x="155.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Робочі еталони та цехові калібратори</text>
<text x="155.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Прецизійні мультиметри 8.5 розрядів (3458A), калібратори (Fluke 5730A)</text>
<rect x="625.0" y="313.0" width="115.0" height="24.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="682.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">u ~ 10–50 ppm</text>
<line x1="445.0" y1="369.0" x2="445.0" y2="379.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="140.0" y="379.0" width="610.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="155.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Робочі вимірювальні прилади та кінцеві давачі</text>
<text x="155.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Промислові давачі (4–20 мА, I2C/SPI), щитові вольтметри, вбудовані АЦП</text>
<rect x="625.0" y="389.0" width="115.0" height="24.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="682.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">u ~ 0.1%–1%</text>
<line x1="75.0" y1="80.0" x2="75.0" y2="435.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="75.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Калібрування ↓</text>
<text x="75.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Передача міри</text>
<line x1="805.0" y1="435.0" x2="805.0" y2="80.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="805.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Невизначеність</text>
<text x="805.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">U зростає ↑</text>
</svg>