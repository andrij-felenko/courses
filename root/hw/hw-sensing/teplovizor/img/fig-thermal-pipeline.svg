<text x="460.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Готовий потік для виведення на екран, тепловізійного машинного бачення та радіометричного вимірювання</text>
