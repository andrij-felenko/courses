<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="880.0" height="460.0" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
<rect x="30.0" y="40.0" width="360.0" height="400.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="210.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Матриця у фокальній площині (FPA)</text>
<rect x="50.0" y="90.0" width="320.0" height="150.0" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<text x="210.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">Активний піксель (R_pix, підвішений VOx)</text>
<text x="210.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">Отримує P_rad від сцени, нагрівається на ΔT</text>
<rect x="130.0" y="155.0" width="160.0" height="35.0" rx="3" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
<text x="210.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">R_pix(T) = R0 · [1 + α·ΔT]</text>
<text x="210.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Ключ рядкового вибору (Row Switch, t_int ≈ 50 мкс)</text>
<rect x="50.0" y="260.0" width="320.0" height="160.0" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="210.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#3730a3" text-anchor="middle" font-weight="700">Сліпий еталонний піксель (Blind Bolometer)</text>
<text x="210.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#312e81" text-anchor="middle">Екранований від ІЧ-випромінювання Al-шаром</text>
<text x="210.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#312e81" text-anchor="middle">Термозв'язаний з кремнієвою підкладкою (T_sub)</text>
<rect x="130.0" y="345.0" width="160.0" height="35.0" rx="3" fill="#ffffff" stroke="#4338ca" stroke-width="1.2"/>
<text x="210.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#3730a3" text-anchor="middle" font-weight="700">R_blind(T_sub) ≈ R0(T_sub)</text>
<text x="210.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#4338ca" text-anchor="middle">Компенсує підкладковий дрейф і самонагрів</text>
<line x1="370.0" y1="165.0" x2="450.0" y2="165.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="410.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">I_act</text>
<line x1="370.0" y1="340.0" x2="450.0" y2="235.0" stroke="#4338ca" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="398.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4338ca" text-anchor="middle" font-weight="700">I_blind</text>
<rect x="450.0" y="40.0" width="420.0" height="400.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<text x="660.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#14532d" text-anchor="middle" font-weight="700">Колоночний тракт зчитування (ROIC Column Unit)</text>
<rect x="470.0" y="90.0" width="380.0" height="170.0" rx="4" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
<text x="660.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">Диференційний інтегратор заряду CTIA</text>
<text x="660.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle">Віднімає базовий струм підкладки: ΔI = I_act − I_blind</text>
<rect x="540.0" y="155.0" width="240.0" height="45.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="660.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle" font-weight="700">Інтегруючий конденсатор C_int</text>
<text x="660.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle">V_out = (1 / C_int) · ∫ ΔI(t) dt</text>
<text x="660.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#4b5563" text-anchor="middle">Імпульсне зміщення V_bias синхронно з ключем скидання RST</text>
<line x1="660.0" y1="260.0" x2="660.0" y2="290.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="470.0" y="290.0" width="380.0" height="60.0" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
<text x="660.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0369a1" text-anchor="middle" font-weight="700">Корельована подвійна вибірка (CDS) та S&amp;H</text>
<text x="660.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="middle">Усуває шум скидання інтегратора kTC та 1/f зміщення</text>
<line x1="660.0" y1="350.0" x2="660.0" y2="375.0" stroke="#0284c7" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="470.0" y="375.0" width="380.0" height="50.0" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
<text x="660.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">14-бітний / 16-бітний колоночний АЦП (Raw DN)</text>
</svg>