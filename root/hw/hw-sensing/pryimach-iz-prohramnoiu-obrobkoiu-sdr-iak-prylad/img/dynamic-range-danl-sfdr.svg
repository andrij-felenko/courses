<rect x="100.0" y="395.0" width="780.0" height="38.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="490.0" y="411.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Зменшення смуги RBW у 10 разів знижує рівень шуму DANL на 10 dB: DANL = -174 dBm/Hz + NF + 10·log₁₀(RBW).</tspan><tspan x="490.0" dy="12.3">Максимальний корисний сигнал обмежений точкою 1 dB компресії LNA та межею 0 dBFS АЦП.</tspan></text>
