<text x="630.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">e_sat(T) — лінія насичення (100 % RH)</text>
