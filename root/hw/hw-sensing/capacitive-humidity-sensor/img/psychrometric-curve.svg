<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 889.76 432" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="889.76" height="432" fill="#ffffff"/>
