<rect x="91.9" y="380.0" width="656.1" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="400.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">RH = e / e_sat(T). Охолодження повітря до T_dew призводить до 100 % RH і випадання конденсату</tspan></text>
