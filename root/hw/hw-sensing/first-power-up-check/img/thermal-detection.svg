<rect x="275.0" y="195.0" width="30.0" height="30.0" rx="2" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="290.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Суха пляма!</text>
<text x="290.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">P = I²·R &gt; 0.5 Вт</text>
<text x="245.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Тонкий шар IPA наноситься пензликом. При подачі струму 100–300 мА</tspan><tspan x="245.0" dy="12.8">дефектний елемент розігрівається (&gt;50 °C) і спирт над ним миттєво висихає.</tspan></text>
