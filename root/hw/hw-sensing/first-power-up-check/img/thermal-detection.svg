<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Локалізація несправності: випаровування ізопропілового спирту (IPA) та тепловізор</text>
