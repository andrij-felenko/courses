<text x="695.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d5dbdb" text-anchor="middle"><tspan x="695.0" dy="0.0">Мікроболометрична матриця фіксує перегрів мікросхеми в стані latch-up,</tspan><tspan x="695.0" dy="12.8">пробитого діода чи помилково запаяного LDO стабілізатора.</tspan></text>
