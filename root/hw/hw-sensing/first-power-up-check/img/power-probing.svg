<text x="695.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">При постійному струмі I = 100 мА кожен сантиметр доріжки дає спад напруги.</tspan><tspan x="695.0" dy="12.8">Рухаємося щупами: напруга ПАДАЄ до мінімуму (0 мВ) точно в точці закоротки!</tspan></text>
