<text x="240.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Норма: ємнісний заряд C_block -&gt; опір плавно росте від сотен Ом до кОм/МОм.</tspan><tspan x="240.0" dy="12.3">Коротке замикання: стабільні 0.0–0.8 Ω (звуковий сигнал зумера).</tspan></text>
