<rect x="513.1" y="69.0" width="253.7" height="82.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="87.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Принцип Guard Ring:</tspan><tspan x="640.0" dy="13.0">• Кільце з'єднане з +IN (0 В вірт. землі)</tspan><tspan x="640.0" dy="13.0">• ΔV між Guard і −IN = V_os ≈ 0 мВ</tspan><tspan x="640.0" dy="13.0">• Струм витоку I_leak = 0 / R_pcb = 0 пА!</tspan><tspan x="640.0" dy="13.0">• Струми від шин V± стікають у Guard</tspan></text>
<rect x="516.0" y="184.0" width="248.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="640.0" y="202.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Правила монтажу:</tspan><tspan x="640.0" dy="13.0">• Зняти паяльну маску над кільцем</tspan><tspan x="640.0" dy="13.0">• Відмивання залишків флюсу (IPA)</tspan><tspan x="640.0" dy="13.0">• Тефлонові стійки (PTFE) при I &lt; 100 фА</tspan><tspan x="640.0" dy="13.0">• Резистор Rf безпосередньо над кільцем</tspan></text>
