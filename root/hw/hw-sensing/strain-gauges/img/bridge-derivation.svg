<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вивід V_вих: різниця двох дільників</text>
<line x1="210.0" y1="90.0" x2="320.0" y2="200.0" stroke="#333333" stroke-width="2.0"/>
<line x1="320.0" y1="200.0" x2="210.0" y2="310.0" stroke="#333333" stroke-width="2.0"/>
<line x1="210.0" y1="310.0" x2="100.0" y2="200.0" stroke="#333333" stroke-width="2.0"/>
<line x1="100.0" y1="200.0" x2="210.0" y2="90.0" stroke="#333333" stroke-width="2.0"/>
<rect x="133.0" y="133.0" width="44.0" height="24.0" rx="6" fill="#eef3f9" stroke="#333333" stroke-width="1.8"/><text x="155.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">R₁</text>
<rect x="133.0" y="243.0" width="44.0" height="24.0" rx="6" fill="#eef3f9" stroke="#333333" stroke-width="1.8"/><text x="155.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">R₂</text>
<rect x="243.0" y="133.0" width="44.0" height="24.0" rx="6" fill="#eef3f9" stroke="#333333" stroke-width="1.8"/><text x="265.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">R₃</text>
<rect x="243.0" y="243.0" width="44.0" height="24.0" rx="6" fill="#eef3f9" stroke="#333333" stroke-width="1.8"/><text x="265.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">R₄</text>
<circle cx="210.0" cy="86.0" r="8.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="210.0" y="89.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="210.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">V_зб</text>
<text x="210.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">GND</text>
<circle cx="100.0" cy="200.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="84.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">A</text>
<circle cx="320.0" cy="200.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="336.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">B</text>
<text x="210.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">V_вих = V_A − V_B</text>
<text x="210.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(різниця)</text>
<text x="585.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">кожна половина — дільник напруги</text>
<rect x="420.0" y="84.0" width="330.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="585.0" y="105.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">V_A = V_зб · R₂ / (R₁ + R₂)</tspan></text>
<rect x="420.0" y="124.0" width="330.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="585.0" y="145.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">V_B = V_зб · R₄ / (R₃ + R₄)</tspan></text>
<text x="585.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">віднімаємо — точна формула моста:</text>
<rect x="420.0" y="198.0" width="330.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="585.0" y="213.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">V_вих     R₂·R₃ − R₁·R₄</tspan><tspan x="585.0" dy="16.9">──── = ──────────────</tspan><tspan x="585.0" dy="16.9">V_зб    (R₁+R₂)(R₃+R₄)</tspan></text>
<text x="585.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">у спокої R₁·R₄ = R₂·R₃ → V_вих = 0</text>
<rect x="40.0" y="320.0" width="700.0" height="92.0" rx="8" fill="#fffaf0" stroke="#b8860b" stroke-width="1.4"/>
<text x="390.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">чвертьміст (активне лише R₁ = R+ΔR, решта = R):</text>
<text x="390.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">V_вих / V_зб =  (1/4)·(ΔR/R)  ·  1 / (1 + ½·ΔR/R)</text>
<text x="255.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">лінійний відгук</text>
<text x="560.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">нелінійний доважок (звідси похибка)</text>
</svg>