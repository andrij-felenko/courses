<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Діагностика відмов та сценарії закупорювання трубки Піто</text>
<rect x="30.0" y="52.0" width="780.0" height="365.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="50.0" y="75.0" width="240.0" height="320.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.8"/>
<rect x="50.0" y="75.0" width="240.0" height="42.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="170.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Сценарій 1:</tspan><tspan x="170.0" dy="14.3">Забитий ніс, дренаж ВІДКРИТИЙ</tspan></text>
<text x="62.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="700">Причина:</text>
<text x="62.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Лід / комаха вхідного отвору P_tot</text>
<text x="62.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="700">Фізика:</text>
<text x="62.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Повітря стікає через дренаж</text>
<text x="62.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="700">Тиск:</text>
<text x="62.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">P_вхід стравлюється до P_stat</text>
<text x="62.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="700">ΔP давача:</text>
<text x="62.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ΔP → 0 Па</text>
<text x="62.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="700">Показ швидкості:</text>
<text x="62.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">IAS стрімко падає до 0</text>
<text x="62.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="700">Небезпека:</text>
<text x="62.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Автопілот дає повний газ,</text>
<text x="62.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">розганяючи літак до руйнування</text>
<rect x="300.0" y="75.0" width="240.0" height="320.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
<rect x="300.0" y="75.0" width="240.0" height="42.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
<text x="420.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Сценарій 2:</tspan><tspan x="420.0" dy="14.3">Забитий ніс І дренаж (Пастка)</tspan></text>
<text x="312.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="700">Причина:</text>
<text x="312.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Повне обмерзання / замерзла вода</text>
<text x="312.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="700">Фізика:</text>
<text x="312.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Тиск P_tot замкнений у трубці</text>
<text x="312.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="700">У наборі висоти:</text>
<text x="312.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">P_stat падає, а P_tot лишається</text>
<text x="312.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="700">ΔP давача:</text>
<text x="312.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ΔP = P_tot(замк) − P_stat(h) ↑ РОСТЕ</text>
<text x="312.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="700">Показ швидкості:</text>
<text x="312.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">IAS зростає при наборі висоти!</text>
<text x="312.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="700">Небезпека:</text>
<text x="312.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Трубка стає фальшивим</text>
<text x="312.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">висотоміром; пілот задирає ніс</text>
<rect x="550.0" y="75.0" width="240.0" height="320.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/>
<rect x="550.0" y="75.0" width="240.0" height="42.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/>
<text x="670.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">Сценарій 3:</tspan><tspan x="670.0" dy="14.3">Забиті СТАТИЧНІ отвори</tspan></text>
<text x="562.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="700">Причина:</text>
<text x="562.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Лід на бортах / заклеєні порти</text>
<text x="562.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="700">Фізика:</text>
<text x="562.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">P_stat замкнений на рівні землі</text>
<text x="562.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="700">У наборі висоти:</text>
<text x="562.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">P_stat(замк) &gt; P_stat(реальний)</text>
<text x="562.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="700">ΔP давача:</text>
<text x="562.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ΔP занижується при наборі</text>
<text x="562.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="700">Показ швидкості:</text>
<text x="562.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">IAS показує менше за реальну</text>
<text x="562.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="700">У зниженні:</text>
<text x="562.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">IAS завищується (небезпека</text>
<text x="562.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">перевищення V_ne)</text>
</svg>