<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360">
<rect width="860" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="430.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як налаштувати: спершу межа струму, потім напруга</text>
<text x="430.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">виставити струмову межу на закорочених клемах, тоді розімкнути й виставити напругу</text>
<circle cx="100.0" cy="110.0" r="18.0" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="100.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="130.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Напругу на 0,</text>
<text x="130.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">клеми ЗАКОРОТИТИ</text>
<text x="130.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">блок одразу в CC</text>
<line x1="285.0" y1="110.0" x2="325.0" y2="110.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<circle cx="360.0" cy="110.0" r="18.0" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="360.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<text x="390.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Виставити МЕЖУ</text>
<text x="390.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">струму регулятором I</text>
<text x="390.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">дисплей показує</text>
<text x="390.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">потрібні А</text>
<line x1="545.0" y1="110.0" x2="585.0" y2="110.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<circle cx="620.0" cy="110.0" r="18.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="620.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<text x="650.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Розімкнути клеми,</text>
<text x="650.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">виставити напругу</text>
<text x="650.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">блок у CV —</text>
<text x="650.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">готово</text>
<rect x="90.0" y="230.0" width="680.0" height="96.0" rx="10" fill="#f7f7f7" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="430.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">А далі індикатори кажуть правду про режим:</text>
<circle cx="250.0" cy="286.0" r="9.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="268.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">CV горить → тримає напругу (норма)</text>
<circle cx="250.0" cy="312.0" r="9.0" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="268.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">CC горить → уперлось у струм (перевантаження чи зарядка)</text>
</svg>
