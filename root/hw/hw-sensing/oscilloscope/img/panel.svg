<text x="664.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">3. зв'язок DC (рівні) або</text>
