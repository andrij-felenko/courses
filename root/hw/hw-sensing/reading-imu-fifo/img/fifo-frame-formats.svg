<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формати кадрів даних у буфері FIFO інерційних сенсорів</text>
<text x="470.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Порівняння структури пакетів: фіксований, заголовковий та тегований формати</text>
<rect x="30.0" y="70.0" width="880.0" height="115.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Фіксований беззаголовковий кадр (MPU-6050, 14 байт):</text>
<text x="50.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Будь-яка втрата байта призводить до перманентного зсуву всіх наступних осей до скидання FIFO</text>
<rect x="50.0" y="125.0" width="100.0" height="42.0" rx="6" fill="#e0f2fe" stroke="#1e40af" stroke-width="1.5"/><text x="100.0" y="143.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">Accel X [H:L]</tspan><tspan x="100.0" dy="11.7">2 байти</tspan></text>
<rect x="156.0" y="125.0" width="100.0" height="42.0" rx="6" fill="#e0f2fe" stroke="#1e40af" stroke-width="1.5"/><text x="206.0" y="143.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="206.0" dy="0.0">Accel Y [H:L]</tspan><tspan x="206.0" dy="11.7">2 байти</tspan></text>
<rect x="262.0" y="125.0" width="100.0" height="42.0" rx="6" fill="#e0f2fe" stroke="#1e40af" stroke-width="1.5"/><text x="312.0" y="143.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="312.0" dy="0.0">Accel Z [H:L]</tspan><tspan x="312.0" dy="11.7">2 байти</tspan></text>
<rect x="368.0" y="125.0" width="80.0" height="42.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="408.0" y="143.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="408.0" dy="0.0">Temp [H:L]</tspan><tspan x="408.0" dy="11.7">2 байти</tspan></text>
<rect x="454.0" y="125.0" width="100.0" height="42.0" rx="6" fill="#fef3c7" stroke="#caa24a" stroke-width="1.5"/><text x="504.0" y="143.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="504.0" dy="0.0">Gyro X [H:L]</tspan><tspan x="504.0" dy="11.7">2 байти</tspan></text>
<rect x="560.0" y="125.0" width="100.0" height="42.0" rx="6" fill="#fef3c7" stroke="#caa24a" stroke-width="1.5"/><text x="610.0" y="143.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Gyro Y [H:L]</tspan><tspan x="610.0" dy="11.7">2 байти</tspan></text>
<rect x="666.0" y="125.0" width="100.0" height="42.0" rx="6" fill="#fef3c7" stroke="#caa24a" stroke-width="1.5"/><text x="716.0" y="143.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="716.0" dy="0.0">Gyro Z [H:L]</tspan><tspan x="716.0" dy="11.7">2 байти</tspan></text>
<rect x="30.0" y="200.0" width="880.0" height="130.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Заголовковий пакет із 20-бітним розширенням (ICM-42688-P, 16 / 20 байт):</text>
<text x="50.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Байт заголовка визначає наявність сенсорів, валідність даних та дозволяє синхронізувати потік</text>
<rect x="50.0" y="255.0" width="65.0" height="44.0" rx="6" fill="#f3e8ff" stroke="#6b21a8" stroke-width="1.5"/><text x="82.5" y="274.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="82.5" dy="0.0">Header</tspan><tspan x="82.5" dy="11.7">1 байт</tspan></text>
<rect x="121.0" y="255.0" width="150.0" height="44.0" rx="6" fill="#e0f2fe" stroke="#1e40af" stroke-width="1.5"/><text x="196.0" y="274.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="196.0" dy="0.0">Accel X,Y,Z</tspan><tspan x="196.0" dy="11.7">6 байтів</tspan></text>
<rect x="277.0" y="255.0" width="150.0" height="44.0" rx="6" fill="#fef3c7" stroke="#caa24a" stroke-width="1.5"/><text x="352.0" y="274.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="352.0" dy="0.0">Gyro X,Y,Z</tspan><tspan x="352.0" dy="11.7">6 байтів</tspan></text>
<rect x="433.0" y="255.0" width="75.0" height="44.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="470.5" y="274.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.5" dy="0.0">Temp</tspan><tspan x="470.5" dy="11.7">1-2 байти</tspan></text>
<rect x="514.0" y="255.0" width="95.0" height="44.0" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/><text x="561.5" y="274.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="561.5" dy="0.0">Timestamp</tspan><tspan x="561.5" dy="11.7">2 байти</tspan></text>
<rect x="615.0" y="255.0" width="135.0" height="44.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.5"/><text x="682.5" y="274.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="682.5" dy="0.0">20-bit Ext (HiRes)</tspan><tspan x="682.5" dy="11.7">3 байти (опція)</tspan></text>
<rect x="30.0" y="345.0" width="880.0" height="120.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="50.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Тегований потоковий кадр (LSM6DSO / BMI270, змінний розмір):</text>
<text x="50.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Кожен пакет має 1-байтний Sensor Tag, що дозволяє асинхронно змішувати події, крокомір та IMU</text>
<rect x="50.0" y="400.0" width="85.0" height="44.0" rx="6" fill="#e0f2fe" stroke="#1e40af" stroke-width="1.5"/><text x="92.5" y="419.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="92.5" dy="0.0">TAG: Accel</tspan><tspan x="92.5" dy="11.7">(1 байт)</tspan></text>
<rect x="140.0" y="400.0" width="120.0" height="44.0" rx="6" fill="#e0f2fe" stroke="#1e40af" stroke-width="1.5"/><text x="200.0" y="419.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Accel [X,Y,Z]</tspan><tspan x="200.0" dy="11.7">6 байтів</tspan></text>
<rect x="265.0" y="400.0" width="85.0" height="44.0" rx="6" fill="#fef3c7" stroke="#caa24a" stroke-width="1.5"/><text x="307.5" y="419.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="307.5" dy="0.0">TAG: Gyro</tspan><tspan x="307.5" dy="11.7">(1 байт)</tspan></text>
