<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="800.0" height="340.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм цифрової компенсації: правильний шлях проти наївної помилки</text>
<rect x="30.0" y="55.0" width="360.0" height="255.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="210.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ХИБНИЙ ШЛЯХ (Наївне додавання)</text>
<text x="210.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">T_hot ≠ T_meas + T_cjc через нелінійність S(T)</text>
<rect x="96.3" y="118.8" width="227.5" height="22.5" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="210.0" y="133.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">1. Виміряли V_meas (напр. 19.644 мВ)</tspan></text>
<line x1="210.0" y1="148.0" x2="210.0" y2="170.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="78.6" y="167.5" width="262.8" height="35.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="210.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="210.0" dy="0.0">2. Перетворили V_meas у T_meas = f⁻¹(V_meas)</tspan><tspan x="210.0" dy="13.0">(отримали хибні 478.2 °C замість 500 °C)</tspan></text>
<line x1="210.0" y1="210.0" x2="210.0" y2="230.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="39.7" y="237.5" width="340.6" height="35.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">3. Додали: T = T_meas + T_cjc (478.2 + 25 = 503.2 °C)</tspan><tspan x="210.0" dy="13.0">ПОХИБКА: +3.2 °C (а для типу S/B — до 15...30 °C!)</tspan></text>
<rect x="430.0" y="55.0" width="360.0" height="255.0" rx="6" fill="#eaf6ec" stroke="#27ae60" stroke-width="1.5"/>
<text x="610.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ПРАВИЛЬНИЙ ШЛЯХ (Додавання ЕРС)</text>
<text x="610.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">Строго за стандартом NIST ITS-90</text>
<rect x="460.4" y="113.8" width="299.3" height="22.5" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="610.0" y="128.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">1. Читаємо V_meas (19.644 мВ) та T_cjc (25.0 °C)</tspan></text>
<line x1="610.0" y1="143.0" x2="610.0" y2="163.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="512.8" y="162.5" width="194.4" height="35.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="610.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="610.0" dy="0.0">2. Рахуємо ЕРС холодного спаю:</tspan><tspan x="610.0" dy="13.0">V_cjc = f_NIST(T_cjc) = 1.000 мВ</tspan></text>
<line x1="610.0" y1="205.0" x2="610.0" y2="225.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="457.5" y="236.9" width="304.9" height="36.1" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="251.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">3. V_total = V_meas + V_cjc = 20.644 мВ</tspan><tspan x="610.0" dy="13.7">4. T_hot = f_NIST⁻¹(V_total) = ТОЧНО 500.0 °C</tspan></text>
<text x="410.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Золоте правило термометрії: додавати можна лише потенціали (ЕРС), а не температури!</text>
</svg>