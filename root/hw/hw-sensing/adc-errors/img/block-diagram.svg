<text x="345.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">не залежить від VDD</text>
<line x1="730.0" y1="123.0" x2="730.0" y2="68.0" stroke="#333333" stroke-width="1.5"/>
<rect x="693.8" y="42.5" width="72.4" height="27.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="730.0" y="59.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">ALERT/RDY</tspan></text>
<text x="730.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">переривання / готовність</text>
<rect x="48.8" y="39.3" width="72.4" height="41.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="85.0" y="56.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="85.0" dy="0.0">VDD / GND</tspan><tspan x="85.0" dy="14.3">2.0–5.5 В</tspan></text>
<rect x="60.0" y="310.0" width="780.0" height="36.0" rx="6" fill="#f0f4ff" stroke="#6b7280" stroke-width="1.0"/>
<text x="450.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">На відміну від SAR §4.8.8: вимір диференційний (MUX бере пару), підсилення — ДО квантування, опорна — внутрішня й точна.</text>
