<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усередині ADS1115-класу: тракт сигналу</text>
<text x="450.0" y="47.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">MUX бере пару входів → PGA підсилює → дельта-сигма ядро дає 16-бітний код → I²C віддає МК</text>
<rect x="23.9" y="108.2" width="36.1" height="83.7" rx="6" fill="#eaf4fd" stroke="#2457d6" stroke-width="1.5"/><text x="42.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="42.0" dy="0.0">A0</tspan><tspan x="42.0" dy="16.9">A1</tspan><tspan x="42.0" dy="16.9">A2</tspan><tspan x="42.0" dy="16.9">A3</tspan></text>
<text x="42.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">4 аналогових
входи</text>
<rect x="147.1" y="123.0" width="75.9" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">Вхідний</tspan><tspan x="185.0" dy="16.9">MUX</tspan></text>
<text x="185.0" y="190.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">вибирає пару
входів</text>
<rect x="310.8" y="123.0" width="68.5" height="53.9" rx="6" fill="#fff3e0" stroke="#e67e22" stroke-width="1.5"/><text x="345.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">PGA</tspan><tspan x="345.0" dy="16.9">×1…×16</tspan></text>
<text x="345.0" y="190.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">програмоване
підсилення</text>
<rect x="470.1" y="124.2" width="119.8" height="51.6" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">ΔΣ модулятор</tspan><tspan x="530.0" dy="15.6">+ цифр. фільтр</tspan></text>
<text x="530.0" y="189.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">16-бітний код
(повільно, точно)</text>
<rect x="673.5" y="123.0" width="112.9" height="53.9" rx="6" fill="#f4eafb" stroke="#6b7280" stroke-width="1.5"/><text x="730.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Регістри</tspan><tspan x="730.0" dy="16.9">+ I²C логіка</tspan></text>
<text x="730.0" y="190.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">SDA / SCL / ADDR</text>
