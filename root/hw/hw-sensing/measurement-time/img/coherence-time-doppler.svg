<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Час когерентності каналу та доплерівське розширення</text>
<rect x="15.0" y="15.0" width="690.0" height="390.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="30.0" y="35.0" width="300.0" height="320.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="180.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Динамічний канал з розсіювачами</text>
<rect x="60.0" y="150.0" width="48.0" height="28.0" rx="4" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="84.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Rx (v)</text>
<line x1="108.0" y1="164.0" x2="150.0" y2="164.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="130.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">швидкість v</text>
<circle cx="270.0" cy="100.0" r="12.0" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="270.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Tx</text>
<rect x="230.0" y="220.0" width="32.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<text x="246.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">відбивач</text>
<line x1="260.0" y1="106.0" x2="108.0" y2="155.0" stroke="#27ae60" stroke-width="1.8"/>
<text x="190.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">прямий промінь (f₀ + f_d1)</text>
<line x1="265.0" y1="112.0" x2="246.0" y2="220.0" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="246.0" y1="220.0" x2="108.0" y2="170.0" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="190.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle">відбитий (f₀ - f_d2)</text>
<rect x="45.0" y="270.0" width="270.0" height="70.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="180.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Доплерівський розкид:</tspan><tspan x="180.0" dy="13.0">B_d = 2 × f_{d,max} = 2 × (v / λ)</tspan><tspan x="180.0" dy="13.0">Час когерентності каналу:</tspan><tspan x="180.0" dy="13.0">T_c ≈ 1 / B_d ≈ λ / (2 v)</tspan></text>
<rect x="350.0" y="35.0" width="340.0" height="320.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="520.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межа когерентного накопичення</text>
<line x1="370.0" y1="220.0" x2="665.0" y2="220.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="640.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Час T_int</text>
<line x1="500.0" y1="75.0" x2="500.0" y2="235.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 4"/>
<text x="500.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">T_int = T_c (час когерентності)</text>
<rect x="375.0" y="80.0" width="120.0" height="130.0" rx="0" fill="#ecfdf5" stroke="none" stroke-width="1.5"/>
<text x="435.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Зона 1: T_int &lt; T_c</text>
<text x="435.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Фаза стабільна</text>
<text x="435.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Виграш SNR ∼ T_int</text>
<text x="435.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Конструктивна
інтерференція</text>
<rect x="505.0" y="80.0" width="150.0" height="130.0" rx="0" fill="#fef2f2" stroke="none" stroke-width="1.5"/>
<text x="580.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Зона 2: T_int &gt; T_c</text>
<text x="580.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Фази променів обертаються</text>
<text x="580.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Вектори віднімаються!</text>
<text x="580.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">SNR падає,
сигнал гасне</text>
<rect x="365.0" y="275.0" width="310.0" height="65.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="520.0" y="298.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Правило проектування:</tspan><tspan x="520.0" dy="11.7">Когерентне вікно T_coh НЕ повинно перевищувати T_c.</tspan><tspan x="520.0" dy="11.7">Для більшого T_meas застосовують некогерентні блоки.</tspan></text>
<rect x="30.0" y="378.0" width="660.0" height="26.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="394.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Час когерентності каналу T_c обмежує тривалість неперервного когерентного накопичення в динамічному середовищі.</tspan></text>
</svg>