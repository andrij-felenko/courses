<rect x="550.0" y="110.0" width="190.0" height="240.0" rx="6" fill="#fdfbf7" stroke="#dcd6cd" stroke-width="1.5"/><text x="645.0" y="155.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">Рівновага сил:</tspan><tspan x="645.0" dy="14.3">q · E_H = q · v_d · B</tspan><tspan x="645.0" dy="14.3"></tspan><tspan x="645.0" dy="14.3">Густина струму:</tspan><tspan x="645.0" dy="14.3">j = n · q · v_d</tspan><tspan x="645.0" dy="14.3"></tspan><tspan x="645.0" dy="14.3">Коефіцієнт Холла:</tspan><tspan x="645.0" dy="14.3">R_H = 1 / (n · q)</tspan><tspan x="645.0" dy="14.3"></tspan><tspan x="645.0" dy="14.3">У напівпровіднику n мала,</tspan><tspan x="645.0" dy="14.3">тому v_d і V_H у 10⁶ разів</tspan><tspan x="645.0" dy="14.3">вищі, ніж у металі.</tspan></text>
