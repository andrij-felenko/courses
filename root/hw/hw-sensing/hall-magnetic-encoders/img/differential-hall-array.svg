<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">2D диференційний масив Холла: придушення синфазної магнітної завади</text>
<rect x="80.0" y="120.0" width="200.0" height="200.0" rx="8" fill="#f4f6f8" stroke="#64748b" stroke-width="2.0"/>
<text x="180.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Кристал мікросхеми (AS5048 / MA730)</text>
<rect x="114.0" y="204.0" width="32.0" height="32.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="2.0"/>
<text x="130.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">X+</text>
<rect x="214.0" y="204.0" width="32.0" height="32.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="2.0"/>
<text x="230.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">X−</text>
<rect x="164.0" y="154.0" width="32.0" height="32.0" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="2.0"/>
<text x="180.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">Y+</text>
<rect x="164.0" y="254.0" width="32.0" height="32.0" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="2.0"/>
<text x="180.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">Y−</text>
<line x1="130.0" y1="242.0" x2="130.0" y2="258.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="130.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">+Bx</text>
<line x1="230.0" y1="198.0" x2="230.0" y2="182.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="230.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">−Bx</text>
<line x1="100.0" y1="155.0" x2="100.0" y2="185.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="150.0" y1="155.0" x2="150.0" y2="185.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="210.0" y1="155.0" x2="210.0" y2="185.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="260.0" y1="155.0" x2="260.0" y2="185.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="180.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Зовнішня завада B_ext (однорідна)</text>
<rect x="390.0" y="65.0" width="340.0" height="130.0" rx="6" fill="#fef9ee" stroke="#d97706" stroke-width="1.5"/><text x="560.0" y="89.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Диференційне вимірювання X-каналу:</tspan><tspan x="560.0" dy="15.0"></tspan><tspan x="560.0" dy="15.0">V(X+) = +Bx_магніт + B_ext</tspan><tspan x="560.0" dy="15.0">V(X−) = −Bx_магніт + B_ext</tspan><tspan x="560.0" dy="15.0"></tspan><tspan x="560.0" dy="15.0">Vx = V(X+) − V(X−) = 2 · Bx_магніт</tspan><tspan x="560.0" dy="15.0">→ Завада B_ext ідеально компенсується!</tspan></text>
<rect x="390.0" y="210.0" width="340.0" height="100.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="560.0" y="240.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Ортогональні компоненти поля:</tspan><tspan x="560.0" dy="15.6"></tspan><tspan x="560.0" dy="15.6">Bx(θ) = B₀ · cos(θ)</tspan><tspan x="560.0" dy="15.6">By(θ) = B₀ · sin(θ)</tspan></text>
<rect x="390.0" y="325.0" width="340.0" height="75.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="351.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Обчислення абсолютного кута (CORDIC / DSP):</tspan><tspan x="560.0" dy="15.6"></tspan><tspan x="560.0" dy="15.6">θ = atan2(By, Bx) = atan2(sin θ, cos θ)</tspan></text>
</svg>