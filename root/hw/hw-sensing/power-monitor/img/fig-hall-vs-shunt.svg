<text x="730.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d81b60" text-anchor="middle" font-weight="700">Магнітне поле B ∝ I</text>
<text x="730.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Елемент Холла + TIA</text>
<line x1="810.0" y1="100.0" x2="855.0" y2="100.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="860.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">V_OUT</text>
<rect x="507.7" y="241.4" width="324.7" height="87.3" rx="6" fill="#fce4ec" stroke="#f48fb1" stroke-width="1.5"/><text x="670.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">✓ Повна гальванічна розв'язка (безпека до 400..1000 В)</tspan><tspan x="670.0" dy="12.3">✓ Мінімальне виділення тепла на надвеликих струмах</tspan><tspan x="670.0" dy="12.3">✓ Не обмежує синфазну напругу силового кола</tspan><tspan x="670.0" dy="12.3">✗ Чутливий до зовнішніх магнітних полів (мотори, дроселі)</tspan><tspan x="670.0" dy="12.3">✗ Початкове зміщення нуля (Zero Offset) та шум</tspan><tspan x="670.0" dy="12.3">✗ Температурний дрейф чутливості й гістерезис</tspan></text>
</svg>