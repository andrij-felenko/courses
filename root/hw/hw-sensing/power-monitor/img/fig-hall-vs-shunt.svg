<line x1="360.0" y1="100.0" x2="420.0" y2="100.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="395.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">I_out</text>
<line x1="145.0" y1="125.0" x2="145.0" y2="160.0" stroke="#2457d6" stroke-width="1.8"/>
<line x1="315.0" y1="125.0" x2="315.0" y2="160.0" stroke="#2457d6" stroke-width="1.8"/>
<text x="145.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Sense +</text>
<text x="315.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Sense −</text>
<text x="230.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">V_shunt = I · R_shunt (мВ)</text>
<rect x="67.7" y="241.4" width="324.7" height="87.3" rx="6" fill="#f1f8e9" stroke="#c5e1a5" stroke-width="1.5"/><text x="230.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">✓ Максимальна точність (до 0.1% з калібруванням)</tspan><tspan x="230.0" dy="12.3">✓ Нечутливий до зовнішніх магнітних полів</tspan><tspan x="230.0" dy="12.3">✓ Немає магнітного гістерезису та залишкової індукції</tspan><tspan x="230.0" dy="12.3">✗ Гальванічний зв'язок із високовольтною шиною</tspan><tspan x="230.0" dy="12.3">✗ Омічні втрати тепла P = I²·R на великих струмах (&gt;50 А)</tspan><tspan x="230.0" dy="12.3">✗ Саморозігрів викликає дрейф опору (TCR)</tspan></text>
<rect x="460.0" y="20.0" width="420.0" height="370.0" rx="8" fill="#ffffff" stroke="#b0bec5" stroke-width="1.2"/><text x="670.0" y="209.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0"></tspan></text>
<text x="670.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#d81b60" text-anchor="middle" font-weight="700">Давач на ефекті Холла (ACS712 / TMCS1100)</text>
<rect x="490.0" y="75.0" width="95.0" height="50.0" rx="4" fill="#ffebee" stroke="#c0392b" stroke-width="2.0"/>
<text x="537.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Силова петля
(1.2 мΩ)</text>
<line x1="465.0" y1="100.0" x2="490.0" y2="100.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="585.0" y1="100.0" x2="615.0" y2="100.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="630.0" y1="65.0" x2="630.0" y2="145.0" stroke="#78909c" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="630.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#546e7a" text-anchor="middle" font-weight="700">Бар'єр 3-5 кВ</text>
