<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл похибок вимірювання струму та потужності за діапазоном</text>
<line x1="80.0" y1="280.0" x2="800.0" y2="280.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="80.0" y1="280.0" x2="80.0" y2="55.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="800.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">Вимірюваний струм I_load (А)</text>
<text x="75.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Відносна похибка вимірювання (%)</text>
<rect x="95.0" y="75.0" width="225.0" height="85.0" rx="6" fill="#ffebee" stroke="#c0392b" stroke-width="1.5"/><text x="207.5" y="102.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="207.5" dy="0.0">Зона малого струму:</tspan><tspan x="207.5" dy="12.3">Домінує зміщення нуля (V_OS)</tspan><tspan x="207.5" dy="12.3">ε_offset = V_OS / (I · R_shunt)</tspan><tspan x="207.5" dy="12.3">(10 μV при 100 μV дає 10%!)</tspan></text>
<line x1="200.0" y1="165.0" x2="150.0" y2="215.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="340.0" y="75.0" width="210.0" height="80.0" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/><text x="445.0" y="99.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">Оптимальний діапазон:</tspan><tspan x="445.0" dy="12.3">Похибка &lt; 0.2%..0.5%</tspan><tspan x="445.0" dy="12.3">Домінує початковий допуск R</tspan><tspan x="445.0" dy="12.3">та нелінійність АЦП (INL)</tspan></text>
<line x1="445.0" y1="160.0" x2="445.0" y2="240.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="570.0" y="75.0" width="245.0" height="90.0" rx="6" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/><text x="692.5" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="692.5" dy="0.0">Зона великого струму:</tspan><tspan x="692.5" dy="12.3">Домінує саморозігрів шунта (P=I²R)</tspan><tspan x="692.5" dy="12.3">Дрейф опору через TCR:</tspan><tspan x="692.5" dy="12.3">ΔR = R_0 · TCR · ΔT</tspan><tspan x="692.5" dy="12.3">(50 ppm/°C при ΔT=60°C → +0.3%)</tspan></text>
<line x1="685.0" y1="170.0" x2="725.0" y2="220.0" stroke="#ff9800" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 100 85 L 120 120 L 150 170 L 200 215 L 280 245 L 445 255 L 590 245 L 670 220 L 740 175 L 770 130" fill="none" stroke="#2457d6" stroke-width="3"/>
<circle cx="445.0" cy="255.0" r="5.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="445.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Мінімум похибки</text>
<text x="120.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">I_min</text>
<text x="445.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">I_nominal</text>
<text x="740.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">I_max</text>
</svg>