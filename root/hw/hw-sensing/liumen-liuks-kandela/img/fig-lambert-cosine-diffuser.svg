<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 860 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="860" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="840.0" height="370.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Косинусний закон освітленості та конструкція вимірювального розсіювача</text>
<line x1="410.0" y1="50.0" x2="410.0" y2="350.0" stroke="#d0d7de" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="205.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="700">Геометрія: проєкція площі під кутом θ</text>
<line x1="40.0" y1="240.0" x2="260.0" y2="240.0" stroke="#333333" stroke-width="2.5"/>
<text x="150.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Приймальна поверхня dA</text>
<line x1="150.0" y1="240.0" x2="150.0" y2="110.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,4"/>
<text x="155.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Нормаль n</text>
<line x1="70.0" y1="130.0" x2="110.0" y2="240.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="110.0" y1="130.0" x2="150.0" y2="240.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="150.0" y1="130.0" x2="190.0" y2="240.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="125.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">θ</text>
<rect x="30.0" y="275.0" width="350.0" height="70.0" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.4"/><text x="205.0" y="300.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">E_v(θ) = E_0 · cos θ</tspan><tspan x="205.0" dy="13.0">Світловий потік розмазується по більшій площі dA / cos θ,</tspan><tspan x="205.0" dy="13.0">тому густина потоку (освітленість) спадає як cos θ</tspan></text>
<text x="625.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Конструкція косинусної насадки люксметра</text>
<rect x="535.0" y="195.0" width="180.0" height="50.0" rx="4" fill="#34495e" stroke="#333333" stroke-width="2.0"/>
<text x="625.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ecf0f1" text-anchor="middle">Металевий корпус з обмежувачем</text>
<rect x="590.0" y="180.0" width="70.0" height="15.0" rx="2" fill="#2c3e50" stroke="#3498db" stroke-width="1.5"/>
<text x="625.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Кремнієвий фотодіод</text>
<rect x="580.0" y="165.0" width="90.0" height="12.0" rx="2" fill="#a8e6cf" stroke="#27ae60" stroke-width="1.4"/>
<text x="625.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Фільтр V(λ)</text>
<path d="M 570.0 163.0 A 55 55 0 0 1 680.0 163.0 Z" fill="#ffffff" stroke="#95a5a6" stroke-width="2"/>
<text x="625.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дифузний купол (PTFE / опал)</text>
<line x1="525.0" y1="110.0" x2="585.0" y2="145.0" stroke="#d35400" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="540.0" y1="90.0" x2="600.0" y2="130.0" stroke="#d35400" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="265.0" width="380.0" height="85.0" rx="6" fill="#f0f9f4" stroke="#27ae60" stroke-width="1.4"/><text x="620.0" y="293.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Чому необхідний купол:</tspan><tspan x="620.0" dy="11.7">Плоский фотодіод на великих кутах відбиває світло (закон Френеля),</tspan><tspan x="620.0" dy="11.7">занижуючи сигнал. Опаловий купол розсіює промені з усіх кутів,</tspan><tspan x="620.0" dy="11.7">відновлюючи точну характеристику cos θ (похибка f₂ &lt; 1.5–3%).</tspan></text>
</svg>