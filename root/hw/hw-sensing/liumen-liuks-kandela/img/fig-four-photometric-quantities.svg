<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 860 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="860" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="840.0" height="420.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири базові фотометричні величини в єдиній геометрії</text>
<circle cx="100.0" cy="210.0" r="22.0" fill="#fff9db" stroke="#f59f00" stroke-width="2.5"/>
<text x="100.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">Джерело</text>
<line x1="122.0" y1="210.0" x2="190.0" y2="165.0" stroke="#d35400" stroke-width="1.8"/>
<line x1="122.0" y1="210.0" x2="190.0" y2="255.0" stroke="#d35400" stroke-width="1.8"/>
<line x1="190.0" y1="165.0" x2="190.0" y2="255.0" stroke="#d35400" stroke-width="1.4" stroke-dasharray="3,3"/>
<rect x="30.0" y="65.0" width="190.0" height="80.0" rx="6" fill="#fffbf0" stroke="#d35400" stroke-width="1.4"/><text x="125.0" y="90.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">1. СИЛА СВІТЛА I_v</tspan><tspan x="125.0" dy="11.7">Одиниця: Кандела (кд = лм/ср)</tspan><tspan x="125.0" dy="11.7">I_v = dΦ_v / dΩ</tspan><tspan x="125.0" dy="11.7">Густина потоку в тілесному куті dΩ</tspan></text>
<line x1="190.0" y1="185.0" x2="320.0" y2="150.0" stroke="#f59f00" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="190.0" y1="210.0" x2="330.0" y2="210.0" stroke="#f59f00" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="190.0" y1="235.0" x2="320.0" y2="270.0" stroke="#f59f00" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="150.0" y="300.0" width="240.0" height="75.0" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.4"/><text x="270.0" y="323.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">2. СВІТЛОВИЙ ПОТІК Φ_v</tspan><tspan x="270.0" dy="11.7">Одиниця: Люмен (лм)</tspan><tspan x="270.0" dy="11.7">Загальна потужність видимого випромінювання,</tspan><tspan x="270.0" dy="11.7">зважена за чутливістю ока V(λ)</tspan></text>
<rect x="440.0" y="140.0" width="16.0" height="140.0" rx="2" fill="#e8f4fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="448.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Площа dA</text>
<line x1="100.0" y1="270.0" x2="440.0" y2="270.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="140.0" y1="270.0" x2="100.0" y2="270.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="400.0" y1="270.0" x2="440.0" y2="270.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="270.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Відстань r</text>
<rect x="340.0" y="65.0" width="220.0" height="80.0" rx="6" fill="#edf7ff" stroke="#2457d6" stroke-width="1.4"/><text x="450.0" y="90.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">3. ОСВІТЛЕНІСТЬ E_v</tspan><tspan x="450.0" dy="11.7">Одиниця: Люкс (лк = лм/м²)</tspan><tspan x="450.0" dy="11.7">E_v = dΦ_v / dA = (I_v / r²) · cos θ</tspan><tspan x="450.0" dy="11.7">Густина світлового потоку на поверхні</tspan></text>
<circle cx="720.0" cy="120.0" r="18.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<circle cx="724.0" cy="120.0" r="8.0" fill="#2c3e50" stroke="none" stroke-width="0.0"/>
<circle cx="726.0" cy="118.0" r="2.5" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="720.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Спостерігач</text>
<line x1="456.0" y1="210.0" x2="700.0" y2="125.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="456.0" y1="210.0" x2="526.0" y2="210.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="506.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">θ</text>
<rect x="550.0" y="270.0" width="260.0" height="90.0" rx="6" fill="#f0f9f4" stroke="#27ae60" stroke-width="1.4"/><text x="680.0" y="294.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">4. ЯСКРАВІСТЬ L_v</tspan><tspan x="680.0" dy="11.7">Одиниця: кд/м² (ніт)</tspan><tspan x="680.0" dy="11.7">L_v = d²Φ_v / (dA · cos θ · dΩ)</tspan><tspan x="680.0" dy="11.7">Зорова світність поверхні у напрямку ока;</tspan><tspan x="680.0" dy="11.7">єдина величина, яку безпосередньо бачить зір</tspan></text>
</svg>