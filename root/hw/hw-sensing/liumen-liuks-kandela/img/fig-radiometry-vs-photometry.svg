<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 840 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="840" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="820.0" height="360.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Радіометрія (об'єктивна енергія) проти фотометрії (зір людини)</text>
<rect x="30.0" y="56.0" width="220.0" height="270.0" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.6"/><text x="140.0" y="141.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">РАДІОМЕТРІЯ</tspan><tspan x="140.0" dy="11.7"></tspan><tspan x="140.0" dy="11.7">Об'єктивна фізична енергія</tspan><tspan x="140.0" dy="11.7">• Довжини хвиль: будь-які (УФ, видиме, ІЧ)</tspan><tspan x="140.0" dy="11.7">• Приймач: болометр, калориметр</tspan><tspan x="140.0" dy="11.7">• Чутливість: спектрально пласка</tspan><tspan x="140.0" dy="11.7">• Базова одиниця: Ват (Вт, Дж/с)</tspan><tspan x="140.0" dy="11.7"></tspan><tspan x="140.0" dy="11.7">Випромінювач 1 Вт на 1064 нм (ІЧ) = 1 Вт</tspan><tspan x="140.0" dy="11.7">Випромінювач 1 Вт на 555 нм (зелене) = 1 Вт</tspan></text>
<line x1="255.0" y1="190.0" x2="295.0" y2="190.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="300.0" y="70.0" width="220.0" height="240.0" rx="6" fill="#f0f9f4" stroke="#27ae60" stroke-width="1.8"/><text x="410.0" y="140.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">БІОЛОГІЧНИЙ ФІЛЬТР</tspan><tspan x="410.0" dy="11.7"></tspan><tspan x="410.0" dy="11.7">Крива чутливості ока V(λ)</tspan><tspan x="410.0" dy="11.7">• Колбочки сітківки (L, M, S)</tspan><tspan x="410.0" dy="11.7">• Пік чутливості: 555 нм (зелене)</tspan><tspan x="410.0" dy="11.7">• V(555 нм) = 1.0  (683 лм/Вт)</tspan><tspan x="410.0" dy="11.7">• V(1064 нм) = 0.0 (невидиме ІЧ)</tspan><tspan x="410.0" dy="11.7">• V(350 нм) = 0.0  (невидиме УФ)</tspan><tspan x="410.0" dy="11.7"></tspan><tspan x="410.0" dy="11.7">Зважування: Φ_v = Km · ∫ Φ_e(λ)·V(λ) dλ</tspan></text>
<line x1="525.0" y1="190.0" x2="565.0" y2="190.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="570.0" y="56.0" width="220.0" height="270.0" rx="6" fill="#edf7ff" stroke="#2457d6" stroke-width="1.6"/><text x="680.0" y="141.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">ФОТОМЕТРІЯ</tspan><tspan x="680.0" dy="11.7"></tspan><tspan x="680.0" dy="11.7">Суб'єктивне зорове відчуття</tspan><tspan x="680.0" dy="11.7">• Довжини хвиль: лише 380–780 нм</tspan><tspan x="680.0" dy="11.7">• Приймач: око, люксметр із V(λ)</tspan><tspan x="680.0" dy="11.7">• Чутливість: вибіркова до кольору</tspan><tspan x="680.0" dy="11.7">• Базова одиниця: Люмен (лм, кд·ср)</tspan><tspan x="680.0" dy="11.7"></tspan><tspan x="680.0" dy="11.7">Лазер 1 Вт на 1064 нм (ІЧ) = 0 лм</tspan><tspan x="680.0" dy="11.7">Лазер 1 Вт на 555 нм (зелене) = 683 лм</tspan></text>
</svg>