<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 880 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="880" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільцевий буфер енергонезалежного зберігання (Wear-Leveling) та захист від збоїв</text>
<rect x="0.0" y="0.0" width="860.0" height="470.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<rect x="42.2" y="105.9" width="195.6" height="88.2" rx="6" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.5"/><text x="140.0" y="125.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Рівень 1: Швидка SRAM</tspan><tspan x="140.0" dy="14.3">• Дробовий мікро-джоульний</tspan><tspan x="140.0" dy="14.3">  акумулятор (uint64_t)</tspan><tspan x="140.0" dy="14.3">• Оновлення: 8 кГц (125 мкс)</tspan><tspan x="140.0" dy="14.3">• Необмежений ресурс запису</tspan></text>
<line x1="260.0" y1="150.0" x2="345.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="252.6" y="76.0" width="98.8" height="48.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.2"/><text x="302.0" y="90.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="302.0" dy="0.0">Подія запису:</tspan><tspan x="302.0" dy="13.0">ΔE ≥ 1 Вт·год</tspan><tspan x="302.0" dy="13.0">або Power-Fail</tspan></text>
<rect x="360.0" y="55.0" width="470.0" height="245.0" rx="6" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/>
<text x="595.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">Рівень 2: Енергонезалежна пам'ять (Flash / EEPROM Сектор)</text>
<rect x="380.0" y="105.0" width="95.0" height="165.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/><text x="427.5" y="167.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="427.5" dy="0.0">Слот #0</tspan><tspan x="427.5" dy="11.7">(Seq: 1041)</tspan><tspan x="427.5" dy="11.7">Valid OK</tspan><tspan x="427.5" dy="11.7">E: 142.1 кВт·год</tspan><tspan x="427.5" dy="11.7">CRC: 0x9A4F</tspan></text>
<rect x="490.0" y="105.0" width="95.0" height="165.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/><text x="537.5" y="167.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="537.5" dy="0.0">Слот #1</tspan><tspan x="537.5" dy="11.7">(Seq: 1042)</tspan><tspan x="537.5" dy="11.7">Valid OK</tspan><tspan x="537.5" dy="11.7">E: 142.2 кВт·год</tspan><tspan x="537.5" dy="11.7">CRC: 0x3B12</tspan></text>
<rect x="600.0" y="105.0" width="95.0" height="165.0" rx="6" fill="#fff4e6" stroke="#d35400" stroke-width="1.4"/><text x="647.5" y="167.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="647.5" dy="0.0">Слот #2</tspan><tspan x="647.5" dy="11.7">(Seq: 1043)</tspan><tspan x="647.5" dy="11.7">АКТИВНИЙ</tspan><tspan x="647.5" dy="11.7">E: 142.3 кВт·год</tspan><tspan x="647.5" dy="11.7">CRC: 0x7E89</tspan></text>
<rect x="710.0" y="105.0" width="95.0" height="165.0" rx="6" fill="#ffffff" stroke="#d6dde6" stroke-width="1.4"/><text x="757.5" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="757.5" dy="0.0">Слот #3</tspan><tspan x="757.5" dy="13.0">(0xFF...FF)</tspan><tspan x="757.5" dy="13.0">Вільний</tspan><tspan x="757.5" dy="13.0">(Готовий до</tspan><tspan x="757.5" dy="13.0">запису)</tspan></text>
<line x1="625.0" y1="320.0" x2="625.0" y2="280.0" stroke="#d35400" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="625.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">Поточний дійсний запис (Seq MAX)</text>
<rect x="62.6" y="380.2" width="734.8" height="59.6" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.2"/><text x="430.0" y="399.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Анатомія слота журналу: [ Magic (2B) | SeqID (4B) | E_act_imp (8B) | E_act_exp (8B) | E_react (16B) | CRC16 (2B) ]</tspan><tspan x="430.0" dy="14.3">При старті МК: сканування сектору → перевірка CRC → вибір слота з максимальним SeqID.</tspan><tspan x="430.0" dy="14.3">Збільшення ресурсу пам'яті у N разів (де N — кількість слотів у секторі).</tspan></text>
</svg>