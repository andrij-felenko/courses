<rect x="451.6" y="105.0" width="266.8" height="69.9" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="585.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">КВАДРАНТ I (Q1)</tspan><tspan x="585.0" dy="14.3">Імпорт P (+P)  |  Індуктивна Q (+Q)</tspan><tspan x="585.0" dy="14.3">Струм відстає від напруги (0° &lt; φ &lt; 90°)</tspan><tspan x="585.0" dy="14.3">Навантаження: асинхронні двигуни, ТП</tspan></text>
<rect x="95.3" y="105.0" width="279.3" height="69.9" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="235.0" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">КВАДРАНТ II (Q2)</tspan><tspan x="235.0" dy="14.3">Експорт P (-P)  |  Індуктивна Q (+Q)</tspan><tspan x="235.0" dy="14.3">Генерація активної, споживання індуктивної</tspan><tspan x="235.0" dy="14.3">Синхронний генератор (недозбудження)</tspan></text>
<rect x="92.2" y="365.1" width="285.6" height="69.9" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="235.0" y="382.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">КВАДРАНТ III (Q3)</tspan><tspan x="235.0" dy="14.3">Експорт P (-P)  |  Ємнісна Q (-Q)</tspan><tspan x="235.0" dy="14.3">Струм випереджає напругу (-180° &lt; φ &lt; -90°)</tspan><tspan x="235.0" dy="14.3">Сонячний інвертор (генерація в мережу)</tspan></text>
<rect x="451.6" y="365.1" width="266.8" height="69.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="585.0" y="382.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">КВАДРАНТ IV (Q4)</tspan><tspan x="585.0" dy="14.3">Імпорт P (+P)  |  Ємнісна Q (-Q)</tspan><tspan x="585.0" dy="14.3">Струм випереджає напругу (-90° &lt; φ &lt; 0°)</tspan><tspan x="585.0" dy="14.3">Імпульсні БЖ з X-конденсаторами, КБ</tspan></text>
