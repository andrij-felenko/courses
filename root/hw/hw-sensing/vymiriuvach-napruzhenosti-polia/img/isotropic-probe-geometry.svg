<rect x="450.0" y="55.0" width="340.0" height="78.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="464.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Електрично короткі диполі (l &lt;&lt; λ)</text>
<text x="464.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Довжина стрижнів 8–15 мм забезпечує сталий</text>
<text x="464.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ємнісний імпеданс і відсутність паразитного</text>
<text x="464.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">резонансу до частот 3–6 ГГц.</text>
<rect x="450.0" y="143.0" width="340.0" height="78.0" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
<text x="464.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Діоди Шотткі прямо в точці збудження</text>
<text x="464.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ВЧ сигнал детектується на клемах диполя.</text>
<text x="464.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">У ручку зонда передається лише постійна напруга</text>
<text x="464.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">V_DC, що усуває ВЧ втрати в кабелі.</text>
<rect x="450.0" y="231.0" width="340.0" height="78.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="464.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Резистивні лінії відведення сигналу</text>
<text x="464.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Вуглецеві або ніхромові доріжки з опором</text>
<text x="464.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">~100 кОм/м прозорі для ЕМ хвилі й не спотворюють</text>
<text x="464.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">вимірюване поле навколо диполів.</text>
<rect x="371.9" y="331.2" width="496.2" height="47.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="351.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Ізотропна напруженість: E_total = √(E_x² + E_y² + E_z²)</tspan><tspan x="620.0" dy="15.6">Густина потоку енергії: S_total = E_total² / Z_0  (Z_0 ≈ 377 Ом)</tspan></text>
