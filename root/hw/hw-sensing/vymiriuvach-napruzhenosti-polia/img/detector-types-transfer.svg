<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Характеристики детектування ВЧ сигналу: діодний, логарифмічний та True RMS</text>
<rect x="23.0" y="55.0" width="250.0" height="310.0" rx="6" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="148.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Діодний (Square-Law)</text>
<text x="148.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Zero-Bias Schottky</text>
<line x1="47.0" y1="211.0" x2="249.0" y2="211.0" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="47.0" y1="111.0" x2="47.0" y2="211.0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="243.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">P_in (дБм)</text>
<text x="63.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">V_out</text>
<line x1="52.0" y1="207.0" x2="82.0" y2="196.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="82.0" y1="196.0" x2="122.0" y2="166.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="122.0" y1="166.0" x2="239.0" y2="126.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="87.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Квадратична</text>
<text x="224.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Лінійна</text>
<rect x="33.0" y="235.0" width="230.0" height="48.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="148.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">V_out ∝ V_RF² (низький рівень)</text>
<text x="148.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">V_out ∝ V_RF (піковий режим)</text>
<text x="39.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Діапазон: ~30-40 дБ</text>
<text x="39.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Чутливий до пік-фактора</text>
<text x="39.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Простий, пасивний</text>
<rect x="295.0" y="55.0" width="250.0" height="310.0" rx="6" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Логарифмічний (Log Amp)</text>
<text x="420.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">AD8313 / AD8318</text>
<line x1="319.0" y1="211.0" x2="521.0" y2="211.0" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="319.0" y1="111.0" x2="319.0" y2="211.0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="515.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">P_in (дБм)</text>
<text x="335.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">V_out</text>
<line x1="329.0" y1="126.0" x2="506.0" y2="196.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="430.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">V_out ~ −k · P_in</text>
<rect x="305.0" y="235.0" width="230.0" height="48.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="420.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">V_out = −Slope · (P_in − P_0)</text>
<text x="420.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Вихід лінійний у дБм (мВ/дБ)</text>
<text x="311.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Діапазон: 60–70 дБ</text>
<text x="311.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Частота: 1 МГц – 8 ГГц</text>
<text x="311.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Помилка на шумі/OFDM ~1–3 дБ</text>
<rect x="567.0" y="55.0" width="250.0" height="310.0" rx="6" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="692.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Справжнє СКЗ (True RMS)</text>
<text x="692.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">AD8361 / AD8362 / LTC5508</text>
<line x1="591.0" y1="211.0" x2="793.0" y2="211.0" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="591.0" y1="111.0" x2="591.0" y2="211.0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="787.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">P_in (дБм)</text>
<text x="607.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">V_out</text>
<line x1="601.0" y1="196.0" x2="778.0" y2="126.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="682.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">V_out ~ P_RMS</text>
<rect x="577.0" y="235.0" width="230.0" height="48.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="692.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">V_out ∝ √( 1/T ∫ V_RF²(t) dt )</text>
<text x="692.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Незмінний від форми сигналу</text>
<text x="583.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Діапазон: 40–60 дБ</text>
<text x="583.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Точний для 5G NR, LTE, GSM</text>
<text x="583.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Інтегрує потужність у часі</text>
</svg>