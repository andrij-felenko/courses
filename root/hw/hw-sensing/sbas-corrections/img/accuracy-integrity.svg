<text x="500.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">захисний рівень</text>
<text x="500.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">НЕ ВИКОРИСТОВУВАТИ</text>
<rect x="20.0" y="370.0" width="620.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="330.0" y="386.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">SBAS не лише зменшує похибку — він рахує гарантовану межу зверху (захисний рівень).</tspan><tspan x="330.0" dy="14.3">Межа під допуском — фіксу можна довіряти; виповзла — приймач сам каже «не використовувати».</tspan></text>
