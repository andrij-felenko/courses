<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 744 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="744" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="330.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві осі SBAS: точність і цілісність (захисний рівень)</text>
<line x1="150.0" y1="90.0" x2="150.0" y2="340.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="150.0" y1="94.0" x2="150.0" y2="82.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="140.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">похибка ↑</text>
<line x1="150.0" y1="150.0" x2="600.0" y2="150.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="6 4"/>
<text x="604.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">допуск (alert limit)</text>
<circle cx="300.0" cy="300.0" r="6.0" fill="#fff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="300.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">справжня</text>
<text x="300.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">похибка</text>
<line x1="300.0" y1="300.0" x2="300.0" y2="210.0" stroke="#27ae60" stroke-width="8.0"/>
<circle cx="300.0" cy="210.0" r="5.0" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="300.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">захисний рівень</text>
<text x="300.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">МОЖНА ДОВІРЯТИ</text>
<circle cx="500.0" cy="300.0" r="6.0" fill="#fff" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="500.0" y1="300.0" x2="500.0" y2="118.0" stroke="#c0392b" stroke-width="8.0"/>
