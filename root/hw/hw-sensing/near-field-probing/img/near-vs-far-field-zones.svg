<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1009.4 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1009.4" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хвильовий імпеданс Zw = |E| / |H| залежно від відстані до джерела</text>
<text x="480.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">у ближній реактивній зоні переважає вихідне поле джерела; у дальній зоні Zw стабілізується на 377 Ом</text>
<rect x="90.0" y="75.0" width="300.0" height="325.0" rx="4" fill="#fbf0f0" stroke="#e0b4b4" stroke-width="1.0"/><text x="240.0" y="242.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0"></tspan></text>
<text x="240.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Реактивна ближня зона (r &lt; λ / 2π)</text>
<text x="240.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">квазістатичні поля, енергія не відривається</text>
<rect x="390.0" y="75.0" width="290.0" height="325.0" rx="4" fill="#fffceb" stroke="#e6db9c" stroke-width="1.0"/><text x="535.0" y="242.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0"></tspan></text>
<text x="535.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="700">Зона випромінювання / Френеля</text>
<text x="535.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">формування електромагнітної хвилі</text>
<rect x="680.0" y="75.0" width="230.0" height="325.0" rx="4" fill="#e9eefb" stroke="#a9bfec" stroke-width="1.0"/><text x="795.0" y="242.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0"></tspan></text>
<text x="795.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Дальня зона (Far-Field)</text>
<text x="795.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">поперечна хвиля TEM, r &gt; 2D²/λ</text>
<line x1="90.0" y1="360.0" x2="910.0" y2="360.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="90.0" y1="360.0" x2="90.0" y2="100.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="905.0" y1="360.0" x2="925.0" y2="360.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="90.0" y1="105.0" x2="90.0" y2="85.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="930.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Відстань r</text>
<text x="80.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Імпеданс Zw (Ом)</text>
<line x1="90.0" y1="230.0" x2="910.0" y2="230.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="5,4"/>
<circle cx="90.0" cy="230.0" r="3.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="75.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">377 Ом</text>
<text x="75.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">(Z₀ = √(μ₀/ε₀))</text>
<text x="850.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">Z₀ = 377 Ом (вільний простір)</text>
<line x1="390.0" y1="360.0" x2="390.0" y2="125.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="390.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">r = λ / (2π)</text>
<text x="390.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">≈ 0.159 · λ</text>
<text x="680.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">r = λ</text>
<line x1="680.0" y1="357.0" x2="680.0" y2="363.0" stroke="#1a1a1a" stroke-width="1.2"/>
<polyline points="110.0,140.0 140.0,150.0 180.0,166.0 230.0,185.0 290.0,205.0 340.0,218.0 390.0,224.0 460.0,227.0 550.0,229.0 680.0,230.0 880.0,230.0" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="120.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Електричний диполь (E-джерело, dV/dt)</text>
<text x="120.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">Zw &gt;&gt; 377 Ом у реактивній зоні (Zw ∝ 1/r³)</text>
<polyline points="110.0,345.0 140.0,335.0 180.0,318.0 230.0,292.0 290.0,265.0 340.0,246.0 390.0,236.0 460.0,233.0 550.0,231.0 680.0,230.0 880.0,230.0" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="120.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Магнітна петля (H-джерело, dI/dt)</text>
<text x="120.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">Zw &lt;&lt; 377 Ом у реактивній зоні (Zw ∝ r³)</text>
<rect x="90.0" y="410.0" width="820.0" height="40.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="500.0" y="434.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0"></tspan></text>
<text x="500.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Практичний висновок: на друкованій платі (r &lt; 10 мм) магнітні й електричні поля розділені — їх шукають окремими H- та E-зондами</text>
</svg>