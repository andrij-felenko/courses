<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Будова екранованої петлі магнітного поля (Shielded Loop Probe)</text>
<text x="480.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">розріз екрана усуває паразитно замкнений екранний виток і забезпечує придушення синфазного E-поля</text>
<rect x="20.0" y="70.0" width="450.0" height="370.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="245.0" y="259.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0"></tspan></text>
<text x="245.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізична конструкція петлі (коаксіал)</text>
<path d="M 233 145 A 85 85 0 1 0 227 315" fill="none" stroke="#caa24a" stroke-width="8"/>
<path d="M 257 145 A 85 85 0 0 1 263 315" fill="none" stroke="#caa24a" stroke-width="8"/>
<circle cx="245" cy="230" r="85" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<rect x="231.0" y="135.0" width="28.0" height="20.0" rx="2" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="245.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Щілина в екрані (Gap)</text>
<text x="245.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">розрив суцільного екрана</text>
<circle cx="259.0" cy="145.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<line x1="243.0" y1="145.0" x2="259.0" y2="145.0" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="245.0" cy="230.0" r="30.0" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="245.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Магнітний потік</text>
<text x="245.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Φ = ∫ B · dA</text>
<text x="245.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Bind -&gt; Vind</text>
<rect x="229.0" y="311.0" width="32.0" height="70.0" rx="2" fill="#caa24a" stroke="#333333" stroke-width="1.2"/>
<text x="245.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">SMA</text>
<text x="245.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коаксіальний роз'єм SMA (50 Ом)</text>
<rect x="490.0" y="70.0" width="450.0" height="370.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="715.0" y="259.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0"></tspan></text>
<text x="715.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому екран пригнічує електричне E-поле</text>
<rect x="510.0" y="120.0" width="410.0" height="85.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.2"/><text x="715.0" y="167.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0"></tspan></text>
<text x="525.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">1. Магнітна компонента (H-поле, диференційний сигнал):</text>
<text x="525.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Змінне поле H проникає крізь щілину в тіло петлі;</text>
<text x="525.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Індукує ЕРС за законом Фарадея: Vind = -μ₀ · A · (dH/dt);</text>
<text x="525.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Створює чистий поперечний ВЧ-сигнал на навантаженні 50 Ом.</text>
<rect x="510.0" y="218.0" width="410.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="715.0" y="270.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0"></tspan></text>
<text x="525.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">2. Електрична компонента (E-поле, синфазна завада):</text>
<text x="525.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Перепад напруги dV/dt наводить ємнісний струм на екран;</text>
<text x="525.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Симетричний екран ділить струм на дві рівні протифазні гілки;</text>
<text x="525.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Паразитний струм стікає на землю приладу, не потрапляючи в жилу.</text>
<rect x="510.0" y="325.0" width="410.0" height="100.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.2"/><text x="715.0" y="379.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0"></tspan></text>
<text x="525.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">3. Розміри петель та призначення:</text>
<text x="525.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• ⌀ 30–50 мм: висока чутливість, оглядовий пошук витоків;</text>
<text x="525.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• ⌀ 10–15 мм: локалізація функціонального блока (DC-DC, PHY);</text>
<text x="525.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• ⌀ 2–5 мм: точкова локалізація конкретної доріжки чи виводу IC.</text>
</svg>