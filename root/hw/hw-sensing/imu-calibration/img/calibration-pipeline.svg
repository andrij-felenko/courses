<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр калібрування та корекції даних IMU</text>
<rect x="20.0" y="15.0" width="800.0" height="350.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="420.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр виправлення інерціальних вимірювань у реальному часі</text>
<rect x="30.0" y="80.0" width="120.0" height="90.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="90.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">MEMS IMU</text>
<text x="90.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">a_raw, ω_raw</text>
<text x="90.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Температура T</text>
<line x1="150.0" y1="125.0" x2="200.0" y2="125.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="175.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">SPI / I2C</text>
<rect x="200.0" y="80.0" width="160.0" height="90.0" rx="5" fill="#eef4fd" stroke="#333333" stroke-width="1.5"/>
<text x="280.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Температурний блок</text>
<text x="280.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">b(T) = Poly(T) | LUT</text>
<text x="280.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">v₁ = v_raw − b(T)</text>
<line x1="360.0" y1="125.0" x2="410.0" y2="125.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="385.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">v₁</text>
<rect x="410.0" y="80.0" width="170.0" height="90.0" rx="5" fill="#f0fdf4" stroke="#333333" stroke-width="1.5"/>
<text x="495.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матрична корекція</text>
<text x="495.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">v_cal = K · v₁</text>
<text x="495.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">K = (M · S)⁻¹ (3×3)</text>
<line x1="580.0" y1="125.0" x2="630.0" y2="125.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="630.0" y="80.0" width="150.0" height="90.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="705.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Очищений вихід</text>
<text x="705.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">a_cal, ω_cal (СІ)</text>
<text x="705.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">→ EKF / AHRS</text>
<rect x="270.0" y="230.0" width="310.0" height="100.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="425.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Енергонезалежна пам'ять (EEPROM / Flash)</text>
<text x="425.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Збереження: Matrix K [3×3], Poly coeffs, CRC32</text>
<text x="425.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">Завантаження при старті системи (Boot)</text>
<line x1="380.0" y1="230.0" x2="280.0" y2="170.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="470.0" y1="230.0" x2="495.0" y2="170.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>