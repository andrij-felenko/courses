<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр швидкого обчислення температури: LUT із лінійною інтерполяцією</text>
<rect x="25.1" y="71.8" width="169.7" height="46.5" rx="6" fill="#eef2f8" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="91.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Сирий відлік АЦП</tspan><tspan x="110.0" dy="15.0">raw (12 біт, 0..4095)</tspan></text>
<line x1="185.0" y1="95.0" x2="235.0" y2="95.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="251.6" y="65.2" width="176.8" height="59.6" rx="6" fill="#fef9e7" stroke="#e08a3c" stroke-width="1.5"/><text x="340.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Бітовий поділ (крок 128)</tspan><tspan x="340.0" dy="14.3">idx = raw &gt;&gt; 7  (0..31)</tspan><tspan x="340.0" dy="14.3">rem = raw &amp; 0x7F (0..127)</tspan></text>
<line x1="445.0" y1="95.0" x2="495.0" y2="95.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.4" y="65.2" width="139.1" height="59.6" rx="6" fill="#f4f8fc" stroke="#6b7280" stroke-width="1.5"/><text x="620.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Таблиця LUT у Flash</tspan><tspan x="620.0" dy="14.3">T_low = lut[idx]</tspan><tspan x="620.0" dy="14.3">T_high = lut[idx+1]</tspan></text>
<line x1="620.0" y1="140.0" x2="620.0" y2="185.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="340.0" y1="140.0" x2="340.0" y2="185.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="272.8" y="198.4" width="414.3" height="63.2" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="218.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Цілочисельна лінійна інтерполяція (без ділення):</tspan><tspan x="480.0" dy="15.6">T = T_low + (((T_high - T_low) * rem) &gt;&gt; 7)</tspan><tspan x="480.0" dy="15.6">Час виконання: 15–25 тактів CPU замість 800+ у logf()</tspan></text>
<line x1="270.0" y1="230.0" x2="185.0" y2="230.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="31.8" y="206.2" width="146.5" height="47.6" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="105.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Температура</tspan><tspan x="105.0" dy="15.6">(0.01 °C / int16)</tspan></text>
</svg>