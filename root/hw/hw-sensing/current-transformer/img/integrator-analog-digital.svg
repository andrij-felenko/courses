<circle cx="360.0" cy="175.0" r="3.5" fill="#27ae60" stroke="#333333" stroke-width="1.0"/>
<text x="330.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Vout ∝ i(t)</text>
<rect x="40.4" y="279.4" width="339.2" height="81.1" rx="6" fill="#eaf2f8" stroke="#aed6f1" stroke-width="1.2"/><text x="210.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Функція передачі аналогового інтегратора:</tspan><tspan x="210.0" dy="13.7">  H(s) = − (Rf / Rin) / (1 + s · Rf · Cint)</tspan><tspan x="210.0" dy="13.7"></tspan><tspan x="210.0" dy="13.7">Частота зрізу ФНЧ:  fc = 1 / (2π · Rf · Cint) ≤ 0.5 Гц</tspan><tspan x="210.0" dy="13.7">При f &gt;&gt; fc:  Vout(t) = (M / (Rin·Cint)) · i(t)</tspan></text>
<text x="630.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">2. Цифровий інтегратор (DSP конвеєр MCU)</text>
<rect x="549.2" y="86.9" width="161.6" height="36.1" rx="5" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="101.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Швидкий АЦП (ADC)</tspan><tspan x="630.0" dy="13.7">дискретизація fs ≥ 10 кГц</tspan></text>
<line x1="630.0" y1="127.0" x2="630.0" y2="153.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="522.3" y="156.9" width="215.5" height="36.1" rx="5" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="171.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Цифровий IIR ФВЧ (DC-Blocker)</tspan><tspan x="630.0" dy="13.7">y_dc[n] = x[n] − x[n-1] + α·y[n-1]</tspan></text>
<line x1="630.0" y1="197.0" x2="630.0" y2="233.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="504.3" y="236.9" width="251.4" height="36.1" rx="5" fill="#fdfefe" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="251.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Leaky інтегратор Трапецій (Tustin)</tspan><tspan x="630.0" dy="13.7">y[n] = λ·y[n-1] + (Ts/2)·(x[n] + x[n-1])</tspan></text>
<line x1="630.0" y1="277.0" x2="630.0" y2="323.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="513.3" y="326.9" width="233.4" height="36.1" rx="5" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="341.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Калібрування та розрахунок</tspan><tspan x="630.0" dy="13.7">I_rms = √(Σ i²[n] / N), P = Σ u·i / N</tspan></text>
</svg>