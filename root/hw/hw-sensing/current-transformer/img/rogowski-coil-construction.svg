<text x="85.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Повітряне осердя (μᵣ = 1)</text>
<text x="630.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Взаємна індуктивність та властивості</text>
<rect x="471.5" y="90.8" width="317.0" height="98.5" rx="6" fill="#f4f6f7" stroke="#d5dbdb" stroke-width="1.2"/><text x="630.0" y="108.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Теорема про циркуляцію (закон Ампера):</tspan><tspan x="630.0" dy="14.3">  ∮ H·dl = i(t)   [повний охоплений струм]</tspan><tspan x="630.0" dy="14.3"></tspan><tspan x="630.0" dy="14.3">ЕРС індукції в контурі Фарадея:</tspan><tspan x="630.0" dy="14.3">  v(t) = −μ₀ · n · A · (di/dt) = −M · (di(t)/dt)</tspan><tspan x="630.0" dy="14.3">  де M = μ₀·n·A — взаємна індуктивність котушки.</tspan></text>
<rect x="433.5" y="247.6" width="393.1" height="94.8" rx="6" fill="#eafaf1" stroke="#a3e4d7" stroke-width="1.2"/><text x="630.0" y="264.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">КЛЮЧОВІ ПЕРЕВАГИ КОТУШКИ РОГОВСЬКОГО:</tspan><tspan x="630.0" dy="13.7">• Немає феромагнетика → АБСОЛЮТНА лінійність від 1 А до 100 кА.</tspan><tspan x="630.0" dy="13.7">• Нульове насичення осердя при будь-яких надструмах КЗ.</tspan><tspan x="630.0" dy="13.7">• Безпека: розрив кола дає лише мілівольти (немає кіловольт).</tspan><tspan x="630.0" dy="13.7">• Гнучкий розімкнений контур: монтаж без розриву товстих шин.</tspan><tspan x="630.0" dy="13.7">• Смуга частот: від одиниць герц до десятків мегагерц.</tspan></text>
