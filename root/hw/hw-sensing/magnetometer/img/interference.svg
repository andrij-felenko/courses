<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260">
<rect width="720" height="260" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="360.0" y="26.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Біда магнітометра: будь-яке залізо й струм спотворюють поле</text>
<rect x="160.0" y="110.0" width="80.0" height="60.0" rx="5" fill="#eef3fb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="200.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">магніт.</text>
<line x1="242.0" y1="130.0" x2="310.0" y2="100.0" stroke="#1f8a3b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#aGreen)"/>
<text x="316.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">справжнє поле</text>
<line x1="242.0" y1="150.0" x2="296.0" y2="184.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<text x="302.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">спотворене!</text>
<text x="470.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">джерела спотворення:</text>
<text x="470.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#9a7a1e" text-anchor="start" font-weight="normal" font-style="normal">• магніт динаміка</text>
<text x="470.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">• феритне залізо поряд</text>
<text x="470.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">• струм у дроті</text>
<text x="470.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">• сталевий гвинт</text>
<text x="360.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">hard-iron (магніти) зсувають поле; soft-iron (залізо) спотворюють форму — і курс бреше</text>
</svg>
