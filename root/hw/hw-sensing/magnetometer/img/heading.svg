<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260">
<rect width="720" height="260" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="360.0" y="26.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Курс із горизонтальних складових поля</text>
<line x1="230.0" y1="155.0" x2="330.0" y2="155.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="336.0" y="159.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">mX (північ давача)</text>
<line x1="230.0" y1="155.0" x2="230.0" y2="55.0" stroke="#1f8a3b" stroke-width="2" marker-end="url(#aGreen)"/>
<text x="226.0" y="49.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">mY</text>
<line x1="230.0" y1="155.0" x2="305.4" y2="102.2" stroke="#9a4ea8" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="309.4" y="98.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#9a4ea8" text-anchor="start" font-weight="bold" font-style="normal">поле (гориз.)</text>
<text x="276.0" y="143.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">курс</text>
<rect x="450.0" y="88.0" width="244.0" height="116.0" rx="8" fill="#fbfbfb" stroke="#9a4ea8" stroke-width="1.5"/>
<text x="572.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">курс = atan2(mY, mX)</text>
<text x="572.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">+ нахил-компенсація (з аксель.)</text>
<text x="572.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">+ магнітне схилення</text>
<text x="572.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(магнітна ≠ справжня північ)</text>
<text x="360.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кут горизонтального поля = курс; та щоб він був вірним, давач треба вирівняти</text>
</svg>
