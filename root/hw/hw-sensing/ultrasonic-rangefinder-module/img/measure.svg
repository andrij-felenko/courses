<rect x="154.7" y="283.0" width="410.6" height="34.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="304.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">d = v · t / 2     (t — повний час; шлях = 2d)</tspan></text>
