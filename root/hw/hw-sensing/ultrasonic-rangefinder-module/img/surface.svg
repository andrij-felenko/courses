<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тверда пласка ціль вертає луну; коса й м'яка — ні</text>
<text x="120.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">пласка, прямо</text>
<rect x="90.0" y="100.0" width="30.0" height="30.0" rx="5" fill="#e9edf2" stroke="#333333" stroke-width="1.6"/>
<line x1="230.0" y1="80.0" x2="230.0" y2="230.0" stroke="#1a1a1a" stroke-width="4.0"/>
<line x1="116.0" y1="112.0" x2="226.0" y2="112.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="226.0" y1="124.0" x2="116.0" y2="124.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="120.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">луна назад → бачить</text>
<text x="380.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">коса (дзеркало)</text>
<rect x="350.0" y="100.0" width="30.0" height="30.0" rx="5" fill="#e9edf2" stroke="#333333" stroke-width="1.6"/>
<line x1="440.0" y1="90.0" x2="510.0" y2="220.0" stroke="#1a1a1a" stroke-width="4.0"/>
<line x1="376.0" y1="115.0" x2="472.0" y2="150.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="472.0" y1="150.0" x2="518.0" y2="72.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="380.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">відбилась убік → повз</text>
<text x="640.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">м'яка (поролон)</text>
<rect x="610.0" y="100.0" width="30.0" height="30.0" rx="5" fill="#e9edf2" stroke="#333333" stroke-width="1.6"/>
<rect x="726.0" y="90.0" width="32.0" height="140.0" rx="4" fill="#e5d4c4" stroke="#6b7280" stroke-width="1.4"/>
<line x1="636.0" y1="130.0" x2="722.0" y2="130.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="742.0" cy="130.0" r="10.0" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<circle cx="742.0" cy="130.0" r="7.0" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<circle cx="742.0" cy="130.0" r="4.0" fill="none" stroke="#6b7280" stroke-width="1.2"/>
<text x="640.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">поглинула → тиша</text>
<text x="380.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">далекомір міряє не «об'єкт», а перше сильне відлуння, що повернулось</text>
</svg>