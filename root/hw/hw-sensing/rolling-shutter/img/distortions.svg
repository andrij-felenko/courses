<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три обличчя рядкової заслінки на швидкому русі</text>
<rect x="30.0" y="70.0" width="250.0" height="230.0" rx="12" fill="white" stroke="#c0392b" stroke-width="1.8"/>
<text x="155.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">НАХИЛ (skew)</text>
<line x1="100.0" y1="120.0" x2="100.0" y2="250.0" stroke="#cbd5e1" stroke-width="6.0"/>
<text x="100.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">насправді</text>
<polyline points="180,120 225,250" fill="none" stroke="#c0392b" stroke-width="6"/>
<text x="208.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">у кадрі</text>
<text x="155.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="155.0" dy="0.0">вертикаль «лягає» вбік:</tspan><tspan x="155.0" dy="12.8">низ знято пізніше за верх</tspan></text>
<rect x="300.0" y="70.0" width="250.0" height="230.0" rx="12" fill="white" stroke="#d98a00" stroke-width="1.8"/>
<text x="425.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b06b00" text-anchor="middle" font-weight="700">ЖЕЛЕ (jello)</text>
<polyline points="425.0,118.0 431.6,122.2 437.5,126.4 442.4,130.6 445.6,134.8 447.0,139.0 446.3,143.2 443.8,147.4 439.5,151.6 433.9,155.8 427.4,160.0 420.8,164.2 414.6,168.4 409.3,172.6 405.4,176.8 403.3,181.0 403.2,185.2 405.1,189.4 408.8,193.6 414.0,197.8 420.1,202.0 426.8,206.2 433.2,210.4 438.9,214.6 443.4,218.8 446.2,223.0 447.0,227.2 445.8,231.4 442.8,235.6 438.1,239.8 432.2,244.0" fill="none" stroke="#d98a00" stroke-width="5"/>
<text x="425.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="425.0" dy="0.0">вібрація хитає напрям зсуву —</tspan><tspan x="425.0" dy="12.8">кадр «тремтить, як желе»</tspan></text>
<rect x="570.0" y="70.0" width="250.0" height="230.0" rx="12" fill="white" stroke="#2457d6" stroke-width="1.8"/>
<text x="695.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ГВИНТ (propeller)</text>
<polyline points="707.0,190.0 712.9,191.8 718.5,194.8 723.7,198.9 728.2,204.0 731.9,210.1 734.6,217.1 736.3,224.8 736.8,233.0 736.0,241.7 733.9,250.6" fill="none" stroke="#2457d6" stroke-width="5" stroke-linecap="round"/>
<polyline points="689.0,200.4 684.5,204.6 679.1,208.0 673.0,210.4 666.3,211.7 659.1,211.9 651.7,210.8 644.2,208.4 636.8,204.7 629.7,199.7 623.1,193.4" fill="none" stroke="#2457d6" stroke-width="5" stroke-linecap="round"/>
<polyline points="689.0,179.6 687.6,173.6 687.4,167.2 688.3,160.7 690.6,154.3 694.0,148.0 698.7,142.1 704.5,136.8 711.4,132.3 719.3,128.6 728.0,126.0" fill="none" stroke="#2457d6" stroke-width="5" stroke-linecap="round"/>
<circle cx="695.0" cy="190.0" r="7.0" fill="#1a1a1a" stroke="white" stroke-width="1.5"/>
<text x="695.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="695.0" dy="0.0">лопать обертається швидше,</tspan><tspan x="695.0" dy="12.8">ніж зчитується кадр — банани</tspan></text>
<text x="420.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Усе це — не дефект сенсора, а наслідок того, що рядки зняті в різні миті, поки об'єкт рухався.</text>
</svg>