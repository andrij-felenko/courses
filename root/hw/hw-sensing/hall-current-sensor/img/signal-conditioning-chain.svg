<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тракт обробки сигналу: від кристала Холла до мікроконтролера</text>
<rect x="40.0" y="110.0" width="160.0" height="100.0" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8"/>
<text x="120.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#854d0e" text-anchor="middle" font-weight="700">Кристал Холла</text>
<text x="120.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Магнітний міст</text>
<text x="120.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Сигнал: одиниці мВ</text>
<text x="120.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">+ зсув V_offset</text>
<line x1="200.0" y1="160.0" x2="230.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="230.0" y="110.0" width="160.0" height="100.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.8"/>
<text x="310.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Chopper + PGA</text>
<text x="310.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Динамічне обнулення</text>
<text x="310.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">зсуву (1/f шум)</text>
<text x="310.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Підсилення G ≈ 100..500</text>
<line x1="390.0" y1="160.0" x2="420.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="420.0" y="110.0" width="160.0" height="100.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.8"/>
<text x="500.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">RC-фільтр (ФНЧ)</text>
<text x="500.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Антиаліасинг</text>
<text x="500.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Обмеження шуму</text>
<text x="500.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">f_c = 10..80 кГц</text>
<line x1="580.0" y1="160.0" x2="610.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="610.0" y="110.0" width="190.0" height="100.0" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/>
<text x="705.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0369a1" text-anchor="middle" font-weight="700">Мікроконтролер (MCU)</text>
<text x="705.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">• 12/16-бітний АЦП</text>
<text x="705.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">• Автокалібрування нуля</text>
<text x="705.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">• Цифровий фільтр (IIR)</text>
<text x="705.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">• I = (V_adc − V_0) / S</text>
<rect x="60.0" y="240.0" width="720.0" height="75.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="420.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Програмна обробка в прошивці:</text>
<text x="420.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">1. Зняття V_0 при I_p = 0 під час старту. 2. Ратіометрична корекція опорної напруги V_ref.</text>
<text x="420.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">3. Експоненційне згладжування I_filt[k] = α · I_raw + (1 − α) · I_filt[k−1].</text>
</svg>