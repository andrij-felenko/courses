<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому одного давача замало: вади дзеркальні</text>
<text x="170.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">акселерометр</text>
<rect x="10.0" y="102.0" width="320.0" height="88.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.0"/><text x="170.0" y="142.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">абсолютний нахил</tspan><tspan x="170.0" dy="16.9">(сталий g не дрейфує)</tspan></text>
<text x="170.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">сила</text>
