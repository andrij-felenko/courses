<text x="170.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">вада</text>
<text x="730.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">гіроскоп</text>
<rect x="570.0" y="102.0" width="320.0" height="88.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.0"/><text x="730.0" y="142.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">точний і швидкий у русі</tspan><tspan x="730.0" dy="16.9">(чисте обертання, бачить yaw)</tspan></text>
<text x="730.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">сила</text>
<rect x="570.0" y="230.0" width="320.0" height="88.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="730.0" y="270.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">дрейфує з часом</tspan><tspan x="730.0" dy="16.9">(інтеграл зсуву нуля спливає)</tspan></text>
<text x="730.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">вада</text>
