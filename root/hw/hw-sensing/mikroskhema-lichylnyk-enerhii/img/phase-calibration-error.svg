<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вплив фазової похибки датчика струму на вимірювання потужності</text>
<circle cx="200.0" cy="240.0" r="130.0" fill="#fafbfc" stroke="#333333" stroke-width="1.0"/>
<line x1="60.0" y1="240.0" x2="340.0" y2="240.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="200.0" y1="100.0" x2="200.0" y2="380.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="200.0" y1="240.0" x2="320.0" y2="240.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="330.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Вектор напруги V</text>
<line x1="200.0" y1="240.0" x2="255.0" y2="335.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="265.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Справжній струм I (φ = 60°)</text>
<line x1="200.0" y1="240.0" x2="238.0" y2="345.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="3,3"/>
<text x="228.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">Виміряний I' (φ + θ_err)</text>
<text x="252.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">φ (кут навантаження)</text>
<text x="270.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">θ_err (похибка CT/RC)</text>
<rect x="510.3" y="68.4" width="259.4" height="63.2" rx="6" fill="#fdfbf7" stroke="#d97706" stroke-width="1.5"/><text x="640.0" y="88.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Формула активної потужності:</tspan><tspan x="640.0" dy="15.6">P_дійсна = V · I · cos(φ)</tspan><tspan x="640.0" dy="15.6">P_виміряна = V · I · cos(φ + θ_err)</tspan></text>
<rect x="445.0" y="180.2" width="389.9" height="59.6" rx="6" fill="#edf7ed" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Випадок 1: Чисто активне навантаження (cos φ = 1.0, φ = 0°)</tspan><tspan x="640.0" dy="14.3">  θ_err = 0.5°  →  cos(0.5°) = 0.99996</tspan><tspan x="640.0" dy="14.3">  Відносна похибка потужності = лише -0.004%  (непомітна)</tspan></text>
<rect x="441.9" y="283.1" width="396.2" height="73.9" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="640.0" y="302.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Випадок 2: Індуктивне навантаження (cos φ = 0.5, φ = 60°)</tspan><tspan x="640.0" dy="14.3">  θ_err = 0.5°  →  cos(60.5°) = 0.4924</tspan><tspan x="640.0" dy="14.3">  Відносна похибка потужності = (0.4924 - 0.5)/0.5 = -1.52%!</tspan><tspan x="640.0" dy="14.3">  (Помилка зростає у ~380 разів через множник tan φ)</tspan></text>
<text x="640.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Регістр PHCAL усуває θ_err субмікросекундною цифровою затримкою</text>
</svg>