<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 840 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="840" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="820.0" height="440.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фундаментальний квантовий трикутник SI</text>
<rect x="263.4" y="39.4" width="293.3" height="61.2" rx="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.6"/><text x="410.0" y="58.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Фундаментальні квантові константи</tspan><tspan x="410.0" dy="15.6">e = 1.602 176 634 × 10⁻¹⁹ Кл (ТОЧНО)</tspan><tspan x="410.0" dy="15.6">h = 6.626 070 15 × 10⁻³⁴ Дж·с (ТОЧНО)</tspan></text>
<rect x="115.4" y="212.8" width="189.1" height="74.4" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="231.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Ефект Джозефсона (Вольт)</tspan><tspan x="210.0" dy="15.0">KJ = 2e / h</tspan><tspan x="210.0" dy="15.0">V = fJ / KJ</tspan><tspan x="210.0" dy="15.0">Напруга з частоти fJ</tspan></text>
<rect x="508.3" y="212.8" width="203.4" height="74.4" rx="6" fill="#fef9e7" stroke="#d35400" stroke-width="1.5"/><text x="610.0" y="231.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Квантовий ефект Холла (Ом)</tspan><tspan x="610.0" dy="15.0">RK = h / e²</tspan><tspan x="610.0" dy="15.0">R = RK / i</tspan><tspan x="610.0" dy="15.0">Опір із точних констант</tspan></text>
<rect x="141.8" y="358.8" width="536.5" height="42.5" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="410.0" y="376.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Ваги Кіббла (Watt Balance) — Рівновага потужностей:</tspan><tspan x="410.0" dy="15.0">Рмех = m·g·v  =  Рел = U·I = U² / R  →  Визначення маси (кг) через h та e</tspan></text>
<line x1="330.0" y1="105.0" x2="230.0" y2="205.0" stroke="#8e44ad" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="270.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">KJ = 2e/h</text>
<line x1="490.0" y1="105.0" x2="590.0" y2="205.0" stroke="#8e44ad" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="530.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">RK = h/e²</text>
<line x1="325.0" y1="250.0" x2="495.0" y2="250.0" stroke="#2c3e50" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="410.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle" font-weight="700">Закон Ома: I = V / R</text>
<line x1="210.0" y1="295.0" x2="310.0" y2="350.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="610.0" y1="295.0" x2="510.0" y2="350.0" stroke="#d35400" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>