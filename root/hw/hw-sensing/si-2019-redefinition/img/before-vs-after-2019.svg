<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 840 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="840" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="820.0" height="420.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фундаментальна зміна підвалин SI: до та після 20 травня 2019 року</text>
<line x1="410.0" y1="48.0" x2="410.0" y2="395.0" stroke="#d6dde6" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="205.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">До 2019 року (Класична SI)</text>
<rect x="25.0" y="80.0" width="360.0" height="52.0" rx="4" fill="#fdf2e9" stroke="#d35400" stroke-width="1.3"/>
<text x="205.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">Означення Ампера (1948)</text>
<text x="205.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Через безкінечно довгі паралельні дроти</text>
<text x="205.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">у вакуумі на відстані 1 м</text>
<rect x="25.0" y="140.0" width="360.0" height="52.0" rx="4" fill="#fef9e7" stroke="#d35400" stroke-width="1.3"/>
<text x="205.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">Магнітна стала μ₀</text>
<text x="205.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">μ₀ = 4π × 10⁻⁷ Гн/м (ТОЧНА за означенням)</text>
<text x="205.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ε₀ = 1/(μ₀c²) — також точна</text>
<rect x="25.0" y="200.0" width="360.0" height="52.0" rx="4" fill="#fadbd8" stroke="#c0392b" stroke-width="1.3"/>
<text x="205.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Еталон маси (IPK)</text>
<text x="205.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Платиново-іридієвий циліндр у Севрі</text>
<text x="205.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(маса нестабільна, дрейфувала)</text>
<rect x="25.0" y="260.0" width="360.0" height="52.0" rx="4" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.3"/>
<text x="205.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">Константи e та h</text>
<text x="205.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Вимірювалися експериментально</text>
<text x="205.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">мали похибку вимірювання (±10⁻⁸)</text>
<rect x="25.0" y="320.0" width="360.0" height="52.0" rx="4" fill="#ebedef" stroke="#2c3e50" stroke-width="1.3"/>
<text x="205.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle" font-weight="700">Електричні еталони</text>
<text x="205.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">V₉₀ та Ω₉₀ відірвані від SI через</text>
<text x="205.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">неточність знань про e та h</text>
<text x="615.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">З 20 травня 2019 року (Нова SI)</text>
<rect x="435.0" y="80.0" width="360.0" height="52.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.3"/>
<text x="615.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Означення Ампера (2019)</text>
<text x="615.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Фіксацією елементарного заряду e:</text>
<text x="615.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1 А = e / (1.602 176 634 × 10⁻¹⁹ с)</text>
<rect x="435.0" y="140.0" width="360.0" height="52.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.3"/>
<text x="615.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Магнітна стала μ₀</text>
<text x="615.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">μ₀ = 2αh / (e²c) (ВИМІРЮВАНА величина!)</text>
<text x="615.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Має похибку через сталу тонкої структури α</text>
<rect x="435.0" y="200.0" width="360.0" height="52.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.3"/>
<text x="615.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Еталон маси (кг)</text>
<text x="615.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Через сталу Планка h та ваги Кіббла</text>
<text x="615.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(артефакт IPK відправлено в музей)</text>
<rect x="435.0" y="260.0" width="360.0" height="52.0" rx="4" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.3"/>
<text x="615.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">Константи e та h</text>
<text x="615.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Зафіксовані ЗАКЛАДНИМИ ЧИСЛАМИ</text>
<text x="615.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">похибка вимірювання дорівнює нулю!</text>
<rect x="435.0" y="320.0" width="360.0" height="52.0" rx="4" fill="#eab8c4" stroke="#2457d6" stroke-width="1.3"/>
<text x="615.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Електричні еталони</text>
<text x="615.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Джозефсон і Холл реалізують В і Ом</text>
<text x="615.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ПРЯМО в одиницях SI без коефіцієнтів V₉₀</text>
</svg>