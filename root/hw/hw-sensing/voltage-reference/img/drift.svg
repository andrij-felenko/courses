<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">АЦП довіряє Vref беззастережно; похибка опорної на 1 % = похибка кожного виміру на 1 %</text>
