<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 750 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="750" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три вороги точності, які прибирають калібруванням</text>
<text x="132.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повзучість (creep)</text>
<line x1="42.0" y1="250.0" x2="222.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="42.0" y1="250.0" x2="42.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.5"/>
<polyline points="42.0,250.0 62.0,170.0 72.0,170.0 72.0,170.0 87.0,167.8 102.0,165.6 117.0,163.4 132.0,161.2 147.0,159.0 162.0,156.8 177.0,154.6 192.0,152.4 207.0,150.2 222.0,148.0" fill="none" stroke="#e08a3c" stroke-width="2.4"/>
<text x="132.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">вага стала, а покази</text>
<text x="132.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">повзуть — пружина «тече»</text>
