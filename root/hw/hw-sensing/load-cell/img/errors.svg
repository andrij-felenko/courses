<line x1="282.0" y1="250.0" x2="462.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="282.0" y1="250.0" x2="282.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="282.0" y1="230.0" x2="452.0" y2="140.0" stroke="#2457d6" stroke-width="2.2"/>
<line x1="282.0" y1="245.0" x2="452.0" y2="170.0" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="6,4"/>
<text x="432.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end">холодно</text>
