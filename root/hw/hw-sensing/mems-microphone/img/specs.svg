<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чути числами: шум, опора 94 дБ, перевантаження</text>
<line x1="300.0" y1="340.0" x2="300.0" y2="72.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">гучність (дБ SPL)</text>
<line x1="292.0" y1="319.2" x2="308.0" y2="319.2" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="292.0" y1="204.8" x2="308.0" y2="204.8" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="292.0" y1="100.8" x2="308.0" y2="100.8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="316.0" y="323.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">шумова підлога (EIN) — тихіше давач не чує</text>
<text x="316.0" y="208.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">94 дБ SPL — опорний звук (1 Па, гучна розмова)</text>
<text x="316.0" y="104.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">AOP — гучніше сигнал спотворюється (10% THD)</text>
<line x1="240.0" y1="319.2" x2="240.0" y2="204.8" stroke="#27ae60" stroke-width="2.0"/>
<line x1="234.0" y1="319.2" x2="246.0" y2="319.2" stroke="#27ae60" stroke-width="2.0"/>
<line x1="234.0" y1="204.8" x2="246.0" y2="204.8" stroke="#27ae60" stroke-width="2.0"/>
<text x="228.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">SNR</text>
<text x="228.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-style="italic">= 94 − EIN</text>
<line x1="150.0" y1="319.2" x2="150.0" y2="100.8" stroke="#2457d6" stroke-width="2.0"/>
<line x1="144.0" y1="319.2" x2="156.0" y2="319.2" stroke="#2457d6" stroke-width="2.0"/>
<line x1="144.0" y1="100.8" x2="156.0" y2="100.8" stroke="#2457d6" stroke-width="2.0"/>
<text x="138.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700"><tspan x="138.0" dy="0.0">динамічний</tspan><tspan x="138.0" dy="15.0">діапазон</tspan></text>
<rect x="57.4" y="377.8" width="665.2" height="36.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="400.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">три числа задають давач: як тихо чує (EIN), запас до опори (SNR), доки не спотворить (AOP)</tspan></text>
</svg>