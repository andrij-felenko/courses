<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хитрість: сталий заряд робить напругу дзеркалом руху</text>
<rect x="90.0" y="105.0" width="170.0" height="90.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.0"/><text x="175.0" y="138.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">помпа заряду</tspan><tspan x="175.0" dy="16.2">кладе фіксований</tspan><tspan x="175.0" dy="16.2">заряд Q (~10 В)</tspan></text>
<line x1="266.0" y1="150.0" x2="330.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="376.0" y1="116.0" x2="456.0" y2="116.0" stroke="#2457d6" stroke-width="4.0"/>
<line x1="376.0" y1="156.0" x2="456.0" y2="156.0" stroke="#8a8a8a" stroke-width="4.0"/>
<text x="416.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Q = const</text>
<text x="416.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="416.0" dy="0.0">C змінюється</tspan><tspan x="416.0" dy="14.3">(рух мембрани)</tspan></text>
<line x1="466.0" y1="150.0" x2="536.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="542.0" y="105.0" width="190.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="637.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="637.0" dy="0.0">напруга</tspan><tspan x="637.0" dy="18.2">V = Q / C</tspan><tspan x="637.0" dy="18.2">→ іде за рухом</tspan></text>
<rect x="75.6" y="307.5" width="668.8" height="37.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="330.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">заряд тримають сталим, тож напруга V = Q/C прямо повторює зміну ємності — сигнал</tspan></text>
</svg>