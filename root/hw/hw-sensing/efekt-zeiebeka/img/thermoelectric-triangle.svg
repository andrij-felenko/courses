<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фундаментальний термоелектричний трикутник і співвідношення Кельвіна</text>
<line x1="410.0" y1="100.0" x2="170.0" y2="310.0" stroke="#333333" stroke-width="2.2"/>
<line x1="410.0" y1="100.0" x2="650.0" y2="310.0" stroke="#333333" stroke-width="2.2"/>
<line x1="170.0" y1="310.0" x2="650.0" y2="310.0" stroke="#333333" stroke-width="2.2"/>
<rect x="280.0" y="50.0" width="260.0" height="86.0" rx="8" fill="#fef9e7" stroke="#b9770e" stroke-width="2.0"/><text x="410.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b9770e" text-anchor="middle" font-weight="700">Ефект Зеєбека (S)</text><text x="410.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Генерація ЕРС від градієнта T</tspan><tspan x="410.0" dy="14.3">E_th = S · ∇T</tspan><tspan x="410.0" dy="14.3">S = перенос ентропії зарядом</tspan></text>
<rect x="40.0" y="270.0" width="260.0" height="86.0" rx="8" fill="#fbeee6" stroke="#c0392b" stroke-width="2.0"/><text x="170.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Ефект Пельтьє (Π)</text><text x="170.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Виділення/поглинання тепла на спаї</tspan><tspan x="170.0" dy="14.3">Q_P = Π · I</tspan><tspan x="170.0" dy="14.3">стрибок ентропії на межі</tspan></text>
<rect x="520.0" y="270.0" width="260.0" height="86.0" rx="8" fill="#edf2fa" stroke="#2457d6" stroke-width="2.0"/><text x="650.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Ефект Томсона (τ)</text><text x="650.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Об'ємне тепло струму в grad T</tspan><tspan x="650.0" dy="14.3">dQ_Th/dx = τ · I · (dT/dx)</tspan><tspan x="650.0" dy="14.3">зміна теплоємності носіїв</tspan></text>
<rect x="134.6" y="161.2" width="220.9" height="47.6" rx="6" fill="#fdfefe" stroke="#27ae60" stroke-width="1.5"/><text x="245.0" y="181.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">1-е співвідношення Кельвіна</tspan><tspan x="245.0" dy="15.6">Π = S · T</tspan></text>
<rect x="464.6" y="161.2" width="220.9" height="47.6" rx="6" fill="#fdfefe" stroke="#27ae60" stroke-width="1.5"/><text x="575.0" y="181.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="575.0" dy="0.0">2-е співвідношення Кельвіна</tspan><tspan x="575.0" dy="15.6">τ = T · (dS / dT)</tspan></text>
<rect x="289.5" y="294.2" width="241.0" height="31.5" rx="6" fill="#fdfefe" stroke="#6b7280" stroke-width="1.5"/><text x="410.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">dΠ/dT − (S_A − S_B) = τ_A − τ_B</tspan></text>
<rect x="82.1" y="384.2" width="655.8" height="31.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Термодинамічне обґрунтування базується на симетрії кінетичних коефіцієнтів Онзагера (L_12 = L_21)</tspan></text>
</svg>