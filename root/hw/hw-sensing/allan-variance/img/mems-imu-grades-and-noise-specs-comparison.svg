<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Порівняння кривих девіації Аллана для трьох класів інерційних сенсорів</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Три порядки різниці за нестабільністю зсуву (BI) та кутовим блуканням (ARW)</text>

  <!-- Left Main Plot Panel -->
  <rect x="24" y="74" width="630" height="364" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="339" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Криві девіації Аллана σ_y(τ) у логарифмічних координатах</text>

  <!-- Axes -->
  <line x1="60" y1="380" x2="620" y2="380" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="626" y="384" font-size="12" font-weight="bold" fill="#1a1a1a">τ [s]</text>
  <line x1="80" y1="400" x2="80" y2="120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="86" y="128" font-size="12" font-weight="bold" fill="#1a1a1a">σ_y(τ) [°/s]</text>

  <!-- Grid lines horizontal -->
  <line x1="75" y1="160" x2="610" y2="160" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="70" y="164" text-anchor="end" font-size="12" fill="#6b7280">10⁻¹</text>

  <line x1="75" y1="220" x2="610" y2="220" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="70" y="224" text-anchor="end" font-size="12" fill="#6b7280">10⁻²</text>

  <line x1="75" y1="280" x2="610" y2="280" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="70" y="284" text-anchor="end" font-size="12" fill="#6b7280">10⁻³</text>

  <line x1="75" y1="340" x2="610" y2="340" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="70" y="344" text-anchor="end" font-size="12" fill="#6b7280">10⁻⁴</text>

  <!-- Vertical Grid ticks on tau -->
  <text x="120" y="400" text-anchor="middle" font-size="12" fill="#6b7280">0.1</text>
  <line x1="220" y1="375" x2="220" y2="385" stroke="#6b7280" stroke-width="1"/>
  <text x="220" y="400" text-anchor="middle" font-size="12" fill="#1a1a1a">1 s</text>
  <text x="320" y="400" text-anchor="middle" font-size="12" fill="#6b7280">10</text>
  <line x1="420" y1="375" x2="420" y2="385" stroke="#6b7280" stroke-width="1"/>
  <text x="420" y="400" text-anchor="middle" font-size="12" fill="#1a1a1a">100 s</text>
  <line x1="520" y1="375" x2="520" y2="385" stroke="#6b7280" stroke-width="1"/>
  <text x="520" y="400" text-anchor="middle" font-size="12" fill="#1a1a1a">1000 s</text>

  <!-- Curve 1: Consumer MEMS (Red) -->
  <path d="M 100 140 Q 280 230 480 140" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="280" cy="207" r="4" fill="#c0392b"/>
  <text x="280" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Споживчий МЕМС (BI ≈ 20 °/hr)</text>

  <!-- Curve 2: Tactical MEMS / FOG (Blue) -->
  <path d="M 100 210 Q 380 300 560 220" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="380" cy="277" r="4" fill="#2457d6"/>
  <text x="380" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Тактичний клас (BI ≈ 0.5 °/hr)</text>

  <!-- Curve 3: Navigation Grade RLG / FOG (Green) -->
  <path d="M 100 280 Q 490 370 600 320" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="490" cy="347" r="4" fill="#27ae60"/>
  <text x="490" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Навігаційний клас (BI &lt; 0.005 °/hr)</text>

  <!-- Right Panel: Comparison Cards -->
  <rect x="670" y="74" width="266" height="364" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="803" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Метрологічні класи IMU</text>

  <!-- Card 1: Consumer -->
  <rect x="682" y="120" width="242" height="90" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="692" y="140" font-size="13" font-weight="bold" fill="#c0392b">1. Споживчий (Consumer)</text>
  <text x="692" y="160" font-size="12" fill="#1a1a1a">ARW: 0.1 – 0.5 °/√hr</text>
  <text x="692" y="178" font-size="12" fill="#1a1a1a">BI: 10 – 50 °/hr</text>
  <text x="692" y="196" font-size="12" fill="#6b7280">Оптимум τ_opt: 5 – 20 s</text>

  <!-- Card 2: Tactical -->
  <rect x="682" y="222" width="242" height="90" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="692" y="242" font-size="13" font-weight="bold" fill="#2457d6">2. Тактичний (Tactical)</text>
  <text x="692" y="262" font-size="12" fill="#1a1a1a">ARW: 0.01 – 0.08 °/√hr</text>
  <text x="692" y="280" font-size="12" fill="#1a1a1a">BI: 0.1 – 1.0 °/hr</text>
  <text x="692" y="298" font-size="12" fill="#6b7280">Оптимум τ_opt: 50 – 300 s</text>

  <!-- Card 3: Navigation -->
  <rect x="682" y="324" width="242" height="98" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="692" y="344" font-size="13" font-weight="bold" fill="#27ae60">3. Навігаційний (Nav-Grade)</text>
  <text x="692" y="364" font-size="12" fill="#1a1a1a">ARW: &lt; 0.002 °/√hr</text>
  <text x="692" y="382" font-size="12" fill="#1a1a1a">BI: &lt; 0.005 °/hr</text>
  <text x="692" y="400" font-size="12" fill="#6b7280">Оптимум τ_opt: &gt; 1000 s</text>
</svg>
