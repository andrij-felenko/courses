<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Перетворення спектральної густини потужності (PSD) у девіацію Аллана (ADEV)</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Смуговий фільтр Аллана сканує спектр на частотах f ≈ 0.371/τ, трансформуючи h_α·f^α у нахили τ^μ</text>

  <!-- Panel 1: Frequency Domain PSD -->
  <rect x="24" y="74" width="280" height="364" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="164" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">1. Спектр потужності S_y(f)</text>
  <text x="164" y="122" text-anchor="middle" font-size="12" fill="#6b7280">S_y(f) = ∑ h_α · f^α</text>

  <!-- Plot 1 -->
  <line x1="50" y1="330" x2="280" y2="330" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="286" y="334" font-size="12" font-weight="bold" fill="#1a1a1a">f</text>
  <line x1="70" y1="350" x2="70" y2="145" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="76" y="152" font-size="12" font-weight="bold" fill="#1a1a1a">S_y(f)</text>

  <!-- Slopes in PSD -->
  <path d="M 80 160 L 140 270" stroke="#c0392b" stroke-width="2"/>
  <text x="85" y="175" font-size="12" font-weight="bold" fill="#c0392b">1/f² (RWFM)</text>

  <path d="M 100 230 L 190 285" stroke="#2457d6" stroke-width="2"/>
  <text x="145" y="240" font-size="12" font-weight="bold" fill="#2457d6">1/f (FFM)</text>

  <path d="M 140 300 L 260 300" stroke="#27ae60" stroke-width="2"/>
  <text x="190" y="294" font-size="12" font-weight="bold" fill="#27ae60">f⁰ (WFM)</text>

  <!-- Info Box 1 -->
  <rect x="36" y="365" width="256" height="55" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="44" y="385" font-size="12" fill="#1a1a1a">Низькі частоти f → 0:</text>
  <text x="44" y="405" font-size="12" fill="#c0392b">Спектр розбігається при f → 0</text>

  <!-- Panel 2: Bandpass Allan Filter -->
  <rect x="320" y="74" width="320" height="364" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">2. Смуговий фільтр |H_A(f)|²</text>
  <text x="480" y="122" text-anchor="middle" font-size="12" fill="#6b7280">|H_A(f)|² = 2 · sin⁴(π f τ) / (π f τ)²</text>

  <!-- Plot 2 -->
  <line x1="340" y1="330" x2="620" y2="330" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="626" y="334" font-size="12" font-weight="bold" fill="#1a1a1a">f</text>
  <line x1="360" y1="350" x2="360" y2="145" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="366" y="152" font-size="12" font-weight="bold" fill="#1a1a1a">|H|²</text>

  <!-- Filter shapes for tau_1 (fast) and tau_2 (slow) -->
  <path d="M 360 330 C 375 328, 395 190, 410 190 C 425 190, 445 328, 460 330" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="410" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">τ_велика</text>

  <path d="M 360 330 C 390 328, 460 190, 480 190 C 500 190, 530 328, 550 330" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="480" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">τ_середня</text>

  <path d="M 360 330 C 410 328, 540 190, 560 190 C 580 190, 600 328, 610 330" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="570" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">τ_мала</text>

  <!-- Info Box 2 -->
  <rect x="332" y="365" width="296" height="55" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="340" y="385" font-size="12" fill="#1a1a1a">Інтегральне зважування:</text>
  <text x="340" y="405" font-size="12" fill="#27ae60">σ_y²(τ) = ∫ S_y(f) · |H_A(f)|² df  (нуль при f=0)</text>

  <!-- Panel 3: Time Domain ADEV -->
  <rect x="656" y="74" width="280" height="364" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="796" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">3. Девіація Аллана σ_y(τ)</text>
  <text x="796" y="122" text-anchor="middle" font-size="12" fill="#6b7280">Нахил μ = −(α + 1) / 2</text>

  <!-- Plot 3 -->
  <line x1="680" y1="330" x2="910" y2="330" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="916" y="334" font-size="12" font-weight="bold" fill="#1a1a1a">τ</text>
  <line x1="700" y1="350" x2="700" y2="145" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="706" y="152" font-size="12" font-weight="bold" fill="#1a1a1a">σ_y(τ)</text>

  <!-- V-curve in ADEV -->
  <!-- Left slope mu = -1/2 -->
  <path d="M 715 170 L 780 270" stroke="#27ae60" stroke-width="2.5"/>
  <text x="770" y="180" font-size="12" font-weight="bold" fill="#27ae60">μ = −½ (ARW)</text>

  <!-- Bottom flat mu = 0 -->
  <path d="M 780 270 L 825 270" stroke="#2457d6" stroke-width="2.5"/>
  <text x="802" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">μ = 0 (BI)</text>

  <!-- Right slope mu = +1/2 -->
  <path d="M 825 270 L 890 170" stroke="#c0392b" stroke-width="2.5"/>
  <text x="815" y="225" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">μ = +½ (RRW)</text>

  <!-- Info Box 3 -->
  <rect x="668" y="365" width="256" height="55" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="676" y="385" font-size="12" fill="#1a1a1a">Метрологічний висновок:</text>
  <text x="676" y="405" font-size="12" fill="#2457d6">Нахил визначає фізику шуму</text>
</svg>
