<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Класична схема встик проти перекривної схеми OAVAR</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Зсув кластерів на один крок вибірки збільшує число пар різниць у m разів і звужує довірчі інтервали</text>

  <!-- Верхня панель: Класична схема встик (AVAR) -->
  <rect x="30" y="70" width="900" height="165" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="50" y="94" font-size="14" font-weight="bold" fill="#1a1a1a">Класична схема встик (AVAR): крок зсуву дорівнює довжині кластера (крок = m · τ₀)</text>

  <!-- Блоки кластерів встик -->
  <!-- Блок 1 -->
  <rect x="50" y="110" width="190" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="145" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Кластер 1 (m відліків)</text>

  <!-- Блок 2 -->
  <rect x="250" y="110" width="190" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="345" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Кластер 2 (m відліків)</text>

  <!-- Блок 3 -->
  <rect x="450" y="110" width="190" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="545" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Кластер 3 (m відліків)</text>

  <!-- Блок 4 -->
  <rect x="650" y="110" width="190" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="745" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Кластер 4 (m відліків)</text>

  <!-- Підписи різниць для AVAR -->
  <text x="50" y="175" font-size="12" fill="#1a1a1a">Пара різниці 1: (ȳ₂ − ȳ₁)</text>
  <text x="450" y="175" font-size="12" fill="#1a1a1a">Пара різниці 2: (ȳ₄ − ȳ₃)</text>
  <text x="50" y="205" font-size="12" fill="#c0392b">Загальна кількість пар: K − 1 = ⌊N / m⌋ − 1. На великих τ лишається лише 2–3 пари (велика похибка)</text>

  <!-- Нижня панель: Перекривна схема (OAVAR) -->
  <rect x="30" y="250" width="900" height="195" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="50" y="274" font-size="14" font-weight="bold" fill="#1a1a1a">Перекривна схема (OAVAR): крок зсуву дорівнює одному відліку (крок = 1 · τ₀)</text>

  <!-- Зсув 0: Пара 1 -->
  <rect x="50" y="290" width="180" height="28" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="140" y="309" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Кластер A (відлік 1..m)</text>

  <rect x="235" y="290" width="180" height="28" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="325" y="309" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Кластер B (відлік m+1..2m)</text>

  <text x="430" y="309" font-size="12" fill="#1a1a1a">← Різниця #1 для зсуву j = 1</text>

  <!-- Зсув 1: Пара 2 -->
  <rect x="70" y="325" width="180" height="28" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="160" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Кластер A' (відлік 2..m+1)</text>

  <rect x="255" y="325" width="180" height="28" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="345" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Кластер B' (відлік m+2..2m+1)</text>

  <text x="450" y="344" font-size="12" fill="#1a1a1a">← Різниця #2 для зсуву j = 2 (+1 відлік)</text>

  <!-- Зсув 2: Пара 3 -->
  <rect x="90" y="360" width="180" height="28" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="2 2"/>
  <text x="180" y="379" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Кластер A'' (відлік 3..m+2)</text>

  <rect x="275" y="360" width="180" height="28" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="2 2"/>
  <text x="365" y="379" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Кластер B'' (відлік m+3..2m+2)</text>

  <text x="470" y="379" font-size="12" fill="#1a1a1a">← Різниця #3 для зсуву j = 3 (+2 відліки)</text>

  <text x="50" y="415" font-size="12" fill="#27ae60">Загальна кількість пар у OAVAR: N − 2m + 1. Зростання обсягу статистичних пар на 2–3 порядки</text>
  <text x="50" y="433" font-size="12" fill="#27ae60">✔ Довірчий інтервал звужується у √(m) разів при тому самому обсязі вихідного експерименту</text>
</svg>
