<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Кластеризація часового ряду та обчислення різниці середніх за Алланом</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Усереднення у вікнах τ пригнічує білий шум, а різниця сусідніх кластерів усуває постійне зміщення</text>

  <!-- Верхня панель: Часовий ряд і кластери -->
  <rect x="30" y="70" width="900" height="180" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="50" y="94" font-size="14" font-weight="bold" fill="#1a1a1a">1. Розбиття дискретного ряду вибірок y(t) на суміжні кластери тривалістю τ = m · τ₀</text>

  <!-- Лінія осі часу -->
  <line x1="50" y1="215" x2="905" y2="215" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="910" y="219" font-size="12" font-weight="bold" fill="#1a1a1a">t</text>

  <!-- Кластер k-1 (попередній) -->
  <rect x="55" y="112" width="105" height="85" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <text x="107" y="158" text-anchor="middle" font-size="12" fill="#6b7280">Кластер k−1</text>

  <!-- Кластер k -->
  <rect x="175" y="108" width="290" height="92" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="320" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Кластер k (тривалість τ)</text>
  <!-- Точки вибірок кластера k -->
  <circle cx="195" cy="170" r="3" fill="#2457d6"/>
  <circle cx="230" cy="155" r="3" fill="#2457d6"/>
  <circle cx="265" cy="175" r="3" fill="#2457d6"/>
  <circle cx="300" cy="160" r="3" fill="#2457d6"/>
  <circle cx="335" cy="150" r="3" fill="#2457d6"/>
  <circle cx="370" cy="168" r="3" fill="#2457d6"/>
  <circle cx="405" cy="158" r="3" fill="#2457d6"/>
  <circle cx="440" cy="162" r="3" fill="#2457d6"/>
  <!-- Лінія середнього k -->
  <line x1="185" y1="162" x2="455" y2="162" stroke="#2457d6" stroke-width="2.5"/>
  <text x="320" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Середнє кластера: ȳₖ(τ)</text>

  <!-- Кластер k+1 -->
  <rect x="485" y="108" width="290" height="92" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="630" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Кластер k+1 (тривалість τ)</text>
  <!-- Точки вибірок кластера k+1 -->
  <circle cx="505" cy="148" r="3" fill="#27ae60"/>
  <circle cx="540" cy="140" r="3" fill="#27ae60"/>
  <circle cx="575" cy="152" r="3" fill="#27ae60"/>
  <circle cx="610" cy="138" r="3" fill="#27ae60"/>
  <circle cx="645" cy="145" r="3" fill="#27ae60"/>
  <circle cx="680" cy="135" r="3" fill="#27ae60"/>
  <circle cx="715" cy="142" r="3" fill="#27ae60"/>
  <circle cx="750" cy="140" r="3" fill="#27ae60"/>
  <!-- Лінія середнього k+1 -->
  <line x1="495" y1="142" x2="765" y2="142" stroke="#27ae60" stroke-width="2.5"/>
  <text x="630" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Середнє кластера: ȳₖ₊₁(τ)</text>

  <!-- Кластер k+2 (наступний) -->
  <rect x="790" y="112" width="105" height="85" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <text x="842" y="158" text-anchor="middle" font-size="12" fill="#6b7280">Кластер k+2</text>

  <!-- Розмірні стрілки τ -->
  <line x1="175" y1="233" x2="465" y2="233" stroke="#2457d6" stroke-width="1.2"/>
  <text x="320" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">τ = m · τ₀ (m вибірок)</text>

  <line x1="485" y1="233" x2="775" y2="233" stroke="#27ae60" stroke-width="1.2"/>
  <text x="630" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">τ = m · τ₀ (m вибірок)</text>

  <!-- Нижня ліва панель: Різниця середніх -->
  <rect x="30" y="265" width="440" height="175" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="50" y="290" font-size="14" font-weight="bold" fill="#1a1a1a">2. Оператор різниці суміжних середніх</text>
  <text x="50" y="316" font-size="12" fill="#1a1a1a">Різниця середніх між парою сусідніх блоків:</text>

  <rect x="50" y="328" width="400" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="250" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Δȳₖ(τ) = ȳₖ₊₁(τ) − ȳₖ(τ)</text>

  <text x="50" y="385" font-size="12" fill="#27ae60">✔ Постійне зміщення нуля скасовується: (y₀ − y₀) = 0</text>
  <text x="50" y="408" font-size="12" fill="#27ae60">✔ Низькочастотний дрейф фільтрується другою різницею фази</text>
  <text x="50" y="428" font-size="12" fill="#6b7280">✔ Забезпечує збіжність для флікер-шуму та випадкового блукання</text>

  <!-- Нижня права панель: Формула дисперсії Аллана -->
  <rect x="490" y="265" width="440" height="175" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="510" y="290" font-size="14" font-weight="bold" fill="#1a1a1a">3. Статистична оцінка дисперсії Аллана σ_y²(τ)</text>
  <text x="510" y="316" font-size="12" fill="#1a1a1a">Усереднення квадратів різниць по K кластерах ряду:</text>

  <rect x="510" y="328" width="400" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="710" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">σ_y²(τ) = ½ · ⟨(ȳₖ₊₁(τ) − ȳₖ(τ))²⟩</text>

  <text x="510" y="385" font-size="12" fill="#1a1a1a">Коефіцієнт ½ зрівнює AVAR із класичною дисперсією σ² для білого шуму</text>
  <text x="510" y="408" font-size="12" fill="#1a1a1a">Девіація Аллана (ADEV): σ_y(τ) = √(σ_y²(τ)) у фізичних одиницях сенсора</text>
  <text x="510" y="428" font-size="12" fill="#6b7280">Перекривний розрахунок (OAVAR) максимізує кількість ступенів вільності</text>
</svg>
