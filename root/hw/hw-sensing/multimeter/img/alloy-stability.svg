<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380">
<rect width="820" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Таємниця точності: сплав, що не «пливе» від тепла</text>
<text x="410.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">опір приладу мусить лишатися сталим; манганін майже не змінює його з температурою (§3.4)</text>
<line x1="130.0" y1="320.0" x2="130.0" y2="90.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="122.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="end" font-weight="normal" font-style="normal">опір R</text>
<line x1="130.0" y1="320.0" x2="700.0" y2="320.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="706.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">температура</text>
<polyline points="130.0,250.0 680.0,130.0" fill="none" stroke="#c0271e" stroke-width="3"/>
<text x="560.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">звичайний метал (мідь): R росте</text>
<polyline points="130.0,250.0 680.0,244.0" fill="none" stroke="#1f8a3b" stroke-width="3"/>
<text x="560.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">манганін: R майже сталий</text>
<rect x="150.0" y="336.0" width="520.0" height="38.0" rx="8" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="410.0" y="359.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Прилад точний лише тоді, коли його внутрішні опори не змінюються — звідси спеціальні сплави.</text>
</svg>
