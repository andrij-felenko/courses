<text x="410.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Цей спосіб працює навіть там, де є залежні джерела (підсилювачі) — їх не «вимкнути».</text>
