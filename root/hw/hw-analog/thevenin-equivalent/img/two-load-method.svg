<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Метод двох навантажень: дві точки задають пряму джерела</text>
<line x1="90.0" y1="360.0" x2="584.0" y2="360.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="90.0" y1="360.0" x2="90.0" y2="56.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="580.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-style="italic">струм I</text>
<text x="82.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">напруга V</text>
<line x1="90.0" y1="104.2" x2="560.0" y2="136.6" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="6 4"/>
<circle cx="90.0" cy="104.2" r="5.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="102.0" y="94.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Vth (екстрап. до I = 0)</text>
<line x1="204.6" y1="112.1" x2="204.6" y2="360.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<line x1="204.6" y1="112.1" x2="90.0" y2="112.1" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<circle cx="204.6" cy="112.1" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="214.6" y="103.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">навантаження R₁</text>
<line x1="481.6" y1="131.2" x2="481.6" y2="360.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<line x1="481.6" y1="131.2" x2="90.0" y2="131.2" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<circle cx="481.6" cy="131.2" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="491.6" y="122.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">навантаження R₂</text>
<text x="407.1" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">нахил = −Rth</text>
<rect x="600.0" y="110.0" width="150.0" height="250.0" rx="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="675.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві пари (I, V):</text>
<text x="614.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">V₁ = Vth − I₁·Rth</text>
<text x="614.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">V₂ = Vth − I₂·Rth</text>
<line x1="614.0" y1="202.0" x2="736.0" y2="202.0" stroke="#e0e3e6" stroke-width="1.2"/>
<text x="614.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Rth = (V₁−V₂)/(I₂−I₁)</text>
<text x="614.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Vth = V₁ + I₁·Rth</text>
<line x1="614.0" y1="268.0" x2="736.0" y2="268.0" stroke="#e0e3e6" stroke-width="1.2"/>
<text x="614.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Ні відкритих,</text>
<text x="614.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">ні замкнених клем —</text>
<text x="614.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">лише два R.</text>
</svg>