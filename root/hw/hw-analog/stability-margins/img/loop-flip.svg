<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому додаткові −180° роблять зв'язок небезпечним</text>
<text x="360.0" y="69.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Задумано: зворотний сигнал ПРОТИДІЄ (низькі частоти)</text>
<rect x="101.2" y="78.8" width="97.5" height="32.5" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="99.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">підсилювач</tspan></text>
<rect x="311.2" y="78.8" width="97.5" height="32.5" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="99.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">коло ЗЗ  β</tspan></text>
<line x1="205.0" y1="95.0" x2="312.0" y2="95.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="70.0" cy="95.0" r="16.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="70.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<line x1="86.0" y1="95.0" x2="104.0" y2="95.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="408.0" y1="95.0" x2="408.0" y2="61.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="408.0" y1="61.0" x2="70.0" y2="61.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="70.0" y1="61.0" x2="70.0" y2="79.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="240.0" y="53.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">повертається у протифазі → гасить</text>
<text x="360.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">На частоті, де кола додали ще −180° зсуву:</text>
<rect x="101.2" y="218.8" width="97.5" height="32.5" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="239.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">підсилювач</tspan></text>
<rect x="314.0" y="218.8" width="92.0" height="32.5" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="239.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">+(−180°)</tspan></text>
<line x1="205.0" y1="235.0" x2="312.0" y2="235.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="70.0" cy="235.0" r="16.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="70.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<line x1="86.0" y1="235.0" x2="104.0" y2="235.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="408.0" y1="235.0" x2="408.0" y2="269.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="408.0" y1="269.0" x2="70.0" y2="269.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="70.0" y1="269.0" x2="70.0" y2="251.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="240.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">повертається У ФАЗІ → підсилює (лавина)</text>
<rect x="495.0" y="80.0" width="200.0" height="150.0" rx="6" fill="#fff8f0" stroke="#c0392b" stroke-width="1.5"/><text x="595.0" y="101.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Знак «−» дає 180°.</tspan><tspan x="595.0" dy="14.3">Ще −180° від затримок</tspan><tspan x="595.0" dy="14.3">у колі = разом 360°,</tspan><tspan x="595.0" dy="14.3">тобто 0°: сигнал</tspan><tspan x="595.0" dy="14.3">повертається У ФАЗІ.</tspan><tspan x="595.0" dy="14.3"></tspan><tspan x="595.0" dy="14.3">Якщо там |Aβ| ще ≥ 1 —</tspan><tspan x="595.0" dy="14.3">коло саме себе</tspan><tspan x="595.0" dy="14.3">розгойдує: ГЕНЕРАЦІЯ.</tspan></text>
</svg>