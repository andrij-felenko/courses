<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460">
<rect width="820" height="460" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому фільтр на f_c віддає рівно половину: Піфагор</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">на частоті зрізу R = X_C — катети трикутника напруг рівні</text>
<line x1="250.0" y1="330.0" x2="400.0" y2="330.0" stroke="#b5732e" stroke-width="3" stroke-linecap="round"/>
<line x1="400.0" y1="330.0" x2="400.0" y2="180.0" stroke="#1f47b5" stroke-width="3" stroke-linecap="round"/>
<line x1="250.0" y1="330.0" x2="400.0" y2="180.0" stroke="#c0271e" stroke-width="3" stroke-linecap="round"/>
<rect x="384.0" y="314.0" width="16.0" height="16.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
<rect x="250.0" y="336.0" width="150.0" height="44.0" rx="0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="325.0" y="363.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f6e33" text-anchor="middle" font-weight="bold" font-style="normal">V_R² = 0.5</text>
<rect x="406.0" y="180.0" width="44.0" height="150.0" rx="0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="428.0" y="255.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f6e33" text-anchor="middle" font-weight="bold" font-style="normal">0.5</text>
<text x="311.0" y="229.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">V_вх = 1</text>
<text x="325.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#b5732e" text-anchor="middle" font-weight="bold" font-style="normal">V_R = 0.707</text>
<text x="348.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">V_C = 0.707</text>
<text x="520.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Піфагор для напруг (§2.4.2):</text>
<text x="520.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">V_R² + V_C² = V_вх²</text>
<text x="520.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">на f_c катети рівні, тож</text>
<text x="520.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">V_C² = V_вх²/2</text>
<text x="520.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">квадрат напруги — це потужність:</text>
<text x="520.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">вихід несе половину</text>
<text x="520.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">у децибелах:</text>
<text x="520.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">10·log(0.5) = −3.01 дБ</text>
<text x="410.0" y="430.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одиниця квадрата вхідної амплітуди чесно розпадається на дві рівні половини — звідси і «точка половинної потужності»</text>
</svg>
