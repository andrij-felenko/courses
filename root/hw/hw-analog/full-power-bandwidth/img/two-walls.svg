<rect x="86.7" y="378.4" width="546.7" height="63.2" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="398.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Дві незалежні стелі. Похила (FPBW) обмежує великий розмах і падає з частотою;</tspan><tspan x="360.0" dy="15.6">вертикаль (смуга) від розмаху не залежить. Сигнал чистий лише під обома —</tspan><tspan x="360.0" dy="15.6">на ваших частоті й розмаху кусає та стеля, що нижча.</tspan></text>
