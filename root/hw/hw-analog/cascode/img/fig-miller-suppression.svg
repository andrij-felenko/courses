<rect x="40.0" y="220.0" width="330.0" height="130.0" rx="6" fill="#fff5f5" stroke="#f5c2c7" stroke-width="1.5"/><text x="205.0" y="264.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Розрахунок міллерівського струму:</tspan><tspan x="205.0" dy="11.7">• Падіння напруги: ΔV = 10 мВ − (−1500 мВ) = 1510 мВ</tspan><tspan x="205.0" dy="11.7">• Заряд, що вливається: Q = C_cb · 151 · Δv_вх</tspan><tspan x="205.0" dy="11.7">• Еквівалентна вхідна ємність: C_in,M = 5 пФ · 151 = 755 пФ</tspan><tspan x="205.0" dy="11.7">• Смуга пропускання каскаду падає в 151 раз!</tspan></text>
