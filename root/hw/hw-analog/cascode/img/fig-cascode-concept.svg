<rect x="35.0" y="275.0" width="345.0" height="130.0" rx="6" fill="#fff5f5" stroke="#f5c2c7" stroke-width="1.5"/><text x="207.5" y="317.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="207.5" dy="0.0">Проблема ефекту Міллера:</tspan><tspan x="207.5" dy="13.0">• Великий розмах вихідної напруги: v_out = −A_v · v_in</tspan><tspan x="207.5" dy="13.0">• Різниця потенціалів на C_cb: ΔV = v_in · (1 + A_v)</tspan><tspan x="207.5" dy="13.0">• Роздута вхідна ємність C_вх ≈ C_π + (1 + A_v)·C_cb</tspan><tspan x="207.5" dy="13.0">• Вхідний полюс різко обмежує робочу смугу частот</tspan></text>
