<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бар'єр у петлі: сигнал крізь, постійний контур землі — стоп</text>
<line x1="410.0" y1="60.0" x2="410.0" y2="314.0" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 6"/>
<rect x="377.7" y="36.0" width="64.6" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="56.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">БАР'ЄР</tspan></text>
<text x="205.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">бік давача — земля A</text>
<text x="615.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">бік приймача — земля B</text>
<rect x="110.0" y="115.0" width="210.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="143.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Вхід ізолятора</tspan><tspan x="215.0" dy="15.6">читає струм петлі,</tspan><tspan x="215.0" dy="15.6">керує світлом/полем</tspan></text>
<rect x="490.0" y="115.0" width="210.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="595.0" y="143.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">Вихід ізолятора</tspan><tspan x="595.0" dy="15.6">відновлює струм,</tspan><tspan x="595.0" dy="15.6">живить нову петлю</tspan></text>
<line x1="320.0" y1="155.0" x2="490.0" y2="155.0" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="410.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">світло / поле</text>
<text x="410.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e7a46" text-anchor="middle">несе СИГНАЛ</text>
<rect x="145.4" y="262.4" width="139.1" height="45.3" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="215.0" y="281.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e7a46" text-anchor="middle"><tspan x="215.0" dy="0.0">так: змінний сигнал</tspan><tspan x="215.0" dy="14.3">(значення струму)</tspan></text>
<rect x="509.8" y="262.4" width="170.5" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="595.0" y="281.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="595.0" dy="0.0">ні: постійний контур</tspan><tspan x="595.0" dy="14.3">струму землі — розірвано</tspan></text>
<text x="215.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">живлення A</text>
<text x="595.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">живлення B (ізольоване DC-DC)</text>
</svg>