<rect x="255.0" y="118.0" width="230.0" height="100.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="136.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">I_S</tspan><tspan x="370.0" dy="18.2">перенос крізь базу</tspan><tspan x="370.0" dy="18.2">q·A·D_n·n_B0</tspan><tspan x="370.0" dy="18.2">────────────</tspan><tspan x="370.0" dy="18.2">L_n·sinh(W_B/L_n)</tspan></text><rect x="30.0" y="120.0" width="170.0" height="84.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="115.0" y="149.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">прямий хід</tspan><tspan x="115.0" dy="16.9">V_BE вганяє,</tspan><tspan x="115.0" dy="16.9">колектор збирає</tspan></text><line x1="202.0" y1="158.0" x2="252.0" y2="166.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/><text x="227.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">α_F·I_ES</text><rect x="540.0" y="120.0" width="172.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="626.0" y="149.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="626.0" dy="0.0">обернений хід</tspan><tspan x="626.0" dy="16.9">V_BC вганяє,</tspan><tspan x="626.0" dy="16.9">емітер збирає</tspan></text><line x1="538.0" y1="158.0" x2="488.0" y2="166.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/><text x="513.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">α_R·I_CS</text><text x="370.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="70