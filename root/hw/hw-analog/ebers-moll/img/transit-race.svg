<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="70.0" y="130.0" width="90.0" height="140.0" rx="0" fill="#eaf0fd" stroke="#333333" stroke-width="1.0"/><rect x="160.0" y="130.0" width="400.0" height="140.0" rx="0" fill="#fdecea" stroke="#333333" stroke-width="1.0"/><rect x="560.0" y="130.0" width="90.0" height="140.0" rx="0" fill="#eaf0fd" stroke="#333333" stroke-width="1.0"/><text x="115.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">емітер</text><text x="605.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">колектор</text><text x="360.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">база (тонка, W_B ≪ L_n)</text><line x1="164.0" y1="155.0" x2="556.0" y2="155.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="164.0" y1="188.0" x2="556.0" y2="188.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/><line x1="164.0" y1="221.0" x2="556.0" y2="221.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/><text x="360.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">майже всі долітають до колектора</text><line x1="164.0" y1="251.0" x2="360.0" y2="251.0" stroke="#c0392b" stroke-width="2.2"/><line x1="352.0" y1="243.0" x2="368.0" y2="259.0" stroke="#c0392b" stroke-width="2.4"/><line x1="352.0" y1="259.0" x2="368.0" y2="243.0" stroke="#c0392b" stroke-width="2.4"/><text x="372.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">рекомбінація → I_Б</text><text x="70.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">гонка двох часів:</text><rect x="70.0" y="340.0" width="70.0" height="16.0" rx="3" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/><text x="152.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">τ_B — проліт бази  =  W_B²/(2·D_n)</text><rect x="70.0" y="372.0" width="380.0" height="16.0" rx="3" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/><text x="462.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">τ_n — час життя</text><text x="70.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">втрачена частка = τ_B/τ_n   →   α_T ≈ 1 − τ_B/τ_n</text>
</svg>