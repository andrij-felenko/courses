<rect x="72.7" y="256.2" width="594.6" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">LNA — найперший активний елемент після антени: він бачить сигнал ще крихітним.</tspan><tspan x="370.0" dy="15.6">Його власний шум лягає на цей сигнал у повну силу — тому каскад має бути найтихіший.</tspan></text>
