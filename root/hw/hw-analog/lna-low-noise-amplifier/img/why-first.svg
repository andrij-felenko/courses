<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому LNA ставлять першим: великим підсиленням він топить шум решти тракту</text>
<text x="30.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">LNA попереду (велике G тихо підсилює):</text>
<line x1="30.0" y1="110.0" x2="70.0" y2="110.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="20.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">вх</text>
<path d="M70.0 84.0 L70.0 136.0 L128.0 110.0 Z" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="93.2" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">LNA</text>
<text x="93.2" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">G=25 дБ</text>
<line x1="128.0" y1="110.0" x2="170.0" y2="110.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<path d="M170.0 84.0 L170.0 136.0 L228.0 110.0 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="193.2" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">зміш.</text>
<text x="193.2" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">+шумить</text>
<line x1="228.0" y1="110.0" x2="270.0" y2="110.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="290.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">вих</text>
<text x="180.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сигнал уже великий — шум змішувача топиться</text>
<rect x="470.0" y="132.0" width="64.0" height="8.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="502.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">5%</text>
<text x="600.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">шум змішувача</text>
<text x="600.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">на вході</text>
<line x1="40.0" y1="200.0" x2="680.0" y2="200.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="30.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">без LNA (змішувач бачить кволий сигнал першим):</text>
<line x1="30.0" y1="300.0" x2="70.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="20.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">вх</text>
<path d="M70.0 274.0 L70.0 326.0 L128.0 300.0 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="93.2" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">зміш.</text>
<text x="93.2" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">G≈0 дБ</text>
<line x1="128.0" y1="300.0" x2="170.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<path d="M170.0 274.0 L170.0 326.0 L228.0 300.0 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="193.2" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">—</text>
<text x="193.2" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">+шумить</text>
<line x1="228.0" y1="300.0" x2="270.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="290.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">вих</text>
<text x="180.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">слабкий сигнал — шум змішувача лягає в повну силу</text>
<rect x="470.0" y="219.6" width="64.0" height="110.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="502.0" y="212.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">92%</text>
<text x="600.0" y="268.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">шум змішувача</text>
<text x="600.0" y="283.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">на вході</text>
<rect x="73.0" y="381.2" width="574.0" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="401.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Той самий шумливий змішувач. Попереду тихий LNA з великим G — і шум змішувача,</tspan><tspan x="360.0" dy="15.6">зведений до входу, поділений на цей G майже в нуль. Без LNA він б'є в повну силу.</tspan></text>
</svg>