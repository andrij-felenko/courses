<text x="266.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">1 ГОм (волого)</text>
<line x1="250.0" y1="275.0" x2="250.0" y2="315.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="220.0" y1="315.0" x2="280.0" y2="315.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="250.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">сусідній вузол  5 В</text>
<rect x="361.4" y="95.0" width="307.3" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="515.0" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">Корисне джерело МІЦНЕ за напругою, але</tspan><tspan x="515.0" dy="15.6">слабке за струмом (100 ГОм). Витік 1 ГОм</tspan><tspan x="515.0" dy="15.6">до 5-вольтового сусіда — це дільник, де</tspan><tspan x="515.0" dy="15.6">брудний вузол майже жорсткий, а корисний</tspan><tspan x="515.0" dy="15.6">ні. Вхід підтягується до ≈ 4.95 В — сигнал</tspan><tspan x="515.0" dy="15.6">розчавлено, ще до підсилювача.</tspan></text>
