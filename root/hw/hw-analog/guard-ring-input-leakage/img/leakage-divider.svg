<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Витік — це паразитний резистор: дільник топить високоомний сигнал</text>
<text x="120.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">джерело сигналу</text>
<line x1="120.0" y1="78.0" x2="120.0" y2="165.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="108.0" y="88.0" width="24.0" height="70.0" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="150.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Rджерела</text>
<text x="150.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">= 100 ГОм</text>
<line x1="120.0" y1="165.0" x2="250.0" y2="165.0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="250.0" cy="165.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="250.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">вхід (високоомний)</text>
<path d="M268.0 143.0 L268.0 187.0 L316.0 165.0 Z" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="333.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">до АЦП</text>
<line x1="250.0" y1="165.0" x2="250.0" y2="215.0" stroke="#c0392b" stroke-width="2.0"/>
<rect x="238.0" y="215.0" width="24.0" height="60.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
