<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Заряд у базі керує струмом: профіль носіїв і число Ґуммеля</text><line x1="156.0" y1="420.0" x2="840.0" y2="420.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/><line x1="156.0" y1="420.0" x2="156.0" y2="102.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/><text x="838.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-style="italic">x (поперек бази)</text><text x="150.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-style="italic">густина носіїв (не в масштабі)</text><line x1="156.0" y1="420.0" x2="156.0" y2="116.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2 4"/><line x1="690.0" y1="420.0" x2="690.0" y2="116.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2 4"/><text x="156.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">емітерний край</text><text x="690.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">колекторний край</text><text x="423.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">нейтральна база, ширина W</text><rect x="156.0" y="262.0" width="534.0" height="158.0" fill="#eaf7ee" stroke="none"/><line x1="156.0" y1="262.0" x2="690.0" y2="262.0" stroke="#27ae60" stroke-width="2.4"/><text x="684.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">p ≈ N_A  (дірки = легування)</text><text x="406.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">площа = число Ґуммеля  G_B = ∫ N_A dx</text><polygon points="156.0,150.0 690.0,420.0 156.0,420.0" fill="#e7edfb" stroke="none"/><line x1="156.0" y1="150.0" x2="690.0" y2="420.0" stroke="#2457d6" stroke-width="2.6"/><text x="164.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">n(x): вприснуті електрони</text><text x="284.0" y="198.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">нахил → I_К (дифузія)</text><text x="306.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">площа → рухомий заряд Q_diff</text><rect x="154.0" y="60.0" width="256.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="282.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="282.0" dy="0.0">n(0) = (n_i² / N_A)·e^(V_BE/Vₜ)</tspan></text><rect x="468.0" y="60.0" width="224.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="580.0" y="79.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Ерлі: колектор з'їдає базу</tspan><tspan x="580.0" dy="15.6">→ G_B ↓ → q_b &lt; 1</tspan></text><line x1="642.0" y1="420.0" x2="642.0" y2="218.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5 3"/><line x1="684.0" y1="238.0" x2="644.0" y2="238.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>