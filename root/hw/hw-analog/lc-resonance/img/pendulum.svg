<text x="150.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ω = √(k/m)</text>
<text x="150.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">важча маса чи м'якша</text>
<text x="150.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">пружина → повільніше</text>
<text x="395.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="normal" font-style="normal">зміщення x</text>
<line x1="415.0" y1="116.0" x2="455.0" y2="116.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aGrey)"/>
