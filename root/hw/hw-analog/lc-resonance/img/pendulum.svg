<text x="395.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="normal" font-style="normal">жорсткість k</text>
<line x1="415.0" y1="268.0" x2="455.0" y2="268.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aGrey)"/>
<line x1="455.0" y1="268.0" x2="415.0" y2="268.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aGrey)"/>
<text x="475.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">1/C</text>
<text x="395.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="normal" font-style="normal">½·m·v²</text>
<line x1="415.0" y1="306.0" x2="455.0" y2="306.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aGrey)"/>
<line x1="455.0" y1="306.0" x2="415.0" y2="306.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aGrey)"/>
<text x="475.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">½·L·i²  (§2.2.3)</text>
<text x="395.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="normal" font-style="normal">½·k·x²</text>
<line x1="415.0" y1="344.0" x2="455.0" y2="344.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aGrey)"/>
<line x1="455.0" y1="344.0" x2="415.0" y2="344.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aGrey)"/>
<text x="475.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">½·q²/C  (§2.1.3)</text>
<line x1="650.0" y1="130.0" x2="750.0" y2="130.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="650.0" y1="130.0" x2="650.0" y2="280.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
