<text x="700.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ω = 1/√(L·C)</text>
<text x="700.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">більша «маса» L чи м'якша</text>
<text x="700.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">«пружина» (більший C) → повільніше</text>
<text x="410.0" y="440.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">підставте у механічну формулу m → L і k → 1/C — і дістанете Томсона: ω = √((1/C)/L) = 1/√(LC)</text>
<text x="410.0" y="464.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">корінь — бо частота задається через ω², а в ω² компоненти входять симетричним добутком</text>
</svg>
