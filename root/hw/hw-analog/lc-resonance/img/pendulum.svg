<text x="395.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="normal" font-style="normal">маса m (інерція)</text>
<line x1="415.0" y1="230.0" x2="455.0" y2="230.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aGrey)"/>
<line x1="455.0" y1="230.0" x2="415.0" y2="230.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aGrey)"/>
