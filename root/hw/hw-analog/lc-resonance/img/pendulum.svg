<text x="395.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="normal" font-style="normal">швидкість v</text>
<line x1="415.0" y1="154.0" x2="455.0" y2="154.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aGrey)"/>
<line x1="455.0" y1="154.0" x2="415.0" y2="154.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aGrey)"/>
<text x="475.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">струм i</text>
<text x="395.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="normal" font-style="normal">сила пружини</text>
