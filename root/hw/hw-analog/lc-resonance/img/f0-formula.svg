<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300">
<rect width="700" height="300" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="350.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Резонансна частота</text>
<text x="160.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="32" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">f₀</text>
<text x="210.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="28" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">=</text>
<text x="310.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="28" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<line x1="255.0" y1="142.0" x2="470.0" y2="142.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<text x="360.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2π · √(L·C)</text>
<line x1="360.0" y1="210.0" x2="360.0" y2="184.0" stroke="#1f8a3b" stroke-width="1.8" marker-end="url(#aGreen)"/>
<text x="360.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">↑ L·C → ↓ f₀ (повільніше гойдання)</text>
<rect x="110.0" y="232.0" width="480.0" height="48.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="350.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Залежить ТІЛЬКИ від добутку L·C — ні від опору, ні від амплітуди.</text>
<text x="350.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Під коренем: щоб подвоїти f₀, треба зменшити L·C вчетверо.</text>
</svg>
