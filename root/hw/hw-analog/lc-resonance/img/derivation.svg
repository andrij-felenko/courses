<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480">
<rect width="820" height="480" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">LC-петля без джерела: рівняння пише сама схема</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">конденсатор і котушка ділять ту саму напругу й той самий струм — це і є рівняння коливань</text>
<line x1="110.0" y1="130.0" x2="230.0" y2="130.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="110.0" y1="130.0" x2="110.0" y2="300.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="110.0" y1="300.0" x2="230.0" y2="300.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="105.0" y1="199.0" x2="105.0" y2="231.0" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round"/>
<line x1="115.0" y1="199.0" x2="115.0" y2="231.0" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round"/>
<text x="84.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">C</text>
<line x1="230.0" y1="130.0" x2="230.0" y2="175.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<path d="M 230,175 A 13 12.5 0 0 1 230,200" fill="none" stroke="#b5732e" stroke-width="2.4"/>
<path d="M 230,200 A 13 12.5 0 0 1 230,225" fill="none" stroke="#b5732e" stroke-width="2.4"/>
<path d="M 230,225 A 13 12.5 0 0 1 230,250" fill="none" stroke="#b5732e" stroke-width="2.4"/>
<path d="M 230,250 A 13 12.5 0 0 1 230,275" fill="none" stroke="#b5732e" stroke-width="2.4"/>
<line x1="230.0" y1="275.0" x2="230.0" y2="300.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<text x="262.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">L</text>
<line x1="150.0" y1="315.0" x2="190.0" y2="315.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<text x="170.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">той самий струм i</text>
<text x="330.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">спільна напруга:  v_C = v_L = v</text>
<text x="330.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">котушка:       v = L · di/dt</text>
<text x="330.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">конденсатор:   i = −C · dv/dt   (розряджається)</text>
<line x1="330.0" y1="220.0" x2="750.0" y2="220.0" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round"/>
<text x="330.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">підставимо одне в одне:</text>
<text x="330.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">d²v/dt² = − v / (L·C)</text>
<text x="330.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">«прискорення протилежне відхиленню» —</text>
<text x="330.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">це рівняння гармонічних коливань;</text>
<text x="330.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">розв'язок — синусоїда (дві похідні = поворот</text>
<text x="330.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">на 2×90° = мінус, §2.3.4m) із  ω² = 1/(L·C)</text>
<text x="410.0" y="440.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">f₀ = ω₀/2π = 1/(2π·√(L·C)) — формула Томсона, здобута з самої динаміки контуру</text>
</svg>
