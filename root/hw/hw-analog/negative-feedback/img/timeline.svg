</defs>
<text x="484.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дев'ять років недовіри: від ідеї (1927) до патенту (1937)</text>
<text x="99.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1923</text>
<rect x="18.0" y="88.0" width="162.0" height="112.0" rx="8" fill="#fdf1dc" stroke="#9bb0c2" stroke-width="1.5"/>
<text x="99.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">прямий зв'язок</text>
<text x="99.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(feedforward) —</text>
<text x="99.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">надто капризний</text>
<text x="271.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1927</text>
<rect x="190.0" y="88.0" width="162.0" height="112.0" rx="8" fill="#eef6ef" stroke="#9bb0c2" stroke-width="1.5"/>
<text x="271.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">пором через Гудзон:</text>
<text x="271.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">від'ємний</text>
<text x="271.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">зворотний зв'язок</text>
<text x="443.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1928</text>
<rect x="362.0" y="88.0" width="162.0" height="112.0" rx="8" fill="#e9eefb" stroke="#9bb0c2" stroke-width="1.5"/>
<text x="443.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">заявка на патент;</text>
<text x="443.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">бюро не вірить,</text>
<text x="443.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">що працює</text>
<text x="615.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1932</text>
<rect x="534.0" y="88.0" width="162.0" height="112.0" rx="8" fill="#e9eefb" stroke="#9bb0c2" stroke-width="1.5"/>
<text x="615.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Найквіст:</text>
<text x="615.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">теорія</text>
<text x="615.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">стійкості</text>
<text x="787.0" y="80.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1937</text>
<rect x="706.0" y="88.0" width="162.0" height="112.0" rx="8" fill="#eef6ef" stroke="#9bb0c2" stroke-width="1.5"/>
<text x="787.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">патент видано —</text>
<text x="787.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">по дев'яти</text>
<text x="787.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">роках</text>
<line x1="181.0" y1="144.0" x2="189.0" y2="144.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<line x1="353.0" y1="144.0" x2="361.0" y2="144.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<line x1="525.0" y1="144.0" x2="533.0" y2="144.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<line x1="697.0" y1="144.0" x2="705.0" y2="144.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<text x="484.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Ідея була така зухвала, що патентне бюро дев'ять років вважало її неможливою — як вічний двигун.</text>
