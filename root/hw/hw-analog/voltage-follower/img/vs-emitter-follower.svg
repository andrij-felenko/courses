<text x="520.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">підсилення = 1 (рівно)</text>
<text x="360.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Та сама робота — розв'язка опорів. Але ОП робить її точніше: рівно ×1, вхід більший, вихід жорсткіший.</text>
