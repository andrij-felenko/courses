<text x="360.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Буфер на ОП = ідеальний емітерний повторювач</text>
