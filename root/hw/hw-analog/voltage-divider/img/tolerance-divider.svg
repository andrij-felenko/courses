<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400">
<rect width="860" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="430.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Похибка дільника з реальних резисторів</text>
<text x="430.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожен резистор має допуск ±t — як він просочується у вихід V_вих?</text>
<line x1="175.0" y1="92.0" x2="175.0" y2="286.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
<rect x="149.0" y="118.0" width="52.0" height="46.0" rx="6" fill="#eef2fb" stroke="#1f47b5" stroke-width="2"/>
<text x="175.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">R₁</text>
<text x="175.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">±t</text>
<circle cx="175.0" cy="190.0" r="4.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="191.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">V_вих</text>
<rect x="149.0" y="216.0" width="52.0" height="46.0" rx="6" fill="#eef2fb" stroke="#1f47b5" stroke-width="2"/>
<text x="175.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">R₂</text>
<text x="175.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">±t</text>
<text x="175.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+V</text>
<line x1="151.0" y1="286.0" x2="199.0" y2="286.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="160.0" y1="291.0" x2="190.0" y2="291.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="168.0" y1="296.0" x2="182.0" y2="296.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="175.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">k = R₂/(R₁+R₂)</text>
<rect x="355.0" y="90.0" width="475.0" height="256.0" rx="10" fill="#f7f7f7" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="592.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Відносна похибка частки k:</text>
<text x="375.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">dk/k = [R₁/(R₁+R₂)] · (ε₂ − ε₁)</text>
<text x="375.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">де ε — відносне відхилення кожного R.</text>
<line x1="375.0" y1="190.0" x2="812.0" y2="190.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="375.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Головне: важить РІЗНИЦЯ ε₂ − ε₁,</text>
<text x="375.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">а не сума — бо обидва R стоять у відношенні.</text>
<text x="375.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Гірший випадок (|ε₂ − ε₁| = 2t):</text>
<text x="392.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">|dV_вих / V_вих| ≈ (1 − k) · 2t</text>
<text x="375.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Напр., навпіл (k=0.5) із ±1% → гірше ±1 %.</text>
</svg>
