<rect x="781.8" y="150.2" width="76.4" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="820.0" y="169.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">1-бітний</tspan><tspan x="820.0" dy="14.3">квантувач</tspan><tspan x="820.0" dy="14.3">(Δ)</tspan></text>
<text x="820.0" y="223.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">та сама 1-бітна логіка</text>
<line x1="702.3" y1="180.0" x2="781.8" y2="180.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="930.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1-бітний</text>
<text x="930.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">потік</text>
<line x1="858.2" y1="180.0" x2="960.0" y2="180.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="820.0" y1="209.8" x2="820.0" y2="310.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,3"/>
