<text x="545.7" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ЗЗ</text>
<text x="720.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">кодує сам сигнал (не нахил)</text>
<text x="720.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">шум виштовхується у високі частоти → усередненням → 24 біти</text>
<rect x="594.0" y="337.4" width="252.0" height="45.3" rx="6" fill="#f4eafb" stroke="#6b7280" stroke-width="1.5"/><text x="720.0" y="356.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Δ = різниця (спадок Делорена/Катлера)</tspan><tspan x="720.0" dy="14.3">Σ = доданий форвардний інтегратор</tspan></text>
