<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що зробили в Токіо 1962-го: переставити інтегратор уперед</text>
<text x="480.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">один крок — і зникає перевантаження нахилом, з'являється формування шуму й сенс обох літер назви</text>
<text x="240.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класична дельта-модуляція</text>
<text x="240.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(Делорен, 1946; де Ягер, 1952)</text>
<circle cx="150.0" cy="180.0" r="18.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="150.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">Δ</text>
<text x="150.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">вузол
різниці</text>
<rect x="222.4" y="150.2" width="95.2" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="270.0" y="169.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">1-бітний</tspan><tspan x="270.0" dy="14.3">квантувач</tspan><tspan x="270.0" dy="14.3">(компаратор)</tspan></text>
<text x="270.0" y="223.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">виходить ±1 кожен такт</text>
