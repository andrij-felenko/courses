<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
<rect width="960" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ЦАП в ESP32: два 8-бітні канали на GPIO25 і GPIO26</text>
<text x="480.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">пишеш число 0..255 — на ніжці з'являється напруга 0..~3.3 В (без жодного фільтра)</text>
<rect x="70.0" y="110.0" width="250.0" height="180.0" rx="12" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="195.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ESP32</text>
<rect x="100.0" y="158.0" width="190.0" height="56.0" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="195.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">8-біт ЦАП × 2</text>
<text x="195.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(вбудований, апаратний)</text>
<line x1="320.0" y1="168.0" x2="470.0" y2="168.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="395.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">GPIO25 (DAC1)</text>
<line x1="320.0" y1="232.0" x2="470.0" y2="232.0" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="395.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">GPIO26 (DAC2)</text>
<text x="486.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">0 .. ~3.3 В</text>
<text x="486.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">0 .. ~3.3 В</text>
<rect x="620.0" y="120.0" width="300.0" height="96.0" rx="10" fill="#fbfcff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="640.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">dacWrite(25, v);</text>
<text x="640.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">v = 0   → 0 В</text>
<text x="640.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">v = 128 → ≈ 1.65 В</text>
<text x="640.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">v = 255 → ≈ 3.3 В</text>
<rect x="70.0" y="312.0" width="410.0" height="70.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="275.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Вихід СЛАБКИЙ (високий опір).</text>
<text x="275.0" y="353.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Пряму ніжку — лише на високоомний вхід;</text>
<text x="275.0" y="369.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">для реального навантаження — буфер (ОП-підсилювач).</text>
<rect x="500.0" y="312.0" width="420.0" height="70.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="710.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Є в ESP32 та ESP32-S2.</text>
<text x="710.0" y="353.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">У ESP32-S3 / C3 / C6 ЦАП НЕМА —</text>
<text x="710.0" y="369.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.4" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">там аналог дають лише через ШІМ (пор. §20.7).</text>
</svg>
