<text x="470.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один крок (LSB) = Vref / 255 ≈ 3.3 / 255 ≈ 0.0129 В ≈ 12.9 мВ.</text>
<text x="470.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Більше біт — дрібніші сходинки; 8 біт дають 256 рівнів напруги.</text>
