<text x="806.0" y="105.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">код 255 → ≈ 3.3 В</text>
