<text x="480.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ШІМ дає аналог СЕРЕДНІМ (миготіння + фільтр + пульсація).</text>
<text x="480.0" y="343.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ЦАП дає аналог НАПРЯМУ — справжню напругу просто на ніжці.</text>
