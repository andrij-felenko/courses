<text x="480.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві дороги до аналогу: ШІМ імітує, ЦАП видає напряму</text>
<text x="480.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ціль одна — напруга 2.0 В: ШІМ миготить і усереднює, ЦАП ставить рівно стільки одразу</text>
<text x="255.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ШІМ (PWM) + RC-фільтр</text>
