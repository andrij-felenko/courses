<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300">
<rect width="700" height="300" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="350.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому «диференційна»: спільне відкидає, різницю підсилює</text>
<rect x="24.0" y="52.0" width="300.0" height="218.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="174.0" y="46.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">синфазно (обидва разом)</text>
<line x1="96.0" y1="196.0" x2="96.0" y2="120.0" stroke="#e0a32e" stroke-width="3" marker-end="url(#aInk)"/>
<line x1="252.0" y1="196.0" x2="252.0" y2="120.0" stroke="#e0a32e" stroke-width="3" marker-end="url(#aInk)"/>
<text x="96.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#e0a32e" text-anchor="middle" font-weight="bold" font-style="normal">↑ обидва</text>
<text x="252.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#e0a32e" text-anchor="middle" font-weight="bold" font-style="normal">↑ обидва</text>
<text x="174.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">поділ хвоста НЕ змінився</text>
<rect x="128.0" y="130.0" width="92.0" height="32.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="174.0" y="151.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">вихід = 0</text>
<text x="174.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">синфазна завада — відкинута</text>
<rect x="372.0" y="52.0" width="300.0" height="218.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="522.0" y="46.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">різниця</text>
<line x1="444.0" y1="196.0" x2="444.0" y2="120.0" stroke="#c0271e" stroke-width="3" marker-end="url(#aRed)"/>
<line x1="600.0" y1="120.0" x2="600.0" y2="196.0" stroke="#1f47b5" stroke-width="3" marker-end="url(#aBlue)"/>
<text x="444.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">↑ один</text>
<text x="600.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">↓ інший</text>
<rect x="476.0" y="138.0" width="92.0" height="32.0" rx="6" fill="#fbecec" stroke="#c0271e" stroke-width="1.5"/>
<text x="522.0" y="159.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">вихід ↑↑</text>
<text x="522.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">різницю — підсилює</text>
<text x="350.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Шум, наведений на обидва входи однаково, не зрушує поділ струму — і зникає. Лишається сама різниця.</text>
</svg>
