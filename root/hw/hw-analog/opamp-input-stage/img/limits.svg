<rect x="270.0" y="76.0" width="424.0" height="36.0" rx="6" fill="#f6f8fb" stroke="#c9d3dc" stroke-width="1.2"/>
<text x="284.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">неідеальна пара транзисторів</text>
