<text x="284.0" y="267.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">→ скінченна смуга</text>
<text x="360.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Кожна «вада» — це слід реального транзистора всередині. Магії нема — є інженерія.</text>
