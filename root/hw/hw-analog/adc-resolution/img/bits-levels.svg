  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Біти → рівні: кожен біт ПОДВОЮЄ кількість рівнів</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">роздільність росте за степенем двійки — рівнів = 2 в степені N</text>
<rect x="150.0" y="92.0" width="21.6" height="28.0" rx="4" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="140.0" y="111.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">4 біт</text>
<text x="179.6" y="111.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">= 16 рівнів</text>
<rect x="150.0" y="138.0" width="43.2" height="28.0" rx="4" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="140.0" y="157.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">5 біт</text>
<text x="201.2" y="157.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">= 32 рівнів</text>
<rect x="150.0" y="184.0" width="86.4" height="28.0" rx="4" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="140.0" y="203.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">6 біт</text>
<text x="244.4" y="203.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">= 64 рівнів</text>
<rect x="150.0" y="230.0" width="172.8" height="28.0" rx="4" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="140.0" y="249.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">7 біт</text>
<text x="330.8" y="249.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">= 128 рівнів</text>
<rect x="150.0" y="276.0" width="345.6" height="28.0" rx="4" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="140.0" y="295.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">8 біт</text>
<text x="503.6" y="295.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">= 256 рівнів</text>
<rect x="150.0" y="322.0" width="691.2" height="28.0" rx="4" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.4"/>
<text x="140.0" y="341.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">9 біт</text>
<text x="849.2" y="341.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">= 512 рівнів</text>
<rect x="150.0" y="372.0" width="640.0" height="36.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="388.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">12 біт = 4096, 16 біт = 65536 — уже й не влазять у рисунок:</text>
<text x="470.0" y="403.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">подвоєння «вибухає». Тому кілька зайвих біт дають дуже дрібну шкалу.</text>
</svg>
