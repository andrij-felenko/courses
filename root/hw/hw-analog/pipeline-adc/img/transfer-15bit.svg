<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Передавальна крива щабля «1.5 біта»: три цифри, залишок завжди в ±Vref</text>
