<text x="449.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">залишок 0.84·Vref &lt; Vref: ще в межах</text>
<rect x="92.7" y="42.0" width="594.6" height="32.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="390.0" y="62.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">залишок = 2·Vвх − (D−1)·Vref,   D∈{0,1,2}   — нахил +2, крок −Vref на кожному порозі</tspan></text>
<rect x="82.5" y="524.2" width="615.1" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="544.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Кожен сегмент ходить лише від −Vref до +Vref — рівно вхідний діапазон наступного щабля.</tspan><tspan x="390.0" dy="15.6">Тому навіть зсунутий поріг не викидає залишок за межі: помилку добере наступний щабель.</tspan></text>
