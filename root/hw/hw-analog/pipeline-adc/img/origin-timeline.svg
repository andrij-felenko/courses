<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід конвеєра: від субдіапазону до надлишкового щабля 1.5-біта</text>
<line x1="90.0" y1="80.0" x2="90.0" y2="410.0" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="90.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">час</text>
<line x1="90.0" y1="86.0" x2="90.0" y2="72.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<circle cx="90.0" cy="80.0" r="7.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.6"/>
<text x="74.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end" font-weight="700">1950-ті</text>
<rect x="130.0" y="51.0" width="470.0" height="58.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.7"/>
<text x="142.0" y="69.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">Субдіапазонний АЦП</text>
<text x="142.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">грубо → залишок → точно;</text>
<text x="142.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">щоб зменшити число компараторів</text>
