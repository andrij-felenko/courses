<rect x="130.0" y="241.0" width="470.0" height="74.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.7"/>
<text x="142.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Аналогове усереднення</text>
<text x="142.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Сон, Томпсетт, Лакшмікумар,</text>
<text x="142.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Bell Labs: інша гілка — правити</text>
<text x="142.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">розкид конденсаторів у аналозі</text>
<circle cx="90.0" cy="363.8" r="7.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.6"/>
<text x="74.0" y="367.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">1992</text>
<rect x="130.0" y="318.8" width="470.0" height="90.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/>
<text x="142.0" y="336.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Щабель 1.5-біта · RSD</text>
<text x="142.0" y="354.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Льюїс та ін. — надлишковий</text>
<text x="142.0" y="370.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">щабель на 3 стани; Джінетті,</text>
<text x="142.0" y="386.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Єсперс, Вандемелебрук — принцип</text>
<text x="142.0" y="402.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">надлишкової знакової цифри</text>
