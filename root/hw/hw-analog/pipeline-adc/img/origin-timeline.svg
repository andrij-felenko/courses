<text x="142.0" y="165.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Цифрова корекція (пайплайн)</text>
<text x="142.0" y="183.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Льюїс і Ґрей, Берклі:</text>
