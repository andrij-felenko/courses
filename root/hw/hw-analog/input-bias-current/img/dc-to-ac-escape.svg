<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Утеча в змінний струм: як обійти власний струм входу</text>
<rect x="26.0" y="92.0" width="168.0" height="108.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="142.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">джерело сигналу</tspan><tspan x="110.0" dy="16.9">~10⁻¹⁵ А</tspan></text>
<rect x="226.0" y="92.0" width="168.0" height="108.0" rx="6" fill="#eaf5ee" stroke="#333333" stroke-width="1.5"/><text x="310.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">модулятор:</tspan><tspan x="310.0" dy="16.9">вібраційний</tspan><tspan x="310.0" dy="16.9">конденсатор,</tspan><tspan x="310.0" dy="16.9">варактор,</tspan><tspan x="310.0" dy="16.9">чоппер</tspan></text>
<line x1="197.0" y1="146.0" x2="222.0" y2="146.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="426.0" y="92.0" width="168.0" height="108.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="142.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">підсилювач</tspan><tspan x="510.0" dy="16.9">змінного струму</tspan></text>
<line x1="397.0" y1="146.0" x2="422.0" y2="146.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="626.0" y="92.0" width="168.0" height="108.0" rx="6" fill="#eaf5ee" stroke="#333333" stroke-width="1.5"/><text x="710.0" y="142.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">синхронний</tspan><tspan x="710.0" dy="16.9">детектор</tspan></text>
<line x1="597.0" y1="146.0" x2="622.0" y2="146.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="826.0" y="92.0" width="168.0" height="108.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="910.0" y="142.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">вихід:</tspan><tspan x="910.0" dy="16.9">постійна напруга</tspan></text>
<line x1="797.0" y1="146.0" x2="822.0" y2="146.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="310.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">постійне → змінне</text>
<text x="710.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">змінне → постійне</text>
<text x="310.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">нижній поріг задає витік самого модулятора</text>
<line x1="310.0" y1="66.0" x2="310.0" y2="88.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="194.2" y="265.1" width="631.6" height="53.9" rx="6" fill="#f7f7f9" stroke="#6b7280" stroke-width="1.5"/><text x="510.0" y="288.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Зсув і дрейф підсилювача сидять на постійному струмі, а сигнал уже на змінному —</tspan><tspan x="510.0" dy="16.9">тож похибки підсилювача його не торкаються. Ціна — несуча, смуга і зайва механіка.</tspan></text>
</svg>