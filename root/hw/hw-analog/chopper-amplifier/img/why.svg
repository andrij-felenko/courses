<rect x="141.9" y="283.4" width="396.2" height="45.3" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="340.0" y="302.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Підсилювач шумить найдужче там, де живе постійний сигнал.</tspan><tspan x="340.0" dy="14.3">Виносимо сигнал ВГОРУ — і підсилюємо вже не поруч із брудом.</tspan></text>
