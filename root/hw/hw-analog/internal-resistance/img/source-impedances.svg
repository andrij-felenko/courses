<rect x="110.0" y="360.0" width="680.0" height="50.0" rx="6" fill="#f4f7f4" stroke="#6b7280" stroke-width="1.5"/><text x="450.0" y="381.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">r росте, коли батарея сідає й на холоді, — тому стара чи мерзла «помирає під навантаженням».</tspan><tspan x="450.0" dy="14.3">Імпульсному споживачеві високоомне джерело (крона, таблетка) часто треба конденсатор поряд.</tspan></text>
