</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Логарифм — лічильник порядків: «у якому степені десятка дає це число?»</text>
<line x1="90.0" y1="200.0" x2="730.0" y2="200.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="90.0" y1="193.0" x2="90.0" y2="207.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="90.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="90.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">10⁰</text>
<text x="90.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">log = 0</text>
<line x1="303.3" y1="193.0" x2="303.3" y2="207.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="303.3" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">10</text>
<text x="303.3" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">10¹</text>
<text x="303.3" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">log = 1</text>
<line x1="516.7" y1="193.0" x2="516.7" y2="207.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="516.7" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">100</text>
