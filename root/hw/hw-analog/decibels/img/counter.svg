<text x="516.7" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">log = 2</text>
<line x1="730.0" y1="193.0" x2="730.0" y2="207.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="730.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1000</text>
<text x="730.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">10³</text>
<text x="730.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">log = 3</text>
<line x1="154.2" y1="193.0" x2="154.2" y2="207.0" stroke="#c0271e" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="154.2" cy="200.0" r="4.5" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<line x1="154.2" y1="136.0" x2="154.2" y2="188.0" stroke="#c0271e" stroke-width="1.8" marker-end="url(#aRed)"/>
<text x="162.2" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">2 = 10^0.301  →  log 2 ≈ 0.301</text>
<text x="154.2" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<text x="410.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">цілі відповіді — лише в круглих степенів; решта чисел живе між ними з дробовими логарифмами,</text>
<text x="410.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">і «двійка — це 30% шляху від 1 до 10, якщо міряти множниками»</text>
</svg>
