<rect x="560.0" y="150.0" width="230.0" height="120.0" rx="12" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="675.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">N = 3 вершини (вузли)</text>
<text x="675.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">B = 4 ребра (гілки)</text>
<text x="675.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">L = B − N + 1 = 2</text>
<text x="675.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(незалежні контури)</text>
<text x="410.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Та сама формула, що рахує контури кола, виросла з мостів Кенігсберга.</text>
