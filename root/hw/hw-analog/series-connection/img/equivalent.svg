<text x="190.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">100 + 220 + 330 Ω</text>
<text x="410.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="36" fill="#1a1a1a" text-anchor="middle" font-weight="700">≡</text>
