<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому опори додаються: R_екв = R₁ + R₂ + R₃</text>
<text x="400.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">спільний струм + закон Ома на кожному → опори складаються</text>
<line x1="100.0" y1="150.0" x2="100.0" y2="203.0" stroke="#1a1a1a" stroke-width="2.4"/><line x1="82.0" y1="203.0" x2="118.0" y2="203.0" stroke="#1a1a1a" stroke-width="3.0"/><line x1="90.0" y1="219.0" x2="110.0" y2="219.0" stroke="#1a1a1a" stroke-width="6.0"/><line x1="100.0" y1="219.0" x2="100.0" y2="280.0" stroke="#1a1a1a" stroke-width="2.4"/><text x="76.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">V</text>
<line x1="100.0" y1="150.0" x2="340.0" y2="150.0" stroke="#cf8b5e" stroke-width="2.2"/>
<line x1="100.0" y1="280.0" x2="340.0" y2="280.0" stroke="#cf8b5e" stroke-width="2.2"/>
<line x1="340.0" y1="150.0" x2="340.0" y2="280.0" stroke="#1a1a1a" stroke-width="2.2"/>
<rect x="130.0" y="142.0" width="52.0" height="16.0" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="156.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">R1</text>
<rect x="210.0" y="142.0" width="52.0" height="16.0" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="236.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">R2</text>
<rect x="288.0" y="142.0" width="52.0" height="16.0" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="314.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">R3</text>
<line x1="118.0" y1="150.0" x2="140.0" y2="150.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="118.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="italic">I</text>
<rect x="400.0" y="96.0" width="390.0" height="188.0" rx="12" fill="#f6f8fc" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="420.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">спільний струм I (однаковий скрізь)</text>
<text x="420.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">V₁ = I·R₁,   V₂ = I·R₂,   V₃ = I·R₃</text>
<text x="420.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">V = V₁ + V₂ + V₃ = I·(R₁+R₂+R₃)</text>
<rect x="420.0" y="216.0" width="350.0" height="46.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="595.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">R_екв = R₁ + R₂ + R₃</tspan></text>
</svg>