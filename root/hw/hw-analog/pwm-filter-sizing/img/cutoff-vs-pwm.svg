<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360">
<rect width="940" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Правило: зріз фільтра — добряче НИЖЧЕ за частоту ШІМ</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тоді постійне (середнє) проходить, а швидкі імпульси гасяться — лишається мала брижа</text>
<line x1="90.0" y1="250.0" x2="880.0" y2="250.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="884.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">частота</text>
<rect x="90.0" y="110.0" width="230.0" height="140.0" rx="0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="205.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">проходить</text>
<text x="205.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(середнє, пов.)</text>
<line x1="320.0" y1="110.0" x2="320.0" y2="250.0" stroke="#caa24a" stroke-width="1.8" stroke-dasharray="5,3" stroke-linecap="round"/>
<text x="320.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a6a14" text-anchor="middle" font-weight="bold" font-style="normal">зріз fc = 1/(2πRC)</text>
<polyline points="320.0,250.0 560.0,250.0" fill="none" stroke="#c0271e" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="320.0" y1="130.0" x2="620.0" y2="250.0" stroke="#c0271e" stroke-width="2" stroke-dasharray="2,2" stroke-linecap="round"/>
<line x1="700.0" y1="110.0" x2="700.0" y2="250.0" stroke="#1f47b5" stroke-width="1.8" stroke-dasharray="5,3" stroke-linecap="round"/>
<text x="700.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">частота ШІМ</text>
<text x="700.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(тут — глушиться)</text>
<rect x="150.0" y="290.0" width="640.0" height="56.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Бери зріз разів у 10 нижче за частоту ШІМ — пульсація стане малою.</text>
<text x="470.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Вища частота ШІМ → можна менший (швидший) фільтр за тієї ж рівності.</text>
</svg>
