<rect x="150.0" y="300.0" width="660.0" height="56.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Око й мотор усереднюють ШІМ самі; а для аналогового входу, ЦАП-подібного виходу чи звуку</text>
