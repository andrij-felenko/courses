<text x="65.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">f_clk</text>
<line x1="190.0" y1="150.0" x2="229.3" y2="150.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="209.7" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">Фаза θ(t)</text>
