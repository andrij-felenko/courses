<text x="410.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прямий цифровий синтез DDS</text>
<rect x="110.0" y="23.0" width="600.0" height="34.0" rx="6" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1.5"/><text x="410.0" y="44.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Принцип прямого цифрового синтезу (Direct Digital Synthesis — DDS)</tspan></text>
<rect x="90.0" y="118.4" width="100.0" height="63.2" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.5"/><text x="140.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Акумулятор</tspan><tspan x="140.0" dy="15.6">фази</tspan><tspan x="140.0" dy="15.6">(N біт)</tspan></text>
<rect x="229.3" y="118.4" width="161.4" height="63.2" rx="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/><text x="310.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">Перетворювач</tspan><tspan x="310.0" dy="15.6">фаза-амплітуда</tspan><tspan x="310.0" dy="15.6">(Таблиця ПЗУ / LUT)</tspan></text>
<rect x="410.5" y="118.4" width="139.0" height="63.2" rx="6" fill="#e8f8f5" stroke="#16a085" stroke-width="1.5"/><text x="480.0" y="150.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Цифро-аналоговий</tspan><tspan x="480.0" dy="15.6">перетворювач</tspan><tspan x="480.0" dy="15.6">(ЦАП / DAC)</tspan></text>
<rect x="573.0" y="118.4" width="153.9" height="63.2" rx="6" fill="#fef9e7" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="150.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Фільтр нижніх</tspan><tspan x="650.0" dy="15.6">частот (ФНЧ)</tspan><tspan x="650.0" dy="15.6">Reconstruction LPF</tspan></text>
<line x1="140.0" y1="78.4" x2="140.0" y2="118.4" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="140.0" y="70.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Код частоти (FTW)</text>
