<text x="561.3" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a085" text-anchor="middle">Східчастий sin</text>
<line x1="727.0" y1="150.0" x2="770.0" y2="150.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="760.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">Аналоговий sin(2π·f_out·t)</text>
<rect x="76.4" y="271.2" width="667.3" height="47.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="291.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Розрахунок вихідної частоти:  f_out = (FTW · f_clk) / 2ᴺ</tspan><tspan x="410.0" dy="15.6">Роздільна здатність: Δf = f_clk / 2ᴺ (для N = 32 біт та f_clk = 100 МГц: Δf ≈ 0.023 Гц)</tspan></text>
</svg>