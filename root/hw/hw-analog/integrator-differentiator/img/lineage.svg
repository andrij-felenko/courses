<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 710 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="710" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Естафета інтегратора: пів століття до першого ОП</text>
<line x1="150.0" y1="60.0" x2="150.0" y2="430.0" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="150.0" cy="78.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="134.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1876</text>
<text x="168.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">колесо на диску</text>
<text x="168.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Джеймс Томсон описав механічний інтегратор</text>
<circle cx="150.0" cy="136.7" r="6.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.5"/>
<text x="134.0" y="140.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1880-ті</text>
<text x="168.0" y="133.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">ідея є, сили нема</text>
<text x="168.0" y="150.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Кельвін хоче з'єднати інтегратори — та їхній вихід заслабкий</text>
<circle cx="150.0" cy="195.3" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="134.0" y="199.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1925</text>
<text x="168.0" y="192.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">підсилювач моменту</text>
<text x="168.0" y="209.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Німен дає інтеграторам силу крутити наступний</text>
<circle cx="150.0" cy="254.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="134.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1931</text>
<text x="168.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">диференціальний аналізатор</text>
<text x="168.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Буш (MIT): шість колес-на-диску розв'язують рівняння</text>
<circle cx="150.0" cy="312.7" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="134.0" y="316.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1941</text>
<text x="168.0" y="309.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">уже без шестерень</text>
<text x="168.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Гельцер (V-2) і M9 (Bell): інтегратор став електронним</text>
<circle cx="150.0" cy="371.3" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="134.0" y="375.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1947</text>
<text x="168.0" y="368.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">здобув ім'я</text>
<text x="168.0" y="385.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Раґаззіні, Рендолл, Расселл: «операційний підсилювач»</text>
<circle cx="150.0" cy="430.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="134.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1953</text>
<text x="168.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">у продажу</text>
<text x="168.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Філбрик K2-W: ОП-цеглинка за 22 долари</text>
<line x1="76.0" y1="283.3" x2="650.0" y2="283.3" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="636.0" y="271.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-style="italic">механіка</text>
<text x="636.0" y="303.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-style="italic">електроніка</text>
</svg>