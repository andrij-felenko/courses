<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360">
<rect width="820" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому це так: заряд не накопичується у вузлі</text>
<text x="410.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у вузлі нема де зберігати заряд — тож будь-якої миті вхід = вихід</text>
<line x1="150.0" y1="185.0" x2="360.0" y2="185.0" stroke="#cfe0f0" stroke-width="16" stroke-linecap="round"/>
<line x1="360.0" y1="185.0" x2="560.0" y2="130.0" stroke="#cfe0f0" stroke-width="16" stroke-linecap="round"/>
<line x1="360.0" y1="185.0" x2="560.0" y2="240.0" stroke="#cfe0f0" stroke-width="16" stroke-linecap="round"/>
<line x1="160.0" y1="185.0" x2="300.0" y2="185.0" stroke="#1f47b5" stroke-width="3" marker-end="url(#aBlue)"/>
<line x1="380.0" y1="171.0" x2="520.0" y2="138.0" stroke="#1f47b5" stroke-width="3" marker-end="url(#aBlue)"/>
<line x1="380.0" y1="199.0" x2="520.0" y2="232.0" stroke="#1f47b5" stroke-width="3" marker-end="url(#aBlue)"/>
<text x="210.0" y="163.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">＋</text>
<text x="250.0" y="163.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">＋</text>
<text x="290.0" y="163.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">＋</text>
<circle cx="360.0" cy="185.0" r="9.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="360.0" y="219.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вузол: ємності нема</text>
<circle cx="360.0" cy="185.0" r="30.0" fill="none" stroke="#c0271e" stroke-width="2"/>
<line x1="338.0" y1="207.0" x2="382.0" y2="163.0" stroke="#c0271e" stroke-width="2" stroke-linecap="round"/>
<rect x="120.0" y="290.0" width="580.0" height="56.0" rx="10" fill="#fff3e8" stroke="#e08030" stroke-width="1.6"/>
<text x="410.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Заряд зберігається (його не стає більше чи менше) і йому нема де осісти у вузлі —</text>
<text x="410.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тому скільки втекло, стільки тієї ж миті й витікає. Це і є перший закон.</text>
</svg>
