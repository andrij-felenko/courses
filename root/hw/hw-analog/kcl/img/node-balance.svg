  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Закон струмів: що втікає у вузол — те й витікає</text>
<text x="410.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">сума вхідних струмів дорівнює сумі вихідних</text>
<line x1="170.0" y1="150.0" x2="388.0" y2="187.0" stroke="#1f47b5" stroke-width="3" marker-end="url(#aBlue)"/>
<text x="210.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">I₁ = 5 А</text>
<line x1="170.0" y1="245.0" x2="388.0" y2="203.0" stroke="#1f47b5" stroke-width="3" marker-end="url(#aBlue)"/>
<text x="210.0" y="263.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">I₂ = 3 А</text>
<line x1="412.0" y1="187.0" x2="640.0" y2="135.0" stroke="#1f8a3b" stroke-width="3" marker-end="url(#aGreen)"/>
<text x="660.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">I₃ = 4 А</text>
<line x1="414.0" y1="195.0" x2="650.0" y2="195.0" stroke="#1f8a3b" stroke-width="3" marker-end="url(#aGreen)"/>
<text x="660.0" y="199.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">I₄ = 3 А</text>
<line x1="412.0" y1="203.0" x2="640.0" y2="255.0" stroke="#1f8a3b" stroke-width="3" marker-end="url(#aGreen)"/>
<text x="660.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">I₅ = 1 А</text>
<circle cx="400.0" cy="195.0" r="9.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="400.0" y="173.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вузол</text>
<rect x="150.0" y="300.0" width="520.0" height="62.0" rx="12" fill="#eaf0fb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="410.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ΣI_вх = ΣI_вих :   5 + 3  =  4 + 3 + 1  =  8 А</text>
<text x="410.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">те саме як ΣI = 0 :   +5 + 3 − 4 − 3 − 1 = 0</text>
</svg>
