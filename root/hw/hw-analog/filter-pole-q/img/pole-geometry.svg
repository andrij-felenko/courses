<text x="133.2" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="italic">ω₀</text>
<text x="173.2" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">σ = ω₀/(2Q)</text>
<text x="84.3" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700" font-style="italic">ω_d</text>
<rect x="350.0" y="82.8" width="300.0" height="54.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="105.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">cos θ = σ / ω₀ = 1/(2Q)</tspan><tspan x="500.0" dy="19.5">⇒  Q = 1 / (2·cos θ)</tspan></text>
<rect x="350.0" y="165.1" width="300.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">ω_d = ω₀·√(1 − 1/(4Q²))</tspan><tspan x="500.0" dy="16.9">|s| = √(σ² + ω_d²) = ω₀</tspan></text>
