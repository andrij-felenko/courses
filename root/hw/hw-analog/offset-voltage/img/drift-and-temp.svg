<rect x="455.0" y="265.0" width="320.0" height="60.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="615.0" y="285.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">Градієнт ΔT = 0.1 °C між пайками</tspan><tspan x="615.0" dy="13.0">генерує термо-ЕРС ≈ 0.1 °C · 40 мкВ/°C = 4 мкВ!</tspan><tspan x="615.0" dy="13.0">Вимагає ізотермічного симетричного розведення PCB</tspan></text>
<rect x="50.0" y="365.0" width="720.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="386.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Сумарна похибка зсуву в діапазоні температур:</tspan><tspan x="410.0" dy="15.6">V_os(T) = V_os(25°C)  +  (dV_os / dT) · (T − 25°C)  +  V_термо</tspan><tspan x="410.0" dy="15.6">Для прецизійних вимірювань дрейф часто є головним джерелом непоправної похибки</tspan></text>
