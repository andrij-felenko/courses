<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння класичних топологій гармонійних автогенераторів</text>
<rect x="10.0" y="10.0" width="740.0" height="400.0" rx="8" fill="#fafbfc" stroke="#6b7280" stroke-width="1.0"/>
<text x="380.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класичні топології гармонійних автогенераторів</text>
<rect x="30.0" y="60.0" width="345.0" height="160.0" rx="6" fill="#eef5fc" stroke="#2457d6" stroke-width="1.8"/>
<text x="46.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Міст Віна (Wien Bridge)</text>
<line x1="44.0" y1="96.0" x2="361.0" y2="96.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="46.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Ланка: RC-міст (смуговий фільтр)</text>
<text x="46.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Фаза ланки: φ_β(ω₀) = 0° (синфазно)</text>
<text x="46.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Коефіцієнт передачі: β(ω₀) = 1/3</text>
<text x="46.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Підсилювач: неінвертуючий, A = +3</text>
<text x="46.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Застосування: звукові генератори (10 Гц – 1 МГц)</text>
<rect x="390.0" y="60.0" width="345.0" height="160.0" rx="6" fill="#fdf7ee" stroke="#d48806" stroke-width="1.8"/>
<text x="406.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d48806" text-anchor="start" font-weight="700">Фазозсувний RC-генератор</text>
<line x1="404.0" y1="96.0" x2="721.0" y2="96.0" stroke="#d48806" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="406.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Ланка: 3 послідовні RC-ланцюжки</text>
<text x="406.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Фаза ланки: φ_β(ω₀) = 180° (60° на ланку)</text>
<text x="406.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Коефіцієнт передачі: β(ω₀) = 1/29</text>
<text x="406.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Підсилювач: інвертуючий, A = −29 (180°)</text>
<text x="406.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Застосування: прості низькочастотні схеми</text>
<rect x="30.0" y="235.0" width="345.0" height="160.0" rx="6" fill="#eef8f2" stroke="#27ae60" stroke-width="1.8"/>
<text x="46.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Генератор Колпітца (Ємнісна триточка)</text>
<line x1="44.0" y1="271.0" x2="361.0" y2="271.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="46.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Ланка: LC-контур + ємнісний дільник C1/C2</text>
<text x="46.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Фаза ланки: φ_β(ω₀) = 180°</text>
<text x="46.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Коефіцієнт передачі: β = C1 / (C1 + C2)</text>
<text x="46.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Підсилювач: інвертуючий каскад (180°)</text>
<text x="46.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Застосування: радіочастоти (100 кГц – 500 МГц)</text>
<rect x="390.0" y="235.0" width="345.0" height="160.0" rx="6" fill="#fdf4f8" stroke="#a82470" stroke-width="1.8"/>
<text x="406.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#a82470" text-anchor="start" font-weight="700">Генератор Хартлі (Індуктивна триточка)</text>
<line x1="404.0" y1="271.0" x2="721.0" y2="271.0" stroke="#a82470" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="406.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Ланка: LC-контур + котушка з відведенням L1/L2</text>
<text x="406.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Фаза ланки: φ_β(ω₀) = 180°</text>
<text x="406.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Коефіцієнт передачі: β = L1 / (L1 + L2 + 2M)</text>
<text x="406.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Підсилювач: інвертуючий каскад (180°)</text>
<text x="406.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Застосування: радіодіапазони з плавним налаштуванням</text>
</svg>