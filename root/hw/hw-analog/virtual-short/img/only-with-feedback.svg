<text x="566.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">на рейці</text>
<text x="530.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">V₋ ≠ V₊ ✗  → це компаратор</text>
<text x="360.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Перший крок будь-якого аналізу — поглянути, куди йде петля. На «−» — підсилювач; інакше — інша історія.</text>
