<line x1="236.0" y1="150.0" x2="236.0" y2="96.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<line x1="236.0" y1="96.0" x2="100.0" y2="96.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<line x1="100.0" y1="96.0" x2="100.0" y2="132.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
