<text x="139.0" y="136.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">−</text>
<text x="139.0" y="173.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<line x1="212.0" y1="150.0" x2="250.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
