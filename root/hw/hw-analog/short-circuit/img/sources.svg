<rect x="39.0" y="306.5" width="621.9" height="31.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="350.0" y="325.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">струм КЗ = V / (R_внутр + R_дротів)   — стелю ставить не КЗ, а опір самого джерела й провідників</tspan></text>
