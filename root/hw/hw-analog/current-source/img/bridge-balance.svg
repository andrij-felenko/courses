<text x="380.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">струм у навантаження не залежить від його опору — рівно vᵢ/R1</text>
</svg>