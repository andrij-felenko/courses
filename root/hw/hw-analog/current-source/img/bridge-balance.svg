<rect x="81.2" y="86.4" width="81.6" height="63.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="122.0" y="106.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="122.0" dy="0.0">від'ємний</tspan><tspan x="122.0" dy="15.6">зв'язок</tspan><tspan x="122.0" dy="15.6">(R1, R2)</tspan></text>
<text x="122.0" y="73.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-style="italic">тягне вниз</text>
