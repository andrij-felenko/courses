<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 570 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="570" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="280.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Метод гілкових струмів: п'ять кроків</text>
<circle cx="70.0" cy="94.0" r="17.0" fill="#fff" stroke="#2457d6" stroke-width="2.4"/>
<text x="70.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<rect x="100.0" y="66.0" width="430.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="315.0" y="98.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">Признач по струму кожній гілці — напрям бери довільно.</tspan></text>
<line x1="70.0" y1="124.0" x2="70.0" y2="135.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="70.0" cy="164.0" r="17.0" fill="#fff" stroke="#2457d6" stroke-width="2.4"/>
<text x="70.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">2</text>
<rect x="100.0" y="136.0" width="430.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="315.0" y="168.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">Запиши KCL у (n−1) вузлах: втікання = витікання.</tspan></text>
<line x1="70.0" y1="194.0" x2="70.0" y2="205.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="70.0" cy="234.0" r="17.0" fill="#fff" stroke="#c0392b" stroke-width="2.4"/>
