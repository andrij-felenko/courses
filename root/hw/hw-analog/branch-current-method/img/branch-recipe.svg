<rect x="100.0" y="206.0" width="430.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/><text x="315.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">Запиши KVL у (b−n+1) незалежних петлях.</tspan></text>
<line x1="70.0" y1="264.0" x2="70.0" y2="275.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="70.0" cy="304.0" r="17.0" fill="#fff" stroke="#c0392b" stroke-width="2.4"/>
<text x="70.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">4</text>
<rect x="100.0" y="276.0" width="430.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/><text x="315.0" y="308.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">Спади в KVL заміни на I·R за законом Ома.</tspan></text>
<line x1="70.0" y1="334.0" x2="70.0" y2="345.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="70.0" cy="374.0" r="17.0" fill="#fff" stroke="#27ae60" stroke-width="2.4"/>
<text x="70.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#27ae60" text-anchor="middle" font-weight="700">5</text>
<rect x="100.0" y="346.0" width="430.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="315.0" y="378.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">Розв'яжи систему; мінус у відповіді — струм тече навпаки.</tspan></text>
<text x="280.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">перші три кроки дають рівно b рівнянь на b невідомих</text>
</svg>