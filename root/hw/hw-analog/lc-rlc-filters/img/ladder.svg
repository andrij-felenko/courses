<text x="308.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#9a2b22" text-anchor="start" font-weight="bold" font-style="normal">дільник першої ланки «просідає»</text>
<text x="470.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">з буфером між ланками (z = jf/f_c):</text>
<text x="470.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">H = 1/(z² + 2z + 1)</text>
<text x="470.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">драбинка впритул (рівні R і C):</text>
<text x="470.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">H = 1/(z² + 3z + 1)</text>
<text x="470.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">уся різниця — один доданок:</text>
<text x="470.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">2z  →  3z</text>
<text x="470.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">це і є взаємне навантаження,</text>
<text x="470.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">записане однією літерою</text>
<text x="420.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">на f_c: буферизовані дають |2j| → −6 дБ, драбинка |3j| → −9.5 дБ — коліно не гострішає, а тоне</text>
