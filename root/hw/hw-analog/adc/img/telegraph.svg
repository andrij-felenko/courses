<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">1920-ті: скільки імпульсів за секунду можна впхнути в лінію, щоб вони не злилися?</text>
