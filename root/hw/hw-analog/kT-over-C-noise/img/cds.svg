<rect x="76.4" y="302.2" width="567.2" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="322.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Та сама заморожена kT/C-похибка сидить в обох відліках. Зміряти рівень скидання,</tspan><tspan x="360.0" dy="15.6">тоді сигнал, і відняти — спільне випадкове зміщення зникає, лишається корисне.</tspan></text>
