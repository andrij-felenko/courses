<rect x="70.0" y="70.0" width="250.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="195.0" y="110.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">ШЛЯХ 1 · по спектру</tspan><tspan x="195.0" dy="15.6"></tspan><tspan x="195.0" dy="15.6">4kTR проходить крізь</tspan><tspan x="195.0" dy="15.6">RC-фільтр; інтегруємо</tspan><tspan x="195.0" dy="15.6">⟨U²⟩ = ∫ 4kTR·|H|² df</tspan><tspan x="195.0" dy="15.6">від 0 до ∞;  R скорочується</tspan></text>
<rect x="400.0" y="70.0" width="250.0" height="150.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="525.0" y="110.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">ШЛЯХ 2 · рівнорозподіл</tspan><tspan x="525.0" dy="15.6"></tspan><tspan x="525.0" dy="15.6">на 1 ступінь вільності</tspan><tspan x="525.0" dy="15.6">½kT теплової енергії;</tspan><tspan x="525.0" dy="15.6">½C⟨U²⟩ = ½kT</tspan><tspan x="525.0" dy="15.6">→ ⟨U²⟩ = kT/C миттєво</tspan></text>
