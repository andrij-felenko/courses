<text x="380.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">кожен блок додає свою порцію e = q/√12 незалежно від інших</text>
<rect x="69.0" y="364.4" width="621.9" height="63.2" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Шум квантування — не властивість АЦП, а властивість самої операції «округлити до сітки».</tspan><tspan x="380.0" dy="15.6">Він з'являється однаково: на вході АЦП, при округленні добутку у цифровому фільтрі, при</tspan><tspan x="380.0" dy="15.6">скороченні розрядності слова, на виході ЦАП. Скрізь та сама модель q = x + e, e ≈ q/√12.</tspan></text>
