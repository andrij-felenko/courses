<text x="190.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Zin = 1 кОм · перевернуто</text>
<rect x="380.0" y="54.0" width="300.0" height="210.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
