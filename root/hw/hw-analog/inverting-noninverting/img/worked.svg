<text x="530.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Vout = +5.0 В</text>
<text x="530.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Zin велетенський · той самий знак</text>
<text x="360.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">×10 в обох — але різний знак, різний вхідний опір і різні резистори (10 проти 9).</text>
