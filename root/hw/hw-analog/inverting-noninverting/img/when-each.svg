<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
<rect width="720" height="300" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="360.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Коли яку схему брати</text>
<rect x="40.0" y="64.0" width="320.0" height="200.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="200.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">НЕІНВЕРТУЮЧИЙ</text>
<text x="200.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(не вантажити джерело)</text>
<circle cx="62.0" cy="134.0" r="3.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="2"/>
<text x="78.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">слабкі давачі (мікрофон, термопара)</text>
<circle cx="62.0" cy="164.0" r="3.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="2"/>
<text x="78.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">високоомні джерела</text>
<circle cx="62.0" cy="194.0" r="3.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="2"/>
<text x="78.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">входи АЦП</text>
<circle cx="62.0" cy="224.0" r="3.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="2"/>
<text x="78.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">коли знак має лишитися</text>
<rect x="380.0" y="64.0" width="300.0" height="200.0" rx="8" fill="#fbeeef" stroke="#c0271e" stroke-width="1.5"/>
<text x="530.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ІНВЕРТУЮЧИЙ</text>
<text x="530.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(віртуальна земля)</text>
<circle cx="402.0" cy="134.0" r="3.0" fill="#c0271e" stroke="#c0271e" stroke-width="2"/>
<text x="418.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">суматор / мікшер</text>
<circle cx="402.0" cy="164.0" r="3.0" fill="#c0271e" stroke="#c0271e" stroke-width="2"/>
<text x="418.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">струм→напруга (фотодіод)</text>
<circle cx="402.0" cy="194.0" r="3.0" fill="#c0271e" stroke="#c0271e" stroke-width="2"/>
<text x="418.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">послаблення (&lt;1)</text>
<circle cx="402.0" cy="224.0" r="3.0" fill="#c0271e" stroke="#c0271e" stroke-width="2"/>
<text x="418.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">коли перевертання ок</text>
<text x="360.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Часто вирішує вхідний опір: не можна вантажити — неінвертуючий; потрібна земля — інвертуючий.</text>
</svg>
