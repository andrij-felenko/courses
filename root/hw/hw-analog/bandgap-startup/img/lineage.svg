<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Bandgap — ланцюг придатності, а не один «винахід»</text>
<line x1="70.0" y1="110.0" x2="704.0" y2="110.0" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="688.0" y1="110.0" x2="706.0" y2="110.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="698.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">час</text>
<circle cx="170.0" cy="110.0" r="8.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.6"/>
<text x="170.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">1964</text>
<line x1="170.0" y1="118.0" x2="170.0" y2="135.1" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="4,4"/>
<text x="170.0" y="151.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Ідея</text>
<text x="170.0" y="167.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Девід Хілбібер</text>
<rect x="80.0" y="169.1" width="180.0" height="73.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="188.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle"><tspan x="170.0" dy="0.0">довів: із самих переходів</tspan><tspan x="170.0" dy="14.3">можна зібрати стабільну</tspan><tspan x="170.0" dy="14.3">опору (≈1.2567 В);</tspan><tspan x="170.0" dy="14.3">стовпчики транзисторів</tspan></text>
<circle cx="390.0" cy="110.0" r="8.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.6"/>
<text x="390.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">1969–71</text>
<line x1="390.0" y1="118.0" x2="390.0" y2="135.1" stroke="#27ae60" stroke-width="1.6" stroke-dasharray="4,4"/>
<text x="390.0" y="151.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e7a45" text-anchor="middle" font-weight="700">Перша реалізація</text>
<text x="390.0" y="167.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Боб Відлар</text>
<rect x="300.0" y="169.1" width="180.0" height="73.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="188.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e7a45" text-anchor="middle"><tspan x="390.0" dy="0.0">перший куповний чип:</tspan><tspan x="390.0" dy="14.3">LM109 → LM113 (1.2 В);</tspan><tspan x="390.0" dy="14.3">патент US 3 617 859</tspan><tspan x="390.0" dy="14.3">разом із Р. Добкіним</tspan></text>
<circle cx="610.0" cy="110.0" r="8.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.6"/>
<text x="610.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">1974</text>
<line x1="610.0" y1="118.0" x2="610.0" y2="135.1" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4,4"/>
<text x="610.0" y="151.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Класична схема</text>
<text x="610.0" y="167.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Пол Брокау</text>
<rect x="520.0" y="169.1" width="180.0" height="73.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="610.0" y="188.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="610.0" dy="0.0">осередок Брокау:</tspan><tspan x="610.0" dy="14.3">зчитування колектор-</tspan><tspan x="610.0" dy="14.3">ного струму; виріб</tspan><tspan x="610.0" dy="14.3">AD580 (2.5 В)</tspan></text>
<line x1="240.0" y1="110.0" x2="320.0" y2="110.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="280.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">зробив</text>
<text x="280.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">придатнішим</text>
<line x1="460.0" y1="110.0" x2="540.0" y2="110.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="500.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">зробив</text>
<text x="500.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">придатнішим</text>
<rect x="70.0" y="300.0" width="620.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="86.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Що зрозуміли вже тут — і що тримається досі:</text>
<rect x="86.0" y="338.0" width="588.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="380.0" y="354.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Самозміщення дарує незалежність від живлення — але петля I = f(I) завжди</tspan><tspan x="380.0" dy="15.6">має f(0) = 0, тож «нуль» теж стійка рівновага. Мертву точку не «вилікувати»</tspan><tspan x="380.0" dy="15.6">розумнішою петлею; її ОБХОДЯТЬ окремим старт-вузлом, що штовхне й вчасно піде.</tspan></text>
</svg>