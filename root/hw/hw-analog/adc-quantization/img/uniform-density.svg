<rect x="103.5" y="158.2" width="273.1" height="47.6" rx="6" fill="#fff5f4" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="178.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="240.0" dy="0.0">площа під e²  →  ∫ = q³/12</tspan><tspan x="240.0" dy="15.6">поділити на ширину q  →  ⟨e²⟩ = q²/12</tspan></text>
<text x="240.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівномірна густина 1/q і парабола e² на одному відрізку</text>
