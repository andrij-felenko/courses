<line x1="480.0" y1="201.8" x2="492.0" y2="201.8" stroke="#27ae60" stroke-width="2.0"/>
<text x="474.0" y="205.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">q/√12 ≈ 0.289q  (RMS)</text>
<line x1="442.0" y1="130.0" x2="442.0" y2="201.8" stroke="#6b7280" stroke-width="1.2"/>
<text x="446.0" y="169.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">×1.73</text>
<rect x="55.9" y="408.4" width="608.2" height="63.2" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="428.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Похибка рівномірна на ±q/2: густина плоска (площа = 1). Середній квадрат — це площа</tspan><tspan x="360.0" dy="15.6">під e², усереднена по ширині: q³/12 ÷ q = q²/12, звідки RMS = q/√12 ≈ 0.289q.</tspan><tspan x="360.0" dy="15.6">Максимум |e| = q/2 більший за RMS у √3 ≈ 1.73 раза: RMS усереднює, а не бере найгірше.</tspan></text>
