<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440">
<rect width="800" height="440" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="400.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Енергетичне означення Q: запас проти витоку за цикл</text>
<text x="400.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одне число каже, яку частку своєї енергії контур губить за кожне коливання</text>
<circle cx="240.0" cy="230.0" r="95.0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="240.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">запасена</text>
<text x="240.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">енергія W</text>
<text x="240.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(гойдається C ↔ L)</text>
<path d="M 180,152 A 99 99 0 0 1 300,152" fill="none" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<path d="M 300,308 A 99 99 0 0 1 180,308" fill="none" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<line x1="335.0" y1="230.0" x2="430.0" y2="230.0" stroke="#c0271e" stroke-width="2.6" marker-end="url(#aRed)"/>
<rect x="430.0" y="208.0" width="44.0" height="44.0" rx="6" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="452.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">R</text>
<text x="382.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#9a2b22" text-anchor="middle" font-weight="bold" font-style="normal">витік за період:</text>
<text x="382.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#9a2b22" text-anchor="middle" font-weight="bold" font-style="normal">W_втрат</text>
<path d="M 486,244 q 4,-7 0,-14 q -4,-7 0,-14" fill="none" stroke="#c0271e" stroke-width="1.6"/>
<path d="M 496,244 q 4,-7 0,-14 q -4,-7 0,-14" fill="none" stroke="#c0271e" stroke-width="1.6"/>
<path d="M 506,244 q 4,-7 0,-14 q -4,-7 0,-14" fill="none" stroke="#c0271e" stroke-width="1.6"/>
<text x="545.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Q = 2π · W / W_втрат</text>
<text x="545.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">за один період</text>
<text x="545.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">тобто щоперіоду контур губить</text>
<text x="545.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">частку 2π/Q своєї енергії:</text>
<text x="545.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Q = 100 → 6% за коливання</text>
<text x="545.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">для послідовного контуру звідси</text>
<text x="545.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">виходить знайоме:</text>
<text x="545.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Q = ω₀L/R = √(L/C)/R</text>
<text x="400.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">2π у означенні — для чистоти формул (частка на радіан, а не на період); Q безрозмірна</text>
</svg>
