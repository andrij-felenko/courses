<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Навіщо це: ланцюжок перетворень згортає схему до одного джерела</text>
<rect x="54.0" y="78.0" width="100.0" height="130.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="104.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">V → I</text>
<text x="104.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="104.0" dy="0.0">джерело</tspan><tspan x="104.0" dy="14.3">U з R_s</tspan></text>
<line x1="156.0" y1="150.0" x2="192.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="229.0" y="78.0" width="100.0" height="130.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="279.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">об’єднати</text>
<text x="279.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="279.0" dy="0.0">R_s ∥ R_p</tspan><tspan x="279.0" dy="14.3">(паралельні)</tspan></text>
<line x1="331.0" y1="150.0" x2="367.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="404.0" y="78.0" width="100.0" height="130.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="454.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">I → V</text>
<text x="454.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="454.0" dy="0.0">назад у</tspan><tspan x="454.0" dy="14.3">V з одним R</tspan></text>
<line x1="506.0" y1="150.0" x2="542.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="579.0" y="78.0" width="100.0" height="130.0" rx="10" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="629.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">готово</text>
<text x="629.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="629.0" dy="0.0">одне</tspan><tspan x="629.0" dy="14.3">джерело</tspan></text>
<rect x="142.5" y="227.3" width="415.0" height="45.3" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="350.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Кожне перетворення не міняє того, що бачить навантаження —</tspan><tspan x="350.0" dy="14.3">але дозволяє злити сусідні елементи, які раніше «не складалися»</tspan></text>
</svg>