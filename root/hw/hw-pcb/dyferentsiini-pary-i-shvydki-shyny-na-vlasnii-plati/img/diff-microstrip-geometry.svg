<rect x="-14.8" y="354.8" width="869.6" height="80.4" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="420.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Ключові параметри топології диференційної пари:</tspan><tspan x="420.0" dy="15.0">• Геометрія: ширина провідника w, зазор у парі s, товщина фольги t, висота діелектрика h над опорною площиною GND.</tspan><tspan x="420.0" dy="15.0">• Взаємний зв'язок (Coupling): мікросмужки зчеплені через C_m та L_m. При зближенні (менший s) Z_odd падає, а Z_even зростає.</tspan><tspan x="420.0" dy="15.0">• Опорна земля обов'язкова: 70–85% силових ліній замикаються на GND-площину, а не між провідниками. Розрив землі руйнує імпеданс!</tspan></text>
