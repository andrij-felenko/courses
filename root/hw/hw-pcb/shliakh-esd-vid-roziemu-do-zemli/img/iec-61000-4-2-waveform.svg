<rect x="30.0" y="378.1" width="780.0" height="73.9" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="420.0" y="397.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Параметри стандарту IEC 61000-4-2 (Рівень 4, контактний розряд 8 кВ / повітряний 15 кВ):</tspan><tspan x="420.0" dy="14.3">• Піковий струм I_peak = 30 А ± 10% · Час наростання t_r = 0.7–1.0 нс (di/dt ≈ 30–40 А/нс)</tspan><tspan x="420.0" dy="14.3">• Еквівалент генератора: C_esd = 150 пФ, R_esd = 330 Ом · Спектр імпульсу: від DC до 1.5 ГГц</tspan><tspan x="420.0" dy="14.3">• Внутрішній захист чипів (HBM 2 кВ) витримує лише 1.3 А — необхідний зовнішній TVS на платі!</tspan></text>
