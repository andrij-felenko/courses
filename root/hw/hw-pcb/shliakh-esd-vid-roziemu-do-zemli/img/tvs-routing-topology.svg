<rect x="30.0" y="418.1" width="780.0" height="73.9" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="420.0" y="437.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Золоті правила трасування шляху ESD від роз'єму:</tspan><tspan x="420.0" dy="14.3">1. Розміщувати TVS впритул до контактів роз'єму — до будь-яких резисторів, феритів або мікросхем.</tspan><tspan x="420.0" dy="14.3">2. Трасувати сигнал КРІЗЬ площадки TVS (нульова довжина Stub L_stub = 0 нГн).</tspan><tspan x="420.0" dy="14.3">3. Мінімум 2–4 перехідні отвори прямо на виводі GND діода до суцільного шару землі шасі / GND.</tspan></text>
