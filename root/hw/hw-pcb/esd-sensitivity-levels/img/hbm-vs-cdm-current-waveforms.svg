<text x="122.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="start" font-weight="700">IEC 61000-4-2 (8 кВ): I_pk = 30 А (t_r &lt; 1 нс)</text>
<text x="108.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="start" font-weight="700">CDM (500 В): I_pk = 12 А (t_r &lt; 0.3 нс)</text>
<text x="210.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2563eb" text-anchor="start" font-weight="700">HBM (2 кВ): I_pk = 1.33 А (t_r = 10 нс, τ ≈ 150 нс)</text>
<rect x="545.0" y="60.0" width="285.0" height="345.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="687.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">Порівняльні параметри моделей</text>
<text x="555.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="start" font-weight="700">Human Body Model (HBM)</text>
<text x="555.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">• Стандарт: ANSI/ESDA/JEDEC JS-001</text>
<text x="555.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• R-C ланцюг: 100 пФ / 1500 Ом</text>
<text x="555.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Фронт t_r: 2–10 нс | Пік: 1.33 А (при 2 кВ)</text>
<text x="555.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">• Механізм: теплове вигоряння p-n переходу</text>
<text x="555.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="start" font-weight="700">Charged Device Model (CDM)</text>
<text x="555.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">• Стандарт: ANSI/ESDA/JEDEC JS-002</text>
<text x="555.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• R-C ланцюг: 1–30 пФ / &lt; 1 Ом (без резистора)</text>
<text x="555.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Фронт t_r: 0.15–0.4 нс | Пік: до 15 А</text>
<text x="555.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">• Механізм: пробій підзатворного оксиду SiO2</text>
<text x="555.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700">Системний рівень (IEC 61000-4-2)</text>
<text x="555.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• R-C ланцюг: 150 пФ / 330 Ом</text>
<text x="555.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start">• Фронт t_r: 0.7–1.0 нс | Пік: 30 А (при 8 кВ)</text>
<text x="555.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="start">• Енергія: у 24 рази більша за HBM (4.8 мДж)</text>
