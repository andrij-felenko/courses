<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="830.0" height="410.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="430.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">ВАХ TVS-діода: ефект Snapback, динамічний опір R_dyn та Clamping</text>
<rect x="35.0" y="60.0" width="420.0" height="345.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="245.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">TLP-крива TVS-діода (лавинний пробій та Snapback)</text>
<line x1="75.0" y1="350.0" x2="435.0" y2="350.0" stroke="#333333" stroke-width="1.5"/>
<line x1="75.0" y1="350.0" x2="75.0" y2="110.0" stroke="#333333" stroke-width="1.5"/>
<text x="425.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="700">Напруга V, В</text>
<text x="67.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="end" font-weight="700">Струм I_PP, А</text>
<rect x="340.0" y="135.0" width="95.0" height="215.0" rx="6" fill="#fee2e2" stroke="none" stroke-width="1.5"/>
<line x1="340.0" y1="350.0" x2="340.0" y2="135.0" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="344.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="start" font-weight="700">Поріг пробою IC (V_fail)</text>
<path d="M 75 350 L 195 350 L 290 145" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3"/>
<text x="295.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2563eb" text-anchor="start" font-weight="700">Non-snapback TVS</text>
<path d="M 75 350 L 235 350 L 235 320 L 165 300 L 255 145" fill="none" stroke="#16a34a" stroke-width="2.8"/>
<text x="215.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#16a34a" text-anchor="end" font-weight="700">Snapback TVS</text>
<circle cx="235.0" cy="320.0" r="3.5" fill="#dc2626" stroke="#333333" stroke-width="1.0"/>
<text x="240.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="start" font-weight="700">V_t1 (Trigger)</text>
<circle cx="165.0" cy="300.0" r="3.5" fill="#16a34a" stroke="#333333" stroke-width="1.0"/>
<text x="160.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#16a34a" text-anchor="end" font-weight="700">V_h (Holding)</text>
<line x1="210.0" y1="220.0" x2="240.0" y2="220.0" stroke="#d97706" stroke-width="1.2" stroke-dasharray="2,2"/>
<line x1="240.0" y1="220.0" x2="240.0" y2="170.0" stroke="#d97706" stroke-width="1.2" stroke-dasharray="2,2"/>
<text x="248.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="start" font-weight="700">R_dyn = ΔV / ΔI</text>
<text x="145.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">V_RWM</text>
<text x="165.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#16a34a" text-anchor="middle" font-weight="700">V_h</text>
<text x="235.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">V_t1</text>
<text x="265.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700">V_clamp</text>
<rect x="470.0" y="60.0" width="360.0" height="345.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="650.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">Анатомія обмеження напруги (Clamping)</text>
<rect x="485.0" y="100.0" width="330.0" height="65.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="650.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Залишкова напруга на захищуваній лінії:</text>
<text x="650.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">V_clamp(t) = V_hold + I_PP(t) · R_dyn + L_par · (di/dt)</text>
<text x="650.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">де L_par · (di/dt) — індуктивний стрибок паразитної траси</text>
<rect x="485.0" y="175.0" width="330.0" height="215.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="650.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">Чому Snapback критичний для сучасної логіки:</text>
<text x="495.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start" font-weight="700">• Менша напруга V_clamp:</text>
<text x="635.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">V_hold (3.5 В) замість V_BR (6.5 В)</text>
<text x="495.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start" font-weight="700">• Нижчий опір R_dyn:</text>
<text x="635.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">0.15–0.3 Ом проти 0.8–1.5 Ом у звичайних</text>
<text x="488.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start" font-weight="700">• Захист ультратонкого оксиду:</text>
<text x="635.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">V_clamp &lt; V_breakdown кристала IC</text>
<text x="495.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="start" font-weight="700">• Головне застереження:</text>
<text x="635.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">V_hold мусить бути &gt; V_supply_max,</text>
<text x="505.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="start" font-style="italic">інакше виникає Latch-up (коротке замикання)</text>
<text x="477.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start" font-weight="700">• Паразитна індуктивність L_par:</text>
<text x="635.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">кожен 1 мм доріжки = ~1 нГн,</text>
<text x="505.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start" font-style="italic">при di/dt = 30 А/нс дає викид +30 В на кристал!</text>
</svg>