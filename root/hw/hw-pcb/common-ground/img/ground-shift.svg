<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зсув землі: струм на опорі спільного нуля перекошує відлік</text>
<rect x="60.0" y="82.0" width="210.0" height="96.0" rx="10" fill="#eef2f8" stroke="#2457d6" stroke-width="2.0"/>
<text x="165.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Передавач</text>
<line x1="74.0" y1="116.0" x2="256.0" y2="116.0" stroke="#2457d6" stroke-width="1.2"/>
<text x="165.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="165.0" dy="0.0">сигнал Uсиг</tspan><tspan x="165.0" dy="14.4">від свого нуля</tspan></text>
<rect x="490.0" y="82.0" width="210.0" height="96.0" rx="10" fill="#fbeee6" stroke="#c0392b" stroke-width="2.0"/>
<text x="595.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приймач</text>
<line x1="504.0" y1="116.0" x2="686.0" y2="116.0" stroke="#c0392b" stroke-width="1.2"/>
<text x="595.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="595.0" dy="0.0">читає</tspan><tspan x="595.0" dy="14.4">Uсиг − Uзс</tspan></text>
<line x1="270.0" y1="112.0" x2="490.0" y2="112.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="380.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">сигнал</text>
<line x1="165.0" y1="178.0" x2="165.0" y2="250.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="595.0" y1="178.0" x2="595.0" y2="250.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="165.0" y1="250.0" x2="300.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.4"/>
<line x1="460.0" y1="250.0" x2="595.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.4"/>
<rect x="300.0" y="238.0" width="160.0" height="24.0" rx="4" fill="#fff3cd" stroke="#c0392b" stroke-width="1.8"/>
<text x="380.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Rg  (опір спільного нуля)</text>
<line x1="470.0" y1="280.0" x2="320.0" y2="280.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="395.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Iзв  (сигнальний + живильний)</text>
<rect x="145.2" y="325.8" width="469.5" height="32.5" rx="6" fill="#fbeee6" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="346.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Uзс = Iзв·Rg   піднімає нуль приймача над нулем передавача</tspan></text>
<rect x="164.8" y="364.0" width="430.4" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="384.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">що довший і тонший нуль і що більший струм — то більший зсув</tspan></text>
</svg>