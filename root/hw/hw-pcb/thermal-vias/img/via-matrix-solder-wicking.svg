<rect x="4.7" y="314.8" width="810.6" height="80.4" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="410.0" y="336.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Правила проектування теплової матриці (Design Rules):</tspan><tspan x="410.0" dy="15.0">1. Оптимальний діаметр свердла d = 0.3 мм (12 mil). Отвори &gt; 0.35 мм засмоктують припій всередину (solder wicking).</tspan><tspan x="410.0" dy="15.0">2. Крок сітки (Pitch) = 1.0–1.2 мм. Згущення менше 0.8 мм веде до перекриття зон розтікання і спадної віддачі.</tspan><tspan x="410.0" dy="15.0">3. Трафаретний друк: віконна матриця (Windowing) із заповненням 50–70% запобігає вибуховому кипінню флюсу та порожнинам.</tspan></text>
