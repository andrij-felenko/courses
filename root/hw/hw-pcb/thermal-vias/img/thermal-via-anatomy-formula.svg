<text x="605.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">A_Cu = π · (d · t − t²)  [площа перерізу]</text>
<text x="605.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">R_th,via = h / (k_Cu · A_Cu)  [тепловий опір]</text>
<text x="605.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#047857" text-anchor="middle">Для d=0.3 мм, t=25 мкм, h=1.6 мм  →  R_th ≈ 193 К/Вт</text>
<rect x="1.4" y="314.8" width="817.2" height="80.4" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="410.0" y="336.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Аналітичний розрахунок одиничного отвору (thermal via):</tspan><tspan x="410.0" dy="15.0">• Площа кільця: A_Cu = π · (0.3 · 0.025 − 0.025²) мм² = π · (0.0075 − 0.000625) ≈ 0.0216 мм² = 2.16·10⁻⁸ м²</tspan><tspan x="410.0" dy="15.0">• Опір гільзи: R_th,via = 0.0016 м / (385 Вт/(м·К) · 2.16·10⁻⁸ м²) ≈ 192.5 К/Вт (або ~120 К/Вт для плати товщиною 1.0 мм)</tspan><tspan x="410.0" dy="15.0">• Оскільки один отвір має високий опір (~193 К/Вт), під силові мікросхеми встановлюють паралельний масив з 9–25 via.</tspan></text>
</svg>