<rect x="-41.2" y="314.8" width="902.4" height="80.4" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="410.0" y="336.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Порівняння конструкцій за стандартом IPC-4761:</tspan><tspan x="410.0" dy="15.0">• IPC-4761 Type I/II (Tented): Найдешевше рішення; підходить для відкритих полігонів, але не гарантує герметичності паду.</tspan><tspan x="410.0" dy="15.0">• IPC-4761 Type VII (VIPPO / POFV): Via-in-Pad Plated Over — заповнення епоксидною пастою, полірування та міднення зверху.</tspan><tspan x="410.0" dy="15.0">• VIPPO є обов'язковим для BGA з кроком ≤ 0.8 мм та дрібних QFN: усуває втягування припою та забезпечує 100% площу теплового контакту.</tspan></text>
