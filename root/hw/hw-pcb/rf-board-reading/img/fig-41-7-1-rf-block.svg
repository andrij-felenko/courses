<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ВЧ-тракт на платі: від чипа до антени</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">один і той самий ланцюг ховається майже в кожному радіомодулі — навчися його впізнавати</text>
<rect x="40.0" y="150.0" width="158.0" height="70.0" rx="8" fill="#2b2b2b" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="119.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">Радіочип</text>
<text x="119.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#bbb" text-anchor="middle" font-weight="normal" font-style="normal">+ кварц</text>
<line x1="200.0" y1="185.0" x2="212.0" y2="185.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="214.0" y="150.0" width="158.0" height="70.0" rx="8" fill="#fbf3df" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="293.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#b08900" text-anchor="middle" font-weight="bold" font-style="normal">Узгодження</text>
<text x="293.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">π/L-ланка</text>
<line x1="374.0" y1="185.0" x2="386.0" y2="185.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="388.0" y="150.0" width="158.0" height="70.0" rx="8" fill="#e9eefb" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="467.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Фільтр/балун</text>
<text x="467.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(не завжди)</text>
<line x1="548.0" y1="185.0" x2="560.0" y2="185.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="562.0" y="150.0" width="158.0" height="70.0" rx="8" fill="#eef6ef" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="641.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Доріжка 50 Ω</text>
<text x="641.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">над землею</text>
<line x1="722.0" y1="185.0" x2="734.0" y2="185.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="736.0" y="150.0" width="158.0" height="70.0" rx="8" fill="#eef2fb" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="815.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Антена</text>
<rect x="60.0" y="252.0" width="800.0" height="60.0" rx="9" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="460.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Радіочип → узгоджувальна ланка → (фільтр) → 50-омна доріжка → антена. Усе з цього розділу разом.</text>
<text x="460.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Уміючи прочитати цей ланцюг, ти розумієш ВЧ-частину будь-якого модуля — від ESP32 до приймача.</text>
</svg>
