<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тепловізійний аналіз друкованої плати та локалізація критичних дефектів</text>
<rect x="30.0" y="48.0" width="430.0" height="442.0" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.2"/><text x="245.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Типові теплові сигнатури несправностей (IR)</text><rect x="45.0" y="88.0" width="400.0" height="114.0" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/><text x="55.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="start" font-weight="700">1. Штатний нагрів лінійного стабілізатора (LDO)</text><rect x="65.0" y="122.0" width="50.0" height="40.0" rx="2" fill="#334155" stroke="#1e293b" stroke-width="1.0"/><text x="90.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">LDO</text><circle cx="90.0" cy="142.0" r="32.0" fill="none" stroke="#fb923c" stroke-width="2.0"/><circle cx="90.0" cy="142.0" r="42.0" fill="none" stroke="#fdba74" stroke-width="1.5"/><text x="160.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="start">• Температура: 35–45 °C (рівномірна)</text><text x="160.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="start">• Тепло розсіюється через мідний полігон GND</text><text x="160.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="start" font-weight="700">• Градієнт плавний, немає локального перегріву виводів</text><rect x="45.0" y="212.0" width="400.0" height="122.0" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.0"/><text x="55.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="start" font-weight="700">2. Пробитий MLCC (тріщина діелектрика / КЗ)</text><rect x="70.0" y="247.0" width="40.0" height="20.0" rx="1" fill="#92400e" stroke="#78350f" stroke-width="1.0"/><rect x="68.0" y="247.0" width="8.0" height="20.0" rx="6" fill="#94a3b8" stroke="#64748b" stroke-width="0.8"/><rect x="104.0" y="247.0" width="8.0" height="20.0" rx="6" fill="#94a3b8" stroke="#64748b" stroke-width="0.8"/><circle cx="90.0" cy="257.0" r="14.0" fill="#c0392b" stroke="#fef08a" stroke-width="2.0"/><text x="90.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">&gt;90°</text><text x="160.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="start" font-weight="700">• Температура: 80–120 °C (точковий спалах)</text><text x="160.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="start">• Локалізація: один корпус 0402/0603/0805</text><text x="160.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="start">• Причина: мікротріщина від термоудару пайки або згину</text><text x="160.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="start" font-weight="700">• Дія: зняти паяльником та перевірити опір шини</text><rect x="45.0" y="344.0" width="400.0" height="128.0" rx="4" fill="#fffbeb" stroke="#fde68a" stroke-width="1.0"/><text x="55.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="start" font-weight="700">3. Перевернутий чіп (зсув на 90°/180° / Latch-up)</text><rect x="65.0" y="380.0" width="50.0" height="50.0" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="1.0"/><circle cx="73.0" cy="388.0" r="3.0" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><circle cx="105.0" cy="420.0" r="12.0" fill="#c0392b" stroke="#f59e0b" stroke-width="1.8"/><text x="105.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">ESD</text><text x="160.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#92400e" text-anchor="start" font-weight="700">• Температура: 70–110 °C біля кута чіпа</text><text x="160.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="start">• Прямий струм тече крізь вбудовані ESD-діоди на GND</text><text x="160.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="start">• Небезпека: деградація кремнію та пропікання корпусу</text><text x="160.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="start" font-weight="700">• Демонтаж обов'язковий: компонент часто пошкоджений</text><rect x="480.0" y="48.0" width="430.0" height="442.0" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.2"/><text x="695.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм покрокової локалізації КЗ (Тріаж)</text><rect x="505.0" y="88.0" width="380.0" height="44.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="695.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">1. Подати номінальну V_in з I_limit = 50–100 мА</tspan><tspan x="695.0" dy="13.0">БЖ переходить у CC-режим (напруга просіла)</tspan></text><line x1="695.0" y1="132.0" x2="695.0" y2="148.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="505.0" y="148.0" width="380.0" height="44.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="695.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">2. Огляд плати тепловізором (або спиртовий тест)</tspan><tspan x="695.0" dy="13.0">Шукаємо компонент з ΔT &gt; +15 °C відносно плати</tspan></text><line x1="695.0" y1="192.0" x2="695.0" y2="208.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="505.0" y="208.0" width="380.0" height="72.0" rx="4" fill="#ffffff" stroke="#475569" stroke-width="1.2"/><text x="695.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Ідентифікація типу нагрітого вузла:</text><text x="520.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="start">A. Пасивний елемент (MLCC, TVS, діод)</text><text x="520.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="start">Б. Активна мікросхема (MCU, DC-DC, LDO)</text><line x1="595.0" y1="280.0" x2="595.0" y2="300.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="795.0" y1="280.0" x2="795.0" y2="300.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="495.0" y="300.0" width="195.0" height="74.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="592.5" y="321.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="middle" font-weight="700"><tspan x="592.5" dy="0.0">Гілка А: Зняти MLCC / TVS</tspan><tspan x="592.5" dy="12.3">• Випаяти елемент</tspan><tspan x="592.5" dy="12.3">• Перевірити опір шини</tspan><tspan x="592.5" dy="12.3">• Якщо КЗ зникло — заміна</tspan></text><rect x="700.0" y="300.0" width="195.0" height="74.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="797.5" y="321.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="middle" font-weight="700"><tspan x="797.5" dy="0.0">Гілка Б: Секціонування</tspan><tspan x="797.5" dy="12.3">• Розімкнути 0R перемичку</tspan><tspan x="797.5" dy="12.3">• Визначити: КЗ до чи після</tspan><tspan x="797.5" dy="12.3">• Перевірити ключ Pin 1 чипа</tspan></text><line x1="590.0" y1="374.0" x2="695.0" y2="388.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="790.0" y1="374.0" x2="695.0" y2="388.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="505.0" y="388.0" width="380.0" height="50.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="695.0" y="410.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">5. Контрольний замір: R_rail &gt; 1 кОм (для 3.3 В / 5 В)</tspan><tspan x="695.0" dy="12.3">Повторне вмикання з підняттям I_limit до робочого струму</tspan></text>
</svg>