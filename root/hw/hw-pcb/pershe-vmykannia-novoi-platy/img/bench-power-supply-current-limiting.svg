<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 986.42 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="986.42" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Режими CV/CC лабораторного джерела живлення та динаміка пускового струму</text>
<rect x="30.0" y="48.0" width="420.0" height="422.0" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.2"/><text x="240.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ВАХ джерела: перехід CV (Voltage) → CC (Current)</text><line x1="90.0" y1="393.0" x2="425.0" y2="393.0" stroke="#64748b" stroke-width="1.5"/><line x1="90.0" y1="393.0" x2="90.0" y2="93.0" stroke="#64748b" stroke-width="1.5"/><text x="428.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start" font-weight="700">I (Струм)</text><text x="90.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">V (Напруга)</text><line x1="86.0" y1="158.0" x2="90.0" y2="158.0" stroke="#64748b" stroke-width="1.5"/><text x="82.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="end" font-weight="700">V_set (5.0 В)</text><line x1="300.0" y1="393.0" x2="300.0" y2="397.0" stroke="#64748b" stroke-width="1.5"/><text x="300.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle" font-weight="700">I_limit (200 мА)</text><rect x="91.0" y="158.0" width="209.0" height="235.0" rx="6" fill="#f0fdf4" stroke="none" stroke-width="1.5"/><text x="194.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Зона стабілізації напруги (CV)</text><text x="194.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">V = V_set (константа)</text><text x="194.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">I &lt; I_limit</text><rect x="300.0" y="158.0" width="110.0" height="235.0" rx="6" fill="#fef2f2" stroke="none" stroke-width="1.5"/><text x="355.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Зона захисту (CC)</text><text x="355.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">I = I_limit (константа)</text><text x="355.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">V_out спадає до нуля</text><line x1="90.0" y1="158.0" x2="300.0" y2="158.0" stroke="#27ae60" stroke-width="3.0"/><line x1="300.0" y1="158.0" x2="300.0" y2="393.0" stroke="#c0392b" stroke-width="3.0"/><circle cx="180.0" cy="158.0" r="5.0" fill="#27ae60" stroke="#ffffff" stroke-width="1.5"/><text x="180.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Точка А: Норма (100 мА / 5.0 В)</text><circle cx="300.0" cy="368.0" r="5.0" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/><text x="290.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="end" font-weight="700">Точка Б: КЗ (200 мА / 0.2 В)</text><rect x="45.0" y="420.0" width="390.0" height="36.0" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/><text x="240.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">При короткому замиканні напруга падає: V_out = I_limit · R_short</text><text x="240.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Потужність на платі обмежена величиною P = V_out · I_limit ≈ 0.04 Вт</text><rect x="470.0" y="48.0" width="440.0" height="422.0" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.2"/><text x="690.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішній контур джерела та розряд C_out</text><rect x="485.0" y="90.0" width="240.0" height="230.0" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/><text x="605.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Лабораторний блок живлення</text><rect x="500.0" y="125.0" width="80.0" height="40.0" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.0"/><text x="540.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700">Регулятор</text><text x="540.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">MOSFET/BJT</text><rect x="615.0" y="135.0" width="50.0" height="22.0" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.0"/><text x="640.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#92400e" text-anchor="middle" font-weight="700">R_shunt</text><line x1="580.0" y1="145.0" x2="615.0" y2="145.0" stroke="#c0392b" stroke-width="2.0"/><line x1="665.0" y1="145.0" x2="725.0" y2="145.0" stroke="#c0392b" stroke-width="2.0"/><line x1="500.0" y1="285.0" x2="725.0" y2="285.0" stroke="#2457d6" stroke-width="2.0"/><line x1="690.0" y1="145.0" x2="690.0" y2="195.0" stroke="#c0392b" stroke-width="1.5"/><rect x="675.0" y="195.0" width="30.0" height="35.0" rx="2" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/><text x="690.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">C_out</text><text x="690.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">470 мкФ</text><line x1="690.0" y1="230.0" x2="690.0" y2="285.0" stroke="#2457d6" stroke-width="1.5"/><rect x="505.0" y="205.0" width="120.0" height="50.0" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.0"/><text x="565.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle" font-weight="700">Петля CC-захисту</text><text x="565.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Час реакції: 50–200 мкс</text><rect x="755.0" y="90.0" width="140.0" height="230.0" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/><text x="825.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">Нова плата (DUT)</text><rect x="775.0" y="185.0" width="100.0" height="50.0" rx="3" fill="#fef2f2" stroke="#c0392b" stroke-width="1.2"/><text x="825.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Дефект: КЗ</text><text x="825.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">R_short = 0.1 Ом</text><line x1="725.0" y1="145.0" x2="775.0" y2="145.0" stroke="#c0392b" stroke-width="2.0"/><line x1="775.0" y1="145.0" x2="825.0" y2="185.0" stroke="#c0392b" stroke-width="1.5"/><line x1="725.0" y1="285.0" x2="775.0" y2="285.0" stroke="#2457d6" stroke-width="2.0"/><line x1="775.0" y1="285.0" x2="825.0" y2="235.0" stroke="#2457d6" stroke-width="1.5"/><line x1="690.0" y1="128.0" x2="825.0" y2="128.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,3"/><text x="735.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Піковий розряд C_out: до 30–50 А за &lt; 5 мкс!</text><rect x="485.0" y="333.0" width="410.0" height="122.0" rx="4" fill="#fef2f2" stroke="#f87171" stroke-width="1.0"/><text x="495.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="start" font-weight="700">Пастка вихідної ємності джерела живлення (C_out):</text><text x="495.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="start">1. Навіть при встановленому ліміті струму 50 мА вихідний конденсатор БЖ заряджений до 5 В.</text><text x="495.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="start">2. При підключенні плати вся енергія E = 0.5 · C · V² миттєво скидається в місце дефекту.</text><text x="495.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="start">3. Петля зворотного зв'язку за струмом CC має затримку 50–200 мкс і не захищає від розряду C_out.</text><text x="495.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="start" font-weight="700">Правило: вмикати вихід БЖ кнопкою Output ON після підключення або плавно крутити напругу від 0 В.</text>
</svg>