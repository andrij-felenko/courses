<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння методів розділення панелей: V-Score проти Mouse Bites</text>
<rect x="10.0" y="10.0" width="840.0" height="510.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="430.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механіка панелізації: скрайбування (V-Score) та перфораційні перемички (Mouse Bites)</text>
<rect x="30.0" y="55.0" width="385.0" height="400.0" rx="6" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.2"/>
<text x="222.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1. Скрайбування (V-Score Cut)</text>
<rect x="60.0" y="120.0" width="130.0" height="60.0" rx="6" fill="#e7e5e4" stroke="#78716c" stroke-width="1.5"/>
<rect x="255.0" y="120.0" width="130.0" height="60.0" rx="6" fill="#e7e5e4" stroke="#78716c" stroke-width="1.5"/>
<rect x="190.0" y="138.0" width="65.0" height="24.0" rx="6" fill="#a8a29e" stroke="#57534e" stroke-width="1.2"/>
<line x1="190.0" y1="120.0" x2="222.0" y2="138.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="255.0" y1="120.0" x2="222.0" y2="138.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="190.0" y1="180.0" x2="222.0" y2="162.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="255.0" y1="180.0" x2="222.0" y2="162.0" stroke="#c0392b" stroke-width="1.8"/>
<text x="125.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Плата A</text>
<text x="320.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Плата B</text>
<text x="222.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Кут 30°..45°</text>
<text x="222.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">t = T/3</text>
<rect x="45.0" y="195.0" width="355.0" height="245.0" rx="4" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.0"/>
<text x="222.5" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">Механічне напруження керамічних конденсаторів (MLCC)</text>
<line x1="65.0" y1="240.0" x2="65.0" y2="325.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,3"/>
<text x="65.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">V-Score</text>
<rect x="85.0" y="255.0" width="48.0" height="22.0" rx="2" fill="#fca5a5" stroke="#c0392b" stroke-width="1.5"/>
<text x="109.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="middle" font-weight="700">MLCC</text>
<text x="109.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">НЕБЕЗПЕЧНО</text>
<text x="109.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Згин ламає кристал</text>
<rect x="195.0" y="250.0" width="22.0" height="48.0" rx="2" fill="#bbf7d0" stroke="#27ae60" stroke-width="1.5"/>
<text x="206.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="middle" font-weight="700">MLCC</text>
<text x="295.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">БЕЗПЕЧНО: d &gt;= 3.0 мм</text>
<text x="295.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle">Орієнтація вздовж лінії</text>
<text x="222.5" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#44403c" text-anchor="middle"><tspan x="222.5" dy="0.0">V-Score застосовується лише для прямих наскрізних ліній від краю до краю.</tspan><tspan x="222.5" dy="12.2">Залишковий перешийок: 0.45..0.55 мм для плати 1.6 мм.</tspan><tspan x="222.5" dy="12.2">Депанелізація згинанням створює критичні розтягуючі деформації.</tspan></text>
<rect x="445.0" y="55.0" width="385.0" height="400.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="637.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0ea5e9" text-anchor="middle" font-weight="700">2. Перфорація (Mouse Bites / Break-Tabs)</text>
<rect x="460.0" y="100.0" width="355.0" height="160.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
<rect x="475.0" y="115.0" width="105.0" height="130.0" rx="6" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
<text x="527.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Плата</text>
<rect x="685.0" y="115.0" width="105.0" height="130.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="737.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Рамка панелі</text>
<rect x="580.0" y="115.0" width="105.0" height="40.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.0"/>
<rect x="580.0" y="205.0" width="105.0" height="40.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.0"/>
<text x="632.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Паз фрези 2.0 мм</text>
<text x="632.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Паз фрези 2.0 мм</text>
<rect x="580.0" y="155.0" width="105.0" height="50.0" rx="6" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
<circle cx="577.0" cy="161.0" r="3.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
<circle cx="577.0" cy="173.0" r="3.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
<circle cx="577.0" cy="185.0" r="3.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
<circle cx="577.0" cy="197.0" r="3.5" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
<line x1="577.0" y1="155.0" x2="577.0" y2="205.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="2,2"/>
<text x="632.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0ea5e9" text-anchor="middle" font-weight="700">Перемичка 4.0 мм</text>
<text x="632.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">5 отворів d=0.6 мм</text>
<rect x="460.0" y="275.0" width="355.0" height="160.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="637.5" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0ea5e9" text-anchor="middle" font-weight="700">Втоплена перфорація (Recessed Mouse Bites)</text>
<text x="637.5" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle"><tspan x="637.5" dy="0.0">При виламуванні склотекстоліт утворює гострі задирки (burrs).</tspan><tspan x="637.5" dy="12.6">Зміщення лінії перфорації на 0.3..0.5 мм всередину контуру</tspan><tspan x="637.5" dy="12.6">гарантує, що зламаний край не виступатиме за габарит плати</tspan><tspan x="637.5" dy="12.6">і не заклинить плату під час монтажу у корпус.</tspan></text>
<rect x="107.2" y="468.1" width="645.6" height="33.9" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="482.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">V-Score забезпечує швидке та жорстке розділення прямокутних плат, але вимагає захисту компонентів від згину.</tspan><tspan x="430.0" dy="12.3">Mouse Bites дозволяють формувати довільні криволінійні контури та складні вирізи з мінімальним ударним навантаженням.</tspan></text>
</svg>