<text x="544.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Монтаж згідно зі стандартом IPC-A-610 Class 2.</text>
<text x="544.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Паяльна паста: SAC305, No-Clean, Type 4.</text>
<text x="544.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Реперні знаки (Fiducials): 3 глобальні + локальні.</text>
<text x="544.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">4. D1: Смужка позначає КАТОД (Cathode).</text>
<text x="544.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">5. C1: Смужка позначає ПОЗИТИВНИЙ вивід (+).</text>
<text x="544.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">6. J1: Момент затяжки гвинтів кріплення = 0.35 Н·м.</text>
<text x="544.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">7. Пунктирна зона: захистити від захисного лаку.</text>
<text x="544.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">8. Не встановлювати компоненти з поміткою DNP.</text>
