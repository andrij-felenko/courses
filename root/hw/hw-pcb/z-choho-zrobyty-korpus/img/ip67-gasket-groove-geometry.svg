<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрія посадкового паза та ступінь стиснення ущільнювача IP67/IP68</text>
<rect x="10.0" y="10.0" width="840.0" height="510.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="430.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрія посадкового паза (Gland) та ступінь стиснення ущільнювача IP67/IP68</text>
<rect x="35.0" y="60.0" width="375.0" height="390.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="222.5" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Вільний стан до затягування (d_cord &gt; h_groove)</text>
<rect x="75.0" y="105.0" width="295.0" height="40.0" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<text x="222.5" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кришка корпусу (Top Cover)</text>
<line x1="125.0" y1="150.0" x2="125.0" y2="173.0" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="320.0" y1="150.0" x2="320.0" y2="173.0" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="222.5" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ef4444" text-anchor="middle" font-weight="700">Зусилля притискання F_clamp</text>
<rect x="75.0" y="180.0" width="85.0" height="110.0" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
<rect x="285.0" y="180.0" width="85.0" height="110.0" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
<rect x="160.0" y="245.0" width="125.0" height="45.0" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
<circle cx="222.0" cy="215.0" r="35.0" fill="#fed7aa" stroke="#ea580c" stroke-width="2.0"/>
<text x="222.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a3412" text-anchor="middle" font-weight="700">d_cord = 2.5 мм</text>
<line x1="160.0" y1="300.0" x2="285.0" y2="300.0" stroke="#2563eb" stroke-width="1.2"/>
<line x1="160.0" y1="295.0" x2="160.0" y2="305.0" stroke="#2563eb" stroke-width="1.2"/>
<line x1="285.0" y1="295.0" x2="285.0" y2="305.0" stroke="#2563eb" stroke-width="1.2"/>
<text x="222.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="700">w_groove = 3.2 мм (1.28 × d)</text>
<line x1="293.0" y1="180.0" x2="293.0" y2="245.0" stroke="#2563eb" stroke-width="1.2"/>
<line x1="288.0" y1="180.0" x2="298.0" y2="180.0" stroke="#2563eb" stroke-width="1.2"/>
<line x1="288.0" y1="245.0" x2="298.0" y2="245.0" stroke="#2563eb" stroke-width="1.2"/>
<text x="337.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="700">h = 1.85 мм</text>
<text x="222.5" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle"><tspan x="222.5" dy="0.0">Круглий шнур O-Ring або силіконова прокладка.</tspan><tspan x="222.5" dy="12.8">Вільний діаметр перерізу перевищує глибину паза на 25–30%.</tspan><tspan x="222.5" dy="12.8">Ширина паза розраховується з запасом на розширення гуми.</tspan></text>
<rect x="445.0" y="60.0" width="375.0" height="390.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="632.5" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">2. Стиснений робочий стан (IP67 герметизація)</text>
<rect x="485.0" y="135.0" width="295.0" height="40.0" rx="2" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<text x="632.5" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кришка зімкнута метал-до-металу</text>
<rect x="485.0" y="175.0" width="85.0" height="110.0" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
<rect x="695.0" y="175.0" width="85.0" height="110.0" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
<rect x="570.0" y="240.0" width="125.0" height="45.0" rx="6" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
<rect x="585.0" y="185.0" width="95.0" height="55.0" rx="20" fill="#fed7aa" stroke="#ea580c" stroke-width="2.0"/>
<text x="632.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a3412" text-anchor="middle" font-weight="700">Стиснення: 26%</text>
<text x="632.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9a3412" text-anchor="middle">Заповнення: 78%</text>
<line x1="575.0" y1="195.0" x2="583.0" y2="210.0" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="690.0" y1="195.0" x2="682.0" y2="210.0" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="632.5" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0284c7" text-anchor="middle" font-weight="700">Зазор для термічного розширення еластомеру</text>
<text x="632.5" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle"><tspan x="632.5" dy="0.0">Стиснення еластомеру 20–30% створює надійний бар'єр.</tspan><tspan x="632.5" dy="12.8">Коефіцієнт заповнення паза (Groove Fill) не перевищує 85%,</tspan><tspan x="632.5" dy="12.8">тому нестислива гума не блокує стик і не деформує корпус.</tspan></text>
<rect x="116.2" y="467.5" width="627.6" height="35.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Правило розрахунку паза: Площа перерізу паза повинна бути на 15–25% більшою за площу перерізу ущільнювача.</tspan><tspan x="430.0" dy="13.0">Для корпусів з 3D-друку мінімальна товщина стінки навколо паза становить 2.0 мм через ризик мікропористості.</tspan></text>
</svg>