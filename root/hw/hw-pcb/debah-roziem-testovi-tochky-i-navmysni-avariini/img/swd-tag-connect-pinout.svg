<text x="55.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start">• Підтяжка nRESET: 10–100 кОм до VCC + 100 нФ на GND</text>
