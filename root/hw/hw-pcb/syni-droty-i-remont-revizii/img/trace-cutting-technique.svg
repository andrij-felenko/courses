<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Технологія перерізання друкованих провідників: ризики та стандарт IPC-7721</text>
<rect x="25.0" y="50.0" width="435.0" height="430.0" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.2"/>
<text x="242.5" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Небезпечно: прямий різ під кутом 90°</text>
<rect x="55.0" y="100.0" width="375.0" height="20.0" rx="0" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.2"/>
<text x="115.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Паяльна маска (20 мкм)</text>
<rect x="55.0" y="120.0" width="375.0" height="28.0" rx="0" fill="#d97706" stroke="#b45309" stroke-width="1.2"/>
<text x="122.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Шар L1: Мідний провідник (35 мкм / 1 oz)</text>
<rect x="55.0" y="148.0" width="375.0" height="70.0" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="130.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700">Препрег / Діелектрик FR-4 (100–150 мкм)</text>
<rect x="55.0" y="218.0" width="375.0" height="28.0" rx="0" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="130.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Шар L2: Внутрішня площина GND (35 мкм)</text>
<rect x="55.0" y="246.0" width="375.0" height="25.0" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.0"/>
<text x="130.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Основа FR-4 Core</text>
<polygon points="278.5,65.0 306.5,65.0 292.5,220.0" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
<text x="292.5" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Скальпель №11</text>
<circle cx="292.5" cy="220.0" r="10.0" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<text x="292.5" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">⚡</text>
<rect x="40.0" y="285.0" width="405.0" height="52.0" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="242.5" y="307.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle"><tspan x="242.5" dy="0.0">1. Задирки міді (Burrs) на краях розрізу</tspan><tspan x="242.5" dy="14.3">Під вібрацією або термоциклами змикаються назад</tspan></text>
<rect x="40.0" y="345.0" width="405.0" height="58.0" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="242.5" y="363.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle"><tspan x="242.5" dy="0.0">2. Прорізання тонкого препрегу L1–L2</tspan><tspan x="242.5" dy="14.3">Лезо скальпеля закорочує сигнальний провідник L1</tspan><tspan x="242.5" dy="14.3">на суцільний внутрішній шар заземлення L2</tspan></text>
<rect x="40.0" y="410.0" width="405.0" height="56.0" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="242.5" y="427.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle"><tspan x="242.5" dy="0.0">3. Капілярне затікання вологи та флюсу</tspan><tspan x="242.5" dy="14.3">Негерметизований мікророзріз утворює струмопровідні</tspan><tspan x="242.5" dy="14.3">дендрити міді під дією постійної напруги</tspan></text>
<rect x="480.0" y="50.0" width="435.0" height="430.0" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.2"/>
<text x="697.5" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Правильно: вибірка сегмента за IPC-7721</text>
<rect x="510.0" y="120.0" width="217.5" height="28.0" rx="0" fill="#d97706" stroke="#b45309" stroke-width="1.2"/>
<rect x="767.5" y="120.0" width="117.5" height="28.0" rx="0" fill="#d97706" stroke="#b45309" stroke-width="1.2"/>
<rect x="510.0" y="100.0" width="207.5" height="20.0" rx="0" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.2"/>
<rect x="777.5" y="100.0" width="107.5" height="20.0" rx="0" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.2"/>
<rect x="510.0" y="148.0" width="375.0" height="70.0" rx="0" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="585.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700">Препрег не пошкоджено (глибина різу ≤ 35 мкм)</text>
<rect x="510.0" y="218.0" width="375.0" height="28.0" rx="0" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="585.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Шар L2: Внутрішня площина GND (цілісна)</text>
<rect x="510.0" y="246.0" width="375.0" height="25.0" rx="0" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.0"/>
<rect x="722.5" y="105.0" width="50.0" height="43.0" rx="3" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
<text x="747.5" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle" font-weight="700">УФ-маска</text>
<line x1="727.5" y1="88.0" x2="767.5" y2="88.0" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="727.5" y1="84.0" x2="727.5" y2="92.0" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="767.5" y1="84.0" x2="767.5" y2="92.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="747.5" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зазор 0.8–1.5 мм</text>
<rect x="495.0" y="285.0" width="405.0" height="52.0" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="697.5" y="307.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle"><tspan x="697.5" dy="0.0">Крок 1. Два надрізи під кутом 30–45°</tspan><tspan x="697.5" dy="14.3">Виконувати з контролем тиску, не прорізаючи діелектрик</tspan></text>
<rect x="495.0" y="345.0" width="405.0" height="58.0" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="697.5" y="363.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle"><tspan x="697.5" dy="0.0">Крок 2. Відлущування мідного сегмента</tspan><tspan x="697.5" dy="14.3">Пінцетом видаляється острівець міді довжиною ~1 мм;</tspan><tspan x="697.5" dy="14.3">оголений чистий склотекстоліт перевіряється мікроскопом</tspan></text>
<rect x="495.0" y="410.0" width="405.0" height="56.0" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="697.5" y="427.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle"><tspan x="697.5" dy="0.0">Крок 3. Герметизація УФ-затверджуваною маскою</tspan><tspan x="697.5" dy="14.3">Паз заливається акриловою маскою й полімеризується УФ;</tspan><tspan x="697.5" dy="14.3">виключає корозію, міграцію міді та випадкове замикання</tspan></text>
</svg>