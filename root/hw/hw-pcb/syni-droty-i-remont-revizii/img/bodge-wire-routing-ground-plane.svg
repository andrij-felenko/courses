<rect x="55.0" y="258.0" width="375.0" height="30.0" rx="0" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.2"/>
<text x="100.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">FR-4 PCB</text>
<rect x="55.0" y="288.0" width="375.0" height="18.0" rx="0" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="155.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">Внутрішня площина заземлення (GND Plane)</text>
