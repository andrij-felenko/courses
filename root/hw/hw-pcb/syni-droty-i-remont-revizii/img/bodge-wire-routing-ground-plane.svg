<rect x="355.0" y="233.0" width="45.0" height="25.0" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="1.2"/>
<text x="377.5" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">IC 2</text>
<path d="M 107.5,233.0 Q 242.5,128.0 377.5,233.0" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<text x="242.5" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Синій дріт (висота h = 15–20 мм)</text>
<line x1="107.5" y1="297.0" x2="377.5" y2="297.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="4,3"/>
<text x="242.5" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">Зворотний струм тече в площині GND під дротом</text>
<polygon points="107.5,233.0 242.5,148.0 377.5,233.0 107.5,233.0" fill="#fecaca" fill-opacity="0.35"/>
<text x="242.5" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">Величезна площа контуру A_loop</text>
<rect x="40.0" y="328.0" width="405.0" height="56.0" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="242.5" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle"><tspan x="242.5" dy="0.0">• Паразитна індуктивність L_loop ≈ 20–50 нГн</tspan><tspan x="242.5" dy="13.7">• Стрибки напруги (L·di/dt) спотворюють фронти імпульсів</tspan><tspan x="242.5" dy="13.7">• Працює як антена: високий рівень випромінювання EMI</tspan></text>
<rect x="40.0" y="392.0" width="405.0" height="56.0" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="242.5" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle"><tspan x="242.5" dy="0.0">• Висока взаємна індукція: наводить завади на сусідні кола</tspan><tspan x="242.5" dy="13.7">• Сприйнятливість до зовнішніх магнітних полів</tspan><tspan x="242.5" dy="13.7">• Швидкісні інтерфейси (SPI &gt; 10 MHz, QSPI) дають збої</tspan></text>
<rect x="480.0" y="48.0" width="435.0" height="415.0" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.2"/>
<text x="697.5" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Правильно: щільне прилягання до плати</text>
<rect x="510.0" y="258.0" width="375.0" height="30.0" rx="0" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.2"/>
<text x="555.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">FR-4 PCB</text>
<rect x="510.0" y="288.0" width="375.0" height="18.0" rx="0" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.2"/>
<text x="610.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">Внутрішня площина заземлення (GND Plane)</text>
<rect x="540.0" y="233.0" width="45.0" height="25.0" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="1.2"/>
<text x="562.5" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">IC 1</text>
<rect x="810.0" y="233.0" width="45.0" height="25.0" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="1.2"/>
<text x="832.5" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">IC 2</text>
<polyline points="562.5,233.0 562.5,256.0 832.5,256.0 832.5,233.0" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="630.0" cy="256.0" r="7.0" fill="#86efac" stroke="#16a34a" stroke-width="1.2"/>
<circle cx="697.5" cy="256.0" r="7.0" fill="#86efac" stroke="#16a34a" stroke-width="1.2"/>
<circle cx="765.0" cy="256.0" r="7.0" fill="#86efac" stroke="#16a34a" stroke-width="1.2"/>
<text x="697.5" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Фіксація УФ-маскою / клеєм що 15–20 мм</text>
<line x1="562.5" y1="297.0" x2="832.5" y2="297.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="4,3"/>
<text x="697.5" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Мінімальний проміжок h ≈ 0.2 мм (товщина маски)</text>
<text x="697.5" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Мінімальна площа контуру A_min</text>
<rect x="495.0" y="328.0" width="405.0" height="56.0" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="697.5" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle"><tspan x="697.5" dy="0.0">• Паразитна індуктивність мінімізована: L_loop &lt; 3–5 нГн</tspan><tspan x="697.5" dy="12.3">• Зворотний струм у GND тече безпосередньо під дротом</tspan><tspan x="697.5" dy="12.3">• Хвильовий опір наближається до мікросмужкової лінії (~80–110 Ом)</tspan></text>
<rect x="495.0" y="392.0" width="405.0" height="56.0" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="697.5" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle"><tspan x="697.5" dy="0.0">• Стійкість до вібрацій: дріт не відриває контакти компонентів</tspan><tspan x="697.5" dy="13.7">• Для ліній &gt; 25 МГц застосовують виту пару (Signal + GND)</tspan><tspan x="697.5" dy="13.7">• Відсутність перехресних наведень на сусідні сигнальні шини</tspan></text>
</svg>