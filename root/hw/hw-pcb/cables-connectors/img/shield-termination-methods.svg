<text x="680.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Z_shield ≈ 0 Ом на ВЧ</text>
<text x="680.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Струми завад стікають на шасі</text>
<rect x="30.0" y="299.8" width="760.0" height="80.4" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="410.0" y="321.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Фізична суть: Довгий тонкий дріт заземлення (pigtail 5 см) має індуктивність L ≈ 50 нГн.</tspan><tspan x="410.0" dy="15.0">• На частоті 100 МГц його імпеданс: X_L = 2π·f·L = 2π·100·10⁶ · 50·10⁻⁹ ≈ 31.4 Ом!</tspan><tspan x="410.0" dy="15.0">• Такий високий імпеданс повністю зводить нанівець дію екрана і перетворює його на передавальну антену.</tspan><tspan x="410.0" dy="15.0">• Круговий контакт 360° забезпечує низькоіндуктивний стік ВЧ струмів безпосередньо на металеве шасі.</tspan></text>
</svg>