<rect x="-24.8" y="304.8" width="869.6" height="80.4" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="410.0" y="326.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Механізм спотворення: Струм навантаження 2.5 А на сумарному опорі проводу й контактів (0.26 Ом) створює падіння ΔU_GND = 0.65 В.</tspan><tspan x="410.0" dy="15.0">• Для Slave-модуля напруга сигналу від Master сприймається як: V_in = 0.10 В − (+0.65 В) = −0.55 В (вибиває ESD-діоди)!</tspan><tspan x="410.0" dy="15.0">• При передачі від Slave до Master: нуль передається як 0.1 В + 0.65 В = 0.75 В (майже сягає V_IL_max = 0.80 В — помилки зв'язку)</tspan><tspan x="410.0" dy="15.0">• Рішення: товстіший AWG для GND, виділений окремий зворотний дріт сигнальної землі або диференційний RS-485 / CAN</tspan></text>
</svg>