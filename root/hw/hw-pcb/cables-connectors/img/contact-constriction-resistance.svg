<rect x="40.0" y="293.6" width="740.0" height="82.8" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="410.0" y="315.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Повний опір контакту: R_contact = R_constriction + R_film + R_bulk</tspan><tspan x="410.0" dy="15.6">• Опір стягування (R_constriction): лінії струму стискаються до крихітних a-spots (0.01% площі)</tspan><tspan x="410.0" dy="15.6">• Опір плівки (R_film): оксиди й забруднення руйнуються зусиллям F_N та золоченням</tspan><tspan x="410.0" dy="15.6">• Типові значення: R_contact = 5–20 мОм для нового якісного роз'єму (до 100+ мОм при зносі)</tspan></text>
