<rect x="40.0" y="420.0" width="405.0" height="100.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="50.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Умова успішного вивільнення пасти:</text>
<text x="50.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700">F_pad &gt; F_wall  ⇒  A_pad · σ_pad &gt; A_walls · τ_wall</text>
<text x="50.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Площа стінок: A_walls = 2 · (W + L) · T</text>
<text x="50.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Площа площадки: A_pad = W · L</text>
<rect x="475.0" y="55.0" width="380.0" height="480.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="490.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Критерії та пороги стандарту IPC-7525</text>
<rect x="490.0" y="95.0" width="350.0" height="90.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="505.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Area Ratio (Прямокутна апертура)</text>
<text x="505.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700">AR = (W · L) / [ 2 · (W + L) · T ] ≥ 0.66</text>
<text x="505.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Стандартна фольга без покриття: AR ≥ 0.66</text>
<text x="505.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="start" font-weight="700">З нанопокриттям (Nano-coating): AR ≥ 0.50–0.55</text>
<rect x="490.0" y="195.0" width="350.0" height="80.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="505.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Area Ratio (Кругла апертура BGA / CSP)</text>
<text x="505.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700">AR = D / (4 · T) ≥ 0.66</text>
<text x="505.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">де D — діаметр апертури, T — товщина фольги</text>
<rect x="490.0" y="285.0" width="350.0" height="70.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="505.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Aspect Ratio (Коефіцієнт пропорції)</text>
<text x="505.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700">AS = W / T ≥ 1.50</text>
<text x="505.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">де W — ширина вузького боку апертури</text>
