<line x1="230.0" y1="222.0" x2="330.0" y2="187.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="285.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">L</text>
