<text x="185.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(давач, малий Iсиг)</text>
<rect x="620.0" y="196.0" width="150.0" height="60.0" rx="8" fill="#eef2fb" stroke="#1f47b5" stroke-width="2"/>
