<text x="570.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">тут струми зливаються</text>
<line x1="560.0" y1="196.0" x2="560.0" y2="300.0" stroke="#7a3fb0" stroke-width="3" stroke-linecap="round"/>
<rect x="549.0" y="311.0" width="22.0" height="44.0" rx="3" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
