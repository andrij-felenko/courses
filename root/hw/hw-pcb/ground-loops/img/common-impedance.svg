<rect x="640.0" y="296.0" width="280.0" height="96.0" rx="10" fill="#fff6ee" stroke="#e08030" stroke-width="1.7"/>
<text x="780.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Uпом = (Iсил+Iсиг)·Rg</text>
<text x="780.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ця напруга піднімає «землю» сигналу</text>
<text x="780.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">над істинним нулем — і додається</text>
<text x="780.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">просто до корисного сигналу</text>
