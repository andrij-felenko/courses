<line x1="560.0" y1="392.0" x2="560.0" y2="400.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="548.0" y1="400.0" x2="572.0" y2="400.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
