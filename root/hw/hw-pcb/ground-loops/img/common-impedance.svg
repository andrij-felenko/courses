<text x="470.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Спільний імпеданс: чужий струм перетворює «землю» на джерело завади</text>
<text x="470.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">коли сильний і слабкий струми течуть назад одним дротом, його крихітний опір (за §1.3.2) дає падіння напруги, що домішується до сигналу</text>
<rect x="110.0" y="96.0" width="150.0" height="60.0" rx="8" fill="#fbe9e1" stroke="#c0271e" stroke-width="2"/>
<text x="185.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">силове навантаження</text>
<text x="185.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(мотор, велике Iсил)</text>
<rect x="110.0" y="196.0" width="150.0" height="60.0" rx="8" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2"/>
