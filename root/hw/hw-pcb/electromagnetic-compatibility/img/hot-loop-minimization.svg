<text x="580.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Короткий контур перемикання &lt; 3–5 мм</text>
<text x="580.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">✓ Індуктивність петлі зменшена до &lt; 1–2 нГн</text>
<text x="580.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">✓ Сплески напруги (ringing) згасають миттєво</text>
<text x="580.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">✓ Поле замикається локально і не випромінює</text>
