<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 270" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="270" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тріада електромагнітної сумісності (EMC Triad)</text>
<rect x="40.0" y="60.0" width="190.0" height="140.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="135.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ДЖЕРЕЛО ЗАВАДИ</text>
<text x="135.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(Noise Source / Aggressor)</text>
<line x1="55.0" y1="115.0" x2="215.0" y2="115.0" stroke="#f0d0d0" stroke-width="1.0"/>
<text x="135.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Ключі DC-DC (dV/dt, dI/dt)</text>
<text x="135.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Тактові генератори, MCU</text>
<text x="135.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Реле, іскри, ESD-розряди</text>
<rect x="530.0" y="60.0" width="190.0" height="140.0" rx="8" fill="#f0f5ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="625.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ЖЕРТВА ЗАВАДИ</text>
<text x="625.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(Susceptible Device / Victim)</text>
<line x1="545.0" y1="115.0" x2="705.0" y2="115.0" stroke="#d0e0ff" stroke-width="1.0"/>
<text x="625.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Аналогові АЦП, сенсори</text>
<text x="625.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Лінії скидання (Reset), NMI</text>
<text x="625.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Радіотракти (LNA, антени)</text>
<rect x="255.0" y="50.0" width="250.0" height="160.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="380.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ШЛЯХ ПЕРЕДАЧІ (Coupling Path)</text>
<line x1="270.0" y1="82.0" x2="490.0" y2="82.0" stroke="#e0e0e0" stroke-width="1.0"/>
<text x="270.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">1. Кондуктивний</text>
<text x="370.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">спільний імпеданс Z_GND, живлення</text>
<text x="270.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">2. Ємнісний</text>
<text x="370.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">електричне поле, струм C_M · dV/dt</text>
<text x="270.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">3. Індуктивний</text>
<text x="370.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">магнітне поле, напруга M · dI/dt</text>
<text x="270.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">4. Випромінювальний</text>
<text x="370.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">антени-петлі, хвилі в просторі</text>
<line x1="232.0" y1="130.0" x2="253.0" y2="130.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="507.0" y1="130.0" x2="528.0" y2="130.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Розрив або пригнічення будь-якої з 3 ланок повністю ліквідує проблему ЕМС</text>
</svg>