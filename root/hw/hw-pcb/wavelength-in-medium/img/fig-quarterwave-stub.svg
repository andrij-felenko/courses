<text x="345.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Фізична довжина: L_фіз = (λ_g / 4) − Δl</text>
