<text x="410.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Так схему не захаращують довгими лініями: «+5В» тут і «+5В» там — це одне коло.</text>
<text x="410.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Особливо зручно для живлення (+5В, GND) і шин сигналів (напр. SDA, SCL).</text>
