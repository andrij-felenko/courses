<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Атомарний компонент бібліотеки (Atomic Library Component)</text>
<text x="420.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Єдина неподільна сутність: неможливо вставити символ без прив'язаного корпусу й точного MPN</text>
<rect x="300.0" y="135.0" width="240.0" height="70.0" rx="10" fill="#eef7f0" stroke="#27ae60" stroke-width="2.4"/>
<text x="420.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">АРТИКУЛ ВИРОБНИКА (MPN)</text>
<text x="420.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">STM32F401RET6 / 2N7002</text>
<text x="420.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Єдиний ключ бази даних</text>
<rect x="40.0" y="90.0" width="230.0" height="150.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="155.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. СХЕМНИЙ СИМВОЛ</text>
<text x="155.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">• Логічні лінії та порти</tspan><tspan x="155.0" dy="14.9">• Функційне групування пінів</tspan><tspan x="155.0" dy="14.9">• Електричні типи (In, Out, Pwr)</tspan><tspan x="155.0" dy="14.9">• Полярність (Active Low, ~RESET)</tspan></text>
<rect x="570.0" y="90.0" width="230.0" height="150.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="685.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2. ПОСАДКОВЕ МІСЦЕ</text>
<text x="685.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">• Контактні площадки (Pads)</tspan><tspan x="685.0" dy="14.9">• Маска та паста (Mask/Paste)</tspan><tspan x="685.0" dy="14.9">• Шовкографія та полярність (Pin 1)</tspan><tspan x="685.0" dy="14.9">• Межа дворика (Courtyard IPC)</tspan></text>
<rect x="40.0" y="270.0" width="230.0" height="140.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="155.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">3. 3D-МОДЕЛЬ (STEP)</text>
<text x="155.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">• Точні просторові габарити</tspan><tspan x="155.0" dy="14.9">• Перевірка кліренсу з корпусом</tspan><tspan x="155.0" dy="14.9">• Центрування відносно посадки</tspan><tspan x="155.0" dy="14.9">• Тепловий та механічний аналіз</tspan></text>
<rect x="570.0" y="270.0" width="230.0" height="140.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="685.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">4. АТРИБУТИ BOM ТА ERP</text>
<text x="685.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">• Виробник та повний артикул</tspan><tspan x="685.0" dy="14.9">• Номінал, точність, напруга</tspan><tspan x="685.0" dy="14.9">• Пряме посилання на Datasheet</tspan><tspan x="685.0" dy="14.9">• Статус життєвого циклу / RoHS</tspan></text>
<line x1="300.0" y1="155.0" x2="270.0" y2="165.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="540.0" y1="155.0" x2="570.0" y2="165.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="300.0" y1="185.0" x2="270.0" y2="340.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="540.0" y1="185.0" x2="570.0" y2="340.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="290.0" y="290.0" width="260.0" height="100.0" rx="8" fill="#fdf0ea" stroke="#c0392b" stroke-width="1.6"/>
<text x="420.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ЗАБОРОНА «generic» СИМВОЛІВ</text>
<text x="420.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Символ без точного посадкового</tspan><tspan x="420.0" dy="14.3">місця або без MPN блокується</tspan><tspan x="420.0" dy="14.3">автоматичним валідатором</tspan></text>
</svg>