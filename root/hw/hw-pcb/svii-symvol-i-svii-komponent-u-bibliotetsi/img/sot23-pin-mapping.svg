<text x="145.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="145.0" dy="0.0">Номери в бібліотеці:</tspan><tspan x="145.0" dy="14.3">1 -&gt; G, 2 -&gt; S, 3 -&gt; D</tspan></text>
