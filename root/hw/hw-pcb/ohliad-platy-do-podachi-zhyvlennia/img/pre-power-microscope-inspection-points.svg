<text x="640.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Замикання між виводами з кроком ≤0.5 мм</text>
<text x="640.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Типово для QFP, TSSOP, SOIC мікросхем</text>
<text x="640.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Усувається мідним обплетенням і флюсом</text>
<rect x="520.0" y="195.0" width="420.0" height="115.0" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/>
<text x="535.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Припоєві кульки біля пасивних SMD</text>
<rect x="545.0" y="238.0" width="12.0" height="20.0" rx="6" fill="#a0aec0" stroke="#4a5568" stroke-width="1.5"/>
<rect x="557.0" y="238.0" width="26.0" height="20.0" rx="6" fill="#2d3748" stroke="#1a202c" stroke-width="1.5"/>
<rect x="583.0" y="238.0" width="12.0" height="20.0" rx="6" fill="#a0aec0" stroke="#4a5568" stroke-width="1.5"/>
<circle cx="570.0" cy="274.0" r="5.0" fill="#e53e3e" stroke="#9b2c2c" stroke-width="1.5"/>
<text x="620.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Вибухове викидання флюсу при нагріві</text>
<text x="620.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• Кулька закорочує сусідні доріжки та віаси</text>
<text x="620.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Видаляється ультразвуком або пензлем</text>
<rect x="520.0" y="320.0" width="420.0" height="115.0" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/>
<text x="535.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Надгробок (Tombstoning) та розриви</text>
<rect x="545.0" y="385.0" width="20.0" height="6.0" rx="6" fill="#cbd5e0" stroke="#718096" stroke-width="1.5"/>
<rect x="585.0" y="385.0" width="20.0" height="6.0" rx="6" fill="#cbd5e0" stroke="#718096" stroke-width="1.5"/>
<rect x="547.0" y="360.0" width="16.0" height="25.0" rx="1" fill="#2b6cb0" stroke="#2c5282" stroke-width="1.5"/>
<text x="620.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Несиметричний натяг розплавленого припою</text>
<text x="620.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">• Повний обрив ланцюга живлення чи сигналу</text>
<text x="620.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Причина: нерівні термобар'єри на полігоні</text>
<rect x="520.0" y="445.0" width="420.0" height="135.0" rx="6" fill="#fff5f5" stroke="#feb2b2" stroke-width="1.5"/>
<text x="535.0" y="467.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">4. Тріщини в кераміці MLCC (Flex Cracks)</text>
<rect x="545.0" y="485.0" width="50.0" height="26.0" rx="2" fill="#d69e2e" stroke="#b7791f" stroke-width="1.5"/>
<line x1="565.0" y1="485.0" x2="575.0" y2="511.0" stroke="#e53e3e" stroke-width="2.0"/>
<text x="615.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Тріщина виникає при вигині або термоударі</text>
<text x="615.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• Призводить до плаваючого або низькоомного КЗ</text>
<text x="615.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Непомітна без мікроскопа з косим світлом</text>
<text x="615.0" y="546.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">• Заміна компонента без повторного перегріву</text>
