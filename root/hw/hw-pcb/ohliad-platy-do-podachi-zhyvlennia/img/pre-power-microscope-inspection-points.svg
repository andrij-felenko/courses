<text x="250.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Орієнтація полярних компонентів</text>
<rect x="40.0" y="70.0" width="420.0" height="115.0" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/>
<text x="55.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Ключ виводу 1 мікросхеми (Pin 1 IC)</text>
<rect x="65.0" y="105.0" width="60.0" height="60.0" rx="3" fill="#2b2d42" stroke="#111111" stroke-width="1.5"/>
<circle cx="75.0" cy="115.0" r="4.0" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/>
<line x1="55.0" y1="115.0" x2="65.0" y2="115.0" stroke="#8d99ae" stroke-width="2.0"/>
<line x1="55.0" y1="125.0" x2="65.0" y2="125.0" stroke="#8d99ae" stroke-width="2.0"/>
<line x1="55.0" y1="135.0" x2="65.0" y2="135.0" stroke="#8d99ae" stroke-width="2.0"/>
<line x1="55.0" y1="145.0" x2="65.0" y2="145.0" stroke="#8d99ae" stroke-width="2.0"/>
<text x="140.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Лазерна крапка або фаска кута</text>
<text x="140.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Скос шовкодруку на платі</text>
<text x="140.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Збіг з ключем у схемі та на платі</text>
<rect x="40.0" y="195.0" width="420.0" height="115.0" rx="6" fill="#fff5f5" stroke="#feb2b2" stroke-width="1.5"/>
<text x="55.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">2. Танталовий SMD-конденсатор</text>
<rect x="65.0" y="230.0" width="60.0" height="36.0" rx="2" fill="#f6ad55" stroke="#dd6b20" stroke-width="1.5"/>
<rect x="65.0" y="230.0" width="14.0" height="36.0" rx="1" fill="#c53030" stroke="#9b2c2c" stroke-width="1.5"/>
<text x="72.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">+</text>
<text x="140.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• СМУГА = АНОД (ПОЗИТИВНИЙ ПОЛЮС +)</text>
<text x="140.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Зворотне вмикання викликає вибух і пробій</text>
<text x="140.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">• Протилежно до алюмінієвих електролітів!</text>
<rect x="40.0" y="320.0" width="420.0" height="115.0" rx="6" fill="#f0f7ff" stroke="#bee3f8" stroke-width="1.5"/>
<text x="55.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">3. Алюмінієвий електролітичний конденсатор</text>
<circle cx="95.0" cy="380.0" r="22.0" fill="#edf2f7" stroke="#4a5568" stroke-width="2.0"/>
<rect x="73.0" y="358.0" width="14.0" height="44.0" rx="6" fill="#3182ce" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="80.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">−</text>
<text x="140.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">• СМУГА = КАТОД (НЕГАТИВНИЙ ПОЛЮС −)</text>
<text x="140.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Скос кутів пластикової платформи = мінус</text>
<text x="140.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Чітке звірення з маскою полігону GND</text>
<rect x="40.0" y="445.0" width="420.0" height="135.0" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/>
<text x="55.0" y="467.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">4. Діоди та SMD-світлодіоди (LED)</text>
<rect x="65.0" y="480.0" width="50.0" height="26.0" rx="2" fill="#1a202c" stroke="#000000" stroke-width="1.5"/>
<rect x="65.0" y="480.0" width="10.0" height="26.0" rx="1" fill="#e2e8f0" stroke="#cbd5e0" stroke-width="1.5"/>
<text x="130.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• Смуга на діоді = КАТОД (K / −)</text>
<text x="130.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">• Зелена крапка / риска на дні LED = Катод</text>
<text x="130.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Зріз лінзи або трикутник у шовкодруку</text>
<text x="130.0" y="546.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Перевірка падіння напруги мультиметром</text>
<rect x="500.0" y="20.0" width="460.0" height="580.0" rx="6" fill="#fbfcfd" stroke="#d0d7de" stroke-width="1.5"/><text x="730.0" y="314.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0"></tspan></text>
<text x="730.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дефекти пайки та монтажні замикання</text>
<rect x="520.0" y="70.0" width="420.0" height="115.0" rx="6" fill="#fffaf0" stroke="#feebc8" stroke-width="1.5"/>
