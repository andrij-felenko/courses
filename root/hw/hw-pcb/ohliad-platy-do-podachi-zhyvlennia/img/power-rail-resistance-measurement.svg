<text x="720.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Струм через Sense-лінії ≈ 0 → R_дроту не впливає на вимір напруги</text>
<text x="720.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Точність до міліомів (мОм): чітке розрізнення 0.02 Ом (КЗ) та 0.85 Ом (ядро)</text>
<text x="720.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Єдиний надійний метод діагностики сучасних низьковольтних SoC/FPGA</text>
<rect x="20.0" y="305.0" width="460.0" height="295.0" rx="6" fill="#fbfcfd" stroke="#d0d7de" stroke-width="1.5"/><text x="250.0" y="457.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0"></tspan></text>
<text x="250.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Типовий опір рейок живлення відносно GND</text>
