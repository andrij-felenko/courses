<line x1="270.0" y1="155.0" x2="330.0" y2="155.0" stroke="#2457d6" stroke-width="2.0"/>
<rect x="330.0" y="115.0" width="60.0" height="50.0" rx="4" fill="#feebc8" stroke="#dd6b20" stroke-width="1.5"/>
<text x="360.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">R_рейки</text>
<text x="250.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">R_вим = R_рейки + 2 · R_дроту (похибка 0.2–0.8 Ом!)</text>
<text x="250.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Зумер пищить при &lt; 50 Ом → хибне КЗ на рейках ядра VCORE (0.5–2 Ом)</text>
<text x="250.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Не здатний відрізнити нормальний опір чипа від металевого замикання</text>
<rect x="480.0" y="65.0" width="480.0" height="210.0" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1.5"/>
<text x="720.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">4-провідна схема Кельвіна (Force + Sense)</text>
