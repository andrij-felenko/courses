<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="630" fill="#ffffff"/>
