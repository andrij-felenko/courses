<text x="730.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пошук місця КЗ методом мілівольтного градієнта</text>
<rect x="520.0" y="350.0" width="420.0" height="110.0" rx="4" fill="#fefcbf" stroke="#d69e2e" stroke-width="2.0"/>
