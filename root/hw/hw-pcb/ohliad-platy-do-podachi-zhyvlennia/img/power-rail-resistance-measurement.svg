<line x1="540.0" y1="390.0" x2="580.0" y2="390.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="545.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">I_вхід = 100 мА</text>
<rect x="800.0" y="380.0" width="20.0" height="30.0" rx="2" fill="#e53e3e" stroke="#9b2c2c" stroke-width="1.5"/>
<text x="810.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Точка КЗ</text>
<text x="810.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">(V_min = 0 мВ)</text>
