<text x="490.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотирипровідне вимірювання за Кельвіном (4-Wire Kelvin) проти звичайного 2-провідного</text>
