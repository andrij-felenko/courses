<text x="45.0" y="481.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Шина живлення DDR3/DDR4/DDR5</text>
<text x="450.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">10 Ом .. 100 Ом</text>
<rect x="35.0" y="495.0" width="430.0" height="50.0" rx="4" fill="#fff5f5" stroke="#feb2b2" stroke-width="1.5"/>
<text x="45.0" y="515.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c53030" text-anchor="start" font-weight="700">VCORE (0.75 В .. 1.05 В)</text>
<text x="45.0" y="533.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Ядро процесора, FPGA Fabric, GPU</text>
<text x="450.0" y="524.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">0.2 Ом .. 5.0 Ом (НЕ КЗ!)</text>
<text x="250.0" y="575.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">⚠ Пряме металеве КЗ: R &lt; 0.05 Ом (дефект пайки / пробитий MLCC)</text>
