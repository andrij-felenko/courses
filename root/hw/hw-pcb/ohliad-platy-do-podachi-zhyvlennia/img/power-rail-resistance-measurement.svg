<circle cx="690.0" cy="390.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="690.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">2.6 мВ</text>
<circle cx="750.0" cy="390.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="750.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">0.9 мВ</text>
<text x="730.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Струм генерує спад напруги V = I · R_міді вздовж доріжки</text>
<text x="730.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Рухаючись чутливим мікровольтметром у бік ЗМЕНШЕННЯ напруги,</text>
<text x="730.0" y="518.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ви точно локалізуєте пробитий MLCC або припоєву перемичку</text>
<text x="730.0" y="540.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">без випоювання десятків паралельних компонентів!</text>
</svg>