<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія та матриця зазорів класів ланцюгів (Net Classes)</text><rect x="35.0" y="58.0" width="410.0" height="72.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="49.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Power / GND (Силові шини)</text><text x="49.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Ширина: 0.8–3.0 мм | Зазор: 0.25–0.4 мм | Via: 0.8/0.4 мм</text><text x="49.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Струмове навантаження, мінімальний опір та падіння напруги</text><rect x="35.0" y="142.0" width="410.0" height="72.0" rx="6" fill="#e0e7ff" stroke="#2457d6" stroke-width="1.5"/><text x="49.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">High-Speed Diff (Швидкісні диференційні)</text><text x="49.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Ширина: 0.15 мм | Зазор у парі: 0.12 мм | Довжина: ΔL &lt; 0.1 мм</text><text x="49.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Контрольований імпеданс (90/100 Ом), захист від фазового перекосу</text><rect x="35.0" y="226.0" width="410.0" height="72.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="49.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Sensitive Analog (Чутливий аналог)</text><text x="49.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Ширина: 0.25 мм | Зазор ізоляції: 0.5–1.0 мм | Guard Ring</text><text x="49.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Мінімізація ємнісних та індуктивних перехресних завад</text><rect x="35.0" y="310.0" width="410.0" height="72.0" rx="6" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.5"/><text x="49.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Standard Digital (Цифрові GPIO/Control)</text><text x="49.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Ширина: 0.20 мм | Зазор: 0.20 мм | Стандартний Via 0.6/0.3 мм</text><text x="49.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Базові правила трасування сигналів низької частоти</text><rect x="470.0" y="58.0" width="375.0" height="324.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="657.5" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця міжосьових зазорів (Clearance Matrix)</text><text x="597.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Power</text><text x="518.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Power</text><text x="661.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Hi-Speed</text><text x="518.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-s