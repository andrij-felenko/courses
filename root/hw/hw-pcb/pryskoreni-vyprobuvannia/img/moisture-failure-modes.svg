<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кліматична деградація: проникнення вологи, HAST та міграція CAF</text>
<text x="420.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">дифузія пари у пластик та ріст провідних мідних містків вздовж скляних волокон FR4</text>
<rect x="40.0" y="80.0" width="350.0" height="370.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="215.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1. Сорбція вологи та тиск пари (HAST)</text>
<rect x="85.0" y="135.0" width="260.0" height="130.0" rx="3" fill="#34495e" stroke="#333333" stroke-width="1.5"/>
<text x="215.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">Епоксидний компаунд (Mold Compound)</text>
<rect x="155.0" y="175.0" width="120.0" height="24.0" rx="1" fill="#7f8c8d" stroke="#95a5a6" stroke-width="1.2"/>
<text x="215.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">Кремній (Silicon Die)</text>
<rect x="140.0" y="201.0" width="150.0" height="10.0" rx="0" fill="#d35400" stroke="none" stroke-width="1.5"/>
<line x1="115.0" y1="122.0" x2="115.0" y2="143.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="165.0" y1="122.0" x2="165.0" y2="143.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="265.0" y1="122.0" x2="265.0" y2="143.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="315.0" y1="122.0" x2="315.0" y2="143.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="215.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Волога (H₂O) під тиском 2.3 атм</text>
<ellipse cx="215.0" cy="221.0" rx="55.0" ry="7.0" fill="#e74c3c" stroke="#c0392b" stroke-width="1.2"/>
<text x="215.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">Парова кишеня (Delamination)</text>
<text x="215.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">При 130 °C та 85% RH волога насичує</text>
<text x="215.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">полімер за 96 год замість 1000 год (85/85).</text>
<text x="215.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">При різкому нагріві пара розриває корпус</text>
<text x="215.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">(ефект попкорну) та руйнує розварку виводів.</text>
<rect x="430.0" y="80.0" width="370.0" height="370.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="615.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2. Анодні містки CAF та міграція міді</text>
<rect x="455.0" y="145.0" width="320.0" height="150.0" rx="3" fill="#27ae60" stroke="#333333" stroke-width="1.5"/>
<rect x="460.0" y="189.0" width="310.0" height="12.0" rx="0" fill="#a9dfbf" stroke="none" stroke-width="1.5"/>
<rect x="460.0" y="234.0" width="310.0" height="12.0" rx="0" fill="#a9dfbf" stroke="none" stroke-width="1.5"/>
<text x="615.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">Скловолокно + епоксидна смола</text>
<rect x="490.0" y="135.0" width="20.0" height="10.0" rx="1" fill="#d35400" stroke="#333333" stroke-width="1.2"/>
<rect x="494.0" y="145.0" width="12.0" height="150.0" rx="0" fill="#d35400" stroke="none" stroke-width="1.5"/>
<rect x="490.0" y="295.0" width="20.0" height="10.0" rx="1" fill="#d35400" stroke="#333333" stroke-width="1.2"/>
<text x="500.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Анод (+)</text>
<text x="500.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Cu → Cu²⁺ + 2e⁻</text>
<rect x="720.0" y="135.0" width="20.0" height="10.0" rx="1" fill="#2980b9" stroke="#333333" stroke-width="1.2"/>
<rect x="724.0" y="145.0" width="12.0" height="150.0" rx="0" fill="#2980b9" stroke="none" stroke-width="1.5"/>
<rect x="720.0" y="295.0" width="20.0" height="10.0" rx="1" fill="#2980b9" stroke="#333333" stroke-width="1.2"/>
<text x="730.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Катод (−)</text>
<text x="730.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Cu²⁺ + 2e⁻ → Cu</text>
<line x1="506.0" y1="195.0" x2="560.0" y2="193.0" stroke="#f39c12" stroke-width="3.0"/>
<line x1="560.0" y1="193.0" x2="620.0" y2="196.0" stroke="#f39c12" stroke-width="3.0"/>
<line x1="620.0" y1="196.0" x2="680.0" y2="194.0" stroke="#f39c12" stroke-width="3.0"/>
<line x1="680.0" y1="194.0" x2="724.0" y2="195.0" stroke="#f39c12" stroke-width="3.0"/>
<text x="615.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#f39c12" text-anchor="middle" font-weight="700">Ріст нитки солей міді (CAF)</text>
<text x="615.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">1. Гідроліз послаблює зв'язок смола-скловолокно.</text>
<text x="615.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">2. Градієнт напруги розчиняє мідь анода.</text>
<text x="615.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">3. Іони Cu²⁺ мігрують по мікрокапілярах.</text>
<text x="615.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">4. Внутрішнє КЗ між шарами живлення.</text>
</svg>