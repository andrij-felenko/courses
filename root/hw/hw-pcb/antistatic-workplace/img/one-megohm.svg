<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410">
<rect width="920" height="410" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3ea8"/></marker>
</defs>
<text x="460.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому всюди 1 МОм: компроміс між стіканням статики й безпекою людини</text>
<text x="460.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">замалий опір — небезпечно для людини; завеликий — статика не встигає стікати; 1 МОм влучає між</text>
<rect x="60.0" y="90.0" width="360.0" height="130.0" rx="12" fill="#fdecea" stroke="#c0271e" stroke-width="1.8"/>
<text x="240.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Якби 0 Ом (пряме заземлення)</text>
<text x="240.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">дотик до фази 230 В → крізь людину</text>
<text x="240.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">I = 230 В / (опір тіла) → десятки мА</text>
<text x="240.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">смертельно небезпечно (з §1.2.13)</text>
<text x="240.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">потрібен послідовний опір!</text>
<rect x="500.0" y="90.0" width="360.0" height="130.0" rx="12" fill="#fff7e6" stroke="#e08030" stroke-width="1.8"/>
<text x="680.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">Якби 1 ГОм (майже ізолятор)</text>
<text x="680.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">стала часу τ = R·C завелика</text>
<text x="680.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">статика стікає надто повільно</text>
<text x="680.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#e08030" text-anchor="middle" font-weight="normal" font-style="normal">заряд встигає накопичитись і стрельнути</text>
<text x="680.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">потрібен НЕзавеликий опір!</text>
<line x1="240.0" y1="222.0" x2="430.0" y2="270.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<line x1="680.0" y1="222.0" x2="490.0" y2="270.0" stroke="#e08030" stroke-width="2.2" marker-end="url(#aOrange)"/>
<rect x="330.0" y="274.0" width="260.0" height="96.0" rx="12" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2.0"/>
<text x="460.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1 МОм — золота середина</text>
<text x="460.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">дотик до 230 В → I ≈ 0.23 мА (безпечно)</text>
<text x="460.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">τ = 1 МОм · 100 пФ = 0.1 мс (стікає швидко)</text>
<text x="460.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">часто це 1 МОм у браслеті + ще 1 МОм у маті</text>
<text x="460.0" y="396.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Той самий резистор 1 МОм виконує дві ролі: повільно знімає заряд і рятує людину при випадковому дотику до напруги.</text>
</svg>
