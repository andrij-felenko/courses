<text x="293.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">L_монтажу ≈ 2.8–3.5 нГн</text>
<rect x="45.0" y="305.0" width="385.0" height="230.0" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1.2"/>
<text x="237.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Фізичний наслідок помилки:</text>
<text x="58.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Струм ВЧ іде через площину в обхід конденсатора;</text>
<text x="58.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Вії утворюють відкритий магнітний контур (високий ESL);</text>
<text x="58.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Відстань між віями &gt; 3 мм послаблює взаємну індуктивність M;</text>
<text x="58.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">4. Просідання напруги на кристалі: ΔV = L·(di/dt) &gt; 250 мВ;</text>
<text x="58.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">5. Високе випромінювання EMI через паразитну рамкову антену.</text>
<text x="237.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Конденсатор фактично відрізаний індуктивністю</text>
