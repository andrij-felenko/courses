<text x="790.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2b8a3e" text-anchor="middle" font-style="italic">Компенсація потоків M</text>
<rect x="510.0" y="305.0" width="385.0" height="230.0" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1.2"/>
<text x="702.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Переваги мінімальної петлі:</text>
<text x="523.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Пін чіпа з'єднано з конденсатором ПЕРЕД виходом у площину;</text>
<text x="523.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Бічні перехідні отвори розміщені на відстані s &lt; 0.6 мм;</text>
<text x="523.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Зустрічні струми створюють взаємну індуктивність M ≈ L;</text>
<text x="523.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">4. Подвійні вії знижують індуктивність паралельно (L_via / 2);</text>
<text x="523.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">5. Просідання напруги мінімальне: ΔV &lt; 35 мВ (у межах норми).</text>
<text x="702.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Струм миттєво береться з локального конденсатора</text>
