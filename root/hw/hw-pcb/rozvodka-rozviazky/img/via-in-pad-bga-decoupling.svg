<text x="470.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ced4da" text-anchor="middle">Кристал кремнію, підкладка та внутрішні перерозподільні шари (RDL)</text>
