<text x="340.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">h = 1.2 мм, L &lt; 0.4 нГн</text>
<rect x="100.0" y="445.0" width="740.0" height="120.0" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1.2"/>
<text x="470.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому монтаж під BGA на Bottom шарі перемагає бічне розміщення на Top:</text>
<text x="120.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Відсутність горизонтальних доріжок Top-шару: струм іде прямо вниз через короткий стовбур вії;</text>
<text x="120.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Кульки VDD і GND розміщені на сусідніх позиціях матриці BGA (pitch 0.8 мм або 0.5 мм);</text>
<text x="120.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Зустрічні струми у сусідніх віях компенсують магнітні поля, знижуючи ефективну індуктивність;</text>
<text x="120.0" y="546.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Технологія VIPPO (Via-in-Pad Plated Over) усуває 'собачі кістки' (dog-bones) та паразити розводки.</text>
