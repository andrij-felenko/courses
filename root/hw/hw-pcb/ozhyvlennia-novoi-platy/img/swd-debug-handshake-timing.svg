<text x="490.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#854d0e" text-anchor="middle" font-weight="700">2. JTAG-to-SWD Switch (16 біт)</text>
<text x="490.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="middle">0x79E7 (MSB-first: 0111_1001_1110_0111)</text>
<text x="490.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Перемикання внутрішнього селектора</text>
<line x1="639.0" y1="124.0" x2="659.0" y2="124.0" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#arrow)"/>
