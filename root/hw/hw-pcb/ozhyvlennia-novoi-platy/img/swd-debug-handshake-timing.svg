<text x="490.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія налагоджувального протоколу SWD: послідовність читання DP-IDCODE</text>
<rect x="25.0" y="50.0" width="930.0" height="135.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="40.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Фаза 1: Скидання шини та перемикання з JTAG на SWD</text>
<rect x="45.0" y="86.0" width="270.0" height="76.0" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="180.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">1. SWD Line Reset</text>
<text x="180.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="middle">≥ 50 тактів SWCLK при SWDIO = '1'</text>
<text x="180.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Гарантоване скидання автомату DP</text>
