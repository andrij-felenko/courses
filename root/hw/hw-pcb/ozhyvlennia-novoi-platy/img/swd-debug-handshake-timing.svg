<text x="800.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="middle">≥ 50 тактів '1' + ≥ 2 тактів '0' (Idle)</text>
