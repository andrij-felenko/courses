<text x="55.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="start">Таймінги шини: Setup Time t_su ≥ 4 нс, Hold Time t_h ≥ 4 нс відносно зростаючого фронту SWCLK. Частота: 100 кГц–10 МГц.</text>
