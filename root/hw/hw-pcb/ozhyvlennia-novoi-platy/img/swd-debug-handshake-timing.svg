<text x="45.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9a3412" text-anchor="start" font-weight="700">• Немає відповіді (ACK Timeout / 0x00 / 0xFF):</text>
<text x="340.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="start">Перевірити напругу VDD, наявність підтяжки SWDIO до VDD (10–100 кОм), підтяжки SWCLK до GND (10–100 кОм)</text>
<text x="45.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9a3412" text-anchor="start" font-weight="700">• Помилка FAULT / WAIT у полі ACK:</text>
<text x="340.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="start">Ядро заблоковано в глибокому сні (WFI/WFE) або PLL не залочений → Використати режим Connect-Under-Reset</text>
<text x="45.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9a3412" text-anchor="start" font-weight="700">• Помилка Parity Error під час читання:</text>
<text x="340.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="start">Занадто довгий шлейф, паразитна ємність лінії (&gt;30 пФ) або дзвін → Знизити тактову частоту адаптера до 500 кГц</text>
