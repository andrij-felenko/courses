<text x="720.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Виділяється струмопровідний</tspan><tspan x="720.0" dy="13.0">вуглець; незворотне КЗ діелектрика</tspan></text>
<rect x="160.4" y="422.5" width="519.3" height="35.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="420.0" y="437.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">CTI (Comparative Tracking Index) визначає стійкість смоли до мікродуг.</tspan><tspan x="420.0" dy="13.0">FR-4 (Group IIIa, CTI 175...250 В) схильний до швидкого обвуглення у вологому середовищі.</tspan></text>
