<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360">
<rect width="860" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="430.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">З гальванометра — амперметр, вольтметр, омметр</text>
<text x="430.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">той самий чутливий механізм + проста добавка = три прилади (а разом — мультиметр)</text>
<text x="160.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Амперметр</text>
<circle cx="160.0" cy="150.0" r="20.0" fill="#fff" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="160.0" y="155.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.0" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">G</text>
<line x1="110.0" y1="150.0" x2="140.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="180.0" y1="150.0" x2="210.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="110.0" y1="150.0" x2="110.0" y2="200.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="210.0" y1="150.0" x2="210.0" y2="200.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<rect x="135.0" y="192.0" width="50.0" height="16.0" rx="3" fill="#d7d2c4" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="160.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+ ШУНТ (малий R, ∥)</text>
<text x="160.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">для великих струмів (§4.7)</text>
<text x="430.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Вольтметр</text>
<line x1="360.0" y1="150.0" x2="390.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<rect x="390.0" y="143.0" width="50.0" height="14.0" rx="3" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<line x1="440.0" y1="150.0" x2="470.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<circle cx="495.0" cy="150.0" r="20.0" fill="#fff" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="495.0" y="155.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.0" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">G</text>
<line x1="515.0" y1="150.0" x2="545.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="430.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">+ дод. R (великий, послід.)</text>
<text x="430.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">V = I·R: міряє напругу</text>
<text x="710.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Омметр</text>
<circle cx="680.0" cy="150.0" r="20.0" fill="#fff" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="680.0" y="155.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.0" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">G</text>
<line x1="700.0" y1="150.0" x2="730.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="739.0" y1="142.0" x2="771.0" y2="142.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<line x1="746.0" y1="158.0" x2="764.0" y2="158.0" stroke="#1b1b1b" stroke-width="5" stroke-linecap="round"/>
<line x1="660.0" y1="150.0" x2="660.0" y2="190.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="755.0" y1="162.0" x2="755.0" y2="190.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="660.0" y1="190.0" x2="755.0" y2="190.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<circle cx="660.0" cy="150.0" r="4.0" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<text x="710.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">+ батарея + відомий R</text>
<text x="710.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">міряє опір (за струмом)</text>
<rect x="180.0" y="286.0" width="500.0" height="50.0" rx="10" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="430.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Три прилади в одному корпусі — це МУЛЬТИМЕТР (колись «AVO»: Ampere–Volt–Ohm).</text>
<text x="430.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Едвард Вестон зробив такі прилади точними й портативними (кінець 1880-х).</text>
</svg>
