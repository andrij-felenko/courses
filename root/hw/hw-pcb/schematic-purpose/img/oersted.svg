<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360">
<rect width="820" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Іскра всього: струм відхиляє магнітну стрілку (Ерстед, 1820)</text>
<text x="410.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">виявилось, що електрика й магнетизм пов'язані — і це дало спосіб «побачити» струм</text>
<text x="210.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">Без струму</text>
<line x1="110.0" y1="130.0" x2="310.0" y2="130.0" stroke="#9aa7b4" stroke-width="4" stroke-linecap="round"/>
<text x="330.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">дріт</text>
<circle cx="210.0" cy="210.0" r="46.0" fill="#f6f8fc" stroke="#8a8a8a" stroke-width="1.6"/>
<polygon points="210.0,168.0 218.0,210.0 210.0,252.0 202.0,210.0" fill="#bcbcbc" stroke="none" stroke-width="0"/>
<polygon points="210.0,168.0 218.0,210.0 210.0,210.0" fill="#c0271e" stroke="none" stroke-width="0"/>
<text x="210.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">стрілка вздовж (Пн–Пд)</text>
<text x="620.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Зі струмом</text>
<line x1="520.0" y1="130.0" x2="720.0" y2="130.0" stroke="#9aa7b4" stroke-width="4" stroke-linecap="round"/>
<line x1="580.0" y1="130.0" x2="660.0" y2="130.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<text x="620.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="italic">I</text>
<circle cx="620.0" cy="210.0" r="46.0" fill="#fdecea" stroke="#c0271e" stroke-width="1.6"/>
<polygon points="578.0,210.0 620.0,202.0 662.0,210.0 620.0,218.0" fill="#bcbcbc" stroke="none" stroke-width="0"/>
<polygon points="578.0,210.0 620.0,202.0 620.0,210.0" fill="#c0271e" stroke="none" stroke-width="0"/>
<text x="620.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">стрілка повертається ПОПЕРЕК</text>
<rect x="140.0" y="300.0" width="540.0" height="44.0" rx="10" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="410.0" y="327.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що більший струм — то сильніше відхилення. Ось він, перший спосіб ВИМІРЯТИ струм.</text>
</svg>
