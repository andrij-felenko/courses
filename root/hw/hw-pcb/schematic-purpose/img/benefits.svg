<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320">
<rect width="820" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому інженери говорять схемами</text>
<text x="410.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">принципова схема — універсальна мова електроніки</text>
<rect x="50.0" y="90.0" width="220.0" height="90.0" rx="12" fill="#f6f8fc" stroke="#1f47b5" stroke-width="1.8"/>
<text x="160.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Універсальна</text>
<text x="160.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">будь-який інженер світу її прочитає</text>
<rect x="300.0" y="90.0" width="220.0" height="90.0" rx="12" fill="#f6f8fc" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="410.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Стисла</text>
<text x="410.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ціла плата — на одному аркуші</text>
<rect x="550.0" y="90.0" width="220.0" height="90.0" rx="12" fill="#f6f8fc" stroke="#e08030" stroke-width="1.8"/>
<text x="660.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">Розкриває суть</text>
<text x="660.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">видно ФУНКЦІЮ, а не купу дротів</text>
<rect x="175.0" y="196.0" width="220.0" height="90.0" rx="12" fill="#f6f8fc" stroke="#c0271e" stroke-width="1.8"/>
<text x="285.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Зручна спільно</text>
<text x="285.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">легко ділитися, аналізувати, шукати помилку</text>
<rect x="425.0" y="196.0" width="220.0" height="90.0" rx="12" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="535.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Готова до аналізу</text>
<text x="535.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">вузли й контури — як у Розділах 4–5</text>
</svg>
