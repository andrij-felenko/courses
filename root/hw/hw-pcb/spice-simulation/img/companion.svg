<text x="175.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">i = C · dv/dt</tspan></text>
