<rect x="61.9" y="273.4" width="656.1" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="293.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Замінивши dv/dt різницею, конденсатор на кожному кроці стає звичайною провідністю Geq = 2C/Δt</tspan><tspan x="390.0" dy="15.6">паралельно з джерелом струму Ieq, що ПАМ'ЯТАЄ минулий крок. Тепер він — лінійний елемент і</tspan><tspan x="390.0" dy="15.6">вкладається в ту саму матрицю, що резистори; час рахується тим самим апаратом Ньютона.</tspan></text>
