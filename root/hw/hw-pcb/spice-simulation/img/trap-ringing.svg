<rect x="38.0" y="334.4" width="704.0" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="354.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">На різкому перепаді трапеція дає числовий дзвін — паразитне коливання, що міняє знак щокроку</tspan><tspan x="390.0" dy="15.6">й повільно згасає; це артефакт методу, не схеми. Гір такого не має, але демпфує будь-яке</tspan><tspan x="390.0" dy="15.6">коливання — і легко «згладить» справжню нестійкість, показавши робочою схему, що насправді дзвенить.</tspan></text>
