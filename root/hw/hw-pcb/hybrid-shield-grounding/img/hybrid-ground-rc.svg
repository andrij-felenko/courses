<text x="712.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трансивер інтерфейсу</text>
<text x="712.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(RS-485 / CAN / Ethernet / ADC)</text>
<rect x="625.0" y="183.0" width="175.0" height="40.0" rx="3" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.0"/>
<text x="712.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2b6cb0" text-anchor="middle" font-weight="700">TVS-діоди ліній на SGND</text>
<text x="712.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Гальванічна розв'язка (Opto/ISO)</text>
<rect x="610.0" y="255.0" width="205.0" height="195.0" rx="4" fill="#dcffe4" stroke="#68d391" stroke-width="1.2"/>
<text x="712.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#22543d" text-anchor="middle" font-weight="700">Суцільний шар SGND</text>
<text x="712.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#276749" text-anchor="middle">Чистий опорний потенціал</text>
<text x="712.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">для цифрових та аналогових вузлів</text>
<text x="712.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Ізольований від корпусу на DC,</text>
<text x="712.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">зв'язаний на ВЧ через RC-вузол</text>
