<text x="160.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2d3748" text-anchor="middle" font-weight="700">МЕТАЛЕВЕ ШАСІ / КОРПУС</text>
<text x="160.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Захисне заземлення (Chassis / PE)</text>
