<circle cx="220.0" cy="325.0" r="6.0" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
<text x="220.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">GND-гвинт</text>
<rect x="295.0" y="65.0" width="275.0" height="415.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="432.5" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ГІБРИДНИЙ БАР'ЄР (RC + SURGE)</text>
<text x="432.5" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Зазор ізоляції: Clearance ≥ 3.0 мм</text>
<rect x="310.0" y="125.0" width="245.0" height="75.0" rx="4" fill="#f0f7ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="432.5" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">C_rf: 10 нФ / 1 кВ – 3 кВ (X7R / C0G)</text>
<text x="432.5" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Низький імпеданс для ВЧ струмів (&gt; 1 МГц)</text>
<text x="432.5" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• ESL &lt; 1.5 нГн (корпус 1206 / 1812)</text>
<text x="432.5" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">• Ізолює постійний струм і 50 Гц гул</text>
<rect x="310.0" y="210.0" width="245.0" height="75.0" rx="4" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.2"/>
<text x="432.5" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c05621" text-anchor="middle" font-weight="700">R_bleed: 1 МОм / 0.5 Вт (High Voltage)</text>
<text x="432.5" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Скидає трибоелектричний заряд (ESD)</text>
<text x="432.5" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Запобігає накопиченню статичного потенціалу</text>
<text x="432.5" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">• Опір занадто великий для струму 50 Гц</text>
<rect x="310.0" y="295.0" width="245.0" height="75.0" rx="4" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.2"/>
<text x="432.5" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">GDT / Варистор (Surge Protection)</text>
<text x="432.5" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Газорозрядник 75 В / 90 В або TVS</text>
<text x="432.5" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Захист конденсатора від пробою сплеском</text>
<text x="432.5" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">• Шунтує енергію блискавки в корпус</text>
<rect x="310.0" y="380.0" width="245.0" height="50.0" rx="4" fill="#f7fafc" stroke="#718096" stroke-width="1.0"/>
<text x="432.5" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="middle" font-weight="700">PCB Spark Gap (Іскровий проміжок)</text>
<text x="432.5" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Зазор 0.3–0.5 мм (резервний пробій при &gt;2 кВ)</text>
<rect x="590.0" y="65.0" width="245.0" height="415.0" rx="6" fill="#f0fff4" stroke="#27ae60" stroke-width="1.5"/>
<text x="712.5" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ВНУТРІШНЯ СХЕМА ТА SGND</text>
<text x="712.5" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Сигнальна земля (Signal Ground)</text>
