<text x="160.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a202c" text-anchor="middle" font-weight="700">Круговий 360° контакт екрана</text>
<text x="160.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Ніяких тонких «хвостиків» (Pigtails)!</text>
<rect x="60.0" y="240.0" width="200.0" height="215.0" rx="4" fill="#e2e8f0" stroke="#a0aec0" stroke-width="1.2"/>
<text x="160.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#4a5568" text-anchor="middle" font-weight="700">Полігон шасі (Chassis Plane)</text>
<text x="160.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Гвинти кріплення до корпусу</text>
