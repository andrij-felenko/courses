<text x="380.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Дендритний місток замикає зазор → спалах КЗ та вигоряння доріжок</text>
<rect x="104.3" y="325.0" width="591.4" height="20.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="400.0" y="338.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Конформне покриття ізолює провідники від вологи й солей, унеможливлюючи утворення рідкого електроліту.</tspan></text>
