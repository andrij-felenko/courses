<rect x="581.3" y="89.5" width="137.4" height="61.0" rx="6" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/><text x="650.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">3. Відновлення металу:</tspan><tspan x="650.0" dy="13.0">Cu²⁺ + 2e⁻ → Cu⁰</tspan><tspan x="650.0" dy="13.0">Sn²⁺ + 2e⁻ → Sn⁰</tspan><tspan x="650.0" dy="13.0">Ріст дендрита до анода</tspan></text>
