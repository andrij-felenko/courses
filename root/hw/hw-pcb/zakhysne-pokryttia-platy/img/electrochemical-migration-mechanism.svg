<rect x="78.5" y="89.5" width="143.1" height="61.0" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/><text x="150.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">1. Анодне розчинення:</tspan><tspan x="150.0" dy="13.0">Cu → Cu²⁺ + 2e⁻</tspan><tspan x="150.0" dy="13.0">Sn → Sn²⁺ + 2e⁻</tspan><tspan x="150.0" dy="13.0">Метал переходить в іони</tspan></text>
