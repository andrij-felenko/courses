<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Термобар'єр (Thermal Relief) проти суцільного підключення (Direct Connect)</text>
<rect x="40.0" y="56.0" width="360.0" height="355.0" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.2"/>
<text x="220.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Термобар'єр (Thermal Relief)</text>
<rect x="65.0" y="102.0" width="310.0" height="150.0" rx="4" fill="#fdebd0" stroke="#e67e22" stroke-width="1.4"/>
<circle cx="220.0" cy="177.0" r="54.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="166.0" y="170.0" width="108.0" height="14.0" rx="0" fill="#fdebd0" stroke="#e67e22" stroke-width="1.0"/>
<rect x="213.0" y="123.0" width="14.0" height="108.0" rx="0" fill="#fdebd0" stroke="#e67e22" stroke-width="1.0"/>
<circle cx="220.0" cy="177.0" r="28.0" fill="#d35400" stroke="#a04000" stroke-width="1.5"/>
<circle cx="220.0" cy="177.0" r="12.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0.5"/>
<text x="220.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">4 тонкі спиці (0.3–0.5 мм)</text>
<line x1="80.0" y1="177.0" x2="145.0" y2="177.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="360.0" y1="177.0" x2="295.0" y2="177.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="54.0" y="266.0" width="332.0" height="130.0" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="64.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Плюси:</text>
<text x="108.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Легка пайка ручним паяльником та в печі</text>
<text x="64.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Захист:</text>
<text x="108.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Усуває дефект «надгробка» (tombstoning)</text>
<text x="64.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Мінуси під великим струмом:</text>
<text x="64.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Вузьке горло: 4 спиці × 0.3 мм = 1.2 мм перерізу</text>
<text x="64.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Локальний перегрів спиць при струмі &gt; 5–8 А!</text>
<rect x="420.0" y="56.0" width="380.0" height="355.0" rx="6" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.2"/>
<text x="610.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Суцільне підключення (Direct Connect)</text>
<rect x="445.0" y="102.0" width="330.0" height="150.0" rx="4" fill="#fdebd0" stroke="#e67e22" stroke-width="1.4"/>
<circle cx="610.0" cy="177.0" r="38.0" fill="#d35400" stroke="#a04000" stroke-width="2.0"/>
<circle cx="610.0" cy="177.0" r="12.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="0.5"/>
<text x="610.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#a04000" text-anchor="middle" font-weight="700">Повний контакт 360°</text>
<line x1="470.0" y1="177.0" x2="540.0" y2="177.0" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="750.0" y1="177.0" x2="680.0" y2="177.0" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="610.0" y1="106.0" x2="610.0" y2="134.0" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="610.0" y1="246.0" x2="610.0" y2="218.0" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="434.0" y="266.0" width="352.0" height="130.0" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="444.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Плюси для сили:</text>
<text x="444.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Нульовий додатковий опір шини (R ≈ 0)</text>
<text x="444.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• Максимальний струм 20–50+ А без перегріву</text>
<text x="444.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Вимоги до монтажу:</text>
<text x="444.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Потрібен нижній підігрів (Preheater) або потужне жало</text>
</svg>