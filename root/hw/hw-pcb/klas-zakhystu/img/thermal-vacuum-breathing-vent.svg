<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="850.0" height="410.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.5"/>
<text x="440.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Термічне вакуумування та мембранне вирівнювання тиску (ePTFE Vent)</text>
<rect x="45.0" y="70.0" width="370.0" height="340.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="45.0" y="70.0" width="370.0" height="30.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="230.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Глухий корпус: термічна помпа (Vacuum Ingress)</text>
<rect x="75.0" y="120.0" width="310.0" height="160.0" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="2.0"/>
<text x="230.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Охолодження: 65 °C → 10 °C (дощ)</text>
<text x="230.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Розрідження ΔP = -16.5 кПа (-165 мбар)</text>
<rect x="75.0" y="230.0" width="10.0" height="30.0" rx="6" fill="#fca5a5" stroke="#c0392b" stroke-width="1.5"/>
<line x1="40.0" y1="245.0" x2="90.0" y2="245.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="145.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Вода засмоктується</text>
<circle cx="200.0" cy="260.0" r="5.0" fill="#38bdf8" stroke="#2457d6" stroke-width="1.0"/>
<circle cx="230.0" cy="265.0" r="7.0" fill="#38bdf8" stroke="#2457d6" stroke-width="1.0"/>
<circle cx="260.0" cy="260.0" r="4.0" fill="#38bdf8" stroke="#2457d6" stroke-width="1.0"/>
<text x="230.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Наслідки без клапана вирівнювання:</text>
<text x="230.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Всмоктування вологи через мікропори</text>
<text x="230.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Конденсація на холодній платі (точка роси)</text>
<text x="230.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">• Електрохімічна корозія та дендрити</text>
<rect x="455.0" y="70.0" width="380.0" height="340.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="455.0" y="70.0" width="380.0" height="30.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
<text x="645.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Корпус із мембраною ePTFE (Gore Vent)</text>
<path d="M 485 140 L 575 140 L 575 120 L 715 120 L 715 140 L 805 140 L 805 285 L 485 285 Z" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<rect x="580.0" y="122.0" width="130.0" height="12.0" rx="2" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
<text x="645.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle" font-weight="700">Мембрана ePTFE</text>
<line x1="620.0" y1="106.0" x2="620.0" y2="148.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="670.0" y1="148.0" x2="670.0" y2="106.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="645.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Вільний газообмін: N₂, O₂, пара (ΔP ≈ 0)</text>
<circle cx="595.0" cy="108.0" r="6.0" fill="#38bdf8" stroke="#2457d6" stroke-width="1.5"/>
<circle cx="695.0" cy="108.0" r="7.0" fill="#38bdf8" stroke="#2457d6" stroke-width="1.5"/>
<text x="595.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">H₂O</text>
<text x="695.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Крапля</text>
<text x="645.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Внутрішній тиск = зовнішньому</text>
<text x="645.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Пори 0.1–1.0 мкм: газ проходить, вода ні</text>
<text x="645.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Гідрофобність (кут &gt; 110°), WEP &gt; 100 кПа</text>
<text x="645.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Переваги захисної вентиляції:</text>
<text x="645.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Немає вакууму → ущільнення не навантажені</text>
<text x="645.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Волога не накопичується, пара виходить</text>
<text x="645.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">• Збереження IP67 / IP68 / IP69K</text>
</svg>