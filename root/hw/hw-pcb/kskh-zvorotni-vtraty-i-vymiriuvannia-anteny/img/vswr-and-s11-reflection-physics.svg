<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хвильовий процес у неузгодженому тракті: відбиття, КСХ та зворотні втрати</text>
<rect x="40.0" y="80.0" width="120.0" height="60.0" rx="5" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.5"/>
<text x="100.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ВЧ-генератор</text>
<text x="100.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Z_src = 50 Ω</text>
<line x1="160.0" y1="95.0" x2="640.0" y2="95.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="160.0" y1="125.0" x2="640.0" y2="125.0" stroke="#444a52" stroke-width="2.0"/>
<text x="400.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сигнальний провідник / Мікросмужка (Z₀ = 50 Ω)</text>
<text x="400.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Опорна земля (Ground Plane)</text>
<rect x="640.0" y="80.0" width="140.0" height="60.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="710.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Антена (Z_L ≠ Z₀)</text>
<text x="710.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Z_L = R_A + jX_A</text>
<line x1="210.0" y1="103.0" x2="350.0" y2="103.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="280.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Падаюча хвиля V⁺</text>
<line x1="590.0" y1="117.0" x2="450.0" y2="117.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="520.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Відбита хвиля V⁻ = Γ · V⁺</text>
<rect x="547.0" y="36.5" width="165.9" height="35.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="630.0" y="51.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Межа розділу (Порт антени)</tspan><tspan x="630.0" dy="13.0">Γ = (Z_L − Z₀) / (Z_L + Z₀)</tspan></text>
<text x="420.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл амплітуди напруги вздовж лінії передачі: утворення стоячої хвилі</text>
