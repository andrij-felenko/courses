<text x="417.5" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">RL = −20 log₁₀|Γ| [дБ] = −|S₁₁| [дБ]</text>
<rect x="555.0" y="420.0" width="235.0" height="50.0" rx="5" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
