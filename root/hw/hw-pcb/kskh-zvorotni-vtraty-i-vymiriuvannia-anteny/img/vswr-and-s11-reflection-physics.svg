<text x="672.5" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">P_load / P_inc = 1 − |Γ|² = 1 − 10^(−RL/10)</text>
