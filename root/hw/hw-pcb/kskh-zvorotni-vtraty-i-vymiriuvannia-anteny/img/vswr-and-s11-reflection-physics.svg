<text x="162.5" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">VSWR = V_max / V_min = (1 + |Γ|) / (1 − |Γ|)</text>
<rect x="300.0" y="420.0" width="235.0" height="50.0" rx="5" fill="#fdfefe" stroke="#1a1a1a" stroke-width="1.2"/>
