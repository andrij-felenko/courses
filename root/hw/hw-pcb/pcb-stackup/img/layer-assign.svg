<text x="290.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">СУЦІЛЬНА площина — опора для всіх сигналів</text>
