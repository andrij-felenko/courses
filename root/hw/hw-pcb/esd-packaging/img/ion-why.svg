<text x="460.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дріт осушує лише провідник. Ізолятор нейтралізує лише повітря</text>
<text x="460.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">заряд на пластику сидить там, де осів, і по дроту нікуди не стікає — потрібні іони з повітря</text>
<rect x="40.0" y="80.0" width="411.0" height="350.0" rx="10" fill="#eef1f4" stroke="#c0392b" stroke-width="1.8"/>
<text x="245.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Спроба: заземлити ізолятор дротом — НЕ працює</tspan></text>
