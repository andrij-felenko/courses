<text x="290.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c2d12" text-anchor="middle" font-weight="700">Мідна підкладка кристала (Die Paddle)</text>
<rect x="180.0" y="212.0" width="220.0" height="8.0" rx="1" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.0"/>
<rect x="180.0" y="155.0" width="220.0" height="57.0" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
<text x="290.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">Кремнієвий кристал (Silicon Die)</text>
<path d="M 200 155 Q 140 120 105 180" fill="none" stroke="#eab308" stroke-width="2.5" />
<path d="M 380 155 Q 425 125 455 145" fill="none" stroke="#eab308" stroke-width="2.5" stroke-dasharray="3,3" />
<text x="450.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Зрив зварки!</text>
<rect x="160.0" y="236.0" width="260.0" height="22.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2.0"/>
<text x="290.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Тиск пари P &gt; 4.7 МПа (47 атм) при 260 °C</text>
<path d="M 420 245 L 460 260 L 495 280" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
<text x="505.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Тріщина компаунда</text>
<text x="493.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">(вихід пари назовні)</text>
<path d="M 330 212 L 350 180 L 340 155" fill="none" stroke="#c0392b" stroke-width="2" />
<text x="340.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Тріщина кристала</text>
<rect x="575.0" y="75.0" width="235.0" height="315.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="692.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">Послідовність руйнування</text>
<text x="585.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">1. Дифузія вологи:</text>
<text x="585.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">Поглинання H2O компаундом</text>
<text x="585.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">під час зберігання у цеху.</text>
<text x="585.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">2. Нагрів у печі (до 260 °C):</text>
<text x="585.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">Волога миттєво закипає,</text>
<text x="585.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">P_sat зростає до 4.7+ МПа.</text>
<text x="585.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">3. Відшарування (Delam):</text>
<text x="585.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">Пара відриває компаунд від</text>
<text x="585.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">мідного флага кристала.</text>
<text x="585.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">4. Вибух (Popcorn):</text>
<text x="585.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">Купол розриває компаунд,</text>
<text x="585.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">рве розварки та кремній.</text>
<rect x="91.7" y="328.6" width="196.7" height="32.7" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="190.0" y="342.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Волога накопичується на гідрофільних</tspan><tspan x="190.0" dy="11.7">межах метал-полімер і Si-полімер</tspan></text>
