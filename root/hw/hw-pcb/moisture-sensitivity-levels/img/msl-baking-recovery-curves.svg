<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="810.0" height="390.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="420.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Кінетика сушіння (Baking) та правило відновлення Floor Life</text>
<rect x="30.0" y="65.0" width="380.0" height="325.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="220.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">Десорбція вологи з корпусу (t = 1.4 мм)</text>
<line x1="75.0" y1="330.0" x2="385.0" y2="330.0" stroke="#333333" stroke-width="1.5"/>
<line x1="75.0" y1="330.0" x2="75.0" y2="120.0" stroke="#333333" stroke-width="1.5"/>
<text x="370.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="700">Час сушіння</text>
<text x="67.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="end" font-weight="700">C(H2O), %</text>
<text x="69.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="end">0.4%</text>
<text x="69.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="end">0.2%</text>
<text x="69.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="end" font-weight="700">0.1%</text>
<line x1="75.0" y1="285.0" x2="385.0" y2="285.0" stroke="#fca5a5" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="375.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="end" font-weight="700">C_crit (безпечний поріг)</text>
<path d="M 75 150 Q 105 270 140 285 T 200 290" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<text x="145.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">125 °C (8–24 год)</text>
<path d="M 75 150 Q 135 230 220 285 T 320 290" fill="none" stroke="#d97706" stroke-width="2.2"/>
<text x="230.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle" font-weight="700">90 °C (2–3 доби)</text>
<path d="M 75 150 Q 175 190 280 240 T 375 285" fill="none" stroke="#2563eb" stroke-width="2.2"/>
<text x="315.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2563eb" text-anchor="middle" font-weight="700">40 °C (8–15 діб)</text>
<text x="220.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">125 °C — для термостійких лотків (JEDEC Tray)</text>
<rect x="425.0" y="65.0" width="385.0" height="325.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="615.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">Зберігання у сухій шафі та правило 5x</text>
<rect x="440.0" y="115.0" width="150.0" height="50.0" rx="4" fill="#fee2e2" stroke="#f87171" stroke-width="1.2"/>
<text x="515.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Експозиція в цеху</text>
<text x="515.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">t_exp ≤ 12 год</text>
<line x1="595.0" y1="140.0" x2="635.0" y2="140.0" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="640.0" y="115.0" width="155.0" height="50.0" rx="4" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.2"/>
<text x="717.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="700">Суха шафа RH &lt; 5%</text>
<text x="717.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">t_dry = 5 × t_exp</text>
<rect x="440.0" y="185.0" width="355.0" height="45.0" rx="4" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.2"/>
<text x="617.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Повний скид лічильника: Floor Life = 100%</text>
<text x="617.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle">без теплового навантаження та окиснення виводів</text>
<rect x="440.0" y="245.0" width="355.0" height="130.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="617.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">Технологічні обмеження сушіння</text>
<text x="441.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start" font-weight="700">• Стрічка на котушці (Tape &amp; Reel):</text>
<text x="618.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">лише 40 °C (пластик плавиться при &gt;55 °C)</text>
<text x="448.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start" font-weight="700">• Сумарне сушіння при 125 °C:</text>
<text x="618.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">макс. 96 год (ріст інтерметалідів)</text>
<text x="448.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start" font-weight="700">• Суха шафа RH &lt; 10%:</text>
<text x="618.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">зупиняє лічильник, але НЕ скидає (пауза)</text>
<text x="448.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="start" font-weight="700">• Суха шафа RH &lt; 5%:</text>
<text x="618.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">скидає лічильник за правилом 5x часу</text>
</svg>