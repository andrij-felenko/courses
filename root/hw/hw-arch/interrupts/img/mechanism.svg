<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380">
<rect width="920" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Механізм: відірватися, обробити, повернутися</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">процесор запам'ятовує, де спинився, виконує обробник і вертається точно туди ж</text>
<text x="70.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">основна програма</text>
<line x1="70.0" y1="150.0" x2="360.0" y2="150.0" stroke="#1f47b5" stroke-width="2.6" marker-end="url(#aBlue)"/>
<circle cx="360.0" cy="150.0" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="360.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">↯ сигнал від пристрою</text>
<line x1="360.0" y1="150.0" x2="360.0" y2="210.0" stroke="#1b1b1b" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round"/>
<text x="372.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">зберегти, де спинилися (контекст)</text>
<rect x="300.0" y="210.0" width="320.0" height="60.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="460.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">обробник переривання (ISR)</text>
<text x="460.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">коротко зробити те, що треба</text>
<line x1="620.0" y1="240.0" x2="700.0" y2="240.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="700.0" y1="240.0" x2="700.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" stroke-dasharray="4,3" stroke-linecap="round"/>
<text x="712.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">відновити контекст</text>
<line x1="700.0" y1="150.0" x2="880.0" y2="150.0" stroke="#1f47b5" stroke-width="2.6" marker-end="url(#aBlue)"/>
<text x="790.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">далі, мов нічого не було</text>
<rect x="150.0" y="320.0" width="620.0" height="44.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="460.0" y="339.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ключ — зберегти й відновити «де я був»: інакше процесор забув би думку.</text>
<text x="460.0" y="357.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">У 1103A перехід вів у фіксовану комірку 2; DYSEAC перемикав другий лічильник команд.</text>
</svg>
