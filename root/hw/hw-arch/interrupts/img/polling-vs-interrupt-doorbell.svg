<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430">
<rect width="920" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві стратегії: опитувати самому чи чекати «дзвоника»</text>
<text x="460.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">стара ідея — раз у раз перепитувати; нова — дозволити пристрою покликати самому</text>
<rect x="40.0" y="84.0" width="400.0" height="320.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="240.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Опитування (polling)</text>
<rect x="90.0" y="150.0" width="130.0" height="60.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="155.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">процесор</text>
<rect x="300.0" y="150.0" width="110.0" height="60.0" rx="8" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="355.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">пристрій</text>
<text x="355.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(повільний)</text>
<line x1="220.0" y1="168.0" x2="300.0" y2="168.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="260.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">«готово?»</text>
<line x1="300.0" y1="192.0" x2="220.0" y2="192.0" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#aGrey)"/>
<text x="260.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">«ще ні»</text>
<path d="M 120 220 q -40 40 30 60 q 70 18 70 -30" fill="none" stroke="#c0271e" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#aRed)"/>
<text x="170.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">крутиться в циклі</text>
<text x="240.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">і марнує весь час на перепитування,</text>
<text x="240.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">навіть коли нічого не відбувається</text>
<text x="240.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">= як бігати до дверей щохвилини</text>
<rect x="480.0" y="84.0" width="400.0" height="320.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="680.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Переривання (interrupt)</text>
<rect x="530.0" y="150.0" width="130.0" height="60.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="595.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">процесор</text>
<text x="595.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">робить СВОЮ роботу</text>
<rect x="740.0" y="150.0" width="110.0" height="60.0" rx="8" fill="#fbfcff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="795.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">пристрій</text>
<text x="795.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(сам кличе)</text>
<line x1="740.0" y1="240.0" x2="660.0" y2="240.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<text x="700.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">↯ «дзвоник!»</text>
<text x="680.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">процесор кидає все ТІЛЬКИ коли є подія,</text>
<text x="680.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">обробляє її й вертається до роботи</text>
<text x="680.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">= як почути дзвоник у двері</text>
<text x="680.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">— реагуєш умить, не марнуєш часу</text>
</svg>
