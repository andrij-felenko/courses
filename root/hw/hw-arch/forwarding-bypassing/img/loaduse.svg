<text x="420.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">АЛП хоче R3 на вході в т4, а пам'ять віддає його лише в кінці т4 — назад у часі знову не можна.</text>
<text x="420.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Тому load-use коштує рівно одну бульбашку, яку проброс прибрати не може: він скорочує затримку, не скасовує її.</text>
<text x="420.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Практичний висновок: не став команду, що читає завантажене значення, одразу за завантаженням.</text>
