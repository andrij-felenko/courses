<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">DDR цілиться в пропускну здатність, LPDDR — в енергію на біт</text>
<text x="215.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">DDR — настільна / серверна</text>
<rect x="70.0" y="86.0" width="290.0" height="300.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="215.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Головна мета — МАКСИМУМ пропускної здатності.</tspan><tspan x="215.0" dy="13.0"></tspan><tspan x="215.0" dy="13.0">• живлення з розетки — струм майже не рахують</tspan><tspan x="215.0" dy="13.0">• планка з кількох чіпів на спільній шині</tspan><tspan x="215.0" dy="13.0">• довгі доріжки, багато відгалужень</tspan><tspan x="215.0" dy="13.0">• вища напруга сигналу — щоб пробити шумну шину</tspan><tspan x="215.0" dy="13.0">• термінація весь час палить струм</tspan><tspan x="215.0" dy="13.0">• простій рідкісний: сервер працює 24/7</tspan><tspan x="215.0" dy="13.0"></tspan><tspan x="215.0" dy="13.0">Ціна за швидкість — ват — прийнятна.</tspan></text>
<text x="625.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">LPDDR — мобільна</text>
<rect x="480.0" y="86.0" width="290.0" height="300.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="180.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Головна мета — МІНІМУМ енергії на біт + мізерний</tspan><tspan x="625.0" dy="11.7">струм у простої.</tspan><tspan x="625.0" dy="11.7"></tspan><tspan x="625.0" dy="11.7">• живлення з батареї — кожен міліват на рахунку</tspan><tspan x="625.0" dy="11.7">• чіп сидить упритул до процесора (PoP)</tspan><tspan x="625.0" dy="11.7">• короткі доріжки, точка-в-точку, без термінації</tspan><tspan x="625.0" dy="11.7">• низька напруга сигналу — розмах у сотні мВ</tspan><tspan x="625.0" dy="11.7">• глибокі режими сну між зверненнями</tspan><tspan x="625.0" dy="11.7">• розумна регенерація: гріти лиш зайняте й холодно</tspan><tspan x="625.0" dy="11.7"></tspan><tspan x="625.0" dy="11.7">Швидкість важлива, але НЕ ціною батареї.</tspan></text>
<rect x="150.0" y="396.0" width="540.0" height="30.0" rx="6" fill="#fffef0" stroke="#caa300" stroke-width="1.5"/><text x="420.0" y="414.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Комірка DRAM під обома — та сама. Різниця вся у ФІЗИЧНОМУ рівні й керуванні живленням.</tspan></text>
</svg>