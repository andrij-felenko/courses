<text x="56.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Урок:</text>
<text x="56.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">обидві посудини вимірюють у КБ, а не ГБ; заповнювати «по вінця» не можна —</text>
<text x="56.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">лишають запас на стек і непередбачене. Складніша задача — і запас тане вмить.</text>
