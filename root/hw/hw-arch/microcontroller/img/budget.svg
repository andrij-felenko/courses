<rect x="40.0" y="112.0" width="30.8" height="44.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.6"/>
<text x="78.8" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">180 КБ</text>
<text x="732.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">4.4% зайнято</text>
<text x="732.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">ємність 4 МБ = 4096 КБ</text>
<text x="40.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Пам'ять даних (змінні)</text>
