<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автономний вимірювальний конвеєр: 5 апаратних ланок без пробудження процесора</text>
<text x="420.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автономний 5-ланковий вимірювальний конвеєр без участі CPU</text>
<text x="100.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Компаратор</text>
<rect x="53.4" y="105.1" width="93.2" height="33.9" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="100.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="100.0" dy="0.0">COMP_OUT</tspan><tspan x="100.0" dy="12.3">(поріг напруги)</tspan></text>
<text x="260.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Таймер затримки</text>
<rect x="216.1" y="105.1" width="87.8" height="33.9" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="260.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">TIM_START</tspan><tspan x="260.0" dy="12.3">(пауза 10 мкс)</tspan></text>
<text x="420.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. АЦП перетворювач</text>
<rect x="370.7" y="105.1" width="98.6" height="33.9" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="420.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">ADC_START</tspan><tspan x="420.0" dy="12.3">(пачка 4 канали)</tspan></text>
<text x="580.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. DMAMUX / DMA</text>
<rect x="530.7" y="105.1" width="98.6" height="33.9" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="580.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">DMA_REQ</tspan><tspan x="580.0" dy="12.3">(пересилка слів)</tspan></text>
<text x="740.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">5. Буфер пам'яті</text>
<rect x="682.6" y="105.1" width="114.9" height="33.9" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="740.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">SRAM Buffer</tspan><tspan x="740.0" dy="12.3">(накопичення кадру)</tspan></text>
<line x1="160.0" y1="122.0" x2="200.0" y2="122.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="180.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Канал 0</tspan><tspan x="180.0" dy="12.3">(строб)</tspan></text>
<line x1="320.0" y1="122.0" x2="360.0" y2="122.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="340.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">TRGO</tspan><tspan x="340.0" dy="12.3">Канал 1</tspan></text>
<line x1="480.0" y1="122.0" x2="520.0" y2="122.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="500.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">EOC</tspan><tspan x="500.0" dy="12.3">Канал 2</tspan></text>
<line x1="640.0" y1="122.0" x2="680.0" y2="122.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="660.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">AHB шина</tspan><tspan x="660.0" dy="12.3">(дані)</tspan></text>
<rect x="40.0" y="220.0" width="760.0" height="175.0" rx="6" fill="#fbfcfd" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="60.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Часова шкала подій та енергетичний профіль процесора:</text>
<line x1="80.0" y1="330.0" x2="760.0" y2="330.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="740.0" y1="330.0" x2="765.0" y2="330.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="765.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-style="italic">час (t)</text>
<rect x="100.0" y="275.0" width="520.0" height="36.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="360.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">ЯДРО CPU СПИТЬ (режим WFI / DeepSleep · Струм ~2.5 мкА)</text>
<rect x="630.0" y="275.0" width="120.0" height="36.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="690.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">CPU Прокидається
(обробка кадру)</text>
<line x1="625.0" y1="265.0" x2="625.0" y2="330.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="3 3"/>
<text x="625.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">DMA TC IRQ</text>
<line x1="110.0" y1="325.0" x2="110.0" y2="335.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="110.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">t0: Поріг COMP</text>
<line x1="220.0" y1="325.0" x2="220.0" y2="335.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="220.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">t1: Старт TIM</text>
<line x1="380.0" y1="325.0" x2="380.0" y2="335.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="380.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">t2: АЦП вибірка</text>
<line x1="540.0" y1="325.0" x2="540.0" y2="335.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="540.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">t3: DMA запис</text>
<line x1="625.0" y1="325.0" x2="625.0" y2="335.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="625.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">t4: Кадр готовий</text>
<text x="420.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700" font-style="italic">Ядро не витрачає жодного такту на проміжні етапи 1–4 і прокидається лише на готовий результат</text>
</svg>