<text x="420.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700" font-style="italic">Затримка: 1 такт (синхронно) або 0 тактів (асинхронно) · Джиттер: 0.0 нс · Струм: мкА</text>
