<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
<rect width="900" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Наслідок: «вікно дальності» з'їхало повз ціль</text>
<text x="450.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">за першим відбиттям радар прогнозує, ДЕ ракета буде далі (швидкість × час), і дивиться лише у вузьке вікно навколо прогнозу</text>
<text x="70.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">напрямок руху Scud</text>
<line x1="70.0" y1="150.0" x2="830.0" y2="270.0" stroke="#8a8a8a" stroke-width="2.2" marker-end="url(#aGrey)"/>
<circle cx="230.0" cy="167.0" r="7.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="230.0" y="151.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1) перше виявлення</text>
<text x="230.0" y="193.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тут радар реально побачив ціль</text>
<circle cx="560.0" cy="220.0" r="9.0" fill="#fff" stroke="#c0271e" stroke-width="3"/>
<circle cx="560.0" cy="220.0" r="3.5" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="560.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">2) де Scud НАСПРАВДІ</text>
<rect x="672.0" y="210.0" width="96.0" height="70.0" rx="8" fill="none" stroke="#1f47b5" stroke-width="2.4"/>
<text x="720.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">вікно дальності (range gate)</text>
<text x="720.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="italic">система дивиться ЛИШЕ сюди</text>
<circle cx="720.0" cy="245.0" r="4.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<text x="720.0" y="249.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="1" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<line x1="560.0" y1="220.0" x2="672.0" y2="245.0" stroke="#c0271e" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round"/>
<text x="616.0" y="224.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">≈ 570 м</text>
<text x="616.0" y="241.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">розрив</text>
<rect x="70.0" y="360.0" width="760.0" height="84.0" rx="8" fill="#fbf7ee" stroke="#caa24a" stroke-width="1.8"/>
<text x="90.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Похибка часу зсунула прогноз уперед по траєкторії — справжня ціль опинилася ПОЗА вікном.</text>
<text x="90.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Радар «не побачив» цілі там, де шукав, вирішив, що тривоги нема, і перехоплення не відбулося.</text>
<text x="90.0" y="431.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Парадокс: що ДОВШЕ й «надійніше» працювала батарея без перезапуску, то більший зсув — і то сліпіша вона ставала.</text>
</svg>
