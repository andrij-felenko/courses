<text x="450.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Корінь біди: 0.1 не записати точно у двійковій</text>
<text x="450.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">годинник лічить десяті частки секунди; щоб дістати секунди, число множать на 1/10 — а 1/10 у двійковій нескінченне</text>
<text x="150.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">У десятковій — рівно:</text>
<rect x="40.0" y="120.0" width="220.0" height="46.0" rx="6" fill="#f4f7ff" stroke="#1f47b5" stroke-width="2"/>
<text x="150.0" y="149.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">1/10 = 0.1</text>
<text x="150.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одна цифра — і кінець</text>
<text x="660.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">У двійковій — нескінченне (період 1001…):</text>
<rect x="360.0" y="120.0" width="600.0" height="46.0" rx="6" fill="#fff5f5" stroke="#c0271e" stroke-width="2"/>
<text x="660.0" y="149.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">0.0 0011 0011 0011 0011 …</text>
<text x="660.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">група «0011» повторюється довіку — як 1/3 = 0.333… у десятковій</text>
<text x="450.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Регістр Patriot тримав лише 24 розряди після коми — решту «відрубали»:</text>
