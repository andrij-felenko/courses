<text x="430.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Q8.8: масштаб 2⁸ = 256; крок (найменший дріб) = 1/256 ≈ 0.0039; діапазон ≈ −128…+127.99</text>
<text x="430.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Хочеш точніший дріб — віддай більше бітів праворуч (Q4.12); хочеш більший діапазон — ліворуч (Q12.4).</text>
<text x="430.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кома стоїть НЕРУХОМО (звідси «фіксована»): ти обираєш її місце наперед і ним торгуєш діапазон ↔ точність.</text>
<text x="430.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Q16.16, Q8.8, Q4.4 — типові; вибір залежить від задачі.</text>
