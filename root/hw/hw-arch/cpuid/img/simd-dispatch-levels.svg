<rect x="60.0" y="280.0" width="185.0" height="130.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="152.5" y="313.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="152.5" dy="0.0">AVX-512 ядро</tspan><tspan x="152.5" dy="14.3"></tspan><tspan x="152.5" dy="14.3">512-бітні вектори ZMM</tspan><tspan x="152.5" dy="14.3">Максимальний throughput</tspan><tspan x="152.5" dy="14.3">(Потрібно: AVX512F +</tspan><tspan x="152.5" dy="14.3">OS XSAVE для ZMM)</tspan></text>
<rect x="275.0" y="280.0" width="185.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="367.5" y="313.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="367.5" dy="0.0">AVX2 + FMA ядро</tspan><tspan x="367.5" dy="14.3"></tspan><tspan x="367.5" dy="14.3">256-бітні вектори YMM</tspan><tspan x="367.5" dy="14.3">Сучасний стандарт x86-64</tspan><tspan x="367.5" dy="14.3">(Потрібно: AVX2 +</tspan><tspan x="367.5" dy="14.3">OS XSAVE для YMM)</tspan></text>
<rect x="490.0" y="280.0" width="185.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="582.5" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="582.5" dy="0.0">SSE4.2 ядро</tspan><tspan x="582.5" dy="13.0"></tspan><tspan x="582.5" dy="13.0">128-бітні вектори XMM</tspan><tspan x="582.5" dy="13.0">Сумісність зі старими CPU</tspan><tspan x="582.5" dy="13.0">(Працює без обов'язкового</tspan><tspan x="582.5" dy="13.0">XSAVE XCR0)</tspan></text>
<rect x="705.0" y="280.0" width="185.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="797.5" y="313.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="797.5" dy="0.0">Скалярний Fallback</tspan><tspan x="797.5" dy="14.3"></tspan><tspan x="797.5" dy="14.3">Базові регістри x86</tspan><tspan x="797.5" dy="14.3">Гарантований запуск</tspan><tspan x="797.5" dy="14.3">на будь-якому процесорі</tspan><tspan x="797.5" dy="14.3">(Безпечний мінімум)</tspan></text>
