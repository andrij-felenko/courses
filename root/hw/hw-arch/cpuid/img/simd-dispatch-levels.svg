<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дворівнева перевірка підтримки SIMD та динамічна диспетчеризація</text>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дворівнева перевірка підтримки SIMD та динамічна диспетчеризація</text>
<rect x="40.0" y="80.0" width="240.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Крок 1: CPUID</tspan><tspan x="160.0" dy="16.2">(Апаратна підтримка)</tspan><tspan x="160.0" dy="16.2">Leaf 1 / Leaf 7 прапорці</tspan><tspan x="160.0" dy="16.2">(AVX2, AVX-512, FMA)</tspan></text>
<rect x="360.0" y="80.0" width="240.0" height="80.0" rx="6" fill="#fff7e6" stroke="#c98a00" stroke-width="1.5"/><text x="480.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Крок 2: OSXSAVE + XCR0</tspan><tspan x="480.0" dy="16.2">(Підтримка в ядрі ОС)</tspan><tspan x="480.0" dy="16.2">Збереження регістрів YMM/ZMM</tspan><tspan x="480.0" dy="16.2">через інструкцію XGETBV</tspan></text>
<rect x="680.0" y="80.0" width="240.0" height="80.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">Крок 3: IFUNC / Диспетчер</tspan><tspan x="800.0" dy="16.2">(Вибір реалізації)</tspan><tspan x="800.0" dy="16.2">Одноразова резолюція адреси</tspan><tspan x="800.0" dy="16.2">при завантаженні або запуску</tspan></text>
