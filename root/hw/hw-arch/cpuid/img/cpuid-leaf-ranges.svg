<rect x="45.0" y="85.0" width="255.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="172.5" y="103.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="172.5" dy="0.0">Базові листки (Standard)</tspan><tspan x="172.5" dy="16.9">0x00000000 – 0x0000001F+</tspan></text>
<rect x="45.0" y="140.0" width="255.0" height="50.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="172.5" y="161.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="172.5" dy="0.0">Leaf 0x00: Max Leaf + Vendor</tspan><tspan x="172.5" dy="15.0">(&quot;GenuineIntel&quot;, &quot;AuthenticAMD&quot;)</tspan></text>
<rect x="45.0" y="198.0" width="255.0" height="50.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="172.5" y="219.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="172.5" dy="0.0">Leaf 0x01: Signature &amp; Features</tspan><tspan x="172.5" dy="15.0">(Family/Model/Step, SSE, AVX, FPU)</tspan></text>
<rect x="45.0" y="256.0" width="255.0" height="50.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="172.5" y="277.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="172.5" dy="0.0">Leaf 0x04 / 0x18: Кеш-топологія</tspan><tspan x="172.5" dy="15.0">(Розміри L1/L2/L3, асоціативність)</tspan></text>
<rect x="45.0" y="314.0" width="255.0" height="50.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="172.5" y="335.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="172.5" dy="0.0">Leaf 0x07: Розширені прапорці</tspan><tspan x="172.5" dy="15.0">(AVX2, AVX-512, BMI, SMEP, SMAP)</tspan></text>
