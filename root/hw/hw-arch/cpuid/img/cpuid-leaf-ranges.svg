<rect x="350.0" y="140.0" width="260.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="480.0" y="157.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Leaf 0x40000000: Сигнатура VMM</tspan><tspan x="480.0" dy="15.0">(&quot;KVMKVMKVM&quot;, &quot;Microsoft Hv&quot;,</tspan><tspan x="480.0" dy="15.0">&quot;VMwareVMware&quot;, &quot;XenVMMXenVMM&quot;)</tspan></text>
<rect x="350.0" y="204.0" width="260.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="480.0" y="221.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Leaf 0x40000001+: Можливості VMM</tspan><tspan x="480.0" dy="15.0">(Паравіртуальні годинники PV Clock,</tspan><tspan x="480.0" dy="15.0">EOI, IPI, Hypercall інтерфейс)</tspan></text>
<rect x="370.8" y="280.6" width="218.4" height="78.8" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="300.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Активуються лише у VM</tspan><tspan x="480.0" dy="15.6">або емулюються гіпервізором.</tspan><tspan x="480.0" dy="15.6">Біт 31 у Leaf 1 (ECX) = 1</tspan><tspan x="480.0" dy="15.6">сигналізує про наявність VMM.</tspan></text>
<rect x="645.0" y="70.0" width="285.0" height="360.0" rx="6" fill="#fffaf0" stroke="#c98a00" stroke-width="1.6"/>
