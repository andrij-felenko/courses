<rect x="660.0" y="140.0" width="255.0" height="50.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="787.5" y="161.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="787.5" dy="0.0">Leaf 0x80000000: Max Ext Leaf</tspan><tspan x="787.5" dy="15.0">(Діапазон розширених функцій)</tspan></text>
<rect x="660.0" y="198.0" width="255.0" height="50.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="787.5" y="219.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="787.5" dy="0.0">Leaf 0x80000001: Ext Features</tspan><tspan x="787.5" dy="15.0">(Long Mode 64-bit, NX/XD біт)</tspan></text>
<rect x="660.0" y="256.0" width="255.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="787.5" y="273.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="787.5" dy="0.0">Leaf 0x80000002–0x80000004:</tspan><tspan x="787.5" dy="15.0">Brand String (48 байтів ASCII назви</tspan><tspan x="787.5" dy="15.0">процесора для користувача)</tspan></text>
<rect x="660.0" y="320.0" width="255.0" height="50.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="787.5" y="341.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="787.5" dy="0.0">Leaf 0x80000008: Адресні лінії</tspan><tspan x="787.5" dy="15.0">(Фізична та віртуальна ширина шини)</tspan></text>
