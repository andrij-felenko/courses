<rect x="55.0" y="125.0" width="190.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="156.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">EAX</tspan><tspan x="150.0" dy="16.9">(Номер листка / Leaf)</tspan></text>
<rect x="55.0" y="215.0" width="190.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">ECX</tspan><tspan x="150.0" dy="13.0">(Номер підлистка / Sub-leaf)</tspan></text>
<rect x="57.9" y="318.4" width="184.2" height="63.2" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="150.0" y="338.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Доступно з Ring 3</tspan><tspan x="150.0" dy="15.6">(без привілеїв, без #GP)</tspan><tspan x="150.0" dy="15.6">Не чіпає пам'ять</tspan></text>
<rect x="310.0" y="70.0" width="340.0" height="360.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="480.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виконавчий блок процесора (x86)</text>
<rect x="330.0" y="125.0" width="300.0" height="75.0" rx="6" fill="#fff7e6" stroke="#c98a00" stroke-width="1.5"/><text x="480.0" y="158.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Апаратна таблиця конфігурацій</tspan><tspan x="480.0" dy="16.9">(ROM мікрокоду + Fuses кремнію)</tspan></text>
<rect x="330.0" y="220.0" width="300.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="243.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Апаратна серіалізація конвеєра</tspan><tspan x="480.0" dy="15.6">(Pipeline Serialization Barrier):</tspan><tspan x="480.0" dy="15.6">скидання спекулятивних черг,</tspan><tspan x="480.0" dy="15.6">завершення попередніх операцій</tspan></text>
<rect x="370.8" y="333.4" width="218.4" height="63.2" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="480.0" y="353.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Абсолютно детерміновано:</tspan><tspan x="480.0" dy="15.6">фіксований набір бітів</tspan><tspan x="480.0" dy="15.6">для поточної мікроархітектури</tspan></text>
<rect x="700.0" y="70.0" width="220.0" height="360.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
