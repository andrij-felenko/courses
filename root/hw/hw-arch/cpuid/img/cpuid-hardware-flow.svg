<rect x="715.0" y="185.0" width="190.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="211.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">EBX</tspan><tspan x="810.0" dy="13.7">(Прапорці / ASCII / APIC)</tspan></text>
<rect x="715.0" y="255.0" width="190.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="282.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">ECX</tspan><tspan x="810.0" dy="12.3">(Прапорці розширень / ASCII)</tspan></text>
<rect x="715.0" y="325.0" width="190.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="351.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">EDX</tspan><tspan x="810.0" dy="13.7">(Базові прапорці / ASCII)</tspan></text>
