<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коли P4, а коли звичайний ESP32: тригери вибору</text>
<rect x="50.0" y="80.0" width="380.0" height="250.0" rx="12" fill="#f5edfb" stroke="#9b5fc7" stroke-width="2.0"/>
<text x="240.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6d28a8" text-anchor="middle" font-weight="700">Тягне до P4</text>
<text x="72.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• великий жвавий екран (HMI)</text>
<text x="72.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• камера й запис відео</text>
<text x="72.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• важкі локальні обчислення (ШІ)</text>
<text x="72.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• швидкий ввід-вивід (HS-USB)</text>
<rect x="450.0" y="80.0" width="380.0" height="250.0" rx="12" fill="#fff1e6" stroke="#d2772a" stroke-width="2.0"/>
<text x="640.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b9560f" text-anchor="middle" font-weight="700">Тягне до звичайного ESP32</text>
<text x="472.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• суть задачі — зв'язок (Wi-Fi/BLE)</text>
<text x="472.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• проста дешева масова річ</text>
<text x="472.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• потрібен один чіп без компаньйона</text>
<text x="472.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">• екрана й камери нема</text>
<text x="440.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">часто задача чітко світиться однією з колонок: «про екран і камеру» чи «про вихід у мережу»</text>
</svg>