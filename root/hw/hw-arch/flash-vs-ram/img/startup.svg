<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 398" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="398" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки глобальні беруть початкові значення</text>
<text x="380.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">значення мусить пережити вимкнення (отже, Flash), та змінна мінлива (отже, RAM) — розв'язок: копія при старті</text>
<rect x="40.0" y="80.0" width="300.0" height="184.0" rx="12" fill="#eef7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="190.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Flash (нелетка)</text>
<rect x="62.0" y="118.0" width="256.0" height="32.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">.text — код (виконується тут)</tspan></text>
<rect x="62.0" y="156.0" width="256.0" height="32.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="175.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">.rodata — сталі (читаються тут)</tspan></text>
<rect x="62.0" y="194.0" width="256.0" height="32.0" rx="6" fill="#fff8e8" stroke="#caa24a" stroke-width="1.5"/><text x="190.0" y="213.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a7322" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">початкові значення .data</tspan></text>
<text x="190.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">усе це пережило вимкнення</text>
<rect x="420.0" y="80.0" width="300.0" height="184.0" rx="12" fill="#f3f5fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="570.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">RAM (летка)</text>
<rect x="442.0" y="156.0" width="256.0" height="32.0" rx="6" fill="#fff8e8" stroke="#caa24a" stroke-width="1.5"/><text x="570.0" y="175.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a7322" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">.data (вже з копією значень)</tspan></text>
<rect x="442.0" y="194.0" width="256.0" height="32.0" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.5"/><text x="570.0" y="213.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">.bss → обнулено</tspan></text>
<line x1="322.0" y1="210.0" x2="438.0" y2="172.0" stroke="#9a7322" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="380.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9a7322" text-anchor="middle" font-weight="700">копія при старті</text>
<line x1="570.0" y1="244.0" x2="570.0" y2="228.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="3 3"/>
<text x="570.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">обнуляється на старті</text>
<rect x="40.0" y="286.0" width="680.0" height="86.0" rx="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="380.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перед main() крихітний стартовий код копіює початкові значення .data з Flash у RAM і обнуляє .bss.</text>
<text x="380.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тому глобальна щоразу стартує зі свого початкового значення — воно зберігалось у Flash і скопіювалось у RAM.</text>
<text x="380.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">.bss (нульові) місця в прошивці не займають: навіщо зберігати тисячу нулів — досить сказати «обнули цей шмат RAM».</text>
</svg>