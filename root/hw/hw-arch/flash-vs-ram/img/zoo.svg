<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 382" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="382" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родина пам'ятей: хто летка, де яку вживають</text>
<text x="380.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">видів багато, та для мікроконтролера головні дві — Flash (програма) і SRAM (змінні)</text>
<text x="70.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">тип</text>
<text x="230.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">летка?</text>
<text x="470.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">особливості</text>
<text x="700.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">де вживають</text>
<rect x="60.0" y="96.0" width="110.0" height="40.0" rx="6" fill="#fafafa" stroke="#27ae60" stroke-width="1.5"/><text x="115.0" y="120.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">SRAM</tspan></text>
<rect x="180.0" y="96.0" width="100.0" height="40.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="119.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">летка</tspan></text>
<rect x="290.0" y="96.0" width="280.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="300.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">дуже швидка; комірка ≈ тригер</text>
<rect x="580.0" y="96.0" width="140.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="650.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">робоча RAM МК, кеші</text>
<rect x="60.0" y="144.0" width="110.0" height="40.0" rx="6" fill="#fafafa" stroke="#27ae60" stroke-width="1.5"/><text x="115.0" y="168.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">DRAM</tspan></text>
<rect x="180.0" y="144.0" width="100.0" height="40.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="167.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">летка</tspan></text>
<rect x="290.0" y="144.0" width="280.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="300.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">щільна; потребує освіження (заряд стікає)</text>
<rect x="580.0" y="144.0" width="140.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="650.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">головна пам'ять ПК</text>
<rect x="60.0" y="192.0" width="110.0" height="40.0" rx="6" fill="#fafafa" stroke="#27ae60" stroke-width="1.5"/><text x="115.0" y="216.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">Flash</tspan></text>
<rect x="180.0" y="192.0" width="100.0" height="40.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="215.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">нелетка</tspan></text>
<rect x="290.0" y="192.0" width="280.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="300.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">читання швидке; запис блоками, знос</text>
<rect x="580.0" y="192.0" width="140.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="650.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">програма МК, SSD, флешки</text>
<rect x="60.0" y="240.0" width="110.0" height="40.0" rx="6" fill="#fafafa" stroke="#27ae60" stroke-width="1.5"/><text x="115.0" y="264.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">EEPROM</tspan></text>
<rect x="180.0" y="240.0" width="100.0" height="40.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="263.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">нелетка</tspan></text>
<rect x="290.0" y="240.0" width="280.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="300.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">повільна, зате побайтна</text>
<rect x="580.0" y="240.0" width="140.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="650.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">малі налаштування на МК</text>
<rect x="60.0" y="288.0" width="110.0" height="40.0" rx="6" fill="#fafafa" stroke="#caa24a" stroke-width="1.5"/><text x="115.0" y="312.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">ROM</tspan></text>
<rect x="180.0" y="288.0" width="100.0" height="40.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="311.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">нелетка</tspan></text>
<rect x="290.0" y="288.0" width="280.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="300.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">тільки читання, вшите назавжди</text>
<rect x="580.0" y="288.0" width="140.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="650.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">заводський код, незмінні дані</text>
<text x="380.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вся родина — варіації на дві фізичні теми: летку (біт тримає струм) і нелетку (стан застрягає фізично).</text>
</svg>