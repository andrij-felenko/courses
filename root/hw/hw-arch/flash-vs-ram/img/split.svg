<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 382" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="382" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що куди: незмінне — у Flash, мінливе — в RAM</text>
<text x="380.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">властивість даних диктує, у якій пам'яті їм жити</text>
<rect x="40.0" y="76.0" width="330.0" height="200.0" rx="12" fill="#eef7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="205.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Flash (нелетка, повільний запис)</text>
<rect x="64.0" y="116.0" width="282.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="205.0" y="139.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">.text — код (інструкції програми)</tspan></text>
<rect x="64.0" y="162.0" width="282.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="205.0" y="185.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">.rodata — сталі (рядки, таблиці)</tspan></text>
<text x="205.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">сюди — бо:</text>
<text x="205.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">не міняються під час роботи</text>
<text x="205.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">мусять пережити вимкнення</text>
<rect x="390.0" y="76.0" width="330.0" height="200.0" rx="12" fill="#f3f5fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="555.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">RAM (летка, швидка, побайтно)</text>
<rect x="414.0" y="116.0" width="282.0" height="40.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="555.0" y="139.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">.data / .bss — глобальні змінні</tspan></text>
<rect x="414.0" y="162.0" width="282.0" height="40.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="555.0" y="185.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">стек і купа — локальні, динамічні</tspan></text>
<text x="555.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">сюди — бо:</text>
<text x="555.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">міняються постійно (треба швидкий запис)</text>
<text x="555.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">тимчасові — не шкода, що зникнуть</text>
<text x="380.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Незмінне й цінне (код, сталі) — у нелетку Flash;</text>
<text x="380.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">мінливе й тимчасове (змінні) — у швидку RAM.</text>
<text x="380.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">На МК RAM мізерна (кілобайти), Flash більша — великі сталі таблиці тримають у Flash, щоб берегти RAM.</text>
</svg>