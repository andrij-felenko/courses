<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="700" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві пари команд, той самий 2-канальний конвеєр</text>
<text x="180.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Незалежні → разом</text>
<rect x="30.0" y="95.0" width="150.0" height="40.0" rx="5" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/>
<text x="105.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">a = b + c</text>
<rect x="30.0" y="150.0" width="150.0" height="40.0" rx="5" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/>
<text x="105.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">x = y + z</text>
<text x="180.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">обидві в одному такті</text>
<text x="180.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">IPC = 2</text>
<line x1="350.0" y1="60.0" x2="350.0" y2="260.0" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="530.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Залежні → по черзі</text>
<rect x="380.0" y="95.0" width="150.0" height="40.0" rx="5" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/>
<text x="455.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">a = b + c</text>
<rect x="380.0" y="150.0" width="150.0" height="40.0" rx="5" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/>
<text x="455.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">d = a + e</text>
<line x1="455.0" y1="135.0" x2="455.0" y2="150.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">чекає a</text>
<text x="530.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">друга чекає результат першої</text>
<text x="530.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">IPC = 1</text>
<text x="350.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Виграш суперскаляра впирається в те, скільки сусідніх команд справді незалежні</text>
</svg>