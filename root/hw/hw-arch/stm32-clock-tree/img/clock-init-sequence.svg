<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність переходу на максимальну частоту тактування STM32</text>
<rect x="49.3" y="84.0" width="121.4" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">1. Увімкнути HSE</tspan><tspan x="110.0" dy="13.0">RCC_CR |= HSEON</tspan><tspan x="110.0" dy="13.0">Очікування HSERDY</tspan></text>
<line x1="188.0" y1="110.0" x2="232.0" y2="110.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="243.1" y="84.0" width="133.8" height="52.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="310.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">2. Живлення PWR</tspan><tspan x="310.0" dy="13.0">Увімкнути PWR такт</tspan><tspan x="310.0" dy="13.0">Режим VOS = Scale 1</tspan></text>
<line x1="388.0" y1="110.0" x2="432.0" y2="110.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="415.2" y="84.0" width="189.6" height="52.0" rx="6" fill="#fff9e6" stroke="#e0a800" stroke-width="1.5"/><text x="510.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">3. Flash Latency</tspan><tspan x="510.0" dy="13.0">FLASH_ACR: 5 WS</tspan><tspan x="510.0" dy="13.0">Увімкнути ICEN, DCEN, PRFTEN</tspan></text>
<line x1="588.0" y1="110.0" x2="632.0" y2="110.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="652.4" y="84.0" width="115.2" height="52.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="710.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">4. Дільники шин</tspan><tspan x="710.0" dy="13.0">RCC_CFGR: AHB /1</tspan><tspan x="710.0" dy="13.0">APB1 /4, APB2 /2</tspan></text>
<line x1="710.0" y1="150.0" x2="710.0" y2="205.0" stroke="#333333" stroke-width="1.6"/>
<line x1="710.0" y1="205.0" x2="710.0" y2="240.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="630.7" y="254.0" width="158.6" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="710.0" y="270.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">5. Параметри PLL</tspan><tspan x="710.0" dy="13.0">RCC_PLLCFGR:</tspan><tspan x="710.0" dy="13.0">M, N, P, Q + PLLSRC_HSE</tspan></text>
<line x1="632.0" y1="280.0" x2="588.0" y2="280.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="449.3" y="254.0" width="121.4" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="510.0" y="270.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">6. Старт PLL</tspan><tspan x="510.0" dy="13.0">RCC_CR |= PLLON</tspan><tspan x="510.0" dy="13.0">Очікування PLLRDY</tspan></text>
<line x1="432.0" y1="280.0" x2="388.0" y2="280.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="236.9" y="254.0" width="146.2" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="310.0" y="270.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">7. Перемикач SW</tspan><tspan x="310.0" dy="13.0">RCC_CFGR: SW = PLL</tspan><tspan x="310.0" dy="13.0">Очікування SWS == PLL</tspan></text>
<line x1="232.0" y1="280.0" x2="188.0" y2="280.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30.7" y="254.0" width="158.6" height="52.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="110.0" y="270.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">8. Захист CSS</tspan><tspan x="110.0" dy="13.0">RCC_CR |= CSSON</tspan><tspan x="110.0" dy="13.0">Захист від зриву кварцу</tspan></text>
<line x1="110.0" y1="320.0" x2="110.0" y2="380.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="110.5" y="394.8" width="618.9" height="30.5" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="413.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Готово: Ядро Cortex-M працює на стабільних 168 МГц із захищеним Flash-доступом і робочим USB</tspan></text>
</svg>