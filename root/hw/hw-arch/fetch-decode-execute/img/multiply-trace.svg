<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Емулятор у русі: множення 6×3 додаванням у циклі</text>
<text x="36.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">програма в code[] (адреси зліва):</text>
<rect x="36.0" y="96.0" width="250.0" height="30.0" rx="6" fill="#f6f8fb" stroke="#2457d6" stroke-width="1.6"/>
<text x="46" y="116" font-family="Consolas, monospace" font-size="12" fill="#6b7280" text-anchor="start"> 0</text>
<text x="84" y="116" font-family="Consolas, monospace" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">LD  r0, 0</text>
<rect x="36.0" y="130.0" width="250.0" height="30.0" rx="6" fill="#f6f8fb" stroke="#2457d6" stroke-width="1.6"/>
<text x="46" y="150" font-family="Consolas, monospace" font-size="12" fill="#6b7280" text-anchor="start"> 3</text>
<text x="84" y="150" font-family="Consolas, monospace" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">LD  r1, 3</text>
<rect x="36.0" y="164.0" width="250.0" height="30.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.6"/>
<text x="46" y="184" font-family="Consolas, monospace" font-size="12" fill="#6b7280" text-anchor="start"> 6</text>
<text x="84" y="184" font-family="Consolas, monospace" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">ADD r0, r2</text>
<rect x="36.0" y="198.0" width="250.0" height="30.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.6"/>
<text x="46" y="218" font-family="Consolas, monospace" font-size="12" fill="#6b7280" text-anchor="start"> 9</text>
<text x="84" y="218" font-family="Consolas, monospace" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">SUB r1, r3</text>
<rect x="36.0" y="232.0" width="250.0" height="30.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.6"/>
<text x="46" y="252" font-family="Consolas, monospace" font-size="12" fill="#6b7280" text-anchor="start">12</text>
<text x="84" y="252" font-family="Consolas, monospace" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">JNZ r1, 6</text>
<rect x="36.0" y="266.0" width="250.0" height="30.0" rx="6" fill="#f6f8fb" stroke="#2457d6" stroke-width="1.6"/>
<text x="46" y="286" font-family="Consolas, monospace" font-size="12" fill="#6b7280" text-anchor="start">15</text>
<text x="84" y="286" font-family="Consolas, monospace" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">HLT</text>
<path d="M188,260 C338,286 338,168 196,182" fill="none" stroke="#b8860b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="300.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="start" font-weight="700">цикл</text>
<text x="36.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">(r2=6, r3=1 — наперед задані сталі)</text>
<text x="360.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">стан після кожного оберту циклу:</text>
<rect x="360.0" y="90.0" width="510.0" height="38.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="372.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">оберт</text>
<text x="450.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">що сталося</text>
<text x="770.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">r0</text>
<text x="830.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">r1</text>
<rect x="360.0" y="128.0" width="510.0" height="38.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.1"/>
<text x="372.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">старт</text>
<text x="450" y="153" font-family="Consolas, monospace" font-size="12" fill="#1a1a1a" text-anchor="start">LD r0,0 ; LD r1,3</text>
<text x="770" y="153" font-family="Consolas, monospace" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">0</text>
<text x="830" y="153" font-family="Consolas, monospace" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">3</text>
<rect x="360.0" y="166.0" width="510.0" height="38.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.1"/>
<text x="372.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">1</text>
<text x="450" y="191" font-family="Consolas, monospace" font-size="12" fill="#1a1a1a" text-anchor="start">r0+=6 ; r1−=1 ; r1≠0 → стриб</text>
<text x="770" y="191" font-family="Consolas, monospace" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">6</text>
<text x="830" y="191" font-family="Consolas, monospace" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">2</text>
<rect x="360.0" y="204.0" width="510.0" height="38.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.1"/>
<text x="372.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">2</text>
<text x="450" y="229" font-family="Consolas, monospace" font-size="12" fill="#1a1a1a" text-anchor="start">r0+=6 ; r1−=1 ; r1≠0 → стриб</text>
<text x="770" y="229" font-family="Consolas, monospace" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">12</text>
<text x="830" y="229" font-family="Consolas, monospace" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">1</text>
<rect x="360.0" y="242.0" width="510.0" height="38.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.1"/>
<text x="372.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">3</text>
<text x="450" y="267" font-family="Consolas, monospace" font-size="12" fill="#1a1a1a" text-anchor="start">r0+=6 ; r1−=1 ; r1=0 → далі</text>
<text x="770" y="267" font-family="Consolas, monospace" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">18</text>
<text x="830" y="267" font-family="Consolas, monospace" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">0</text>
<rect x="360.0" y="280.0" width="510.0" height="38.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.1"/>
<text x="372.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="start" font-weight="700">стоп</text>
<text x="450" y="305" font-family="Consolas, monospace" font-size="12" fill="#1a1a1a" text-anchor="start">JNZ не стрибнув ; HLT</text>
<text x="770" y="305" font-family="Consolas, monospace" font-size="14" fill="#b8860b" text-anchor="start" font-weight="700">18</text>
<text x="830" y="305" font-family="Consolas, monospace" font-size="14" fill="#b8860b" text-anchor="start" font-weight="700">0</text>
<rect x="360.0" y="90.0" width="510.0" height="228.0" rx="6" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="360.0" y="349.2" width="510.0" height="47.6" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.8"/><text x="615.0" y="369.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Відповідь у r0: 6 + 6 + 6 = 18 = 6×3.</tspan><tspan x="615.0" dy="15.6">Множення «зникло» — лишилось додавання в циклі, кероване JNZ.</tspan></text>
</svg>