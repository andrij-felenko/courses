<text x="500.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кожен відрізок — ціле число тактів HCLK, задане в регістрі таймінгу банку.</text>
<text x="500.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">ADDSET — скільки чекати, поки адреса вляжеться, перш ніж опустити ~NWE; DATAST — доки тримати ~NWE (і дані);</text>
<text x="500.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">мікросхема-пам'ять фіксує дані на висхідному фронті ~NWE. Замало тактів — чіп не встиг, у пам'ять ляже сміття.</text>
<text x="500.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">Ці числа підбирають під конкретну мікросхему: швидшій вистачає 1–2 такти, повільнішій треба більше.</text>
