<text x="564.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Це та сама каскадна дешифрація, що на будь-якій шині:</text>
<text x="564.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">старші біти вибирають мікросхему (піднімають один ~NEx),</text>
<text x="564.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">молодші йдуть усередину неї на вибір комірки.</text>
<text x="500.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Вся зовнішня пам'ять живе від 0x6000_0000; чотири підвікна по 64 МБ — це чотири окремі мікросхеми, кожна зі своїм ~NEx.</text>
<text x="500.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6a3fb5" text-anchor="middle" font-weight="700">Записав за адресою 0x6800_0000 — активувався ~NE3, і цикл пішов саме до дисплея.</text>
