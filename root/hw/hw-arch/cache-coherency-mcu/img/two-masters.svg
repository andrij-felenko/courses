<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два майстри бачать SRAM по-різному</text>
<rect x="60.0" y="70.0" width="150.0" height="56.0" rx="10" fill="#eef2fb" stroke="#2457d6" stroke-width="2.2"/>
<text x="135.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Ядро (CPU)</text>
<text x="135.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">читає й пише</text>
<rect x="60.0" y="165.0" width="150.0" height="56.0" rx="10" fill="#f1ecfa" stroke="#6a3fb5" stroke-width="2.4"/>
<text x="135.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6a3fb5" text-anchor="middle" font-weight="700">Кеш даних (L1)</text>
<text x="135.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6a3fb5" text-anchor="middle">копія рядків</text>
<rect x="300.0" y="235.0" width="190.0" height="66.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/>
<text x="395.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">SRAM (пам'ять)</text>
<text x="395.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">справжні байти</text>
<rect x="580.0" y="70.0" width="150.0" height="56.0" rx="10" fill="#fdf3e6" stroke="#b9770e" stroke-width="2.2"/>
<text x="655.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b9770e" text-anchor="middle" font-weight="700">DMA</text>
<text x="655.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">інший майстер</text>
<line x1="135.0" y1="126.0" x2="135.0" y2="165.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="135.0" y1="221.0" x2="335.0" y2="235.0" stroke="#6a3fb5" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="215.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6a3fb5" text-anchor="start" font-style="italic">лише при промаху / витісненні</text>
<line x1="655.0" y1="126.0" x2="455.0" y2="235.0" stroke="#b9770e" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="560.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="start" font-weight="700">напряму,</text>
<text x="560.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="start" font-weight="700">повз кеш</text>
<text x="390.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Ядро говорить з копією в кеші; DMA — зі справжньою пам'яттю. Копія і оригінал розходяться.</text>
</svg>