<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що додав «іллінойський» MESI над MSI</text>
<rect x="40.0" y="52.0" width="360.0" height="300.0" rx="12" fill="#fff8f6" stroke="#c0392b" stroke-width="1.4"/>
<text x="220.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">MSI — три стани</text>
<rect x="80.0" y="96.0" width="280.0" height="40.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.8"/>
<text x="220.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1) Ядро читає адресу, більше ніхто її не має</text>
<line x1="220.0" y1="136.0" x2="220.0" y2="160.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="80.0" y="162.0" width="280.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="220.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">2) Рядок лягає як Shared</text>
<text x="220.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">MSI не вміє сказати «я тут сам»</text>
<line x1="220.0" y1="202.0" x2="220.0" y2="226.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="80.0" y="228.0" width="280.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="220.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">3) Ядро хоче записати →</text>
<text x="220.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">мусить кинути invalidate на шину</text>
<rect x="80.0" y="288.0" width="280.0" height="46.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="220.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Зайва транзакція шини —</text>
<text x="220.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">хоч копію ніхто не тримав</text>
<rect x="420.0" y="52.0" width="360.0" height="300.0" rx="12" fill="#f3fbf6" stroke="#27ae60" stroke-width="1.4"/>
<text x="600.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">MESI — додано Exclusive</text>
<rect x="460.0" y="96.0" width="280.0" height="40.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.8"/>
<text x="600.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1) Ядро читає, шина мовчить — ніхто не озвався</text>
<line x1="600.0" y1="136.0" x2="600.0" y2="160.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="460.0" y="162.0" width="280.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="600.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">2) Рядок лягає як Exclusive</text>
<text x="600.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">«чисто й лише в мене»</text>
<line x1="600.0" y1="202.0" x2="600.0" y2="226.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="460.0" y="228.0" width="280.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="600.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">3) Ядро записує →</text>
<text x="600.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">тихо переходить у Modified</text>
<rect x="460.0" y="288.0" width="280.0" height="46.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="600.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Жодної транзакції шини —</text>
<text x="600.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">у типовому «читаю, потім пишу»</text>
</svg>