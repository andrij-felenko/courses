<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві біди кеша при DMA — і чим лікувати</text>
<rect x="30.0" y="58.0" width="760.0" height="158.0" rx="10" fill="#fff8f6" stroke="#c0392b" stroke-width="1.4"/>
<text x="50.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">1) DMA приніс нове в SRAM, а ядро читає старе з кеша</text>
<rect x="70.0" y="100.0" width="150.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="145.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">SRAM: НОВЕ</text>
<text x="145.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">DMA щойно записав</text>
<rect x="70.0" y="158.0" width="150.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="145.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Кеш: СТАРЕ</text>
<text x="145.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">лишилася копія</text>
<line x1="220.0" y1="180.0" x2="330.0" y2="180.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="330.0" y="158.0" width="130.0" height="44.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="395.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Ядро читає</text>
<text x="395.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">бачить СТАРЕ ✗</text>
<rect x="510.0" y="118.0" width="250.0" height="84.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="635.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Ліки: invalidate</text>
<text x="635.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">викинути копію з кеша ПІСЛЯ DMA —</text>
<text x="635.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">наступне читання піде в SRAM</text>
<text x="635.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">за свіжим</text>
<rect x="30.0" y="240.0" width="760.0" height="158.0" rx="10" fill="#f7f9ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="50.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">2) Ядро записало в кеш (write-back), а DMA везе старе з SRAM</text>
<rect x="70.0" y="282.0" width="150.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="145.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кеш: НОВЕ</text>
<text x="145.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">брудний рядок</text>
<rect x="70.0" y="340.0" width="150.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="145.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">SRAM: СТАРЕ</text>
<text x="145.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">запис ще не дійшов</text>
<line x1="220.0" y1="362.0" x2="330.0" y2="362.0" stroke="#b9770e" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="330.0" y="340.0" width="130.0" height="44.0" rx="6" fill="#fdf3e6" stroke="#b9770e" stroke-width="2.0"/>
<text x="395.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="middle" font-weight="700">DMA читає</text>
<text x="395.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">везе СТАРЕ ✗</text>
<rect x="510.0" y="300.0" width="250.0" height="84.0" rx="8" fill="#f7f9ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="635.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Ліки: clean</text>
<text x="635.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">злити брудний рядок у SRAM ПЕРЕД</text>
<text x="635.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">DMA — тоді він забере вже</text>
<text x="635.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">оновлені байти</text>
</svg>