<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Що скільки коштує: задача → мінімальне залізо</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">дешево (МК): поріг, пляма, лінія; середньо (Pi CPU): Канні, Хаф, контури, трекінг; важко (Pi+GPU): нейродетектор</text>
<rect x="60" y="100" width="840" height="108" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<rect x="60" y="100" width="300" height="108" rx="11" fill="#0a8f3c" fill-opacity="0.13" stroke="none" stroke-width="1.6"/>
<text x="210" y="148.0" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ДЕШЕВО — тягне МК</text>
<text x="210" y="168.0" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">для дронів — перший вибір</text>
<text x="380" y="126" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• поріг і морфологія (49.5)</text>
<text x="380" y="146" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• колірна пляма в HSV (49.6)</text>
<text x="380" y="166" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• стеження за лінією</text>
<text x="380" y="186" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• малий Собель на дрібному кадрі (49.4)</text>
<rect x="60" y="220" width="840" height="108" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<rect x="60" y="220" width="300" height="108" rx="11" fill="#d98a00" fill-opacity="0.13" stroke="none" stroke-width="1.6"/>
<text x="210" y="268.0" font-size="11" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">СЕРЕДНЬО — одноплатник (CPU)</text>
<text x="210" y="288.0" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">коли класики мало</text>
<text x="380" y="246" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• Канні: чисті контури (49.4)</text>
<text x="380" y="266" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• перетворення Хафа: лінії, кола (49.6)</text>
<text x="380" y="286" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• контури, форми, зіставлення з шаблоном</text>
<text x="380" y="306" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• оптичний потік / трекінг (49.8)</text>
<rect x="60" y="340" width="840" height="108" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.8"/>
<rect x="60" y="340" width="300" height="108" rx="11" fill="#cc0000" fill-opacity="0.13" stroke="none" stroke-width="1.6"/>
<text x="210" y="388.0" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">ВАЖКО — одноплатник + GPU</text>
<text x="210" y="408.0" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">лише з потужним чипом</text>
<text x="380" y="366" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• нейромережа-детектор, інференс (49.7)</text>
<text x="380" y="386" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• сегментація, багато класів</text>
<text x="380" y="406" font-size="9.4" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• усе, де треба «навчена» загальність</text>
</svg>
