<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Драбина заліза: від мікроконтролера до бортового комп'ютера</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">МК — кілобайти й мілівати (проста обробка); одноплатник (Pi) — гігабайти й вати; + прискорювач — нейромережі</text>
<rect x="60" y="106" width="840" height="112" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.8"/>
<rect x="60" y="106" width="256" height="112" rx="11" fill="#cc0000" fill-opacity="0.13" stroke="none" stroke-width="1.6"/>
<text x="188" y="146" font-size="11.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">МІКРОКОНТРОЛЕР (МК)</text>
<text x="188" y="166" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">STM32 / ESP32 · політний контролер</text>
<text x="188" y="192" font-size="8.6" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">КБ пам'яті · МГц · мілівати · без ОС</text>
<text x="338" y="152" font-size="9.8" fill="#15803d" text-anchor="start" font-weight="bold" font-style="normal">✓ поріг, колірна пляма, лінія, малий Собель</text>
<text x="338" y="182" font-size="9.8" fill="#cc0000" text-anchor="start" font-weight="normal" font-style="normal">✗ нейромережі, Канні на HD, великі кадри</text>
<rect x="60" y="227" width="840" height="112" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<rect x="60" y="227" width="256" height="112" rx="11" fill="#d98a00" fill-opacity="0.13" stroke="none" stroke-width="1.6"/>
<text x="188" y="267" font-size="11.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">ОДНОПЛАТНИК (Pi)</text>
<text x="188" y="287" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Raspberry Pi · Linux</text>
<text x="188" y="313" font-size="8.6" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">ГБ пам'яті · ГГц, кілька ядер · вати</text>
<text x="338" y="273" font-size="9.8" fill="#15803d" text-anchor="start" font-weight="bold" font-style="normal">✓ повні конвеєри: Канні, Хаф, контури, шаблон</text>
<text x="338" y="303" font-size="9.8" fill="#cc0000" text-anchor="start" font-weight="normal" font-style="normal">~ нейромережі — повільно без прискорювача</text>
<rect x="60" y="348" width="840" height="112" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<rect x="60" y="348" width="256" height="112" rx="11" fill="#0a8f3c" fill-opacity="0.13" stroke="none" stroke-width="1.6"/>
<text x="188" y="388" font-size="11.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">SBC + ПРИСКОРЮВАЧ</text>
<text x="188" y="408" font-size="8.6" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Jetson · Coral TPU · NPU</text>
<text x="188" y="434" font-size="8.6" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">GPU / NPU — згортки гуртом · десятки ват</text>
<text x="338" y="394" font-size="9.8" fill="#15803d" text-anchor="start" font-weight="bold" font-style="normal">✓ нейромережі-детектори в реальному часі (49.7)</text>
<text x="338" y="424" font-size="9.8" fill="#cc0000" text-anchor="start" font-weight="normal" font-style="normal">− найважче, найгарячіше, найдорожче</text>
</svg>
