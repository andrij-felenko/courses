<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Як улізти в бюджет — і де що крутити</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">здешевлюй (менший кадр, сіре, ROI, пропуск кадрів + трекінг, квантування) і правильно розподіляй обчислення</text>
<rect x="50" y="104" width="400" height="300" rx="12" fill="#fbfbfd" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="250" y="128" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ЯК ЗДЕШЕВИТИ ЗІР</text>
<text x="72" y="158" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• менший кадр — менше пікселів рахувати</text>
<text x="72" y="186" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• сіре: 1 канал замість 3 (49.1)</text>
<text x="72" y="214" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• ROI: обробляй лише потрібну ділянку</text>
<text x="72" y="242" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• пропускай кадри: детектор зрідка,</text>
<text x="72" y="270" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  між ним — легкий трекер (49.8)</text>
<text x="72" y="298" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• квантована / мала модель (49.7)</text>
<text x="72" y="326" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• НАЙДЕШЕВШИЙ метод спершу: класика</text>
<text x="72" y="354" font-size="9.6" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  (49.6) перед нейромережею (49.7)</text>
<rect x="490" y="104" width="420" height="300" rx="12" fill="#fbfbfd" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="700" y="128" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">ДЕ ЩО КРУТИТИ</text>
<rect x="540" y="150" width="320" height="52" rx="9" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.5"/>
<text x="700" y="170" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Політний контролер (МК)</text>
<text x="700" y="188" font-size="8.4" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">політ, стабілізація — НЕ зір</text>
<rect x="540" y="232" width="320" height="52" rx="9" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.5"/>
<text x="700" y="252" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Бортовий комп'ютер (Pi / Jetson)</text>
<text x="700" y="270" font-size="8.4" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">зір: детектор, трекінг (49.1–49.8)</text>
<rect x="540" y="314" width="320" height="52" rx="9" fill="#f4f4f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.5"/>
<text x="700" y="334" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Земля / хмара</text>
<text x="700" y="352" font-size="8.4" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">найважче — та з лагом мережі (48.6)</text>
<line x1="700" y1="232" x2="700" y2="204" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="706" y="220" font-size="7.6" fill="#1f4ed8" text-anchor="start" font-weight="normal" font-style="normal">кут (MAVLink, 49.8)</text>
<line x1="700" y1="314" x2="700" y2="286" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="3,2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="480.0" y="458" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Right-size: не став Jetson, де досить порога на МК — і не проси в МК нейромережі. Кожній задачі — своє залізо.</text>
</svg>
