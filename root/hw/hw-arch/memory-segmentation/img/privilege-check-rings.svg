<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правила перевірки привілеїв і кільця захисту</text>
<text x="480.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія кілець захисту та перевірка привілеїв DPL / CPL / RPL</text>
<circle cx="240.0" cy="280.0" r="200.0" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<circle cx="240.0" cy="280.0" r="140.0" fill="#fff2df" stroke="#333333" stroke-width="1.5"/>
<circle cx="240.0" cy="280.0" r="80.0" fill="#fdecea" stroke="#333333" stroke-width="1.5"/>
<text x="240.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Ring 3: Застосунки (User Mode)</text>
<text x="240.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle">Ring 1..2: Драйвери / Служби</text>
<text x="240.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Ring 0:
Ядро (Kernel)</text>
<rect x="480.0" y="75.0" width="450.0" height="410.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="705.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратні правила доступу IA-32:</text>
<rect x="550.8" y="125.9" width="308.4" height="88.2" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="705.0" y="145.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">1. Доступ до сегмента даних (DS, ES, SS):</tspan><tspan x="705.0" dy="14.3">Діє правило: max(CPL, RPL) &lt;= DPL</tspan><tspan x="705.0" dy="14.3">CPL (поточний код) і RPL (селектор) мають бути</tspan><tspan x="705.0" dy="14.3">не менш привілейованими, ніж дескриптор даних.</tspan><tspan x="705.0" dy="14.3">Порушення -&gt; Генеральний збій захисту (#GP).</tspan></text>
<rect x="522.6" y="238.1" width="364.8" height="73.9" rx="6" fill="#fff2df" stroke="#d97706" stroke-width="1.5"/><text x="705.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">2. Прямий перехід на код (JMP / CALL):</tspan><tspan x="705.0" dy="14.3">Для звичайного сегмента: CPL == DPL (той самий рівень).</tspan><tspan x="705.0" dy="14.3">Для підпорядкованого (Conforming): CPL &gt;= DPL</tspan><tspan x="705.0" dy="14.3">(код виконується без зміни CPL викликача).</tspan></text>
<rect x="538.2" y="350.9" width="333.5" height="88.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="705.0" y="370.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">3. Міжрівневий виклик через Call Gate:</tspan><tspan x="705.0" dy="14.3">Ring 3 викликає шлюз з Gate.DPL = 3.</tspan><tspan x="705.0" dy="14.3">Шлюз вказує на цільовий сегмент Ring 0.</tspan><tspan x="705.0" dy="14.3">CPU автоматично перемикає стек на стек ядра з TSS,</tspan><tspan x="705.0" dy="14.3">копіює параметри і підвищує CPL 3 -&gt; 0.</tspan></text>
</svg>