<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сегментація в x86-64 Long Mode</text>
<text x="490.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сегментація в x86-64 Long Mode: фіксація нуля та збереження FS/GS</text>
<rect x="40.0" y="75.0" width="420.0" height="410.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="250.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Регістри CS, DS, ES, SS у 64-біт:</text>
<rect x="120.3" y="148.4" width="259.4" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="168.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Апаратне ігнорування бази:</tspan><tspan x="250.0" dy="15.6">База примусово = 0x0000000000000000</tspan><tspan x="250.0" dy="15.6">Перевірку Limit вимкнено залізом</tspan></text>
<rect x="89.5" y="273.1" width="321.0" height="73.9" rx="6" fill="#fff2df" stroke="#d97706" stroke-width="1.5"/><text x="250.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Залишкове використання CS:</tspan><tspan x="250.0" dy="14.3">• L-біт (Long Mode): 64-біт vs 32-біт сумісність</tspan><tspan x="250.0" dy="14.3">• DPL / CPL: Поточне кільце (Ring 0 vs 3)</tspan><tspan x="250.0" dy="14.3">DS, ES, SS селектори здебільшого ігноруються</tspan></text>
<rect x="83.1" y="397.4" width="333.7" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="416.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Результат: абсолютно плоский 64-бітний простір</tspan><tspan x="250.0" dy="14.3">без сегментного накладного тягаря</tspan></text>
<rect x="500.0" y="75.0" width="440.0" height="410.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="720.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Виняток: регістри FS та GS (MSR-база):</text>
<rect x="575.2" y="153.1" width="289.6" height="73.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="172.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Регістр FS: Простір користувача (TLS)</tspan><tspan x="720.0" dy="14.3">MSR IA32_FS_BASE (0xC0000100)</tspan><tspan x="720.0" dy="14.3">Вказує на Thread-Local Storage потоку</tspan><tspan x="720.0" dy="14.3">fs:0x28 -&gt; Stack Canary (__stack_chk_guard)</tspan></text>
<rect x="550.1" y="278.1" width="339.8" height="73.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="720.0" y="297.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Регістр GS: Простір ядра (Per-CPU Data)</tspan><tspan x="720.0" dy="14.3">MSR IA32_GS_BASE (0xC0000101)</tspan><tspan x="720.0" dy="14.3">MSR IA32_KERNEL_GS_BASE (0xC0000102)</tspan><tspan x="720.0" dy="14.3">Вказує на структуру CPU: current task_struct, стеки</tspan></text>
<rect x="498.6" y="390.2" width="442.8" height="59.6" rx="6" fill="#fff2df" stroke="#d97706" stroke-width="1.5"/><text x="720.0" y="409.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Інструкція swapgs:</tspan><tspan x="720.0" dy="14.3">Миттєвий атомарний обмін бази GS під час syscall / переривання</tspan><tspan x="720.0" dy="14.3">Ядро миттєво отримує доступ до своєї структури CPU!</tspan></text>
</svg>