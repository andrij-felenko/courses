<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат станів комірки I-структури (I-Structure Memory Cell)</text>
<rect x="40.0" y="80.0" width="200.0" height="110.0" rx="8" fill="#f3f4f6" stroke="#333333" stroke-width="1.5"/>
<text x="140.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">EMPTY (Порожньо)</text>
<text x="140.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Комірка ініціалізована</text>
<text x="140.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Даних немає</text>
<text x="140.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Черга читачів порожня</text>
<rect x="310.0" y="80.0" width="220.0" height="110.0" rx="8" fill="#fef6e7" stroke="#d97706" stroke-width="1.5"/>
<text x="420.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700">DEFERRED (Очікування)</text>
<text x="420.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Читачі прийшли раніше запису</text>
<text x="420.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Список продовжень (Continuations)</text>
<text x="420.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle" font-weight="700">⟨Tag_reader, IP_dest⟩ у черзі</text>
<rect x="590.0" y="80.0" width="190.0" height="110.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="685.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">PRESENT (Записано)</text>
<text x="685.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Значення збережено</text>
<text x="685.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Незмінне (Single-assignment)</text>
<text x="685.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Читання віддає результат</text>
<line x1="240.0" y1="120.0" x2="310.0" y2="120.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="275.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">READ</text>
<text x="275.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Додати в чергу</text>
<line x1="530.0" y1="120.0" x2="590.0" y2="120.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="560.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">WRITE</text>
<text x="560.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Розбудити всіх</text>
<line x1="140.0" y1="80.0" x2="140.0" y2="50.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="140.0" y1="50.0" x2="685.0" y2="50.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="685.0" y1="50.0" x2="685.0" y2="80.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="410.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">WRITE (запис до прибуття читачів) → прямий перехід у PRESENT</text>
<line x1="730.0" y1="190.0" x2="730.0" y2="230.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="730.0" y1="230.0" x2="650.0" y2="230.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="650.0" y1="230.0" x2="650.0" y2="190.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="690.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">READ → миттєва відповідь</text>
<rect x="40.0" y="240.0" width="490.0" height="80.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.2"/>
<text x="285.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Виняткова ситуація: подвійний запис (Duplicate Write Trap)</text>
<text x="285.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Повторний WRITE у стан PRESENT порушує інваріант одноразового присвоєння</text>
<text x="285.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Апаратура генерує переривання/виняток, гарантуючи детермінізм програми</text>
</svg>