<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="910.0" height="470.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний частотомір: стробування лічильника імпульсів через TRGO</text>
<rect x="50.0" y="85.0" width="370.0" height="240.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="235.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Master Timer (TIM2) — База часу (Gate Time)</text>
<rect x="90.8" y="144.1" width="108.3" height="41.9" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="145.0" y="162.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Кварцовий такт</tspan><tspan x="145.0" dy="12.3">84 МГц (±5 ppm)</tspan></text>
<line x1="205.0" y1="165.0" x2="255.0" y2="165.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="267.9" y="144.1" width="114.2" height="41.9" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="325.0" y="162.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="325.0" dy="0.0">PSC = 8399</tspan><tspan x="325.0" dy="12.3">(Частота 10 кГц)</tspan></text>
<rect x="95.0" y="214.1" width="280.0" height="41.9" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/><text x="235.0" y="232.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">ARR = 9999 (Період T_gate = 1.000000 с)</tspan><tspan x="235.0" dy="12.3">CCR1 = 5000 (ШІМ 50% або строб CEN)</tspan></text>
<rect x="95.0" y="280.2" width="280.0" height="29.5" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="235.0" y="298.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">CR2.MMS = 001 (CEN) або 100 (OC1REF строб)</tspan></text>
<line x1="420.0" y1="235.0" x2="520.0" y2="235.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="470.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">TRGO (ITR1)</text>
<text x="470.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Строб t = 1.0 с</text>
<rect x="520.0" y="85.0" width="370.0" height="240.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="705.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Slave Timer (TIM3) — Лічильник імпульсів</text>
<text x="550.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">Вхід f_in (Pin ETR / TI1)</text>
<line x1="540.0" y1="170.0" x2="590.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="590.8" y="149.1" width="108.3" height="41.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="645.0" y="167.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">External Clock</tspan><tspan x="645.0" dy="12.3">(f_in ≤ 50 МГц)</tspan></text>
<line x1="695.0" y1="170.0" x2="745.0" y2="170.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="750.8" y="149.1" width="108.3" height="41.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="805.0" y="167.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">Gated Mode</tspan><tspan x="805.0" dy="12.3">SMCR.SMS = 0101</tspan></text>
<rect x="559.5" y="214.1" width="290.9" height="41.9" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="705.0" y="232.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="705.0" dy="0.0">Лічильник CNT акумулює імпульси при TRGI = '1'</tspan><tspan x="705.0" dy="12.3">За 1 секунду CNT накопичує N = f_in × 1.0</tspan></text>
<rect x="550.7" y="280.2" width="308.6" height="29.5" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="705.0" y="298.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="705.0" dy="0.0">DMA / IRQ по спаду TRGI: читання без затримок CPU</tspan></text>
<rect x="50.0" y="350.0" width="840.0" height="120.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="470.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Результат: Частота f_in = N_pulses / T_gate [Гц]</text>
<text x="80.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• 0% навантаження CPU: апаратний строб відкриває і закриває лічбу без переривань;</text>
<text x="80.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• 0 нс програмного джитеру: тривалість стробу квантована виключно стабільністю кварцу;</text>
<text x="80.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Похибка вимірювання становить ±1 імпульс (дискретність лічби) + похибка кварцу (ppm).</text>
</svg>