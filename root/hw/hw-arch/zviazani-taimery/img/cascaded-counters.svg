<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="910.0" height="470.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Каскадування двох 16-бітних таймерів у 32-бітний лічильник</text>
<rect x="50.0" y="85.0" width="360.0" height="240.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="230.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Master Timer (TIM2) — Молодші 16 біт</text>
<text x="80.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Вхідний такт CK_INT (84 МГц)</text>
<line x1="70.0" y1="170.0" x2="110.0" y2="170.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="125.0" y="149.1" width="70.0" height="41.9" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="167.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">PSC = 0</tspan><tspan x="160.0" dy="12.3">(÷1)</tspan></text>
<line x1="205.0" y1="170.0" x2="245.0" y2="170.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="254.2" y="148.5" width="131.6" height="43.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">Лічильник CNT_L</tspan><tspan x="320.0" dy="13.0">(0x0000 .. 0xFFFF)</tspan></text>
<rect x="248.2" y="214.1" width="143.7" height="41.9" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="232.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">Регістр ARR = 0xFFFF</tspan><tspan x="320.0" dy="12.3">(Період 65536 тактів)</tspan></text>
<rect x="90.0" y="275.2" width="280.0" height="29.5" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="293.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">CR2.MMS = 010 (Update Event UEV на TRGO)</tspan></text>
<line x1="410.0" y1="170.0" x2="520.0" y2="170.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="465.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">TRGO (UEV такт)</text>
<text x="465.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1 такт / 65536 імпульсів</text>
<rect x="530.0" y="85.0" width="360.0" height="240.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="710.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Slave Timer (TIM3) — Старші 16 біт</text>
<rect x="552.9" y="149.1" width="114.2" height="41.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="167.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Вхід ITR1 (TRGI)</tspan><tspan x="610.0" dy="12.3">SMCR.TS = 001</tspan></text>
<line x1="665.0" y1="170.0" x2="715.0" y2="170.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="735.0" y="149.1" width="120.0" height="41.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="795.0" y="167.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">Ext Clock Mode 1</tspan><tspan x="795.0" dy="12.3">SMCR.SMS = 111</tspan></text>
<rect x="729.2" y="213.5" width="131.6" height="43.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="795.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">Лічильник CNT_H</tspan><tspan x="795.0" dy="13.0">(0x0000 .. 0xFFFF)</tspan></text>
<line x1="795.0" y1="200.0" x2="795.0" y2="215.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="564.5" y="275.2" width="290.9" height="29.5" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="293.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Інкремент CNT_H строго за переповненням Master</tspan></text>
<rect x="50.0" y="350.0" width="840.0" height="120.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="470.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формування 32-бітного віртуального таймера: uint32_t T = (CNT_H &lt;&lt; 16) | CNT_L</text>
<text x="80.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Алгоритм атомарного захисту від гонки переповнення:</text>
<text x="80.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">1. high1 = TIM3-&gt;CNT;  2. low = TIM2-&gt;CNT;  3. high2 = TIM3-&gt;CNT;</text>
<text x="80.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">4. Якщо high1 == high2 → значення узгоджене. Якщо ні → повторити зчитування.</text>
</svg>