<text x="450.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">«Перший» тут — не одне ім'я: 801 дав ідею, Берклі й Стенфорд — робочі RISC, R2000 — продукт.</text>
