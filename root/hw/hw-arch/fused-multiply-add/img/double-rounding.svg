<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм подвійного округлення</text>
<text x="400.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Проблема подвійного округлення (Double Rounding)</text>
<line x1="80.0" y1="110.0" x2="720.0" y2="110.0" stroke="#333333" stroke-width="2.0"/>
<line x1="715.0" y1="110.0" x2="730.0" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="740.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">R</text>
<line x1="160.0" y1="95.0" x2="160.0" y2="125.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="160.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">x₀ (репрезентоване)</text>
<line x1="380.0" y1="100.0" x2="380.0" y2="120.0" stroke="#b9770e" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="380.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="middle">поріг 0.5 ULP</text>
<line x1="600.0" y1="95.0" x2="600.0" y2="125.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="600.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">x₁ (наступне число)</text>
<circle cx="370.0" cy="110.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<text x="370.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Точне значення a×b+c
(трохи ЛІВІШЕ порогу 0.5)</text>
<circle cx="390.0" cy="110.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<text x="460.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Округлений проміжний добуток round₁(a×b) + c
(помилково перескочив ПРАВОРУЧ порогу)</text>
<line x1="370.0" y1="120.0" x2="388.0" y2="112.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="368.0" y1="110.0" x2="165.0" y2="110.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="240.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">FMA: Одне округлення → x₀ (ВІРНО)</text>
<line x1="392.0" y1="110.0" x2="595.0" y2="110.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="515.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">MUL+ADD: Друге округлення → x₁ (ПОМИЛКА)</text>
<rect x="70.0" y="220.0" width="660.0" height="95.0" rx="6" fill="#fbf4e6" stroke="#b9770e" stroke-width="1.5"/><text x="400.0" y="256.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Перше округлення спотворює молодші біти й переносить значення через поріг половини розряду.</tspan><tspan x="400.0" dy="15.6">Друге округлення спирається на вже спотворену точку й вибирає хибного сусіда (+1 ULP).</tspan><tspan x="400.0" dy="15.6">FMA тримає повну мантису в акумуляторі, тому округлює один-єдиний раз прямо до x₀.</tspan></text>
</svg>