<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як з epoch дістати дату: «знімаємо шари»</text>
<text x="420.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">одне число секунд розкручують у дату, знімаючи шар за шаром</text>
<rect x="50.0" y="80.0" width="190.0" height="46.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="145.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8a6d1a" text-anchor="middle" font-weight="700">epoch (секунди)</text>
<line x1="240.0" y1="103.0" x2="290.0" y2="103.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="265.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">÷86400</text>
<rect x="290.0" y="78.0" width="230.0" height="50.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/>
<text x="405.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">дні від 1970</text>
<text x="405.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">+ залишок: секунди в добі</text>
<line x1="405.0" y1="126.0" x2="405.0" y2="158.0" stroke="#6b7280" stroke-width="2.0"/>
<rect x="290.0" y="160.0" width="230.0" height="44.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="405.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">секунди в добі →</text>
<text x="405.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">години : хвилини : секунди</text>
<line x1="520.0" y1="103.0" x2="565.0" y2="103.0" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="565.0" y="80.0" width="270.0" height="124.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
<text x="700.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">дні від 1970 →</text>
<text x="700.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">− роки (365 або 366)</text>
<text x="700.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">− місяці (28/29/30/31)</text>
<text x="700.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">= рік · місяць · день</text>
<text x="700.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">(високосні — складність)</text>
<rect x="60.0" y="236.0" width="720.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="257.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Секунди → доби й час доби; доби → роки → місяці → день.</tspan><tspan x="420.0" dy="13.7">Зворотне переведення — так само, лише в інший бік.</tspan></text>
</svg>