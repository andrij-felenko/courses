<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сумісність CPUID при живій міграції віртуальних машин між різними вузлами</text>
<rect x="40.0" y="60.0" width="270.0" height="380.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="175.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Хост A: Новий сервер</text>
<rect x="55.0" y="110.0" width="240.0" height="85.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="175.0" y="134.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Апаратний CPU: Sapphire Rapids</tspan><tspan x="175.0" dy="15.0">Підтримка: AVX-512, AMX,</tspan><tspan x="175.0" dy="15.0">AVX2, FMA, BMI2, SSE4.2</tspan><tspan x="175.0" dy="15.0">64 фізичних ядра</tspan></text>
<rect x="55.0" y="215.0" width="240.0" height="100.0" rx="6" fill="#fff7e6" stroke="#c98a00" stroke-width="1.5"/><text x="175.0" y="246.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Маскування KVM / VMM:</tspan><tspan x="175.0" dy="15.0">Профіль: x86-64-v3 (Haswell)</tspan><tspan x="175.0" dy="15.0">AVX-512 примусово приховано</tspan><tspan x="175.0" dy="15.0">AMX вимкнено в Leaf 7</tspan></text>
<rect x="55.0" y="335.0" width="240.0" height="85.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="175.0" y="359.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Стан гостя на Хості A:</tspan><tspan x="175.0" dy="15.0">Код компілюється під v3</tspan><tspan x="175.0" dy="15.0">Використовує лише AVX2/FMA</tspan><tspan x="175.0" dy="15.0">Жодних інструкцій AVX-512</tspan></text>
<rect x="650.0" y="60.0" width="270.0" height="380.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="785.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Хост B: Старіший сервер</text>
<rect x="665.0" y="110.0" width="240.0" height="85.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="785.0" y="134.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Апаратний CPU: Haswell</tspan><tspan x="785.0" dy="15.0">Підтримка: AVX2, FMA, BMI2,</tspan><tspan x="785.0" dy="15.0">SSE4.2 (БЕЗ AVX-512, БЕЗ AMX)</tspan><tspan x="785.0" dy="15.0">16 фізичних ядер</tspan></text>
<rect x="665.0" y="215.0" width="240.0" height="100.0" rx="6" fill="#fff7e6" stroke="#c98a00" stroke-width="1.5"/><text x="785.0" y="246.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">Маскування KVM / VMM:</tspan><tspan x="785.0" dy="15.0">Профіль: x86-64-v3 (Haswell)</tspan><tspan x="785.0" dy="15.0">Ідентичний набір бітів</tspan><tspan x="785.0" dy="15.0">Повний збіг таблиці CPUID</tspan></text>
<rect x="665.0" y="335.0" width="240.0" height="85.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="785.0" y="360.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">Стан гостя після міграції:</tspan><tspan x="785.0" dy="13.7">Виконання продовжується без збоїв</tspan><tspan x="785.0" dy="13.7">Немає спроб виконати AVX-512</tspan><tspan x="785.0" dy="13.7">Нуль виключень #UD</tspan></text>
<rect x="340.0" y="140.0" width="280.0" height="220.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="480.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Жива міграція (Live Migration)</text>
<rect x="355.0" y="195.0" width="250.0" height="75.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="480.0" y="214.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Перенесення RAM та vCPU:</tspan><tspan x="480.0" dy="15.0">Регістри RIP, RAX, RBX...</tspan><tspan x="480.0" dy="15.0">Стан XSAVE / XCR0</tspan><tspan x="480.0" dy="15.0">Збережена таблиця CPUID</tspan></text>
<rect x="355.0" y="285.0" width="250.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="304.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Критерій успіху:</tspan><tspan x="480.0" dy="15.0">CPUID(A) == CPUID(B)</tspan><tspan x="480.0" dy="15.0">Контракт інструкцій збережено</tspan></text>
<line x1="295.0" y1="250.0" x2="340.0" y2="250.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="620.0" y1="250.0" x2="665.0" y2="250.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="480.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Без маскування: виконання коду AVX-512 на Хості B призвело б до паніки ядра #UD (Invalid Opcode)</text>
</svg>