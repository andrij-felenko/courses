<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотирирівневий конвеєр формування CPUID для віртуальної машини</text>
<rect x="40.0" y="60.0" width="200.0" height="100.0" rx="6" fill="#fff7e6" stroke="#c98a00" stroke-width="1.5"/><text x="140.0" y="93.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">1. Фізичний кремній хоста</tspan><tspan x="140.0" dy="13.7">Апаратні можливості CPU</tspan><tspan x="140.0" dy="13.7">(Intel Core / AMD EPYC)</tspan><tspan x="140.0" dy="13.7">Реальні тригери та мікрокод</tspan></text>
<rect x="275.0" y="60.0" width="210.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="380.0" y="93.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">2. Ядро Linux (KVM)</tspan><tspan x="380.0" dy="13.7">KVM_GET_SUPPORTED_CPUID</tspan><tspan x="380.0" dy="13.7">KVM_GET_EMULATED_CPUID</tspan><tspan x="380.0" dy="13.7">Фільтрація небезпечних бітів</tspan></text>
<rect x="520.0" y="60.0" width="210.0" height="100.0" rx="6" fill="#f3e8fd" stroke="#8e44ad" stroke-width="1.5"/><text x="625.0" y="94.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">3. Простір VMM (QEMU/Cloud)</tspan><tspan x="625.0" dy="12.3">Вибір моделі (-cpu Haswell)</tspan><tspan x="625.0" dy="12.3">Маскування розширень</tspan><tspan x="625.0" dy="12.3">Синтез PV-листків (0x40000000)</tspan></text>
<rect x="765.0" y="60.0" width="160.0" height="100.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="845.0" y="94.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="845.0" dy="0.0">4. Активний vCPU</tspan><tspan x="845.0" dy="12.3">KVM_SET_CPUID2</tspan><tspan x="845.0" dy="12.3">Ізольований паспорт</tspan><tspan x="845.0" dy="12.3">Стабільний для міграції</tspan></text>
<line x1="240.0" y1="110.0" x2="275.0" y2="110.0" stroke="#c98a00" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="485.0" y1="110.0" x2="520.0" y2="110.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="730.0" y1="110.0" x2="765.0" y2="110.0" stroke="#8e44ad" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="190.0" width="885.0" height="260.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="480.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трансформація бітових прапорців у просторі VMM перед завантаженням у KVM</text>
<rect x="60.0" y="240.0" width="260.0" height="95.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="269.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Базова модель процесора</tspan><tspan x="190.0" dy="15.0">Наприклад: x86-64-v3 / Haswell</tspan><tspan x="190.0" dy="15.0">Фіксований набір інструкцій</tspan><tspan x="190.0" dy="15.0">(AVX2, FMA, BMI2, SSE4.2)</tspan></text>
<rect x="350.0" y="240.0" width="260.0" height="95.0" rx="6" fill="#fff7e6" stroke="#c98a00" stroke-width="1.5"/><text x="480.0" y="269.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Операція маскування (Політика):</tspan><tspan x="480.0" dy="15.0">Target = (Host &amp; Model) | PV_Bits</tspan><tspan x="480.0" dy="15.0">Вимикання: AVX-512, AMX, MPX</tspan><tspan x="480.0" dy="15.0">Приховування топології сокетів</tspan></text>
<rect x="640.0" y="240.0" width="265.0" height="95.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="772.5" y="269.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="772.5" dy="0.0">Спеціальні розширення безпеки:</tspan><tspan x="772.5" dy="15.0">Синтетичні прапорці захисту</tspan><tspan x="772.5" dy="15.0">IBRS, IBPB, SSBD, ARCH_CAPS</tspan><tspan x="772.5" dy="15.0">Імунітет проти Spectre/Meltdown</tspan></text>
<rect x="60.0" y="360.0" width="845.0" height="65.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="482.5" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="482.5" dy="0.0">Результат: Гість отримує однаковий паспорт CPUID незалежно від того, на якому сервері кластера запущено VM.</tspan><tspan x="482.5" dy="15.0">Це унеможливлює виникнення виключень #UD (Invalid Opcode) при живій міграції між різними поколіннями CPU.</tspan></text>
</svg>