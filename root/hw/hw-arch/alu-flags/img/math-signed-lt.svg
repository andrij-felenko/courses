<text x="380.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">d вгору → r ВІД'ЄМНЕ (N=1), але A&gt;B → «не менше»</text>
<line x1="310.0" y1="100.0" x2="104.0" y2="138.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="104.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">d за −межу</text>
<text x="380.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">d вниз → r ДОДАТНЕ (N=0), але A&lt;B → «менше»</text>
<rect x="232.3" y="334.8" width="295.3" height="74.4" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/><text x="380.0" y="358.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">без переповнення (V=0):  A&lt;B ⟺ N=1</tspan><tspan x="380.0" dy="18.2">з переповненням  (V=1):  A&lt;B ⟺ N=0</tspan><tspan x="380.0" dy="18.2">разом:  A&lt;B (знакове) ⟺ N ⊕ V</tspan></text>
