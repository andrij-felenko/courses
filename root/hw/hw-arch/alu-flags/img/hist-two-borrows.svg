<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна операція A − B, два протилежні значення переносу</text>
<text x="380.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">приклад:  5 − 3  (позики немає)     і     3 − 5  (позика є)</text>
<rect x="30.0" y="78.0" width="338.0" height="250.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/>
<text x="199.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">домовленість «борг»</text>
<text x="199.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">C = 1  ⟺  довелося позичати</text>
<rect x="46.0" y="144.0" width="306.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.1"/>
<text x="58.0" y="166.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#1a1a1a" text-anchor="start" xml:space="preserve">5 − 3 = 2   позики нема</text>
<text x="340.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">C = 0</text>
<rect x="46.0" y="188.0" width="306.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.1"/>
<text x="58.0" y="210.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#1a1a1a" text-anchor="start" xml:space="preserve">3 − 5 = −2  позичали</text>
<text x="340.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">C = 1</text>
<rect x="46.0" y="234.0" width="306.0" height="82.0" rx="6" fill="#fff5f4" stroke="#c0392b" stroke-width="1.0"/><text x="199.0" y="272.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="199.0" dy="0.0">так вважає людина з олівцем: позичив — запиши борг.</tspan><tspan x="199.0" dy="11.7">x86 · Z80 · 8080 · 68000 · 8051 · VAX</tspan></text>
<rect x="392.0" y="78.0" width="338.0" height="250.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.7"/>
<text x="561.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">домовленість «не-борг»</text>
<text x="561.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">C = 1  ⟺  позики НЕ було</text>
<rect x="408.0" y="144.0" width="306.0" height="34.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.1"/>
<text x="420.0" y="166.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#1a1a1a" text-anchor="start" xml:space="preserve">5 − 3 → 5+(~3)+1  перенос є</text>
<text x="702.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">C = 1</text>
<rect x="408.0" y="188.0" width="306.0" height="34.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.1"/>
<text x="420.0" y="210.0" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#1a1a1a" text-anchor="start" xml:space="preserve">3 − 5 → 3+(~5)+1  переносу нема</text>
<text x="702.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">C = 0</text>
<rect x="408.0" y="234.0" width="306.0" height="82.0" rx="6" fill="#f4f8ff" stroke="#2457d6" stroke-width="1.0"/><text x="561.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="561.0" dy="0.0">падає з A+(~B)+1: C — чесний перенос суматора.</tspan><tspan x="561.0" dy="13.0">6502 · ARM · PowerPC · System/360 · MSP430 · SPARC</tspan></text>
<text x="380.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">той самий біт, протилежний зміст:  борг = НЕ C.  Обидві — усталений факт, жодна не «правильніша»</text>
</svg>