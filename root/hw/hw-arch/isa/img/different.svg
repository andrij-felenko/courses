<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Різні процесори — різні мови: «додати» виглядає по-різному</text>
<text x="390.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">кожне сімейство має ВЛАСНИЙ набір інструкцій; машинний код одного для іншого — повна нісенітниця</text>
<rect x="50.0" y="92.0" width="330.0" height="104.0" rx="12" fill="#fafafa" stroke="#1f47b5" stroke-width="1.8"/>
<text x="70.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1f47b5" text-anchor="start" font-weight="700">ARM</text>
<text x="364.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-style="italic">телефони, багато МК</text>
<rect x="70.0" y="136.0" width="290.0" height="36.0" rx="6" fill="#ffffff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="215.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ADD R3, R1, R2</text>
<text x="70.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">те саме «додай R1,R2» — інша мнемоніка й ЦІЛКОМ інше число</text>
<rect x="400.0" y="92.0" width="330.0" height="104.0" rx="12" fill="#fafafa" stroke="#c0271e" stroke-width="1.8"/>
<text x="420.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0271e" text-anchor="start" font-weight="700">x86 / x86-64</text>
<text x="714.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-style="italic">ПК, ноутбуки (Intel/AMD)</text>
<rect x="420.0" y="136.0" width="290.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0271e" stroke-width="1.4"/>
<text x="565.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">add eax, ebx</text>
<text x="420.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">те саме «додай R1,R2» — інша мнемоніка й ЦІЛКОМ інше число</text>
<rect x="50.0" y="218.0" width="330.0" height="104.0" rx="12" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="70.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="700">RISC-V</text>
<text x="364.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-style="italic">відкрита ISA; нові ESP32-C</text>
<rect x="70.0" y="262.0" width="290.0" height="36.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="215.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">add x3, x1, x2</text>
<text x="70.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">те саме «додай R1,R2» — інша мнемоніка й ЦІЛКОМ інше число</text>
<rect x="400.0" y="218.0" width="330.0" height="104.0" rx="12" fill="#fafafa" stroke="#b8860b" stroke-width="1.8"/>
<text x="420.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="start" font-weight="700">AVR</text>
<text x="714.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-style="italic">8-біт Arduino Uno</text>
<rect x="420.0" y="262.0" width="290.0" height="36.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.4"/>
<text x="565.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">add r1, r2</text>
<text x="420.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">те саме «додай R1,R2» — інша мнемоніка й ЦІЛКОМ інше число</text>
<rect x="50.0" y="340.0" width="680.0" height="48.0" rx="10" fill="#fff8e8" stroke="#b8860b" stroke-width="1.6"/>
<text x="390.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тому програму КОМПІЛЮЮТЬ під конкретний процесор: код для ARM не побіжить на x86. ESP32 — Xtensa (нові — RISC-V).</text>
<text x="390.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">ISA — лінія розмежування світів софту: за нею починається «чужа мова», якої ваш процесор не розуміє.</text>
