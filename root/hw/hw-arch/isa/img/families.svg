<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Словник процесора: кілька родин примітивних команд</text>
<text x="390.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">попри тисячі програм, набір команд невеликий — кілька десятків, що групуються у чотири родини</text>
<rect x="50.0" y="90.0" width="680.0" height="66.0" rx="10" fill="#fafafa" stroke="#1f47b5" stroke-width="1.8"/>
<text x="74.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1f47b5" text-anchor="start" font-weight="700">Пересилання даних</text>
<text x="74.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">возити числа: пам'ять ↔ регістри, регістр → регістр</text>
<rect x="440.0" y="106.0" width="270.0" height="34.0" rx="6" fill="#ffffff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="575.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">LD · ST · MOV</text>
<rect x="50.0" y="170.0" width="680.0" height="66.0" rx="10" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="74.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="700">Арифметика й логіка</text>
<text x="74.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">рахувати в АЛП; виставляють прапорці</text>
<rect x="440.0" y="186.0" width="270.0" height="34.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="575.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ADD · SUB · AND · OR · XOR · SHIFT</text>
<rect x="50.0" y="250.0" width="680.0" height="66.0" rx="10" fill="#fafafa" stroke="#c0271e" stroke-width="1.8"/>
<text x="74.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0271e" text-anchor="start" font-weight="700">Керування плином</text>
<text x="74.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">стрибки й розгалуження: міняють лічильник команд PC</text>
<rect x="440.0" y="266.0" width="270.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0271e" stroke-width="1.4"/>
<text x="575.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">JMP · BEQ · BNE · CALL · RET</text>
<rect x="50.0" y="330.0" width="680.0" height="66.0" rx="10" fill="#fafafa" stroke="#b8860b" stroke-width="1.8"/>
<text x="74.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="start" font-weight="700">Порівняння / тест</text>
<text x="74.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">порівняти числа й виставити прапорці Z/N/C/V</text>
<rect x="440.0" y="346.0" width="270.0" height="34.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.4"/>
<text x="575.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">CMP · TST</text>
<text x="390.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усі великі дії — це довгі ланцюги цих дрібних команд. Опанувавши чотири родини, ви читатимете будь-який асемблер.</text>
</svg>