<text x="474.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b8860b" text-anchor="middle" font-weight="700">↑ перемикане ядро: M33 або RISC-V</text>
<rect x="40.0" y="392.0" width="360.0" height="58.0" rx="7" fill="#fff8e8" stroke="#b8860b" stroke-width="1.8"/>
<text x="54.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Для контрасту: Arduino Uno → AVR (8-біт)</text>
<text x="54.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ще одна, окрема мова — у цю карту 32-бітних ISA не лягає.</text>
<rect x="420.0" y="392.0" width="360.0" height="58.0" rx="7" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="600.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="700">Читати згори вниз, не навпаки:</text>
<text x="600.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">плата → ядро → ISA. Цільову ISA й обираєш у IDE.</text>
