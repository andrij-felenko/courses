<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія одного рядка дизасемблера: чотири колонки</text>
<text x="480.0" y="51.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">objdump показує і число-команду, і її людський «правопис» — рядок у рядок</text>
<rect x="60.0" y="90.0" width="840.0" height="56.0" rx="10" fill="#fbfbff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="92.0" y="120.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" fill="#1f47b5" text-anchor="start" font-weight="700">400d12a8:</text>
<text x="250.0" y="120.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" fill="#7a3fb0" text-anchor="start" font-weight="700">00b50533</text>
<text x="430.0" y="120.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" fill="#c0271e" text-anchor="start" font-weight="700">add</text>
<text x="540.0" y="120.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="17" fill="#1f8a3b" text-anchor="start" font-weight="700">a0, a0, a1</text>
<line x1="104.0" y1="136" x2="148.0" y2="192" stroke="#1f47b5" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70.0" y="200.0" width="156.0" height="73.0" rx="8" fill="#ffffff" stroke="#1f47b5" stroke-width="1.5"/>
<text x="148.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="700">АДРЕСА</text>
<text x="80.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">де команда лежить</text>
<text x="80.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">(сюди вказував PC)</text>
<line x1="264.0" y1="136" x2="318.0" y2="192" stroke="#7a3fb0" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="240.0" y="200.0" width="156.0" height="90.0" rx="8" fill="#ffffff" stroke="#7a3fb0" stroke-width="1.5"/>
<text x="318.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7a3fb0" text-anchor="middle" font-weight="700">БАЙТИ КОМАНДИ</text>
<text x="250.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">те саме число, що</text>
<text x="250.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">в пам'яті; декодер</text>
<text x="250.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ріже його на поля</text>
<line x1="442.0" y1="136" x2="500.0" y2="192" stroke="#c0271e" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="422.0" y="200.0" width="156.0" height="73.0" rx="8" fill="#ffffff" stroke="#c0271e" stroke-width="1.5"/>
<text x="500.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="700">МНЕМОНІКА</text>
<text x="432.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">що робити:</text>
<text x="432.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">тут — додати</text>
<text x="432.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">(opcode → дія)</text>
<line x1="552.0" y1="136" x2="790.0" y2="192" stroke="#1f8a3b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="712.0" y="200.0" width="156.0" height="73.0" rx="8" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="790.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="700">ОПЕРАНДИ</text>
<text x="722.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">над чим:</text>
<text x="722.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">a0 = a0 + a1</text>
<text x="722.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">(куди ← що, що)</text>
<rect x="60.0" y="360.0" width="840.0" height="86.0" rx="10" fill="#fafafa" stroke="#6b7280" stroke-width="1.4"/>
<text x="480.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">одна команда — три погляди</text>
<text x="120.0" y="412.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" fill="#7a3fb0" text-anchor="start" font-weight="700">0x00b50533</text>
<text x="120.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">число в пам'яті</text>
<text x="330.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start">→</text>
<text x="380.0" y="412.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" fill="#c0271e" text-anchor="start" font-weight="700">add  a0, a0, a1</text>
<text x="380.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">асемблер (мнемоніка)</text>
<text x="640.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start">→</text>
<text x="690.0" y="412.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="700">a0 = a0 + a1</text>
<text x="690.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">що це означає</text>
