<text x="390.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Ключова відмінність від MMU ядра: спершу «хто питає?» (RequesterID), і лише тоді «що перекласти?»</text>
