<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
<rect width="960" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Де це в ESP32: спеціальні периферійні блоки</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">базовий таймер дає лічбу й «будильник»; захоплення й PWM — в окремих модулях</text>
<rect x="50.0" y="100.0" width="210.0" height="150.0" rx="12" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="155.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">GP-таймер (TIMG)</text>
<line x1="66.0" y1="144.0" x2="244.0" y2="144.0" stroke="#1f47b5" stroke-width="1.2" stroke-linecap="round"/>
<text x="155.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">лічба часу, alarm</text>
<text x="155.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">періоди, millis/micros</text>
<rect x="290.0" y="100.0" width="210.0" height="150.0" rx="12" fill="#fbfcff" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="395.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">MCPWM (capture)</text>
<line x1="306.0" y1="144.0" x2="484.0" y2="144.0" stroke="#1f8a3b" stroke-width="1.2" stroke-linecap="round"/>
<text x="395.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">захоплення фронтів</text>
<text x="395.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">вимір тривалості/частоти</text>
<rect x="530.0" y="100.0" width="210.0" height="150.0" rx="12" fill="#fbfcff" stroke="#caa24a" stroke-width="1.8"/>
<text x="635.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">LEDC / MCPWM</text>
<line x1="546.0" y1="144.0" x2="724.0" y2="144.0" stroke="#caa24a" stroke-width="1.2" stroke-linecap="round"/>
<text x="635.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">порівняння → вихід</text>
<text x="635.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ШІМ, точні імпульси</text>
<rect x="770.0" y="100.0" width="210.0" height="150.0" rx="12" fill="#fbfcff" stroke="#c0271e" stroke-width="1.8"/>
<text x="875.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">PCNT</text>
<line x1="786.0" y1="144.0" x2="964.0" y2="144.0" stroke="#c0271e" stroke-width="1.2" stroke-linecap="round"/>
<text x="875.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">лічильник імпульсів</text>
<text x="875.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">рахує фронти на ніжці</text>
<rect x="120.0" y="290.0" width="720.0" height="80.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ідеї ті самі (захоплення = мітка входу, порівняння = дія на виході),</text>
<text x="480.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">та в ESP32 їх рознесено по спеціалізованих блоках замість «усе в одному таймері».</text>
<text x="480.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Для вас це означає: під задачу — свій модуль; принцип скрізь однаковий.</text>
</svg>
