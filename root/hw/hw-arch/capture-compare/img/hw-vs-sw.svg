<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380">
<rect width="940" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому апаратно: точність до тіку, а не «коли код устигне»</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">програмна реакція «пливе» від затримки переривань; апаратна — рівно в потрібну мить</text>
<rect x="50.0" y="90.0" width="410.0" height="240.0" rx="12" fill="#f3faf4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="255.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Апаратно (capture/compare)</text>
<text x="72.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">подія / дія прив'язана</text>
<text x="72.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">просто до значення лічильника</text>
<line x1="100.0" y1="210.0" x2="100.0" y2="250.0" stroke="#1f8a3b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="180.0" y1="210.0" x2="180.0" y2="250.0" stroke="#1f8a3b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="260.0" y1="210.0" x2="260.0" y2="250.0" stroke="#1f8a3b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="340.0" y1="210.0" x2="340.0" y2="250.0" stroke="#1f8a3b" stroke-width="2.4" stroke-linecap="round"/>
<text x="255.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">✓ рівні інтервали, точність до тіку</text>
<text x="255.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">✓ не залежить від зайнятості коду</text>
<rect x="480.0" y="90.0" width="410.0" height="240.0" rx="12" fill="#fdf2f2" stroke="#c0271e" stroke-width="1.8"/>
<text x="685.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Програмно (в обробнику)</text>
<text x="502.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">код міряє/смикає ніжку сам —</text>
<text x="502.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">із затримкою й джитером</text>
<line x1="530.0" y1="210.0" x2="530.0" y2="250.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<line x1="624.0" y1="210.0" x2="624.0" y2="250.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<line x1="682.0" y1="210.0" x2="682.0" y2="250.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<line x1="790.0" y1="210.0" x2="790.0" y2="250.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<text x="685.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">✗ інтервали «пливуть» (джитер)</text>
<text x="685.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">✗ збивається, коли код зайнятий</text>
<text x="470.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Для точного вимірювання й генерації сигналів захоплення/порівняння незамінні.</text>
</svg>
