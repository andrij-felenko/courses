<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
<rect width="960" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Навіщо захоплення: точно виміряти тривалість і період</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">захопи значення на двох фронтах, відніми — і знаєш тривалість із точністю до тіку</text>
<text x="64.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">сигнал</text>
<polyline points="100.0,210.0 260.0,210.0 260.0,170.0 560.0,170.0 560.0,210.0 820.0,210.0" fill="none" stroke="#1f47b5" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="260.0" cy="170.0" r="5.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="260.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">захоплення A</text>
<text x="260.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(фронт ↑)</text>
<circle cx="560.0" cy="170.0" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="560.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">захоплення B</text>
<text x="560.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(спад ↓)</text>
<line x1="260.0" y1="230.0" x2="560.0" y2="230.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="410.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ширина імпульсу = (B − A) × тік</text>
<rect x="150.0" y="290.0" width="660.0" height="70.0" rx="10" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="480.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Так апаратно міряють тривалість імпульсу, період і частоту зовнішніх сигналів:</text>
<text x="480.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ультразвуковий далекомір, тахометр, декодування сигналів — усе через захоплення.</text>
</svg>
