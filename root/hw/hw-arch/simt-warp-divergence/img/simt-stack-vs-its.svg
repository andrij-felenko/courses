<rect x="65.0" y="385.0" width="430.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="280.0" y="407.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Жорсткий порядок вичерпання стека:</tspan><tspan x="280.0" dy="14.3">поки гілка A не завершиться, гілка B не отримає жодного такту.</tspan><tspan x="280.0" dy="14.3">Неявний варп-синхронізм працював автоматично.</tspan></text>
