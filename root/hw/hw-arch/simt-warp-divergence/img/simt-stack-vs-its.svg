<rect x="605.0" y="315.0" width="390.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="800.0" y="337.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Планувальник вільно чергує інструкції різних гілок</tspan></text>
<rect x="585.0" y="385.0" width="430.0" height="65.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="800.0" y="406.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Потоки можуть чергуватися на рівні інструкцій.</tspan><tspan x="800.0" dy="15.6">Спільні змінні без __syncwarp() ламаються:</tspan><tspan x="800.0" dy="15.6">вимагає явних бар'єрів та масок збіжності.</tspan></text>
