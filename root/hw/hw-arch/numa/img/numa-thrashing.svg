<text x="110.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вся пам'ять пулу</text>
<text x="110.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">100% сторінок на Node 0</text>
<rect x="200.0" y="105.0" width="150.0" height="80.0" rx="5" fill="#eef6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="275.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Node 1 (Workers)</text>
<text x="275.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Потоки виконують</text>
<text x="275.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">запити клієнтів</text>
<line x1="235.0" y1="192.0" x2="145.0" y2="192.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="192.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Перевантаження шини UPI/IF</text>
<text x="192.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Кожен доступ з Node 1 — віддалений!</text>
<rect x="35.0" y="238.0" width="315.0" height="115.0" rx="5" fill="#fadbd6" stroke="#c0392b" stroke-width="1.0"/>
<text x="192.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Наслідки: деградація продуктивності</text>
<text x="192.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Штраф латентності пам'яті 2–3× на кожному кеш-промаху</text>
<text x="192.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• AutoNUMA сканує сторінки й викликає шторм міграцій</text>
<text x="192.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Вузол 0 вичерпує пам'ять -&gt; kswapd гальмує запити</text>
<text x="192.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Вузол 1 має вільну пам'ять, яка не використовується</text>
