<text x="567.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">2. NUMA-Aware Архітектура (Рішення)</text>
<text x="567.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Чергування сторінок або ізольовані процеси</text>
<rect x="410.0" y="105.0" width="315.0" height="68.0" rx="5" fill="#e7f7ee" stroke="#27ae60" stroke-width="1.2"/>
<text x="567.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Варіант А: Чергування (MPOL_INTERLEAVE)</text>
<text x="567.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">numactl --interleave=all ./postgres</text>
<text x="567.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Сторінки 4 КБ рівномірно діляться між вузлами</text>
<rect x="410.0" y="180.0" width="315.0" height="68.0" rx="5" fill="#e7f7ee" stroke="#27ae60" stroke-width="1.2"/>
<text x="567.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Варіант Б: Ізольовані екземпляри (Instance Pinning)</text>
<text x="567.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">numactl --cpunodebind=0 --membind=0 ./redis-server-0</text>
<text x="567.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">numactl --cpunodebind=1 --membind=1 ./redis-server-1</text>
<rect x="410.0" y="255.0" width="315.0" height="98.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="567.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Результат оптимізації:</text>
<text x="567.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">✓ Передбачувана низька затримка запитів (p99)</text>
<text x="567.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">✓ Повна утилізація пропускної здатності шин пам'яті</text>
<text x="567.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">✓ Відсутність блокувань міжвузлових лінків</text>
