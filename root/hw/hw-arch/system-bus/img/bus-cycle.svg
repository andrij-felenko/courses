<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цикл читання: адреса → вибір однієї → дані → защіпка</text>
<text x="95.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Ядро виставляє</text>
<rect x="20.0" y="90.0" width="150.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/><text x="95.0" y="134.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="95.0" dy="0.0">адреса 0x2000</tspan><tspan x="95.0" dy="15.6">керування: «читаю»</tspan></text>
<line x1="174.0" y1="138.0" x2="212.7" y2="138.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="291.7" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2. Дешифратор</text>
<rect x="216.7" y="90.0" width="150.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/><text x="291.7" y="134.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="291.7" dy="0.0">старші біти →</tspan><tspan x="291.7" dy="15.6">«вибір» одній мікр.</tspan></text>
<line x1="370.7" y1="138.0" x2="409.3" y2="138.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="488.3" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">3. Мікросхема віддає</text>
<rect x="413.3" y="90.0" width="150.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.8"/><text x="488.3" y="134.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="488.3" dy="0.0">виходить із Hi-Z,</tspan><tspan x="488.3" dy="15.6">дані на лінії</tspan></text>
<line x1="567.3" y1="138.0" x2="606.0" y2="138.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="685.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">4. Ядро защіпує</text>
<rect x="610.0" y="90.0" width="150.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/><text x="685.0" y="134.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">пауза на устій,</tspan><tspan x="685.0" dy="15.6">число всередину</tspan></text>
<rect x="60.0" y="232.0" width="660.0" height="66.0" rx="8" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.2"/>
<text x="390.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Старші біти адреси → дешифратор обирає мікросхему.</text>
<text x="390.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Молодші біти адреси → всередину обраної мікросхеми, вибирають комірку.</text>
<text x="390.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">У кожну мить відповідає рівно одна мікросхема; запис іде дзеркально — дані виставляє ядро.</text>
</svg>