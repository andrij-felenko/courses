<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура апаратного прискорювача Flash та кешу</text>
<text x="420.0" y="22.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура прискорювача Flash: буфер Prefetch, I-Cache та D-Cache (ART)</text>
<rect x="49.8" y="163.9" width="160.4" height="92.2" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2.0"/><text x="130.0" y="185.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Масив Flash</tspan><tspan x="130.0" dy="14.3">(Embedded NOR)</tspan><tspan x="130.0" dy="14.3">128-бітне слово</tspan><tspan x="130.0" dy="14.3">+ 8 біт ECC</tspan><tspan x="130.0" dy="14.3">(Час доступу ~30 нс)</tspan></text>
<rect x="240.0" y="48.0" width="340.0" height="360.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="410.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Контролер Flash (FLASH_ACR / Прискорювач ART)</text>
<rect x="268.7" y="95.5" width="282.6" height="39.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="410.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Буфер попередньої вибірки (Prefetch Buffer)</tspan><tspan x="410.0" dy="13.0">128 біт (4 інструкції Thumb-2 / 8 x 16-біт)</tspan></text>
<rect x="265.6" y="179.0" width="288.8" height="52.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="195.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Кеш інструкцій (Instruction Cache)</tspan><tspan x="410.0" dy="13.0">64 рядки x 128 біт (1 Кбайт)</tspan><tspan x="410.0" dy="13.0">Повний асоціативний пошук за тегом (0WS Hit)</tspan></text>
<rect x="268.7" y="269.0" width="282.6" height="52.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="410.0" y="285.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Кеш даних / літералів (Data Cache)</tspan><tspan x="410.0" dy="13.0">8 рядків x 128 біт (128 байтів)</tspan><tspan x="410.0" dy="13.0">Таблиці переходів, константи пулу (0WS Hit)</tspan></text>
<rect x="245.0" y="364.5" width="330.1" height="21.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/><text x="410.0" y="378.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Регістр керування FLASH_ACR (LATENCY, PRFTEN, ICEN, DCEN)</tspan></text>
<line x1="195.0" y1="170.0" x2="275.0" y2="115.0" stroke="#ea580c" stroke-width="2.0"/>
<line x1="195.0" y1="210.0" x2="275.0" y2="205.0" stroke="#ea580c" stroke-width="2.0"/>
<line x1="195.0" y1="250.0" x2="275.0" y2="295.0" stroke="#ea580c" stroke-width="2.0"/>
<text x="235.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ea580c" text-anchor="middle" font-weight="700">128 біт</text>
<rect x="650.0" y="48.0" width="150.0" height="360.0" rx="8" fill="#f1f5f9" stroke="#2457d6" stroke-width="1.8"/>
<text x="725.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Шинна матриця
та Ядро Cortex-M</text>
<rect x="681.8" y="136.0" width="86.4" height="48.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="725.0" y="150.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">I-Code Bus</tspan><tspan x="725.0" dy="13.0">(32 біти)</tspan><tspan x="725.0" dy="13.0">Вибірка коду</tspan></text>
<rect x="663.2" y="266.0" width="123.6" height="48.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="725.0" y="280.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">D-Code Bus</tspan><tspan x="725.0" dy="13.0">(32 біти)</tspan><tspan x="725.0" dy="13.0">Константи/літерали</tspan></text>
