<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Безпечний порядок зміни тактової частоти та затримок Flash</text>
<text x="420.0" y="22.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Безпечний порядок зміни тактової частоти та затримок Flash Latency</text>
<rect x="40.0" y="48.0" width="360.0" height="360.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="220.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Підвищення частоти (Розгін)</text>
<text x="220.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">16 МГц → 168 МГц (Збільшення затримки СПЕРШУ)</text>
<rect x="129.3" y="111.5" width="181.4" height="37.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/><text x="220.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">1. Збільшити затримку Flash</tspan><tspan x="220.0" dy="13.0">FLASH_ACR.LATENCY = 5WS</tspan></text>
<line x1="220.0" y1="148.5" x2="220.0" y2="165.0" stroke="#2457d6" stroke-width="1.5"/>
<rect x="113.8" y="176.5" width="212.4" height="37.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/><text x="220.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">2. Перевірити запис у FLASH_ACR</tspan><tspan x="220.0" dy="13.0">(Цикл очікування фіксації бітів)</tspan></text>
<line x1="220.0" y1="213.5" x2="220.0" y2="230.0" stroke="#2457d6" stroke-width="1.5"/>
<rect x="110.7" y="241.5" width="218.6" height="37.0" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.4"/><text x="220.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">3. Налаштувати й запустити PLL</tspan><tspan x="220.0" dy="13.0">(Очікування прапорця PLLRDY == 1)</tspan></text>
<line x1="220.0" y1="278.5" x2="220.0" y2="295.0" stroke="#2457d6" stroke-width="1.5"/>
<rect x="104.5" y="316.5" width="231.0" height="37.0" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.4"/><text x="220.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">4. Перемкнути системний такт на PLL</tspan><tspan x="220.0" dy="13.0">RCC_CFGR.SW = PLL (Очікування SWS)</tspan></text>
<rect x="440.0" y="48.0" width="360.0" height="360.0" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.5"/>
<text x="620.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9333ea" text-anchor="middle" font-weight="700">Зниження частоти (Гальмування)</text>
<text x="620.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">168 МГц → 16 МГц (Зменшення затримки НАПРИКІНЦІ)</text>
<rect x="507.6" y="111.5" width="224.8" height="37.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.4"/><text x="620.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">1. Перемкнути такт на HSI / HSE</tspan><tspan x="620.0" dy="13.0">RCC_CFGR.SW = HSI (Очікування SWS)</tspan></text>
<line x1="620.0" y1="148.5" x2="620.0" y2="165.0" stroke="#9333ea" stroke-width="1.5"/>
<rect x="504.5" y="176.5" width="231.0" height="37.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.4"/><text x="620.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">2. Вимкнути або переналаштувати PLL</tspan><tspan x="620.0" dy="13.0">RCC_CR.PLLON = 0</tspan></text>
<line x1="620.0" y1="213.5" x2="620.0" y2="230.0" stroke="#9333ea" stroke-width="1.5"/>
<rect x="532.4" y="241.5" width="175.2" height="37.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.4"/><text x="620.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">3. Зменшити затримку Flash</tspan><tspan x="620.0" dy="13.0">FLASH_ACR.LATENCY = 0WS</tspan></text>
<line x1="620.0" y1="278.5" x2="620.0" y2="295.0" stroke="#9333ea" stroke-width="1.5"/>
<rect x="507.6" y="316.5" width="224.8" height="37.0" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.4"/><text x="620.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">4. Перевірити запис у FLASH_ACR</tspan><tspan x="620.0" dy="13.0">(Фіксація 0WS для низької частоти)</tspan></text>
<rect x="40.0" y="420.0" width="760.0" height="48.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="420.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Критичне правило: Перемикання частоти без завчасного налаштування Flash Latency</text>
<text x="420.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle">спричиняє зчитування спотворених кодів інструкцій та миттєвий апаратний збій (HardFault / BusFault)!</text>
</svg>