<rect x="90.0" y="466.0" width="690.0" height="50.0" rx="6" fill="#f7f9fb" stroke="#c9d2da" stroke-width="1.5"/><text x="435.0" y="487.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="435.0" dy="0.0">Запис у власну лінію w = 1.4 нс, передача володіння t = 20 нс, r = t/w ≈ 14.</tspan><tspan x="435.0" dy="15.6">Стеля 1/(p·t) не залежить від n — за зламом ядра лише ділять ту саму лінію.</tspan></text>
