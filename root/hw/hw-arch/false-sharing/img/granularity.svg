<rect x="460.0" y="160.0" width="140.0" height="36.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="530.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">a</text>
<rect x="602.0" y="160.0" width="138.0" height="36.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="671.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">b</text>
<text x="600.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">одна кеш-лінія — 64 байти</text>
<text x="600.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">власник у кожну мить — рівно одне ядро</text>
<text x="600.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">одиниця власності = ЛІНІЯ</text>
<rect x="46.0" y="336.0" width="708.0" height="74.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="400.0" y="361.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Дві незалежні змінні опинилися в межах однієї лінії —</tspan><tspan x="400.0" dy="15.6">і апаратура оформлює власність на них РАЗОМ, як на один об'єкт.</tspan><tspan x="400.0" dy="15.6">Ядра починають ділити те, чого програма не ділила: це й є хибне спільне.</tspan></text>
</svg>