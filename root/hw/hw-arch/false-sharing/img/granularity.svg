<rect x="238.0" y="150.0" width="124.0" height="46.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="176.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">лічильник b</tspan></text>
<text x="205.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">дві окремі змінні,</text>
<text x="205.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">жодного спільного байта</text>
<text x="205.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">одиниця незалежності = ЗМІННА</text>
<text x="600.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Як бачить ЗАЛІЗО</text>
<text x="500.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">потік A</text>
<text x="700.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">потік B</text>
<line x1="505.0" y1="126.0" x2="560.0" y2="148.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
