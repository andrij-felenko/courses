<text x="390.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обрив живлення раніше — читач бачить старий цілий слот; пізніше — новий цілий; напівстану нема ніде.</text>
