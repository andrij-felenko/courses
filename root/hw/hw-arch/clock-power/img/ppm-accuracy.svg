<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що таке ppm і чому радіо потребує саме кварц</text>
<text x="460.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">точність задає дрейф часу — і чи зможе чіп узагалі під'єднатися до Wi-Fi</text>
<text x="70.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">джерело такту</text>
<text x="410.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">точність</text>
<text x="590.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">дрейф за добу</text>
<text x="800.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">радіо?</text>
<line x1="50.0" y1="112.0" x2="870.0" y2="112.0" stroke="#e4e4e4" stroke-width="1.4"/>
<rect x="50.0" y="136.0" width="820.0" height="48.0" rx="8" fill="#fbecec" stroke="#c0392b" stroke-width="1.6"/>
<text x="70.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Внутрішній RC</text>
<text x="410.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">±1–2 % (~10 000 ppm)</text>
<text x="590.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">хвилини / день</text>
<text x="800.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">неможливе</text>
<rect x="50.0" y="194.0" width="820.0" height="48.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="70.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Кварц (crystal)</text>
<text x="410.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">±10–20 ppm</text>
<text x="590.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">≈ 1 с / день</text>
<text x="800.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">працює</text>
<rect x="50.0" y="252.0" width="820.0" height="48.0" rx="8" fill="#e9eefb" stroke="#2457d6" stroke-width="1.6"/>
<text x="70.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">TCXO (з компенсацією)</text>
<text x="410.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">±1–2 ppm</text>
<text x="590.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">≈ 0.1 с / день</text>
<text x="800.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">найкраще</text>
<rect x="120.0" y="330.0" width="680.0" height="50.0" rx="6" fill="#fdf6e3" stroke="#b9851f" stroke-width="1.4"/><text x="460.0" y="351.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Wi-Fi/BT вимагають ≈ ±25 ppm і кращої — тому RC не годиться, потрібен кварц.</tspan><tspan x="460.0" dy="14.3">Саме радіо й диктує 40 МГц як опорну частоту (CPU 240 МГц робить PLL із неї).</tspan></text>
</svg>