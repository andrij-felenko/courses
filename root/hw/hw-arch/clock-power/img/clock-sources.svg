<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки береться такт: внутрішній RC, кварц і множення PLL</text>
<text x="450.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">вибір між дешевизною й точністю</text>
<rect x="40.0" y="84.0" width="250.0" height="150.0" rx="6" fill="#fbfbfb" stroke="#6b7280" stroke-width="2.0"/>
<text x="165.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішній RC</text>
<path d="M 92,146 q 12,-20 24,0 q 12,20 24,0 q 12,-20 24,0" fill="none" stroke="#6b7280" stroke-width="2"/>
<text x="165.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">усередині чипа · миттєвий старт</text>
<text x="165.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дешево, без зовнішніх деталей</text>
<text x="165.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">неточно: ±1–5 %</text>
<rect x="325.0" y="84.0" width="250.0" height="150.0" rx="6" fill="#fbfbfb" stroke="#2457d6" stroke-width="2.0"/>
<text x="450.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Кварцовий резонатор</text>
<line x1="420.0" y1="134.0" x2="420.0" y2="162.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="428.0" y="132.0" width="44.0" height="32.0" rx="0" fill="#eef3ff" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="480.0" y1="134.0" x2="480.0" y2="162.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="450.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">зовнішня деталь (кристалик)</text>
<text x="450.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">повільніший старт, трохи дорожче</text>
<text x="450.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">дуже точно: ±10–50 ppm</text>
<rect x="610.0" y="84.0" width="250.0" height="150.0" rx="6" fill="#fbfbfb" stroke="#cfcfcf" stroke-width="2.0"/>
<text x="735.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">PLL — множник частоти</text>
<rect x="628.0" y="140.0" width="84.0" height="40.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="670.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">кварц</text>
<text x="670.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">40 МГц</text>
<rect x="742.0" y="140.0" width="50.0" height="40.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="767.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">×12</text>
<line x1="712.0" y1="160.0" x2="740.0" y2="160.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="628.0" y="192.0" width="164.0" height="30.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="710.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ядро 240 МГц</text>
<line x1="767.0" y1="180.0" x2="720.0" y2="192.0" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="120.0" y="270.0" width="660.0" height="36.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/><text x="450.0" y="292.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Більшість МК мають і внутрішній RC, і вхід для кварцу — джерело обирають під задачу.</tspan></text>
</svg>