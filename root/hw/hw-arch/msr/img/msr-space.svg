<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Простір MSR: паралельний світ апаратної конфігурації x86</text>
<text x="420.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">відокремлений від загальних регістрів та адресного простору пам'яті</text>
<rect x="40.0" y="72.0" width="330.0" height="290.0" rx="8" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.8"/>
<text x="205.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="700">Архітектурні регістри процесора</text>
<text x="205.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">прямо закодовані в опкодах інструкцій</text>
<rect x="55.0" y="130.0" width="300.0" height="68.0" rx="6" fill="#ffffff" stroke="#1f47b5" stroke-width="1.2"/>
<text x="205.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Загального призначення (GPR)</text>
<text x="205.0" y="168.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="10" fill="#1a1a1a" text-anchor="middle">RAX, RBX, RCX, RDX, RSI, RDI, R8..R15</text>
<text x="205.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">16 регістрів по 64 біти (обчислення та адреси)</text>
<rect x="55.0" y="208.0" width="300.0" height="68.0" rx="6" fill="#ffffff" stroke="#1f47b5" stroke-width="1.2"/>
<text x="205.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Керуючі регістри (Control Registers)</text>
<text x="205.0" y="246.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="700">CR0, CR2, CR3, CR4, CR8</text>
<text x="205.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Режими MMU, пейджинг, захист (MOV CRn, Reg)</text>
<rect x="55.0" y="286.0" width="300.0" height="64.0" rx="6" fill="#ffffff" stroke="#1f47b5" stroke-width="1.2"/>
<text x="205.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="700">Вузьке місце кодування</text>
<text x="205.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Кожен новий CR вимагає фіксованого місця в ISA</text>
<text x="205.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Неможливо вмістити тисячі мікроархітектурних ручок</text>
<rect x="470.0" y="72.0" width="330.0" height="290.0" rx="8" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="635.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="700">Простір регістрів MSR (Ring 0)</text>
<text x="635.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">адресується 32-бітним числовим індексом</text>
<rect x="485.0" y="130.0" width="300.0" height="220.0" rx="6" fill="#ffffff" stroke="#1f8a3b" stroke-width="1.2"/>
<text x="500.0" y="154.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="10" fill="#1a1a1a" text-anchor="start">0x00000010: IA32_TIME_STAMP_COUNTER</text>
<text x="500.0" y="174.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="10" fill="#1a1a1a" text-anchor="start">0x000001A0: IA32_MISC_ENABLE</text>
<text x="500.0" y="194.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="10" fill="#1a1a1a" text-anchor="start">0x00000606: MSR_RAPL_POWER_UNIT</text>
<text x="500.0" y="214.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="700">0xC0000080: IA32_EFER (Long Mode, NXE)</text>
<text x="500.0" y="234.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="700">0xC0000082: IA32_LSTAR (SYSCALL RIP)</text>
<text x="500.0" y="254.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="700">0xC0000101: IA32_GS_BASE (TLS / Per-CPU)</text>
<text x="500.0" y="274.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="700">0xC0000102: IA32_KERNEL_GS_BASE</text>
<text x="500.0" y="294.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">  ... 2³² можливих 64-бітних комірок ...</text>
<text x="500.0" y="314.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="10" fill="#6b7280" text-anchor="start">0xFFFFFFFF: Максимальний індекс</text>
<text x="635.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="700">Кожен MSR має фіксовану ширину 64 біти</text>
<rect x="385.0" y="160.0" width="70.0" height="114.0" rx="6" fill="#fff8e8" stroke="#b8860b" stroke-width="1.5"/>
<text x="420.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700">Шлюз</text>
<text x="420.0" y="204.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">RDMSR</text>
<text x="420.0" y="224.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">WRMSR</text>
<text x="420.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">ECX</text>
<text x="420.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">EDX:EAX</text>
<line x1="370.0" y1="200.0" x2="385.0" y2="200.0" stroke="#b8860b" stroke-width="2.0"/>
<line x1="455.0" y1="200.0" x2="470.0" y2="200.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="470.0" y1="230.0" x2="455.0" y2="230.0" stroke="#b8860b" stroke-width="2.0"/>
<line x1="385.0" y1="230.0" x2="370.0" y2="230.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="376.0" width="760.0" height="68.0" rx="8" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="420.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">MSR створюють масштабований простір конфігурації без спотворення системи команд (ISA).</text>
<text x="420.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Звертання не чіпає фізичну пам'ять і не використовує кеш: дані передаються внутрішньою шиною ядра.</text>
<text x="420.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-style="italic">Доступ дозволено виключно в режимі ядра (Ring 0 / CPL = 0); спроба в Ring 3 генерує виняток #GP(0).</text>
</svg>