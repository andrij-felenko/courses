<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія команд RDMSR та WRMSR</text>
<text x="420.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">протокол передачі 64-бітного значення через регістрову пару EDX:EAX</text>
<rect x="290.0" y="72.0" width="260.0" height="60.0" rx="8" fill="#f7f4fb" stroke="#6b4fa0" stroke-width="1.8"/>
<text x="420.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b4fa0" text-anchor="middle" font-weight="700">Регістр ECX (32 біти)</text>
<text x="420.0" y="114.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="11" fill="#1a1a1a" text-anchor="middle">Номер MSR (напр. 0xC0000080)</text>
<line x1="420.0" y1="132.0" x2="420.0" y2="168.0" stroke="#6b4fa0" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="270.0" y="168.0" width="300.0" height="64.0" rx="8" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.6"/>
<text x="420.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="700">Апаратна перевірка привілеїв</text>
<text x="420.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">CPL == 0 (Ring 0)?</text>
<text x="420.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-style="italic">Якщо CPL &gt; 0 → Генерація винятку #GP(0)</text>
<line x1="420.0" y1="232.0" x2="420.0" y2="268.0" stroke="#1f8a3b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="435.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="700">Так</text>
<rect x="60.0" y="268.0" width="720.0" height="110.0" rx="8" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="420.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="700">64-бітний цільовий MSR-регістр усередині процесорного ядра</text>
<rect x="140.0" y="304.0" width="260.0" height="44.0" rx="6" fill="#ffffff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="270.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="700">Старші 32 біти [63:32]</text>
<text x="270.0" y="338.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="10" fill="#1a1a1a" text-anchor="middle">Передаються через EDX</text>
<rect x="440.0" y="304.0" width="260.0" height="44.0" rx="6" fill="#ffffff" stroke="#1f47b5" stroke-width="1.4"/>
<text x="570.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="700">Молодші 32 біти [31:0]</text>
<text x="570.0" y="338.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="10" fill="#1a1a1a" text-anchor="middle">Передаються через EAX</text>
<text x="420.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">RDMSR: MSR → EDX:EAX  |  WRMSR: EDX:EAX → MSR (скидає конвеєр / серіалізує)</text>
<rect x="60.0" y="392.0" width="345.0" height="66.0" rx="6" fill="#fff8e8" stroke="#b8860b" stroke-width="1.4"/>
<text x="232.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b8860b" text-anchor="middle" font-weight="700">Чому EDX:EAX навіть у 64-бітному режимі?</text>
<text x="232.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Зворотна сумісність з Pentium (1993 рік).</text>
<text x="232.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Старші 32 біти RAX/RDX при RDMSR обнуляються.</text>
<rect x="435.0" y="392.0" width="345.0" height="66.0" rx="6" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.4"/>
<text x="607.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="700">Ціна інструкції WRMSR</text>
<text x="607.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">WRMSR — важка мікрокодова інструкція (100–300 тактів).</text>
<text x="607.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Вона очищує конвеєр та буфери запису (store buffers).</text>
</svg>