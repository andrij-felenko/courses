<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">По черзі → позачергово → знову по черзі</text>
<rect x="30.0" y="88.0" width="230.0" height="124.0" rx="8" fill="#eef1f4" stroke="#6b7280" stroke-width="1.6"/>
<text x="145.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">ВХІД — по черзі</text>
<text x="145.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">вибірка · декодування ·</tspan><tspan x="145.0" dy="12.5">перейменування · видача</tspan><tspan x="145.0" dy="12.5">в чергу</tspan></text>
<rect x="300.0" y="88.0" width="240.0" height="124.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="420.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ВІКНО — позачергово</text>
<text x="420.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">станції очікування:</tspan><tspan x="420.0" dy="12.5">команда стартує, ЩОЙНО</tspan><tspan x="420.0" dy="12.5">готові її дані —</tspan><tspan x="420.0" dy="12.5">будь-яка, будь-коли</tspan></text>
<rect x="570.0" y="88.0" width="200.0" height="124.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="670.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ВИХІД — по черзі</text>
<text x="670.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">буфер упорядкування (ROB):</tspan><tspan x="670.0" dy="12.5">результати «оприлюднюють»</tspan><tspan x="670.0" dy="12.5">строго за програмою</tspan></text>
<line x1="260.0" y1="150.0" x2="300.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="540.0" y1="150.0" x2="570.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Ззовні порядок збережено; всередині — воля. Це і є весь фокус.</text>
</svg>