<text x="148.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">струм: ~0.8 мА</text>
<text x="148.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">живе: SRAM ціла; такти ядер стоять; RTC</text>
<text x="688.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">зберігається</text>
<rect x="154.0" y="241.0" width="546.0" height="62.0" rx="6" fill="#d6eaf8" stroke="#2457d6" stroke-width="2.5"/>
<text x="166.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">DEEP-SLEEP</text>
<text x="166.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">струм: ~6–10 мкА</text>
<text x="166.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">живе: лише RTC-домен + ULP</text>
<text x="688.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">перезапуск!</text>
