<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драбина сну ESP32: глибше = менший струм, але дорожче прокидання</text>
<rect x="100.0" y="55.0" width="600.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
<text x="112.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">ACTIVE</text>
<text x="112.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">струм: ~95–240 мА</text>
<text x="112.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">живе: всі ядра + радіо + SRAM</text>
<text x="688.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">повний</text>
<rect x="118.0" y="117.0" width="582.0" height="62.0" rx="6" fill="#fdf2e9" stroke="#e67e22" stroke-width="2.5"/>
<text x="130.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e67e22" text-anchor="start" font-weight="700">MODEM-SLEEP</text>
<text x="130.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">струм: ~20–68 мА</text>
<text x="130.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">живе: ядра + SRAM; радіо спить між TX</text>
<text x="688.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">повний</text>
