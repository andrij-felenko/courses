<rect x="166.9" y="367.5" width="486.2" height="27.0" rx="6" fill="#f0f0f0" stroke="#6b7280" stroke-width="1.2"/><text x="410.0" y="384.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Що глибше — то менший струм, але то більше вимкнено і то дорожче прокидання</tspan></text>
