<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія пам'яті та розміщення тензорів в ESP32-S3</text>
<rect x="40.0" y="30.0" width="800.0" height="100.0" rx="10" fill="#fdfefe" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="440.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двоядерний Xtensa LX7 (Ядро 0 / Ядро 1) — Обчислювальний рівень</text>
<rect x="60.0" y="64.0" width="350.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="235.0" y="87.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Ядро 0: 32 КБ L1 I-Cache + 32/64 КБ D-Cache</tspan><tspan x="235.0" dy="13.7">Прямий доступ до SRAM за 1 такт (~4.16 нс)</tspan></text>
<rect x="470.0" y="64.0" width="350.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="645.0" y="87.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">Ядро 1: 32 КБ L1 I-Cache + 32/64 КБ D-Cache</tspan><tspan x="645.0" dy="13.7">Паралельний інференс або мережевий стек</tspan></text>
<rect x="40.0" y="160.0" width="800.0" height="165.0" rx="10" fill="#e3f2fd" stroke="#64b5f6" stroke-width="2.0"/>
<text x="190.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1565c0" text-anchor="middle" font-weight="700">Внутрішня SRAM (512 КБ) — Швидка оперативна пам'ять</text>
<rect x="60.0" y="196.0" width="235.0" height="115.0" rx="6" fill="#ffffff" stroke="#64b5f6" stroke-width="1.4"/><text x="177.5" y="237.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="177.5" dy="0.0">Тензори активацій (Tensor Arena):</tspan><tspan x="177.5" dy="13.0">• Вхідні/вихідні матриці шарів</tspan><tspan x="177.5" dy="13.0">• Робочі scratchpad-буфери</tspan><tspan x="177.5" dy="13.0">• Повністю в SRAM (без stall-затримок)</tspan></text>
<rect x="315.0" y="196.0" width="250.0" height="115.0" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="1.6"/><text x="440.0" y="237.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Подвійна буферизація ваг (Ping-Pong):</tspan><tspan x="440.0" dy="13.0">• Буфер A: розрахунок шару N (SIMD)</tspan><tspan x="440.0" dy="13.0">• Буфер B: DMA-підкачування шару N+1</tspan><tspan x="440.0" dy="13.0">• Перемикання без простою процесора</tspan></text>
<rect x="585.0" y="196.0" width="235.0" height="115.0" rx="6" fill="#ffffff" stroke="#64b5f6" stroke-width="1.4"/><text x="702.5" y="237.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="702.5" dy="0.0">Критичні ваги моделі:</tspan><tspan x="702.5" dy="13.0">• Ваги 1×1 згорток і перших шарів</tspan><tspan x="702.5" dy="13.0">• Таблиці квантування (LUT)</tspan><tspan x="702.5" dy="13.0">• Векторні дескриптори</tspan></text>
<rect x="40.0" y="360.0" width="800.0" height="115.0" rx="10" fill="#fbe9e7" stroke="#ff8a65" stroke-width="2.0"/>
<text x="210.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d84315" text-anchor="middle" font-weight="700">Зовнішня Octal PSRAM (до 8 МБ / 16 МБ) та Octal SPI Flash</text>
<rect x="60.0" y="396.0" width="360.0" height="68.0" rx="6" fill="#ffffff" stroke="#ff8a65" stroke-width="1.3"/><text x="240.0" y="420.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Зберігання великих моделей (TFLite FlatBuffers, ESP-DL):</tspan><tspan x="240.0" dy="13.0">• Ваги згорткових і повнозв'язних шарів (мегабайти)</tspan><tspan x="240.0" dy="13.0">• Швидкість шини OPI: DDR 80/120 МГц (~400–800 МБ/с)</tspan></text>
<rect x="460.0" y="396.0" width="360.0" height="68.0" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/><text x="640.0" y="420.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Контролер GDMA (General DMA):</tspan><tspan x="640.0" dy="13.0">• Фонове перенесення блоків ваг PSRAM → SRAM</tspan><tspan x="640.0" dy="13.0">• Повне приховування латентності повільної шини</tspan></text>
<line x1="175.0" y1="130.0" x2="175.0" y2="160.0" stroke="#1565c0" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="645.0" y1="130.0" x2="645.0" y2="160.0" stroke="#1565c0" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="440.0" y1="160.0" x2="440.0" y2="130.0" stroke="#8e24aa" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="640.0" y1="360.0" x2="640.0" y2="325.0" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="440.0" y1="360.0" x2="440.0" y2="325.0" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="440.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">Ієрархія пам'яті: внутрішня SRAM для швидких активацій та фонове DMA-завантаження ваг із зовнішньої Octal PSRAM</text>
</svg>