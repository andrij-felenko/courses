<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура векторного конвеєра ESP32-S3</text>
<rect x="30.0" y="40.0" width="820.0" height="430.0" rx="12" fill="#fafafa" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="210.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ядро Xtensa LX7 (до 240 МГц) — Векторне розширення PIE</text>
<rect x="50.0" y="95.0" width="230.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">Конвеєр вибірки та декодування</tspan><tspan x="165.0" dy="13.0">• Dual-Issue розпаралелювання</tspan><tspan x="165.0" dy="13.0">• Автоінкремент вказівників (IP)</tspan><tspan x="165.0" dy="13.0">• Декодування 128-біт SIMD</tspan></text>
<rect x="320.0" y="95.0" width="250.0" height="160.0" rx="8" fill="#f3e5f5" stroke="#ba68c8" stroke-width="1.8"/>
<text x="445.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e24aa" text-anchor="middle" font-weight="700">Векторні регістри q0–q7</text>
<rect x="335.0" y="130.0" width="220.0" height="32.0" rx="6" fill="#ffffff" stroke="#ba68c8" stroke-width="1.2"/><text x="445.0" y="149.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">q0: [b15|b14|...|b1|b0]  (128 біт)</tspan></text>
<rect x="335.0" y="168.0" width="220.0" height="32.0" rx="6" fill="#ffffff" stroke="#ba68c8" stroke-width="1.2"/><text x="445.0" y="187.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">q1: [w7 |w6 |...|w1|w0]  (128 біт)</tspan></text>
<rect x="335.0" y="206.0" width="220.0" height="38.0" rx="6" fill="#ffffff" stroke="#ba68c8" stroke-width="1.2"/><text x="445.0" y="222.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">... q7: 8/16-бітні упаковані вектори</tspan><tspan x="445.0" dy="11.7">або 16 × 64-бітних підрегістрів</tspan></text>
<rect x="600.0" y="95.0" width="230.0" height="160.0" rx="8" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.8"/>
<text x="715.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e65100" text-anchor="middle" font-weight="700">SIMD MAC та АЛП (1 такт)</text>
<rect x="615.0" y="130.0" width="200.0" height="34.0" rx="6" fill="#ffffff" stroke="#ffb74d" stroke-width="1.2"/><text x="715.0" y="144.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">8 × (int8 × int8) → int32</tspan><tspan x="715.0" dy="11.7">або 4 × (int16 × int16) → int32</tspan></text>
<rect x="615.0" y="170.0" width="200.0" height="34.0" rx="6" fill="#ffffff" stroke="#ffb74d" stroke-width="1.2"/><text x="715.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Векторні логічні зсуви,</tspan><tspan x="715.0" dy="13.0">квантування, ReLU, Max/Min</tspan></text>
<rect x="615.0" y="210.0" width="200.0" height="34.0" rx="6" fill="#ffffff" stroke="#ffb74d" stroke-width="1.2"/><text x="715.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Акумулятори SAR / ACCX</tspan><tspan x="715.0" dy="13.0">(32-бітні та 40-бітні суматори)</tspan></text>
<rect x="50.0" y="290.0" width="780.0" height="160.0" rx="8" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.8"/>
<text x="180.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1565c0" text-anchor="middle" font-weight="700">Шинний інтерфейс і внутрішня SRAM (512 КБ)</text>
<rect x="70.0" y="330.0" width="210.0" height="105.0" rx="6" fill="#ffffff" stroke="#64b5f6" stroke-width="1.4"/><text x="175.0" y="358.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">128-бітне завантаження:</tspan><tspan x="175.0" dy="13.7">EE.LD.128.USAR.IP</tspan><tspan x="175.0" dy="13.7">• 16 байтів за 1 такт</tspan><tspan x="175.0" dy="13.7">• вирівнювання 16 байт</tspan><tspan x="175.0" dy="13.7">• нульовий овергед кроку</tspan></text>
<rect x="310.0" y="330.0" width="240.0" height="105.0" rx="6" fill="#ffffff" stroke="#64b5f6" stroke-width="1.4"/><text x="430.0" y="365.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Внутрішній пул тензорів (SRAM):</tspan><tspan x="430.0" dy="13.7">• Тензор активацій входу/виходу</tspan><tspan x="430.0" dy="13.7">• Scratchpad для проміжних шарів</tspan><tspan x="430.0" dy="13.7">• Без затримок кеш-промахів (1 такт)</tspan></text>
<rect x="580.0" y="330.0" width="230.0" height="105.0" rx="6" fill="#ffffff" stroke="#64b5f6" stroke-width="1.4"/><text x="695.0" y="358.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Поєднані інструкції MAC+LD:</tspan><tspan x="695.0" dy="13.7">EE.VMULA.S8.ACCX.LD.IP</tspan><tspan x="695.0" dy="13.7">• Одночасне множення вектора</tspan><tspan x="695.0" dy="13.7">та завантаження наступного блоку</tspan><tspan x="695.0" dy="13.7">• Максимальне насичення конвеєра</tspan></text>
<line x1="280.0" y1="135.0" x2="320.0" y2="135.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="570.0" y1="150.0" x2="600.0" y2="150.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="165.0" y1="175.0" x2="165.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="445.0" y1="290.0" x2="445.0" y2="255.0" stroke="#8e24aa" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="715.0" y1="255.0" x2="715.0" y2="290.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="440.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">Векторне розширення Xtensa LX7: паралельне виконання 8 операцій MAC за 1 такт через 128-бітні регістри q0–q7</text>
</svg>