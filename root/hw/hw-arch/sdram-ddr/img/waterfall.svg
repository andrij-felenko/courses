<text x="440.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">до корисного потоку доходить — грубо — близько половини піку</text>
<text x="440.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">вузьке горло — затримки й випадковий доступ, а не такт чи ширина</text>
