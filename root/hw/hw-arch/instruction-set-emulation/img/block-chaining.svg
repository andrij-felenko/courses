<rect x="70.0" y="385.0" width="800.0" height="50.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="406.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Емулятор замінює інструкцію виклику диспетчера на прямий нативний стрибок jmp у пам'яті.</tspan><tspan x="470.0" dy="15.6">Програма переходить між блоками на рівні заліза без виконання жодної інструкції емулятора.</tspan></text>
