<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 969.52 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="969.52" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтерпретація проти динамічної бінарної трансляції</text>
<text x="235.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтерпретація (Fetch-Decode-Execute)</text>
<text x="705.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Динамічна бінарна трансляція (JIT)</text>
<line x1="470.0" y1="30.0" x2="470.0" y2="490.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,5"/>
<rect x="85.0" y="75.0" width="300.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="102.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">1. Вибірка: читання байтів за PC</tspan></text>
<line x1="235.0" y1="121.0" x2="235.0" y2="147.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="85.0" y="147.0" width="300.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="174.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">2. Декодування: виділення опкоду</tspan></text>
<line x1="235.0" y1="193.0" x2="235.0" y2="219.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
