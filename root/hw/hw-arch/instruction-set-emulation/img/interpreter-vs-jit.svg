<line x1="235.0" y1="275.0" x2="235.0" y2="301.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="85.0" y="301.0" width="300.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="328.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">4. Виконання: функція-обробник команди</tspan></text>
<line x1="235.0" y1="347.0" x2="235.0" y2="373.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="85.0" y="373.0" width="300.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="400.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">5. Оновлення стану: PC = PC + len</tspan></text>
<line x1="85.0" y1="396.0" x2="45.0" y2="396.0" stroke="#c0392b" stroke-width="1.8"/>
