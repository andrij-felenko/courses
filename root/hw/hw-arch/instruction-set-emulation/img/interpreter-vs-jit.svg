<line x1="45.0" y1="98.0" x2="85.0" y2="98.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="38.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">цикл</text>
<rect x="60.0" y="442.0" width="350.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="235.0" y="461.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Накладні витрати: 15–50 інструкцій хоста</tspan><tspan x="235.0" dy="15.6">на кожну 1 гостьову команду</tspan></text>
<rect x="555.0" y="75.0" width="300.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="705.0" y="96.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Гостьовий базовий блок (Basic Block)</tspan><tspan x="705.0" dy="16.2">[послідовність до найближчого стрибка]</tspan></text>
<line x1="705.0" y1="125.0" x2="705.0" y2="153.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="555.0" y="153.0" width="300.0" height="54.0" rx="6" fill="#fff7e6" stroke="#c98a00" stroke-width="1.5"/><text x="705.0" y="176.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="705.0" dy="0.0">JIT-компілятор: трансляція блоку</tspan><tspan x="705.0" dy="15.0">[IR → оптимізація → нативний код хоста]</tspan></text>
<line x1="705.0" y1="207.0" x2="705.0" y2="235.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="555.0" y="235.0" width="300.0" height="54.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="705.0" y="258.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="705.0" dy="0.0">Кеш трансляцій (Code Cache)</tspan><tspan x="705.0" dy="16.2">[збереження скомпільованого коду TB]</tspan></text>
<line x1="705.0" y1="289.0" x2="705.0" y2="317.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="555.0" y="317.0" width="300.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="705.0" y="335.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Пряме виконання на залізі хоста</tspan><tspan x="705.0" dy="16.2">без заходу в диспетчер</tspan><tspan x="705.0" dy="16.2">(нативна швидкість конвеєра)</tspan></text>
<line x1="855.0" y1="347.0" x2="895.0" y2="347.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="895.0" y1="347.0" x2="895.0" y2="262.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="895.0" y1="262.0" x2="855.0" y2="262.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="902.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">зшивання</text>
<rect x="530.0" y="442.0" width="350.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="705.0" y="461.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Накладні витрати: 1.2–2.5 інструкцій хоста</tspan><tspan x="705.0" dy="15.6">на 1 гостьову команду в гарячому коді</tspan></text>
</svg>