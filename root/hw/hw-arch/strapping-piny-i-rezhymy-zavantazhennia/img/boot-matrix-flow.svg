<text x="685.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Завантаження образу через USB OTG / UART</text>
<text x="685.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Захист у серії: eFuse BT_FUSE_SEL = 1</text>
<text x="685.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(блокує зовнішні піни конфігурації)</text>
<rect x="570.0" y="395.0" width="230.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="685.0" y="419.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Гнучкість vs Безпека:</tspan><tspan x="685.0" dy="12.3">Для налагодження використовують</tspan><tspan x="685.0" dy="12.3">BOOT_CFG; у серійних виробах</tspan><tspan x="685.0" dy="12.3">фіксують завантаження через eFuse.</tspan></text>
