<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
<rect width="960" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ШІМ в ESP32: блок LEDC (таймер + канали)</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">задаєш частоту й роздільність (біти) — це ВЕРХ; ledcWrite задає поріг (шпаруватість)</text>
<rect x="70.0" y="100.0" width="250.0" height="120.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="195.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">таймер LEDC</text>
<text x="90.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">частота (Гц)  +</text>
<text x="90.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">роздільність (біт)</text>
<text x="195.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">→ задають ВЕРХ = 2^біт − 1</text>
<line x1="320.0" y1="150.0" x2="400.0" y2="138.0" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#aInk)"/>
<rect x="400.0" y="120.0" width="200.0" height="56.0" rx="10" fill="#fbfcff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="500.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">канал 0 → ніжка</text>
<text x="500.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ledcWrite(0, поріг)</text>
<line x1="320.0" y1="150.0" x2="400.0" y2="228.0" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#aInk)"/>
<rect x="400.0" y="210.0" width="200.0" height="56.0" rx="10" fill="#fbfcff" stroke="#caa24a" stroke-width="1.6"/>
<text x="500.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">канал 1 → ніжка</text>
<text x="500.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ledcWrite(1, поріг)</text>
<rect x="660.0" y="110.0" width="250.0" height="130.0" rx="8" fill="#0f1115" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="678" y="140" font-family="Consolas, monospace" font-size="11.5" fill="#7ee0a0">// налаштувати:</text>
<text x="678" y="162" font-family="Consolas, monospace" font-size="11.5" fill="#e8e8e8">ledcAttach(pin,</text>
<text x="678" y="182" font-family="Consolas, monospace" font-size="11.5" fill="#e8e8e8">  5000, 8); // 5кГц, 8біт</text>
<text x="678" y="208" font-family="Consolas, monospace" font-size="11.5" fill="#7ee0a0">// яскравість:</text>
<text x="678" y="228" font-family="Consolas, monospace" font-size="11.5" fill="#e8e8e8">ledcWrite(pin, 128);</text>
<rect x="150.0" y="300.0" width="660.0" height="76.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">8 біт → шкала 0…255; ledcWrite(pin, 128) ≈ 50% шпаруватості.</text>
<text x="480.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Частота й роздільність пов'язані: вища частота — менше доступних біт роздільності.</text>
<text x="480.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Усе інше — апаратно: задав раз, далі таймер формує імпульси сам.</text>
</svg>
