<rect x="267.6" y="370.0" width="384.8" height="56.0" rx="8" fill="#fffbea" stroke="#c08000" stroke-width="1.2"/><text x="460.0" y="388.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Таймер MCPWM вставляє t_dead апаратно: задаєш один раз N тіків —</tspan><tspan x="460.0" dy="13.0">залізо само тримає паузу щоразу при кожному перемиканні пари.</tspan><tspan x="460.0" dy="13.0">CPU більше не бере участі; точність — 12.5 нс на тік.</tspan></text>
