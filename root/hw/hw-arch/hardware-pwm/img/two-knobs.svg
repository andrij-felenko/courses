<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
<rect width="960" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві ручки: ВЕРХ керує частотою, поріг — шпаруватістю</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">це два окремі регістри; міняєш один — міняється одне, не зачіпаючи інше</text>
<rect x="60.0" y="90.0" width="400.0" height="230.0" rx="12" fill="none" stroke="#1f47b5" stroke-width="1.8"/>
<text x="260.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Регістр ВЕРХУ (період)</text>
<text x="82.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">скільки лічити до скиду</text>
<text x="82.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">→ задає ПЕРІОД, а отже ЧАСТОТУ</text>
<text x="82.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">більший ВЕРХ → довший період</text>
<text x="82.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">→ нижча частота</text>
<polyline points="82.0,290.0 82.0,250.0 137.0,250.0 137.0,290.0 192.0,290.0 192.0,250.0 247.0,250.0 247.0,290.0 302.0,290.0 302.0,250.0 357.0,250.0 357.0,290.0 412.0,290.0" fill="none" stroke="#1f47b5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="260.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">частота = такт / (передільник × (ВЕРХ+1))</text>
<rect x="500.0" y="90.0" width="400.0" height="230.0" rx="12" fill="none" stroke="#caa24a" stroke-width="1.8"/>
<text x="700.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a6a14" text-anchor="middle" font-weight="bold" font-style="normal">Регістр порога (compare)</text>
<text x="522.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">до якого числа ніжка увімк.</text>
<text x="522.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">→ задає ШПАРУВАТІСТЬ</text>
<text x="522.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">вищий поріг → ширший імпульс</text>
<text x="522.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">→ більше середнє</text>
<polyline points="522.0,290.0 522.0,250.0 604.5,250.0 604.5,290.0 632.0,290.0 632.0,250.0 714.5,250.0 714.5,290.0 742.0,290.0 742.0,250.0 824.5,250.0 824.5,290.0 852.0,290.0" fill="none" stroke="#caa24a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="700.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">шпаруватість = поріг / (ВЕРХ+1)</text>
<text x="480.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Частота й шпаруватість керуються НЕЗАЛЕЖНО — у цьому вся зручність апаратної ШІМ.</text>
</svg>
