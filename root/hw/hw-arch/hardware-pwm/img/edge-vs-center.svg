<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
<rect width="960" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два різновиди: крайове й центроване вирівнювання</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">крайове — лічба лише вгору; центроване — вгору-вниз, імпульс посередині періоду</text>
<rect x="50.0" y="80.0" width="410.0" height="250.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="255.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Крайове (edge-aligned)</text>
<polyline points="80.0,200.0 200.0,130.0 200.0,200.0 320.0,130.0 320.0,200.0 440.0,130.0" fill="none" stroke="#1f8a3b" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="80.0,270.0 80.0,240.0 128.0,240.0 128.0,270.0 200.0,270.0 200.0,240.0 248.0,240.0 248.0,270.0 320.0,270.0 320.0,240.0 368.0,240.0 368.0,270.0 440.0,270.0" fill="none" stroke="#1f47b5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="255.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">лічить угору й скидається; імпульс на початку</text>
<text x="255.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">проста, найпоширеніша</text>
<rect x="500.0" y="80.0" width="410.0" height="250.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="705.0" y="106.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Центроване (center-aligned)</text>
<polyline points="530.0,200.0 590.0,130.0 650.0,200.0 710.0,130.0 770.0,200.0 830.0,130.0 890.0,200.0" fill="none" stroke="#1f8a3b" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="530.0,270.0 560.0,270.0 560.0,240.0 620.0,240.0 620.0,270.0 650.0,270.0 650.0,240.0 710.0,240.0 710.0,270.0 740.0,270.0 740.0,240.0 800.0,240.0 800.0,270.0 890.0,270.0" fill="none" stroke="#1f47b5" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="705.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">лічить угору-вниз; імпульс по центру</text>
<text x="705.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">рівніша для моторів (менше гармонік)</text>
<text x="480.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Для світлодіодів байдуже; центроване беруть у точному керуванні моторами.</text>
</svg>
