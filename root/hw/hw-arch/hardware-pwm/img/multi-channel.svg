<polyline points="430.0,320.0 430.0,284.0 445.0,284.0 445.0,320.0 530.0,320.0 530.0,284.0 545.0,284.0 545.0,320.0 630.0,320.0 630.0,284.0 645.0,284.0 645.0,320.0 730.0,320.0 730.0,284.0 745.0,284.0 745.0,320.0 830.0,320.0" fill="none" stroke="#1f47b5" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="480.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Так одним блоком ШІМ керують RGB-світлодіодом (3 канали) чи кількома моторами заразом —</text>
<text x="480.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">усі з однаковою частотою, але кожен зі своєю яскравістю/швидкістю.</text>
