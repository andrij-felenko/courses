<text x="60.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e08a1e" text-anchor="start" font-weight="700">біт 1 = SG_END (0x02) — цей запис у списку останній</text>
<rect x="60.0" y="500.0" width="920.0" height="62.0" rx="8" fill="#fbfcfd" stroke="#d7dde5" stroke-width="1.4"/>
<text x="510.0" y="524.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Різні машини, різні епохи, навіть біти нумеровано в різні боки — і той самий хід:</text>
<text x="510.0" y="548.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">знайти у слові-описі вільний біт і сказати ним «це ще не кінець, бери наступний»</text>
