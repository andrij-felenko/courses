<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння схем виконання циклу: послідовна, розгорнута і Modulo Scheduling</text>
<rect x="49.6" y="45.2" width="160.8" height="39.6" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="61.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Послідовне виконання</tspan><tspan x="130.0" dy="15.6">(без перекриття)</tspan></text>
<rect x="240.0" y="50.0" width="160.0" height="32.0" rx="4" fill="#f1f5f9" stroke="#333333" stroke-width="1.2"/>
<text x="320.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ітерація 0 (5 тактів)</text>
<line x1="400.0" y1="66.0" x2="420.0" y2="66.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="420.0" y="50.0" width="160.0" height="32.0" rx="4" fill="#f1f5f9" stroke="#333333" stroke-width="1.2"/>
<text x="500.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ітерація 1 (5 тактів)</text>
<line x1="580.0" y1="66.0" x2="600.0" y2="66.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="600.0" y="50.0" width="160.0" height="32.0" rx="4" fill="#f1f5f9" stroke="#333333" stroke-width="1.2"/>
<text x="680.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ітерація 2 (5 тактів)</text>
<text x="790.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">15 тактів</text>
<line x1="40.0" y1="105.0" x2="780.0" y2="105.0" stroke="#cbd5e1" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="60.8" y="125.2" width="138.5" height="39.6" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="141.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Розгортання циклу</tspan><tspan x="130.0" dy="15.6">(Unrolling x3)</tspan></text>
<rect x="240.0" y="130.0" width="480.0" height="32.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="480.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">Об'єднане тіло: 3x Load → 3x Calc → 3x Store (тривалі затримки між стадіями)</text>
<text x="790.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="end" font-weight="700">11 тактів</text>
<line x1="40.0" y1="185.0" x2="780.0" y2="185.0" stroke="#cbd5e1" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="57.0" y="237.4" width="145.9" height="55.2" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="253.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Modulo Scheduling</tspan><tspan x="130.0" dy="15.6">(II = 1 такт,</tspan><tspan x="130.0" dy="15.6">3 стадії конвеєра)</tspan></text>
<rect x="240.0" y="210.0" width="120.0" height="110.0" rx="4" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="300.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ПРОЛОГ</text>
<text x="300.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Такт 0: Iter0 (L)</text>
<text x="300.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Такт 1: Iter0(C), Iter1(L)</text>
<text x="300.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Наповнення конвеєра</text>
<rect x="370.0" y="210.0" width="240.0" height="110.0" rx="4" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="490.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">СТАБІЛЬНЕ ЯДРО (KERNEL)</text>
<text x="490.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Щотакту (II = 1) одночасно:</text>
<text x="490.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Iter i (S) + Iter i+1 (C) + Iter i+2 (L)</text>
<text x="490.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Темп: 1 готова ітерація за такт!</text>
<rect x="620.0" y="210.0" width="120.0" height="110.0" rx="4" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="680.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ЕПІЛОГ</text>
<text x="680.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Злив конвеєра</text>
<text x="680.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Завершення</text>
<text x="680.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">останніх ітерацій</text>
<text x="797.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">N + 2 такти</text>
<text x="410.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Стабільне ядро досягає максимального завантаження функціональних блоків процесора</text>
</svg>