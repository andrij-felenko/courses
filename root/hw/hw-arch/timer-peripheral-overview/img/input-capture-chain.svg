<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тракт вхідного захоплення: фільтрація, детекція фронту, поділ та апаратна засувка</text>
<rect x="51.8" y="155.1" width="116.3" height="49.9" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="110.0" y="176.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Зовнішній пін</tspan><tspan x="110.0" dy="16.9">(TIMx_CH1)</tspan></text>
<rect x="230.0" y="147.5" width="180.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="168.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Цифровий фільтр</tspan><tspan x="320.0" dy="16.2">(IC1F[3:0] / f_DTS)</tspan><tspan x="320.0" dy="16.2">N послідовних вибірок</tspan></text>
