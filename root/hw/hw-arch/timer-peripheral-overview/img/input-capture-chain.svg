<rect x="725.0" y="147.5" width="170.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="810.0" y="168.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Вхідний дільник</tspan><tspan x="810.0" dy="16.2">(IC1PSC[1:0])</tspan><tspan x="810.0" dy="16.2">÷1, ÷2, ÷4, ÷8 подій</tspan></text>
