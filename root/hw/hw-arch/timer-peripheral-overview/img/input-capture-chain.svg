<rect x="958.1" y="335.1" width="123.7" height="49.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="1020.0" y="356.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">Лічильник CNT</tspan><tspan x="1020.0" dy="16.9">(поточний час)</tspan></text>
<line x1="1020.0" y1="329.1" x2="1020.0" y2="219.4" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1005.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end">копіювання CNT → CCR1
в апаратурі за 1 такт</text>
<rect x="110.0" y="340.0" width="750.0" height="140.0" rx="6" fill="#fdf1ef" stroke="#c0392b" stroke-width="1.4"/>
<text x="485.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Фіксація результату захоплення та статусів</text>
<rect x="130.0" y="385.0" width="710.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="485.0" y="408.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="485.0" dy="0.0">Прапорець CC1IF := 1 → запит переривання NVIC / DMA для зчитування мітки часу CCR1</tspan></text>
<rect x="130.0" y="428.0" width="710.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="485.0" y="452.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="485.0" dy="0.0">Прапорець CC1OF (Capture Overrun) := 1, якщо новий фронт надійшов до вичитування попереднього CCR1</tspan></text>
</svg>