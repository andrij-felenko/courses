<rect x="470.9" y="147.5" width="198.1" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="168.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Детектор фронту</tspan><tspan x="570.0" dy="16.2">(CC1P / CC1NP)</tspan><tspan x="570.0" dy="16.2">↑ наростаючий / ↓ спадний</tspan></text>
