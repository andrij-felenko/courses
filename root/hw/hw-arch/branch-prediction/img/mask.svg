<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гілку замінює маска: порахувати обидва, вибрати арифметикою</text>
<rect x="60.0" y="60.0" width="180.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="78.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">порівняння</tspan><tspan x="150.0" dy="16.9">v &gt; thr</tspan></text>
<rect x="300.0" y="52.0" width="150.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="375.0" y="71.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">прапорець = 1</tspan></text>
<rect x="300.0" y="92.0" width="150.0" height="30.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="375.0" y="111.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">прапорець = 0</tspan></text>
<line x1="240.0" y1="74.0" x2="298.0" y2="67.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="240.0" y1="90.0" x2="298.0" y2="107.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">−(1) =</text>
<text x="560.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">0xFFFF</text>
<text x="620.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">усі одиниці</text>
<text x="500.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">−(0) =</text>
<text x="560.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">0x0000</text>
<text x="620.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">усі нулі</text>
<line x1="452.0" y1="67.0" x2="496.0" y2="48.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="452.0" y1="107.0" x2="496.0" y2="102.0" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="150.0" y="168.0" width="420.0" height="46.0" rx="6" fill="#fff4e6" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="196.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">вибір = (a &amp; маска)  |  (b &amp; ~маска)</tspan></text>
<rect x="90.0" y="250.0" width="250.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">маска = 0xFFFF (над порогом)</tspan><tspan x="215.0" dy="15.6">→ вибір = a  (беремо thr)</tspan></text>
<rect x="380.0" y="250.0" width="250.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="505.0" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">маска = 0x0000 (під порогом)</tspan><tspan x="505.0" dy="15.6">→ вибір = b  (лишаємо v)</tspan></text>
<line x1="300.0" y1="214.0" x2="215.0" y2="248.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="420.0" y1="214.0" x2="505.0" y2="248.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="360.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Обидва значення пораховані завжди, стрибка немає — час не залежить від того, який шлях правильний.</text>
</svg>