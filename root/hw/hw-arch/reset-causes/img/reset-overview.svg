<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки береться reset і як чіп запам'ятовує причину</text>
<rect x="36.0" y="64.0" width="226.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="48.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Power-on (POR)</text>
<text x="48.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">перше живлення — норма</text>
<line x1="262.0" y1="84.0" x2="352.0" y2="84.0" stroke="#2457d6" stroke-width="1.8"/>
<rect x="36.0" y="120.0" width="226.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="48.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Кнопка / пін EN</text>
<text x="48.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">зовнішнє скидання</text>
<line x1="262.0" y1="140.0" x2="352.0" y2="140.0" stroke="#2457d6" stroke-width="1.8"/>
<rect x="36.0" y="176.0" width="226.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="48.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Brownout (BOD)</text>
<text x="48.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">напруга просіла</text>
<line x1="262.0" y1="196.0" x2="352.0" y2="196.0" stroke="#c0392b" stroke-width="1.8"/>
<rect x="36.0" y="232.0" width="226.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="48.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Watchdog</text>
<text x="48.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">програма зависла</text>
<line x1="262.0" y1="252.0" x2="352.0" y2="252.0" stroke="#c0392b" stroke-width="1.8"/>
<rect x="36.0" y="288.0" width="226.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="48.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Panic / виняток</text>
<text x="48.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">крах коду</text>
<line x1="262.0" y1="308.0" x2="352.0" y2="308.0" stroke="#c0392b" stroke-width="1.8"/>
<rect x="36.0" y="344.0" width="226.0" height="40.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/>
<text x="48.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">esp_restart()</text>
<text x="48.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">навмисний перезапуск</text>
<line x1="262.0" y1="364.0" x2="352.0" y2="364.0" stroke="#27ae60" stroke-width="1.8"/>
<rect x="36.0" y="400.0" width="226.0" height="40.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/>
<text x="48.0" y="417.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Вихід із deep-sleep</text>
<text x="48.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">прокидання зі сну</text>
<line x1="262.0" y1="420.0" x2="352.0" y2="420.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="352.0" y1="70.0" x2="352.0" y2="434.0" stroke="#1a1a1a" stroke-width="4.0"/>
<text x="352.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">лінія RESET</text>
<rect x="412.0" y="96.0" width="244.0" height="92.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="534.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Ядро рестартує</text>
<text x="534.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">PC → вектор скидання</text>
<text x="534.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">регістри — у стан за умовчанням</text>
<text x="534.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">виконання з початку програми</text>
<line x1="352.0" y1="142.0" x2="412.0" y2="142.0" stroke="#1a1a1a" stroke-width="2.2"/>
<rect x="412.0" y="232.0" width="244.0" height="96.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="534.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Регістр причини (засувка)</text>
<text x="534.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">зберігає, ХТО викликав скидання</text>
<text x="534.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">переживає сам reset</text>
<text x="534.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">прошивка читає esp_reset_reason()</text>
<line x1="352.0" y1="280.0" x2="412.0" y2="280.0" stroke="#1a1a1a" stroke-width="2.2"/>
<rect x="412.0" y="372.0" width="244.0" height="70.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.5"/>
<text x="534.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="534.0" dy="0.0">Майже кожна причина, крім POR</tspan><tspan x="534.0" dy="14.3">і навмисного перезапуску, —</tspan></text>
<text x="534.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">симптом, який варто залогувати.</text>
</svg>