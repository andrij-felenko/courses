<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Навіщо розділяти: стіни з різними правами</text>
<text x="360.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">кожна область має власний дозвіл — читати (R), писати (W), виконувати (X)</text>
<rect x="30.0" y="80.0" width="200.0" height="150.0" rx="6" fill="#fff8e8" stroke="#b8860b" stroke-width="1.8"/>
<text x="130.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Код</text>
<text x="130.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#b8860b" text-anchor="middle" font-weight="700">R  X</text>
<text x="130.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="130.0" dy="0.0">читати й виконувати,</tspan><tspan x="130.0" dy="14.2">АЛЕ не переписувати</tspan></text>
<rect x="260.0" y="80.0" width="200.0" height="150.0" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="360.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дані (SRAM)</text>
<text x="360.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#2457d6" text-anchor="middle" font-weight="700">R  W</text>
<text x="360.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="360.0" dy="0.0">читати й писати,</tspan><tspan x="360.0" dy="14.2">АЛЕ не виконувати</tspan></text>
<rect x="490.0" y="80.0" width="200.0" height="150.0" rx="6" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.8"/>
<text x="590.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Периферія</text>
<text x="590.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">R  W</text>
<text x="590.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="590.0" dy="0.0">читати й писати регістри,</tspan><tspan x="590.0" dy="14.2">виконувати — ніколи (XN)</tspan></text>
<text x="360.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Порушив дозвіл — процесор ловить помилку одразу, а не мовчки псує пам'ять</text>
</svg>