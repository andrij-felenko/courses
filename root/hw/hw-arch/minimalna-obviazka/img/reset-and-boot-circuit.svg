<rect x="189.2" y="361.0" width="61.6" height="48.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="220.0" y="375.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">C_NRST</tspan><tspan x="220.0" dy="13.0">100 нФ</tspan><tspan x="220.0" dy="13.0">(фільтр)</tspan></text>
