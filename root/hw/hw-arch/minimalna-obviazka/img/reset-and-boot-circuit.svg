<line x1="130.0" y1="310.0" x2="130.0" y2="355.0" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="100.4" y="361.9" width="59.1" height="46.2" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Кнопка</tspan><tspan x="130.0" dy="12.3">Скидання</tspan><tspan x="130.0" dy="12.3">(Manual)</tspan></text>
<line x1="130.0" y1="415.0" x2="130.0" y2="460.0" stroke="#2457d6" stroke-width="1.6"/>
<text x="130.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">GND</text>
<text x="175.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">τ = R_PU · C_NRST ≈ 4 мс
(затримка при старті)</text>
<line x1="130.0" y1="310.0" x2="50.0" y2="310.0" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4,3"/>
<text x="48.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7c3aed" text-anchor="start" font-weight="700">До SWD NRST (Open-Drain)</text>
<text x="680.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конфігурація завантаження (Boot Mode)</text>
