<text x="360.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">(Cortex-M)</text>
<rect x="310.0" y="220.0" width="100.0" height="50.0" rx="4" fill="#334155" stroke="#64748b" stroke-width="1.2"/>
