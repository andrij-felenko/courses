<line x1="390.0" y1="110.0" x2="390.0" y2="200.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="360.0" y1="270.0" x2="360.0" y2="310.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="290.0" y1="310.0" x2="360.0" y2="310.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="300.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#fca5a5" text-anchor="start" font-weight="700">NRST</text>
<rect x="313.4" y="351.9" width="93.2" height="46.2" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/><text x="360.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#38bdf8" text-anchor="middle"><tspan x="360.0" dy="0.0">Внутрішній</tspan><tspan x="360.0" dy="12.3">Power-on Reset</tspan><tspan x="360.0" dy="12.3">/ Тригер Шмітта</tspan></text>
<line x1="360.0" y1="310.0" x2="360.0" y2="345.0" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>
