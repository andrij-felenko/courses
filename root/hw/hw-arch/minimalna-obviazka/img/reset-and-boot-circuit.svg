<text x="800.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">МК</text>
<text x="800.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">(Boot Logic)</text>
<line x1="550.0" y1="200.0" x2="730.0" y2="200.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="740.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#fde047" text-anchor="start" font-weight="700">BOOT0</text>
<line x1="630.0" y1="200.0" x2="630.0" y2="235.0" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="607.3" y="244.1" width="45.3" height="31.9" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="257.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">R_PD</tspan><tspan x="630.0" dy="12.3">10 кОм</tspan></text>
<line x1="630.0" y1="285.0" x2="630.0" y2="310.0" stroke="#2457d6" stroke-width="1.6"/>
<text x="630.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">GND (Штатний старт з Flash)</text>
<rect x="466.7" y="177.9" width="86.6" height="44.2" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="510.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Джампер BOOT0</tspan><tspan x="510.0" dy="12.3">[ 1-2: 3.3V ]</tspan><tspan x="510.0" dy="12.3">[ 2-3: GND ]</tspan></text>
<line x1="550.0" y1="370.0" x2="730.0" y2="370.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="740.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#fde047" text-anchor="start" font-weight="700">BOOT1 (PB2)</text>
<line x1="630.0" y1="370.0" x2="630.0" y2="400.0" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="607.3" y="409.1" width="45.3" height="31.9" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="422.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">R_PD</tspan><tspan x="630.0" dy="12.3">10 кОм</tspan></text>
<line x1="630.0" y1="450.0" x2="630.0" y2="475.0" stroke="#2457d6" stroke-width="1.6"/>
<text x="630.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">GND</text>
<rect x="470.0" y="105.0" width="250.0" height="65.0" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.0"/>
<text x="595.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Таблиця режимів завантаження:</text>
<text x="480.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">BOOT0=0       → Головна Flash (0x08000000)</text>
<text x="480.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="start">BOOT0=1, B1=0 → System ROM Bootloader (UART/USB)</text>
<text x="480.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">BOOT0=1, B1=1 → Вбудована SRAM (0x20000000)</text>
</svg>