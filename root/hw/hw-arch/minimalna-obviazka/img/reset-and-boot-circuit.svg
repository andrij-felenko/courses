<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="900.0" height="500.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="470.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схеми апаратного скидання (NRST) та вибору режиму старту (BOOT)</text>
<line x1="460.0" y1="70.0" x2="460.0" y2="505.0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,5"/>
<text x="230.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг скидання NRST (Active-Low)</text>
<line x1="80.0" y1="110.0" x2="390.0" y2="110.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="80.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">+3.3 В (VDD)</text>
<rect x="290.0" y="140.0" width="140.0" height="340.0" rx="6" fill="#1e293b" stroke="#1a1a1a" stroke-width="1.8"/>
