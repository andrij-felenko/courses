<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три види допуску — і чому потрібні всі три</text>
<rect x="48.0" y="64.0" width="200.0" height="386.0" rx="6" fill="#fafafa" stroke="#2457d6" stroke-width="1.8"/>
<text x="148.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Абсолютний</text>
<rect x="58.0" y="106.0" width="180.0" height="32.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="148.0" y="125.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="148.0" dy="0.0">|a − b| ≤ εабс</tspan></text>
<text x="62.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Один сталий допуск.</text>
<text x="62.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Працює БІЛЯ НУЛЯ</text>
<text x="62.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">(де відносний ділив би</text>
<text x="62.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">на ≈0 і вибухав).</text>
<text x="62.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Хибний на великих:</text>
<text x="62.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">при a=10⁶ поріг 10⁻⁶</text>
<text x="62.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">недосяжний.</text>
<circle cx="148.0" cy="424.0" r="13.0" fill="#b9770e" stroke="#b9770e" stroke-width="0.0"/>
<text x="148.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">±</text>
<rect x="262.0" y="64.0" width="200.0" height="386.0" rx="6" fill="#fafafa" stroke="#b9770e" stroke-width="1.8"/>
<text x="362.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b9770e" text-anchor="middle" font-weight="700">Відносний</text>
<rect x="272.0" y="106.0" width="180.0" height="32.0" rx="6" fill="#ffffff" stroke="#b9770e" stroke-width="1.2"/><text x="362.0" y="125.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="362.0" dy="0.0">|a−b| ≤ εвідн·max(|a|,|b|)</tspan></text>
<text x="276.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Допуск росте з числом —</text>
<text x="276.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">як і крок float.</text>
<text x="276.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Універсальний для</text>
<text x="276.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">звичайних величин.</text>
<text x="276.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Ламається БІЛЯ НУЛЯ:</text>
<text x="276.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">max→0, поріг→0,</text>
<text x="276.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">0.0 vs 10⁻³⁰ «нерівні».</text>
<circle cx="362.0" cy="424.0" r="13.0" fill="#b9770e" stroke="#b9770e" stroke-width="0.0"/>
<text x="362.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">±</text>
<rect x="476.0" y="64.0" width="200.0" height="386.0" rx="6" fill="#fafafa" stroke="#27ae60" stroke-width="1.8"/>
<text x="576.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Комбінований</text>
<rect x="486.0" y="106.0" width="180.0" height="32.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="576.0" y="125.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="576.0" dy="0.0">абс. якщо малі, інакше відн.</tspan></text>
<text x="490.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Спершу абсолютна гілка</text>
<text x="490.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">для околу нуля,</text>
<text x="490.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">далі — відносна.</text>
<text x="490.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Саме так і роблять:</text>
<text x="490.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">одна функція</text>
<text x="490.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">nearEqual(a, b).</text>
<text x="490.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Покриває весь діапазон.</text>
<circle cx="576.0" cy="424.0" r="13.0" fill="#27ae60" stroke="#27ae60" stroke-width="0.0"/>
<text x="576.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700">✓</text>
</svg>