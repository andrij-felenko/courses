<svg xmlns="http://www.w3.org/2000/svg" width="900" height="404" viewBox="0 0 900 404">
<rect width="900" height="404" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що обмежує частоту: найповільніший шлях має встигнути за один такт</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">між двома тригерами сигнал біжить крізь вентилі із затримкою; такт не може бути коротшим за цей шлях</text>
<rect x="70.0" y="130.0" width="80.0" height="70.0" rx="8" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2"/>
<text x="110.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">тригер</text>
<text x="110.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(старт)</text>
<rect x="190.0" y="145.0" width="70.0" height="40.0" rx="6" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="225.0" y="169.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вентиль</text>
<line x1="260.0" y1="165.0" x2="300.0" y2="165.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="225.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">+Δt</text>
<rect x="300.0" y="145.0" width="70.0" height="40.0" rx="6" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="335.0" y="169.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вентиль</text>
<line x1="370.0" y1="165.0" x2="410.0" y2="165.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="335.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">+Δt</text>
<rect x="410.0" y="145.0" width="70.0" height="40.0" rx="6" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="445.0" y="169.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вентиль</text>
<line x1="480.0" y1="165.0" x2="520.0" y2="165.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="445.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">+Δt</text>
<rect x="520.0" y="145.0" width="70.0" height="40.0" rx="6" fill="#fafafa" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="555.0" y="169.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вентиль</text>
<text x="555.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">+Δt</text>
<line x1="150.0" y1="165.0" x2="190.0" y2="165.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<line x1="590.0" y1="165.0" x2="760.0" y2="165.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="760.0" y="130.0" width="80.0" height="70.0" rx="8" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2"/>
<text x="800.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">тригер</text>
<text x="800.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(фініш)</text>
<text x="455.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">сумарна затримка цього «критичного шляху» = найдовша в схемі</text>
<rect x="60.0" y="252.0" width="780.0" height="110.0" rx="10" fill="#f6f8f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="450.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Період такту мусить бути ≥ затримки найдовшого шляху — інакше на фініш-тригер прийде ще не готовий сигнал.</text>
<text x="450.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Зробиш такт коротшим за критичний шлях — і тригер засіче ХИБНЕ значення. Звідси є фізична стеля частоти.</text>
<text x="450.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому макс. частота ≈ 1 / (затримка критичного шляху). Її обмежують швидкість вентилів, довжина дротів, напруга й температура.</text>
<text x="450.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Інженери «розганяють» частоту, вкорочуючи критичний шлях (менші транзистори, коротші ланцюги) — а не просто «крутять ручку».</text>
</svg>
