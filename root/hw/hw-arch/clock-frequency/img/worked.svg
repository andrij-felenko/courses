<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
<rect width="900" height="520" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Порахуймо чесно: три процесори, та сама програма (10⁹ команд)</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">час = N × CPI × T = N × CPI / частота;  менший час = швидше (нижче — короча смуга)</text>
<rect x="60.0" y="80.0" width="780.0" height="34.0" rx="0" fill="#eef1f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="72.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">процесор</text>
<text x="222.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">частота</text>
<text x="372.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">CPI</text>
<text x="522.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">час = N·CPI/f</text>
<text x="672.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">у скільки разів</text>
<rect x="60.0" y="114.0" width="780.0" height="34.0" rx="0" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.0"/>
<circle cx="82.0" cy="131.0" r="11.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="82.0" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">A</text>
<text x="222.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">200 МГц</text>
<text x="372.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">4.0</text>
<text x="522.0" y="136.0" font-family="Consolas, monospace" font-size="12.5" fill="#1b1b1b">10⁹·4 / 2·10⁸ = 20.0 с</text>
<text x="672.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">база (×1.0)</text>
<rect x="60.0" y="148.0" width="780.0" height="34.0" rx="0" fill="#fafbfd" stroke="#e4e4e4" stroke-width="1.0"/>
<circle cx="82.0" cy="165.0" r="11.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="82.0" y="169.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">B</text>
<text x="222.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">100 МГц</text>
<text x="372.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">1.0</text>
<text x="522.0" y="170.0" font-family="Consolas, monospace" font-size="12.5" fill="#1b1b1b">10⁹·1 / 1·10⁸ = 10.0 с</text>
<text x="672.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">×2.0 швидше</text>
<rect x="60.0" y="182.0" width="780.0" height="34.0" rx="0" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.0"/>
<circle cx="82.0" cy="199.0" r="11.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="82.0" y="203.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">C</text>
<text x="222.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">240 МГц</text>
<text x="372.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">1.2</text>
<text x="522.0" y="204.0" font-family="Consolas, monospace" font-size="12.5" fill="#1b1b1b">10⁹·1.2 / 2.4·10⁸ = 5.0 с</text>
<text x="672.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">×4.0 швидше</text>
<line x1="210.0" y1="80.0" x2="210.0" y2="216.0" stroke="#e4e4e4" stroke-width="1.0" stroke-linecap="round"/>
<line x1="360.0" y1="80.0" x2="360.0" y2="216.0" stroke="#e4e4e4" stroke-width="1.0" stroke-linecap="round"/>
<line x1="510.0" y1="80.0" x2="510.0" y2="216.0" stroke="#e4e4e4" stroke-width="1.0" stroke-linecap="round"/>
<line x1="660.0" y1="80.0" x2="660.0" y2="216.0" stroke="#e4e4e4" stroke-width="1.0" stroke-linecap="round"/>
<rect x="60.0" y="80.0" width="780.0" height="136.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="60.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Час виконання (коротша смуга = швидший процесор):</text>
<text x="134.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">A</text>
<rect x="150.0" y="270.0" width="600.0" height="28.0" rx="5" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="760.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">20 с</text>
<text x="134.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">B</text>
<rect x="150.0" y="316.0" width="300.0" height="28.0" rx="5" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="460.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">10 с</text>
<text x="134.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">C</text>
<rect x="150.0" y="362.0" width="150.0" height="28.0" rx="5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="310.0" y="382.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">5 с</text>
<line x1="150.0" y1="266.0" x2="150.0" y2="400.0" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round"/>
<rect x="60.0" y="476.0" width="780.0" height="30.0" rx="8" fill="#f2f8f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="450.0" y="496.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">C на 240 МГц б'є A на 200 МГц у 4 рази; B на 100 МГц — удвічі швидший за A. Вирішує добуток CPI·T, а не самі МГц.</text>
</svg>
