<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Заради чого додали Exclusive: тихий перший запис</text>
<line x1="380.0" y1="54.0" x2="380.0" y2="350.0" stroke="#d8dde3" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="380.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Ядро САМО читає лінію, тоді пише в неї (типовий випадок)</text>
<text x="175.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">MSI (три стани)</text>
<text x="175.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">1) читає (промах)</text>
<rect x="40.0" y="128.0" width="270.0" height="30.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="175.0" y="146.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">BusRd → принесли копію, стан = Shared</tspan></text>
<text x="175.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">2) пише в ту саму лінію</text>
<rect x="40.0" y="190.0" width="270.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="175.0" y="202.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">чиста копія — то Shared;</tspan><tspan x="175.0" dy="12.3">у шину: BusUpgr «раптом хтось має»</tspan></text>
<text x="175.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дій у шині на цей сценарій:</text>
<rect x="115.0" y="254.0" width="120.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="175.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">2</tspan></text>
<rect x="25.0" y="306.0" width="300.0" height="40.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="175.0" y="323.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Другий сигнал — ЗАЙВИЙ: копія й так була одна,</tspan><tspan x="175.0" dy="11.7">а система про це не знала.</tspan></text>
<text x="555.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">MESI (+ Exclusive)</text>
<text x="555.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">1) читає (промах)</text>
<rect x="420.0" y="128.0" width="270.0" height="30.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="555.0" y="146.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">BusRd → принесли копію, стан = Exclusive</tspan></text>
<text x="555.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">2) пише в ту саму лінію</text>
<rect x="420.0" y="190.0" width="270.0" height="30.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="555.0" y="202.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">єдиний власник → Exclusive;</tspan><tspan x="555.0" dy="12.3">перший запис ТИХИЙ, E → M</tspan></text>
<text x="555.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дій у шині на цей сценарій:</text>
<rect x="495.0" y="254.0" width="120.0" height="34.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="555.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">1</tspan></text>
<rect x="405.0" y="306.0" width="300.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="555.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">Стан Exclusive «пам'ятає», що копія одна,</tspan><tspan x="555.0" dy="13.0">тож зайвого оголошення нема.</tspan></text>
</svg>