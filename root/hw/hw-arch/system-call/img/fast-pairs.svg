<rect x="30.0" y="440.0" width="300.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="480.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Стек ядра</tspan></text>
<rect x="340.0" y="440.0" width="300.0" height="72.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="472.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">апаратура бере SS:ESP</tspan><tspan x="490.0" dy="16.9">із TSS</tspan></text>
<rect x="650.0" y="440.0" width="300.0" height="72.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="480.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">з IA32_SYSENTER_ESP</tspan></text>
<rect x="960.0" y="440.0" width="300.0" height="72.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1110.0" y="480.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1110.0" dy="0.0">ядро перемикає само</tspan></text>
<rect x="30.0" y="522.0" width="300.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="562.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Як вертаються</tspan></text>
<rect x="340.0" y="522.0" width="300.0" height="72.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="554.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">IRET знімає все</tspan><tspan x="490.0" dy="16.9">зі стека</tspan></text>
<rect x="650.0" y="522.0" width="300.0" height="72.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="554.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">SYSEXIT — у EDX:ECX,</tspan><tspan x="800.0" dy="16.9">які мусить дати ОС</tspan></text>
<rect x="960.0" y="522.0" width="300.0" height="72.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1110.0" y="562.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1110.0" dy="0.0">SYSRET — із RCX і R11</tspan></text>
<rect x="30.0" y="612.0" width="1240.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="638.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="650.0" dy="0.0">Швидкість обох пар — з одного джерела: вони не читають із пам'яті нічого. Різняться лише тим, що лишають по собі.</tspan></text>
