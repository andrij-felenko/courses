<rect x="650.0" y="358.0" width="300.0" height="72.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="398.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">не зберігаються</tspan></text>
