<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три входи в ядро на x86: що бере на себе апаратура</text>
<rect x="30.0" y="26.0" width="300.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="67.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Що робить апаратура</tspan></text>
<rect x="340.0" y="26.0" width="300.0" height="74.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="49.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">INT 0x80</tspan><tspan x="490.0" dy="18.2">вектор загального</tspan><tspan x="490.0" dy="18.2">призначення</tspan></text>
<rect x="650.0" y="26.0" width="300.0" height="74.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="58.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">SYSENTER / SYSEXIT</tspan><tspan x="800.0" dy="18.2">Intel, 1997</tspan></text>
