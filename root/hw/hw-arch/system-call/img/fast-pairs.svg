<rect x="30.0" y="112.0" width="300.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="152.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Звідки адреса входу</tspan></text>
<rect x="340.0" y="112.0" width="300.0" height="72.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="152.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">з дескриптора в таблиці IDT</tspan></text>
<rect x="650.0" y="112.0" width="300.0" height="72.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="144.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">з регістра</tspan><tspan x="800.0" dy="16.9">IA32_SYSENTER_EIP</tspan></text>
<rect x="960.0" y="112.0" width="300.0" height="72.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1110.0" y="152.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1110.0" dy="0.0">з регістра IA32_LSTAR</tspan></text>
<rect x="30.0" y="194.0" width="300.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="234.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Що читає з пам'яті</tspan></text>
