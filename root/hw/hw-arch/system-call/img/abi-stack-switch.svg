<rect x="925.0" y="292.0" width="385.0" height="78.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="1117.5" y="319.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1117.5" dy="0.0">csrrw міняє tp зі sscratch, а sp</tspan><tspan x="1117.5" dy="15.6">дістають уже з task-структури —</tspan><tspan x="1117.5" dy="15.6">теж вручну</tspan></text>
