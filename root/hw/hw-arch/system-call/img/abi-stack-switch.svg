<rect x="30.0" y="498.0" width="1280.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="525.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="670.0" dy="0.0">Червоне — команди ядра, що виконуються ще на стеку, який лишила програма: вузьке вікно, де кожен рядок пишуть з особливою обережністю.</tspan></text>
