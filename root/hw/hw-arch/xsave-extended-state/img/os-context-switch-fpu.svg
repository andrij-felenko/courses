<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перемикання розширеного контексту в планувальнику ядра ОС</text>
<text x="380.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Збереження модифікованого стану Потоку А та завантаження стану Потоку Б</text>
<rect x="50.0" y="70.0" width="180.0" height="80.0" rx="6" fill="#f3f5fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="140.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Потік А (Користувач)</text>
<text x="140.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Активні YMM / ZMM</text>
<text x="140.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Переривання таймера / yield</text>
<line x1="140.0" y1="150.0" x2="140.0" y2="195.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="185.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">Трап у ядро</text>
<rect x="60.0" y="200.0" width="640.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="80.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Ядро ОС (Ring 0): функція switch_to() / fpu__suspend()</text>
<rect x="80.0" y="235.0" width="270.0" height="70.0" rx="6" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.4"/>
<text x="215.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">1. XSAVES [thread_A-&gt;fpstate]</text>
<text x="215.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">зберігає тільки брудні компоненти</text>
<text x="215.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">XSTATE_BV фіксує модифіковані регістри</text>
<line x1="350.0" y1="270.0" x2="410.0" y2="270.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Вибір</text>
<rect x="410.0" y="235.0" width="270.0" height="70.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.4"/>
<text x="545.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">2. XRSTORS [thread_B-&gt;fpstate]</text>
<text x="545.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">відновлює дані з пам'яті</text>
<text x="545.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">скидає неактивні в апаратний нуль</text>
<line x1="620.0" y1="200.0" x2="620.0" y2="150.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="575.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">IRET / sysret</text>
<rect x="530.0" y="70.0" width="180.0" height="80.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="620.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Потік Б (Користувач)</text>
<text x="620.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Регістри завантажено</text>
<text x="620.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Виконання векторного коду</text>
<text x="380.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оптимізація скидання (Init-Optimization): якщо біт XSTATE_BV[i] = 0,</text>
<text x="380.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">процесор не читає пам'ять, а миттєво ініціалізує регістри значенням за замовчуванням.</text>
</svg>