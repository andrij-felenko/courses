<line x1="445.0" y1="318.0" x2="495.0" y2="318.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<rect x="495.0" y="296.0" width="90.0" height="44.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="540.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">таймери</text>
<text x="540.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">рахують тік</text>
<text x="470.0" y="386.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Той самий принцип, що 1927-го: кварц дає рівний тік, а лічильник-таймер його відмірює.</text>
