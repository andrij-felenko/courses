<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Спадок: кварц тікає в кожному пристрої — і в ESP32</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">від відкриття Кюрі до чипа у вас на столі — одна неперервна лінія</text>
<line x1="70.0" y1="150.0" x2="880.0" y2="150.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
