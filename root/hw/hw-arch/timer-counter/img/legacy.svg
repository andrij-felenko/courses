<text x="70.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1880</text>
<text x="70.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Кюрі:</text>
<text x="70.0" y="125.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">п'єзоефект</text>
<circle cx="250.0" cy="150.0" r="5.0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="250.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1921</text>
<text x="250.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Кади:</text>
<text x="250.0" y="125.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">генератор</text>
<circle cx="450.0" cy="150.0" r="5.0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="450.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1927</text>
<text x="450.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Маррісон,</text>
<text x="450.0" y="125.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Гортон: годинник</text>
<circle cx="650.0" cy="150.0" r="5.0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="650.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1969</text>
<text x="650.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Seiko:</text>
<text x="650.0" y="125.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">наручний</text>
<circle cx="850.0" cy="150.0" r="5.0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="850.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">нині</text>
<text x="850.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">кожен чип</text>
<rect x="330.0" y="250.0" width="280.0" height="110.0" rx="12" fill="none" stroke="#1f47b5" stroke-width="2"/>
