<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
<rect width="960" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Таймери ESP32: широкі лічильники від 80-мегагерцового такту</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">чотири універсальні таймери; на них стоять millis() і micros()</text>
<rect x="60.0" y="100.0" width="150.0" height="60.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="135.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">такт APB</text>
<text x="135.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">80 МГц</text>
<line x1="210.0" y1="130.0" x2="270.0" y2="130.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<rect x="270.0" y="100.0" width="160.0" height="60.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="350.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">передільник</text>
<text x="350.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a6a14" text-anchor="middle" font-weight="normal" font-style="normal">16-біт (÷2…65536)</text>
<line x1="430.0" y1="130.0" x2="490.0" y2="130.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<rect x="490.0" y="100.0" width="200.0" height="60.0" rx="8" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.6"/>
<text x="590.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">лічильник</text>
<text x="590.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">64 біти, вгору/вниз</text>
<rect x="730.0" y="100.0" width="170.0" height="60.0" rx="8" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="815.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">×4 таймери</text>
<text x="815.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(2 групи по 2)</text>
<line x1="590.0" y1="160.0" x2="590.0" y2="210.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<rect x="420.0" y="210.0" width="340.0" height="60.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="590.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">millis() · micros()</text>
<text x="590.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">готові функції поверх апаратного лічильника</text>
<rect x="150.0" y="300.0" width="660.0" height="76.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">У коді ви задаєте передільник (темп тіку) і читаєте лічильник — або берете готові</text>
<text x="480.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">millis()/micros(). Той самий принцип, що 1927-го: кварц цокає, лічильник рахує,</text>
<text x="480.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.7" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">код читає результат. Просто тепер усе вміщається в куточку кремнієвого чипа.</text>
</svg>
