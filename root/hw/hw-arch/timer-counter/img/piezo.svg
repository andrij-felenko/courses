<text x="470.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Саме зворотний ефект і дозволяє «розгойдати» кварц електрикою — змусити його вібрувати.</text>
