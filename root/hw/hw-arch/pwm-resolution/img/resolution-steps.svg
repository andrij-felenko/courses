<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">більше біт — дрібніші кроки — плавніше керування; менше біт — грубо, «сходинками»</text>
