<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
<rect width="960" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Підступ сприйняття: око бачить яскравість НЕлінійно</text>
<text x="480.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">рівні кроки шпаруватості не дають рівних кроків яскравості — потрібна гамма-корекція</text>
<line x1="110.0" y1="300.0" x2="470.0" y2="300.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="110.0" y1="300.0" x2="110.0" y2="90.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="102.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">яскравість</text>
<text x="470.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">шпаруватість</text>
<line x1="110.0" y1="300.0" x2="450.0" y2="110.0" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="4,3" stroke-linecap="round"/>
<text x="420.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">лінійно (наївно)</text>
<polyline points="110.0,300.0 160.0,180.0 220.0,140.0 300.0,120.0 380.0,112.0 450.0,110.0" fill="none" stroke="#c0271e" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="250.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">як БАЧИТЬ око:</text>
<text x="250.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">знизу стрибає, згори майже не міняється</text>
<rect x="510.0" y="100.0" width="400.0" height="200.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="710.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що з цим робити</text>
<text x="528.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• застосувати гамма-криву:</text>
<text x="545.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">поріг = (рівень/макс)^гамма</text>
<text x="528.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• або таблицю перерахунку</text>
<text x="528.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• більша роздільність допомагає,</text>
<text x="545.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">бо дає тонші кроки внизу</text>
<text x="710.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">тоді дімування виглядає РІВНИМ</text>
<text x="480.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тому «плавне затемнення» — це не лінійні кроки шпаруватості, а гамма-крива під око людини.</text>
</svg>
