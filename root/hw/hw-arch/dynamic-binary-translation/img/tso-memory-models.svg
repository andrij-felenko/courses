<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="45.0" width="265.0" height="385.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="162.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">x86 TSO</text>
<text x="162.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Строге впорядкування (Total Store Order)</text>
<rect x="45.0" y="115.0" width="235.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="162.5" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="162.5" dy="0.0">Апаратний Store Buffer (FIFO)</tspan><tspan x="162.5" dy="15.6">Записи потрапляють у пам'ять</tspan><tspan x="162.5" dy="15.6">у строгому порядку програми</tspan></text>
<rect x="45.0" y="190.0" width="235.0" height="110.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="162.5" y="213.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="162.5" dy="0.0">Заборонені перевпорядкування:</tspan><tspan x="162.5" dy="14.3">• Load → Load  (ЗАБОРОНЕНО)</tspan><tspan x="162.5" dy="14.3">• Store → Store (ЗАБОРОНЕНО)</tspan><tspan x="162.5" dy="14.3">• Load → Store (ЗАБОРОНЕНО)</tspan><tspan x="162.5" dy="14.3">Дозволено лише:</tspan><tspan x="162.5" dy="14.3">• Store → Load (через буфер)</tspan></text>
<rect x="45.0" y="310.0" width="235.0" height="100.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="162.5" y="340.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="162.5" dy="0.0">Наслідок для ПЗ:</tspan><tspan x="162.5" dy="15.6">Багатопотоковий код x86</tspan><tspan x="162.5" dy="15.6">НЕ використовує бар'єри пам'яті</tspan><tspan x="162.5" dy="15.6">для звичайних load/store</tspan></text>
<rect x="325.0" y="45.0" width="270.0" height="385.0" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
<text x="460.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ea580c" text-anchor="middle" font-weight="700">Стандартний ARM64 / RISC-V</text>
<text x="460.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Слабка модель (Weak Memory Ordering)</text>
<rect x="340.0" y="115.0" width="240.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Позачерговий конвеєр (OoO)</tspan><tspan x="460.0" dy="15.6">Читання й записи можуть мінятися</tspan><tspan x="460.0" dy="15.6">місцями довільно</tspan></text>
<rect x="340.0" y="190.0" width="240.0" height="110.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="460.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Дозволені перевпорядкування:</tspan><tspan x="460.0" dy="14.3">• Load → Load  (ДОЗВОЛЕНО)</tspan><tspan x="460.0" dy="14.3">• Store → Store (ДОЗВОЛЕНО)</tspan><tspan x="460.0" dy="14.3">• Store → Load (ДОЗВОЛЕНО)</tspan><tspan x="460.0" dy="14.3">• Load → Store (ДОЗВОЛЕНО)</tspan></text>
<rect x="340.0" y="310.0" width="240.0" height="100.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="460.0" y="340.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Програмна емуляція DBT:</tspan><tspan x="460.0" dy="15.6">Мусить вставляти dmb ish</tspan><tspan x="460.0" dy="15.6">або ldar/stlr на КОЖЕН доступ!</tspan><tspan x="460.0" dy="15.6">Втрата 30–50% швидкодії</tspan></text>
<rect x="625.0" y="45.0" width="265.0" height="385.0" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.0"/>
<text x="757.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">Apple Silicon (Rosetta 2)</text>
<text x="757.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Апаратний TSO-біт у кремнії M1/M2/M3</text>
<rect x="640.0" y="115.0" width="235.0" height="65.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="757.5" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="757.5" dy="0.0">Регістр конфігурації ядра</tspan><tspan x="757.5" dy="15.6">Вмикає апаратний режим TSO</tspan><tspan x="757.5" dy="15.6">для потоків емуляції x86</tspan></text>
<rect x="640.0" y="190.0" width="235.0" height="110.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="757.5" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="757.5" dy="0.0">Апаратна поведінка ядра:</tspan><tspan x="757.5" dy="14.3">• Блок Load/Store Queue сам</tspan><tspan x="757.5" dy="14.3">  дотримується правил x86 TSO</tspan><tspan x="757.5" dy="14.3">• Забороняє некоректні OoO</tspan><tspan x="757.5" dy="14.3">  перевпорядкування в залізі</tspan></text>
<rect x="640.0" y="310.0" width="235.0" height="100.0" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/><text x="757.5" y="342.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="757.5" dy="0.0">Результат Rosetta 2:</tspan><tspan x="757.5" dy="14.3">Нуль інструкцій dmb ish!</tspan><tspan x="757.5" dy="14.3">Звичайні ldr / str виконуються</tspan><tspan x="757.5" dy="14.3">із швидкістю 90–95% нативу</tspan></text>
</svg>