<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="45.0" width="410.0" height="385.0" rx="8" fill="#fff5f5" stroke="#f87171" stroke-width="1.5"/>
<text x="235.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Без зшивання: повернення в диспетчер</text>
<text x="235.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Кожен перехід коштує 40–80 тактів на виклик диспетчера</text>
<rect x="60.0" y="120.0" width="350.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Блок 1 (Host Code у кеші)</tspan><tspan x="235.0" dy="15.6">... арифметика ...</tspan><tspan x="235.0" dy="15.6">jump .L_exit_trampoline</tspan></text>
<line x1="235.0" y1="180.0" x2="235.0" y2="215.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="290.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Вихід із блоку</text>
<rect x="60.0" y="215.0" width="350.0" height="70.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="235.0" y="230.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Трамплін і Диспетчер (Dispatcher)</tspan><tspan x="235.0" dy="15.6">1. Зберегти регістри гостя в пам'ять</tspan><tspan x="235.0" dy="15.6">2. Знайти адресу Блоку 2 в хеш-таблиці</tspan><tspan x="235.0" dy="15.6">3. Відновити регістри й стрибнути в Блок 2</tspan></text>
<line x1="235.0" y1="285.0" x2="235.0" y2="320.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="290.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Непрямий стрибок</text>
<rect x="60.0" y="320.0" width="350.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="338.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Блок 2 (Host Code у кеші)</tspan><tspan x="235.0" dy="15.6">... продовження виконання ...</tspan><tspan x="235.0" dy="15.6">jump .L_exit_trampoline</tspan></text>
<text x="235.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Ціна: промахи передбачення переходу (BTB) + доступ до RAM</text>
<rect x="480.0" y="45.0" width="410.0" height="385.0" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
<text x="685.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Пряме зшивання (Direct Chaining)</text>
<text x="685.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Патчинг вихідної інструкції на прямий стрибок</text>
<rect x="510.0" y="120.0" width="350.0" height="75.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="685.0" y="138.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Блок 1 (Host Code у кеші)</tspan><tspan x="685.0" dy="15.6">... арифметика ...</tspan><tspan x="685.0" dy="15.6">b .L_block_2   // Запатчено прямою адресою!</tspan><tspan x="685.0" dy="15.6">(колишній стрибок на трамплін замінено)</tspan></text>
<line x1="685.0" y1="195.0" x2="685.0" y2="220.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="589.4" y="218.2" width="191.1" height="47.6" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="685.0" y="238.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">Прямий нативний перехід</tspan><tspan x="685.0" dy="15.6">(1 такт процесора)</tspan></text>
<line x1="685.0" y1="265.0" x2="685.0" y2="290.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="510.0" y="290.0" width="350.0" height="65.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="685.0" y="311.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Блок 2 (Host Code у кеші)</tspan><tspan x="685.0" dy="15.6">... виконання без зупинки ...</tspan><tspan x="685.0" dy="15.6">b .L_block_3   // Наступне зшивання</tspan></text>
<rect x="510.0" y="370.0" width="350.0" height="45.0" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/><text x="685.0" y="389.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">Диспетчер більше НЕ викликається!</tspan><tspan x="685.0" dy="14.3">Код виконується безперервно всередині Code Cache</tspan></text>
</svg>