<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Уся стіна — в одному множнику: квадрат напруги</text>
<text x="380.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">густина = C · V² · f · (транзисторів на площі) — рахуємо степені k у кожного</text>
<rect x="40.0" y="80.0" width="320.0" height="300.0" rx="12" fill="#fbfcfd" stroke="#27ae60" stroke-width="1.8"/>
<text x="200.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ПОКИ V падає на k</text>
<text x="62.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">C → 1/k</text>
<text x="338.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">−1</text>
<text x="62.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">V² → 1/k²</text>
<text x="338.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">−2</text>
<text x="62.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">f → k</text>
<text x="338.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">+1</text>
<text x="62.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">транз./площа → k²</text>
<text x="338.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">+2</text>
<line x1="62.0" y1="262.0" x2="338.0" y2="262.0" stroke="#c9ced3" stroke-width="1.2"/>
<text x="62.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">сума степенів k:</text>
<text x="338.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="end" font-weight="700">0</text>
<rect x="58.0" y="322.0" width="284.0" height="44.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/>
<rect x="60.0" y="324.0" width="280.0" height="40.0" rx="6" fill="#eaf6ef" stroke="#eaf6ef" stroke-width="0.0"/><text x="200.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">k⁰ = 1 → густина СТАЛА</tspan></text>
<rect x="400.0" y="80.0" width="320.0" height="300.0" rx="12" fill="#fbfcfd" stroke="#c0392b" stroke-width="1.8"/>
<text x="560.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">КОЛИ V завмерла (≈2004–06)</text>
<text x="422.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">C → 1/k</text>
<text x="698.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">−1</text>
<text x="422.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">V² → 1 (не падає!)</text>
<text x="698.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">0</text>
<text x="422.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">f → k</text>
<text x="698.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">+1</text>
<text x="422.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">транз./площа → k²</text>
<text x="698.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">+2</text>
<line x1="422.0" y1="262.0" x2="698.0" y2="262.0" stroke="#c9ced3" stroke-width="1.2"/>
<text x="422.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">сума степенів k:</text>
<text x="698.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="end" font-weight="700">+2</text>
<rect x="418.0" y="322.0" width="284.0" height="44.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<rect x="420.0" y="324.0" width="280.0" height="40.0" rx="6" fill="#fdecea" stroke="#fdecea" stroke-width="0.0"/><text x="560.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">k² → густина РОСТЕ вдвічі/крок</tspan></text>
<text x="380.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="28" fill="#6b7280" text-anchor="middle" font-weight="700">→</text>
<text x="380.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">зник −2</text>
<text x="380.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прибери один множник V² — і показник стрибає з 0 до +2. Плюс зверху статичний витік.</text>
</svg>