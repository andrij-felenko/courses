<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому зламалося масштабування Деннарда</text>
<line x1="90.0" y1="300.0" x2="90.0" y2="70.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="90.0" y1="300.0" x2="710.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="84.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">напруга V</text>
<text x="710.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">менший транзистор → →</text>
<line x1="90.0" y1="260.0" x2="710.0" y2="260.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="706.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">порогова напруга — нижче не можна</text>
<polyline points="100,90 340,315 510,272 700,266" fill="none" stroke="#2457d6" stroke-width="2.6"/>
<text x="240.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">V падає разом із розміром</text>
<text x="560.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">падати нікуди</text>
<line x1="510.0" y1="300.0" x2="510.0" y2="70.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="510.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">≈2004–2006</text>
<polyline points="510,294 580,270 650,210 704,100" fill="none" stroke="#c0392b" stroke-width="2.6"/>
<text x="704.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">струм витоку ↑↑</text>
<text x="704.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="end" font-style="italic">(експоненційно)</text>
<text x="390.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Квадрат V у формулі тримав густину потужності сталою, поки V падала.</text>
<text x="390.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коли V уперлася в поріг, падіння спинилось — і витоки поповзли вгору.</text>
<text x="390.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Обидві частини потужності потягли густину вгору — магія Деннарда скінчилася.</text>
</svg>