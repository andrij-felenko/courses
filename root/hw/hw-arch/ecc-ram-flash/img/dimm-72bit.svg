<text x="410.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">вісім зайвих бітів на 64 (≈12.5% пам'яті) — ціна за те, щоб поодинокий збій не валив сервер</text>
