<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Пекло DLL»: одне ім'я, багато несумісних версій</text>
<text x="430.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">спільна системна тека Windows</text>
<rect x="40.0" y="70.0" width="220.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="150.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Програма A</text>
<text x="150.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">чекає OLE2NLS v2.01</text>
<rect x="320.0" y="70.0" width="220.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="430.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Програма B</text>
<text x="430.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">ставить OLE2NLS v2.02</text>
<rect x="600.0" y="70.0" width="220.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="710.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Програма C</text>
<text x="710.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">чекає OLE2NLS v2.01</text>
<rect x="200.0" y="225.1" width="460.0" height="49.9" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="2.4"/><text x="430.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">СПІЛЬНА ТЕКА:  \Windows\System\</tspan><tspan x="430.0" dy="16.9">OLE2NLS.DLL  —  одне ім'я, одна копія</tspan></text>
<line x1="150.0" y1="130.0" x2="310.0" y2="225.1" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="710.0" y1="130.0" x2="550.0" y2="225.1" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="430.0" y1="130.0" x2="430.0" y2="225.1" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="560.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">перезапис!</text>
<rect x="170.0" y="335.1" width="520.0" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="430.0" y="356.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">B перезаписала спільний файл своєю версією —</tspan><tspan x="430.0" dy="16.9">A і C ламаються, хоч їх ніхто не чіпав</tspan></text>
<text x="430.0" y="414.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">+ якщо DLL і той, хто кличе, розійшлись в угоді виклику — стек тихо повзе</text>
</svg>