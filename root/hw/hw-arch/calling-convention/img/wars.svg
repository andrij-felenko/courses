<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Війна угод x86: cdecl проти stdcall</text>
<text x="440.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">хто прибирає стек після виклику?</text>
<rect x="40.0" y="70.0" width="380.0" height="350.0" rx="6" fill="#fafafa" stroke="#2457d6" stroke-width="2.0"/>
<rect x="40.0" y="70.0" width="380.0" height="44.0" rx="6" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/>
<text x="230.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">cdecl</text>
<text x="62.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">прибирає ТОЙ, ХТО КЛИЧЕ</text>
<text x="62.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"></text>
<text x="62.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">код прибирання — у КОЖНОМУ</text>
<text x="62.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">місці виклику (більше байтів)</text>
<text x="62.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"></text>
<text x="62.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">✓ змінне число аргументів:</text>
<text x="62.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">   printf, scanf працюють —</text>
<text x="62.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">   хто кличе, знає їхню</text>
<text x="62.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">   кількість завжди</text>
<rect x="460.0" y="70.0" width="380.0" height="350.0" rx="6" fill="#fafafa" stroke="#c0392b" stroke-width="2.0"/>
<rect x="460.0" y="70.0" width="380.0" height="44.0" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="650.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">stdcall</text>
<text x="482.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">прибирає ТА, КОГО КЛИЧУТЬ</text>
<text x="482.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"></text>
<text x="482.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">код прибирання — в ОДНОМУ</text>
<text x="482.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">місці (компактніше); стандарт</text>
<text x="482.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Win32 API, спадок Паскаля</text>
<text x="482.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">✗ змінне число аргументів</text>
<text x="482.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">   неможливе — callee наперед</text>
<text x="482.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">   не знає, скільки аргументів</text>
<text x="482.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">   прибирати</text>
<text x="440.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">одне дрібне рішення — два протилежні набори наслідків</text>
</svg>