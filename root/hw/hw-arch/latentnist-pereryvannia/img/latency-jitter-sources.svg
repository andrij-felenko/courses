<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чинники збільшення латентності переривань та джитера в мікроконтролерах</text>
<rect x="15.0" y="15.0" width="790.0" height="350.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="410.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джерела збільшення латентності та джитера (Jitter)</text>
<text x="410.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Чому реальна затримка може перевищувати теоретичні 12 тактів</text>
<rect x="40.0" y="95.0" width="340.0" height="95.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="52.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Flash Wait States &amp; I-Cache Miss</text>
<text x="52.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="52.0" dy="0.0">При роботі на високих частотах (наприклад, 168 МГц)</tspan><tspan x="52.0" dy="13.5">Flash вимагає до 5 циклів очікування (WS).</tspan><tspan x="52.0" dy="13.5">Промах кешу інструкцій додає 3–6 тактів на вибірку вектора.</tspan></text>
<rect x="420.0" y="95.0" width="360.0" height="95.0" rx="6" fill="#fff9e6" stroke="#b08800" stroke-width="1.5"/>
<text x="432.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08800" text-anchor="start" font-weight="700">Багатотактові неподільні інструкції</text>
<text x="432.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="432.0" dy="0.0">Інструкції LDRD/STRD або UDIV/SDIV (до 12 тактів)</tspan><tspan x="432.0" dy="13.5">не можуть бути перервані миттєво на деяких ядрах,</tspan><tspan x="432.0" dy="13.5">що змушує NVIC чекати завершення виконання команди.</tspan></text>
<rect x="40.0" y="215.0" width="340.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="52.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Критичні секції (CPSID / BASEPRI)</text>
<text x="52.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="52.0" dy="0.0">Програмне блокування переривань макросом __disable_irq()</tspan><tspan x="52.0" dy="13.5">або підняттям порогу BASEPRI у драйверах RTOS</tspan><tspan x="52.0" dy="13.5">відкладає реакцію на весь час виконання захищеного коду.</tspan></text>
<rect x="420.0" y="215.0" width="360.0" height="95.0" rx="6" fill="#e6f4ea" stroke="#27ae60" stroke-width="1.5"/>
<text x="432.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">FPU Lazy Stacking &amp; Шинні колізії</text>
<text x="432.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="432.0" dy="0.0">Збереження 16 регістрів FPU (s0–s15) додає затримку,</tspan><tspan x="432.0" dy="13.5">якщо в ISR використовується float-арифметика.</tspan><tspan x="432.0" dy="13.5">DMA та ядро можуть змагатися за доступ до шинної матриці.</tspan></text>
<rect x="40.0" y="325.0" width="740.0" height="30.0" rx="4" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.2"/>
<text x="410.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підсумок: Найгірший час реакції (WCET) = 12T + Flash_WS + Long_Inst + Critical_Section</text>
</svg>