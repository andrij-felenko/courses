<text x="680.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Виконання ISR 2</text>
<text x="765.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Втрата: 24T</text>
<text x="30.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Tail-Chaining:</text>
<rect x="160.0" y="160.0" width="150.0" height="32.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/>
<text x="235.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Виконання ISR 1</text>
<rect x="315.0" y="160.0" width="110.0" height="32.0" rx="4" fill="#fff9e6" stroke="#e0a800" stroke-width="2.0"/>
<text x="370.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b08800" text-anchor="middle" font-weight="700">Tail-Chain (6T)</text>
<rect x="430.0" y="160.0" width="150.0" height="32.0" rx="4" fill="#e6f4ea" stroke="#27ae60" stroke-width="1.4"/>
<text x="505.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Виконання ISR 2</text>
<text x="590.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Заощаджено 18 тактів! (Без unstack/restack)</text>
<text x="30.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Late Arrival:</text>
