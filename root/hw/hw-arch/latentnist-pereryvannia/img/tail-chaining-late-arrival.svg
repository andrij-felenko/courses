<rect x="420.0" y="260.0" width="150.0" height="32.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="495.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Виконання ISR High</text>
<rect x="575.0" y="260.0" width="90.0" height="32.0" rx="4" fill="#fff9e6" stroke="#e0a800" stroke-width="1.6"/>
<text x="620.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b08800" text-anchor="middle" font-weight="700">Tail-Chain (6T)</text>
<rect x="670.0" y="260.0" width="120.0" height="32.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/>
<text x="730.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">ISR Low</text>
<rect x="30.0" y="345.0" width="760.0" height="45.0" rx="6" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.2"/>
<text x="410.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">NVIC динамічно оптимізує чергу переривань: жодного зайвого такту на перепаковування стек-фрейму</text>
<text x="410.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Late Arrival гарантує найвищому пріоритету стабільні 12 тактів реакції навіть при раптовому виникненні</text>
</svg>