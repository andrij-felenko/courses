<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізми Tail-Chaining та Late Arrival у контролері NVIC</text>
<rect x="15.0" y="15.0" width="810.0" height="390.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="420.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратні оптимізації NVIC: Tail-Chaining та Late Arrival</text>
<text x="30.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Без оптимізації:</text>
<rect x="160.0" y="80.0" width="150.0" height="32.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/>
<text x="235.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Виконання ISR 1</text>
<rect x="315.0" y="80.0" width="140.0" height="32.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="385.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Unstacking (12T)</text>
<rect x="460.0" y="80.0" width="140.0" height="32.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="530.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Stacking (12T)</text>
