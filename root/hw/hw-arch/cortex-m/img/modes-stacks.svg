<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Режими Thread/Handler і два стеки MSP/PSP</text>
<text x="260.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e8449" text-anchor="middle" font-weight="700">Thread mode</text>
<text x="260.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(звичайний код, main, задачі)</text>
<text x="540.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b03a2e" text-anchor="middle" font-weight="700">Handler mode</text>
<text x="540.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(обробники винятків і IRQ)</text>
<rect x="150.0" y="110.0" width="220.0" height="90.0" rx="8" fill="#d5f5e3" stroke="#1e8449" stroke-width="2.0"/>
<text x="260.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">стек: MSP або PSP</tspan><tspan x="260.0" dy="14.3">(вибір у CONTROL)</tspan></text>
<rect x="430.0" y="110.0" width="220.0" height="90.0" rx="8" fill="#fce0dc" stroke="#b03a2e" stroke-width="2.0"/>
<text x="540.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">стек: ЗАВЖДИ MSP</tspan><tspan x="540.0" dy="14.3">(привілейований)</tspan></text>
<line x1="370.0" y1="140.0" x2="430.0" y2="140.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="400.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b03a2e" text-anchor="middle">виняток</text>
<line x1="430.0" y1="168.0" x2="370.0" y2="168.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="400.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e8449" text-anchor="middle">EXC_RETURN</text>
<rect x="150.0" y="250.0" width="500.0" height="80.0" rx="8" fill="#f8f4ff" stroke="#7d3c98" stroke-width="1.8"/>
<text x="400.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7d3c98" text-anchor="middle" font-weight="700">Типова розкладка в RTOS</text>
<text x="400.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">задачі — на своїх PSP (кожна зі своїм стеком) · ядро й переривання — на MSP</tspan><tspan x="400.0" dy="14.3">переповнення стеку однієї задачі не псує ядро</tspan></text>
</svg>