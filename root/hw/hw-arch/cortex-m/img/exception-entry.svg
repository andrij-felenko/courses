<text x="360.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="360.0" dy="0.0">Біт 2 — стек (MSP/PSP), біт 3 — режим.</tspan><tspan x="360.0" dy="14.3">FP-варіанти (E1/E9/ED) додають</tspan><tspan x="360.0" dy="14.3">кадр співпроцесора.</tspan><tspan x="360.0" dy="14.3"></tspan><tspan x="360.0" dy="14.3">BX LR із цим кодом → залізо</tspan><tspan x="360.0" dy="14.3">розкладає кадр назад. Тому</tspan><tspan x="360.0" dy="14.3">обробник — звичайна C-функція.</tspan></text>
