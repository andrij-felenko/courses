<text x="400.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Переклад через таблицю коштує зайвих звернень до пам'яті; TLB тримає недавні пари «сторінка → кадр», і майже всі доступи влучають у нього.</text>
