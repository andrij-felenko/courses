<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 431.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="431.6" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">У «архітектури фон Неймана» багато батьків</text>
<text x="450.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">задум, теорія, залізо й перший опис — це різні внески; історія стиснула їх в одне ім'я</text>
<rect x="26.0" y="86.0" width="200.0" height="274.0" rx="6" fill="#fafafa" stroke="#2457d6" stroke-width="1.6"/>
<circle cx="126.0" cy="124.0" r="12.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<path d="M108,154 Q126,134 144,154" fill="none" stroke="#2457d6" stroke-width="2.4"/>
<text x="126.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алан Тюрінг</text>
<text x="126.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">1936</text>
<rect x="76.0" y="230.0" width="100.0" height="24.0" rx="6" fill="#2457d6" stroke="#2457d6" stroke-width="0.0"/>
<text x="126.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">ТЕОРІЯ</text>
<text x="42.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Універсальна машина: одна</text>
<text x="42.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">машина здатна виконати</text>
<text x="42.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">будь-яке обчислення</text>
<rect x="242.0" y="86.0" width="200.0" height="274.0" rx="6" fill="#fafafa" stroke="#b8860b" stroke-width="1.6"/>
<circle cx="342.0" cy="124.0" r="12.0" fill="#ffffff" stroke="#b8860b" stroke-width="2.4"/>
<path d="M324,154 Q342,134 360,154" fill="none" stroke="#b8860b" stroke-width="2.4"/>
<text x="342.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еккерт і Моклі</text>
<text x="342.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">1943–45</text>
<rect x="292.0" y="230.0" width="100.0" height="24.0" rx="6" fill="#b8860b" stroke="#b8860b" stroke-width="0.0"/>
<text x="342.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">ЗАЛІЗО</text>
<text x="258.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Збудували ENIAC; ідея</text>
<text x="258.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">зберігати програму</text>
<text x="258.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">в пам'яті на лініях затримки</text>
<rect x="458.0" y="86.0" width="200.0" height="274.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<circle cx="558.0" cy="124.0" r="12.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<path d="M540,154 Q558,134 576,154" fill="none" stroke="#c0392b" stroke-width="2.4"/>
<text x="558.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джон фон Нейман</text>
<text x="558.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">1945</text>
<rect x="508.0" y="230.0" width="100.0" height="24.0" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="558.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">ОПИС</text>
<text x="474.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">«First Draft»: перший</text>
<text x="474.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ясний виклад архітектури —</text>
<text x="474.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">його ім'я й закріпилось</text>
<rect x="674.0" y="86.0" width="200.0" height="274.0" rx="6" fill="#fafafa" stroke="#27ae60" stroke-width="1.6"/>
<circle cx="774.0" cy="124.0" r="12.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.4"/>
<path d="M756,154 Q774,134 792,154" fill="none" stroke="#27ae60" stroke-width="2.4"/>
<text x="774.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Baby» й EDSAC</text>
<text x="774.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">1948–49</text>
<rect x="724.0" y="230.0" width="100.0" height="24.0" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="0.0"/>
<text x="774.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">ВТІЛЕННЯ</text>
<text x="690.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Британські машини, що</text>
<text x="690.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">першими реально виконали</text>
<text x="690.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">збережену програму</text>
<text x="450.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">«мати ідею» ≠ «довести теорему» ≠ «збудувати машину» ≠ «ясно описати» — і всі потрібні</text>
<text x="450.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">а перші робочі машини зі збереженою програмою були британські</text>
</svg>