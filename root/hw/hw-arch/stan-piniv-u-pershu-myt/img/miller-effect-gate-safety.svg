<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний захист затвора MOSFET від помилкового відкриття струмом Міллера</text>
<rect x="40.0" y="50.0" width="470.0" height="440.0" rx="8" fill="none" stroke="#e74c3c" stroke-width="2.0"/>
<rect x="49.5" y="63.0" width="451.0" height="24.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="275.0" y="79.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">НЕБЕЗПЕЧНО: Пін MCU у стані Hi-Z або слабка підтяжка 40 кОм</tspan></text>
<rect x="550.0" y="50.0" width="470.0" height="440.0" rx="8" fill="none" stroke="#27ae60" stroke-width="2.0"/>
<rect x="578.1" y="63.0" width="413.8" height="24.0" rx="6" fill="#d4efdf" stroke="#27ae60" stroke-width="1.5"/><text x="785.0" y="79.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">БЕЗПЕЧНО: Зовнішній жорсткий Pull-Down 4.7 кОм + Clamp</tspan></text>
<rect x="65.0" y="120.0" width="110.0" height="130.0" rx="4" fill="#eaeded" stroke="#7f8c8d" stroke-width="1.5"/>
<text x="120.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">MCU GPIO</text>
<text x="120.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Стан: Hi-Z</text>
<text x="120.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f8c8d" text-anchor="middle">R_int ≈ 40 кОм</text>
<text x="120.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f8c8d" text-anchor="middle">(Слабкий pull)</text>
<line x1="175.0" y1="180.0" x2="290.0" y2="180.0" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="290.0" cy="180.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<line x1="360.0" y1="120.0" x2="360.0" y2="160.0" stroke="#333333" stroke-width="2.5"/>
<rect x="252.7" y="94.5" width="214.6" height="21.0" rx="6" fill="#fbeee6" stroke="#e67e22" stroke-width="1.5"/><text x="360.0" y="108.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">+48V Швидке наростання (dV/dt)</tspan></text>
<line x1="340.0" y1="160.0" x2="360.0" y2="160.0" stroke="#333333" stroke-width="2.0"/>
<line x1="340.0" y1="200.0" x2="360.0" y2="200.0" stroke="#333333" stroke-width="2.0"/>
<line x1="340.0" y1="155.0" x2="340.0" y2="205.0" stroke="#333333" stroke-width="3.0"/>
<line x1="330.0" y1="160.0" x2="330.0" y2="200.0" stroke="#333333" stroke-width="2.0"/>
<line x1="290.0" y1="180.0" x2="330.0" y2="180.0" stroke="#333333" stroke-width="2.0"/>
<line x1="360.0" y1="200.0" x2="360.0" y2="240.0" stroke="#333333" stroke-width="2.5"/>
<line x1="350.0" y1="240.0" x2="370.0" y2="240.0" stroke="#333333" stroke-width="2.0"/>
<text x="360.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">GND (Силова земля)</text>
<rect x="295.0" y="125.0" width="45.0" height="26.0" rx="3" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
<text x="318.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">C_gd</text>
<line x1="360.0" y1="138.0" x2="340.0" y2="138.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2,2"/>
<line x1="295.0" y1="138.0" x2="290.0" y2="138.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2,2"/>
<line x1="290.0" y1="138.0" x2="290.0" y2="180.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="340.0" y1="138.0" x2="295.0" y2="138.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="250.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">i_Miller = C_gd · dV/dt</text>
<rect x="55.0" y="280.0" width="440.0" height="190.0" rx="6" fill="#fdedec" stroke="#e74c3c" stroke-width="1.5"/><text x="275.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Механізм аварії:</tspan><tspan x="275.0" dy="14.3">1. При включенні живлення 48В виникає dV_DS/dt &gt; 5 В/нс.</tspan><tspan x="275.0" dy="14.3">2. Струм i_Miller протікає через C_gd у затвор.</tspan><tspan x="275.0" dy="14.3">3. Опір виводу MCU високий (Hi-Z або R_int = 40 кОм).</tspan><tspan x="275.0" dy="14.3">4. Напруга V_GS = i_Miller · R_int перевищує поріг V_th (2В).</tspan><tspan x="275.0" dy="14.3">5. MOSFET відкривається → Наскрізний струм (Shoot-Through)</tspan><tspan x="275.0" dy="14.3">та миттєвий вибух силового напівмоста!</tspan></text>
<rect x="575.0" y="120.0" width="110.0" height="130.0" rx="4" fill="#eaeded" stroke="#7f8c8d" stroke-width="1.5"/>
<text x="630.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">MCU GPIO</text>
<text x="630.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f8c8d" text-anchor="middle">Стан: Hi-Z</text>
<text x="630.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f8c8d" text-anchor="middle">До ініціалізації</text>
<text x="630.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f8c8d" text-anchor="middle">в SystemInit()</text>
<line x1="685.0" y1="180.0" x2="800.0" y2="180.0" stroke="#333333" stroke-width="2.0"/>
<circle cx="800.0" cy="180.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<rect x="745.0" y="205.0" width="30.0" height="50.0" rx="3" fill="#e8f8f0" stroke="#27ae60" stroke-width="2.0"/>
<text x="760.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">R_PD</text>
<line x1="760.0" y1="180.0" x2="760.0" y2="205.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="760.0" y1="255.0" x2="760.0" y2="275.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="750.0" y1="275.0" x2="770.0" y2="275.0" stroke="#333333" stroke-width="2.0"/>
<text x="760.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">4.7 кОм (GND)</text>
<line x1="870.0" y1="120.0" x2="870.0" y2="160.0" stroke="#333333" stroke-width="2.5"/>
<rect x="762.7" y="94.5" width="214.6" height="21.0" rx="6" fill="#fbeee6" stroke="#e67e22" stroke-width="1.5"/><text x="870.0" y="108.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">+48V Швидке наростання (dV/dt)</tspan></text>
<line x1="850.0" y1="160.0" x2="870.0" y2="160.0" stroke="#333333" stroke-width="2.0"/>
<line x1="850.0" y1="200.0" x2="870.0" y2="200.0" stroke="#333333" stroke-width="2.0"/>
<line x1="850.0" y1="155.0" x2="850.0" y2="205.0" stroke="#333333" stroke-width="3.0"/>
<line x1="840.0" y1="160.0" x2="840.0" y2="200.0" stroke="#333333" stroke-width="2.0"/>
<line x1="800.0" y1="180.0" x2="840.0" y2="180.0" stroke="#333333" stroke-width="2.0"/>
<line x1="870.0" y1="200.0" x2="870.0" y2="240.0" stroke="#333333" stroke-width="2.5"/>
<line x1="860.0" y1="240.0" x2="880.0" y2="240.0" stroke="#333333" stroke-width="2.0"/>
<text x="870.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">GND (Силова земля)</text>
<rect x="805.0" y="125.0" width="45.0" height="26.0" rx="3" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/>
<text x="828.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">C_gd</text>
<line x1="870.0" y1="138.0" x2="850.0" y2="138.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
<line x1="805.0" y1="138.0" x2="800.0" y2="138.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
<line x1="800.0" y1="138.0" x2="800.0" y2="180.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="800.0" y1="145.0" x2="760.0" y2="200.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="717.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Шунтування струму</text>
<rect x="565.0" y="305.0" width="440.0" height="165.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="785.0" y="355.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Фізика надійного захисту:</tspan><tspan x="785.0" dy="14.3">1. Резистор R_PD = 4.7 кОм розпаяний безпосередньо біля затвора.</tspan><tspan x="785.0" dy="14.3">2. Струм i_Miller скидається на GND через низький опір R_PD.</tspan><tspan x="785.0" dy="14.3">3. Напруга на затворі V_GS = i_Miller · R_PD &lt; 0.4В.</tspan><tspan x="785.0" dy="14.3">4. Напруга суворо нижче порога V_th (2В) за будь-якого стану MCU.</tspan><tspan x="785.0" dy="14.3">5. Гарантований захист від наскрізного струму при включенні.</tspan></text>
</svg>