<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 715" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="715" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Організація таблиці векторів ARM Cortex-M</text>
<text x="480.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія таблиці векторів ARM Cortex-M: 16 системних слотів та периферійні переривання</text>
<text x="480.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Кожен слот — 32-бітне слово. Слот 0 завантажує SP, слоти 1..N містять адреси з бітом Thumb=1.</text>
<rect x="40.0" y="96.0" width="880.0" height="32.0" rx="6" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="85.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Зсув</text>
<text x="160.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Вектор #</text>
<text x="280.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Назва / Призначення</text>
<text x="500.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Тип / Властивість</text>
<text x="750.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Апаратна дія ядра при скиданні чи спрацюванні</text>
<rect x="40.0" y="130.0" width="880.0" height="36.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.1"/>
<text x="85.0" y="152.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">0x00</text>
<text x="160.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0</text>
<text x="280.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Initial MSP Value</text>
<text x="500.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Покажчик стека (не функція!)</text>
<text x="750.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Завантажується в SP (R13) апаратно до першої інструкції</text>
<rect x="40.0" y="169.0" width="880.0" height="36.0" rx="4" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.1"/>
<text x="85.0" y="191.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">0x04</text>
<text x="160.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1</text>
<text x="280.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Reset Handler</text>
<text x="500.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Вхідна точка прошивки</text>
<text x="750.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Завантажується в PC (R15), починає виконання коду [Thumb=1]</text>
<rect x="40.0" y="208.0" width="880.0" height="36.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.1"/>
<text x="85.0" y="230.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">0x08</text>
<text x="160.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">2</text>
<text x="280.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">NMI Handler</text>
<text x="500.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Немасковане переривання</text>
<text x="750.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Фіксований пріоритет -2; аварії живлення, годинника, ECC</text>
<rect x="40.0" y="247.0" width="880.0" height="36.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.1"/>
<text x="85.0" y="269.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">0x0C</text>
<text x="160.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">3</text>
<text x="280.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">HardFault Handler</text>
<text x="500.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Критична апаратна відмова</text>
<text x="750.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Фіксований пріоритет -1; падіння ядра, ескалація помилок</text>
<rect x="40.0" y="286.0" width="880.0" height="36.0" rx="4" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.1"/>
<text x="85.0" y="308.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700">0x10</text>
<text x="160.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">4</text>
<text x="280.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700">MemManage Fault</text>
<text x="500.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Порушення захисту MPU</text>
<text x="750.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Конфігурований пріоритет; доступ до забороненої пам'яті</text>
<rect x="40.0" y="325.0" width="880.0" height="36.0" rx="4" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.1"/>
<text x="85.0" y="347.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700">0x14</text>
<text x="160.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">5</text>
<text x="280.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700">BusFault Handler</text>
<text x="500.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Помилка системної шини</text>
<text x="750.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Конфігурований пріоритет; тайм-аут AHB/APB, помилка адреси</text>
<rect x="40.0" y="364.0" width="880.0" height="36.0" rx="4" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.1"/>
<text x="85.0" y="386.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700">0x18</text>
<text x="160.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">6</text>
<text x="280.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700">UsageFault Handler</text>
<text x="500.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Помилка інструкцій ядра</text>
<text x="750.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Ділення на нуль, непарний перехід, невирівняний доступ</text>
<rect x="40.0" y="403.0" width="880.0" height="36.0" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.1"/>
<text x="85.0" y="425.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">0x1C..28</text>
<text x="160.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">7..10</text>
<text x="280.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Reserved Slots</text>
<text x="500.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Зарезервовано архітектурою</text>
<text x="750.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Мають бути заповнені 0 або дескрипторами безпеки</text>
<rect x="40.0" y="442.0" width="880.0" height="36.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.1"/>
<text x="85.0" y="464.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">0x2C</text>
<text x="160.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">11</text>
<text x="280.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">SVCall Handler</text>
<text x="500.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Системний виклик (SVC)</text>
<text x="750.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Виклик супервізора для виходу в привілейований режим RTOS</text>
<rect x="40.0" y="481.0" width="880.0" height="36.0" rx="4" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.1"/>
<text x="85.0" y="503.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">0x30..34</text>
<text x="160.0" y="503.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">12..13</text>
<text x="280.0" y="503.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">DebugMon / Reserved</text>
<text x="500.0" y="503.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Монітор відлагодження</text>
<text x="750.0" y="503.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Точки зупинки, відлагоджувальні пастки апаратури</text>
<rect x="40.0" y="520.0" width="880.0" height="36.0" rx="4" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.1"/>
<text x="85.0" y="542.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">0x38</text>
<text x="160.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">14</text>
<text x="280.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">PendSV Handler</text>
<text x="500.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Відкладене переривання</text>
<text x="750.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Асинхронне перемикання контексту задач в ОС (низький пріоритет)</text>
<rect x="40.0" y="559.0" width="880.0" height="36.0" rx="4" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.1"/>
<text x="85.0" y="581.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">0x3C</text>
<text x="160.0" y="581.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">15</text>
<text x="280.0" y="581.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">SysTick Handler</text>
<text x="500.0" y="581.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Системний квант часу</text>
<text x="750.0" y="581.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Періодичний таймер планувальника операційної системи</text>
<rect x="40.0" y="598.0" width="880.0" height="36.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.1"/>
<text x="85.0" y="620.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">0x40+</text>
<text x="160.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">16..N</text>
<text x="280.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">External IRQ #0..#N</text>
<text x="500.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Периферійні переривання</text>
<text x="750.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Маршрутизуються контролером NVIC: UART, SPI, DMA, GPIO, TIM</text>
<rect x="40.0" y="647.0" width="880.0" height="48.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="480.0" y="665.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Біт 0 адреси обробника (LSB) ЗАВЖДИ має дорівнювати 1, позначаючи виконання в режимі Thumb.</text>
<text x="480.0" y="681.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Запис адреси з бітом 0 = 0 викликає негайне падіння ядра в UsageFault (INVSTATE) при виклику вектора.</text>
</svg>