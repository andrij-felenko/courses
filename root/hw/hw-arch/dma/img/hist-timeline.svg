<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 552" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="552" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як визрівала думка «хай пристрій сам іде в пам'ять»</text>
<text x="480.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">роки — за першою поставкою або оголошенням машини</text>
<line x1="150.0" y1="76.0" x2="150.0" y2="524.0" stroke="#cccccc" stroke-width="1.6" stroke-dasharray="5,6"/>
<text x="132.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">1951</text>
<circle cx="150.0" cy="100.0" r="5.0" fill="#e7f6ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="176.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">UNIVAC I — буфер вводу-виводу</text>
<text x="176.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">стрічка говорить із буфером, але блок у пам'ять усе одно переносить обчислювач</text>
<text x="132.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">1954</text>
<circle cx="150.0" cy="158.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="176.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">DYSEAC (NBS) і SAGE (IBM) — прямий доступ</text>
<text x="176.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">пристрій уперше йде в пам'ять сам; чия першість — сперечаються досі</text>
<text x="132.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">1957</text>
<circle cx="150.0" cy="216.0" r="5.0" fill="#e7f6ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="176.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">IBM 709 — «синхронізатор даних» 766</text>
<text x="176.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">канал стає окремим виконавцем власної програми вводу-виводу</text>
<text x="132.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">1964</text>
<circle cx="150.0" cy="274.0" r="5.0" fill="#e7f6ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="176.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">IBM System/360 і CDC 6600</text>
<text x="176.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">канали з програмами команд; у Крея — десять повноцінних периферійних процесорів</text>
<text x="132.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">1965</text>
<circle cx="150.0" cy="332.0" r="5.0" fill="#e7f6ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="176.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">DEC PDP-8 «data break», IBM 1130 «cycle steal»</text>
<text x="176.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">прямий доступ приходить у дешеві міні-машини — і дістає власну назву від кожного виробника</text>
<text x="132.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">1979</text>
<circle cx="150.0" cy="390.0" r="5.0" fill="#e7f6ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="176.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Intel 8237 і Intel 8089</text>
<text x="176.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">дві філософії поруч: тупий лічильник-возій і канал-співпроцесор із власними командами</text>
<text x="132.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">1981</text>
<circle cx="150.0" cy="448.0" r="5.0" fill="#e7f6ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="176.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">IBM PC — один 8237A-5 на платі</text>
<text x="176.0" y="467.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">канал 0 витрачено не на дані, а на оновлення динамічної пам'яті</text>
<text x="132.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">1982</text>
<circle cx="150.0" cy="506.0" r="5.0" fill="#e7f6ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="176.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Intel 80186 — DMA переїжджає на кристал</text>
<text x="176.0" y="525.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">контролер, таймери й переривання в одному корпусі: форма сучасного мікроконтролера</text>
</svg>