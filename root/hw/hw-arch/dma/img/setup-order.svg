<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Налаштування каналу: анкета ліворуч, два замки на трубі праворуч</text>
<line x1="501.0" y1="58.0" x2="501.0" y2="515.0" stroke="#dddddd" stroke-width="1.5" stroke-dasharray="5,6"/>
<text x="253.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Бік DMA: заповнити й звести</text>
<rect x="44.0" y="92.0" width="418.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="253.0" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="253.0" dy="0.0">① такт: RCC-&gt;AHBENR |= RCC_AHBENR_DMA1EN</tspan></text>
<rect x="44.0" y="138.0" width="418.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="253.0" y="161.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="253.0" dy="0.0">② погасити канал: CCR.EN = 0</tspan></text>
<rect x="44.0" y="184.0" width="418.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="253.0" y="207.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="253.0" dy="0.0">③ стерти прапорці: DMA1-&gt;IFCR = CGIF1</tspan></text>
<rect x="44.0" y="230.0" width="418.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="253.0" y="253.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="253.0" dy="0.0">④ CPAR = (uint32_t)&amp;ADC1-&gt;DR — АДРЕСА регістра</tspan></text>
<rect x="44.0" y="276.0" width="418.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="253.0" y="299.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="253.0" dy="0.0">⑤ CMAR = (uint32_t)adc_buf — адреса буфера</tspan></text>
<rect x="44.0" y="322.0" width="418.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="253.0" y="345.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="253.0" dy="0.0">⑥ CNDTR = 1024 — елементів, не байтів</tspan></text>
<rect x="44.0" y="368.0" width="418.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="253.0" y="391.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="253.0" dy="0.0">⑦ CCR = напрямок · інкременти · ширини · кільце</tspan></text>
<rect x="44.0" y="414.0" width="418.0" height="38.0" rx="6" fill="#e7f6ee" stroke="#27ae60" stroke-width="2.0"/><text x="253.0" y="437.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="253.0" dy="0.0">⑧ CCR.EN = 1 — ЗАМОК 1 відкрито</tspan></text>
<rect x="44.0" y="468.0" width="418.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="253.0" y="487.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="253.0" dy="0.0">поки EN = 1, записи в CPAR / CMAR / CNDTR</tspan><tspan x="253.0" dy="14.3">контролер просто ігнорує</tspan></text>
<text x="710.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Шлях даних і два замки на ньому</text>
<rect x="540.0" y="110.0" width="340.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="710.0" y="136.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">АЦП: новий відлік у ADC1-&gt;DR</tspan></text>
<rect x="540.0" y="172.0" width="340.0" height="52.0" rx="6" fill="#e7f6ee" stroke="#27ae60" stroke-width="2.0"/><text x="710.0" y="194.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">ЗАМОК 2 · ADC1-&gt;CR2 |= ADC_CR2_DMA</tspan><tspan x="710.0" dy="15.6">дозвіл піднімати запит</tspan></text>
<rect x="540.0" y="242.0" width="340.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="710.0" y="264.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">канал DMA1_Channel1</tspan><tspan x="710.0" dy="15.6">CPAR · CMAR · CNDTR · CCR</tspan></text>
<rect x="540.0" y="312.0" width="340.0" height="52.0" rx="6" fill="#e7f6ee" stroke="#27ae60" stroke-width="2.0"/><text x="710.0" y="334.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">ЗАМОК 1 · CCR.EN = 1</tspan><tspan x="710.0" dy="15.6">канал зведено</tspan></text>
<rect x="540.0" y="382.0" width="340.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="710.0" y="408.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">буфер adc_buf[1024] у ОЗП</tspan></text>
<line x1="710.0" y1="154.0" x2="710.0" y2="170.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="710.0" y1="224.0" x2="710.0" y2="240.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="710.0" y1="294.0" x2="710.0" y2="310.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="710.0" y1="364.0" x2="710.0" y2="380.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="540.0" y="468.0" width="340.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="710.0" y="487.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">номер каналу задає кремній:</tspan><tspan x="710.0" dy="14.3">ADC1 просить лише DMA1_Channel1</tspan></text>
<rect x="40.0" y="530.0" width="860.0" height="52.0" rx="6" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.2"/><text x="470.0" y="560.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Закритий будь-який із двох замків — і в буфері назавжди лишиться нуль: канал мовчить і ні на що не скаржиться.</tspan></text>
</svg>