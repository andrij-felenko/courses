<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Канал мовчить? CNDTR показує, де саме обрив</text>
<rect x="340.0" y="52.0" width="300.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="490.0" y="78.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">прочитай CNDTR двічі з паузою</tspan></text>
<line x1="490.0" y1="96.0" x2="490.0" y2="128.0" stroke="#333333" stroke-width="1.6"/>
<line x1="165.0" y1="128.0" x2="815.0" y2="128.0" stroke="#333333" stroke-width="1.6"/>
<line x1="165.0" y1="128.0" x2="165.0" y2="148.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="20.0" y="150.0" width="290.0" height="42.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="165.0" y="175.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">не змінюється зовсім</tspan></text>
<line x1="165.0" y1="192.0" x2="165.0" y2="212.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="20.0" y="214.0" width="290.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="165.0" y="238.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">запит не доходить до каналу</tspan></text>
<line x1="165.0" y1="254.0" x2="165.0" y2="274.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="20.0" y="276.0" width="290.0" height="172.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/>
<text x="34.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="34.0" dy="0.0">• не той канал: запит живе</tspan><tspan x="34.0" dy="14.9">   лише на своєму номері</tspan><tspan x="34.0" dy="14.9">• не піднято дозвіл DMA</tspan><tspan x="34.0" dy="14.9">   у самій периферії</tspan><tspan x="34.0" dy="14.9">• периферію не запущено</tspan><tspan x="34.0" dy="14.9">• нема такту DMA у RCC</tspan></text>
<line x1="490.0" y1="128.0" x2="490.0" y2="148.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="345.0" y="150.0" width="290.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/><text x="490.0" y="175.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">зменшився раз і став</tspan></text>
<line x1="490.0" y1="192.0" x2="490.0" y2="212.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="345.0" y="214.0" width="290.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="490.0" y="238.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">лічильник дійшов нуля</tspan></text>
<line x1="490.0" y1="254.0" x2="490.0" y2="274.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="345.0" y="276.0" width="290.0" height="172.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/>
<text x="359.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="359.0" dy="0.0">• звичайний режим без CIRC —</tspan><tspan x="359.0" dy="14.9">   так і має бути: вимкни канал,</tspan><tspan x="359.0" dy="14.9">   перезаряди CNDTR, увімкни</tspan><tspan x="359.0" dy="14.9">• або злетів TEIF: адреса поза</tspan><tspan x="359.0" dy="14.9">   мапою чи буфер у пам'яті,</tspan><tspan x="359.0" dy="14.9">   недосяжній для контролера</tspan></text>
<line x1="815.0" y1="128.0" x2="815.0" y2="148.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="670.0" y="150.0" width="290.0" height="42.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="815.0" y="175.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">біжить, а дані не ті</tspan></text>
<line x1="815.0" y1="192.0" x2="815.0" y2="212.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="670.0" y="214.0" width="290.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="815.0" y="238.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">возить не те й не туди</tspan></text>
<line x1="815.0" y1="254.0" x2="815.0" y2="274.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="670.0" y="276.0" width="290.0" height="172.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/>
<text x="684.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="684.0" dy="0.0">• PSIZE / MSIZE не збігаються</tspan><tspan x="684.0" dy="14.9">   з реальною шириною даних</tspan><tspan x="684.0" dy="14.9">• MINC / PINC переплутано</tspan><tspan x="684.0" dy="14.9">• кеш або брак volatile</tspan><tspan x="684.0" dy="14.9">• ядро не встигло за півбуфером</tspan><tspan x="684.0" dy="14.9">   і читає вже перезаписане</tspan></text>
<rect x="40.0" y="462.0" width="900.0" height="46.0" rx="6" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.2"/><text x="490.0" y="489.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">CNDTR читається на ходу й рахує, скільки елементів ЛИШИЛОСЬ — це найдешевший осцилограф каналу.</tspan></text>
</svg>