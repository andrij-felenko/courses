<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від ESP8266 до ESP32: що додалося і чому це стало стандартом</text>
<rect x="60.0" y="100.0" width="320.0" height="200.0" rx="12" fill="#f7f4ea" stroke="#caa24a" stroke-width="2.0"/>
<text x="220.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#8a6a14" text-anchor="middle" font-weight="700">ESP8266 (2014)</text>
<text x="82.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• одне ядро</text>
<text x="82.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• лише Wi-Fi</text>
<text x="82.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• мало ніжок</text>
<text x="82.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• документація «зроби сам»</text>
<rect x="440.0" y="100.0" width="320.0" height="200.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.2"/>
<text x="600.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ESP32 (2016)</text>
<text x="462.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• два ядра</text>
<text x="462.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Wi-Fi + Bluetooth/BLE</text>
<text x="462.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• багато периферії й ніжок</text>
<text x="462.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• офіційна екосистема з 1-го дня</text>
<line x1="382.0" y1="200.0" x2="438.0" y2="200.0" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="410.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">уроки</text>
<text x="410.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">залізо стало кращим, але переможним його зробив готовий світ навколо</text>
</svg>