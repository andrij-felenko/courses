<rect x="460.0" y="80.0" width="350.0" height="285.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="635.0" y="227.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0"></tspan></text>
<text x="475.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Властивості коду Грея:</text>
<text x="475.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="475.0" dy="0.0">1. Дистанція Геммінга = 1:</tspan><tspan x="475.0" dy="12.5">   Між будь-якими сусідніми станами</tspan><tspan x="475.0" dy="12.5">   змінюється рівно 1 біт сигналу.</tspan><tspan x="475.0" dy="12.5"></tspan><tspan x="475.0" dy="12.5">2. Абсолютна стійкість до джитеру:</tspan><tspan x="475.0" dy="12.5">   Вібрація на межі перемикання (00 ↔ 10)</tspan><tspan x="475.0" dy="12.5">   породжує взаємно компенсовані кроки</tspan><tspan x="475.0" dy="12.5">   (+1 та −1). Похибка не накопичується.</tspan><tspan x="475.0" dy="12.5"></tspan><tspan x="475.0" dy="12.5">3. Заборонені діагональні переходи (ERR):</tspan><tspan x="475.0" dy="12.5">   Зміна 2 бітів одночасно (00 ↔ 11 або 01 ↔ 10)</tspan><tspan x="475.0" dy="12.5">   фізично неможлива при справному датчику.</tspan><tspan x="475.0" dy="12.5">   Це ознака шуму або перевищення швидкості.</tspan></text>
</svg>