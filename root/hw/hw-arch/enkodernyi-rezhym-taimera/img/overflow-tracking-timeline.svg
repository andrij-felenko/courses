<text x="45.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Апаратний регістр TIMx_CNT (16-бітний діапазон 0 ... 65535, ARR = 0xFFFF):</text>
