<circle cx="210.0" cy="335.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="0.0"/>
<line x1="210.0" y1="335.0" x2="330.0" y2="300.0" stroke="#27ae60" stroke-width="2.5"/>
<circle cx="330.0" cy="300.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="0.0"/>
<line x1="330.0" y1="300.0" x2="414.0" y2="275.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="414.0" y1="275.0" x2="498.0" y2="300.0" stroke="#27ae60" stroke-width="2.5"/>
<rect x="530.0" y="250.0" width="265.0" height="135.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="662.5" y="279.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="662.5" dy="0.0">Обчислення повної позиції:</tspan><tspan x="662.5" dy="11.7"></tspan><tspan x="662.5" dy="11.7">1. Метод акумулятора переповнень:</tspan><tspan x="662.5" dy="11.7">pos = (overflow_count &lt;&lt; 16) + CNT</tspan><tspan x="662.5" dy="11.7"></tspan><tspan x="662.5" dy="11.7">2. Дельта-метод (без переривань):</tspan><tspan x="662.5" dy="11.7">delta = (int16_t)(CNT - last_CNT)</tspan><tspan x="662.5" dy="11.7">total_pos += delta</tspan></text>
</svg>