<rect x="530.0" y="85.0" width="265.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="662.5" y="113.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="662.5" dy="0.0">Переповнення (UP):</tspan><tspan x="662.5" dy="11.7">При переході 65535 → 0</tspan><tspan x="662.5" dy="11.7">виникає Update Interrupt (UIF).</tspan><tspan x="662.5" dy="11.7"></tspan><tspan x="662.5" dy="11.7">Недоповнення (DOWN):</tspan><tspan x="662.5" dy="11.7">При переході 0 → 65535</tspan><tspan x="662.5" dy="11.7">виникає Update Interrupt (UIF).</tspan></text>
<rect x="30.0" y="235.0" width="780.0" height="165.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.2"/><text x="420.0" y="322.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0"></tspan></text>
<text x="45.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Розгорнута неперервна абсолютна позиція total_position (int64_t):</text>
<text x="80.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end" font-weight="700">0</text>
