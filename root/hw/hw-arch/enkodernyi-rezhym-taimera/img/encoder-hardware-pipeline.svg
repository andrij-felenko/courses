<rect x="25.0" y="305.0" width="790.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="420.0" y="327.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Повна апаратна автономність: імпульси з виводів безпосередньо керують лічильником CNT.</tspan><tspan x="420.0" dy="14.3">Процесор не витрачає жодного такту на підрахунок кроків та визначення напрямку обертання.</tspan></text>
