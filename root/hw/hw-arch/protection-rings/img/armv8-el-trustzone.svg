<rect x="60.0" y="200.0" width="900.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#d0d0d0" stroke-width="1.0"/><text x="510.0" y="234.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0"></tspan></text>
<text x="100.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">EL1</text>
<rect x="180.0" y="210.0" width="240.0" height="40.0" rx="6" fill="#fff2df" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="234.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Rich OS Kernel (Linux / Win)</tspan></text>
<rect x="600.0" y="210.0" width="240.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="234.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Secure OS (OP-TEE / Trusty)</tspan></text>
<rect x="60.0" y="300.0" width="900.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#d0d0d0" stroke-width="1.0"/><text x="510.0" y="334.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0"></tspan></text>
<text x="100.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">EL2</text>
<rect x="180.0" y="310.0" width="240.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Hypervisor (KVM / Xen)</tspan></text>
<rect x="600.0" y="310.0" width="240.0" height="40.0" rx="6" fill="#fff2df" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Secure EL2 (Virtualization)</tspan></text>
<rect x="60.0" y="410.0" width="900.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="510.0" y="451.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0"></tspan></text>
<text x="100.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">EL3</text>
<text x="510.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Secure Monitor &amp; Firmware (TF-A / Root of Trust)</text>
<text x="510.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Керує SCR_EL3, перемикає контексти світів, маршрутизує переривання SMC/FIQ</text>
<line x1="300.0" y1="150.0" x2="300.0" y2="210.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="340.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">SVC (Syscall)</text>
<line x1="300.0" y1="250.0" x2="300.0" y2="310.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="340.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">HVC (Hypercall)</text>
<line x1="430.0" y1="230.0" x2="480.0" y2="420.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="475.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">SMC (Secure Monitor Call)</text>
<line x1="170.0" y1="420.0" x2="170.0" y2="250.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="155.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">ERET</text>
<text x="510.0" y="530.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Рівні винятків суворо ізольовані: перехід угору (підвищення прав) відбувається ТІЛЬКИ через виняток,</text>
<text x="510.0" y="555.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">а повернення вниз — інструкцією ERET з відновленням стану з SPSR_ELx та адреси з ELR_ELx.</text>
</svg>