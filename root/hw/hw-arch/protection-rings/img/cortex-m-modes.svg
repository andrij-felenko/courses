<rect x="120.0" y="460.0" width="740.0" height="90.0" rx="6" fill="#f9fbfd" stroke="#333333" stroke-width="1.4"/>
<text x="490.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Системний регістр процесора CONTROL</text>
<text x="240.0" y="515.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Біт 0: nPRIV (0 = Privileged, 1 = Unprivileged)</text>
<text x="580.0" y="515.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Біт 1: SPSEL (0 = MSP, 1 = PSP)</text>
<text x="490.0" y="538.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Біт 2: FPCA (активність контексту апаратного FPU)</text>
