<rect x="147.7" y="118.2" width="264.5" height="83.7" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="280.0" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Handler Mode (Privileged)</tspan><tspan x="280.0" dy="16.9">Виконує ISR / винятки</tspan><tspan x="280.0" dy="16.9">Завжди стек MSP</tspan><tspan x="280.0" dy="16.9">Повний доступ до SCB / NVIC / MPU</tspan></text>
<rect x="642.2" y="118.2" width="175.6" height="83.7" rx="6" fill="#f4f6f8" stroke="#d0d0d0" stroke-width="1.5"/><text x="730.0" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="730.0" dy="0.0">Апаратно неможливо</tspan><tspan x="730.0" dy="16.9">Handler Mode завжди</tspan><tspan x="730.0" dy="16.9">виконується з повними</tspan><tspan x="730.0" dy="16.9">привілеями</tspan></text>
<text x="50.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Thread
Mode</text>
<text x="50.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(основний
