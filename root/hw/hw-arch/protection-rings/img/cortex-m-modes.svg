<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26 -10 1006 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-26" y="-10" width="1006" height="590" fill="#ffffff"/>
