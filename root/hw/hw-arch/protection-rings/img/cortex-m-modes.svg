<rect x="177.4" y="308.1" width="205.2" height="83.7" rx="6" fill="#fff2df" stroke="#333333" stroke-width="1.6"/><text x="280.0" y="329.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Privileged Thread Mode</tspan><tspan x="280.0" dy="16.9">Ядро RTOS / ініціалізація</tspan><tspan x="280.0" dy="16.9">Стек MSP або PSP</tspan><tspan x="280.0" dy="16.9">CONTROL.nPRIV = 0</tspan></text>
<rect x="627.4" y="308.1" width="205.2" height="83.7" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="730.0" y="329.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Unprivileged Thread Mode</tspan><tspan x="730.0" dy="16.9">Користувацькі задачі RTOS</tspan><tspan x="730.0" dy="16.9">Зазвичай стек PSP</tspan><tspan x="730.0" dy="16.9">CONTROL.nPRIV = 1</tspan></text>
