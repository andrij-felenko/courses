<text x="450.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приклади розділення розрядностей в реальних процесорах</text>
<text x="60.0" y="390.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">Intel 8088:   16-бітні GPR  |  16-бітний ALU  |  8-бітна шина даних  |  20-бітна адреса (1 МБ)</text>
<text x="60.0" y="415.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">Motorola 68k: 32-бітні GPR  |  16-бітний ALU  |  16-бітна шина даних |  24-бітна адреса (16 МБ)</text>
<text x="60.0" y="440.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">x86-64 сучасні: 64-бітні GPR  |  64-бітний ALU  |  64/128-біт шина пам'яті | 48/57-біт віртуальна адреса</text>
</svg>