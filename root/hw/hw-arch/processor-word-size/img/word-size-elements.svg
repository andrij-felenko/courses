<rect x="112.1" y="228.4" width="235.8" height="63.2" rx="6" fill="#fdf6e3" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Шина даних (Data Bus)</tspan><tspan x="230.0" dy="15.6">Внутрішня / зовнішня шина</tspan><tspan x="230.0" dy="15.6">(пропускна здатність за такт)</tspan></text>
<rect x="555.8" y="228.4" width="228.3" height="63.2" rx="6" fill="#f3e8fd" stroke="#8e44ad" stroke-width="1.5"/><text x="670.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">Адресна шина (Address Bus)</tspan><tspan x="670.0" dy="15.6">Фізичні адресні лінії до RAM</tspan><tspan x="670.0" dy="15.6">(максимальний обсяг пам'яті)</tspan></text>
