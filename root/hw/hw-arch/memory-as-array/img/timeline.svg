<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як машини вчилися пам'ятати</text>
<line x1="60.0" y1="150.0" x2="760.0" y2="150.0" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="110.0" cy="150.0" r="8.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.4"/>
<text x="110.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">~1946</text>
<rect x="15.0" y="30.0" width="190.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/>
<text x="110.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">лінії затримки</text>
<text x="110.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="110.0" dy="0.0">ртуть; біти по колу,</tspan><tspan x="110.0" dy="12.3">послідовно й повільно</tspan></text>
<circle cx="310.0" cy="150.0" r="8.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.4"/>
<text x="310.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">1947</text>
<rect x="215.0" y="194.0" width="190.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/>
<text x="310.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">трубки Вільямса</text>
<text x="310.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="310.0" dy="0.0">плямки на екрані;</tspan><tspan x="310.0" dy="12.3">швидко, та крихко</tspan></text>
<circle cx="510.0" cy="150.0" r="8.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.4"/>
<text x="510.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">~1950</text>
<rect x="415.0" y="30.0" width="190.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/>
<text x="510.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">магнітні барабани</text>
<text x="510.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="510.0" dy="0.0">місткі, але механічні —</tspan><tspan x="510.0" dy="12.3">чекай оберту</tspan></text>
<circle cx="710.0" cy="150.0" r="8.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.4"/>
<text x="710.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1953</text>
<rect x="615.0" y="194.0" width="190.0" height="71.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/>
<text x="710.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">пам'ять на осердях</text>
<text x="710.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="710.0" dy="0.0">швидкість, надійність,</tspan><tspan x="710.0" dy="12.3">випадковий доступ,</tspan><tspan x="710.0" dy="12.3">нелеткість</tspan></text>
<text x="410.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Осердя (червоний вузол) дали все одразу й панували ~20 років, аж поки DRAM не успадкувала їхню ідею.</text>
</svg>