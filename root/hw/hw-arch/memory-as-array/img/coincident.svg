<text x="360.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пів-струму по рядку X плюс пів-струму по стовпцю Y дають повний струм РІВНО на перетині.</text>
<text x="360.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Решта осердь дістають лише половину — замало, щоб перемкнутися.</text>
<text x="360.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Так одне осердя з тисяч адресують ДВОМА дротами, а не дротом до кожного.</text>
