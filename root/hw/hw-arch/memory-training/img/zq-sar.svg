<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 926 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="926" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="463.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Опір теж шукають бінарно: послідовне наближення до еталона</text>
<text x="463.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Пошук коду опору: той самий метод, що в АЦП послідовного наближення</text>
<line x1="90.0" y1="300.0" x2="730.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="730.0" y1="300.0" x2="750.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="750.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">код (кількість ніжок) →</text>
<line x1="461.2" y1="150.0" x2="461.2" y2="312.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="5,4"/>
<text x="461.2" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">еталон 240 Ω</text>
<circle cx="410.0" cy="270.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<line x1="410.0" y1="270.0" x2="410.0" y2="300.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="2,3"/>
<text x="410.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">крок 1: біт=1</text>
<text x="760.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">старший квант: замало → лишити</text>
<circle cx="570.0" cy="236.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<line x1="570.0" y1="236.0" x2="570.0" y2="300.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="2,3"/>
<text x="570.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">крок 2: біт=0</text>
<text x="760.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">наступний: забагато → зняти</text>
<circle cx="486.8" cy="202.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<line x1="486.8" y1="202.0" x2="486.8" y2="300.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="2,3"/>
<text x="486.8" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">крок 3: біт=1</text>
<text x="760.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">далі: замало → лишити</text>
<circle cx="461.2" cy="168.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<line x1="461.2" y1="168.0" x2="461.2" y2="300.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="2,3"/>
<text x="461.2" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">крок 4: біт=1</text>
<text x="760.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">молодший: зійшлось</text>
<rect x="70.0" y="330.0" width="680.0" height="46.0" rx="6" fill="#fffef0" stroke="#caa300" stroke-width="1.5"/><text x="410.0" y="349.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Компаратор дає лише «більше/менше» — тож логіка йде від старшого кванта до молодшого,</tspan><tspan x="410.0" dy="14.3">щоразу лишаючи ніжку ввімкненою чи ні. Кілька кроків замість перебору всіх кодів.</tspan></text>
</svg>