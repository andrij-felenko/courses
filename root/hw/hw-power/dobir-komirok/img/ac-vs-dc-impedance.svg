<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння методів вимірювання: AC IR (1 кГц) проти DC IR (імпульс)</text>
<rect x="40.0" y="65.0" width="380.0" height="290.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="230.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">AC IR (1 кГц, Міліомметр)</text>
<line x1="70.0" y1="145.0" x2="390.0" y2="145.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<path d="M 70.0 145.0 L 75.4 139.5 L 80.8 134.3 L 86.3 129.5 L 91.7 125.4 L 97.1 122.3 L 102.5 120.1 L 108.0 119.1 L 113.4 119.2 L 118.8 120.5 L 124.2 123.0 L 129.7 126.4 L 135.1 130.6 L 140.5 135.5 L 145.9 140.9 L 151.4 146.4 L 156.8 151.8 L 162.2 157.0 L 167.6 161.6 L 173.1 165.5 L 178.5 168.4 L 183.9 170.3 L 189.3 171.0 L 194.7 170.5 L 200.2 169.0 L 205.6 166.3 L 211.0 162.6 L 216.4 158.2 L 221.9 153.2 L 227.3 147.8 L 232.7 142.2 L 238.1 136.8 L 243.6 131.8 L 249.0 127.4 L 254.4 123.7 L 259.8 121.0 L 265.3 119.5 L 270.7 119.0 L 276.1 119.7 L 281.5 121.6 L 286.9 124.5 L 292.4 128.4 L 297.8 133.0 L 303.2 138.2 L 308.6 143.6 L 314.1 149.1 L 319.5 154.5 L 324.9 159.4 L 330.3 163.6 L 335.8 167.0 L 341.2 169.5 L 346.6 170.8 L 352.0 170.9 L 357.5 169.9 L 362.9 167.7 L 368.3 164.6 L 373.7 160.5 L 379.2 155.7 L 384.6 150.5 L 390.0 145.0" fill="none" stroke="#2457d6" stroke-width="2"/>
<text x="230.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">f = 1000 Гц (T = 1 мс), 4-точковий Кельвін</text>
<text x="60.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Міряє суто омічний опір R_ohm</text>
<text x="60.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Не чіпає повільну хімічну поляризацію</text>
<text x="60.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Час тесту: 10–50 мс (ідеально для лінії)</text>
<text x="60.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Не розряджає й не гріє комірку</text>
<text x="60.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Стандарт заводського сортування</text>
<rect x="460.0" y="65.0" width="380.0" height="290.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="650.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">DC IR (Струмовий імпульс під навантаженням)</text>
<line x1="490.0" y1="125.0" x2="540.0" y2="125.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="540.0" y1="125.0" x2="540.0" y2="155.0" stroke="#c0392b" stroke-width="2.0"/>
<path d="M 540.0 155.0 L 590.0 170.0 L 670.0 180.0 L 710.0 183.0" fill="none" stroke="#c0392b" stroke-width="2"/>
<line x1="710.0" y1="183.0" x2="710.0" y2="153.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="710.0" y1="153.0" x2="810.0" y2="127.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="545.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">ΔV_ohm</text>
<text x="620.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">ΔV_поляризації</text>
<text x="480.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• R_dc = (V_1 − V_2) / (I_2 − I_1)</text>
<text x="480.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Включає R_ohm + R_ct (перенос) + R_sei</text>
<text x="480.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Показує реальну просадку під тягою</text>
<text x="480.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Триває від 1 до 10 секунд на комірку</text>
<text x="480.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Критичний для дронів та електротяги</text>
<rect x="69.5" y="379.5" width="741.0" height="31.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="398.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">AC IR міряє стан контактів та електроліту без розряду; DC IR показує повний динамічний імпеданс під робочим струмом</tspan></text>
</svg>