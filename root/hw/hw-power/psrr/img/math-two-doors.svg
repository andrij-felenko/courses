<text x="475.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Перший доданок петля ділить на (1+T) і може загнати як завгодно низько; другий вона лише множить — нижче нього PSRR не опуститься</text>
