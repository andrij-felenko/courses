<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 524" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="524" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Черга до прохідного елемента: жоден перехід не почався з нової ідеї</text>
<text x="650.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Згори тисне те, що кремній узагалі вміє зробити; знизу — те, що вхід готовий віддати. Топологія — це слід між двома тисками.</text>
<text x="32.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">ТЕХНОЛОГІЯ дала</text>
<text x="32.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">ПРОХІДНИЙ</text>
<text x="32.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">ЕЛЕМЕНТ</text>
<text x="32.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">ВХІД забрав</text>
<text x="315.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1969 → 1976</text>
<text x="315.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">LM109 · 78xx · LM317</text>
<rect x="190.0" y="112.0" width="250.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="315.0" y="131.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">Ампер на кристалі тягне</tspan><tspan x="315.0" dy="15.6">лише вертикальний NPN.</tspan><tspan x="315.0" dy="15.6">У бічного PNP база</tspan><tspan x="315.0" dy="15.6">вдесятеро ширша, β 10…50.</tspan></text>
<line x1="315.0" y1="194.0" x2="315.0" y2="210.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="190.0" y="214.0" width="250.0" height="72.0" rx="6" fill="#e8f6ed" stroke="#27ae60" stroke-width="2.0"/><text x="315.0" y="230.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">NPN-повторювач</tspan><tspan x="315.0" dy="15.6">(дарлінгтон)</tspan><tspan x="315.0" dy="15.6">dropout ≈ 2 В — і хоч як</tspan><tspan x="315.0" dy="15.6">міняй струм, він стоїть</tspan></text>
<line x1="315.0" y1="306.0" x2="315.0" y2="290.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="190.0" y="310.0" width="250.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="315.0" y="329.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">Трансформатор, міст,</tspan><tspan x="315.0" dy="15.6">електроліт: 8–12 В на 5 В.</tspan><tspan x="315.0" dy="15.6">Запасу 3–7 В — за dropout</tspan><tspan x="315.0" dy="15.6">ніхто не платить.</tspan></text>
<text x="590.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1980-ті</text>
<text x="590.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">LM2930 · LM2940</text>
<rect x="465.0" y="112.0" width="250.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="131.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Бічний PNP підріс і нарешті</tspan><tspan x="590.0" dy="15.6">тягне ампер — ціною площі.</tspan><tspan x="590.0" dy="15.6">β усе одно лишилося</tspan><tspan x="590.0" dy="15.6">в межах 10…50.</tspan></text>
<line x1="590.0" y1="194.0" x2="590.0" y2="210.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="465.0" y="214.0" width="250.0" height="72.0" rx="6" fill="#e8f6ed" stroke="#27ae60" stroke-width="2.0"/><text x="590.0" y="230.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">PNP, інверсний</tspan><tspan x="590.0" dy="15.6">dropout ≈ 0.5 В на 1 А,</tspan><tspan x="590.0" dy="15.6">зате струм у землю</tspan><tspan x="590.0" dy="15.6">росте з навантаженням</tspan></text>
<line x1="590.0" y1="306.0" x2="590.0" y2="290.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="465.0" y="310.0" width="250.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="329.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Машина. Стартер валить</tspan><tspan x="590.0" dy="15.6">бортову мережу до 6 В</tspan><tspan x="590.0" dy="15.6">і нижче (ISO 16750-2).</tspan><tspan x="590.0" dy="15.6">5 + 2 = 7 В не влазить.</tspan></text>
<text x="865.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1990-ті</text>
<text x="865.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">S-812-клас · MIC5205</text>
<rect x="740.0" y="112.0" width="250.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="131.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">CMOS: p-канал — рівно-</tspan><tspan x="865.0" dy="15.6">правний прилад. Літографія</tspan><tspan x="865.0" dy="15.6">дійшла до часток мікрона —</tspan><tspan x="865.0" dy="15.6">бічне більше не вирок.</tspan></text>
<line x1="865.0" y1="194.0" x2="865.0" y2="210.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="740.0" y="214.0" width="250.0" height="72.0" rx="6" fill="#e8f6ed" stroke="#27ae60" stroke-width="2.0"/><text x="865.0" y="230.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">PMOS, інверсний</tspan><tspan x="865.0" dy="15.6">Iспок ≈ 1 мкА;</tspan><tspan x="865.0" dy="15.6">dropout = Iвих · Rси(відкр)</tspan><tspan x="865.0" dy="15.6">— підлоги немає</tspan></text>
<line x1="865.0" y1="306.0" x2="865.0" y2="290.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="740.0" y="310.0" width="250.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="329.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">Літієва банка (Sony, 1991):</tspan><tspan x="865.0" dy="15.6">4.2 → 3.0 В на 3.3 В.</tspan><tspan x="865.0" dy="15.6">Кожні 100 мВ dropout —</tspan><tspan x="865.0" dy="15.6">викинута ємність.</tspan></text>
<text x="1140.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">2000-ні →</text>
<text x="1140.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">LTC3026-клас</text>
<rect x="1015.0" y="112.0" width="250.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1140.0" y="131.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">Помпа й бустер на кристалі</tspan><tspan x="1140.0" dy="15.6">коштують копійки —</tspan><tspan x="1140.0" dy="15.6">затвор можна живити</tspan><tspan x="1140.0" dy="15.6">вище за вхід.</tspan></text>
<line x1="1140.0" y1="194.0" x2="1140.0" y2="210.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1015.0" y="214.0" width="250.0" height="72.0" rx="6" fill="#e8f6ed" stroke="#27ae60" stroke-width="2.0"/><text x="1140.0" y="230.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">NMOS-повторювач</tspan><tspan x="1140.0" dy="15.6">+ помпа на затвор</tspan><tspan x="1140.0" dy="15.6">dropout ≈ 0.1 В на 1.5 А</tspan><tspan x="1140.0" dy="15.6">і полюс далеко</tspan></text>
<line x1="1140.0" y1="306.0" x2="1140.0" y2="290.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="1015.0" y="310.0" width="250.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1140.0" y="329.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">Ампери від сусідньої шини</tspan><tspan x="1140.0" dy="15.6">з різкими кидками.</tspan><tspan x="1140.0" dy="15.6">Треба разом і малий</tspan><tspan x="1140.0" dy="15.6">dropout, і стійкість петлі.</tspan></text>
<rect x="30.0" y="418.0" width="1240.0" height="76.0" rx="6" fill="#e8f6ed" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="442.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Кожну з цих чотирьох схем можна було намалювати ще в 1955-му — це підручникові вмикання, жодна не чекала на ідею.</tspan><tspan x="650.0" dy="18.2">Топологія мінялася рівно тоді, коли збігалися дві умови: технологія навчилася робити потрібний транзистор,</tspan><tspan x="650.0" dy="18.2">а вхід почав виставляти рахунок за старий. Спершу рахунок, потім кремній — і аж тоді нова топологія.</tspan></text>
</svg>