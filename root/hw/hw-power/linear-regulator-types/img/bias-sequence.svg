<rect x="925.0" y="478.1" width="290.0" height="73.9" rx="6" fill="#fdecea" stroke="#6b7280" stroke-width="1.5"/><text x="1070.0" y="497.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1070.0" dy="0.0">Виходу немає — петля впирає затвор</tspan><tspan x="1070.0" dy="14.3">у шину, і рампа витрачається на</tspan><tspan x="1070.0" dy="14.3">мертвому виході. Vвх приходить на</tspan><tspan x="1070.0" dy="14.3">навстіж відкритий ключ.</tspan></text>
