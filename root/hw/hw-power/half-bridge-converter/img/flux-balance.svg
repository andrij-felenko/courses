<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм автобалансування середньої точки дільника проти насичення</text>
<rect x="25.0" y="60.0" width="190.0" height="85.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="120.0" y="88.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">1. Асиметрія ШІМ</tspan><tspan x="120.0" dy="11.7"></tspan><tspan x="120.0" dy="11.7">t_on1 &gt; t_on2 чи розкид Rds(on)</tspan><tspan x="120.0" dy="11.7">Виникає вольт-секундний зсув</tspan></text>
<rect x="245.0" y="60.0" width="190.0" height="85.0" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="340.0" y="84.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">2. Постійний струм Idc</tspan><tspan x="340.0" dy="14.3"></tspan><tspan x="340.0" dy="14.3">Крізь обмотку потік заряд</tspan><tspan x="340.0" dy="14.3">ΔQ = Idc · T</tspan></text>
<rect x="465.0" y="60.0" width="190.0" height="85.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="84.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">3. Зсув середньої точки</tspan><tspan x="560.0" dy="14.3"></tspan><tspan x="560.0" dy="14.3">Потенціал MID зміщується:</tspan><tspan x="560.0" dy="14.3">ΔVmid = ΔQ / (C1 + C2)</tspan></text>
<rect x="685.0" y="60.0" width="190.0" height="85.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.5"/><text x="780.0" y="86.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">4. Автокомпенсація</tspan><tspan x="780.0" dy="13.0"></tspan><tspan x="780.0" dy="13.0">(Vin − Vmid)·t1 = Vmid·t2</tspan><tspan x="780.0" dy="13.0">Інтеграл напруги рівний 0!</tspan></text>
<line x1="218.0" y1="102.0" x2="242.0" y2="102.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="438.0" y1="102.0" x2="462.0" y2="102.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="658.0" y1="102.0" x2="682.0" y2="102.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="200.0" width="780.0" height="210.0" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text x="450.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому напівміст не боїться однобічного підмагнічування (flux walking)</text>
<text x="450.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">У звичайному Push-pull чи повному мості без конденсатора постійний струм наростає лавиною,</text>
<text x="450.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">оскільки опір первинного кола суто омічний (міліоми). Сердечник злітає в насичення.</text>
<text x="450.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">У напівмості ємнісний дільник діє як природний негативний зворотний зв'язок за напругою:</text>
<text x="450.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">найменший постійний струм зміщує напругу MID і миттєво ліквідує власну першопричину.</text>
</svg>