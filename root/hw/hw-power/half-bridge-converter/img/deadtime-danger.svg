<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мертвий час (dead-time): небезпека наскрізного струму проти втрат діода</text>
<rect x="50.0" y="65.0" width="220.0" height="50.0" rx="6" fill="#fdeeee" stroke="#c0392b" stroke-width="1.5"/><text x="160.0" y="87.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">ЗАМАЛИЙ МЕРТВИЙ ЧАС</tspan><tspan x="160.0" dy="12.3">Наскрізний струм (shoot-through)</tspan></text>
<rect x="46.5" y="180.2" width="226.9" height="59.6" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="160.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Одночасне відкриття Q1 та Q2:</tspan><tspan x="160.0" dy="14.3">коротке замикання шини Vin.</tspan><tspan x="160.0" dy="14.3">Миттєвий тепловий вибух кристала.</tspan></text>
<rect x="290.0" y="65.0" width="220.0" height="50.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="86.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">ОПТИМАЛЬНИЙ ЧАС</tspan><tspan x="400.0" dy="15.0">М'яка комутація (ZVS)</tspan></text>
<rect x="280.3" y="180.2" width="239.4" height="59.6" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Індуктивність перезаряджає Coss.</tspan><tspan x="400.0" dy="14.3">Напруга спадає до нуля до вмикання.</tspan><tspan x="400.0" dy="14.3">Мінімальні динамічні втрати.</tspan></text>
<rect x="530.0" y="65.0" width="220.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="640.0" y="86.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">ЗАВЕЛИКИЙ МЕРТВИЙ ЧАС</tspan><tspan x="640.0" dy="15.0">Провідність body-діода</tspan></text>
<rect x="507.7" y="180.2" width="264.5" height="59.6" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.5"/><text x="640.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Струм іде крізь паразитний діод MOSFET.</tspan><tspan x="640.0" dy="14.3">Падіння 1.2 В + втрати відновлення Qrr.</tspan><tspan x="640.0" dy="14.3">Перегрів ключів і дзвони на фронтах.</tspan></text>
