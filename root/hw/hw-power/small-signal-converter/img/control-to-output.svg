<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 250" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="250" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що моделюємо: реакцію виходу на дрібну зміну керування</text>
<rect x="60.0" y="86.0" width="150.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="135.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">збурення</tspan><tspan x="135.0" dy="16.9">шпаруватості  d̂</tspan></text>
<line x1="210.0" y1="120.0" x2="320.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="320.0" y="70.0" width="260.0" height="100.0" rx="12" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/>
<text x="450.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">G(s) = v̂ / d̂</text>
<text x="450.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">«керування → вихід»</text>
<text x="450.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">лінійна передатна функція</text>
<line x1="580.0" y1="120.0" x2="690.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="690.0" y="86.0" width="160.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="770.0" y="116.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">збурення</tspan><tspan x="770.0" dy="16.9">виходу  v̂</tspan></text>
<text x="450.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Уся динаміка перетворювача — у формі цієї однієї функції G(s).</text>
</svg>