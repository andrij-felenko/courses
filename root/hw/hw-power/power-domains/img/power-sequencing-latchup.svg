<text x="662.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Регенеративний зв'язок: I_C1 годує I_B2, I_C2 годує I_B1</text>
<text x="662.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Коротке замикання VDD → VSS через кристал!</text>
<rect x="500.0" y="250.0" width="325.0" height="120.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="662.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Як виникає пусковий струм тригера:</text>
<rect x="515.0" y="285.0" width="295.0" height="75.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="662.5" y="308.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="662.5" dy="0.0">1. На вхід I/O подано 3.3 В, коли VDD = 0 В</tspan><tspan x="662.5" dy="11.7">2. Пряме зміщення ESD-діода або p-n переходу</tspan><tspan x="662.5" dy="11.7">3. Інжекція дірок/електронів відкриває базу Q1/Q2</tspan><tspan x="662.5" dy="11.7">4. Струм зростає до амперів → тепловий пробій</tspan></text>
<rect x="500.0" y="385.0" width="325.0" height="35.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/><text x="662.5" y="405.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="662.5" dy="0.0">Захист: правильний порядок старту, захисні резистори та guard rings</tspan></text>
