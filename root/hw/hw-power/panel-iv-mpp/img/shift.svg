</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Світло й тепло зсувають криву — MPP «гуляє»</text>
<line x1="110.0" y1="330.0" x2="810.0" y2="330.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="110.0" y1="330.0" x2="110.0" y2="70.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="810.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="end" font-weight="normal" font-style="normal">V →</text>
<text x="101.0" y="68.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">I</text>
<polyline points="110.0,103.9 285.0,104.8 460.0,108.4 576.7,113.0 670.0,126.5 728.3,158.2 775.0,230.5 798.3,293.8 810.0,330.0" fill="none" stroke="#1f8a3b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="401.7" y="97.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">норма</text>
<polyline points="110.0,185.3 285.0,185.9 460.0,188.2 576.7,191.1 670.0,199.8 728.3,220.0 775.0,266.3 798.3,306.8 810.0,330.0" fill="none" stroke="#1f47b5" stroke-width="2.2" stroke-dasharray="5,4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="401.7" y="179.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">менше світла (Isc↓)</text>
<polyline points="110.0,103.9 255.8,104.8 401.7,108.4 498.9,113.0 576.7,126.5 625.3,158.2 664.2,230.5 683.6,293.8 693.3,330.0" fill="none" stroke="#c0271e" stroke-width="2.2" stroke-dasharray="5,4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="623.3" y="266.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">гаряче (Voc↓)</text>
<circle cx="670.0" cy="126.5" r="4.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<circle cx="670.0" cy="199.8" r="4.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<circle cx="576.7" cy="126.5" r="4.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="670.0" y="114.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">MPP гуляє</text>
<rect x="70.0" y="362.0" width="800.0" height="46.0" rx="9" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="470.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Більше світла піднімає Isc (крива вгору), менше — опускає. Нагрів знижує Voc (крива вліво). Тож точка MPP не стоїть на місці —</text>
<text x="470.0" y="395.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вона рухається з хмарами, сонцем і температурою. Саме тому MPP не можна виставити РАЗ — за нею треба СТЕЖИТИ (MPPT), про що далі.</text>
<text x="470.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Дрібний виняток: Voc слабко росте з яскравістю (логарифмічно), тож світло б'є переважно по струму, а тепло — по напрузі.</text>
</svg>
