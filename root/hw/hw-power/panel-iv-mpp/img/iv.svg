<rect x="70.0" y="376.0" width="760.0" height="32.0" rx="9" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Закоротили виходи (V=0) — тече весь фотострум Isc (∝ світло). Розімкнули (I=0) — на клемах повна напруга Voc (~0.5 В × N елементів).</text>
<text x="450.0" y="409.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Між ними — характерна крива з «коліном»: майже сталий струм, тоді різке падіння напруги. Уся практика панелі — про цю криву.</text>
