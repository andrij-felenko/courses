  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Потужність P = V·I: чому є «горб»</text>
<line x1="110.0" y1="340.0" x2="810.0" y2="340.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="110.0" y1="340.0" x2="110.0" y2="70.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<line x1="810.0" y1="340.0" x2="810.0" y2="70.0" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round"/>
<text x="460.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">напруга V →</text>
<text x="101.0" y="68.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">струм I</text>
<text x="819.0" y="68.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#caa24a" text-anchor="start" font-weight="bold" font-style="normal">потужність P</text>
<polyline points="110.0,94.5 285.0,95.5 460.0,99.5 576.7,104.4 670.0,119.1 728.3,153.5 775.0,232.0 798.3,300.7 810.0,340.0" fill="none" stroke="#1f8a3b" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="296.7" y="86.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">ВАХ (струм)</text>
<polyline points="110.0,340.0 285.0,258.8 460.0,180.2 576.7,131.3 670.0,105.2 728.3,121.1 775.0,203.7 798.3,288.7 810.0,340.0" fill="none" stroke="#caa24a" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="670.0" cy="105.2" r="6.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="670.0" y="95.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">MPP (макс. P)</text>
<line x1="670.0" y1="105.2" x2="670.0" y2="340.0" stroke="#c0271e" stroke-width="1" stroke-dasharray="4,3" stroke-linecap="round"/>
<text x="670.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Vmp</text>
<text x="116.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">V=0 → P=0</text>
<text x="804.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">I=0 → P=0</text>
<rect x="70.0" y="376.0" width="800.0" height="32.0" rx="9" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Потужність — це ДОБУТОК V·I. На краях вона нульова: при КЗ нема напруги, при ХХ нема струму. Тож десь усередині, біля «коліна»,</text>
<text x="470.0" y="409.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">P сягає МАКСИМУМУ — це й є точка максимальної потужності (MPP). Саме на ній варто тримати панель, щоб узяти від неї найбільше.</text>
</svg>
