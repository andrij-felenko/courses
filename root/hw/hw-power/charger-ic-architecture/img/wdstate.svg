<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два життя чипа: default і host, а між ними — watchdog</text>
<rect x="58.0" y="62.0" width="168.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="142.0" y="88.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="142.0" dy="0.0">увімкнення / POR</tspan></text>
<line x1="142.0" y1="106.0" x2="160.0" y2="166.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="166.0" width="240.0" height="108.0" rx="6" fill="#f0f0f0" stroke="#6b7280" stroke-width="1.5"/><text x="180.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">DEFAULT MODE</tspan><tspan x="180.0" dy="16.2">регістри = типові</tspan><tspan x="180.0" dy="16.2">автономний заряд «як є»</tspan><tspan x="180.0" dy="16.2">REG09[7] = 1</tspan></text>
<rect x="580.0" y="166.0" width="240.0" height="108.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">HOST MODE</tspan><tspan x="700.0" dy="16.2">ваші IINLIM · ICHG · VREG</tspan><tspan x="700.0" dy="16.2">чип слухає I2C</tspan><tspan x="700.0" dy="16.2">REG09[7] = 0</tspan></text>
<rect x="610.0" y="74.0" width="180.0" height="50.0" rx="6" fill="#fff8e8" stroke="#b8860b" stroke-width="1.5"/><text x="700.0" y="95.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">годуй watchdog</tspan><tspan x="700.0" dy="15.0">REG01[6]=1  ( &lt; 40 с )</tspan></text>
<line x1="700.0" y1="124.0" x2="700.0" y2="166.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
