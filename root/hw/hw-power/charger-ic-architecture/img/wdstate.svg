<line x1="580.0" y1="240.0" x2="300.0" y2="240.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="440.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">watchdog сплив без годування</text>
<text x="440.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">→ усі регістри в default, уставки втрачено</text>
<rect x="254.4" y="358.2" width="371.1" height="59.6" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="440.0" y="377.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Вимкнути watchdog (REG05[5:4]=00) — таймера нема зовсім:</tspan><tspan x="440.0" dy="14.3">чип не зітре ваших уставок, але й сам не відкотиться</tspan><tspan x="440.0" dy="14.3">в безпечний режим, якщо господар зависне.</tspan></text>
