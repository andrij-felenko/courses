<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 860 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="860" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізика дуги постійного струму та механізм дугогасіння кварцовим піском</text>
<rect x="0.0" y="0.0" width="840.0" height="390.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="40.0" y="35.0" width="360.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="220.0" y="58.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Змінний струм (AC) vs Постійний струм (DC)</tspan></text>
<rect x="40.0" y="85.0" width="360.0" height="270.0" rx="4" fill="#fafafa" stroke="#333333" stroke-width="1.0"/>
<text x="60.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Змінний струм (AC):</text>
<text x="60.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Переходить через нуль кожні 10 мс (при 50 Гц).</text>
<text x="60.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• У момент нульового струму дуга згасає,</text>
<text x="60.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  даючи плазмі час на деіонізацію.</text>
<text x="60.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Постійний струм (DC):</text>
<text x="60.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Нульових переходів НЕМАЄ — струм безперервний.</text>
<text x="60.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Термоелектронна емісія розжарених електродів</text>
<text x="60.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  постійно підтримує плазмовий канал 3000–6000 °C.</text>
<text x="60.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Падіння на дузі U_arc ≈ 15–30 В.</text>
<text x="60.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">  Якщо U_пакета &gt; U_arc — дуга горить стабільно,</text>
<text x="60.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">  розплавляючи метал і підпалюючи корпус.</text>
<text x="60.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Звичайні AC-автомати на DC ПЕРЕТВОРЮЮТЬСЯ НА ПЛАЗМОРІЗ!</text>
<rect x="430.0" y="35.0" width="370.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="615.0" y="58.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">Механізм гасіння в піску DC-запобіжника</tspan></text>
<rect x="430.0" y="85.0" width="370.0" height="270.0" rx="4" fill="#fafafa" stroke="#333333" stroke-width="1.0"/>
<rect x="460.0" y="105.0" width="310.0" height="85.0" rx="3" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="615.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Керамічний корпус високої міцності (корунд / стеатит)</text>
<rect x="470.0" y="130.0" width="290.0" height="50.0" rx="6" fill="#fff9c4" stroke="none" stroke-width="1.5"/>
<text x="615.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b7950b" text-anchor="middle" font-weight="700">Дрібнодисперсний кварцовий пісок (SiO₂)</text>
<line x1="470.0" y1="160.0" x2="540.0" y2="160.0" stroke="#333333" stroke-width="4.0"/>
<line x1="540.0" y1="160.0" x2="560.0" y2="160.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="560.0" y1="160.0" x2="670.0" y2="160.0" stroke="#333333" stroke-width="4.0"/>
<line x1="670.0" y1="160.0" x2="690.0" y2="160.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="690.0" y1="160.0" x2="760.0" y2="160.0" stroke="#333333" stroke-width="4.0"/>
<text x="615.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Срібна смуга з перешийками (калібровані точки розриву)</text>
<text x="450.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Фази спрацьовування DC-запобіжника:</text>
<text x="450.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">1. Струм КЗ розплавляє перешийки за &lt;0.5 мс.</text>
<text x="450.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">2. Спалахує дуга, миттєво плавлячи кварцовий пісок (SiO₂ &gt;1700 °C).</text>
<text x="450.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">3. Пісок поглинає колосальне тепло і спікається у скляну</text>
<text x="450.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">   непровідну трубку — фульгурит, стискаючи й охолоджуючи плазму.</text>
<text x="450.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">4. Напруга дуги різко зростає вище напруги пакета → дуга гасне.</text>
</svg>