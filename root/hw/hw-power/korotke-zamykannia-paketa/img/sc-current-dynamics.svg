<text x="215.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">Індуктивний викид V_ds = L · |di/dt|</text>
<line x1="195.0" y1="340.0" x2="195.0" y2="90.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="195.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">BMS SCP (~25 мкс)</text>
<rect x="540.0" y="40.0" width="275.0" height="75.0" rx="6" fill="#fdf2e9" stroke="#e67e22" stroke-width="1.2"/><text x="677.5" y="63.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="677.5" dy="0.0">1. ФАЗА НАРОСТАННЯ (0–15 мкс)</tspan><tspan x="677.5" dy="11.7">di/dt = U_bat / L_петлі</tspan><tspan x="677.5" dy="11.7">Струм зростає зі швидкістю 100–300 А/мкс,</tspan><tspan x="677.5" dy="11.7">обмежуючись паразитною індуктивністю.</tspan></text>
<rect x="540.0" y="125.0" width="275.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="677.5" y="148.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="677.5" dy="0.0">2. ПІК СТРУМУ КЗ (15–25 мкс)</tspan><tspan x="677.5" dy="11.7">I_max = U_ocv / R_петлі</tspan><tspan x="677.5" dy="11.7">Сягає 1000–8000 А залежно від опору</tspan><tspan x="677.5" dy="11.7">комірок, шин, ключів BMS та шунта.</tspan></text>
<rect x="540.0" y="210.0" width="275.0" height="85.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="677.5" y="232.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="677.5" dy="0.0">3. АПАРАТНА ВІДСІЧКА BMS</tspan><tspan x="677.5" dy="11.7">Швидкісний компаратор (&lt;20–50 мкс)</tspan><tspan x="677.5" dy="11.7">розряджає затвори MOSFET.</tspan><tspan x="677.5" dy="11.7">Різке переривання струму породжує</tspan><tspan x="677.5" dy="11.7">високовольтний викид на стоку.</tspan></text>
<rect x="540.0" y="305.0" width="275.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="677.5" y="323.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="677.5" dy="0.0">4. ЗАХИСТ ВІД ПРОБОЮ</tspan><tspan x="677.5" dy="11.7">TVS-супресори та RC-демпфери</tspan><tspan x="677.5" dy="11.7">поглинають енергію L·I²/2, рятуючи</tspan><tspan x="677.5" dy="11.7">ключі від лавинного пробою.</tspan></text>
</svg>