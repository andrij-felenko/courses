<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 860 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="860" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трирівнева координація захисту від короткого замикання</text>
<rect x="0.0" y="0.0" width="840.0" height="380.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="420.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три рівні оборони батарейного пакета: координація часу та енергії</text>
<rect x="40.0" y="55.0" width="760.0" height="95.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/>
<text x="55.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">РІВЕНЬ 1: Напівпровідниковий захист BMS</text>
<text x="540.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Апаратний компаратор SCP (&lt;20–50 мкс)</text>
<text x="55.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Розриває коло закриттям MOSFET.</text>
<text x="55.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Відновлюваний: після зняття КЗ пакет повертається до роботи.</text>
<text x="55.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Обмеження: ключі можуть пробитися при L·di/dt викиді або тепловому ударі.</text>
<rect x="40.0" y="160.0" width="760.0" height="95.0" rx="4" fill="#fdf2e9" stroke="#e67e22" stroke-width="1.3"/>
<text x="55.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="start" font-weight="700">РІВЕНЬ 2: Плавкий піщаний DC-запобіжник</text>
<text x="540.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Спеціалізований DC Fuse (0.5–2 мс)</text>
<text x="55.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Одноразовий фізичний розрив кола при відмові/пробої ключів BMS.</text>
<text x="55.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Піщаний наповнювач гарантовано гасить кілоамперну DC дугу.</text>
<text x="55.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Номінальна відключаюча здатність (AIC) &gt;20–50 кА.</text>
<rect x="40.0" y="265.0" width="760.0" height="95.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="55.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">РІВЕНЬ 3: Піропатрон (Pyro-fuse / Squib)</text>
<text x="540.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Піротехнічний розмикач (1–3 мс)</text>
<text x="55.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Застосовується в EV та високовольтних системах (&gt;100–800 В).</text>
<text x="55.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Мікровибух перерубує мідну шину поршнем за сигналом краш-датчика або BMS.</text>
<text x="55.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Створює фізичний ізоляційний проміжок у кілька сантиметрів.</text>
</svg>