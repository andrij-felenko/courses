<rect x="620.0" y="118.0" width="110.0" height="44.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="675.0" y="137.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">м'який старт /</text><text x="675.0" y="149.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">обмеж. пуску</text>
<line x1="730.0" y1="140.0" x2="748.0" y2="138.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="430.0" width="820.0" height="66.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="452.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Форма напруги задає струму ОБРИС синусоїди, похибка шини — МАСШТАБ; помножувач зводить їх в еталон струму.</tspan><tspan x="480.0" dy="14.3">Швидка струмова петля жене iL за еталоном кожен такт; повільна напругова лише неквапно рухає масштаб — інакше зіпсує PF.</tspan><tspan x="480.0" dy="14.3">Поділ на Vмережі² тримає підсилення петлі сталим, коли мережа гуляє 85–265 В; м'який старт стримує пусковий кидок.</tspan></text>
</svg>