<rect x="70.0" y="400.0" width="800.0" height="44.0" rx="6" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="418.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Контур НАПРУГИ мусить бути ПОВІЛЬНИЙ (смуга ~10–20 Гц): якби він швидко «виправляв» цю 100/120-Гц пульсацію,</tspan><tspan x="470.0" dy="15.0">то спотворив би сам еталон струму й зіпсував PF. Тож напругу тримає повільна петля, а форму струму — швидка.</tspan></text>
