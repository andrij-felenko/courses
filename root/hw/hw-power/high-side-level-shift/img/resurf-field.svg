<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому тонкий шар тримає більше: поле, розмазане по довжині</text>
<text x="56.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Звичайний шар: усе поле збирається в один пік</text>
<rect x="56.0" y="74.0" width="340.0" height="50.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.4"/>
<rect x="56.0" y="124.0" width="340.0" height="44.0" rx="6" fill="#eceff3" stroke="#6b7280" stroke-width="1.4"/>
<rect x="58.0" y="74.0" width="30.0" height="22.0" rx="2" fill="#fdeeec" stroke="#c0392b" stroke-width="1.2"/>
<text x="73.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">p+</text>
<rect x="364.0" y="74.0" width="30.0" height="22.0" rx="2" fill="#dce8ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="379.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">n+</text>
<text x="226.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">n-шар: товстий, легований сильніше</text>
<text x="226.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">p-підкладка</text>
<path d="M 108.00 74.00 L 108.00 124.00" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4,3"/>
<text x="56.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">збіднення вузьке — поле не розтікається</text>
<line x1="470.0" y1="170.0" x2="856.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="470.0" y1="60.0" x2="470.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="462.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">E</text>
<path d="M 470.00 72.00 L 856.00 72.00" fill="none" stroke="#c0392b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6,4"/>
<text x="852.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end">Eкр — лавинний пробій</text>
<path d="M 472.00 170.00 L 472.00 166.00 L 478.00 72.00 L 492.00 98.00 L 510.00 128.00 L 530.00 152.00 L 546.00 164.00 L 856.00 166.00 L 856.00 170.00 Z" fill="#c0392b" fill-opacity="0.13" stroke="none"/>
<path d="M 472.00 166.00 L 478.00 72.00 L 492.00 98.00 L 510.00 128.00 L 530.00 152.00 L 546.00 164.00 L 856.00 166.00" fill="none" stroke="#c0392b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="700.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">площа під кривою = напруга</text>
<text x="700.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">мала площа → пробій рано</text>
<text x="660.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">відстань уздовж поверхні →</text>
<text x="56.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Тонкий шар (RESURF): поле — плато</text>
<text x="668.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">…але площа в рази більша → 400 В</text>
<rect x="56.0" y="324.0" width="340.0" height="22.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/>
<rect x="56.0" y="346.0" width="340.0" height="72.0" rx="6" fill="#eceff3" stroke="#6b7280" stroke-width="1.4"/>
<rect x="58.0" y="324.0" width="28.0" height="22.0" rx="2" fill="#fdeeec" stroke="#c0392b" stroke-width="1.2"/>
<rect x="366.0" y="324.0" width="28.0" height="22.0" rx="2" fill="#dce8ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="226.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">n-шар тонкий:  Nd · t ≈ 10¹² см⁻²</text>
<line x1="140.0" y1="388.0" x2="140.0" y2="352.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="226.0" y1="388.0" x2="226.0" y2="352.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="312.0" y1="388.0" x2="312.0" y2="352.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="226.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">p-підкладка збіднює шар знизу — наскрізь</text>
<line x1="470.0" y1="420.0" x2="856.0" y2="420.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="470.0" y1="310.0" x2="470.0" y2="420.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="462.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">E</text>
<path d="M 470.00 322.00 L 856.00 322.00" fill="none" stroke="#c0392b" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6,4"/>
<text x="852.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end">Eкр — лавинний пробій</text>
<path d="M 474.00 418.00 L 486.00 322.00 L 520.00 358.00 L 800.00 358.00 L 838.00 322.00 L 850.00 418.00 Z" fill="#27ae60" fill-opacity="0.15" stroke="none"/>
<path d="M 474.00 418.00 L 486.00 322.00 L 520.00 358.00 L 800.00 358.00 L 838.00 322.00 L 850.00 418.00" fill="none" stroke="#27ae60" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="640.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">плато нижче Eкр — і тягнеться всю довжину</text>
<text x="660.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">відстань уздовж поверхні →</text>
<rect x="56.0" y="470.0" width="800.0" height="60.0" rx="6" fill="#f7fbf8" stroke="#27ae60" stroke-width="1.5"/><text x="456.0" y="496.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="456.0" dy="0.0">Той самий кремній і та сама гранична напруженість — але поле, розмазане по довжині, набирає в рази більшу напругу.</tspan><tspan x="456.0" dy="15.6">Платня — точна доза заряду в шарі: забагато — не збідниться наскрізь; замало — зросте опір відкритого приладу.</tspan></text>
</svg>