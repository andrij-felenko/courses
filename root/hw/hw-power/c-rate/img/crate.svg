<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">C-rate: нормована мова струму</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">1C — струм, що спорожнить пакет за 1 годину;  I = C-rate × ємність</text>
<rect x="60" y="120" width="175" height="96" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<rect x="235" y="150" width="10" height="36" rx="2" fill="#0a8f3c" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1"/>
<text x="147" y="152" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">4S LiPo</text>
<text x="147" y="178" font-size="17" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">5000 mAh</text>
<text x="147" y="200" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">= 5 А·год (Q)</text>
<rect x="60" y="250" width="200" height="70" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="160" y="280" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">I = C-rate × Q</text>
<text x="160" y="303" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Q = 5 А·год</text>
<text x="320" y="104" font-size="12" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">C-rate</text>
<text x="525" y="104" font-size="12" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">= струм</text>
<rect x="320" y="120" width="96" height="44" rx="9" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="368" y="149" font-size="16" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">0.5C</text>
<line x1="420" y1="142" x2="470" y2="142" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="478" y="149" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">2.5 А</text>
<text x="560" y="148" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">за 2 год — м'яко</text>
<rect x="320" y="178" width="96" height="44" rx="9" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.8"/>
<text x="368" y="207" font-size="16" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">1C</text>
<line x1="420" y1="200" x2="470" y2="200" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="478" y="207" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">5 А</text>
<text x="560" y="206" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">за 1 годину</text>
<rect x="320" y="236" width="96" height="44" rx="9" fill="white" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.8"/>
<text x="368" y="265" font-size="16" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">10C</text>
<line x1="420" y1="258" x2="470" y2="258" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="478" y="265" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">50 А</text>
<text x="560" y="264" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">звичайний політ</text>
<rect x="320" y="294" width="96" height="44" rx="9" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.8"/>
<text x="368" y="323" font-size="16" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">50C</text>
<line x1="420" y1="316" x2="470" y2="316" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="478" y="323" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">250 А</text>
<text x="560" y="322" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">стеля за наклейкою</text>
<rect x="648" y="120" width="252" height="232" rx="12" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="774" y="146" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">Навіщо нормувати?</text>
<text x="774" y="172" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">Ті самі 10 А — це:</text>
<rect x="666" y="188" width="216" height="52" rx="8" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<text x="774" y="210" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">5000 mAh → 2C</text>
<text x="774" y="230" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(прогулянка)</text>
<rect x="666" y="252" width="216" height="52" rx="8" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.4"/>
<text x="774" y="274" font-size="13" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">1300 mAh → ~7.7C</text>
<text x="774" y="294" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">(на межі)</text>
<text x="774" y="330" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">C-rate каже навантаженість</text>
<text x="774" y="345" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">незалежно від розміру</text>
<text x="480.0" y="456" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">«50C» на наклейці = 50 × ємність = заявлена виробником стеля струму (тут 250 А; реальна межа часто нижча).</text>
</svg>
