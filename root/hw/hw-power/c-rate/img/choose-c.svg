<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Скільки «C» треба: під пік струму, із запасом</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">Cмін = пік струму ÷ ємність; бери з запасом на просадку, тепло й старіння</text>
<text x="140" y="100" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">пік струму моторів</text>
<circle cx="88" cy="134" r="13" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="88" y="139" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">M</text>
<text x="112" y="139" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">~25 А</text>
<circle cx="88" cy="176" r="13" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="88" y="181" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">M</text>
<text x="112" y="181" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">~25 А</text>
<circle cx="88" cy="218" r="13" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="88" y="223" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">M</text>
<text x="112" y="223" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">~25 А</text>
<circle cx="88" cy="260" r="13" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="88" y="265" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">M</text>
<text x="112" y="265" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">~25 А</text>
<line x1="200" y1="130" x2="200" y2="262" stroke="#6b7280" stroke-width="1.6" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="200" y1="196" x2="248" y2="196" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="300" y="190" font-size="16" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">Σ ≈ 100 А</text>
<text x="300" y="211" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">піковий струм</text>
<rect x="360" y="150" width="300" height="84" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="510" y="180" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Cмін = пік ÷ ємність</text>
<text x="510" y="208" font-size="14" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">= 100 А ÷ 5 А·год = 20C</text>
<text x="510" y="258" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">…але «впритул» не беруть →</text>
<rect x="700" y="108" width="228" height="86" rx="10" fill="#fde2e2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.7"/>
<text x="814.0" y="134" font-size="13" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">&lt; 20C  замало</text>
<text x="716" y="156" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">просадка, перегрів,</text>
<text x="716" y="172" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">здуття, коротке життя</text>
<rect x="700" y="208" width="228" height="86" rx="10" fill="#d8f3e0" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="814.0" y="234" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">≈ 50C  саме те</text>
<text x="716" y="256" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">запас на просадку,</text>
<text x="716" y="272" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">тепло, ресурс</text>
<rect x="700" y="308" width="228" height="86" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#6b7280" stroke-width="1.7"/>
<text x="814.0" y="334" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="normal">≫ 50C  забагато</text>
<text x="716" y="356" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">зайва вага й ціна —</text>
<text x="716" y="372" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">без користі</text>
<text x="480.0" y="448" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Бери C удвічі-втричі понад мінімум: апарат падає від провалів на піках, а не від середнього струму.</text>
</svg>
