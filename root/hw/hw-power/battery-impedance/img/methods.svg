<text x="125.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">дає: Re(Z) на 1 кГц</tspan></text>
<text x="125.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="125.0" dy="0.0">швидко, дешево;</tspan><tspan x="125.0" dy="14.3">лише омічна точка</tspan></text>
<text x="125.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">≈ 36 мОм</text>
