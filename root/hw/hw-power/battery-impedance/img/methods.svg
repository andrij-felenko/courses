<text x="575.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">дає: увесь годограф</tspan></text>
<text x="575.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="575.0" dy="0.0">розкладає на Rs,</tspan><tspan x="575.0" dy="14.3">Rct, дифузію</tspan></text>
<text x="575.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#8a6d0b" text-anchor="middle" font-weight="700">крива Z(f)</text>
<text x="360.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">та сама комірка 18650 — методи дають РІЗНІ числа, і всі правильні</text>
