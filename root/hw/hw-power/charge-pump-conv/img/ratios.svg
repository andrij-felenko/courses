<text x="270.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="700">×1</text>
<rect x="342.0" y="84.0" width="96.0" height="44.0" rx="10" fill="#f6f9fc" stroke="#2457d6" stroke-width="2.0"/>
