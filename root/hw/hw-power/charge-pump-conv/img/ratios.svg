<rect x="582.0" y="84.0" width="96.0" height="44.0" rx="10" fill="#f6f9fc" stroke="#c0392b" stroke-width="2.0"/>
<text x="630.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">×3</text>
