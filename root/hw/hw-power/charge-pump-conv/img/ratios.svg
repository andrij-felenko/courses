<rect x="40.0" y="156.0" width="410.0" height="180.0" rx="10" fill="#eef8ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="245.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">✓ Брати, коли:</text>
<text x="60.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• немає місця/бажання на котушку (мала, тиха, дешева)</text>
<text x="60.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• струм малий: міліампери — сотні мА</text>
<text x="60.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• зсув ЖК-дисплея, від'ємна шина для ОП,</text>
<text x="60.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• напруга програмування flash, підкачка затвора</text>
<rect x="470.0" y="156.0" width="410.0" height="180.0" rx="10" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.8"/>
<text x="675.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">✗ Не брати, коли:</text>
<text x="490.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• потрібен помітний струм / потужність</text>
<text x="490.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• потрібен високий ККД на проміжній напрузі</text>
<text x="490.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• → тут виграють перетворювачі з котушкою</text>
<text x="490.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">•   (buck / boost / buck-boost)</text>
<rect x="70.0" y="384.0" width="760.0" height="26.0" rx="6" fill="#eef8ef" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="400.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Насос — нішевий інструмент для малих тихих допоміжних шин без котушки; силову роботу лишають котушковим топологіям</tspan></text>
