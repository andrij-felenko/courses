<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Баланс заряду за один найдовший такт: усе, що вип'є Cbs</text>
<text x="440.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">напруга просяде на ΔV = Qвитрат / Cbs — тримаємо ΔV меншим за запас над UVLO</text>
<rect x="60.0" y="90.0" width="320.0" height="34.0" rx="6" fill="#fdeeee" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="111.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">РАЗОВІ ПОРЦІЇ (нКл за такт)</tspan></text>
<rect x="68.0" y="132.5" width="64.0" height="35.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="100.0" y="155.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">Qg</tspan></text>
<text x="146.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">заряд затвора верхнього ключа</text>
<text x="146.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">весь Qg від 0 до Vgs — головний ковток</text>
<rect x="68.0" y="198.5" width="64.0" height="35.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="100.0" y="221.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">Qls</tspan></text>
<text x="146.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">заряд зсуву рівня</text>
<text x="146.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">команда «відкрий» крізь межу напруги</text>
<rect x="68.0" y="264.5" width="64.0" height="35.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/><text x="100.0" y="287.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">Qrr</tspan></text>
<text x="146.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">зворотне відновлення діода</text>
<text x="146.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">заряд, злитий назад, поки діод гасне</text>
<rect x="60.0" y="350.0" width="320.0" height="34.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="220.0" y="371.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">ЦІВКИ × t(ON,max)  (струм · час)</tspan></text>
<rect x="68.0" y="391.2" width="88.0" height="33.5" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.5"/><text x="112.0" y="412.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="112.0" dy="0.0">Iqbs</tspan></text>
<text x="168.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">струм спокою верхнього драйвера</text>
<rect x="64.3" y="443.2" width="95.3" height="33.5" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.5"/><text x="112.0" y="464.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="112.0" dy="0.0">Icbs,leak</tspan></text>
<text x="168.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">витік самого конденсатора</text>
<rect x="68.0" y="495.2" width="88.0" height="33.5" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.5"/><text x="112.0" y="516.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="112.0" dy="0.0">Ig,leak</tspan></text>
<text x="168.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">витік затвора + зсуву рівня</text>
<text x="210.0" y="540.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-style="italic">усі три × найдовший t(ON,max)</text>
<rect x="475.0" y="151.9" width="300.0" height="86.2" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="625.0" y="173.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">Qвитрат =</tspan><tspan x="625.0" dy="17.6">Qg + Qls + Qrr</tspan><tspan x="625.0" dy="17.6">+ (Iqbs + Icbs,leak</tspan><tspan x="625.0" dy="17.6">   + Ig,leak)·t(ON,max)</tspan></text>
<line x1="625.0" y1="262.0" x2="625.0" y2="328.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="721.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">÷ дозволене ΔV</text>
<rect x="480.0" y="342.5" width="290.0" height="35.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="365.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">Cbs ≥ Qвитрат / ΔV</tspan></text>
<line x1="625.0" y1="390.0" x2="625.0" y2="466.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="721.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">× 10–20</text>
<text x="721.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">запас на DC-bias,</text>
<text x="721.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">пуск, розкид</text>
<rect x="495.0" y="481.5" width="260.0" height="33.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.5"/><text x="625.0" y="502.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">номінал, який ставимо</tspan></text>
</svg>