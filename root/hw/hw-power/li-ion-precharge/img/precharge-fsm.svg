<text x="705.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">V ≥ 3.0 В</text>
<line x1="805.0" y1="155.0" x2="805.0" y2="240.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="845.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">V = 4.2 В</text>
