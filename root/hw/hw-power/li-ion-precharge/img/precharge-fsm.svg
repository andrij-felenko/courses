<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат передзаряду (Charger IC / BMS FSM)</text>
<rect x="100.0" y="100.0" width="130.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">IDLE / SLEEP</tspan><tspan x="165.0" dy="14.3">Ключі розімкнені</tspan></text>
<rect x="300.0" y="100.0" width="145.0" height="55.0" rx="6" fill="#fff8e8" stroke="#b8860b" stroke-width="1.5"/><text x="372.5" y="123.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="372.5" dy="0.0">TRICKLE (0V)</tspan><tspan x="372.5" dy="15.6">I = 0.01–0.02C</tspan></text>
<rect x="520.0" y="100.0" width="150.0" height="55.0" rx="6" fill="#fff8e8" stroke="#c0392b" stroke-width="1.5"/><text x="595.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">PRECHARGE</tspan><tspan x="595.0" dy="14.3">I = 0.05C–0.1C</tspan><tspan x="595.0" dy="14.3">Таймер t_PRE тікає</tspan></text>
<rect x="740.0" y="100.0" width="130.0" height="55.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="805.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">FAST CHARGE (CC)</tspan><tspan x="805.0" dy="14.3">I = 0.5C–1.0C</tspan></text>
<rect x="740.0" y="240.0" width="130.0" height="55.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="805.0" y="264.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">REGULATION (CV)</tspan><tspan x="805.0" dy="11.7">U = 4.20 В, I спадає</tspan></text>
<rect x="520.0" y="240.0" width="140.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="264.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">CHARGE DONE</tspan><tspan x="590.0" dy="11.7">Термінація (I &lt; C/10)</tspan></text>
<rect x="300.0" y="310.0" width="175.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="387.5" y="324.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="387.5" dy="0.0">PRECHARGE FAULT</tspan><tspan x="387.5" dy="14.3">Таймер t &gt; t_MAX</tspan><tspan x="387.5" dy="14.3">Внутрішнє КЗ комірки!</tspan><tspan x="387.5" dy="14.3">Заряд НАЗАВЖДИ стоп</tspan></text>
