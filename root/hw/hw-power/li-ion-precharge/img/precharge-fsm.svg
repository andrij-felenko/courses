<text x="695.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">I &lt; C/10</text>
<line x1="520.0" y1="267.0" x2="165.0" y2="155.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="220.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">V &lt; 4.05 В (Recharge)</text>
<line x1="595.0" y1="155.0" x2="390.0" y2="310.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="540.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">t_PRE &gt; t_MAX
(V &lt; 3.0 В)</text>
<line x1="300.0" y1="342.0" x2="165.0" y2="155.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="210.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Скидання VBUS (Power Cycle)</text>
<text x="440.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Таймер безпеки запобігає нескінченному нагріву батареї з внутрішнім коротким замиканням</text>
</svg>