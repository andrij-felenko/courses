<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430">
<rect width="920" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Три способи замкнути коло командою — і що в кожному «зношується»</text>
<rect x="50.0" y="60.0" width="230.0" height="250.0" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4"/>
<rect x="345.0" y="60.0" width="230.0" height="250.0" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4"/>
<rect x="640.0" y="60.0" width="230.0" height="250.0" rx="8" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="165.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Електромеханічне</text>
<text x="165.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">реле / контактор</text>
<circle cx="105.0" cy="140.0" r="8.0" fill="none" stroke="#b5732e" stroke-width="2"/>
<circle cx="105.0" cy="156.0" r="8.0" fill="none" stroke="#b5732e" stroke-width="2"/>
<circle cx="105.0" cy="172.0" r="8.0" fill="none" stroke="#b5732e" stroke-width="2"/>
<circle cx="105.0" cy="188.0" r="8.0" fill="none" stroke="#b5732e" stroke-width="2"/>
<text x="87.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#b5732e" text-anchor="end" font-weight="normal" font-style="normal">котушка</text>
<line x1="171.0" y1="150.0" x2="225.0" y2="180.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<circle cx="171.0" cy="150.0" r="3.5" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<circle cx="223.0" cy="182.0" r="4.0" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<line x1="195.0" y1="210.0" x2="245.0" y2="210.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<circle cx="220.0" cy="210.0" r="4.0" fill="#1b1b1b" stroke="none" stroke-width="0"/>
<text x="165.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">метал б'є по металу</text>
<text x="165.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">зношується:</text>
<text x="165.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">контакти — іскра,</text>
<text x="165.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">брязкіт, обгорання</text>
<text x="460.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ртутний контактор</text>
<text x="460.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="italic" font-style="normal">(mercury relay)</text>
<rect x="438.0" y="124.0" width="44.0" height="120.0" rx="10" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6"/>
<rect x="440.0" y="198.0" width="40.0" height="44.0" rx="8" fill="#cfcfd6" stroke="#8a8a8a" stroke-width="1"/>
<text x="460.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#5a5a66" text-anchor="middle" font-weight="bold" font-style="normal">Hg</text>
<rect x="453.0" y="146.0" width="14.0" height="30.0" rx="3" fill="#9a9aa2" stroke="#1b1b1b" stroke-width="1.2"/>
<text x="490.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">плунжер</text>
<text x="460.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ртуть змочує контакт —</text>
<text x="460.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">немає іскри й брязкоту,</text>
<text x="460.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">великі струми; але отруйна,</text>
<text x="460.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">боїться нахилу й морозу</text>
<text x="755.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Твердотільне реле (SSR)</text>
<rect x="677.0" y="130.0" width="32.0" height="26.0" rx="4" fill="#f8efd6" stroke="#e0a32e" stroke-width="1.4"/>
<text x="693.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#9a7a1e" text-anchor="middle" font-weight="bold" font-style="normal">LED</text>
<line x1="711.0" y1="143.0" x2="761.0" y2="143.0" stroke="#e0a32e" stroke-width="2.2" marker-end="url(#aInk)"/>
<text x="726.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#9a7a1e" text-anchor="middle" font-weight="normal" font-style="normal">світло</text>
<rect x="763.0" y="126.0" width="60.0" height="34.0" rx="4" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="793.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">фото +</text>
<text x="793.0" y="154.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">симістор</text>
<text x="755.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">розрив — це повітря</text>
<text x="755.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(гальванічна розв'язка)</text>
<text x="755.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">нема рухомих частин:</text>
<text x="755.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">тихо, без іскри, мільйони</text>
<text x="755.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">циклів; але гріється і</text>
<text x="755.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">має струм витоку у «вимк.»</text>
<line x1="284.0" y1="185.0" x2="341.0" y2="185.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<line x1="579.0" y1="185.0" x2="636.0" y2="185.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<text x="460.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="italic" font-style="normal">Спільне завдання — замкнути силове коло слабкою командою; різниця — у тому, що саме рухається й що зношується.</text>
</svg>
