<rect x="450.0" y="246.0" width="400.0" height="8.0" rx="4" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.0"/>
<text x="235.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#6a6a6a" text-anchor="middle" font-weight="bold" font-style="normal">МЕХАНІЧНА КОМУТАЦІЯ  (контакти, ртуть)</text>
<text x="650.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ТВЕРДОТІЛЬНА КОМУТАЦІЯ  (кремній + світло)</text>
<circle cx="135.0" cy="250.0" r="6.0" fill="#6a6a6a" stroke="#6a6a6a" stroke-width="1"/>
<line x1="135.0" y1="244.0" x2="135.0" y2="238.0" stroke="#6a6a6a" stroke-width="1.6" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="135.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#6a6a6a" text-anchor="middle" font-weight="bold" font-style="normal">до 1950-х</text>
<text x="135.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">реле й контактори:</text>
<text x="135.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">котушка тягне контакт;</text>
<text x="135.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ртутний контактор —</text>
<text x="135.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ртуть замість металу</text>
<circle cx="330.0" cy="250.0" r="6.0" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<line x1="330.0" y1="256.0" x2="330.0" y2="270.0" stroke="#c0271e" stroke-width="1.6" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="330.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1956</text>
<text x="330.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">SCR у Bell Labs:</text>
<text x="330.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">кремнієва защіпка</text>
<text x="330.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(одна півхвиля)</text>
<circle cx="470.0" cy="250.0" r="6.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<line x1="470.0" y1="244.0" x2="470.0" y2="238.0" stroke="#1f8a3b" stroke-width="1.6" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="470.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">~1963</text>
<text x="470.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Triac (GE):</text>
<text x="470.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">защіпка на ОБИДВІ</text>
<text x="470.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">півхвилі — ключ для AC</text>
<circle cx="610.0" cy="250.0" r="6.0" fill="#e0a32e" stroke="#e0a32e" stroke-width="1"/>
<line x1="610.0" y1="256.0" x2="610.0" y2="270.0" stroke="#e0a32e" stroke-width="1.6" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="610.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#e0a32e" text-anchor="middle" font-weight="bold" font-style="normal">~1960-ті</text>
<text x="610.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">оптопара:</text>
<text x="610.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">світлодіод + фото-</text>
<text x="610.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">приймач = розв'язка</text>
<circle cx="770.0" cy="250.0" r="6.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<line x1="770.0" y1="244.0" x2="770.0" y2="238.0" stroke="#1f47b5" stroke-width="1.6" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="770.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">1971/72</text>
<text x="770.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Crydom (у складі</text>
<text x="770.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">International Rectifier):</text>
<text x="770.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">перший SSR — і серія,</text>
<text x="770.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">що стала стандартом</text>
<text x="460.0" y="456.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="italic" font-style="normal">Triac дав безконтактний ключ для змінного струму, оптопара — гальванічну розв'язку; Crydom поєднала їх в один корпус.</text>
