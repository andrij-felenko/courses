<text x="50.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Потужність до 12 ГВт, напруга до ±1100 кВ</text>
