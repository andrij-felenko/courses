<text x="50.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Споживає реактивну потужність (cos φ ≈ 0.7)</text>
