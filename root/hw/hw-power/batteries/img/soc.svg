<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450"
     viewBox="0 0 960 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="450" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Скільки лишилось і де межа: безпечне вікно розряду</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">не висаджуй нижче ~3.0 В/комірку — це шкодить «полицям» (з історії розділу)</text>
<rect x="90" y="100" width="80" height="280" rx="8" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="92" y="100.0" width="76" height="100.0" rx="8" fill="#d8f3e0" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="182" y="154.0" font-size="10.5" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">робоча зона (повна → номінал)</text>
<text x="130" y="114.0" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">4.2 В</text>
<rect x="92" y="200.0" width="76" height="40.0" rx="8" fill="#fff0d8" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="182" y="224.0" font-size="10.5" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">час сідати</text>
<text x="130" y="214.0" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">3.7 В</text>
<rect x="92" y="240.0" width="76" height="100.0" rx="8" fill="#fde2e2" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="182" y="294.0" font-size="10.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">сідай НЕГАЙНО</text>
<text x="130" y="254.0" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">3.5 В</text>
<rect x="92" y="340.0" width="76" height="40.0" rx="8" fill="#e9c9c9" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="182" y="364.0" font-size="10.5" fill="#7a1f1f" text-anchor="start" font-weight="bold" font-style="normal">нижче — незворотна шкода</text>
<text x="130" y="354.0" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">3 В</text>
<rect x="540" y="110" width="380" height="110" rx="11" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.5"/>
<text x="730" y="136" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">За напругою (грубо)</text>
<text x="560" y="160" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">просто, але плато й просадка під газом</text>
<text x="560" y="178" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">роблять оцінку приблизною;</text>
<text x="560" y="196" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">у повітрі під навантаженням «бреше» вниз</text>
<rect x="540" y="240" width="380" height="110" rx="11" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.5"/>
<text x="730" y="266" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Лічба кулонів (точніше)</text>
<text x="560" y="290" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">інтегруємо спожитий струм (давач із 44.1)</text>
<text x="560" y="308" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ скільки А·год пішло;</text>
<text x="560" y="326" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">точніше, але треба знати початковий заряд</text>
<text x="480.0" y="436" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">На практиці апарат садять на ~3.5 В/комірку із запасом — щоб і не зіпсувати акумулятор, і мати дрібку на маневр перед посадкою.</text>
</svg>
