<text x="450.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Для комірки 1.5 А·год: 2C = 3 А. Чим більший Rвн, тим крутіша лінія — і тим меншу C-rate можна тягнути, не пробивши межу.</text>
<text x="450.0" y="409.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Перетин лінії з межею ΔV дає максимальну допустиму C-rate: при Rвн=0.1 це ~4C, при 0.2 — ~2C, при 0.4 — лише ~1C.</text>
