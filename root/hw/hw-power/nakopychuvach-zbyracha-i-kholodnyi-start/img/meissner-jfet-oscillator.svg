<rect x="0.0" y="0.0" width="940.0" height="420.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><rect x="20.0" y="20.0" width="470.0" height="380.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="255.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема релаксаційного JFET-автогенератора</text><rect x="29.0" y="126.2" width="72.1" height="47.6" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="65.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="65.0" dy="0.0">V_in</tspan><tspan x="65.0" dy="15.6">(20 мВ)</tspan></text><line x1="95.0" y1="150.0" x2="135.0" y2="150.0" stroke="#333333" stroke-width="1.8"/><rect x="135.0" y="90.0" width="75.0" height="160.0" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="172.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тр-р 1:N</text><text x="172.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">L_p : L_s</text><circle cx="150.0" cy="160.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/><circle cx="195.0" cy="160.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/><text x="172.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">1 : 50</text><rect x="255.0" y="140.0" width="55.0" height="75.0" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/><text x="282.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">JFET</text><text x="282.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">N-канал</text><text x="282.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">(Збіднений)</text><line x1="210.0" y1="150.0" x2="255.0" y2="150.0" stroke="#333333" stroke-width="1.8"/><line x1="282.0" y1="215.0" x2="282.0" y2="310.0" stroke="#333333" stroke-width="1.8"/><line x1="262.0" y1="310.0" x2="302.0" y2="310.0" stroke="#333333" stroke-width="2.0"/><line x1="269.0" y1="314.0" x2="295.0" y2="314.0" stroke="#333333" stroke-width="1.5"/><line x1="276.0" y1="318.0" x2="288.0" y2="318.0" stroke="#333333" stroke-width="1.0"/><line x1="172.0" y1="250.0" x2="172.0" y2="290.0" stroke="#333333" stroke-width="1.8"/><line x1="172.0" y1="290.0" x2="230.0" y2="290.0" stroke="#333333" stroke-width="1.8"/><rect x="207.9" y="245.0" width="54.2" height="30.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="235.0" y="263.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">C_gate</tspan></text><line x1="235.0" y1="245.0" x2="235.0" y2="180.0" stroke="#333333" stroke-width="1.8"/><line x1="235.0" y1="180.0" x2="255.0" y2="180.0" stroke="#333333" stroke-width="1.8"/><line x1="210.0" y1="105.0" x2="330.0" y2="105.0" stroke="#333333" stroke-width="1.8"/><rect x="307.9" y="90.0" width="94.1" height="30.0" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/><text x="355.0" y="108.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">Діод Schottky</tspan></text><line x1="390.0" y1="105.0" x2="435.0" y2="105.0" stroke="#333333" stroke-width="1.8"/><line x1="435.0" y1="105.0" x2="435.0" y2="170.0" stroke="#333333" stroke-width="1.8"/><rect x="390.9" y="187.3" width="88.2" height="45.3" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/><text x="435.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="435.0" dy="0.0">C_aux</tspan><tspan x="435.0" dy="14.3">(1–10 мкФ)</tspan></text><line x1="435.0" y1="245.0" x2="435.0" y2="310.0" stroke="#333333" stroke-width="1.8"/><line x1="420.0" y1="310.0" x2="450.0" y2="310.0" stroke="#333333" stroke-width="2.0"/><line x1="390.0" y1="85.0" x2="460.0" y2="85.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/><text x="425.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">V_aux → 2.0 В</text><rect x="510.0" y="20.0" width="410.0" height="380.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="715.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">4 Фази автоколивань генератора</text><rect x="525.0" y="75.0" width="380.0" height="66.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/><text x="535.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Початковий струм</text><rect x="535.0" y="103.0" width="360.0" height="32.0" rx="6" fill="#f8fafc" stroke="#f8fafc" stroke-width="1.5"/><text x="715.0" y="122.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="715.0" dy="0.0">V_GS=0 → канал відкритий, струм у первинній L_p наростає від 20 мВ.</tspan></text><rect x="525.0" y="151.0" width="380.0" height="66.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/><text x="535.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Прямий додатний зв'язок</text><rect x="535.0" y="179.0" width="360.0" height="32.0" rx="6" fill="#fef3c7" stroke="#fef3c7" stroke-width="1.5"/><text x="715.0" y="198.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="715.0" dy="0.0">Трансформатор наводить +V на затворі, лавиноподібно відкриваючи JFET.</tspan></text><rect x="525.0" y="227.0" width="380.0" height="66.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/><text x="535.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Насичення та відсічка</text><rect x="535.0" y="255.0" width="360.0" height="32.0" rx="6" fill="#fee2e2" stroke="#fee2e2" stroke-width="1.5"/><text x="715.0" y="274.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="715.0" dy="0.0">di/dt падає, полярність L_s змінюється на різко негативну (-V_p), JFET миттєво запирається.</tspan></text><rect x="525.0" y="303.0" width="380.0" height="66.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/><text x="535.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">4. Flyback-викид у C_aux</text><rect x="535.0" y="331.0" width="360.0" height="32.0" rx="6" fill="#f0fdf4" stroke="#f0fdf4" stroke-width="1.5"/><text x="715.0" y="350.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="715.0" dy="0.0">Магнітна енергія вторинної обмотки через діод заряджає шину V_aux до 2 В.</tspan></text>
</svg>