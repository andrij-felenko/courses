<text x="390.4" y="206.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">із приборканням:</text>
<text x="390.4" y="228.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">струм під межею</text>
<text x="390.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">площа під обома кривими однакова — той самий заряд, лише розтягнутий у часі</text>
<rect x="710.0" y="151.2" width="290.0" height="97.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="855.0" y="171.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">Суть скрізь одна:</tspan><tspan x="855.0" dy="16.2">не дати струму злетіти —</tspan><tspan x="855.0" dy="16.2">додати опору на час старту,</tspan><tspan x="855.0" dy="16.2">підняти напругу повільно</tspan><tspan x="855.0" dy="16.2">або влучити в слушну фазу.</tspan></text>
<rect x="25.0" y="372.0" width="320.0" height="128.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.8"/><text x="185.0" y="406.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">NTC-термістор</tspan><tspan x="185.0" dy="16.9"></tspan><tspan x="185.0" dy="16.9">холодний — опір великий, зрізає пік;</tspan><tspan x="185.0" dy="16.9">нагрівся — опір малий, не заважає.</tspan><tspan x="185.0" dy="16.9">Мінус: гарячий, треба охолонути.</tspan></text>
<rect x="370.0" y="372.0" width="320.0" height="128.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="530.0" y="406.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Резистор + обхідний ключ</tspan><tspan x="530.0" dy="16.9"></tspan><tspan x="530.0" dy="16.9">R обмежує перший сплеск, а коли</tspan><tspan x="530.0" dy="16.9">конденсатор зарядився — реле чи</tspan><tspan x="530.0" dy="16.9">тиристор коротить R геть.</tspan></text>
<rect x="715.0" y="372.0" width="320.0" height="128.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/><text x="875.0" y="406.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">Активний плавний пуск</tspan><tspan x="875.0" dy="16.9"></tspan><tspan x="875.0" dy="16.9">MOSFET піднімає напругу повільним</tspan><tspan x="875.0" dy="16.9">фронтом: Iкид = C·dV/dt, тож пік</tspan><tspan x="875.0" dy="16.9">падає рівно так, як пологіший фронт.</tspan></text>
</svg>