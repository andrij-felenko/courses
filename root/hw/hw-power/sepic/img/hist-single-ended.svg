<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Однотактний проти двотактного: скільки осердя дістається схемі</text>
<rect x="60.0" y="60.0" width="400.0" height="340.0" rx="10" fill="#ffffff" stroke="#d8dde3" stroke-width="2.0"/><text x="260.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Однотактний (single-ended)</text><line x1="190.0" y1="118.0" x2="190.0" y2="388.0" stroke="#1a1a1a" stroke-width="1.6"/><rect x="175.0" y="126.0" width="30.0" height="122.0" rx="3" fill="#eef8ef" stroke="#27ae60" stroke-width="1.5"/><line x1="180.0" y1="126.0" x2="200.0" y2="126.0" stroke="#1a1a1a" stroke-width="1.4"/><text x="166.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">+B_нас</text><line x1="180.0" y1="248.0" x2="200.0" y2="248.0" stroke="#1a1a1a" stroke-width="1.4"/><text x="166.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">0</text><line x1="180.0" y1="374.0" x2="200.0" y2="374.0" stroke="#1a1a1a" stroke-width="1.4"/><text x="166.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">−B_нас</text><text x="222.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">ΔB ≤ B_нас</text><text x="222.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">потік ходить лише в один бік:</text><text x="222.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">друга половина петлі осердя</text><text x="222.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">весь час простоює</text><text x="222.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">один ключ, і той — на землю</text><text x="222.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">простий драйвер, нема чим</text><text x="222.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">розбалансувати осердя</text>
<rect x="520.0" y="60.0" width="400.0" height="340.0" rx="10" fill="#ffffff" stroke="#d8dde3" stroke-width="2.0"/><text x="720.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Двотактний (push-pull)</text><line x1="650.0" y1="118.0" x2="650.0" y2="388.0" stroke="#1a1a1a" stroke-width="1.6"/><rect x="635.0" y="126.0" width="30.0" height="248.0" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><line x1="640.0" y1="126.0" x2="660.0" y2="126.0" stroke="#1a1a1a" stroke-width="1.4"/><text x="626.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">+B_нас</text><line x1="640.0" y1="248.0" x2="660.0" y2="248.0" stroke="#1a1a1a" stroke-width="1.4"/><text x="626.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">0</text><line x1="640.0" y1="374.0" x2="660.0" y2="374.0" stroke="#1a1a1a" stroke-width="1.4"/><text x="626.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">−B_нас</text><text x="682.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">ΔB ≤ 2·B_нас</text><text x="682.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">потік гойдається симетрично:</text><text x="682.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">осердя віддає вдвічі більше</text><text x="682.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">за той самий об'єм</text><text x="682.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">два ключі, плечі треба зрівняти</text><text x="682.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">найменша нерівність плечей</text><text x="682.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">жене потік у насичення</text>
<rect x="110.0" y="420.0" width="300.0" height="46.0" rx="6" fill="#eef8ef" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="439.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">90 витків</tspan><tspan x="260.0" dy="16.9">на ті самі вольт·секунди</tspan></text>
<rect x="570.0" y="420.0" width="300.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="720.0" y="439.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">45 витків</tspan><tspan x="720.0" dy="16.9">на ті самі вольт·секунди</tspan></text>
<rect x="60.0" y="486.0" width="860.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="490.0" y="507.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Приклад: 300 В на обмотці, 50 кГц, D = 0.45, переріз осердя 100 мм², робоче B_нас = 0.3 Тл.</tspan><tspan x="490.0" dy="15.6">Однотактна схема веде потік від нуля вгору й мусить його скидати — їй лишається половина петлі.</tspan><tspan x="490.0" dy="15.6">Двотактна гойдає потік симетрично й обходиться вдвічі меншими витками — ціною двох узгоджених ключів.</tspan></text>
</svg>