<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360">
<rect width="820" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Та сама напруга — різний струм: вирішує опір шкіри</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">I = V/R; при 230 В суха шкіра рятує, мокра — вбиває</text>
<line x1="410.0" y1="78.0" x2="410.0" y2="330.0" stroke="#e4e4e4" stroke-width="1.5" stroke-linecap="round"/>
<text x="205.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">СУХА шкіра</text>
<text x="205.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">R ≈ 50 кОм</text>
<text x="205.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">I = 230 / 50000</text>
<rect x="95.0" y="188.0" width="220.0" height="50.0" rx="10" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2"/>
<text x="205.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">≈ 4.6 мА</text>
<text x="205.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">боляче, та зазвичай виживеш</text>
<text x="615.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">МОКРА шкіра</text>
<text x="615.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">R ≈ 1 кОм</text>
<text x="615.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">I = 230 / 1000</text>
<rect x="505.0" y="188.0" width="220.0" height="50.0" rx="10" fill="#fdeeee" stroke="#c0271e" stroke-width="2"/>
<text x="615.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">≈ 230 мА</text>
<text x="615.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">далеко за межею фібриляції — смертельно</text>
<text x="410.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Ось чому «скільки вольтів небезпечно» — питання неповне: усе вирішує струм, а його задає опір.</text>
</svg>
