<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Нагрів: яскраве сонце водночас і шкодить</text>
<line x1="110.0" y1="300.0" x2="470.0" y2="300.0" stroke="#1b1b1b" stroke-width="1.5" stroke-linecap="round"/>
<line x1="110.0" y1="300.0" x2="110.0" y2="100.0" stroke="#1b1b1b" stroke-width="1.5" stroke-linecap="round"/>
<text x="290.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">температура →</text>
<text x="101.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">Voc, P</text>
<polyline points="110.0,120.0 470.0,190.0" fill="none" stroke="#c0271e" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="261.2" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">напруга й P падають</text>
<line x1="110.0" y1="300.0" x2="110.0" y2="305.0" stroke="#1b1b1b" stroke-width="1" stroke-linecap="round"/>
<text x="110.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">+25°</text>
<line x1="290.0" y1="300.0" x2="290.0" y2="305.0" stroke="#1b1b1b" stroke-width="1" stroke-linecap="round"/>
<text x="290.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">+45°</text>
<line x1="470.0" y1="300.0" x2="470.0" y2="305.0" stroke="#1b1b1b" stroke-width="1" stroke-linecap="round"/>
<text x="470.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">+65°</text>
<rect x="520.0" y="100.0" width="380.0" height="200.0" rx="10" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.6"/>
<text x="710.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Прикрий парадокс</text>
<text x="538.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">яскравіше сонце → більше струму (добре),</text>
<text x="538.0" y="171.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">але воно ж ГРІЄ панель → менше напруги</text>
<text x="538.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">(погано) → частина виграшу з'їдається</text>
<text x="538.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">на сонці панель буває на +25…35 °C</text>
<text x="538.0" y="247.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">гарячіша за повітря; чорна й нерухома</text>
<text x="538.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">в застої — особливо</text>
<rect x="70.0" y="356.0" width="800.0" height="32.0" rx="9" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="470.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">З теми 10.5.2 ми знаємо: нагрів знижує Voc (~0.3%/°C), а з ним і потужність. Іронія в тому, що саме яскраве сонце, дане</text>
<text x="470.0" y="389.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">для струму, заодно РОЗІГРІВАЄ панель і відбирає напругу. Тому панелям дають дихати: провітрювання й зазор за ними рятують відсотки.</text>
</svg>
