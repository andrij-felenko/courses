<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Реальне сонце: три злодії крадуть «паспортну» потужність</text>
<rect x="50.0" y="150.0" width="130.0" height="80.0" rx="10" fill="#eef8ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="115.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">паспортна</text>
<text x="115.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Pmax (STC)</text>
<line x1="180.0" y1="190.0" x2="250.0" y2="190.0" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="280.0" y="150.0" width="170.0" height="80.0" rx="10" fill="#ffffff" stroke="#1f47b5" stroke-width="1.8"/>
<text x="365.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Кут</text>
<text x="365.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">cos θ: косе сонце —</text>
<text x="365.0" y="209.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">менше світла</text>
<rect x="500.0" y="150.0" width="170.0" height="80.0" rx="10" fill="#ffffff" stroke="#c0271e" stroke-width="1.8"/>
<text x="585.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Тепло</text>
<text x="585.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">гаряча панель —</text>
<text x="585.0" y="209.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">нижча напруга</text>
<line x1="468.0" y1="190.0" x2="498.0" y2="190.0" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="720.0" y="150.0" width="170.0" height="80.0" rx="10" fill="#ffffff" stroke="#caa24a" stroke-width="1.8"/>
<text x="805.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Тінь</text>
<text x="805.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">затінена комірка</text>
<text x="805.0" y="209.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">душить весь ряд</text>
<line x1="688.0" y1="190.0" x2="718.0" y2="190.0" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="70.0" y="356.0" width="800.0" height="32.0" rx="9" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Цифра «5 Вт» на панелі — за ідеального сонця (STC). У полі від неї відкушують одразу троє: кут падіння, нагрів і, найзубастіший,</text>
<text x="470.0" y="389.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">затінення. Тому реально розраховувати треба не на паспорт, а на те, що лишиться після всіх трьох. Розгляньмо кожного.</text>
</svg>
