<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два пороги й гістерезис: стан пристрою від напруги живлення</text>
<line x1="130.0" y1="100.0" x2="130.0" y2="360.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="130.0" y1="330.0" x2="720.0" y2="330.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="720.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">напруга живлення →</text>
<text x="120.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">ON</text>
<text x="120.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">OFF</text>
<line x1="130.0" y1="130.0" x2="700.0" y2="130.0" stroke="#d7dee6" stroke-width="1.0" stroke-dasharray="3,4"/>
<rect x="360.0" y="110.0" width="150.0" height="250.0" fill="#fff6e6" stroke="none"/>
<line x1="360.0" y1="110.0" x2="360.0" y2="330.0" stroke="#b5732e" stroke-width="1.6" stroke-dasharray="5,4"/>
<line x1="510.0" y1="110.0" x2="510.0" y2="330.0" stroke="#b5732e" stroke-width="1.6" stroke-dasharray="5,4"/>
<line x1="138.0" y1="330.0" x2="510.0" y2="330.0" stroke="#2457d6" stroke-width="3.0"/>
<line x1="510.0" y1="330.0" x2="510.0" y2="130.0" stroke="#2457d6" stroke-width="3.0"/>
<line x1="360.0" y1="130.0" x2="700.0" y2="130.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="360.0" y1="130.0" x2="360.0" y2="330.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="510.0" y1="130.0" x2="700.0" y2="130.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="250.0" y1="330.0" x2="300.0" y2="330.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="510.0" y1="250.0" x2="510.0" y2="215.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="620.0" y1="130.0" x2="560.0" y2="130.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="360.0" y1="215.0" x2="360.0" y2="250.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="510.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b5732e" text-anchor="middle" font-weight="700">V_увімк</text>
<text x="510.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(поріг зростання)</text>
<text x="360.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b5732e" text-anchor="middle" font-weight="700">V_вимк</text>
<text x="360.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(поріг падіння)</text>
<line x1="360.0" y1="96.0" x2="510.0" y2="96.0" stroke="#b5732e" stroke-width="1.4"/>
<line x1="360.0" y1="92.0" x2="360.0" y2="100.0" stroke="#b5732e" stroke-width="1.4"/>
<line x1="510.0" y1="92.0" x2="510.0" y2="100.0" stroke="#b5732e" stroke-width="1.4"/>
<text x="435.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b5732e" text-anchor="middle" font-weight="700">гістерезис</text>
<text x="235.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">працює — тримається ON, поки не впаде нижче V_вимк</text>
<text x="150.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">заблоковано — тримається OFF, поки не підніметься до V_увімк</text>
<text x="390.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Немає порогу-точки: увімкнення й вимкнення рознесено. Проміжок між ними — гістерезис — не дає деренчати.</text>
</svg>