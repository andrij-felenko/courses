<line x1="150.5" y1="90.0" x2="150.5" y2="330.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,4"/>
<text x="150.5" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Vth</text>
<text x="150.5" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(відкривається)</text>
