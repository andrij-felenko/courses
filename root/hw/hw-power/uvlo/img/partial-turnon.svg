<text x="455.8" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">поріг UVLO</text>
<text x="272.6" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">сіра зона: недовідкрито</text>
<text x="272.6" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Rds ↑↑ → ключ пече</text>
<text x="540.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">повне відкриття</text>
<circle cx="242.1" cy="243.6" r="4.2" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<circle cx="577.9" cy="330.0" r="4.2" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<rect x="489.2" y="122.1" width="191.6" height="55.8" rx="6" fill="#f8fafc" stroke="#c9d3dc" stroke-width="1.3"/><text x="585.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">20 А через ключ:</tspan><tspan x="585.0" dy="13.7">Vgs 4.5 В: Rds 50 мОм → 20 Вт</tspan><tspan x="585.0" dy="13.7">Vgs 10 В: Rds 5 мОм → 2 Вт</tspan></text>
<text x="390.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">UVLO тримає ключ вимкненим, поки живлення не дійде в зелену зону — там, де затвор відкривається повністю.</text>
