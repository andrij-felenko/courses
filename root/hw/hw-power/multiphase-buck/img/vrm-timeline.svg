<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як живлення процесора дійшло до багатофазності</text>
<line x1="150.0" y1="68.0" x2="150.0" y2="522.0" stroke="#6b7280" stroke-width="2.5"/>
<rect x="174.0" y="77.0" width="606.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="477.0" y="96.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="477.0" dy="0.0">Процесор живиться 5 В просто з блока живлення — регулятора на платі нема</tspan></text>
<line x1="150.0" y1="92.0" x2="174.0" y2="92.0" stroke="#6b7280" stroke-width="1.8"/>
<circle cx="150.0" cy="92.0" r="6.0" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.5"/>
<text x="128.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">до 1995</text>
<rect x="174.0" y="127.0" width="606.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="477.0" y="146.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="477.0" dy="0.0">Pentium Pro: регулятор — знімний модуль у сокеті (звідси «модуль» у назві)</tspan><tspan x="477.0" dy="16.2">VRM 8.1 — близько 14.5 А; напругу задає VID-код від самого процесора</tspan></text>
<line x1="150.0" y1="150.0" x2="174.0" y2="150.0" stroke="#6b7280" stroke-width="1.8"/>
<circle cx="150.0" cy="150.0" r="6.0" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.5"/>
<text x="128.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1995–1997</text>
<rect x="174.0" y="185.0" width="606.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="477.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="477.0" dy="0.0">Virginia Tech (APEC): вихід — навмисне МАЛА індуктивність</tspan><tspan x="477.0" dy="16.2">плюс кілька таких комірок, зсунутих у часі</tspan></text>
<line x1="150.0" y1="208.0" x2="174.0" y2="208.0" stroke="#27ae60" stroke-width="1.8"/>
<circle cx="150.0" cy="208.0" r="6.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.5"/>
<text x="128.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1998</text>
<rect x="174.0" y="251.0" width="606.0" height="30.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.5"/><text x="477.0" y="270.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="477.0" dy="0.0">VRM 8.3: окремі виводи, щоб міряти напругу просто біля кристала</tspan></text>
<line x1="150.0" y1="266.0" x2="174.0" y2="266.0" stroke="#2457d6" stroke-width="1.8"/>
<circle cx="150.0" cy="266.0" r="6.0" fill="#eef6ff" stroke="#2457d6" stroke-width="2.5"/>
<text x="128.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">1999</text>
<rect x="174.0" y="301.0" width="606.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="477.0" y="320.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="477.0" dy="0.0">Вхід переводять з 5 В на 12 В (ATX12V; настанови VRM 9.0 — квітень 2002)</tspan><tspan x="477.0" dy="16.2">на платах Athlon і Pentium 4 з'являються перші 2–3 фази</tspan></text>
<line x1="150.0" y1="324.0" x2="174.0" y2="324.0" stroke="#27ae60" stroke-width="1.8"/>
<circle cx="150.0" cy="324.0" r="6.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.5"/>
<text x="128.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">2000–2002</text>
<rect x="174.0" y="367.0" width="606.0" height="30.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.5"/><text x="477.0" y="386.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="477.0" dy="0.0">DrMOS: драйвер і обидва ключі фази — в одному корпусі 8×8 мм</tspan></text>
<line x1="150.0" y1="382.0" x2="174.0" y2="382.0" stroke="#2457d6" stroke-width="1.8"/>
<circle cx="150.0" cy="382.0" r="6.0" fill="#eef6ff" stroke="#2457d6" stroke-width="2.5"/>
<text x="128.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">2004</text>
<rect x="174.0" y="417.0" width="606.0" height="46.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.5"/><text x="477.0" y="436.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="477.0" dy="0.0">VRD 10.x (LGA775): 101 А тривало, 119 А пік, смуга ±19 мВ,</tspan><tspan x="477.0" dy="16.2">обов'язкова нахилена лінія навантаження</tspan></text>
<line x1="150.0" y1="440.0" x2="174.0" y2="440.0" stroke="#2457d6" stroke-width="1.8"/>
<circle cx="150.0" cy="440.0" r="6.0" fill="#eef6ff" stroke="#2457d6" stroke-width="2.5"/>
<text x="128.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">сер. 2000-х</text>
<rect x="174.0" y="483.0" width="606.0" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="477.0" y="502.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="477.0" dy="0.0">Haswell: FIVR — остання, найтонша сходинка переїжджає в корпус процесора</tspan></text>
<line x1="150.0" y1="498.0" x2="174.0" y2="498.0" stroke="#c0392b" stroke-width="1.8"/>
