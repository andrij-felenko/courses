<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три замки прошивки і чому вони не спрацювали</text>
<rect x="52.0" y="70.0" width="236.0" height="190.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="170.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Sealed</text>
<text x="170.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">запечатано</text>
<text x="170.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Читай дані.</tspan><tspan x="170.0" dy="15.0">Прошивку й калібрування</tspan><tspan x="170.0" dy="15.0">чіпати не можна.</tspan></text>
<line x1="68.0" y1="220.0" x2="272.0" y2="220.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="4,3"/>
<text x="170.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">стан із коробки</text>
<line x1="290.0" y1="165.0" x2="310.0" y2="165.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="312.0" y="70.0" width="236.0" height="190.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="430.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Unsealed</text>
<text x="430.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">розпечатано</text>
<text x="430.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Ключ 1 (32 біти).</tspan><tspan x="430.0" dy="15.0">Відкрито калібрування,</tspan><tspan x="430.0" dy="15.0">частину налаштувань.</tspan></text>
<line x1="328.0" y1="220.0" x2="532.0" y2="220.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="4,3"/>
<text x="430.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ключ = 0x36720414</text>
<line x1="550.0" y1="165.0" x2="570.0" y2="165.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="572.0" y="70.0" width="236.0" height="190.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="690.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Full access</text>
<text x="690.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">повний доступ</text>
<text x="690.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Ключ 2 (32 біти).</tspan><tspan x="690.0" dy="15.0">Перетирай прошивку,</tspan><tspan x="690.0" dy="15.0">вимикай перевірки.</tspan></text>
<line x1="588.0" y1="220.0" x2="792.0" y2="220.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="4,3"/>
<text x="690.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ключ = 0xffffffff</text>
<rect x="70.0" y="300.0" width="720.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="326.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Замки були — але обидва ключі лишили заводськими з даташита, однаковими на всіх ноутбуках. «Запечатано» без свого ключа = навстіж.</tspan></text>
<text x="430.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">За повним доступом прошивка бреше про заряд, глушить тепловий захист і виживає після переінсталяції ОС.</text>
<text x="430.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двонапрямний цифровий порт до силового вузла — це не лише зручність, а й поверхня атаки.</text>
</svg>