<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Напруга на клемах ≠ напруга на виводі MCU</text>
<rect x="40.0" y="86.0" width="120.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="100.0" y="108.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">Комірка</tspan><tspan x="100.0" dy="15.6">(ЕРС +</tspan><tspan x="100.0" dy="15.6">внутр. опір)</tspan></text>
<rect x="230.0" y="90.0" width="110.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="285.0" y="108.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Захист +</tspan><tspan x="285.0" dy="15.6">дроти</tspan><tspan x="285.0" dy="15.6">(опір R)</tspan></text>
<rect x="420.0" y="90.0" width="110.0" height="60.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="475.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">Конденсатор</tspan><tspan x="475.0" dy="15.6">розв'язки</tspan></text>
<rect x="600.0" y="90.0" width="90.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="645.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">Вивід</tspan><tspan x="645.0" dy="15.6">MCU / АЦП</tspan></text>
<line x1="160.0" y1="120.0" x2="230.0" y2="120.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="340.0" y1="120.0" x2="420.0" y2="120.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="530.0" y1="120.0" x2="600.0" y2="120.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="300.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">струм сплеску I</text>
<text x="100.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">тут ЕРС
повна</text>
<text x="285.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="285.0" dy="0.0">падіння</tspan><tspan x="285.0" dy="13.0">I·R_внутр</tspan></text>
<text x="475.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">падіння</tspan><tspan x="475.0" dy="13.0">I·R_дротів</tspan></text>
<text x="645.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle"><tspan x="645.0" dy="0.0">те, що</tspan><tspan x="645.0" dy="13.0">БАЧИТЬ MCU</tspan></text>
<rect x="40.0" y="210.0" width="300.0" height="66.0" rx="6" fill="#fff5f4" stroke="#c0392b" stroke-width="1.3"/><text x="190.0" y="232.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Клеми батареї просідають на I·R_внутр.</tspan><tspan x="190.0" dy="14.3">Ще більше губиться на опорі дротів</tspan><tspan x="190.0" dy="14.3">і відкритих ключах захисту.</tspan></text>
<rect x="360.0" y="210.0" width="330.0" height="66.0" rx="6" fill="#eefcf3" stroke="#27ae60" stroke-width="1.3"/><text x="525.0" y="232.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">Конденсатор розв'язки на мить тримає вивід</tspan><tspan x="525.0" dy="14.3">MCU вище, ніж клеми, — заряд віддає він.</tspan><tspan x="525.0" dy="14.3">Тому АЦП і клеми показують РІЗНЕ.</tspan></text>
</svg>