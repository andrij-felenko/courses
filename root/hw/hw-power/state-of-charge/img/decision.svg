<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Який метод обрати — і три залізні правила</text>
<rect x="55.0" y="60.0" width="210.0" height="130.0" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="160.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Похила Li-ion,</text>
<text x="160.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">треба дешево</text>
<line x1="73.0" y1="120.0" x2="247.0" y2="120.0" stroke="#e4e4e4" stroke-width="1.0"/>
<text x="160.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">напруга у спокої</text>
<text x="160.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">проста оцінка, без чипа</text>
<rect x="305.0" y="60.0" width="210.0" height="130.0" rx="12" fill="#ffffff" stroke="#caa24a" stroke-width="2.0"/>
<text x="410.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пласка LFP /</text>
<text x="410.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">потрібна точність</text>
<line x1="323.0" y1="120.0" x2="497.0" y2="120.0" stroke="#e4e4e4" stroke-width="1.0"/>
<text x="410.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#caa24a" text-anchor="middle" font-weight="700">кулонометрія + напруга</text>
<text x="410.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">паливомір (fuel gauge)</text>
<rect x="555.0" y="60.0" width="210.0" height="130.0" rx="12" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="660.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Складна система,</text>
<text x="660.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">телеметрія</text>
<line x1="573.0" y1="120.0" x2="747.0" y2="120.0" stroke="#e4e4e4" stroke-width="1.0"/>
<text x="660.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">паливомір з моделлю</text>
<text x="660.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">+ здоров'я, прогноз часу</text>
<rect x="55.0" y="214.0" width="710.0" height="130.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="410.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Три залізні правила паливоміра</text>
<text x="410.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1) перекалібровуй на повному заряді (і на відсічці) — там напруга надійна;</text>
<text x="410.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">2) не вір останнім ~10% — там найбільша невизначеність;</text>
<text x="410.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">3) врахуй, що ємність тане з віком — інакше «100%» старої батареї бреше.</text>
</svg>