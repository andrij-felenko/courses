<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Карта доброго розведення: шість правил</text>
<rect x="40.0" y="60.0" width="210.0" height="96.0" rx="6" fill="#f7faf8" stroke="#c0392b" stroke-width="2.0"/>
<text x="145.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. Гаряча петля</text>
<text x="145.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Cвх упритул до ключів —</tspan><tspan x="145.0" dy="14.3">крихітна площа</tspan></text>
<rect x="280.0" y="60.0" width="210.0" height="96.0" rx="6" fill="#f7faf8" stroke="#caa24a" stroke-width="2.0"/>
<text x="385.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#caa24a" text-anchor="middle" font-weight="700">2. Вузол SW</text>
<text x="385.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">малий: рівно під</tspan><tspan x="385.0" dy="14.3">струм і тепло</tspan></text>
<rect x="520.0" y="60.0" width="210.0" height="96.0" rx="6" fill="#f7faf8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="625.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Земля</text>
<text x="625.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">суцільний полігон,</tspan><tspan x="625.0" dy="14.3">короткий зворот</tspan></text>
<rect x="40.0" y="184.0" width="210.0" height="96.0" rx="6" fill="#f7faf8" stroke="#27ae60" stroke-width="2.0"/>
<text x="145.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">4. FB — Kelvin</text>
<text x="145.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">тиха доріжка просто</tspan><tspan x="145.0" dy="14.3">з виводів Cвих</tspan></text>
<rect x="280.0" y="184.0" width="210.0" height="96.0" rx="6" fill="#f7faf8" stroke="#b5763a" stroke-width="2.0"/>
<text x="385.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b5763a" text-anchor="middle" font-weight="700">5. Тепловідвід</text>
<text x="385.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">мідь + via під</tspan><tspan x="385.0" dy="14.3">гарячі деталі</tspan></text>
<rect x="520.0" y="184.0" width="210.0" height="96.0" rx="6" fill="#f7faf8" stroke="#2457d6" stroke-width="2.0"/>
<text x="625.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">6. Розділення</text>
<text x="625.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">силове осторонь</tspan><tspan x="625.0" dy="14.3">сигнального</tspan></text>
<text x="380.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дотримай шість — і навіть проста схема працюватиме чисто.</text>
</svg>