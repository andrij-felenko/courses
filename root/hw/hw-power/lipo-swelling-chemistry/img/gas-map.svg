<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки береться газ: чотири джерела</text>
<circle cx="380.0" cy="250.0" r="52.0" fill="#fdf0e6" stroke="#e67e22" stroke-width="2.5"/>
<text x="380.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e67e22" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">газ</tspan><tspan x="380.0" dy="18.2">у пакеті</tspan></text>
<rect x="45.0" y="60.0" width="250.0" height="30.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="78.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">1. Формування SEI (перший заряд)</tspan></text><text x="170.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">EC відновлюється на аноді →</tspan><tspan x="170.0" dy="15.0">C₂H₄ (етилен) + Li₂CO₃.</tspan><tspan x="170.0" dy="15.0">Одноразовий сплеск на заводі.</tspan></text>
<rect x="465.0" y="60.0" width="250.0" height="30.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="79.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">2. Гідроліз солі LiPF₆</tspan></text><text x="590.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">слід води: PF₅ + H₂O →</tspan><tspan x="590.0" dy="15.0">POF₃ + 2 HF; кислота гризе</tspan><tspan x="590.0" dy="15.0">плівку → знову газ.</tspan></text>
<rect x="45.0" y="330.0" width="250.0" height="30.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">3. Окиснення на катоді</tspan></text><text x="170.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">надто висока напруга →</tspan><tspan x="170.0" dy="15.0">розчинник згоряє на катоді</tspan><tspan x="170.0" dy="15.0">→ CO₂ + CO.</tspan></text>
<rect x="465.0" y="330.0" width="250.0" height="30.0" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="1.5"/><text x="590.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">4. Осадження літію / мідь</tspan></text><text x="590.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">перезаряд/холод → Li-метал;</tspan><tspan x="590.0" dy="15.0">глибокий розряд → мідь тане.</tspan><tspan x="590.0" dy="15.0">І те, й те тягне газ.</tspan></text>
<line x1="230.0" y1="130.0" x2="340.0" y2="220.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="130.0" x2="420.0" y2="220.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="230.0" y1="372.0" x2="340.0" y2="280.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="372.0" x2="420.0" y2="280.0" stroke="#8e44ad" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="380.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">1 — на заводі, разово; 2–4 — за зловживання, накопичується</text>
</svg>