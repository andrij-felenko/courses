<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часові інтервали віконного сторожового таймера (Windowed Watchdog)</text>
<line x1="140.0" y1="180.0" x2="770.0" y2="180.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="770.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">Час від останнього скидання t →</text>
<rect x="140.0" y="70.0" width="200.0" height="180.0" rx="0" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="240.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">ЗАЧИНЕНЕ ВІКНО</text>
<text x="240.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle">Скидання заборонено!</text>
<text x="240.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">t &lt; t_WD_min</text>
<text x="240.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Аварія: збій лічильника /</text>
<text x="240.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">скажений пустий цикл</text>
<rect x="340.0" y="70.0" width="240.0" height="180.0" rx="0" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.0"/>
<text x="460.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">ВІДЧИНЕНЕ ВІКНО</text>
<text x="460.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">Дозволене скидання (Kick)</text>
<text x="460.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">t_WD_min ≤ t ≤ t_WD_max</text>
<circle cx="460.0" cy="180.0" r="5.0" fill="#15803d" stroke="#15803d" stroke-width="1.0"/>
<line x1="460.0" y1="230.0" x2="460.0" y2="190.0" stroke="#15803d" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="460.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Правильний WDI імпульс</text>
<rect x="580.0" y="70.0" width="160.0" height="180.0" rx="0" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="660.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">ТАЙМАУТ</text>
<text x="660.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle">Запізніле скидання</text>
<text x="660.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">t &gt; t_WD_max</text>
<text x="660.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Аварія: зависання задачі /</text>
<text x="660.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">мертве блокування (Deadlock)</text>
<line x1="340.0" y1="60.0" x2="340.0" y2="260.0" stroke="#22c55e" stroke-width="1.8" stroke-dasharray="4,4"/>
<text x="340.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">t_WD_min (початок вікна)</text>
<line x1="580.0" y1="60.0" x2="580.0" y2="260.0" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="4,4"/>
<text x="580.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">t_WD_max (кінець вікна)</text>
<rect x="140.0" y="320.0" width="600.0" height="75.0" rx="6" fill="#fafbfc" stroke="#4b5563" stroke-width="1.5"/>
<text x="440.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Логіка спрацьовування апаратного скидання:</text>
<text x="440.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">• Імпульс WDI у зачиненому вікні (t &lt; t_WD_min) ⟹ Генерація /RESET (Аварія надшвидкого циклу)</text>
<text x="440.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">• Відсутність WDI до таймауту (t &gt; t_WD_max) ⟹ Генерація /RESET (Аварія зависання програми)</text>
<text x="420.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Віконний сторож гарантує, що прошивка не просто жива, а виконує алгоритми з точно визначеним темпом.</text>
</svg>