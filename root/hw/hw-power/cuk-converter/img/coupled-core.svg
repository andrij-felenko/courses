<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Магнітне об'єднання L1 і L2: режим нульових пульсацій</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Керування пульсацією (ripple steering) через коефіцієнт зв'язку k та зазор в осерді</text>
<rect x="30.0" y="75.0" width="400.0" height="420.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="230.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спільне магнітне осердя (E-E / E-I)</text>
<rect x="80.0" y="130.0" width="300.0" height="180.0" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="2.0"/>
<rect x="140.0" y="160.0" width="60.0" height="120.0" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<rect x="260.0" y="160.0" width="60.0" height="120.0" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<rect x="198.0" y="215.0" width="64.0" height="12.0" rx="1" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="230.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Зазор</text>
<rect x="100.0" y="175.0" width="42.0" height="90.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="2.0"/>
<text x="121.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">W1 (L1)</text>
<text x="121.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Вхід</text>
<rect x="318.0" y="175.0" width="42.0" height="90.0" rx="3" fill="#dbeafe" stroke="#2457d6" stroke-width="2.0"/>
<text x="339.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">W2 (L2)</text>
<text x="339.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Вихід</text>
<line x1="110.0" y1="145.0" x2="340.0" y2="145.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="230.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Спільний потік Φ_m</text>
<rect x="45.0" y="335.0" width="370.0" height="145.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="230.0" y="397.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">• Обидві котушки бачать однакову змінну напругу v_ac.</tspan><tspan x="230.0" dy="14.3">• Зв'язок M = k·√(L1·L2) індукує зустрічну ЕРС.</tspan><tspan x="230.0" dy="14.3">• Зазор в осерді плавно підбирає коефіцієнт зв'язку k.</tspan></text>
<rect x="450.0" y="75.0" width="400.0" height="420.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="650.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Умова нульових пульсацій (Δi = 0)</text>
<rect x="470.0" y="120.0" width="360.0" height="90.0" rx="6" fill="#f0faf4" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="147.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Вихід без пульсацій (Δi_L2 = 0):</tspan><tspan x="650.0" dy="14.3">Коефіцієнт трансформації n = k</tspan><tspan x="650.0" dy="14.3">(де n = N2/N1, k = M/√(L1·L2) &lt; 1)</tspan><tspan x="650.0" dy="14.3">Вся змінна пульсація зганяється у вхід L1</tspan></text>
<rect x="470.0" y="225.0" width="360.0" height="90.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="650.0" y="252.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Вхід без пульсацій (Δi_L1 = 0):</tspan><tspan x="650.0" dy="14.3">Коефіцієнт трансформації n = 1 / k</tspan><tspan x="650.0" dy="14.3">(де n = N2/N1 &gt; 1)</tspan><tspan x="650.0" dy="14.3">Вся змінна пульсація зганяється у вихід L2</tspan></text>
<rect x="470.0" y="330.0" width="360.0" height="150.0" rx="6" fill="#fafafa" stroke="#6b7280" stroke-width="1.5"/><text x="650.0" y="380.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Фізика явища (Ripple Steering):</tspan><tspan x="650.0" dy="14.3">Індукована через M змінна напруга в точності</tspan><tspan x="650.0" dy="14.3">компенсує прикладену напругу v_ac.</tspan><tspan x="650.0" dy="14.3">Падіння напруги на індуктивності витоку:</tspan><tspan x="650.0" dy="14.3">v_Lleak = v_ac − (M/L1)·v_ac = 0  ⇒  di/dt = 0</tspan></text>
</svg>