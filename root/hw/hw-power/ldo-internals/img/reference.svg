<text x="320.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Опорна напруга: незмінний еталон, з яким усе звіряють</text>
<line x1="90.0" y1="250.0" x2="90.0" y2="56.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="90.0" y1="250.0" x2="534.0" y2="250.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="538.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">температура</text>
<text x="86.0" y="48.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Vref</text>
<line x1="90.0" y1="160.0" x2="520.0" y2="160.0" stroke="#1f8a3b" stroke-width="2.8" stroke-linecap="round"/>
<text x="514.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">бандгап ≈ 1.2 В (рівно)</text>
<path d="M 90.0,109.6 L 520.0,210.4" fill="none" stroke="#8a8a8a" stroke-width="2.2" stroke-dasharray="5 4"/>
<text x="514.0" y="224.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">наївне джерело — пливе</text>
<text x="320.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">«Бандгап» хитро складає два протилежні температурні нахили в один рівний — стала напруга.</text>
<text x="320.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Без сталого еталона нічого було б тримати: уся точність LDO міряється від нього.</text>
</svg>
