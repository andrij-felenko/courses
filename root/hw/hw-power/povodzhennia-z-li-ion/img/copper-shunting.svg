<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розчинення мідного струмознімача та утворення мідних містків</text>
<text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм руйнування комірки при перерозряді нижче 2.0 В</text>
<rect x="26.2" y="87.5" width="157.7" height="85.1" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="105.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">1. Нормальний розряд</tspan><tspan x="105.0" dy="13.7"></tspan><tspan x="105.0" dy="13.7">Напруга &gt; 3.0 В</tspan><tspan x="105.0" dy="13.7">Потенціал анода низький</tspan><tspan x="105.0" dy="13.7">Мідна фольга пасивна</tspan></text>
<text x="105.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1. Нормальний розряд</text>
<rect x="201.2" y="87.5" width="157.7" height="85.1" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.6"/><text x="280.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">2. Перерозряд (&lt;2.0 В)</tspan><tspan x="280.0" dy="13.7"></tspan><tspan x="280.0" dy="13.7">Потенціал анода &gt; 3.6 В</tspan><tspan x="280.0" dy="13.7">Окиснення міді:</tspan><tspan x="280.0" dy="13.7">Cu → Cu²⁺ + 2e⁻</tspan></text>
<text x="280.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">2. Перерозряд (&lt;2.0 В)</text>
<rect x="377.5" y="87.5" width="155.0" height="85.1" rx="6" fill="#f4f6f8" stroke="#d35400" stroke-width="1.6"/><text x="455.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">3. Міграція іонів</tspan><tspan x="455.0" dy="13.7"></tspan><tspan x="455.0" dy="13.7">Іони Cu²⁺ дифундують</tspan><tspan x="455.0" dy="13.7">крізь електроліт</tspan><tspan x="455.0" dy="13.7">та пори сепаратора</tspan></text>
<text x="455.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">3. Міграція іонів</text>
<rect x="552.5" y="87.5" width="155.0" height="85.1" rx="6" fill="#f4f6f8" stroke="#780000" stroke-width="1.6"/><text x="630.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">4. Наступний заряд</tspan><tspan x="630.0" dy="13.7"></tspan><tspan x="630.0" dy="13.7">Відновлення Cu²⁺ → Cu⁰</tspan><tspan x="630.0" dy="13.7">Ріст мідних дендритів</tspan><tspan x="630.0" dy="13.7">Внутрішній коротун!</tspan></text>
<text x="630.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#780000" text-anchor="middle" font-weight="700">4. Наступний заряд</text>
<line x1="185.0" y1="130.0" x2="200.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="360.0" y1="130.0" x2="375.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="535.0" y1="130.0" x2="550.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="235.0" width="680.0" height="75.0" rx="6" fill="#fdf0ed" stroke="#c0392b" stroke-width="1.5"/>
<text x="380.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ГОЛОВНЕ ПРАВИЛО БЕЗПЕКИ</text>
<text x="380.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Комірку, що просіла нижче 1.5–2.0 В, ЗАБОРОНЕНО заряджати стандартним струмом.</text>
<text x="380.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Мідні містки вже проросли крізь сепаратор: спроба заряду спричиняє лавинний внутрішній нагрів.</text>
</svg>