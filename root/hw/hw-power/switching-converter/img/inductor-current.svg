<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Струм котушки — трикутна хвиля; шпаруватість задає напругу</text>
<text x="480.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">росте, поки ключ ВКЛ; спадає, поки ВИКЛ; середнє = струм навантаження</text>
<line x1="90.0" y1="340.0" x2="630.0" y2="340.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="630.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">час</text>
<line x1="90.0" y1="340.0" x2="90.0" y2="110.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="82.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end" font-weight="700">струм у котушці</text>
<rect x="90.0" y="120.0" width="64.0" height="220.0" rx="8" fill="#eafaef" stroke="none" stroke-width="0.0"/>
<text x="122.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0a8f3c" text-anchor="middle" font-weight="700">ВКЛ</text>
<rect x="154.0" y="120.0" width="96.0" height="220.0" rx="8" fill="#fdf3e0" stroke="none" stroke-width="0.0"/>
<text x="202.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d98a00" text-anchor="middle" font-weight="700">ВИКЛ</text>
<polyline points="90.0,290.0 154.0,190.0 250.0,290.0 314.0,190.0 410.0,290.0 474.0,190.0 570.0,290.0" fill="none" stroke="#d98a00" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="90.0" y1="240.0" x2="570.0" y2="240.0" stroke="#0a8f3c" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="98.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0a8f3c" text-anchor="start">середнє = струм навантаження</text>
<line x1="586.0" y1="290.0" x2="586.0" y2="190.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="592.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">пульсація</text>
<rect x="640.0" y="130.0" width="280.0" height="86.0" rx="11" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="780" y="162" font-family="Consolas, monospace" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Vвих = Vвх × D</text>
<text x="780.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">D = частка часу «ВКЛ»</text>
<text x="780.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(шпаруватість)</text>
<text x="480.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Більша шпаруватість D (довше «ВКЛ») → вища Vвих. Саме нею керують вихідною напругою.</text>
</svg>