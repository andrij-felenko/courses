<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440"
     viewBox="0 0 960 440" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Резерв і повернення: не плануй на 100%</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">ділимо запас на місію + резерв (дорога додому, посадка, вітер, старіння)</text>
<text x="480.0" y="100" font-size="10.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Польотний контролер рахує спожиті mAh (лічба кулонів, давач живлення 44.1) і стежить за порогом</text>
<rect x="80" y="150" width="496.0" height="70" rx="0" fill="#cdeed8" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.6"/>
<text x="328.0" y="180" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">МІСІЯ</text>
<text x="328.0" y="200" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">корисна робота</text>
<rect x="576.0" y="150" width="160.0" height="70" rx="0" fill="#dbeafe" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="656.0" y="180" font-size="12" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ДОДОМУ</text>
<text x="656.0" y="200" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">дорога назад</text>
<rect x="736.0" y="150" width="96.0" height="70" rx="0" fill="#fff0d8" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.6"/>
<text x="784.0" y="180" font-size="12" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">ПОСАДКА</text>
<text x="784.0" y="200" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">+ запас на вітер</text>
<rect x="832.0" y="150" width="48.0" height="70" rx="0" fill="#fde2e2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.6"/>
<text x="856.0" y="180" font-size="12" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">НЗ</text>
<text x="856.0" y="200" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">не чіпати</text>
<rect x="80" y="150" width="800" height="70" rx="0" fill="none" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="80" y="138" font-size="11" fill="#6b7280" text-anchor="start" font-weight="bold" font-style="normal">100% корисної енергії</text>
<text x="880" y="138" font-size="11" fill="#6b7280" text-anchor="end" font-weight="bold" font-style="normal">0%</text>
<line x1="576.0" y1="220" x2="576.0" y2="252" stroke="#cc0000" stroke-width="2.0" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="576.0" y="270" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">тут контролер вмикає «ДОДОМУ» (RTL)</text>
<text x="576.0" y="288" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">коли лишилось рівно стільки, щоб долетіти й сісти</text>
<text x="480.0" y="426" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Тверде правило: сідай із 20–30% у запасі. «До нуля» не літають — там і найгірша просадка, і смерть батареї.</text>
</svg>
