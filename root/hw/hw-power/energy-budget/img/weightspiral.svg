<text x="830" y="170" font-size="10.5" fill="#cc0000" text-anchor="end" font-weight="normal" font-style="normal">сама себе несе</text>
<text x="480.0" y="436" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Додав батарею — додав і вагу, яку треба тримати в повітрі. За оптимумом приріст енергії вже не окупає зайвих грамів.</text>
