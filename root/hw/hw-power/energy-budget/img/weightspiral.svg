<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Більша батарея ≠ довший політ</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">зайва вага батареї сама потребує тяги — є оптимум, за яким час падає</text>
