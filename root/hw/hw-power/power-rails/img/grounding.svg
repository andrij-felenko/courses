<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="60.0" width="340.0" height="250.0" rx="6" fill="#fff7f7" stroke="#c0392b" stroke-width="1.6"/>
<text x="200.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Неправильно: спільна земля</text>
<circle cx="70.0" cy="150.0" r="5.0" fill="#1a1a1a" stroke="none" stroke-width="1.5"/>
<text x="70.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">− батареї</text>
<line x1="70.0" y1="150.0" x2="340.0" y2="150.0" stroke="#1a1a1a" stroke-width="4.0"/>
<text x="205.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">спільний провід землі (має опір)</text>
<rect x="120.0" y="185.0" width="80.0" height="38.0" rx="6" fill="#fde2e2" stroke="#c0392b" stroke-width="1.5"/><text x="160.0" y="207.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">мотор</tspan></text>
<line x1="160.0" y1="185.0" x2="160.0" y2="154.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="200.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">великий струм</text>
<rect x="250.0" y="185.0" width="80.0" height="38.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="290.0" y="207.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="290.0" dy="0.0">давач</tspan></text>
<line x1="290.0" y1="185.0" x2="290.0" y2="154.0" stroke="#2457d6" stroke-width="1.6"/>
<text x="200.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">струм × опір проводу = напруга,</text>
<text x="200.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">яку давач бачить як шум</text>
<rect x="390.0" y="60.0" width="340.0" height="250.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.6"/>
<text x="560.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Правильно: зіркова земля</text>
<circle cx="560.0" cy="235.0" r="6.0" fill="#1a1a1a" stroke="none" stroke-width="1.5"/>
<text x="560.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">одна спільна точка («зірка»)</text>
<rect x="430.0" y="130.0" width="80.0" height="38.0" rx="6" fill="#fde2e2" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="152.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">мотор</tspan></text>
<line x1="470.0" y1="168.0" x2="554.0" y2="231.0" stroke="#c0392b" stroke-width="3.0"/>
<rect x="610.0" y="130.0" width="80.0" height="38.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="650.0" y="152.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">давач</tspan></text>
<line x1="650.0" y1="168.0" x2="566.0" y2="231.0" stroke="#2457d6" stroke-width="1.6"/>
<text x="560.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">струм мотора не тече</text>
<text x="560.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">через землю давача</text>
</svg>