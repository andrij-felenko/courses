<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Заряд vs здоров'я: рівень у баку і розмір бака</text>
<text x="210.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">НОВА</text>
<rect x="150.0" y="96.0" width="120.0" height="250.0" rx="6" fill="#dbe6fb" stroke="none" stroke-width="0.0"/>
