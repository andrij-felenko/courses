<text x="210.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">заряд</text>
<text x="210.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">100%</text>
<text x="210.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">SoH = 100%</text>
<text x="210.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">повна → SoC 100%</text>
<line x1="124.0" y1="104.0" x2="124.0" y2="338.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="124.0" y1="338.0" x2="124.0" y2="104.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="116.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">рівень (SoC)</text>
<g transform="rotate(-90 116.0 221.0)"></g>
<text x="620.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">СТАРА (2 роки)</text>
<rect x="560.0" y="96.0" width="120.0" height="250.0" rx="6" fill="none" stroke="#6b7280" stroke-width="1.4"/>
<rect x="560.0" y="96.0" width="120.0" height="50.0" rx="6" fill="#efe1de" stroke="none" stroke-width="0.0"/>
<text x="620.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">втрачено</text>
<text x="620.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">з віком −20%</text>
<rect x="560.0" y="146.0" width="120.0" height="200.0" rx="6" fill="#dbe6fb" stroke="none" stroke-width="0.0"/>
<rect x="560.0" y="146.0" width="120.0" height="200.0" rx="6" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="620.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">заряд</text>
<text x="620.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">= 100% SoC</text>
<line x1="554.0" y1="146.0" x2="686.0" y2="146.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="620.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">SoH = 80%</text>
<text x="620.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">теж «повна», та це 80% колишнього</text>
<line x1="710.0" y1="102.0" x2="710.0" y2="140.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="720.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">SoH</text>
<text x="720.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">(тане)</text>
<text x="415.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="30" fill="#6b7280" text-anchor="middle" font-weight="700">≠</text>
<text x="415.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">різні</text>
<text x="415.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">речі</text>
<rect x="113.7" y="429.9" width="612.5" height="44.1" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="448.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">SoC — рівень заряду в баку: ходить угору-вниз щодня.  SoH — розмір самого бака: лише тане з роками.</tspan><tspan x="420.0" dy="13.7">«повна» стара комірка (SoC 100%) вміщає менше за нову — її 100% дорівнює 80% колишнього.</tspan></text>
</svg>