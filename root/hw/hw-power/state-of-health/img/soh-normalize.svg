<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як звести два SoH в одне число</text>
<text x="240.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">сирі числа: різні шкали</text>
<text x="90.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">ємність  C/C₀</text>
<line x1="90.0" y1="140.0" x2="400.0" y2="140.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="90.0" y1="135.0" x2="90.0" y2="145.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="400.0" y1="135.0" x2="400.0" y2="145.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="90.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">1.00 (нова)</text>
<text x="400.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">0.80 = поріг</text>
<circle cx="322.5" cy="140.0" r="5.0" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
<text x="322.5" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">виміряно 0.85</text>
<text x="90.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">опір  R/R₀</text>
<line x1="90.0" y1="225.0" x2="400.0" y2="225.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="90.0" y1="220.0" x2="90.0" y2="230.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="400.0" y1="220.0" x2="400.0" y2="230.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="90.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">1.00 (новий)</text>
<text x="400.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">2.00 = поріг</text>
<circle cx="400.0" cy="225.0" r="5.0" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<text x="400.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">виміряно 2.00</text>
<rect x="112.3" y="281.1" width="265.4" height="57.8" rx="6" fill="#f3eef6" stroke="#6b7280" stroke-width="1.5"/><text x="245.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">0.85 і 2.00 — числа з РІЗНИХ шкал:</tspan><tspan x="245.0" dy="13.7">у першої поріг на 0.80, у другої на 2.00.</tspan><tspan x="245.0" dy="13.7">їхнє середнє не означає нічого.</tspan></text>
<text x="460.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">нормування</text>
<line x1="428.0" y1="190.0" x2="492.0" y2="190.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="690.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">спільна вісь ресурсу</text>
<text x="540.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">залишок ресурсу</text>
<line x1="540.0" y1="180.0" x2="850.0" y2="180.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="540.0" y1="175.0" x2="540.0" y2="185.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="850.0" y1="175.0" x2="850.0" y2="185.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="540.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">100% (нова)</text>
<text x="850.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">0% = кінець життя</text>
<line x1="772.5" y1="156.0" x2="772.5" y2="174.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="3,3"/>
<circle cx="772.5" cy="180.0" r="5.0" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
<text x="772.5" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">за ємністю: 25%</text>
<line x1="850.0" y1="130.0" x2="850.0" y2="174.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<circle cx="850.0" cy="180.0" r="5.0" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<text x="850.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">за опором: 0%</text>
<rect x="592.2" y="277.4" width="195.6" height="45.3" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">SoH = min(25%, 0%) = 0%</tspan><tspan x="690.0" dy="14.3">ланцюг рветься там, де тонше</tspan></text>
<rect x="126.8" y="429.9" width="666.4" height="44.1" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="460.0" y="448.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">поки числа сирі, вони на різних шкалах; афінне нормування «нова = 100%, поріг = 0%» зводить їх на одну вісь.</tspan><tspan x="460.0" dy="13.7">далі беруть не середнє, а МІНІМУМ: пристрій відмовляє за тією віссю, що першою впала до нуля.</tspan></text>
</svg>