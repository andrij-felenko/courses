<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пасивація Li-SOCl₂ та розв'язання через гібридний конденсатор</text>
<rect x="40.0" y="50.0" width="350.0" height="300.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="55.0" y="60.0" width="320.0" height="32.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="215.0" y="80.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Пасивація літієвого анода плівкою LiCl</tspan></text>
<rect x="65.0" y="105.0" width="110.0" height="90.0" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<text x="120.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Металевий</tspan><tspan x="120.0" dy="15.6">анод Li</tspan></text>
<rect x="175.0" y="105.0" width="30.0" height="90.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<text x="190.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">LiCl</tspan><tspan x="190.0" dy="13.0">плівка</tspan></text>
<rect x="205.0" y="105.0" width="165.0" height="90.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="287.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="287.0" dy="0.0">Рідкий катод/електроліт</tspan><tspan x="287.0" dy="14.3">SOCl₂ + вуглецевий картон</tspan></text>
<rect x="55.0" y="210.0" width="320.0" height="125.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="215.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">• Плівка LiCl захищає від саморозряду (&lt;1%/рік)</tspan><tspan x="215.0" dy="14.3">• При зберіганні кристали LiCl товщають</tspan><tspan x="215.0" dy="14.3">• Різкий імпульс струму → просідання до TMV</tspan><tspan x="215.0" dy="14.3">• TMV (Transient Min Voltage) &lt; 2.2 В → ресет MCU</tspan></text>
<rect x="430.0" y="50.0" width="350.0" height="300.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<rect x="445.0" y="60.0" width="320.0" height="32.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="605.0" y="79.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="605.0" dy="0.0">Гібрид: Li-SOCl₂ бобіна + HLC конденсатор</tspan></text>
<rect x="455.0" y="105.0" width="130.0" height="75.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="513.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700"><tspan x="513.0" dy="0.0">Li-SOCl₂ бобіна</tspan><tspan x="513.0" dy="14.3">3.6 В (велика ємність,</tspan><tspan x="513.0" dy="14.3">слабкий струм)</tspan></text>
<rect x="635.0" y="105.0" width="130.0" height="75.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="700.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">HLC / суперкап</tspan><tspan x="700.0" dy="14.3">(низький ESR &lt;0.5 Ом,</tspan><tspan x="700.0" dy="14.3">імпульси 1–2 А)</tspan></text>
<line x1="520.0" y1="105.0" x2="520.0" y2="95.0" stroke="#333333" stroke-width="1.5"/>
<line x1="700.0" y1="105.0" x2="700.0" y2="95.0" stroke="#333333" stroke-width="1.5"/>
<line x1="520.0" y1="95.0" x2="700.0" y2="95.0" stroke="#333333" stroke-width="1.5"/>
<line x1="520.0" y1="180.0" x2="520.0" y2="190.0" stroke="#333333" stroke-width="1.5"/>
<line x1="700.0" y1="180.0" x2="700.0" y2="190.0" stroke="#333333" stroke-width="1.5"/>
<line x1="520.0" y1="190.0" x2="700.0" y2="190.0" stroke="#333333" stroke-width="1.5"/>
<line x1="585.0" y1="142.0" x2="630.0" y2="142.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="608.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">I_підзаряд</text>
<rect x="445.0" y="210.0" width="320.0" height="125.0" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/><text x="605.0" y="258.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">1. У сні Li-SOCl₂ повільно підзаряджає HLC мікроамперами</tspan><tspan x="605.0" dy="11.7">2. Під час передачі (LoRa/NB-IoT) HLC віддає 100–500 мА</tspan><tspan x="605.0" dy="11.7">3. Напруга живлення лишається &gt; 3.3 В (без збоїв MCU)</tspan><tspan x="605.0" dy="11.7">4. Бобіна не перевантажується і працює 15–20 років</tspan></text>
</svg>