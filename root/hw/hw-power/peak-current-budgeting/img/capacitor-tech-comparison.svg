<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння класів буферних конденсаторів для компенсації пікових струмів</text>
<rect x="40.0" y="60.0" width="235.0" height="370.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="50.0" y="70.0" width="215.0" height="42.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="157.5" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Кераміка MLCC</text>
<text x="157.5" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">(X5R, X7R)</text>
<text x="157.5" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="157.5" dy="0.0">Ємність: 1 – 100 мкФ</tspan><tspan x="157.5" dy="15.9">ESR: 2 – 20 мОм (наймалий)</tspan><tspan x="157.5" dy="15.9">Швидкодія: одиниці нс</tspan><tspan x="157.5" dy="15.9">Струм витоку: &lt; 0.1 мкА</tspan><tspan x="157.5" dy="15.9">Пастка: падіння ємності</tspan><tspan x="157.5" dy="15.9">під напругою (DC Bias) до −70%!</tspan><tspan x="157.5" dy="15.9">Застосування: розв язка РФ,</tspan><tspan x="157.5" dy="15.9">локальні швидкі фронти</tspan></text>
<rect x="300.0" y="60.0" width="235.0" height="370.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="310.0" y="70.0" width="215.0" height="42.0" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/>
<text x="417.5" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#854d0e" text-anchor="middle" font-weight="700">Тантал / Полімер</text>
<text x="417.5" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle">(POSCAP, KO-CAP)</text>
<text x="417.5" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="417.5" dy="0.0">Ємність: 47 – 1000 мкФ</tspan><tspan x="417.5" dy="15.9">ESR: 15 – 80 мОм (помірний)</tspan><tspan x="417.5" dy="15.9">Швидкодія: десятки нс</tspan><tspan x="417.5" dy="15.9">Струм витоку: 1 – 10 мкА</tspan><tspan x="417.5" dy="15.9">Перевага: стабільна ємність,</tspan><tspan x="417.5" dy="15.9">немає DC-bias ефекту</tspan><tspan x="417.5" dy="15.9">Пастка: чутливість до полярності</tspan><tspan x="417.5" dy="15.9">та імпульсного пускового струму</tspan></text>
<rect x="560.0" y="60.0" width="235.0" height="370.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="570.0" y="70.0" width="215.0" height="42.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="677.5" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Суперемності EDLC / HLC</text>
<text x="677.5" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">(Іоністори)</text>
<text x="677.5" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="677.5" dy="0.0">Ємність: 0.1 – 10 Фарад (гігантська)</tspan><tspan x="677.5" dy="15.9">ESR: 0.1 – 5 Ом (значний)</tspan><tspan x="677.5" dy="15.9">Швидкодія: частки мілісекунди</tspan><tspan x="677.5" dy="15.9">Струм витоку: 2 – 15 мкА (високий)</tspan><tspan x="677.5" dy="15.9">Перевага: тримає імпульси</tspan><tspan x="677.5" dy="15.9">тривалістю сотні мілісекунд</tspan><tspan x="677.5" dy="15.9">Пастка: вимагає схеми м якого</tspan><tspan x="677.5" dy="15.9">заряду та захисту від КЗ</tspan></text>
</svg>