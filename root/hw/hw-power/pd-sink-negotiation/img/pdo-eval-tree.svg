<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія та критерії алгоритму вибору профілю живлення</text>
<rect x="178.1" y="50.5" width="523.8" height="29.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="440.0" y="69.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Вхід: масив Source_Capabilities (1..7 об'єктів PDO від джерела)</tspan></text>
<line x1="440.0" y1="83.0" x2="440.0" y2="109.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="158.4" y="113.2" width="563.2" height="43.6" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="440.0" y="131.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Етап 1. Жорсткий фільтр безпеки: відкидання профілів</tspan><tspan x="440.0" dy="15.6">з напругою вище V_max (стеля схеми) або струмом нижче I_min (мінімум для старту)</tspan></text>
<line x1="220.0" y1="160.0" x2="180.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="440.0" y1="160.0" x2="440.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="660.0" y1="160.0" x2="700.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="191.4" width="220.0" height="127.1" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="180.0" y="208.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Стратегія A: Прямий заряд Li-ion</tspan><tspan x="180.0" dy="14.3">(режим PPS / AVS)</tspan><tspan x="180.0" dy="14.3"></tspan><tspan x="180.0" dy="14.3">• Вибір APDO (3.3–21 В)</tspan><tspan x="180.0" dy="14.3">• Крок напруги 20 мВ</tspan><tspan x="180.0" dy="14.3">• Крок струму 50 мА</tspan><tspan x="180.0" dy="14.3">• Тепло розсіюється в адаптері,</tspan><tspan x="180.0" dy="14.3">  а не в корпусі пристрою</tspan></text>
<rect x="325.4" y="191.4" width="229.2" height="127.1" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="208.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Стратегія B: Обхід DC-DC</tspan><tspan x="440.0" dy="14.3">(пряме живлення шини)</tspan><tspan x="440.0" dy="14.3"></tspan><tspan x="440.0" dy="14.3">• Пошук Fixed PDO з V == V_bus</tspan><tspan x="440.0" dy="14.3">  (наприклад, рівно 12 В або 19 В)</tspan><tspan x="440.0" dy="14.3">• Пряме живлення через ключ</tspan><tspan x="440.0" dy="14.3">• Економія ККД перетворювача</tspan><tspan x="440.0" dy="14.3">  (мінус 3–5 Вт втрат на платі)</tspan></text>
<rect x="572.9" y="198.6" width="254.3" height="112.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="700.0" y="215.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Стратегія C: Максимальна потужність</tspan><tspan x="700.0" dy="14.3">(швидкий заряд / важке навантаження)</tspan><tspan x="700.0" dy="14.3"></tspan><tspan x="700.0" dy="14.3">• Максимізація P = V · I</tspan><tspan x="700.0" dy="14.3">• Мінімізація I²·R втрат у кабелі:</tspan><tspan x="700.0" dy="14.3">  перевага 20 В @ 2.25 А</tspan><tspan x="700.0" dy="14.3">  над 15 В @ 3 А (менший нагрів дроту)</tspan></text>
<line x1="180.0" y1="325.0" x2="300.0" y2="370.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="440.0" y1="325.0" x2="440.0" y2="370.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="325.0" x2="580.0" y2="370.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="164.2" y="363.2" width="551.7" height="43.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="381.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Етап 2. Обчислення рангу профілю (Fitness Score) &amp; вибір найкращого PDO:</tspan><tspan x="440.0" dy="15.6">Score = w_v·Match(V) + w_p·Power(P) - w_loss·(I²·R_cable)</tspan></text>
<line x1="440.0" y1="405.0" x2="440.0" y2="445.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="119.5" y="443.2" width="641.0" height="43.6" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="461.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Вихід: формування 32-бітного пакета Request (RDO)</tspan><tspan x="440.0" dy="15.6">[Object Position | Operating Current | Max Current | Capability Mismatch | GiveBack]</tspan></text>
</svg>