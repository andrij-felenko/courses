<line x1="610.0" y1="206.0" x2="515.0" y2="150.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="380.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Було: порахувати стійкість готової схеми (аналіз).  Стало: піти від бажаного назад до деталей (синтез).</text>