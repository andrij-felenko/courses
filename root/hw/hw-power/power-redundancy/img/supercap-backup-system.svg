<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Резервне живлення на суперконденсаторах та протокол збереження Dying Gasp</text>
<text x="470.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура ДБЖ на суперконденсаторах (Dying Gasp Backup)</text>
<rect x="21.2" y="99.3" width="97.5" height="41.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="70.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="70.0" dy="0.0">Вхід DC</tspan><tspan x="70.0" dy="14.3">12 В (Мережа)</tspan></text>
<rect x="149.8" y="102.5" width="80.4" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Power Mux /</tspan><tspan x="190.0" dy="13.0">Active ORing</tspan></text>
<line x1="125.0" y1="120.0" x2="150.0" y2="120.0" stroke="#333333" stroke-width="2.0"/>
<line x1="230.0" y1="120.0" x2="360.0" y2="120.0" stroke="#c0392b" stroke-width="3.0"/>
<circle cx="300.0" cy="120.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="300.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Головна шина V_sys (12 В)</text>
<rect x="186.6" y="204.0" width="226.9" height="52.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="220.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Двонаправлений DC-DC</tspan><tspan x="300.0" dy="13.0">• Режим норми: Buck заряд до 5.4 В</tspan><tspan x="300.0" dy="13.0">• Режим аварії: Boost розряд до 1.8 В</tspan></text>
<line x1="285.0" y1="140.0" x2="285.0" y2="195.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="315.0" y1="195.0" x2="315.0" y2="140.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="265.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Заряд</text>
<text x="335.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Розряд</text>
<rect x="200.1" y="332.0" width="199.8" height="56.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="350.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Банк іоністорів (Supercaps)</tspan><tspan x="300.0" dy="13.0">2 × 50 Ф / 2.7 В (послідовно)</tspan><tspan x="300.0" dy="13.0">C_eq = 25 Ф, E = 360 Дж</tspan></text>
<line x1="300.0" y1="265.0" x2="300.0" y2="320.0" stroke="#333333" stroke-width="2.0"/>
<rect x="450.0" y="100.5" width="140.0" height="39.0" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/><text x="520.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Системний MCU</tspan><tspan x="520.0" dy="13.0">+ Пам'ять FRAM/Flash</tspan></text>
<line x1="360.0" y1="120.0" x2="450.0" y2="120.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="70.0" y1="155.0" x2="70.0" y2="200.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="70.0" y1="200.0" x2="450.0" y2="200.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3"/>
<line x1="450.0" y1="200.0" x2="480.0" y2="155.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="240.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Аварійний сигнал переривання (PFI / Dying Gasp NMI)</text>
<rect x="595.5" y="167.5" width="269.1" height="125.0" rx="6" fill="#fdf2e9" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Хронологія аварійного циклу (500 мс):</tspan><tspan x="730.0" dy="13.0"></tspan><tspan x="730.0" dy="13.0">1. t = 0 мс: Вхід DC зник, PFI переривання</tspan><tspan x="730.0" dy="13.0">2. t = 1 мс: Boost підхоплює шину 12 В</tspan><tspan x="730.0" dy="13.0">3. t = 5 мс: MCU зупиняє периферію</tspan><tspan x="730.0" dy="13.0">4. t = 50 мс: Скидання логів у FRAM / Flash</tspan><tspan x="730.0" dy="13.0">5. t = 80 мс: Паркування приводів / замків</tspan><tspan x="730.0" dy="13.0">6. t = 450 мс: Безпечний Sleep / Shutoff</tspan></text>
</svg>