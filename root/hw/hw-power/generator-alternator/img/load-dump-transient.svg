<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Імпульс скидання навантаження Load Dump та захист бортової мережі</text>
<rect x="30.0" y="45.0" width="450.0" height="365.0" rx="8" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/>
<text x="255.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Імпульс перенапруги Load Dump (ISO 16750-2)</text>
<line x1="70.0" y1="350.0" x2="450.0" y2="350.0" stroke="#333333" stroke-width="1.5"/>
<line x1="70.0" y1="350.0" x2="70.0" y2="100.0" stroke="#333333" stroke-width="1.5"/>
<text x="450.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Час t (мс)</text>
<text x="65.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">V_bat (В)</text>
<text x="65.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">14 В</text>
<line x1="67.0" y1="330.0" x2="73.0" y2="330.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="65.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">35 В</text>
<line x1="67.0" y1="270.0" x2="73.0" y2="270.0" stroke="#27ae60" stroke-width="1.5"/>
<text x="65.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">100 В</text>
<line x1="67.0" y1="130.0" x2="73.0" y2="130.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="70.0" y1="330.0" x2="130.0" y2="330.0" stroke="#27ae60" stroke-width="2.0"/>
<circle cx="130.0" cy="330.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="130.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Відрив АКБ при I=150 А!</text>
<path d="M 130 330 Q 140 130 170 130 T 320 220 T 440 330" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4 3"/>
<text x="210.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Незахищений сплеск (80..100 В)</text>
<text x="250.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Смертельно для всієї бортової електроніки!</text>
<path d="M 130 330 L 140 270 L 270 270 Q 350 280 440 330" fill="none" stroke="#27ae60" stroke-width="3.0"/>
<text x="240.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Обмеження лавинними діодами (V_clamp ≈ 32..35 В)</text>
<line x1="130.0" y1="380.0" x2="440.0" y2="380.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="130.0" y1="375.0" x2="130.0" y2="385.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="440.0" y1="375.0" x2="440.0" y2="385.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="285.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Тривалість імпульсу t_d = 100 .. 400 мс</text>
<rect x="500.0" y="45.0" width="310.0" height="365.0" rx="8" fill="#fdfefe" stroke="#c0392b" stroke-width="1.5"/>
<text x="655.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Фізика явища та захист</text>
<rect x="515.0" y="100.0" width="280.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="655.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1. Енергія в індуктивності ротора</text>
<text x="655.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">E_rot = (1/2) · L_field · I_field²</text>
<text x="655.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Струм I_field не може зникнути миттєво!</text>
<rect x="515.0" y="190.0" width="280.0" height="95.0" rx="6" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.2"/>
<text x="655.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Стала часу спаду поля</text>
<text x="655.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">τ = L_field / R_field ≈ 100..300 мс</text>
<text x="655.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Статор продовжує генерувати високу</text>
<text x="655.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ЕРС без буферної ємності АКБ.</text>
<rect x="515.0" y="295.0" width="280.0" height="100.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/>
<text x="655.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. Методи поглинання сплеску</text>
<text x="655.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Лавинні діоди випрямляча (Avalanche)</text>
<text x="655.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Центральний TVS-супресор на шині</text>
<text x="655.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">• Швидке розмагнічування ротора в AVR</text>
<rect x="89.1" y="436.5" width="661.8" height="27.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="420.0" y="453.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Load Dump виникає через затримку спаду магнітного потоку ротора і гаситься лавинними діодами випрямляча</tspan></text>
</svg>