<path d="M -70,240 A 160,160 0 0,1 250,240" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
<line x1="20.0" y1="240.0" x2="360.0" y2="240.0" stroke="#5d4037" stroke-width="2.5"/>
<circle cx="260.0" cy="130.0" r="14.0" fill="#ffedd5" stroke="#2c3e50" stroke-width="2.0"/>
<line x1="260.0" y1="144.0" x2="260.0" y2="200.0" stroke="#2c3e50" stroke-width="3.5"/>
<line x1="260.0" y1="200.0" x2="220.0" y2="240.0" stroke="#2c3e50" stroke-width="3.0"/>
<line x1="260.0" y1="200.0" x2="300.0" y2="240.0" stroke="#2c3e50" stroke-width="3.0"/>
<line x1="220.0" y1="255.0" x2="300.0" y2="255.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="260.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Великий крок s ⇒ Велика V_step!</text>
<rect x="30.0" y="285.0" width="330.0" height="100.0" rx="6" fill="#fff5f5" stroke="#feb2b2" stroke-width="1.4"/><text x="195.0" y="318.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="195.0" dy="0.0">Чому бігти або стрибати небезпечно:</tspan><tspan x="195.0" dy="13.7">• Широкий крок створює високу різницю V1 - V2.</tspan><tspan x="195.0" dy="13.7">• Судоми м'язів ніг викликають падіння на землю.</tspan><tspan x="195.0" dy="13.7">• При падінні виникне V_touch через серце і смерть!</tspan></text>
<text x="585.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">БЕЗПЕЧНО: «Гусячий крок» (Shuffling feet)</text>
<line x1="410.0" y1="240.0" x2="760.0" y2="240.0" stroke="#5d4037" stroke-width="2.5"/>
<circle cx="580.0" cy="130.0" r="14.0" fill="#ffedd5" stroke="#2c3e50" stroke-width="2.0"/>
<line x1="580.0" y1="144.0" x2="580.0" y2="200.0" stroke="#2c3e50" stroke-width="3.5"/>
<line x1="580.0" y1="200.0" x2="575.0" y2="240.0" stroke="#2c3e50" stroke-width="3.0"/>
<line x1="580.0" y1="200.0" x2="585.0" y2="240.0" stroke="#2c3e50" stroke-width="3.0"/>
<rect x="565.0" y="236.0" width="18.0" height="6.0" rx="2" fill="#27ae60" stroke="#fff" stroke-width="1.0"/>
<rect x="582.0" y="236.0" width="18.0" height="6.0" rx="2" fill="#27ae60" stroke="#fff" stroke-width="1.0"/>
<line x1="565.0" y1="255.0" x2="600.0" y2="255.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="582.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Крок s ≈ 0 ⇒ V_step ≈ 0 B!</text>
<rect x="420.0" y="285.0" width="330.0" height="100.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.4"/><text x="585.0" y="318.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="585.0" dy="0.0">Техніка безпечного виходу (R ≥ 8 м):</tspan><tspan x="585.0" dy="13.7">1. Стопи притиснуті одна до одної (носок до п'яти).</tspan><tspan x="585.0" dy="13.7">2. Пересувайтеся не відриваючи стоп від землі.</tspan><tspan x="585.0" dy="13.7">3. Рухайтеся повільно до виходу за радіус 8 метрів.</tspan></text>
</svg>