<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -10 860 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-80" y="-10" width="860" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правила безпечної евакуації із зони розтікання струму землі</text>
<line x1="390.0" y1="45.0" x2="390.0" y2="385.0" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5,5"/>
<text x="195.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">СМЕРТЕЛЬНО НЕБЕЗПЕЧНО: Звичайний крок / Біг</text>
<line x1="40.0" y1="65.0" x2="90.0" y2="240.0" stroke="#c0392b" stroke-width="3.0"/>
<circle cx="90.0" cy="240.0" r="6.0" fill="#c0392b" stroke="#900" stroke-width="1.5"/>
<text x="140.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Обрив 110 кВ</text>
<path d="M 50,240 A 40,40 0 0,1 130,240" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
