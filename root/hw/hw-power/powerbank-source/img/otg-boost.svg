<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Павербанк: підняти батарею до 5 В</text>
<rect x="70.0" y="116.0" width="150.0" height="92.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="145.0" y="151.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">батарея 1S</tspan><tspan x="145.0" dy="14.3">3.0–4.2 В</tspan><tspan x="145.0" dy="14.3">(нижче за 5 В)</tspan></text>
<line x1="220.0" y1="162.0" x2="296.0" y2="162.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="300.0" y="116.0" width="150.0" height="92.0" rx="6" fill="#fdf6e3" stroke="#c89a2b" stroke-width="2.0"/><text x="375.0" y="158.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a07d1f" text-anchor="middle" font-weight="700"><tspan x="375.0" dy="0.0">BOOST ↑</tspan><tspan x="375.0" dy="15.6">підвищувач</tspan></text>
<line x1="450.0" y1="162.0" x2="526.0" y2="162.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="530.0" y="116.0" width="130.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="595.0" y="157.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">VBUS</tspan><tspan x="595.0" dy="18.2">5 В</tspan></text>
<line x1="660.0" y1="162.0" x2="716.0" y2="162.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="720.0" y="116.0" width="110.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="775.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">чужий</tspan><tspan x="775.0" dy="13.7">пристрій</tspan><tspan x="775.0" dy="13.7">(заряджаємо)</tspan></text>
<text x="450.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Одна літієва комірка дає 3.0–4.2 В — менше за потрібні 5 В на VBUS.</text>
<text x="450.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Тому джерело з однокоміркової батареї обов'язково містить підвищувач до 5 В.</text>
<rect x="103.8" y="294.9" width="692.3" height="46.1" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="314.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Цей режим історично звали OTG (on-the-go) — коли пристрій із простого споживача</tspan><tspan x="450.0" dy="13.7">стає тим, хто сам живить периферію. Суть проста: щоб віддавати 5 В від однієї комірки, її напругу треба підняти.</tspan></text>
</svg>