<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Power path: живити систему й заряджати батарею окремо</text>
<rect x="45.0" y="56.0" width="840.0" height="112.0" rx="12" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="75.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Наївно: USB → заряд → батарея → система</text>
<rect x="85.0" y="98.0" width="92.0" height="44.0" rx="6" fill="#ffffff" stroke="#c89a2b" stroke-width="1.6"/><text x="131.0" y="123.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#a07d1f" text-anchor="middle" font-weight="700"><tspan x="131.0" dy="0.0">USB</tspan></text>
<line x1="177.0" y1="120.0" x2="223.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="225.0" y="98.0" width="112.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="281.0" y="123.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="281.0" dy="0.0">батарея</tspan></text>
<line x1="337.0" y1="120.0" x2="383.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="385.0" y="98.0" width="112.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="441.0" y="123.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="441.0" dy="0.0">система</tspan></text>
<text x="700.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">мертва батарея →</text>
<text x="700.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">система не стартує</text>
<rect x="45.0" y="188.0" width="840.0" height="196.0" rx="12" fill="#f1faf3" stroke="#27ae60" stroke-width="1.6"/>
<text x="75.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Power path: вузол годує систему напряму, а батарею заряджає окремо</text>
<rect x="85.0" y="244.0" width="92.0" height="50.0" rx="6" fill="#ffffff" stroke="#c89a2b" stroke-width="1.8"/><text x="131.0" y="272.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#a07d1f" text-anchor="middle" font-weight="700"><tspan x="131.0" dy="0.0">USB</tspan></text>
<line x1="177.0" y1="269.0" x2="243.0" y2="269.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="245.0" y="242.0" width="130.0" height="56.0" rx="6" fill="#fbfbf8" stroke="#1a1a1a" stroke-width="2.0"/><text x="310.0" y="266.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">вузол</tspan><tspan x="310.0" dy="13.7">power path</tspan></text>
<line x1="375.0" y1="256.0" x2="463.0" y2="236.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="465.0" y="212.0" width="130.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="530.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">система</tspan><tspan x="530.0" dy="13.0">працює одразу</tspan></text>
<line x1="375.0" y1="284.0" x2="463.0" y2="312.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="465.0" y="298.0" width="130.0" height="48.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="530.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">батарея</tspan><tspan x="530.0" dy="13.0">заряд залишком</tspan></text>
<text x="715.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">мертва / відсутня батарея —</text>
<text x="715.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">пристрій усе одно вмикається</text>
<text x="715.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(батарея = буфер, не єдиний шлях)</text>
</svg>