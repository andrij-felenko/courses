<rect x="42.2" y="306.2" width="635.6" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Напруга падає в багато разів — струм у стільки ж разів росте: кілька вольтів, сотні ампер.</tspan><tspan x="360.0" dy="15.6">Цей струм гріє стик деталей власним опором і сплавляє — без полум'я, без припою.</tspan></text>
