<text x="155.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Захисне заземлення PE</text>
<rect x="78.0" y="136.2" width="153.9" height="47.6" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="155.0" y="156.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#78350f" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Базова ізоляція</tspan><tspan x="155.0" dy="15.6">(Basic Insulation)</tspan></text>
<rect x="38.4" y="207.3" width="233.2" height="45.3" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="155.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#065f46" text-anchor="middle"><tspan x="155.0" dy="0.0">Захисне заземлення (PE)</tspan><tspan x="155.0" dy="14.3">З'єднує металевий корпус із землею</tspan></text>
<rect x="44.7" y="290.9" width="220.6" height="88.2" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="155.0" y="310.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Механізм захисту:</tspan><tspan x="155.0" dy="14.3">Пробій ізоляції → КЗ на корпус →</tspan><tspan x="155.0" dy="14.3">струм у PE → спрацьовує</tspan><tspan x="155.0" dy="14.3">автомат або ПЗВ (RCD).</tspan><tspan x="155.0" dy="14.3">3-контактна вилка із землею.</tspan></text>
<rect x="295.0" y="60.0" width="240.0" height="375.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="415.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e40af" text-anchor="middle" font-weight="700">Клас II (Class II)</text>
<text x="415.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Символ: подвійний квадрат ⧈</text>
<rect x="332.9" y="136.5" width="164.2" height="31.0" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/><text x="415.0" y="155.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle"><tspan x="415.0" dy="0.0">Базова ізоляція (Basic)</tspan></text>
<text x="415.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700">+</text>
<rect x="320.4" y="188.5" width="189.3" height="31.0" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/><text x="415.0" y="207.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle"><tspan x="415.0" dy="0.0">Додаткова ізоляція (Suppl.)</tspan></text>
<rect x="312.0" y="236.0" width="206.0" height="32.0" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/><text x="415.0" y="256.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700"><tspan x="415.0" dy="0.0">АБО Посилена (Reinforced)</tspan></text>
<rect x="304.7" y="300.9" width="220.6" height="88.2" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="415.0" y="320.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">Механізм захисту:</tspan><tspan x="415.0" dy="14.3">Два незалежні бар'єри захисту.</tspan><tspan x="415.0" dy="14.3">Один відмовляє — другий захищає.</tspan><tspan x="415.0" dy="14.3">Заземлення НЕ потрібне.</tspan><tspan x="415.0" dy="14.3">2-контактна вилка (Europlug).</tspan></text>
<rect x="555.0" y="60.0" width="240.0" height="375.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<text x="675.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#166534" text-anchor="middle" font-weight="700">Клас III (Class III)</text>
<text x="675.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Безпечна низька напруга</text>
<rect x="572.0" y="136.2" width="206.0" height="47.6" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="675.0" y="156.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#14532d" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">Живлення SELV / PELV</tspan><tspan x="675.0" dy="15.6">U ≤ 60 В DC / 25 В AC RMS</tspan></text>
<rect x="599.2" y="207.3" width="151.7" height="45.3" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="675.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle"><tspan x="675.0" dy="0.0">Жодних високих напруг</tspan><tspan x="675.0" dy="14.3">усередині приладу</tspan></text>
<rect x="567.8" y="290.9" width="214.4" height="88.2" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="675.0" y="310.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Механізм захисту:</tspan><tspan x="675.0" dy="14.3">Напруга фізично нездатна</tspan><tspan x="675.0" dy="14.3">пробити суху шкіру людини</tspan><tspan x="675.0" dy="14.3">та викликати небезпечний струм.</tspan><tspan x="675.0" dy="14.3">Живиться від зовнішнього БЖ.</tspan></text>
