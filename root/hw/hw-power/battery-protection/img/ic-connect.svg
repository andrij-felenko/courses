<rect x="200.0" y="300.0" width="400.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="400.0" y="316.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Навантаження вішай на P−, НЕ на B−!</tspan><tspan x="400.0" dy="11.7">B− — «сира» клема комірки до ключів; на аварії вона лишається</tspan><tspan x="400.0" dy="11.7">живою, а захист відрубає лише P−. Чіпляти пристрій на B− — обійти</tspan><tspan x="400.0" dy="11.7">захист: комірку вже не вбереже ні OCP, ні UVP.</tspan></text>
