<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Живлення бортового комп'ютера — це дві задачі, не одна</text>
<rect x="69.1" y="125.0" width="71.9" height="49.9" rx="6" fill="#eef0f4" stroke="#333333" stroke-width="1.5"/><text x="105.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">батарея</tspan><tspan x="105.0" dy="16.9">3S–6S</tspan></text>
<rect x="200.5" y="125.0" width="108.9" height="49.9" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="255.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">імпульсний</tspan><tspan x="255.0" dy="16.9">перетворювач</tspan></text>
<line x1="148.0" y1="150.0" x2="210.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="200.7" y="225.1" width="108.7" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="255.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">стійка шина</tspan><tspan x="255.0" dy="16.9">5.0 В</tspan></text>
<line x1="255.0" y1="178.0" x2="255.0" y2="224.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="200.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЗАВЕСТИ ВАТТИ</text>
<text x="200.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">з батареї — в чисту, тверду шину</text>
<rect x="343.7" y="225.1" width="92.5" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="390.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">бортовий</tspan><tspan x="390.0" dy="16.9">комп'ютер</tspan></text>
<line x1="300.0" y1="250.0" x2="348.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="590.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ВИВЕСТИ ВАТТИ</text>
<text x="590.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">марне тепло з кристала — в повітря</text>
<rect x="464.1" y="125.0" width="71.9" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">кристал</tspan><tspan x="500.0" dy="16.9">SoC</tspan></text>
<rect x="595.5" y="125.0" width="108.9" height="49.9" rx="6" fill="#eef0f4" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">радіатор</tspan><tspan x="650.0" dy="16.9">+ вентилятор</tspan></text>
<line x1="543.0" y1="150.0" x2="604.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="614.1" y="225.1" width="71.9" height="49.9" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">повітря</tspan><tspan x="650.0" dy="16.9">довкола</tspan></text>
<line x1="650.0" y1="178.0" x2="650.0" y2="224.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="432.0" y1="232.0" x2="476.0" y2="172.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="390.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Та сама енергія: скільки ватт увійшло — стільки тепла треба вивести.</text>
<text x="390.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Обидва горла вузькі, і кожне окремо здатне звалити плату.</text>
</svg>