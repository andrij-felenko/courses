<text x="750.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">До контуру навантажувальної прямої</text>
<rect x="50.0" y="360.0" width="740.0" height="90.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="382.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Ефект багатофазного сумування (Interleaving):</tspan><tspan x="420.0" dy="13.0">1. Миттєві струми N фаз мають фазовий зсув 360° / N.</tspan><tspan x="420.0" dy="13.0">2. Високочастотні трикутні пульсації струмів окремих котушок взаємно віднімаються у вузлі CS_SUM.</tspan><tspan x="420.0" dy="13.0">3. Результуючий сигнал сумарного струму I_total має амплітуду пульсацій у N разів меншу, а частоту — у N разів вищу,</tspan><tspan x="420.0" dy="13.0">забезпечуючи ідеальну чистоту сигналу регулювання без затримок додаткової фільтрації!</tspan></text>
