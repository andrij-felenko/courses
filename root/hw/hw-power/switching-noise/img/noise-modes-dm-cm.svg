<rect x="430.0" y="292.0" width="355.0" height="100.0" rx="6" fill="#ffffff" stroke="#c026d3" stroke-width="1.0"/><text x="607.5" y="310.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="607.5" dy="0.0">Шлях: струм тече В ОДИН БІК обома проводами,</tspan><tspan x="607.5" dy="14.3">а повертається крізь паразитну ємність C_par</tspan><tspan x="607.5" dy="14.3">та спільну землю / металеве шасі приладу.</tspan><tspan x="607.5" dy="14.3">Причина: різке dv/dt вузла SW до радіатора.</tspan><tspan x="607.5" dy="14.3">Придушення: синфазний дросель (CM Choke),</tspan><tspan x="607.5" dy="14.3">Y-конденсатори, екранування вузла SW.</tspan></text>
