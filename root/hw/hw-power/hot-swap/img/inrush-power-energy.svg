<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потужність на ключі: чесний фронт проти аварії</text>
<line x1="70.0" y1="165.0" x2="950.0" y2="165.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="950.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">P₀ = Vin · Iмежа — той самий пік в обох випадках</text>
<text x="240.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">чесний фронт: банк заряджається</text>
<text x="730.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">аварія: вихід закорочено</text>
<line x1="95.0" y1="430.0" x2="470.0" y2="430.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="95.0" y1="430.0" x2="95.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="95.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">потужність на ключі</text>
<text x="470.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">час</text>
<polygon points="95.0,165.0 320.0,430.0 95.0,430.0" fill="#27ae60" fill-opacity="0.13" stroke="#27ae60" stroke-width="2.6"/>
<line x1="320.0" y1="430.0" x2="320.0" y2="438.0" stroke="#27ae60" stroke-width="1.8"/>
<text x="320.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">tрамп</text>
<text x="178.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="178.0" dy="0.0">Eфронт = ½·P₀·tрамп</tspan><tspan x="178.0" dy="16.2">= ½·C·Vin²</tspan></text>
<text x="240.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Vds спадає, поки Vout росте →</text>
<text x="240.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">потужність тане до нуля.</text>
<text x="240.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Джоулі задані ЛИШЕ C і Vin.</text>
<line x1="585.0" y1="430.0" x2="950.0" y2="430.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="585.0" y1="430.0" x2="585.0" y2="130.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="950.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">час</text>
<polygon points="585.0,165.0 880.0,165.0 880.0,430.0 585.0,430.0" fill="#c0392b" fill-opacity="0.13" stroke="#c0392b" stroke-width="2.6"/>
<line x1="880.0" y1="430.0" x2="880.0" y2="438.0" stroke="#c0392b" stroke-width="1.8"/>
<text x="880.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">tтаймер</text>
<text x="732.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="732.0" dy="0.0">Eаварія = P₀ · tтаймер</tspan></text>
<text x="730.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Vout лишається 0 → Vds = Vin,</text>
<text x="730.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">струм тримається на межі.</text>
<text x="730.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Джоулі задає ТАЙМЕР, не C.</text>
</svg>