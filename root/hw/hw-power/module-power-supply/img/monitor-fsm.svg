<rect x="120.0" y="272.0" width="540.0" height="54.0" rx="6" fill="#f6f6f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="390.0" y="295.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Два різні пороги: V_SAG нижчий, V_OK вищий. Зазор між ними — гістерезис.</tspan><tspan x="390.0" dy="14.3">На самій межі стан не «торохтить» туди-сюди від кожного мілівольта шуму.</tspan></text>
