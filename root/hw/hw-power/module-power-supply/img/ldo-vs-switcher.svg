<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вхід 5 В → вихід 3.3 В, навантаження 0.5 А</text>
<rect x="30.0" y="55.0" width="340.0" height="315.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.6"/>
<text x="200.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">LDO (лінійний)</text>
<rect x="70.0" y="110.0" width="260.0" height="40.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="200.0" y="133.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">струм входу = струм виходу = 0.5 А</tspan></text>
<rect x="70.0" y="165.0" width="260.0" height="56.0" rx="6" fill="#fff5e6" stroke="#d98a00" stroke-width="1.5"/><text x="200.0" y="182.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">зайва напруга (5 − 3.3) = 1.7 В</tspan><tspan x="200.0" dy="14.3">падає на регуляторі як ТЕПЛО</tspan><tspan x="200.0" dy="14.3">0.5 А × 1.7 В = 0.85 Вт грійки</tspan></text>
<rect x="70.0" y="235.0" width="260.0" height="40.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="200.0" y="259.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">ККД ≈ 3.3 / 5 ≈ 66 %</tspan></text>
<rect x="70.0" y="290.0" width="260.0" height="56.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="200.0" y="314.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">+ тихо, дешево, чистий вихід</tspan><tspan x="200.0" dy="14.3">− гаряче при великому падінні</tspan></text>
<rect x="390.0" y="55.0" width="340.0" height="315.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="560.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Імпульсний (buck)</text>
<rect x="430.0" y="110.0" width="260.0" height="40.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="560.0" y="133.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">переливає струм: вихід &gt; вхід</tspan></text>
<rect x="430.0" y="165.0" width="260.0" height="56.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="182.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">потужність зберігається:</tspan><tspan x="560.0" dy="14.3">Iвх ≈ 3.3·0.5 / (5·0.9) ≈ 0.37 А</tspan><tspan x="560.0" dy="14.3">втрати лише ~0.18 Вт</tspan></text>
<rect x="430.0" y="235.0" width="260.0" height="40.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="560.0" y="259.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">ККД ≈ 90 % і вище</tspan></text>
<rect x="430.0" y="290.0" width="260.0" height="56.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="560.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">+ мало тепла навіть при великому падінні</tspan><tspan x="560.0" dy="13.0">− шум-пульсація, дорожче, котушка</tspan></text>
</svg>