<rect x="115.4" y="427.2" width="649.3" height="55.6" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="444.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Критерій Міддлбрука: для стійкості замкненого перетворювача вихідний імпеданс</tspan><tspan x="440.0" dy="14.3">вхідного фільтра повинен бути значно меншим за вхідний імпеданс: |Z_out,filter(s)| &lt;&lt; |Z_in,conv(s)|.</tspan><tspan x="440.0" dy="14.3">Паралельна RC-гілка (R_d, C_d ≈ 3..5·C_filt) зрізає резонансний пік добротності Q.</tspan></text>
