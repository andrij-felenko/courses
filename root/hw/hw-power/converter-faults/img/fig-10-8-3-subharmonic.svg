<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
<rect width="900" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Субгармоніка: при D&gt;0.5 імпульси чергуються широкий-вузький</text>
<text x="84.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">норма</text>
<line x1="100.0" y1="160.0" x2="420.0" y2="160.0" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round"/>
<polyline points="100.0,160.0 100.0,130.0 150.0,130.0 150.0,160.0 170.0,160.0" fill="none" stroke="#1f8a3b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="170.0,160.0 170.0,130.0 220.0,130.0 220.0,160.0 240.0,160.0" fill="none" stroke="#1f8a3b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="240.0,160.0 240.0,130.0 290.0,130.0 290.0,160.0 310.0,160.0" fill="none" stroke="#1f8a3b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="310.0,160.0 310.0,130.0 360.0,130.0 360.0,160.0 380.0,160.0" fill="none" stroke="#1f8a3b" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="210.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">усі імпульси однакові</text>
<text x="84.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">хвороба</text>
<line x1="100.0" y1="300.0" x2="420.0" y2="300.0" stroke="#8a8a8a" stroke-width="1.2" stroke-linecap="round"/>
<polyline points="100.0,300.0 100.0,270.0 162.0,270.0 162.0,300.0 178.0,300.0" fill="none" stroke="#c0271e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="178.0,300.0 178.0,270.0 208.0,270.0 208.0,300.0 256.0,300.0" fill="none" stroke="#c0271e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="256.0,300.0 256.0,270.0 318.0,270.0 318.0,300.0 334.0,300.0" fill="none" stroke="#c0271e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="334.0,300.0 334.0,270.0 364.0,270.0 364.0,300.0 412.0,300.0" fill="none" stroke="#c0271e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="210.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">широкий-вузький-широкий… (період подвоївся)</text>
<rect x="470.0" y="110.0" width="390.0" height="230.0" rx="10" fill="#f6f6f6" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="665.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому й як лікують</text>
<text x="490.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">У керуванні за струмом (§10.2.2) при</text>
<text x="490.0" y="179.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">шпаруватості D &gt; 0.5 контур може</text>
<text x="490.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">«роздвоїтися»: кожен другий імпульс</text>
<text x="490.0" y="213.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">інший. Це субгармонічна нестійкість.</text>
<text x="490.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="490.0" y="247.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Лік — нахилова компенсація: контролер</text>
<text x="490.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">додає штучний нахил, що вирівнює</text>
<text x="490.0" y="281.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">імпульси. Вона зашита всередині;</text>
<text x="490.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">якщо вже зривається — знизити D</text>
<text x="490.0" y="315.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">(інша топологія/витки) чи частоту.</text>
</svg>
