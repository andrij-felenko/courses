<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
<rect width="900" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Свист: PFM у звуковій смузі та спів кераміки</text>
<line x1="100.0" y1="230.0" x2="800.0" y2="230.0" stroke="#1b1b1b" stroke-width="1.6" marker-end="url(#aInk)"/>
<text x="802.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">частота</text>
<rect x="200" y="120" width="220" height="110" fill="#caa24a" fill-opacity="0.12"/>
<text x="310.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">чутно (20 Гц – 20 кГц)</text>
<text x="150.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">інфра</text>
<text x="310.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ЗВУК</text>
<text x="600.0" y="252.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">робоча fsw (500 кГц)</text>
<line x1="600.0" y1="230.0" x2="600.0" y2="130.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<text x="600.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">норма: вище звуку</text>
<line x1="310.0" y1="230.0" x2="310.0" y2="150.0" stroke="#c0271e" stroke-width="2" stroke-linecap="round"/>
<text x="310.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">PFM на легкому навант.</text>
<line x1="560.0" y1="170.0" x2="340.0" y2="170.0" stroke="#c0271e" stroke-width="1.8" marker-end="url(#aRed)"/>
<text x="450.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">частота падає в чутне</text>
<rect x="60.0" y="280.0" width="800.0" height="70.0" rx="10" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.5"/>
<text x="450.0" y="304.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Дві причини свисту: (1) PFM/пропуск імпульсів на легкому навантаженні знижує частоту в чутну смугу;</text>
<text x="450.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(2) кераміка п'єзоелектрична (§10.2.4) — пульсація змушує її вібрувати, і вона тоненько пищить.</text>
<text x="450.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Лік: режим forced-PWM (стала висока fsw), інші конденсатори, демпфер.</text>
</svg>
