<rect x="40.0" y="425.0" width="900.0" height="48.0" rx="6" fill="#eef8ef" stroke="#27ae60" stroke-width="1.5"/><text x="490.0" y="452.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">В обох фазах струм котушки L2 безперервно протікає у вихідний вузол. У Фазі 1 обидві індуктивності L1 і L2 бачать напругу +Vвх, а у Фазі 2 — напругу -Vвих. Ідентичність змінних напруг дозволяє об'єднати L1 та L2 на єдиному магнітному осерді.</tspan></text>
