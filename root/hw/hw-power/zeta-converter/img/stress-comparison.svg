<text x="840.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">V_Cc = Vвих</text>
<rect x="30.0" y="395.0" width="900.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="480.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Чому обирають Zeta замість SEPIC та Ćuk:</tspan><tspan x="480.0" dy="13.0">1. Порівняно з SEPIC: вихідний струм неперервний, що усуває імпульсний удар по вихідному конденсатору та дає у 10–25 разів менші пульсації напруги.</tspan><tspan x="480.0" dy="13.0">2. Порівняно з Ćuk: зберігається пряма (додатна) полярність вихідної напруги без потреби інвертувати шину.</tspan><tspan x="480.0" dy="13.0">3. Напруга на проміжному конденсаторі становить лише Vвих (у SEPIC — Vвх, у Ćuk — Vвх + Vвих), що критично вигідно при високих вхідних напругах.</tspan></text>
</svg>