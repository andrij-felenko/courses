<svg xmlns="http://www.w3.org/2000/svg" viewBox="-162.25 -10 1284.5 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-162.25" y="-10" width="1284.5" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Магнітне об'єднання L1 та L2 на спільному осерді (Ripple Steering)</text>
<rect x="60.0" y="80.0" width="340.0" height="270.0" rx="8" fill="#4a5568" stroke="#2d3748" stroke-width="2.0"/>
<rect x="140.0" y="125.0" width="180.0" height="180.0" rx="4" fill="#ffffff" stroke="#2d3748" stroke-width="2.0"/>
<rect x="325.0" y="209.0" width="70.0" height="12.0" rx="0" fill="#e2e8f0" stroke="#a0aec0" stroke-width="1.0"/>
<text x="360.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2d3748" text-anchor="middle" font-weight="700">зазор g</text>
<rect x="70.0" y="130.0" width="60.0" height="160.0" rx="6" fill="#b5763a" stroke="#8c4b1d" stroke-width="2.0"/>
<text x="100.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Обмотка L1</text>
<text x="100.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">N1 витків</text>
<circle cx="85.0" cy="145.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<rect x="330.0" y="130.0" width="60.0" height="60.0" rx="6" fill="#b5763a" stroke="#8c4b1d" stroke-width="2.0"/>
<text x="360.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">L2 (верх)</text>
<circle cx="345.0" cy="142.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<rect x="330.0" y="230.0" width="60.0" height="60.0" rx="6" fill="#b5763a" stroke="#8c4b1d" stroke-width="2.0"/>
<text x="360.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">L2 (низ)</text>
<text x="230.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4a5568" text-anchor="middle" font-weight="700">Магнітний потік Φ</text>
<text x="230.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Спільне осердя</text>
<rect x="430.0" y="60.0" width="500.0" height="310.0" rx="8" fill="#fbfcfd" stroke="#d8dde3" stroke-width="1.8"/>
<text x="680.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізика явища керування пульсаціями</text>
<text x="448.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Змінна напруга на обох обмотках строго однакова щомиті:</text>
<text x="448.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   v_L1(t) = v_L2(t) = +Vвх (у Фазі 1),  −Vвих (у Фазі 2).</text>
<text x="448.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"></text>
<text x="448.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Рівняння струмів через взаємоіндуктивність M = k·√(L1·L2):</text>
<text x="448.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   di_L2 / dt = (L1 · v_L2 − M · v_L1) / (L1·L2 − M²)</text>
<text x="448.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">              = v_ac · (L1 − M) / [L1·L2 · (1 − k²)]</text>
<text x="448.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"></text>
<text x="448.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">3. При виборі співвідношення витків n = N2/N1 = k:</text>
<text x="448.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">   Чисельник перетворюється на точний нуль: di_L2 / dt = 0!</text>
<text x="448.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"></text>
<text x="448.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">4. Результат: пульсація вихідного струму Δi_L2 спадає до 0,</text>
<text x="448.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   а вся змінна складова перенаправляється у вхідний дросель L1.</text>
<rect x="30.0" y="385.0" width="900.0" height="56.0" rx="6" fill="#eef8ef" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="416.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Об'єднання індуктивностей на єдиному осерді скорочує габарити друкованої плати вдвічі. Завдяки ефекту ripple steering вихідний струм стає абсолютно гладким постійним струмом, що робить перетворювач Zeta рекордсменом за чистотою вихідного живлення серед усіх комбінованих топологій.</tspan></text>
</svg>