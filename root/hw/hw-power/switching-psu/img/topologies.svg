<text x="785.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Діапазон потужності: &gt; 200 Вт – кіловати</text>
