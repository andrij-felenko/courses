<rect x="594.6" y="105.5" width="150.8" height="68.9" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="130.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">CR2032:</tspan><tspan x="670.0" dy="12.3">• Питома ємність ~700 Дж</tspan><tspan x="670.0" dy="12.3">• Саморозряд &lt;1% / рік</tspan><tspan x="670.0" dy="12.3">• Заборона підзарядки</tspan><tspan x="670.0" dy="12.3">• Строк служби 8..12 років</tspan></text>
