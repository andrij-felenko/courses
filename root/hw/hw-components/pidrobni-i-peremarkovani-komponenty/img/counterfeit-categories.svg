<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Базові категорії контрафактних напівпровідникових компонентів</text>
<rect x="20.0" y="55.0" width="175.0" height="240.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="107.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Чорне перемаркування</text>
<text x="107.5" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(Blacktopping)</text>
<line x1="32.0" y1="105.0" x2="183.0" y2="105.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="107.5" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Зішліфовування маркування,</text>
<text x="107.5" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">нанесення шару епоксидного лаку</text>
<text x="107.5" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">і підробного лазерного напису.</text>
<text x="107.5" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Дешевий чип видають за дорогий.</text>
<rect x="60.0" y="230.0" width="95.0" height="38.0" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<line x1="60.0" y1="242.0" x2="155.0" y2="242.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="3 2"/>
<text x="107.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Лак + лазер</text>
<rect x="210.0" y="55.0" width="175.0" height="240.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="297.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">Кремнієва відбраковка</text>
<text x="297.5" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(B-Grade / Scrap)</text>
<line x1="222.0" y1="105.0" x2="373.0" y2="105.0" stroke="#d97706" stroke-width="1.0"/>
<text x="297.5" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Кристали, що провалили тести</text>
<text x="297.5" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">на заводі (витоки, шуми, збій PLL),</text>
<text x="297.5" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">викрадені з утилізації та</text>
<text x="297.5" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">запаковані в корпуси без тесту.</text>
<rect x="255.0" y="230.0" width="85.0" height="38.0" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
<circle cx="297.0" cy="249.0" r="9.0" fill="#fdecea" stroke="#d97706" stroke-width="1.5"/>
<text x="297.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">✖</text>
<rect x="400.0" y="55.0" width="175.0" height="240.0" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/>
<text x="487.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Порожні макети</text>
<text x="487.5" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(Dummy Packages)</text>
<line x1="412.0" y1="105.0" x2="563.0" y2="105.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="487.5" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Пластиковий корпус з рамкою,</text>
<text x="487.5" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">але всередині немає кристала</text>
<text x="487.5" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">або з'єднувальних провідників.</text>
<text x="487.5" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Імітація ваги без функції.</text>
<rect x="445.0" y="230.0" width="85.0" height="38.0" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="487.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">ПОРОЖНЬО</text>
<rect x="590.0" y="55.0" width="175.0" height="240.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="677.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Урізані клони</text>
<text x="677.5" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(Degraded Clones)</text>
<line x1="602.0" y1="105.0" x2="753.0" y2="105.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="677.5" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Стороння топологія зі спрощеною</text>
<text x="677.5" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">схемотехнікою: тонший метал,</text>
<text x="677.5" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">гірший ESD-захист, термодрейф</text>
<text x="677.5" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">та невідповідність даташиту.</text>
<rect x="635.0" y="230.0" width="85.0" height="38.0" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="677.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Ersatz Die</text>
<rect x="38.0" y="331.2" width="704.0" height="47.6" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="351.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Контрафакт — це не лише підробка бренду, а насамперед невідповідність фізичної структури заявленим</tspan><tspan x="390.0" dy="15.6">характеристикам надійності, діапазону температур, стійкості до перенапруг та довговічності кристала.</tspan></text>
