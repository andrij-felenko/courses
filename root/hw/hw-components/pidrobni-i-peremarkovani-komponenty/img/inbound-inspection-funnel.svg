<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 422.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="422.7" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія системи вхідного контролю якості компонентів (IQC)</text>
<rect x="30.0" y="55.0" width="700.0" height="50.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="380.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Рівень 0: Валідація джерела</text>
<text x="380.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Перевірка ланцюжка постачання (AVL, CoC від франшизи, сертифікати AS6081)</text>
<line x1="380.0" y1="105.0" x2="380.0" y2="116.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="90.0" y="117.0" width="580.0" height="50.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.6"/>
<text x="380.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Рівень 1: Візуальний контроль (100% пакування, AQL)</text>
<text x="380.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Огляд упаковки MSL, DataMatrix, відсутність слідів окислення та blacktopping під оптикою</text>
<line x1="380.0" y1="167.0" x2="380.0" y2="178.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="150.0" y="179.0" width="460.0" height="50.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="380.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Рівень 2: Хімічний та V-I скринінг</text>
<text x="380.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Ацетоновий тест на стійкість маркування + вибіркове зняття V-I сигнатур захисних діодів</text>
<line x1="380.0" y1="229.0" x2="380.0" y2="240.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="210.0" y="241.0" width="340.0" height="50.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.6"/>
<text x="380.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Рівень 3: Рентгенографічний аналіз (X-Ray)</text>
<text x="380.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Перевірка геометрії кристала, відповідності підкладки та топології розварювання провідників</text>
<line x1="380.0" y1="291.0" x2="380.0" y2="302.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="260.0" y="303.0" width="240.0" height="50.0" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.6"/>
<text x="380.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9333ea" text-anchor="middle" font-weight="700">Рівень 4: Декапсуляція та кліматичні тести</text>
<text x="380.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Розчинення компаунда кислотою, верифікація маски кристала та стрес-тест у камері</text>
<rect x="62.8" y="357.4" width="634.5" height="45.3" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="376.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Кожен наступний рівень вимагає дорожчого обладнання, але відсікає глибші рівні підробок.</tspan><tspan x="380.0" dy="14.3">Для критичних виробництв комбінація рівнів 1–3 є обов'язковим бар'єром перед виходом на лінію SMT.</tspan></text>
</svg>