<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 777.62 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="777.62" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Профіль поля та лінійність товщини оксиду</text>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Енергетичний бар'єр перескоку і стала формування d = α_v · U</text>
<rect x="40.0" y="50.0" width="325.0" height="310.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="202.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зниження бар'єру активації полем</text>
<line x1="65.0" y1="290.0" x2="65.0" y2="100.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="60.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Енергія W</text>
<line x1="65.0" y1="290.0" x2="340.0" y2="290.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Координата x</text>
<path d="M 80 240 Q 110 150 140 240 Q 170 150 200 240 Q 230 150 260 240 Q 290 150 320 240" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="140.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">W₀ (без поля, ~1.5 еВ)</text>
<path d="M 80 180 Q 110 120 140 200 Q 170 150 200 230 Q 230 180 260 260 Q 290 210 320 290" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="260.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">W = W₀ − q·a·E/2</text>
<text x="260.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">(нахил полем E ≈ 10⁷ В/см)</text>
<circle cx="110.0" cy="195.0" r="4.0" fill="#c0392b" stroke="#333333" stroke-width="1.0"/>
<line x1="115.0" y1="190.0" x2="140.0" y2="200.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="125.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Іонний дрейф</text>
<text x="202.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Поле E деформує решітку й робить можливим</text>
<text x="202.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">перескок іонів за кімнатної температури</text>
<rect x="395.0" y="50.0" width="325.0" height="310.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="557.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Товщина оксиду від напруги формування</text>
<line x1="430.0" y1="290.0" x2="430.0" y2="100.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="425.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Товщина d (нм)</text>
<line x1="430.0" y1="290.0" x2="700.0" y2="290.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="700.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">Напруга U_form (В)</text>
<line x1="430.0" y1="290.0" x2="670.0" y2="120.0" stroke="#9b59b6" stroke-width="2.0"/>
<text x="675.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9b59b6" text-anchor="start" font-weight="700">Nb₂O₅ (~2.5 нм/В)</text>
<line x1="430.0" y1="290.0" x2="670.0" y2="160.0" stroke="#e67e22" stroke-width="2.0"/>
<text x="675.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#e67e22" text-anchor="start" font-weight="700">Ta₂O₅ (~1.9 нм/В)</text>
<line x1="430.0" y1="290.0" x2="670.0" y2="200.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="675.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">Al₂O₃ (~1.4 нм/В)</text>
<line x1="510.0" y1="288.0" x2="510.0" y2="292.0" stroke="#333333" stroke-width="1.0"/>
<text x="510.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">50 В</text>
<line x1="590.0" y1="288.0" x2="590.0" y2="292.0" stroke="#333333" stroke-width="1.0"/>
<text x="590.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">100 В</text>
<text x="557.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Рівновага наступає, коли E = U/d падає до E_crit</text>
<text x="557.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">і дрейф іонів практично припиняється</text>
<text x="380.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Анодна стала α_v = 1/E_crit визначає товщину діелектрика на кожен вольт робочої напруги</text>
</svg>