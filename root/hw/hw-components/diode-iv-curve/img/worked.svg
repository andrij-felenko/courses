<text x="330.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">I = 10 мА</text>
<text x="350.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">U_R = 5 − 0.7 = 4.3 В   →   I = 4.3 / 430 = 10 мА</text>
