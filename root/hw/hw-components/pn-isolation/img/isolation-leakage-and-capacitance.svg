<text x="202.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Зворотна напруга V_R = V_n - V_p &gt; 0</text>
