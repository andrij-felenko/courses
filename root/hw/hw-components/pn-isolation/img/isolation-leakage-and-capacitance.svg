<text x="202.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Струм витоку: I_s ~ 1-100 пА (подвоюється кожні 8-10 °C)</text>
