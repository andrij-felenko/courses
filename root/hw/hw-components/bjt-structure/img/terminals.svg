<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
<rect width="720" height="300" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="360.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Три області несиметричні — кожна під свою роль</text>
<rect x="120.0" y="110.0" width="110.0" height="90.0" rx="0" fill="#bcd0f0" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="175.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">емітер</text>
<text x="175.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">n⁺ (сильно)</text>
<rect x="230.0" y="110.0" width="22.0" height="90.0" rx="0" fill="#f6d4d4" stroke="#1b1b1b" stroke-width="1.8"/>
<rect x="252.0" y="110.0" width="200.0" height="90.0" rx="0" fill="#e3edfb" stroke="#1b1b1b" stroke-width="1.8"/>
<text x="352.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">колектор</text>
<text x="352.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">n (великий)</text>
<line x1="175.0" y1="92.0" x2="175.0" y2="108.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<text x="175.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">упорскує носії</text>
<line x1="241.0" y1="250.0" x2="241.0" y2="202.0" stroke="#c0271e" stroke-width="1.6" marker-end="url(#aRed)"/>
<text x="241.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">база: кермо (тонка!)</text>
<line x1="352.0" y1="92.0" x2="352.0" y2="108.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aGrey)"/>
<text x="352.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">збирає + відводить тепло</text>
<text x="360.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Емітер сильно легований, база тонка й слабка, колектор великий. Поміняти емітер із колектором не можна.</text>
</svg>
