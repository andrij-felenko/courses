<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що силовий GaN успадкував від синього світлодіода</text>
<text x="230.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">зроблено заради синього світла</text>
<text x="710.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e8a5a" text-anchor="middle" font-weight="700">що з цього дісталося силовому ключу</text>
<rect x="40.0" y="101.0" width="380.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#14306b" text-anchor="middle"><tspan x="230.0" dy="0.0">вирощувати GaN на чужій підкладці</tspan><tspan x="230.0" dy="16.9">(буферний шар, 1986)</tspan></text>
<rect x="520.0" y="101.0" width="380.0" height="58.0" rx="6" fill="#e6f4ec" stroke="#1e8a5a" stroke-width="1.5"/><text x="710.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f5a3a" text-anchor="middle"><tspan x="710.0" dy="0.0">GaN на звичайній кремнієвій пластині</tspan><tspan x="710.0" dy="16.9">— велика фабрика, мала ціна</tspan></text>
<line x1="428.0" y1="130.0" x2="510.0" y2="130.0" stroke="#1e8a5a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="40.0" y="177.0" width="380.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="202.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#14306b" text-anchor="middle"><tspan x="230.0" dy="0.0">цехи MOCVD під мільярди світлодіодів</tspan><tspan x="230.0" dy="16.9">(1990-ті — 2000-ні)</tspan></text>
<rect x="520.0" y="177.0" width="380.0" height="58.0" rx="6" fill="#e6f4ec" stroke="#1e8a5a" stroke-width="1.5"/><text x="710.0" y="202.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f5a3a" text-anchor="middle"><tspan x="710.0" dy="0.0">епітаксія, за яку є кому платити</tspan><tspan x="710.0" dy="16.9">ще до першого силового ключа</tspan></text>
<line x1="428.0" y1="206.0" x2="510.0" y2="206.0" stroke="#1e8a5a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="40.0" y="253.0" width="380.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="278.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#14306b" text-anchor="middle"><tspan x="230.0" dy="0.0">p-GaN, легований магнієм</tspan><tspan x="230.0" dy="16.9">(1989–1992)</tspan></text>
<rect x="520.0" y="253.0" width="380.0" height="58.0" rx="6" fill="#e6f4ec" stroke="#1e8a5a" stroke-width="1.5"/><text x="710.0" y="278.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f5a3a" text-anchor="middle"><tspan x="710.0" dy="0.0">затвор, що тримає ключ закритим</tspan><tspan x="710.0" dy="16.9">за нуля вольт</tspan></text>
<line x1="428.0" y1="282.0" x2="510.0" y2="282.0" stroke="#1e8a5a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="184.9" y="358.1" width="550.1" height="53.9" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="460.0" y="381.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">А канал світлодіод не дав: 2DEG на межі AlGaN/GaN — власна</tspan><tspan x="460.0" dy="16.9">знахідка транзисторної лінії, і для світла та сама поляризація шкодить.</tspan></text>
</svg>