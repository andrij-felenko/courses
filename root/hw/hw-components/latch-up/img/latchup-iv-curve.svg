<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<line x1="100.0" y1="400.0" x2="780.0" y2="400.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="760.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Напруга V (VDD − GND)</text>
<line x1="100.0" y1="400.0" x2="100.0" y2="50.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="95.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Струм I_DD</text>
<line x1="360.0" y1="400.0" x2="360.0" y2="70.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="360.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="700">V_nom (3.3 В)</text>
<line x1="100.0" y1="395.0" x2="560.0" y2="390.0" stroke="#16a34a" stroke-width="2.5"/>
<text x="240.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">Нормальний стан (I_витоку &lt; 1 мкА)</text>
<circle cx="560.0" cy="388.0" r="6.0" fill="#ea580c" stroke="#ffffff" stroke-width="1.5"/>
<line x1="560.0" y1="400.0" x2="560.0" y2="388.0" stroke="#ea580c" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="560.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ea580c" text-anchor="middle" font-weight="700">V_trig (поріг спрацьовування)</text>
<text x="590.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ea580c" text-anchor="middle" font-weight="700">I_trig</text>
<line x1="560.0" y1="388.0" x2="200.0" y2="260.0" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="410.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-style="italic">Зрив у защіпку (від'ємний опір dV/dI &lt; 0)</text>
<circle cx="200.0" cy="260.0" r="6.0" fill="#b91c1c" stroke="#ffffff" stroke-width="1.5"/>
<line x1="200.0" y1="400.0" x2="200.0" y2="260.0" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="200.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">V_hold (0.8–1.5 В)</text>
<line x1="100.0" y1="260.0" x2="200.0" y2="260.0" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="65.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">I_hold</text>
<line x1="200.0" y1="260.0" x2="250.0" y2="70.0" stroke="#b91c1c" stroke-width="3.0"/>
<text x="285.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">Замкнений тиристор (Latch-up)</text>
<text x="285.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle">Струм сотні мА – Ампери (R_on &lt; 2 Ом)</text>
<line x1="360.0" y1="400.0" x2="210.0" y2="80.0" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="5,3"/>
<text x="340.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">Навантажувальна пряма джерела</text>
<circle cx="234.0" cy="131.0" r="6.0" fill="#2563eb" stroke="#ffffff" stroke-width="1.5"/>
<text x="150.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">Стабільна точка защіпки</text>
<text x="150.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">(V_op ≈ 1.2 В, I_op &gt;&gt; I_hold)</text>
<rect x="401.5" y="125.0" width="317.0" height="69.9" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="560.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Оскільки V_nom &gt; V_hold, схема залишається</tspan><tspan x="560.0" dy="14.3">у замкненому аварійному стані нескінченно довго.</tspan><tspan x="560.0" dy="14.3">Єдиний спосіб виходу — повне зняття живлення</tspan><tspan x="560.0" dy="14.3">або зниження напруги нижче V_hold.</tspan></text>
</svg>