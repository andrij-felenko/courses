<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві дії над шаром: додати або прибрати</text>
<text x="220.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Травлення — прибрати зайве</text>
<rect x="70.0" y="100.0" width="300.0" height="22.0" rx="0" fill="#cdd9ec" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="70.0" y="78.0" width="300.0" height="22.0" rx="0" fill="#e0a020" stroke="#a06000" stroke-width="1.6"/>
<rect x="100.0" y="64.0" width="60.0" height="14.0" rx="0" fill="#f6d6a8" stroke="#b8863a" stroke-width="1.4"/>
<rect x="240.0" y="64.0" width="80.0" height="14.0" rx="0" fill="#f6d6a8" stroke="#b8863a" stroke-width="1.4"/>
<line x1="220.0" y1="132.0" x2="220.0" y2="156.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="190.0" width="300.0" height="22.0" rx="0" fill="#cdd9ec" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="100.0" y="168.0" width="60.0" height="22.0" rx="0" fill="#e0a020" stroke="#a06000" stroke-width="1.6"/>
<rect x="240.0" y="168.0" width="80.0" height="22.0" rx="0" fill="#e0a020" stroke="#a06000" stroke-width="1.6"/>
<text x="220.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">лишилося лише під маскою</text>
<text x="560.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Осадження / легування — додати шар</text>
<rect x="410.0" y="100.0" width="300.0" height="22.0" rx="0" fill="#cdd9ec" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="560.0" y1="132.0" x2="560.0" y2="156.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="410.0" y="190.0" width="300.0" height="22.0" rx="0" fill="#cdd9ec" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="410.0" y="168.0" width="300.0" height="22.0" rx="0" fill="#cfe0a8" stroke="#5a7a1a" stroke-width="1.6"/>
<text x="560.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">новий суцільний шар згори</text>
<text x="360.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Чергуючи «додати — накрити маскою — прибрати зайве» десятки разів, нарощують увесь чіп.</text>
</svg>