  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="360.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Реактивний опір конденсатора</text>
<text x="150.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="34" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Xc</text>
<text x="205.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="30" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">=</text>
<text x="300.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="30" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<line x1="250.0" y1="152.0" x2="470.0" y2="152.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<text x="300.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2 · π · f · C</text>
<line x1="390.0" y1="220.0" x2="390.0" y2="194.0" stroke="#c0271e" stroke-width="1.8" marker-end="url(#aRed)"/>
<text x="390.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">↑ частота → ↓ Xc</text>
<line x1="450.0" y1="220.0" x2="450.0" y2="194.0" stroke="#1f47b5" stroke-width="1.8" marker-end="url(#aBlue)"/>
<text x="470.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">↑ ємність → ↓ Xc</text>
<text x="300.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">2πf = ω</text>
<rect x="110.0" y="250.0" width="500.0" height="50.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="360.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">І частота, і ємність — у знаменнику: обидві зменшують реактивність.</text>
<text x="360.0" y="291.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Вимірюється в омах; на DC (f=0) Xc → ∞ (блокує).</text>
