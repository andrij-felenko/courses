<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одиниці Flash: від байта до блоку</text>
<text x="450.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">орієнтовні розміри для типового NOR-Flash; у NAND вони більші</text>
<rect x="270.0" y="96.0" width="360.0" height="54.0" rx="10" fill="#eef0f5" stroke="#6b7280" stroke-width="1.8"/>
<text x="450.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Байт / слово  ·  1–4 Б</text>
<text x="450.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">найдрібніше, чим оперуєш</text>
<rect x="205.0" y="164.0" width="490.0" height="54.0" rx="10" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/>
<text x="450.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Сторінка (page)  ·  ~256 Б</text>
<text x="450.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">найменша одиниця ЗАПИСУ</text>
<rect x="140.0" y="232.0" width="620.0" height="54.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="450.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Сектор (sector)  ·  ~4 КБ</text>
<text x="450.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">найменша одиниця СТИРАННЯ</text>
<rect x="75.0" y="300.0" width="750.0" height="54.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="450.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="700">Блок (block)  ·  ~64 КБ</text>
<text x="450.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">більший блок стирання</text>
<text x="450.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пишеш сторінками, стираєш секторами — і саме звідси всі примхи поводження з Flash.</text>
</svg>