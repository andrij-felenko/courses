<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хитрість зі стирання-в-один-бік: дописувати без стирання</text>
<text x="460.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">поки в сторінці лишаються одиниці, можна гасити нові біти — і це безкоштовно</text>
<rect x="70.0" y="100.0" width="780.0" height="140.0" rx="12" fill="#fbfdff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="90.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Стерта сторінка (усе 1) — пишемо записи один за одним, гасячи біти:</text>
<rect x="96.0" y="150.0" width="150.0" height="56.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="171.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">запис A</text>
<rect x="254.0" y="150.0" width="150.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="329.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">A — недійсний</text>
<rect x="412.0" y="150.0" width="150.0" height="56.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="487.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">запис B</text>
<rect x="570.0" y="150.0" width="150.0" height="56.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="645.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">запис C</text>
<rect x="728.0" y="150.0" width="160.0" height="56.0" rx="6" fill="#ffffff" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="808.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">вільно (усе 1)</text>
<text x="90.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">«недійсний» = погасили ще один біт-прапорець (1→0), стирати не довелося.</text>
<rect x="120.0" y="268.0" width="680.0" height="92.0" rx="6" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/><text x="460.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Звідси два прийоми, що ховаються в NVS і логах:</tspan><tspan x="460.0" dy="13.0">• новий запис — ДОПИСати в незаймане місце (а не переписувати старе);</tspan><tspan x="460.0" dy="13.0">• скасувати старий — погасити його прапорець; стерти лише коли сторінка повна.</tspan><tspan x="460.0" dy="13.0">Так стирання — рідкісне, а отже й знос менший.</tspan></text>
</svg>