<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Компенсація потоків у диференційному ладі проти підсумовування у синфазному</text>
<rect x="20.0" y="20.0" width="395.0" height="400.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<rect x="445.0" y="20.0" width="395.0" height="400.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="217.5" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Диференційний лад (DM)</text>
<text x="217.5" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Корисний струм петлі: I₁ = −I₂ = I_dm</text>
<circle cx="217.5" cy="175.0" r="70" fill="none" stroke="#374151" stroke-width="26"/>
<circle cx="217.5" cy="175.0" r="70" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,4"/>
<path d="M 110,135 L 170,135 A 55 55 0 0 1 265,135 L 325,135" fill="none" stroke="#b45309" stroke-width="3.5"/>
<text x="125.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">I_dm →</text>
<text x="305.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">→ I_dm</text>
<path d="M 325,215 L 265,215 A 55 55 0 0 1 170,215 L 110,215" fill="none" stroke="#d97706" stroke-width="3.5"/>
<text x="305.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">← I_dm</text>
<text x="125.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">I_dm ←</text>
<text x="217.5" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Φ₁ (за годинниковою)</text>
<text x="217.5" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Φ₂ (проти годинникової)</text>
<circle cx="217.5" cy="175.0" r="16" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="217.5" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Φ=0</text>
<rect x="35.0" y="280.0" width="365.0" height="125.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="217.5" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="217.5" dy="0.0">Магнітні потоки зустрічні: Φ_net = Φ₁ − Φ₂ = 0</tspan><tspan x="217.5" dy="15.5">• Осердя НЕ намагнічується (B ≈ 0)</tspan><tspan x="217.5" dy="15.5">• L_dm ≈ L_leak (мізерна індуктивність розсіювання)</tspan><tspan x="217.5" dy="15.5">• Корисний сигнал проходить майже без втрат</tspan><tspan x="217.5" dy="15.5">• Робочий струм НЕ насичує магнітопровід</tspan></text>
<text x="642.5" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Синфазний лад (CM)</text>
<text x="642.5" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Завада в один бік: I₁ = I₂ = I_cm / 2</text>
<circle cx="642.5" cy="175.0" r="70" fill="none" stroke="#374151" stroke-width="26"/>
<circle cx="642.5" cy="175.0" r="70" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="6,4"/>
<path d="M 535,135 L 595,135 A 55 55 0 0 1 690,135 L 750,135" fill="none" stroke="#b45309" stroke-width="3.5"/>
<text x="550.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">I_cm/2 →</text>
<text x="730.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">→ I_cm/2</text>
<path d="M 535,215 L 595,215 A 55 55 0 0 0 690,215 L 750,215" fill="none" stroke="#d97706" stroke-width="3.5"/>
<text x="550.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">I_cm/2 →</text>
<text x="730.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">→ I_cm/2</text>
<text x="642.5" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Φ₁ (за годинниковою)</text>
<text x="642.5" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Φ₂ (за годинниковою)</text>
<circle cx="642.5" cy="175.0" r="18" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="642.5" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Φ=2Φ₁</text>
<rect x="460.0" y="280.0" width="365.0" height="125.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="642.5" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="642.5" dy="0.0">Магнітні потоки сумуються: Φ_net = Φ₁ + Φ₂ = 2Φ</tspan><tspan x="642.5" dy="15.5">• Осердя відчуває повний сумарний потік</tspan><tspan x="642.5" dy="15.5">• L_cm = 2·(L + M) ≈ 4·L_витка (величезна індуктивність)</tspan><tspan x="642.5" dy="15.5">• Блокуючий опір Z_cm = 2πf L_cm душитиме шум</tspan><tspan x="642.5" dy="15.5">• Завада відбивається назад або розсіюється в тепло</tspan></text>
</svg>