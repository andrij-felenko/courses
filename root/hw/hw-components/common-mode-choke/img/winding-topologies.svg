<text x="642.5" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="642.5" dy="0.0">Властивості та компроміси:</tspan><tspan x="642.5" dy="15.2">• Висока діелектрична ізоляція (1.5 ... 4.0 кВ AC/DC)</tspan><tspan x="642.5" dy="15.2">• Дуже мала міжобмоткова ємність C_ww (&lt; 1 ... 3 пФ)</tspan><tspan x="642.5" dy="15.2">• Помітна L_leak (1 ... 3% L_cm) через рознесення витків</tspan><tspan x="642.5" dy="15.2">• L_leak працює як вбудований диференціальний фільтр</tspan><tspan x="642.5" dy="15.2">Застосування: мережеві фільтри живлення AC-DC (L-N 230 В)</tspan></text>
