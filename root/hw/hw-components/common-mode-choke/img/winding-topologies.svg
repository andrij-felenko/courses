<text x="217.5" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="217.5" dy="0.0">Властивості та компроміси:</tspan><tspan x="217.5" dy="15.2">• Магнітний зв'язок k ≈ 0.999 ... 0.9999 (майже ідеальний)</tspan><tspan x="217.5" dy="15.2">• Мінімальна L_leak (&lt; 0.5% L_cm) — не псує швидкі фронти</tspan><tspan x="217.5" dy="15.2">• Підвищена міжобмоткова ємність C_ww (20 ... 60 пФ)</tspan><tspan x="217.5" dy="15.2">• Обмежена ізоляція між проводами (≤ 500 ... 1000 В)</tspan><tspan x="217.5" dy="15.2">Застосування: USB 2.0/3.x, CAN FD, Ethernet, HDMI, LVDS</tspan></text>
