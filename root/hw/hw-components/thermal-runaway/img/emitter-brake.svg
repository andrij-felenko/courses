<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 745 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="745" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="372.5" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Резистор в емітері перетворює петлю розгону на гальмо</text>
<line x1="372.5" y1="60.0" x2="372.5" y2="290.0" stroke="#d0d0d0" stroke-width="1.5" stroke-dasharray="3,5"/>
<text x="180.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Без RE: ніщо не спиняє петлю</text>
<rect x="140.4" y="93.5" width="79.3" height="33.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/><text x="180.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Ic росте</tspan></text>
<rect x="110.7" y="155.1" width="138.6" height="49.9" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/><text x="180.0" y="176.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">VBE не міняється</tspan><tspan x="180.0" dy="16.9">→ Ic росте далі</tspan></text>
<line x1="180.0" y1="130.5" x2="180.0" y2="151.1" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="255.3" y1="180.0" x2="230.0" y2="130.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="180.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-style="italic">розгін</text>
<text x="552.5" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">З RE: струм сам себе тримає</text>
<rect x="498.0" y="79.0" width="108.9" height="49.9" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="552.5" y="100.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="552.5" dy="0.0">Ic спробував</tspan><tspan x="552.5" dy="16.9">підрости</tspan></text>
<rect x="479.5" y="151.1" width="146.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/><text x="552.5" y="172.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="552.5" dy="0.0">падіння на RE</tspan><tspan x="552.5" dy="16.9">росте → VBE падає</tspan></text>
<rect x="494.3" y="225.1" width="116.3" height="49.9" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/><text x="552.5" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="552.5" dy="0.0">Ic вертається</tspan><tspan x="552.5" dy="16.9">назад</tspan></text>
<line x1="552.5" y1="132.9" x2="552.5" y2="147.1" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="552.5" y1="204.9" x2="552.5" y2="221.1" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="616.7" y1="250.0" x2="637.0" y2="116.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="680.7" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">тягне
