<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="392" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід корпусів</text>
<text x="380.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Спосіб з'єднання кристала диктує форму ніжок</text>
<rect x="50.0" y="72.0" width="300.0" height="40.0" rx="10" fill="#fdf6e8" stroke="#c79a2e" stroke-width="2.2"/>
<text x="200.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6a10" text-anchor="middle" font-weight="700">Дротяне з'єднання (wire bonding)</text>
<text x="200.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">контакт на леду — по периметру</text>
<rect x="410.0" y="72.0" width="300.0" height="40.0" rx="10" fill="#eef2fb" stroke="#2457d6" stroke-width="2.2"/>
<text x="560.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Flip-chip (перевернутий кристал)</text>
<text x="560.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">контакт масивом — під низом</text>
