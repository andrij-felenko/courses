<text x="120.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">DIP</text>
<text x="210.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">наскрізь, крок 2.54 мм</text>
<line x1="200.0" y1="186.0" x2="312.0" y2="186.0" stroke="#27ae60" stroke-width="1.0"/>
<rect x="70.0" y="216.0" width="260.0" height="52.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/>
<text x="120.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">SOIC</text>
<text x="210.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">крила, крок 1.27 мм</text>
<line x1="200.0" y1="252.0" x2="312.0" y2="252.0" stroke="#27ae60" stroke-width="1.0"/>
<rect x="70.0" y="282.0" width="260.0" height="52.0" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<text x="120.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">QFN</text>
<text x="210.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">площадки, крок 0.4–0.5 мм</text>
<line x1="200.0" y1="318.0" x2="312.0" y2="318.0" stroke="#c0392b" stroke-width="1.0"/>
<rect x="430.0" y="216.0" width="260.0" height="52.0" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<text x="485.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">BGA</text>
<text x="580.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">решітка кульок, крок 0.5–1 мм</text>
<line x1="70.0" y1="350.0" x2="690.0" y2="350.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="120.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">простіше для рук</text>
<text x="640.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">лише піч</text>
<text x="380.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">що ширші й відкритіші виводи — то простіше посадити жалом</text>
