<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Навіщо кристалу корпус</text>
<rect x="40.0" y="76.0" width="210.0" height="132.0" rx="12" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.2"/>
<text x="145.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Захист</text>
<line x1="56.0" y1="118.0" x2="234.0" y2="118.0" stroke="#2457d6" stroke-width="1.2"/>
<text x="145.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">крихкий кремній —</tspan><tspan x="145.0" dy="15.6">у міцну оболонку</tspan><tspan x="145.0" dy="15.6">від вологи й ударів</tspan></text>
<rect x="255.0" y="76.0" width="210.0" height="132.0" rx="12" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.2"/>
<text x="360.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Масштаб виводів</text>
<line x1="271.0" y1="118.0" x2="449.0" y2="118.0" stroke="#27ae60" stroke-width="1.2"/>
<text x="360.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">мікронні площадки →</tspan><tspan x="360.0" dy="15.6">контакти, які</tspan><tspan x="360.0" dy="15.6">можна паяти</tspan></text>
<rect x="470.0" y="76.0" width="210.0" height="132.0" rx="12" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.2"/>
<text x="575.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Відведення тепла</text>
<line x1="486.0" y1="118.0" x2="664.0" y2="118.0" stroke="#c0392b" stroke-width="1.2"/>
<text x="575.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">тепло від кристала —</tspan><tspan x="575.0" dy="15.6">назовні, до плати</tspan><tspan x="575.0" dy="15.6">й радіатора</tspan></text>
<text x="360.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Без корпуса кристал не вживеш: він мікроскопічний, крихкий і гарячий. Корпус робить його придатним до плати —</text>
<text x="360.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">захищає, виводить контакти до паяльного масштабу й відводить тепло.</text>
</svg>