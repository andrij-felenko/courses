<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="870.0" height="490.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="450.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізми вирівнювання зносу: динамічний (Dynamic) та статичний (Static)</text>
<rect x="35.0" y="75.0" width="400.0" height="410.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="235.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Динамічне вирівнювання (Dynamic WL)</text>
<rect x="94.2" y="129.2" width="281.6" height="51.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="235.0" y="144.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Застосовується до гарячих даних (Hot Data)</tspan><tspan x="235.0" dy="14.3">що постійно змінюються хостом.</tspan><tspan x="235.0" dy="14.3">Ціль: обрати найменш зношений вільний блок.</tspan></text>
<rect x="55.0" y="215.0" width="360.0" height="110.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="235.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пул вільних блоків (Free Blocks Pool)</text>
<rect x="70.0" y="250.0" width="150.0" height="60.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="145.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Вільний Блок A</text>
<text x="145.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Знос: 120 P/E</text>
<rect x="245.0" y="250.0" width="150.0" height="60.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="320.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Вільний Блок B</text>
<text x="320.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Знос: 2850 P/E</text>
<rect x="73.4" y="355.1" width="323.2" height="69.9" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="235.0" y="372.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Рішення FTL:</tspan><tspan x="235.0" dy="14.3">Спрямувати нові гарячі записи в Блок A (120 P/E).</tspan><tspan x="235.0" dy="14.3">Блок B тимчасово захищено від навантаження.</tspan><tspan x="235.0" dy="14.3">Слабкість: не чіпає блоки з холодними даними!</tspan></text>
<rect x="465.0" y="75.0" width="400.0" height="410.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="665.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Статичне вирівнювання (Static WL)</text>
<rect x="486.6" y="129.2" width="356.8" height="51.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="665.0" y="144.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Застосовується до холодних даних (Cold Data)</tspan><tspan x="665.0" dy="14.3">(файли ОС, які лише читаються й не перезаписуються).</tspan><tspan x="665.0" dy="14.3">Ціль: визволити законсервований блок із низьким зносом.</tspan></text>
<rect x="485.0" y="215.0" width="360.0" height="110.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="665.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перерозподіл холодних і гарячих зон</text>
<rect x="500.0" y="250.0" width="150.0" height="60.0" rx="4" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/>
<text x="575.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Блок C (Холодний)</text>
<text x="575.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">Знос: 15 P/E (ОС)</text>
<rect x="675.0" y="250.0" width="150.0" height="60.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="750.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Блок D (Зношений)</text>
<text x="750.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Знос: 2900 P/E</text>
<rect x="479.7" y="355.1" width="370.6" height="69.9" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="665.0" y="372.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">Рокіровка FTL (Static Trigger):</tspan><tspan x="665.0" dy="14.3">1. Холодні дані переносяться з Блоку C в Блок D.</tspan><tspan x="665.0" dy="14.3">2. Блок C стирається й віддається під гарячі записи.</tspan><tspan x="665.0" dy="14.3">Результат: увесь масив NAND зношується рівномірно.</tspan></text>
</svg>