<rect x="15.0" y="15.0" width="890.0" height="510.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="460.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Посторінкове відображення FTL, Out-of-Place запис та збирання сміття (GC)</text>
