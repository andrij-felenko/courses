<rect x="66.0" y="120.2" width="198.0" height="39.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="165.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">Запит на запис хоста:</tspan><tspan x="165.0" dy="15.6">Write(LBA=2, Data=D2_new)</tspan></text>
