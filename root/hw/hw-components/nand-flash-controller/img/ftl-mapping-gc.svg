<line x1="45.0" y1="222.0" x2="285.0" y2="222.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="85.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">LBA 0  →  Блок 1, Стор 0</text>
<text x="85.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">LBA 1  →  Блок 1, Стор 1</text>
