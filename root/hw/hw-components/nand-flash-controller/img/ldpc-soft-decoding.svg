<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="890.0" height="510.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="460.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Декодування LDPC: тверде (Hard-Decision) проти м'якого (Soft-Decision)</text>
<rect x="35.0" y="65.0" width="850.0" height="205.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="180.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Тверде декодування (Hard-Decision)</text>
<text x="650.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Одне читання напруги V_ref0 → Фіксований біт {0 або 1}</text>
<line x1="70.0" y1="210.0" x2="830.0" y2="210.0" stroke="#64748b" stroke-width="1.5"/>
<text x="840.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">V_t</text>
<rect x="131.3" y="133.2" width="157.4" height="43.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="151.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Стан L1 (Логічна 1)</tspan><tspan x="210.0" dy="15.6">Розподіл напруги Vt</tspan></text>
<rect x="567.6" y="133.2" width="164.8" height="43.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="151.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Стан L2 (Логічний 0)</tspan><tspan x="650.0" dy="15.6">Розподіл напруги Vt</tspan></text>
<rect x="366.0" y="121.3" width="127.9" height="37.3" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="430.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Зона перекриття</tspan><tspan x="430.0" dy="14.3">(Помилки читання)</tspan></text>
<line x1="430.0" y1="175.0" x2="430.0" y2="210.0" stroke="#1e293b" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="430.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Опорна напруга V_ref0 (Hard threshold)</text>
<rect x="35.0" y="285.0" width="850.0" height="220.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="180.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">М'яке декодування (Soft-Decision)</text>
<text x="650.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Багатоточкове сканування V_ref(-2..+2) → Обчислення LLR (впевненості)</text>
<line x1="70.0" y1="440.0" x2="830.0" y2="440.0" stroke="#64748b" stroke-width="1.5"/>
<text x="840.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">V_t</text>
<line x1="330.0" y1="335.0" x2="330.0" y2="450.0" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="3,3"/>
<text x="330.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">V_ref-2</text>
<text x="330.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">+3 (Впевнено 1)</text>
<line x1="380.0" y1="335.0" x2="380.0" y2="450.0" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="3,3"/>
<text x="380.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="700">V_ref-1</text>
<text x="362.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#3b82f6" text-anchor="middle" font-weight="700">+1 (Слабко 1)</text>
<line x1="430.0" y1="335.0" x2="430.0" y2="450.0" stroke="#64748b" stroke-width="1.8" stroke-dasharray="3,3"/>
<text x="430.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-weight="700">V_ref0</text>
<text x="430.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle" font-weight="700">0 (Невпевнено)</text>
<line x1="480.0" y1="335.0" x2="480.0" y2="450.0" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="3,3"/>
<text x="480.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle" font-weight="700">V_ref+1</text>
<text x="480.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ef4444" text-anchor="middle" font-weight="700">-1 (Слабко 0)</text>
<line x1="530.0" y1="335.0" x2="530.0" y2="450.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="3,3"/>
<text x="530.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">V_ref+2</text>
<text x="530.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">-3 (Впевнено 0)</text>
<rect x="595.1" y="344.9" width="209.8" height="80.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="360.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Ітеративний алгоритм</tspan><tspan x="700.0" dy="14.3">Belief Propagation (Min-Sum):</tspan><tspan x="700.0" dy="14.3">Використовує вагу LLR для</tspan><tspan x="700.0" dy="14.3">виправлення лавинних помилок</tspan><tspan x="700.0" dy="14.3">навіть при сильному шумі</tspan></text>
<rect x="66.8" y="352.1" width="206.4" height="65.9" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="170.0" y="367.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Значення LLR:</tspan><tspan x="170.0" dy="14.3">LLR = ln( P(b=0|y) / P(b=1|y) )</tspan><tspan x="170.0" dy="14.3">Знак = біт (0 чи 1)</tspan><tspan x="170.0" dy="14.3">Модуль = ступінь впевненості</tspan></text>
</svg>