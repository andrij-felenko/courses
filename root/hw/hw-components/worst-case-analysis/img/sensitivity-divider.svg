<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Аналіз чутливості (Sensitivity) резистивного дільника</text>
<text x="420.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Як парціальні похідні визначають напрямок найгіршого дрейфу вихідної напруги</text>
<rect x="40.0" y="68.0" width="320.0" height="290.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="200.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема електрична принципова</text>
<line x1="200.0" y1="115.0" x2="200.0" y2="140.0" stroke="#333333" stroke-width="1.8"/>
<circle cx="200.0" cy="115.0" r="3.5" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<text x="200.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Vin (номінал 5.0 В)</text>
<rect x="182.0" y="140.0" width="36.0" height="48.0" rx="2" fill="#f8fafc" stroke="#333333" stroke-width="1.8"/>
<text x="200.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">R1</text>
<line x1="200.0" y1="188.0" x2="200.0" y2="232.0" stroke="#333333" stroke-width="1.8"/>
<circle cx="200.0" cy="210.0" r="4.5" fill="#2457d6" stroke="#333333" stroke-width="1.5"/>
<line x1="200.0" y1="210.0" x2="290.0" y2="210.0" stroke="#2457d6" stroke-width="1.8"/>
<circle cx="290.0" cy="210.0" r="3.5" fill="#2457d6" stroke="#333333" stroke-width="1.5"/>
<text x="300.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Vout</text>
<rect x="182.0" y="232.0" width="36.0" height="48.0" rx="2" fill="#f8fafc" stroke="#333333" stroke-width="1.8"/>
<text x="200.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">R2</text>
<line x1="200.0" y1="280.0" x2="200.0" y2="310.0" stroke="#333333" stroke-width="1.8"/>
<line x1="185.0" y1="310.0" x2="215.0" y2="310.0" stroke="#333333" stroke-width="1.8"/>
<line x1="190.0" y1="316.0" x2="210.0" y2="316.0" stroke="#333333" stroke-width="1.8"/>
<line x1="195.0" y1="322.0" x2="205.0" y2="322.0" stroke="#333333" stroke-width="1.8"/>
<text x="200.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">GND (0 В)</text>
<rect x="380.0" y="68.0" width="420.0" height="290.0" rx="6" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="590.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Парціальні похідні та правила вибору меж</text>
<rect x="395.0" y="115.0" width="390.0" height="70.0" rx="4" fill="#fef2f2" stroke="#c0392b" stroke-width="1.0"/>
<text x="410.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Верхнє плече (R1): Від'ємна чутливість S(R1) &lt; 0</text>
<text x="410.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">∂Vout / ∂R1 = −Vin · R2 / (R1 + R2)² &lt; 0</text>
<text x="410.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Збільшення R1 ЗМЕНШУЄ Vout  →  для Vout_min беремо R1_max</text>
<rect x="395.0" y="195.0" width="390.0" height="70.0" rx="4" fill="#eef2ff" stroke="#2457d6" stroke-width="1.0"/>
<text x="410.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Нижнє плече (R2): Додатна чутливість S(R2) &gt; 0</text>
<text x="410.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">∂Vout / ∂R2 = +Vin · R1 / (R1 + R2)² &gt; 0</text>
<text x="410.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Збільшення R2 ЗБІЛЬШУЄ Vout  →  для Vout_min беремо R2_min</text>
<rect x="395.0" y="275.0" width="390.0" height="68.0" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="1.0"/>
<text x="410.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#38bdf8" text-anchor="start" font-weight="700">Комбінація екстремумів для дільника:</text>
<text x="410.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="start">Vout_min  =  Vin_min · R2_min / (R1_max + R2_min)</text>
<text x="410.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="start">Vout_max  =  Vin_max · R2_max / (R1_min + R2_max)</text>
</svg>