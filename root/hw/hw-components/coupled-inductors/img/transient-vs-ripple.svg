<svg xmlns="http://www.w3.org/2000/svg" viewBox="-77.75 -10 1015.5 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-77.75" y="-10" width="1015.5" height="430" fill="#ffffff"/>
