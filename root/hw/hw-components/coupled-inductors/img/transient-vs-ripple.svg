<text x="700.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Пульсації: МАЛІ (L_eq,ss ≈ 0.8 мкГн)
Стрибок: ШВИДКИЙ (L_eq,tr = 0.06 мкГн)</text>
<rect x="35.0" y="335.0" width="790.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="430.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Зв'язаний дросель розриває суперечність: у стаціонарі діє як велика фільтрувальна індуктивність,
а під час різкого навантаження — як надмала котушка для миттєвого наростання струму.</text>
