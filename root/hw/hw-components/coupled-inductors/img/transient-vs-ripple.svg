Стрибок: ПОВІЛЬНИЙ (прогин Vout)</text>
<rect x="305.0" y="90.0" width="245.0" height="230.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="427.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Роздільні малі (L=0.2 мкГн)</text>
<line x1="325.0" y1="260.0" x2="530.0" y2="260.0" stroke="#9ca3af" stroke-width="1.0"/>
<line x1="325.0" y1="130.0" x2="325.0" y2="260.0" stroke="#9ca3af" stroke-width="1.0"/>
<path d="M 325,245 L 345,205 L 365,245 L 385,205 L 405,245 L 410,245 L 440,150 L 460,190 L 480,150 L 500,190 L 520,150" fill="none" stroke="#c0392b" stroke-width="2.5"/>
