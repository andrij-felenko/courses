Стрибок: ШВИДКИЙ (без прогину)</text>
<rect x="575.0" y="90.0" width="250.0" height="230.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/>
<text x="700.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. Зв'язані дроселі (|k|=0.7)</text>
<line x1="595.0" y1="260.0" x2="805.0" y2="260.0" stroke="#9ca3af" stroke-width="1.0"/>
<line x1="595.0" y1="130.0" x2="595.0" y2="260.0" stroke="#9ca3af" stroke-width="1.0"/>
