<rect x="15.0" y="15.0" width="830.0" height="390.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="430.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Динамічний компроміс: роздільні котушки проти зв'язаних дроселів</text>
<text x="430.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Як зустрічний зв'язок (Inverse Coupling) одночасно дає малі пульсації та миттєвий відгук на стрибок навантаження</text>
<rect x="35.0" y="90.0" width="245.0" height="230.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="157.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Роздільні великі (L=1.0 мкГн)</text>
<line x1="55.0" y1="260.0" x2="260.0" y2="260.0" stroke="#9ca3af" stroke-width="1.0"/>
<line x1="55.0" y1="130.0" x2="55.0" y2="260.0" stroke="#9ca3af" stroke-width="1.0"/>
<path d="M 55,230 L 75,220 L 95,230 L 115,220 L 135,230 L 140,230 L 220,150 L 240,160 L 260,150" fill="none" stroke="#b45309" stroke-width="2.5"/>
