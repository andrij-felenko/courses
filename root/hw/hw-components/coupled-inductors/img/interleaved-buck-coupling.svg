<text x="642.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Осердя розвантажене,
габарити менші на 40%</text>
<rect x="455.0" y="270.0" width="375.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="642.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="642.0" dy="0.0">✓ Постійні потоки від струмів навантаження гасяться</tspan><tspan x="642.0" dy="14.9">✓ Пульсації струму у фазах ЗМЕНШУЮТЬСЯ у 2..5 разів</tspan><tspan x="642.0" dy="14.9">✓ Ефективна індуктивність для пульсацій L_eq,ss &gt;&gt; L</tspan><tspan x="642.0" dy="14.9">✓ Динамічна індуктивність для стрибка струму мала:</tspan><tspan x="642.0" dy="14.9">    L_eq,tr = L · (1 − |k|)  →  блискавичний відгук</tspan><tspan x="642.0" dy="14.9">Стандарт де-факто для живлення CPU/GPU (VRM)!</tspan></text>
</svg>