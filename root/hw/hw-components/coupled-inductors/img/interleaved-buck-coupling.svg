<text x="217.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Згідний зв'язок (Direct Coupling, k &gt; 0)</text>
