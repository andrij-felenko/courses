<text x="612.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="612.0" dy="0.0">Зв'язок параметрів Т-моделі:</tspan><tspan x="612.0" dy="14.2">• Взаємна індуктивність: M = L_m</tspan><tspan x="612.0" dy="14.2">• Повна індуктивність 1: L₁ = L_lk1 + L_m</tspan><tspan x="612.0" dy="14.2">• Повна індуктивність 2: L₂ = L_lk2 + L_m</tspan><tspan x="612.0" dy="14.2">• Коефіцієнт зв'язку: k = L_m / √(L₁ · L₂)</tspan></text>
