<text x="217.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="217.0" dy="0.0">Магніторушійна сила: F = N · i</tspan><tspan x="217.0" dy="14.2">Магнітний потік: Φ = F / ℛ</tspan><tspan x="217.0" dy="14.2">• Повітряний зазор у центральному керні задає L_m</tspan><tspan x="217.0" dy="14.2">• Шунти витоку задають незалежний L_leak</tspan></text>
