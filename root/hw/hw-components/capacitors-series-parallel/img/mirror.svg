<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
<rect width="720" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="360.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Конденсатори додаються дзеркально до резисторів</text>
<text x="315.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ПОСЛІДОВНО</text>
<text x="545.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ПАРАЛЕЛЬНО</text>
<text x="186.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">РЕЗИСТОР</text>
<rect x="200.0" y="110.0" width="230.0" height="90.0" rx="0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<rect x="430.0" y="110.0" width="230.0" height="90.0" rx="0" fill="#fbfbfb" stroke="#c9d3dc" stroke-width="1.2"/>
<text x="315.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">R = R₁ + R₂</text>
<text x="545.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1/R = 1/R₁ + 1/R₂</text>
<text x="186.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">КОНДЕНСАТОР</text>
<rect x="200.0" y="200.0" width="230.0" height="90.0" rx="0" fill="#fbfbfb" stroke="#c9d3dc" stroke-width="1.2"/>
<rect x="430.0" y="200.0" width="230.0" height="90.0" rx="0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="315.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1/C = 1/C₁ + 1/C₂</text>
<text x="545.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">C = C₁ + C₂</text>
<text x="360.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">зелене — «просто сума»: у резистора послідовно, у конденсатора паралельно</text>
</svg>
