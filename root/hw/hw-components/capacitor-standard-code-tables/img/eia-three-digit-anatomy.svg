<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія тризначного коду ємності EIA та літерного допуску IEC 60062</text>
<rect x="40.0" y="60.0" width="240.0" height="110.0" rx="8" fill="#f9fbfd" stroke="#333333" stroke-width="2.0"/>
<text x="160.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Керамічний / плівковий корпус</text>
<text x="160.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="36" fill="#1a1a1a" text-anchor="middle" font-weight="700">104K</text>
<rect x="282.3" y="58.2" width="255.4" height="43.6" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.5"/><text x="410.0" y="76.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">«10» — значущі цифри (мантиса)</tspan><tspan x="410.0" dy="15.6">Дві перші цифри утворюють число: 10</tspan></text>
<line x1="150.0" y1="105.0" x2="300.0" y2="80.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="272.0" y="120.4" width="275.9" height="59.2" rx="6" fill="#f4fbf4" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">«4» — показник степеня (множник 10⁴)</tspan><tspan x="410.0" dy="15.6">Кількість нулів: 10⁴ = 10 000</tspan><tspan x="410.0" dy="15.6">Базова одиниця — завжди пікофарад (пФ)</tspan></text>
<line x1="185.0" y1="125.0" x2="300.0" y2="150.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="554.1" y="85.4" width="241.7" height="59.2" rx="6" fill="#fff8ee" stroke="#d97706" stroke-width="1.5"/><text x="675.0" y="103.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">«K» — допуск номіналу (IEC 60062)</tspan><tspan x="675.0" dy="15.6">K = ±10% (стандарт X7R/X5R)</tspan><tspan x="675.0" dy="15.6">J = ±5%, M = ±20%, F = ±1%</tspan></text>
<line x1="215.0" y1="115.0" x2="560.0" y2="115.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="40.0" y1="215.0" x2="780.0" y2="215.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="40.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Спеціальні форми запису та розширення стандарту</text>
<rect x="40.0" y="260.0" width="235.0" height="195.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="157.5" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дробові номінали з «R»</text>
<text x="52.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="52.0" dy="0.0">«R» замінює десяткову крапку:</tspan><tspan x="52.0" dy="14.9">• 2R2 = 2.2 пФ</tspan><tspan x="52.0" dy="14.9">• R47 = 0.47 пФ</tspan><tspan x="52.0" dy="14.9">• 0R5 = 0.5 пФ</tspan><tspan x="52.0" dy="14.9">Використовується для C &lt; 10 пФ,</tspan><tspan x="52.0" dy="14.9">де третя цифра множника не потрібна.</tspan></text>
<rect x="292.0" y="260.0" width="235.0" height="195.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="409.5" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">4-значний прецизійний код</text>
<text x="304.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="304.0" dy="0.0">Три цифри мантиси + множник:</tspan><tspan x="304.0" dy="14.9">• 1002 = 100 · 10² пФ = 10 нФ</tspan><tspan x="304.0" dy="14.9">• 4751 = 475 · 10¹ пФ = 4.75 нФ</tspan><tspan x="304.0" dy="14.9">• 1000 = 100 · 10⁰ пФ = 100 пФ</tspan><tspan x="304.0" dy="14.9">Застосовується для рядів E96/E192</tspan><tspan x="304.0" dy="14.9">з допуском ±1% (F) або ±0.5% (D).</tspan></text>
<rect x="545.0" y="260.0" width="235.0" height="195.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="662.5" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Буквений префіксний код</text>
<text x="557.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="557.0" dy="0.0">Буква вказує базу і кому:</tspan><tspan x="557.0" dy="14.9">• 4n7 = 4.7 нФ (n = 10⁻⁹ Ф)</tspan><tspan x="557.0" dy="14.9">• 2u2 = 2.2 мкФ (u = 10⁻⁶ Ф)</tspan><tspan x="557.0" dy="14.9">• n47 = 0.47 нФ = 470 пФ</tspan><tspan x="557.0" dy="14.9">• 33p = 33 пФ (p = 10⁻¹² Ф)</tspan><tspan x="557.0" dy="14.9">Виключає стирання або пропуск</tspan><tspan x="557.0" dy="14.9">десяткової крапки при друку.</tspan></text>
</svg>