<circle cx="140.0" cy="230.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="140.0" y="233.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="190.0" cy="230.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="190.0" y="233.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="240.0" cy="230.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="240.0" y="233.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="290.0" cy="230.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="290.0" y="233.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="340.0" cy="230.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="340.0" y="233.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="380.0" cy="230.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="380.0" y="233.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="230.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Позитивний поляризаційний заряд +σ_pol = +q · 10¹³ см⁻²</text>
<rect x="60.0" y="255.0" width="340.0" height="25.0" rx="4" fill="#d0e1fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="110.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2DEG канал:</text>
<circle cx="180.0" cy="267.0" r="6.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="180.0" y="269.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<circle cx="220.0" cy="267.0" r="6.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="220.0" y="269.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<circle cx="260.0" cy="267.0" r="6.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="260.0" y="269.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<circle cx="300.0" cy="267.0" r="6.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="300.0" y="269.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<circle cx="340.0" cy="267.0" r="6.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="340.0" y="269.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<circle cx="375.0" cy="267.0" r="6.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="375.0" y="269.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<rect x="60.0" y="285.0" width="340.0" height="100.0" rx="4" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
<text x="130.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="700">Буфер GaN (недеформований)</text>
<line x1="260.0" y1="310.0" x2="260.0" y2="355.0" stroke="#c2185b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="285.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c2185b" text-anchor="start" font-weight="700">P_sp (GaN)</text>
<text x="230.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#689f38" text-anchor="middle">P_pe (GaN) = 0 (буфер без напружень)</text>
<rect x="450.0" y="75.0" width="390.0" height="310.0" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="645.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" font-weight="700">Електростатичний баланс поля</text>
<text x="470.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#263238" text-anchor="start"><tspan x="470.0" dy="0.0">1. Кристал вюрциту GaN/AlGaN позбавлений центра інверсії:</tspan><tspan x="470.0" dy="14.9">   вектор P_sp спрямований до підкладки [0001].</tspan><tspan x="470.0" dy="14.9">2. Розтяг AlGaN додає п'єзополяризацію P_pe в тому ж напрямку.</tspan><tspan x="470.0" dy="14.9">3. На межі розділу виникає розрив поляризації:</tspan><tspan x="470.0" dy="14.9">   σ_pol = (P_sp + P_pe)_AlGaN - (P_sp)_GaN &gt; 0.</tspan><tspan x="470.0" dy="14.9">4. Величезний заряд +σ_pol створює сильне електричне поле,</tspan><tspan x="470.0" dy="14.9">   яке опускає зону провідності GaN нижче рівня Фермі E_F.</tspan><tspan x="470.0" dy="14.9">5. Електрони з поверхні притягуються полем до межі:</tspan><tspan x="470.0" dy="14.9">   формується 2DEG з рекордною n_s ≈ 10¹³ см⁻² без легування!</tspan></text>
<rect x="60.0" y="400.0" width="780.0" height="32.0" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="419.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1b5e20" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">У GaN HEMT надвисока провідність каналу досягається силою вбудованих полів поляризації кристалічної ґратки</tspan></text>
</svg>