<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фототранзисторна оптопара: обидва боки в числах</text>
<rect x="70.0" y="96.0" width="150.0" height="132.0" rx="8" fill="#2b2b2b" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="86.0" cy="112.0" r="5.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/>
<text x="145.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e8e8e8" text-anchor="middle" font-weight="700">оптопара</text>
<text x="145.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#bdbdbd" text-anchor="middle">DIP-4</text>
<line x1="70.0" y1="126.0" x2="44.0" y2="126.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="40.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">анод</text>
<line x1="70.0" y1="176.0" x2="44.0" y2="176.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="40.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">катод</text>
<line x1="220.0" y1="126.0" x2="246.0" y2="126.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="250.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">колектор</text>
<line x1="220.0" y1="176.0" x2="246.0" y2="176.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="250.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">емітер</text>
<text x="145.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">крапка/зріз = вивід 1</text>
<rect x="300.0" y="72.0" width="250.0" height="318.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="425.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ВХІД — як світлодіод</text>
<text x="425.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">U_F ≈ 1.2 В,  хочемо I_F = 10 мА</text>
<text x="425.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">R1 = (3.3 − 1.2) / 10 мА</text>
<text x="425.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">≈ 210 Ом  →  220 Ом</text>
<text x="425.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">той самий обмежувальний</text>
<text x="425.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">резистор, що в звичайного</text>
<text x="425.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">світлодіода</text>
<text x="425.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9c6a16" text-anchor="middle">запас: реальний I_F беруть</text>
<text x="425.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9c6a16" text-anchor="middle">більшим за теоретичний —</text>
<text x="425.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9c6a16" text-anchor="middle">бо CTR падає з роками</text>
<rect x="580.0" y="72.0" width="250.0" height="318.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="705.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ВИХІД — ключ у насиченні</text>
<text x="705.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">CTR_min = 80 %  (нижчий ранг)</text>
<text x="705.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">I_C(гарант.) = 0.8 · 10 мА = 8 мА</text>
<text x="705.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">R_C при вих. 5 В:</text>
<text x="705.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">R_C &gt; 5 В / 8 мА ≈ 620 Ом</text>
<text x="705.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">→ беремо 1 кОм (з запасом)</text>
<text x="705.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">на R_C падає майже все →</text>
<text x="705.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">транзистор насичений →</text>
<text x="705.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">чіткий логічний 0</text>
<text x="705.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7a4e8a" text-anchor="middle" font-weight="700">інверсія: світлодіод горить → 0</text>
<text x="430.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Дві землі — два окремі розрахунки: вхід рахують як світлодіод, вихід — як ключ-транзистор.</text>
</svg>