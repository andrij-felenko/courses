<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
<rect width="1000" height="480" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3fae"/></marker>
</defs>
<text x="500.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідки береться ½: енергія — це площа під лінією напруги</text>
<text x="500.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">заряд заходить порціями проти дедалі вищої напруги (V = q/C росте від 0 до V)</text>
<line x1="130.0" y1="410.0" x2="690.0" y2="410.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<polygon points="690.0,410.0 678.0,405.0 678.0,415.0" fill="#1b1b1b" stroke="none" stroke-width="0"/>
<line x1="130.0" y1="410.0" x2="130.0" y2="110.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<polygon points="130.0,110.0 125.0,122.0 135.0,122.0" fill="#1b1b1b" stroke="none" stroke-width="0"/>
<text x="410.0" y="452.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">накопичений заряд  q  →  Q</text>
<text x="48" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" transform="rotate(-90 48 260.0)">напруга на тілі  V</text>
<rect x="130.0" y="170.0" width="470.0" height="240.0" rx="0" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.3"/>
<polygon points="130.0,170.0 600.0,170.0 130.0,410.0" fill="#e8e8e8" stroke="#8a8a8a" stroke-width="0"/>
<polygon points="130.0,410.0 600.0,170.0 600.0,410.0" fill="#dfeede" stroke="#1f8a3b" stroke-width="0"/>
<line x1="130.0" y1="410.0" x2="600.0" y2="170.0" stroke="#1f8a3b" stroke-width="3.2" stroke-linecap="round"/>
<line x1="600.0" y1="410.0" x2="600.0" y2="170.0" stroke="#1b1b1b" stroke-width="1.4" stroke-dasharray="5,4" stroke-linecap="round"/>
<line x1="130.0" y1="170.0" x2="600.0" y2="170.0" stroke="#1b1b1b" stroke-width="1.4" stroke-dasharray="5,4" stroke-linecap="round"/>
<text x="600.0" y="430.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Q</text>
<text x="118.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">V</text>
<text x="421.4" y="342.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">W = ½·Q·V</text>
<text x="421.4" y="362.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="italic">(площа трикутника)</text>
<text x="271.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">цього не платимо:</text>
<text x="271.0" y="257.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">спочатку V була низькою</text>
<circle cx="341.5" cy="302.0" r="5.0" fill="#ffffff" stroke="#c0271e" stroke-width="2"/>
<line x1="411.5" y1="256.0" x2="349.5" y2="296.0" stroke="#c0271e" stroke-width="1.8" marker-end="url(#aRed)"/>
<text x="415.5" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">порція dq заходить</text>
<text x="415.5" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">проти напруги q/C</text>
<rect x="750.0" y="95.0" width="210.0" height="300.0" rx="12" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="855.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Одна енергія — три записи</text>
<rect x="768.0" y="140.0" width="174.0" height="44.0" rx="7" fill="#fafafa" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="855.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">W = ½·Q·V</text>
<text x="855.0" y="179.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">коли відомі заряд і напруга</text>
<rect x="768.0" y="200.0" width="174.0" height="44.0" rx="7" fill="#fafafa" stroke="#1f47b5" stroke-width="1.4"/>
<text x="855.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">W = ½·C·V²</text>
<text x="855.0" y="239.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">робочий: ємність × напруга²</text>
<rect x="768.0" y="260.0" width="174.0" height="44.0" rx="7" fill="#fafafa" stroke="#7a3fae" stroke-width="1.4"/>
<text x="855.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#7a3fae" text-anchor="middle" font-weight="bold" font-style="normal">W = Q²/(2·C)</text>
<text x="855.0" y="299.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">коли фіксований заряд</text>
<line x1="768.0" y1="336.0" x2="942.0" y2="336.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="855.0" y="356.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">підстав Q = C·V —</text>
<text x="855.0" y="372.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">і одне переходить в інше</text>
<text x="855.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">той самий ½, що в ½·m·v² і ½·k·x²</text>
</svg>
