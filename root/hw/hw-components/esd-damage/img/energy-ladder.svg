  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#d9772b"/></marker>
</defs>
<text x="460.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Драбина енергій: чим займається пил і чому звинувачують статику</text>
<text x="460.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">лог-шкала енергії іскри (мДж); зона MIE пилу перекривається з розрядом тіла, але грубі джерела — потужніші</text>
<line x1="90.0" y1="510.0" x2="883.0" y2="510.0" stroke="#1b1b1b" stroke-width="2.2" marker-end="url(#aInk)"/>
<text x="887.0" y="515.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">мДж</text>
<line x1="95.0" y1="505.0" x2="95.0" y2="515.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="95.0" y="532.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">0.01</text>
<line x1="205.0" y1="505.0" x2="205.0" y2="515.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="205.0" y="532.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">0.1</text>
<line x1="315.0" y1="505.0" x2="315.0" y2="515.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="315.0" y="532.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">1</text>
<line x1="425.0" y1="505.0" x2="425.0" y2="515.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="425.0" y="532.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">10</text>
<line x1="535.0" y1="505.0" x2="535.0" y2="515.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="535.0" y="532.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">100</text>
<line x1="645.0" y1="505.0" x2="645.0" y2="515.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="645.0" y="532.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">10³</text>
<line x1="755.0" y1="505.0" x2="755.0" y2="515.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="755.0" y="532.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">10⁴</text>
<line x1="865.0" y1="505.0" x2="865.0" y2="515.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="865.0" y="532.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">10⁵</text>
<rect x="425.0" y="95.0" width="110.0" height="411.0" rx="0" fill="#fff3e6" stroke="#d9772b" stroke-width="1.6"/>
<text x="480.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#d9772b" text-anchor="middle" font-weight="bold" font-style="normal">MIE горючого пилу</text>
<text x="480.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#d9772b" text-anchor="middle" font-weight="normal" font-style="normal">борошно · зерно · цукор</text>
<text x="480.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#d9772b" text-anchor="middle" font-weight="normal" font-style="normal">10–100 мДж (типово)</text>
<text x="171.9" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Поріг загибелі КМОН-входу (для контрасту)</text>
<text x="171.9" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">мікроджоулі · те, що смертельне чипу, для пилу — ніщо</text>
<rect x="171.9" y="268.0" width="110.0" height="22.0" rx="4" fill="none" stroke="#8a8a8a" stroke-width="2.4"/>
<line x1="171.9" y1="279.0" x2="281.9" y2="279.0" stroke="#8a8a8a" stroke-width="2.4" stroke-linecap="round"/>
<text x="425.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Іскра з пальця (тіло людини)</text>
<text x="425.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">≈10–30 мДж · ледь дотягує до низу MIE пилу</text>
<rect x="425.0" y="198.0" width="52.5" height="22.0" rx="4" fill="none" stroke="#1f47b5" stroke-width="2.4"/>
<line x1="425.0" y1="209.0" x2="477.5" y2="209.0" stroke="#1f47b5" stroke-width="2.4" stroke-linecap="round"/>
<text x="615.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Гаряча букса, іскра тертя, зварювання</text>
<text x="615.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">джоулі · набагато потужніше за статику</text>
<rect x="645.0" y="338.0" width="220.0" height="22.0" rx="4" fill="none" stroke="#c0271e" stroke-width="2.4"/>
<line x1="645.0" y1="349.0" x2="865.0" y2="349.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<line x1="477.5" y1="220.0" x2="477.5" y2="510.0" stroke="#1f47b5" stroke-width="1.2" stroke-dasharray="3,4" stroke-linecap="round"/>
<line x1="425.0" y1="220.0" x2="425.0" y2="510.0" stroke="#1f47b5" stroke-width="1.2" stroke-dasharray="3,4" stroke-linecap="round"/>
<rect x="90.0" y="558.0" width="798.0" height="70.0" rx="8" fill="#eef1f4" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="109.0" y="584.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Документований перекіс: коли джерело займання не знайдено,</text>
<text x="109.0" y="604.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">його часто списують на статику — бо вона невидима й нічого по собі не лишає.</text>
<text x="109.0" y="621.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Понад половина пилових вибухів у статистиці — від БЕЗПОЛУМ'ЯНИХ джерел (тертя, гарячі поверхні), не обов'язково статика.</text>
</svg>
