<text x="105.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">1. Життєвий цикл</text>
<text x="105.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Виключення NRND/EOL,</text>
<text x="105.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">перевірка PCN/PDN</text>
<text x="105.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">статусів дистриб'юторів</text>
<line x1="170.0" y1="175.0" x2="185.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="175.0" y="52.0" width="130.0" height="250.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.8"/>
<rect x="175.0" y="52.0" width="130.0" height="36.0" rx="4" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="240.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">2. Lead Time</text>
<text x="240.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Перевірка складів,</text>
<text x="240.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">термінів поставки (&gt;16т),</text>
<text x="240.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">MOQ та пакування</text>
<line x1="305.0" y1="175.0" x2="320.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="310.0" y="52.0" width="130.0" height="250.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.8"/>
<rect x="310.0" y="52.0" width="130.0" height="36.0" rx="4" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="375.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">3. Multi-Sourcing</text>
<text x="375.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">AML: 100% пасиву та LDO</text>
<text x="375.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">мають 2+ схвалені MPN;</text>
<text x="375.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">перевірка Pin-to-Pin</text>
<line x1="440.0" y1="175.0" x2="455.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
