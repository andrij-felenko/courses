<rect x="445.0" y="52.0" width="130.0" height="36.0" rx="4" fill="#d97706" stroke="#d97706" stroke-width="1.0"/>
<text x="510.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">4. Електрозпас</text>
<text x="510.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Derating напруги (50-100%),</text>
<text x="510.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">потужність резисторів,</text>
<text x="510.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">насичення індуктивностей</text>
<line x1="575.0" y1="175.0" x2="590.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="580.0" y="52.0" width="130.0" height="250.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="580.0" y="52.0" width="130.0" height="36.0" rx="4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.0"/>
<text x="645.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">5. SMT Монтаж</text>
<text x="645.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Уніфікація номіналів,</text>
<text x="645.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">мінімізація фідерів,</text>
<text x="645.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">перевірка Tape &amp; Reel</text>
<rect x="40.0" y="318.0" width="680.0" height="50.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
<text x="380.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">РЕЗУЛЬТАТ АУДИТУ: Затверджений виробничий BOM (Frozen Golden BOM)</text>
<text x="380.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Гарантія безперервності виробництва, надійності пристрою та мінімальної собівартості монтажу</text>
</svg>