<text x="457.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">  Для аналогових кіл — виключно C0G/NP0.</text>
<text x="380.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Конденсатор 10 мкФ 6.3В під напругою 5В перетворюється на 2 мкФ, що зриває стабільність LDO/DCDC</text>
