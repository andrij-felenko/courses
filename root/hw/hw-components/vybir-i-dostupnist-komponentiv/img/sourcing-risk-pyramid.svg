<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія ризиків постачання компонентів</text>
<text x="380.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">СТРАТЕГІЇ ПОСТАЧАННЯ ТА ІЄРАРХІЯ РИЗИКІВ</text>
<rect x="40.0" y="48.0" width="680.0" height="62.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="56.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">РІВЕНЬ 1: Single-Source Proprietary (Критичний ризик)</text>
<text x="56.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Унікальний кремній без прямої заміни (MCU, SoC, PMIC). Зупинка постачання зупиняє виробництво.</text>
<rect x="40.0" y="118.0" width="680.0" height="62.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="56.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="start" font-weight="700">РІВЕНЬ 2: Dual-Source Compatible (Помірний ризик)</text>
<text x="56.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Мікросхема має 1 аналог з сумісною розпіновкою (Pin-to-Pin), але потребує узгодження дільників чи софту.</text>
<rect x="40.0" y="188.0" width="680.0" height="62.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/>
<text x="56.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">РІВЕНЬ 3: Multi-Source Drop-in Replacement (Низький ризик)</text>
<text x="56.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Повна пряма заміна (Pin-to-Pin, напруги, ESR). Стандартні LDO (1117, 7805), операційні підсилювачі, RS-485.</text>
<rect x="40.0" y="258.0" width="680.0" height="62.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
<text x="56.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">РІВЕНЬ 4: Commodity Industry Standards (Мінімальний ризик)</text>
<text x="56.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Повна взаємозамінність за EIA/JEDEC: резистори 0603 1%, MLCC-конденсатори, діоди, типові польові транзистори.</text>
<rect x="40.0" y="332.0" width="680.0" height="42.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="380.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Золоте правило DFM: для пасивних компонентів та LDO вказувати мінімум 2-3 схвалені MPN (AML)</text>
</svg>