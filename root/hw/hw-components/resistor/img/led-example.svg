<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360">
<rect width="880" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="440.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Приклад добору: резистор для світлодіода</text>
<text x="440.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">живлення 5 В, світлодіод 2 В / 10 мА — який R і яка потужність?</text>
<line x1="100.0" y1="120.0" x2="100.0" y2="240.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="85.0" y1="168.0" x2="115.0" y2="168.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<line x1="92.0" y1="184.0" x2="108.0" y2="184.0" stroke="#1b1b1b" stroke-width="5" stroke-linecap="round"/>
<text x="78.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">5 В</text>
<line x1="100.0" y1="120.0" x2="200.0" y2="120.0" stroke="#cf8b5e" stroke-width="3" stroke-linecap="round"/>
<rect x="200.0" y="109.0" width="70.0" height="22.0" rx="3" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<text x="235.0" y="101.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="italic">R = ?</text>
<line x1="270.0" y1="120.0" x2="340.0" y2="120.0" stroke="#cf8b5e" stroke-width="3" stroke-linecap="round"/>
<polygon points="340,108 340,132 366,120" fill="#1b1b1b"/>
<line x1="366.0" y1="106.0" x2="366.0" y2="134.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<line x1="352.0" y1="102.0" x2="360.0" y2="92.0" stroke="#e08030" stroke-width="1.6" marker-end="url(#aOrange)"/>
<line x1="361.0" y1="104.0" x2="369.0" y2="94.0" stroke="#e08030" stroke-width="1.6" marker-end="url(#aOrange)"/>
<text x="353.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">LED 2 В</text>
<line x1="366.0" y1="120.0" x2="430.0" y2="120.0" stroke="#cf8b5e" stroke-width="3" stroke-linecap="round"/>
<line x1="430.0" y1="120.0" x2="430.0" y2="240.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="100.0" y1="240.0" x2="430.0" y2="240.0" stroke="#cf8b5e" stroke-width="3" stroke-linecap="round"/>
<line x1="150.0" y1="120.0" x2="186.0" y2="120.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<text x="168.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">I = 10 мА</text>
<rect x="490.0" y="84.0" width="380.0" height="214.0" rx="12" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="510.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Спад на R:</text>
<text x="614.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">V_R = 5 − 2 = 3 В</text>
<text x="510.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Опір:</text>
<text x="614.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">R = V_R / I = 3 / 0.01 = 300 Ω</text>
<text x="510.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Ряд E24:</text>
<text x="614.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">300 Ω є точно (або 330 Ω з E12)</text>
<text x="510.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Потужність:</text>
<text x="614.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">P = I²R = 0.01² × 300 = 0.03 Вт</text>
<text x="510.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Запас:</text>
<text x="614.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">0.25 Вт ≫ 0.03 Вт — у ×8, надійно</text>
<rect x="560.0" y="268.0" width="270.0" height="34.0" rx="10" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="695.0" y="291.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">R = 300 Ω, 0.25 Вт</text>
<text x="440.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Висновок: послідовний резистор 300 Ω на чверть вата — з величезним запасом.</text>
</svg>
