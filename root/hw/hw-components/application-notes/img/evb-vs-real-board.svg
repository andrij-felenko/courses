<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оптимізм Evaluation Board проти реальності 2-шарової плати</text>
<rect x="30.0" y="55.0" width="360.0" height="350.0" rx="8" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/>
<text x="210.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Evaluation Board виробника (EVB)</text>
<rect x="50.0" y="92.5" width="320.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Конструкція плати:</tspan><tspan x="210.0" dy="13.0">• 4-6 шарів, товста мідь 2 oz (70 мкм)</tspan><tspan x="210.0" dy="13.0">• Діелектрик prepreg 0.1 мм до суцільної GND</tspan><tspan x="210.0" dy="13.0">• Паразитна індуктивність L_loop &lt; 0.8 нГн</tspan></text>
<rect x="50.0" y="182.5" width="320.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Компонентна база:</tspan><tspan x="210.0" dy="13.0">• Преміум MLCC Murata X7R (0805/1206)</tspan><tspan x="210.0" dy="13.0">• Екранований дросель Coilcraft (низький DCR)</tspan><tspan x="210.0" dy="13.0">• Ідеальні роз'єми SMA / Kelvin test points</tspan></text>
<rect x="50.0" y="290.0" width="320.0" height="95.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="210.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Результати в даташиті / AN:</text>
<text x="210.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ККД = 95.2 % при струмі 5 А (25 °C, 200 LFM)</text>
<text x="210.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Пульсації виходу: V_ripple &lt; 12 мВ</text>
<text x="210.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Температура кристала: Tj = 55 °C</text>
<rect x="430.0" y="55.0" width="360.0" height="350.0" rx="8" fill="#fdf7f7" stroke="#c0392b" stroke-width="1.5"/>
<text x="610.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Реальна серійна 2-шарова плата</text>
<rect x="450.0" y="92.5" width="320.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Конструкція плати:</tspan><tspan x="610.0" dy="13.0">• 2 шари, стандартна мідь 1 oz (35 мкм)</tspan><tspan x="610.0" dy="13.0">• Товстий FR-4 1.6 мм, розірваний полігон GND</tspan><tspan x="610.0" dy="13.0">• Паразитна індуктивність L_loop = 6…12 нГн</tspan></text>
<rect x="450.0" y="182.5" width="320.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Компонентна база:</tspan><tspan x="610.0" dy="13.0">• Бюджетні MLCC 0603 (-60% ємності від DC bias!)</tspan><tspan x="610.0" dy="13.0">• Неекранований дросель (наводить шуми на FB)</tspan><tspan x="610.0" dy="13.0">• Довгі силові клеми та роз'єми</tspan></text>
<rect x="450.0" y="290.0" width="320.0" height="95.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="610.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Реальні виміри на столі:</text>
<text x="610.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">ККД = 88.5 % (втрати на паразитах і DCR)</text>
<text x="610.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Пульсації виходу: V_ripple = 140 мВ (дзвін)</text>
<text x="610.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Температура кристала: Tj &gt; 115 °C (Thermal Shutdown)</text>
