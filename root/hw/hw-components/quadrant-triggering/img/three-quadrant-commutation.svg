<text x="290.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Струм I</text>
<line x1="410.0" y1="60.0" x2="410.0" y2="170.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="410.0" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Комутація: I = 0</text>
<text x="418.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Стрибок (dv/dt)_c!</text>
<rect x="30.0" y="200.0" width="365.0" height="160.0" rx="6" fill="#fdf4f4" stroke="#c0392b" stroke-width="1.4"/>
<text x="212.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Звичайний 4-квадрантний симістор (4Q)</text>
<text x="50.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Має чутливі зони для квадранта IV</text>
<text x="50.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Накопичує неосновні носії під час струму</text>
<text x="50.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">• Стрибок (dv/dt)_c змітає заряд → ХИБНЕ ВВІМКНЕННЯ</text>
<text x="50.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-weight="700">• (dv/dt)_c ліміт низький: 10–50 В/мкс → ПОТРІБЕН СНАБЕР</text>
<text x="50.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">• Ризик втрати керованості на моторах / дроселях</text>
<rect x="425.0" y="200.0" width="365.0" height="160.0" rx="6" fill="#edfbf2" stroke="#27ae60" stroke-width="1.4"/>
<text x="607.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3-квадрантний симістор (Snubberless / Hi-Com)</text>
<text x="445.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Структуру квадранта IV повністю ВИЛУЧЕНО з кристала</text>
<text x="445.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Половини тиристорів ізольовані меза-канавками</text>
<text x="445.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• Немає паразитних кишень заряду → ЧИСТЕ ВИМИКАННЯ</text>
<text x="445.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">• (dv/dt)_c ліміт високий: &gt; 1000–2000 В/мкс (БЕЗ СНАБЕРА)</text>
<text x="445.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Працює в Q-I, Q-II, Q-III; запуск у Q-IV заблоковано</text>
</svg>