<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві умови пробою задають і товщину, і легування</text>
<line x1="110.0" y1="300.0" x2="500.0" y2="300.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="110.0" y1="300.0" x2="110.0" y2="70.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="478.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">глибина x</text>
<text x="102.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">поле E</text>
<polygon points="110,88 110,300 470,300" fill="#eafaf0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="105.0" y1="88.0" x2="115.0" y2="88.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="100.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700" font-style="italic">Ec</text>
<text x="170.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">пік = критичне поле</text>
<text x="260.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-style="italic">нахил = q·Nd/ε</text>
<text x="260.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(що густіше — то крутіше)</text>
<line x1="255.0" y1="234.0" x2="205.0" y2="260.0" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="290.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">площа = BV</text>
<text x="290.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(∫E·dx = напруга)</text>
<line x1="110.0" y1="316.0" x2="470.0" y2="316.0" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="110.0" y1="311.0" x2="110.0" y2="321.0" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="470.0" y1="311.0" x2="470.0" y2="321.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="290.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">d = 2·BV/Ec</text>
<rect x="531.7" y="73.0" width="126.6" height="114.0" rx="6" fill="#fff8e1" stroke="#d0a000" stroke-width="1.5"/><text x="595.0" y="95.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Дві умови:</tspan><tspan x="595.0" dy="15.6">• пік = Ec</tspan><tspan x="595.0" dy="15.6">• площа = BV</tspan><tspan x="595.0" dy="15.6">задають ОБИДВА:</tspan><tspan x="595.0" dy="15.6">товщину d і</tspan><tspan x="595.0" dy="15.6">легування Nd</tspan></text>
<rect x="110.0" y="352.0" width="480.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="374.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Трикутник: висота впирається в Ec, площа мусить дорівнювати BV.</tspan><tspan x="350.0" dy="15.6">Звідси одразу d = 2·BV/Ec і Nd = ε·Ec²/(2·q·BV) — усе для опору.</tspan></text>
</svg>