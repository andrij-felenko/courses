<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="14.1" y="9.0" width="421.8" height="32.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="29.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">Програмування («0»): інжекція гарячих електронів (CHE)</tspan></text><rect x="450.0" y="9.0" width="410.0" height="32.0" rx="6" fill="#e0e7ff" stroke="#2457d6" stroke-width="1.5"/><text x="655.0" y="29.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Стирання («1»): тунелювання Фаулера–Нордгейма (FN)</tspan></text><rect x="71.8" y="49.5" width="306.4" height="31.0" rx="6" fill="#fff1f2" stroke="#333333" stroke-width="1.5"/><text x="225.0" y="68.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">V_CG = +9..+12 В (сильне вертикальне поле)</tspan></text><rect x="30.0" y="260.0" width="390.0" height="110.0" rx="4" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><rect x="40.0" y="260.0" width="70.0" height="50.0" rx="6" fill="#fbeae8" stroke="#c0392b" stroke-width="1.2"/><text x="75.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Витік 0 В</text><rect x="340.0" y="260.0" width="70.0" height="50.0" rx="6" fill="#fbeae8" stroke="#c0392b" stroke-width="1.2"/><text x="375.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Стік +5 В</text><rect x="110.0" y="260.0" width="230.0" height="20.0" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.0"/><text x="225.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle" font-weight="700">Канальний струм I_D ~ 0.5–1 мА</text><rect x="120.0" y="160.0" width="210.0" height="45.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Плаваючий затвор (FG)</text><rect x="120.0" y="95.0" width="210.0" height="40.0" rx="3" fill="#e0e7ff" stroke="#2457d6" stroke-width="1.5"/><text x="225.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Керівний затвор (CG = +10 В)</text><line x1="290.0" y1="255.0" x2="270.0" y2="210.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="315.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">e⁻ (&gt;3.1 еВ)</text><text x="225.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Горизонтальне поле прискорює e⁻ до стоку,</text><text x="225.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">вертикальне поле затягує гарячі e⁻ у затвор</text><rect x="491.6" y="49.5" width="326.9" height="31.0" rx="6" fill="#eff6ff" stroke="#333333" stroke-width="1.5"/><text x="655.0" y="68.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">V_CG = -10 В, V_well = +10 В (поле ~10 МВ/см)</tspan></text><rect x="460.0" y="260.0" width="390.0" height="110.0" rx="4" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><rect x="470.0" y="260.0" width="70.0" height="50.0" rx="6" fill="#e8edf2" stroke="#333333" stroke-width="1.2"/><text x="505.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Витік (flt)</text><rect x="770.0" y="260.0" width="70.0" height="50.0" rx="6" fill="#e8edf2" stroke="#333333" stroke-width="1.2"/><text x="805.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Стік (flt)</text><rect x="550.0" y="160.0" width="210.0" height="45.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="655.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Плаваючий затвор (FG)</text><rect x="550.0" y="95.0" width="210.0" height="40.0" rx="3" fill="#e0e7ff" stroke="#2457d6" stroke-width="1.5"/><text x="655.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Керівний затвор (CG = -10 В)</text><line x1="620.0" y1="210.0" x2="620.0" y2="255.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/><line x1="655.0" y1="210.0" x2="655.0" y2="255.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/><line x1="690.0" y1="210.0" x2="690.0" y2="255.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/><text x="725.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">e⁻ тунелюють</text><text x="655.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Величезне електричне поле звужує бар'єр SiO₂,</text><text x="655.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">електрони квантово виходять у підкладку p-well</text>
</svg>