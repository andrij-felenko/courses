<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Методи аналізу розкиду: Worst-Case проти RSS та Monte Carlo</text>
<text x="390.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Порівняння оцінки меж похибки для аналогових дільників напруги</text>
<rect x="25.0" y="68.0" width="225.0" height="245.0" rx="6" fill="#fafafa" stroke="#d1d5db" stroke-width="1.2"/>
<text x="137.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1. Worst-Case (WCA)</text>
<text x="137.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Найгірший крайній випадок</text>
<rect x="45.0" y="125.0" width="185.0" height="110.0" rx="4" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/>
<text x="137.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">ΔV_wca = ∑ |∂f/∂Ri| · ΔRi</text>
<text x="137.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Гарантія: 100%</text>
<text x="137.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ймовірність: ≈ 10⁻⁶</text>
<text x="137.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Надто песимістично,</text>
<text x="137.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">здорожчує проект</text>
<rect x="275.0" y="68.0" width="225.0" height="245.0" rx="6" fill="#fafafa" stroke="#d1d5db" stroke-width="1.2"/>
<text x="387.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2. Root-Sum-Square (RSS)</text>
<text x="387.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Квадратична сума дисперсій</text>
<circle cx="387.0" cy="180.0" r="52.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="387.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">σ_tot = √(∑ (∂f/∂Ri)² σi²)</text>
<text x="387.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Охоплення 3σ: 99.73%</text>
<text x="387.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Припускає Гаусів розподіл</text>
<text x="387.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Оптимально для</text>
<text x="387.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">серійного виробництва</text>
<rect x="525.0" y="68.0" width="225.0" height="245.0" rx="6" fill="#fafafa" stroke="#d1d5db" stroke-width="1.2"/>
<text x="637.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. Monte Carlo (MC)</text>
<text x="637.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Числова симуляція (N=10⁴)</text>
<text x="637.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Вихідний вихід (Yield)</text>
<rect x="545.0" y="220.0" width="10.0" height="15.0" rx="1" fill="#eef6ef" stroke="#27ae60" stroke-width="1.0"/>
<rect x="560.0" y="200.0" width="10.0" height="35.0" rx="1" fill="#eef6ef" stroke="#27ae60" stroke-width="1.0"/>
<rect x="575.0" y="175.0" width="10.0" height="60.0" rx="1" fill="#eef6ef" stroke="#27ae60" stroke-width="1.0"/>
<rect x="590.0" y="155.0" width="10.0" height="80.0" rx="1" fill="#eef6ef" stroke="#27ae60" stroke-width="1.0"/>
<rect x="605.0" y="145.0" width="10.0" height="90.0" rx="1" fill="#eef6ef" stroke="#27ae60" stroke-width="1.0"/>
<rect x="620.0" y="140.0" width="10.0" height="95.0" rx="1" fill="#eef6ef" stroke="#27ae60" stroke-width="1.0"/>
<rect x="635.0" y="140.0" width="10.0" height="95.0" rx="1" fill="#eef6ef" stroke="#27ae60" stroke-width="1.0"/>
<rect x="650.0" y="145.0" width="10.0" height="90.0" rx="1" fill="#eef6ef" stroke="#27ae60" stroke-width="1.0"/>
<rect x="665.0" y="155.0" width="10.0" height="80.0" rx="1" fill="#eef6ef" stroke="#27ae60" stroke-width="1.0"/>
<rect x="680.0" y="175.0" width="10.0" height="60.0" rx="1" fill="#eef6ef" stroke="#27ae60" stroke-width="1.0"/>
<rect x="695.0" y="200.0" width="10.0" height="35.0" rx="1" fill="#eef6ef" stroke="#27ae60" stroke-width="1.0"/>
<rect x="710.0" y="220.0" width="10.0" height="15.0" rx="1" fill="#eef6ef" stroke="#27ae60" stroke-width="1.0"/>
<line x1="540.0" y1="235.0" x2="725.0" y2="235.0" stroke="#333333" stroke-width="1.0"/>
<text x="637.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Враховує будь-яку</text>
<text x="637.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">форму розподілу (Binning)</text>
<rect x="25.0" y="330.0" width="725.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="387.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило вибору: WCA — для критичної авіації та медицини; RSS/MC — для масової електроніки.</text>
<text x="387.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Статистичний підхід дає змогу використовувати на порядок дешевшу елементну базу без втрати якості.</text>
