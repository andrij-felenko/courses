<rect x="360.0" y="68.0" width="395.0" height="135.0" rx="6" fill="#fdecec" stroke="#c0392b" stroke-width="1.2"/>
<text x="557.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Дискретні резистори (4 × ±0.1%)</text>
<text x="375.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Розкид номіналів: до ±0.4% на V_out</text>
<text x="375.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Різні TCR (±25 ppm/°C) → сильний дрейф нуля</text>
<text x="375.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Різна температура на платі (градієнт ΔT)</text>
<text x="375.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Помилка нуля:  V_offset ≈ V_in · (ΔR / R)</text>
<rect x="360.0" y="218.0" width="395.0" height="135.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.2"/>
<text x="557.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Резистивна матриця (Matched Array)</text>
<text x="375.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Узгодження опорів (Matching): до 0.01%</text>
<text x="375.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Узгодження TCR (Tracking): до 1..2 ppm/°C</text>
<text x="375.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Один кристал кремнію/кераміки (ізотермія)</text>
<text x="375.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">Зсув нуля майже відсутній і стабільний у часі</text>
<rect x="25.0" y="368.0" width="730.0" height="36.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="390.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Метрологічний закон: точність моста залежить не від абсолютного опору, а від його співвідношення.</text>
</svg>