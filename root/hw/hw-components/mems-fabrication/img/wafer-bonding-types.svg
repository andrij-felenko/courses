<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Основні технології з’єднання пластин (Wafer Bonding)</text>
<rect x="25.0" y="65.0" width="280.0" height="285.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="165.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анодне з’єднання</text>
<text x="165.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">кремній + боросилікатне скло</text>
<rect x="50.0" y="130.0" width="230.0" height="45.0" rx="2" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="165.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0284c7" text-anchor="middle" font-weight="700">Скло Pyrex / Borofloat</text>
<rect x="135.0" y="120.0" width="60.0" height="10.0" rx="1" fill="#e2e8f0" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="165.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Катод (−)</text>
<line x1="85.0" y1="163.0" x2="85.0" y2="140.0" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="245.0" y1="163.0" x2="245.0" y2="140.0" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="165.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Міграція Na⁺ → шар збіднення O²⁻</text>
<line x1="50.0" y1="175.0" x2="280.0" y2="175.0" stroke="#c0392b" stroke-width="2.5"/>
<rect x="50.0" y="175.0" width="230.0" height="45.0" rx="2" fill="#dce4ec" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="165.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кремній Si (Анод +)</text>
<rect x="60.1" y="254.0" width="209.8" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="270.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">T = 300–450 °C, V = 500–1200 В</tspan><tspan x="165.0" dy="13.0">Електростатичний притиск</tspan><tspan x="165.0" dy="13.0">Міцний ковалентний зв’язок Si-O-Si</tspan></text>
<rect x="330.0" y="65.0" width="280.0" height="285.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="470.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Евтектичне з’єднання</text>
<text x="470.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">через проміжний сплав Au-Si / Al-Ge</text>
<rect x="355.0" y="130.0" width="230.0" height="45.0" rx="2" fill="#dce4ec" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="470.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кремнієва кришка (Cap)</text>
<rect x="355.0" y="175.0" width="230.0" height="10.0" rx="1" fill="#fef08a" stroke="#ca8a04" stroke-width="1.8"/>
<text x="470.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#854d0e" text-anchor="middle" font-weight="700">Рідка евтектика Au-Si (363 °C)</text>
<rect x="355.0" y="185.0" width="230.0" height="45.0" rx="2" fill="#dce4ec" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="470.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нижня пластина з MEMS</text>
<rect x="373.6" y="254.0" width="192.7" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="270.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Au-Si (363 °C), Al-Ge (419 °C)</tspan><tspan x="470.0" dy="13.0">Рідка фаза розчиняє оксиди</tspan><tspan x="470.0" dy="13.0">Герметичний струмопровідний шов</tspan></text>
<rect x="635.0" y="65.0" width="280.0" height="285.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="775.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пряме зрощування (Fusion)</text>
<text x="775.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">атомний контакт Si-Si / Si-SiO₂</text>
<rect x="660.0" y="130.0" width="230.0" height="45.0" rx="2" fill="#dce4ec" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="775.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пластина Si (гідрофільна)</text>
<line x1="660.0" y1="175.0" x2="890.0" y2="175.0" stroke="#27ae60" stroke-width="2.5"/>
<text x="775.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Si-OH + HO-Si → Si-O-Si + H₂O</text>
<rect x="660.0" y="175.0" width="230.0" height="45.0" rx="2" fill="#dce4ec" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="775.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пластина Si з оксидом SiO₂</text>
<rect x="667.2" y="254.0" width="215.5" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="775.0" y="270.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Хімічна активація поверхні</tspan><tspan x="775.0" dy="13.0">Водневі зв’язки при кімнатній T</tspan><tspan x="775.0" dy="13.0">Високотемпературний відпал &gt;1000 °C</tspan></text>
<rect x="100.9" y="379.0" width="738.2" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="399.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">З’єднання пластин формує закриті порожнини, захищає структури та дозволяє створювати багатошарові сенсори</tspan></text>
</svg>