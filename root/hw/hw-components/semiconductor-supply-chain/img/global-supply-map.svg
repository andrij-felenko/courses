<text x="447.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">&gt;90% світового виготовлення передової логіки (&lt;5 нм) на Тайвані</text>
