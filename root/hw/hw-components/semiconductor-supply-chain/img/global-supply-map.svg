<text x="447.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Корпусування чіпів, 2.5D/3D стекінг (чиплети, HBM) та тестування</text>
