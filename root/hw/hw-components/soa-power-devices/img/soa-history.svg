<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 916" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="916" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві ери однієї фізики: як SOA набувала стін</text>
<line x1="168.0" y1="94.0" x2="168.0" y2="890.0" stroke="#dfe3e8" stroke-width="3.0"/>
<rect x="20.0" y="60.0" width="852.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="446.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">ЕРА БІПОЛЯРНИХ: вторинний пробій</text>
<rect x="190.0" y="106.0" width="682.0" height="54.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="150.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="end" font-weight="700">1958</text><circle cx="168.0" cy="133.0" r="5.5" fill="#2457d6" stroke="#ffffff" stroke-width="2.0"/><text x="204.0" y="129.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="204.0" dy="0.0">Торнтон і Сіммонс: «новий режим високого струму»</tspan><tspan x="204.0" dy="16.9">— явище описали, але зрозуміти не змогли</tspan></text>
<rect x="190.0" y="172.0" width="682.0" height="54.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="150.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="end" font-weight="700">1962</text><circle cx="168.0" cy="199.0" r="5.5" fill="#2457d6" stroke="#ffffff" stroke-width="2.0"/><text x="204.0" y="195.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="204.0" dy="0.0">Шафт і Френч (NBS, на запит JEDEC): перша характеризація.</tspan><tspan x="204.0" dy="16.9">Вирок: межу не задати трьома числами — потрібні енергія й час</tspan></text>
<rect x="190.0" y="238.0" width="682.0" height="54.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="150.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="end" font-weight="700">1963</text><circle cx="168.0" cy="265.0" r="5.5" fill="#2457d6" stroke="#ffffff" stroke-width="2.0"/><text x="204.0" y="261.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="204.0" dy="0.0">Скарлетт, Шоклі й Гайц: при критичній внутрішній температурі</tspan><tspan x="204.0" dy="16.9">струм і тепло збігаються в одну гарячу цятку</tspan></text>
<rect x="190.0" y="304.0" width="682.0" height="54.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="150.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="end" font-weight="700">1967</text><circle cx="168.0" cy="331.0" r="5.5" fill="#2457d6" stroke="#ffffff" stroke-width="2.0"/><text x="204.0" y="327.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="204.0" dy="0.0">Шафт: оглядова стаття у Proc. IEEE + окрема бібліографія</tspan><tspan x="204.0" dy="16.9">— підсумок дев'яти років суперечок про механізм</tspan></text>
<rect x="190.0" y="370.0" width="682.0" height="54.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="150.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="end" font-weight="700">1970</text><circle cx="168.0" cy="397.0" r="5.5" fill="#2457d6" stroke="#ffffff" stroke-width="2.0"/><text x="204.0" y="393.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="204.0" dy="0.0">Гауер і Редді: швидкий зрив — від лавинної інжекції, тепло тут</tspan><tspan x="204.0" dy="16.9">ні до чого → безпечну область розділяють на FBSOA і RBSOA</tspan></text>
<rect x="190.0" y="436.0" width="682.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="150.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end" font-weight="700">40 років</text><circle cx="168.0" cy="463.0" r="5.5" fill="#6b7280" stroke="#ffffff" stroke-width="2.0"/><text x="204.0" y="459.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="204.0" dy="0.0">«У MOSFET вторинного пробою немає»: опір відкритого каналу</tspan><tspan x="204.0" dy="16.9">росте з нагрівом і сам вирівнює струм між комірками</tspan></text>
<rect x="20.0" y="502.0" width="852.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="446.0" y="524.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ЕРА ПОЛЬОВИХ: те саме під новою назвою</text>
<rect x="190.0" y="548.0" width="682.0" height="54.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="150.0" y="580.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">1997</text><circle cx="168.0" cy="575.0" r="5.5" fill="#c0392b" stroke="#ffffff" stroke-width="2.0"/><text x="204.0" y="571.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="204.0" dy="0.0">Автопром: швидкі щільні MOSFET починають гинути</tspan><tspan x="204.0" dy="16.9">в лінійному режимі — усередині паспортної SOA (за звітом NASA)</tspan></text>
<rect x="190.0" y="614.0" width="682.0" height="54.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="150.0" y="646.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">1999</text><circle cx="168.0" cy="641.0" r="5.5" fill="#c0392b" stroke="#ffffff" stroke-width="2.0"/><text x="204.0" y="637.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="204.0" dy="0.0">Брельйо, Фрізіна, Магрі, Спіріто (ISPSD, Торонто): теплові мапи —</tspan><tspan x="204.0" dy="16.9">гаряча цятка є й у MOSFET, точно як у біполярних</tspan></text>
<rect x="190.0" y="680.0" width="682.0" height="54.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="150.0" y="712.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">2000</text><circle cx="168.0" cy="707.0" r="5.5" fill="#c0392b" stroke="#ffffff" stroke-width="2.0"/><text x="204.0" y="703.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="204.0" dy="0.0">Консолі та ін. (IEEE Trans. Power Electron.): «аномальний механізм»,</tspan><tspan x="204.0" dy="16.9">якого немає ні в літературі, ні в даташитах виробників</tspan></text>
<rect x="190.0" y="746.0" width="682.0" height="54.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="150.0" y="778.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">2002</text><circle cx="168.0" cy="773.0" r="5.5" fill="#c0392b" stroke="#ffffff" stroke-width="2.0"/><text x="204.0" y="769.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="204.0" dy="0.0">Спіріто, Брельйо, д'Алессандро, Рінальді (MIEL, Ніш; ISPSD, Санта-Фе):</tspan><tspan x="204.0" dy="16.9">аналітична модель і критерій → нова стіна на кривій SOA</tspan></text>
<rect x="190.0" y="812.0" width="682.0" height="54.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="150.0" y="844.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">2010</text><circle cx="168.0" cy="839.0" r="5.5" fill="#c0392b" stroke="#ffffff" stroke-width="2.0"/><text x="204.0" y="835.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="204.0" dy="0.0">NASA (NESC-TB-10-01): «криві SOA від виробників не описували</tspan><tspan x="204.0" dy="16.9">області теплової нестійкості»</tspan></text>
</svg>