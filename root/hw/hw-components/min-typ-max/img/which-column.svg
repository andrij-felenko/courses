<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 710 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="710" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Який край небезпечний — залежить від параметра</text>
<rect x="50.0" y="64.0" width="340.0" height="38.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.3"/>
<text x="64.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Напруга зсуву, шум, струм спокою</text>
<rect x="410.0" y="64.0" width="90.0" height="38.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.4"/>
<text x="455.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">MAX</text>
<text x="508.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">менше — добре, боїшся великого</text>
<rect x="50.0" y="112.0" width="340.0" height="38.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.3"/>
<text x="64.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Підсилення, вихідний струм, смуга</text>
<rect x="410.0" y="112.0" width="90.0" height="38.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.4"/>
<text x="455.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">MIN</text>
<text x="508.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">більше — добре, боїшся малого</text>
<rect x="50.0" y="160.0" width="340.0" height="38.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.3"/>
<text x="64.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Dropout, вхідний струм, витік</text>
<rect x="410.0" y="160.0" width="90.0" height="38.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.4"/>
<text x="455.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">MAX</text>
<text x="508.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">хочеш якнайменше</text>
<rect x="50.0" y="208.0" width="340.0" height="38.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.3"/>
<text x="64.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Поріг увімкнення (інколи)</text>
<rect x="410.0" y="208.0" width="110.0" height="38.0" rx="6" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="465.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">MIN і MAX</text>
<text x="528.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">важать обидва краї</text>
<text x="350.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">дивись на той край, де ховається біда: для одних це max, для інших — min</text>
</svg>