<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1100 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1100" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ефект випучування магнітного потоку (Fringing Flux)</text>
<text x="420.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Збільшення ефективної площі Aeff та вихровий нагрів сусідніх витків міді</text>
<rect x="30.0" y="65.0" width="430.0" height="315.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="245.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спотворення поля на краях зазору</text>
<rect x="140.0" y="110.0" width="160.0" height="60.0" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
<text x="220.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle" font-weight="700">Верхній керн осердя</text>
<rect x="140.0" y="240.0" width="160.0" height="60.0" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
<text x="220.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#f8fafc" text-anchor="middle" font-weight="700">Нижній керн осердя</text>
<line x1="130.0" y1="170.0" x2="130.0" y2="240.0" stroke="#b45309" stroke-width="1.2"/>
<line x1="125.0" y1="170.0" x2="135.0" y2="170.0" stroke="#b45309" stroke-width="1.2"/>
<line x1="125.0" y1="240.0" x2="135.0" y2="240.0" stroke="#b45309" stroke-width="1.2"/>
<text x="120.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="end" font-weight="700">lg</text>
<line x1="170.0" y1="170.0" x2="170.0" y2="240.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="170.0" y1="195.0" x2="170.0" y2="215.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="195.0" y1="170.0" x2="195.0" y2="240.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="195.0" y1="195.0" x2="195.0" y2="215.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="220.0" y1="170.0" x2="220.0" y2="240.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="220.0" y1="195.0" x2="220.0" y2="215.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="245.0" y1="170.0" x2="245.0" y2="240.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="245.0" y1="195.0" x2="245.0" y2="215.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="270.0" y1="170.0" x2="270.0" y2="240.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="270.0" y1="195.0" x2="270.0" y2="215.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M 148 170 Q 100 205 148 240" fill="none" stroke="#16a34a" stroke-width="1.8"/>
<path d="M 155 170 Q 70 205 155 240" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>
<path d="M 292 170 Q 340 205 292 240" fill="none" stroke="#16a34a" stroke-width="1.8"/>
<path d="M 285 170 Q 370 205 285 240" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,3"/>
<rect x="345.0" y="185.0" width="20.0" height="40.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="355.0" cy="205.0" r="6.0" fill="#c0392b" stroke="#991b1b" stroke-width="1.0"/>
<text x="372.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Мідний виток</text>
<text x="372.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="start" font-weight="700">Вихровий перегрів!</text>
<text x="245.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Геометричний переріз A_core = a · b</text>
<text x="245.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Ефективний переріз A_eff = (a + lg) · (b + lg) &gt; A_core</text>
<rect x="480.0" y="65.0" width="330.0" height="315.0" rx="8" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
<text x="645.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">Наслідки та захист</text>
<text x="495.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#78350f" text-anchor="start" font-weight="700">1. Зниження релюктансу:</text>
<text x="495.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#451a03" text-anchor="start"><tspan x="495.0" dy="0.0">Через розширення трубки потоку A_eff &gt; A_core реальний опір зазору менший за 1D-розрахунок (коефіцієнт F_fringe &gt; 1).</tspan></text>
<text x="495.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#78350f" text-anchor="start" font-weight="700">2. Локальний перегрів:</text>
<text x="495.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#451a03" text-anchor="start"><tspan x="495.0" dy="0.0">Радіальні лінії випучування перетинають мідні провідники обмотки перпендикулярно, наводячи потужні вихрові струми.</tspan></text>
<text x="495.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#78350f" text-anchor="start" font-weight="700">3. Руйнування ізоляції:</text>
<text x="495.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#451a03" text-anchor="start"><tspan x="495.0" dy="0.0">Температура дроту поблизу зазору може перевищити 150°C, спричиняючи міжвиткове коротке замикання.</tspan></text>
<rect x="495.0" y="290.0" width="300.0" height="75.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="645.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700">Правило проектування:</text>
<text x="645.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="middle">Тримати обмотку на відстані ≥ 2·lg від зазору,</text>
<text x="645.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#78350f" text-anchor="middle">або застосовувати розподілений зазор (порошкові осердя)</text>
</svg>