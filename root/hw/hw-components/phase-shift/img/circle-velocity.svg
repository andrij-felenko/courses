<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470">
<rect width="820" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Те саме з обертовою стрілкою: швидкість завжди на 90° попереду</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">і довжина вектора швидкості — ω·r: ось звідки множник ω у похідній</text>
<circle cx="240.0" cy="250.0" r="110.0" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<line x1="240.0" y1="250.0" x2="330.1" y2="186.9" stroke="#c0271e" stroke-width="3" marker-end="url(#aRed)"/>
<text x="295.1" y="234.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">положення (r)</text>
<line x1="330.1" y1="186.9" x2="279.6" y2="114.8" stroke="#1f8a3b" stroke-width="3" marker-end="url(#aGreen)"/>
<text x="285.6" y="108.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">швидкість: довжина ω·r,</text>
<text x="285.6" y="124.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">повернена на +90°</text>
<rect x="319.4" y="173.7" width="10.0" height="10.0" rx="0" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="470.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">проєкція положення → A·sin(ωt)</text>
<text x="470.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">проєкція швидкості → похідна:</text>
<text x="470.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">та сама синусоїда, але</text>
<text x="470.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• амплітуда помножена на ω</text>
<text x="470.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• фаза зсунута на +90°</text>
<text x="470.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">d/dt [A·sin(ωt)] = A·ω·sin(ωt + 90°)</text>
<text x="470.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">що швидше обертання (вища частота) —</text>
<text x="470.0" y="358.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">то більша швидкість: звідси ω</text>
<text x="470.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">у формулах Xc = 1/(ωC) і XL = ωL</text>
<text x="410.0" y="436.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">чотири похідні поспіль: sin → cos → −sin → −cos → sin — чотири кроки по 90°, повне коло</text>
</svg>
