<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Монотонний час (CLOCK_MONOTONIC) проти календарного (CLOCK_REALTIME)</text>
<text x="470.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">поведінка міток часу при мережевій синхронізації NTP / GNSS: стрибок назад проти неперервного зростання</text>
<text x="80.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Календарний час t_wall (Астрономічний UTC / Годинник на стіні)</text>
<line x1="80.0" y1="140.0" x2="880.0" y2="140.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="880.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Фізичний час перебігу подій →</text>
<line x1="160.0" y1="130.0" x2="160.0" y2="150.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="160.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">12:00:00</text>
<text x="160.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Подія A</text>
<line x1="360.0" y1="130.0" x2="360.0" y2="150.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="360.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">12:00:10</text>
<text x="360.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Подія B</text>
<line x1="520.0" y1="120.0" x2="520.0" y2="160.0" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="4 3"/>
<text x="520.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">NTP Step: корекція −15 с</text>
<path d="M 520 140 Q 440 90 360 130" fill="none" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<line x1="680.0" y1="130.0" x2="680.0" y2="150.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="680.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">11:59:58</text>
<text x="680.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Подія C (t_C &lt; t_B!)</text>
<rect x="130.0" y="187.3" width="780.0" height="45.3" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.3"/><text x="520.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">КАТАСТРОФА ОБЧИСЛЕННЯ ТРИВАЛОСТІ: Δt = t_C − t_B = −12 с &lt; 0 !</tspan><tspan x="520.0" dy="14.3">Переповнення unsigned 64-біт, зависання тайм-аутів у while(now &lt; deadline), інверсія логів</tspan></text>
<text x="80.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Монотонний час t_mono (Строго зростаючий лічильник тактів від старту)</text>
<line x1="80.0" y1="350.0" x2="880.0" y2="350.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="160.0" y1="340.0" x2="160.0" y2="360.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="160.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">100.000 с</text>
<text x="160.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">t_mono_A</text>
<line x1="360.0" y1="340.0" x2="360.0" y2="360.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="360.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">110.000 с</text>
<text x="360.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">t_mono_B</text>
<line x1="520.0" y1="330.0" x2="520.0" y2="370.0" stroke="#27ae60" stroke-width="2.0" stroke-dasharray="4 3"/>
<text x="520.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">NTP: оновлення base_offset (t_mono незмінний)</text>
<line x1="680.0" y1="340.0" x2="680.0" y2="360.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="680.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">118.000 с</text>
<text x="680.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">t_mono_C</text>
<rect x="130.0" y="402.4" width="780.0" height="45.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.3"/><text x="520.0" y="421.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">ГАРАНТІЯ МОНОТОННОСТІ: Δt = t_mono_C − t_mono_B = +8.000 с &gt; 0 завжди!</tspan><tspan x="520.0" dy="14.3">Календарний час обчислюється як t_wall = t_mono + base_offset. Монотонний лічильник ніколи не йде назад.</tspan></text>
</svg>