<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип плавного цифрового калібрування (Smooth Digital Calibration)</text>
<text x="470.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">рівномірне маскування або додавання тактів у вікні 2²⁰ (32 с) для корекції ходу з роздільністю 0.954 ppm</text>
<rect x="60.0" y="90.0" width="820.0" height="70.0" rx="6" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="470.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вікно калібрування: T_cal = 2²⁰ тактів = 1 048 576 імпульсів (~32 секунди)</text>
<text x="470.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Роздільність регулювання: 1 такт на вікно = 1 / 2²⁰ ≈ 0.9537 ppm (або ~0.082 с/добу)</text>
<rect x="60.0" y="185.0" width="820.0" height="115.0" rx="6" fill="#fdfefe" stroke="#c0392b" stroke-width="1.4"/>
