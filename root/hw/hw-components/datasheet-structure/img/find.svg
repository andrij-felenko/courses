<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320">
<rect width="700" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="350.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Де взяти даташит — і яку версію</text>
<rect x="60.0" y="138.0" width="150.0" height="50.0" rx="6" fill="#eef2f7" stroke="#7f93a8" stroke-width="1.6"/>
<text x="135.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">номер деталі</text>
<text x="135.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(part number)</text>
<line x1="210.0" y1="150.0" x2="300.0" y2="110.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<line x1="210.0" y1="176.0" x2="300.0" y2="216.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<rect x="300.0" y="80.0" width="360.0" height="70.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="320.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">✓ сайт виробника</text>
<text x="320.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">офіційний, найновіша ревізія,</text>
<text x="320.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">повний, із errata</text>
<rect x="300.0" y="190.0" width="360.0" height="70.0" rx="8" fill="#fbecec" stroke="#c0271e" stroke-width="1.5"/>
<text x="320.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">✗ випадковий PDF-сайт</text>
<text x="320.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">часто старий, чужий чи урізаний;</text>
<text x="320.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">буває — від підробки</text>
<text x="350.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Бери даташит із сайту виробника й перевіряй ревізію (дату/літеру) — стара версія може брехати про вже виправлене.</text>
</svg>
