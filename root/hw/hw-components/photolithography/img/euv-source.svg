<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Світло 13.5 нм: крапля олова під подвійним пострілом лазера</text>
<text x="70.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Один цикл — і так близько 50 000 разів за секунду:</text>
<line x1="120.0" y1="168.0" x2="148.0" y2="168.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="170.0" cy="168.0" r="13.0" fill="#dfe3ea" stroke="#1f47b5" stroke-width="2.0"/>
<text x="170.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="700">Sn</text>
<text x="170.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. летить крапля</text>
<text x="170.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">розплавлене олово,</text>
<text x="170.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">крапля ~25–30 мкм</text>
<line x1="300.0" y1="168.0" x2="392.0" y2="168.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="346.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">слабкий</text>
<ellipse cx="430" cy="168" rx="26" ry="9" fill="#dfe3ea" stroke="#1f47b5" stroke-width="2"/>
<text x="430.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2. попередній імпульс</text>
<text x="430.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">крапля стає пласким</text>
<text x="430.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">«млинцем» — більша ціль</text>
<line x1="560.0" y1="168.0" x2="662.0" y2="168.0" stroke="#c0392b" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="611.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">потужний</text>
<text x="611.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">CO₂-лазер</text>
<circle cx="700.0" cy="168.0" r="22.0" fill="#fff3d6" stroke="none" stroke-width="0.0"/>
<circle cx="700.0" cy="168.0" r="15.0" fill="#ffe8a8" stroke="none" stroke-width="0.0"/>
<circle cx="700.0" cy="168.0" r="8.0" fill="#ffffff" stroke="#caa24a" stroke-width="2.0"/>
<line x1="724.0" y1="168.0" x2="738.0" y2="168.0" stroke="#caa24a" stroke-width="2.0"/>
<line x1="720.8" y1="180.0" x2="732.9" y2="187.0" stroke="#caa24a" stroke-width="2.0"/>
<line x1="712.0" y1="188.8" x2="719.0" y2="200.9" stroke="#caa24a" stroke-width="2.0"/>
<line x1="700.0" y1="192.0" x2="700.0" y2="206.0" stroke="#caa24a" stroke-width="2.0"/>
<line x1="688.0" y1="188.8" x2="681.0" y2="200.9" stroke="#caa24a" stroke-width="2.0"/>
<line x1="679.2" y1="180.0" x2="667.1" y2="187.0" stroke="#caa24a" stroke-width="2.0"/>
<line x1="676.0" y1="168.0" x2="662.0" y2="168.0" stroke="#caa24a" stroke-width="2.0"/>
<line x1="679.2" y1="156.0" x2="667.1" y2="149.0" stroke="#caa24a" stroke-width="2.0"/>
<line x1="688.0" y1="147.2" x2="681.0" y2="135.1" stroke="#caa24a" stroke-width="2.0"/>
<line x1="700.0" y1="144.0" x2="700.0" y2="130.0" stroke="#caa24a" stroke-width="2.0"/>
<line x1="712.0" y1="147.2" x2="719.0" y2="135.1" stroke="#caa24a" stroke-width="2.0"/>
<line x1="720.8" y1="156.0" x2="732.9" y2="149.0" stroke="#caa24a" stroke-width="2.0"/>
<text x="700.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">3. головний імпульс</text>
<text x="700.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">плазма ~ десятки тисяч °C</text>
<text x="700.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#caa24a" text-anchor="middle" font-weight="700">світить на 13.5 нм (EUV)</text>
<rect x="70.0" y="300.0" width="800.0" height="28.0" rx="6" fill="#fbf7ee" stroke="#caa24a" stroke-width="1.6"/><text x="470.0" y="318.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Чому так дивно, а не просто «увімкнути лампу»?</tspan></text>
<text x="82.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• На 13.5 нм не світить жодна лампа й жоден лазер — цю хвилю доводиться добувати з гарячої плазми.</text>
<text x="82.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Мегаватний CO₂-лазер влучає в КОЖНУ краплю; попередній імпульс спершу розплескує її, щоб віддача світла зросла.</text>
<text x="82.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Лише ~кілька відсотків енергії лазера стає корисним EUV — решта йде в тепло; звідси гігантські лазер і охолодження.</text>
</svg>