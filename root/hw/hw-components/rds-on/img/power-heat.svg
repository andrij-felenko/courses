<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290">
<rect width="720" height="290" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="360.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Грійка ключа: P = Id² · Rds(on)</text>
<rect x="90.0" y="66.0" width="540.0" height="64.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="360.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="23" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">P = Id² · Rds(on)</text>
<text x="360.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Id = 10 А,   Rds(on) = 5 мОм</text>
<text x="360.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Vds = Id·Rds(on) = 10 · 0.005 = 0.05 В   (50 мВ)</text>
<text x="360.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">P = Id²·Rds(on) = 100 · 0.005 = 0.5 Вт   (холодний)</text>
<text x="360.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Менший Rds(on) → менший спад → менша грійка. Тому за нього й воюють виробники.</text>
</svg>
