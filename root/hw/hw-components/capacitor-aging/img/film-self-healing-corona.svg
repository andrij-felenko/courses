<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Самозаліковування та коронні розряди у плівкових конденсаторах</text>
<rect x="15.0" y="15.0" width="345.0" height="390.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="187.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Самозаліковування металізованої плівки</text>
<text x="187.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Випаровування шару Al/Zn (20–50 нм) довкола пробою</text>
<rect x="57.0" y="90.0" width="260.0" height="8.0" rx="1" fill="#a0aec0" stroke="#4a5568" stroke-width="1.0"/>
<text x="267.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="middle">Металізація Al (30 нм)</text>
<rect x="57.0" y="98.0" width="260.0" height="35.0" rx="2" fill="#edf2f7" stroke="#718096" stroke-width="1.2"/>
<text x="137.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поліпропіленова плівка (PP)</text>
<rect x="57.0" y="133.0" width="260.0" height="8.0" rx="1" fill="#a0aec0" stroke="#4a5568" stroke-width="1.0"/>
<circle cx="187.0" cy="116.0" r="18.0" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<line x1="187.0" y1="98.0" x2="187.0" y2="133.0" stroke="#c0392b" stroke-width="2.0"/>
<rect x="169.0" y="89.0" width="36.0" height="10.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="175.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">⚡ Пробій</text>
<text x="187.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Очищена зона</text>
<rect x="25.0" y="205.0" width="325.0" height="185.0" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.0"/>
<text x="187.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ціна надійності: Спад активної площі</text>
<text x="187.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Кожен мікропробій випаровує ~0.01–0.1 мм² металізації</text>
<text x="187.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">• Коротке замикання ліквідується за &lt; 10 мкс</text>
<text x="187.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">• Сумарна площа обкладинок безперервно спадає</text>
<text x="187.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">• Ємність C(t) монотонно падає (до −2%...−5% за EoL)</text>
<text x="187.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c53030" text-anchor="middle">• Окиснення Al вологою (Al + H₂O → Al(OH)₃) руйнує краї</text>
<text x="187.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• Руйнування торцевого контакту (schoopage) веде до росту ESR</text>
<rect x="375.0" y="15.0" width="370.0" height="390.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="560.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часткові розряди та корона (AC напруга)</text>
<text x="560.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Іонізація мікропустот між витками за високої напруги</text>
<rect x="430.0" y="90.0" width="260.0" height="18.0" rx="2" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="560.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Шар полімеру 1</text>
<rect x="430.0" y="108.0" width="260.0" height="30.0" rx="6" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.2"/>
<text x="510.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c05621" text-anchor="middle" font-weight="700">Мікропустота (каверна)</text>
<line x1="605.0" y1="110.0" x2="605.0" y2="136.0" stroke="#dd6b20" stroke-width="1.5" stroke-dasharray="2,2"/>
<text x="598.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dd6b20" text-anchor="middle">⚡</text>
<line x1="635.0" y1="110.0" x2="635.0" y2="136.0" stroke="#dd6b20" stroke-width="1.5" stroke-dasharray="2,2"/>
<text x="628.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dd6b20" text-anchor="middle">⚡</text>
<line x1="665.0" y1="110.0" x2="665.0" y2="136.0" stroke="#dd6b20" stroke-width="1.5" stroke-dasharray="2,2"/>
<text x="658.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dd6b20" text-anchor="middle">⚡</text>
<rect x="430.0" y="138.0" width="260.0" height="18.0" rx="2" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.2"/>
<text x="560.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Шар полімеру 2</text>
<rect x="385.0" y="205.0" width="350.0" height="185.0" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.0"/>
<text x="560.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хімічна деградація полімерних ланцюгів</text>
<text x="560.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">1. Напруженість E у повітрі: E_void = ε_r · E_diel</text>
<text x="560.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">2. Іонізація повітря перевищує поріг закону Пашена</text>
<text x="560.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">3. Генерація озону O₃ та оксидів азоту NO_x</text>
<text x="560.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">4. Окиснення поліпропілену → розрив C-C зв'язків</text>
<text x="560.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9b2c2c" text-anchor="middle" font-weight="700">5. Карбонізація діелектрика → локальний пробій плівки</text>
<text x="560.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Критично для мережевих X/Y конденсаторів та DC-link</text>
</svg>