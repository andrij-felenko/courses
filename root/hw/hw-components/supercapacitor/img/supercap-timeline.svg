<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580">
<rect width="800" height="580" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="400.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Іоністор: від лабораторної дивини до фарад у кожній шухляді</text>
<text x="400.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ідея чекала застосування понад століття — а ім'я отримала від відділу маркетингу</text>
<line x1="150.0" y1="102.0" x2="150.0" y2="522.0" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round"/>
<circle cx="150.0" cy="116.0" r="5.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<text x="134.0" y="121.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">1853</text>
<text x="168.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Гельмгольц описує подвійний шар на межі електрод–рідина</text>
<text x="168.0" y="131.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">ніхто не бачить у ньому накопичувача енергії</text>
<circle cx="150.0" cy="172.0" r="5.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<text x="134.0" y="177.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">1957</text>
<text x="168.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Бекер (General Electric): патент на «низьковольтний конденсатор»</text>
<text x="168.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">пористе вугілля; механізм у патенті чесно «невідомий»; без комерції</text>
<circle cx="150.0" cy="228.0" r="5.0" fill="#1f8a3b" stroke="#1b1b1b" stroke-width="0"/>
<text x="134.0" y="233.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">1962–66</text>
<text x="168.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Райтмаєр (SOHIO): патент на сучасний формат комірки</text>
<text x="168.0" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">нафтова компанія шукала нові накопичувачі — і знайшла</text>
<circle cx="150.0" cy="284.0" r="5.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<text x="134.0" y="289.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">1970</text>
<text x="168.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Бус (SOHIO): електроди з пасти активованого вугілля</text>
<text x="168.0" y="299.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">та сама конструкція, що працює донині</text>
<circle cx="150.0" cy="340.0" r="5.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<text x="134.0" y="345.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">1971</text>
<text x="168.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">SOHIO ліцензує технологію NEC</text>
<text x="168.0" y="355.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">звідти й торгове ім'я «Supercapacitor»</text>
<circle cx="150.0" cy="396.0" r="5.0" fill="#1f8a3b" stroke="#1b1b1b" stroke-width="0"/>
<text x="134.0" y="401.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">1978</text>
<text x="168.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Panasonic Goldcap: резерв живлення пам'яті</text>
<text x="168.0" y="411.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">перша масова ніша — мікроампери на дні (замість капризних батарейок)</text>
<circle cx="150.0" cy="452.0" r="5.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<text x="134.0" y="457.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">1980-ті</text>
<text x="168.0" y="450.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">«іоністори» в радянській літературі; ultracapacitor у США</text>
<text x="168.0" y="467.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">терміни множаться — компонент стає звичним</text>
<circle cx="150.0" cy="508.0" r="5.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<text x="134.0" y="513.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">1990-ті+</text>
<text x="168.0" y="506.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">тисячі фарад: транспорт, рекуперація, «останній подих»</text>
<text x="168.0" y="523.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">комірки великого формату виходять із годинників у силову техніку</text>
<text x="56.0" y="149.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#9a2b22" text-anchor="middle" font-weight="bold" font-style="normal">104 роки</text>
<text x="56.0" y="163.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#9a2b22" text-anchor="middle" font-weight="normal" font-style="normal">очікування</text>
</svg>
