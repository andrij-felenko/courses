<text x="56.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">Vlog</text>
<text x="300.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1)  обери β_forced ≈ 10</text>
<text x="300.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">2)  Ib = Ic / β_forced</text>
<text x="300.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">3)  Rб = (Vlog − Vbe) / Ib</text>
<text x="314.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">= β_forced·(Vlog − 0.7)/Ic</text>
<line x1="300.0" y1="180.0" x2="800.0" y2="180.0" stroke="#dddddd" stroke-width="1.0"/>
<text x="300.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Приклад: Ic = 100 мА, Vlog = 5 В</text>
<text x="300.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f6e33" text-anchor="start" font-weight="700">Ib = 100/10 = 10 мА</text>
<text x="300.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1f6e33" text-anchor="start" font-weight="700">Rб = (5 − 0.7)/10мА = 430 Ом → 390 Ом</text>
<text x="300.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9c6a16" text-anchor="start" font-weight="700">перевір: Ib ≤ Iвиводу МК (≈20–40 мА)?  так</text>
<text x="300.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9c6a16" text-anchor="start" font-weight="700">перевір: Vce(sat) &lt; 0.3 В у даташиті?  так</text>
<text x="300.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">не лізе → потрібен Дарлінгтон або MOSFET</text>
<text x="420.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Округляй Rб ВНИЗ (більше бази — безпечніше), та стеж, щоб струм бази не перевищив дозволений для виводу.</text>
