<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300">
<rect width="700" height="300" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="350.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Резистор бази: β мінімальне + запас струму</text>
<rect x="80.0" y="78.0" width="540.0" height="40.0" rx="6" fill="#fbfbfb" stroke="#c9d3dc" stroke-width="1.2"/>
<text x="102.0" y="103.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1)  Ic — потрібний струм навантаження</text>
<rect x="80.0" y="128.0" width="540.0" height="40.0" rx="6" fill="#fbfbfb" stroke="#c9d3dc" stroke-width="1.2"/>
<text x="102.0" y="153.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">2)  Ib(мін) = Ic / β(мін)   (мінімальне β з даташита)</text>
<rect x="80.0" y="178.0" width="540.0" height="40.0" rx="6" fill="#fbfbfb" stroke="#c9d3dc" stroke-width="1.2"/>
<text x="102.0" y="203.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">3)  запас:  Ib ≈ 3…10 × Ib(мін)</text>
<rect x="80.0" y="228.0" width="540.0" height="40.0" rx="6" fill="#fbfbfb" stroke="#c9d3dc" stroke-width="1.2"/>
<text x="102.0" y="253.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">4)  R = (U(сигналу) − 0.7) / Ib</text>
<text x="350.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Приклад: реле 60 мА, β(мін)=50 → Ib(мін)=1.2 мА → ×3 → R ≈ 1.2 кОм.</text>
</svg>
