<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="123.9" y="10.0" width="632.3" height="30.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="29.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Розподіл електронно-діркової плазми p(x) у дрейфовій базі PIN-структури</tspan></text>
<rect x="82.4" y="52.0" width="175.3" height="46.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="65.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e7e34" text-anchor="middle"><tspan x="170.0" dy="0.0">d / L_a = 1.0 (W_B = 2 L_a)</tspan><tspan x="170.0" dy="13.0">Повне рівномірне затоплення</tspan><tspan x="170.0" dy="13.0">p_min &gt;&gt; N_D → Мінімальне V_F</tspan></text>
<rect x="338.1" y="52.0" width="203.8" height="46.0" rx="6" fill="#cce5ff" stroke="#004085" stroke-width="1.5"/><text x="440.0" y="65.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#004085" text-anchor="middle"><tspan x="440.0" dy="0.0">d / L_a = 2.5 (W_B = 5 L_a)</tspan><tspan x="440.0" dy="13.0">Помірний провал у центрі бази</tspan><tspan x="440.0" dy="13.0">p(0) падає у 10 разів, V_F зростає</tspan></text>
<rect x="593.9" y="52.0" width="232.3" height="46.0" rx="6" fill="#f8d7da" stroke="#dc3545" stroke-width="1.5"/><text x="710.0" y="65.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#721c24" text-anchor="middle"><tspan x="710.0" dy="0.0">d / L_a = 5.0 (W_B = 10 L_a)</tspan><tspan x="710.0" dy="13.0">Рекомбінація не пускає носії в центр</tspan><tspan x="710.0" dy="13.0">p(0) ≈ N_D → катастрофічний стрибок V_F</tspan></text>
<rect x="60.0" y="125.0" width="750.0" height="320.0" rx="4" fill="none" stroke="#ced4da" stroke-width="1.2"/>
<line x1="90.0" y1="410.0" x2="790.0" y2="410.0" stroke="#333333" stroke-width="1.8"/>
<line x1="90.0" y1="140.0" x2="90.0" y2="410.0" stroke="#333333" stroke-width="1.8"/>
<text x="80.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Концентрація носіїв p(x), см⁻³ (log scale)</text>
<text x="440.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Координата у товщі дрейфової бази x (від анода -d до катода +d)</text>
<line x1="140.0" y1="410.0" x2="140.0" y2="140.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="140.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#721c24" text-anchor="middle" font-weight="700">x = -d (p⁺ анод)</text>
<line x1="740.0" y1="410.0" x2="740.0" y2="140.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="740.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e7e34" text-anchor="middle" font-weight="700">x = +d (n⁺ катод)</text>
<line x1="440.0" y1="410.0" x2="440.0" y2="140.0" stroke="#d0d7de" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="440.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">x = 0 (центр)</text>
<line x1="90.0" y1="380.0" x2="790.0" y2="380.0" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="730.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#555555" text-anchor="end">Фонове легування N_D ≈ 10¹⁴ см⁻³</text>
