<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 710 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="710" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один зв’язок у два боки: похідна (i) та інтеграл (V)</text>
<rect x="98.3" y="78.2" width="153.4" height="83.7" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.8"/><text x="175.0" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">ДАНО: напруга V(t)</tspan><tspan x="175.0" dy="16.9"></tspan><tspan x="175.0" dy="16.9">струм = похідна V</tspan><tspan x="175.0" dy="16.9">i = C · dV/dt</tspan></text>
<text x="175.0" y="66.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">диференціювання</text>
<rect x="440.9" y="78.2" width="168.2" height="83.7" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.8"/><text x="525.0" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">ДАНО: струм i(t)</tspan><tspan x="525.0" dy="16.9"></tspan><tspan x="525.0" dy="16.9">напруга = інтеграл i</tspan><tspan x="525.0" dy="16.9">V = (1/C) ∫ i dt</tspan></text>
<text x="525.0" y="66.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">накопичення</text>
<line x1="257.7" y1="108.0" x2="434.9" y2="108.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="346.3" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">d/dt</text>
<line x1="434.9" y1="134.0" x2="257.7" y2="134.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="346.3" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-style="italic">∫ dt</text>
<text x="346.3" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">обернені</text>
<rect x="35.0" y="250.0" width="190.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.4"/><text x="130.0" y="276.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Диференціатор</tspan><tspan x="130.0" dy="14.3">реагує на стрибок,</tspan><tspan x="130.0" dy="14.3">передній фронт</tspan></text>
<rect x="255.0" y="250.0" width="190.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.4"/><text x="350.0" y="276.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Інтегратор</tspan><tspan x="350.0" dy="14.3">накопичує струм,</tspan><tspan x="350.0" dy="14.3">плавний сигнал</tspan></text>
<rect x="475.0" y="250.0" width="190.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.4"/><text x="570.0" y="276.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">RC-затримка</tspan><tspan x="570.0" dy="14.3">фільтр, антидребезг,</tspan><tspan x="570.0" dy="14.3">витримка часу</tspan></text>
<text x="350.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де це працює</text>
</svg>