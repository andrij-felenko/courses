<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 690 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="690" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="340.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Водяна аналогія: рівень = напруга, потік = струм, дно = ємність</text>
<rect x="120.0" y="80.0" width="200.0" height="230.0" rx="4" fill="#eef6ff" stroke="#1a1a1a" stroke-width="2.2"/>
<rect x="123.0" y="176.6" width="194.0" height="130.4" rx="6" fill="#bfe0ff" stroke="none" stroke-width="0.0"/>
<line x1="120.0" y1="176.6" x2="320.0" y2="176.6" stroke="#2457d6" stroke-width="2.0"/>
<line x1="336.0" y1="310.0" x2="336.0" y2="176.6" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="344.0" y="243.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700" font-style="italic">V</text>
<text x="344.0" y="259.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">(рівень</text>
<text x="344.0" y="271.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">= заряд Q)</text>
<line x1="120.0" y1="324.0" x2="320.0" y2="324.0" stroke="#27ae60" stroke-width="1.6"/>
<text x="220.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">C — площа дна (ємність)</text>
<text x="220.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ширший бак → той самий потік підіймає рівень повільніше</text>
<rect x="30.0" y="146.6" width="92.0" height="22.0" rx="3" fill="#dff5e6" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="34.0" y1="157.6" x2="114.0" y2="157.6" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="76.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">i — потік</text>
<text x="76.0" y="186.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">(струм)</text>
<rect x="397.4" y="108.2" width="205.2" height="83.7" rx="6" fill="#fff8e1" stroke="#f0b429" stroke-width="1.4"/><text x="500.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">потік = площа × швидкість</tspan><tspan x="500.0" dy="16.9">підйому рівня</tspan><tspan x="500.0" dy="16.9"></tspan><tspan x="500.0" dy="16.9">i = C · dV/dt</tspan></text>
<line x1="395.4" y1="150.0" x2="390.0" y2="150.0" stroke="#6b7280" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="340.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Межа аналогії: вода не «всмоктується назад» при спаді рівня, а реальний конденсатор при dV/dt&lt;0 віддає струм назад (i&lt;0).</text>
</svg>