<text x="655.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Лавинний пробій (Avalanche, V_Z &gt; 5.6 В)</text>
