<rect x="45.0" y="330.0" width="360.0" height="85.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="354.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Температурний коефіцієнт (ТКН &lt; 0):</tspan><tspan x="225.0" dy="14.3">З нагріванням заборонена зона E_g звужується,</tspan><tspan x="225.0" dy="14.3">електронам легше тунелювати → напруга V_Z ПАДАЄ.</tspan><tspan x="225.0" dy="14.3">ТКН ≈ -1.5 ... -2 мВ/°C</tspan></text>
