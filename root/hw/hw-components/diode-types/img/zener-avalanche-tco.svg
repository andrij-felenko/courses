<rect x="45.0" y="95.0" width="360.0" height="65.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="225.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">• Високе легування (N_A, N_D &gt; 10¹⁸ см⁻³)</tspan><tspan x="225.0" dy="14.3">• Збіднений шар ультратонкий: W &lt; 10 нм</tspan><tspan x="225.0" dy="14.3">• Напруженість поля величезна: E &gt; 10⁶ В/см</tspan></text>
