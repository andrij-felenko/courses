<rect x="475.0" y="330.0" width="360.0" height="85.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="655.0" y="354.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Температурний коефіцієнт (ТКН &gt; 0):</tspan><tspan x="655.0" dy="14.3">З нагріванням коливання ґратки розсіюють електрони,</tspan><tspan x="655.0" dy="14.3">довжина вільного пробігу падає → потрібна більша V_Z.</tspan><tspan x="655.0" dy="14.3">ТКН ≈ +2 ... +5 мВ/°C (ідеальний баланс біля 5.6 В!)</tspan></text>
