<rect x="428.4" y="201.3" width="363.1" height="67.4" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="610.0" y="218.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Фаза 2: Робочий режим (Vcc = 15 В)</tspan><tspan x="610.0" dy="13.7">• Додаткова обмотка живить ШІМ, Vcc = 15 В</tspan><tspan x="610.0" dy="13.7">• V_витоку = 15 В → Vgs = 0 − 15 = −15 В ≪ Vth</tspan><tspan x="610.0" dy="13.7">• Q_start ПОВНІСТЮ ЗАКРИТИЙ! Втрати холостого ходу = 0 Вт.</tspan></text>
<text x="410.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Традиційний резистор 100 кОм давав 1.6 Вт постійного нагріву; збіднений MOSFET споживає &lt; 1 мВт.</text>
