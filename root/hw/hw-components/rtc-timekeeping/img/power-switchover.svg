<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема автоматичного перемикання резервного живлення (Power Switchover)</text><rect x="30.0" y="55.0" width="840.0" height="335.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="60.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">VCC (3.3V / 5V)</text><line x1="50.0" y1="115.0" x2="120.0" y2="115.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="120.0" y1="115.0" x2="120.0" y2="160.0" stroke="#333333" stroke-width="1.5"/><rect x="113.0" y="160.0" width="14.0" height="25.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><line x1="120.0" y1="185.0" x2="120.0" y2="205.0" stroke="#333333" stroke-width="1.5"/><rect x="113.0" y="205.0" width="14.0" height="25.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><line x1="120.0" y1="230.0" x2="120.0" y2="245.0" stroke="#333333" stroke-width="1.5"/><line x1="113.0" y1="245.0" x2="127.0" y2="245.0" stroke="#333333" stroke-width="1.5"/><polygon points="200,170 200,230 250,200" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+</text><text x="210.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">−</text><line x1="120.0" y1="185.0" x2="200.0" y2="185.0" stroke="#333333" stroke-width="1.5"/><rect x="135.0" y="215.0" width="55.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="162.5" y="227.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="162.5" dy="0.0">V_ref</tspan><tspan x="162.5" dy="11.7">1.25V</tspan></text><line x1="190.0" y1="220.0" x2="200.0" y2="220.0" stroke="#333333" stroke-width="1.5"/><rect x="280.0" y="165.0" width="140.0" height="75.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="350.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Логіка вибору</tspan><tspan x="350.0" dy="13.0">та захист від</tspan><tspan x="350.0" dy="13.0">брязкоту (Hysteresis)</tspan></text><line x1="250.0" y1="200.0" x2="280.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="120.0" y1="115.0" x2="450.0" y2="115.0" stroke="#c0392b" stroke-width="2.0"/><rect x="450.0" y="95.0" width="60.0" height="40.0" rx="3" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">P-MOS</text><text x="480.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(SW1)</text><rect x="450.0" y="265.0" width="60.0" height="40.0" rx="3" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">P-MOS</text><text x="480.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(SW2)</text><line x1="350.0" y1="165.0" x2="350.0" y2="115.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="350.0" y1="115.0" x2="450.0" y2="115.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><text x="400.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ctrl VCC</text><line x1="350.0" y1="240.0" x2="350.0" y2="285.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="350.0" y1="285.0" x2="450.0" y2="285.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><text x="400.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ctrl VBAT</text><text x="60.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">VBAT (CR2032 / Supercap)</text><line x1="50.0" y1="285.0" x2="120.0" y2="285.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="120.0" y1="285.0" x2="450.0" y2="285.0" stroke="#2457d6" stroke-width="2.0"/><line x1="510.0" y1="115.0" x2="600.0" y2="115.0" stroke="#333333" stroke-width="2.0"/><line x1="510.0" y1="285.0" x2="600.0" y2="285.0" stroke="#333333" stroke-width="2.0"/><line x1="600.0" y1="115.0" x2="600.0" y2="285.0" stroke="#333333" stroke-width="2.0"/><line x1="600.0" y1="200.0" x2="660.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="660.0" y="160.0" width="180.0" height="85.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="750.0" y="184.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Ядро RTC (V_RTC)</tspan><tspan x="750.0" dy="14.3">Генератор 32 кГц</tspan><tspan x="750.0" dy="14.3">Дільник &amp; Лічильники</tspan><tspan x="750.0" dy="14.3">I_core ≈ 150-300 нА</tspan></text><rect x="200.0" y="80.0" width="170.0" height="50.0" rx="3" fill="#edf7ed" stroke="#27ae60" stroke-width="1.5"/><text x="285.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Trickle Charger (опція)</text><text x="285.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Діод + Резистор (250Ω - 4kΩ)</text><rect x="40.0" y="315.0" width="390.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="339.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Режим 1: VCC &gt; V_th → SW1 закрито, SW2 відкрито.</tspan><tspan x="235.0" dy="13.0">RTC живиться від мережі, батарейка розвантажена.</tspan></text><rect x="450.0" y="315.0" width="400.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="339.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Режим 2: VCC &lt; V_th → SW1 відкрито, SW2 закрито.</tspan><tspan x="650.0" dy="13.0">RTC безшовно перемикається на батарейку VBAT.</tspan></text>
</svg>