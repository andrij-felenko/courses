<circle cx="645.0" cy="110.0" r="4.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="645.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">пік β</text>
<text x="630.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">β провисає на малих і великих Ic (§2.6.4)</text>
<text x="420.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Так ви бачите не «одне число», а реальне β саме там, де працюватиме ваша схема — і його розкид.</text>
</svg>
