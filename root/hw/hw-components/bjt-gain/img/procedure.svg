  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="420.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Метод «двох точок»: кроки, перевірка й крива β(Ic)</text>
<rect x="40.0" y="54.0" width="380.0" height="300.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="230.0" y="48.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">процедура</text>
<text x="62.0" y="88.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1) Rb від Vbb до бази задає Ib;</text>
<text x="62.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    Ib = (Vbb − 0.7)/Rb  (або виміряй)</text>
<text x="62.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">2) Rc у колекторі; виміряй Vc,</text>
<text x="62.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    тоді Ic = (Vcc − Vc)/Rc</text>
<text x="62.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">3) β = Ic / Ib</text>
<text x="62.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#9a2b22" text-anchor="start" font-weight="bold" font-style="normal">4) ПЕРЕВІР: Vce = Vc має бути</text>
<text x="62.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">    помітна (кілька В) — активний режим!</text>
<text x="62.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#9a2b22" text-anchor="start" font-weight="normal" font-style="normal">    Vce ≈ 0 → насичення, β занижене</text>
<text x="230.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Ib зручно ~таким, як у майбутній схемі</text>
<rect x="440.0" y="54.0" width="360.0" height="300.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="620.0" y="48.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">повтори на кількох Ic → побачиш криву</text>
<line x1="480.0" y1="290.0" x2="780.0" y2="290.0" stroke="#1b1b1b" stroke-width="1.3" stroke-linecap="round"/>
<text x="780.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Ic (лог)</text>
<line x1="480.0" y1="290.0" x2="480.0" y2="104.0" stroke="#1b1b1b" stroke-width="1.3" stroke-linecap="round"/>
<text x="474.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">β</text>
