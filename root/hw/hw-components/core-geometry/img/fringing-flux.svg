<text x="425.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Локальний перегрів!</text>
<text x="425.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">Вихрові струми в міді</text>
<rect x="410.0" y="88.0" width="360.0" height="73.9" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="590.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">1. Фізична причина ефекту:</tspan><tspan x="590.0" dy="14.3">Магнітні лінії випинаються назовні, бо повітря</tspan><tspan x="590.0" dy="14.3">навколо зазору має ту саму проникність μ₀.</tspan><tspan x="590.0" dy="14.3">Ефективна площа зазору стає більшою: Agap &gt; Ae.</tspan></text>
<rect x="410.0" y="188.1" width="360.0" height="73.9" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/><text x="590.0" y="207.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">2. Небезпека для обмотки:</tspan><tspan x="590.0" dy="14.3">Змінний потік перетинає провідники ПЕРПЕНДИКУЛЯРНО.</tspan><tspan x="590.0" dy="14.3">Це наводить потужні вихрові струми прямо в тілі міді</tspan><tspan x="590.0" dy="14.3">та спричиняє катастрофічний локальний перегрів.</tspan></text>
<rect x="410.0" y="288.1" width="360.0" height="73.9" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="307.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">3. Конструктивні заходи захисту:</tspan><tspan x="590.0" dy="14.3">• Залишати захисний проміжок (Keep-out) біля зазору</tspan><tspan x="590.0" dy="14.3">• Робити зазор лише на центральному керні</tspan><tspan x="590.0" dy="14.3">• Використовувати літцендрат замість товстого моноліту</tspan></text>
