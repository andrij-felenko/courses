<rect x="252.0" y="175.0" width="40.0" height="130.0" rx="2" fill="#fbecec" stroke="#c0392b" stroke-width="1.4"/>
<text x="148.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Обмотка</text>
<text x="272.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Обмотка</text>
