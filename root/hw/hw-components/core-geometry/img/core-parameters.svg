<text x="210.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Площа Ae</text>
<line x1="245.0" y1="328.0" x2="300.0" y2="328.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="245.0" y1="322.0" x2="245.0" y2="334.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="300.0" y1="322.0" x2="300.0" y2="334.0" stroke="#c0392b" stroke-width="1.8"/>
<text x="272.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Вікно Aw</text>
<rect x="447.0" y="75.2" width="346.0" height="59.6" rx="6" fill="#f0f7ff" stroke="#3b82f6" stroke-width="1.5"/><text x="620.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Ae (Effective Area) — площа перерізу керна</tspan><tspan x="620.0" dy="14.3">Визначає максимальний магнітний потік: Φ = B · Ae</tspan><tspan x="620.0" dy="14.3">Більша площа → менше витків N для заданої індукції B</tspan></text>
<rect x="443.8" y="160.2" width="352.3" height="59.6" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="179.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">le (Magnetic Path) — середня магнітна лінія</tspan><tspan x="620.0" dy="14.3">Довжина замкненого шляху магнітного потоку</tspan><tspan x="620.0" dy="14.3">Коротша le → менший магнітний опір Rm = le / (μ · Ae)</tspan></text>
<rect x="450.0" y="245.2" width="340.0" height="59.6" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="264.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Aw (Window Area) — площа вікна намотки</tspan><tspan x="620.0" dy="14.3">Простір для розміщення мідного дроту та ізоляції</tspan><tspan x="620.0" dy="14.3">Фактор заповнення: ku = S_міді / Aw ≈ 0.25...0.40</tspan></text>
<rect x="424.6" y="334.3" width="390.8" height="61.4" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="620.0" y="354.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Area Product:  Ap = Aw · Ae  [см⁴]</tspan><tspan x="620.0" dy="15.0">Головний показник габаритної потужності P_габ ∝ Ap</tspan><tspan x="620.0" dy="15.0">Пов'язує втрати в магнетику та теплові втрати в міді</tspan></text>
</svg>