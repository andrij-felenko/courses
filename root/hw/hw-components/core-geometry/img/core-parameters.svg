<rect x="180.0" y="165.0" width="60.0" height="150.0" rx="1" fill="#d0d7de" stroke="#495057" stroke-width="1.2"/>
<text x="210.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Центральний</text>
