<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 780 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="780" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дератинг конденсаторів за типами діелектрика</text>
<rect x="0.0" y="0.0" width="760.0" height="360.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="40.0" y="40.0" width="680.0" height="60.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="56.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Тантал (MnO₂)</text>
<text x="270.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">V_раб / V_ном ≤ 50 % (0.50)</text>
<text x="56.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Екзотермічний пробій діелектрика Ta₂O₅; горіння MnO₂ катода при стрибках напруги.</text>
<rect x="40.0" y="112.0" width="680.0" height="60.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="56.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Тантал (Полімер)</text>
<text x="270.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="start" font-weight="700">V_раб / V_ном ≤ 70–80 % (0.70)</text>
<text x="56.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Полімерний провідний катод не підтримує горіння; вища стійкість до кидків струму.</text>
<rect x="40.0" y="184.0" width="680.0" height="60.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="56.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Кераміка (MLCC X7R/X5R)</text>
<text x="270.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">V_раб / V_ном ≤ 60–70 % (0.60)</text>
<text x="56.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Врахування ефекту DC-bias (падіння C на 50–80 %); захист від мікротріщин та п'єзо-ефекту.</text>
<rect x="40.0" y="256.0" width="680.0" height="60.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="56.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Алюмінієвий електроліт</text>
<text x="270.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">V_раб / V_ном ≤ 70–80 % (0.70)</text>
<text x="56.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Запас за напругою + жорсткий дератинг струму пульсацій I_ripple (≤ 70 %) для запобігання висиханню.</text>
<text x="380.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Правила дератингу напруги для основних класів конденсаторів за стандартами MIL-HDBK-338B та IPC-9592B</text>
</svg>