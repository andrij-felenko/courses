<rect x="506.5" y="63.5" width="177.0" height="153.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="595.0" y="81.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Розподіл втрат за Бертотті</tspan><tspan x="595.0" dy="12.3"></tspan><tspan x="595.0" dy="12.3">P_v = P_h + P_e + P_exc</tspan><tspan x="595.0" dy="12.3"></tspan><tspan x="595.0" dy="12.3">• P_h = W_h · f (площа петлі)</tspan><tspan x="595.0" dy="12.3">• P_e = C_e · f² · B² / ρ</tspan><tspan x="595.0" dy="12.3">• P_exc = C_exc · f¹·⁵ · B¹·⁵</tspan><tspan x="595.0" dy="12.3"></tspan><tspan x="595.0" dy="12.3">Рівняння Штейнмеца:</tspan><tspan x="595.0" dy="12.3">P_v = C_m · f^α · B^β</tspan><tspan x="595.0" dy="12.3">(α ≈ 1.3–2.0, β ≈ 2.0–2.8)</tspan></text>
