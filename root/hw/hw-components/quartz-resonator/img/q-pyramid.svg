<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470">
<rect width="900" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Сходи добротності: від RC-генератора до кварцу — і що це дає</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">що вища Q, то вужча смуга «дозволених» частот навколо f₀ — і то стабільніша нота</text>
<text x="70.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">RC-ланцюжок у чипі</text>
<text x="70.0" y="141.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Q ≈ 1</text>
<rect x="250.0" y="104.0" width="67.2" height="44.0" rx="6" fill="#efefef" stroke="#8a8a8a" stroke-width="2.2"/>
<text x="307.2" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">Q</text>
<text x="688.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">± кілька %</text>
<text x="70.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">LC-контур</text>
<text x="70.0" y="209.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="normal" font-style="normal">Q ≈ 10²</text>
<rect x="250.0" y="172.0" width="126.0" height="44.0" rx="6" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="366.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">Q</text>
<text x="688.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">≈ 1%  (10⁴ ppm)</text>
<text x="70.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Керамічний резонатор</text>
<text x="70.0" y="277.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#b5732e" text-anchor="start" font-weight="normal" font-style="normal">Q ≈ 10³</text>
<rect x="250.0" y="240.0" width="193.2" height="44.0" rx="6" fill="#f6ede2" stroke="#b5732e" stroke-width="2.2"/>
<text x="433.2" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#b5732e" text-anchor="end" font-weight="bold" font-style="normal">Q</text>
<text x="688.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#b5732e" text-anchor="start" font-weight="bold" font-style="normal">≈ 0.5%  (5000 ppm)</text>
<text x="70.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Кварцовий резонатор</text>
<text x="70.0" y="345.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">Q ≈ 10⁴…10⁶</text>
<rect x="250.0" y="308.0" width="310.8" height="44.0" rx="6" fill="#e9eefb" stroke="#1f47b5" stroke-width="2.2"/>
<text x="550.8" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">Q</text>
<text x="688.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">10…100 ppm</text>
<text x="70.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Кварц у термостаті (OCXO)</text>
<text x="70.0" y="413.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">Q дуже висока</text>
<rect x="250.0" y="376.0" width="403.2" height="44.0" rx="6" fill="#fbecec" stroke="#c0271e" stroke-width="2.2"/>
<text x="643.2" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">Q</text>
<text x="688.0" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">&lt; 0.01 ppm</text>
<line x1="232.0" y1="432.0" x2="232.0" y2="90.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="220.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic" transform="rotate(-90 220.0 266.0)">зростання Q</text>
<text x="460.0" y="82.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">відносна добротність (брусок ∝ log Q)</text>
<text x="688.0" y="82.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">орієнтир стабільності</text>
<text x="450.0" y="450.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Q сама не задає точність абсолютно — але задає, наскільки міцно генератор тримається своєї f₀ проти шуму й збурень</text>
</svg>
