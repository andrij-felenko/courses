<text x="360.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Заряд затвора Qg: «відерце», яке наповнюють і спорожнюють</text>
