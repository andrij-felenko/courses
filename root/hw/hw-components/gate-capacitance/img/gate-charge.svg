<text x="360.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Увімкнути = наповнити затвор зарядом Qg; вимкнути = спорожнити. Qg (нКл) — паспортна «місткість відерця».</text>
