<line x1="364.0" y1="74.0" x2="390.0" y2="74.0" stroke="#27ae60" stroke-width="3.0"/>
<rect x="130.0" y="120.0" width="220.0" height="78.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="240.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">сімейство приладу</text>
<text x="240.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">головна частина: який це</tspan><tspan x="240.0" dy="15.0">транзистор, діод чи мікросхема</tspan></text>
<rect x="370.0" y="120.0" width="220.0" height="78.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="480.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">суфікс варіанта</text>
<text x="480.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">уточнює різновид: підтип,</tspan><tspan x="480.0" dy="15.0">підсилення, клас напруги</tspan></text>
<rect x="130.0" y="218.0" width="220.0" height="56.0" rx="6" fill="#f3f3f3" stroke="#6b7280" stroke-width="1.4"/>
<text x="240.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">дата / партія</text>
<text x="240.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">до типу приладу не стосується —</text>
<text x="240.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">при декодуванні відкидають</text>
<rect x="370.0" y="218.0" width="220.0" height="56.0" rx="6" fill="#fdf6e3" stroke="#e0a32e" stroke-width="1.4"/>
