<text x="360.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три ролі всередині коду (плюс мітка піна 1 окремо)</text>
<text x="360.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="46" fill="#1a1a1a" text-anchor="middle" font-weight="700">A7W</text>
