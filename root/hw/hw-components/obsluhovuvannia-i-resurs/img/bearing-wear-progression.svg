<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прогресія деградації кулькових підшипників BLDC-двигунів</text>
<rect x="20.0" y="50.0" width="240.0" height="140.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="140.0" y="97.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Фаза 1: Новий вузол</tspan><tspan x="140.0" dy="13.0">• Непошкоджена мастильна плівка</tspan><tspan x="140.0" dy="13.0">• Гідродинамічний контакт кульок</tspan><tspan x="140.0" dy="13.0">• Радіальний люфт &lt; 5 мкм</tspan><tspan x="140.0" dy="13.0">• Фоновий спектр вібрацій (1x оберти)</tspan></text>
<line x1="265.0" y1="120.0" x2="285.0" y2="120.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="275.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">T &gt; 80°C, пил</text>
<rect x="290.0" y="50.0" width="240.0" height="140.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="410.0" y="95.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Фаза 2: Деградація мастила</tspan><tspan x="410.0" dy="14.3">• Випаровування базового масла</tspan><tspan x="410.0" dy="14.3">• Абразивне стирання пилом</tspan><tspan x="410.0" dy="14.3">• Мікропітинг (точкові каверни)</tspan><tspan x="410.0" dy="14.3">• Зростання люфту до 10–15 мкм</tspan></text>
<line x1="535.0" y1="120.0" x2="555.0" y2="120.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="545.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Втома металу</text>
<rect x="560.0" y="50.0" width="240.0" height="140.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="680.0" y="95.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Фаза 3: Втомний знос і люфт</tspan><tspan x="680.0" dy="14.3">• Сколювання металу (spalling)</tspan><tspan x="680.0" dy="14.3">• Радіальний люфт &gt; 25–40 мкм</tspan><tspan x="680.0" dy="14.3">• Стрибок гармонік BPFI/BPFO</tspan><tspan x="680.0" dy="14.3">• Вібраційний шум у гіроскопі</tspan></text>
<rect x="20.0" y="215.0" width="780.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Діагностика підшипникового вузла без розбирання мотора:</tspan><tspan x="410.0" dy="14.3">1. Тактильний тест: осьове та радіальне похитування дзвона ротора виявляє люфт понад 15 мкм.</tspan><tspan x="410.0" dy="14.3">2. Акустичний контроль: шелест і металеве цокотіння на вибігу свідчать про сухе тертя кульок.</tspan><tspan x="410.0" dy="14.3">3. FFT-аналіз логів польотного контролера: поява несиметричних піків вібрацій D-терма на частотах комутації.</tspan></text>
</svg>