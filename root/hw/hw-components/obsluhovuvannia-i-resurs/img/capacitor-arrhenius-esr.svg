<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Термічна деградація електролітичних конденсаторів та зростання ESR</text>
<rect x="20.0" y="50.0" width="370.0" height="150.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="205.0" y="85.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Закон Арреніуса для рідкого електроліту:</tspan><tspan x="205.0" dy="14.3">Кожні 10°C зниження робочої температури</tspan><tspan x="205.0" dy="14.3">подвоюють термін служби компонента:</tspan><tspan x="205.0" dy="14.3"></tspan><tspan x="205.0" dy="14.3">• T = 105°C (номінал):  2 000 год (~83 доби)</tspan><tspan x="205.0" dy="14.3">• T = 85°C  (помірний):  8 000 год (~333 доби)</tspan><tspan x="205.0" dy="14.3">• T = 65°C  (холодний): 32 000 год (~3.6 року)</tspan></text>
<rect x="410.0" y="50.0" width="390.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="605.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Ланцюг деградаційних відмов у силовій шині:</tspan><tspan x="605.0" dy="13.0">1. Випаровування розчинника крізь гумовий ущільнювач</tspan><tspan x="605.0" dy="13.0">2. Зростання еквівалентного послідовного опору (ESR 3x–5x)</tspan><tspan x="605.0" dy="13.0">3. Збільшення саморозігріву: P_loss = I_rms² · ESR</tspan><tspan x="605.0" dy="13.0">4. Втрата ємності (ΔC &gt; -20%) та стрибки напруги комутації</tspan><tspan x="605.0" dy="13.0">5. Пробій польових транзисторів (MOSFET) регулятора швидкості</tspan></text>
<rect x="20.0" y="220.0" width="780.0" height="105.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="255.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Порівняння ресурсних характеристик фільтрувальних конденсаторів:</tspan><tspan x="410.0" dy="13.7">• Рідкий електроліт (Al-Cap): критичний до температури й вібрації; відмова — висихання та вибух від надлишкового тиску газів.</tspan><tspan x="410.0" dy="13.7">• Твердотільний полімер (Solid Polymer): напівпровідниковий провідний полімер не висихає; ресурс при 85°C перевищує 50 000 год.</tspan><tspan x="410.0" dy="13.7">• Кераміка (MLCC): відсутність хімічного старіння рідини, проте вразливість до тріщин при згинанні друкованої плати.</tspan></text>
</svg>