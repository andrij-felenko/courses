<rect x="580.0" y="50.0" width="210.0" height="130.0" rx="6" fill="#fdecea" stroke="none" stroke-width="1.5"/>
<line x1="30.0" y1="180.0" x2="790.0" y2="180.0" stroke="#333333" stroke-width="2.0"/>
<line x1="30.0" y1="50.0" x2="30.0" y2="180.0" stroke="#333333" stroke-width="2.0"/>
<text x="780.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="end">Час (год)</text>
<text x="35.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Інтенсивність відмов λ(t)</text>
<line x1="40.0" y1="65.0" x2="90.0" y2="120.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="90.0" y1="120.0" x2="270.0" y2="155.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="270.0" y1="155.0" x2="580.0" y2="155.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="580.0" y1="155.0" x2="690.0" y2="120.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="690.0" y1="120.0" x2="770.0" y2="65.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="150.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">I. Ранні відмови (0–5 год)</text>
<text x="150.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Брак пайки, дефекти збірки</text>
<text x="425.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">II. Корисна робота (5–100 год)</text>
<text x="425.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Низький випадковий рівень відмов</text>
<text x="685.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">III. Знос (&gt; 100 год)</text>
<text x="685.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Підшипники, електроліти, роз'єми</text>
<rect x="20.0" y="200.0" width="780.0" height="140.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="242.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Регламент технічного обслуговування безпілотного апарата:</tspan><tspan x="410.0" dy="12.3">• 0 год (Передпольотний огляд): перевірка цілісності силових роз'ємів, відсутності нагару, люфтів двигунів і здуття LiPo.</tspan><tspan x="410.0" dy="12.3">• 25 год: спектральний аналіз вібрацій у логах (пошук розбалансування й люфту), перевірка затяжки кріплень із фіксатором різьби.</tspan><tspan x="410.0" dy="12.3">• 50–75 год: інспекція деградації електролітичних конденсаторів (ESR-метр), перевірка зворотного зв'язку сервоприводів.</tspan><tspan x="410.0" dy="12.3">• 100 год: планова заміна підшипників BLDC-моторів, аудит ресурсних лічильників Flash-пам'яті, заміна зношених конекторів.</tspan><tspan x="410.0" dy="12.3">• 200 год: повний капітальний огляд, заміна силової проводки, перепайка електролітів, дефектовка структури рами.</tspan></text>
</svg>