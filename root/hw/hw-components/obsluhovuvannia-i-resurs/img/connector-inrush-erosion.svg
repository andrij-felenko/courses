<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізика зносу роз'ємів: дугова ерозія, фретинг і термічна деградація</text>
<rect x="20.0" y="50.0" width="245.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="142.5" y="93.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="142.5" dy="0.0">1. Комутаційна ерозія</tspan><tspan x="142.5" dy="14.3">• Пусковий струм 150–300 А</tspan><tspan x="142.5" dy="14.3">• Заряд вхідних ємностей ESC</tspan><tspan x="142.5" dy="14.3">• Мікродуга (T &gt; 5000 K)</tspan><tspan x="142.5" dy="14.3">• Випаровування позолоти</tspan><tspan x="142.5" dy="14.3">• Нагар та кратери на вістрі</tspan></text>
<rect x="285.0" y="50.0" width="250.0" height="150.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="410.0" y="93.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">2. Вібраційна втома</tspan><tspan x="410.0" dy="14.3">• Вібрації 100–500 Гц на рамі</tspan><tspan x="410.0" dy="14.3">• Фретинг-корозія контактів</tspan><tspan x="410.0" dy="14.3">• Релаксація пружинної латуні</tspan><tspan x="410.0" dy="14.3">• Зниження тиску притискання</tspan><tspan x="410.0" dy="14.3">• Мікророзриви ланцюга</tspan></text>
<rect x="555.0" y="50.0" width="245.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="677.5" y="93.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="677.5" dy="0.0">3. Тепловий розгін</tspan><tspan x="677.5" dy="14.3">• Зростання R_cont: 0.5 → 8 мОм</tspan><tspan x="677.5" dy="14.3">• Струм 70 А виділяє 39 Вт</tspan><tspan x="677.5" dy="14.3">• Розігрів вище 120°C</tspan><tspan x="677.5" dy="14.3">• Оплавлення нейлону XT60</tspan><tspan x="677.5" dy="14.3">• Втрата контакту в польоті</tspan></text>
<rect x="20.0" y="220.0" width="780.0" height="105.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="255.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Заходи запобігання деградації силових та сигнальних роз'ємів:</tspan><tspan x="410.0" dy="13.7">• Використання роз'ємів із вбудованим антиіскровим резистором (XT60-S / XT90-S) для плавного попереднього заряду ємностей.</tspan><tspan x="410.0" dy="13.7">• Фіксація сигнальних роз'ємів JST-SH демпферним компаундом/силіконом для усунення взаємного мікропереміщення пінів.</tspan><tspan x="410.0" dy="13.7">• Контроль кількості циклів сполучення (нормований ресурс якісного XT60 — до 500 підключень, дешевих копій — до 50).</tspan></text>
</svg>