<text x="320.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">i_циркуляційний (при асиметрії)</text>
<rect x="570.0" y="50.0" width="250.0" height="320.0" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.5"/><text x="695.0" y="89.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">Еквівалентна індуктивність:</tspan><tspan x="695.0" dy="15.6"></tspan><tspan x="695.0" dy="15.6">L_eq = (L₁·L₂ − M²)</tspan><tspan x="695.0" dy="15.6">       ————————————</tspan><tspan x="695.0" dy="15.6">       L₁ + L₂ ∓ 2·M</tspan><tspan x="695.0" dy="15.6"></tspan><tspan x="695.0" dy="15.6">Знак «−» у знаменнику:</tspan><tspan x="695.0" dy="15.6">згідне ввімкнення</tspan><tspan x="695.0" dy="15.6"></tspan><tspan x="695.0" dy="15.6">Знак «+» у знаменнику:</tspan><tspan x="695.0" dy="15.6">зустрічне ввімкнення</tspan><tspan x="695.0" dy="15.6"></tspan><tspan x="695.0" dy="15.6">Небезпека:</tspan><tspan x="695.0" dy="15.6">При L₁ = L₂ і k → 1:</tspan><tspan x="695.0" dy="15.6">чисельник прямує до 0;</tspan><tspan x="695.0" dy="15.6">будь-яка асиметрія викликає</tspan><tspan x="695.0" dy="15.6">небезпечний циркулюючий струм!</tspan></text>
</svg>