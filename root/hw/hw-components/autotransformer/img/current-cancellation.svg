<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="420.0" height="320.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="230.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл струмів у витках</text>
<line x1="60.0" y1="90.0" x2="210.0" y2="90.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="90.0" y1="80.0" x2="150.0" y2="80.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="120.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Вхід I₁ = 10 А</text>
<line x1="210.0" y1="90.0" x2="210.0" y2="115.0" stroke="#c0392b" stroke-width="2.2"/>
<rect x="195.0" y="115.0" width="30.0" height="18.0" rx="3" fill="#fff5f5" stroke="#c0392b" stroke-width="1.8"/>
<rect x="195.0" y="141.0" width="30.0" height="18.0" rx="3" fill="#fff5f5" stroke="#c0392b" stroke-width="1.8"/>
<text x="255.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">N_ser = 20 вит.</text>
<line x1="185.0" y1="115.0" x2="185.0" y2="155.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="168.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">I₁</text>
<circle cx="210.0" cy="175.0" r="5.0" fill="#333333" stroke="#333333" stroke-width="1.0"/>
<text x="210.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="end" font-weight="700">Вузол A</text>
<line x1="210.0" y1="175.0" x2="380.0" y2="175.0" stroke="#2457d6" stroke-width="2.5"/>
<line x1="260.0" y1="165.0" x2="330.0" y2="165.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="295.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Вихід I₂ = 12 А</text>
<rect x="195.0" y="190.0" width="30.0" height="18.0" rx="3" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.8"/>
<rect x="195.0" y="216.0" width="30.0" height="18.0" rx="3" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.8"/>
<rect x="195.0" y="242.0" width="30.0" height="18.0" rx="3" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="255.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">N_com = 100 вит.</text>
<line x1="185.0" y1="260.0" x2="185.0" y2="200.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="152.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">I_com</text>
<line x1="210.0" y1="256.0" x2="210.0" y2="285.0" stroke="#333333" stroke-width="2.2"/>
<line x1="60.0" y1="285.0" x2="380.0" y2="285.0" stroke="#333333" stroke-width="2.5"/>
<text x="110.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Спільний нуль (N)</text>
<rect x="460.0" y="20.0" width="300.0" height="320.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="610.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Числовий баланс (n = 1.2)</text>
<text x="480.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">V₁ = 240 В,  V₂ = 200 В</text>
<text x="480.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">P_out = 200 В · 12 А = 2400 Вт</text>
<text x="480.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">────────────────────────</text>
<text x="480.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">За 1-м законом Кірхгофа у вузлі A:</text>
<text x="480.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">I₂ = I₁ + I_com</text>
<text x="480.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">I_com = I₂ − I₁</text>
<text x="480.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">I_com = 12 А − 10 А = 2 А</text>
<text x="480.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">────────────────────────</text>
<text x="480.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Струм у спільних витках в 6 разів</text>
<text x="480.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">менший за струм навантаження!</text>
<text x="480.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Втрати I²·R скорочено в 36 разів.</text>
</svg>