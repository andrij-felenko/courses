  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="400.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Два моменти життя снабера — і чому потрібні ОБИДВА елементи</text>
<text x="400.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">розрив: C приймає струм; замикання: R рятує контакт від розряду конденсатора</text>
<rect x="60.0" y="90.0" width="320.0" height="270.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="220.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">контакт РОЗМИКАЄТЬСЯ</text>
<circle cx="110.0" cy="180.0" r="3.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<circle cx="180.0" cy="180.0" r="3.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<line x1="110.0" y1="180.0" x2="176.0" y2="166.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
