<line x1="221.0" y1="234.0" x2="221.0" y2="260.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="110.0" y1="260.0" x2="221.0" y2="260.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="110.0" y1="180.0" x2="110.0" y2="260.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="221.0" y1="150.0" x2="221.0" y2="140.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="180.0" y1="180.0" x2="221.0" y2="180.0" stroke="#1b1b1b" stroke-width="0.1" stroke-linecap="round"/>
<line x1="150.0" y1="250.0" x2="205.0" y2="250.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<text x="220.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#9a2b22" text-anchor="middle" font-weight="bold" font-style="normal">струм котушки звертає в C:</text>
<text x="220.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#9a2b22" text-anchor="middle" font-weight="normal" font-style="normal">напруга росте повільно — дуги нема</text>
<text x="220.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(що більший C, то нижчий викид)</text>
<rect x="420.0" y="90.0" width="320.0" height="270.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="580.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">контакт ЗАМИКАЄТЬСЯ</text>
<circle cx="470.0" cy="180.0" r="3.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<circle cx="540.0" cy="180.0" r="3.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<line x1="470.0" y1="180.0" x2="540.0" y2="180.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<rect x="572.0" y="150.0" width="18.0" height="36.0" rx="0" fill="#f3f3f3" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="604.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">R</text>
<line x1="581.0" y1="186.0" x2="581.0" y2="218.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="577.0" y1="214.0" x2="577.0" y2="238.0" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round"/>
<line x1="585.0" y1="214.0" x2="585.0" y2="238.0" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round"/>
<line x1="581.0" y1="234.0" x2="581.0" y2="260.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="470.0" y1="260.0" x2="581.0" y2="260.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="470.0" y1="180.0" x2="470.0" y2="260.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="560.0" y1="250.0" x2="505.0" y2="250.0" stroke="#1f47b5" stroke-width="2.4" marker-end="url(#aBlue)"/>
<text x="580.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#27447e" text-anchor="middle" font-weight="bold" font-style="normal">заряджений C розряджається</text>
<text x="580.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#27447e" text-anchor="middle" font-weight="normal" font-style="normal">через контакт — пік обмежує R:</text>
<text x="580.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">I_пік = V_C / R (що більший R, то м'якше)</text>
<text x="400.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">звідси компроміс номіналів: C — за струмом і дозволеним dV/dt, R — за допустимим піком розряду</text>
</svg>
