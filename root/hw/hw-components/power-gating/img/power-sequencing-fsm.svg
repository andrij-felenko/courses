<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часова діаграма послідовності керування живленням (Power-Down та Power-Up)</text>
<rect x="30.0" y="48.0" width="720.0" height="395.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
