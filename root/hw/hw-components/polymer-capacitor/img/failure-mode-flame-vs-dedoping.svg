<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння механізмів відмови: горіння MnO2 проти дедопування полімеру</text>
<rect x="10.0" y="10.0" width="740.0" height="320.0" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0"/>
<rect x="30.0" y="30.0" width="335.0" height="275.0" rx="8" fill="#fee2e2" stroke="#c0392b" stroke-width="1.8"/>
<text x="197.5" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Традиційний тантал з MnO₂</text>
<text x="197.5" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#4b5563" text-anchor="middle" font-style="italic">Катастрофічний тепловий розгін</text>
<text x="45.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">1. Дефект оксиду Ta₂O₅</text>
<text x="45.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4b5563" text-anchor="start">Локальний струм витоку в мікротріщині</text>
<text x="45.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">2. Локальний перегрів (&gt;400 °C)</text>
<text x="45.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4b5563" text-anchor="start">Струм шини концентрується в точці пробою</text>
<text x="45.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">3. Термічний розклад MnO₂</text>
<text x="45.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4b5563" text-anchor="start">2 MnO₂ → Mn₂O₃ + O (виділення кисню)</text>
<text x="45.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">4. Екзотермічне горіння Ta + O</text>
<text x="45.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4b5563" text-anchor="start">Тантал спалахує без зовнішнього повітря</text>
<text x="45.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">5. Результат: ПОЖЕЖА</text>
<text x="45.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4b5563" text-anchor="start">Коротке замикання шини та відкрите полум'я</text>
<rect x="395.0" y="30.0" width="335.0" height="275.0" rx="8" fill="#dcfce7" stroke="#27ae60" stroke-width="1.8"/>
<text x="562.5" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Полімерний конденсатор (PEDOT)</text>
<text x="562.5" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#4b5563" text-anchor="middle" font-style="italic">Безпечне теплове дедопування</text>
<text x="410.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">1. Дефект оксиду Ta₂O₅ / Al₂O₃</text>
<text x="410.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4b5563" text-anchor="start">Локальний струм витоку в мікропорі</text>
<text x="410.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">2. Локальний нагрів (250–300 °C)</text>
<text x="410.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4b5563" text-anchor="start">Тепло виділяється в мікрошарі полімеру</text>
<text x="410.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">3. Дедопування PEDOT:PSS</text>
<text x="410.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4b5563" text-anchor="start">Полімер втрачає провідність → ІЗОЛЯТОР</text>
<text x="410.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">4. Автоматичне відсікання</text>
<text x="410.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4b5563" text-anchor="start">Струм через дефектну точку припиняється</text>
<text x="410.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">5. Результат: БЕЗПЕЧНА ВІДМОВА</text>
<text x="410.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4b5563" text-anchor="start">Незначний ріст DCL, відсутність полум'я</text>
</svg>