<rect x="56.0" y="216.0" width="196.0" height="38.0" rx="6" fill="#e9eefb" stroke="#9bb0c2" stroke-width="1.4"/>
<text x="154.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Надійність</text>
