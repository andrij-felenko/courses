<text x="350.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Recommended — це Abs Max мінус запас на все це. Жити треба в зеленому, не «майже на межі».</text>
