<text x="154.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Температура</text>
<line x1="254.0" y1="135.0" x2="286.0" y2="135.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="298.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">у спеку межі стискаються — потрібен буфер</text>
