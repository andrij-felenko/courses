<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Голковий індуктор (Needle-Eye) та баланс сил у розплаві</text>
<text x="420.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Механізм масштабування діаметра FZ-злитків від 50 мм до 150–200 мм</text>
<rect x="30.0" y="75.0" width="380.0" height="365.0" rx="8" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.5"/>
<text x="220.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрія індуктора «Needle-Eye»</text>
<rect x="160.0" y="120.0" width="120.0" height="60.0" rx="6" fill="#bdc3c7" stroke="#333333" stroke-width="1.5"/>
<text x="220.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Живильний стрижень (150 мм)</text>
<path d="M 160.0 180.0 L 202.0 215.0 L 202.0 235.0 L 165.0 270.0 L 275.0 270.0 L 238.0 235.0 L 238.0 215.0 L 280.0 180.0 Z" fill="#f39c12" stroke="#d35400" stroke-width="2"/>
<rect x="135.0" y="217.0" width="60.0" height="16.0" rx="2" fill="#e74c3c" stroke="#922b21" stroke-width="1.5"/>
<rect x="245.0" y="217.0" width="60.0" height="16.0" rx="2" fill="#e74c3c" stroke="#922b21" stroke-width="1.5"/>
<text x="220.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Отвір 30–40 мм</text>
<rect x="165.0" y="270.0" width="110.0" height="75.0" rx="6" fill="#5dade2" stroke="#333333" stroke-width="1.5"/>
<text x="220.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Монокристал FZ (150–200 мм)</text>
<text x="220.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Вузький отвір індуктора локалізує</text>
<text x="220.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">електромагнітне поле, концентруючи</text>
<text x="220.0" y="411.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">тепло в тонкому перешийку.</text>
<rect x="430.0" y="75.0" width="380.0" height="365.0" rx="8" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.5"/>
<text x="620.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Баланс тисків у рідкій зоні</text>
<rect x="445.0" y="130.0" width="350.0" height="72.0" rx="6" fill="#fdfefe" stroke="#c0392b" stroke-width="1.5"/>
<text x="455.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">1. Гідростатичний гравітаційний тиск:</text>
<text x="785.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">P_hyd = ρ · g · h</text>
<text x="455.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">Тягне розплав униз, прагне зірвати краплю</text>
<rect x="445.0" y="212.0" width="350.0" height="72.0" rx="6" fill="#fdfefe" stroke="#27ae60" stroke-width="1.5"/>
<text x="455.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">2. Капілярний тиск натягу:</text>
<text x="785.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">ΔP_γ = γ · (1/R₁ + 1/R₂)</text>
<text x="455.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">Стискає вільну поверхню розплаву (γ ≈ 0.72 Н/м)</text>
<rect x="445.0" y="294.0" width="350.0" height="72.0" rx="6" fill="#fdfefe" stroke="#1f4e79" stroke-width="1.5"/>
<text x="455.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1f4e79" text-anchor="start" font-weight="700">3. Електромагнітний тиск (Пінч-ефект):</text>
<text x="785.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">P_EM = μ₀ · H² / 2</text>
<text x="455.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">Сили Лоренца (J × B) підтримують розплав</text>
<rect x="445.0" y="380.0" width="350.0" height="48.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
<text x="620.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d6608" text-anchor="middle" font-weight="700">Критерій стійкості Гейванга (Heywang limit):</text>
<text x="620.0" y="417.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Максимальна висота зони h_max ≈ 2.8 · √(γ / (ρ·g)) ≈ 15 мм</text>
<text x="420.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Конструкція Needle-Eye компенсує обмеження поверхневого натягу за рахунок електромагнітної левітації.</text>
</svg>