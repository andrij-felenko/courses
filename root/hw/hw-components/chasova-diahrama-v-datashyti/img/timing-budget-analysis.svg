<text x="420.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">Вимога приймача</text>
<rect x="494.0" y="180.0" width="55.0" height="50.0" rx="4" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/>
<text x="521.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b7950b" text-anchor="middle" font-weight="700">t_unc</text>
<text x="521.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b7950b" text-anchor="middle">1.5 нс</text>
<rect x="549.0" y="180.0" width="241.0" height="50.0" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="2.0"/>
<text x="669.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e8449" text-anchor="middle" font-weight="700">ПОЗИТИВНИЙ ЗАПАС (Slack) = +6.5 нс</text>
<text x="669.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e8449" text-anchor="middle">Шина надійна: t_margin &gt; 0</text>
<line x1="50.0" y1="245.0" x2="790.0" y2="245.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="50.0" y1="238.0" x2="50.0" y2="252.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="790.0" y1="238.0" x2="790.0" y2="252.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="420.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повний тактовий період T_clk = 20.0 нс (100% бюджету)</text>
<rect x="159.8" y="285.2" width="540.4" height="59.6" rx="6" fill="#f8f9fa" stroke="#d1d5db" stroke-width="1.5"/><text x="430.0" y="304.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Основна умова безпомилкової передачі (Setup Constraint):</tspan><tspan x="430.0" dy="14.3">T_clk ≥ t_co(max) + t_flight + t_setup + t_skew + t_jitter</tspan><tspan x="430.0" dy="14.3">Якщо T_clk менший за суму — виникає негативний запас (Negative Slack) і збій даних.</tspan></text>
</svg>