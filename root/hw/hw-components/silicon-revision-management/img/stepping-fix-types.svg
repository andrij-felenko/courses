<rect x="45.0" y="70.0" width="335.0" height="36.0" rx="4" fill="#dbeafe" stroke="#2457d6" stroke-width="1.0"/>
<text x="212.5" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Металева ревізія: Metal-Only ECO (A0 → A1)</text>
<rect x="55.0" y="120.0" width="315.0" height="40.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="212.5" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Верхні шари металізації (M5...M8) — ЗМІНЕНО</text>
<rect x="55.0" y="166.0" width="315.0" height="32.0" rx="3" fill="#e2e8f0" stroke="#333333" stroke-width="1.0"/>
<text x="212.5" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Нижні шари металізації (M1...M4) — БЕЗ ЗМІН</text>
<rect x="55.0" y="204.0" width="315.0" height="42.0" rx="3" fill="#e2e8f0" stroke="#333333" stroke-width="1.0"/>
<text x="212.5" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Базові шари: кремній, дифузія, полікремній</text>
<text x="212.5" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-style="italic">Резервні вентилі (Spare Cells) підключено металом</text>
<text x="50.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• Маски:</text>
<text x="140.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Заміна лише 2–4 фотошаблонів металу</text>
<text x="50.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• Вартість:</text>
<text x="140.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Низька (~10–20% вартості повного комплекту)</text>
<text x="50.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• Час фабрикації:</text>
<text x="140.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3–6 тижнів (заготовки чекають перед металом)</text>
<text x="50.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• Застосування:</text>
<text x="140.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Логічні баги, переприв'язка на spare cells</text>
<rect x="425.0" y="55.0" width="365.0" height="335.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<rect x="440.0" y="70.0" width="335.0" height="36.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.0"/>
<text x="607.5" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">Базова ревізія: All-Layer / Base Tapeout (A1 → B0)</text>
<rect x="450.0" y="120.0" width="315.0" height="40.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="607.5" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Усі шари металізації (M1...Mn) — ЗМІНЕНО</text>
<rect x="450.0" y="166.0" width="315.0" height="32.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="607.5" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Полікремній, затвори, контакти — ЗМІНЕНО</text>
<rect x="450.0" y="204.0" width="315.0" height="42.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="607.5" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Базові шари: геометрія транзисторів, імплантація</text>
<text x="607.5" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle" font-style="italic">Повна перебудова топології та розміщення блоків</text>
<text x="445.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• Маски:</text>
<text x="535.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Повний комплект фотошаблонів (30–80+ масок)</text>
<text x="445.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• Вартість:</text>
<text x="535.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Максимальна ($1M–$15M+ залежно від техпроцесу)</text>
<text x="445.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• Час фабрикації:</text>
<text x="535.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3–6 місяців (повний цикл вирощування кристала)</text>
<text x="445.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">• Застосування:</text>
<text x="535.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Фізичні вади, аналогові блоки, таймінг, оптимізація</text>
<text x="410.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Зміна цифри (A0→A1) = металевий фікс; зміна літери (A1→B0) = базова модифікація масок.</text>
