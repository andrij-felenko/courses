<text x="500.0" y="553.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">EFC (Vcontrol)</text>
<rect x="630.0" y="80.0" width="300.0" height="130.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="780.0" y="130.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Чому схема всередині термостата?</tspan><tspan x="780.0" dy="11.7">• Паразитні ємності транзисторів і фазовий зсув залежать від температури</tspan><tspan x="780.0" dy="11.7">• Конденсатори обв'язки C0G дрейфують на 30 ppm/°C</tspan><tspan x="780.0" dy="11.7">• Розміщення генератора в камері усуває дрейф усього активного тракту</tspan></text>
<rect x="630.0" y="225.0" width="300.0" height="130.0" rx="6" fill="#fef3c7" stroke="#d35400" stroke-width="1.5"/><text x="780.0" y="275.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Ізотермічний градієнт камери:</tspan><tspan x="780.0" dy="11.7">• Металевий корпус з високою теплопровідністю вирівнює температуру</tspan><tspan x="780.0" dy="11.7">• NTC розташований впритул до кристала для мінімізації фазового запізнення</tspan><tspan x="780.0" dy="11.7">• Механічні кріплення пружні, щоб уникнути термомеханічних напружень</tspan></text>
<rect x="630.0" y="370.0" width="300.0" height="130.0" rx="6" fill="#eff6ff" stroke="#2980b9" stroke-width="1.5"/><text x="780.0" y="420.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Теплова ізоляція та енергетика:</tspan><tspan x="780.0" dy="11.7">• R_th сорочки: 35–50 К/Вт (P_hold ≈ 1.0–1.5 Вт при 25 °C)</tspan><tspan x="780.0" dy="11.7">• При −40 °C довкілля градієнт ΔT = 120 °C, споживання зростає до 2.5–3 Вт</tspan><tspan x="780.0" dy="11.7">• Відсутність конвекції всередині виключає флуктуаційні протяги</tspan></text>
</svg>