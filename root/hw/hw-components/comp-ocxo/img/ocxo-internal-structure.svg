<circle cx="230.0" cy="535.0" r="4.0" fill="#333333" stroke="#333333" stroke-width="1.0"/>
<text x="230.0" y="553.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">GND</text>
<circle cx="320.0" cy="500.0" r="5.0" fill="#94a3b8" stroke="#333333" stroke-width="1.5"/>
