<text x="80.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Зовнішній герметичний екран (GND, ковар / нікельована латунь)</text>
