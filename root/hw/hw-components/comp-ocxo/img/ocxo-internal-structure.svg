<text x="99.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start" font-weight="700">Теплоізоляційна сорочка (мікропористий аерогель / пінополіуретан, R_th ≈ 35–50 К/Вт)</text>
