<text x="330.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="middle" font-weight="700">Ізотермічна камера-термостат (мідний блок, T = 80.0 °C ± 0.001 °C)</text>
<rect x="139.0" y="194.0" width="180.0" height="110.0" rx="6" fill="#eff6ff" stroke="#2980b9" stroke-width="2.0"/>
<text x="229.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2980b9" text-anchor="middle" font-weight="700">Кварцовий резонатор</text>
<text x="229.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">SC-зріз (C-мода)</text>
<text x="229.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Q ≈ 2.5·10⁶ (3-й обертон)</text>
<text x="229.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="700">Turnover T_turn = 80 °C</text>
<rect x="339.0" y="194.0" width="180.0" height="110.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="2.0"/>
<text x="429.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Схема генератора</text>
<text x="429.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Малошумний BJT / JFET</text>
<text x="429.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">C0G/NP0 конденсатори</text>
<text x="429.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#065f46" text-anchor="middle" font-weight="700">Варікап EFC (підстроювання)</text>
<rect x="139.0" y="327.0" width="180.0" height="60.0" rx="6" fill="#fdf2f8" stroke="#8e44ad" stroke-width="1.8"/>
<text x="229.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">Прецизійний NTC</text>
<text x="229.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Чутливість ≈ −4 %/°C</text>
<rect x="339.0" y="327.0" width="180.0" height="60.0" rx="6" fill="#fff7ed" stroke="#c0392b" stroke-width="1.8"/>
<text x="429.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Силовий нагрівач</text>
<text x="429.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Power BJT (1–8 Вт тепла)</text>
