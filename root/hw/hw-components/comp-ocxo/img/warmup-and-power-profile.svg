<rect x="650.0" y="95.0" width="290.0" height="100.0" rx="6" fill="#fff7ed" stroke="#c0392b" stroke-width="1.5"/><text x="795.0" y="130.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Фаза 1: Холодний старт (0–2 хв)</tspan><tspan x="795.0" dy="11.7">• Максимальний струм нагрівача (насичення драйвера)</tspan><tspan x="795.0" dy="11.7">• Струм живлення: до 600–800 мА при 12 В</tspan><tspan x="795.0" dy="11.7">• Швидке зростання температури: dT/dt ≈ 0.5 °C/с</tspan></text>
<rect x="650.0" y="210.0" width="290.0" height="100.0" rx="6" fill="#fef3c7" stroke="#d35400" stroke-width="1.5"/><text x="795.0" y="245.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Фаза 2: Захоплення температури (2–4 хв)</tspan><tspan x="795.0" dy="11.7">• Наближення до T_turn = 80 °C, драйвер виходить з насичення</tspan><tspan x="795.0" dy="11.7">• Інтегратор усуває перерегулювання (без викиду тепла)</tspan><tspan x="795.0" dy="11.7">• Частота потрапляє у вікно ±0.01 ppm (±10 ppb)</tspan></text>
<rect x="650.0" y="325.0" width="290.0" height="100.0" rx="6" fill="#eff6ff" stroke="#2980b9" stroke-width="1.5"/><text x="795.0" y="360.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Фаза 3: Стаціонарний режим (&gt;5 хв)</tspan><tspan x="795.0" dy="11.7">• Тепловий баланс: P_hold = (T_oven − T_amb) / R_th</tspan><tspan x="795.0" dy="11.7">• Струм спадає до 100–120 мА (1.2–1.4 Вт)</tspan><tspan x="795.0" dy="11.7">• Вихід на граничну стабільність 10⁻¹¹ – 10⁻¹²</tspan></text>
