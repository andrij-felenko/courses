<line x1="182.0" y1="390.0" x2="182.0" y2="350.0" stroke="#8e44ad" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="490.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">Тепловий зворотний зв'язок: зміна температури змінює опір R_ntc, замикаючи петлю</text>
<rect x="40.0" y="430.0" width="900.0" height="70.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="490.0" y="447.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Чому заборонено ШІМ (PWM) у прецизійних OCXO:</tspan><tspan x="490.0" dy="14.3">1. Електромагнітна наводка (EMI) від фронтів перемикання потрапляє на чутливий контур генератора</tspan><tspan x="490.0" dy="14.3">2. Пульсації температури камери викликають періодичну паразитну фазову модуляцію (spurs у спектрі)</tspan><tspan x="490.0" dy="14.3">3. Лише суто лінійний режим вихідного каскаду гарантує граничну чистоту спектра та низький фазовий шум</tspan></text>
</svg>