<rect x="40.0" y="42.0" width="330.0" height="28.0" rx="6" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="205.0" y="60.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">Петля гістерезису заряду Q(v)</tspan></text>
<line x1="65.0" y1="275.0" x2="65.0" y2="85.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
