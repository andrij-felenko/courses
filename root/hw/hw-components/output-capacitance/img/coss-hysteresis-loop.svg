<text x="65.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Q (нКл)</text>
<text x="355.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">V_ds (В)</text>
<path d="M 70 270 Q 95 150 180 110 T 330 100 Q 200 135 110 210 Z" fill="#fee2e2" opacity="0.7"/>
<path d="M 70 270 Q 95 150 180 110 T 330 100" fill="none" stroke="#c0392b" stroke-width="2"/>
<path d="M 330 100 Q 200 135 110 210 T 70 270" fill="none" stroke="#2457d6" stroke-width="2"/>
<line x1="130.0" y1="135.0" x2="145.0" y2="128.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="150.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Заряд (dv/dt &gt; 0)</text>
<line x1="170.0" y1="155.0" x2="150.0" y2="170.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="175.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Розряд (dv/dt &lt; 0)</text>
<rect x="40.0" y="225.0" width="330.0" height="48.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="240.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Площа петлі = E_oss,hyst = ∮ v dq</tspan><tspan x="205.0" dy="11.7">Ця енергія НЕ повертається в резонансний контур,</tspan><tspan x="205.0" dy="11.7">а перетворюється на тепло в кристалі навіть при ідеальному ZVS!</tspan></text>
<rect x="405.0" y="30.0" width="330.0" height="305.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="420.0" y="42.0" width="300.0" height="28.0" rx="6" fill="#f1f5f9" stroke="none" stroke-width="1.5"/><text x="570.0" y="60.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Причини та порівняння технологій</tspan></text>
<rect x="425.0" y="79.5" width="290.0" height="91.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Фізичні механізми гістерезису:</tspan><tspan x="570.0" dy="13.0">• Захоплення носіїв на глибоких пастках</tspan><tspan x="570.0" dy="13.0">  між p/n стовпчиками Superjunction.</tspan><tspan x="570.0" dy="13.0">• Не-квазістатичний опір дрейфу (NQS)</tspan><tspan x="570.0" dy="13.0">  під час надшвидкого збіднення.</tspan><tspan x="570.0" dy="13.0">• Поляризація діелектричних шарів.</tspan></text>
<rect x="420.0" y="185.0" width="300.0" height="135.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="570.0" y="208.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Рівень гістерезисних втрат (при 400 В):</tspan><tspan x="570.0" dy="11.7"></tspan><tspan x="570.0" dy="11.7">• Si Superjunction: E_hyst ≈ 1.0–5.0 мкДж</tspan><tspan x="570.0" dy="11.7">  (до 2–5 Вт тепла на частоті 500 кГц!)</tspan><tspan x="570.0" dy="11.7"></tspan><tspan x="570.0" dy="11.7">• SiC MOSFET: E_hyst &lt; 0.1 мкДж (мізерний)</tspan><tspan x="570.0" dy="11.7"></tspan><tspan x="570.0" dy="11.7">• GaN HEMT: E_hyst ≈ 0 (гістерезис відсутній,</tspan><tspan x="570.0" dy="11.7">  ідеально для високих частот МГц-діапазону)</tspan></text>
</svg>