<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="25.0" y="30.0" width="365.0" height="305.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<rect x="40.0" y="42.0" width="335.0" height="26.0" rx="6" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="207.5" y="59.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="207.5" dy="0.0">Площа заряду Q_oss vs енергії E_oss</tspan></text>
<line x1="65.0" y1="280.0" x2="65.0" y2="85.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="65.0" y1="280.0" x2="360.0" y2="280.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="65.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">C(v)</text>
<text x="355.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">v (В)</text>
<path d="M 70 100 Q 90 120 110 200 Q 150 250 330 265 L 330 280 L 70 280 Z" fill="#dbeafe" opacity="0.6"/>
<path d="M 70 100 Q 90 120 110 200 Q 150 250 330 265" fill="none" stroke="#2457d6" stroke-width="2"/>
<text x="210.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Q_oss = ∫ C_oss(v) dv</text>
<text x="210.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(вся площа під кривою)</text>
<path d="M 70 280 Q 100 240 120 150 Q 160 210 330 240" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,2"/>
<text x="175.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">v · C_oss(v)</text>
<text x="230.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">E_oss = ∫ v · C_oss(v) dv</text>
<rect x="40.0" y="290.0" width="335.0" height="36.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="207.5" y="305.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="207.5" dy="0.0">При низькій напрузі C(v) гігантська, але v ≈ 0,</tspan><tspan x="207.5" dy="11.7">тому для енергії E_oss початковий пік важить мало!</tspan></text>
<rect x="410.0" y="30.0" width="365.0" height="305.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="425.0" y="42.0" width="335.0" height="26.0" rx="6" fill="#f1f5f9" stroke="none" stroke-width="1.5"/><text x="592.5" y="59.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="592.5" dy="0.0">Дві еквівалентні ємності</tspan></text>
<rect x="425.0" y="78.0" width="335.0" height="95.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.2"/>
<text x="592.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">C_o(er) — еквівалентна за енергією</text>
<text x="592.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">E_oss = ½ · C_o(er) · V_ds²</text>
<text x="592.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle">C_o(er) = (2 / V_ds²) · ∫ v · C_oss(v) dv</text>
<text x="592.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle" font-weight="700">Призначення: розрахунок теплових втрат P = f · E_oss</text>
<rect x="425.0" y="185.0" width="335.0" height="95.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="592.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">C_o(tr) — еквівалентна за часом/зарядом</text>
<text x="592.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Q_oss = C_o(tr) · V_ds</text>
<text x="592.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle">C_o(tr) = (1 / V_ds) · ∫ C_oss(v) dv</text>
<text x="592.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle" font-weight="700">Призначення: розрахунок dead-time (часу перезаряду)</text>
<rect x="425.0" y="290.0" width="335.0" height="36.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.5"/><text x="592.5" y="305.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="592.5" dy="0.0">Через пік ємності при 0 В завжди C_o(tr) &gt; C_o(er)</tspan><tspan x="592.5" dy="11.7">(у Superjunction різниця досягає 2-4 разів!)</tspan></text>
</svg>