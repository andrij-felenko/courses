<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат керування доменом живлення (PPU/PMC FSM) та DVFS</text>
<rect x="40.0" y="70.0" width="140.0" height="70.0" rx="6" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.6"/>
<text x="110.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">POWER_OFF</text>
<text x="110.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Ключі розімкнені</text>
<text x="110.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ізоляція активна</text>
<line x1="180.0" y1="105.0" x2="230.0" y2="105.0" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="205.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6d28d9" text-anchor="middle" font-weight="700">Power Up</text>
<rect x="230.0" y="70.0" width="150.0" height="70.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.6"/>
<text x="305.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">POWERING_ON</text>
<text x="305.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Ланцюгове ввімкнення</text>
<text x="305.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">PMOS-ключів (dI/dt)</text>
<line x1="380.0" y1="105.0" x2="430.0" y2="105.0" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="405.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6d28d9" text-anchor="middle" font-weight="700">Pwr Good</text>
<rect x="430.0" y="70.0" width="145.0" height="70.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="502.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">RESTORING</text>
<text x="502.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Деактивація ізоляції</text>
<text x="502.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Відновлення Retention</text>
<line x1="575.0" y1="105.0" x2="620.0" y2="105.0" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="597.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6d28d9" text-anchor="middle" font-weight="700">Reset Off</text>
<rect x="620.0" y="70.0" width="100.0" height="70.0" rx="6" fill="#dcfce7" stroke="#1e7e34" stroke-width="1.8"/>
<text x="670.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e7e34" text-anchor="middle" font-weight="700">ACTIVE</text>
<text x="670.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">CLK увімкнено</text>
<text x="670.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e7e34" text-anchor="middle">Ядро працює</text>
<line x1="670.0" y1="140.0" x2="670.0" y2="175.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="670.0" y1="175.0" x2="110.0" y2="175.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="110.0" y1="175.0" x2="110.0" y2="140.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="390.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Power Down: Зупинка такту → Збереження Retention → Ізоляція → Розмикання ключів</text>
<rect x="40.0" y="205.0" width="680.0" height="160.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.6"/>
<text x="380.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність динамічного масштабування напруги та частоти (DVFS Ordering)</text>
<rect x="60.0" y="245.0" width="300.0" height="105.0" rx="4" fill="#eff6ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="210.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Підвищення частоти (Scale UP)</text>
<text x="75.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">1. Збільшити напругу Vdd (PMIC command)</text>
<text x="75.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">2. Зачекати стабілізації живлення (t_settle)</text>
<text x="75.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">3. Підвищити частоту тактового сигналу f_clk</text>
<text x="210.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">Захист від timing violations на високій частоті</text>
<rect x="390.0" y="245.0" width="310.0" height="105.0" rx="4" fill="#f0fdf4" stroke="#1e7e34" stroke-width="1.4"/>
<text x="545.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e7e34" text-anchor="middle" font-weight="700">Зниження енергоспоживання (Scale DOWN)</text>
<text x="405.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">1. Знизити тактову частоту f_clk (Clock Mux)</text>
<text x="405.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">2. Знизити напругу живлення Vdd (PMIC)</text>
<text x="405.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">3. Заощадження енергії P = C · V² · f</text>
<text x="545.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e7e34" text-anchor="middle">Запобігає роботі швидкого такту на низькій напрузі</text>
<text x="380.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Порушення послідовності DVFS призводить до збоїв логіки через затримку поширення сигналів</text>
</svg>