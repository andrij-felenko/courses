<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">5 незалежних каналів протоколу AXI4 та квитування VALID / READY</text>
<rect x="30.0" y="60.0" width="110.0" height="240.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="85.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">AXI Master</text>
<rect x="340.0" y="60.0" width="110.0" height="240.0" rx="4" fill="#fdf3e7" stroke="#d97706" stroke-width="1.6"/>
<text x="395.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">AXI Slave</text>
<rect x="150.0" y="66.0" width="180.0" height="28.0" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="240.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Read Address (AR)</text>
<text x="240.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ARADDR, ARLEN, ARID</text>
<line x1="140.0" y1="80.0" x2="150.0" y2="80.0" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="330.0" y1="80.0" x2="340.0" y2="80.0" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="150.0" y="111.0" width="180.0" height="28.0" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="240.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle" font-weight="700">Read Data (R)</text>
<text x="240.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">RDATA, RRESP, RID</text>
<line x1="340.0" y1="125.0" x2="330.0" y2="125.0" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="150.0" y1="125.0" x2="140.0" y2="125.0" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="150.0" y="156.0" width="180.0" height="28.0" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="240.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Write Address (AW)</text>
<text x="240.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">AWADDR, AWLEN, AWID</text>
<line x1="140.0" y1="170.0" x2="150.0" y2="170.0" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="330.0" y1="170.0" x2="340.0" y2="170.0" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="150.0" y="201.0" width="180.0" height="28.0" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="240.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Write Data (W)</text>
<text x="240.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">WDATA, WSTRB, WLAST</text>
<line x1="140.0" y1="215.0" x2="150.0" y2="215.0" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="330.0" y1="215.0" x2="340.0" y2="215.0" stroke="#2457d6" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="150.0" y="246.0" width="180.0" height="28.0" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="240.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle" font-weight="700">Write Response (B)</text>
<text x="240.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">BRESP, BID</text>
<line x1="340.0" y1="260.0" x2="330.0" y2="260.0" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="150.0" y1="260.0" x2="140.0" y2="260.0" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="470.0" y="60.0" width="260.0" height="240.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="600.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двосторонній Handshake</text>
<text x="520.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">T1</text>
<line x1="520.0" y1="110.0" x2="520.0" y2="260.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="2 2"/>
<text x="570.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">T2</text>
<line x1="570.0" y1="110.0" x2="570.0" y2="260.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="2 2"/>
<text x="620.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">T3 (Transfer)</text>
<line x1="620.0" y1="110.0" x2="620.0" y2="260.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="2 2"/>
<text x="670.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">T4</text>
<line x1="670.0" y1="110.0" x2="670.0" y2="260.0" stroke="#e2e8f0" stroke-width="1.0" stroke-dasharray="2 2"/>
<text x="485.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">ACLK</text>
<polyline points="505,130 520,130 520,118 545,118 545,130 570,130 570,118 595,118 595,130 620,130 620,118 645,118 645,130 670,130" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="485.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">VALID</text>
<polyline points="505,168 535,168 540,152 645,152 650,168 670,168" fill="none" stroke="#2457d6" stroke-width="1.8"/>
<text x="485.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle" font-weight="700">READY</text>
<polyline points="505,203 585,203 590,188 645,188 650,203 670,203" fill="none" stroke="#d97706" stroke-width="1.8"/>
<text x="485.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">DATA</text>
<rect x="540.0" y="225.0" width="105.0" height="20.0" rx="2" fill="#dbeafe" stroke="#2457d6" stroke-width="1.2"/>
<text x="592.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Дійсні дані</text>
<circle cx="620.0" cy="130.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="0.0"/>
<text x="600.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Передавання стається ТОЧНО в такт T3,</text>
<text x="600.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">коли одночасно VALID=1 та READY=1</text>
<text x="380.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Роздільні канали читання й запису працюють повністю асинхронно та паралельно,</text>
<text x="380.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">а ідентифікатори транзакцій (AXI ID) дозволяють повертати дані без очікування попередніх запитів.</text>
</svg>