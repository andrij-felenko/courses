<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектурні ешелони захисту від Rowhammer у пам'яті та контролері</text>
<rect x="40.0" y="60.0" width="255.0" height="410.0" rx="8" fill="#fdfefe" stroke="#6b7280" stroke-width="1.5"/>
<text x="167.5" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Усередині чіпа (In-DRAM)</text>
<rect x="52.0" y="105.0" width="231.0" height="85.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.2"/>
<text x="167.5" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Target Row Refresh (TRR)</text>
<text x="60.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Апаратне семплювання адрес</text>
<text x="60.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Приховані цикли поновлення сусідів</text>
<text x="60.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Вразливий до Blacksmith / TRRespass</text>
<rect x="52.0" y="200.0" width="231.0" height="95.0" rx="6" fill="#f5f0eb" stroke="#b89d85" stroke-width="1.2"/>
<text x="167.5" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d5d3b" text-anchor="middle" font-weight="700">Фізичне проектування комірок</text>
<text x="60.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Збільшення ізоляції Wordline</text>
<text x="60.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Глибші кишені (Deep Well)</text>
<text x="60.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Збільшення ємності C_S (&gt; 15 fF)</text>
<text x="60.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Обмежує масштабування вузла</text>
<rect x="52.0" y="305.0" width="231.0" height="150.0" rx="6" fill="#fdf0ed" stroke="#c0392b" stroke-width="1.2"/>
<text x="167.5" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">DDR5: Directed RFM / DRR</text>
<text x="60.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Сигнал RFM (Refresh Management)</text>
<text x="60.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Чіп сигналізує про високе навантаження</text>
<text x="60.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Контролер виділяє квант часу</text>
<text x="60.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• DRR: точна адреса агресора</text>
<text x="60.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• Стандарт JEDEC DDR5</text>
<rect x="312.0" y="60.0" width="255.0" height="410.0" rx="8" fill="#fdfefe" stroke="#6b7280" stroke-width="1.5"/>
<text x="439.5" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Контролер пам'яті (MC)</text>
<rect x="324.0" y="105.0" width="231.0" height="100.0" rx="6" fill="#fbf8e6" stroke="#d6b656" stroke-width="1.2"/>
<text x="439.5" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#825a00" text-anchor="middle" font-weight="700">2x / 4x Refresh Rate</text>
<text x="332.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Скорочення tREFI: 7.8 мкс → 3.9 мкс</text>
<text x="332.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Вдвічі менше часу на атаку</text>
<text x="332.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Падіння пропускної здатності ~3-5%</text>
<text x="332.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Ріст енергоспоживання</text>
<rect x="324.0" y="215.0" width="231.0" height="115.0" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.2"/>
<text x="439.5" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Алгоритм PARA</text>
<text x="332.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Ймовірнісна регенерація сусідів</text>
<text x="332.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• На кожне закриття PRE з ймов. p ≈ 0.001</text>
<text x="332.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  поновлюється рядок (Row ± 1)</text>
<text x="332.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">• Без збереження стану й пам'яті!</text>
<text x="332.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Нульові накладні витрати пам'яті</text>
<rect x="324.0" y="340.0" width="231.0" height="115.0" rx="6" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1.2"/>
<text x="439.5" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7b1fa2" text-anchor="middle" font-weight="700">Детерміновані лічильники</text>
<text x="332.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• TWiCE / Graphene / BlockHammer</text>
<text x="332.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Точний підрахунок ACT по рядках</text>
<text x="332.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Примусове гальмування агресора</text>
<text x="332.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Потребує буферів у MC</text>
<rect x="584.0" y="60.0" width="255.0" height="410.0" rx="8" fill="#fdfefe" stroke="#6b7280" stroke-width="1.5"/>
<text x="711.5" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Системний та ОС рівень</text>
<rect x="596.0" y="105.0" width="231.0" height="110.0" rx="6" fill="#ede7f6" stroke="#673ab7" stroke-width="1.2"/>
<text x="711.5" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#512da8" text-anchor="middle" font-weight="700">ECC (SECDED &amp; Chipkill)</text>
<text x="604.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Виправляє 1 біт на 64-бітне слово</text>
<text x="604.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Детектує 2 біти (падіння в Kernel Panic)</text>
<text x="604.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Вразливий до спрямованого</text>
<text x="604.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">  мультибітного збою (ECCploit)</text>
<rect x="596.0" y="225.0" width="231.0" height="105.0" rx="6" fill="#efebe9" stroke="#8d6e63" stroke-width="1.2"/>
<text x="711.5" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4e342e" text-anchor="middle" font-weight="700">Ізоляція сторінок у ядрі ОС</text>
<text x="604.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• B-Alloc / ZebRAM ізоляція</text>
<text x="604.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Розділення фізичних рядків ядра</text>
<text x="604.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  та непривілейованих процесів</text>
<text x="604.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Захисні смуги порожніх сторінок</text>
<rect x="596.0" y="340.0" width="231.0" height="115.0" rx="6" fill="#e0f2f1" stroke="#00897b" stroke-width="1.2"/>
<text x="711.5" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#004d40" text-anchor="middle" font-weight="700">Програмні обмеження</text>
<text x="604.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Заборона некешованого доступу</text>
<text x="604.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Зниження точності таймерів у JS</text>
<text x="604.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  (performance.now)</text>
<text x="604.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Блокування інструкцій clflush</text>
</svg>