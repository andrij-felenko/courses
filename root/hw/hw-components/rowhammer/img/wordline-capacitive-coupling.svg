<rect x="180.0" y="275.0" width="60.0" height="45.0" rx="2" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
<text x="110.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#274e13" text-anchor="middle" font-weight="700">n+ (BL)</text>
<text x="210.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#274e13" text-anchor="middle" font-weight="700">n+ (C_S)</text>
<rect x="290.0" y="275.0" width="60.0" height="45.0" rx="2" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
