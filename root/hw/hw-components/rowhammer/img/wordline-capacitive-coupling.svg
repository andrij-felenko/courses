<text x="320.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#660000" text-anchor="middle" font-weight="700">n+ (BL)</text>
<text x="420.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#660000" text-anchor="middle" font-weight="700">n+ (C_V)</text>
<rect x="130.0" y="220.0" width="60.0" height="65.0" rx="3" fill="#ffe6cc" stroke="#c0392b" stroke-width="2.0"/>
<text x="160.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">WL_A</text>
<text x="160.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Агресор</text>
<rect x="340.0" y="220.0" width="60.0" height="65.0" rx="3" fill="#e1d5e7" stroke="#2457d6" stroke-width="2.0"/>
<text x="370.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">WL_V</text>
<text x="370.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">Жертва</text>
<rect x="195.0" y="110.0" width="30.0" height="160.0" rx="3" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="210.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">C_A</text>
<rect x="405.0" y="110.0" width="30.0" height="160.0" rx="3" fill="#f8cecc" stroke="#c0392b" stroke-width="1.8"/>
<text x="420.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">C_V</text>
<text x="420.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Заряд</text>
<line x1="190.0" y1="252.0" x2="340.0" y2="252.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,3"/>
<text x="265.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">C_WL-WL</text>
<text x="265.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">(перехресний зв'язок)</text>
<line x1="160.0" y1="285.0" x2="230.0" y2="340.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="210.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Гарячі носії (HCI)</text>
<line x1="260.0" y1="375.0" x2="380.0" y2="310.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="340.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Струм витоку I_sub</text>
<rect x="540.0" y="55.0" width="300.0" height="435.0" rx="8" fill="#f8f9fa" stroke="#6b7280" stroke-width="1.5"/>
<text x="690.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три вектори деградації заряду</text>
<rect x="552.0" y="98.0" width="276.0" height="100.0" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.2"/>
<text x="564.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#825a00" text-anchor="start" font-weight="700">1. Ємнісне перекачування (C_WL-WL)</text>
<text x="564.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Перемикання WL_A (V_PP ↔ V_NWL)</text>
<text x="564.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">наводить імпульси напруги ΔV на WL_V,</text>
<text x="564.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">миттєво відкриваючи закритий транзистор.</text>
<text x="564.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#825a00" text-anchor="start" font-weight="700">Втрата: ΔQ = C_couple · ΔV_WL</text>
<rect x="552.0" y="210.0" width="276.0" height="110.0" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="1.2"/>
<text x="564.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#990000" text-anchor="start" font-weight="700">2. Інжекція гарячих носіїв (HCI)</text>
<text x="564.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Різкі фронти з амплітудою ~3.3 В</text>
<text x="564.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">створюють високоенергетичні електрони.</text>
<text x="564.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Вони дифундують крізь p-кишеню</text>
<text x="564.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">і захоплюються вузлом зберігання C_V.</text>
<rect x="552.0" y="332.0" width="276.0" height="140.0" rx="6" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.2"/>
<text x="564.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4a2574" text-anchor="start" font-weight="700">3. Флуктуація потенціалу підкладки</text>
<text x="564.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Струми перемикання зміщують</text>
<text x="564.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">локальний потенціал p-well (body bounce).</text>
<text x="564.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Це знижує порогову напругу V_th жертви</text>
<text x="564.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">та експоненційно розганяє підпороговий</text>
<text x="564.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">струм розряду конденсатора (GIDL/I_sub).</text>
</svg>