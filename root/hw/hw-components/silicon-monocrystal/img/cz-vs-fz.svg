<rect x="560.0" y="175.0" width="30.0" height="30.0" rx="0" fill="#f0a830" stroke="#c07a10" stroke-width="1.3"/>
<ellipse cx="575" cy="190" rx="30" ry="11" fill="none" stroke="#c0392b" stroke-width="3.5"/>
<text x="620.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">індуктор</text>
<line x1="640" y1="205" x2="640" y2="160" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="648.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">зона</text>
<text x="648.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">повзе</text>
<text x="575.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">БЕЗ тигля: розплав ні з чим</text>
<text x="575.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">не контактує</text>
<text x="575.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">найчистіше · дорого · силова техніка</text>
<text x="380.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">У CZ розплав торкається кварцового тигля й бере з нього кисень; у FZ розплавлена зона висить без тигля — звідси гранична чистота.</text>
