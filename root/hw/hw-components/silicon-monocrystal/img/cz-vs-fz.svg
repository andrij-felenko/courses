<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два способи: Чохральський (CZ) і зонна плавка (FZ)</text>
<text x="195.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чохральський (CZ)</text>
<path d="M 150,150 L 150,240 Q 150,270 178,270 L 282,270 Q 310,270 310,240 L 310,150" fill="#efe7d2" stroke="#1a1a1a" stroke-width="2"/>
