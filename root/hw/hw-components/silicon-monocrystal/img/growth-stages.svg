<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три стадії росту злитка й чим керують</text>
<polygon points="248,60 264,60 264,96 258,108 258,140 300,180 300,300 212,300 212,180 254,140 254,108" fill="#aebfd8" stroke="#1a1a1a" stroke-width="2"/>
<rect x="243.0" y="50.0" width="26.0" height="12.0" rx="6" fill="#cdd9ec" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="304.0" y1="118.0" x2="470.0" y2="118.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="478.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">затравка + ШИЙКА</text>
<text x="480.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="480.0" dy="0.0">тягнуть ШВИДКО → вузько;</tspan><tspan x="480.0" dy="14.3">дефекти «висипаються»</tspan></text>
<line x1="304.0" y1="200.0" x2="470.0" y2="200.0" stroke="#b9770e" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="478.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9770e" text-anchor="start" font-weight="700">КОНУС (розширення)</text>
<text x="480.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="480.0" dy="0.0">швидкість ↓ повільно →</tspan><tspan x="480.0" dy="14.3">діаметр росте плавно</tspan></text>
<line x1="304.0" y1="270.0" x2="470.0" y2="270.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="3,3"/>
<text x="478.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">ТІЛО (циліндр)</text>
<text x="480.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="480.0" dy="0.0">стала швидкість і темп. →</tspan><tspan x="480.0" dy="14.3">рівний діаметр</tspan></text>
<text x="380.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Швидкість витягування й температуру тримають у вузьких межах: швидше — дефекти й вузько, повільніше — роздування.</text>
</svg>