<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340">
<rect width="760" height="340" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="380.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Програли не фізику, а економіку масовості</text>
<rect x="48.0" y="52.0" width="320.0" height="150.0" rx="9" fill="#e9eefb" stroke="#5f76bd" stroke-width="1.8"/>
<text x="208.0" y="74.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Ставка Швейцарії</text>
<text x="64.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#33405e" text-anchor="start" font-weight="normal" font-style="normal">• лишитися при механіці й майстерності</text>
<text x="64.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#33405e" text-anchor="start" font-weight="normal" font-style="normal">• Beta 21 — лише ~6000 шт., знято за рік-два</text>
<text x="64.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#33405e" text-anchor="start" font-weight="normal" font-style="normal">• точність є, дешевого конвеєра — нема</text>
<text x="208.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="italic" font-style="normal">→ продукт-витвір, малий тираж</text>
<rect x="392.0" y="52.0" width="320.0" height="150.0" rx="9" fill="#eef6ef" stroke="#3f9a57" stroke-width="1.8"/>
<text x="552.0" y="74.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Ставка Японії та США</text>
<text x="408.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#23502f" text-anchor="start" font-weight="normal" font-style="normal">• Seiko, Citizen, Casio: мислять електронікою</text>
<text x="408.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#23502f" text-anchor="start" font-weight="normal" font-style="normal">• TI, Fairchild, National: дешева ІС-дільник</text>
<text x="408.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#23502f" text-anchor="start" font-weight="normal" font-style="normal">• кварц мільйонами, ціна → копійки</text>
<text x="552.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="italic" font-style="normal">→ масовий товар, величезний тираж</text>
<text x="380.0" y="228.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Зайнятість у швейцарській годинниковій галузі (перевірити)</text>
<line x1="130.0" y1="310.0" x2="630.0" y2="310.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<line x1="130.0" y1="240.0" x2="130.0" y2="310.0" stroke="#1b1b1b" stroke-width="1.8" stroke-linecap="round"/>
<path d="M 170.0,240.0 L 570.0,288.2" fill="none" stroke="#c0271e" stroke-width="3"/>
<circle cx="170.0" cy="240.0" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="2"/>
<circle cx="570.0" cy="288.2" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="2"/>
<text x="170.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1970: ~90 000</text>
<text x="570.0" y="278.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1988: ~28 000</text>
<text x="370.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="italic" font-style="normal">за десятиліття — мінус дві третини галузі</text>
</svg>
