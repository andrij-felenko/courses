<text x="248.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">P_спонт</text>
<text x="192.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ti⁴⁺ зміщений від центру на ~0.01 нм</text>
<text x="192.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">утворює постійний спонтанний диполь у кожній комірці</text>
<text x="192.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Ba²⁺ (вершини)   O²⁻ (грані)   Ti⁴⁺ (центр)</text>
