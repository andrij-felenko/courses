<text x="192.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Перовскітна структура нижче точки Кюрі (&lt;125 °C)</text>
