<text x="562.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поляризація доменів під зовнішнім полем</text>
<rect x="405.0" y="95.0" width="150.0" height="110.0" rx="4" fill="#ffffff" stroke="#4a5568" stroke-width="1.2"/>
<text x="480.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">E = 0 (без DC-зміщення)</text>
