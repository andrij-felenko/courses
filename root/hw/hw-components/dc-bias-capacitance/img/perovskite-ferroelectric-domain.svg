<line x1="435.0" y1="175.0" x2="455.0" y2="195.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="510.0" y1="195.0" x2="535.0" y2="175.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="480.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Доменні стінки вільно коливаються</text>
<text x="480.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">величезна відповідь dP/dE → висока ємність</text>
<rect x="575.0" y="95.0" width="150.0" height="110.0" rx="4" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="650.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">E &gt;&gt; 0 (сильне DC-поле)</text>
<line x1="590.0" y1="130.0" x2="710.0" y2="130.0" stroke="#2b6cb0" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="650.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2b6cb0" text-anchor="middle" font-weight="700">Зовнішнє поле E = V/d</text>
<line x1="600.0" y1="165.0" x2="640.0" y2="165.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="660.0" y1="165.0" x2="700.0" y2="165.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="190.0" x2="640.0" y2="190.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="660.0" y1="190.0" x2="700.0" y2="190.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="650.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Усі домени вишикувані й заблоковані</text>
<text x="650.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">насичення: dP/dE → 0 → ємність падає</text>
<rect x="405.0" y="255.0" width="320.0" height="95.0" rx="6" fill="#edf2f7" stroke="#cbd5e0" stroke-width="1.0"/>
<text x="565.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм втрати ємності під напругою:</text>
<text x="565.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">1. Постійна напруга створює поле E = V/d всередині шару</text>
<text x="565.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">2. Поле примусово повертає спонтанні диполі до насичення</text>
<text x="565.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">3. На малий змінний сигнал AC відгуку майже не лишається</text>
</svg>