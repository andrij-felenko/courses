<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="15.0" width="840.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="38.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Фізика замикання паразитного BJT та динамічного пробою dV/dt</tspan></text>
<rect x="40.0" y="70.0" width="420.0" height="25.0" rx="6" fill="#b0bec5" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="250.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Металізація витоку (Source)</text>
<rect x="60.0" y="95.0" width="100.0" height="45.0" rx="6" fill="#ffe082" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="110.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">n+ Source (Емітер)</text>
<rect x="340.0" y="95.0" width="100.0" height="45.0" rx="6" fill="#ffe082" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="390.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">n+ Source (Емітер)</text>
<rect x="200.0" y="95.0" width="100.0" height="45.0" rx="6" fill="#ab47bc" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="250.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">p+ контакт</text>
<rect x="40.0" y="140.0" width="420.0" height="90.0" rx="6" fill="#ce93d8" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="250.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">p-Body область (База паразитного BJT)</text>
<rect x="75.0" y="180.0" width="70.0" height="20.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="110.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">R_body</text>
<rect x="355.0" y="180.0" width="70.0" height="20.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="390.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">R_body</text>
<rect x="40.0" y="230.0" width="420.0" height="140.0" rx="6" fill="#fff9c4" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="250.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">n- Drift зона (Колектор BJT)</text>
<line x1="110.0" y1="330.0" x2="110.0" y2="210.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="110.0" y1="200.0" x2="200.0" y2="140.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="130.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">I_hole + C_j·(dV/dt)</text>
<line x1="390.0" y1="330.0" x2="390.0" y2="210.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="390.0" y1="200.0" x2="300.0" y2="140.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="40.0" y="370.0" width="420.0" height="25.0" rx="6" fill="#b0bec5" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="250.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стік (Drain) — високий потенціал +V_bus</text>
<rect x="490.0" y="65.0" width="360.0" height="400.0" rx="6" fill="#ffebee" stroke="#c0392b" stroke-width="1.5"/><text x="670.0" y="140.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Ланцюг катастрофічного відмикання BJT:</tspan><tspan x="670.0" dy="14.3"></tspan><tspan x="670.0" dy="14.3">1. Snappy-відновлення спричиняє екстремальне</tspan><tspan x="670.0" dy="14.3">   наростання напруги dV/dt на стоку.</tspan><tspan x="670.0" dy="14.3"></tspan><tspan x="670.0" dy="14.3">2. Струм винесення дірок I_rr та ємнісний</tspan><tspan x="670.0" dy="14.3">   струм C_oss·(dV/dt) течуть горизонтально</tspan><tspan x="670.0" dy="14.3">   крізь p-body до контакту витоку.</tspan><tspan x="670.0" dy="14.3"></tspan><tspan x="670.0" dy="14.3">3. На розподіленому опорі R_body під n+ шаром</tspan><tspan x="670.0" dy="14.3">   виникає падіння напруги:</tspan><tspan x="670.0" dy="14.3">   V_BE = I_body · R_body.</tspan><tspan x="670.0" dy="14.3"></tspan><tspan x="670.0" dy="14.3">4. Якщо V_BE ≥ 0.7 В, емітерний перехід</tspan><tspan x="670.0" dy="14.3">   паразитного NPN відкривається!</tspan><tspan x="670.0" dy="14.3"></tspan><tspan x="670.0" dy="14.3">5. NPN входить у лавинне шнурування струму</tspan><tspan x="670.0" dy="14.3">   (secondary breakdown) → миттєвий</tspan><tspan x="670.0" dy="14.3">   локальний пропал кристала.</tspan></text>
<rect x="40.0" y="410.0" width="420.0" height="65.0" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="438.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Умова безпеки від Latch-up:</tspan><tspan x="250.0" dy="15.6">V_BE = [ (C_j · dV/dt) + I_rr ] · R_body &lt; 0.7 В</tspan></text>
</svg>