<rect x="470.0" y="65.0" width="400.0" height="25.0" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="81.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">Напруга сток-витік v_DS(t)</tspan></text>
<line x1="490.0" y1="240.0" x2="870.0" y2="240.0" stroke="#333333" stroke-width="1.5"/>
<text x="865.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">t</text>
<line x1="520.0" y1="80.0" x2="520.0" y2="270.0" stroke="#333333" stroke-width="1.5"/>
<text x="510.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">v_DS</text>
<line x1="515.0" y1="170.0" x2="525.0" y2="170.0" stroke="#333333" stroke-width="1.2"/>
<text x="485.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">V_bus</text>
<line x1="515.0" y1="105.0" x2="525.0" y2="105.0" stroke="#c0392b" stroke-width="1.2"/>
<text x="465.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">V_spike</text>
<line x1="520.0" y1="250.0" x2="640.0" y2="250.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="570.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">−V_F</text>
<line x1="640.0" y1="250.0" x2="700.0" y2="170.0" stroke="#2457d6" stroke-width="2.5"/>
<line x1="700.0" y1="170.0" x2="840.0" y2="170.0" stroke="#2457d6" stroke-width="2.5"/>
<path d="M 640,250 L 685,105 L 705,200 L 725,155 L 745,175 L 765,170 L 840,170" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
<text x="710.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">L_loop · (di_rr/dt)</text>
<rect x="30.0" y="310.0" width="410.0" height="185.0" rx="6" fill="#f0f4c3" stroke="#c0ca33" stroke-width="1.5"/><text x="235.0" y="377.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Фази відновлення:</tspan><tspan x="235.0" dy="14.3">• t_a: винесення носіїв, i_D падає від 0 до −I_rrm.</tspan><tspan x="235.0" dy="14.3">• t_b: відновлення збідненого шару, спад струму до 0.</tspan><tspan x="235.0" dy="14.3">• Q_rr = ∫ i_rr dt = ½ · I_rrm · t_rr (заряд).</tspan><tspan x="235.0" dy="14.3">• Коефіцієнт м'якості: S = t_b / t_a.</tspan></text>
<rect x="470.0" y="310.0" width="400.0" height="185.0" rx="6" fill="#ffebee" stroke="#c0392b" stroke-width="1.5"/><text x="670.0" y="377.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Небезпека Snappy Recovery (S ≪ 1):</tspan><tspan x="670.0" dy="14.3">• Миттєвий обрив струму (snap-off) під час t_b.</tspan><tspan x="670.0" dy="14.3">• Гігантська швидкість спаду di_rr/dt (&gt; 5000 А/мкс).</tspan><tspan x="670.0" dy="14.3">• Сплеск V_spike = L_loop · di_rr/dt пробиває MOSFET.</tspan><tspan x="670.0" dy="14.3">• Високочастотний дзвін генерує сильні EMI.</tspan></text>
</svg>