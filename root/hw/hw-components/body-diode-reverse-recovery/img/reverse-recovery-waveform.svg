<line x1="140.0" y1="120.0" x2="200.0" y2="180.0" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="200.0" y1="180.0" x2="260.0" y2="245.0" stroke="#2457d6" stroke-width="2.2"/>
