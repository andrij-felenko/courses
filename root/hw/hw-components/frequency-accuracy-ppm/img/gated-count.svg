<text x="355.0" y="256.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">N = скільки фронтів вмістилось у ворота</text>
<line x1="50.0" y1="278.0" x2="720.0" y2="278.0" stroke="#e4e4e4" stroke-width="1.5" stroke-linecap="round"/>
<text x="60.0" y="300.0" font-family='"Consolas","Courier New",monospace' font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">f_виміряна = N / T_gate     →     похибка = (f_вим − f_номінал) / f_номінал</text>
<text x="60.0" y="322.0" font-family='"Consolas","Courier New",monospace' font-size="13" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">роздільність = ±1 такт за все вікно: фіксована невизначеність / T_gate</text>
<text x="95.0" y="358.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">ворота</text>
<text x="300.0" y="358.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">крок у ppm</text>
<text x="480.0" y="358.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">що бачимо</text>
<line x1="85.0" y1="366.0" x2="685.0" y2="366.0" stroke="#e4e4e4" stroke-width="1.2" stroke-linecap="round"/>
<text x="95.0" y="392.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="16" fill="#e0a32e" text-anchor="start" font-weight="bold" font-style="normal">1 с</text>
<text x="300.0" y="392.0" font-family='"Consolas","Courier New",monospace' font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">≈ 0.0625 ppm</text>
<text x="480.0" y="392.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="13" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">вже дрібніше за дрейф кварцу</text>
<text x="95.0" y="421.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="16" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">10 с</text>
<text x="300.0" y="421.0" font-family='"Consolas","Courier New",monospace' font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">≈ 0.00625 ppm</text>
<text x="480.0" y="421.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="13" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">впевнено ловимо одиниці ppm</text>
<text x="95.0" y="450.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="16" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">100 с</text>
<text x="300.0" y="450.0" font-family='"Consolas","Courier New",monospace' font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">≈ 0.000625 ppm</text>
<text x="480.0" y="450.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="13" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">доходимо до часток ppm</text>
<text x="380.0" y="474.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Свого таймера для лічби мало — він сам бреше. Ворота МУСЯТЬ приходити ззовні, від точнішого джерела.</text>
