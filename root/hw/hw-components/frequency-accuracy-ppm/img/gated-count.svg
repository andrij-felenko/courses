<text x="380.0" y="28.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ворота від точного джерела, лічба — від свого кварцу</text>
<text x="70.0" y="64.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="13" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">ТОЧНЕ джерело: відмірює рівно 1.000000 с</text>
