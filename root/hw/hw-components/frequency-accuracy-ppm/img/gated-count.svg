<text x="70.0" y="186.0" font-family='Segoe UI, Arial, Helvetica, sans-serif' font-size="13" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">ТВІЙ кварц 16 МГц: лічильник рахує фронти</text>
