<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Умови заводського стенда проти реальної плати</text>
<rect x="40.0" y="30.0" width="350.0" height="310.0" rx="8" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/>
<text x="215.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ЛАБОРАТОРНИЙ ТЕСТОВИЙ СТЕНД (ATE)</text>
<text x="55.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Тривалість імпульсу:</text>
<text x="55.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">t_pulse = 300 мкс (t &lt; τ_die)</text>
<line x1="55.0" y1="118.0" x2="375.0" y2="118.0" stroke="#c7d7f7" stroke-width="1.0"/>
<text x="55.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Шпаруватість (Duty):</text>
<text x="55.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">D &lt; 2% (нульовий перегрів)</text>
<line x1="55.0" y1="154.0" x2="375.0" y2="154.0" stroke="#c7d7f7" stroke-width="1.0"/>
<text x="55.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Температура кристала:</text>
<text x="55.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">T_j = 25 °C (холодний масив)</text>
<line x1="55.0" y1="190.0" x2="375.0" y2="190.0" stroke="#c7d7f7" stroke-width="1.0"/>
<text x="55.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Напруга на затворі:</text>
<text x="55.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">V_GS = 10.0 В (глибоке насичення)</text>
<line x1="55.0" y1="226.0" x2="375.0" y2="226.0" stroke="#c7d7f7" stroke-width="1.0"/>
<text x="55.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Паразитне навантаження:</text>
<text x="55.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">C_L = 15 пФ, R_L = ∞ (ідеальне)</text>
<line x1="55.0" y1="262.0" x2="375.0" y2="262.0" stroke="#c7d7f7" stroke-width="1.0"/>
<text x="55.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Струм споживання:</text>
<text x="55.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">I_q без вихідного струму I_out</text>
<line x1="55.0" y1="298.0" x2="375.0" y2="298.0" stroke="#c7d7f7" stroke-width="1.0"/>
<text x="215.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">РЕЗУЛЬТАТ: Ідеальні мінімальні числа у паспорті</text>
<rect x="430.0" y="30.0" width="350.0" height="310.0" rx="8" fill="#fbecec" stroke="#c0392b" stroke-width="1.8"/>
<text x="605.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">РЕАЛЬНА РОБОЧА ДРУКОВАНА ПЛАТА</text>
<text x="445.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Режим живлення:</text>
<text x="445.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">Постійний DC або висока частота ШІМ</text>
<line x1="445.0" y1="118.0" x2="765.0" y2="118.0" stroke="#f5c6cb" stroke-width="1.0"/>
<text x="445.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Шпаруватість (Duty):</text>
<text x="445.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">D = 50...100% (постійні втрати)</text>
<line x1="445.0" y1="154.0" x2="765.0" y2="154.0" stroke="#f5c6cb" stroke-width="1.0"/>
<text x="445.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Температура кристала:</text>
<text x="445.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">T_j = 95...135 °C (нагрів корпусу)</text>
<line x1="445.0" y1="190.0" x2="765.0" y2="190.0" stroke="#f5c6cb" stroke-width="1.0"/>
<text x="445.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Напруга на затворі:</text>
<text x="445.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">V_GS = 3.3 В (вихід логіки MCU)</text>
<line x1="445.0" y1="226.0" x2="765.0" y2="226.0" stroke="#f5c6cb" stroke-width="1.0"/>
<text x="445.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Паразитне навантаження:</text>
<text x="445.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">C_L = 150 пФ (траси + кабелі)</text>
<line x1="445.0" y1="262.0" x2="765.0" y2="262.0" stroke="#f5c6cb" stroke-width="1.0"/>
<text x="445.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Струм споживання:</text>
<text x="445.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">I_total = I_q + I_load (навантаження)</text>
<line x1="445.0" y1="298.0" x2="765.0" y2="298.0" stroke="#f5c6cb" stroke-width="1.0"/>
<text x="605.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">РЕЗУЛЬТАТ: Опір каналу вищий у 2–4 рази, смуга вужча</text>
<text x="410.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Умови тесту оптимізовані для автоматичного вимірювання, а не для повторення вашої схеми</text>
</svg>