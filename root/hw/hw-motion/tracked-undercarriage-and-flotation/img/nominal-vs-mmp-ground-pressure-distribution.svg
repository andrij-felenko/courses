<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Номінальний тиск проти середнього максимального тиску (MMP)</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Нерівномірність розподілу навантаження: реальні піки тиску під опорними котками гусениці</text>

  <!-- Left: Track & Pressure Curves Area -->
  <rect x="40" y="80" width="560" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Track Undercarriage Outline (Top part of Left Area) -->
  <path d="M 80,140 h 380 v 50 h -380 z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <!-- Road wheels -->
  <circle cx="120" cy="165" r="20" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="190" cy="165" r="20" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="260" cy="165" r="20" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="330" cy="165" r="20" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="400" cy="165" r="20" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="485" y="170" font-size="11" font-weight="bold" fill="#2457d6">5 котків</text>

  <!-- Ground Line -->
  <line x1="60" y1="210" x2="540" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <text x="490" y="205" font-size="11" fill="#6b7280">Поверхня</text>

  <!-- Nominal Pressure (Blue dashed flat line) -->
  <line x1="80" y1="250" x2="460" y2="250" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="475" y="255" font-size="11" font-weight="bold" fill="#2457d6">p_nom = 40 кПа</text>

  <!-- Real MMP Peaks (Red curve with 5 deep peaks) -->
  <path d="M 80,225 Q 120,380 145,240 Q 190,380 215,240 Q 260,380 285,240 Q 330,380 355,240 Q 400,380 430,230" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="445" y="370" font-size="12" font-weight="bold" fill="#c0392b">MMP = 180 кПа</text>

  <!-- Right: Theory & Rowland Formula Panel -->
  <rect x="620" y="80" width="300" height="345" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="770" y="110" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Теорія Роуленда (Rowland MMP)</text>

  <rect x="635" y="130" width="270" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="152" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Номінальний тиск (ілюзія):</text>
  <text x="770" y="174" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">p_nom = M * g / (2 * b * L_ground)</text>
  <text x="770" y="196" font-size="11" fill="#6b7280" text-anchor="middle">Припускає ідеально жорстку плоску плиту</text>

  <rect x="635" y="225" width="270" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="247" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Середній піковий тиск (реальність):</text>
  <text x="770" y="268" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">MMP = (p_nom * L) / (n * sqrt(d_wheel * p_track))</text>
  <text x="770" y="290" font-size="11" fill="#1a1a1a" text-anchor="middle">Піки під котками перевищують p_nom</text>
  <text x="770" y="306" font-size="11" fill="#c0392b" text-anchor="middle">у 3...5 разів, руйнуючи тримкість ґрунту</text>

  <rect x="635" y="330" width="270" height="80" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="352" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Інженерний висновок:</text>
  <text x="770" y="372" font-size="11" fill="#1a1a1a" text-anchor="middle">Збільшення кількості котків n та</text>
  <text x="770" y="390" font-size="11" fill="#27ae60" text-anchor="middle">їхнього діаметра d знижує MMP на 40%</text>
</svg>
