<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-shear-sk" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Механіка занурення гусениці та зсуву ґрунту (Терамеханіка)</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Глибина колії z_0, кут атаки стрічки та формування сили зчеплення в шарі зсуву</text>

  <!-- Left: Terramechanics Diagram Area -->
  <rect x="40" y="80" width="560" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Original soil surface (dashed line) -->
  <line x1="60" y1="200" x2="560" y2="200" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="500" y="190" font-size="11" fill="#6b7280">Поверхня ґрунту</text>

  <!-- Sunken Track Segment -->
  <path d="M 80,180 L 160,270 L 460,270" fill="none" stroke="#2457d6" stroke-width="4"/>
  <!-- Grousers -->
  <line x1="200" y1="270" x2="200" y2="290" stroke="#2457d6" stroke-width="3"/>
  <line x1="260" y1="270" x2="260" y2="290" stroke="#2457d6" stroke-width="3"/>
  <line x1="320" y1="270" x2="320" y2="290" stroke="#2457d6" stroke-width="3"/>
  <line x1="380" y1="270" x2="380" y2="290" stroke="#2457d6" stroke-width="3"/>
  <line x1="440" y1="270" x2="440" y2="290" stroke="#2457d6" stroke-width="3"/>

  <!-- Sinkage dimension z_0 -->
  <line x1="480" y1="200" x2="480" y2="270" stroke="#c0392b" stroke-width="2"/>
  <text x="495" y="240" font-size="12" font-weight="bold" fill="#c0392b">Колія z_0</text>

  <!-- Soil Shear Bulb (Zone of failure) -->
  <path d="M 160,290 Q 310,380 460,290 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="310" y="340" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зона пластичного зсуву ґрунту</text>

  <!-- Traction shear vector -->
  <line x1="220" y1="300" x2="160" y2="300" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-shear-sk)"/>
  <text x="80" y="305" font-size="11" font-weight="bold" fill="#27ae60">Опір tau</text>

  <!-- Right: Bekker Theory Panel -->
  <rect x="620" y="80" width="300" height="345" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="770" y="110" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Модель Беккера</text>

  <rect x="635" y="130" width="270" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="152" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Рівняння занурення (Sinkage):</text>
  <text x="770" y="174" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">p = (k_c / b + k_phi) * z^n</text>
  <text x="770" y="196" font-size="11" fill="#6b7280" text-anchor="middle">k_c, k_phi, n — модуль деформації ґрунту</text>

  <rect x="635" y="225" width="270" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="247" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Закон зсуву Кулона-Мора:</text>
  <text x="770" y="268" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">tau_max = c + sigma * tg(phi)</text>
  <text x="770" y="290" font-size="11" fill="#1a1a1a" text-anchor="middle">c — питоме зчеплення зв'язного ґрунту</text>
  <text x="770" y="306" font-size="11" fill="#6b7280" text-anchor="middle">phi — кут внутрішнього тертя піску</text>

  <rect x="635" y="330" width="270" height="80" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="352" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Опір коченню від деформації:</text>
  <text x="770" y="375" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">R_c = (b * (k_c/b + k_phi) * z^(n+1)) / (n+1)</text>
  <text x="770" y="393" font-size="11" fill="#6b7280" text-anchor="middle">Глибша колія веде до різкого падіння ККД</text>
</svg>
