<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінематика підвісок гусеничного рушія</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Незалежна торсіонна підвіска з балансиром проти блокованої візкової схеми та натяжний механізм</text>

  <!-- Left: Mechanism Types Area -->
  <rect x="40" y="80" width="560" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Top: Independent Torsion Bar Suspension -->
  <rect x="55" y="95" width="530" height="150" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="70" y="120" font-size="13" font-weight="bold" fill="#2457d6">Тип А: Індивідуальна торсіонна підвіска</text>

  <!-- Hull line -->
  <line x1="70" y1="160" x2="350" y2="160" stroke="#1a1a1a" stroke-width="3"/>
  <text x="70" y="152" font-size="10" fill="#6b7280">Борт корпусу</text>

  <!-- Torsion Bar Axis and Balancer arm -->
  <circle cx="200" cy="160" r="10" fill="#2457d6"/>
  <text x="200" y="145" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">Торсіон</text>
  <line x1="200" y1="160" x2="260" y2="210" stroke="#1a1a1a" stroke-width="6"/>
  <text x="245" y="180" font-size="10" font-weight="bold" fill="#1a1a1a">Балансир</text>

  <!-- Road Wheel -->
  <circle cx="260" cy="210" r="25" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <circle cx="260" cy="210" r="6" fill="#1a1a1a"/>

  <!-- Shock Absorber -->
  <line x1="240" y1="160" x2="255" y2="195" stroke="#c0392b" stroke-width="3"/>
  <text x="365" y="175" font-size="11" font-weight="bold" fill="#2457d6">Хід котка Delta h = 250...350 мм</text>
  <text x="365" y="195" font-size="11" fill="#6b7280">Висока швидкість руху (до 70 км/год)</text>

  <!-- Bottom: Bogie Suspension & Tensioner -->
  <rect x="55" y="260" width="530" height="150" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="70" y="285" font-size="13" font-weight="bold" fill="#27ae60">Тип Б: Блокований візок (Bogie) та гідронатягувач</text>

  <!-- Central Pivot -->
  <polygon points="170,360 160,390 180,390" fill="#1a1a1a"/>
  <line x1="120" y1="360" x2="220" y2="360" stroke="#1a1a1a" stroke-width="5"/>
  <circle cx="120" cy="360" r="20" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <circle cx="220" cy="360" r="20" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="170" y="340" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Хитний балансир візка</text>

  <!-- Tensioner Cylinder -->
  <rect x="320" y="325" width="80" height="25" rx="4" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="400" y1="337" x2="435" y2="337" stroke="#c0392b" stroke-width="4"/>
  <circle cx="455" cy="337" r="18" fill="white" stroke="#c0392b" stroke-width="2"/>
  <text x="455" y="375" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">Лінивець</text>
  <text x="340" y="315" font-size="10" fill="#6b7280">Гідронатяг</text>

  <!-- Right: Comparison Panel -->
  <rect x="620" y="80" width="300" height="345" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="770" y="110" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Порівняльний аналіз</text>

  <rect x="635" y="130" width="270" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="152" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Торсіонна схема:</text>
  <text x="770" y="172" font-size="11" fill="#1a1a1a" text-anchor="middle">• Максимальна плавність на нерівностях</text>
  <text x="770" y="190" font-size="11" fill="#1a1a1a" text-anchor="middle">• Велика енергоємність гідроамортизаторів</text>
  <text x="770" y="206" font-size="11" fill="#6b7280" text-anchor="middle">• Торсіони займають простір днища</text>

  <rect x="635" y="225" width="270" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="247" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Блокована (візкова) схема:</text>
  <text x="770" y="268" font-size="11" fill="#1a1a1a" text-anchor="middle">• Вирівнювання навантаження на котки</text>
  <text x="770" y="286" font-size="11" fill="#1a1a1a" text-anchor="middle">• Компактність: монтаж зовні бронекорпусу</text>
  <text x="770" y="304" font-size="11" fill="#6b7280" text-anchor="middle">• Обмежений динамічний хід на швидкості</text>

  <rect x="635" y="330" width="270" height="80" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="352" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Функція натягувача лінивця:</text>
  <text x="770" y="372" font-size="11" fill="#1a1a1a" text-anchor="middle">Підтримує попередній натяг гусениці,</text>
  <text x="770" y="390" font-size="11" fill="#c0392b" text-anchor="middle">унеможливлюючи спадання стрічки</text>
</svg>
