<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінематика шарніра Гука та взаємна компенсація у здвоєному кардані</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Одинарний шарнір породжує пульсацію 2/rev, тоді як спарена схема із симетричними кутами beta1 = beta2 її гасить</text>

  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- ЛІВА ПАНЕЛЬ: Одинарний шарнір Гука -->
  <rect x="30" y="75" width="435" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <rect x="45" y="87" width="405" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="104" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">А. Одинарний шарнір Гука: виникнення пульсацій</text>

  <!-- Схема одинарного кардана -->
  <rect x="45" y="122" width="405" height="150" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <!-- Вхідний вал (горизонтальний) -->
  <rect x="60" y="185" width="80" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="100" y="199" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Вал 1 (вхід)</text>

  <!-- Ведуча вилка -->
  <path d="M 140 175 L 175 175 L 175 165 L 195 165 L 195 175 L 185 175 L 185 215 L 195 215 L 195 225 L 175 225 L 175 215 L 140 215 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>

  <!-- Хрестовина -->
  <circle cx="205" cy="195" r="14" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="201" y="170" width="8" height="50" rx="2" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="180" y="191" width="50" height="8" rx="2" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Ведена вилка під кутом beta = 20 deg вниз -->
  <path d="M 270 215 L 240 205 L 236 217 L 216 210 L 213 218 L 223 222 L 208 258 L 217 261 L 220 253 L 240 260 L 236 272 L 260 240 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>

  <!-- Ведений вал під кутом -->
  <path d="M 270 215 L 360 248 L 354 266 L 264 233 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>

  <!-- Підпис веденого вала -->
  <rect x="290" y="210" width="130" height="22" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="355" y="225" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Вал 2 (ведений)</text>

  <!-- Кут перекосу beta -->
  <line x1="205" y1="195" x2="380" y2="195" stroke="#6b7280" stroke-dasharray="3 3" stroke-width="1"/>
  <path d="M 290 195 A 85 85 0 0 1 285 224" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="245" y="175" font-size="11" font-weight="bold" fill="#c0392b">Кут beta</text>

  <!-- Пояснення пульсації швидкості -->
  <rect x="45" y="282" width="405" height="140" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <text x="60" y="304" font-size="12" font-weight="bold" fill="#1a1a1a">Кінематична нерівномірність:</text>
  <text x="60" y="324" font-size="11" fill="#1a1a1a">При сталій швидкості входу: omega_1 = const</text>
  <text x="60" y="342" font-size="11" fill="#c0392b">Швидкість виходу коливається двічі за оберт (2/rev):</text>
  <text x="60" y="360" font-size="11" fill="#1a1a1a">• Мінімум: omega_2_min = omega_1 · cos(beta)</text>
  <text x="60" y="378" font-size="11" fill="#1a1a1a">• Максимум: omega_2_max = omega_1 / cos(beta)</text>
  <text x="60" y="402" font-size="11" font-weight="bold" fill="#c0392b">Наслідок: знакозмінні інерційні моменти та вібрація</text>


  <!-- ПРАВА ПАНЕЛЬ: Здвоєний кардан (взаємна компенсація) -->
  <rect x="495" y="75" width="435" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <rect x="510" y="87" width="405" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="104" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Б. Здвоєний кардан (Z-схема): повна компенсація</text>

  <!-- Схема здвоєного вала -->
  <rect x="510" y="122" width="405" height="150" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <!-- Вхідний вал 1 (горизонтальний, лівий) -->
  <line x1="525" y1="180" x2="585" y2="180" stroke="#2457d6" stroke-width="6"/>
  <circle cx="590" cy="180" r="8" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="545" y="165" font-size="11" font-weight="bold" fill="#2457d6">Вхід omega_1</text>

  <!-- Проміжний вал 2 під кутом beta1 вниз -->
  <line x1="590" y1="180" x2="720" y2="230" stroke="#e67e22" stroke-width="6"/>
  <circle cx="720" cy="230" r="8" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- Підпис проміжного вала вгорі -->
  <rect x="620" y="140" width="110" height="22" rx="3" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="675" y="155" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Проміжний вал</text>

  <!-- Вихідний вал 3 (горизонтальний, правий) -->
  <line x1="720" y1="230" x2="880" y2="230" stroke="#27ae60" stroke-width="6"/>
  <text x="815" y="215" font-size="11" font-weight="bold" fill="#27ae60">Вихід omega_3</text>

  <!-- Позначення кутів beta1 та beta2 -->
  <line x1="590" y1="180" x2="640" y2="180" stroke="#6b7280" stroke-dasharray="3 3" stroke-width="1"/>
  <text x="610" y="172" font-size="11" fill="#c0392b">beta1</text>

  <line x1="670" y1="230" x2="720" y2="230" stroke="#6b7280" stroke-dasharray="3 3" stroke-width="1"/>
  <text x="735" y="250" font-size="11" fill="#27ae60">beta2</text>

  <!-- Пояснення умов компенсації -->
  <rect x="510" y="282" width="405" height="140" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <text x="525" y="304" font-size="12" font-weight="bold" fill="#27ae60">Дві обов'язкові умови повної компенсації:</text>
  <text x="525" y="324" font-size="11" fill="#1a1a1a">1. Рівність кутів зламу шарнірів: beta1 = beta2</text>
  <text x="525" y="342" font-size="11" fill="#1a1a1a">2. Внутрішні вилки лежать строго в одній площині (0°)</text>

  <rect x="525" y="358" width="375" height="52" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="535" y="378" font-size="11" font-weight="bold" fill="#27ae60">Результат компенсації:</text>
  <text x="535" y="396" font-size="11" fill="#1a1a1a">omega_3 = omega_1 = const (повна відсутність пульсацій на виході)</text>
</svg>
