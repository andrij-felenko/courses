<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Здвоєний карданний шарнір Гука з кульковим ділильним сухарем</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Кінематичний поділ загального кута зламу навпіл (α₁ = α₂ = α / 2) для квазігомокінетичної передачі</text>

  <!-- Центральна область перерізу -->
  <rect x="40" y="82" width="590" height="350" rx="8" fill="#f8fafc" stroke="#d0d7de" stroke-width="1"/>

  <!-- Осі обертання (штрихові) -->
  <line x1="50" y1="250" x2="200" y2="250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="280" y1="250" x2="350" y2="250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  
  <!-- Проміжна вісь H-вилки (кут alpha/2 = 14 градусів) -->
  <line x1="240" y1="250" x2="420" y2="205" stroke="#2457d6" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Вісь вала 2 (кут alpha = 28 градусів) -->
  <line x1="420" y1="205" x2="580" y2="120" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Бісектрисна площина симетрії сухаря -->
  <line x1="305" y1="130" x2="355" y2="330" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="340" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Бісектрисна площина</text>

  <!-- Дуга кута alpha_1 -->
  <path d="M 290,250 A 50,50 0 0,0 286,238" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="298" y="242" font-size="11" font-weight="bold" fill="#2457d6">α₁ = α/2</text>

  <!-- Дуга кута alpha_2 -->
  <path d="M 450,197 A 40,40 0 0,0 445,185" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="460" y="245" font-size="11" font-weight="bold" fill="#27ae60">α₂ = α/2</text>

  <!-- Ведучий вал 1 -->
  <rect x="60" y="236" width="120" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="120" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Вал 1 (ведучий)</text>
  <text x="120" y="195" text-anchor="middle" font-size="12" fill="#2457d6">ω₁ = const</text>

  <!-- Вилка 1 ведучого вала -->
  <path d="M 180,236 L 220,210 L 250,210 L 250,224 L 228,244 L 228,256 L 250,276 L 250,290 L 220,290 L 180,264 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Хрестовина 1 (центр 240, 250) -->
  <circle cx="240" cy="250" r="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="240" y1="195" x2="240" y2="305" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
  <rect x="231" y="190" width="18" height="16" rx="2" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="231" y="294" width="18" height="16" rx="2" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/>
  <text x="240" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Шарнір 1</text>

  <!-- Проміжна H-подібна вилка (H-yoke) -->
  <path d="M 230,205 L 290,190 L 370,170 L 430,155 L 430,172 L 380,185 L 300,205 L 230,222 Z" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <path d="M 230,278 L 300,260 L 380,240 L 430,228 L 430,245 L 370,260 L 290,280 L 230,295 Z" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="330" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">Проміжна H-вилка</text>

  <!-- Центральний кульковий механізм (сухар): центр біля (330, 227.5) -->
  <path d="M 240,250 L 305,234" stroke="#2457d6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="320" cy="230" r="14" fill="#60a5fa" stroke="#1d4ed8" stroke-width="2"/>
  
  <!-- Напрямна гільза сухаря вала 2 -->
  <circle cx="320" cy="230" r="19" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="5,3"/>
  <path d="M 334,226 L 420,205" stroke="#27ae60" stroke-width="8" stroke-linecap="round"/>

  <!-- Хрестовина 2 (центр 420, 205) -->
  <circle cx="420" cy="205" r="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="400" y1="150" x2="440" y2="260" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
  <rect x="390" y="144" width="18" height="16" rx="2" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="432" y="250" width="18" height="16" rx="2" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
  <text x="440" y="285" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Шарнір 2</text>

  <!-- Ведена вилка 2 та Вал 2 -->
  <path d="M 420,195 L 460,174 L 490,174 L 490,188 L 470,200 L 490,214 L 490,228 L 460,228 L 420,215 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <path d="M 480,174 L 565,129 L 575,148 L 490,193 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="540" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Вал 2 (ведений)</text>
  <text x="540" y="233" text-anchor="middle" font-size="12" fill="#27ae60">ω₂ ≈ ω₁</text>

  <!-- Підпис до кулькового сухаря -->
  <line x1="320" y1="245" x2="320" y2="355" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="320" y1="355" x2="250" y2="355" stroke="#6b7280" stroke-width="1.5"/>
  <text x="240" y="359" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">Кульковий ділильний сухар</text>
  <text x="240" y="375" text-anchor="end" font-size="11" fill="#6b7280">Ділить кут строго навпіл</text>

  <!-- Бокові інформаційні картки праворуч -->
  <!-- Картка 1: Принцип поділу кута -->
  <rect x="650" y="82" width="280" height="95" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="665" y="104" font-size="13" font-weight="bold" fill="#2457d6">Кульковий сухар центрування</text>
  <text x="665" y="124" font-size="12" fill="#1a1a1a">Шарнір ділить сумарний злам:</text>
  <text x="665" y="142" font-size="12" font-weight="bold" fill="#2457d6">α₁ = α₂ = α / 2</text>
  <text x="665" y="160" font-size="12" fill="#6b7280">Синфазні вилки компенсують пульсацію.</text>

  <!-- Картка 2: Квазігомокінетичність -->
  <rect x="650" y="185" width="280" height="85" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="665" y="207" font-size="13" font-weight="bold" fill="#27ae60">Квазігомокінетичний режим</text>
  <text x="665" y="227" font-size="12" fill="#1a1a1a">Вихідна швидкість рівномірна:</text>
  <text x="665" y="245" font-size="12" font-weight="bold" fill="#27ae60">ω_out(t) ≈ ω_in(t)</text>
  <text x="665" y="260" font-size="11" fill="#6b7280">Залишкова пульсація &lt; 0.1% до α = 30°.</text>

  <!-- Картка 3: Порівняння з ШРКШ Рцеппа -->
  <rect x="650" y="278" width="280" height="154" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="665" y="300" font-size="13" font-weight="bold" fill="#1a1a1a">Здвоєний кардан vs ШРКШ Рцеппа</text>
  <text x="665" y="322" font-size="12" font-weight="bold" fill="#27ae60">Переваги здвоєного кардана:</text>
  <text x="665" y="340" font-size="11" fill="#1a1a1a">• Витримує колосальні ударні моменти</text>
  <text x="665" y="356" font-size="11" fill="#1a1a1a">• Надійні голчасті підшипники хрестовин</text>
  <text x="665" y="374" font-size="12" font-weight="bold" fill="#c0392b">Переваги ШРКШ (Rzeppa):</text>
  <text x="665" y="392" font-size="11" fill="#1a1a1a">• Істинна гомокінетичність (6 кульок)</text>
  <text x="665" y="408" font-size="11" fill="#1a1a1a">• Граничний кут перегину до 45–50°</text>
  <text x="665" y="424" font-size="11" fill="#6b7280">• Компактніший радіальний габарит</text>
</svg>
