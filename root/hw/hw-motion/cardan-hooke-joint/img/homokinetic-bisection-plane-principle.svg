<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принцип бісекторної площини: умова синхронної передачі швидкості (ШРКШ)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Розташування кульок у площині половинного кута alpha/2 вирівнює контактні радіуси r1 = r2</text>

  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- ЛІВА ЧАСТИНА: Геометрична схема бісекторної площини -->
  <rect x="30" y="75" width="580" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="50" y="102" font-size="14" font-weight="bold" fill="#1a1a1a">Геометрична симетрія контактної точки</text>
  <text x="50" y="120" font-size="12" fill="#6b7280">Перетин осей валів під кутом alpha та бісекторна площина симетрії</text>

  <!-- Центр шарніра O: (180, 270) -->
  <!-- Вісь 1 (вхідний вал - горизонтальна) -->
  <line x1="80" y1="270" x2="480" y2="270" stroke="#2457d6" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Вісь 2 (вихідний вал - під кутом alpha = 30 deg вгору) -->
  <line x1="100" y1="316" x2="440" y2="120" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Бісекторна площина (нахил під кутом 15 deg вгору) -->
  <line x1="120" y1="285" x2="460" y2="195" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Дуга кута alpha між осями -->
  <path d="M 250 270 A 70 70 0 0 0 240 235" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="255" y="295" font-size="11" font-weight="bold" fill="#1a1a1a">Кут alpha = 30 deg</text>

  <!-- Центр шарніра -->
  <circle cx="180" cy="270" r="4" fill="#1a1a1a"/>
  <text x="175" y="295" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Центр O</text>

  <!-- Кулька ШРКШ на бісекторній осі: (320, 232) -->
  <circle cx="320" cy="232" r="16" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <circle cx="320" cy="232" r="4" fill="#27ae60"/>

  <!-- Радіус r1 (перпендикуляр від C до осі 1): від (320, 232) вертикально вниз до (320, 270) -->
  <line x1="320" y1="232" x2="320" y2="270" stroke="#2457d6" stroke-width="2"/>
  <!-- Прямий кут біля осі 1 -->
  <polyline points="320,262 328,262 328,270" fill="none" stroke="#2457d6" stroke-width="1"/>

  <!-- Радіус r2 (перпендикуляр від C до осі 2) -->
  <line x1="320" y1="232" x2="339" y2="178" stroke="#c0392b" stroke-width="2"/>

  <!-- Підписи радіусів -->
  <rect x="335" y="244" width="75" height="22" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="372" y="259" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">r1 = R·cos</text>

  <rect x="350" y="195" width="75" height="22" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="387" y="210" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">r2 = R·cos</text>

  <!-- Підпис бісекторної площини -->
  <rect x="180" y="145" width="220" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="290" y="161" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Бісекторна площина (alpha / 2)</text>

  <!-- Підпис колового вектора швидкості v -->
  <line x1="320" y1="232" x2="320" y2="188" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-main)"/>
  <text x="312" y="184" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Швидкість v</text>

  <!-- Плашка основного висновку внизу графіка -->
  <rect x="50" y="340" width="540" height="75" rx="4" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="65" y="362" font-size="12" font-weight="bold" fill="#27ae60">Кінематичний інваріант ШРКШ:</text>
  <text x="65" y="380" font-size="11" fill="#1a1a1a">Колова швидкість точки контакту: v = omega_1 · r1 = omega_2 · r2</text>
  <text x="65" y="398" font-size="11" font-weight="bold" fill="#1a1a1a">Оскільки r1 = r2 = R·cos(alpha/2)  ==>  omega_1 = omega_2 (відсутність пульсацій!)</text>

  <!-- ПРАВА ЧАСТИНА: Інженерне порівняння схем -->
  <rect x="630" y="75" width="300" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="645" y="102" font-size="14" font-weight="bold" fill="#1a1a1a">Механізми центрування</text>
  <text x="645" y="120" font-size="12" fill="#6b7280">Як різні шарніри ділять кут перекосу</text>

  <!-- Блок 1: Шарнір Гука (чому є пульсація) -->
  <rect x="645" y="132" width="270" height="76" rx="4" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="655" y="150" font-size="12" font-weight="bold" fill="#c0392b">Одинарний кардан (Гук)</text>
  <text x="655" y="168" font-size="11" fill="#1a1a1a">Хрестовина прив'язана до площини</text>
  <text x="655" y="184" font-size="11" fill="#1a1a1a">одного з валів. Радіуси r1 != r2.</text>
  <text x="655" y="200" font-size="11" fill="#c0392b">Наслідок: подвоєна пульсація 2/rev</text>

  <!-- Блок 2: Кульковий Рцеппа -->
  <rect x="645" y="218" width="270" height="76" rx="4" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="655" y="236" font-size="12" font-weight="bold" fill="#27ae60">ШРКШ Рцеппи (кульки)</text>
  <text x="655" y="254" font-size="11" fill="#1a1a1a">Зміщені центри доріжок примусово</text>
  <text x="655" y="270" font-size="11" fill="#1a1a1a">виштовхують кульки в площину alpha/2.</text>
  <text x="655" y="286" font-size="11" fill="#27ae60">Результат: ідеальна синхронність</text>

  <!-- Блок 3: Здвоєний кардан -->
  <rect x="645" y="304" width="270" height="66" rx="4" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="655" y="322" font-size="12" font-weight="bold" fill="#2457d6">Здвоєний кардан</text>
  <text x="655" y="340" font-size="11" fill="#1a1a1a">Центрувальна сфера ділить кут валів</text>
  <text x="655" y="356" font-size="11" fill="#1a1a1a">між двома хрестовинами навпіл</text>

  <!-- Блок 4: Висновок -->
  <rect x="645" y="380" width="270" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="655" y="398" font-size="11" font-weight="bold" fill="#27ae60">Головний закон кінематики:</text>
  <text x="655" y="412" font-size="10" fill="#1a1a1a">Точки контакту в площині alpha/2 гарантують ШРКШ</text>
</svg>
