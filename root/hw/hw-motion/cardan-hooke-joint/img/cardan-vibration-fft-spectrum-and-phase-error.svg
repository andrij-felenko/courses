<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Спектральний аналіз FFT та наслідки фазової помилки карданного вала</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Порівняння Z-схеми (gamma = 0°) та розфазованого валопроводу (gamma = 90°): гармоніка 2/rev та крутильний момент</text>

  <!-- ЛІВА ПАНЕЛЬ: Z-схема з повною компенсацією -->
  <rect x="30" y="75" width="435" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <rect x="45" y="87" width="405" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="247" y="104" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">1. Z-схема: копланарні вилки (gamma = 0°, beta1 = beta2 = 12°)</text>

  <!-- Графік швидкості omega(t) ліворуч -->
  <rect x="45" y="122" width="405" height="125" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="138" font-size="11" font-weight="bold" fill="#27ae60">Кутова швидкість вихідного вала omega3(t):</text>
  <!-- Осі графіка -->
  <line x1="80" y1="220" x2="430" y2="220" stroke="#d0d7de" stroke-width="1"/>
  <line x1="80" y1="150" x2="80" y2="220" stroke="#d0d7de" stroke-width="1"/>
  <text x="72" y="185" font-size="10" fill="#6b7280" text-anchor="end">157.1</text>
  <text x="255" y="235" font-size="10" fill="#6b7280" text-anchor="middle">Час t (1 оберт вала, 360°)</text>
  <!-- Ідеально пряма горизонтальна лінія швидкості -->
  <line x1="80" y1="185" x2="430" y2="185" stroke="#27ae60" stroke-width="3"/>
  <text x="255" y="175" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">omega3 = 157.08 рад/с (пульсація delta = 0.00 %)</text>

  <!-- Спектр FFT ліворуч -->
  <rect x="45" y="257" width="405" height="105" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="273" font-size="11" font-weight="bold" fill="#2457d6">Амплітудний спектр FFT гармонік вібрацій:</text>
  <line x1="80" y1="340" x2="430" y2="340" stroke="#d0d7de" stroke-width="1"/>
  <!-- Стовпчики гармонік (нульові) -->
  <text x="140" y="354" font-size="10" fill="#6b7280" text-anchor="middle">1/rev (25 Гц)</text>
  <text x="240" y="354" font-size="10" fill="#6b7280" text-anchor="middle">2/rev (50 Гц)</text>
  <text x="340" y="354" font-size="10" fill="#6b7280" text-anchor="middle">4/rev (100 Гц)</text>
  <circle cx="140" cy="340" r="3" fill="#27ae60"/>
  <circle cx="240" cy="340" r="3" fill="#27ae60"/>
  <circle cx="340" cy="340" r="3" fill="#27ae60"/>
  <text x="240" y="325" font-size="11" fill="#27ae60" text-anchor="middle">Гармоніка 2/rev = 0.00 рад/с (компенсовано)</text>

  <!-- Метрика ліворуч -->
  <rect x="45" y="370" width="405" height="52" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="55" y="390" font-size="11" font-weight="bold" fill="#27ae60">Результат Z-компенсації:</text>
  <text x="55" y="408" font-size="11" fill="#1a1a1a">• Динамічний момент: T_dyn = 0.0 Н·м | Крутильні вібрації відсутні</text>


  <!-- ПРАВА ПАНЕЛЬ: Фазова помилка 90 градусів -->
  <rect x="495" y="75" width="435" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <rect x="510" y="87" width="405" height="26" rx="4" fill="#fbeae8" stroke="#c0392b" stroke-width="1"/>
  <text x="712" y="104" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2. Брак складання: розфазування на 90° (gamma = 90°)</text>

  <!-- Графік швидкості omega(t) праворуч -->
  <rect x="510" y="122" width="405" height="125" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="138" font-size="11" font-weight="bold" fill="#c0392b">Кутова швидкість вихідного вала omega3(t):</text>
  <!-- Осі графіка -->
  <line x1="545" y1="220" x2="895" y2="220" stroke="#d0d7de" stroke-width="1"/>
  <line x1="545" y1="150" x2="545" y2="220" stroke="#d0d7de" stroke-width="1"/>
  <text x="537" y="165" font-size="10" fill="#6b7280" text-anchor="end">164.2</text>
  <text x="537" y="205" font-size="10" fill="#6b7280" text-anchor="end">150.3</text>
  <text x="720" y="235" font-size="10" fill="#6b7280" text-anchor="middle">Час t (1 оберт вала, 360°)</text>
  <!-- Хвиля швидкості з 2 періодами на оберт -->
  <path d="M 545,185 Q 589,155 632,185 T 720,185 T 807,185 T 895,185" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="720" y="152" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Пульсація delta = 8.84 % (подвоєна амплітуда!)</text>

  <!-- Спектр FFT праворуч -->
  <rect x="510" y="257" width="405" height="105" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="273" font-size="11" font-weight="bold" fill="#2457d6">Амплітудний спектр FFT гармонік вібрацій:</text>
  <line x1="545" y1="340" x2="895" y2="340" stroke="#d0d7de" stroke-width="1"/>
  <!-- Стовпчик гармоніки 2/rev -->
  <text x="605" y="354" font-size="10" fill="#6b7280" text-anchor="middle">1/rev (25 Гц)</text>
  <text x="705" y="354" font-size="10" fill="#c0392b" font-weight="bold" text-anchor="middle">2/rev (50 Гц)</text>
  <text x="805" y="354" font-size="10" fill="#6b7280" text-anchor="middle">4/rev (100 Гц)</text>
  <rect x="692" y="285" width="26" height="55" fill="#c0392b" rx="2"/>
  <text x="705" y="280" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">6.94 рад/с</text>

  <!-- Метрика праворуч -->
  <rect x="510" y="370" width="405" height="52" rx="4" fill="#fbeae8" stroke="#c0392b" stroke-width="1"/>
  <text x="520" y="390" font-size="11" font-weight="bold" fill="#c0392b">Наслідки фазового перекосу:</text>
  <text x="520" y="408" font-size="11" fill="#1a1a1a">• Момент: T_dyn = ±43.7 Н·м | Високий ризик втоми та резонансу</text>
</svg>
