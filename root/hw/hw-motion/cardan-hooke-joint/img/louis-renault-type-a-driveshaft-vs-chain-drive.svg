<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Трансмісія Луї Рено Type A (1898) проти відкритого ланцюгового приводу</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Заміна відкритих ланцюгів на трубчастий карданний вал із шарнірами Гука здійснила революцію автотранспорту</text>

  <!-- ЛІВА ПАНЕЛЬ: Традиційний ланцюговий привід -->
  <rect x="30" y="75" width="435" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <rect x="45" y="87" width="405" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="104" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Традиційний привід: відкриті бічні ланцюги (до 1898)</text>

  <!-- Схема машини з ланцюгом -->
  <rect x="45" y="122" width="405" height="170" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <!-- Двигун і КПП -->
  <rect x="65" y="160" width="75" height="60" rx="4" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="102" y="195" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двигун De Dion</text>

  <!-- Поперечний проміжний вал -->
  <line x1="140" y1="190" x2="230" y2="190" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="220" y="150" width="20" height="80" rx="2" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="200" y="145" font-size="11" fill="#6b7280">Промвал</text>

  <!-- Відкриті бічні ланцюги до коліс -->
  <path d="M 235 155 L 355 165 L 355 175 L 235 165 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <path d="M 235 215 L 355 205 L 355 215 L 235 225 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>

  <!-- Задні колеса -->
  <circle cx="365" cy="165" r="16" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="365" cy="215" r="16" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <text x="400" y="195" font-size="11" font-weight="bold" fill="#1a1a1a">Ведуча вісь</text>

  <!-- Позначка вразливості -->
  <text x="295" y="145" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Відкритий ланцюг</text>

  <!-- Опис недоліків -->
  <rect x="45" y="302" width="405" height="120" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="324" font-size="12" font-weight="bold" fill="#c0392b">Критичні вади ланцюгового приводу:</text>
  <text x="60" y="344" font-size="11" fill="#1a1a1a">• Налипання дорожнього бруду, піску та абразивне зношування</text>
  <text x="60" y="362" font-size="11" fill="#1a1a1a">• Частий розрив ланцюгів і необхідність щоденного підтягування</text>
  <text x="60" y="380" font-size="11" fill="#1a1a1a">• Низький ККД і втрата потужності при ходах задньої осі</text>
  <text x="60" y="404" font-size="11" font-weight="bold" fill="#c0392b">Результат: низька надійність та обмеження швидкості</text>


  <!-- ПРАВА ПАНЕЛЬ: Трансмісія Renault Type A -->
  <rect x="495" y="75" width="435" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <rect x="510" y="87" width="405" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="104" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Трансмісія Луї Рено: жорсткий карданний вал (1898)</text>

  <!-- Схема машини Рено -->
  <rect x="510" y="122" width="405" height="170" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <!-- Двигун спереду -->
  <rect x="530" y="160" width="70" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="565" y="195" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Двигун 1.75 к.с.</text>

  <!-- Карданний шарнір 1 біля КПП -->
  <circle cx="615" cy="190" r="7" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="615" y="175" font-size="11" fill="#6b7280" text-anchor="middle">Кардан 1</text>

  <!-- Поздовжній карданний вал Рено -->
  <line x1="622" y1="190" x2="770" y2="190" stroke="#27ae60" stroke-width="5"/>
  <text x="695" y="210" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Жорсткий карданний вал</text>

  <!-- Карданний шарнір 2 біля моста -->
  <circle cx="775" cy="190" r="7" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="775" y="175" font-size="11" fill="#6b7280" text-anchor="middle">Кардан 2</text>

  <!-- Головна передача та диференціал заднього моста -->
  <rect x="790" y="170" width="30" height="40" rx="3" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="805" y1="140" x2="805" y2="240" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Задні колеса -->
  <circle cx="805" cy="140" r="16" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="805" cy="240" r="16" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <text x="850" y="195" font-size="11" font-weight="bold" fill="#1a1a1a">Ведучий міст</text>

  <!-- Опис переваг Рено -->
  <rect x="510" y="302" width="405" height="120" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="324" font-size="12" font-weight="bold" fill="#27ae60">Інженерні переваги конструкції Рено:</text>
  <text x="525" y="344" font-size="11" fill="#1a1a1a">• Закрита герметична конструкція: повний захист від бруду й води</text>
  <text x="525" y="362" font-size="11" fill="#1a1a1a">• Шарніри Гука компенсують кутові ходи підвіски на нерівностях</text>
  <text x="525" y="380" font-size="11" fill="#1a1a1a">• Пряма передача prise directe з ККД понад 95% на 3-й швидкості</text>
  <text x="525" y="404" font-size="11" font-weight="bold" fill="#27ae60">Тріумф 24.12.1898: подолання 13% підйому вул. Лепік у Парижі</text>
</svg>
