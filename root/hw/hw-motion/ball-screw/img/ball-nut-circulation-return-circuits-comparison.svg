<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Підкладка полотна -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Архітектура циркуляції кульок у гайках ШВП: три базові контури</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Траєкторія повернення визначає швидкісний фактор d · n, габаритний діаметр та рівень шуму</text>

  <!-- Панель 1: Зовнішня трубка -->
  <rect x="30" y="75" width="286" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="42" y="87" width="262" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="173" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Зовнішня трубка (Tube return)</text>

  <!-- Схема 1: Корпус гайки та зовнішня трубка -->
  <rect x="45" y="130" width="256" height="135" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Вал гвинта -->
  <line x1="55" y1="230" x2="291" y2="230" stroke="#9ca3af" stroke-width="14" stroke-linecap="round"/>
  <text x="173" y="255" text-anchor="middle" font-size="11" fill="#6b7280">Осьовий вал гвинта</text>

  <!-- Робочі витки різьби та кульки -->
  <circle cx="95" cy="210" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="115" cy="210" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="135" cy="210" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="155" cy="210" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="175" cy="210" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="195" cy="210" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="215" cy="210" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="235" cy="210" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="255" cy="210" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Зовнішня трубка повернення -->
  <path d="M 85 200 C 85 152, 110 142, 173 142 C 236 142, 265 152, 265 200" fill="none" stroke="#2457d6" stroke-width="7" stroke-linecap="round"/>
  <path d="M 85 200 C 85 152, 110 142, 173 142 C 236 142, 265 152, 265 200" fill="none" stroke="#eaf0fd" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M 230 146 L 210 142" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="173" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Виносна сталева трубка</text>

  <!-- Опис 1 -->
  <text x="45" y="284" font-size="12" font-weight="bold" fill="#1a1a1a">Особливості конструкції:</text>
  <text x="45" y="302" font-size="12" fill="#1a1a1a">• Охоплює від 2.5 до 4.5 робочих витків</text>
  <text x="45" y="320" font-size="12" fill="#1a1a1a">• Кульки виходять назовні гайки</text>
  <text x="45" y="338" font-size="12" fill="#1a1a1a">• Збільшений зовнішній радіальний габарит</text>

  <rect x="42" y="354" width="262" height="74" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="372" font-size="11" font-weight="bold" fill="#2457d6">Швидкість:</text>
  <text x="120" y="372" font-size="11" fill="#1a1a1a">d · n ≤ 70 000 мм/хв</text>
  <text x="50" y="392" font-size="11" font-weight="bold" fill="#27ae60">Переваги:</text>
  <text x="120" y="392" font-size="11" fill="#1a1a1a">Простота заміни, надійність</text>
  <text x="50" y="412" font-size="11" font-weight="bold" fill="#c0392b">Недоліки:</text>
  <text x="120" y="412" font-size="11" fill="#1a1a1a">Удар кульок на вході, шум</text>


  <!-- Панель 2: Внутрішній вкладиш -->
  <rect x="337" y="75" width="286" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="349" y="87" width="262" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Внутрішній вкладиш (Deflector)</text>

  <!-- Схема 2: Корпус гайки та дефлектор -->
  <rect x="352" y="130" width="256" height="135" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Вал гвинта -->
  <line x1="362" y1="230" x2="598" y2="230" stroke="#9ca3af" stroke-width="14" stroke-linecap="round"/>
  <text x="480" y="255" text-anchor="middle" font-size="11" fill="#6b7280">Осьовий вал гвинта</text>

  <!-- Окремі контури по 1 витку -->
  <rect x="382" y="140" width="45" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="404" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">Вкл. 1</text>
  <circle cx="395" cy="170" r="5" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.2"/>
  <circle cx="413" cy="170" r="5" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.2"/>
  <circle cx="404" cy="210" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>

  <rect x="457" y="140" width="45" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">Вкл. 2</text>
  <circle cx="471" cy="170" r="5" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.2"/>
  <circle cx="489" cy="170" r="5" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.2"/>
  <circle cx="480" cy="210" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>

  <rect x="532" y="140" width="45" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="554" y="156" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">Вкл. 3</text>
  <circle cx="546" cy="170" r="5" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.2"/>
  <circle cx="564" cy="170" r="5" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.2"/>
  <circle cx="555" cy="210" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Траєкторія перекидання -->
  <path d="M 392 198 Q 404 188 416 198" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M 468 198 Q 480 188 492 198" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M 543 198 Q 555 188 567 198" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Опис 2 -->
  <text x="352" y="284" font-size="12" font-weight="bold" fill="#1a1a1a">Особливості конструкції:</text>
  <text x="352" y="302" font-size="12" fill="#1a1a1a">• Перекидання кульки через гребінь гвинта</text>
  <text x="352" y="320" font-size="12" fill="#1a1a1a">• 1 оберт = 1 замкнений контур</text>
  <text x="352" y="338" font-size="12" fill="#1a1a1a">• Компактний гладкий зовнішній циліндр</text>

  <rect x="349" y="354" width="262" height="74" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="357" y="372" font-size="11" font-weight="bold" fill="#2457d6">Швидкість:</text>
  <text x="427" y="372" font-size="11" fill="#1a1a1a">d · n ≤ 100 000 мм/хв</text>
  <text x="357" y="392" font-size="11" font-weight="bold" fill="#27ae60">Переваги:</text>
  <text x="427" y="392" font-size="11" fill="#1a1a1a">Мінімальний монтажний габарит</text>
  <text x="357" y="412" font-size="11" font-weight="bold" fill="#c0392b">Недоліки:</text>
  <text x="427" y="412" font-size="11" fill="#1a1a1a">Складна точна обробка паза</text>


  <!-- Панель 3: Торцевий канал -->
  <rect x="644" y="75" width="286" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="656" y="87" width="262" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="787" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Торцевий канал (End-cap return)</text>

  <!-- Схема 3: Корпус гайки та торцеві заглушки -->
  <rect x="659" y="130" width="256" height="135" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Вал гвинта -->
  <line x1="669" y1="230" x2="905" y2="230" stroke="#9ca3af" stroke-width="14" stroke-linecap="round"/>
  <text x="787" y="255" text-anchor="middle" font-size="11" fill="#6b7280">Осьовий вал гвинта</text>

  <!-- Кульки на робочому витку -->
  <circle cx="715" cy="210" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="735" cy="210" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="755" cy="210" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="775" cy="210" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="795" cy="210" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="815" cy="210" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="835" cy="210" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="855" cy="210" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Торцеві кришки з направляючими каналами -->
  <rect x="672" y="148" width="24" height="65" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="684" y="184" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Кр. 1</text>

  <rect x="878" y="148" width="24" height="65" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="890" y="184" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Кр. 2</text>

  <!-- Внутрішній тунель у тілі гайки -->
  <line x1="696" y1="155" x2="878" y2="155" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
  <path d="M 760 155 L 780 155" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="787" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Поздовжній отвір у тілі гайки</text>

  <!-- Опис 3 -->
  <text x="659" y="284" font-size="12" font-weight="bold" fill="#1a1a1a">Особливості конструкції:</text>
  <text x="659" y="302" font-size="12" fill="#1a1a1a">• Тангенційний підйом кульок кришкою</text>
  <text x="659" y="320" font-size="12" fill="#1a1a1a">• Плавний перехід без лобових ударів</text>
  <text x="659" y="338" font-size="12" fill="#1a1a1a">• Довгий осьовий канал крізь усе тіло гайки</text>

  <rect x="656" y="354" width="262" height="74" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="664" y="372" font-size="11" font-weight="bold" fill="#2457d6">Швидкість:</text>
  <text x="734" y="372" font-size="11" fill="#1a1a1a">d · n ≥ 150 000 мм/хв</text>
  <text x="664" y="392" font-size="11" font-weight="bold" fill="#27ae60">Переваги:</text>
  <text x="734" y="392" font-size="11" fill="#1a1a1a">Висока швидкість, тихий хід</text>
  <text x="664" y="412" font-size="11" font-weight="bold" fill="#c0392b">Недоліки:</text>
  <text x="734" y="412" font-size="11" fill="#1a1a1a">Збільшена загальна довжина гайки</text>
</svg>
