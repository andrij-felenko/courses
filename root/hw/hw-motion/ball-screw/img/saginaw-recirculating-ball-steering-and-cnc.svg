<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <defs>
    <marker id="arrSag" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrCnc" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>

  <!-- Main Title -->
  <text x="30" y="32" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Кінематика механізму Saginaw та еволюція у верстати з ЧПК</text>
  <text x="30" y="52" font-family="sans-serif" font-size="12" fill="#475569">Перенесення ідеї циркуляції кульок через зворотну трубку з автомобільного керма 1940 року в прецизійні ШВП</text>

  <!-- Panel 1: Historical Saginaw Steering Gear (x=30 to 470) -->
  <rect x="30" y="70" width="440" height="365" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="30" y="70" width="440" height="30" rx="8" fill="#e0f2fe"/>
  <text x="45" y="90" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1">1. Кермовий механізм Saginaw (GM, 1940)</text>

  <!-- Saginaw Screw Shaft & Nut Graphic -->
  <rect x="45" y="115" width="410" height="155" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>

  <!-- Steering Worm Shaft (Drawn as thick lines to avoid rect-in-rect collision) -->
  <line x1="55" y1="187" x2="170" y2="187" stroke="#94a3b8" stroke-width="20"/>
  <line x1="330" y1="187" x2="445" y2="187" stroke="#94a3b8" stroke-width="20"/>
  <line x1="55" y1="187" x2="445" y2="187" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="60" y="165" font-family="sans-serif" font-size="10" fill="#475569">Кермовий вал-гвинт</text>

  <!-- Recirculating Ball Nut Block -->
  <rect x="170" y="150" width="160" height="75" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
  <text x="180" y="170" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0369a1">Гайка-поршень</text>

  <!-- External Return Tube -->
  <path d="M195,150 C195,120 305,120 305,150" fill="none" stroke="#dc2626" stroke-width="7"/>
  <path d="M195,150 C195,120 305,120 305,150" fill="none" stroke="#fecaca" stroke-width="3"/>
  <text x="200" y="125" font-family="sans-serif" font-size="10" font-weight="bold" fill="#dc2626">Трубка повернення кульок</text>

  <!-- Steel Balls in raceway -->
  <circle cx="210" cy="187" r="5" fill="#f59e0b" stroke="#334155" stroke-width="1"/>
  <circle cx="225" cy="187" r="5" fill="#f59e0b" stroke="#334155" stroke-width="1"/>
  <circle cx="240" cy="187" r="5" fill="#f59e0b" stroke="#334155" stroke-width="1"/>
  <circle cx="255" cy="187" r="5" fill="#f59e0b" stroke="#334155" stroke-width="1"/>
  <circle cx="270" cy="187" r="5" fill="#f59e0b" stroke="#334155" stroke-width="1"/>
  <circle cx="285" cy="187" r="5" fill="#f59e0b" stroke="#334155" stroke-width="1"/>

  <!-- Rack Teeth on Nut Bottom engaging Sector Gear -->
  <line x1="210" y1="230" x2="290" y2="230" stroke="#475569" stroke-width="10"/>
  <text x="215" y="254" font-family="sans-serif" font-size="10" fill="#334155">Зубчаста рейка</text>

  <!-- Explanatory Text for Saginaw -->
  <text x="45" y="290" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Інженерний прорив Saginaw:</text>
  <text x="45" y="308" font-family="sans-serif" font-size="11" fill="#334155">• Заміна тертя ковзання черв'яка на тертя кочення кульок</text>
  <text x="45" y="326" font-family="sans-serif" font-size="11" fill="#334155">• ККД зріс з 35% до понад 90% (легке кермування)</text>
  <text x="45" y="344" font-family="sans-serif" font-size="11" fill="#334155">• Зовнішня напрямна трубка збирає кульки з кінця різьби</text>
  <text x="45" y="362" font-family="sans-serif" font-size="11" fill="#334155">  та спрямовує їх на початок замкненого контуру</text>
  <text x="45" y="386" font-family="sans-serif" font-size="10" fill="#64748b">Розробка підрозділу Saginaw Steering Gear корпорації General Motors</text>

  <!-- Panel 2: Transfer to CNC Machine Axis (x=490 to 930) -->
  <rect x="490" y="70" width="440" height="365" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="490" y="70" width="440" height="30" rx="8" fill="#dcfce7"/>
  <text x="505" y="90" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d">2. Сучасна кульково-гвинтова передача (ШВП ЧПК)</text>

  <!-- CNC Axis Graphic Box -->
  <rect x="505" y="115" width="410" height="155" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>

  <!-- Servomotor at Left -->
  <rect x="515" y="165" width="55" height="45" rx="3" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="520" y="192" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Серводвигун</text>

  <!-- Precision Ground Ball Screw (drawn as line to avoid block overlap) -->
  <line x1="575" y1="187" x2="665" y2="187" stroke="#64748b" stroke-width="16"/>
  <line x1="800" y1="187" x2="885" y2="187" stroke="#64748b" stroke-width="16"/>
  <line x1="575" y1="187" x2="895" y2="187" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- CNC Machine Table attached to nut -->
  <rect x="655" y="125" width="150" height="22" rx="2" fill="#475569" stroke="#1e293b" stroke-width="1"/>
  <text x="670" y="140" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Стіл верстата (Вісь X/Y)</text>

  <!-- Double Nut with Preload Washer (Zero Backlash) -->
  <rect x="665" y="155" width="60" height="65" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <rect x="735" y="155" width="60" height="65" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <line x1="728" y1="160" x2="728" y2="215" stroke="#f59e0b" stroke-width="5"/>
  <text x="670" y="235" font-family="sans-serif" font-size="10" font-weight="bold" fill="#15803d">Подвійна гайка з натягом</text>

  <!-- Fixed-Fixed Bearings -->
  <line x1="575" y1="170" x2="575" y2="205" stroke="#475569" stroke-width="8"/>
  <line x1="885" y1="170" x2="885" y2="205" stroke="#475569" stroke-width="8"/>
  <text x="555" y="220" font-family="sans-serif" font-size="10" fill="#64748b">Опора 1</text>
  <text x="865" y="220" font-family="sans-serif" font-size="10" fill="#64748b">Опора 2</text>

  <!-- Explanatory Text for CNC -->
  <text x="505" y="290" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Трансформація в індустрію ЧПК:</text>
  <text x="505" y="308" font-family="sans-serif" font-size="11" fill="#334155">• Попередній натяг кульок (Preload) повністю усунув люфт (Backlash = 0)</text>
  <text x="505" y="326" font-family="sans-serif" font-size="11" fill="#334155">• Забезпечення повторюваності позиціонування до ±1...3 мкм</text>
  <text x="505" y="344" font-family="sans-serif" font-size="11" fill="#334155">• Шліфовані бігові доріжки готичного профілю (Gothic Arch)</text>
  <text x="505" y="362" font-family="sans-serif" font-size="11" fill="#334155">• Опори Фіксована-Фіксована запобігають прогину та вібраціям</text>
  <text x="505" y="386" font-family="sans-serif" font-size="10" fill="#15803d">ШВП стала фундаментальною основою сучасного точного машинобудування</text>
</svg>
