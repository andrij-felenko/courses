<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-d2" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-r2" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-g2" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Чотири класичні схеми монтажу вала ШВП та стійкість за Ейлером</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Форми вигину вала, коефіцієнти граничної сили поздовжнього згину λ та граничної швидкості</text>

  <!-- 4 COLUMNS: Schemes 1 to 4 -->

  <!-- COLUMN 1: Fixed - Free -->
  <rect x="25" y="75" width="215" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="35" y="88" width="195" height="28" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="132" y="107" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Затиснений — Вільний</text>

  <!-- Supports visualization -->
  <rect x="45" y="130" width="30" height="50" fill="#2457d6"/>
  <text x="45" y="124" font-size="11" font-weight="bold" fill="#2457d6">Затиск</text>
  <circle cx="205" cy="155" r="7" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="180" y="124" font-size="11" fill="#6b7280">Вільний</text>

  <!-- Buckling shape (1/4 wave) -->
  <path d="M 75 155 Q 140 155 205 190" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="75" y1="155" x2="205" y2="155" stroke="#6b7280" stroke-dasharray="3,3"/>

  <!-- Axial force arrow -->
  <line x1="225" y1="155" x2="195" y2="155" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-r2)"/>

  <!-- Badges and specs -->
  <rect x="35" y="215" width="195" height="210" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="240" font-size="13" font-weight="bold" fill="#c0392b">λ = 0.25 (1/4)</text>
  <text x="45" y="265" font-size="12" fill="#1a1a1a">• F_cr = 0.25 · π²EI / L²</text>
  <text x="45" y="290" font-size="12" fill="#1a1a1a">• Швидкість: f_sup = 0.34</text>
  <text x="45" y="315" font-size="12" fill="#6b7280">• Чвертьхвильовий вигин</text>
  <text x="45" y="340" font-size="12" fill="#6b7280">• Найнижча жорсткість</text>
  <text x="45" y="365" font-size="12" fill="#6b7280">• Схильний до провисання</text>
  <text x="45" y="395" font-size="11" font-weight="bold" fill="#c0392b">Лише для коротких ходів</text>


  <!-- COLUMN 2: Supported - Supported -->
  <rect x="255" y="75" width="215" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="265" y="88" width="195" height="28" rx="5" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="362" y="107" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Опертий — Опертий</text>

  <!-- Supports visualization -->
  <circle cx="285" cy="155" r="10" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="270" y="124" font-size="11" fill="#2457d6">Опора</text>
  <circle cx="435" cy="155" r="10" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="420" y="124" font-size="11" fill="#2457d6">Опора</text>

  <!-- Buckling shape (1/2 wave sine) -->
  <path d="M 285 155 Q 360 195 435 155" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="285" y1="155" x2="435" y2="155" stroke="#6b7280" stroke-dasharray="3,3"/>

  <!-- Axial force arrow -->
  <line x1="455" y1="155" x2="430" y2="155" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-b1)"/>

  <!-- Badges and specs -->
  <rect x="265" y="215" width="195" height="210" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="275" y="240" font-size="13" font-weight="bold" fill="#2457d6">λ = 1.0 (Базова)</text>
  <text x="275" y="265" font-size="12" fill="#1a1a1a">• F_cr = 1.0 · π²EI / L²</text>
  <text x="275" y="290" font-size="12" fill="#1a1a1a">• Швидкість: f_sup = 1.00</text>
  <text x="275" y="315" font-size="12" fill="#6b7280">• Класична напівхвиля</text>
  <text x="275" y="340" font-size="12" fill="#6b7280">• Радіальні підшипники</text>
  <text x="275" y="365" font-size="12" fill="#6b7280">• Вільне кутове зміщення</text>
  <text x="275" y="395" font-size="11" font-weight="bold" fill="#2457d6">Стандарт для простих осей</text>


  <!-- COLUMN 3: Fixed - Supported -->
  <rect x="485" y="75" width="215" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="495" y="88" width="195" height="28" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="592" y="107" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Затиснений — Опертий</text>

  <!-- Supports visualization -->
  <rect x="505" y="130" width="30" height="50" fill="#2457d6"/>
  <text x="505" y="124" font-size="11" font-weight="bold" fill="#2457d6">Затиск</text>
  <circle cx="665" cy="155" r="10" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="650" y="124" font-size="11" fill="#2457d6">Опора</text>

  <!-- Buckling shape -->
  <path d="M 535 155 Q 585 155 615 185 Q 645 185 665 155" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="535" y1="155" x2="665" y2="155" stroke="#6b7280" stroke-dasharray="3,3"/>

  <!-- Badges and specs -->
  <rect x="495" y="215" width="195" height="210" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="505" y="240" font-size="13" font-weight="bold" fill="#2457d6">λ = 2.05 (×2)</text>
  <text x="505" y="265" font-size="12" fill="#1a1a1a">• F_cr = 2.05 · π²EI / L²</text>
  <text x="505" y="290" font-size="12" fill="#1a1a1a">• Швидкість: f_sup = 1.56</text>
  <text x="505" y="315" font-size="12" fill="#6b7280">• Хвиля з точкою перегину</text>
  <text x="505" y="340" font-size="12" fill="#6b7280">• Дуплексна упорна опора</text>
  <text x="505" y="365" font-size="12" fill="#6b7280">• Плаваючий радіальний кінець</text>
  <text x="505" y="395" font-size="11" font-weight="bold" fill="#27ae60">Оптимум для середніх ЧПК</text>


  <!-- COLUMN 4: Fixed - Fixed -->
  <rect x="715" y="75" width="220" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="725" y="88" width="200" height="28" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="825" y="107" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Затиснений — Затиснений</text>

  <!-- Supports visualization -->
  <rect x="735" y="130" width="28" height="50" fill="#27ae60"/>
  <text x="735" y="124" font-size="11" font-weight="bold" fill="#27ae60">Затиск</text>
  <rect x="895" y="130" width="28" height="50" fill="#27ae60"/>
  <text x="880" y="124" font-size="11" font-weight="bold" fill="#27ae60">Затиск</text>

  <!-- Buckling shape (inflection at both ends) -->
  <path d="M 763 155 Q 795 155 825 185 Q 860 155 895 155" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="763" y1="155" x2="895" y2="155" stroke="#6b7280" stroke-dasharray="3,3"/>

  <!-- Badges and specs -->
  <rect x="725" y="215" width="200" height="210" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="735" y="240" font-size="13" font-weight="bold" fill="#27ae60">λ = 4.0 (Максимум)</text>
  <text x="735" y="265" font-size="12" fill="#1a1a1a">• F_cr = 4.0 · π²EI / L²</text>
  <text x="735" y="290" font-size="12" fill="#1a1a1a">• Швидкість: f_sup = 2.19</text>
  <text x="735" y="315" font-size="12" fill="#6b7280">• Обидва кінці жорсткі</text>
  <text x="735" y="340" font-size="12" fill="#6b7280">• Дозволяє термонатяг вала</text>
  <text x="735" y="365" font-size="12" fill="#6b7280">• У 16 разів міцніше за вільний</text>
  <text x="735" y="395" font-size="11" font-weight="bold" fill="#27ae60">Прецизійні швидкісні верстати</text>
</svg>
