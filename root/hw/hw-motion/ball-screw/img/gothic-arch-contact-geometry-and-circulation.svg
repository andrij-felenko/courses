<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark2" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue2" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red2" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green2" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометрія готичної арки та контур циркуляції кульок у гайці ШВП</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Двоточковий контакт під кутом 45° та замкнене повернення кульок дефлектором</text>

  <!-- LEFT PANEL: Gothic Arch Profile -->
  <rect x="30" y="75" width="435" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="50" y="92" width="395" height="32" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="113" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Профіль доріжки «готична арка» (Gothic Arch)</text>

  <!-- Nut raceway (top) -->
  <path d="M 70 145 L 420 145 L 420 180 C 370 180 340 160 280 160 C 220 160 190 180 70 180 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Screw raceway (bottom) -->
  <path d="M 70 310 L 420 310 L 420 275 C 370 275 340 295 280 295 C 220 295 190 275 70 275 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Ball -->
  <circle cx="247" cy="228" r="45" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <circle cx="247" cy="228" r="4" fill="#2457d6"/>

  <!-- Contact lines at 45 deg -->
  <line x1="190" y1="171" x2="304" y2="285" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="190" y1="285" x2="304" y2="171" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Contact points -->
  <circle cx="215" cy="196" r="5" fill="#c0392b"/>
  <circle cx="279" cy="260" r="5" fill="#c0392b"/>
  <circle cx="215" cy="260" r="5" fill="#27ae60"/>
  <circle cx="279" cy="196" r="5" fill="#27ae60"/>

  <!-- Angle arc for 45 deg -->
  <path d="M 268 228 A 21 21 0 0 0 262 213" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="310" y="232" font-size="12" font-weight="bold" fill="#1a1a1a">α = 45°</text>

  <!-- Labels on left panel -->
  <text x="75" y="200" font-size="12" font-weight="bold" fill="#c0392b">Контакт A</text>
  <text x="345" y="200" font-size="12" font-weight="bold" fill="#27ae60">Контакт B</text>

  <rect x="50" y="325" width="395" height="100" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="65" y="348" font-size="12" font-weight="bold" fill="#1a1a1a">• Радіус канавки більший за радіус кульки (R_кан ≈ 0.52·d_k)</text>
  <text x="65" y="370" font-size="12" fill="#6b7280">• Два радіуси кривини з рознесеними центрами O_1 та O_2</text>
  <text x="65" y="392" font-size="12" fill="#6b7280">• Чітко зафіксований кут контакту 45° сприймає осьову силу</text>
  <text x="65" y="414" font-size="12" fill="#2457d6">• Зазор на дні канавки виключає заклинювання кульок</text>


  <!-- RIGHT PANEL: Circulation loop -->
  <rect x="495" y="75" width="435" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="515" y="92" width="395" height="32" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="113" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Схема циркуляції кульок через дефлектор гайки</text>

  <!-- Working Helical Track with Balls (Loaded) -->
  <rect x="535" y="240" width="355" height="46" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="712" y="232" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Робоча навантажена ділянка гвинтової канавки</text>

  <!-- Balls in loaded track -->
  <circle cx="565" cy="263" r="16" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <circle cx="605" cy="263" r="16" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <circle cx="645" cy="263" r="16" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <circle cx="685" cy="263" r="16" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <circle cx="725" cy="263" r="16" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <circle cx="765" cy="263" r="16" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <circle cx="805" cy="263" r="16" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <circle cx="845" cy="263" r="16" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>

  <!-- Forward flow arrow -->
  <line x1="580" y1="263" x2="825" y2="263" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue2)"/>

  <!-- Return Channel / Deflector (Unloaded loop) -->
  <path d="M 855 240 C 875 190 830 160 712 160 C 590 160 550 190 555 240" fill="none" stroke="#27ae60" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arr-green2)"/>

  <!-- Deflector scoops placed clearly away from the curved path -->
  <rect x="850" y="210" width="45" height="20" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="872" y="224" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Знімач</text>

  <rect x="530" y="210" width="40" height="20" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="550" y="224" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Вхід</text>

  <text x="712" y="150" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Розвантажений поворотний канал (зовнішня трубка / вкладиш)</text>

  <!-- Explanatory badges / notes at bottom of right panel -->
  <rect x="515" y="325" width="395" height="100" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="530" y="348" font-size="12" font-weight="bold" fill="#1a1a1a">• Кулька проходить робочий виток і підхоплюється зубом</text>
  <text x="530" y="370" font-size="12" fill="#6b7280">• Дефлектор перекидає кульку через гребінь різьби гвинта</text>
  <text x="530" y="392" font-size="12" fill="#6b7280">• Повернення у вихідну позицію для повторного зачеплення</text>
  <text x="530" y="414" font-size="12" fill="#27ae60">• Замкнений контур забезпечує необмежений поступальний хід</text>
</svg>
