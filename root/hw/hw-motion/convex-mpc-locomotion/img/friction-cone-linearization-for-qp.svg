<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-axis" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Лінеаризація конуса тертя Кулона для квадратичного програмування (QP)</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Апроксимація кругового конуса чотиригранною пірамідою лінійних нерівностей</text>

  <!-- Left Panel: Nonlinear Cone -->
  <rect x="40" y="80" width="410" height="345" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="245" y="110" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Круговий конус тертя Кулона</text>

  <!-- Cone graphics -->
  <!-- Vertical axis f_z -->
  <line x1="245" y1="360" x2="245" y2="140" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <text x="265" y="145" font-size="12" font-weight="bold" fill="#1a1a1a">f_z</text>

  <!-- Horizontal axis f_x -->
  <line x1="130" y1="360" x2="360" y2="360" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <text x="365" y="365" font-size="12" font-weight="bold" fill="#1a1a1a">f_x</text>

  <!-- Cone outline -->
  <path d="M 160,200 L 245,360 L 330,200" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <!-- Top ellipse -->
  <ellipse cx="245" cy="200" rx="85" ry="25" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>

  <!-- Formula box left -->
  <rect x="60" y="270" width="130" height="70" rx="6" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="125" y="292" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Нелінійне SOCP:</text>
  <text x="125" y="312" font-size="11" fill="#1a1a1a" text-anchor="middle">sqrt(fx^2 + fy^2)</text>
  <text x="125" y="328" font-size="11" fill="#1a1a1a" text-anchor="middle">&lt;= mu * fz</text>

  <!-- Middle Transition Arrow -->
  <line x1="460" y1="240" x2="500" y2="240" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="480" y="225" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Апрокс.</text>

  <!-- Right Panel: Linearized Pyramid -->
  <rect x="510" y="80" width="410" height="345" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="715" y="110" font-size="15" font-weight="bold" fill="#27ae60" text-anchor="middle">Чотиригранна піраміда (QP)</text>

  <!-- Pyramid graphics -->
  <!-- Vertical axis f_z -->
  <line x1="715" y1="360" x2="715" y2="140" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <text x="735" y="145" font-size="12" font-weight="bold" fill="#1a1a1a">f_z</text>

  <!-- Horizontal axis f_x -->
  <line x1="600" y1="360" x2="830" y2="360" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <text x="835" y="365" font-size="12" font-weight="bold" fill="#1a1a1a">f_x</text>

  <!-- Inscribed pyramid edges -->
  <polygon points="715,360 655,200 715,225 775,200" fill="#eaf0fd" stroke="#27ae60" stroke-width="2"/>
  <polygon points="715,360 655,200 715,175 775,200" fill="#eaf0fd" stroke="#27ae60" stroke-width="2"/>
  <line x1="715" y1="360" x2="715" y2="225" stroke="#27ae60" stroke-width="2"/>

  <!-- Formula box right -->
  <rect x="530" y="255" width="160" height="95" rx="6" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="610" y="275" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Лінійні нерівності:</text>
  <text x="610" y="295" font-size="11" fill="#1a1a1a" text-anchor="middle">|f_x| &lt;= mu * f_z / sqrt(2)</text>
  <text x="610" y="315" font-size="11" fill="#1a1a1a" text-anchor="middle">|f_y| &lt;= mu * f_z / sqrt(2)</text>
  <text x="610" y="335" font-size="11" fill="#1a1a1a" text-anchor="middle">f_z_min &lt;= f_z &lt;= f_z_max</text>
</svg>
