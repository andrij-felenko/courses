<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-force" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-com" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Модель одиночного жорсткого тіла (SRBD) чотириногого робота</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Сили реакції ґрунту під лапами формують динаміку центра мас і кутові прискорення</text>

  <!-- Left: Robot Diagram Area -->
  <rect x="40" y="80" width="530" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Ground plane -->
  <line x1="60" y1="390" x2="550" y2="390" stroke="#6b7280" stroke-width="2"/>
  <line x1="60" y1="395" x2="550" y2="395" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Robot Body (Torso box) -->
  <rect x="170" y="170" width="260" height="90" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="300" y="210" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Тіло робота (SRBD)</text>
  <text x="300" y="230" font-size="12" fill="#6b7280" text-anchor="middle">Маса m, тензор інерції I_b</text>

  <!-- Center of Mass (CoM) marker -->
  <circle cx="300" cy="215" r="7" fill="#c0392b"/>
  <circle cx="300" cy="215" r="14" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="335" y="218" font-size="12" font-weight="bold" fill="#c0392b">CoM</text>

  <!-- Gravity vector -->
  <line x1="300" y1="230" x2="300" y2="280" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-com)"/>
  <text x="310" y="270" font-size="12" fill="#c0392b">m * g</text>

  <!-- Leg 1 (FL) -->
  <line x1="200" y1="260" x2="130" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="130" cy="390" r="5" fill="#1a1a1a"/>
  <!-- Force vector f1 -->
  <line x1="130" y1="390" x2="150" y2="320" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-force)"/>
  <text x="160" y="340" font-size="13" font-weight="bold" fill="#27ae60">f_1</text>

  <!-- Leg 2 (FR) -->
  <line x1="240" y1="260" x2="220" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="220" cy="390" r="5" fill="#1a1a1a"/>
  <!-- Force vector f2 -->
  <line x1="220" y1="390" x2="235" y2="320" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-force)"/>
  <text x="245" y="340" font-size="13" font-weight="bold" fill="#27ae60">f_2</text>

  <!-- Leg 3 (RL) -->
  <line x1="360" y1="260" x2="380" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="380" cy="390" r="5" fill="#1a1a1a"/>
  <!-- Force vector f3 -->
  <line x1="380" y1="390" x2="365" y2="320" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-force)"/>
  <text x="340" y="340" font-size="13" font-weight="bold" fill="#27ae60">f_3</text>

  <!-- Leg 4 (RR) -->
  <line x1="400" y1="260" x2="470" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="470" cy="390" r="5" fill="#1a1a1a"/>
  <!-- Force vector f4 -->
  <line x1="470" y1="390" x2="450" y2="320" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-force)"/>
  <text x="460" y="340" font-size="13" font-weight="bold" fill="#27ae60">f_4</text>

  <!-- Right: Dynamic Equations Panel -->
  <rect x="590" y="80" width="330" height="345" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="755" y="110" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Рівняння динаміки SRBD</text>

  <rect x="610" y="130" width="290" height="110" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="755" y="155" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Лінійний рух центра мас:</text>
  <text x="755" y="185" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">m * ddx = sum (f_i) + m * g</text>
  <text x="755" y="215" font-size="11" fill="#6b7280" text-anchor="middle">Сума 4 контактних сил опор і гравітації</text>

  <rect x="610" y="260" width="290" height="145" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="755" y="285" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кутовий рух (рискання, тангаж, крен):</text>
  <text x="755" y="315" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">d(I_b * omega)/dt = sum (r_i x f_i)</text>
  <text x="755" y="345" font-size="11" fill="#6b7280" text-anchor="middle">r_i — вектор від CoM до точки опори лапи</text>
  <text x="755" y="365" font-size="11" fill="#6b7280" text-anchor="middle">Маса ніг вважається знехтовно малою</text>
  <text x="755" y="385" font-size="11" fill="#27ae60" text-anchor="middle">Лінійне формулювання для QP-солвера</text>
</svg>
