<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="250" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Живлення: стрічка — це вже силова електроніка</text>
<rect x="50.0" y="70.0" width="320.0" height="96.0" rx="6" fill="#fdf6e3" stroke="#caa24a" stroke-width="1.8"/>
<text x="210.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d1a" text-anchor="middle" font-weight="700">Скільки їсть струму</text>
<text x="210.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">піксель на повну білизну ≈ 60 мА</text>
<text x="210.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(3 × 20 мА)</text>
<rect x="410.0" y="70.0" width="300.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="560.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">100 пікселів ≈ 6 А</text>
<text x="560.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">із ніжки МК такого не взяти —</text>
<text x="560.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">треба окреме живлення</text>
<text x="380.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тому: окремий блок 5 В, спільна земля, зсув рівнів даних, конденсатор і резистор на даних.</text>
<text x="380.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Інжекція живлення по довжині й номінали обв'язки — у 🔌-вставці про стрічку.</text>
</svg>