<text x="151.2" y="48.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a6a14" text-anchor="middle" font-weight="bold" font-style="normal">T ≈ 1.25 мкс (вікно біта)</text>
<text x="331.8" y="48.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a6a14" text-anchor="middle" font-weight="bold" font-style="normal">T ≈ 1.25 мкс (вікно біта)</text>
<text x="62.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">DATA</text>
<line x1="66.0" y1="100.0" x2="66.0" y2="160.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<rect x="80.0" y="300.0" width="800.0" height="60.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.4"/>
<text x="480.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Інформація — у ТРИВАЛОСТІ HIGH, не в рівні сигналу. «0»: короткий HIGH (0.4 мкс);</text>
<text x="480.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">«1»: широкий HIGH (0.8 мкс). Вийшов за допуск ±150 нс — піксель прочитає хибний біт, колір «попливе».</text>
<rect x="80.0" y="374.0" width="380.0" height="42.0" rx="6" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.3"/>
<text x="270.0" y="400.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">Синій: біт «0» (вузький HIGH)</text>
<rect x="480.0" y="374.0" width="380.0" height="42.0" rx="6" fill="#fbecec" stroke="#c0271e" stroke-width="1.3"/>
<text x="670.0" y="400.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="normal" font-style="normal">Червоний: біт «1» (широкий HIGH)</text>
