<text x="480.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Таймінг бітів WS2812B: «0» і «1» — лише тривалість HIGH у вікні ~1.25 мкс</text>
<text x="480.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вийшов за допуск ±150 нс — піксель прочитає не той біт; скидання ≥50 мкс «защіпає» кадр</text>
