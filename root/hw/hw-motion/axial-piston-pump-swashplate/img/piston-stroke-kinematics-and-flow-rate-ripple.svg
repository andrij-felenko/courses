<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-axis-3" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінематика плунжера та пульсація подачі гідронасоса</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Порівняння нерівномірності потоку для непарної (Z=9) та парної (Z=8) кількості поршнів</text>

  <!-- Left: Kinematics and Waveforms Area -->
  <rect x="40" y="80" width="550" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Piston Motion Waveform (Top) -->
  <text x="60" y="105" font-size="13" font-weight="bold" fill="#2457d6">Переміщення s(phi) та швидкість v(phi) поршня</text>
  <line x1="90" y1="170" x2="550" y2="170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis-3)"/>
  <line x1="90" y1="210" x2="90" y2="115" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="540" y="185" font-size="11" fill="#1a1a1a">phi</text>
  <!-- s(phi) sine curve -->
  <path d="M 90,170 Q 180,120 270,170 T 450,170" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="170" y="125" font-size="11" font-weight="bold" fill="#2457d6">s(phi) = R * tg(gamma) * (1 - cos(phi))</text>

  <!-- Flow Ripple Waveforms (Bottom) -->
  <text x="60" y="240" font-size="13" font-weight="bold" fill="#1a1a1a">Сумарна миттєва подача Q(phi)</text>
  <line x1="90" y1="380" x2="550" y2="380" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis-3)"/>
  <line x1="90" y1="390" x2="90" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="540" y="395" font-size="11" fill="#1a1a1a">phi</text>

  <!-- Z=8 Even (High ripple ~ 14%) -->
  <path d="M 90,320 Q 115,280 140,320 Q 165,280 190,320 Q 215,280 240,320 Q 265,280 290,320 Q 315,280 340,320 Q 365,280 390,320 Q 415,280 440,320" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="450" y="300" font-size="11" font-weight="bold" fill="#c0392b">Z = 8 (парне, sigma ~ 14%)</text>

  <!-- Z=9 Odd (Low ripple ~ 1.5%) -->
  <path d="M 90,305 Q 105,295 120,305 Q 135,295 150,305 Q 165,295 180,305 Q 195,295 210,305 Q 225,295 240,305 Q 255,295 270,305 Q 285,295 300,305 Q 315,295 330,305 Q 345,295 360,305 Q 375,295 390,305 Q 405,295 420,305 Q 435,295 450,305" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="450" y="335" font-size="11" font-weight="bold" fill="#27ae60">Z = 9 (непарне, sigma ~ 1,5%)</text>

  <!-- Right: Comparison & Analytics Panel -->
  <rect x="610" y="80" width="310" height="345" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="765" y="110" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Чому обирають непарне Z?</text>

  <rect x="625" y="130" width="280" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="765" y="152" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Непарне Z = 9 (промисловий стандарт):</text>
  <text x="765" y="174" font-size="11" fill="#1a1a1a" text-anchor="middle">Фази нагнітання чергуються 4 і 5 поршнів</text>
  <text x="765" y="192" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Пульсація подачі delta_Q = 1,5%</text>

  <rect x="625" y="230" width="280" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="765" y="252" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Парне Z = 8 (небажане):</text>
  <text x="765" y="274" font-size="11" fill="#1a1a1a" text-anchor="middle">Синхронна зміна фаз одразу двох поршнів</text>
  <text x="765" y="292" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Пульсація подачі delta_Q = 14,0%</text>
  <text x="765" y="306" font-size="11" fill="#6b7280" text-anchor="middle">Викликає гідроудари та акустичний шум</text>

  <rect x="625" y="330" width="280" height="80" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="765" y="352" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Формула подачі гідромашини:</text>
  <text x="765" y="375" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Q = V_0 * n * eta_vol</text>
  <text x="765" y="393" font-size="11" fill="#6b7280" text-anchor="middle">де V_0 = (pi * d^2 / 4) * 2 * R * tg(gamma) * Z</text>
</svg>
