<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-force-2" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-lift-2" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Гідростатичне розвантаження опорного башмака</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Дросельний отвір подає тиск під підошву башмака, врівноважуючи силу поршня</text>

  <!-- Left: Slipper Pad Section Area -->
  <rect x="40" y="80" width="540" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Swashplate surface at bottom -->
  <rect x="80" y="300" width="460" height="35" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="310" y="322" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Поверхня похилої шайби (дзеркало ковзання)</text>

  <!-- Oil film gap -->
  <path d="M 110,295 h 400 v 5 h -400 z" fill="#eaf0fd"/>

  <!-- Slipper Pad Body -->
  <path d="M 110,295 L 140,230 L 260,230 L 280,180 L 340,180 L 360,230 L 480,230 L 510,295 Z" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="310" y="215" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Опорний башмак (бронза)</text>

  <!-- Ball joint connection -->
  <circle cx="310" cy="150" r="28" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2"/>
  <text x="310" y="155" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сфера</text>

  <!-- Piston clamping force arrow -->
  <line x1="310" y1="95" x2="310" y2="120" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-force-2)"/>
  <text x="325" y="105" font-size="13" font-weight="bold" fill="#c0392b">F_поршня</text>

  <!-- Central micro-channel -->
  <path d="M 306,150 h 8 v 145 h -8 z" fill="#2457d6"/>

  <!-- Central recess under slipper (Pocket) -->
  <path d="M 230,285 h 160 v 10 h -160 z" fill="#2457d6"/>

  <!-- Lift force arrows -->
  <line x1="250" y1="365" x2="250" y2="340" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-lift-2)"/>
  <line x1="310" y1="365" x2="310" y2="340" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-lift-2)"/>
  <line x1="370" y1="365" x2="370" y2="340" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-lift-2)"/>
  <text x="310" y="382" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Гідростатична підйомна сила F_lift</text>

  <!-- Right: Theory and Formula Panel -->
  <rect x="600" y="80" width="320" height="345" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="760" y="110" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Рівновага сил башмака</text>

  <rect x="615" y="130" width="290" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="760" y="152" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Осьова сила притиску:</text>
  <text x="760" y="174" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">F_p = p_pump * A_piston</text>
  <text x="760" y="196" font-size="11" fill="#6b7280" text-anchor="middle">Діє від тиску в циліндрі</text>

  <rect x="615" y="225" width="290" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="760" y="247" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Гідростатична сила відтиску:</text>
  <text x="760" y="270" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">F_lift = p_pocket * A_eff</text>
  <text x="760" y="292" font-size="11" fill="#1a1a1a" text-anchor="middle">Коефіцієнт балансу: beta = 0,90...0,95</text>
  <text x="760" y="308" font-size="11" fill="#6b7280" text-anchor="middle">Залишок 5-10% утримує контакт</text>

  <rect x="615" y="330" width="290" height="80" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="760" y="352" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Результат розвантаження:</text>
  <text x="760" y="372" font-size="11" fill="#1a1a1a" text-anchor="middle">• Мастильна плівка h = 3-8 мкм</text>
  <text x="760" y="390" font-size="11" fill="#1a1a1a" text-anchor="middle">• Тертя ковзання f = 0,001...0,003</text>
</svg>
