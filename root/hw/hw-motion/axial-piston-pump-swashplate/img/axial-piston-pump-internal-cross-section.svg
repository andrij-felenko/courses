<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конструктивна схема аксіально-поршневого насоса</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Блок циліндрів, похила шайба, плунжери з опорними башмаками та розподільний диск</text>

  <!-- Left: Pump Assembly Diagram Area -->
  <rect x="40" y="80" width="560" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Drive Shaft -->
  <path d="M 60,225 h 520 v 30 h -520 z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="80" y="215" font-size="11" font-weight="bold" fill="#1a1a1a">Вал</text>

  <!-- Swashplate (tilted plate) -->
  <polygon points="150,110 180,110 220,390 190,390" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="140" y="100" font-size="12" font-weight="bold" fill="#2457d6">Похила шайба</text>

  <!-- Upper Cylinder Block (Rotor upper) -->
  <rect x="290" y="125" width="170" height="95" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="375" y="118" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Блок циліндрів</text>

  <!-- Upper Piston Bore and Piston (drawn with paths to avoid rect overlap) -->
  <path d="M 290,150 h 150 v 40 h -150 z" fill="white" stroke="#27ae60" stroke-width="1"/>
  <path d="M 210,155 h 120 v 30 h -120 z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Upper Slipper Pad -->
  <polygon points="175,150 190,150 210,165 210,175 190,190 175,190" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Lower Cylinder Block (Rotor lower) -->
  <rect x="290" y="260" width="170" height="105" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>

  <!-- Lower Piston Bore and Piston -->
  <path d="M 290,295 h 150 v 40 h -150 z" fill="white" stroke="#27ae60" stroke-width="1"/>
  <path d="M 250,300 h 120 v 30 h -120 z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Lower Slipper Pad -->
  <polygon points="215,295 230,295 250,310 250,320 230,335 215,335" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Valve Plate (Right) -->
  <path d="M 470,125 h 30 v 95 h -30 z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 470,260 h 30 v 105 h -30 z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="485" y="118" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Диск</text>

  <!-- Ports on the right -->
  <rect x="510" y="145" width="60" height="50" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="540" y="175" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Вихід</text>

  <rect x="510" y="290" width="60" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="540" y="320" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Вхід</text>

  <!-- Right: Components Description Panel -->
  <rect x="620" y="80" width="300" height="345" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="770" y="110" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Вузли конструкції</text>

  <rect x="635" y="130" width="270" height="65" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="645" y="152" font-size="12" font-weight="bold" fill="#2457d6">1. Похила шайба (Swashplate)</text>
  <text x="645" y="172" font-size="11" fill="#1a1a1a">Задає хід поршня H = 2 * R * tg(gamma)</text>
  <text x="645" y="187" font-size="11" fill="#6b7280">Кут регулюється від 0 до 18-20°</text>

  <rect x="635" y="205" width="270" height="65" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="645" y="227" font-size="12" font-weight="bold" fill="#c0392b">2. Башмаки з розвантаженням</text>
  <text x="645" y="247" font-size="11" fill="#1a1a1a">Спливають на оливній мікроплівці</text>
  <text x="645" y="262" font-size="11" fill="#6b7280">Компенсують 90-95% сили притиску</text>

  <rect x="635" y="280" width="270" height="65" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="645" y="302" font-size="12" font-weight="bold" fill="#27ae60">3. Блок циліндрів (ротор)</text>
  <text x="645" y="322" font-size="11" fill="#1a1a1a">Містить 7 або 9 прецизійних плунжерів</text>
  <text x="645" y="337" font-size="11" fill="#6b7280">Обертається разом із приводним валом</text>

  <rect x="635" y="355" width="270" height="60" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="645" y="377" font-size="12" font-weight="bold" fill="#1a1a1a">4. Торцевий розподільник</text>
  <text x="645" y="397" font-size="11" fill="#6b7280">Серпоподібні вікна всмоктування/тиску</text>
</svg>
