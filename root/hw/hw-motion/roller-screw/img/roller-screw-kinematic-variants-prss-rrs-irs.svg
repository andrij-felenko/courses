<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінематичні варіанти роликогвинтових передач</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Порівняння стандартної планетарної (PRSS), рециркуляційної (RRS) та інвертованої (IRS) передач</text>

  <!-- Column 1: PRSS Standard Planetary -->
  <rect x="35" y="80" width="280" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="50" y="95" width="250" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="175" y="118" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Планетарна (PRSS)</text>

  <!-- Schematic PRSS -->
  <path d="M 55,160 h 240 v 14 h -240 z" fill="#2457d6"/>
  <path d="M 120,145 h 110 v 44 h -110 z" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 130,150 h 90 v 10 h -90 z" fill="#27ae60"/>
  <path d="M 130,174 h 90 v 10 h -90 z" fill="#27ae60"/>
  <text x="175" y="210" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Гайка з роликами на валу</text>

  <!-- Characteristics PRSS -->
  <rect x="45" y="225" width="260" height="185" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="248" font-size="12" font-weight="bold" fill="#2457d6">Конструктивні властивості:</text>
  <text x="55" y="270" font-size="11" fill="#1a1a1a">• Нарізні ролики без осьового ходу</text>
  <text x="55" y="290" font-size="11" fill="#1a1a1a">• Безперервний контакт без ударів</text>
  <text x="55" y="310" font-size="11" fill="#1a1a1a">• Робочий хід до 2...4 метрів</text>
  <text x="55" y="330" font-size="11" fill="#1a1a1a">• Швидкість до 4000 об/хв</text>
  <text x="55" y="355" font-size="11" font-weight="bold" fill="#27ae60">Застосування:</text>
  <text x="55" y="375" font-size="11" fill="#6b7280">Верстати ЧПК, важкі преси,</text>
  <text x="55" y="393" font-size="11" fill="#6b7280">аерокосмічні лінійні приводи</text>

  <!-- Column 2: RRS Recirculating -->
  <rect x="340" y="80" width="280" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="355" y="95" width="250" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="480" y="118" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">2. Рециркуляційна (RRS)</text>

  <!-- Schematic RRS -->
  <path d="M 360,160 h 240 v 14 h -240 z" fill="#2457d6"/>
  <path d="M 425,145 h 110 v 44 h -110 z" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 440,150 h 80 v 10 h -80 z" fill="#c0392b"/>
  <path d="M 440,174 h 80 v 10 h -80 z" fill="#c0392b"/>
  <circle cx="433" cy="167" r="4" fill="#c0392b"/>
  <text x="480" y="210" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Канавкові ролики з кулачком</text>

  <!-- Characteristics RRS -->
  <rect x="350" y="225" width="260" height="185" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="360" y="248" font-size="12" font-weight="bold" fill="#c0392b">Конструктивні властивості:</text>
  <text x="360" y="270" font-size="11" fill="#1a1a1a">• Ролики з кільцевими канавками</text>
  <text x="360" y="290" font-size="11" fill="#1a1a1a">• Кулачок повертає ролик щооберту</text>
  <text x="360" y="310" font-size="11" fill="#1a1a1a">• Надмалий крок: p = 0,25...1 мм</text>
  <text x="360" y="330" font-size="11" fill="#1a1a1a">• Величезне передавальне число</text>
  <text x="360" y="355" font-size="11" font-weight="bold" fill="#c0392b">Застосування:</text>
  <text x="360" y="375" font-size="11" fill="#6b7280">Мікропозиціонери, мікроскопи,</text>
  <text x="360" y="393" font-size="11" fill="#6b7280">медичні хірургічні роботи</text>

  <!-- Column 3: IRS Inverted -->
  <rect x="645" y="80" width="280" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="660" y="95" width="250" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="785" y="118" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Інвертована (IRS)</text>

  <!-- Schematic IRS -->
  <path d="M 665,145 h 240 v 44 h -240 z" fill="none" stroke="#27ae60" stroke-width="2"/>
  <path d="M 680,160 h 120 v 14 h -120 z" fill="#1a1a1a"/>
  <path d="M 740,150 h 60 v 10 h -60 z" fill="#27ae60"/>
  <path d="M 740,174 h 60 v 10 h -60 z" fill="#27ae60"/>
  <text x="785" y="210" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Довга гайка та порожнистий шток</text>

  <!-- Characteristics IRS -->
  <rect x="655" y="225" width="260" height="185" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="665" y="248" font-size="12" font-weight="bold" fill="#27ae60">Конструктивні властивості:</text>
  <text x="665" y="270" font-size="11" fill="#1a1a1a">• Нарізка виконана всередині труби</text>
  <text x="665" y="290" font-size="11" fill="#1a1a1a">• Ролики ходять разом зі штоком</text>
  <text x="665" y="310" font-size="11" fill="#1a1a1a">• Шток ховається всередину гайки</text>
  <text x="665" y="330" font-size="11" fill="#1a1a1a">• Найвища інтеграція в сервопривод</text>
  <text x="665" y="355" font-size="11" font-weight="bold" fill="#2457d6">Застосування:</text>
  <text x="665" y="375" font-size="11" fill="#6b7280">Компактні електроактуатори EMA,</text>
  <text x="665" y="393" font-size="11" fill="#6b7280">роботизовані кінцівки, гальма</text>
</svg>
