<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-axis-11" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конструктивна будова планетарної роликогвинтової передачі (ШРВП)</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Поздовжній розріз: центральний гвинт, планетарні різьбові ролики та опорна гайка</text>

  <!-- Left: Cutaway Diagram Area -->
  <rect x="40" y="80" width="560" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Central Screw Shaft -->
  <path d="M 60,215 h 520 v 30 h -520 z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="80" y="205" font-size="11" font-weight="bold" fill="#2457d6">Прецизійний гвинт (Вал)</text>

  <!-- Outer Nut (Top & Bottom halves) -->
  <path d="M 180,110 h 280 v 35 h -280 z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 180,315 h 280 v 35 h -280 z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="320" y="100" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Гайка з внутрішньою різьбою</text>

  <!-- Planetary Rollers (Top & Bottom) -->
  <path d="M 210,155 h 220 v 45 h -220 z" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="320" y="182" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Планетарний ролик (верхній)</text>

  <path d="M 210,260 h 220 v 45 h -220 z" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="320" y="287" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Планетарний ролик (нижній)</text>

  <!-- Timing Ring Gears at Ends -->
  <path d="M 185,150 h 20 v 160 h -20 z" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="175" y="140" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">Зубчастий вінець</text>

  <path d="M 435,150 h 20 v 160 h -20 z" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="465" y="140" font-size="11" font-weight="bold" fill="#c0392b">Синхронізатор</text>

  <!-- Axial load arrow -->
  <line x1="570" y1="230" x2="510" y2="230" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-axis-11)"/>
  <text x="540" y="260" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">F_axial</text>

  <!-- Right: Technical Details Panel -->
  <rect x="620" y="80" width="300" height="345" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="770" y="110" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Конструктивні особливості</text>

  <rect x="635" y="130" width="270" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="645" y="152" font-size="12" font-weight="bold" fill="#2457d6">1. Різьбові ролики (8..12 шт)</text>
  <text x="645" y="172" font-size="11" fill="#1a1a1a">Трикутний профіль різьби 90°</text>
  <text x="645" y="188" font-size="11" fill="#1a1a1a">Обертаються навколо гвинта як сателіти</text>
  <text x="645" y="204" font-size="11" fill="#6b7280">Без рециркуляції та зворотних каналів</text>

  <rect x="635" y="225" width="270" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="645" y="247" font-size="12" font-weight="bold" fill="#c0392b">2. Зубчаста синхронізація</text>
  <text x="645" y="267" font-size="11" fill="#1a1a1a">Зубчасті вінці на краях гайки</text>
  <text x="645" y="283" font-size="11" fill="#1a1a1a">Унеможливлюють осьовий перекіс роликів</text>
  <text x="645" y="299" font-size="11" fill="#6b7280">Забезпечують стабільність при високих rpm</text>

  <rect x="635" y="320" width="270" height="90" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="645" y="342" font-size="12" font-weight="bold" fill="#27ae60">3. Вантажопідйомність</text>
  <text x="645" y="362" font-size="11" fill="#1a1a1a">Сотні точок контакту одночасно</text>
  <text x="645" y="378" font-size="11" fill="#27ae60">Динамічна ємність C_dyn у 3-5 разів вища</text>
  <text x="645" y="396" font-size="11" fill="#6b7280">Ресурс довговічності у 10-15 разів більший</text>
</svg>
