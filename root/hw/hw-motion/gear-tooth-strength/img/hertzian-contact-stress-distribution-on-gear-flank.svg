<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-axis-gh" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Епюра контактних напружень Герца на профілі зуба</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Розподіл тиску sigma_H вздовж лінії зачеплення з максимумом біля полюса C</text>

  <!-- Left: Involute Contact & Stress Distribution Area -->
  <rect x="40" y="80" width="550" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Flank profiles in contact -->
  <path d="M 120,380 Q 220,280 250,130" fill="none" stroke="#2457d6" stroke-width="3"/>
  <text x="70" y="360" font-size="12" font-weight="bold" fill="#2457d6">Шестерня</text>

  <path d="M 380,380 Q 280,280 250,130" fill="none" stroke="#27ae60" stroke-width="3"/>
  <text x="390" y="360" font-size="12" font-weight="bold" fill="#27ae60">Колесо</text>

  <!-- Pitch point C -->
  <circle cx="250" cy="225" r="5" fill="#c0392b"/>
  <text x="260" y="310" font-size="12" font-weight="bold" fill="#c0392b">Полюс C</text>

  <!-- Hertz Elliptical Pressure semi-circle at contact -->
  <path d="M 250,165 A 60,60 0 0,1 250,285 Z" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="290" y="180" font-size="12" font-weight="bold" fill="#c0392b">sigma_H,max</text>

  <!-- Subsurface shear stress depth indicator (placed safely) -->
  <line x1="250" y1="225" x2="205" y2="225" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="215" cy="225" r="4" fill="#c0392b"/>
  <text x="70" y="215" font-size="11" font-weight="bold" fill="#c0392b">tau_max на 0,78*b</text>

  <!-- Right: Theory & Formulas Panel -->
  <rect x="610" y="80" width="310" height="345" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="765" y="110" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Формула Герца за ISO 6336</text>

  <rect x="625" y="130" width="280" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="765" y="152" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Контактне напруження:</text>
  <text x="765" y="174" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">sigma_H = Z_B * Z_H * Z_E * sqrt(w_t / d_1)</text>
  <text x="765" y="196" font-size="11" fill="#6b7280" text-anchor="middle">w_t — питоме колове зусилля F_t / b</text>

  <rect x="625" y="225" width="280" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="765" y="247" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Критична однопарна зона (HPSTC):</text>
  <text x="765" y="268" font-size="11" fill="#1a1a1a" text-anchor="middle">Коли в зачепленні перебуває лише одна</text>
  <text x="765" y="286" font-size="11" fill="#1a1a1a" text-anchor="middle">пара зубів, навантаження передається на 100%,</text>
  <text x="765" y="304" font-size="11" fill="#c0392b" text-anchor="middle">викликаючи пік тиску до 1500 МПа</text>

  <rect x="625" y="330" width="280" height="80" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="765" y="352" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Умова міцності за ISO 6336:</text>
  <text x="765" y="375" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">sigma_H &lt;= sigma_HP = sigma_Hlim / S_H</text>
  <text x="765" y="393" font-size="11" fill="#6b7280" text-anchor="middle">Коефіцієнт запасу S_H &gt;= 1,1...1,3</text>
</svg>
