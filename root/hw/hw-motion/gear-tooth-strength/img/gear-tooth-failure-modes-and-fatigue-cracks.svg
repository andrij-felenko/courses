<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Основні види руйнування та пошкодження зубів редуктора</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Втомний злам ніжки зуба, контактний пітинг робочої грані та високотемпературне заїдання</text>

  <!-- Column 1: Bending Fatigue Breakage -->
  <rect x="35" y="80" width="280" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="50" y="95" width="250" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="175" y="118" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">1. Втомний злам ніжки</text>

  <!-- Tooth with crack schematic -->
  <path d="M 120,220 Q 140,150 175,145 Q 210,150 230,220 Z" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 125,210 L 155,195" stroke="#c0392b" stroke-width="3"/>
  <circle cx="125" cy="210" r="4" fill="#c0392b"/>
  <text x="175" y="240" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Тріщина втоми у галтелі</text>

  <rect x="45" y="255" width="260" height="155" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="278" font-size="12" font-weight="bold" fill="#c0392b">Характеристика зламу:</text>
  <text x="55" y="300" font-size="11" fill="#1a1a1a">• Концентрація напружень у радіусі галтелі</text>
  <text x="55" y="320" font-size="11" fill="#1a1a1a">• Циклічний пульсуючий згин зуба</text>
  <text x="55" y="340" font-size="11" fill="#1a1a1a">• Раптовий катастрофічний відрив зуба</text>
  <text x="55" y="365" font-size="11" font-weight="bold" fill="#2457d6">Захист:</text>
  <text x="55" y="385" font-size="11" fill="#6b7280">Дробоструминне зміцнення, більший модуль</text>

  <!-- Column 2: Surface Pitting -->
  <rect x="340" y="80" width="280" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="355" y="95" width="250" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="118" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Контактний пітинг</text>

  <!-- Tooth with pitting cavities -->
  <path d="M 425,220 Q 445,150 480,145 Q 515,150 535,220 Z" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="452" cy="175" r="3" fill="#2457d6"/>
  <circle cx="457" cy="182" r="4" fill="#2457d6"/>
  <circle cx="450" cy="190" r="2.5" fill="#2457d6"/>
  <text x="480" y="240" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Каверни викошування металу</text>

  <rect x="350" y="255" width="260" height="155" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="360" y="278" font-size="12" font-weight="bold" fill="#2457d6">Характеристика пітингу:</text>
  <text x="360" y="300" font-size="11" fill="#1a1a1a">• Підповерхневі зсувні напруження Герца</text>
  <text x="360" y="320" font-size="11" fill="#1a1a1a">• Викришування раковин біля полюсної лінії</text>
  <text x="360" y="340" font-size="11" fill="#1a1a1a">• Зростання вібрацій та шуму передачі</text>
  <text x="360" y="365" font-size="11" font-weight="bold" fill="#2457d6">Захист:</text>
  <text x="360" y="385" font-size="11" fill="#6b7280">Цементація до 58...62 HRC, в'язкі оливи</text>

  <!-- Column 3: Scuffing / Galling -->
  <rect x="645" y="80" width="280" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="660" y="95" width="250" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="785" y="118" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Теплове заїдання</text>

  <!-- Tooth with scuffing scratches -->
  <path d="M 730,220 Q 750,150 785,145 Q 820,150 840,220 Z" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="755" y1="155" x2="765" y2="175" stroke="#27ae60" stroke-width="2"/>
  <line x1="760" y1="158" x2="770" y2="178" stroke="#27ae60" stroke-width="2"/>
  <text x="785" y="240" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Радіальні борозни зварювання</text>

  <rect x="655" y="255" width="260" height="155" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="665" y="278" font-size="12" font-weight="bold" fill="#27ae60">Характеристика заїдання:</text>
  <text x="665" y="300" font-size="11" fill="#1a1a1a">• Розрив мастильної плівки при високих v</text>
  <text x="665" y="320" font-size="11" fill="#1a1a1a">• Локальне зварювання мікровиступів</text>
  <text x="665" y="340" font-size="11" fill="#1a1a1a">• Виривання металу на вершинах зубів</text>
  <text x="665" y="365" font-size="11" font-weight="bold" fill="#2457d6">Захист:</text>
  <text x="665" y="385" font-size="11" fill="#6b7280">Протизадирні присадки EP, фосфатування</text>
</svg>
