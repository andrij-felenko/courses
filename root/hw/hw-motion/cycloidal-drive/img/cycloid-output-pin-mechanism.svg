<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біле тло -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Штифтовий механізм зняття чистого обертання циклоїдного редуктора</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Вихідні роликові пальці компенсують радіальний ексцентриситет e: D_hole = d_pin + 2 · e</text>

  <!-- Ліва панель: Геометрія взаємодії отвору та вихідного пальця -->
  <rect x="30" y="75" width="450" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="255" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Одиничний вузол компенсації ексцентриситету</text>

  <!-- Великий отвір у циклоїдному диску (діаметр D_hole = 160) -->
  <circle cx="255" cy="255" r="80" fill="white" stroke="#27ae60" stroke-width="2.5"/>
  <text x="255" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Отвір у диску D_hole</text>

  <!-- Вихідний роликовий палець (діаметр d_pin = 80, зміщений вниз на e=40, cx=255, cy=295) -->
  <circle cx="255" cy="295" r="40" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <circle cx="255" cy="295" r="5" fill="#2457d6"/>
  <text x="255" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Палець</text>
  <text x="255" y="306" text-anchor="middle" font-size="10" fill="#2457d6">d_pin</text>

  <!-- Точка контакту внизу -->
  <circle cx="255" cy="335" r="4" fill="#c0392b"/>
  <text x="255" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Точка передачі крутного моменту</text>

  <!-- Пояснення вільного радіуса ексцентриситету -->
  <text x="255" y="235" text-anchor="middle" font-size="11" fill="#6b7280">Вільний зазор для орбітального руху</text>
  <text x="255" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Радіус вільності = 2 · e</text>

  <text x="60" y="405" font-size="11" fill="#1a1a1a">Ексцентриситет e компенсується коченням стінки отвору по ролику</text>


  <!-- Права панель: Конструктивне збирання та баланс -->
  <rect x="500" y="75" width="430" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="715" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Кінематика передачі на вихідний вал</text>

  <rect x="520" y="125" width="390" height="85" rx="4" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="715" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Геометрична умова компенсації</text>
  <text x="715" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">D_hole = d_pin + 2 · e</text>
  <text x="715" y="195" text-anchor="middle" font-size="11" fill="#6b7280">Радіус вільного орбітального зміщення дорівнює точно ексцентриситету e</text>

  <rect x="520" y="225" width="390" height="95" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="535" y="248" font-size="12" font-weight="bold" fill="#2457d6">Як знімається чисте обертання</text>
  <text x="535" y="268" font-size="11" fill="#1a1a1a">Пальці жорстко закріплені на вихідному фланці, співвісному з редуктором</text>
  <text x="535" y="288" font-size="11" fill="#1a1a1a">Орбітальне зміщення диска перекочує стінки отворів по поверхні роликів</text>
  <text x="535" y="308" font-size="11" fill="#1a1a1a">Радіальні коливання поглинаються зазором, вихідний вал обертається чисто</text>

  <rect x="520" y="335" width="390" height="80" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="535" y="360" font-size="12" font-weight="bold" fill="#27ae60">Розподіл навантаження</text>
  <text x="535" y="380" font-size="11" fill="#1a1a1a">Зазвичай використовують 6 або 8 симетричних пальців по колу диска,</text>
  <text x="535" y="398" font-size="11" fill="#1a1a1a">що забезпечує високу крутильну жорсткість без перекосу фланця</text>
</svg>
