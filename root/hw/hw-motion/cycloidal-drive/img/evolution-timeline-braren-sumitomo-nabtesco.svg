<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-d" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-b" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Хронологічна лінія еволюції циклоїдного приводу (1926 — сьогодення)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Від мюнхенського патенту Брарена до глобального альянсу Sumitomo та прецизійних робототехнічних RV-редукторів</text>

  <!-- Central Timeline Bar -->
  <line x1="40" y1="180" x2="920" y2="180" stroke="#d0d7de" stroke-width="4"/>

  <!-- Milestone 1: 1926-1931 Lorenz Braren -->
  <circle cx="140" cy="180" r="14" fill="#2457d6" stroke="#ffffff" stroke-width="3"/>
  <rect x="95" y="145" width="90" height="22" rx="4" fill="#2457d6"/>
  <text x="140" y="160" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1926–1931</text>

  <!-- Card 1 (Bottom) -->
  <rect x="35" y="210" width="210" height="225" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="140" y="235" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Винахід Брарена</text>
  <text x="50" y="260" font-size="12" font-weight="bold" fill="#1a1a1a">• Патент DRP № 512607</text>
  <text x="50" y="280" font-size="11" fill="#6b7280">Епітрохоїдний диск без</text>
  <text x="50" y="296" font-size="11" fill="#6b7280">зубів: контакт кочення</text>
  <text x="50" y="320" font-size="12" font-weight="bold" fill="#1a1a1a">• Cyclo Getriebebau</text>
  <text x="50" y="340" font-size="11" fill="#6b7280">Заснування компанії в</text>
  <text x="50" y="356" font-size="11" fill="#6b7280">Мюнхені; ручний розрахунок</text>
  <text x="50" y="372" font-size="11" fill="#6b7280">точок профілю диска</text>
  <rect x="45" y="388" width="190" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="140" y="404" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">Подолання кризи зламу</text>
  <text x="140" y="418" font-size="10" fill="#2457d6" text-anchor="middle">евольвентних зубів</text>


  <!-- Milestone 2: 1930s Sumitomo Alliance -->
  <circle cx="380" cy="180" r="14" fill="#27ae60" stroke="#ffffff" stroke-width="3"/>
  <rect x="335" y="145" width="90" height="22" rx="4" fill="#27ae60"/>
  <text x="380" y="160" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1930-ті рр.</text>

  <!-- Card 2 (Top) -->
  <rect x="275" y="75" width="210" height="60" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="380" y="96" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Альянс із Sumitomo</text>
  <text x="380" y="114" font-size="11" fill="#1a1a1a" text-anchor="middle">Ліцензування патенту Брарена</text>
  <text x="380" y="128" font-size="11" fill="#6b7280" text-anchor="middle">Sumitomo Special Steel Co.</text>

  <!-- Card 2 (Bottom) -->
  <rect x="275" y="210" width="210" height="225" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="380" y="235" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Глобальне ліцензування</text>
  <text x="290" y="260" font-size="12" font-weight="bold" fill="#1a1a1a">• Серійний Cyclo Drive</text>
  <text x="290" y="280" font-size="11" fill="#6b7280">Масове впровадження у</text>
  <text x="290" y="296" font-size="11" fill="#6b7280">важке машинобудування</text>
  <text x="290" y="320" font-size="12" font-weight="bold" fill="#1a1a1a">• Японські верстати</text>
  <text x="290" y="340" font-size="11" fill="#6b7280">Розробка шліфувальних</text>
  <text x="290" y="356" font-size="11" fill="#6b7280">копіювальних верстатів</text>
  <text x="290" y="372" font-size="11" fill="#6b7280">для серійних дисків</text>
  <rect x="285" y="388" width="190" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="380" y="404" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Трансфер технології з</text>
  <text x="380" y="418" font-size="10" fill="#27ae60" text-anchor="middle">Німеччини до Азії</text>


  <!-- Milestone 3: 1950-1970s Industrial Standardization -->
  <circle cx="600" cy="180" r="14" fill="#2457d6" stroke="#ffffff" stroke-width="3"/>
  <rect x="550" y="145" width="100" height="22" rx="4" fill="#2457d6"/>
  <text x="600" y="160" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1950–1970-ті</text>

  <!-- Card 3 (Bottom) -->
  <rect x="505" y="210" width="200" height="225" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="605" y="235" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Стандартизація приводу</text>
  <text x="520" y="260" font-size="12" font-weight="bold" fill="#1a1a1a">• Дводискова схема</text>
  <text x="520" y="280" font-size="11" fill="#6b7280">Зсув фаз на 180° для</text>
  <text x="520" y="296" font-size="11" fill="#6b7280">повного зрівноваження</text>
  <text x="520" y="320" font-size="12" font-weight="bold" fill="#1a1a1a">• Світовий стандарт</text>
  <text x="520" y="340" font-size="11" fill="#6b7280">Конвеєри, цементні печі,</text>
  <text x="520" y="356" font-size="11" fill="#6b7280">хімічні мішалки з</text>
  <text x="520" y="372" font-size="11" fill="#6b7280">перевантаженням 500%</text>
  <rect x="515" y="388" width="180" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="605" y="404" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">Еталон невбиваного</text>
  <text x="605" y="418" font-size="10" fill="#2457d6" text-anchor="middle">індустріального редуктора</text>


  <!-- Milestone 4: 1980s-Present RV Robotics Reducers -->
  <circle cx="820" cy="180" r="14" fill="#c0392b" stroke="#ffffff" stroke-width="3"/>
  <rect x="765" y="145" width="110" height="22" rx="4" fill="#c0392b"/>
  <text x="820" y="160" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1980 — донині</text>

  <!-- Card 4 (Top) -->
  <rect x="725" y="75" width="200" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="825" y="96" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Робототехніка RV</text>
  <text x="825" y="114" font-size="11" fill="#1a1a1a" text-anchor="middle">Teijin Seiki / Nabtesco</text>
  <text x="825" y="128" font-size="11" fill="#6b7280" text-anchor="middle">Люфт менше 1 кутової мінути</text>

  <!-- Card 4 (Bottom) -->
  <rect x="725" y="210" width="200" height="225" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="825" y="235" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Прецизійні RV-редуктори</text>
  <text x="740" y="260" font-size="12" font-weight="bold" fill="#1a1a1a">• Двоступенева схема</text>
  <text x="740" y="280" font-size="11" fill="#6b7280">Вхідний планетарний ряд +</text>
  <text x="740" y="296" font-size="11" fill="#6b7280">циклоїдний вихідний блок</text>
  <text x="740" y="320" font-size="12" font-weight="bold" fill="#1a1a1a">• Шарніри маніпуляторів</text>
  <text x="740" y="340" font-size="11" fill="#6b7280">Стандарт промислових</text>
  <text x="740" y="356" font-size="11" fill="#6b7280">роботів KUKA, FANUC,</text>
  <text x="740" y="372" font-size="11" fill="#6b7280">ABB: надвисока жорсткість</text>
  <rect x="735" y="388" width="180" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="825" y="404" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">Домінування 60%+ світового</text>
  <text x="825" y="418" font-size="10" fill="#c0392b" text-anchor="middle">ринку роботів</text>
</svg>
