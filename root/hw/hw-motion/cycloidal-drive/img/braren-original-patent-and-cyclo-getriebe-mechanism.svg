<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-d2" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-b2" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-r2" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-g2" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінематична схема патенту Лоренца Брарена (Cyclo Getriebe, 1926–1931)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Ексцентриковий вал, кулькопідшипник, епітрохоїдний диск і нерухомий пальцевий вінець корпусу</text>

  <!-- LEFT PANEL: Patent Schematic Diagram -->
  <rect x="30" y="75" width="435" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="50" y="92" width="395" height="30" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="112" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Будова механізму Cyclo Getriebebau</text>

  <!-- Mechanism drawing centered at (247, 240) -->
  <!-- Outer Fixed Ring (Stator with pins) -->
  <circle cx="247" cy="240" r="115" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- 12 Stator Pins around ring -->
  <!-- We place 12 circular pins around radius 115 -->
  <!-- Pin circles: r=8 -->
  <circle cx="247" cy="125" r="8" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="304" cy="140" r="8" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="346" cy="182" r="8" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="362" cy="240" r="8" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="346" cy="298" r="8" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="304" cy="340" r="8" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="247" cy="355" r="8" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="190" cy="340" r="8" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="148" cy="298" r="8" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="132" cy="240" r="8" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="148" cy="182" r="8" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="190" cy="140" r="8" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Cycloid Disc (offset by eccentricity e=8 upwards to (247, 232)) -->
  <circle cx="247" cy="232" r="92" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>

  <!-- Eccentric bearing outer ring -->
  <circle cx="247" cy="232" r="40" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <!-- Central input shaft with eccentricity -->
  <circle cx="247" cy="240" r="18" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <circle cx="247" cy="240" r="3.5" fill="#c0392b"/>
  <circle cx="247" cy="232" r="3.5" fill="#2457d6"/>

  <!-- Eccentricity dimension line -->
  <line x1="220" y1="240" x2="220" y2="232" stroke="#c0392b" stroke-width="1.5"/>
  <text x="180" y="238" font-size="11" font-weight="bold" fill="#c0392b">e (ексцентр)</text>

  <!-- Labels on schematic -->
  <text x="60" y="140" font-size="11" font-weight="bold" fill="#1a1a1a">Пальці вінця</text>
  <text x="350" y="140" font-size="11" font-weight="bold" fill="#27ae60">Циклоїдний диск</text>
  <text x="300" y="275" font-size="11" font-weight="bold" fill="#2457d6">Підшипник</text>
  <text x="247" y="380" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Нерухомий корпус (stator ring)</text>

  <!-- Bottom note -->
  <rect x="50" y="395" width="395" height="32" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="415" font-size="11" fill="#1a1a1a" text-anchor="middle">Патент DRP № 512607 (1926) — планетарне кочення без зубів</text>


  <!-- RIGHT PANEL: Kinematic Principle & Formula -->
  <rect x="495" y="75" width="435" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="515" y="92" width="395" height="30" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="112" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Кінематика редукції та пальцевого виходу</text>

  <!-- Component Card 1: Input & Eccentric -->
  <rect x="515" y="132" width="395" height="64" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="530" y="152" font-size="13" font-weight="bold" fill="#c0392b">1. Вхідний вал з ексцентриком (Input Cam)</text>
  <text x="530" y="172" font-size="12" fill="#6b7280">Обертається з високою швидкістю n_in (від електродвигуна)</text>
  <text x="530" y="188" font-size="12" fill="#2457d6">Задає орбітальний рух циклоїдного диска з радіусом e</text>

  <!-- Component Card 2: Meshing Ratio Formula -->
  <rect x="515" y="206" width="395" height="74" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="530" y="226" font-size="13" font-weight="bold" fill="#27ae60">2. Передавальне відношення одного ступеня</text>
  <text x="530" y="248" font-size="14" font-weight="bold" fill="#1a1a1a">i = (Z_pins - Z_lobes) / Z_lobes = 1 / Z_lobes</text>
  <text x="530" y="270" font-size="12" fill="#6b7280">При Z_pins = Z_lobes + 1 диск повертається на 1 зуб за оберт вала</text>

  <!-- Component Card 3: Output Pin Coupling -->
  <rect x="515" y="290" width="395" height="64" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="530" y="310" font-size="13" font-weight="bold" fill="#1a1a1a">3. Вихідний механізм паралельних пальців</text>
  <text x="530" y="330" font-size="12" fill="#6b7280">Пальці вихідного фланця входять у збільшені отвори диска</text>
  <text x="530" y="346" font-size="12" fill="#27ae60">Діаметр отвору D_hole = d_pin + 2·e; знімає чисте обертання</text>

  <!-- Bottom note right -->
  <rect x="515" y="364" width="395" height="62" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="530" y="386" font-size="12" font-weight="bold" fill="#2457d6">• Редукція від 11:1 до 87:1 в одному ультракомпактному ступені</text>
  <text x="530" y="408" font-size="12" fill="#1a1a1a">• Ліцензія Sumitomo (1930-ті) зробила привід світовим стандартом</text>
</svg>
