<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-m1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-b1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-r1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="24" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Генерація епітрохоїди та побудова еквідистанти профілю</text>
  <text x="480" y="44" text-anchor="middle" font-size="13" fill="#6b7280">Твірна точка утворює епітрохоїду, а робочий профіль диска є еквідистантою, зміщеною на радіус ролика</text>

  <!-- LEFT PANEL: Rolling Circle & Epitrochoid -->
  <rect x="25" y="58" width="445" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="40" y="68" width="415" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">1. Кочення твірного кола та епітрохоїда</text>

  <!-- Fixed Base Circle Arc -->
  <path d="M 135,300 A 120 120 0 0 1 359,300" fill="none" stroke="#6b7280" stroke-width="2"/>
  <text x="247" y="325" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">Нерухоме базове коло (R_base)</text>

  <!-- Rolling Generation Circle -->
  <circle cx="247" cy="180" r="40" fill="white" stroke="#2457d6" stroke-width="2"/>
  <circle cx="247" cy="180" r="3" fill="#2457d6"/>
  <text x="247" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">r_gen</text>

  <!-- Contact Point P -->
  <circle cx="247" cy="220" r="4" fill="#1a1a1a"/>
  <text x="257" y="224" text-anchor="start" font-size="11" font-weight="bold" fill="#1a1a1a">Полюс кочення P</text>

  <!-- Eccentric Tracing Point M -->
  <line x1="247" y1="180" x2="275" y2="155" stroke="#c0392b" stroke-width="2"/>
  <circle cx="275" cy="155" r="5" fill="#c0392b"/>
  <text x="285" y="152" text-anchor="start" font-size="11" font-weight="bold" fill="#c0392b">Точка M (ексцентриситет e)</text>

  <!-- Normal Line -->
  <line x1="220" y1="285" x2="300" y2="95" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="305" y="105" text-anchor="start" font-size="11" font-weight="bold" fill="#1a1a1a">Нормаль n</text>

  <!-- Epitrochoid Path -->
  <path d="M 120,220 Q 180,110 275,155 Q 350,195 380,240" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="140" y="135" text-anchor="start" font-size="11" font-weight="bold" fill="#c0392b">Траєкторія епітрохоїди</text>

  <!-- Left Bottom Summary -->
  <rect x="35" y="342" width="425" height="88" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="360" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Кінематика створення форми:</text>
  <text x="45" y="378" text-anchor="start" font-size="11" fill="#1a1a1a">• Коло радіуса r_gen котиться без ковзання по базовому колу R_base</text>
  <text x="45" y="396" text-anchor="start" font-size="11" fill="#1a1a1a">• Точка M на відстані e від центра описує теоретичну епітрохоїду</text>
  <text x="45" y="414" text-anchor="start" font-size="11" fill="#6b7280">• Нормаль до кривої завжди проходить крізь миттєвий полюс кочення P</text>


  <!-- RIGHT PANEL: Equidistant Offset -->
  <rect x="490" y="58" width="445" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="505" y="68" width="415" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="712" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">2. Еквідистантне зміщення на радіус ролика</text>

  <!-- Theoretical Epitrochoid -->
  <path d="M 540,240 Q 620,120 712,160 Q 800,200 880,240" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="610" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Теоретична епітрохоїда</text>

  <!-- Roller Pin 1 -->
  <circle cx="620" cy="160" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="620" cy="160" r="3" fill="#d97706"/>

  <!-- Roller Pin 2 -->
  <circle cx="712" cy="160" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="712" cy="160" r="3" fill="#d97706"/>
  <!-- Normal and offset vector -->
  <line x1="712" y1="160" x2="728" y2="178" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-b1)"/>
  <text x="735" y="175" text-anchor="start" font-size="11" font-weight="bold" fill="#2457d6">Зміщення r_pin</text>

  <!-- Roller Pin 3 -->
  <circle cx="800" cy="185" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="800" cy="185" r="3" fill="#d97706"/>
  <text x="830" y="175" text-anchor="start" font-size="11" font-weight="bold" fill="#d97706">Цівковий ролик</text>

  <!-- Equidistant Profile -->
  <path d="M 535,264 Q 625,144 728,178 Q 805,215 885,264" fill="none" stroke="#27ae60" stroke-width="3"/>
  <text x="712" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Робоча еквідистанта (профіль диска)</text>

  <!-- Dimension line for offset -->
  <line x1="688" y1="280" x2="736" y2="280" stroke="#d97706" stroke-width="1.5"/>
  <text x="712" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#d97706">Діаметр ролика d_pin = 2 * r_pin</text>

  <!-- Right Bottom Summary -->
  <rect x="500" y="342" width="425" height="88" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="510" y="360" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Геометрія спряження зубчастої пари:</text>
  <text x="510" y="378" text-anchor="start" font-size="11" fill="#1a1a1a">• Реальний циклоїдний зуб відступає від епітрохоїди на нормальний радіус r_pin</text>
  <text x="510" y="396" text-anchor="start" font-size="11" fill="#1a1a1a">• Завдяки еквідистанті ролик контактує з диском по гладкій лінії кочення</text>
  <text x="510" y="414" text-anchor="start" font-size="11" fill="#6b7280">• Одночасно в зачепленні перебуває до 50% усіх роликів вінця</text>
</svg>
