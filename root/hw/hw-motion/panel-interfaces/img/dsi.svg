<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">MIPI-DSI: кілька диференційних пар несуть гігабіти</text>
<rect x="70.0" y="110.0" width="150.0" height="120.0" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="145.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потужний хост</text>
<text x="145.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(SoC із DSI)</text>
<text x="145.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">пакетний протокол</text>
<rect x="560.0" y="110.0" width="150.0" height="120.0" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="635.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Панель</text>
<text x="635.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">телефонна</text>
<text x="635.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">роздільність</text>
<line x1="222.0" y1="129.0" x2="558.0" y2="129.0" stroke="#7c3aed" stroke-width="1.8"/>
<line x1="222.0" y1="135.0" x2="558.0" y2="135.0" stroke="#7c3aed" stroke-width="1.8"/>
<text x="390.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="700">тактова пара</text>
<line x1="222.0" y1="153.0" x2="558.0" y2="153.0" stroke="#2457d6" stroke-width="1.8"/>
<line x1="222.0" y1="159.0" x2="558.0" y2="159.0" stroke="#2457d6" stroke-width="1.8"/>
<text x="390.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">смуга даних 1</text>
<line x1="222.0" y1="177.0" x2="558.0" y2="177.0" stroke="#2457d6" stroke-width="1.8"/>
<line x1="222.0" y1="183.0" x2="558.0" y2="183.0" stroke="#2457d6" stroke-width="1.8"/>
<text x="390.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">смуга даних 2</text>
<line x1="222.0" y1="201.0" x2="558.0" y2="201.0" stroke="#6b7280" stroke-width="1.8"/>
<line x1="222.0" y1="207.0" x2="558.0" y2="207.0" stroke="#6b7280" stroke-width="1.8"/>
<text x="390.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">…до 4 смуг</text>
<text x="390.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="700">кожна смуга — гігабіти за секунду</text>
<text x="380.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Менше дротів за паралельний RGB, а несе набагато більше — завдяки диференційній передачі на дуже високій частоті.</text>
<text x="380.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Відеорежим — панель без памʼяті, хост ллє кадри без упину; командний — панель має GRAM, хост шле лише зміни.</text>
<text x="380.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ціна — складність: пакетний протокол, жорстке розведення пар, і DSI вміють лише потужні МК та системи-на-кристалі.</text>
