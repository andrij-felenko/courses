<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-axis-inv" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-def-inv" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-mass-inv" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принцип фазової інверсії надкритичного ротора</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Зсув фази прогину вала відносно дисбалансу на 180° при переході через резонансну швидкість</text>

  <!-- Left: State A (Subcritical omega << omega_cr) -->
  <rect x="40" y="80" width="270" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="175" y="110" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Підкритичний (omega &lt; omega_cr)</text>
  <text x="175" y="130" font-size="11" fill="#6b7280" text-anchor="middle">Фазовий зсув delta приблизно 0°</text>

  <!-- Vector diagram A -->
  <circle cx="175" cy="230" r="70" fill="none" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="175" cy="230" r="4" fill="#1a1a1a"/>
  <text x="155" y="245" font-size="11" fill="#1a1a1a">Вісь O</text>

  <!-- Deflection and eccentricity in same direction -->
  <line x1="175" y1="230" x2="225" y2="230" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-def-inv)"/>
  <text x="200" y="220" font-size="11" font-weight="bold" fill="#2457d6">Прогин z</text>

  <line x1="225" y1="230" x2="265" y2="230" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-mass-inv)"/>
  <text x="245" y="250" font-size="11" font-weight="bold" fill="#c0392b">Дисбаланс e</text>

  <rect x="50" y="325" width="250" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="348" font-size="11" font-weight="bold" fill="#c0392b">Вал прогинається у бік дисбалансу:</text>
  <text x="60" y="368" font-size="11" fill="#1a1a1a">• Відцентрова сила підсилює вигин</text>
  <text x="60" y="386" font-size="11" fill="#1a1a1a">• Балансир тут НЕ працює (розхитує)</text>

  <!-- Middle: State B (Supercritical omega >> omega_cr) -->
  <rect x="325" y="80" width="270" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="460" y="110" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Надкритичний (omega &gt; omega_cr)</text>
  <text x="460" y="130" font-size="11" fill="#6b7280" text-anchor="middle">Фазовий зсув delta приблизно 180°</text>

  <!-- Vector diagram B -->
  <circle cx="460" cy="230" r="70" fill="none" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="460" cy="230" r="4" fill="#1a1a1a"/>
  <text x="440" y="245" font-size="11" fill="#1a1a1a">Вісь O</text>

  <!-- Deflection and eccentricity in OPPOSITE direction -->
  <line x1="460" y1="230" x2="400" y2="230" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-def-inv)"/>
  <text x="415" y="220" font-size="11" font-weight="bold" fill="#2457d6">Прогин z</text>

  <line x1="460" y1="230" x2="520" y2="230" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-mass-inv)"/>
  <text x="475" y="220" font-size="11" font-weight="bold" fill="#c0392b">Дисбаланс e</text>

  <rect x="335" y="325" width="250" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="345" y="348" font-size="11" font-weight="bold" fill="#27ae60">Явище самоцентрування ротора:</text>
  <text x="345" y="368" font-size="11" fill="#1a1a1a">• Вал вигинається проти важкої точки</text>
  <text x="345" y="386" font-size="11" fill="#27ae60">• Центр мас прагне сісти на вісь O</text>

  <!-- Right: Theory & Formula Panel -->
  <rect x="610" y="80" width="310" height="345" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="765" y="110" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Закон зсуву фази (Де Лаваль)</text>

  <rect x="625" y="130" width="280" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="765" y="152" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Формула фазового зсуву:</text>
  <text x="765" y="174" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">tg(delta) = 2*zeta*eta / (1 - eta^2)</text>
  <text x="765" y="196" font-size="11" fill="#6b7280" text-anchor="middle">де eta = omega / omega_n, zeta — демпфування</text>

  <rect x="625" y="225" width="280" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="765" y="247" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Чому автобалансир діє:</text>
  <text x="765" y="268" font-size="11" fill="#1a1a1a" text-anchor="middle">Кульки вільно котяться по канавці.</text>
  <text x="765" y="286" font-size="11" fill="#1a1a1a" text-anchor="middle">Коли геометричний центр зміщений ліворуч,</text>
  <text x="765" y="304" font-size="11" fill="#27ae60" text-anchor="middle">найвіддаленіша точка доріжки — проти e!</text>

  <rect x="625" y="330" width="280" height="80" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="765" y="352" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Критична умова працездатності:</text>
  <text x="765" y="372" font-size="11" fill="#1a1a1a" text-anchor="middle">Балансир умикається ЛИШЕ при</text>
  <text x="765" y="390" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">omega &gt; sqrt(2) * omega_n</text>
</svg>
