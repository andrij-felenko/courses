<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-force-bal" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green-bal" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Радіальний переріз та силова схема кулькового автобалансира</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Тороїдальна доріжка, демпфувальна рідина та самопозиціювання кульок у протифазу дисбалансу</text>

  <!-- Left: Cross-section Area -->
  <rect x="40" y="80" width="550" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Outer Ring Race -->
  <circle cx="300" cy="250" r="140" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <!-- Inner Race Boundary -->
  <circle cx="300" cy="250" r="100" fill="white" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Rotor Shaft Center -->
  <circle cx="300" cy="250" r="28" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="300" cy="250" r="3" fill="#1a1a1a"/>
  <text x="300" y="242" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вісь O</text>

  <!-- Unbalance Mass on the Right -->
  <circle cx="415" cy="250" r="14" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <line x1="300" y1="250" x2="400" y2="250" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-force-bal)"/>
  <text x="450" y="245" font-size="11" font-weight="bold" fill="#c0392b">Дисбаланс m_u</text>
  <text x="450" y="260" font-size="10" fill="#6b7280">(ексцентриситет e)</text>

  <!-- Counter-phase Balancing Balls on the Left -->
  <!-- Ball 1 (Top Left) -->
  <circle cx="210" cy="180" r="16" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <line x1="300" y1="250" x2="218" y2="186" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green-bal)"/>
  <text x="100" y="155" font-size="11" font-weight="bold" fill="#27ae60">Кулька 1 (m_b)</text>

  <!-- Ball 2 (Bottom Left) -->
  <circle cx="210" cy="320" r="16" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <line x1="300" y1="250" x2="218" y2="314" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green-bal)"/>
  <text x="100" y="355" font-size="11" font-weight="bold" fill="#27ae60">Кулька 2 (m_b)</text>

  <!-- Damping oil label -->
  <text x="300" y="130" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Демпфувальна в'язка олива в каналі</text>

  <!-- Right: Technical Details Panel -->
  <rect x="610" y="80" width="310" height="345" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="765" y="110" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Фізичний принцип балансування</text>

  <rect x="625" y="130" width="280" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="765" y="152" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Умова повної компенсації:</text>
  <text x="765" y="174" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">m_u * e + sum(m_b * r_b * e_i) = 0</text>
  <text x="765" y="196" font-size="11" fill="#6b7280" text-anchor="middle">Сумарний дисбаланс ротора дорівнює нулю</text>

  <rect x="625" y="225" width="280" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="765" y="247" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Автоматичне встановлення:</text>
  <text x="765" y="268" font-size="11" fill="#1a1a1a" text-anchor="middle">У надкритичній зоні (omega &gt; omega_cr)</text>
  <text x="765" y="286" font-size="11" fill="#27ae60" text-anchor="middle">відцентрові сили скидають кульки в кути,</text>
  <text x="765" y="304" font-size="11" fill="#1a1a1a" text-anchor="middle">що дзеркально компенсують ексцентриситет</text>

  <rect x="625" y="330" width="280" height="80" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="765" y="352" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Роль гідравлічного демпфування:</text>
  <text x="765" y="372" font-size="11" fill="#1a1a1a" text-anchor="middle">• Запобігає зіткненню кульок між собою</text>
  <text x="765" y="390" font-size="11" fill="#6b7280" text-anchor="middle">• Швидко гасить перехідні автоколивання</text>
</svg>
