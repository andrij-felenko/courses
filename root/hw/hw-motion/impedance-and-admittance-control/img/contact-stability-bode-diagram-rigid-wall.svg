<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-axis-4" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Частотний аналіз стійкості імпедансу при контакті зі стіною</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Діаграма Боде розімкненого контуру та оцінка запасу стійкості за фазою</text>

  <!-- Left: Bode Plot Area -->
  <rect x="40" y="80" width="550" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Magnitude Track (Top) -->
  <text x="60" y="105" font-size="13" font-weight="bold" fill="#2457d6">Амплітуда |L(j*omega)| [дБ]</text>
  <line x1="100" y1="180" x2="550" y2="180" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis-4)"/>
  <line x1="100" y1="210" x2="100" y2="115" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="540" y="195" font-size="11" fill="#1a1a1a">omega</text>
  <!-- 0 dB reference line -->
  <line x1="100" y1="150" x2="530" y2="150" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="55" y="154" font-size="11" fill="#6b7280">0 дБ</text>
  <!-- Magnitude curve -->
  <path d="M 100,120 Q 200,125 280,150 T 480,205" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="295" y="138" font-size="11" font-weight="bold" fill="#2457d6">omega_c (зріз)</text>

  <!-- Phase Track (Bottom) -->
  <text x="60" y="240" font-size="13" font-weight="bold" fill="#27ae60">Фаза arg(L(j*omega)) [град]</text>
  <line x1="100" y1="390" x2="550" y2="390" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis-4)"/>
  <line x1="100" y1="390" x2="100" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="540" y="405" font-size="11" fill="#1a1a1a">omega</text>
  <!-- -180 deg critical line -->
  <line x1="100" y1="370" x2="530" y2="370" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="55" y="374" font-size="11" fill="#c0392b">-180°</text>

  <!-- Phase curve -->
  <path d="M 100,260 Q 200,270 280,320 T 480,380" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Vertical alignment line at crossover frequency -->
  <line x1="280" y1="150" x2="280" y2="370" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Phase Margin PM indicator (placed safely to the left of vertical line) -->
  <line x1="280" y1="320" x2="280" y2="370" stroke="#27ae60" stroke-width="3"/>
  <rect x="140" y="335" width="130" height="26" rx="4" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="205" y="352" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Запас PM = 45°</text>

  <!-- Right: Stability Criteria Panel -->
  <rect x="610" y="80" width="310" height="345" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="765" y="110" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Критерій стійкості</text>

  <rect x="625" y="130" width="280" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="765" y="152" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Запас за фазою (Phase Margin):</text>
  <text x="765" y="174" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">PM = 180° + phi(omega_c) &gt;= 30°</text>
  <text x="765" y="196" font-size="11" fill="#6b7280" text-anchor="middle">Гарантує демпфування коливань</text>

  <rect x="625" y="230" width="280" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="765" y="252" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Небезпека нестійкості:</text>
  <text x="765" y="274" font-size="11" fill="#1a1a1a" text-anchor="middle">Якщо PM &lt; 0, фазовий зсув сягає -180°</text>
  <text x="765" y="292" font-size="11" fill="#c0392b" text-anchor="middle">Виникає високочастотний брязкіт</text>
  <text x="765" y="308" font-size="11" fill="#6b7280" text-anchor="middle">Робот багаторазово відскакує від стіни</text>

  <rect x="625" y="340" width="280" height="70" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="765" y="362" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Цифрова умова пасивності:</text>
  <text x="765" y="385" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B &gt; 0,5 * K * T_sample</text>
</svg>
