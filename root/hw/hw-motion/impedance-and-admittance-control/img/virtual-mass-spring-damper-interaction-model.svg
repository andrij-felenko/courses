<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-force" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-axis" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Віртуальна модель механічного імпедансу другого порядку</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Контролер формує динамічний відгук суглоба як еквівалентну систему маса-демпфер-пружина</text>

  <!-- Left: Mechanical Schematic Area -->
  <rect x="40" y="80" width="540" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Fixed base wall (hatched) -->
  <rect x="60" y="110" width="20" height="260" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="60" y1="125" x2="50" y2="135" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="60" y1="155" x2="50" y2="165" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="60" y1="185" x2="50" y2="195" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="60" y1="215" x2="50" y2="225" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="60" y1="245" x2="50" y2="255" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="60" y1="275" x2="50" y2="285" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="60" y1="305" x2="50" y2="315" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="60" y1="335" x2="50" y2="345" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Spring K -->
  <path d="M 80,180 L 115,180 L 125,160 L 140,200 L 155,160 L 170,200 L 185,160 L 200,200 L 210,180 L 250,180" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <rect x="135" y="125" width="60" height="26" rx="4" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="165" y="142" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">K</text>

  <!-- Damper B -->
  <line x1="80" y1="290" x2="140" y2="290" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Damper cylinder -->
  <path d="M 140,265 L 190,265 L 190,315 L 140,315" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Damper piston -->
  <line x1="165" y1="270" x2="165" y2="310" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="165" y1="290" x2="250" y2="290" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="135" y="325" width="60" height="26" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1"/>
  <text x="165" y="342" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">B</text>

  <!-- Virtual Mass M -->
  <rect x="250" y="140" width="130" height="190" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="315" y="225" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Маса M</text>
  <text x="315" y="248" font-size="12" fill="#6b7280" text-anchor="middle">Робочий орган</text>

  <!-- External Force F_ext pushing Mass -->
  <line x1="490" y1="235" x2="390" y2="235" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-force)"/>
  <text x="440" y="220" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">F_ext</text>

  <!-- Displacement axis below -->
  <line x1="250" y1="365" x2="480" y2="365" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <line x1="250" y1="355" x2="250" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="250" y="392" font-size="11" fill="#6b7280" text-anchor="middle">x_d (бажана)</text>
  <text x="470" y="392" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">x(t)</text>

  <!-- Right: Equations and Theory Panel -->
  <rect x="600" y="80" width="320" height="345" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="760" y="110" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Рівняння імпедансу</text>

  <rect x="615" y="130" width="290" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="760" y="155" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Динамічний баланс сил:</text>
  <text x="760" y="180" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">M*ddx_e + B*dx_e + K*x_e = F_ext</text>
  <text x="760" y="200" font-size="11" fill="#6b7280" text-anchor="middle">де x_e = x_d - x — похибка зміщення</text>

  <rect x="615" y="230" width="290" height="175" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="760" y="255" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Фізичний зміст коефіцієнтів:</text>
  <text x="630" y="280" font-size="12" fill="#1a1a1a">• K [Н/м] — віртуальна пружність</text>
  <text x="630" y="298" font-size="11" fill="#6b7280">  визначає відновлювальне зусилля</text>
  <text x="630" y="322" font-size="12" fill="#1a1a1a">• B [Н·с/м] — в'язке демпфування</text>
  <text x="630" y="340" font-size="11" fill="#6b7280">  гасить відскоки та коливання</text>
  <text x="630" y="364" font-size="12" fill="#1a1a1a">• M [кг] — віртуальна інерція</text>
  <text x="630" y="382" font-size="11" fill="#6b7280">  пом'якшує пікову силу удару</text>
</svg>
