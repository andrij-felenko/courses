<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Робота тяги на розтяг і стиск: критична сила вигину Ейлера</text>
<rect x="25.0" y="55.0" width="340.0" height="160.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="195.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Розтяг тяги (Tension) — ідеальна стабільність</text>
<circle cx="65.0" cy="130.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="325.0" cy="130.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="71.0" y1="130.0" x2="319.0" y2="130.0" stroke="#27ae60" stroke-width="4.0"/>
<line x1="65.0" y1="130.0" x2="40.0" y2="130.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="325.0" y1="130.0" x2="350.0" y2="130.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="195.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Тяга самоцентрується під силою F</text>
<text x="195.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Межа міцності визначається площею перерізу σ = F / S</text>
<rect x="395.0" y="55.0" width="340.0" height="160.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.4"/>
<text x="565.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Стиск (Compression) — втрата стійкості</text>
<circle cx="435.0" cy="130.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="695.0" cy="130.0" r="6.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="410.0" y1="130.0" x2="435.0" y2="130.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="720.0" y1="130.0" x2="695.0" y2="130.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 441,130 Q 565,92 689,130" fill="none" stroke="#c0392b" stroke-width="4"/>
<line x1="565.0" y1="130.0" x2="565.0" y2="111.0" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="2,2"/>
<text x="575.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">f_прогин</text>
<text x="565.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Критична сила Ейлера: P_cr = π²·E·I / L²</text>
<text x="565.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Тонка довга тяга втрачає хід керма при штовханні</text>
<rect x="25.0" y="230.0" width="710.0" height="170.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="380.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конструктивні рішення для високої поздовжньої жорсткості</text>
<text x="140.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Суцільний сталевий дріт</text>
<text x="140.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">d = 1.2–1.5 мм</text>
<text x="140.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">I = π·d⁴ / 64</text>
<text x="140.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Гнеться на довжині &gt;150 мм</text>
<text x="140.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Тільки для мікромоделей</text>
<text x="380.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">2. Карбонова трубка (CFRP)</text>
<text x="380.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">D = 4 мм, d = 2.5 мм</text>
<text x="380.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">I = π·(D⁴ − d⁴) / 64</text>
<text x="380.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Момент інерції I в 40+ разів вищий</text>
<text x="380.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Мінімальна маса, нульовий прогин</text>
<text x="620.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Боуден з напрямними</text>
<text x="620.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Сталь у фторопластовій трубці</text>
<text x="620.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">Опори кожні 100 мм -&gt; L_eff = L/N</text>
<text x="620.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">P_cr зростає пропорційно N²</text>
<text x="620.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Дозволяє вигин траси в фюзеляжі</text>
<line x1="260.0" y1="268.0" x2="260.0" y2="385.0" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="500.0" y1="268.0" x2="500.0" y2="385.0" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="3,3"/>
</svg>