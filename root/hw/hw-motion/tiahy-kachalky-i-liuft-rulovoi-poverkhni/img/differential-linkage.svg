<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Симетричний хід проти елеронного диференціалу</text>
<rect x="25.0" y="55.0" width="340.0" height="305.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="195.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Симетрична кінематика (90° до тяги)</text>
<circle cx="195.0" cy="175.0" r="7.0" fill="#cbd5e1" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="195.0" y1="175.0" x2="195.0" y2="120.0" stroke="#1a1a1a" stroke-width="3.5"/>
<circle cx="195.0" cy="120.0" r="4.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="195.0" y1="175.0" x2="159.6" y2="132.9" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="3,3"/>
<line x1="195.0" y1="175.0" x2="230.4" y2="132.9" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="3,3"/>
<text x="195.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Лінійний хід тяги: Δx_вгору = Δx_вниз</text>
<text x="195.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Кут елерона вгору (+15°) = Кут вниз (-15°)</text>
<text x="195.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Створює несприятливе рискання (Adverse Yaw)</text>
<text x="195.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">через різницю індуктивного опору крил</text>
<rect x="395.0" y="55.0" width="340.0" height="305.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="565.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механічний диференціал (зсув нуля γ)</text>
<circle cx="565.0" cy="175.0" r="7.0" fill="#cbd5e1" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="565.0" y1="175.0" x2="592.5" y2="127.4" stroke="#1a1a1a" stroke-width="3.5"/>
<circle cx="592.5" cy="127.4" r="4.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="565.0" y1="175.0" x2="616.7" y2="156.2" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="3,3"/>
<line x1="565.0" y1="175.0" x2="555.4" y2="120.8" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="3,3"/>
<text x="565.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Лінійний хід: Δx_вгору &gt;&gt; Δx_вниз</text>
<text x="565.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Кут елерона вгору (+20°) &gt; Кут вниз (-10°)</text>
<text x="565.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">Компенсує рискання: опір опущеного</text>
<text x="565.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">елерона зменшено, літак входить у віраж чисто</text>
</svg>