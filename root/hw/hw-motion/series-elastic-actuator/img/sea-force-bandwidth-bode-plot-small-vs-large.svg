<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <defs>
    <marker id="arrBode" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>

  <!-- Main Title -->
  <text x="30" y="32" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Частотні характеристики контуру зусилля SEA (Діаграма Боде)</text>
  <text x="30" y="52" font-family="sans-serif" font-size="12" fill="#475569">Порівняння смуги пропускання малого сигналу та обмеження насичення швидкості для великих амплітуд</text>

  <!-- Magnitude Plot Box (ЛАЧХ) -->
  <rect x="40" y="70" width="490" height="165" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="55" y="90" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1">Амплітудна характеристика (ЛАЧХ), |T(jω)| [дБ]</text>

  <!-- Magnitude Grid Lines -->
  <!-- 0 dB line -->
  <line x1="90" y1="120" x2="510" y2="120" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="55" y="124" font-family="sans-serif" font-size="10" fill="#64748b">0 дБ</text>
  <!-- -3 dB line -->
  <line x1="90" y1="135" x2="510" y2="135" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="55" y="139" font-family="sans-serif" font-size="10" fill="#94a3b8">-3 дБ</text>
  <!-- -20 dB line -->
  <line x1="90" y1="180" x2="510" y2="180" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="50" y="184" font-family="sans-serif" font-size="10" fill="#94a3b8">-20 дБ</text>
  <!-- -40 dB line -->
  <line x1="90" y1="215" x2="510" y2="215" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="50" y="219" font-family="sans-serif" font-size="10" fill="#94a3b8">-40 дБ</text>

  <!-- Frequency Grid Verticals -->
  <line x1="120" y1="100" x2="120" y2="225" stroke="#e2e8f0" stroke-width="1"/>
  <text x="105" y="234" font-family="sans-serif" font-size="10" fill="#64748b">1 рад/с</text>
  <line x1="220" y1="100" x2="220" y2="225" stroke="#e2e8f0" stroke-width="1"/>
  <text x="200" y="234" font-family="sans-serif" font-size="10" fill="#64748b">10 рад/с</text>
  <line x1="330" y1="100" x2="330" y2="225" stroke="#e2e8f0" stroke-width="1"/>
  <text x="305" y="234" font-family="sans-serif" font-size="10" fill="#64748b">100 рад/с</text>
  <line x1="450" y1="100" x2="450" y2="225" stroke="#e2e8f0" stroke-width="1"/>
  <text x="420" y="234" font-family="sans-serif" font-size="10" fill="#64748b">1000 рад/с</text>

  <!-- Small-signal Magnitude Curve (Blue solid) -->
  <path d="M90,120 L300,120 Q330,114 345,120 T360,135 L480,215" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="360" cy="135" r="3.5" fill="#2563eb"/>
  <text x="368" y="132" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2563eb">ω_sb ≈ 80 рад/с</text>

  <!-- Large-signal Magnitude Curve (Red dashed) -->
  <path d="M90,120 L220,120 Q235,122 245,135 L380,215" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5,3"/>
  <circle cx="245" cy="135" r="3.5" fill="#dc2626"/>
  <text x="210" y="152" font-family="sans-serif" font-size="10" font-weight="bold" fill="#dc2626">ω_lb ≈ 15 рад/с</text>

  <!-- Phase Plot Box (ЛФЧХ) -->
  <rect x="40" y="250" width="490" height="180" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="55" y="270" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1">Фазова характеристика (ЛФЧХ), ∠T(jω) [град]</text>

  <!-- Phase Grid Lines -->
  <!-- 0 deg line -->
  <line x1="90" y1="285" x2="510" y2="285" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="65" y="289" font-family="sans-serif" font-size="10" fill="#64748b">0°</text>
  <!-- -45 deg line -->
  <line x1="90" y1="320" x2="510" y2="320" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="55" y="324" font-family="sans-serif" font-size="10" fill="#94a3b8">-45°</text>
  <!-- -90 deg line -->
  <line x1="90" y1="355" x2="510" y2="355" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="55" y="359" font-family="sans-serif" font-size="10" fill="#94a3b8">-90°</text>
  <!-- -180 deg line -->
  <line x1="90" y1="410" x2="510" y2="410" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="50" y="414" font-family="sans-serif" font-size="10" fill="#94a3b8">-180°</text>

  <!-- Frequency Grid Verticals (Phase) -->
  <line x1="120" y1="280" x2="120" y2="415" stroke="#e2e8f0" stroke-width="1"/>
  <text x="105" y="426" font-family="sans-serif" font-size="10" fill="#64748b">1 рад/с</text>
  <line x1="220" y1="280" x2="220" y2="415" stroke="#e2e8f0" stroke-width="1"/>
  <text x="200" y="426" font-family="sans-serif" font-size="10" fill="#64748b">10 рад/с</text>
  <line x1="330" y1="280" x2="330" y2="415" stroke="#e2e8f0" stroke-width="1"/>
  <text x="305" y="426" font-family="sans-serif" font-size="10" fill="#64748b">100 рад/с</text>
  <line x1="450" y1="280" x2="450" y2="415" stroke="#e2e8f0" stroke-width="1"/>
  <text x="420" y="426" font-family="sans-serif" font-size="10" fill="#64748b">1000 рад/с</text>

  <!-- Small-signal Phase Curve -->
  <path d="M90,285 L280,285 Q330,290 350,355 T440,410" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <!-- Large-signal Phase Curve -->
  <path d="M90,285 L200,285 Q230,295 250,355 T320,410" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5,3"/>

  <!-- Right Side Explanation Card -->
  <rect x="550" y="70" width="380" height="360" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="550" y="70" width="380" height="32" rx="8" fill="#f1f5f9"/>
  <text x="565" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Фізична природа двох смуг пропускання</text>

  <!-- Section 1: Small Signal -->
  <rect x="565" y="112" width="12" height="12" rx="2" fill="#2563eb"/>
  <text x="585" y="123" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1e40af">1. Смуга малого зусилля (Small-Signal):</text>
  <text x="565" y="142" font-family="sans-serif" font-size="11" fill="#334155">• Визначається лінійною резонансною динамікою</text>
  <text x="565" y="159" font-family="sans-serif" font-size="11" fill="#334155">• Формула резонансу: ω_n = sqrt(k_s / J_L)</text>
  <text x="565" y="176" font-family="sans-serif" font-size="11" fill="#334155">• Обмежена затримкою ПІД-контуру та шумом датчиків</text>

  <!-- Section 2: Large Signal -->
  <rect x="565" y="200" width="12" height="12" rx="2" fill="#dc2626"/>
  <text x="585" y="211" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b">2. Смуга великого зусилля (Large-Signal):</text>
  <text x="565" y="230" font-family="sans-serif" font-size="11" fill="#334155">• Зумовлена обмеженням граничної швидкості двигуна θ̇_max</text>
  <text x="565" y="247" font-family="sans-serif" font-size="11" fill="#334155">• Щоб коливати зусилля F = F_0·sin(ωt), потрібна швидкість:</text>
  <text x="585" y="264" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">θ̇_req(t) = (F_0 · ω / k_s) · cos(ωt) ≤ θ̇_max</text>
  <text x="565" y="282" font-family="sans-serif" font-size="11" fill="#334155">• Гранична частота зрізу: ω_lb = (k_s · θ̇_max) / F_0</text>

  <!-- Section 3: Engineering Trade-off -->
  <text x="565" y="312" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d97706">3. Інженерний компроміс вибору жорсткості k_s:</text>
  <text x="565" y="332" font-family="sans-serif" font-size="11" fill="#334155">• М'яка пружина (мале k_s): відмінне демпфування ударів,</text>
  <text x="565" y="349" font-family="sans-serif" font-size="11" fill="#334155">  чутливість до малих сил, але катастрофічно низьке ω_lb</text>
  <text x="565" y="369" font-family="sans-serif" font-size="11" fill="#334155">• Жорстка пружина (велике k_s): ширша смуга великих зусиль,</text>
  <text x="565" y="386" font-family="sans-serif" font-size="11" fill="#334155">  проте висока вразливість до руйнівних ударних імпульсів</text>

  <!-- Bottom Legend -->
  <line x1="565" y1="412" x2="595" y2="412" stroke="#2563eb" stroke-width="2.5"/>
  <text x="605" y="416" font-family="sans-serif" font-size="10" fill="#334155">Малий сигнал (10% F_max)</text>
  <line x1="755" y1="412" x2="785" y2="412" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="795" y="416" font-family="sans-serif" font-size="10" fill="#334155">Великий сигнал (100% F_max)</text>
</svg>
