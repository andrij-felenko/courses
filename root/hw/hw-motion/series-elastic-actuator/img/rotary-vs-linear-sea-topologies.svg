<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Топології актуаторів SEA: лінійна та ротаційна конфігурації</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Лінійна схема підходить для телескопічних ланок; планарний торсійний диск — для шарнірів</text>

  <!-- Left Panel: Linear SEA -->
  <rect x="30" y="75" width="435" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="45" y="90" width="405" height="30" rx="4" fill="#eaf0fd"/>
  <text x="247" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Лінійний актуатор SEA (ШВП + пружина)</text>

  <!-- Motor & Ball Screw -->
  <rect x="55" y="160" width="80" height="50" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="95" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Двигун</text>

  <!-- Screw rod -->
  <rect x="135" y="180" width="110" height="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="190" y="172" text-anchor="middle" font-size="12" fill="#6b7280">Гвинт ШВП</text>

  <!-- Nut and Spring -->
  <rect x="245" y="165" width="35" height="40" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="262" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Гайка</text>

  <!-- Compression spring -->
  <path d="M 280,185 L 290,170 L 300,200 L 310,170 L 320,200 L 330,170 L 340,185" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="310" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Пружина k_lin</text>

  <!-- Output Rod -->
  <line x1="340" y1="185" x2="415" y2="185" stroke="#1a1a1a" stroke-width="4" marker-end="url(#arr-blue)"/>
  <text x="380" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Шток F_out</text>

  <!-- Info box Left -->
  <rect x="45" y="240" width="405" height="175" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="60" y="265" font-size="12" font-weight="bold" fill="#1a1a1a">Особливості лінійного SEA:</text>
  <text x="60" y="288" font-size="12" fill="#1a1a1a">- Високе тягове зусилля завдяки кроку ШВП (типово 500–3000 Н)</text>
  <text x="60" y="310" font-size="12" fill="#1a1a1a">- Застосування стандартних витих сталевих пружин стиску</text>
  <text x="60" y="332" font-size="12" fill="#1a1a1a">- Вимагає зовнішніх напрямних проти прогину штока</text>
  <text x="60" y="354" font-size="12" fill="#c0392b">- Значний осьовий габарит уздовж робочої кінцівки</text>
  <text x="60" y="376" font-size="12" font-weight="bold" fill="#2457d6">Сфера: ноги важких крокуючих роботів, екзоскелети коліна</text>


  <!-- Right Panel: Rotary SEA -->
  <rect x="495" y="75" width="435" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="510" y="90" width="405" height="30" rx="4" fill="#eaf0fd"/>
  <text x="712" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Ротаційний модуль SEA (дискова пружина)</text>

  <!-- BLDC motor + harmonic drive -->
  <circle cx="590" cy="185" r="38" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="590" cy="185" r="24" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="590" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Мотор+HD</text>

  <!-- Planar Torsion Disc -->
  <circle cx="730" cy="185" r="42" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <circle cx="730" cy="185" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Spokes -->
  <line x1="730" y1="143" x2="730" y2="163" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="730" y1="207" x2="730" y2="227" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="688" y1="185" x2="708" y2="185" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="752" y1="185" x2="772" y2="185" stroke="#2457d6" stroke-width="2.5"/>
  <text x="730" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Торсійний диск</text>

  <!-- Output Flange -->
  <rect x="805" y="165" width="22" height="40" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="855" y="190" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Фланець</text>

  <!-- Info box Right -->
  <rect x="510" y="240" width="405" height="175" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="525" y="265" font-size="12" font-weight="bold" fill="#1a1a1a">Особливості ротаційного SEA:</text>
  <text x="525" y="288" font-size="12" fill="#1a1a1a">- Компактна коаксіальна інтеграція в циліндричний шарнір</text>
  <text x="525" y="310" font-size="12" fill="#1a1a1a">- Повна відсутність люфтів та тертя ковзання в пружній ланці</text>
  <text x="525" y="332" font-size="12" fill="#1a1a1a">- Наскрізний центральний отвір під кабелі керування та живлення</text>
  <text x="525" y="354" font-size="12" fill="#27ae60">- Ідеальна дзеркальна симетрія крутного моменту</text>
  <text x="525" y="376" font-size="12" font-weight="bold" fill="#2457d6">Сфера: суглоби рук коботів (Baxter), гуманоїди (NASA Valkyrie)</text>

</svg>
