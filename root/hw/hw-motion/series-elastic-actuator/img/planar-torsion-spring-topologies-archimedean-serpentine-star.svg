<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>

  <!-- Main Title -->
  <text x="30" y="32" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Конструктивні типи планарних торсійних пружин серійних актуаторів</text>
  <text x="30" y="52" font-family="sans-serif" font-size="12" fill="#475569">Порівняння архітектур гнучких елементів за жорсткістю, радіальним зміщенням та концентраторами</text>

  <!-- Panel 1: Archimedean Spiral (x=30 to 310) -->
  <rect x="30" y="70" width="280" height="365" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="30" y="70" width="280" height="32" rx="8" fill="#e0f2fe"/>
  <text x="45" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0369a1">1. Спіраль Архімеда</text>

  <!-- Graphic 1: Spiral -->
  <rect x="45" y="115" width="250" height="125" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="170" cy="177" r="48" fill="none" stroke="#64748b" stroke-width="3"/>
  <circle cx="170" cy="177" r="14" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <!-- Spiral Arms -->
  <path d="M170,163 C195,162 205,182 210,188 C215,195 210,215 190,222 C170,228 140,215 130,195 C122,175 132,145 160,135" fill="none" stroke="#0284c7" stroke-width="3.5"/>
  <text x="110" y="233" font-family="sans-serif" font-size="10" fill="#0369a1">Асиметричний вигин балки</text>

  <!-- Labels for Panel 1 -->
  <text x="45" y="260" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Характеристики:</text>
  <text x="45" y="278" font-family="sans-serif" font-size="11" fill="#334155">• Найвища піддатливість (низька k_s)</text>
  <text x="45" y="296" font-family="sans-serif" font-size="11" fill="#334155">• Великий робочий хід деформації (до 25°)</text>
  <text x="45" y="314" font-family="sans-serif" font-size="11" fill="#334155">• Компактне одношарове компонування</text>

  <text x="45" y="342" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">Недоліки:</text>
  <text x="45" y="360" font-family="sans-serif" font-size="11" fill="#334155">• Паразитне радіальне биття осі (до 0.3 мм)</text>
  <text x="45" y="378" font-family="sans-serif" font-size="11" fill="#334155">• Нерівномірне навантаження підшипників</text>
  <text x="45" y="396" font-family="sans-serif" font-size="11" fill="#334155">• Швидка втома при знакозмінному крученні</text>

  <!-- Panel 2: S-shaped / Serpentine (x=340 to 620) -->
  <rect x="340" y="70" width="280" height="365" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="340" y="70" width="280" height="32" rx="8" fill="#fef3c7"/>
  <text x="355" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b45309">2. S-подібні балки (Serpentine)</text>

  <!-- Graphic 2: Serpentine flexures -->
  <rect x="355" y="115" width="250" height="125" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="480" cy="177" r="48" fill="none" stroke="#64748b" stroke-width="3"/>
  <circle cx="480" cy="177" r="14" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <!-- Serpentine spokes -->
  <path d="M480,163 C495,155 495,145 480,140 C465,135 465,125 480,129" fill="none" stroke="#d97706" stroke-width="3.5"/>
  <path d="M480,191 C465,199 465,209 480,214 C495,219 495,229 480,225" fill="none" stroke="#d97706" stroke-width="3.5"/>
  <path d="M466,177 C458,162 448,162 443,177 C438,192 428,192 432,177" fill="none" stroke="#d97706" stroke-width="3.5"/>
  <path d="M494,177 C502,192 512,192 517,177 C522,162 532,162 528,177" fill="none" stroke="#d97706" stroke-width="3.5"/>
  <text x="415" y="233" font-family="sans-serif" font-size="10" fill="#b45309">Зигзагоподібні балки згину</text>

  <!-- Labels for Panel 2 -->
  <text x="355" y="260" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Характеристики:</text>
  <text x="355" y="278" font-family="sans-serif" font-size="11" fill="#334155">• Середня крутильна жорсткість (100–300 Нм/рад)</text>
  <text x="355" y="296" font-family="sans-serif" font-size="11" fill="#334155">• Зменшена довжина консолі порівняно зі спіраллю</text>
  <text x="355" y="314" font-family="sans-serif" font-size="11" fill="#334155">• Достатній лінійний діапазон кута (±12°)</text>

  <text x="355" y="342" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">Недоліки:</text>
  <text x="355" y="360" font-family="sans-serif" font-size="11" fill="#334155">• Висока концентрація напружень у колінах S-форми</text>
  <text x="355" y="378" font-family="sans-serif" font-size="11" fill="#334155">• Вимогливість до мінімальних радіусів скруглень</text>
  <text x="355" y="396" font-family="sans-serif" font-size="11" fill="#334155">• Складність прецизійної електроерозійної обробки</text>

  <!-- Panel 3: Multi-spoke Star (x=650 to 930) -->
  <rect x="650" y="70" width="280" height="365" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="650" y="70" width="280" height="32" rx="8" fill="#dcfce7"/>
  <text x="665" y="92" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803d">3. Багатопроменева зірка</text>

  <!-- Graphic 3: Star spokes -->
  <rect x="665" y="115" width="250" height="125" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <circle cx="790" cy="177" r="48" fill="none" stroke="#64748b" stroke-width="3"/>
  <circle cx="790" cy="177" r="15" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
  <!-- 8 Radial spokes with fillets -->
  <line x1="790" y1="129" x2="790" y2="162" stroke="#16a34a" stroke-width="3.5"/>
  <line x1="790" y1="192" x2="790" y2="225" stroke="#16a34a" stroke-width="3.5"/>
  <line x1="742" y1="177" x2="775" y2="177" stroke="#16a34a" stroke-width="3.5"/>
  <line x1="805" y1="177" x2="838" y2="177" stroke="#16a34a" stroke-width="3.5"/>
  <line x1="756" y1="143" x2="779" y2="166" stroke="#16a34a" stroke-width="3"/>
  <line x1="801" y1="188" x2="824" y2="211" stroke="#16a34a" stroke-width="3"/>
  <line x1="756" y1="211" x2="779" y2="188" stroke="#16a34a" stroke-width="3"/>
  <line x1="801" y1="166" x2="824" y2="143" stroke="#16a34a" stroke-width="3"/>
  <text x="710" y="233" font-family="sans-serif" font-size="10" fill="#15803d">Симетричні промені на зсув</text>

  <!-- Labels for Panel 3 -->
  <text x="665" y="260" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Переваги:</text>
  <text x="665" y="278" font-family="sans-serif" font-size="11" fill="#334155">• Абсолютна радіальна симетрія (нульовий дрейф)</text>
  <text x="665" y="296" font-family="sans-serif" font-size="11" fill="#334155">• Величезна жорсткість на вигин та осьові удари</text>
  <text x="665" y="314" font-family="sans-serif" font-size="11" fill="#334155">• Найвища втомна довговічність (&gt;10⁷ циклів)</text>

  <text x="665" y="342" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0369a1">Особливості:</text>
  <text x="665" y="360" font-family="sans-serif" font-size="11" fill="#334155">• Вища жорсткість k_s (потребує енкодера 14–18 біт)</text>
  <text x="665" y="378" font-family="sans-serif" font-size="11" fill="#334155">• Робочий діапазон деформації: ±3°...±8°</text>
  <text x="665" y="396" font-family="sans-serif" font-size="11" fill="#334155">• Стандарт для промислових коботів (Franka, KUKA)</text>
</svg>
