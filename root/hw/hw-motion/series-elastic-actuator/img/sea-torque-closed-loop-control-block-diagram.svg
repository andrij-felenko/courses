<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <defs>
    <marker id="arrCtl" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrFf" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#d97706"/>
    </marker>
    <marker id="arrFb" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>

  <!-- Main Title -->
  <text x="30" y="32" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Блок-схема комбінованого регулятора крутного моменту привода SEA</text>
  <text x="30" y="52" font-family="sans-serif" font-size="12" fill="#475569">Поєднання зворотного зв'язку за зусиллям (ПІД), прямого зв'язку (Feedforward) та фільтра Калмана</text>

  <!-- Reference Input Box -->
  <rect x="25" y="150" width="80" height="50" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="32" y="170" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Завдання</text>
  <text x="32" y="188" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2563eb">τ_des</text>

  <!-- Input line to Summing Junction 1 -->
  <line x1="105" y1="175" x2="138" y2="175" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrCtl)"/>

  <!-- Tap branch from τ_des to Feedforward -->
  <line x1="120" y1="175" x2="120" y2="100" stroke="#d97706" stroke-width="2"/>
  <line x1="120" y1="100" x2="170" y2="100" stroke="#d97706" stroke-width="2" marker-end="url(#arrFf)"/>

  <!-- Summing Junction 1 (Error) -->
  <circle cx="148" cy="175" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="144" y="179" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb">+</text>
  <text x="144" y="196" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">-</text>

  <!-- Error signal to PID -->
  <line x1="158" y1="175" x2="173" y2="175" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrCtl)"/>
  <text x="159" y="168" font-family="sans-serif" font-size="10" fill="#64748b">e</text>

  <!-- Block 1: PID Controller (x=175 to 295, y=140 to 210) -->
  <rect x="175" y="140" width="120" height="70" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="185" y="162" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0369a1">ПІД-регулятор</text>
  <text x="185" y="180" font-family="sans-serif" font-size="10" fill="#0c4a6e">K_p + K_i/s + K_d·s</text>
  <text x="185" y="198" font-family="sans-serif" font-size="10" fill="#0369a1">Анти-вінд-ап (1 кГц)</text>

  <!-- Block 2: Feedforward Controller (Above PID: x=175 to 295, y=75 to 125) -->
  <rect x="175" y="75" width="120" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="185" y="94" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b45309">Прямий зв'язок (FF)</text>
  <text x="185" y="112" font-family="sans-serif" font-size="10" fill="#92400e">J_L·θ̈_des + τ_frict</text>

  <!-- Summing Junction 2 (PID + FF) -->
  <circle cx="340" cy="175" r="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="336" y="179" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb">+</text>
  <text x="336" y="162" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d97706">+</text>

  <line x1="295" y1="175" x2="328" y2="175" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrCtl)"/>
  <line x1="295" y1="100" x2="340" y2="100" stroke="#d97706" stroke-width="2"/>
  <line x1="340" y1="100" x2="340" y2="162" stroke="#d97706" stroke-width="2" marker-end="url(#arrFf)"/>

  <!-- Desired motor torque to FOC -->
  <line x1="350" y1="175" x2="395" y2="175" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrCtl)"/>
  <text x="355" y="168" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2563eb">I_q_ref</text>

  <!-- Block 3: FOC Current Loop (x=395 to 515, y=140 to 210) -->
  <rect x="395" y="140" width="120" height="70" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="405" y="162" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6d28d9">Контур FOC (20 кГц)</text>
  <text x="405" y="180" font-family="sans-serif" font-size="10" fill="#5b21b6">ПІ-регулятор струму</text>
  <text x="405" y="198" font-family="sans-serif" font-size="10" fill="#5b21b6">SVPWM інвертор</text>

  <!-- Motor Torque to Physical Plant -->
  <line x1="515" y1="175" x2="560" y2="175" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrCtl)"/>
  <text x="522" y="168" font-family="sans-serif" font-size="10" fill="#6d28d9">τ_m</text>

  <!-- Block 4: Physical SEA Mechanics (x=560 to 740, y=130 to 220) -->
  <rect x="560" y="130" width="180" height="90" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <rect x="560" y="130" width="180" height="25" rx="6" fill="#e2e8f0"/>
  <text x="575" y="147" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Механічний об'єкт SEA</text>
  <text x="575" y="172" font-family="sans-serif" font-size="10" fill="#334155">Редуктор N:1 + Пружина k_s</text>
  <text x="575" y="190" font-family="sans-serif" font-size="10" fill="#334155">Навантаження: J_L, ланка суглоба</text>
  <text x="575" y="208" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0284c7">Енкодери 1 і 2: кути θ_m, θ_L</text>

  <!-- Physical Output Joint Torque -->
  <line x1="740" y1="175" x2="800" y2="175" stroke="#334155" stroke-width="3" marker-end="url(#arrCtl)"/>
  <text x="810" y="172" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Вихідний момент</text>
  <text x="810" y="188" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0369a1">τ_out навантаження</text>

  <!-- Feedback Line downwards from Mechanics to Kalman Filter -->
  <line x1="650" y1="220" x2="650" y2="280" stroke="#16a34a" stroke-width="2.5"/>
  <text x="660" y="250" font-family="sans-serif" font-size="10" fill="#15803d">θ_m, θ_L (шумні дані)</text>

  <!-- Block 5: Kalman Filter & Torque Estimator (x=460 to 720, y=280 to 365) -->
  <rect x="460" y="280" width="260" height="85" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="460" y="280" width="260" height="25" rx="6" fill="#bbf7d0"/>
  <text x="475" y="297" font-family="sans-serif" font-size="11" font-weight="bold" fill="#14532d">Фільтр Калмана та розрахунок моменту</text>
  <text x="475" y="320" font-family="sans-serif" font-size="10" fill="#14532d">• Фільтрація шумів квантування енкодерів</text>
  <text x="475" y="336" font-family="sans-serif" font-size="10" fill="#14532d">• Оцінка швидкостей: θ̂̇_m, θ̂̇_L</text>
  <text x="475" y="354" font-family="sans-serif" font-size="10" font-weight="bold" fill="#15803d">Оцінка моменту: τ̂_meas = k_s·(θ̂_m/N - θ̂_L)</text>

  <!-- Feedback line from Kalman back to Summing Junction 1 -->
  <line x1="460" y1="330" x2="148" y2="330" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="148" y1="330" x2="148" y2="188" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrFb)"/>
  <text x="156" y="320" font-family="sans-serif" font-size="10" font-weight="bold" fill="#16a34a">τ̂_meas (зворотний зв'язок)</text>

  <!-- Bottom Panel: Advantages & Engineering Details -->
  <rect x="30" y="380" width="900" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="45" y="402" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Переваги комбінованої структури керування:</text>
  <text x="45" y="420" font-family="sans-serif" font-size="11" fill="#334155">• <tspan font-weight="bold">Feedforward:</tspan> компенсує динамічну інерцію ланки без запізнення, розширюючи смугу пропускання на 40%.</text>
  <text x="45" y="434" font-family="sans-serif" font-size="11" fill="#334155">• <tspan font-weight="bold">Фільтр Калмана:</tspan> усуває високочастотний шум дискретизації, що дозволяє суттєво підвищити коефіцієнт K_d.</text>
</svg>
