<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <defs>
    <marker id="arrSt" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrRedSt" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>

  <!-- Main Title -->
  <text x="30" y="32" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Конструкція захисних механічних упорів торсійного диска SEA</text>
  <text x="30" y="52" font-family="sans-serif" font-size="12" fill="#475569">Обмеження максимального кута деформації кулачками для захисту титанових спиць від пластичної текучості</text>

  <!-- Left: Mechanical Hard Stop Assembly (x=30 to 490) -->
  <rect x="30" y="70" width="460" height="365" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="30" y="70" width="460" height="30" rx="8" fill="#e0f2fe"/>
  <text x="45" y="90" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0369a1">Кінематика кулачкових упорів (переріз по торцю)</text>

  <!-- Outer Ring with Stop Pockets (Center at 260, 240) -->
  <circle cx="260" cy="240" r="115" fill="#e2e8f0" stroke="#475569" stroke-width="8"/>
  <!-- Sector pockets (cutouts) in outer housing -->
  <path d="M260,125 A115,115 0 0,1 345,160 L310,185 A70,70 0 0,0 260,170 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M260,355 A115,115 0 0,1 175,320 L210,295 A70,70 0 0,0 260,310 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Inner Hub with Stop Lugs / Cams -->
  <circle cx="260" cy="240" r="70" fill="#f1f5f9" stroke="#0284c7" stroke-width="3"/>
  <circle cx="260" cy="240" r="24" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="248" y="244" font-family="sans-serif" font-size="10" fill="#475569">Вал</text>

  <!-- Protruding Cam 1 (Top) -->
  <path d="M272,170 L282,135 L315,155 L302,185 Z" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
  <!-- Cam label safely outside disc -->
  <line x1="298" y1="145" x2="330" y2="120" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="298" cy="145" r="3" fill="#0284c7"/>
  <text x="335" y="123" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0369a1">Кулачок маточини</text>

  <!-- Protruding Cam 2 (Bottom) -->
  <path d="M248,310 L238,345 L205,325 L218,295 Z" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>

  <!-- Clearance Gap Annotations (±9.5 deg) -->
  <line x1="260" y1="130" x2="278" y2="130" stroke="#dc2626" stroke-width="2"/>
  <text x="45" y="130" font-family="sans-serif" font-size="10" font-weight="bold" fill="#dc2626">Кутовий зазор ±9.5°</text>
  <text x="45" y="144" font-family="sans-serif" font-size="10" fill="#334155">(Вільний хід пружини)</text>

  <!-- Normal Mode Description Box -->
  <rect x="45" y="365" width="190" height="30" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="52" y="384" font-family="sans-serif" font-size="10" font-weight="bold" fill="#15803d">1. Робочий режим (&lt; 9.5°): вільний хід k_s</text>

  <!-- Overload Mode Description Box -->
  <rect x="250" y="365" width="220" height="30" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="258" y="384" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b91c1c">2. Перевантаження (≥ 9.5°): жорсткий упор</text>

  <!-- Right: Characteristic Curve Plot & Engineering Card (x=510 to 930) -->
  <!-- Top: Graph Box (y=70 to 260) -->
  <rect x="510" y="70" width="420" height="190" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="525" y="90" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Залежність моменту від деформації: τ(Δθ)</text>

  <!-- Graph Axes -->
  <!-- Horizontal Axis (Angle deg) -->
  <line x1="560" y1="200" x2="900" y2="200" stroke="#64748b" stroke-width="1.5"/>
  <text x="860" y="218" font-family="sans-serif" font-size="10" fill="#64748b">Δθ [град]</text>
  <!-- Vertical Axis (Torque Nm) -->
  <line x1="560" y1="220" x2="560" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrSt)"/>
  <text x="535" y="105" font-family="sans-serif" font-size="10" fill="#64748b">τ [Н·м]</text>

  <!-- Grid lines -->
  <line x1="720" y1="105" x2="720" y2="200" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="700" y="215" font-family="sans-serif" font-size="10" font-weight="bold" fill="#dc2626">Δθ_stop = 9.5°</text>

  <line x1="820" y1="105" x2="820" y2="200" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="795" y="215" font-family="sans-serif" font-size="10" fill="#64748b">Текучість: 12°</text>

  <!-- Characteristic Curve -->
  <!-- Linear elastic region up to 9.5 deg, 55 Nm -->
  <line x1="560" y1="200" x2="720" y2="135" stroke="#2563eb" stroke-width="3"/>
  <!-- Hard stop vertical rise -->
  <line x1="720" y1="135" x2="720" y2="105" stroke="#dc2626" stroke-width="4"/>
  <circle cx="720" cy="135" r="4" fill="#dc2626"/>

  <text x="580" y="160" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2563eb">Пружна зона (k_s)</text>
  <text x="728" y="125" font-family="sans-serif" font-size="10" font-weight="bold" fill="#dc2626">Жорсткий упор</text>
  <text x="565" y="138" font-family="sans-serif" font-size="10" fill="#0f172a">τ_stop = 55 Н·м</text>

  <!-- Bottom: Engineering Metrics Card (y=270 to 435) -->
  <rect x="510" y="270" width="420" height="165" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="510" y="270" width="420" height="28" rx="8" fill="#f1f5f9"/>
  <text x="525" y="289" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Інженерний розрахунок параметрів упору</text>

  <text x="525" y="316" font-family="sans-serif" font-size="11" fill="#334155">• <tspan font-weight="bold">Номінальний кут:</tspan> Δθ_nom = ±8.0° (робочий момент τ = 45 Н·м)</text>
  <text x="525" y="334" font-family="sans-serif" font-size="11" fill="#334155">• <tspan font-weight="bold">Кут контакту упору:</tspan> Δθ_stop = ±9.5° (момент спрацювання 55 Н·м)</text>
  <text x="525" y="352" font-family="sans-serif" font-size="11" fill="#334155">• <tspan font-weight="bold">Границя текучості спиць:</tspan> Δθ_yield = ±12.0° (критичний момент 75 Н·м)</text>
  <text x="525" y="370" font-family="sans-serif" font-size="11" fill="#334155">• <tspan font-weight="bold">Гарантований запас до пластичності:</tspan> k_захисту = 12.0° / 9.5° = 1.26</text>
  <text x="525" y="392" font-family="sans-serif" font-size="10" fill="#64748b">Упор передає до 300 Н·м ударного навантаження безпосередньо в корпус редуктора,</text>
  <text x="525" y="406" font-family="sans-serif" font-size="10" fill="#64748b">повністю розвантажуючи пружні титанові балки від залишйної деформації.</text>
</svg>
