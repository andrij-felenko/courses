<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <defs>
    <marker id="arrSpi" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#0284c7"/>
    </marker>
    <marker id="arrPwm" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrPwr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrAdc" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>

  <!-- Main Title -->
  <text x="30" y="32" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Апаратна архітектура керування R-SEA на базі мікроконтролера STM32</text>
  <text x="30" y="52" font-family="sans-serif" font-size="12" fill="#475569">Схема підключення FOC-інвертора, фаз BLDC-двигуна та подвійних SPI-енкодерів до та після пружини</text>

  <!-- Left: STM32 Microcontroller Box (x=40 to 260, y=75 to 425) -->
  <rect x="40" y="75" width="220" height="350" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <rect x="40" y="75" width="220" height="32" rx="8" fill="#e0f2fe"/>
  <text x="55" y="96" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0369a1">Мікроконтролер STM32G4</text>

  <!-- STM32 Internal Peripherals -->
  <!-- SPI Master Block -->
  <rect x="55" y="120" width="190" height="85" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="65" y="138" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0369a1">Модуль SPI1 (Master, 10 МГц)</text>
  <text x="65" y="156" font-family="sans-serif" font-size="10" fill="#334155">• Шина: SCK, MISO, MOSI</text>
  <text x="65" y="172" font-family="sans-serif" font-size="10" fill="#334155">• Лінія CS1: Енкодер ротора (θ_m)</text>
  <text x="65" y="188" font-family="sans-serif" font-size="10" fill="#334155">• Лінія CS2: Енкодер виходу (θ_L)</text>

  <!-- TIM1 Advanced PWM Block -->
  <rect x="55" y="220" width="190" height="75" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="65" y="238" font-family="sans-serif" font-size="11" font-weight="bold" fill="#6d28d9">Таймер TIM1 (FOC PWM 20 кГц)</text>
  <text x="65" y="256" font-family="sans-serif" font-size="10" fill="#334155">• 6 комплементарних каналів ШІМ</text>
  <text x="65" y="272" font-family="sans-serif" font-size="10" fill="#334155">• Апаратний Dead-Time генератор</text>
  <text x="65" y="288" font-family="sans-serif" font-size="10" fill="#334155">• Тригер запуску АЦП по центру</text>

  <!-- ADC Current Sense Block -->
  <rect x="55" y="310" width="190" height="65" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="65" y="328" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">Модуль ADC1/ADC2 (Шунти)</text>
  <text x="65" y="346" font-family="sans-serif" font-size="10" fill="#334155">• 3 вбудовані операційні підсилювачі</text>
  <text x="65" y="362" font-family="sans-serif" font-size="10" fill="#334155">• Синхронний вимір фаз I_u, I_v, I_w</text>

  <!-- 1 kHz Timer interrupt label -->
  <rect x="55" y="388" width="190" height="25" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="65" y="405" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b45309">Переривання TIM6 (1 кГц): ПІД моменту</text>

  <!-- Middle-Top: Shared SPI Bus & Encoders (x=330 to 570) -->
  <!-- Shared SPI lines -->
  <line x1="245" y1="145" x2="330" y2="145" stroke="#0284c7" stroke-width="2" marker-end="url(#arrSpi)"/>
  <text x="252" y="140" font-family="sans-serif" font-size="10" fill="#0284c7">Спільний SPI</text>

  <!-- Encoder 1 Box -->
  <rect x="330" y="100" width="220" height="70" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="345" y="120" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">Енкодер 1: AS5047P (Вал ротора)</text>
  <text x="345" y="138" font-family="sans-serif" font-size="10" fill="#334155">Вибірка: 14 біт (16384 імп/об)</text>
  <text x="345" y="154" font-family="sans-serif" font-size="10" fill="#15803d">CS1 активний | Вимір кута θ_m</text>

  <!-- Encoder 2 Box -->
  <rect x="330" y="190" width="220" height="70" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="345" y="210" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">Енкодер 2: AS5047P (Вихідний шарнір)</text>
  <text x="345" y="228" font-family="sans-serif" font-size="10" fill="#334155">Вибірка: 14 біт після пружини SEA</text>
  <text x="345" y="244" font-family="sans-serif" font-size="10" fill="#15803d">CS2 активний | Вимір кута θ_L</text>

  <!-- Middle-Bottom: Power Gate Driver & Inverter (x=330 to 570) -->
  <!-- PWM connection line -->
  <line x1="245" y1="260" x2="330" y2="285" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrPwm)"/>
  <text x="250" y="275" font-family="sans-serif" font-size="10" fill="#7c3aed">6× ШІМ</text>

  <!-- Gate Driver Box -->
  <rect x="330" y="280" width="220" height="145" rx="6" fill="#fbfbfe" stroke="#6d28d9" stroke-width="1.5"/>
  <rect x="330" y="280" width="220" height="25" rx="6" fill="#ede9fe"/>
  <text x="345" y="297" font-family="sans-serif" font-size="11" font-weight="bold" fill="#5b21b6">Силовий драйвер DRV8323RS</text>
  <text x="345" y="322" font-family="sans-serif" font-size="10" fill="#334155">• 3-фазний міст на MOSFET (48 В, 30 А)</text>
  <text x="345" y="340" font-family="sans-serif" font-size="10" fill="#334155">• Вбудовані струмові шунти фаз</text>
  <text x="345" y="358" font-family="sans-serif" font-size="10" fill="#334155">• Захист від КЗ, перегріву та перенапруги</text>
  <!-- Current feedback line back to STM32 -->
  <line x1="330" y1="380" x2="265" y2="380" stroke="#16a34a" stroke-width="2" marker-end="url(#arrAdc)"/>
  <text x="268" y="372" font-family="sans-serif" font-size="10" fill="#16a34a">I_u,v,w</text>

  <!-- Right: Mechanical Actuator Plant Box (x=600 to 920, y=75 to 425) -->
  <rect x="600" y="75" width="320" height="350" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="600" y="75" width="320" height="32" rx="8" fill="#fef3c7"/>
  <text x="615" y="96" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b45309">Механічний модуль R-SEA</text>

  <!-- 3-Phase power lines from driver to BLDC -->
  <line x1="550" y1="340" x2="630" y2="155" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrPwr)"/>
  <text x="560" y="260" font-family="sans-serif" font-size="10" font-weight="bold" fill="#dc2626">Фази U, V, W</text>

  <!-- 1. BLDC Motor -->
  <rect x="630" y="125" width="260" height="55" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="645" y="145" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0369a1">Безколекторний двигун (BLDC)</text>
  <text x="645" y="163" font-family="sans-serif" font-size="10" fill="#334155">Ротор J_m | Швидкість θ̇_m | Момент τ_m</text>

  <!-- 2. Reduction Gearbox -->
  <rect x="630" y="195" width="260" height="45" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="645" y="215" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155">Хвильовий редуктор (N = 50:1)</text>
  <text x="645" y="230" font-family="sans-serif" font-size="10" fill="#64748b">Редукований кут: θ_gear = θ_m / N</text>

  <!-- 3. Torsion Spring Element -->
  <rect x="630" y="255" width="260" height="65" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="645" y="275" font-family="sans-serif" font-size="11" font-weight="bold" fill="#92400e">Торсіонний диск SEA (Титан Ti-6Al-4V)</text>
  <text x="645" y="293" font-family="sans-serif" font-size="10" font-weight="bold" fill="#b45309">Жорсткість k_s = 200 Н·м/рад</text>
  <text x="645" y="309" font-family="sans-serif" font-size="10" fill="#92400e">Пружний момент: τ = k_s · (θ_m/N - θ_L)</text>

  <!-- 4. Output Joint Load -->
  <rect x="630" y="335" width="260" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="645" y="355" font-family="sans-serif" font-size="11" font-weight="bold" fill="#15803d">Вихідна ланка суглоба робота</text>
  <text x="645" y="371" font-family="sans-serif" font-size="10" fill="#14532d">Інерція навантаження J_L | Кут шарніра θ_L</text>

  <!-- Bottom Feedback Link lines -->
  <line x1="630" y1="145" x2="550" y2="135" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="630" y1="360" x2="550" y2="225" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3,3"/>
</svg>
