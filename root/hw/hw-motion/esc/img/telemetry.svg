<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460"
     viewBox="0 0 940 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="940" height="460" fill="white"/>
<text x="470.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Сучасний ESC не лише крутить — він і доповідає, і захищає</text>
<text x="470.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">телеметрія назад у контролер + власні запобіжники</text>
<rect x="60" y="150" width="180" height="90" rx="11" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.7"/>
<text x="150" y="190" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">ESC</text>
<text x="150" y="212" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">+ прошивка</text>
<rect x="700" y="150" width="180" height="90" rx="11" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="790" y="190" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">Політний</text>
<text x="790" y="208" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">контролер</text>
<line x1="240" y1="180" x2="698" y2="180" stroke="#1f4ed8" stroke-width="2.0" marker-end="url(#arrB)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="470" y="168" font-size="11" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">телеметрія (bidirectional DShot чи окремий дріт):</text>
<text x="470" y="205" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">оберти (RPM) · струм · напруга · температура</text>
<rect x="120" y="290" width="320" height="120" rx="12" fill="#fff0f0" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.6"/>
<text x="280" y="316" font-size="12.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">Власні запобіжники</text>
<text x="140" y="340" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• струмова межа</text>
<text x="140" y="362" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• теплове вимкнення при перегріві</text>
<text x="140" y="384" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• виявлення зриву/застрягання</text>
<rect x="500" y="290" width="340" height="120" rx="12" fill="#eef6ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<text x="670" y="316" font-size="12.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">Зброєння (arming)</text>
<text x="520" y="340" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• мотор крутиться лише після «озброєння»</text>
<text x="520" y="362" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• низький газ на старті — обов'язково</text>
<text x="520" y="384" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• захист від випадкового запуску</text>
<text x="470.0" y="448" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Оберти з ESC ще й чистять давачі (RPM-фільтр), а телеметрія дає контролеру знати про здоров'я кожного мотора (місток до 44.7).</text>
</svg>
