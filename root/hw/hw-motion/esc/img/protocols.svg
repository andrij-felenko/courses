<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500"
     viewBox="0 0 980 500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="500" fill="white"/>
<text x="490.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Як контролер каже ESC «газ»: від аналогового PWM до цифрового DShot</text>
<text x="490.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">старий спосіб — ширина імпульсу; новий — цифровий пакет із перевіркою</text>
<text x="60" y="100" font-size="12.5" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">PWM (сервоформат) — аналоговий</text>
<line x1="60" y1="150" x2="420" y2="150" stroke="#6b7280" stroke-width="1.0" stroke-opacity="1.0" stroke-linecap="round"/>
<polyline points="60,150 100,150 100,110 210,110 210,150 420,150" fill="none" fill-opacity="1.0" stroke="#d98a00" stroke-width="2.2" stroke-linejoin="round"/>
<line x1="100" y1="164" x2="210" y2="164" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="210" y1="164" x2="100" y2="164" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="155" y="180" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">ширина 1000–2000 µs = газ</text>
<text x="460" y="122" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">повільно, дрижить, чутливий до шуму,</text>
<text x="460" y="140" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">треба калібрувати діапазон газу.</text>
<text x="460" y="158" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">(OneShot/Multishot — те саме, лише коротше/швидше)</text>
<text x="60" y="252" font-size="12.5" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">DShot — цифровий пакет</text>
<rect x="60" y="280" width="418" height="44" rx="6" fill="#eef2ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.6"/>
<line x1="98" y1="280" x2="98" y2="324" stroke="#1f4ed8" stroke-width="0.6" stroke-opacity="0.4" stroke-linecap="round"/>
<line x1="136" y1="280" x2="136" y2="324" stroke="#1f4ed8" stroke-width="0.6" stroke-opacity="0.4" stroke-linecap="round"/>
<line x1="174" y1="280" x2="174" y2="324" stroke="#1f4ed8" stroke-width="0.6" stroke-opacity="0.4" stroke-linecap="round"/>
<line x1="212" y1="280" x2="212" y2="324" stroke="#1f4ed8" stroke-width="0.6" stroke-opacity="0.4" stroke-linecap="round"/>
<line x1="250" y1="280" x2="250" y2="324" stroke="#1f4ed8" stroke-width="0.6" stroke-opacity="0.4" stroke-linecap="round"/>
<line x1="288" y1="280" x2="288" y2="324" stroke="#1f4ed8" stroke-width="0.6" stroke-opacity="0.4" stroke-linecap="round"/>
<line x1="326" y1="280" x2="326" y2="324" stroke="#1f4ed8" stroke-width="0.6" stroke-opacity="0.4" stroke-linecap="round"/>
<line x1="364" y1="280" x2="364" y2="324" stroke="#1f4ed8" stroke-width="0.6" stroke-opacity="0.4" stroke-linecap="round"/>
<line x1="402" y1="280" x2="402" y2="324" stroke="#1f4ed8" stroke-width="0.6" stroke-opacity="0.4" stroke-linecap="round"/>
<line x1="440" y1="280" x2="440" y2="324" stroke="#1f4ed8" stroke-width="0.6" stroke-opacity="0.4" stroke-linecap="round"/>
<text x="269.0" y="344" font-size="10.5" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">11 біт — газ (0…2047)</text>
<rect x="478" y="280" width="38" height="44" rx="6" fill="#fff5e6" fill-opacity="1.0" stroke="#d98a00" stroke-width="1.6"/>
<text x="497.0" y="344" font-size="10.5" fill="#d98a00" text-anchor="middle" font-weight="bold" font-style="normal">тлм</text>
<rect x="516" y="280" width="152" height="44" rx="6" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.6"/>
<line x1="554" y1="280" x2="554" y2="324" stroke="#0a8f3c" stroke-width="0.6" stroke-opacity="0.4" stroke-linecap="round"/>
<line x1="592" y1="280" x2="592" y2="324" stroke="#0a8f3c" stroke-width="0.6" stroke-opacity="0.4" stroke-linecap="round"/>
<line x1="630" y1="280" x2="630" y2="324" stroke="#0a8f3c" stroke-width="0.6" stroke-opacity="0.4" stroke-linecap="round"/>
<text x="592.0" y="344" font-size="10.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">4 біти — CRC</text>
<text x="60" y="270" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">16-бітний кадр:</text>
<text x="640" y="274" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">точний, без калібрування;</text>
<text x="640" y="292" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">CRC ловить спотворення → ESC тримає</text>
<text x="640" y="310" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">останнє чинне значення (без стрибка);</text>
<text x="640" y="328" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">несе телеметрію; DShot150/300/600 — швидкість.</text>
<text x="490.0" y="484" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Цифровий протокол прибрав болячки аналогового: ні калібрування, ні дрижання — лише числа з контрольною сумою.</text>
</svg>
