<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
  <defs>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue2" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red2" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="460" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Концепт автомата перекосу в патенті Бориса Юр'єва (1912)</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Кулачково-важільна схема керування циклічним кроком лопатей несучого гвинта</text>

  <!-- Left Panel: Mechanism Elements -->
  <rect x="25" y="75" width="275" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="102" font-size="14" font-weight="bold" fill="#1a1a1a">Вузли конструкції 1912 р.</text>
  <text x="40" y="122" font-size="12" fill="#6b7280">Принцип дії за патентом № 45212</text>

  <text x="40" y="152" font-size="11" fill="#1a1a1a">1. Несучий трубчастий вал ротора</text>
  <text x="40" y="172" font-size="11" fill="#1a1a1a">2. Внутрішня тяга керування нахилом</text>
  <text x="40" y="192" font-size="11" fill="#1a1a1a">3. Похила напрямна шайба (кулачок)</text>
  <text x="40" y="212" font-size="11" fill="#1a1a1a">4. Обертовий повзун із тягами</text>
  <text x="40" y="232" font-size="11" fill="#1a1a1a">5. Важелі повороту лопатей (pitch horns)</text>
  <text x="40" y="252" font-size="11" fill="#1a1a1a">6. Осьові поворотні цапфи втулки</text>

  <rect x="38" y="275" width="249" height="95" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="48" y="298" font-size="12" font-weight="bold" fill="#2457d6">Історична першість схеми:</text>
  <text x="48" y="318" font-size="11" fill="#1a1a1a">• Перша схема вертольота з одним</text>
  <text x="48" y="336" font-size="11" fill="#1a1a1a">  несучим і хвостовим кермовим гвинтом</text>
  <text x="48" y="354" font-size="11" fill="#1a1a1a">• Ідея циклічної зміни кута установки</text>

  <text x="40" y="405" font-size="11" font-weight="bold" fill="#2457d6">Концепція: циклічний крок</text>
  <text x="40" y="423" font-size="11" fill="#6b7280">Створення горизонтальної сили тяги</text>

  <!-- Center Panel: Kinematic Schematic -->
  <rect x="315" y="75" width="330" height="365" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Кінематична схема патенту</text>

  <!-- Blades at top -->
  <!-- Left Blade -->
  <rect x="335" y="140" width="75" height="12" rx="3" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <text x="372" y="133" text-anchor="middle" font-size="11" fill="#6b7280">Лопать 1</text>
  <!-- Right Blade -->
  <rect x="550" y="140" width="75" height="12" rx="3" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <text x="587" y="133" text-anchor="middle" font-size="11" fill="#6b7280">Лопать 2</text>

  <!-- Rotor Hub -->
  <rect x="420" y="136" width="120" height="20" rx="4" fill="#2457d6"/>
  <text x="480" y="151" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Втулка ротора</text>

  <!-- Pitch Horns -->
  <line x1="410" y1="146" x2="410" y2="175" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="550" y1="146" x2="550" y2="175" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Vertical Rotor Mast -->
  <rect x="471" y="156" width="18" height="200" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Inclined Cam / Ring (Swashplate) -->
  <polygon points="420,270 540,230 540,245 420,285" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Pushrods from tilted ring to pitch horns -->
  <line x1="410" y1="175" x2="425" y2="277" stroke="#2457d6" stroke-width="2.5" marker-start="url(#arr-blue2)"/>
  <text x="365" y="225" text-anchor="middle" font-size="11" fill="#2457d6">Тяга 1</text>
  
  <line x1="550" y1="175" x2="535" y2="237" stroke="#2457d6" stroke-width="2.5" marker-start="url(#arr-blue2)"/>
  <text x="595" y="225" text-anchor="middle" font-size="11" fill="#2457d6">Тяга 2</text>

  <!-- Callout for Cam: placed cleanly below -->
  <text x="480" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Похилий кулачок</text>

  <!-- Lower Pilot Control Link -->
  <line x1="480" y1="320" x2="480" y2="360" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red2)"/>
  <text x="480" y="375" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Кут нахилу від важеля</text>

  <text x="480" y="415" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Вал ротора (щогла)</text>

  <!-- Right Panel: Limitations & Reality -->
  <rect x="660" y="75" width="275" height="365" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="675" y="102" font-size="14" font-weight="bold" fill="#c0392b">Технічні проблеми схеми 1912</text>
  <text x="675" y="122" font-size="12" fill="#6b7280">Чому конструкція не змогла злетіти</text>

  <text x="675" y="152" font-size="11" fill="#1a1a1a">• Колосальне тертя ковзання в кулачку</text>
  <text x="675" y="172" font-size="11" fill="#1a1a1a">• Відсутність упорних підшипників кочення</text>
  <text x="675" y="192" font-size="11" fill="#1a1a1a">• Відсутність спільного кроку (collective)</text>
  <text x="675" y="212" font-size="11" fill="#1a1a1a">• Некерованість за висотою без обертів</text>
  <text x="675" y="232" font-size="11" fill="#1a1a1a">• Поломка вала на наземних пробах 1912 р.</text>

  <rect x="673" y="255" width="249" height="105" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="683" y="278" font-size="12" font-weight="bold" fill="#c0392b">Історична оцінка:</text>
  <text x="683" y="298" font-size="11" fill="#1a1a1a">Теоретичний патент дав ідею,</text>
  <text x="683" y="316" font-size="11" fill="#1a1a1a">але робочий вертоліт створили</text>
  <text x="683" y="334" font-size="11" fill="#1a1a1a">Пескара (1920-ті), Різелер та</text>
  <text x="683" y="352" font-size="11" fill="#1a1a1a">Сікорський (VS-300, 1939-1940)</text>

  <text x="675" y="390" font-size="11" font-weight="bold" fill="#c0392b">Статус: концептуальна схема</text>
  <text x="675" y="410" font-size="11" fill="#6b7280">Діючого апарата збудовано не було</text>
</svg>
