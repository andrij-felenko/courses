<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-nl1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue-nl" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red-nl" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Нелінійність качалки сервопривода та Swashplate Ring Limiter</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Арксинусна лінеаризація ходу тяги та кругове обмеження діагональних циклічних команд</text>

  <!-- LEFT PANEL: Servo Horn Kinematics -->
  <rect x="30" y="75" width="435" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">1. Нелінійність кутової качалки серво</text>

  <!-- Servo Diagram Container -->
  <!-- Servo Body Box -->
  <path d="M 60 135 L 140 135 L 140 215 L 60 215 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="100" cy="175" r="8" fill="#2457d6"/>
  <text x="100" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Вал серво</text>

  <!-- Horn and Pushrod -->
  <!-- Neutral Horn (dashed line) -->
  <line x1="100" y1="175" x2="165" y2="175" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Tilted Horn -->
  <line x1="100" y1="175" x2="155" y2="135" stroke="#2457d6" stroke-width="3"/>
  <circle cx="155" cy="135" r="5" fill="#2457d6"/>
  <!-- Vertical Pushrod -->
  <line x1="155" y1="135" x2="155" y2="95" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-nl1)"/>
  <text x="175" y="115" font-size="11" font-weight="bold" fill="#1a1a1a">Тяга до тарілки</text>

  <!-- Height Delta annotation -->
  <line x1="185" y1="175" x2="185" y2="135" stroke="#27ae60" stroke-width="2"/>
  <text x="195" y="158" font-size="11" font-weight="bold" fill="#27ae60">dz = R · sin(a)</text>

  <!-- Explanatory Box Left -->
  <path d="M 50 250 L 445 250 L 445 415 L 50 415 Z" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="65" y="274" font-size="12" font-weight="bold" fill="#c0392b">• Механічна помилка без корекції:</text>
  <text x="75" y="295" font-size="11" fill="#1a1a1a">При куті a = 35° помилка лінійності перевищує 9.5%</text>
  <text x="75" y="315" font-size="11" fill="#6b7280">Викликає спотворення кроку та паразитний дрейф висоти</text>

  <text x="65" y="342" font-size="12" font-weight="bold" fill="#27ae60">• Програмна компенсація (eCCPM):</text>
  <text x="75" y="363" font-size="11" fill="#1a1a1a">Кут серво = arcsin(dz_бажане / R_качалки)</text>
  <text x="75" y="383" font-size="11" fill="#2457d6">Забезпечує ідеально лінійний вертикальний хід тяги</text>
  <text x="75" y="401" font-size="11" fill="#6b7280">Усуває розкачування вертольота при маневрах</text>


  <!-- RIGHT PANEL: Ring Limiter -->
  <rect x="495" y="75" width="435" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">2. Swashplate Ring Limiter</text>

  <!-- Limiter Diagram -->
  <!-- Axes -->
  <line x1="560" y1="200" x2="800" y2="200" stroke="#6b7280" stroke-width="1"/>
  <line x1="680" y1="120" x2="680" y2="280" stroke="#6b7280" stroke-width="1"/>

  <text x="810" y="204" font-size="11" font-weight="bold" fill="#6b7280">Крен</text>
  <text x="680" y="115" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">Тангаж</text>

  <!-- Square Box (Unsafe 100% + 100%) -->
  <path d="M 610 130 L 750 130 L 750 270 L 610 270 Z" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="750" cy="130" r="4" fill="#c0392b"/>
  <text x="760" y="134" font-size="11" font-weight="bold" fill="#c0392b">141% (заклинювання)</text>

  <!-- Safe Circle (Ring Limiter R = 1.0) -->
  <circle cx="680" cy="200" r="70" fill="#eaf0fd" fill-opacity="0.4" stroke="#2457d6" stroke-width="2"/>
  <circle cx="729" cy="151" r="4" fill="#27ae60"/>
  <text x="745" y="165" font-size="11" font-weight="bold" fill="#27ae60">100% макс</text>

  <!-- Vector arrow -->
  <line x1="680" y1="200" x2="725" y2="155" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue-nl)"/>

  <!-- Explanatory Box Right -->
  <path d="M 515 295 L 910 295 L 910 415 L 515 415 Z" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="530" y="318" font-size="12" font-weight="bold" fill="#c0392b">• Без кільцевого обмежувача:</text>
  <text x="540" y="337" font-size="11" fill="#1a1a1a">Повний крен + повний тангаж дають вектор L = 1.41</text>
  <text x="540" y="355" font-size="11" fill="#6b7280">Сервоприводи впираються в механічні упори та горять</text>

  <text x="530" y="378" font-size="12" font-weight="bold" fill="#27ae60">• Алгоритм Ring Limiter:</text>
  <text x="540" y="397" font-size="11" fill="#1a1a1a">Масштабує вектор: if L &gt; 1.0 then k = 1.0 / L</text>
</svg>
