<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
  <defs>
    <marker id="arr3" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue3" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green3" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="460" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Автомат перекосу вертольота Vought-Sikorsky VS-300 (1939–1940)</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Перша працездатна інтеграція спільного й циклічного кроку в одногвинтовій схемі</text>

  <!-- Left Panel: Historical Configuration -->
  <rect x="25" y="75" width="275" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="102" font-size="14" font-weight="bold" fill="#1a1a1a">Керування VS-300</text>
  <text x="40" y="122" font-size="12" fill="#6b7280">Архітектура Ігоря Сікорського</text>

  <text x="40" y="152" font-size="11" fill="#1a1a1a">• Одногвинтова схема з рульовим гвинтом</text>
  <text x="40" y="172" font-size="11" fill="#1a1a1a">• Ручка циклічного кроку: нахил тарілки</text>
  <text x="40" y="192" font-size="11" fill="#1a1a1a">• Важіль «шаг-газ»: вертикальний зсув</text>
  <text x="40" y="212" font-size="11" fill="#1a1a1a">• Педалі: крок хвостового пропелера</text>
  <text x="40" y="232" font-size="11" fill="#1a1a1a">• 3 лопаті з шарнірним кріпленням</text>

  <rect x="38" y="255" width="249" height="105" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="48" y="278" font-size="12" font-weight="bold" fill="#2457d6">Історичний прорив:</text>
  <text x="48" y="298" font-size="11" fill="#1a1a1a">VS-300 став першим серійним</text>
  <text x="48" y="316" font-size="11" fill="#1a1a1a">прототипом, що довів керованість</text>
  <text x="48" y="334" font-size="11" fill="#1a1a1a">та стабільність на всіх режимах</text>
  <text x="48" y="352" font-size="11" fill="#1a1a1a">зависання й польоту</text>

  <text x="40" y="390" font-size="11" font-weight="bold" fill="#2457d6">Повний контроль осей:</text>
  <text x="40" y="410" font-size="11" fill="#6b7280">Крен, тангаж, рискання і висота</text>

  <!-- Center Panel: Swashplate Assembly Drawing -->
  <rect x="315" y="75" width="330" height="365" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Вузол автомата перекосу VS-300</text>

  <!-- Blades at top -->
  <rect x="330" y="138" width="80" height="12" rx="3" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <text x="370" y="131" text-anchor="middle" font-size="11" fill="#6b7280">Лопать A</text>
  
  <rect x="550" y="138" width="80" height="12" rx="3" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <text x="590" y="131" text-anchor="middle" font-size="11" fill="#6b7280">Лопать B</text>

  <!-- Rotor Hub -->
  <rect x="420" y="134" width="120" height="20" rx="4" fill="#2457d6"/>
  <text x="480" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Втулка 3 лопатей</text>

  <!-- Pitch Horns -->
  <line x1="390" y1="144" x2="390" y2="175" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="570" y1="144" x2="570" y2="175" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Vertical Rotor Mast -->
  <rect x="472" y="154" width="16" height="210" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Pitch links from rotating ring to pitch horns -->
  <line x1="390" y1="175" x2="410" y2="250" stroke="#2457d6" stroke-width="2.5"/>
  <text x="350" y="210" text-anchor="middle" font-size="11" fill="#2457d6">Тяга кроку</text>
  
  <line x1="570" y1="175" x2="550" y2="250" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Rotating Ring (upper) -->
  <rect x="405" y="248" width="150" height="14" rx="3" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="565" y="260" text-anchor="start" font-size="11" font-weight="bold" fill="#27ae60">Обертова тарілка</text>

  <!-- Bearing Row -->
  <rect x="415" y="262" width="130" height="6" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>

  <!-- Non-rotating Ring (lower) -->
  <rect x="405" y="268" width="150" height="14" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="565" y="280" text-anchor="start" font-size="11" font-weight="bold" fill="#2457d6">Нерухома тарілка</text>

  <!-- Torque Link (Scissors) centered on mast -->
  <polyline points="472,175 450,210 472,248" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="450" y="195" text-anchor="end" font-size="10" fill="#27ae60">Ножиці</text>

  <!-- Pilot control pushrods below non-rotating ring -->
  <line x1="425" y1="282" x2="425" y2="345" stroke="#1a1a1a" stroke-width="2.5" marker-start="url(#arr3)"/>
  <line x1="535" y1="282" x2="535" y2="345" stroke="#1a1a1a" stroke-width="2.5" marker-start="url(#arr3)"/>
  <text x="480" y="340" text-anchor="middle" font-size="11" fill="#1a1a1a">Тяги від важелів пілота</text>

  <text x="480" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Вал привода ротора</text>

  <!-- Right Panel: Key Engineering Decisions -->
  <rect x="660" y="75" width="275" height="365" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="675" y="102" font-size="14" font-weight="bold" fill="#27ae60">Інженерні досягнення</text>
  <text x="675" y="122" font-size="12" fill="#6b7280">Чому схема VS-300 перемогла</text>

  <text x="675" y="152" font-size="11" fill="#1a1a1a">• Підшипниковий вузол високого ресурсу</text>
  <text x="675" y="172" font-size="11" fill="#1a1a1a">• Повідкові ножиці синхронізації обертів</text>
  <text x="675" y="192" font-size="11" fill="#1a1a1a">• Сферична опора uniball для нахилу</text>
  <text x="675" y="212" font-size="11" fill="#1a1a1a">• Повне розв'язання тангажу та крену</text>
  <text x="675" y="232" font-size="11" fill="#1a1a1a">• Фазове зміщення тяг на 90 градусів</text>

  <rect x="673" y="255" width="249" height="105" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="683" y="278" font-size="12" font-weight="bold" fill="#27ae60">Світовий стандарт:</text>
  <text x="683" y="298" font-size="11" fill="#1a1a1a">Створена Ігорем Сікорським</text>
  <text x="683" y="316" font-size="11" fill="#1a1a1a">кінематика автомата перекосу</text>
  <text x="683" y="334" font-size="11" fill="#1a1a1a">використовується у понад 95%</text>
  <text x="683" y="352" font-size="11" fill="#1a1a1a">сучасних гвинтокрилих машин</text>

  <text x="675" y="390" font-size="11" font-weight="bold" fill="#27ae60">Результат: класична схема</text>
  <text x="675" y="410" font-size="11" fill="#6b7280">Основа світового вертольотобудування</text>
</svg>
