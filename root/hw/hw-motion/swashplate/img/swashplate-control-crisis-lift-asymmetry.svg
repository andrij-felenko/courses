<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="460" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Асиметрія підйомної сили несучого ротора в горизонтальному польоті</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Різниця відносних швидкостей обтікання лопатей породжує перекидний момент без автомата перекосу</text>

  <!-- Left Panel: Retreating Blade -->
  <rect x="25" y="75" width="285" height="365" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="40" y="102" font-size="14" font-weight="bold" fill="#c0392b">Відступаюча лопать (лівий борт)</text>
  <text x="40" y="122" font-size="12" fill="#6b7280">Азимут psi = 270° (рух проти потоку)</text>

  <text x="40" y="152" font-size="12" font-weight="bold" fill="#1a1a1a">V_rel = Omega · R - V_inf</text>
  
  <text x="40" y="180" font-size="11" fill="#1a1a1a">• Швидкість польоту віднімається від лінійної</text>
  <text x="40" y="198" font-size="11" fill="#1a1a1a">• Повітряний потік на кінці лопаті падає</text>
  <text x="40" y="216" font-size="11" fill="#1a1a1a">• При V_inf ≥ Omega·R — зона зворотного потоку</text>
  <text x="40" y="234" font-size="11" fill="#1a1a1a">• Підйомна сила лопаті L_ret падає до нуля</text>

  <rect x="38" y="255" width="258" height="95" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="50" y="278" font-size="12" font-weight="bold" fill="#c0392b">Криза: зрив потоку (stall)</text>
  <text x="50" y="298" font-size="11" fill="#1a1a1a">Спроба компенсувати тягу збільшенням</text>
  <text x="50" y="316" font-size="11" fill="#1a1a1a">кута веде до зриву потоку з профілю</text>
  <text x="50" y="334" font-size="11" fill="#1a1a1a">та втрати підйомної сили зліва</text>

  <text x="40" y="380" font-size="11" font-weight="bold" fill="#c0392b">Результат: лівий борт просідає</text>
  <text x="40" y="400" font-size="11" fill="#6b7280">L_ret ≪ L_0 (глибокий дефіцит тяги)</text>

  <!-- Center Panel: Rotor Disc Top View -->
  <rect x="325" y="75" width="310" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Диск ротора: вид зверху</text>

  <!-- Forward Flight Arrow -->
  <line x1="480" y1="160" x2="480" y2="125" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="480" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Політ вперед V_inf</text>

  <!-- Rotor Disk Outline -->
  <circle cx="480" cy="250" r="75" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  
  <!-- Rotor Hub -->
  <circle cx="480" cy="250" r="12" fill="#2457d6"/>

  <!-- Rotor Blades -->
  <!-- Left Blade (Retreating) -->
  <line x1="480" y1="250" x2="405" y2="250" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
  <text x="355" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">L_ret ↓</text>

  <!-- Right Blade (Advancing) -->
  <line x1="480" y1="250" x2="555" y2="250" stroke="#27ae60" stroke-width="6" stroke-linecap="round"/>
  <text x="605" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">L_adv ↑↑</text>

  <!-- Rotation Direction Arrow (CCW) -->
  <path d="M480,185 A65,65 0 0,0 425,225" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="430" y="200" font-size="11" font-weight="bold" fill="#1a1a1a">Omega</text>

  <!-- Overturning Roll Moment -->
  <path d="M510,345 C495,365 465,365 450,345" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="480" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Перекидний момент M_roll</text>
  <text x="480" y="398" text-anchor="middle" font-size="11" fill="#1a1a1a">Перевертання машини ліворуч</text>
  <text x="480" y="420" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Вирішення: циклічний крок лопатей</text>

  <!-- Right Panel: Advancing Blade -->
  <rect x="650" y="75" width="285" height="365" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="665" y="102" font-size="14" font-weight="bold" fill="#27ae60">Наступаюча лопать (правий борт)</text>
  <text x="665" y="122" font-size="12" fill="#6b7280">Азимут psi = 90° (рух за потоком)</text>

  <text x="665" y="152" font-size="12" font-weight="bold" fill="#1a1a1a">V_rel = Omega · R + V_inf</text>
  
  <text x="665" y="180" font-size="11" fill="#1a1a1a">• Швидкість польоту додається до лінійної</text>
  <text x="665" y="198" font-size="11" fill="#1a1a1a">• Повітряний потік на кінці лопаті зростає</text>
  <text x="665" y="216" font-size="11" fill="#1a1a1a">• Підйомна сила пропорційна квадрату швидкості</text>
  <text x="665" y="234" font-size="11" fill="#1a1a1a">• L_adv стрімко зростає при незмінному куті</text>

  <rect x="663" y="255" width="258" height="95" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="675" y="278" font-size="12" font-weight="bold" fill="#27ae60">Наслідок: колосальна тяга</text>
  <text x="675" y="298" font-size="11" fill="#1a1a1a">Правий борт генерує надмірну тягу,</text>
  <text x="675" y="316" font-size="11" fill="#1a1a1a">що утворює сильний перекидний момент</text>
  <text x="675" y="334" font-size="11" fill="#1a1a1a">в бік відступаючої лопаті</text>

  <text x="665" y="380" font-size="11" font-weight="bold" fill="#27ae60">Вимога: зменшувати кут атаки</text>
  <text x="665" y="400" font-size="11" fill="#6b7280">L_adv ≫ L_0 (необхідне вирівнювання)</text>
</svg>
