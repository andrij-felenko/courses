<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
  <defs>
    <marker id="arr5" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue5" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red5" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="460" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Фазове запізнення маху лопаті ротора на 90° при резонансі</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Максимум аеродинамічної сили випереджає пік підйому лопаті на чверть оберту ротора</text>

  <!-- Left Panel: Resonance Physics -->
  <rect x="25" y="75" width="275" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="102" font-size="14" font-weight="bold" fill="#1a1a1a">Фізика резонансного маху</text>
  <text x="40" y="122" font-size="12" fill="#6b7280">Лопать як маятник з частотою 1/об</text>

  <text x="40" y="152" font-size="11" fill="#1a1a1a">• Шарнірна лопать коливається під дією</text>
  <text x="40" y="170" font-size="11" fill="#1a1a1a">  відцентрової сили пружності</text>
  <text x="40" y="188" font-size="11" fill="#1a1a1a">• Власна частота маху: omega_0 ≈ Omega</text>
  <text x="40" y="206" font-size="11" fill="#1a1a1a">• Збурення кроком діє на частоті Omega</text>
  <text x="40" y="224" font-size="11" fill="#1a1a1a">• Точний механічний резонанс системи</text>

  <rect x="38" y="248" width="249" height="110" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="48" y="270" font-size="12" font-weight="bold" fill="#c0392b">Фазовий зсув 90 градусів:</text>
  <text x="48" y="290" font-size="11" fill="#1a1a1a">При резонансі механічний відгук</text>
  <text x="48" y="308" font-size="11" fill="#1a1a1a">відстає за фазою рівно на pi/2 (90°):</text>
  <text x="48" y="328" font-size="11" font-weight="bold" fill="#2457d6">Пік сили F_aero : psi = 90°</text>
  <text x="48" y="346" font-size="11" font-weight="bold" fill="#c0392b">Пік маху beta_max : psi = 180°</text>

  <text x="40" y="390" font-size="11" font-weight="bold" fill="#2457d6">Висновки для динаміки:</text>
  <text x="40" y="410" font-size="11" fill="#6b7280">Реакція ротора не є миттєвою</text>

  <!-- Center Panel: Oscillation Curves -->
  <rect x="315" y="75" width="330" height="365" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Графіки коливань за азимутом psi</text>

  <!-- Graph Grid and Axes -->
  <!-- Horizontal Axis (y=240, from x=345 to 615) -->
  <line x1="345" y1="240" x2="620" y2="240" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr5)"/>
  <text x="625" y="244" font-size="11" font-weight="bold" fill="#1a1a1a">psi</text>

  <!-- Vertical Axis (x=355, from y=320 to 140) -->
  <line x1="355" y1="330" x2="355" y2="135" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr5)"/>
  <text x="355" y="128" text-anchor="middle" font-size="10" fill="#6b7280">+1</text>
  <text x="355" y="342" text-anchor="middle" font-size="10" fill="#6b7280">-1</text>

  <!-- Ticks along psi -->
  <!-- 0 deg at x=365 -->
  <line x1="365" y1="236" x2="365" y2="244" stroke="#6b7280" stroke-width="1"/>
  <text x="365" y="256" text-anchor="middle" font-size="10" fill="#6b7280">0°</text>

  <!-- 90 deg at x=425 -->
  <line x1="425" y1="236" x2="425" y2="244" stroke="#6b7280" stroke-width="1"/>
  <text x="425" y="256" text-anchor="middle" font-size="10" fill="#2457d6">90°</text>

  <!-- 180 deg at x=485 -->
  <line x1="485" y1="236" x2="485" y2="244" stroke="#6b7280" stroke-width="1"/>
  <text x="485" y="256" text-anchor="middle" font-size="10" fill="#c0392b">180°</text>

  <!-- 270 deg at x=545 -->
  <line x1="545" y1="236" x2="545" y2="244" stroke="#6b7280" stroke-width="1"/>
  <text x="545" y="256" text-anchor="middle" font-size="10" fill="#6b7280">270°</text>

  <!-- 360 deg at x=605 -->
  <line x1="605" y1="236" x2="605" y2="244" stroke="#6b7280" stroke-width="1"/>
  <text x="605" y="256" text-anchor="middle" font-size="10" fill="#6b7280">360°</text>

  <!-- Curve 1: Force / Pitch (blue solid, sine wave): 0 at 365, max at 425, 0 at 485, min at 545, 0 at 605 -->
  <path d="M365,240 C395,160 395,160 425,160 C455,160 455,240 485,240 C515,240 515,320 545,320 C575,320 575,240 605,240" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Curve 2: Flapping beta (red dashed, lag 90 deg, -cosine): min at 365, 0 at 425, max at 485, 0 at 545, min at 605 -->
  <path d="M365,320 C395,320 395,240 425,240 C455,240 455,160 485,160 C515,160 515,240 545,240 C575,240 575,320 605,320" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Phase Lag Indicator (between x=425 and 485 at y=150) -->
  <line x1="425" y1="150" x2="485" y2="150" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr5)" marker-end="url(#arr5)"/>
  <text x="455" y="144" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1a1a">Зсув 90°</text>

  <!-- Legend -->
  <line x1="350" y1="375" x2="380" y2="375" stroke="#2457d6" stroke-width="2.5"/>
  <text x="390" y="379" font-size="11" font-weight="bold" fill="#2457d6">Сила тяги F_aero(psi)</text>

  <line x1="350" y1="395" x2="380" y2="395" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="390" y="399" font-size="11" font-weight="bold" fill="#c0392b">Кут маху лопаті beta(psi)</text>

  <!-- Right Panel: Swashplate Lead Angle -->
  <rect x="660" y="75" width="275" height="365" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="675" y="102" font-size="14" font-weight="bold" fill="#27ae60">Кут випередження тяг</text>
  <text x="675" y="122" font-size="12" fill="#6b7280">Компенсація запізнення в автоматі</text>

  <text x="675" y="152" font-size="11" fill="#1a1a1a">• Щоб нахилити конус ротора вперед:</text>
  <text x="675" y="170" font-size="11" fill="#1a1a1a">  - Максимум маху має бути над носом</text>
  <text x="675" y="188" font-size="11" fill="#1a1a1a">  - Мінімум маху — над хвостом</text>
  <text x="675" y="206" font-size="11" fill="#1a1a1a">• Через 90° запізнення максимальну тягу</text>
  <text x="675" y="224" font-size="11" fill="#1a1a1a">  слід створити на правому борті (90°)</text>

  <rect x="673" y="248" width="249" height="110" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="683" y="270" font-size="12" font-weight="bold" fill="#27ae60">Конструктивне рішення:</text>
  <text x="683" y="290" font-size="11" fill="#1a1a1a">Тяги від обертової тарілки</text>
  <text x="683" y="308" font-size="11" fill="#1a1a1a">підключають до рогів лопатей</text>
  <text x="683" y="326" font-size="11" fill="#1a1a1a">зі зміщенням на 90° вперед</text>
  <text x="683" y="344" font-size="11" fill="#1a1a1a">за напрямком обертання</text>

  <text x="675" y="390" font-size="11" font-weight="bold" fill="#27ae60">Результат узгодження:</text>
  <text x="675" y="410" font-size="11" fill="#6b7280">Пряма відповідність руху ручки</text>
</svg>
