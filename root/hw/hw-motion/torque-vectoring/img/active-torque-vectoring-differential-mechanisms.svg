<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-torque-5" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінематична схема активного диференціала векторування тяги</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Планетарні прискорювальні ряди та фрикційні муфти для керованого перерозподілу моменту</text>

  <!-- Main Schematic Area -->
  <rect x="40" y="80" width="560" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Center: Main Open Differential -->
  <rect x="270" y="160" width="100" height="120" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="320" y="215" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Головна</text>
  <text x="320" y="235" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">передача</text>

  <!-- Left Axle segments (do not cross planetary box) -->
  <line x1="130" y1="220" x2="60" y2="220" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="270" y1="220" x2="210" y2="220" stroke="#1a1a1a" stroke-width="4"/>
  <rect x="60" y="180" width="20" height="80" rx="4" fill="#1a1a1a"/>
  <text x="70" y="170" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ліве колесо</text>

  <!-- Right Axle segments -->
  <line x1="370" y1="220" x2="430" y2="220" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="510" y1="220" x2="580" y2="220" stroke="#1a1a1a" stroke-width="4"/>
  <rect x="560" y="180" width="20" height="80" rx="4" fill="#1a1a1a"/>
  <text x="570" y="170" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Праве колесо</text>

  <!-- Left Speed-up Planetary & Clutch -->
  <rect x="130" y="175" width="80" height="90" rx="4" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="170" y="200" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Планетарка L</text>
  <text x="170" y="245" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Муфта L</text>

  <!-- Right Speed-up Planetary & Clutch -->
  <rect x="430" y="175" width="80" height="90" rx="4" fill="white" stroke="#27ae60" stroke-width="2"/>
  <text x="470" y="200" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Планетарка R</text>
  <text x="470" y="245" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Муфта R (ON)</text>

  <!-- Torque transfer arrow: Left -> Right -->
  <path d="M 170,300 Q 320,350 470,300" fill="none" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-torque-5)"/>
  <text x="320" y="355" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Перекидання моменту Delta tau = 1000 Н·м</text>

  <!-- Right: Technical Explanations Panel -->
  <rect x="620" y="80" width="300" height="345" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="770" y="110" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Принцип векторування</text>

  <rect x="635" y="130" width="270" height="75" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="645" y="152" font-size="12" font-weight="bold" fill="#2457d6">1. Планетарні ряди</text>
  <text x="645" y="172" font-size="11" fill="#1a1a1a">Мають передавальне відношення i = 1,1</text>
  <text x="645" y="188" font-size="11" fill="#6b7280">Створюють різницю швидкостей валів</text>

  <rect x="635" y="215" width="270" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="645" y="237" font-size="12" font-weight="bold" fill="#27ae60">2. Гідравлічні фрикціони</text>
  <text x="645" y="257" font-size="11" fill="#1a1a1a">Стискають потрібний пакет дисків</text>
  <text x="645" y="273" font-size="11" fill="#1a1a1a">Час спрацьовування 15-20 мс</text>
  <text x="645" y="289" font-size="11" fill="#6b7280">Передають до 70-80% тяги осі</text>

  <rect x="635" y="310" width="270" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="645" y="332" font-size="12" font-weight="bold" fill="#1a1a1a">3. Ефект на керованість</text>
  <text x="645" y="352" font-size="11" fill="#1a1a1a">Зовнішнє колесо штовхає сильніше</text>
  <text x="645" y="370" font-size="11" fill="#27ae60">Повертальний момент M_z вкручує авто</text>
  <text x="645" y="388" font-size="11" fill="#6b7280">Повна ліквідація недостатньої повертальності</text>
</svg>
