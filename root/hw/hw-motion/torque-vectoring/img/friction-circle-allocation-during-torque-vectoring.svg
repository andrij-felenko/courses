<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-force-6" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green-6" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red-6" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розподіл сил зчеплення за колом Камма під час повороту</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Векторування тяги оптимізує вектор сили коліс без перевищення ліміту зчеплення mu * Fz</text>

  <!-- Left: 4 Wheels Diagram Area -->
  <rect x="40" y="80" width="560" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Front Left Wheel Kamm Circle (x=160, y=160) -->
  <circle cx="160" cy="160" r="50" fill="white" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="160" y1="160" x2="160" y2="125" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-force-6)"/>
  <line x1="160" y1="160" x2="130" y2="160" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red-6)"/>
  <text x="160" y="98" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Переднє ліве (FL)</text>

  <!-- Front Right Wheel Kamm Circle (x=440, y=160) -->
  <circle cx="440" cy="160" r="50" fill="white" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="440" y1="160" x2="440" y2="120" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-force-6)"/>
  <line x1="440" y1="160" x2="475" y2="160" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green-6)"/>
  <text x="440" y="98" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Переднє праве (FR)</text>

  <!-- Rear Left Wheel Kamm Circle (x=160, y=320) -->
  <circle cx="160" cy="320" r="50" fill="white" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="160" y1="320" x2="160" y2="345" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red-6)"/>
  <line x1="160" y1="320" x2="130" y2="320" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red-6)"/>
  <text x="160" y="258" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Заднє ліве (RL, гальмує)</text>

  <!-- Rear Right Wheel Kamm Circle (x=440, y=320) -->
  <circle cx="440" cy="320" r="50" fill="white" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="440" y1="320" x2="440" y2="280" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-green-6)"/>
  <line x1="440" y1="320" x2="475" y2="320" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green-6)"/>
  <text x="440" y="258" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Заднє праве (RR, макс тяга)</text>

  <!-- Center Vehicle Body Contour -->
  <path d="M 240,130 h 120 v 220 h -120 z" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="300" y="245" font-size="12" fill="#6b7280" text-anchor="middle">Кузов авто</text>

  <!-- Right: Technical Details Panel -->
  <rect x="620" y="80" width="300" height="345" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="770" y="110" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Коло тертя Камма</text>

  <rect x="635" y="130" width="270" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="152" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Нерівність зчеплення:</text>
  <text x="770" y="174" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Fx^2 + Fy^2 &lt;= (mu * Fz)^2</text>
  <text x="770" y="196" font-size="11" fill="#6b7280" text-anchor="middle">Радіус кола пропорційний навантаженню Fz</text>

  <rect x="635" y="225" width="270" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="247" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Ефект TV в повороті:</text>
  <text x="770" y="267" font-size="11" fill="#1a1a1a" text-anchor="middle">• Збільшення Fx на навантаженому RR</text>
  <text x="770" y="285" font-size="11" fill="#1a1a1a" text-anchor="middle">• Зменшення Fx на розвантаженому RL</text>
  <text x="770" y="303" font-size="11" fill="#6b7280" text-anchor="middle">• Збереження бічної стійкості Fy</text>

  <rect x="635" y="330" width="270" height="80" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="352" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Без векторування (диференціал):</text>
  <text x="770" y="372" font-size="11" fill="#1a1a1a" text-anchor="middle">Внутрішнє колесо буксує і втрачає Fy</text>
  <text x="770" y="390" font-size="11" fill="#6b7280" text-anchor="middle">Автомобіль зносить назовні повороту</text>
</svg>
