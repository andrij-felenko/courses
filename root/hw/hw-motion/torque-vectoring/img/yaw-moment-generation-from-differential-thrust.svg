<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-yaw-7" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-force-7" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dim-7" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Генерація повертального моменту за рахунок різниці сил тяги</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Диференціальна поздовжня тяга коліс формує керуючий момент нишпорення Delta M_z</text>

  <!-- Left: Vehicle Diagram Area -->
  <rect x="40" y="80" width="560" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Vehicle Outline (Top View) -->
  <path d="M 220,120 Q 300,105 380,120 L 390,360 L 210,360 Z" fill="white" stroke="#2457d6" stroke-width="2"/>
  <circle cx="300" cy="240" r="6" fill="#1a1a1a"/>
  <text x="315" y="245" font-size="12" font-weight="bold" fill="#1a1a1a">ЦМ (CG)</text>

  <!-- Left Rear Wheel -->
  <rect x="190" y="320" width="18" height="60" rx="3" fill="#1a1a1a"/>
  <line x1="199" y1="320" x2="199" y2="280" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-force-7)"/>
  <text x="180" y="270" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">F_x,L (мала тяга)</text>

  <!-- Right Rear Wheel -->
  <rect x="392" y="320" width="18" height="60" rx="3" fill="#1a1a1a"/>
  <line x1="401" y1="320" x2="401" y2="210" stroke="#27ae60" stroke-width="3.5" marker-end="url(#arr-yaw-7)"/>
  <text x="420" y="200" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">F_x,R (велика тяга)</text>

  <!-- Track Width Dimension Line -->
  <line x1="199" y1="400" x2="401" y2="400" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="300" y="415" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Колія коліс B</text>

  <!-- Resulting Yaw Moment Arc around CG -->
  <path d="M 250,220 A 55,55 0 0,1 320,190" fill="none" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-yaw-7)"/>
  <text x="285" y="180" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">+ Delta M_z (вкручування)</text>

  <!-- Right: Equations & Physics Panel -->
  <rect x="620" y="80" width="300" height="345" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="770" y="110" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Математика векторування</text>

  <rect x="635" y="130" width="270" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="152" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Момент від різниці сил тяги:</text>
  <text x="770" y="174" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Delta M_z = (F_x,R - F_x,L) * B / 2</text>
  <text x="770" y="196" font-size="11" fill="#6b7280" text-anchor="middle">де B — ширина колії автомобіля</text>

  <rect x="635" y="225" width="270" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="247" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Зв'язок із крутним моментом:</text>
  <text x="770" y="268" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Delta M_z = (Delta T_wheel / R_w) * B / 2</text>
  <text x="770" y="290" font-size="11" fill="#1a1a1a" text-anchor="middle">При Delta T = 1000 Н·м та B = 1,6 м</text>
  <text x="770" y="306" font-size="11" fill="#27ae60" text-anchor="middle">Отримуємо Delta M_z ~ 2500 Н·м</text>

  <rect x="635" y="330" width="270" height="80" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="352" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Переваги активного керування:</text>
  <text x="770" y="372" font-size="11" fill="#1a1a1a" text-anchor="middle">• Менший кут повороту керма</text>
  <text x="770" y="390" font-size="11" fill="#6b7280" text-anchor="middle">• Стабільність на льоду та високій швидкості</text>
</svg>
