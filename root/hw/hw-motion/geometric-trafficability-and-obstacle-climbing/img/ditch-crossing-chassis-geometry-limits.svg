<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-cg-dt" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометричні межі подолання рову (канави) шасі</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Критична ширина рову W_trench відносно діаметра коліс, колісної бази та положення центру мас</text>

  <!-- Left: Ditch Crossing Kinematics Area -->
  <rect x="40" y="80" width="560" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Ground surface with trench -->
  <path d="M 60,320 L 220,320 L 220,410 L 380,410 L 380,320 L 580,320" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2"/>
  <text x="300" y="380" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Рів шириною W_trench</text>

  <!-- Vehicle bridging trench -->
  <circle cx="160" cy="270" r="50" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="440" cy="270" r="50" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 120,240 h 360 v 30 h -360 z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Center of mass CG -->
  <circle cx="280" cy="220" r="7" fill="#c0392b"/>
  <line x1="280" y1="220" x2="280" y2="260" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-cg-dt)"/>
  <text x="295" y="225" font-size="11" font-weight="bold" fill="#c0392b">ЦМ (CG)</text>

  <!-- Trench width dimension -->
  <line x1="220" y1="300" x2="380" y2="300" stroke="#c0392b" stroke-width="1.5"/>
  <text x="300" y="295" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">W_trench</text>

  <!-- Wheelbase dimension -->
  <line x1="160" y1="200" x2="440" y2="200" stroke="#2457d6" stroke-width="1.5"/>
  <text x="300" y="195" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Колісна база L_base</text>

  <!-- Right: Limits & Formulas Panel -->
  <rect x="620" y="80" width="300" height="345" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="770" y="110" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Умови непопадання в рів</text>

  <rect x="635" y="130" width="270" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="152" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Для колісного шасі 4х4:</text>
  <text x="770" y="174" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">W_max &lt;= 0,5...0,7 * D_wheel</text>
  <text x="770" y="196" font-size="11" fill="#6b7280" text-anchor="middle">При W &gt; R колесо падає на дно рову</text>

  <rect x="635" y="225" width="270" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="247" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Для багатоколісних платформ (6х6, 8х8):</text>
  <text x="770" y="270" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">W_max = L_bogie + 0,5 * D</text>
  <text x="770" y="292" font-size="11" fill="#1a1a1a" text-anchor="middle">Суміжні осі перекривають прірву,</text>
  <text x="770" y="308" font-size="11" fill="#6b7280" text-anchor="middle">утримуючи кузов від перекидання</text>

  <rect x="635" y="330" width="270" height="80" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="352" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Стабільність центру мас:</text>
  <text x="770" y="372" font-size="11" fill="#1a1a1a" text-anchor="middle">Проекція CG зобов'язана лишатися</text>
  <text x="770" y="390" font-size="11" fill="#6b7280" text-anchor="middle">всередині контуру опорних коліс</text>
</svg>
