<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометричні параметри прохідності колісного шасі</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Кути переднього та заднього звисів (в'їзду/з'їзду), поздовжній кут рампи та дорожній просвіт</text>

  <!-- Left: Chassis Diagram Area -->
  <rect x="40" y="80" width="560" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Ground Plane -->
  <line x1="60" y1="360" x2="580" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <text x="540" y="380" font-size="11" fill="#6b7280">Ґрунт</text>

  <!-- Wheels -->
  <circle cx="170" cy="310" r="50" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="170" cy="310" r="15" fill="#1a1a1a"/>
  <circle cx="450" cy="310" r="50" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="450" cy="310" r="15" fill="#1a1a1a"/>

  <!-- Vehicle Body Contour -->
  <path d="M 80,270 L 130,220 L 490,220 L 540,270 L 490,280 L 450,265 L 170,265 L 130,280 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Ground clearance h_clear -->
  <line x1="310" y1="360" x2="310" y2="265" stroke="#27ae60" stroke-width="2"/>
  <text x="325" y="320" font-size="11" font-weight="bold" fill="#27ae60">Кліренс h</text>

  <!-- Approach Angle alpha_1 (Front/Left) -->
  <line x1="170" y1="360" x2="80" y2="270" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="50" y="310" font-size="11" font-weight="bold" fill="#c0392b">Кут в'їзду</text>

  <!-- Departure Angle alpha_2 (Rear/Right) -->
  <line x1="450" y1="360" x2="540" y2="270" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="495" y="310" font-size="11" font-weight="bold" fill="#c0392b">Кут з'їзду</text>

  <!-- Ramp Angle beta_ramp -->
  <line x1="170" y1="360" x2="310" y2="265" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="450" y1="360" x2="310" y2="265" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="310" y="250" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Кут рампи beta</text>

  <!-- Right: Technical Details Panel -->
  <rect x="620" y="80" width="300" height="345" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="770" y="110" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Геометричні критерії</text>

  <rect x="635" y="130" width="270" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="152" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Кути звисів (в'їзду / з'їзду):</text>
  <text x="770" y="174" font-size="11" fill="#1a1a1a" text-anchor="middle">Визначають максимальний ухил чи ескарп,</text>
  <text x="770" y="192" font-size="11" fill="#1a1a1a" text-anchor="middle">який шасі долає без контакту бампера</text>

  <rect x="635" y="225" width="270" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="247" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Кут рампи (поздовжньої прохідності):</text>
  <text x="770" y="270" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">beta = 2 * arctg(2 * h / L_base)</text>
  <text x="770" y="292" font-size="11" fill="#1a1a1a" text-anchor="middle">Запобігає посадці на черево при переїзді</text>
  <text x="770" y="308" font-size="11" fill="#6b7280" text-anchor="middle">гостроверхих перешкод та бордюрів</text>

  <rect x="635" y="330" width="270" height="80" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="352" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Дорожній просвіт (кліренс):</text>
  <text x="770" y="372" font-size="11" fill="#1a1a1a" text-anchor="middle">Відстань від ґрунту до найнижчої точки</text>
  <text x="770" y="390" font-size="11" fill="#6b7280" text-anchor="middle">Для роботів-всюдиходів: h &gt;= 0,5 * R_wheel</text>
</svg>
