<rect x="150.0" y="344.0" width="550.0" height="30.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="425.0" y="362.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="425.0" dy="0.0">Два активні вікна дають +i_A та −i_C; третю фазу — з i_A + i_B + i_C = 0. Вікно тим ширше, чим більша різниця сусідніх шпаруватостей.</tspan></text>
<rect x="150.0" y="382.0" width="550.0" height="62.0" rx="6" fill="#fbfbfb" stroke="#333333" stroke-width="1.5"/><text x="425.0" y="410.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="425.0" dy="0.0">Таблиця «активний вектор → фаза в шунті»: увімкнено рівно один верхній ключ → струм = +тієї фази; вимкнено рівно один верхній → струм = −тієї фази.</tspan><tspan x="425.0" dy="11.7">Нуль-вектори (усі верхні вкл або всі вим) дають у шунті нуль — фаз не видно.</tspan></text>
