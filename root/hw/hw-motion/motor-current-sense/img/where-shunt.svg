<text x="430.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">1  Ланка постійного струму (DC-link)</text>
<rect x="430.0" y="98.0" width="300.0" height="63.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="580.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="580.0" dy="0.0">У плюсовому проводі до всього моста.</tspan><tspan x="580.0" dy="14.3">Один шунт бачить сумарний струм —</tspan><tspan x="580.0" dy="14.3">але не окрему фазу без реконструкції.</tspan></text>
<text x="430.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">2  Низька сторона фази (low-side)</text>
<rect x="430.0" y="203.0" width="300.0" height="63.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="580.0" dy="0.0">Під нижнім ключем плеча, у проводі</tspan><tspan x="580.0" dy="14.3">до землі. Дешево й просто, але видно</tspan><tspan x="580.0" dy="14.3">струм лише поки нижній ключ відкритий.</tspan></text>
<text x="430.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">3  У розрив фази (inline)</text>
<rect x="430.0" y="308.0" width="300.0" height="63.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="580.0" y="329.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="580.0" dy="0.0">Прямо у проводі до обмотки. Бачить</tspan><tspan x="580.0" dy="14.3">справжній струм фази щомиті, та висить</tspan><tspan x="580.0" dy="14.3">на комутованій напрузі — дорогий підсилювач.</tspan></text>
<text x="380.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Місце шунта визначає, ЩО ви бачите й ЯК складно це підсилити — це головний вибір теми</text>
</svg>