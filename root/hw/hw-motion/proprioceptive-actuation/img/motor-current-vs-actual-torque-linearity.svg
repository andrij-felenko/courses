<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-axis" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Залежність вихідного крутного моменту від струму статора Iq</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Квазіпрямий привід QDD зберігає лінійність без гістерезису на відміну від високоредукторного привода</text>

  <!-- Chart Area -->
  <rect x="50" y="80" width="470" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Axes -->
  <line x1="120" y1="380" x2="120" y2="110" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-axis)"/>
  <line x1="120" y1="380" x2="490" y2="380" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-axis)"/>

  <text x="120" y="98" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Момент tau [Н·м]</text>
  <text x="470" y="405" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Струм Iq [А]</text>

  <!-- QDD curve (Green) -->
  <line x1="120" y1="380" x2="460" y2="130" stroke="#27ae60" stroke-width="3"/>

  <!-- High-gear curve (Red) -->
  <path d="M 170,380 Q 230,350 300,280 T 460,110" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5,3"/>
  <path d="M 460,110 Q 380,200 260,320 T 120,355" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Legend in clear area -->
  <rect x="140" y="105" width="185" height="42" rx="4" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="150" y="123" font-size="12" font-weight="bold" fill="#27ae60">QDD привід (i = 6:1)</text>
  <text x="150" y="139" font-size="11" fill="#27ae60">tau = k_t * i * Iq (лінійно)</text>

  <rect x="140" y="160" width="185" height="42" rx="4" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="150" y="178" font-size="12" font-weight="bold" fill="#c0392b">Редукторний (i = 100:1)</text>
  <text x="150" y="194" font-size="11" fill="#c0392b">Петля тертя й гістерезис</text>

  <!-- Deadband bracket -->
  <line x1="120" y1="385" x2="170" y2="385" stroke="#c0392b" stroke-width="2"/>
  <text x="145" y="402" font-size="11" fill="#c0392b" text-anchor="middle">Мертва зона</text>

  <!-- Panels on the right -->
  <rect x="540" y="80" width="380" height="160" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="560" y="110" font-size="15" font-weight="bold" fill="#27ae60">Квазіпрямий привід (QDD)</text>
  <text x="560" y="135" font-size="13" fill="#1a1a1a">• Пряма пропорційність струму й моменту</text>
  <text x="560" y="160" font-size="13" fill="#1a1a1a">• Нульова зона нечутливості за силою</text>
  <text x="560" y="185" font-size="13" fill="#1a1a1a">• Висока механічна зворотність (прозорість)</text>
  <text x="560" y="210" font-size="13" fill="#1a1a1a">• Точна оцінка без датчиків F/T</text>

  <rect x="540" y="260" width="380" height="165" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="560" y="290" font-size="15" font-weight="bold" fill="#c0392b">Високоредукторний привід (i &gt; 50:1)</text>
  <text x="560" y="315" font-size="13" fill="#1a1a1a">• Велика ширина петлі гістерезису</text>
  <text x="560" y="340" font-size="13" fill="#1a1a1a">• Сухе тертя маскує зовнішній момент</text>
  <text x="560" y="365" font-size="13" fill="#1a1a1a">• Мертва зона за зусиллям до 1-3 Н·м</text>
  <text x="560" y="390" font-size="13" fill="#1a1a1a">• Потребує зовнішнього датчика моменту JTS</text>
</svg>
