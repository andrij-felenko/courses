<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Фон -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Моделі міцності зубів: згин за Льюїсом та контакт за Герцом</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Згин загрожує поломкою ніжки зуба, а контактні напруження викликають пітінг поверхні</text>

  <!-- Панель 1: Згин за Льюїсом -->
  <rect x="30" y="75" width="435" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">1. Згинальна модель Льюїса</text>
  <text x="247" y="122" text-anchor="middle" font-size="12" fill="#6b7280">Зуб як консольна балка рівного опору</text>

  <!-- Схема профілю зуба: основа на x=180..315, y=230, вершина на x=220..275, y=145 -->
  <!-- Контур зуба замкненим шляхом -->
  <path d="M 180 230 C 205 230 215 190 220 145 L 275 145 C 280 190 290 230 315 230 Z" fill="white" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Небезпечні зони концентрації напружень (галтелі) -->
  <circle cx="205" cy="218" r="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <circle cx="290" cy="218" r="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="135" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Розтяг σ_F</text>
  <text x="360" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Стиск σ_c</text>

  <!-- Тангенціальна сила F_t на вершині -->
  <line x1="220" y1="145" x2="165" y2="145" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="175" y="135" font-size="12" font-weight="bold" fill="#c0392b">Сила F_t</text>

  <!-- Товщина основи s_F -->
  <line x1="205" y1="238" x2="290" y2="238" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="247" y="252" text-anchor="middle" font-size="11" fill="#6b7280">Товщина ніжки зуба s_F</text>

  <!-- Інформаційний блок 1 -->
  <rect x="50" y="265" width="395" height="150" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="70" y="290" font-size="13" font-weight="bold" fill="#c0392b">Формула згину Льюїса:</text>
  <text x="70" y="312" font-size="12" font-weight="bold" fill="#2457d6">σ_F = (F_t · Y_F) / (b · m) ≤ [σ_F]</text>
  <text x="70" y="335" font-size="12" fill="#1a1a1a">• Y_F — безрозмірний коефіцієнт форми зуба</text>
  <text x="70" y="357" font-size="12" fill="#1a1a1a">• b — робоча ширина вінця, m — модуль</text>
  <text x="70" y="379" font-size="12" fill="#c0392b">• Максимальні розтяжні напруження діють у ніжці зуба</text>
  <text x="70" y="399" font-size="12" fill="#27ae60">Критерій: запобігання втомному зламу зуба</text>

  <!-- Панель 2: Контакт за Герцом -->
  <rect x="495" y="75" width="435" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">2. Контактні напруження Герца</text>
  <text x="712" y="122" text-anchor="middle" font-size="12" fill="#27ae60">Пружне притискання циліндричних поверхонь</text>

  <!-- Два циліндри в контакті: верхній R1 на y=150, нижній R2 на y=225, контакт на y=185 -->
  <path d="M 640 145 C 675 180 750 180 785 145" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M 640 225 C 675 190 750 190 785 225" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Смуга контакту шириною 2b на y=185 -->
  <line x1="685" y1="185" x2="740" y2="185" stroke="#c0392b" stroke-width="4"/>
  <!-- Еліптична епюра тиску Герца p(x) -->
  <path d="M 685 185 Q 712 160 740 185" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="712" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Пік σ_H (p_max)</text>

  <!-- Нормальна сила F_n -->
  <line x1="712" y1="130" x2="712" y2="155" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="720" y="140" font-size="12" font-weight="bold" fill="#1a1a1a">Сила F_n</text>

  <text x="560" y="189" font-size="12" fill="#6b7280">Ширина 2b</text>
  <text x="800" y="189" font-size="12" fill="#27ae60">Підповерхня: τ_max</text>

  <!-- Інформаційний блок 2 -->
  <rect x="515" y="265" width="395" height="150" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="535" y="290" font-size="13" font-weight="bold" fill="#2457d6">Формула контактного тиску Герца:</text>
  <text x="535" y="312" font-size="12" font-weight="bold" fill="#2457d6">σ_H = Z_H · Z_E · sqrt(w_t · (u ± 1) / (d_1 · u)) ≤ [σ_H]</text>
  <text x="535" y="335" font-size="12" fill="#1a1a1a">• Z_H — коефіцієнт форми, Z_E — модуль пружності сталі</text>
  <text x="535" y="357" font-size="12" fill="#1a1a1a">• Максимальний зсув τ_max діє на глибині z ≈ 0.78 · b</text>
  <text x="535" y="379" font-size="12" fill="#c0392b">• Перевищення веде до викришування металу (пітінгу)</text>
  <text x="535" y="399" font-size="12" fill="#27ae60">Критерій: довговічність контактних поверхонь за ресурсом</text>
</svg>
