<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Полотно -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Метод зупинки водила (перетворення Вілліса)</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Додавання обертання (-ω_h) до всіх ланок зупиняє водило та виявляє відносний рух</text>

  <!-- Ліва панель: Абсолютна система -->
  <rect x="30" y="75" width="415" height="265" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="237" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">1. Абсолютна система відліку</text>
  <text x="237" y="122" text-anchor="middle" font-size="12" fill="#6b7280">Водило обертається: складний рух осей сателітів</text>

  <!-- Схема ліворуч: центр (237, 210) -->
  <!-- Корона (кільце r=60) -->
  <circle cx="237" cy="210" r="60" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="4,4"/>
  <!-- Сонце r=22 -->
  <circle cx="237" cy="210" r="22" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <!-- Водило h (вертикальна лінія від центру до осі сателіта) -->
  <line x1="237" y1="210" x2="237" y2="170" stroke="#27ae60" stroke-width="3"/>
  <!-- Сателіт r=18 на осі (237, 170) -->
  <circle cx="237" cy="170" r="18" fill="white" stroke="#6b7280" stroke-width="2"/>
  <circle cx="237" cy="170" r="3" fill="#27ae60"/>
  <circle cx="237" cy="210" r="4" fill="#2457d6"/>

  <!-- Підписи ліворуч -->
  <text x="48" y="174" font-size="12" font-weight="bold" fill="#27ae60">Водило h: ω_h</text>
  <text x="48" y="214" font-size="12" font-weight="bold" fill="#2457d6">Сонце a: ω_a</text>
  <text x="48" y="254" font-size="12" font-weight="bold" fill="#1a1a1a">Корона b: ω_b</text>

  <text x="325" y="174" font-size="12" fill="#6b7280">Сателіт g</text>
  <text x="325" y="214" font-size="12" fill="#6b7280">Осі рухаються</text>

  <text x="237" y="322" text-anchor="middle" font-size="12" fill="#c0392b">Кінематика складна: переносний + відносний рух</text>

  <!-- Перехід між панелями: додаємо -ω_h -->
  <line x1="458" y1="195" x2="502" y2="195" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="480" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">- ω_h</text>
  <text x="480" y="222" text-anchor="middle" font-size="11" fill="#6b7280">зупинка</text>
  <text x="480" y="238" text-anchor="middle" font-size="11" fill="#6b7280">водила</text>

  <!-- Права панель: Звернена система -->
  <rect x="515" y="75" width="415" height="265" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="722" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">2. Звернена система (водило зупинене)</text>
  <text x="722" y="122" text-anchor="middle" font-size="12" fill="#27ae60">Водило нерухоме: передача з фіксованими осями</text>

  <!-- Схема праворуч: центр (722, 210) -->
  <!-- Корона (кільце r=60) -->
  <circle cx="722" cy="210" r="60" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="4,4"/>
  <!-- Сонце r=22 -->
  <circle cx="722" cy="210" r="22" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <!-- Водило h (зафіксоване, штриховка осі) -->
  <line x1="722" y1="210" x2="722" y2="170" stroke="#27ae60" stroke-width="3"/>
  <!-- Сателіт r=18 на осі (722, 170) -->
  <circle cx="722" cy="170" r="18" fill="white" stroke="#6b7280" stroke-width="2"/>
  <circle cx="722" cy="170" r="3" fill="#27ae60"/>
  <circle cx="722" cy="210" r="4" fill="#2457d6"/>

  <!-- Підписи праворуч -->
  <text x="532" y="174" font-size="12" font-weight="bold" fill="#27ae60">Водило: ω_h - ω_h = 0</text>
  <text x="532" y="214" font-size="12" font-weight="bold" fill="#2457d6">Сонце: ω_a - ω_h</text>
  <text x="532" y="254" font-size="12" font-weight="bold" fill="#1a1a1a">Корона: ω_b - ω_h</text>

  <text x="810" y="174" font-size="12" fill="#27ae60">Вісь нерухома</text>
  <text x="810" y="214" font-size="12" fill="#6b7280">Проста пара</text>

  <text x="722" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Звичайна передача: i_ab^(h) = - z_b / z_a</text>

  <!-- Нижня панель: формула Вілліса -->
  <rect x="30" y="355" width="900" height="85" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="385" text-anchor="middle" font-size="15" font-weight="bold" fill="#2457d6">Рівняння Вілліса: (ω_a - ω_h) / (ω_b - ω_h) = - z_b / z_a</text>
  <text x="480" y="408" text-anchor="middle" font-size="12" fill="#1a1a1a">При зафіксованій короні (ω_b = 0): передавальне відношення i_ah = ω_a / ω_h = 1 + z_b / z_a</text>
  <text x="480" y="426" text-anchor="middle" font-size="12" fill="#6b7280">Знак мінус показує протилежний напрямок обертання сонця та корони при зупиненому водилі</text>
</svg>
