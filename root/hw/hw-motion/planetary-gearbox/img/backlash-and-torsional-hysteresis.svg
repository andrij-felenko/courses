<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr2-main" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr2-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Крутильний люфт та крива пружного гістерезису</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Залежність кутової деформації від моменту: вільний хід (люфт) та зони жорсткості</text>

  <!-- LEFT VISUAL PANEL: Hysteresis Plot -->
  <rect x="24" y="80" width="510" height="356" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Dead zone shaded background -->
  <rect x="220" y="100" width="80" height="260" fill="#fdecea" opacity="0.7"/>

  <!-- Grid lines -->
  <line x1="70" y1="140" x2="490" y2="140" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="70" y1="320" x2="490" y2="320" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="140" y1="100" x2="140" y2="360" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="380" y1="100" x2="380" y2="360" stroke="#d0d7de" stroke-dasharray="3,3"/>

  <!-- Coordinate Axes: Center is (260, 230) -->
  <!-- X Axis: Angle theta -->
  <line x1="60" y1="230" x2="490" y2="230" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr2-main)"/>
  <!-- Y Axis: Torque T -->
  <line x1="260" y1="370" x2="260" y2="94" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr2-main)"/>

  <!-- Axis Labels -->
  <text x="495" y="246" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">Кут θ (arcmin)</text>
  <text x="268" y="108" font-size="12" font-weight="bold" fill="#1a1a1a">Момент T (Н·м)</text>

  <!-- Dead zone marker and dimension line -->
  <line x1="220" y1="230" x2="220" y2="200" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="300" y1="230" x2="300" y2="200" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="220" y1="205" x2="300" y2="205" stroke="#c0392b" stroke-width="1.5"/>
  <text x="260" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Люфт jt (мертва зона)</text>

  <!-- Hysteresis loading curve (Upper branch) -->
  <path d="M220,230 Q280,230 300,230 Q330,230 360,180 Q390,130 430,110" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <!-- Hysteresis unloading curve (Lower branch) -->
  <path d="M430,110 Q390,145 360,210 Q340,230 300,230 Q240,230 220,230 Q190,230 160,280 Q130,330 90,350" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <!-- Negative return branch -->
  <path d="M90,350 Q130,315 160,250 Q180,230 220,230" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Stiffness Slope line & label -->
  <line x1="330" y1="210" x2="410" y2="120" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="418" y="145" font-size="12" font-weight="bold" fill="#27ae60">Жорсткість Kt = dT/dθ</text>

  <!-- Labels on visual panel -->
  <text x="44" y="392" font-size="12" fill="#c0392b">● Червона зона: вільний бічний зазор у зачепленні зубів (jt ≤ 1..3 arcmin)</text>
  <text x="44" y="410" font-size="12" fill="#2457d6">● Синя петля: пружна деформація тіла шестерень та осей при навантаженні</text>
  <text x="44" y="428" font-size="12" fill="#27ae60">● Зелений нахил: крутильна жорсткість редуктора в робочій зоні контакту</text>

  <!-- RIGHT CARDS: Technical terms -->
  <!-- Card 1: Backlash -->
  <rect x="554" y="80" width="382" height="106" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="554" y="80" width="382" height="28" rx="6" fill="#fdecea"/>
  <text x="568" y="99" font-size="13" font-weight="bold" fill="#c0392b">1. Кутовий люфт (Backlash jt)</text>
  <text x="568" y="128" font-size="12" fill="#1a1a1a">Кут повороту вихідного вала при затиснутому вході та T = 0:</text>
  <text x="568" y="148" font-size="13" font-weight="bold" fill="#c0392b">jt = 1..3 arcmin (прецизійні) | &lt; 1 arcmin (з пренатягом)</text>
  <text x="568" y="168" font-size="12" fill="#6b7280">Боковий зазор для компенсації теплового розширення і мастила</text>

  <!-- Card 2: Torsional stiffness -->
  <rect x="554" y="200" width="382" height="112" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="554" y="200" width="382" height="28" rx="6" fill="#e9f7ef"/>
  <text x="568" y="219" font-size="13" font-weight="bold" fill="#27ae60">2. Крутильна жорсткість (Stiffness Kt)</text>
  <text x="568" y="248" font-size="12" fill="#1a1a1a">Кут пружного закручування деталей редуктора під навантаженням:</text>
  <text x="568" y="268" font-size="13" font-weight="bold" fill="#27ae60">Kt = ΔT / Δθ  [Н·м / arcmin або Н·м / рад]</text>
  <text x="568" y="292" font-size="12" fill="#6b7280">Складається з вигину зубів, підшипників та скручування водила</text>

  <!-- Card 3: Energy loss in loop -->
  <rect x="554" y="326" width="382" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="554" y="326" width="382" height="28" rx="6" fill="#f4f6f8"/>
  <text x="568" y="345" font-size="13" font-weight="bold" fill="#1a1a1a">3. Втрати гістерезису та демпфування</text>
  <text x="568" y="374" font-size="12" fill="#1a1a1a">Площа всередині петлі гістерезису — розсіяна енергія:</text>
  <text x="568" y="394" font-size="13" font-weight="bold" fill="#1a1a1a">Wloss = ∮ T · dθ  [Дж за повний цикл навантаження]</text>
  <text x="568" y="418" font-size="12" fill="#6b7280">Зумовлена мікроковзанням у контактах зубів та тертям у мастилі</text>
</svg>
