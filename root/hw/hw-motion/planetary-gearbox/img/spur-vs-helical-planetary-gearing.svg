<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr1" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr1-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr1-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr1-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Фон -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Прямозубе та косозубе зачеплення сателітів</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Косозуба геометрія збільшує коефіцієнт перекриття, але вимагає сприйняття осьової сили</text>

  <!-- Панель 1: Прямозубе зачеплення -->
  <rect x="30" y="75" width="435" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">1. Прямозуба геометрія (Spur)</text>
  <text x="247" y="122" text-anchor="middle" font-size="12" fill="#6b7280">Миттєвий ударний контакт по всій ширині зуба</text>

  <!-- Схема зуба прямозубого: прямокутна грань x=160..330, y=145..225 -->
  <rect x="175" y="145" width="145" height="80" rx="4" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Пряма лінія контакту (червона) -->
  <line x1="247" y1="145" x2="247" y2="225" stroke="#c0392b" stroke-width="3"/>
  <circle cx="247" cy="185" r="4" fill="#c0392b"/>

  <!-- Вектори сил: F_t (вгору), F_r (вправо) -->
  <line x1="247" y1="185" x2="247" y2="155" stroke="#2457d6" stroke-width="2" marker-end="url(#arr1-blue)"/>
  <text x="255" y="165" font-size="12" font-weight="bold" fill="#2457d6">F_t</text>

  <line x1="247" y1="185" x2="285" y2="185" stroke="#27ae60" stroke-width="2" marker-end="url(#arr1-green)"/>
  <text x="290" y="180" font-size="12" font-weight="bold" fill="#27ae60">F_r</text>

  <text x="60" y="185" font-size="12" font-weight="bold" fill="#c0392b">Лінія контакту</text>
  <text x="247" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Осьова сила F_a = 0</text>

  <!-- Інформаційний блок 1 -->
  <rect x="50" y="265" width="395" height="150" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="70" y="292" font-size="13" font-weight="bold" fill="#1a1a1a">Характеристики прямозубої передачі:</text>
  <text x="70" y="318" font-size="12" fill="#1a1a1a">• Лінія контакту: паралельна осі обертання</text>
  <text x="70" y="340" font-size="12" fill="#1a1a1a">• Коефіцієнт торцевого перекриття: ε_α ≈ 1.1 ... 1.3</text>
  <text x="70" y="362" font-size="12" fill="#1a1a1a">• Відсутні осьові сили на підшипниках сателітів</text>
  <text x="70" y="384" font-size="12" fill="#c0392b">• Пульсація жорсткості та підвищений шум при роботі</text>
  <text x="70" y="404" font-size="12" fill="#6b7280">Застосування: прості приводи загального машинобудування</text>

  <!-- Панель 2: Косозубе зачеплення -->
  <rect x="495" y="75" width="435" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">2. Косозуба геометрія (Helical)</text>
  <text x="712" y="122" text-anchor="middle" font-size="12" fill="#27ae60">Плавний косий вхід зубів та висока плавність</text>

  <!-- Схема зуба косозубого: прямокутна грань x=640..785, y=145..225 -->
  <rect x="640" y="145" width="145" height="80" rx="4" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Похила лінія контакту (зелена/синя) під кутом beta -->
  <line x1="660" y1="225" x2="765" y2="145" stroke="#27ae60" stroke-width="3"/>
  <circle cx="712" cy="185" r="4" fill="#27ae60"/>

  <!-- Вектори сил: F_t (вгору), F_r (вправо), F_a (вниз) -->
  <line x1="712" y1="185" x2="712" y2="155" stroke="#2457d6" stroke-width="2" marker-end="url(#arr1-blue)"/>
  <text x="720" y="165" font-size="12" font-weight="bold" fill="#2457d6">F_t</text>

  <line x1="712" y1="185" x2="750" y2="185" stroke="#27ae60" stroke-width="2" marker-end="url(#arr1-green)"/>
  <text x="755" y="180" font-size="12" font-weight="bold" fill="#27ae60">F_r</text>

  <line x1="712" y1="185" x2="712" y2="215" stroke="#c0392b" stroke-width="2" marker-end="url(#arr1-red)"/>
  <text x="720" y="215" font-size="12" font-weight="bold" fill="#c0392b">F_a</text>

  <text x="525" y="185" font-size="12" font-weight="bold" fill="#27ae60">Похилий контакт</text>
  <text x="712" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Осьова сила: F_a = F_t · tan(β)</text>

  <!-- Інформаційний блок 2 -->
  <rect x="515" y="265" width="395" height="150" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="535" y="292" font-size="13" font-weight="bold" fill="#2457d6">Характеристики косозубої передачі:</text>
  <text x="535" y="318" font-size="12" fill="#1a1a1a">• Лінія контакту: нахилена під кутом нахилу β (10°...15°)</text>
  <text x="535" y="340" font-size="12" fill="#1a1a1a">• Сумарне перекриття: ε_γ = ε_α + ε_β > 2.0 ... 2.5</text>
  <text x="535" y="362" font-size="12" fill="#27ae60">• Безперервна передача моменту кількома парами зубів</text>
  <text x="535" y="384" font-size="12" fill="#2457d6">• Висока тиша ходу та мінімальний люфт (&lt; 1–3 кут. мін)</text>
  <text x="535" y="404" font-size="12" fill="#6b7280">Застосування: прецизійні сервоприводи роботів та ЧПК</text>
</svg>
