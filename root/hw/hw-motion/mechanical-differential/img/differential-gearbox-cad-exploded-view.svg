<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вибух-схема складання малогабаритного конічного диференціала</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Послідовність монтажу сателітної коробки, конічних шестерень та електромагнітної муфти</text>

  <!-- Central Assembly Axis -->
  <line x1="50" y1="215" x2="910" y2="215" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Exploded Components from Left to Right -->
  <!-- 1. Left Axle Gear -->
  <rect x="70" y="165" width="80" height="100" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="110" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Ліва</text>
  <text x="110" y="230" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">шестерня</text>
  <text x="110" y="295" font-size="12" fill="#1a1a1a" text-anchor="middle">1. Піввісь L</text>

  <!-- 2. Satellite Cross & Bevel Satellites -->
  <rect x="200" y="145" width="100" height="140" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="250" y="205" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Хрестовина та</text>
  <text x="250" y="225" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">сателіти (4 шт)</text>
  <text x="250" y="305" font-size="12" fill="#1a1a1a" text-anchor="middle">2. Сателітний вузол</text>

  <!-- 3. Right Axle Gear -->
  <rect x="350" y="165" width="80" height="100" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="390" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Права</text>
  <text x="390" y="230" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">шестерня</text>
  <text x="390" y="295" font-size="12" fill="#1a1a1a" text-anchor="middle">3. Піввісь R</text>

  <!-- 4. Differential Housing (Carrier) -->
  <rect x="480" y="135" width="120" height="160" rx="8" fill="#white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="540" y="205" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Корпус чашки</text>
  <text x="540" y="225" font-size="12" fill="#6b7280" text-anchor="middle">Зубчастий вінець</text>
  <text x="540" y="315" font-size="12" fill="#1a1a1a" text-anchor="middle">4. Чашка диференціала</text>

  <!-- 5. Friction Clutch Pack -->
  <rect x="640" y="155" width="90" height="120" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="685" y="205" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Фрикційний</text>
  <text x="685" y="225" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">пакет дисків</text>
  <text x="685" y="295" font-size="12" fill="#1a1a1a" text-anchor="middle">5. Муфта LSD</text>

  <!-- 6. Electromagnetic Solenoid Actuator -->
  <rect x="770" y="145" width="120" height="140" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="830" y="205" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Електромагніт</text>
  <text x="830" y="225" font-size="12" fill="#1a1a1a" text-anchor="middle">Соленоїд тиску</text>
  <text x="830" y="305" font-size="12" fill="#1a1a1a" text-anchor="middle">6. Привод блокування</text>

  <!-- Bottom Panel: Assembly & Clearances Guide -->
  <rect x="30" y="345" width="900" height="95" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="370" font-size="13" font-weight="bold" fill="#1a1a1a">Ключові інженерні допуски та вимоги до складання:</text>
  <text x="50" y="392" font-size="12" fill="#2457d6">• Бічний зазор конічного зачеплення (backlash): 0.08..0.12 мм регулюється дистанційними шайбами підшипників.</text>
  <text x="50" y="412" font-size="12" fill="#27ae60">• Зусилля стиснення електромагнітної муфти регулюється ШІМ-струмом: від вільного стану (0A) до блокування (2.5A).</text>
  <text x="50" y="430" font-size="12" fill="#6b7280">• Радіально-упорні кулькопідшипники сприймають осьовий розпір конічних шестерень при пікових тягових моментах.</text>
</svg>
