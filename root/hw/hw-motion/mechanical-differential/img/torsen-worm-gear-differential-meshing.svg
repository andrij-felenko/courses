<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінематика черв'ячного зачеплення Torsen (Type A)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Розклинювання черв'ячних пар під час буксування та вільна диференціація в поворотах</text>

  <!-- Left Panel: Gear Intermeshing -->
  <rect x="30" y="75" width="435" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="45" y="90" width="405" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="111" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Пара черв'ячне колесо — черв'як</text>

  <!-- Wheel and Worm Blocks -->
  <rect x="70" y="145" width="130" height="90" rx="6" fill="white" stroke="#2457d6" stroke-width="2"/>
  <text x="135" y="185" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Черв'ячне колесо</text>
  <text x="135" y="210" font-size="12" fill="#1a1a1a" text-anchor="middle">Піввісь</text>

  <line x1="205" y1="190" x2="275" y2="190" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="285" y="145" width="140" height="90" rx="6" fill="white" stroke="#27ae60" stroke-width="2"/>
  <text x="355" y="185" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Черв'як-сателіт</text>
  <text x="355" y="210" font-size="12" fill="#1a1a1a" text-anchor="middle">Корпус диференціала</text>

  <!-- Physics Box below -->
  <rect x="45" y="255" width="405" height="165" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="280" font-size="12" font-weight="bold" fill="#1a1a1a">Невзаємність коефіцієнта корисної дії:</text>
  <text x="60" y="303" font-size="12" fill="#27ae60">1. Прямий хід (колесо крутить черв'як):</text>
  <text x="75" y="323" font-size="12" fill="#1a1a1a">ККД eta_fwd ≈ 80% — плавна різниця швидкостей у повороті.</text>
  <text x="60" y="350" font-size="12" fill="#c0392b">2. Зворотний хід (черв'як намагається крутити колесо):</text>
  <text x="75" y="370" font-size="12" fill="#1a1a1a">ККД eta_rev падає до 20% через високе тертя розклинювання.</text>
  <text x="60" y="398" font-size="12" fill="#6b7280">Буксуюче колесо не може неконтрольовано розкрутити сателіти.</text>

  <!-- Right Panel: Torque Transfer Dynamics -->
  <rect x="495" y="75" width="435" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="510" y="90" width="405" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="712" y="111" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Розподіл крутних моментів TBR</text>

  <!-- Summary Cards -->
  <rect x="510" y="135" width="405" height="115" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="525" y="160" font-size="13" font-weight="bold" fill="#27ae60">Переваги черв'ячного Torsen:</text>
  <text x="525" y="185" font-size="12" fill="#1a1a1a">• Чисто механічне блокування без затримок і електроніки;</text>
  <text x="525" y="208" font-size="12" fill="#1a1a1a">• Відсутність фрикційних дисків: ресурс дорівнює ресурсу редуктора;</text>
  <text x="525" y="230" font-size="12" fill="#2457d6">• Стабільний коефіцієнт блокування TBR від 3.0:1 до 5.0:1.</text>

  <rect x="510" y="265" width="405" height="155" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="290" font-size="12" font-weight="bold" fill="#1a1a1a">Робота при нульовому зчепленні (колесо в повітрі):</text>
  <text x="525" y="315" font-size="12" fill="#c0392b">Якщо опір буксуючого колеса T_low = 0:</text>
  <text x="525" y="338" font-size="12" fill="#1a1a1a">T_high = TBR · 0 = 0 (автомобіль зупиняється).</text>
  <text x="525" y="365" font-size="12" font-weight="bold" fill="#2457d6">Інженерне рішення:</text>
  <text x="525" y="388" font-size="12" fill="#1a1a1a">Система електронного гальмування EDL підтискає буксуюче колесо,</text>
  <text x="525" y="406" font-size="12" fill="#6b7280">створюючи базовий момент T_low для активації розклинювання Torsen.</text>
</svg>
