<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Кінематична схема диференціального повороту Клетрака (Cletrac)</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Керуючі гальма на сонячних шестернях забезпечують поворот гусениць без розриву потоку потужності</text>

  <!-- Main Kinematic Box -->
  <rect x="30" y="75" width="560" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="45" y="90" width="530" height="30" rx="4" fill="#eaf0fd"/>
  <text x="310" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Планетарний диференціал з додатковими гальмівними шківами</text>

  <!-- Central Drive Shaft (split so it does not cross text) -->
  <line x1="310" y1="125" x2="310" y2="135" stroke="#1a1a1a" stroke-width="3"/>
  <text x="310" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Вхідний вал (від КПП)</text>
  <line x1="310" y1="158" x2="310" y2="175" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Differential Carrier (Водило) -->
  <rect x="220" y="175" width="180" height="135" rx="6" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="310" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Водило H</text>

  <!-- Sun Gears and Side Shafts -->
  <!-- Left Side Shaft -->
  <line x1="60" y1="240" x2="220" y2="240" stroke="#1a1a1a" stroke-width="4"/>
  <rect x="60" y="215" width="30" height="50" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="75" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Гусениця L</text>

  <!-- Left Steering Brake -->
  <rect x="130" y="200" width="24" height="80" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="142" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Гальмо L</text>

  <!-- Right Side Shaft -->
  <line x1="400" y1="240" x2="560" y2="240" stroke="#1a1a1a" stroke-width="4"/>
  <rect x="530" y="215" width="30" height="50" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="545" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Гусениця R</text>

  <!-- Right Steering Brake -->
  <rect x="465" y="200" width="24" height="80" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="477" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Гальмо R</text>

  <!-- Planetary gear meshes inside carrier -->
  <circle cx="270" cy="240" r="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="270" y="244" text-anchor="middle" font-size="12" fill="#1a1a1a">Сат.1</text>
  <circle cx="350" cy="240" r="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="350" y="244" text-anchor="middle" font-size="12" fill="#1a1a1a">Сат.2</text>

  <!-- Bottom panel note -->
  <rect x="45" y="340" width="530" height="75" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="60" y="362" font-size="12" font-weight="bold" fill="#1a1a1a">Принцип керування траєкторією:</text>
  <text x="60" y="382" font-size="12" fill="#1a1a1a">Затискання лівого гальма уповільнює сонячну шестерню лівого борту,</text>
  <text x="60" y="400" font-size="12" fill="#27ae60">а планетарний ряд пропорційно прискорює правий борт без буксування фрикціонів.</text>


  <!-- Right Panel: Characteristics Card -->
  <rect x="610" y="75" width="320" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="625" y="90" width="290" height="30" rx="4" fill="#eaf0fd"/>
  <text x="770" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Переваги схеми Cletrac</text>

  <rect x="625" y="135" width="290" height="65" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="640" y="157" font-size="12" font-weight="bold" fill="#27ae60">1. Безперервна передача тяги:</text>
  <text x="640" y="177" font-size="12" fill="#1a1a1a">Обидві гусениці тягнуть у повороті</text>
  <text x="640" y="193" font-size="12" fill="#6b7280">(немає знеструмлення відстаючого борту)</text>

  <rect x="625" y="215" width="290" height="65" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="640" y="237" font-size="12" font-weight="bold" fill="#2457d6">2. Фіксований радіус повороту R:</text>
  <text x="640" y="257" font-size="13" font-weight="bold" fill="#2457d6">R_turn = B · (v_out + v_in) / (2 · Δv)</text>
  <text x="640" y="273" font-size="12" fill="#6b7280">Чітка кінематична траєкторія машини</text>

  <rect x="625" y="295" width="290" height="120" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="640" y="317" font-size="12" font-weight="bold" fill="#1a1a1a">3. Високий ККД трансмісії:</text>
  <text x="640" y="337" font-size="12" fill="#1a1a1a">Енергія не спалюється у фрикціонах,</text>
  <text x="640" y="357" font-size="12" fill="#1a1a1a">а перенаправляється на забігаючу</text>
  <text x="640" y="377" font-size="12" fill="#1a1a1a">гусеницю через зубове зачеплення.</text>

</svg>
