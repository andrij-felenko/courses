<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінематична схема керованого подвійного диференціала Cletrac (Вайт, 1916)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Регенеративний поворот гусеничної машини без розриву потоку тяги та без спалювання енергії у фрикціонах</text>

  <!-- Left Panel: Kinematic Architecture -->
  <rect x="30" y="75" width="435" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="45" y="90" width="405" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="111" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Планетарна архітектура з двома гальмами</text>

  <!-- Central Input Shaft -->
  <rect x="217" y="135" width="60" height="35" rx="4" fill="#2457d6"/>
  <text x="247" y="157" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Вхід КПП</text>

  <!-- Main Differential Box -->
  <rect x="162" y="185" width="170" height="55" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247" y="208" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Центральний диференціал</text>
  <text x="247" y="228" font-size="12" fill="#6b7280" text-anchor="middle">Розподіл крутного моменту</text>

  <!-- Left and Right Steering Planetary Sets -->
  <rect x="45" y="260" width="180" height="85" rx="6" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="135" y="285" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Ліве кермове гальмо</text>
  <text x="135" y="308" font-size="12" fill="#1a1a1a" text-anchor="middle">Планетарна ступінь</text>
  <text x="135" y="330" font-size="12" fill="#6b7280" text-anchor="middle">Гальмо затиснуте: omega_L падає</text>

  <rect x="270" y="260" width="180" height="85" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="360" y="285" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Праве кермове гальмо</text>
  <text x="360" y="308" font-size="12" fill="#1a1a1a" text-anchor="middle">Планетарна ступінь</text>
  <text x="360" y="330" font-size="12" fill="#6b7280" text-anchor="middle">Вільне: omega_R зростає</text>

  <!-- Summary below -->
  <rect x="45" y="360" width="405" height="60" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="55" y="383" font-size="12" font-weight="bold" fill="#27ae60">Прямолінійний рух:</text>
  <text x="55" y="403" font-size="12" fill="#1a1a1a">Обидва гальма відпущені: вали обертаються синхронно omega_L = omega_R.</text>

  <!-- Right Panel: Regenerative Turn Dynamics -->
  <rect x="495" y="75" width="435" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="510" y="90" width="405" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="712" y="111" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Регенеративне перекачування потужності</text>

  <!-- Comparison Cletrac vs Traditional Clutches -->
  <rect x="510" y="135" width="405" height="135" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="160" font-size="13" font-weight="bold" fill="#1a1a1a">Кінематика повороту ліворуч:</text>
  <text x="525" y="185" font-size="12" fill="#c0392b">1. Затискається ліве керуюче гальмо сонячної шестерні;</text>
  <text x="525" y="208" font-size="12" fill="#1a1a1a">2. Ліва гусениця сповільнюється до omega_L = (1 - k) · omega_0;</text>
  <text x="525" y="231" font-size="12" fill="#27ae60">3. Через сателіти диференціала надлишок швидкості передається направо:</text>
  <text x="545" y="254" font-size="12" font-weight="bold" fill="#2457d6">omega_R = (1 + k) · omega_0 (прискорення зовнішнього борту)</text>

  <!-- Advantages box -->
  <rect x="510" y="285" width="405" height="135" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="525" y="310" font-size="13" font-weight="bold" fill="#27ae60">Переваги схеми Cletrac над бортовими фрикціонами:</text>
  <text x="525" y="333" font-size="12" fill="#1a1a1a">• 100% збереження тяги: машина не зупиняється на ріллі чи багнюці</text>
  <text x="525" y="356" font-size="12" fill="#1a1a1a">• Енергія гальмування лівого борту перетворюється на тягу правого</text>
  <text x="525" y="379" font-size="12" fill="#1a1a1a">• Фіксований радіус повороту R = B · (1 + k) / (2k) без зриву ґрунту</text>
  <text x="525" y="402" font-size="12" fill="#6b7280">• Зношення гальм у 5–7 разів нижче, ніж у простих розривних муфт</text>
</svg>
