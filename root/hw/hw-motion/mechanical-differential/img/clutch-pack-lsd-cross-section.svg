<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Конструкція дискового LSD: розклинювальні чашки та фрикційні пакети</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Крутний момент створює розпірне осьове зусилля F_axial, що стискає пакети дисків</text>

  <!-- Left: Cross-section schematic -->
  <rect x="30" y="75" width="530" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="45" y="90" width="500" height="30" rx="4" fill="#eaf0fd"/>
  <text x="295" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Механізм розклинювання нажимних чашок (Salisbury)</text>

  <!-- Outer housing (чашка) -->
  <rect x="70" y="145" width="450" height="220" rx="6" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="295" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Корпус чашки диференціала (обертається з вхідним T_in)</text>

  <!-- Left clutch pack -->
  <rect x="85" y="180" width="45" height="150" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="95" y1="180" x2="95" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="105" y1="180" x2="105" y2="330" stroke="#2457d6" stroke-width="2"/>
  <line x1="115" y1="180" x2="115" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="120" y1="180" x2="120" y2="330" stroke="#2457d6" stroke-width="2"/>
  <text x="107" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Пакет 1</text>

  <!-- Right clutch pack -->
  <rect x="460" y="180" width="45" height="150" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="470" y1="180" x2="470" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="480" y1="180" x2="480" y2="330" stroke="#2457d6" stroke-width="2"/>
  <line x1="490" y1="180" x2="490" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="495" y1="180" x2="495" y2="330" stroke="#2457d6" stroke-width="2"/>
  <text x="482" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Пакет 2</text>

  <!-- Left Pressure Ring with V-ramp -->
  <path d="M 150,190 L 220,190 L 250,230 L 220,270 L 150,270 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="190" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Кільце L</text>
  <!-- Force arrow Left -->
  <line x1="170" y1="210" x2="135" y2="210" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="145" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">F_ax</text>

  <!-- Right Pressure Ring with V-ramp -->
  <path d="M 440,190 L 370,190 L 340,230 L 370,270 L 440,270 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="400" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Кільце R</text>
  <!-- Force arrow Right -->
  <line x1="420" y1="210" x2="455" y2="210" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="445" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">F_ax</text>

  <!-- Pinion Cross-pin (палець сателітів у V-рампі) -->
  <circle cx="295" cy="230" r="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="295" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Палець</text>

  <!-- Bottom note in left panel -->
  <rect x="45" y="380" width="500" height="40" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="55" y="405" font-size="12" fill="#1a1a1a">Осьова розпірна сила пропорційна вхідному моменту: F_ax ~ T_in · cot(gamma)</text>


  <!-- Right: Ramp Angles & Physics Cards -->
  <rect x="580" y="75" width="350" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="595" y="90" width="320" height="30" rx="4" fill="#eaf0fd"/>
  <text x="755" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Геометрія рамп та типи блокувань</text>

  <!-- Card 1: 1-way -->
  <rect x="595" y="130" width="320" height="60" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="610" y="150" font-size="12" font-weight="bold" fill="#2457d6">1-way LSD (лише під тягою):</text>
  <text x="610" y="170" font-size="12" fill="#1a1a1a">Блокується на тязі, вільний при скиданні</text>

  <!-- Card 2: 1.5-way -->
  <rect x="595" y="200" width="320" height="65" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="610" y="220" font-size="12" font-weight="bold" fill="#27ae60">1.5-way LSD (асиметричні кути):</text>
  <text x="610" y="238" font-size="12" fill="#1a1a1a">Тяга: 35° (сильно) | Гальмування: 60° (м'яко)</text>
  <text x="610" y="254" font-size="12" fill="#6b7280">Стабілізує курс без знесення передка</text>

  <!-- Card 3: 2-way -->
  <rect x="595" y="275" width="320" height="65" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="610" y="295" font-size="12" font-weight="bold" fill="#c0392b">2-way LSD (симетричні 45°/45°):</text>
  <text x="610" y="315" font-size="12" fill="#1a1a1a">Рівне блокування на тязі та гальмуванні</text>
  <text x="610" y="331" font-size="12" fill="#6b7280">Для дрифту та важких всюдиходів</text>

  <!-- Formula box -->
  <rect x="595" y="350" width="320" height="70" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="610" y="372" font-size="12" font-weight="bold" fill="#1a1a1a">Момент блокування тертям:</text>
  <text x="610" y="392" font-size="13" font-weight="bold" fill="#2457d6">T_fric = 2 · n · mu · (F_pr + F_ax) · R_eff</text>
  <text x="610" y="410" font-size="12" fill="#6b7280">F_pr — преднатяг тарілчастими пружинами</text>

</svg>
