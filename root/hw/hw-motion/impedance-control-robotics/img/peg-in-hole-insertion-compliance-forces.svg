<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-force" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Силова взаємодія при складанні деталей «вал у втулку»</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Кутовий і бічний перекоси компенсуються податливістю інструмента без заклинювання</text>

  <!-- Left: Jamming Risk Area -->
  <rect x="40" y="80" width="430" height="345" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="255" y="110" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Жорстке позиціонування: ризик заклинювання</text>

  <!-- Chamfered hole left: y from 220 to 320 -->
  <rect x="100" y="220" width="70" height="100" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="170,220 185,245 185,320 170,320" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="340" y="220" width="70" height="100" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="340,220 325,245 325,320 340,320" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Tilted Peg left -->
  <polygon points="215,130 295,145 280,270 200,255" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="250" y="195" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Вал</text>

  <!-- Contact forces left -->
  <line x1="200" y1="255" x2="165" y2="270" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-force)"/>
  <text x="145" y="295" font-size="12" font-weight="bold" fill="#c0392b">F_1</text>

  <line x1="280" y1="270" x2="315" y2="255" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-force)"/>
  <text x="340" y="260" font-size="12" font-weight="bold" fill="#c0392b">F_2</text>

  <!-- Warning card placed in clear bottom area (y=345 to 405) -->
  <rect x="60" y="345" width="390" height="60" rx="6" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="255" y="370" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Двоточкове заклинювання (Wedging)</text>
  <text x="255" y="390" font-size="11" fill="#1a1a1a" text-anchor="middle">Сили сухого тертя блокують подальше просування вала</text>

  <!-- Right: Compliant Assembly Area -->
  <rect x="490" y="80" width="430" height="345" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="705" y="110" font-size="15" font-weight="bold" fill="#27ae60" text-anchor="middle">Імпедансне складання: плавне центрування</text>

  <!-- Chamfered hole right: y from 220 to 320 -->
  <rect x="550" y="220" width="70" height="100" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="620,220 635,245 635,320 620,320" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="790" y="220" width="70" height="100" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="790,220 775,245 775,320 790,320" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Aligned Peg right -->
  <rect x="665" y="145" width="80" height="150" rx="2" fill="#eaf0fd" stroke="#27ae60" stroke-width="2"/>
  <text x="705" y="210" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Вал</text>

  <!-- Centering arrows -->
  <line x1="635" y1="245" x2="663" y2="245" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="775" y1="245" x2="747" y2="245" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="510" y="345" width="390" height="60" rx="6" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="705" y="370" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Контрольована декартова податливість</text>
  <text x="705" y="390" font-size="11" fill="#1a1a1a" text-anchor="middle">Центр податливості на торці усуває перекоси, знижуючи силу монтажу</text>
</svg>
