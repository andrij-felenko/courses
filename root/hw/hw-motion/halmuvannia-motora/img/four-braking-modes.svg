<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння чотирьох режимів гальмування приводу в H-мості</text>
<rect x="20.0" y="50.0" width="205.0" height="395.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/>
<rect x="24.4" y="60.5" width="196.1" height="23.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="122.5" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="122.5" dy="0.0">1. Вільний вибіг (Coasting)</tspan></text>
<text x="30.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Стан ключів:</text>
<text x="30.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Усі 4 MOSFET закриті (Hi-Z)</text>
<text x="30.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Струм:</text>
<text x="30.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">I = 0 (після спаду в L)</text>
<text x="30.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Гальмівний момент:</text>
<text x="30.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Лише тертя й навантаження</text>
<text x="30.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Куди дівається енергія:</text>
<text x="30.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Механічні втрати, вибіг</text>
<text x="30.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Ризик:</text>
<text x="30.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Неконтрольований рух</text>
<rect x="30.0" y="290.0" width="185.0" height="140.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<circle cx="122.5" cy="355.0" r="20.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="122.5" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">M</text>
<text x="122.5" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Q1 [Вимк]    Q2 [Вимк]</text>
<text x="122.5" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Q3 [Вимк]    Q4 [Вимк]</text>
<text x="122.5" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">Коло розірване (Hi-Z)</text>
<rect x="235.0" y="50.0" width="205.0" height="395.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/>
<rect x="249.7" y="60.5" width="175.7" height="23.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="337.5" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="337.5" dy="0.0">2. Динамічне гальмування</tspan></text>
<text x="245.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Стан ключів:</text>
<text x="245.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Нижні ключі Q3, Q4 ON</text>
<text x="245.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Струм:</text>
<text x="245.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Замкнений у контурі моста</text>
<text x="245.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Гальмівний момент:</text>
<text x="245.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Tb = (kt·ke·ω) / R_tot</text>
<text x="245.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Куди дівається енергія:</text>
<text x="245.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Тепло в обмотках (I²·R)</text>
<text x="245.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Ризик:</text>
<text x="245.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Нагрів мотора, слабне при ω→0</text>
<rect x="245.0" y="290.0" width="185.0" height="140.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<circle cx="337.5" cy="355.0" r="20.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="337.5" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">M</text>
<text x="337.5" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Q1 [Вимк]    Q2 [Вимк]</text>
<text x="337.5" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Q3 [УВІМК] ═══ Q4 [УВІМК]</text>
<line x1="312.5" y1="382.0" x2="362.5" y2="382.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="337.5" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Замкнене коло гальмування</text>
<rect x="450.0" y="50.0" width="205.0" height="395.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/>
<rect x="451.0" y="60.5" width="203.0" height="23.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="552.5" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="552.5" dy="0.0">3. Рекуперативне гальмування</tspan></text>
<text x="460.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Стан ключів:</text>
<text x="460.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">ШІМ нижніх + діоди/синхр.</text>
<text x="460.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Струм:</text>
<text x="460.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Тече назад у шину VBUS</text>
<text x="460.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Гальмівний момент:</text>
<text x="460.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Керований ШІМ / FOC</text>
<text x="460.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Куди дівається енергія:</text>
<text x="460.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Повертається в батарею / Cbus</text>
<text x="460.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Ризик:</text>
<text x="460.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Перенапруга шини (Overvoltage)</text>
<rect x="460.0" y="290.0" width="185.0" height="140.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<circle cx="552.5" cy="355.0" r="20.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="552.5" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">M</text>
<text x="552.5" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">D1 [Діод]  ──►  VBUS</text>
<text x="552.5" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Q3 [ШІМ-Boost]   Q4</text>
<line x1="552.5" y1="334.0" x2="552.5" y2="320.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="552.5" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Струм качається у VBUS</text>
<rect x="665.0" y="50.0" width="215.0" height="395.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<rect x="667.6" y="60.5" width="209.8" height="23.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="772.5" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="772.5" dy="0.0">4. Протиувімкнення (Plugging)</tspan></text>
<text x="675.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Стан ключів:</text>
<text x="675.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Подача зворотної діагоналі</text>
<text x="675.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Струм:</text>
<text x="675.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">I = (VBUS + E_bemf) / R</text>
<text x="675.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Гальмівний момент:</text>
<text x="675.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Максимальний (ударний)</text>
<text x="675.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Куди дівається енергія:</text>
<text x="675.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Величезне тепло в моторі</text>
<text x="675.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Ризик:</text>
<text x="675.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">I ≈ 2·Istall, пробій, удар редуктора</text>
<rect x="675.0" y="290.0" width="195.0" height="140.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<circle cx="772.5" cy="355.0" r="20.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="772.5" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">M</text>
<text x="772.5" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">+VBUS ──► Q2 [УВІМК]</text>
<text x="772.5" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Q3 [УВІМК] ◄── GND</text>
<text x="772.5" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">V_tot = VBUS + E_bemf !</text>
</svg>