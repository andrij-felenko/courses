<text x="465.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">Рекуперація</text>
<rect x="585.0" y="216.0" width="100.0" height="16.0" rx="2" fill="#e5e7eb" stroke="#333333" stroke-width="0.5"/>
<rect x="585.0" y="216.0" width="45.0" height="16.0" rx="2" fill="#2457d6" stroke="#2457d6" stroke-width="0.5"/>
