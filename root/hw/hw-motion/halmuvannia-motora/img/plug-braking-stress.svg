<rect x="725.0" y="216.0" width="100.0" height="16.0" rx="2" fill="#e5e7eb" stroke="#333333" stroke-width="0.5"/>
<rect x="725.0" y="216.0" width="10.0" height="16.0" rx="2" fill="#2457d6" stroke="#2457d6" stroke-width="0.5"/>
<text x="830.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">10%</text>
<text x="465.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Протиувімкнення</text>
<rect x="585.0" y="254.0" width="100.0" height="16.0" rx="2" fill="#e5e7eb" stroke="#333333" stroke-width="0.5"/>
