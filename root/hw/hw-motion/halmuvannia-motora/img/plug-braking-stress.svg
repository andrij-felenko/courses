<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гальмування протиувімкненням (Plugging): електричні та механічні перевантаження</text>
<rect x="20.0" y="50.0" width="400.0" height="350.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/>
<text x="220.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Складання напруг джерела та протиЕРС</text>
<text x="40.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Звичайний робочий хід:</text>
<line x1="50.0" y1="135.0" x2="250.0" y2="135.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="150.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">+VBUS (24 В)</text>
<line x1="250.0" y1="155.0" x2="70.0" y2="155.0" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="160.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">E_bemf (-20 В)</text>
<text x="270.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">V_net = 24 - 20 = 4 В
I = 4 В / 0.5 Ом = 8 А</text>
<line x1="40.0" y1="190.0" x2="400.0" y2="190.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="40.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">2. Гальмування протиувімкненням (Реверс на ходу):</text>
<line x1="50.0" y1="245.0" x2="230.0" y2="245.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="140.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">V_reverse (24 В)</text>
<line x1="230.0" y1="245.0" x2="380.0" y2="245.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="305.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">E_bemf (20 В)</text>
<text x="40.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Сумарна напруга на обмотці: V_tot = VBUS + E_bemf = 44 В !</text>
<text x="40.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Піковий струм: I_plug = 44 В / 0.5 Ом = 88 А (у 2× вище пускового!)</text>
<rect x="44.7" y="333.6" width="350.6" height="32.7" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="347.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Теплові втрати P = I²·R зростають у 100+ разів порівняно з нормою!</tspan><tspan x="220.0" dy="11.7">Критичний ризик розмагнічування магнітів ротора та удару зубів.</tspan></text>
<rect x="440.0" y="50.0" width="420.0" height="350.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="650.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння пікового струму та теплових втрат</text>
<text x="465.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Режим</text>
<text x="595.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Піковий струм</text>
<text x="725.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Тепловий стрес</text>
<text x="465.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="700">Вибіг (Coasting)</text>
