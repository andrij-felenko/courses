<rect x="474.7" y="316.9" width="350.6" height="56.1" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="330.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Висновки для проектування:</tspan><tspan x="650.0" dy="11.7">• Протиувімкнення припустиме лише як АВАРІЙНЕ (Emergency Stop)</tspan><tspan x="650.0" dy="11.7">• Потребує вимкнення при ω = 0 (інакше реверс на повній швидкості)</tspan><tspan x="650.0" dy="11.7">• Штатними режимами є динамічне та рекуперативне гальмування</tspan></text>
</svg>