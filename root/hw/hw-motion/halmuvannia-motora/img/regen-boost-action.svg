<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рекуперація як підвищувальний (Boost) перетворювач у силі H-моста</text>
<rect x="20.0" y="50.0" width="420.0" height="350.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
<text x="230.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Фаза 1: Нижній ключ ON (ШІМ накачування L)</text>
<circle cx="110.0" cy="180.0" r="24.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="110.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">E_bemf</text>
<rect x="180.0" y="168.0" width="40.0" height="24.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="200.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">L</text>
<line x1="300.0" y1="110.0" x2="420.0" y2="110.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="360.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">+VBUS (Шина)</text>
<rect x="280.0" y="125.0" width="40.0" height="25.0" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="300.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">D1 (OFF)</text>
<rect x="280.0" y="185.0" width="50.0" height="30.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="305.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Q3 [ON]</text>
<line x1="305.0" y1="215.0" x2="305.0" y2="250.0" stroke="#333333" stroke-width="2.0"/>
<text x="305.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">GND</text>
<line x1="134.0" y1="180.0" x2="180.0" y2="180.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="220.0" y1="180.0" x2="280.0" y2="200.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="110.0" y1="204.0" x2="110.0" y2="250.0" stroke="#333333" stroke-width="2.0"/>
<line x1="110.0" y1="250.0" x2="305.0" y2="250.0" stroke="#333333" stroke-width="2.0"/>
<line x1="170.0" y1="160.0" x2="240.0" y2="160.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="180.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Струм I зростає: dI/dt = E/L</text>
<rect x="43.3" y="303.7" width="373.4" height="62.6" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="319.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">• ПротиЕРС мотора E_bemf менша за напругу VBUS (E &lt; VBUS)</tspan><tspan x="230.0" dy="12.3">• Нижній ключ замикає котушку L на землю</tspan><tspan x="230.0" dy="12.3">• Струм зростає, запасаючи енергію у магнітному полі: E = 0.5·L·I²</tspan><tspan x="230.0" dy="12.3">• Верхній діод D1 закритий зворотною напругою шини</tspan></text>
<rect x="460.0" y="50.0" width="420.0" height="350.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/>
<text x="670.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Фаза 2: Нижній ключ OFF (Викид L + E у VBUS)</text>
<circle cx="550.0" cy="180.0" r="24.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="550.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">E_bemf</text>
<rect x="620.0" y="168.0" width="40.0" height="24.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="640.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">L</text>
<line x1="740.0" y1="110.0" x2="860.0" y2="110.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="800.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">+VBUS (Зростає!)</text>
<line x1="820.0" y1="110.0" x2="820.0" y2="160.0" stroke="#c0392b" stroke-width="1.5"/>
<rect x="805.0" y="160.0" width="30.0" height="20.0" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="820.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Cbus</text>
<line x1="820.0" y1="180.0" x2="820.0" y2="250.0" stroke="#333333" stroke-width="1.5"/>
<rect x="720.0" y="125.0" width="55.0" height="30.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="735.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">D1 [ON]</text>
<line x1="747.0" y1="125.0" x2="747.0" y2="110.0" stroke="#c0392b" stroke-width="2.0"/>
<rect x="720.0" y="195.0" width="50.0" height="25.0" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="745.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Q3 [OFF]</text>
<line x1="574.0" y1="180.0" x2="620.0" y2="180.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="660.0" y1="180.0" x2="747.0" y2="155.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="550.0" y1="204.0" x2="550.0" y2="250.0" stroke="#333333" stroke-width="2.0"/>
<line x1="550.0" y1="250.0" x2="820.0" y2="250.0" stroke="#333333" stroke-width="2.0"/>
<line x1="747.0" y1="155.0" x2="747.0" y2="115.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="675.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">U = E + L·(dI/dt) &gt; VBUS</text>
<rect x="486.0" y="303.7" width="368.0" height="62.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="670.0" y="319.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">• Нижній ключ розмикається, індуктивність L підтримує струм</tspan><tspan x="670.0" dy="12.3">• Сумарна напруга E_bemf + V_L перевищує рівень VBUS</tspan><tspan x="670.0" dy="12.3">• Струм крізь діод D1 заряджає конденсатор Cbus та живить джерело</tspan><tspan x="670.0" dy="12.3">• Ризик: без споживача напруга VBUS неконтрольовано зростає!</tspan></text>
</svg>