<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <text x="480" y="36" fill="#1a1a1a" font-size="18" font-weight="bold" text-anchor="middle">Зони втомних напружень Flexspline та механіка вискакування зубів (Ratcheting)</text>
  <text x="480" y="58" fill="#6b7280" font-size="13" text-anchor="middle">Концентрація згинальних циклічних напружень у діафрагмі стакана та перекіс профілю при піковому моменті T_peak</text>

  <!-- Панель 1: Зони втомних напружень стакана -->
  <rect x="30" y="80" width="435" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="110" fill="#2457d6" font-size="14" font-weight="bold" text-anchor="middle">Концентратори циклічних напружень стакана</text>

  <!-- Поздовжній розріз гнучкого стакана Flexspline -->
  <g transform="translate(0, 0)">
    <!-- Зубчастий вінець (ліворуч) -->
    <rect x="70" y="160" width="40" height="150" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
    <line x1="70" y1="175" x2="60" y2="175" stroke="#2457d6" stroke-width="2"/>
    <line x1="70" y1="190" x2="60" y2="190" stroke="#2457d6" stroke-width="2"/>
    <line x1="70" y1="205" x2="60" y2="205" stroke="#2457d6" stroke-width="2"/>
    <line x1="70" y1="265" x2="60" y2="265" stroke="#2457d6" stroke-width="2"/>
    <line x1="70" y1="280" x2="60" y2="280" stroke="#2457d6" stroke-width="2"/>
    <line x1="70" y1="295" x2="60" y2="295" stroke="#2457d6" stroke-width="2"/>

    <!-- Тонкостінна циліндрична оболонка -->
    <rect x="110" y="175" width="180" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
    <rect x="110" y="275" width="180" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

    <!-- Діафрагма стакана (перехідне заокруглення) -->
    <path d="M 290,175 L 340,175 L 340,295 L 290,295 Z" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>

    <!-- Втулка вала (праворуч) -->
    <rect x="340" y="205" width="60" height="60" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2"/>
  </g>

  <!-- Підписи зон -->
  <rect x="50" y="325" width="140" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="120" y="340" fill="#2457d6" font-size="11" font-weight="bold" text-anchor="middle">Зубчастий вінець</text>

  <rect x="275" y="135" width="170" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="360" y="150" fill="#c0392b" font-size="11" font-weight="bold" text-anchor="middle">Зона втомного зламу (σ_bend)</text>

  <text x="247" y="380" fill="#1a1a1a" font-size="12" font-weight="bold" text-anchor="middle">Циклічний знакозмінний згин оболонки</text>
  <text x="247" y="405" fill="#6b7280" font-size="11" text-anchor="middle">Максимум деформації біля радіуса переходу в дно</text>

  <!-- Панель 2: Механіка Tooth Ratcheting -->
  <rect x="495" y="80" width="435" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="110" fill="#c0392b" font-size="14" font-weight="bold" text-anchor="middle">Механіка вискакування зубів при піковому ударі</text>

  <g transform="translate(0, 0)">
    <!-- Зуб Circular Spline (зверху) -->
    <path d="M 610,150 L 640,150 L 665,200 L 700,200 L 725,150 L 755,150" fill="none" stroke="#6b7280" stroke-width="2.5"/>
    <text x="680" y="140" fill="#6b7280" font-size="12" font-weight="bold" text-anchor="middle">Нерухома впадина корони</text>

    <!-- Зуб Flexspline під дією нормальної сили навантаження -->
    <path d="M 630,260 L 655,210 L 685,210 L 710,260" fill="none" stroke="#c0392b" stroke-width="3"/>
    <text x="680" y="280" fill="#c0392b" font-size="12" font-weight="bold" text-anchor="middle">Зуб Flexspline (витискання)</text>

    <!-- Вектори сил контакту -->
    <line x1="680" y1="210" x2="720" y2="185" stroke="#c0392b" stroke-width="2"/>
    <line x1="680" y1="210" x2="680" y2="245" stroke="#2457d6" stroke-width="2"/>
  </g>

  <text x="712" y="315" fill="#1a1a1a" font-size="12" font-weight="bold" text-anchor="middle">Радіальна сила зачеплення F_r = F_t · tan(α_w)</text>
  <text x="712" y="338" fill="#6b7280" font-size="11" text-anchor="middle">При піковому моменті сила F_r втискає стакан усередину</text>

  <rect x="525" y="365" width="375" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="712" y="381" fill="#c0392b" font-size="11" font-weight="bold" text-anchor="middle">Перевищення T_ratchet: зріз та необоротне зминання вершин зубів</text>
</svg>
