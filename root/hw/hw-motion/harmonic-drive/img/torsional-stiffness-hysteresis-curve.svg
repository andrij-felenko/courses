<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <text x="480" y="36" fill="#1a1a1a" font-size="18" font-weight="bold" text-anchor="middle">Крива крутильної жорсткості та петля гістерезису хвильового редуктора</text>
  <text x="480" y="58" fill="#6b7280" font-size="13" text-anchor="middle">Нелінійна характеристика T(θ) з трьома зонами жорсткості (K1, K2, K3) та петлею гістерезису (Lost Motion)</text>

  <!-- Полотно графіка -->
  <rect x="60" y="80" width="840" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Сітка та допоміжні лінії меж зон -->
  <line x1="380" y1="95" x2="380" y2="415" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="580" y1="95" x2="580" y2="415" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="280" y1="95" x2="280" y2="415" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="680" y1="95" x2="680" y2="415" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Осі координат -->
  <line x1="80" y1="255" x2="880" y2="255" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="415" x2="480" y2="95" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="870" y="245" fill="#1a1a1a" font-size="12" font-weight="bold" text-anchor="end">Кут скручування θ [arcmin] →</text>
  <text x="495" y="110" fill="#1a1a1a" font-size="12" font-weight="bold" text-anchor="start">Крутний момент T [Н·м] ↑</text>

  <!-- Петля гістерезису (навантаження та розвантаження) -->
  <g transform="translate(0, 0)">
    <!-- Гілка прямого навантаження (синя) -->
    <path d="M 230,390 C 270,360 360,330 445,268 C 470,250 510,230 580,205 C 650,180 710,145 730,120" fill="none" stroke="#2457d6" stroke-width="3"/>
    
    <!-- Гілка зворотного розвантаження (зелена) -->
    <path d="M 730,120 C 690,150 600,180 515,242 C 490,260 450,280 380,305 C 310,330 250,365 230,390" fill="none" stroke="#27ae60" stroke-width="3"/>
  </g>

  <!-- Підпис Lost Motion біля нуля -->
  <line x1="445" y1="255" x2="515" y2="255" stroke="#c0392b" stroke-width="3"/>
  <rect x="420" y="275" width="120" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="480" y="290" fill="#c0392b" font-size="11" font-weight="bold" text-anchor="middle">Lost Motion (B_h)</text>

  <!-- Зони жорсткості вгорі -->
  <rect x="430" y="130" width="100" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="145" fill="#2457d6" font-size="11" font-weight="bold" text-anchor="middle">Зона 1: K_1 (низька)</text>

  <rect x="590" y="130" width="110" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="645" y="145" fill="#2457d6" font-size="11" font-weight="bold" text-anchor="middle">Зона 2: K_2 (середня)</text>

  <rect x="740" y="130" width="110" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="795" y="145" fill="#2457d6" font-size="11" font-weight="bold" text-anchor="middle">Зона 3: K_3 (висока)</text>

  <!-- Легенда внизу -->
  <line x1="120" y1="410" x2="160" y2="410" stroke="#2457d6" stroke-width="3"/>
  <text x="170" y="414" fill="#1a1a1a" font-size="12" text-anchor="start">Крива навантаження (+T)</text>

  <line x1="330" y1="410" x2="370" y2="410" stroke="#27ae60" stroke-width="3"/>
  <text x="380" y="414" fill="#1a1a1a" font-size="12" text-anchor="start">Крива розвантаження (-T)</text>

  <rect x="540" y="402" width="12" height="12" fill="#c0392b"/>
  <text x="560" y="414" fill="#1a1a1a" font-size="12" text-anchor="start">Ширина петлі гістерезису: внутрішнє тертя стакана</text>
</svg>
