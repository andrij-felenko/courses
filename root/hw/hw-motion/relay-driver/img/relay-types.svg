<text x="410.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Окремо — герконове (reed): контакти в скляній колбі, мала котушка, швидке й чисте, але на малі струми.</text>
<text x="410.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">● зелений — NO, ● червоний — NC. Більше груп контактів = більше кіл, що перемикаються одним якорем.</text>
