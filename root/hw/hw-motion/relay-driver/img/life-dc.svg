<text x="420.0" y="26.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ресурс, постійний струм і «змочувальний» струм</text>
