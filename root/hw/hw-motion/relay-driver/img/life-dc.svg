<text x="230.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">електричний: під номіналом</text>
<text x="230.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">~100 тис. і падає зі струмом</text>
<rect x="440.0" y="54.0" width="360.0" height="300.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="620.0" y="48.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">дві пастки навантаження</text>
<text x="620.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#9a2b22" text-anchor="middle" font-weight="bold" font-style="normal">постійний струм важчий:</text>
<text x="620.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">дуга не гасне на нулі (немає нуля)</text>
<text x="620.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">→ DC-рейтинг у рази нижчий за AC</text>
<line x1="470.0" y1="142.0" x2="770.0" y2="142.0" stroke="#eee" stroke-width="1" stroke-linecap="round"/>
<text x="620.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#9c6a16" text-anchor="middle" font-weight="bold" font-style="normal">малий сигнал — інша біда:</text>
<text x="620.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">срібні контакти заростають плівкою,</text>
<text x="620.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">якщо струм нижчий за «змочувальний»</text>
<text x="620.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(wetting current, ~кілька мА)</text>
<text x="620.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f6e33" text-anchor="middle" font-weight="bold" font-style="normal">для сигналів — ЗОЛОЧЕНІ контакти</text>
<text x="620.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(золото не окислюється)</text>
<text x="620.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">матеріали: AgNi, AgSnO₂ — для сили;</text>
<text x="620.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Au-покриття — для слабких сигналів</text>
<text x="620.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#7a4e8a" text-anchor="middle" font-weight="bold" font-style="normal">велике/часте → твердотільне реле (§2.5.10)</text>
</svg>
