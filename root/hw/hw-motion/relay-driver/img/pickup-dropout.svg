<text x="570.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">брязкіт: контакт кілька разів</text>
<text x="570.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">відскакує, перш ніж замкнутись</text>
<text x="570.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#9c6a16" text-anchor="middle" font-weight="bold" font-style="normal">у коді — антибрязкіт</text>
<text x="380.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Реле повільне (мілісекунди) і дребезжить контактами — це враховують і в живленні котушки, і в логіці.</text>
</svg>
