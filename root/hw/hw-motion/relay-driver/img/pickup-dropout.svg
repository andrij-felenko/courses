<text x="380.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Спрацювання, утримання й брязкіт контактів</text>
<rect x="40.0" y="60.0" width="350.0" height="230.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="215.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">струм котушки</text>
<line x1="70.0" y1="150.0" x2="370.0" y2="150.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="370.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">I котушки</text>
<line x1="70.0" y1="150.0" x2="70.0" y2="60.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<line x1="70.0" y1="80.0" x2="370.0" y2="80.0" stroke="#c0271e" stroke-width="1.2" stroke-dasharray="5,4" stroke-linecap="round"/>
<text x="370.0" y="76.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="end" font-weight="normal" font-style="normal">спрацювання</text>
<line x1="70.0" y1="115.0" x2="370.0" y2="115.0" stroke="#1f8a3b" stroke-width="1.2" stroke-dasharray="5,4" stroke-linecap="round"/>
<text x="370.0" y="111.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1f6e33" text-anchor="end" font-weight="normal" font-style="normal">утримання</text>
<text x="90.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">втягнути якір треба БІЛЬШИМ струмом,</text>
<text x="90.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">ніж утримати втягнутим (гістерезис)</text>
<text x="220.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">≈ у 2–3 рази</text>
<rect x="410.0" y="60.0" width="320.0" height="230.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="570.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">контакт при замиканні</text>
<line x1="440.0" y1="160.0" x2="700.0" y2="160.0" stroke="#1b1b1b" stroke-width="1.3" stroke-linecap="round"/>
