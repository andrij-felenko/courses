<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380">
<rect width="860" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="430.0" y="28.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві пастки модуля: джампер живлення й active-low вхід</text>
<rect x="40.0" y="56.0" width="400.0" height="300.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="240.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">джампер VCC ↔ JD-VCC</text>
<text x="240.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">джампер НА МІСЦІ (за умовчанням):</text>
<rect x="90.0" y="100.0" width="60.0" height="28.0" rx="4" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="120.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">VCC</text>
<rect x="330.0" y="100.0" width="60.0" height="28.0" rx="4" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="360.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">JD-VCC</text>
<line x1="150.0" y1="114.0" x2="330.0" y2="114.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<text x="240.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">котушка живиться від тієї ж шини,</text>
<text x="240.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#9a2b22" text-anchor="middle" font-weight="bold" font-style="normal">що й логіка → ізоляція ФІКТИВНА</text>
<line x1="70.0" y1="184.0" x2="410.0" y2="184.0" stroke="#ddd" stroke-width="1" stroke-linecap="round"/>
<text x="240.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">джампер ЗНЯТО, JD-VCC від ОКРЕМОГО джерела:</text>
<rect x="90.0" y="226.0" width="60.0" height="28.0" rx="4" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="120.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">VCC</text>
<rect x="330.0" y="226.0" width="60.0" height="28.0" rx="4" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="360.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">JD-VCC</text>
<text x="120.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f6e33" text-anchor="middle" font-weight="normal" font-style="normal">логіка</text>
<text x="360.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#9a2b22" text-anchor="middle" font-weight="normal" font-style="normal">окреме живлення котушки</text>
<text x="240.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f6e33" text-anchor="middle" font-weight="bold" font-style="normal">тепер оптопара справді розв'язує</text>
<text x="240.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">брудний бік котушки від логіки</text>
<text x="240.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#9c6a16" text-anchor="middle" font-weight="normal" font-style="italic">правда ізоляції — лише з окремим живленням</text>
<rect x="460.0" y="56.0" width="360.0" height="300.0" rx="6" fill="#ffffff" stroke="#c9d3dc" stroke-width="1.4"/>
<text x="640.0" y="50.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">active-low: вмикає «0», а не «1»</text>
<text x="640.0" y="92.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">багато модулів реле ввімкнено</text>
<text x="640.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">при логічному НУЛІ на вході</text>
<text x="640.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f6e33" text-anchor="middle" font-weight="bold" font-style="normal">IN = 0  →  реле ВВІМКНЕНО</text>
<text x="640.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">IN = 1  →  реле вимкнено</text>
<text x="640.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">чому: струм тече крізь світлодіод</text>
<text x="640.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">оптопари, коли вивід МК тягне його</text>
<text x="640.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">до землі (інверсія §2.6.7)</text>
<text x="640.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#9c6a16" text-anchor="middle" font-weight="bold" font-style="normal">пастка: реле клацає під час СКИДАННЯ</text>
<text x="640.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">МК (виводи ще не налаштовані → «0»)</text>
<text x="640.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">рішення: інвертувати логіку в коді</text>
<text x="640.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">й не лякатися клацання на старті</text>
</svg>
