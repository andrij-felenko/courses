<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Фон -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Конус тертя та геометрична умова самогальмування</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Якщо лінія дії сили лежить всередині конуса тертя (γ ≤ ρ), рух уздовж площини неможливий</text>

  <!-- Ліва панель: gamma > rho -->
  <rect x="30" y="80" width="435" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="48" y="96" width="399" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Кут підйому більший за кут тертя (γ > ρ): ковзання</text>

  <!-- Клин з крутим кутом gamma = 24 deg -->
  <polygon points="65,270 330,270 330,170" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Кут гамма -->
  <path d="M 115 270 A 50 50 0 0 0 110 252" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="125" y="262" font-size="13" font-weight="bold" fill="#2457d6">γ</text>

  <!-- Конус тертя навколо нормалі (rho = 10 deg) -->
  <!-- Сектор конуса тертя -->
  <path d="M 210,215 L 175,135 L 205,123 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="160" y="125" font-size="12" font-weight="bold" fill="#c0392b">2ρ (конус)</text>

  <!-- Сила тяжіння / навантаження F_load строго вниз -->
  <line x1="210" y1="215" x2="210" y2="285" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="220" y="280" font-size="12" font-weight="bold" fill="#c0392b">F_load</text>

  <!-- Стрілка ковзання вниз -->
  <line x1="250" y1="190" x2="190" y2="212" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="220" y="180" font-size="12" font-weight="bold" fill="#2457d6">Зрив униз</text>

  <text x="65" y="315" font-size="12" fill="#6b7280">Вектор сили лежить ПОЗА конусом тертя: тіло сповзає</text>

  <!-- Підсумок лівої панелі -->
  <rect x="48" y="345" width="399" height="66" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Зворотна рушійність: привід не утримує вантаж</text>
  <text x="247" y="394" text-anchor="middle" font-size="12" fill="#c0392b">Потрібне зовнішнє електромеханічне гальмо</text>


  <!-- Права панель: gamma <= rho -->
  <rect x="495" y="80" width="435" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="513" y="96" width="399" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Кут підйому менший за кут тертя (γ ≤ ρ): самогальмування</text>

  <!-- Клин з пологим кутом gamma = 6 deg -->
  <polygon points="530,270 820,270 820,235" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Кут гамма -->
  <path d="M 600 270 A 70 70 0 0 0 598 261" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="612" y="264" font-size="13" font-weight="bold" fill="#2457d6">γ</text>

  <!-- Конус тертя навколо нормалі (широкий, rho = 12 deg) -->
  <path d="M 690,250 L 650,155 L 710,150 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="635" y="125" font-size="12" font-weight="bold" fill="#27ae60">2ρ (конус тертя)</text>

  <!-- Сила навантаження F_load строго всередині конуса -->
  <line x1="690" y1="180" x2="690" y2="245" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arr-main)"/>
  <text x="700" y="195" font-size="12" font-weight="bold" fill="#1a1a1a">F_load (тиск)</text>

  <!-- Позначка клину -->
  <text x="725" y="235" font-size="12" font-weight="bold" fill="#27ae60">Заклинювання</text>

  <text x="530" y="315" font-size="12" fill="#6b7280">Вектор сили лежить ВСЕРЕДИНІ конуса: виникає клин</text>

  <!-- Підсумок правої панелі -->
  <rect x="513" y="345" width="399" height="66" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Статичне утримання: вантаж надійно заблоковано</text>
  <text x="712" y="394" text-anchor="middle" font-size="12" fill="#27ae60">Зворотне обертання неможливе за будь-якої сили</text>
</svg>
