<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr2-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr2-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Фон -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Падіння коефіцієнта тертя та зрив самогальмування від вібрації</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Динамічні коливання знижують коефіцієнт тертя в кілька разів, уможливлюючи самовільний спуск</text>

  <!-- Ліва панель: Графік залежності mu від прискорення вібрації -->
  <rect x="30" y="80" width="510" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Область зриву самогальмування -->
  <rect x="250" y="240" width="260" height="130" fill="#fdecea" opacity="0.6"/>
  <text x="380" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Зона зриву: μ_дин &lt; tan(γ)</text>

  <!-- Сітка графіка -->
  <line x1="90" y1="370" x2="510" y2="370" stroke="#d0d7de" stroke-width="1"/>
  <line x1="90" y1="280" x2="510" y2="280" stroke="#d0d7de" stroke-width="1"/>
  <line x1="90" y1="190" x2="510" y2="190" stroke="#d0d7de" stroke-width="1"/>

  <!-- Вісь Y: Коефіцієнт тертя -->
  <line x1="90" y1="370" x2="90" y2="110" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="45" y="125" font-size="12" font-weight="bold" fill="#1a1a1a">Тертя μ</text>
  <text x="50" y="194" font-size="12" fill="#27ae60">0.12</text>
  <text x="50" y="284" font-size="12" fill="#6b7280">0.06</text>
  <text x="65" y="375" font-size="12" fill="#6b7280">0</text>

  <!-- Вісь X: Амплітуда прискорення вібрації a_vib / g -->
  <line x1="90" y1="370" x2="510" y2="370" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="440" y="390" font-size="12" font-weight="bold" fill="#1a1a1a">Вібрація (a/g)</text>
  <text x="180" y="390" text-anchor="middle" font-size="12" fill="#6b7280">0.2</text>
  <text x="270" y="390" text-anchor="middle" font-size="12" fill="#6b7280">0.5</text>
  <text x="360" y="390" text-anchor="middle" font-size="12" fill="#6b7280">1.0</text>

  <!-- Лінія порогу самогальмування tan(gamma) на y=235 -->
  <line x1="90" y1="235" x2="510" y2="235" stroke="#2457d6" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="310" y="225" font-size="12" font-weight="bold" fill="#2457d6">Поріг tan(γ) = 0.09 (кут γ = 5.1°)</text>

  <!-- Крива падіння коефіцієнта тертя -->
  <path d="M 90 160 Q 170 170 240 235 T 500 330" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="110" y="145" font-size="12" font-weight="bold" fill="#27ae60">μ_спокою = 0.14</text>
  <text x="340" y="350" font-size="12" font-weight="bold" fill="#c0392b">μ_дин = 0.03...0.04</text>

  <!-- Права панель: Інженерні наслідки та безпека -->
  <rect x="560" y="80" width="370" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Блок фізики мікровідривів -->
  <rect x="580" y="100" width="330" height="140" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="595" y="125" font-size="14" font-weight="bold" fill="#1a1a1a">Фізичний механізм зриву</text>
  <text x="595" y="150" font-size="12" fill="#1a1a1a">• Вібрація створює мікроскопічні коливання сил</text>
  <text x="595" y="172" font-size="12" fill="#1a1a1a">• Нормальний тиск циклічно падає до нуля</text>
  <text x="595" y="194" font-size="12" fill="#1a1a1a">• Масляна плівка відновлює рідинний клин</text>
  <text x="595" y="216" font-size="12" font-weight="bold" fill="#c0392b">Тертя спокою заміщується низьким тертям ковзання</text>

  <!-- Блок вимог безпеки -->
  <rect x="580" y="260" width="330" height="150" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="595" y="285" font-size="14" font-weight="bold" fill="#27ae60">Вимоги промислової безпеки</text>
  <text x="595" y="310" font-size="12" fill="#1a1a1a">• У підйомниках та ліфтах самогальмування НЕ є</text>
  <text x="595" y="330" font-size="12" fill="#1a1a1a">  єдиним захистом від падіння вантажу</text>
  <text x="595" y="355" font-size="12" fill="#1a1a1a">• Обов'язкове електромеханічне пружинне гальмо</text>
  <text x="595" y="380" font-size="12" font-weight="bold" fill="#27ae60">Коефіцієнт запасу самогальмування: S_sl ≥ 1.5</text>
</svg>
