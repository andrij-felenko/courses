<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біле тло -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Контур оцінки зовнішнього навантаження за струмом статора Iq</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Механічна прозорість трансмісії дозволяє вимірювати зусилля без зовнішнього датчика сили</text>

  <!-- Верхня частина: Структурна блок-схема спостерігача сили -->
  <rect x="30" y="75" width="900" height="150" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Структурна схема алгоритму оцінки зовнішнього контакту</text>

  <!-- Блок 1: Вимірювання фазових струмів -->
  <rect x="50" y="120" width="160" height="85" rx="4" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="130" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Шунти фазних струмів</text>
  <text x="130" y="165" text-anchor="middle" font-size="11" fill="#1a1a1a">Перетворення Кларк/Парк</text>
  <text x="130" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Струм статора Iq</text>

  <line x1="210" y1="162" x2="255" y2="162" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Блок 2: Електромагнітний момент -->
  <rect x="260" y="120" width="170" height="85" rx="4" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="345" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Модель двигуна</text>
  <text x="345" y="165" text-anchor="middle" font-size="11" fill="#1a1a1a">T_em = K_t · Iq</text>
  <text x="345" y="185" text-anchor="middle" font-size="11" fill="#6b7280">Масштабування редуктором i</text>

  <line x1="430" y1="162" x2="475" y2="162" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Блок 3: Компенсація динаміки та тертя -->
  <rect x="480" y="120" width="200" height="85" rx="4" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="580" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Спостерігач збурень</text>
  <text x="580" y="165" text-anchor="middle" font-size="11" fill="#1a1a1a">Віднімання J_ref · alpha</text>
  <text x="580" y="185" text-anchor="middle" font-size="11" fill="#1a1a1a">Компенсація тертя T_fric</text>

  <line x1="680" y1="162" x2="725" y2="162" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Блок 4: Оцінений контактний момент -->
  <rect x="730" y="120" width="180" height="85" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="820" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Оцінений момент T_ext</text>
  <text x="820" y="165" text-anchor="middle" font-size="11" fill="#1a1a1a">Сила реакції опори</text>
  <text x="820" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">F_contact = T_ext / L</text>


  <!-- Нижня частина: Порівняння прозорості QDD vs Висока редукція -->
  <!-- Ліва колонка: QDD -->
  <rect x="30" y="245" width="435" height="190" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="247" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Квазіпрямий привод (QDD, i = 6..8)</text>

  <text x="50" y="302" font-size="12" font-weight="bold" fill="#1a1a1a">Тертя редуктора: &lt; 5% від номінального моменту</text>
  <text x="50" y="325" font-size="11" fill="#1a1a1a">Прямий зворотний зв'язок: зусилля на виході вільно провертає ротор</text>
  <text x="50" y="348" font-size="11" fill="#1a1a1a">Мінімальна похибка оцінки сили: розрізнення дотику від 0.2 Н·м</text>
  <text x="50" y="371" font-size="11" fill="#1a1a1a">Смуга пропускання зусилля: до 500 Гц за фазовим струмом</text>
  <text x="50" y="405" font-size="12" font-weight="bold" fill="#27ae60">Безпечний дотик та повноцінний віртуальний імпеданс</text>

  <!-- Права колонка: Висока редукція -->
  <rect x="495" y="245" width="435" height="190" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="712" y="272" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Висока редукція (хвильова/черв'ячна, i = 100+)</text>

  <text x="515" y="302" font-size="12" font-weight="bold" fill="#1a1a1a">Тертя редуктора: 20-35% від номінального моменту</text>
  <text x="515" y="325" font-size="11" fill="#1a1a1a">Зворотна передача заблокована: зовнішня дія розсіюється в зубах</text>
  <text x="515" y="348" font-size="11" fill="#1a1a1a">Велика похибка струмового сенсора: «мертва зона» до 5-10 Н·м</text>
  <text x="515" y="371" font-size="11" fill="#1a1a1a">Струм статора не відчуває контакту ланки з перешкодою</text>
  <text x="515" y="405" font-size="12" font-weight="bold" fill="#c0392b">Необхідний дорогий зовнішній 6-осьовий силовий датчик</text>
</svg>
