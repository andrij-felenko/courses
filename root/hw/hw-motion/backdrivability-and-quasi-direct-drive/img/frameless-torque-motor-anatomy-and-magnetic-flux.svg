<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Тло -->
  <rect width="960" height="460" fill="#ffffff" />

  <!-- Верхня шапка -->
  <rect x="30" y="16" width="900" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="50" y="38" font-size="16" font-weight="bold" fill="#0f172a">Будова безкорпусного torque-двигуна (Frameless Pancake Motor)</text>
  <text x="50" y="56" font-size="12" fill="#475569">Геометрія великого радіуса зазору R_gap, багатополюсний ротор 24S28P та замикання магнітного потоку</text>

  <!-- Ліва панель: Радіально-осьовий розріз і магнітний контур -->
  <rect x="30" y="78" width="470" height="362" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="50" y="104" font-size="14" font-weight="bold" fill="#0f172a">Радіальний розріз та топологія зазору</text>
  <text x="50" y="122" font-size="11" fill="#64748b">Зовнішній ротор (Outrunner) / Внутрішній статор із прямими зубами</text>

  <!-- Центральний порожнистий вал (Hollow Shaft) -->
  <rect x="55" y="140" width="115" height="280" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
  <text x="112" y="270" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Порожнистий</text>
  <text x="112" y="288" font-size="11" fill="#475569" text-anchor="middle">отвір вала</text>
  <text x="112" y="306" font-size="11" fill="#64748b" text-anchor="middle">d_in = 40..60 мм</text>

  <!-- Зубці статора та котушки -->
  <rect x="190" y="140" width="130" height="280" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" />
  <text x="255" y="164" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Шихтований статор</text>

  <!-- Зубці з мідними обмотками -->
  <rect x="205" y="180" width="100" height="44" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  <text x="255" y="200" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">Зубець 1: Фаза A</text>
  <text x="255" y="214" font-size="10" fill="#78350f" text-anchor="middle">мідні зосереджені витки</text>

  <rect x="205" y="234" width="100" height="44" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  <text x="255" y="254" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">Зубець 2: Фаза B</text>
  <text x="255" y="268" font-size="10" fill="#78350f" text-anchor="middle">концентрована намотка</text>

  <rect x="205" y="288" width="100" height="44" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  <text x="255" y="308" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">Зубець 3: Фаза C</text>
  <text x="255" y="322" font-size="10" fill="#78350f" text-anchor="middle">трифазна зірка / кут 120°</text>

  <rect x="205" y="342" width="100" height="66" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1" />
  <text x="255" y="370" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Спинка статора</text>
  <text x="255" y="388" font-size="10" fill="#64748b" text-anchor="middle">тонке ярмо заліза</text>

  <!-- Повітряний зазор -->
  <rect x="330" y="140" width="20" height="280" fill="#eff6ff" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,3" />
  <text x="340" y="275" font-size="10" font-weight="bold" fill="#1d4ed8" text-anchor="middle">δ</text>

  <!-- Зовнішній ротор з постійними магнітами -->
  <rect x="360" y="140" width="125" height="280" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5" />
  <text x="422" y="164" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Ротор з магнітами</text>

  <!-- Полюси магнітів N і S -->
  <rect x="370" y="180" width="46" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
  <text x="393" y="206" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">N</text>

  <rect x="370" y="234" width="46" height="44" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text x="393" y="260" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">S</text>

  <rect x="370" y="288" width="46" height="44" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
  <text x="393" y="314" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">N</text>

  <rect x="370" y="342" width="46" height="44" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text x="393" y="368" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">S</text>

  <!-- Ярмо ротора (сталеве зовнішнє кільце) -->
  <rect x="426" y="180" width="48" height="206" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5" />
  <text x="450" y="275" font-size="10" font-weight="bold" fill="#1e293b" text-anchor="middle">Ярмо</text>
  <text x="450" y="291" font-size="10" fill="#475569" text-anchor="middle">ротора</text>

  <!-- Права панель: 3 аналітичні блоки -->
  <!-- Блок 1: Масштабування моменту -->
  <rect x="515" y="78" width="415" height="114" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="535" y="104" font-size="13" font-weight="bold" fill="#0f172a">1. Закон масштабування моменту: T ~ R_gap² · L_act</text>
  <text x="535" y="126" font-size="11" fill="#334155">• Сила Лоренца: F_L = B · L_act · I_sum, плече сили дорівнює R_gap</text>
  <text x="535" y="144" font-size="11" fill="#334155">• Площа циліндричного зазору A_gap = 2 · π · R_gap · L_act</text>
  <text x="535" y="162" font-size="11" fill="#2563eb" font-weight="bold">• Результат: подвоєння радіуса зазору дає в 4 рази вищий крутний момент</text>
  <text x="535" y="180" font-size="10" fill="#64748b">Широкий диск (pancake) енергетично вигідніший за довгий циліндр</text>

  <!-- Блок 2: Константа двигуна Km та тепловідведення -->
  <rect x="515" y="202" width="415" height="114" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="535" y="228" font-size="13" font-weight="bold" fill="#0f172a">2. Добротність мотора: K_m = K_t / √(1.5 · R_phase)</text>
  <text x="535" y="250" font-size="11" fill="#334155">• Теплові втрати Джоуля: P_loss = 1.5 · I² · R = T² / K_m² (Вт)</text>
  <text x="535" y="268" font-size="11" fill="#334155">• Константа K_m показує корисний момент на квадратний корінь вата тепла</text>
  <text x="535" y="286" font-size="11" fill="#16a34a" font-weight="bold">• Типові значення torque-двигунів: K_m = 0.8..1.4 Н·м / √Вт</text>
  <text x="535" y="304" font-size="10" fill="#64748b">Тепло відводиться через прецизійну посадку статора на корпус шарніра</text>

  <!-- Блок 3: Топологія 24S28P та жорсткі допуски зазору -->
  <rect x="515" y="326" width="415" height="114" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="535" y="352" font-size="13" font-weight="bold" fill="#0f172a">3. Допуски зазору δ = 0.35..0.50 мм та співвісність</text>
  <text x="535" y="374" font-size="11" fill="#334155">• Багатополюсність (24 пази / 28 полюсів) скорочує товщину ярма статора</text>
  <text x="535" y="392" font-size="11" fill="#dc2626" font-weight="bold">• Допуск на радіальне биття посадки: не більше ±0.03..0.05 мм</text>
  <text x="535" y="410" font-size="11" fill="#334155">• Нерівномірність зазору породжує магнітне притягання F_radial до 1000 Н</text>
  <text x="535" y="428" font-size="10" fill="#64748b">Монтаж: посадка H7/js6 або вклеювання термостійким компаундом</text>
</svg>
