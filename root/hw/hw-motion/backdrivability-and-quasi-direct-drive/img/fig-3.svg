<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Паразитний когінг-момент (Cogging Torque) та методи його придушення</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Зубцеве залипання магнітів спотворює тактильну прозорість приводу; скіс пазів знижує пульсації до 1%</text>

  <!-- Left Panel: Waveform Graph -->
  <rect x="30" y="75" width="435" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="45" y="90" width="405" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="111" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Криві моменту залипання T_cog(theta)</text>

  <!-- Graph Axes -->
  <!-- Y Axis -->
  <line x1="75" y1="340" x2="75" y2="145" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="65" y="140" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">T_cog</text>
  <!-- Zero Axis -->
  <line x1="75" y1="240" x2="425" y2="240" stroke="#d0d7de" stroke-width="1.5"/>
  <!-- X Axis -->
  <line x1="75" y1="340" x2="430" y2="340" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="435" y="355" font-size="12" font-weight="bold" fill="#1a1a1a">Кут theta</text>

  <!-- Unskewed waveform (High amplitude Red) -->
  <path d="M 75 240 Q 95 160 115 240 T 155 240 T 195 240 T 235 240 T 275 240 T 315 240 T 355 240 T 395 240" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="280" y="165" font-size="12" font-weight="bold" fill="#c0392b">Без скосу пазів (5–10%)</text>

  <!-- Skewed waveform (Low amplitude Green) -->
  <path d="M 75 240 Q 95 225 115 240 T 155 240 T 195 240 T 235 240 T 275 240 T 315 240 T 355 240 T 395 240" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="280" y="222" font-size="12" font-weight="bold" fill="#27ae60">Зі скосом пазів (&lt; 1%)</text>

  <!-- Graph explanation box -->
  <rect x="45" y="365" width="405" height="55" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="385" font-size="12" fill="#1a1a1a">Період когінгу: N_cog = НСК(Z_slots, 2p) імпульсів за оберт.</text>
  <text x="55" y="405" font-size="12" fill="#6b7280">Висока частота гармонік викликає тремтіння при тактильному керуванні.</text>

  <!-- Right Panel: Physical Cause and Solutions -->
  <rect x="495" y="75" width="435" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="510" y="90" width="405" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="712" y="111" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Вплив на тактильну прозорість робота</text>

  <!-- Problem Block -->
  <rect x="510" y="135" width="405" height="95" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="525" y="158" font-size="13" font-weight="bold" fill="#c0392b">Чому когінг критичний у QDD-приводах:</text>
  <text x="525" y="178" font-size="12" fill="#1a1a1a">У роботах з високим тертям редуктора когінг непомітний.</text>
  <text x="525" y="198" font-size="12" fill="#1a1a1a">У QDD редукція мала (1:6..1:10), тому людина чи датчик сили</text>
  <text x="525" y="216" font-size="12" fill="#6b7280">безпосередньо відчувають пульсації як фальшивий опір контакту.</text>

  <!-- Solution Block 1: Skewing -->
  <rect x="510" y="240" width="405" height="85" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="525" y="263" font-size="13" font-weight="bold" fill="#27ae60">1. Конструктивні методи усунення:</text>
  <text x="525" y="283" font-size="12" fill="#1a1a1a">• Скіс пазів статора або магнітів ротора на один зубцевий крок;</text>
  <text x="525" y="303" font-size="12" fill="#1a1a1a">• Дробні зубцеві комбінації (наприклад, 12 пазів / 14 полюсів).</text>

  <!-- Solution Block 2: Field-Oriented Control -->
  <rect x="510" y="335" width="405" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="358" font-size="13" font-weight="bold" fill="#2457d6">2. Програмна компенсація струмом (FOC Feedforward):</text>
  <text x="525" y="378" font-size="12" fill="#1a1a1a">Калібрувальна таблиця когінгу записується у Flash драйвера.</text>
  <text x="525" y="398" font-size="12" fill="#6b7280">Контролер додає випереджальний струм I_q проти фази залипання.</text>
</svg>
