<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Тло -->
  <rect width="960" height="460" fill="#ffffff" />

  <!-- Верхня шапка -->
  <rect x="30" y="16" width="900" height="52" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="50" y="38" font-size="16" font-weight="bold" fill="#0f172a">Пульсації моменту та зубцеве залипання (Cogging Torque Waveform)</text>
  <text x="50" y="56" font-size="12" fill="#475569">Гармонічний спектр залипання T_cog(θ) = -dW_mag/dθ та його придушення скошуванням пазів і FOC</text>

  <!-- Ліва панель: Графік хвильових форм -->
  <rect x="30" y="78" width="470" height="362" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="50" y="104" font-size="14" font-weight="bold" fill="#0f172a">Осцилограма паразитних гармонік моменту</text>
  <text x="50" y="122" font-size="11" fill="#64748b">Залежність крутного моменту T від кутового положення ротора θ</text>

  <!-- Координатна площина графіка -->
  <rect x="55" y="140" width="420" height="180" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />

  <!-- Сітка графіка -->
  <path d="M 55 230 L 475 230" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4" />
  <path d="M 125 140 L 125 320 M 195 140 L 195 320 M 265 140 L 265 320 M 335 140 L 335 320 M 405 140 L 405 320" stroke="#f1f5f9" stroke-width="1" />

  <!-- Хвиля 1: Нескошений двигун (червона, велика амплітуда) -->
  <path d="M 60 230 Q 77 160, 95 230 T 130 230 T 165 230 T 200 230 T 235 230 T 270 230 T 305 230 T 340 230 T 375 230 T 410 230 T 445 230 T 470 230" fill="none" stroke="#ef4444" stroke-width="2.5" />

  <!-- Хвиля 2: Скошені пази (зелена, мала амплітуда -85%) -->
  <path d="M 60 230 Q 77 215, 95 230 T 130 230 T 165 230 T 200 230 T 235 230 T 270 230 T 305 230 T 340 230 T 375 230 T 410 230 T 445 230 T 470 230" fill="none" stroke="#10b981" stroke-width="2" />

  <!-- Хвиля 3: FOC активна компенсація (синя пряма) -->
  <path d="M 60 230 L 470 230" fill="none" stroke="#2563eb" stroke-width="1.5" />

  <!-- Підписи осей та легенда графіка -->
  <rect x="55" y="330" width="420" height="96" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
  <text x="70" y="352" font-size="11" font-weight="bold" fill="#ef4444">■ Прямі пази (без скосу):</text>
  <text x="220" y="352" font-size="11" fill="#334155">когінг досягає 5..10% від T_ном (вібрація й нерівність)</text>

  <text x="70" y="374" font-size="11" font-weight="bold" fill="#10b981">■ Скошені пази (Skewing):</text>
  <text x="220" y="374" font-size="11" fill="#334155">зниження амплітуди на 80..90% суто механічно</text>

  <text x="70" y="396" font-size="11" font-weight="bold" fill="#2563eb">■ FOC карта когінгу:</text>
  <text x="220" y="396" font-size="11" fill="#334155">протифазний струм випередження усуває залишкові хвилі</text>

  <text x="70" y="416" font-size="10" fill="#64748b">Періодичність за оберт вала: N_cog = НСК(Q, 2p) = НСК(24, 28) = 168 імпульсів</text>

  <!-- Права панель: 3 аналітичні блоки -->
  <!-- Блок 1: Фізика зубцевого залипання -->
  <rect x="515" y="78" width="415" height="114" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="535" y="104" font-size="13" font-weight="bold" fill="#0f172a">1. Фізична природа зубцевого залипання</text>
  <text x="535" y="126" font-size="11" fill="#334155">• Реактивний момент без струму: T_cog(θ) = -dW_mag / dθ</text>
  <text x="535" y="144" font-size="11" fill="#334155">• Постійні магніти намагаються мінімізувати магнітний опір зазору</text>
  <text x="535" y="162" font-size="11" fill="#334155">• Кількість стабільних положень за оберт: N_cog = LCM(Q, 2·p)</text>
  <text x="535" y="180" font-size="10" fill="#64748b">У чутливих коботах когінг заважає відчути легкий дотик оператора</text>

  <!-- Блок 2: Скошування пазів статора або магнітів -->
  <rect x="515" y="202" width="415" height="114" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="535" y="228" font-size="13" font-weight="bold" fill="#0f172a">2. Конструктивне усунення: Skewing пазів</text>
  <text x="535" y="250" font-size="11" fill="#334155">• Зсув пазів статора або сегментів магнітів на кут θ_skew = 2π / N_cog</text>
  <text x="535" y="268" font-size="11" fill="#334155">• Поступове перекриття полюсів згладжує градієнт енергії dW_mag</text>
  <text x="535" y="286" font-size="11" fill="#16a34a" font-weight="bold">• Недолік: падіння корисної ЕРС і коефіцієнта моменту K_t на 2..4%</text>
  <text x="535" y="304" font-size="10" fill="#64748b">Також використовують дробові зубцеві обмотки із взаємним зсувом</text>

  <!-- Блок 3: Алгоритмічна компенсація за картою -->
  <rect x="515" y="326" width="415" height="114" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="535" y="352" font-size="13" font-weight="bold" fill="#0f172a">3. FOC-компенсація в реальному часі</text>
  <text x="535" y="374" font-size="11" fill="#334155">• Калібрувальний прогін без навантаження фіксує карту моменту T_cog(θ)</text>
  <text x="535" y="392" font-size="11" fill="#2563eb" font-weight="bold">• Попереднє підмішування струму: I_comp(θ) = -T_cog(θ) / K_t</text>
  <text x="535" y="410" font-size="11" fill="#334155">• Повна прозорість трансмісії та відсутність вібрацій при малій швидкості</text>
  <text x="535" y="428" font-size="10" fill="#64748b">Реалізується на високошвидкісних DSP (TI C2000, STM32G4)</text>
</svg>
