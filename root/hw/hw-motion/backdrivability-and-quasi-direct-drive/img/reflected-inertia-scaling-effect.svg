<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біле тло -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Масштабування приведеної інерції ротора: квадратичний бар'єр редукції</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Приведена інерція ротора зростає як J_reflected = J_rotor · i², визначаючи силу контактного удару</text>

  <!-- Ліва панель: Графік квадратичного зростання -->
  <rect x="30" y="75" width="430" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="245" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Крива приведеної інерції ротора</text>

  <!-- Осі графіка -->
  <!-- Вісь Y -->
  <line x1="80" y1="380" x2="80" y2="130" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="40" y="140" font-size="12" font-weight="bold" fill="#1a1a1a">J_ref, кг·м²</text>

  <!-- Вісь X -->
  <line x1="80" y1="380" x2="430" y2="380" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="325" y="415" font-size="12" font-weight="bold" fill="#1a1a1a">Передатне число i</text>

  <!-- Поділки X -->
  <line x1="115" y1="380" x2="115" y2="385" stroke="#1a1a1a" stroke-width="1"/>
  <text x="115" y="400" text-anchor="middle" font-size="11" fill="#6b7280">1:1</text>

  <line x1="155" y1="380" x2="155" y2="385" stroke="#1a1a1a" stroke-width="1"/>
  <text x="155" y="400" text-anchor="middle" font-size="11" fill="#6b7280">8:1</text>

  <line x1="250" y1="380" x2="250" y2="385" stroke="#1a1a1a" stroke-width="1"/>
  <text x="250" y="400" text-anchor="middle" font-size="11" fill="#6b7280">50:1</text>

  <line x1="380" y1="380" x2="380" y2="385" stroke="#1a1a1a" stroke-width="1"/>
  <text x="380" y="400" text-anchor="middle" font-size="11" fill="#6b7280">100:1</text>

  <!-- Зона QDD (зелена) -->
  <rect x="115" y="330" width="55" height="50" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="142" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Зона QDD</text>

  <!-- Зона високої редукції (червона) -->
  <rect x="280" y="160" width="130" height="220" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="345" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Зона високої редукції</text>

  <!-- Параболічна крива -->
  <path d="M 80,380 Q 200,375 280,290 T 390,165" fill="none" stroke="#2457d6" stroke-width="3"/>
  <text x="210" y="275" font-size="12" font-weight="bold" fill="#2457d6">J_ref ~ i²</text>

  <!-- Точка QDD -->
  <circle cx="155" cy="376" r="4" fill="#27ae60"/>
  <text x="170" y="365" font-size="11" fill="#27ae60">0.0064 кг·м²</text>

  <!-- Точка 100:1 -->
  <circle cx="380" cy="175" r="4" fill="#c0392b"/>
  <text x="315" y="190" font-size="11" fill="#c0392b">1.0000 кг·м²</text>


  <!-- Права панель: Фізичні наслідки при контактному ударі -->
  <rect x="480" y="75" width="450" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="705" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Поведінка ланки при раптовому зіткненні</text>

  <!-- Блок QDD (зелений) -->
  <rect x="500" y="120" width="410" height="135" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="515" y="142" font-size="13" font-weight="bold" fill="#27ae60">Квазіпрямий привод (QDD, i = 6:1..10:1)</text>

  <rect x="515" y="155" width="120" height="55" rx="3" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="575" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Малий маховик</text>
  <text x="575" y="195" text-anchor="middle" font-size="11" fill="#27ae60">J_ref = 0.006 кг·м²</text>

  <line x1="645" y1="182" x2="695" y2="182" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="670" y="175" text-anchor="middle" font-size="11" fill="#2457d6">Удар</text>

  <rect x="705" y="155" width="190" height="55" rx="3" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="715" y="175" font-size="11" font-weight="bold" fill="#27ae60">Пружне провертання</text>
  <text x="715" y="195" font-size="11" fill="#1a1a1a">Низький піковий удар F_peak</text>

  <text x="515" y="235" font-size="11" fill="#1a1a1a">Трансмісія прозора: удар зворотно розкручує ротор без пошкодження зубів</text>


  <!-- Блок Високої редукції (червоний) -->
  <rect x="500" y="270" width="410" height="145" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="515" y="292" font-size="13" font-weight="bold" fill="#c0392b">Високоредукторний привод (i = 50:1..100:1)</text>

  <rect x="515" y="305" width="120" height="55" rx="3" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="575" y="325" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Величезний маховик</text>
  <text x="575" y="345" text-anchor="middle" font-size="11" fill="#c0392b">J_ref = 1.000 кг·м²</text>

  <line x1="645" y1="332" x2="695" y2="332" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="670" y="325" text-anchor="middle" font-size="11" fill="#c0392b">Удар</text>

  <rect x="705" y="305" width="190" height="55" rx="3" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="715" y="325" font-size="11" font-weight="bold" fill="#c0392b">Жорстке гальмування</text>
  <text x="715" y="345" font-size="11" fill="#1a1a1a">Колосальна сила удару F_peak</text>

  <text x="515" y="385" font-size="11" fill="#1a1a1a">Трансмісія незворотна: удар ламає зуби передачі та деформує шарніри</text>
  <text x="515" y="402" font-size="11" fill="#6b7280">Еквівалентна маса в точці контакту зростає у 156 разів</text>
</svg>
