<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий міст уміє і зупиняти: гальмо проти вибігу</text>
<text x="170.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гальмо: обидва нижні ключі</text>
<circle cx="170.0" cy="165.0" r="30.0" fill="#eef2f7" stroke="#333333" stroke-width="2.0"/><text x="170.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">M</text>
<path d="M140 165 Q 170 235 200 165" fill="none" stroke="#27ae60" stroke-width="2.6"/>
<line x1="164.0" y1="217.0" x2="182.0" y2="215.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="170.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">струм біжить по колу — гальмує</text>
<text x="170.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">мотор закорочено сам на себе → різко стає</text>
<text x="530.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вибіг: усі ключі закрито</text>
<circle cx="530.0" cy="165.0" r="30.0" fill="#eef2f7" stroke="#333333" stroke-width="2.0"/><text x="530.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">M</text>
<line x1="500.0" y1="165.0" x2="470.0" y2="165.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="560.0" y1="165.0" x2="590.0" y2="165.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="460.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="end" font-weight="700">×</text>
<text x="600.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="start" font-weight="700">×</text>
<text x="530.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">від'єднано — крутиться вільно</text>
<text x="530.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">мотор відпущено → котиться за інерцією</text>
</svg>