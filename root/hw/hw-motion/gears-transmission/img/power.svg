<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потужність крізь передачу зберігається — міняється лише її форма</text>
<rect x="92.6" y="110.6" width="74.7" height="78.8" rx="6" fill="#eef2f8" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">ВХІД</tspan><tspan x="130.0" dy="15.6">момент M</tspan><tspan x="130.0" dy="15.6">оберти n</tspan><tspan x="130.0" dy="15.6">P = M·n</tspan></text>
<rect x="312.4" y="118.4" width="95.2" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">ПЕРЕДАЧА</tspan><tspan x="360.0" dy="15.6">міняє M ↔ n</tspan><tspan x="360.0" dy="15.6">(− тертя)</tspan></text>
<rect x="555.8" y="110.6" width="88.4" height="78.8" rx="6" fill="#fbeee6" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">ВИХІД</tspan><tspan x="600.0" dy="15.6">момент M×2</tspan><tspan x="600.0" dy="15.6">оберти n÷2</tspan><tspan x="600.0" dy="15.6">P та сама</tspan></text>
<line x1="167.4" y1="150.0" x2="312.4" y2="150.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="407.6" y1="150.0" x2="555.8" y2="150.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="360.0" y1="181.6" x2="360.0" y2="227.6" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="360.0" y="245.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">втрати → тепло (тертя зубців)</text>
<text x="360.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">добуток момент·оберти на вході ≈ добуток момент·оберти на виході</text>
<text x="360.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">більший момент даровий не буває — за нього платимо обертами</text>
</svg>