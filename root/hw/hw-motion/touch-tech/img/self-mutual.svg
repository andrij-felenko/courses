<text x="210.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">палець додає ємність до землі (Cs росте)</text>
<text x="210.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b07d18" text-anchor="middle" font-weight="700">просто, але два пальці → «привиди»</text>
<text x="560.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">mutual — ємність рядок↔стовпець</text>
