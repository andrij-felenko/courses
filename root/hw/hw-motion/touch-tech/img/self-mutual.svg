<text x="560.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">палець краде поле між ними (Cm падає)</text>
<text x="560.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">кожен перетин окремо → справжній мультитач</text>
<text x="380.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Тому сучасні екрани — mutual: сітка рядків і стовпців дає повну 2D-карту дотиків, а не одну пляму.</text>
