<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470"
     viewBox="0 0 960 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">KV — головна цифра мотора: оберти на вольт (на холостому)</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">високий KV — швидко й слабкий момент; низький — повільно й сильний</text>
<line x1="120" y1="250" x2="840" y2="250" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="120" y="280" font-size="12" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">низький KV</text>
<text x="820" y="280" font-size="12" fill="#cc0000" text-anchor="end" font-weight="bold" font-style="normal">високий KV</text>
<text x="480" y="280" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">KV (об/хв на вольт)</text>
<rect x="120" y="90" width="320" height="130" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="280" y="116" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">~400 KV — низький</text>
<text x="140" y="142" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">повільно, але сильний момент</text>
<text x="140" y="162" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ великі гвинти, важкий апарат</text>
<text x="140" y="182" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">(підйомні, вантажні дрони)</text>
<rect x="540" y="90" width="320" height="130" rx="12" fill="#fff0f0" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.7"/>
<text x="700" y="116" font-size="13" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">~2400 KV — високий</text>
<text x="560" y="142" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">швидко, але слабкий момент</text>
<text x="560" y="162" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ малі гвинти, легкий апарат</text>
<text x="560" y="182" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">(гоночні дрони)</text>
<line x1="280" y1="220" x2="280" y2="244" stroke="#0a8f3c" stroke-width="1.5" marker-end="url(#arrG)" stroke-opacity="1.0" stroke-linecap="round"/>
<line x1="700" y1="220" x2="700" y2="244" stroke="#cc0000" stroke-width="1.5" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="120" y="320" width="720" height="96" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="140" y="346" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">Холості оберти ≈ KV × напруга:</text>
<text x="140" y="372" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal" font-family="Consolas, monospace">напр. 900 KV × 14.8 В ≈ 13 300 об/хв (без навантаження)</text>
<text x="140" y="398" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">Момент і KV — обернені: що вищий KV, то менший момент на ампер.</text>
<text x="480.0" y="458" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Тому мотор добирають у парі з гвинтом і напругою: KV, гвинт і число банок батареї мусять пасувати одне до одного.</text>
</svg>
