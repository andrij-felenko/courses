<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480"
     viewBox="0 0 960 480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="480" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Зворотна ЕРС: чому мотор сам не розганяється безмежно</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">магніти, що крутяться, наводять напругу ПРОТИ живлення (Ленц, Розділ 8)</text>
<rect x="60" y="110" width="330" height="250" rx="12" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="225" y="134" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Електрична картина</text>
<text x="110" y="180" font-size="14" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">V</text>
<line x1="130" y1="180" x2="200" y2="180" stroke="#1a1a1a" stroke-width="1.6" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="165" y="170" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">R (обмотка)</text>
<rect x="200" y="168" width="50" height="24" rx="3" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="290" y="180" font-size="11" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">E (зв. ЕРС)</text>
<line x1="250" y1="180" x2="300" y2="180" stroke="#1a1a1a" stroke-width="1.6" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="70" y="250" width="300" height="90" rx="9" fill="#f3f7ff" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.3"/>
<text x="90" y="274" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">струм (момент):</text>
<text x="90" y="300" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal" font-family="Consolas, monospace">I = (V − E) / R</text>
<text x="90" y="324" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">E зростає зі швидкістю → I падає</text>
<line x1="470" y1="350" x2="890" y2="350" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="890" y="368" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="normal" font-style="normal">швидкість</text>
<line x1="470" y1="350" x2="470" y2="120" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="462" y="126" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="bold" font-style="normal">напруга</text>
<line x1="470" y1="160" x2="870" y2="160" stroke="#cc0000" stroke-width="1.6" stroke-dasharray="6,4" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="478" y="152" font-size="11" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">V (живлення)</text>
<line x1="470" y1="350" x2="830" y2="160" stroke="#1f4ed8" stroke-width="2.6" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="720" y="250" font-size="11" fill="#1f4ed8" text-anchor="start" font-weight="bold" font-style="normal">E = зворотна ЕРС ∝ швидкість</text>
<circle cx="830" cy="160" r="6" fill="#0a8f3c" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="770" y="138" font-size="10.5" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">холостий хід: E ≈ V → I ≈ 0</text>
<line x1="650" y1="350" x2="650" y2="250" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="654" y="270" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">під навантаженням:</text>
<text x="654" y="284" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">повільніше → E менша →</text>
<text x="654" y="298" font-size="10" fill="#6b7280" text-anchor="start" font-weight="normal" font-style="normal">більший струм → більший момент</text>
<text x="480.0" y="468" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Тому мотор саморегулюється: важче навантаження — нижчі оберти, нижча E, більший струм і момент. Швидкість задає напруга, момент — струм.</text>
</svg>
