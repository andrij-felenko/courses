<text x="146.07695154586736" y="185.0" font-size="13" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">B</text>
<text x="106.07695154586736" y="180.0" font-size="10" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">− струм</text>
<line x1="250" y1="240" x2="353.92304845413264" y2="179.99999999999994" stroke="#1f4ed8" stroke-width="2.0" stroke-dasharray="6,4" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="353.92304845413264" cy="179.99999999999994" r="18" fill="white" fill-opacity="1.0" stroke="#1f4ed8" stroke-width="1.8"/>
<text x="353.92304845413264" y="184.99999999999994" font-size="13" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">C</text>
<text x="393.92304845413264" y="179.99999999999994" font-size="10" fill="#1f4ed8" text-anchor="middle" font-weight="bold" font-style="normal">ВІЛЬНА</text>
<text x="250" y="410" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="normal" font-style="normal">у кожен момент: 2 фази під струмом, 1 вільна</text>
<rect x="520" y="110" width="390" height="240" rx="11" fill="white" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="715" y="134" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Напруга на вільній фазі (C)</text>
<line x1="560" y1="230" x2="880" y2="230" stroke="#6b7280" stroke-width="1.0" stroke-opacity="1.0" stroke-linecap="round"/>
