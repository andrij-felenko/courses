  <rect x="0" y="0" width="940" height="470" fill="white"/>
<text x="470.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Як ESC «знає», коли перемикати: слухає зворотну ЕРС</text>
<text x="470.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">дві фази під струмом, третя «вільна» — її напруга підказує положення ротора</text>
<circle cx="250" cy="240" r="6" fill="#1a1a1a" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<line x1="250" y1="240" x2="250.0" y2="360.0" stroke="#cc0000" stroke-width="3.0" stroke-opacity="1.0" stroke-linecap="round"/>
<circle cx="250.0" cy="360.0" r="18" fill="white" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.8"/>
<text x="250.0" y="365.0" font-size="13" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">A</text>
<text x="210.0" y="360.0" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">+ струм</text>
<line x1="250" y1="240" x2="146.07695154586736" y2="180.0" stroke="#0a8f3c" stroke-width="3.0" stroke-opacity="1.0" stroke-linecap="round"/>
