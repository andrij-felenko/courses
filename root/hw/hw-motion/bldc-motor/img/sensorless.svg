<circle cx="720" cy="230" r="6" fill="#cc0000" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="720" y="260" font-size="10.5" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">перетин нуля</text>
<text x="720" y="276" font-size="10.5" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">→ тут перемкнути фази</text>
<rect x="520" y="366" width="390" height="70" rx="10" fill="#fff0f0" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.4"/>
<text x="540" y="390" font-size="11.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">Проблема старту:</text>
<text x="540" y="410" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">на місці ротор не рухається → зворотної ЕРС нема →</text>
<text x="540" y="425" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">ESC мусить «штовхати» наосліп, поки мотор не розкрутиться.</text>
<text x="470.0" y="458" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Тому деякі мотори мають окремі давачі Холла — але більшість дронових ESC обходяться зворотною ЕРС (дешевше, без дротів).</text>
