<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 860 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="860" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="840.0" height="360.0" rx="0" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<rect x="20.0" y="20.0" width="245.0" height="320.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<text x="142.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізика: обертання магніту</text>
<circle cx="142.0" cy="125.0" r="46.0" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<rect x="106.0" y="89.0" width="72.0" height="36.0" rx="4" fill="#ffdddd" stroke="#c0392b" stroke-width="1.5"/>
<text x="142.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">N (магніт)</text>
<rect x="106.0" y="125.0" width="72.0" height="36.0" rx="4" fill="#dce6f8" stroke="#2457d6" stroke-width="1.5"/>
<text x="142.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">S (магніт)</text>
<line x1="184.0" y1="100.0" x2="184.0" y2="150.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="198.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">ω</text>
<rect x="35.0" y="185.0" width="215.0" height="38.0" rx="4" fill="#ffffff" stroke="#caa24a" stroke-width="1.6"/>
<text x="142.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#856404" text-anchor="middle" font-weight="700">Обмотка статора (котушка)</text>
<text x="142.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Зміна потоку: dΦ/dt</text>
<line x1="45.0" y1="235.0" x2="240.0" y2="235.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="142.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Генерація протиЕРС:</text>
<text x="142.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">E = ke · ω  (протидіє струму)</text>
<text x="142.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Закон Фарадея + Ленца</text>
<rect x="280.0" y="20.0" width="265.0" height="320.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<text x="412.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еквівалентна схема фази</text>
<circle cx="325.0" cy="110.0" r="18.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="325.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">V</text>
<text x="325.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">+ Живлення</text>
<line x1="343.0" y1="110.0" x2="365.0" y2="110.0" stroke="#333333" stroke-width="1.8"/>
<line x1="345.0" y1="102.0" x2="362.0" y2="102.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="355.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">I</text>
<rect x="365.0" y="100.0" width="32.0" height="20.0" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="381.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">R</text>
<text x="381.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Опір</text>
<line x1="397.0" y1="110.0" x2="415.0" y2="110.0" stroke="#333333" stroke-width="1.8"/>
<rect x="415.0" y="102.0" width="34.0" height="16.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="432.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">L</text>
<text x="432.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">L di/dt</text>
<line x1="449.0" y1="110.0" x2="470.0" y2="110.0" stroke="#333333" stroke-width="1.8"/>
<circle cx="488.0" cy="110.0" r="18.0" fill="#fff2e6" stroke="#c0392b" stroke-width="1.8"/>
<text x="488.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">E</text>
<text x="488.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">ПротиЕРС</text>
<line x1="500.0" y1="138.0" x2="475.0" y2="138.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="488.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">назустріч V</text>
<line x1="506.0" y1="110.0" x2="525.0" y2="110.0" stroke="#333333" stroke-width="1.8"/>
<line x1="525.0" y1="110.0" x2="525.0" y2="175.0" stroke="#333333" stroke-width="1.8"/>
<line x1="525.0" y1="175.0" x2="325.0" y2="175.0" stroke="#333333" stroke-width="1.8"/>
<line x1="325.0" y1="175.0" x2="325.0" y2="128.0" stroke="#333333" stroke-width="1.8"/>
<rect x="295.0" y="200.0" width="235.0" height="120.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="412.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівняння рівноваги напруг:</text>
<text x="412.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">V = I·R + L·(dI/dt) + E</text>
<text x="412.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">В усталеному стані (dI/dt = 0):</text>
<text x="412.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">I = (V − E) / R = (V − ke·ω) / R</text>
<rect x="560.0" y="20.0" width="260.0" height="320.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<text x="690.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3 режими роботи мотора</text>
<rect x="570.0" y="65.0" width="240.0" height="75.0" rx="4" fill="#fff0f0" stroke="#c0392b" stroke-width="1.2"/>
<text x="690.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1. Заклинювання / Пуск (ω = 0)</text>
<text x="690.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">E = 0  →  I_stall = V / R  (максимум)</text>
<text x="690.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Струм обмежений лише міддю → нагрів</text>
<text x="690.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Момент максимальний: T = kt · I_stall</text>
<rect x="570.0" y="150.0" width="240.0" height="75.0" rx="4" fill="#f0f9f0" stroke="#27ae60" stroke-width="1.2"/>
<text x="690.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">2. Холостий хід (ω = ω_max)</text>
<text x="690.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">E → V  →  I_0 = (V − E) / R ≈ 0</text>
<text x="690.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Струм покриває лише тертя у підшипниках</text>
<text x="690.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Гранична швидкість: ω_0 ≈ V / ke</text>
<rect x="570.0" y="235.0" width="240.0" height="90.0" rx="4" fill="#edf4ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="690.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">3. Генерація / Рекуперація</text>
<text x="690.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">E &gt; V (привід крутить вал) → I &lt; 0</text>
<text x="690.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">Струм тече НАЗАД у шину живлення</text>
<text x="690.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Електричне гальмування вала</text>
<text x="690.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Небезпека росту Vbus на ключах</text>
</svg>