<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вольт-секундний баланс і розклад вектора в Секторі I</text>
<line x1="100.0" y1="430.0" x2="420.0" y2="430.0" stroke="#c0392b" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="434.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">V₁ (100) [2/3·V_dc]</text>
<line x1="100.0" y1="430.0" x2="260.0" y2="152.9" stroke="#2457d6" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="270.0" y="140.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">V₂ (110) [2/3·V_dc]</text>
<line x1="260.6" y1="430.0" x2="331.7" y2="306.8" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5,4"/>
<line x1="171.1" y1="306.8" x2="331.7" y2="306.8" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5,4"/>
<line x1="100.0" y1="430.0" x2="260.6" y2="430.0" stroke="#c0392b" stroke-width="4.5"/>
<line x1="100.0" y1="430.0" x2="171.1" y2="306.8" stroke="#2457d6" stroke-width="4.5"/>
<line x1="100.0" y1="430.0" x2="331.7" y2="306.8" stroke="#8e44ad" stroke-width="3.2" marker-end="url(#arrow)"/>
<rect x="321.4" y="266.2" width="190.5" height="45.3" rx="6" fill="#fbf8fd" stroke="#8e44ad" stroke-width="1.5"/><text x="416.7" y="285.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700"><tspan x="416.7" dy="0.0">V_ref (заданий вектор)</tspan><tspan x="416.7" dy="14.3">V_ref·T_s = V₁·T₁ + V₂·T₂</tspan></text>
<path d="M 175.0,430.0 L 175.0,428.7 L 175.0,427.4 L 174.9,426.1 L 174.8,424.8 L 174.7,423.5 L 174.6,422.2 L 174.4,420.9 L 174.3,419.6 L 174.1,418.3 L 173.9,417.0 L 173.6,415.7 L 173.4,414.4 L 173.1,413.1 L 172.8,411.9 L 172.4,410.6 L 172.1,409.3 L 171.7,408.1 L 171.3,406.8 L 170.9,405.6 L 170.5,404.3 L 170.0,403.1 L 169.5,401.9 L 169.0,400.7 L 168.5,399.5 L 168.0,398.3 L 167.4,397.1 L 166.8,396.0 L 166.2,394.8" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="192.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">θ</text>
<rect x="124.5" y="442.0" width="131.6" height="32.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="190.3" y="462.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="190.3" dy="0.0">V₁ · (T₁ / T_s)</tspan></text>
<rect x="24.8" y="332.4" width="131.6" height="32.0" rx="6" fill="#f0f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="90.6" y="352.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="90.6" dy="0.0">V₂ · (T₂ / T_s)</tspan></text>
<rect x="526.9" y="155.3" width="306.1" height="149.4" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="680.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Вольт-секундний баланс:</tspan><tspan x="680.0" dy="14.3">V_ref · T_s = V₁ · T₁ + V₂ · T₂ + V₀ · T₀</tspan><tspan x="680.0" dy="14.3"></tspan><tspan x="680.0" dy="14.3">Часи активних векторів:</tspan><tspan x="680.0" dy="14.3">T₁ = √3 · (T_s·|V_ref| / V_dc) · sin(60° − θ)</tspan><tspan x="680.0" dy="14.3">T₂ = √3 · (T_s·|V_ref| / V_dc) · sin(θ)</tspan><tspan x="680.0" dy="14.3"></tspan><tspan x="680.0" dy="14.3">Час нульових векторів:</tspan><tspan x="680.0" dy="14.3">T₀ = T_s − T₁ − T₂   (ділиться між V₀ і V₇)</tspan></text>
</svg>