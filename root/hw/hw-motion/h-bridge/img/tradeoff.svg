<text x="350.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ЯКРАЗ</text>
<text x="530.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c98a14" text-anchor="middle" font-weight="700">ЗАБАГАТО</text>
