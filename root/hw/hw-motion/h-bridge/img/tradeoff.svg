<text x="350.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Правило: мертвий час трохи довший за найгірший час вимикання ключа (Qgd, Rg, темп.).</text>
<text x="350.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">На практиці — апаратний комплементарний ШІМ із програмованим мертвим часом, не дві ніжки вручну.</text>
