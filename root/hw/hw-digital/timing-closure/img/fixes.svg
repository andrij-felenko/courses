<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чим виправляють від'ємний slack</text>
<rect x="60.0" y="70.0" width="560.0" height="34.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="626.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">період</text>
<rect x="60.0" y="74.0" width="650.0" height="26.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="260.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">критичний шлях задовгий → slack &lt; 0</text>
<rect x="60.0" y="170.0" width="315.0" height="96.0" rx="8" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="217.5" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="217.5" dy="0.0">Конвеєр</tspan><tspan x="217.5" dy="18.2">(розрізати регістром)</tspan></text>
<text x="217.5" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="217.5" dy="0.0">довгий шлях → дві короткі</tspan><tspan x="217.5" dy="15.6">ділянки; +1 такт латентності</tspan></text>
<rect x="405.0" y="170.0" width="315.0" height="96.0" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="562.5" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="562.5" dy="0.0">Більший драйвер</tspan><tspan x="562.5" dy="18.2">(gate sizing)</tspan></text>
<text x="562.5" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="562.5" dy="0.0">сильніший вентиль</tspan><tspan x="562.5" dy="15.6">швидше жене ємність</tspan></text>
<rect x="60.0" y="292.0" width="315.0" height="96.0" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="217.5" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="217.5" dy="0.0">Буфери на дроті</tspan></text>
<text x="217.5" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="217.5" dy="0.0">довгий дріт ділять —</tspan><tspan x="217.5" dy="15.6">RC-затримка падає</tspan></text>
<rect x="405.0" y="292.0" width="315.0" height="96.0" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="562.5" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="562.5" dy="0.0">Менше рівнів логіки</tspan><tspan x="562.5" dy="18.2">(перебудова)</tspan></text>
<text x="562.5" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="562.5" dy="0.0">переписати вузол так,</tspan><tspan x="562.5" dy="15.6">щоб шлях був коротший</tspan></text>
</svg>