<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="aInk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker><marker id="aPos" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="360.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від критичного шляху до максимальної частоти</text>
<rect x="90.0" y="70.0" width="540.0" height="50.0" rx="6" fill="#f0f1f4" stroke="#1a1a1a" stroke-width="1.5"/><text x="360.0" y="99.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">T_такт  ≥  t_cq + t_logic + t_setup  =  критичний шлях</tspan></text>
<line x1="360.0" y1="124.0" x2="360.0" y2="152.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="200.0" y="156.0" width="320.0" height="46.0" rx="6" fill="#fff6e6" stroke="#b8860b" stroke-width="1.5"/><text x="360.0" y="184.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#8a6400" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Fmax = 1 / критичний шлях</tspan></text>
<rect x="90.0" y="224.0" width="540.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="251.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Приклад: критичний шлях 8 нс  →  Fmax = 1 / 8 нс = 125 МГц</tspan></text>
<text x="360.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">коротший шлях (менше логіки між тригерами) → вища Fmax; довший → нижча</text>
</svg>