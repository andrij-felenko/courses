<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двоетапна структура методу Квайна–Мак-Класкі</text>
<rect x="30.0" y="40.0" width="365.0" height="340.0" rx="10" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="212.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Фаза 1: Генерація простих імплікантів</text>
<rect x="50.0" y="95.0" width="325.0" height="48.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="212.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мінтерми функції F та don't-care (d)</text>
<text x="212.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Подання двійковими векторами {0, 1}ⁿ</text>
<line x1="212.0" y1="143.0" x2="212.0" y2="163.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="165.0" width="325.0" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="212.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розбиття за вагою Геммінга</text>
<text x="212.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Групи G₀, G₁, …, Gₙ за кількістю одиниць (popcount)</text>
<line x1="212.0" y1="217.0" x2="212.0" y2="237.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="239.0" width="325.0" height="58.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="212.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Каскадне склеювання (Gₖ × Gₖ₊₁)</text>
<text x="212.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Сусідні за 1 біт → прочерк «-» (d_H = 1)</text>
<text x="212.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ітерація: 1-куби → 2-куби → 4-куби …</text>
<line x1="212.0" y1="297.0" x2="212.0" y2="317.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="319.0" width="325.0" height="45.0" rx="6" fill="#fdf6e3" stroke="#c0392b" stroke-width="1.5"/>
<text x="212.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Усі несклеєні терми (Prime Implicants)</text>
<text x="212.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Повний набір максимальних склейок функції</text>
<line x1="395.0" y1="210.0" x2="443.0" y2="210.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="420.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Імпліканти</text>
<rect x="445.0" y="40.0" width="365.0" height="340.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="627.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Фаза 2: Оптимальне покриття мінтермів</text>
<rect x="465.0" y="95.0" width="325.0" height="48.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="627.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Таблиця покриття (PI Chart)</text>
<text x="627.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Рядки — прості імпліканти, стовпці — мінтерми F</text>
<line x1="627.0" y1="143.0" x2="627.0" y2="163.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="465.0" y="165.0" width="325.0" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="627.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виділення істотних імплікантів (EPI)</text>
<text x="627.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Стовпці з єдиним «X» → неминучі доданки</text>
<line x1="627.0" y1="217.0" x2="627.0" y2="237.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="465.0" y="239.0" width="325.0" height="58.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="627.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Редукція та розв'язання ядра</text>
<text x="627.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Домінування рядків і стовпців</text>
<text x="627.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Циклічне ядро → метод Патріка або розгалуження</text>
<line x1="627.0" y1="297.0" x2="627.0" y2="317.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="465.0" y="319.0" width="325.0" height="45.0" rx="6" fill="#fdf6e3" stroke="#27ae60" stroke-width="1.5"/>
<text x="627.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Мінімальна ДНФ (Exact Minimal SOP)</text>
<text x="627.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Найменше число доданків і літер</text>
</svg>