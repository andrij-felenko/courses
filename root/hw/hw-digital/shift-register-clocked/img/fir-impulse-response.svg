<rect x="114.7" y="362.4" width="550.7" height="67.2" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="390.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Одна 1 заходить у регістр і крокує по комірках: на такті k вона стоїть у k-му</tspan><tspan x="390.0" dy="15.6">відводі, множиться на bₖ — і виходить bₖ. Пройшла всі N комірок → вихід згас.</tspan><tspan x="390.0" dy="15.6">Тому відповідь на імпульс СКІНЧЕННА, а коефіцієнти bₖ — це і є ця відповідь.</tspan></text>
