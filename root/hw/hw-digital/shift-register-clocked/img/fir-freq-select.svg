<rect x="97.6" y="376.4" width="584.9" height="67.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="398.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">У вікні усереднення повільний сигнал майже сталий — сума ≈ сам сигнал (проходить).</tspan><tspan x="390.0" dy="15.6">Знакозмінний +1,−1,… у сумі гаситься в нуль (вирізаний). Ось звідки «пропускає</tspan><tspan x="390.0" dy="15.6">низькі частоти»: усереднення — це фільтр, а коефіцієнти задають, ЩО пропустити.</tspan></text>
