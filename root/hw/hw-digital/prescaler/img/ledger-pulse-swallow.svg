<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один повний цикл = дві фази. Складаємо вхідні імпульси прескейлера</text>
<rect x="60.0" y="78.0" width="288.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="204.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">S циклів у режимі ÷(N+1)</text>
<text x="204.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">кожен цикл = N+1 вхідних імпульсів</text>
<rect x="348.0" y="78.0" width="372.0" height="52.0" rx="6" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.8"/>
<text x="534.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">(P − S) циклів у режимі ÷N</text>
<text x="534.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">кожен цикл = N вхідних імпульсів</text>
<text x="53.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">лічильник-ковтач S:</text>
<text x="204.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">рахує від S до 0</text>
<text x="534.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">стоїть (вже вичерпаний)</text>
<text x="60.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">головний лічильник P:</text>
<text x="204.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">минуло S циклів</text>
<text x="534.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">лишилось (P − S)</text>
<rect x="120.0" y="214.0" width="540.0" height="96.0" rx="6" fill="#fffbe9" stroke="#b8862b" stroke-width="1.8"/><text x="390.0" y="249.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">вхідних імпульсів за фазу ÷(N+1):  (N+1)·S</tspan><tspan x="390.0" dy="16.9">вхідних імпульсів за фазу ÷N:      N·(P − S)</tspan><tspan x="390.0" dy="16.9">разом за цикл:  (N+1)·S + N·(P−S)  =  N·P + S</tspan></text>
</svg>