<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат антибрязкоту: не вірити першій зміні</text>
<text x="450.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">дочекатися, поки рівень устоїться за час T, і лише тоді визнати подію</text>
<circle cx="168.0" cy="158.0" r="58.0" fill="#eef6ef" stroke="#27ae60" stroke-width="2.2"/>
<text x="168.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">СТАБІЛЬНИЙ</text>
<text x="168.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">рівень тримається</text>
<circle cx="450.0" cy="158.0" r="58.0" fill="#fbf3e0" stroke="#b8860b" stroke-width="2.2"/>
<text x="450.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b8860b" text-anchor="middle" font-weight="700">ПІД ПІДОЗРОЮ</text>
<text x="450.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">чекаємо час T</text>
<circle cx="732.0" cy="158.0" r="58.0" fill="#eef6ef" stroke="#27ae60" stroke-width="2.2"/>
<text x="732.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">СТАБІЛЬНИЙ′</text>
<text x="732.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">подія!</text>
<line x1="226.0" y1="150.0" x2="392.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="309.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">зміна помічена</text>
<line x1="508.0" y1="150.0" x2="674.0" y2="150.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="591.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">T минув, рівень той самий</text>
<path d="M415,204 Q 309,254 203,204" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="309.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">рівень повернувся — хибна тривога, назад</text>
<text x="450.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дрижання застрягає «під підозрою» й до події не доходить — саме цього ми й хотіли.</text>
</svg>