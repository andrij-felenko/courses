<svg xmlns="http://www.w3.org/2000/svg" width="920" height="250" viewBox="0 0 920 250">
<rect width="920" height="250" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="460.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Брязкіт контактів: понад півтора століття ворогові</text>
<line x1="70.0" y1="150.0" x2="850.0" y2="150.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<circle cx="120.0" cy="150.0" r="6.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<text x="120.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">1840-ві</text>
<text x="120.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">телеграфні реле:</text>
<text x="120.0" y="193.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">контакт клацає, іскрить</text>
<circle cx="320.0" cy="150.0" r="6.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="320.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1888–91</text>
<text x="320.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Строуджер —</text>
<text x="320.0" y="193.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">автоматична АТС</text>
<circle cx="500.0" cy="150.0" r="6.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<text x="500.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1892</text>
<text x="500.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">перша АТС</text>
<text x="500.0" y="193.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(Ла-Порт, Індіана)</text>
<circle cx="680.0" cy="150.0" r="6.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="680.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">XX ст.</text>
<text x="680.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">мільйони контактів</text>
<text x="680.0" y="193.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">у телефонних мережах</text>
<circle cx="835.0" cy="150.0" r="6.0" fill="#caa24a" stroke="#caa24a" stroke-width="1"/>
<text x="835.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">сьогодні</text>
<text x="835.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">пара рядків</text>
<text x="835.0" y="193.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.8" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">коду в МК</text>
<text x="460.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дрижання металевого контакту мучило інженерів задовго до мікроконтролерів.</text>
</svg>
