<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
<rect width="900" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ніжка-вхід: вона не жене напругу, а «нюхає» її</text>
<text x="450.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">високоомний буфер міряє напругу на лінії й видає в ядро чистий 0 або 1</text>
<line x1="70.0" y1="210.0" x2="250.0" y2="210.0" stroke="#1b1b1b" stroke-width="2.6" stroke-linecap="round"/>
<circle cx="70.0" cy="210.0" r="5.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<text x="70.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ніжка-вхід</text>
<text x="120.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Vin = ?</text>
<rect x="250.0" y="150.0" width="250.0" height="120.0" rx="12" fill="#fbfcff" stroke="#1b1b1b" stroke-width="2"/>
<text x="375.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вхідний буфер</text>
<polygon points="300,198 300,252 362,225" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="395.0" y="216.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">компаратор</text>
<text x="395.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">+ тригер Шмітта</text>
<line x1="500.0" y1="210.0" x2="638.0" y2="210.0" stroke="#1b1b1b" stroke-width="2.6" marker-end="url(#aInk)"/>
<rect x="640.0" y="184.0" width="170.0" height="52.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="725.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">0 або 1</text>
<text x="725.0" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">чистий рівень → ядро</text>
<rect x="130.0" y="300.0" width="640.0" height="78.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="1.6"/>
<text x="450.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Вхід — високоомний: бере мікроскопічний струм (нано-/мікроампери),</text>
<text x="450.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тож майже не навантажує лінію — лише вимірює, хто її тримає.</text>
<text x="450.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це дзеркальна протилежність ніжки-виходу, що активно ЖЕНЕ напругу.</text>
</svg>
