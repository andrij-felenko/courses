<line x1="88.0" y1="134.0" x2="232.0" y2="134.0" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="160.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">тримати</text>
<text x="160.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Q лишається</text>
