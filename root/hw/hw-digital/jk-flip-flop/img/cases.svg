<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири режими JK-тригера: тримати · set · reset · перекинути</text>
<text x="450.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">три режими — як у SR (тримати / set / reset); четвертий, J=K=1, — новий: перекинутися</text>
