<text x="360.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">J=1  K=0</text>
<line x1="288.0" y1="134.0" x2="432.0" y2="134.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="360.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">set</text>
<text x="360.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Q → 1</text>
<rect x="470.0" y="90.0" width="180.0" height="150.0" rx="10" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="560.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">J=0  K=1</text>
<line x1="488.0" y1="134.0" x2="632.0" y2="134.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="560.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">reset</text>
<text x="560.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Q → 0</text>
<rect x="670.0" y="90.0" width="180.0" height="150.0" rx="10" fill="#fdf0ea" stroke="#c0392b" stroke-width="2.0"/>
<text x="760.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">J=1  K=1</text>
<line x1="688.0" y1="134.0" x2="832.0" y2="134.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="760.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">перекинути</text>
<text x="760.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Q → Q̄</text>
<text x="760.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">★ новий режим</text>
<text x="450.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">toggle (перекинути) — те, чого SR-засувка не вміла: за J=K=1 вихід щотакту міняється на протилежний</text>
