<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">JK з SR: зворотний зв'язок прибирає заборонений стан</text>
<text x="450.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">заводимо Q̄ на верхній AND, а Q — на нижній: за J=K=1 щоразу набігає команда «перекинутися»</text>
<text x="96.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">J</text>
<line x1="102.0" y1="134.0" x2="210.0" y2="134.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="96.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="end" font-weight="700">K</text>
<line x1="102.0" y1="284.0" x2="210.0" y2="284.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="96.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">такт</text>
<line x1="102.0" y1="207.0" x2="150.0" y2="207.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="150.0" cy="207.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a"/>
<line x1="150.0" y1="207.0" x2="150.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<line x1="150.0" y1="150.0" x2="210.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<line x1="150.0" y1="207.0" x2="150.0" y2="268.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<line x1="150.0" y1="268.0" x2="210.0" y2="268.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<path d="M 210.0,118.0 L 222.0,118.0 A 22.0,22.0 0 0 1 222.0,162.0 L 210.0,162.0 Z" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
<text x="232.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">J·такт·Q̄</text>
<path d="M 210.0,262.0 L 222.0,262.0 A 22.0,22.0 0 0 1 222.0,306.0 L 210.0,306.0 Z" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
<text x="232.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">K·такт·Q</text>
<line x1="244.0" y1="140.0" x2="330.0" y2="168.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<line x1="244.0" y1="284.0" x2="330.0" y2="252.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<rect x="330.0" y="165.0" width="130.0" height="90.0" rx="8" fill="#eef7ee" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="395.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">SR-засувка</text>
<text x="395.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(S=верх, R=низ)</text>
<line x1="460.0" y1="185.0" x2="540.0" y2="185.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="546.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Q</text>
<line x1="460.0" y1="235.0" x2="540.0" y2="235.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="546.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Q̄</text>
<circle cx="520.0" cy="235.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a"/>
<line x1="520.0" y1="235.0" x2="520.0" y2="96.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<line x1="520.0" y1="96.0" x2="175.0" y2="96.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<line x1="175.0" y1="96.0" x2="175.0" y2="122.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<line x1="175.0" y1="122.0" x2="210.0" y2="122.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="300.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Q̄ → верхній AND</text>
<circle cx="505.0" cy="185.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a"/>
<line x1="505.0" y1="185.0" x2="505.0" y2="344.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<line x1="505.0" y1="344.0" x2="175.0" y2="344.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<line x1="175.0" y1="344.0" x2="175.0" y2="296.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<line x1="175.0" y1="296.0" x2="210.0" y2="296.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="300.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Q → нижній AND</text>
<rect x="610.0" y="118.0" width="270.0" height="174.0" rx="10" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.6"/><text x="745.0" y="173.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">хитрість: заборона зникає сама</tspan><tspan x="745.0" dy="14.0">S=J·такт·Q̄, R=K·такт·Q</tspan><tspan x="745.0" dy="14.0">коли Q=1 → нижній AND дозволено,</tspan><tspan x="745.0" dy="14.0">верхній — ні (бо Q̄=0)</tspan><tspan x="745.0" dy="14.0">тож S і R НЕ бувають 1 разом</tspan><tspan x="745.0" dy="14.0">а J=K=1 щоразу шле «перекинути»</tspan></text>
</svg>