<text x="201.0" y="238.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">вентиль AND — без пам'яті</text>
<text x="201.0" y="256.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">вихід міняється миттєво за входами</text>
<text x="559.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Реєстровий (по такту)</text>
<rect x="394.0" y="70.0" width="330.0" height="61.7" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="406.0" y="93.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">always @(posedge clk)</text><text x="406.0" y="111.8" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">  q &lt;= d;</text>
<rect x="514.0" y="163.7" width="90.0" height="64.0" rx="4" fill="#eef4ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="559.0" y="189.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">D-тригер</text>
<line x1="484.0" y1="179.7" x2="514.0" y2="179.7" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="478.0" y="183.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-style="italic">d</text>
<line x1="604.0" y1="179.7" x2="634.0" y2="179.7" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="640.0" y="183.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">q</text>
