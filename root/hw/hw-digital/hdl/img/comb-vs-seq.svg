<text x="54.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-style="italic">b</text>
<path d="M165.0 160.8 L201.0 160.8 A28 28 0 0 1 201.0 204.8 L165.0 204.8 Z" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
