<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два роди опису породжують фізично різне залізо</text>
<text x="201.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Комбінаційний (миттєвий)</text>
<rect x="36.0" y="70.0" width="330.0" height="42.8" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="48.0" y="93.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" xml:space="preserve">assign y = a &amp; b;</text>
<line x1="60.0" y1="168.8" x2="165.0" y2="168.8" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="60.0" y1="196.8" x2="165.0" y2="196.8" stroke="#1a1a1a" stroke-width="1.6"/>
