<line x1="484.0" y1="205.7" x2="514.0" y2="205.7" stroke="#2457d6" stroke-width="1.6"/>
<text x="478.0" y="209.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end">clk</text>
<text x="559.0" y="253.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">оновлюється лише на фронті такту</text>
<text x="559.0" y="271.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">тримає стан — це пам'ять</text>
