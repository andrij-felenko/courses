<line x1="360.0" y1="168.0" x2="360.0" y2="190.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="175.0" y1="190.0" x2="545.0" y2="190.0" stroke="#1a1a1a" stroke-width="1.5"/>
