<rect x="35.0" y="216.0" width="280.0" height="100.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="175.0" y="246.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Xilinx (нині AMD)</tspan><tspan x="175.0" dy="15.6">XDC — Xilinx Design Constraints</tspan><tspan x="175.0" dy="15.6">= SDC (таймінг)</tspan><tspan x="175.0" dy="15.6">+ set_property (піни, IO-стандарт)</tspan></text>
<text x="175.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">прийшов на зміну UCF</text>
<rect x="405.0" y="216.0" width="280.0" height="100.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="545.0" y="246.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="545.0" dy="0.0">Intel (нині Altera)</tspan><tspan x="545.0" dy="15.6">.sdc — той самий SDC</tspan><tspan x="545.0" dy="15.6">таймінг у .sdc,</tspan><tspan x="545.0" dy="15.6">розміщення ніг — окремо</tspan></text>
