<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один корінь, два діалекти для FPGA</text>
<rect x="210.0" y="60.0" width="300.0" height="62.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="87.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">SDC — Synopsys Design Constraints</tspan><tspan x="360.0" dy="14.3">світ ASIC · на основі Tcl · лише таймінг</tspan></text>
<text x="360.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Design Compiler · PrimeTime · IC Compiler</text>
