<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360">
<rect width="940" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3fb0"/></marker>
</defs>
<text x="470.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Програмний тригер Шмітта — це автомат із двох станів</text>
<text x="470.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">один біт пам'яті (state) + дві умови переходу; на кожен відлік виконуємо лише кілька порівнянь</text>
<circle cx="280.0" cy="175.0" r="64.0" fill="#fdeeec" stroke="#c0271e" stroke-width="2.4"/>
<text x="280.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">state = 0</text>
<text x="280.0" y="189.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(низько)</text>
<circle cx="660.0" cy="175.0" r="64.0" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2.4"/>
<text x="660.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">state = 1</text>
<text x="660.0" y="189.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(високо)</text>
<path d="M 338 145 C 410 80, 530 80, 602 145" fill="none" stroke="#1f8a3b" stroke-width="2.4" marker-end="url(#aGreen)"/>
<text x="470.0" y="89.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">v &gt; VT+</text>
<text x="470.0" y="107.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(сигнал упевнено пробив верхній поріг)</text>
<path d="M 602 205 C 530 270, 410 270, 338 205" fill="none" stroke="#1f47b5" stroke-width="2.4" marker-end="url(#aBlue)"/>
<text x="470.0" y="267.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">v &lt; VT−</text>
<text x="470.0" y="285.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(сигнал упав аж нижче нижнього порога)</text>
<path d="M 230 197 C 184 255, 184 95, 230 153" fill="none" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="176.0" y="179.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">v ≤ VT+</text>
<text x="176.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">лишитись 0</text>
<path d="M 710 153 C 756 95, 756 255, 710 197" fill="none" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="764.0" y="179.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">v ≥ VT−</text>
<text x="764.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">лишитись 1</text>
<rect x="150.0" y="286.0" width="640.0" height="52.0" rx="12" fill="#f7f7f7" stroke="#7a3fb0" stroke-width="1.5"/>
<text x="470.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«state» — це той самий один біт, що пам'ятає апаратний тригер Шмітта:</text>
<text x="470.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#7a3fb0" text-anchor="middle" font-weight="normal" font-style="normal">усередині мертвої смуги вихід залежить не від поточного v, а від того, ЗВІДКИ ми прийшли.</text>
</svg>
