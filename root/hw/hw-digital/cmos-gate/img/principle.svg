<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Принцип CMOS: дві взаємодоповняльні мережі на один вихід</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">верхня (PMOS) тягне вихід до Vdd, нижня (NMOS) — до GND; за будь-якого входу провідна РІВНО одна</text>
<line x1="160.0" y1="100.0" x2="660.0" y2="100.0" stroke="#c0271e" stroke-width="2.5" stroke-linecap="round"/>
<text x="140.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">Vdd</text>
<line x1="160.0" y1="360.0" x2="660.0" y2="360.0" stroke="#1f47b5" stroke-width="2.5" stroke-linecap="round"/>
<text x="140.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">GND</text>
<rect x="320.0" y="130.0" width="180.0" height="70.0" rx="8" fill="#fdf4f4" stroke="#c0271e" stroke-width="2"/>
<text x="410.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">мережа PMOS</text>
<text x="410.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(підтяжка до Vdd)</text>
<line x1="410.0" y1="100.0" x2="410.0" y2="130.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="410.0" y1="200.0" x2="410.0" y2="290.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<circle cx="410.0" cy="245.0" r="4.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<line x1="410.0" y1="245.0" x2="560.0" y2="245.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<text x="566.0" y="249.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">вихід</text>
<rect x="320.0" y="290.0" width="180.0" height="70.0" rx="8" fill="#f3f5fd" stroke="#1f47b5" stroke-width="2"/>
<text x="410.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">мережа NMOS</text>
<text x="410.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(стягування до GND)</text>
<line x1="170.0" y1="245.0" x2="320.0" y2="165.0" stroke="#1b1b1b" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#aInk)"/>
<line x1="170.0" y1="245.0" x2="320.0" y2="325.0" stroke="#1b1b1b" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#aInk)"/>
<text x="150.0" y="249.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">входи</text>
<rect x="660.0" y="150.0" width="150.0" height="170.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="735.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Завжди або-або:</text>
<text x="675.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вихід=1: верхня</text>
<text x="675.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  провідна, нижня ні</text>
<text x="675.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вихід=0: навпаки</text>
<text x="675.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ вихід завжди</text>
<text x="675.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  твердий 0 чи 1</text>
<text x="675.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">→ крізь нема струму</text>
</svg>
