<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Умовний символ D-тригера</text>
<text x="410.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">трикутник на тактовому вході = «спрацьовує по фронту»; один вхід D, виходи Q і Q̄</text>
<rect x="180.0" y="110.0" width="110.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="196.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">D</text>
<text x="274.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">Q</text>
<text x="274.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end" font-weight="700">Q̄</text>
<path d="M 180.0,203.0 L 192.0,210.0 L 180.0,217.0" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="200.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">clk</text>
<text x="235.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">D-тригер</text>
<text x="235.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Q ← D по фронту clk</text>
<line x1="120.0" y1="142.0" x2="180.0" y2="142.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="114.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">D</text>
<line x1="120.0" y1="210.0" x2="180.0" y2="210.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="114.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">clk</text>
<line x1="290.0" y1="142.0" x2="350.0" y2="142.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="356.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Q</text>
<line x1="290.0" y1="200.0" x2="350.0" y2="200.0" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
<text x="356.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Q̄</text>
<rect x="470.0" y="110.0" width="320.0" height="150.0" rx="10" fill="#f4f7f4" stroke="#27ae60" stroke-width="1.6"/><text x="630.0" y="159.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">чому він усюди:</tspan><tspan x="630.0" dy="15.0">один вхід, без заборонених станів</tspan><tspan x="630.0" dy="15.0">запис лише в чітку мить (фронт) →</tspan><tspan x="630.0" dy="15.0">уся машина крокує синхронно</tspan><tspan x="630.0" dy="15.0">8 поряд = регістр; ланцюжок = лічильник</tspan></text>
<text x="410.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">D-тригер — основний елемент пам'яті всієї синхронної цифрової техніки</text>
</svg>