<text x="360.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Приймач порівнює вхід не з фіксованим порогом, а з опорою VREF: сигнал може бути малим і швидким.</text>
