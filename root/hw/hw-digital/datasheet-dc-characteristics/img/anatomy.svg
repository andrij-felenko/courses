<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія одного рядка DC-таблиці</text>
<text x="440.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">кожна клітинка — окреме питання; разом вони кажуть «що гарантовано і за яких умов»</text>
<rect x="60.0" y="76.0" width="760.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<line x1="60.0" y1="76.0" x2="60.0" y2="120.0" stroke="#b9c7ea" stroke-width="1.0"/>
<text x="135.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">VOH</tspan></text>
<line x1="210.0" y1="76.0" x2="210.0" y2="120.0" stroke="#b9c7ea" stroke-width="1.0"/>
<text x="335.0" y="92.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="335.0" dy="0.0">VCC = 4.5 В</tspan><tspan x="335.0" dy="14.3">IOH = −4 мА</tspan></text>
<line x1="460.0" y1="76.0" x2="460.0" y2="120.0" stroke="#b9c7ea" stroke-width="1.0"/>
<text x="505.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="505.0" dy="0.0">3.84</tspan></text>
<line x1="550.0" y1="76.0" x2="550.0" y2="120.0" stroke="#b9c7ea" stroke-width="1.0"/>
<text x="595.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">—</tspan></text>
<line x1="640.0" y1="76.0" x2="640.0" y2="120.0" stroke="#b9c7ea" stroke-width="1.0"/>
<text x="685.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">—</tspan></text>
<line x1="730.0" y1="76.0" x2="730.0" y2="120.0" stroke="#b9c7ea" stroke-width="1.0"/>
<text x="775.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">В</tspan></text>
<line x1="135.0" y1="120.0" x2="135.0" y2="140.0" stroke="#2457d6" stroke-width="1.2"/>
<text x="135.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle"><tspan x="135.0" dy="0.0">ЩО міряємо:</tspan><tspan x="135.0" dy="13.0">напруга «1» на виході</tspan></text>
<line x1="335.0" y1="120.0" x2="335.0" y2="140.0" stroke="#8a5a1d" stroke-width="1.2"/>
<text x="335.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a5a1d" text-anchor="middle"><tspan x="335.0" dy="0.0">ЗА ЯКИХ умов:</tspan><tspan x="335.0" dy="13.0">живлення й струм</tspan><tspan x="335.0" dy="13.0">навантаження</tspan></text>
<line x1="505.0" y1="120.0" x2="505.0" y2="140.0" stroke="#27ae60" stroke-width="1.2"/>
<text x="505.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="505.0" dy="0.0">гарантована</tspan><tspan x="505.0" dy="13.0">межа —</tspan><tspan x="505.0" dy="13.0">брати ЇЇ</tspan></text>
<line x1="595.0" y1="120.0" x2="595.0" y2="140.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="595.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="595.0" dy="0.0">«типово»:</tspan><tspan x="595.0" dy="13.0">довідково,</tspan><tspan x="595.0" dy="13.0">не гарантія</tspan></text>
<line x1="685.0" y1="120.0" x2="685.0" y2="140.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="685.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="685.0" dy="0.0">тут порожньо:</tspan><tspan x="685.0" dy="13.0">для VOH стеля</tspan><tspan x="685.0" dy="13.0">не задається</tspan></text>
<line x1="775.0" y1="120.0" x2="775.0" y2="140.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="775.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">у чому</tspan><tspan x="775.0" dy="13.0">число</tspan></text>
<rect x="70.0" y="250.0" width="360.0" height="96.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="287.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">«Min» для ВИХОДУ «1» і ВХОДУ «1» — це підлога:</tspan><tspan x="250.0" dy="14.3">драйвер дасть не менше, приймач вимагає не менше.</tspan><tspan x="250.0" dy="14.3">Беремо саме межу, ніколи «Typ».</tspan></text>
<rect x="450.0" y="250.0" width="370.0" height="96.0" rx="6" fill="#fff6e0" stroke="#b5732e" stroke-width="1.5"/><text x="635.0" y="287.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Число без умови — не число.</tspan><tspan x="635.0" dy="14.3">VOH = 3.84 В дійсне ЛИШЕ доти, доки з виходу</tspan><tspan x="635.0" dy="14.3">витягають не більше 4 мА. Інший струм — інша межа.</tspan></text>
</svg>