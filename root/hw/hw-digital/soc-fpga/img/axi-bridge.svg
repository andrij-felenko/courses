<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шина AXI: що тече між процесором і тканиною</text>
<rect x="40.0" y="70.0" width="190.0" height="200.0" rx="10" fill="#eef3fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="135.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">процесор (PS)</text>
<text x="135.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">веде рутину:</tspan><tspan x="135.0" dy="14.0">меню · протоколи</tspan><tspan x="135.0" dy="14.0">конфігурація</tspan></text>
<text x="135.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">звичайний код</text>
<rect x="530.0" y="70.0" width="190.0" height="200.0" rx="10" fill="#eef7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="625.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">тканина (PL)</text>
<text x="625.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">гарячий потік:</tspan><tspan x="625.0" dy="14.0">фільтр · відео</tspan><tspan x="625.0" dy="14.0">швидкий I/O</tspan></text>
<text x="625.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">паралельне залізо</text>
<rect x="300.0" y="70.0" width="160.0" height="200.0" rx="10" fill="#f3e9fa" stroke="#8e44ad" stroke-width="2.0"/>
<text x="380.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="middle" font-weight="700">шина AXI</text>
<text x="380.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">(шов між світами)</text>
<line x1="230.0" y1="144.0" x2="300.0" y2="144.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="460.0" y1="144.0" x2="530.0" y2="144.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="380.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">керує · налаштовує реєстри</text>
<line x1="530.0" y1="198.0" x2="460.0" y2="198.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="300.0" y1="198.0" x2="230.0" y2="198.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="380.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">віддає готові дані (потоком)</text>
<rect x="180.0" y="300.0" width="400.0" height="46.0" rx="8" fill="#fff6e6" stroke="#b8860b" stroke-width="1.7"/>
<text x="380.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d0b" text-anchor="middle" font-weight="700">спільна пам'ять DDR — бачать обидві половини</text>
<line x1="135.0" y1="270.0" x2="135.0" y2="300.0" stroke="#b8860b" stroke-width="1.4" stroke-dasharray="4,4"/>
<line x1="625.0" y1="270.0" x2="625.0" y2="300.0" stroke="#b8860b" stroke-width="1.4" stroke-dasharray="4,4"/>
<text x="380.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">процесор командує й читає, тканина рахує й віддає — а важкі масиви лежать у спільній пам'яті</text>
