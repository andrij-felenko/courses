<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок старту SoC FPGA: процесор першим, тканина другою</text>
<rect x="60.0" y="90.0" width="190.0" height="110.0" rx="10" fill="#eef3fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="155.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">1. живлення</text>
<text x="155.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">процесор PS</tspan><tspan x="155.0" dy="13.5">стартує сам</tspan></text>
<rect x="270.0" y="90.0" width="190.0" height="110.0" rx="10" fill="#eef3fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="365.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2. PS читає флеш</text>
<text x="365.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">завантажник</tspan><tspan x="365.0" dy="13.5">у процесорі</tspan></text>
<rect x="480.0" y="90.0" width="190.0" height="110.0" rx="10" fill="#eef7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="575.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. PS ллє бітстрім</text>
<text x="575.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">тканина PL</tspan><tspan x="575.0" dy="13.5">набуває схеми</tspan></text>
<line x1="250.0" y1="145.0" x2="270.0" y2="145.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="460.0" y1="145.0" x2="480.0" y2="145.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="575.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">аж тепер тканина працює</text>
<text x="155.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">готовий за мілісекунди, як МК</text>
<text x="380.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">процесорна половина оживає першою й сама вдихає життя в тканину — тканина завжди друга</text>
</svg>