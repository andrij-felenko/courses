<text x="576.0" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  ВСІ пари рівні → числа рівні</text>
<text x="576.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• тут біт 0 різниться (0≠1),</text>
<text x="576.0" y="289.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  тож AND дає 0: числа НЕ рівні</text>
