<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">volatile проти бар'єра: одне ядро — порядок; два ядра — бар'єр</text>
<rect x="20.0" y="56.0" width="350.0" height="240.0" rx="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="195.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ОДНЕ ЯДРО: ISR ⇄ main</text>
<rect x="50.0" y="100.0" width="290.0" height="44.0" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.2"/><text x="195.0" y="118.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">ISR витісняє main, але виконання СЕРІЙНЕ:</tspan><tspan x="195.0" dy="14.3">один потік команд, один порядок пам'яті</tspan></text>
<rect x="70.0" y="165.0" width="250.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="195.0" y="189.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">досить: volatile</tspan></text>
<rect x="50.0" y="220.0" width="290.0" height="56.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.0"/><text x="195.0" y="238.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">volatile забороняє КОМПІЛЯТОРУ кешувати індекс</tspan><tspan x="195.0" dy="13.0">і міняти місцями запис даних та публікацію.</tspan><tspan x="195.0" dy="13.0">Порядку інструкцій на одному ядрі — достатньо.</tspan></text>
<rect x="390.0" y="56.0" width="350.0" height="240.0" rx="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="565.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ДВА ЯДРА: core0 ∥ core1</text>
<rect x="420.0" y="100.0" width="290.0" height="44.0" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.2"/><text x="565.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">СПРАВЖНЯ паралельність: кожне ядро й пам'ять</tspan><tspan x="565.0" dy="13.0">можуть переупорядкувати доступи одне щодо одного</tspan></text>
<rect x="440.0" y="165.0" width="250.0" height="40.0" rx="6" fill="#fdece9" stroke="#c0392b" stroke-width="1.8"/><text x="565.0" y="189.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="565.0" dy="0.0">треба: release / acquire бар'єр</tspan></text>
<rect x="420.0" y="220.0" width="290.0" height="56.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.0"/><text x="565.0" y="239.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">volatile мовчить про ІНШЕ ядро. Бар'єр release у</tspan><tspan x="565.0" dy="11.7">продюсера + acquire у споживача гарантують: дані</tspan><tspan x="565.0" dy="11.7">видно ДО того, як видно новий head. (Мова FIFO в софті.)</tspan></text>
</svg>