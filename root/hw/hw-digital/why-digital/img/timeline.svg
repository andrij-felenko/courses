<svg xmlns="http://www.w3.org/2000/svg" width="880" height="760" viewBox="0 0 880 760">
<rect width="880" height="760" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aAmber" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#caa24a"/></marker>
</defs>
<text x="440.0" y="38.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ланцюг питань: як аналог поступився цифрі</text>
<text x="440.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожен крок — нове питання; сірим — постаті, що мають власну детальну історію далі в Модулі 3</text>
<line x1="250.0" y1="100.0" x2="250.0" y2="730.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="250.0" cy="130.0" r="7.0" fill="#fff" stroke="#8a8a8a" stroke-width="2.6"/>
<text x="228.0" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">~1837</text>
<text x="276.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Беббідж / Babbage</text>
<text x="276.0" y="147.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Чи може машина рахувати за програмою? — зубчаста, десяткова (→ Розділ 18)</text>
<circle cx="250.0" cy="225.0" r="7.0" fill="#fff" stroke="#8a8a8a" stroke-width="2.6"/>
<text x="228.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1847</text>
<text x="276.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Буль / Boole</text>
<text x="276.0" y="242.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Чи можна звести міркування до алгебри з 0 і 1? — алгебра логіки (→ Розділ 15)</text>
<circle cx="250.0" cy="320.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="325.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1870-ті</text>
<text x="276.0" y="317.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">телеграф, реле / relay</text>
<text x="276.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Сигнал або Є, або нема — перемикач як два чіткі стани</text>
<circle cx="250.0" cy="415.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1931</text>
<text x="276.0" y="412.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Буш / Bush</text>
<text x="276.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Аналоговий «диференціальний аналізатор» — рахує валами й шестернями</text>
<circle cx="250.0" cy="510.0" r="11.0" fill="#fff" stroke="#c0271e" stroke-width="0"/>
<circle cx="250.0" cy="510.0" r="10.0" fill="none" stroke="#c0271e" stroke-width="3.2"/>
<circle cx="250.0" cy="510.0" r="4.5" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="228.0" y="515.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1937</text>
<text x="276.0" y="507.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Шеннон / Shannon</text>
<text x="276.0" y="527.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">А що, як реле — це і Є булева логіка? — магістерська теза, що злила їх воєдино</text>
<circle cx="250.0" cy="605.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="610.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1948</text>
<text x="276.0" y="602.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Шеннон / Shannon</text>
<text x="276.0" y="622.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Скільки інформації витримає ШУМНИЙ канал? — теорія інформації, «біт»</text>
<circle cx="250.0" cy="700.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="705.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1947 →</text>
<text x="276.0" y="697.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">транзистор / transistor</text>
<text x="276.0" y="717.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">дискретний стан у кремнії — і цифрова епоха стартує (Модуль 2 → решта Модуля 3)</text>
</svg>
