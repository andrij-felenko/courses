<text x="492.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#9a7322" text-anchor="start" font-weight="bold" font-style="normal">✗</text>
<text x="512.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">неперервність — значення квантується</text>
<text x="512.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">(втрата дрібниць; Розділ 17)</text>
<text x="492.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#9a7322" text-anchor="start" font-weight="bold" font-style="normal">✗</text>
<text x="512.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">більше «дротів» / смуги на ту саму</text>
<text x="512.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">точність (багато бітів)</text>
<text x="492.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#9a7322" text-anchor="start" font-weight="bold" font-style="normal">✗</text>
<text x="512.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">раптова відмова на обриві —</text>
<text x="512.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">немає плавної деградації</text>
<rect x="70.0" y="372.0" width="740.0" height="40.0" rx="10" fill="#eef4ff" stroke="#1f47b5" stroke-width="1.6"/>
<text x="440.0" y="397.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Для ОБЧИСЛЕНЬ ця угода — найвигідніша в техніці: трохи точності й смуги за майже абсолютну надійність.</text>
