<text x="440.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Угода «цифра»: що виграли і чим заплатили</text>
<text x="440.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">огрубити неперервний світ до 0/1 — це обмін, і варто бачити обидві колонки</text>
<rect x="70.0" y="84.0" width="370.0" height="274.0" rx="12" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="255.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ЩО ВИГРАЛИ</text>
<text x="92.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">✓</text>
<text x="112.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">стійкість до шуму — його можна стерти</text>
<text x="92.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">✓</text>
<text x="112.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">точне копіювання й зберігання</text>
<text x="92.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">✓</text>
<text x="112.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">обчислення, програмованість,</text>
<text x="112.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">доказова правильність (теза Шеннона)</text>
<text x="92.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">✓</text>
<text x="112.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">однакова обробка будь-яких даних</text>
<text x="112.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">(звук, число, зображення — усе біти)</text>
<rect x="470.0" y="84.0" width="340.0" height="274.0" rx="12" fill="#fbf6ec" stroke="#caa24a" stroke-width="1.8"/>
