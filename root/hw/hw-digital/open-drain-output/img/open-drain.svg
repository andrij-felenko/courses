<rect x="520.0" y="118.0" width="320.0" height="204.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="2"/>
<text x="680.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">два стани ніжки</text>
<rect x="540.0" y="168.0" width="280.0" height="58.0" rx="8" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="556.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">N відкритий → LOW</text>
<text x="556.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">сильний нуль, приймає струм (sink)</text>
<rect x="540.0" y="238.0" width="280.0" height="58.0" rx="8" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="556.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">N закритий → ВІДПУЩЕНО</text>
<text x="556.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.7" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Hi-Z, «висить у повітрі» — це НЕ high!</text>
<text x="430.0" y="406.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Стік» (ніжка) лишається відкритим, коли транзистор закрито — звідси назва.</text>
