<text x="415.0" y="239.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ніжка</text>
<line x1="240.0" y1="235.0" x2="240.0" y2="270.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<rect x="208.0" y="270.0" width="64.0" height="58.0" rx="5" fill="#fbfcff" stroke="#1b1b1b" stroke-width="2.2"/>
