<text x="430.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Open-drain: двотактний без верхнього транзистора</text>
<text x="430.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">лишився тільки нижній (N) — тягне вниз або відпускає</text>
<line x1="130.0" y1="118.0" x2="330.0" y2="118.0" stroke="#c0271e" stroke-width="2.4" stroke-linecap="round"/>
<text x="130.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">VDD</text>
<text x="254.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">✗ верхнього</text>
<text x="254.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">транзистора нема</text>
