<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Комбінаційна логіка не вміє пам'ятати</text>
<text x="380.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">її вихід — це функція лише входів зараз; сліду минулого в ній не лишається</text>
<rect x="110.0" y="110.0" width="230.0" height="120.0" rx="6" fill="#eef4ff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="225.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">комбінаційна</tspan><tspan x="225.0" dy="19.5">логіка</tspan></text>
<line x1="60.0" y1="170.0" x2="110.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="54.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">вхід</text>
<line x1="340.0" y1="170.0" x2="390.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="396.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">вихід = f(вхід зараз)</text>
<text x="225.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">немає шляху від «що було раніше»</text>
<rect x="470.0" y="108.0" width="250.0" height="124.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="595.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Чого вона не може:</tspan><tspan x="595.0" dy="15.6">• «чи натискали кнопку?»</tspan><tspan x="595.0" dy="15.6">• «це вже третій імпульс?»</tspan><tspan x="595.0" dy="15.6">• утримати рівень після</tspan><tspan x="595.0" dy="15.6">   зникнення сигналу</tspan></text>
<text x="380.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Щоб пам'ятати, схемі потрібен стан — і спосіб тримати його між подіями.</text>
</svg>