<text x="380.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Двічі та сама схема: ідея чекає, поки світ дозріє</text>
<text x="60.0" y="70.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">польовий транзистор:</text>
<circle cx="150.0" cy="96.0" r="7.0" fill="#fdf1dc" stroke="#d8b46a" stroke-width="1.6"/>
<text x="150.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1925</text>
<text x="150.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ідея (Лілієнфельд)</text>
<line x1="160.0" y1="96.0" x2="560.0" y2="96.0" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round"/>
<text x="360.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">чекав МАТЕРІАЛІВ — 34 роки</text>
<circle cx="570.0" cy="96.0" r="7.0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="570.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1959</text>
<text x="570.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">втілення</text>
<text x="60.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">КМОН:</text>
<circle cx="150.0" cy="196.0" r="7.0" fill="#fdf1dc" stroke="#d8b46a" stroke-width="1.6"/>
<text x="150.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1963</text>
<text x="150.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">винахід (Ванласс, Са)</text>
<line x1="160.0" y1="196.0" x2="560.0" y2="196.0" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="5 4" stroke-linecap="round"/>
<text x="360.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">чекала ПОТРЕБИ — ~20 років</text>
<circle cx="570.0" cy="196.0" r="7.0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="570.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1980-ті</text>
<text x="570.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">визнання</text>
<text x="380.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Правильна думка не пропадає — вона лежить, аж поки світ її потребуватиме.</text>
</svg>
