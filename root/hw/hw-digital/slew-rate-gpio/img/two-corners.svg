<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трапеція = два прямокутники згорнуто → два зломи обвідної (−20, потім −40)</text>
<line x1="92.0" y1="322.0" x2="692.0" y2="322.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="92.0" y1="322.0" x2="92.0" y2="72.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="692.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">частота f (лог)</text>
<text x="84.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">обвідна, дБ</text>
<line x1="92.0" y1="107.0" x2="692.0" y2="107.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="98.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">полиця A·T (уся енергія тут і нижче)</text>
<polyline points="92.0,107.0 272.0,107.0 488.0,180.4 692.0,316.0" fill="none" stroke="#1a1a1a" stroke-width="3"/>
<line x1="272.0" y1="322.0" x2="272.0" y2="80.0" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="3,4"/>
<circle cx="272.0" cy="107.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="272.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">f1</text>
<text x="272.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">тривалість T</text>
