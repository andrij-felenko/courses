<circle cx="488.0" cy="180.4" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="488.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">f2</text>
<text x="488.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">час фронту τ</text>
<text x="380.0" y="134.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">−20 дБ/дек</text>
<text x="554.0" y="217.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">−40 дБ/дек</text>
<rect x="237.6" y="52.1" width="68.7" height="41.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="272.0" y="70.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle"><tspan x="272.0" dy="0.0">sinc(f·T)</tspan><tspan x="272.0" dy="12.3">ламає тут</tspan></text>
<rect x="445.5" y="119.5" width="85.0" height="41.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="488.0" y="130.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="488.0" dy="0.0">sinc(f·τ)</tspan><tspan x="488.0" dy="12.3">додає ще −20</tspan></text>
<line x1="494.0" y1="92.0" x2="672.0" y2="92.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="582.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">коротший τ → f2 вгору → спектр тягнеться вище</text>
<rect x="92.0" y="366.0" width="630.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="407.0" y="386.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="407.0" dy="0.0">верхню межу спектра тримає f2 = 1/(π·τ): керує НЕ висота A, а час фронту τ — тому крутість фронту прямо визначає радіозаваду</tspan></text>
</svg>