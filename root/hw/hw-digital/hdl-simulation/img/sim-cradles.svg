<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві колиски самого симулятора, а не лише мови</text>
<rect x="36.0" y="58.0" width="340.0" height="196.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="206.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#c0392b" text-anchor="middle" font-weight="700">Verilog-XL</text>
<text x="206.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">симулятор стартапу</text>
<text x="206.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="206.0" dy="0.0">Gateway, жменька людей</tspan><tspan x="206.0" dy="15.6">Мурбі пише симулятор 1984</tspan><tspan x="206.0" dy="15.6">мета — ПЕРЕВІРИТИ власну</tspan><tspan x="206.0" dy="15.6">схему до кремнію</tspan></text>
<text x="206.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">інструмент перевірки</text>
<rect x="424.0" y="58.0" width="340.0" height="196.0" rx="12" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="594.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">еталонний симулятор VHDL</text>
<text x="594.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">замовлення оборони США</text>
<text x="594.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="594.0" dy="0.0">контракт ВПС, консорціум</tspan><tspan x="594.0" dy="15.6">Intermetrics будує симулятор</tspan><tspan x="594.0" dy="15.6">мета — ПРОСИМУЛЮВАТИ чужий</tspan><tspan x="594.0" dy="15.6">задокументований чип</tspan></text>
<text x="594.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-style="italic">перевірка задокументованого</text>
<text x="400.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">різні світи — та сама серцевина: керована подіями модель, що вдає час без жодного кремнію</text>
</svg>