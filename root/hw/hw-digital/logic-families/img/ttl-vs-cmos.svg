<rect x="70.0" y="398.0" width="740.0" height="48.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="440.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Сьогодні майже вся логіка — CMOS (мала потужність). Але «TTL-рівні» лишилися</text>
