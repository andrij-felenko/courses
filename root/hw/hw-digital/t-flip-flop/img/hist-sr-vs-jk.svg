<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="660" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="330.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що JK виправив у SR: заборонений куток став toggle</text>
<text x="185.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">SR-засувка</text><text x="137.5" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"></text><rect x="90.0" y="120.0" width="95.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/><text x="137.5" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">тримає</text><rect x="185.0" y="120.0" width="95.0" height="46.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/><text x="232.5" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">Q=1 (set)</text><rect x="90.0" y="166.0" width="95.0" height="46.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/><text x="137.5" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">Q=0 (reset)</text><rect x="185.0" y="166.0" width="95.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="232.5" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ЗАБОРОНА</text>
<text x="185.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">R=0     R=1</text>
<text x="74.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">S=0</text>
<text x="74.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">S=1</text>
<text x="185.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">S=R=1 — обидва разом:</text>
<text x="185.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">вихід невизначений</text>
<line x1="340.0" y1="166.0" x2="410.0" y2="166.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="375.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">JK</text>
<text x="545.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">JK-тригер</text><text x="497.5" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"></text><rect x="450.0" y="120.0" width="95.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/><text x="497.5" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">тримає</text><rect x="545.0" y="120.0" width="95.0" height="46.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/><text x="592.5" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">Q=1 (set)</text><rect x="450.0" y="166.0" width="95.0" height="46.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/><text x="497.5" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">Q=0 (reset)</text><rect x="545.0" y="166.0" width="95.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="592.5" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">TOGGLE</text>
<text x="545.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">K=0     K=1</text>
<text x="434.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">J=0</text>
<text x="434.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">J=1</text>
<text x="545.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">J=K=1 — обидва разом:</text>
<text x="545.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">вихід перекидається (T!)</text>
<rect x="56.7" y="313.4" width="546.7" height="45.3" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="330.0" y="332.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">Той самий «обидва входи=1», що в SR був забороною, у JK робить корисне: перемикання.</tspan><tspan x="330.0" dy="14.3">З’єднай J і K разом — і цей куток стає єдиним режимом: чистий T-тригер.</tspan></text>
</svg>