<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<line x1="60.0" y1="90.0" x2="120.0" y2="90.0" stroke="#2457d6" stroke-width="2.4"/>
<line x1="120.0" y1="90.0" x2="120.0" y2="150.0" stroke="#2457d6" stroke-width="2.4"/>
<line x1="120.0" y1="150.0" x2="440.0" y2="150.0" stroke="#2457d6" stroke-width="2.4"/>
<line x1="440.0" y1="150.0" x2="440.0" y2="150.0" stroke="#2457d6" stroke-width="2.4"/>
<line x1="440.0" y1="150.0" x2="440.0" y2="90.0" stroke="#2457d6" stroke-width="2.4"/>
<line x1="440.0" y1="90.0" x2="760.0" y2="90.0" stroke="#2457d6" stroke-width="2.4"/>
<text x="90.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">спокій = 1</text>
<text x="280.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">старт-біт = 0</text>
<text x="530.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">біт даних</text>
<line x1="120.0" y1="48.0" x2="120.0" y2="82.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="120.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1) спадний фронт — можливий старт</text>
<line x1="280.0" y1="144.0" x2="280.0" y2="190.0" stroke="#27ae60" stroke-width="1.6" stroke-dasharray="4,3"/>
<circle cx="280.0" cy="150.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="280.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">2) +8 тіків → центр:</text>
<text x="280.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">тут ще 0? так → старт справжній</text>
<line x1="120.0" y1="184.0" x2="280.0" y2="184.0" stroke="#27ae60" stroke-width="1.2"/>
<text x="200.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">8 тіків = півбіта</text>
<line x1="600.0" y1="84.0" x2="600.0" y2="156.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4,3"/>
<circle cx="600.0" cy="90.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="600.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">3) +16 → центр даних</text>
<line x1="280.0" y1="174.0" x2="600.0" y2="174.0" stroke="#c0392b" stroke-width="1.2"/>
<text x="440.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">далі крок = 16 тіків (цілий біт)</text>
</svg>