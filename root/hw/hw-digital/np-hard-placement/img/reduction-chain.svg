<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому розміщення важке: воно містить відому важку задачу</text>
<rect x="279.2" y="37.0" width="301.6" height="82.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="430.0" y="63.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Мінімальне лінійне впорядкування</tspan><tspan x="430.0" dy="19.5">(розкласти блоки в ОДИН ряд —</tspan><tspan x="430.0" dy="19.5">доведено NP-повна)</tspan></text>
<line x1="430.0" y1="134.0" x2="430.0" y2="182.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="470.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-style="italic">1-D — лише окремий випадок</text>
<rect x="317.7" y="188.8" width="224.6" height="62.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="215.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Задача розміщення</tspan><tspan x="430.0" dy="19.5">(блоки по всій тканині)</tspan></text>
<line x1="430.0" y1="262.0" x2="430.0" y2="310.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="470.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-style="italic">швидка загальна ⇒ швидка NP-повна</text>
<rect x="271.7" y="331.5" width="316.6" height="49.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.5"/><text x="430.0" y="361.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Отже, розміщення — NP-важке</tspan></text>
</svg>