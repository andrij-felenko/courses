<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ненавмисна засувка: неповний вибір = пам'ять</text>
<text x="185.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">НЕПОВНО — вихід не заданий для всіх умов</text>
<rect x="30.0" y="78.0" width="330.0" height="78.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.3"/><text x="42.0" y="98.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">always @(*)</text><text x="42.0" y="117.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">  if (en) y = data;</text><text x="42.0" y="136.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">  // а якщо en==0 ?  мовчить</text>
<line x1="195.0" y1="168.0" x2="195.0" y2="208.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="90.0" y="219.0" width="210.0" height="62.0" rx="7" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="195.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЗАСУВКА (latch)</text><text x="195.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">мусить тримати старе y</text>
<rect x="113.2" y="306.2" width="163.6" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="195.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="195.0" dy="0.0">небажана пам'ять</tspan><tspan x="195.0" dy="15.6">у комбінаційнім блоці</tspan></text>
<line x1="370.0" y1="60.0" x2="370.0" y2="356.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5 5"/>
<text x="545.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ПОВНО — вихід заданий для всіх умов</text>
<rect x="385.0" y="78.0" width="320.0" height="78.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.3"/><text x="397.0" y="98.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">always @(*)</text><text x="397.0" y="117.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">  if (en) y = data;</text><text x="397.0" y="136.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#1a1a1a" text-anchor="start">  else    y = 8'h00;   // else!</text>
<line x1="545.0" y1="168.0" x2="545.0" y2="208.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="445.0" y="219.0" width="200.0" height="62.0" rx="7" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="545.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">мультиплексор</text><text x="545.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">без пам'яті</text>
<rect x="470.0" y="306.2" width="150.0" height="47.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="545.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="545.0" dy="0.0">чиста комбінаційна</tspan><tspan x="545.0" dy="15.6">логіка — то й треба</tspan></text>
</svg>