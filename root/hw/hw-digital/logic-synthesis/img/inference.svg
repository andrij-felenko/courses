<rect x="48.0" y="152.0" width="260.0" height="60.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.3"/><text x="60.0" y="172.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#2457d6" text-anchor="start">if (s) y=a;</text><text x="60.0" y="191.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#2457d6" text-anchor="start">else   y=b;</text>
