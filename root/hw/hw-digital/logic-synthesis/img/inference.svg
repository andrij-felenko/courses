<rect x="460.0" y="238.0" width="200.0" height="48.0" rx="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="560.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">регістр</text><text x="560.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(тригери, пам'ять)</text>
<rect x="48.0" y="312.0" width="260.0" height="44.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.3"/><text x="60.0" y="332.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#2457d6" text-anchor="start">a * b</text>
<line x1="320.0" y1="334.0" x2="402.0" y2="334.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="460.0" y="310.0" width="200.0" height="48.0" rx="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="560.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">помножувач</text>
<text x="360.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">той самий вираз ПІД тактом і БЕЗ такту дає різне залізо: регістр ↔ миттєва логіка</text>
