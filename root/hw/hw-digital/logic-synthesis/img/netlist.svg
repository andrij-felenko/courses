<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вихід синтезу — нетлист (елементи + з'єднання)</text>
<rect x="30.0" y="70.0" width="280.0" height="100.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.3"/><text x="170.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">RTL (намір)</text><text x="42.0" y="96.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#2457d6" text-anchor="start">always @(posedge clk)</text><text x="42.0" y="115.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#2457d6" text-anchor="start">  acc &lt;= acc + x;</text><text x="42.0" y="134.0" font-family="'Consolas', 'DejaVu Sans Mono', monospace" font-size="13" fill="#2457d6" text-anchor="start">assign sum = acc;</text>
<line x1="316.0" y1="130.0" x2="384.0" y2="130.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="350.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">синтез</text>
<rect x="400.0" y="66.0" width="296.0" height="210.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/>
<text x="548.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">нетлист: клітинки й дроти</text>
<text x="430.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">x</text>
<line x1="440.0" y1="133.0" x2="470.0" y2="133.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="471.0" y="117.0" width="78.0" height="46.0" rx="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="510.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">+</text><text x="510.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">суматор</text>
<rect x="589.0" y="114.0" width="78.0" height="52.0" rx="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="628.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">рег.</text><text x="628.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">тригери</text>
<line x1="549.0" y1="140.0" x2="589.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="667.0" y1="140.0" x2="690.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="683.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">sum</text>
<line x1="628.0" y1="166.0" x2="628.0" y2="236.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="628.0" y1="236.0" x2="490.0" y2="236.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="490.0" y1="236.0" x2="490.0" y2="163.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="490.0" y1="200.0" x2="490.0" y2="165.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="548.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">зворотний зв'язок: acc назад у суматор</text>
<text x="628.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">clk</text>
<line x1="628.0" y1="112.0" x2="628.0" y2="116.0" stroke="#6b7280" stroke-width="1.5"/>
<text x="360.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">уже не поведінка, а структура: список елементів і що з чим з'єднано</text>
<text x="360.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">далі — фізична реалізація: розкладання по чипу й маршрути</text>
</svg>