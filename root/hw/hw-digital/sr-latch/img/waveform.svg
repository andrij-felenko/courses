<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Часова діаграма: як S і R керують виходом Q</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">між імпульсами засувка ТРИМАЄ останнє значення — оце утримання і є збережений біт</text>
<text x="95.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">S</text>
<line x1="130.0" y1="128.0" x2="820.0" y2="128.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<polyline points="130.0,128.0 220.0,128.0 220.0,92.0 270.0,92.0 270.0,128.0 820.0,128.0" fill="none" stroke="#c0271e" stroke-width="2.4"/>
<text x="95.0" y="204.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="end" font-weight="bold" font-style="normal">R</text>
<line x1="130.0" y1="218.0" x2="820.0" y2="218.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<polyline points="130.0,218.0 470.0,218.0 470.0,182.0 520.0,182.0 520.0,218.0 820.0,218.0" fill="none" stroke="#1f47b5" stroke-width="2.4"/>
<text x="95.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">Q</text>
<line x1="130.0" y1="308.0" x2="820.0" y2="308.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<polyline points="130.0,308.0 220.0,308.0 220.0,272.0 470.0,272.0 470.0,308.0 820.0,308.0" fill="none" stroke="#1f8a3b" stroke-width="2.6"/>
<line x1="220.0" y1="90.0" x2="220.0" y2="308.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="470.0" y1="180.0" x2="470.0" y2="308.0" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/>
<text x="345.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Q тримає 1 (хоч S давно зник)</text>
<text x="180.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">0</text>
<text x="650.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Q тримає 0</text>
<text x="245.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">set</text>
<text x="495.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">reset</text>
<rect x="70.0" y="348.0" width="740.0" height="30.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="440.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Короткий S підняв Q і пішов — Q лишився 1. Короткий R його скинув. Між ними — утримання.</text>
</svg>
