<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
<rect width="960" height="560" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як ставка на один-єдиний вентиль довела людину до Місяця</text>
<text x="480.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">лабораторія приладобудування MIT, 1961–1969: чим менше типів деталей — тим менше того, що відмовить</text>
<line x1="86.0" y1="150.0" x2="906.0" y2="150.0" stroke="#e4e4e4" stroke-width="3" stroke-linecap="round"/>
<circle cx="126.0" cy="150.0" r="8.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<text x="126.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1961</text>
<text x="126.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Задача</text>
<circle cx="306.0" cy="150.0" r="8.0" fill="#c0271e" stroke="#c0271e" stroke-width="0"/>
<text x="306.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1962</text>
<text x="306.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ризикована ставка</text>
<circle cx="486.0" cy="150.0" r="8.0" fill="#caa24a" stroke="#caa24a" stroke-width="0"/>
<text x="486.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">1963</text>
<text x="486.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Попит</text>
<circle cx="666.0" cy="150.0" r="8.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="666.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1964–66</text>
<text x="666.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві версії</text>
<circle cx="846.0" cy="150.0" r="8.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="846.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1969</text>
<text x="846.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Місяць</text>
<rect x="42.0" y="194.0" width="168.0" height="196.0" rx="9" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<text x="126.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Навігація «Аполлона»</text>
<text x="126.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">має рахувати курс</text>
<text x="126.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">на борту — сама,</text>
<text x="126.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">без зв'язку із Землею.</text>
<text x="126.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<text x="126.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">Ціна збою —</text>
<text x="126.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">життя екіпажу.</text>
<rect x="222.0" y="194.0" width="168.0" height="196.0" rx="9" fill="#ffffff" stroke="#c0271e" stroke-width="2"/>
<text x="306.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Інтегральна схема —</text>
<text x="306.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ще зовсім нова</text>
<text x="306.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">й неперевірена.</text>
<text x="306.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">MIT усе одно</text>
<text x="306.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ставить на неї —</text>
<text x="306.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">і лише на ОДИН тип:</text>
<text x="306.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">3-вхідний NOR.</text>
<rect x="402.0" y="194.0" width="168.0" height="196.0" rx="9" fill="#ffffff" stroke="#caa24a" stroke-width="2"/>
<text x="486.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">За оцінкою (перевірити),</text>
<text x="486.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">1963-го програма</text>
<text x="486.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">з'їдала близько</text>
<text x="486.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">60 % усіх</text>
<text x="486.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">інтегральних схем,</text>
<text x="486.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">вироблених у США.</text>
<rect x="582.0" y="194.0" width="168.0" height="196.0" rx="9" fill="#ffffff" stroke="#1f8a3b" stroke-width="2"/>
<text x="666.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Block I:</text>
<text x="666.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">≈ 4100 чипів,</text>
<text x="666.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">по 1 вентилю NOR.</text>
<text x="666.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<text x="666.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Block II:</text>
<text x="666.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">≈ 2800 чипів,</text>
<text x="666.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">по 2 NOR у кожному.</text>
<rect x="762.0" y="194.0" width="168.0" height="196.0" rx="9" fill="#ffffff" stroke="#1f8a3b" stroke-width="2"/>
<text x="846.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">20 липня 1969:</text>
<text x="846.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">комп'ютер садить</text>
<text x="846.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">«Орел» на Місяць.</text>
<text x="846.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="6" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<text x="846.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Жодного збою</text>
<text x="846.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">обладнання</text>
<text x="846.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">в жодному польоті.</text>
</svg>
