<rect x="390.0" y="93.6" width="340.0" height="82.8" rx="6" fill="#eef9f1" stroke="#27ae60" stroke-width="1.6"/><text x="560.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">1. Ємнісний струм перезаряду (i_cap)</tspan><tspan x="560.0" dy="15.6">• Заряджає/розряджає паразитну ємність C_L</tspan><tspan x="560.0" dy="15.6">• Виникає лише під час зміни стану 0→1 або 1→0</tspan><tspan x="560.0" dy="15.6">• Потужність: P_cap = α · C_L · V_DD² · f</tspan></text>
<rect x="366.7" y="225.8" width="386.5" height="98.4" rx="6" fill="#fef6ee" stroke="#e67e22" stroke-width="1.6"/><text x="560.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">2. Наскрізний струм к.з. (i_sc, crowbar)</tspan><tspan x="560.0" dy="15.6">• Тече прямо від V_DD до GND крізь обидва транзистори</tspan><tspan x="560.0" dy="15.6">• Виникає в зоні V_th,n &lt; V_in &lt; V_DD − |V_th,p|</tspan><tspan x="560.0" dy="15.6">• Залежить від тривалості фронту перемикання t_rf</tspan><tspan x="560.0" dy="15.6">• Потужність: P_sc = I_mean · V_DD</tspan></text>
<rect x="356.6" y="373.5" width="406.9" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="394.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Повна динамічна потужність: P_dyn = P_cap + P_sc</tspan></text>
