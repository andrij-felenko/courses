<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Важелі впливу на динамічну потужність КМОН</text>
<rect x="150.0" y="62.0" width="460.0" height="46.0" rx="6" fill="#eaf2f8" stroke="#2457d6" stroke-width="2.2"/><text x="380.0" y="91.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">P_динамічна = α · C_L · V_DD² · f</tspan></text>
<rect x="27.5" y="170.2" width="165.0" height="159.7" rx="6" fill="#fdfefe" stroke="#27ae60" stroke-width="1.5"/><text x="110.0" y="189.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">α — активність</tspan><tspan x="110.0" dy="14.3"></tspan><tspan x="110.0" dy="14.3">• Тактове стробування</tspan><tspan x="110.0" dy="14.3">  (Clock Gating)</tspan><tspan x="110.0" dy="14.3">• Кодування шин</tspan><tspan x="110.0" dy="14.3">  (Bus Invert)</tspan><tspan x="110.0" dy="14.3">• Усунення глітчів</tspan><tspan x="110.0" dy="14.3">  (Glitch Filtering)</tspan><tspan x="110.0" dy="14.3">• Спеціалізовані FSM</tspan><tspan x="110.0" dy="14.3">  (Gray-кодування)</tspan></text>
<line x1="240.0" y1="115.0" x2="110.0" y2="165.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="110.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Зменшення переходів</text>
<rect x="195.4" y="177.3" width="189.3" height="145.4" rx="6" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">C_L — ємність</tspan><tspan x="290.0" dy="14.3"></tspan><tspan x="290.0" dy="14.3">• Мінімізація транзисторів</tspan><tspan x="290.0" dy="14.3">  (Gate Sizing)</tspan><tspan x="290.0" dy="14.3">• Короткі траси на кристалі</tspan><tspan x="290.0" dy="14.3">  (Floorplanning)</tspan><tspan x="290.0" dy="14.3">• Low-k діелектрики</tspan><tspan x="290.0" dy="14.3">  між шарами металу</tspan><tspan x="290.0" dy="14.3">• Зменшення fan-out</tspan></text>
<line x1="330.0" y1="115.0" x2="290.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="290.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-weight="700">Фізична геометрія</text>
<rect x="359.7" y="177.3" width="220.6" height="145.4" rx="6" fill="#fef5e7" stroke="#c0392b" stroke-width="1.8"/><text x="470.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">V_DD² — напруга</tspan><tspan x="470.0" dy="14.3"></tspan><tspan x="470.0" dy="14.3">• Квадратичний ефект!</tspan><tspan x="470.0" dy="14.3">  (найпотужніший важіль)</tspan><tspan x="470.0" dy="14.3">• DVFS (динамічне масштабування)</tspan><tspan x="470.0" dy="14.3">• Кілька доменів живлення</tspan><tspan x="470.0" dy="14.3">  (Multi-VDD)</tspan><tspan x="470.0" dy="14.3">• Зниження до субпорогових</tspan><tspan x="470.0" dy="14.3">  рівнів (Near-Threshold)</tspan></text>
<line x1="430.0" y1="115.0" x2="470.0" y2="165.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="470.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Квадратичний вплив</text>
<rect x="564.8" y="177.3" width="170.5" height="145.4" rx="6" fill="#fdfefe" stroke="#2457d6" stroke-width="1.5"/><text x="650.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">f — частота</tspan><tspan x="650.0" dy="14.3"></tspan><tspan x="650.0" dy="14.3">• Динамічне регулювання</tspan><tspan x="650.0" dy="14.3">  тактової частоти (DFS)</tspan><tspan x="650.0" dy="14.3">• Асинхронні домени</tspan><tspan x="650.0" dy="14.3">  (GALS-архітектури)</tspan><tspan x="650.0" dy="14.3">• Паралелізм замість</tspan><tspan x="650.0" dy="14.3">  надвисоких частот</tspan><tspan x="650.0" dy="14.3">  (багатоядерність)</tspan></text>
<line x1="520.0" y1="115.0" x2="650.0" y2="165.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="650.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Частотна шкала</text>
<rect x="25.0" y="361.2" width="710.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="380.0" y="381.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Найефективніший підхід: одночасне зменшення V_DD та f (DVFS) у періоди низького навантаження,</tspan><tspan x="380.0" dy="15.6">плюс агресивне тактове стробування (Clock Gating) для усунення перемикань неактивних блоків.</tspan></text>
</svg>