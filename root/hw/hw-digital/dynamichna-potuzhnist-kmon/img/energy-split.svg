<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Енергетичний баланс перемикання КМОН: правило 50% / 50%</text>
<rect x="40.0" y="60.0" width="320.0" height="270.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="200.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ФАЗА ЗАРЯДУ (перехід 0 → 1)</text>
<rect x="60.0" y="108.2" width="280.0" height="43.6" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.4"/><text x="200.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Джерело живлення постачає:</tspan><tspan x="200.0" dy="15.6">E_VDD = Q · V_DD = C_L · V_DD²</tspan></text>
<line x1="200.0" y1="160.0" x2="140.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="200.0" y1="160.0" x2="260.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="53.0" y="217.2" width="153.9" height="55.6" rx="6" fill="#eef9f1" stroke="#27ae60" stroke-width="1.4"/><text x="130.0" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">50% накопичено в C_L</tspan><tspan x="130.0" dy="14.3">(в електричному полі):</tspan><tspan x="130.0" dy="14.3">E_cap = ½ C_L · V_DD²</tspan></text>
<rect x="189.9" y="217.2" width="160.2" height="55.6" rx="6" fill="#fdf2e9" stroke="#d35400" stroke-width="1.4"/><text x="270.0" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">50% розсіяно в тепло</tspan><tspan x="270.0" dy="14.3">(на опорі PMOS R_on,p):</tspan><tspan x="270.0" dy="14.3">E_PMOS = ½ C_L · V_DD²</tspan></text>
<text x="200.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Втрата на PMOS не залежить від R_on!</text>
<rect x="400.0" y="60.0" width="320.0" height="270.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="560.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">ФАЗА РОЗРЯДУ (перехід 1 → 0)</text>
<rect x="420.0" y="108.2" width="280.0" height="43.6" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="560.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Джерело живлення не бере участі:</tspan><tspan x="560.0" dy="15.6">E_VDD = 0 (PMOS закритий)</tspan></text>
<line x1="560.0" y1="160.0" x2="560.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="420.0" y="217.2" width="280.0" height="55.6" rx="6" fill="#fdf2e9" stroke="#d35400" stroke-width="1.4"/><text x="560.0" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">100% енергії конденсатора</tspan><tspan x="560.0" dy="14.3">скидається крізь NMOS у GND:</tspan><tspan x="560.0" dy="14.3">E_NMOS = ½ C_L · V_DD² (усе в тепло)</tspan></text>
<text x="560.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Конденсатор повністю спустошується до 0 В</text>
<rect x="40.0" y="348.1" width="680.0" height="53.9" rx="6" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.8"/><text x="380.0" y="371.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">ПОВНИЙ ЦИКЛ (0 → 1 → 0): Сумарно розсіяно в тепло E_total = C_L · V_DD².</tspan><tspan x="380.0" dy="16.9">Середня потужність при частоті f та активності α:   P_cap = α · C_L · V_DD² · f</tspan></text>
</svg>