<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410">
<rect width="880" height="410" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому не можна з'єднати звичайні (двотактні) виходи</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">якщо один жене «1» (VCC), а інший «0» (GND), струм тече навпростець — коротке замикання</text>
<rect x="120.0" y="150.0" width="150.0" height="120.0" rx="10" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="195.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">пристрій A</text>
<text x="195.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">жене «1»</text>
<text x="195.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(вихід на VCC)</text>
<rect x="610.0" y="150.0" width="150.0" height="120.0" rx="10" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2"/>
<text x="685.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">пристрій Б</text>
<text x="685.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">жене «0»</text>
<text x="685.0" y="222.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(вихід на GND)</text>
<line x1="270.0" y1="210.0" x2="610.0" y2="210.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<text x="440.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">спільна лінія</text>
<line x1="300.0" y1="230.0" x2="560.0" y2="230.0" stroke="#c0271e" stroke-width="3" marker-end="url(#aRed)"/>
<text x="440.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">⚡ великий наскрізний струм VCC → GND</text>
<text x="440.0" y="268.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">обидва виходи перегріваються й можуть згоріти</text>
<rect x="60.0" y="320.0" width="760.0" height="56.0" rx="10" fill="#fbecec" stroke="#c0271e" stroke-width="1.4"/>
<text x="440.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Двотактний (push-pull) вихід уміє і тягти вгору, і вниз — тому два таких на одній лінії конфліктують.</text>
<text x="440.0" y="364.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Спільна шина потребує виходів, що НЕ вміють тягти вгору. Це й є відкритий колектор.</text>
</svg>
