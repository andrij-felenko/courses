<text x="705.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як це працює:</text>
<text x="576.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• тригер 1 ловить асинхронний вхід</text>
<text x="576.0" y="173.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  і ІНКОЛИ зависає (метастабільно)</text>
<text x="576.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• та за цілий період він майже</text>
<text x="576.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  напевно розв'язується в 0 чи 1</text>
<text x="576.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• тригер 2 зчитує його вже чистим</text>
<text x="576.0" y="257.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• метастабільність не зникає зовсім —</text>
<text x="576.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.6" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">  лише стає НЕЙМОВІРНО рідкісною (MTBF)</text>
