<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430">
<rect width="880" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="440.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому метастабільність неминуча: принцип Бурідана (кулька на вершині)</text>
<path d="M 80,300 C 150,300 175,288 200,280 C 230,270 250,182 275,182 C 300,182 320,270 350,280 C 375,288 400,300 470,300" fill="none" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="140.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">стан «0»</text>
<text x="410.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">стан «1»</text>
<text x="275.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#7a3da8" text-anchor="middle" font-weight="bold" font-style="normal">метастабільна</text>
<text x="275.0" y="148.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#7a3da8" text-anchor="middle" font-weight="bold" font-style="normal">вершина</text>
<circle cx="275.0" cy="171.0" r="11.0" fill="#caa24a" stroke="#1b1b1b" stroke-width="2"/>
<line x1="275.0" y1="160.0" x2="275.0" y2="142.0" stroke="#7a3da8" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/>
<line x1="259.0" y1="186.0" x2="205.0" y2="260.0" stroke="#1f47b5" stroke-width="2" marker-end="url(#aBlue)"/>
<line x1="291.0" y1="186.0" x2="345.0" y2="260.0" stroke="#c0271e" stroke-width="2" marker-end="url(#aRed)"/>
<text x="275.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">…а балансувати може</text>
<text x="275.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">як завгодно довго</text>
<rect x="540.0" y="70.0" width="300.0" height="300.0" rx="10" fill="#faf7fc" stroke="#7a3da8" stroke-width="1.8"/>
<text x="690.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#7a3da8" text-anchor="middle" font-weight="bold" font-style="normal">Аргумент неперервності</text>
<text x="556.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Початковий стан схеми плавно</text>
<text x="556.0" y="145.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">залежить від миті приходу даних</text>
<text x="556.0" y="166.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">відносно фронту (це число!).</text>
<text x="556.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="556.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">Один бік цього числа → впаде в 0,</text>
<text x="556.0" y="229.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">інший → впаде в 1.</text>
<text x="556.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal"></text>
<text x="556.0" y="271.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">Між «0» і «1» немає стрибка —</text>
<text x="556.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">отже існує проміжне положення,</text>
<text x="556.0" y="313.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">де кулька не падає ні туди, ні</text>
<text x="556.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">сюди скільки завгодно довго.</text>
<rect x="80.0" y="386.0" width="760.0" height="34.0" rx="8" fill="#f1eef6" stroke="#7a3da8" stroke-width="1.6"/>
<text x="440.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#7a3da8" text-anchor="middle" font-weight="bold" font-style="normal">Тож НЕ ІСНУЄ схеми з гарантованим часом рішення (Маріно, 1981) — метастабільність можна лише зробити рідкісною.</text>
</svg>
