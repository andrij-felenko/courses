<text x="700.0" y="197.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">не виявить надійно</text>
<rect x="70.0" y="300.0" width="740.0" height="64.0" rx="10" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2"/>
<text x="90.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Сьогодні — інженерна норма:</text>
<text x="90.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">будь-який асинхронний вхід заводять у логіку через СИНХРОНІЗАТОР; надійність рахують через MTBF.</text>
<text x="440.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">Спільна нитка: спершу — «такого не буває», потім — «бачимо на екрані», далі — «доведено, що неминуче»,</text>
<text x="440.0" y="440.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">і нарешті — «приборкуємо ймовірнісно». Класична доля відкриття, що суперечить «здоровому глузду».</text>
