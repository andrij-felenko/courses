<text x="700.0" y="145.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#7a3da8" text-anchor="middle" font-weight="bold" font-style="normal">Доказ неминучості</text>
<text x="700.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Маріно: жодна схема</text>
