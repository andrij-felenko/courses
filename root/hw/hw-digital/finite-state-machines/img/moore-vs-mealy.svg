<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Та сама поведінка, два почерки: де «живе» вихід</text>
<rect x="40.0" y="64.0" width="380.0" height="300.0" rx="12" fill="none" stroke="#27ae60" stroke-width="1.8"/>
<text x="230.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Мур: вихід — у стані</text>
<circle cx="140.0" cy="215.0" r="44.0" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="140.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">S0</text><text x="140.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">вих=0</text>
<circle cx="320.0" cy="215.0" r="44.0" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="320.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">S1</text><text x="320.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">вих=1</text>
<path d="M184.0 207.0 Q230.0 185.0 276.0 207.0" fill="none" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="230.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">вх=1</text>
<path d="M276.0 223.0 Q230.0 245.0 184.0 223.0" fill="none" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="230.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">вх=0</text>
<text x="230.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">вихід тримається весь такт — чистий і вирівняний</text>
<rect x="460.0" y="64.0" width="380.0" height="300.0" rx="12" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<text x="650.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Мілі: вихід — на переході</text>
<circle cx="560.0" cy="215.0" r="44.0" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="560.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">S0</text>
<circle cx="740.0" cy="215.0" r="44.0" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="740.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">S1</text>
<path d="M604.0 207.0 Q650.0 185.0 696.0 207.0" fill="none" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="650.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">вх=1 / вих=1</text>
<path d="M696.0 223.0 Q650.0 245.0 604.0 223.0" fill="none" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="650.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">вх=0 / вих=0</text>
<text x="650.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">реагує того ж такту, та може «мигати» слідом за входом</text>
</svg>