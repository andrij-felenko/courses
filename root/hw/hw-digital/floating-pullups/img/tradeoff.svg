<text x="450.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">~10 кОм мирить обидва тиски: тримає рівень упевнено й майже не жере струму.</text>
