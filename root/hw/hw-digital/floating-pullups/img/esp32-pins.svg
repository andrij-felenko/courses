<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430">
<rect width="940" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Підтяжки на ESP32: не всі ніжки однакові</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">більшість GPIO мають внутрішні pull-up/down — та є важливі винятки</text>
<rect x="60.0" y="96.0" width="820.0" height="92.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<circle cx="104.0" cy="142.0" r="22.0" fill="#ffffff" stroke="#1f8a3b" stroke-width="2"/>
<text x="104.0" y="149.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">OK</text>
<text x="150.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Звичайні GPIO</text>
<text x="150.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">є внутрішні pull-up і pull-down — вмикай кодом (INPUT_PULLUP / INPUT_PULLDOWN)</text>
<rect x="60.0" y="200.0" width="820.0" height="92.0" rx="12" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<circle cx="104.0" cy="246.0" r="22.0" fill="#ffffff" stroke="#c0271e" stroke-width="2"/>
<text x="104.0" y="253.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">X</text>
<text x="150.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Тільки-вхід: GPIO34, 35, 36(VP), 39(VN)</text>
<text x="150.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">НЕМАЄ внутрішніх підтяжок і виходу — лише зовнішній резистор</text>
<rect x="60.0" y="304.0" width="820.0" height="92.0" rx="12" fill="#fff6e0" stroke="#caa24a" stroke-width="1.8"/>
<circle cx="104.0" cy="350.0" r="22.0" fill="#ffffff" stroke="#caa24a" stroke-width="2"/>
<text x="104.0" y="357.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">!</text>
<text x="150.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Strapping-піни: GPIO0, 2, 5, 12, 15</text>
<text x="150.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.3" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">підтяжка тут впливає на режим завантаження — чіпляй обережно</text>
</svg>
