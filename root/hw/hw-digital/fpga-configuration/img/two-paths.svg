<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="740" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два шляхи бітстріму в чип і хто дає такт</text>
<rect x="300.0" y="250.0" width="150.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="375.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">FPGA</text>
<text x="375.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(летка SRAM</text>
<text x="375.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">конфігурації)</text>
<rect x="70.0" y="70.0" width="240.0" height="74.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="87.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">JTAG — під час розробки</tspan><tspan x="190.0" dy="15.6">з ПК через програматор</tspan><tspan x="190.0" dy="15.6">ПРЯМО в SRAM, повз флеш</tspan><tspan x="190.0" dy="15.6">миттєво бачиш зміну</tspan></text>
<line x1="190.0" y1="146.0" x2="340.0" y2="248.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="150.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">щойно зібрав →</text>
<text x="150.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">залив і глянув</text>
<rect x="500.0" y="150.0" width="210.0" height="96.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="605.0" y="173.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="605.0" dy="0.0">Флеш поряд — у виробі</tspan><tspan x="605.0" dy="14.3">чип САМ читає при старті</tspan><tspan x="605.0" dy="14.3">(master: чип дає такт)</tspan><tspan x="605.0" dy="14.3">або зовнішній контролер</tspan><tspan x="605.0" dy="14.3">заливає (slave: такт ззовні)</tspan></text>
<line x1="500.0" y1="210.0" x2="452.0" y2="290.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="468.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end">автозавантаження</text>
<text x="468.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end">при кожному ввімкненні</text>
<rect x="150.0" y="366.0" width="440.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="382.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Master чи slave — це ХТО веде такт конфігурації:</tspan><tspan x="370.0" dy="15.6">сам чип зі свого генератора чи зовнішній контролер.</tspan></text>
</svg>