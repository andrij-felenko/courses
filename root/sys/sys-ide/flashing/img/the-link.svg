<rect x="110.0" y="250.0" width="500.0" height="48.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="360.0" y="277.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Новіші чипи (S3, C3…) мають власний USB — перетворювач зайвий, чіп під'єднується прямо</tspan></text>
