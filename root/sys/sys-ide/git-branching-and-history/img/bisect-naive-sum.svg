<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому суму ваг батьків не можна брати за вагу злиття</text>
<line x1="222.0" y1="250.0" x2="144.0" y2="250.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="385.7" y1="172.0" x2="279.5" y2="233.1" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="385.7" y1="328.0" x2="279.5" y2="266.9" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="536.1" y1="235.4" x2="439.0" y2="175.8" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="536.1" y1="264.6" x2="439.0" y2="324.2" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<circle cx="110.0" cy="250.0" r="28.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/><text x="110.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">A</text>
<circle cx="250.0" cy="250.0" r="28.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/><text x="250.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text>
<circle cx="410.0" cy="158.0" r="28.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="410.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">L</text>
<circle cx="410.0" cy="342.0" r="28.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="410.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">R</text>
<circle cx="560.0" cy="250.0" r="28.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="3.0"/><text x="560.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">M</text>
<text x="110.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">a = 1</text>
<text x="250.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">a = 2</text>
<text x="410.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">a = 3</text>
<text x="410.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">a = 3</text>
<text x="560.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">a = 5</text>
<text x="180.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">A і B досяжні і через L, і через R</text>
<text x="180.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">— спільна частина двох гілок</text>
<rect x="660.0" y="96.0" width="268.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="794.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="794.0" dy="0.0">наївно</tspan><tspan x="794.0" dy="19.5">a(M) = 1 + a(L) + a(R)</tspan><tspan x="794.0" dy="19.5">     = 1 + 3 + 3 = 7</tspan><tspan x="794.0" dy="19.5">7 &gt; N = 5  ✗</tspan></text>
<rect x="660.0" y="254.0" width="268.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="794.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="794.0" dy="0.0">насправді</tspan><tspan x="794.0" dy="19.5">a(M) = |{A,B,L,R,M}|</tspan><tspan x="794.0" dy="19.5">     = 5</tspan><tspan x="794.0" dy="19.5">бал = min(5, 0) = 0</tspan></text>
<rect x="60.0" y="40.0" width="868.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="494.0" y="66.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="494.0" dy="0.0">N = 5 кандидатів;  a(X) — скільки з них досяжні з X разом із ним самим</tspan></text>
<rect x="400.0" y="400.0" width="528.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="664.0" y="423.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="664.0" dy="0.0">різниця 7 − 5 = 2 — це рівно |{A, B}|,</tspan><tspan x="664.0" dy="18.2">перетин двох гілок, полічений двічі</tspan></text>
</svg>