<text x="805.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">окремий обхід від X</text>
<text x="805.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">ціна: O(m + e)</text>
<rect x="40.0" y="330.0" width="900.0" height="66.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="490.0" y="358.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Ранній вихід: щойно |2·a(X) − N| ≤ 1, бал уже дорівнює максимально можливому ⌊N/2⌋ —</tspan><tspan x="490.0" dy="19.5">решту вершин, зокрема й недораховані злиття, рахувати не треба</tspan></text>
</svg>