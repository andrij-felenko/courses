<line x1="534.0" y1="170.0" x2="462.0" y2="170.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">a(X) = a(P) + 1</text>
<text x="490.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">ціна: O(1)</text>
<circle cx="745.0" cy="132.0" r="26.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="745.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">P₁</text>
<circle cx="745.0" cy="210.0" r="26.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="745.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">P₂</text>
<circle cx="875.0" cy="170.0" r="26.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.5"/><text x="875.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">X</text>
