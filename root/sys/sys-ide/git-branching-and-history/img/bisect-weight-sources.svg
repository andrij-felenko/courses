<rect x="670.0" y="56.0" width="270.0" height="250.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="805.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Злиття: два батьки</text>
<circle cx="175.0" cy="170.0" r="26.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.5"/><text x="175.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">X</text>
<text x="175.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">a(X) = 1</text>
<text x="175.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">ціна: O(1)</text>
<circle cx="430.0" cy="170.0" r="26.0" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="430.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">P</text>
