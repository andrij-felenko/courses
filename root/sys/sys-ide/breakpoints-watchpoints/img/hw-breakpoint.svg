<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний брейк: компаратор стежить за лічильником команд</text>
<text x="150.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Потік вибірки команд (Flash)</text>
<rect x="40.0" y="84.0" width="74.0" height="42.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="77.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0x0800</text>
<text x="77.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">інструкція</text>
<rect x="120.0" y="84.0" width="74.0" height="42.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="157.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0x0804</text>
<text x="157.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">інструкція</text>
<rect x="200.0" y="84.0" width="74.0" height="42.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="237.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0x0808</text>
<text x="237.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">← цільовий рядок</text>
<rect x="280.0" y="84.0" width="74.0" height="42.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="317.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0x080C</text>
<text x="317.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">інструкція</text>
<text x="190.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">байт у Flash НЕ змінено</text>
<line x1="370.0" y1="105.0" x2="430.0" y2="105.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="400.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">PC</text>
<rect x="445.0" y="87.3" width="230.0" height="45.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="560.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Компаратор адрес (FPB)</tspan><tspan x="560.0" dy="14.3">збережено: 0x0808</tspan></text>
<line x1="434.0" y1="105.0" x2="445.0" y2="105.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="560.0" y1="132.7" x2="560.0" y2="200.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="479.3" y="202.2" width="161.4" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="560.0" y="222.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">PC == 0x0808 → HALT</tspan><tspan x="560.0" dy="15.6">(ще до виконання)</tspan></text>
<text x="380.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Компаратор у залізі, тож точка працює і у Flash — але компараторів лічена кількість.</text>
