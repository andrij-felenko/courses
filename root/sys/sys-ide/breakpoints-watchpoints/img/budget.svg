<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бюджет апаратних пасток на ESP32 (2 брейки + 2 вотчпоінти)</text>
