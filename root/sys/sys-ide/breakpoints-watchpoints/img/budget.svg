<text x="200.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">hbreak flash_handler</text>
<rect x="66.0" y="142.0" width="268.0" height="32.0" rx="5" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
