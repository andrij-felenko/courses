<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Умовний брейк: ядро спиняється на КОЖНОМУ влученні</text>
<rect x="55.0" y="94.8" width="140.0" height="30.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="125.0" y="113.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">HALT</tspan></text>
<rect x="230.0" y="87.9" width="140.0" height="44.1" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="300.0" y="106.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">хост читає</tspan><tspan x="300.0" dy="13.7">регістри/стек</tspan></text>
<line x1="195.0" y1="110.0" x2="230.0" y2="110.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="405.0" y="87.9" width="140.0" height="44.1" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="475.0" y="106.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">GDB рахує</tspan><tspan x="475.0" dy="13.7">умову</tspan></text>
<line x1="370.0" y1="110.0" x2="405.0" y2="110.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="580.0" y="87.9" width="140.0" height="44.1" rx="6" fill="#fbfdfb" stroke="#27ae60" stroke-width="1.8"/><text x="650.0" y="106.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">умова хибна →</tspan><tspan x="650.0" dy="13.7">resume</tspan></text>
<line x1="545.0" y1="110.0" x2="580.0" y2="110.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">кожен оберт — зупинка ядра + round-trip по SWD до хоста</text>
<rect x="90.0" y="196.0" width="580.0" height="80.0" rx="10" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="380.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1000 влучень × ~частка мілісекунди на оберт = відчутні секунди простою</text>
<text x="380.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">висновок: умову треба робити рідкісною, або краще — апаратний вотчпоінт за даними</text>
<text x="380.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(там фільтрує залізо, ядро не спиняється намарно)</text>
</svg>