<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат посторінкового програмування Flash і EEPROM</text>
<rect x="20.0" y="20.0" width="820.0" height="480.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="430.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат процедури посторінкового програмування Flash (ISP)</text>
<rect x="24.4" y="92.0" width="181.2" height="56.0" rx="6" fill="#fef9e7" stroke="#a9791f" stroke-width="1.8"/><text x="115.0" y="117.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">1. Подача RESET</tspan><tspan x="115.0" dy="13.0">та синхронізація</tspan><tspan x="115.0" dy="13.0">(Cmd: 0xAC 0x53 0x00 0x00)</tspan></text>
<line x1="205.6" y1="120.0" x2="195.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="188.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Echo == 0x53</text>
<rect x="273.7" y="92.0" width="162.6" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="355.0" y="117.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="355.0" dy="0.0">2. Зчитування</tspan><tspan x="355.0" dy="13.0">сигнатури кристала</tspan><tspan x="355.0" dy="13.0">(Cmd: 0x30 0x00 [0..2])</tspan></text>
<line x1="436.3" y1="120.0" x2="435.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="435.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">ID валідний</text>
<rect x="504.4" y="92.0" width="181.2" height="56.0" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.8"/><text x="595.0" y="110.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">3. Повне стирання</tspan><tspan x="595.0" dy="13.0">(Chip Erase)</tspan><tspan x="595.0" dy="13.0">(Cmd: 0xAC 0x80 0x00 0x00)</tspan></text>
<line x1="685.6" y1="120.0" x2="750.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="750.0" y1="120.0" x2="750.0" y2="165.1" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="702.7" y="165.1" width="94.6" height="29.9" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="750.0" y="177.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Пауза t_WD_ERASE</tspan><tspan x="750.0" dy="12.3">(Flash = 0xFF)</tspan></text>
<line x1="750.0" y1="194.9" x2="750.0" y2="240.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="750.0" y1="240.0" x2="690.0" y2="240.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="200.0" width="650.0" height="170.0" rx="8" fill="#f4f6f8" stroke="#a6acaf" stroke-width="1.5"/>
<text x="170.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цикл запису сторінок (Page Programming Loop)</text>
<rect x="70.0" y="257.0" width="180.0" height="56.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="160.0" y="275.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">4. Завантаження буфера</tspan><tspan x="160.0" dy="13.0">Low: 0x40 [Addr] [DataL]</tspan><tspan x="160.0" dy="13.0">High: 0x48 [Addr] [DataH]</tspan></text>
<line x1="250.0" y1="285.0" x2="285.0" y2="285.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="277.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Буфер заповнено</text>
<rect x="385.0" y="257.0" width="180.0" height="56.0" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="475.0" y="275.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">5. Фіксація сторінки</tspan><tspan x="475.0" dy="13.0">у фізичний Flash</tspan><tspan x="475.0" dy="13.0">(Cmd: 0x4C [PageAddr])</tspan></text>
<rect x="353.4" y="402.0" width="243.2" height="56.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="475.0" y="420.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">6. Опитування готовності</tspan><tspan x="475.0" dy="13.0">(Poll Ready / 0xF0 або Data Polling)</tspan><tspan x="475.0" dy="13.0">Затримка t_WD_FLASH (4.5 мс)</tspan></text>
<line x1="475.0" y1="313.0" x2="475.0" y2="402.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="535.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Запуск HV Pump</text>
<line x1="353.4" y1="430.0" x2="356.3" y2="430.0" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="223.7" y="421.2" width="132.5" height="17.5" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.0"/><text x="290.0" y="433.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Наступна сторінка Flash</tspan></text>
<line x1="223.7" y1="430.0" x2="160.0" y2="430.0" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="160.0" y1="430.0" x2="160.0" y2="313.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="658.7" y="402.0" width="162.6" height="56.0" rx="6" fill="#fef9e7" stroke="#a9791f" stroke-width="1.8"/><text x="740.0" y="420.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">7. Запис Lock Bits</tspan><tspan x="740.0" dy="13.0">та зняття RESET</tspan><tspan x="740.0" dy="13.0">(Запуск нової прошивки)</tspan></text>
<line x1="596.6" y1="430.0" x2="658.7" y2="430.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="610.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Усі сторінки OK</text>
</svg>