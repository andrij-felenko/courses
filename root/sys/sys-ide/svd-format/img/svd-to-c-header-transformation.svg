<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трансформація опису SVD у системні заголовки C/C++, Rust та структури відлагоджувача</text>
<rect x="10.0" y="10.0" width="840.0" height="450.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.0"/>
<rect x="30.0" y="175.0" width="170.0" height="100.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="2.0"/><text x="115.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">Файл CMSIS-SVD</tspan><tspan x="115.0" dy="13.0">(device.svd)</tspan><tspan x="115.0" dy="13.0"></tspan><tspan x="115.0" dy="13.0">• XML розмітка</tspan><tspan x="115.0" dy="13.0">• Карта адрес</tspan><tspan x="115.0" dy="13.0">• Біти, маски, енуми</tspan></text>
<rect x="240.0" y="125.0" width="220.0" height="200.0" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/><text x="350.0" y="185.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Семантичний процесор SVD</tspan><tspan x="350.0" dy="12.3"></tspan><tspan x="350.0" dy="12.3">1. XML парсинг та XSD перевірка</tspan><tspan x="350.0" dy="12.3">2. Розкриття derivedFrom</tspan><tspan x="350.0" dy="12.3">3. Сортування зміщень регістрів</tspan><tspan x="350.0" dy="12.3">4. Розрахунок прогалин (padding)</tspan><tspan x="350.0" dy="12.3">5. Валідація прав (RO/WO/RW)</tspan><tspan x="350.0" dy="12.3">6. Генерація моделі периферії</tspan></text>
<line x1="200.0" y1="225.0" x2="238.0" y2="225.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="500.0" y="25.0" width="330.0" height="95.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="665.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">C99 CMSIS Header (svd2c / svdconv)</tspan><tspan x="665.0" dy="12.3"></tspan><tspan x="665.0" dy="12.3">• typedef struct { ... } Periph_TypeDef</tspan><tspan x="665.0" dy="12.3">• uint8_t RESERVED_0x[N] вирівнювання</tspan><tspan x="665.0" dy="12.3">• #define PERIPH_REG_FIELD_Pos / _Msk</tspan><tspan x="665.0" dy="12.3">• _Static_assert(offsetof(...) == offset)</tspan></text>
<line x1="460.0" y1="180.0" x2="498.0" y2="72.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="135.0" width="330.0" height="100.0" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/><text x="665.0" y="157.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">C++20 Type-Safe Regs</tspan><tspan x="665.0" dy="12.3"></tspan><tspan x="665.0" dy="12.3">• Шаблонні обгортки Register&lt;Addr, Policy&gt;</tspan><tspan x="665.0" dy="12.3">• Строгі enum class для бітових полів</tspan><tspan x="665.0" dy="12.3">• Concepts (Readable / Writable / ClearOnRead)</tspan><tspan x="665.0" dy="12.3">• static_assert валідація зміщень</tspan></text>
<line x1="460.0" y1="225.0" x2="498.0" y2="185.0" stroke="#6366f1" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="250.0" width="330.0" height="85.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="665.0" y="271.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Rust PAC Crate (svd2rust)</tspan><tspan x="665.0" dy="12.3"></tspan><tspan x="665.0" dy="12.3">• Type-state токени володіння (Ownership)</tspan><tspan x="665.0" dy="12.3">• Safe Modify / Read / Write проксі</tspan><tspan x="665.0" dy="12.3">• Zero-cost бітові мутатори</tspan></text>
<line x1="460.0" y1="270.0" x2="498.0" y2="292.0" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="350.0" width="330.0" height="90.0" rx="6" fill="#fdf2f8" stroke="#c0392b" stroke-width="1.5"/><text x="665.0" y="373.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">IDE Debugger (GDB / Ozone / VSCode)</tspan><tspan x="665.0" dy="12.3"></tspan><tspan x="665.0" dy="12.3">• Live Peripherals древоподібний перегляд</tspan><tspan x="665.0" dy="12.3">• Декодування значень полів у бітові описи</tspan><tspan x="665.0" dy="12.3">• Безпечний моніторинг без side-effects</tspan></text>
<line x1="460.0" y1="295.0" x2="498.0" y2="395.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>