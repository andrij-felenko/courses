<rect x="564.9" y="105.0" width="420.1" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="775.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Батьківський репозиторій (Main Tree)</tspan><tspan x="775.0" dy="16.9">.git/objects/ — містить усі блоби та дерева бібліотеки</tspan></text>
<rect x="617.9" y="183.4" width="314.1" height="63.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="203.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Синтетичний коміт злиття (Merge Commit)</tspan><tspan x="775.0" dy="15.6">Prefix rewrite: імпортує вміст у libs/lwip/</tspan><tspan x="775.0" dy="15.6">Зберігає зв'язок із батьківськими комітами</tspan></text>
<line x1="775.0" y1="158.0" x2="775.0" y2="190.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
