<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектурна різниця між Git Submodule та Git Subtree</text>
<rect x="30.0" y="40.0" width="470.0" height="480.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="265.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Git Submodule (Вказівник на зовнішній коміт)</text>
<rect x="92.0" y="105.0" width="346.0" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="265.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Батьківський репозиторій (Main Tree)</tspan><tspan x="265.0" dy="16.9">.git/objects/ — зберігає лише дерево проєкту</tspan></text>
<rect x="101.1" y="191.2" width="327.8" height="47.6" rx="6" fill="#fef9e7" stroke="#c0392b" stroke-width="1.5"/><text x="265.0" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Дерево Git (mode 160000 commit)</tspan><tspan x="265.0" dy="15.6">libs/lwip -&gt; 7e9f3b2a… (фіксований SHA-1/256)</tspan></text>
<line x1="265.0" y1="158.0" x2="265.0" y2="190.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.5" y="275.1" width="179.0" height="69.9" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="150.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Конфігурація .gitmodules</tspan><tspan x="150.0" dy="14.3">[submodule &quot;lwip&quot;]</tspan><tspan x="150.0" dy="14.3">  path = libs/lwip</tspan><tspan x="150.0" dy="14.3">  url = https://…/lwip.git</tspan></text>
