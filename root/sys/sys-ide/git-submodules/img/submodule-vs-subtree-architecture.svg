<line x1="220.0" y1="248.0" x2="160.0" y2="275.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="310.0" y1="248.0" x2="370.0" y2="275.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="84.0" y="403.4" width="362.0" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="265.0" y="423.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Робоче дерево підмодуля: libs/lwip/</tspan><tspan x="265.0" dy="15.6">Містить файл .git: gitdir: ../../.git/modules/lwip</tspan><tspan x="265.0" dy="15.6">Вимагає окремого клонування (git submodule update)</tspan></text>
<line x1="150.0" y1="355.0" x2="220.0" y2="400.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
