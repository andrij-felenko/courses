<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема імпорту та злиття дерева у Git Subtree</text>
<text x="550.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм злиття зовнішнього дерева у підкаталог через Git Subtree</text>
<rect x="50.0" y="75.0" width="440.0" height="160.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Віддалений репозиторій бібліотеки (Upstream)</tspan><tspan x="270.0" dy="16.9"></tspan><tspan x="270.0" dy="16.9">Коміти в гілці main:</tspan><tspan x="270.0" dy="16.9">C1 -&gt; C2 -&gt; C3 -&gt; C4 (реліз v2.1.0)</tspan></text>
<line x1="270.0" y1="245.0" x2="270.0" y2="285.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="390.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">git subtree add --prefix=vendor/lib --squash</text>
<rect x="50.0" y="295.0" width="1000.0" height="150.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="550.0" y="341.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Головний репозиторій проєкту (Monolithic Tree)</tspan><tspan x="550.0" dy="16.2"></tspan><tspan x="550.0" dy="16.2">• Синтезований Squash-коміт: містить знімок файлів C4 під префіксом vendor/lib/</tspan><tspan x="550.0" dy="16.2">• Merge-коміт (2 батьки): батько 1 = попередній коміт проєкту, батько 2 = squash-коміт</tspan><tspan x="550.0" dy="16.2">• Усі файли бібліотеки стають звичайними файлами репозиторію: будь-який git clone качає все одразу</tspan></text>
<rect x="520.0" y="75.0" width="530.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="126.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Переваги проти Submodules:</tspan><tspan x="785.0" dy="16.2"></tspan><tspan x="785.0" dy="16.2">• Нуль конфігураційних файлів (.gitmodules не потрібен)</tspan><tspan x="785.0" dy="16.2">• Немає проблем із detached HEAD або відсутністю прав на CI</tspan><tspan x="785.0" dy="16.2">• Можливість редагувати й комітити прямо в каталозі проєкту</tspan></text>
<rect x="50.0" y="470.0" width="1000.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="496.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Git Subtree перетворює сторонній код на звичайні файли власного репозиторію через синтез merge-комітів,</tspan><tspan x="550.0" dy="16.9">усуваючи залежність від вторинних репозиторіїв та специфічних прапорців клонування.</tspan></text>
</svg>