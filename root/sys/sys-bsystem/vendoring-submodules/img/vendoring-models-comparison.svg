<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння моделей підключення зовнішніх залежностей</text>
<text x="550.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири архітектурні моделі отримання та зберігання залежностей</text>
<rect x="35.0" y="80.0" width="245.0" height="370.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="157.5" y="216.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="157.5" dy="0.0">1. Direct Vendoring</tspan><tspan x="157.5" dy="15.0">third_party/ або vendor/</tspan><tspan x="157.5" dy="15.0"></tspan><tspan x="157.5" dy="15.0">• Фізичні файли в основному репо</tspan><tspan x="157.5" dy="15.0">• 100% герметичність збірки</tspan><tspan x="157.5" dy="15.0">• Працює без мережі й тулзів</tspan><tspan x="157.5" dy="15.0">• Роздуває репозиторій Git</tspan><tspan x="157.5" dy="15.0">• Втрата історії комітів апстріму</tspan></text>
<rect x="300.0" y="80.0" width="245.0" height="370.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="422.5" y="220.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="422.5" dy="0.0">2. Git Submodules</tspan><tspan x="422.5" dy="13.7">.gitmodules + gitlink</tspan><tspan x="422.5" dy="13.7"></tspan><tspan x="422.5" dy="13.7">• Вкладені незалежні репозиторії</tspan><tspan x="422.5" dy="13.7">• Прив'язка до конкретного SHA</tspan><tspan x="422.5" dy="13.7">• Чиста історія головного проєкту</tspan><tspan x="422.5" dy="13.7">• Пастки detached HEAD та розсинхрону</tspan><tspan x="422.5" dy="13.7">• Потребує --recurse-submodules</tspan></text>
<rect x="565.0" y="80.0" width="245.0" height="370.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="687.5" y="220.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="687.5" dy="0.0">3. Git Subtree</tspan><tspan x="687.5" dy="13.7">git subtree add/pull</tspan><tspan x="687.5" dy="13.7"></tspan><tspan x="687.5" dy="13.7">• Злиття зовнішнього дерева в папку</tspan><tspan x="687.5" dy="13.7">• Збереження історії комітів</tspan><tspan x="687.5" dy="13.7">• Клонування в один звичайний крок</tspan><tspan x="687.5" dy="13.7">• Важчий журнал та граф комітів</tspan><tspan x="687.5" dy="13.7">• Складніший зворотний експорт</tspan></text>
<rect x="830.0" y="80.0" width="245.0" height="370.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="952.5" y="220.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="952.5" dy="0.0">4. Package Managers</tspan><tspan x="952.5" dy="13.7">Conan / vcpkg / FetchContent</tspan><tspan x="952.5" dy="13.7"></tspan><tspan x="952.5" dy="13.7">• Декларативний маніфест</tspan><tspan x="952.5" dy="13.7">• Кешування пребілд-бінарників</tspan><tspan x="952.5" dy="13.7">• Автоматичний солвер версій</tspan><tspan x="952.5" dy="13.7">• Залежність від зовнішніх серверів</tspan><tspan x="952.5" dy="13.7">• Необхідність мережі або проксі</tspan></text>
<rect x="35.0" y="475.0" width="1030.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="501.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Вендоринг та сабмодулі переносять контроль над кодом у власне сховище,</tspan><tspan x="550.0" dy="17.6">гарантуючи автономність і відтворюваність збірки без сторонніх менеджерів пакетів.</tspan></text>
</svg>