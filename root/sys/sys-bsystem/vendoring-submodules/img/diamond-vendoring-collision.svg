<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ромбоподібна залежність та ODR-колапс при незалежному вендорингу</text>
<text x="550.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ромбоподібний конфлікт при вендорингу: порушення ODR та дублювання стану</text>
<rect x="380.0" y="75.0" width="340.0" height="80.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="550.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Головний додаток: App</tspan><tspan x="550.0" dy="12.3"></tspan><tspan x="550.0" dy="12.3">target_link_libraries(App PRIVATE AudioEngine NetClient)</tspan></text>
<line x1="470.0" y1="160.0" x2="320.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="630.0" y1="160.0" x2="780.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="210.0" width="420.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Модуль AudioEngine</tspan><tspan x="290.0" dy="15.6">(Вендорить Logger v1.0 у third_party/logger/)</tspan><tspan x="290.0" dy="15.6"></tspan><tspan x="290.0" dy="15.6">struct LogEntry { int id; char msg[64]; };</tspan><tspan x="290.0" dy="15.6">Розмір структури: 68 байтів</tspan></text>
<rect x="600.0" y="210.0" width="420.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="810.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Модуль NetClient</tspan><tspan x="810.0" dy="15.6">(Вендорить Logger v2.0 у vendor/logger/)</tspan><tspan x="810.0" dy="15.6"></tspan><tspan x="810.0" dy="15.6">struct LogEntry { uint64_t ts; std::string msg; };</tspan><tspan x="810.0" dy="15.6">Розмір структури: 48 байтів</tspan></text>
<line x1="290.0" y1="335.0" x2="450.0" y2="375.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="810.0" y1="335.0" x2="650.0" y2="375.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="375.0" width="940.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="550.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Катастрофа лінкування та порушення One Definition Rule (ODR):</tspan><tspan x="550.0" dy="15.6"></tspan><tspan x="550.0" dy="15.6">1. CMake: аварія add_library(logger) duplicate target name (якщо не ізольовано)</tspan><tspan x="550.0" dy="15.6">2. Лінкер: multiple definition of 'log_message' або випадковий вибір першого символу (COMDAT folding)</tspan><tspan x="550.0" dy="15.6">3. Виконання: NetClient викликає log_message() і передає 48 байтів замість 68 -&gt; пошкодження пам'яті SIGSEGV</tspan></text>
<rect x="80.0" y="485.0" width="940.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="514.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Вендоринг без централізованого узгодження версій призводить до дублювання та смертоносних колізій ODR.</tspan></text>
</svg>