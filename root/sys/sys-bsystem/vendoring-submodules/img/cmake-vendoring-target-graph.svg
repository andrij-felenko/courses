<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ізоляція та керування вендореним кодом у моделі цілей CMake</text>
<text x="550.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтеграція вендореного коду в CMake: захист глобального простору цілей</text>
<rect x="50.0" y="75.0" width="420.0" height="250.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Кореневий CMakeLists.txt проєкту</tspan><tspan x="260.0" dy="15.6"></tspan><tspan x="260.0" dy="15.6"># 1. Перевизначення кеш-опцій залежності</tspan><tspan x="260.0" dy="15.6">set(BUILD_TESTING OFF CACHE BOOL &quot;&quot; FORCE)</tspan><tspan x="260.0" dy="15.6">set(ZLIB_BUILD_EXAMPLES OFF CACHE BOOL &quot;&quot; FORCE)</tspan><tspan x="260.0" dy="15.6"></tspan><tspan x="260.0" dy="15.6"># 2. Включення з ізоляцією</tspan><tspan x="260.0" dy="15.6">add_subdirectory(third_party/zlib EXCLUDE_FROM_ALL SYSTEM)</tspan><tspan x="260.0" dy="15.6"></tspan><tspan x="260.0" dy="15.6"># 3. Лінкування через ALIAS</tspan><tspan x="260.0" dy="15.6">target_link_libraries(app PRIVATE Vendor::Zlib)</tspan></text>
<line x1="480.0" y1="200.0" x2="550.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="515.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ізолює</text>
<rect x="560.0" y="75.0" width="490.0" height="250.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="165.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Вендорений підпроєкт third_party/zlib/</tspan><tspan x="805.0" dy="15.6"></tspan><tspan x="805.0" dy="15.6">• Рідна ціль: add_library(zlibstatic ...)</tspan><tspan x="805.0" dy="15.6">• Псевдонім простору імен: add_library(Vendor::Zlib ALIAS zlibstatic)</tspan><tspan x="805.0" dy="15.6">• Непотрібні цілі (тести/утиліти): відсікаються EXCLUDE_FROM_ALL</tspan><tspan x="805.0" dy="15.6">• Заголовки (zlib.h): позначаються як SYSTEM (-isystem)</tspan></text>
<rect x="50.0" y="350.0" width="300.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="382.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">EXCLUDE_FROM_ALL</tspan><tspan x="200.0" dy="14.3"></tspan><tspan x="200.0" dy="14.3">Виключає сторонні тести та утиліти</tspan><tspan x="200.0" dy="14.3">зі стандартної збірки проєкту (target all)</tspan></text>
<rect x="400.0" y="350.0" width="300.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="550.0" y="380.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">SYSTEM Include</tspan><tspan x="550.0" dy="15.6"></tspan><tspan x="550.0" dy="15.6">Придушує діагностичні попередження</tspan><tspan x="550.0" dy="15.6">компілятора (-Wall -Werror) у чужому коді</tspan></text>
<rect x="750.0" y="350.0" width="300.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="900.0" y="380.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">ALIAS &amp; Namespaces</tspan><tspan x="900.0" dy="15.6"></tspan><tspan x="900.0" dy="15.6">Ізолює імена цілей (Vendor::Zlib) і</tspan><tspan x="900.0" dy="15.6">запобігає колізіям у глобальній моделі</tspan></text>
<rect x="50.0" y="475.0" width="1000.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="498.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Правильна інтеграція вендорингу в CMake вимагає захисту кешу, виключення зайвих цілей через EXCLUDE_FROM_ALL,</tspan><tspan x="550.0" dy="16.2">придушення попереджень через SYSTEM та інкапсуляції бібліотек у псевдоніми з подвійною двокрапкою.</tspan></text>
</svg>