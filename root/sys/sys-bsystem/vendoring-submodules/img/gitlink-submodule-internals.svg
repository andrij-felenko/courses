<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія gitlink та механізм зв'язування Git Submodule</text>
<text x="550.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішня структура підмодуля: gitlink, .gitmodules та сховище .git/modules</text>
<rect x="50.0" y="75.0" width="470.0" height="370.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="285.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Головний репозиторій (Parent Repository)</tspan><tspan x="285.0" dy="16.2"></tspan><tspan x="285.0" dy="16.2">1. Файл конфігурації .gitmodules:</tspan><tspan x="285.0" dy="16.2">   [submodule &quot;third_party/fmt&quot;]</tspan><tspan x="285.0" dy="16.2">       path = third_party/fmt</tspan><tspan x="285.0" dy="16.2">       url = https://github.com/fmtlib/fmt.git</tspan><tspan x="285.0" dy="16.2"></tspan><tspan x="285.0" dy="16.2">2. Запис в об'єкті Tree / Index (git ls-tree HEAD):</tspan><tspan x="285.0" dy="16.2">   160000 commit e69e6047321527025816...	third_party/fmt</tspan><tspan x="285.0" dy="16.2"></tspan><tspan x="285.0" dy="16.2">3. Робочий каталог third_party/fmt/.git:</tspan><tspan x="285.0" dy="16.2">   gitdir: ../../.git/modules/third_party/fmt</tspan></text>
<line x1="530.0" y1="260.0" x2="580.0" y2="260.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="590.0" y="75.0" width="460.0" height="370.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="820.0" y="183.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Сховище об'єктів підмодуля (.git/modules/)</tspan><tspan x="820.0" dy="16.2"></tspan><tspan x="820.0" dy="16.2">Каталог .git/modules/third_party/fmt/:</tspan><tspan x="820.0" dy="16.2">• config (локальні налаштування підмодуля)</tspan><tspan x="820.0" dy="16.2">• HEAD (вказує на зафіксований SHA коміту)</tspan><tspan x="820.0" dy="16.2">• objects/ (справжня база blob, tree, commit)</tspan><tspan x="820.0" dy="16.2">• refs/heads/ (локальні гілки підмодуля)</tspan><tspan x="820.0" dy="16.2"></tspan><tspan x="820.0" dy="16.2">⚠️ Стан detached HEAD:</tspan><tspan x="820.0" dy="16.2">Робочий каталог підмодуля виставлений на точний SHA,</tspan><tspan x="820.0" dy="16.2">а не на рухому гілку. Зміни без branch губляться!</tspan></text>
<rect x="50.0" y="470.0" width="1000.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="496.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Підмодуль у дереві Git — це спеціальний 20-байтний покажчик (mode 160000 gitlink) на SHA коміту,</tspan><tspan x="550.0" dy="16.9">а його повна історія та об'єкти фізично ізольовані в каталозі .git/modules/ батьківського репо.</tspan></text>
</svg>