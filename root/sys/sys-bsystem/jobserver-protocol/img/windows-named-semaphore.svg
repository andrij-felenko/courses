<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура Windows Jobserver на основі Named Semaphore</text>
<text x="510.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура Windows Jobserver на основі Named Semaphore</text>
<rect x="340.0" y="70.0" width="340.0" height="150.0" rx="6" fill="#fef9e7" stroke="#c0392b" stroke-width="1.8"/>
<text x="510.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Об'єкт ядра: Named Semaphore</text>
<text x="510.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Шлях: \BaseNamedObjects\jobserver_sem_4102</text>
<rect x="355.0" y="140.0" width="310.0" height="65.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="510.0" y="168.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Поточний лічильник: N - 1 токенів</tspan><tspan x="510.0" dy="15.6">CreateSemaphoreA(NULL, N-1, N-1, name);</tspan></text>
<rect x="40.0" y="260.0" width="420.0" height="175.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="250.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Клієнт 1: GNU Make / CMake</text>
<rect x="55.0" y="305.0" width="390.0" height="115.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="250.0" y="345.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Отримує ім'я через --jobserver-auth=jobserver_sem_4102</tspan><tspan x="250.0" dy="13.7">1. OpenSemaphoreA(SYNCHRONIZE | SEMAPHORE_MODIFY_STATE...)</tspan><tspan x="250.0" dy="13.7">2. WaitForSingleObject(hSem, INFINITE) → токен захоплено</tspan><tspan x="250.0" dy="13.7">3. ReleaseSemaphore(hSem, 1, NULL) → токен звільнено</tspan></text>
<rect x="560.0" y="260.0" width="420.0" height="175.0" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/>
<text x="770.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Клієнт 2: Cargo / Rustc / Ninja</text>
<rect x="575.0" y="305.0" width="390.0" height="115.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="336.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Атомарне очікування токена та завершення задач:</tspan><tspan x="770.0" dy="15.0">WaitForMultipleObjects(</tspan><tspan x="770.0" dy="15.0">    handles = [hSem, hChildProc1, hChildProc2...],</tspan><tspan x="770.0" dy="15.0">    bWaitAll = FALSE, dwMilliseconds = INFINITE</tspan><tspan x="770.0" dy="15.0">);  // Розблоковується і по токену, і по виходу процесу</tspan></text>
<line x1="350.0" y1="260.0" x2="430.0" y2="225.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="670.0" y1="260.0" x2="590.0" y2="225.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>