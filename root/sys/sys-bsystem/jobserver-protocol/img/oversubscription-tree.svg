<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл навантаження CPU: рекурсивний вибух проти пулу Jobserver</text>
<text x="520.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл навантаження CPU: рекурсивний вибух проти пулу Jobserver</text>
<rect x="30.0" y="60.0" width="470.0" height="385.0" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.6"/>
<text x="265.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Без Jobserver: рекурсивна перепідписка</text>
<rect x="158.1" y="110.6" width="213.8" height="48.8" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="131.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">Головний процес: make -j8</tspan><tspan x="265.0" dy="16.2">(Запускає 8 підпроєктів)</tspan></text>
<line x1="170.0" y1="165.0" x2="130.0" y2="205.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="265.0" y1="165.0" x2="265.0" y2="205.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="360.0" y1="165.0" x2="400.0" y2="205.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="74.3" y="211.8" width="91.3" height="46.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="120.0" y="231.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Sub-Make 1</tspan><tspan x="120.0" dy="15.0">(-j8)</tspan></text>
<rect x="208.7" y="211.8" width="112.7" height="46.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="265.0" y="231.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">Sub-Make 2…7</tspan><tspan x="265.0" dy="15.0">(-j8 кожному)</tspan></text>
<rect x="364.4" y="211.8" width="91.3" height="46.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="231.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Sub-Make 8</tspan><tspan x="410.0" dy="15.0">(-j8)</tspan></text>
<line x1="120.0" y1="265.0" x2="120.0" y2="305.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="265.0" y1="265.0" x2="265.0" y2="305.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="410.0" y1="265.0" x2="410.0" y2="305.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="55.0" y="310.0" width="420.0" height="115.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="265.0" y="348.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Одночасно стартує: 8 × 8 = 64 компілятори!</tspan><tspan x="265.0" dy="15.6">• 8 фізичних ядер CPU перевантажені</tspan><tspan x="265.0" dy="15.6">• Вимивання кешів L1/L2/L3 через перемикання контекстів</tspan><tspan x="265.0" dy="15.6">• Вибух пам'яті (до 2 ГБ на процес) → OOM Killer / Swap</tspan></text>
<rect x="540.0" y="60.0" width="470.0" height="385.0" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.6"/>
<text x="775.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">З Jobserver: спільний пул токенів</text>
<rect x="664.2" y="110.6" width="221.5" height="48.8" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="775.0" y="131.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">Головний процес: make -j8</tspan><tspan x="775.0" dy="16.2">(Створює пул із 8 токенів)</tspan></text>
<line x1="775.0" y1="165.0" x2="775.0" y2="195.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="649.7" y="188.4" width="250.6" height="63.2" rx="6" fill="#fef9e7" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="208.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">Пул токенів (Pipe / Semaphore)</tspan><tspan x="775.0" dy="15.6">[●] [●] [●] [●] [●] [●] [●] [●]</tspan><tspan x="775.0" dy="15.6">(1 неявний + 7 явних у черзі)</tspan></text>
<line x1="700.0" y1="250.0" x2="640.0" y2="290.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="775.0" y1="250.0" x2="775.0" y2="290.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="850.0" y1="250.0" x2="910.0" y2="290.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="565.0" y="295.0" width="420.0" height="130.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Динамічний запит токенів за потребою:</tspan><tspan x="775.0" dy="15.6">• Сумарно працює строго не більше 8 компіляторів</tspan><tspan x="775.0" dy="15.6">• Вільні ядра миттєво переходять до завантажених гілок</tspan><tspan x="775.0" dy="15.6">• Немає простоїв, пам'ять під повним контролем</tspan><tspan x="775.0" dy="15.6">• 100% утилізація CPU без надлишкових перемикань</tspan></text>
</svg>