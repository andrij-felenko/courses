<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл токена в POSIX Jobserver (GNU Make Pipe)</text>
<text x="500.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл токена в POSIX Jobserver (GNU Make Pipe)</text>
<rect x="40.0" y="70.0" width="420.0" height="380.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="250.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" font-weight="700">Кореневий процес (Make -j4)</text>
<rect x="60.0" y="120.0" width="380.0" height="95.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="250.0" y="148.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">1. Створює pipe(fds) → rfd=3, wfd=4</tspan><tspan x="250.0" dy="15.6">2. Записує 3 байти токенів у wfd: '+++'</tspan><tspan x="250.0" dy="15.6">3. 1 токен залишає собі як неявний слот</tspan><tspan x="250.0" dy="15.6">4. Експортує MAKEFLAGS=&quot;--jobserver-auth=3,4&quot;</tspan></text>
<rect x="510.0" y="70.0" width="450.0" height="380.0" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/>
<text x="735.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Буфер Pipe у ядрі (FIFO токенів)</text>
<rect x="540.0" y="130.0" width="390.0" height="60.0" rx="6" fill="#fef9e7" stroke="#27ae60" stroke-width="1.8"/>
<text x="735.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пайп: [ Байт '+' ] [ Байт '+' ] [ Байт '+' ]</text>
<text x="735.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Доступно токенів у ядрі: 3 (загалом паралелізм = 4)</text>
<line x1="440.0" y1="250.0" x2="540.0" y2="250.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="230.0" width="360.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="258.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Крок 1: Запит токена (Acquire)</tspan><tspan x="240.0" dy="15.6">read(rfd, &amp;token, 1);</tspan><tspan x="240.0" dy="15.6">→ Якщо пайп порожній, процес блокується</tspan></text>
<rect x="540.0" y="220.0" width="390.0" height="90.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="735.0" y="245.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">Компілятор запущено (PID 4092)</tspan><tspan x="735.0" dy="15.6">• Працює g++ -c main.cpp</tspan><tspan x="735.0" dy="15.6">• Токен перебуває у розпорядженні процесу</tspan><tspan x="735.0" dy="15.6">• У пайпі лишилося 2 токени</tspan></text>
<line x1="540.0" y1="360.0" x2="440.0" y2="360.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="340.0" width="360.0" height="85.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="363.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Крок 2: Повернення токена (Release)</tspan><tspan x="240.0" dy="15.6">waitpid(pid, &amp;status, 0);</tspan><tspan x="240.0" dy="15.6">write(wfd, &amp;token, 1);</tspan><tspan x="240.0" dy="15.6">→ Токен знову доступний іншим процесам</tspan></text>
<rect x="540.0" y="340.0" width="390.0" height="85.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="735.0" y="371.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">Компілятор завершив роботу</tspan><tspan x="735.0" dy="15.6">• Байт '+' повернуто у буфер пайпа</tspan><tspan x="735.0" dy="15.6">• Ядро розблоковує інший процес у черзі read()</tspan></text>
</svg>