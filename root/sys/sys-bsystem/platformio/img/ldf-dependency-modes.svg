<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Режими аналізу залежностей LDF: швидке парсування проти точного препроцесингу</text>
<rect x="35.0" y="50.0" width="455.0" height="395.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="262.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Лексичне сканування (chain / deep)</text>
<rect x="166.5" y="87.8" width="191.0" height="94.4" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="262.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="262.0" dy="0.0">Вихідний файл (.cpp / .c)</tspan><tspan x="262.0" dy="15.6">#include &lt;WiFi.h&gt;</tspan><tspan x="262.0" dy="15.6">#ifdef USE_BLE</tspan><tspan x="262.0" dy="15.6">  #include &lt;BLEDevice.h&gt;</tspan><tspan x="262.0" dy="15.6">#endif</tspan></text>
<rect x="132.3" y="208.4" width="259.4" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="262.0" y="228.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="262.0" dy="0.0">Аналізатор регулярних виразів LDF</tspan><tspan x="262.0" dy="15.6">Зчитує ВСІ рядки #include наосліп,</tspan><tspan x="262.0" dy="15.6">ігнорує умови препроцесора (#ifdef)</tspan></text>
<rect x="114.4" y="315.6" width="295.3" height="78.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="262.0" y="335.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="262.0" dy="0.0">Результат:</tspan><tspan x="262.0" dy="15.6">+ Максимальна швидкість сканування</tspan><tspan x="262.0" dy="15.6">− Хибні залежності: тягне BLEDevice.h</tspan><tspan x="262.0" dy="15.6">навіть коли USE_BLE вимкнено</tspan></text>
<line x1="262.0" y1="185.2" x2="262.0" y2="203.4" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="262.0" y1="274.6" x2="262.0" y2="310.6" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="530.0" y="50.0" width="455.0" height="395.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="757.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Препроцесорний аналіз (chain+ / deep+)</text>
<rect x="661.5" y="87.8" width="191.0" height="94.4" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="757.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="757.0" dy="0.0">Вихідний файл (.cpp / .c)</tspan><tspan x="757.0" dy="15.6">#include &lt;WiFi.h&gt;</tspan><tspan x="757.0" dy="15.6">#ifdef USE_BLE</tspan><tspan x="757.0" dy="15.6">  #include &lt;BLEDevice.h&gt;</tspan><tspan x="757.0" dy="15.6">#endif</tspan></text>
<rect x="599.9" y="208.4" width="314.1" height="63.2" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="757.0" y="228.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="757.0" dy="0.0">Запуск C-препроцесора (gcc -E)</tspan><tspan x="757.0" dy="15.6">Розкриття макросів, врахування build_flags:</tspan><tspan x="757.0" dy="15.6">-D USE_WIFI=1 (USE_BLE не визначено)</tspan></text>
<rect x="587.0" y="315.6" width="339.9" height="78.8" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="757.0" y="335.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="757.0" dy="0.0">Результат:</tspan><tspan x="757.0" dy="15.6">+ 100% точність графа бібліотек</tspan><tspan x="757.0" dy="15.6">+ Жодних зайвих об'єктних файлів</tspan><tspan x="757.0" dy="15.6">− Повільніша збірка (витрати на запуск cpp)</tspan></text>
<line x1="757.0" y1="185.2" x2="757.0" y2="203.4" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="757.0" y1="274.6" x2="757.0" y2="310.6" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>