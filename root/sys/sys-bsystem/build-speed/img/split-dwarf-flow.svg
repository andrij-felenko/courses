<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Split DWARF</text>
<text x="500.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Split DWARF (-gsplit-dwarf): розвантаження компонувальника</text>
<rect x="40.0" y="65.0" width="430.0" height="335.0" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.6"/>
<text x="255.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Звичайне лінкування: важкі .o файли</text>
<rect x="65.0" y="120.0" width="380.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="255.0" y="148.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Об'єктний файл foo.o (50 МБ):</tspan><tspan x="255.0" dy="16.2">[ Машинний код 2 МБ ] + [ DWARF 48 МБ ]</tspan><tspan x="255.0" dy="16.2">Лінкер змушений завантажити всі гігабайти</tspan></text>
<line x1="255.0" y1="205.0" x2="255.0" y2="245.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="65.0" y="250.0" width="380.0" height="120.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="290.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Лінкер читає 50 ГБ даних з диску,</tspan><tspan x="255.0" dy="15.6">дедуплікує типи та формує 2 ГБ бінарник.</tspan><tspan x="255.0" dy="15.6">Вузьке місце: пам'ять, I/O та шина CPU.</tspan><tspan x="255.0" dy="15.6">Час лінкування: 45–90 секунд</tspan></text>
<rect x="530.0" y="65.0" width="430.0" height="335.0" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.6"/>
<text x="745.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Split DWARF: розділення коду і налагодження</text>
<rect x="555.0" y="120.0" width="180.0" height="80.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="645.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">foo.o (2 МБ):</tspan><tspan x="645.0" dy="15.6">Код, релокації,</tspan><tspan x="645.0" dy="15.6">хеш-посилання</tspan></text>
<rect x="755.0" y="120.0" width="180.0" height="80.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="845.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">foo.dwo (48 МБ):</tspan><tspan x="845.0" dy="15.6">Повні налагоджувальні</tspan><tspan x="845.0" dy="15.6">символи DWARF</tspan></text>
<line x1="645.0" y1="205.0" x2="645.0" y2="245.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="555.0" y="250.0" width="380.0" height="120.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="745.0" y="290.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Лінкер читає ЛИШЕ код із foo.o (2 ГБ замість 50 ГБ),</tspan><tspan x="745.0" dy="15.6">швидко зшиває бінарник за 2 секунди.</tspan><tspan x="745.0" dy="15.6">Налагоджувач (gdb/lldb) читає .dwo напряму.</tspan><tspan x="745.0" dy="15.6">Час лінкування: 2–4 секунди</tspan></text>
</svg>