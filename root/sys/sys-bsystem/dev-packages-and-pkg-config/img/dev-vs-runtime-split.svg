<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія розколу пакунків: Runtime проти Development</text>
<text x="520.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Дистрибутиви Linux ділять один вихідний код бібліотеки на два взаємодоповнюючі пакети:</text>
<rect x="50.0" y="80.0" width="440.0" height="44.0" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="98.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Пакет виконання: libfoo1 (Runtime)</tspan><tspan x="270.0" dy="16.9">Цільова авдиторія: кінцеві користувачі та сервери</tspan></text>
<rect x="50.0" y="136.0" width="440.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="159.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">libfoo.so.1.2.0 (бінарний файл)</tspan><tspan x="270.0" dy="16.2">Скомпільований спільний об'єкт (ELF shared object)</tspan></text>
<rect x="50.0" y="200.0" width="440.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="223.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">libfoo.so.1 -&gt; libfoo.so.1.2.0</tspan><tspan x="270.0" dy="16.2">Симлінк SONAME: потрібен ld.so для запуску програм</tspan></text>
<rect x="50.0" y="264.0" width="440.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="287.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Конфігурація та ресурси</tspan><tspan x="270.0" dy="16.2">Файли даних, локалі, системні сервіси (за потреби)</tspan></text>
<rect x="50.0" y="328.0" width="440.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="351.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Призначення в системі</tspan><tspan x="270.0" dy="16.2">Мінімальний розмір, нуль зайвих файлів на сервері</tspan></text>
<rect x="550.0" y="80.0" width="440.0" height="44.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="98.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Пакет розробки: libfoo-dev / libfoo-devel</tspan><tspan x="770.0" dy="16.9">Цільова авдиторія: компілятори, інженери та збірка</tspan></text>
<rect x="550.0" y="136.0" width="440.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="159.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">/usr/include/foo/*.h (заголовки)</tspan><tspan x="770.0" dy="16.2">Декларації функцій, типів та макросів (C/C++ API)</tspan></text>
<rect x="550.0" y="200.0" width="440.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="223.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">libfoo.so -&gt; libfoo.so.1</tspan><tspan x="770.0" dy="16.2">Симлінк без версії: шукається лінкером ld при -lfoo</tspan></text>
<rect x="550.0" y="264.0" width="440.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="287.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">libfoo.a (статичний архів)</tspan><tspan x="770.0" dy="16.2">Архів об'єктних файлів для прапорця -static</tspan></text>
<rect x="550.0" y="328.0" width="440.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="351.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">/usr/lib/.../pkgconfig/foo.pc</tspan><tspan x="770.0" dy="16.2">Метадані pkg-config: прапорці компіляції та лінкування</tspan></text>
<rect x="50.0" y="410.0" width="940.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="438.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Чому цей поділ критичний:</tspan><tspan x="520.0" dy="16.2">1. Заощадження пам'яті: контейнерам і серверам не потрібні гігабайти заголовків і статичних архівів.</tspan><tspan x="520.0" dy="16.2">2. Співіснування ABI: у системі можуть одночасно стояти libfoo1 і libfoo2, але лише один libfoo-dev.</tspan></text>
</svg>