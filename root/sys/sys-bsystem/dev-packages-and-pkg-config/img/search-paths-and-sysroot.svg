<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драбина пошуку компілятора, лінкера та pkg-config</text>
<text x="520.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Як інструменти знаходять метадані, заголовки та бінарні бібліотеки:</text>
<rect x="50.0" y="80.0" width="290.0" height="40.0" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="195.0" y="104.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">Заголовки (Компілятор)</tspan></text>
<rect x="375.0" y="80.0" width="290.0" height="40.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="104.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Метадані (pkg-config)</tspan></text>
<rect x="700.0" y="80.0" width="290.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="845.0" y="104.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="845.0" dy="0.0">Бібліотеки (Лінкер)</tspan></text>
<rect x="50.0" y="132.0" width="290.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="195.0" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">1. Явні прапорці виклику</tspan><tspan x="195.0" dy="15.6">-I/path/to/include</tspan><tspan x="195.0" dy="15.6">-isystem /custom/include</tspan></text>
<rect x="375.0" y="132.0" width="290.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">1. Змінна оточення</tspan><tspan x="520.0" dy="15.6">PKG_CONFIG_PATH</tspan><tspan x="520.0" dy="15.6">(перевіряється першою)</tspan></text>
<rect x="700.0" y="132.0" width="290.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="845.0" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">1. Явні прапорці виклику</tspan><tspan x="845.0" dy="15.6">-L/path/to/lib</tspan><tspan x="845.0" dy="15.6">-lfoo</tspan></text>
<line x1="195.0" y1="200.0" x2="195.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="520.0" y1="200.0" x2="520.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="845.0" y1="200.0" x2="845.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="210.0" width="290.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="195.0" y="232.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">2. Локальні префікси</tspan><tspan x="195.0" dy="15.6">/usr/local/include</tspan><tspan x="195.0" dy="15.6">(ручні інсталяції)</tspan></text>
<rect x="375.0" y="210.0" width="290.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="232.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">2. Системні каталоги</tspan><tspan x="520.0" dy="15.6">/usr/lib/.../pkgconfig</tspan><tspan x="520.0" dy="15.6">/usr/share/pkgconfig</tspan></text>
<rect x="700.0" y="210.0" width="290.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="845.0" y="232.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">2. Локальні префікси</tspan><tspan x="845.0" dy="15.6">/usr/local/lib</tspan><tspan x="845.0" dy="15.6">/usr/local/lib64</tspan></text>
<line x1="195.0" y1="278.0" x2="195.0" y2="288.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="520.0" y1="278.0" x2="520.0" y2="288.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="845.0" y1="278.0" x2="845.0" y2="288.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="288.0" width="290.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="195.0" y="310.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">3. Системні та Multiarch</tspan><tspan x="195.0" dy="15.6">/usr/include/&lt;triplet&gt;</tspan><tspan x="195.0" dy="15.6">/usr/include</tspan></text>
<rect x="375.0" y="288.0" width="290.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="310.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">3. Перевизначення sysroot</tspan><tspan x="520.0" dy="15.6">PKG_CONFIG_LIBDIR</tspan><tspan x="520.0" dy="15.6">(ізоляція крос-збірки)</tspan></text>
<rect x="700.0" y="288.0" width="290.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="845.0" y="310.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">3. Системні та Multiarch</tspan><tspan x="845.0" dy="15.6">/usr/lib/&lt;triplet&gt;</tspan><tspan x="845.0" dy="15.6">/usr/lib, /usr/lib64</tspan></text>
<line x1="195.0" y1="356.0" x2="195.0" y2="366.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="520.0" y1="356.0" x2="520.0" y2="366.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="845.0" y1="356.0" x2="845.0" y2="366.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="366.0" width="290.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="195.0" y="388.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">4. Динамічний запуск</tspan><tspan x="195.0" dy="15.6">—</tspan><tspan x="195.0" dy="15.6">(тільки етап компіляції)</tspan></text>
<rect x="375.0" y="366.0" width="290.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="388.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">4. Префікс шляхів</tspan><tspan x="520.0" dy="15.6">PKG_CONFIG_SYSROOT_DIR</tspan><tspan x="520.0" dy="15.6">(додає префікс до -I, -L)</tspan></text>
<rect x="700.0" y="366.0" width="290.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="845.0" y="388.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">4. Динамічний запуск</tspan><tspan x="845.0" dy="15.6">RPATH -&gt; LD_LIBRARY_PATH</tspan><tspan x="845.0" dy="15.6">-&gt; /etc/ld.so.cache</tspan></text>
<rect x="50.0" y="460.0" width="940.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="491.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">При крос-компіляції PKG_CONFIG_LIBDIR вимикає системні шляхи хоста й спрямовує пошук виключно в sysroot,</tspan><tspan x="520.0" dy="16.2">а PKG_CONFIG_SYSROOT_DIR автоматично модифікує абсолютні прапорці -I/usr/include -&gt; -I$SYSROOT/usr/include.</tspan></text>
</svg>