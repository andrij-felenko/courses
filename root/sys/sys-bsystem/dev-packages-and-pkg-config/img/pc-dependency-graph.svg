<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розгортання залежностей pkg-config: Shared проти Static</text>
<text x="520.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Чому динамічне лінкування потребує одного прапорця, а статичне — усього транзитивного дерева:</text>
<rect x="50.0" y="80.0" width="430.0" height="40.0" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="265.0" y="104.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">Динамічне лінкування: pkg-config --libs foo</tspan></text>
<rect x="137.4" y="129.4" width="255.1" height="81.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Бібліотека: foo.pc</tspan><tspan x="265.0" dy="16.2">Libs: -L${libdir} -lfoo</tspan><tspan x="265.0" dy="16.2">Requires.private: libcrypto, zlib</tspan><tspan x="265.0" dy="16.2">Libs.private: -lm -lpthread</tspan></text>
<line x1="265.0" y1="220.0" x2="265.0" y2="270.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="275.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">тільки публічні Libs</text>
<rect x="51.9" y="269.4" width="426.1" height="81.2" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="265.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Команда лінкера при збірці програми:</tspan><tspan x="265.0" dy="16.2">gcc main.o -lfoo -o app</tspan><tspan x="265.0" dy="16.2">DT_NEEDED у libfoo.so сам вказує на libcrypto та zlib</tspan><tspan x="265.0" dy="16.2">Динамічний завантажувач ld.so підтягне їх під час запуску</tspan></text>
<rect x="560.0" y="80.0" width="430.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="775.0" y="104.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">Статичне лінкування: pkg-config --static --libs foo</tspan></text>
<rect x="647.4" y="137.5" width="255.1" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="775.0" y="158.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Бібліотека: foo.pc</tspan><tspan x="775.0" dy="16.2">Обхід Requires + Requires.private</tspan><tspan x="775.0" dy="16.2">і збір усіх Libs + Libs.private</tspan></text>
<line x1="700.0" y1="220.0" x2="640.0" y2="260.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="850.0" y1="220.0" x2="910.0" y2="260.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="579.0" y="266.2" width="102.1" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="286.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">libcrypto.pc</tspan><tspan x="630.0" dy="15.6">-lcrypto</tspan></text>
<rect x="876.1" y="266.2" width="67.9" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="910.0" y="286.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">zlib.pc</tspan><tspan x="910.0" dy="15.6">-lz</tspan></text>
<line x1="775.0" y1="320.0" x2="775.0" y2="360.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="547.7" y="369.4" width="454.6" height="81.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="775.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Команда лінкера при статичній збірці:</tspan><tspan x="775.0" dy="16.2">gcc -static main.o -lfoo -lcrypto -lz -lm -lpthread -o app</tspan><tspan x="775.0" dy="16.2">Архів libfoo.a містить невирішені символи SHA256_* і deflate;</tspan><tspan x="775.0" dy="16.2">Лінкер ld мусить отримати всі допоміжні архіви явно!</tspan></text>
<rect x="50.0" y="480.0" width="940.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="504.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Ключ --static змушує pkg-config рекурсивно обійти поля Requires.private і додати прапорці Libs.private,</tspan><tspan x="520.0" dy="16.2">гарантуючи, що всі транзитивні статичні залежності потраплять у командний рядок у правильному порядку.</tspan></text>
</svg>