<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр подвійного тулчейну та кодогенерація</text>
<text x="520.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр подвійного тулчейну: генератори коду хоста та бінарники цілі</text>
<rect x="40.0" y="60.0" width="460.0" height="430.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="270.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Етап 1: Інструмент хоста (Host Tool)</text>
<rect x="130.0" y="107.3" width="280.0" height="45.3" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Вихідні коди утиліти</tspan><tspan x="270.0" dy="14.3">codegen_tool.c / parser.cpp</tspan></text>
