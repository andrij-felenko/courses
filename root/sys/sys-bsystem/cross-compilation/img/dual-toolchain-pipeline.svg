<rect x="630.0" y="107.3" width="280.0" height="45.3" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="770.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Вихідні коди проєкту</tspan><tspan x="770.0" dy="14.3">main.c + app_logic.cpp</tspan></text>
<line x1="770.0" y1="160.0" x2="770.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="620.0" y="198.1" width="300.0" height="73.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="217.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Крос-компілятор цілі</tspan><tspan x="770.0" dy="14.3">CMAKE_TOOLCHAIN_FILE</tspan><tspan x="770.0" dy="14.3">aarch64-linux-gnu-gcc / arm-none-eabi-gcc</tspan><tspan x="770.0" dy="14.3">Лінкування з цільовим sysroot</tspan></text>
<line x1="770.0" y1="280.0" x2="770.0" y2="315.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="630.0" y="322.4" width="280.0" height="45.3" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="770.0" y="341.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Компіляція згенерованого коду</tspan><tspan x="770.0" dy="14.3">generated_tables.c + main.c</tspan></text>
<line x1="770.0" y1="375.0" x2="770.0" y2="410.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="620.0" y="410.2" width="300.0" height="59.6" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="429.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Кінцевий цільовий бінарник</tspan><tspan x="770.0" dy="14.3">firmware.elf / app-arm64</tspan><tspan x="770.0" dy="14.3">Працює на цільовому пристрої (ARM/RISC-V)</tspan></text>
</svg>