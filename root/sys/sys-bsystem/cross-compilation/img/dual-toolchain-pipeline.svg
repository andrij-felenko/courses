<rect x="130.0" y="195.2" width="280.0" height="59.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="214.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Нативний компілятор хоста</tspan><tspan x="270.0" dy="14.3">CMAKE_C_COMPILER (Host GCC/Clang)</tspan><tspan x="270.0" dy="14.3">Складання для x86_64</tspan></text>
<line x1="270.0" y1="260.0" x2="270.0" y2="295.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="130.0" y="295.2" width="280.0" height="59.6" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Виконуваний файл хоста</tspan><tspan x="270.0" dy="14.3">build-host/bin/codegen</tspan><tspan x="270.0" dy="14.3">Запускається прямо на робочій станції</tspan></text>
<line x1="270.0" y1="360.0" x2="270.0" y2="395.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="130.0" y="400.2" width="280.0" height="59.6" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="419.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Генерація джерельних файлів</tspan><tspan x="270.0" dy="14.3">./codegen -o generated_tables.c</tspan><tspan x="270.0" dy="14.3">Створює таблиці констант / парсер</tspan></text>
<line x1="425.0" y1="430.0" x2="615.0" y2="330.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="520.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Згенерований C/C++</text>
