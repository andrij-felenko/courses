<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1057.5 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1057.5" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Емуляція QEMU User Mode та binfmt_misc</text>
<text x="520.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прозора емуляція цільових двійкових файлів: Linux binfmt_misc і QEMU User Mode</text>
<rect x="38.6" y="89.3" width="242.9" height="61.4" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="109.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">1. Запуск двійкового файлу</tspan><tspan x="160.0" dy="15.0">ctest / ./test_runner_arm64</tspan><tspan x="160.0" dy="15.0">Бінарник скомпільовано під AArch64</tspan></text>
<line x1="280.0" y1="120.0" x2="370.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="369.1" y="89.3" width="301.9" height="61.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="109.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">2. Ядро Linux (x86_64 Host)</tspan><tspan x="520.0" dy="15.0">Перевірка магічних байтів заголовка ELF</tspan><tspan x="520.0" dy="15.0">e_machine = 0xB7 (AArch64) != 0x3E (x86_64)</tspan></text>
<line x1="650.0" y1="120.0" x2="740.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="722.5" y="89.3" width="315.0" height="61.4" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="880.0" y="109.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">3. Модуль binfmt_misc</tspan><tspan x="880.0" dy="15.0">Перехоплює непідтримуваний ELF</tspan><tspan x="880.0" dy="15.0">Маршрутизує виклик на зареєстрований емулятор</tspan></text>
<line x1="880.0" y1="160.0" x2="880.0" y2="220.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="230.0" width="960.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="520.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">4. qemu-aarch64-static (Простір користувача хоста)</text>
<rect x="80.0" y="291.1" width="380.0" height="57.8" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Динамічна трансляція коду (TCG)</tspan><tspan x="270.0" dy="13.7">Перетворює інструкції ARM64 у мікрооперації,</tspan><tspan x="270.0" dy="13.7">а потім у нативний машинний код x86_64</tspan></text>
<rect x="580.0" y="291.1" width="380.0" height="57.8" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Трансляція системних викликів (Syscall Mapping)</tspan><tspan x="770.0" dy="13.7">Конвертує номери syscall, порядок байтів та структури</tspan><tspan x="770.0" dy="13.7">і передає виконання нативному ядру Linux x86_64</tspan></text>
<line x1="520.0" y1="390.0" x2="520.0" y2="425.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="210.0" y="431.8" width="620.0" height="46.5" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="451.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">5. Повернення результату в CTest / консоль</tspan><tspan x="520.0" dy="15.0">Тести виконуються прозоро на робочій станції та в CI без фізичної цільової плати!</tspan></text>
</svg>