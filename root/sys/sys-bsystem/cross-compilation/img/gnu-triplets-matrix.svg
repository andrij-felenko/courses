<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Канонічна тріада GNU: Build, Host і Target</text>
<text x="520.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Канонічна тріада GNU: Build, Host і Target у конфігураціях збірки</text>
<rect x="26.0" y="54.3" width="328.1" height="61.4" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="74.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Build (Складальник)</tspan><tspan x="190.0" dy="15.0">Машина, на якій запускається процес компілятора</tspan><tspan x="190.0" dy="15.0">Приклад: Робоча станція x86_64</tspan></text>
<rect x="349.4" y="54.3" width="341.2" height="61.4" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="74.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Host (Виконавець)</tspan><tspan x="520.0" dy="15.0">Машина, на якій запускатиметься зібраний бінарник</tspan><tspan x="520.0" dy="15.0">Приклад: Сервер або робоча станція</tspan></text>
<rect x="695.8" y="54.3" width="308.4" height="61.4" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="850.0" y="74.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">Target (Ціль коду)</tspan><tspan x="850.0" dy="15.0">Архітектура, для якої компілятор створює код</tspan><tspan x="850.0" dy="15.0">Приклад: MCU, SBC або сервер</tspan></text>
<line x1="40.0" y1="140.0" x2="1000.0" y2="140.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="40.0" y="170.0" width="460.0" height="140.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/>
<text x="270.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Нативна збірка (Native)</text>
<text x="270.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Рівність систем: Build == Host == Target</text>
<text x="270.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">Тріплет: x86_64 -&gt; x86_64 -&gt; x86_64</text>
<text x="270.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Компілятор збирається на x86_64, працює на x86_64 і генерує код для x86_64.</text>
<rect x="540.0" y="170.0" width="460.0" height="140.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/>
<text x="770.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Крос-компілятор (Cross)</text>
<text x="770.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Рівність систем: Build == Host != Target</text>
<text x="770.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">Тріплет: x86_64 -&gt; x86_64 -&gt; aarch64</text>
<text x="770.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Компілятор працює на x86_64, але транслює код для процесора AArch64 (ARM64).</text>
<rect x="40.0" y="350.0" width="460.0" height="140.0" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="270.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Крос-нативна збірка (Cross-native)</text>
<text x="270.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Рівність систем: Build != Host == Target</text>
<text x="270.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">Тріплет: x86_64 -&gt; aarch64 -&gt; aarch64</text>
<text x="270.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Збірка нативного компілятора для ARM64 на швидкій робочій станції x86_64.</text>
<rect x="540.0" y="350.0" width="460.0" height="140.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="770.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Канадська збірка (Canadian Cross)</text>
<text x="770.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Рівність систем: Build != Host != Target</text>
<text x="770.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">Тріплет: x86_64 -&gt; x86_64-w64-mingw32 -&gt; arm-none-eabi</text>
<text x="770.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Збірка на Linux (Build) компілятора під Windows (Host), який компілюватиме під ARM (Target).</text>
</svg>