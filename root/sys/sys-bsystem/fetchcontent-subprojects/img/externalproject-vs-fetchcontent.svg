<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння ExternalProject та FetchContent</text>
<text x="280.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ExternalProject_Add: завантаження й збірка під час build time</text>
<text x="820.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">FetchContent: завантаження й інтеграція під час configure time</text>
<rect x="50.0" y="84.0" width="460.0" height="160.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="280.0" y="134.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">1. Фаза конфігурації (cmake -B build):</tspan><tspan x="280.0" dy="16.9">• Інтерпретатор бачить лише add_custom_target</tspan><tspan x="280.0" dy="16.9">• Ціль dep_lib НЕ існує в моделі проєкту</tspan><tspan x="280.0" dy="16.9">• Не можна викликати target_link_libraries(app dep_lib)</tspan><tspan x="280.0" dy="16.9">• Потрібні фіктивні IMPORTED цілі та ручні шляхи</tspan></text>
<line x1="280.0" y1="252.0" x2="280.0" y2="286.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="294.0" width="460.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="339.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">2. Фаза збірки (cmake --build build):</tspan><tspan x="280.0" dy="16.9">• Ninja/Make запускає дочірній процес CMake</tspan><tspan x="280.0" dy="16.9">• Дочірній процес качає, конфігурує і збирає .a/.so</tspan><tspan x="280.0" dy="16.9">• Головний проєкт чекає завершення чужої збірки</tspan><tspan x="280.0" dy="16.9">• Лінкування через ручний шлях до скомпільованого файлу</tspan></text>
<rect x="590.0" y="84.0" width="460.0" height="160.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="134.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">1. Фаза конфігурації (cmake -B build):</tspan><tspan x="820.0" dy="16.9">• FetchContent скачує або розпаковує джерела</tspan><tspan x="820.0" dy="16.9">• Викликається add_subdirectory() для чужого коду</tspan><tspan x="820.0" dy="16.9">• Ціль dep_lib потрапляє в спільну модель проєкту</tspan><tspan x="820.0" dy="16.9">• Працює пряме target_link_libraries(app dep_lib)</tspan></text>
<line x1="820.0" y1="252.0" x2="820.0" y2="286.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="590.0" y="294.0" width="460.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="339.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">2. Фаза збірки (cmake --build build):</tspan><tspan x="820.0" dy="16.9">• Єдиний спільний граф залежностей Ninja/Make</tspan><tspan x="820.0" dy="16.9">• Компіляція чужих і власних файлів паралельно</tspan><tspan x="820.0" dy="16.9">• Інкрементальна збірка бачить точні залежності</tspan><tspan x="820.0" dy="16.9">• Повне узгодження прапорців компілятора й тулчейна</tspan></text>
<rect x="50.0" y="470.0" width="1000.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="497.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">ExternalProject ізолює збірку в окремий процес ціною розриву графу цілей;</tspan><tspan x="550.0" dy="17.6">FetchContent переносить отримання джерел на фазу конфігурації й об'єднує граф цілей.</tspan></text>
</svg>