<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двопрофільна модель Conan 2.x (--profile:build та --profile:host)</text>
<text x="520.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Розділення інструментів збірки та цільових бібліотек під час крос-компіляції</text>
<rect x="30.0" y="75.0" width="450.0" height="350.0" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="255.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Контекст збірки (Build Context)</text>
<text x="255.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Параметр: --profile:build (Машина розробника / CI)</text>
<rect x="50.0" y="137.9" width="410.0" height="44.1" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="156.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Налаштування:</tspan><tspan x="255.0" dy="13.7">os=Linux, arch=x86_64, compiler=gcc-13</tspan></text>
<rect x="50.0" y="192.9" width="410.0" height="44.1" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="211.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Призначення:</tspan><tspan x="255.0" dy="13.7">Виконується прямо зараз на машині збірки</tspan></text>
<rect x="50.0" y="247.9" width="410.0" height="44.1" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="266.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Пакетні сутності:</tspan><tspan x="255.0" dy="13.7">tool_requires (інструменти кодогенерації)</tspan></text>
<rect x="50.0" y="302.9" width="410.0" height="44.1" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="321.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Приклади пакетів:</tspan><tspan x="255.0" dy="13.7">protobuf/protoc, cmake, ninja, nasm, gtest runner</tspan></text>
<rect x="560.0" y="75.0" width="450.0" height="350.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/>
<text x="785.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Цільовий контекст (Host Context)</text>
<text x="785.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Параметр: --profile:host (Цільова плата / Архітектура)</text>
<rect x="580.0" y="137.9" width="410.0" height="44.1" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="156.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Налаштування:</tspan><tspan x="785.0" dy="13.7">os=Linux, arch=armv8, compiler=aarch64-linux-gnu-gcc</tspan></text>
<rect x="580.0" y="192.9" width="410.0" height="44.1" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="211.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Призначення:</tspan><tspan x="785.0" dy="13.7">Виконуватиметься на кінцевому цільовому пристрої</tspan></text>
<rect x="580.0" y="247.9" width="410.0" height="44.1" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="266.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Пакетні сутності:</tspan><tspan x="785.0" dy="13.7">requires (бібліотеки, що лінкуються в бінарник)</tspan></text>
<rect x="580.0" y="302.9" width="410.0" height="44.1" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="321.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Приклади пакетів:</tspan><tspan x="785.0" dy="13.7">zlib, openssl, protobuf runtime, fmt, boost</tspan></text>
<line x1="485.0" y1="245.0" x2="555.0" y2="245.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="520.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">protoc</text>
<text x="520.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">код .pb.cc</text>
<rect x="30.0" y="451.8" width="980.0" height="46.5" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="471.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Команда збірки: conan install . --profile:build=default --profile:host=armv8_linux --build=missing</tspan><tspan x="520.0" dy="15.0">Conan 2.x автоматично запускає x86_64 інструменти для генерації коду, а бібліотеки лінкує під ARMv8</tspan></text>
</svg>