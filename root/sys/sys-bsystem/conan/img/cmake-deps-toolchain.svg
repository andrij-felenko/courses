<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтеграція Conan 2.x з CMake через CMakeToolchain та CMakeDeps</text>
<text x="520.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Розділення обов'язків: Conan готує оточення, CMake виконує збірку</text>
<rect x="35.0" y="105.2" width="330.0" height="59.6" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">conanfile.py / conanfile.txt</tspan><tspan x="200.0" dy="14.3">[requires] fmt/10.2.1, zlib/1.3.1</tspan><tspan x="200.0" dy="14.3">[generators] CMakeToolchain, CMakeDeps</tspan></text>
<line x1="200.0" y1="185.0" x2="200.0" y2="235.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="222.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">conan install</text>
<rect x="35.0" y="287.4" width="330.0" height="85.1" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="306.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Згенеровані файли (build/generators/):</tspan><tspan x="200.0" dy="13.7">1. conan_toolchain.cmake (налаштування CXX)</tspan><tspan x="200.0" dy="13.7">2. fmt-config.cmake, fmtTargets.cmake</tspan><tspan x="200.0" dy="13.7">3. ZLIBConfig.cmake, ZLIBTargets.cmake</tspan><tspan x="200.0" dy="13.7">4. CMakePresets.json / CMakeUserPresets.json</tspan></text>
<line x1="370.0" y1="295.0" x2="485.0" y2="185.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="370.0" y1="345.0" x2="485.0" y2="345.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="505.0" y="140.9" width="470.0" height="88.2" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="160.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Чистий CMakeLists.txt (без прив'язки до Conan):</tspan><tspan x="740.0" dy="14.3">find_package(fmt CONFIG REQUIRED)</tspan><tspan x="740.0" dy="14.3">find_package(ZLIB REQUIRED)</tspan><tspan x="740.0" dy="14.3">add_executable(my_app main.cpp)</tspan><tspan x="740.0" dy="14.3">target_link_libraries(my_app PRIVATE fmt::fmt ZLIB::ZLIB)</tspan></text>
<rect x="505.0" y="314.3" width="470.0" height="61.4" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="740.0" y="334.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Команда збірки проекту:</tspan><tspan x="740.0" dy="15.0">cmake --preset conan-release</tspan><tspan x="740.0" dy="15.0">cmake --build --preset conan-release</tspan></text>
<rect x="30.0" y="451.8" width="980.0" height="46.5" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="471.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Головний принцип Conan 2.x: Ніякого макрокоду Conan всередині CMakeLists.txt.</tspan><tspan x="520.0" dy="15.0">Бібліотеки підключаються стандартними імпортованими цілями CMake (Target-based Modern CMake).</tspan></text>
</svg>