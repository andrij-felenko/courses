<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="30.0" width="460.0" height="440.0" rx="6" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="260.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="700">Створення бібліотеки (mylib.dll)</text>
<rect x="50.0" y="85.0" width="420.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="105.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Сирцевий код бібліотеки (.cpp / .h):</tspan><tspan x="260.0" dy="16.2">#define MYLIB_API __declspec(dllexport)</tspan><tspan x="260.0" dy="16.2">MYLIB_API int calculate_sum(int a, int b);</tspan></text>
<line x1="260.0" y1="155.0" x2="260.0" y2="185.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="185.0" width="420.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="203.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Компіляція: cl.exe /c</tspan><tspan x="260.0" dy="16.2">Генерує секцію .drectve в mylib.obj</tspan><tspan x="260.0" dy="16.2">з директивою -export:calculate_sum</tspan></text>
<line x1="260.0" y1="250.0" x2="260.0" y2="280.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="280.0" width="420.0" height="80.0" rx="6" fill="#e0f2fe" stroke="#1d4ed8" stroke-width="1.5"/><text x="260.0" y="300.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Компонування: link.exe /DLL</tspan><tspan x="260.0" dy="15.6">1. Створює mylib.dll (PE-образ з таблицею EAT)</tspan><tspan x="260.0" dy="15.6">2. Генерує mylib.lib (Import Library — бібліотека імпорту)</tspan><tspan x="260.0" dy="15.6">   що містить записи для прив'язки до IAT</tspan></text>
<line x1="260.0" y1="365.0" x2="260.0" y2="395.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="395.0" width="420.0" height="60.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="260.0" y="413.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Артефакти на диску:</tspan><tspan x="260.0" dy="16.2">• mylib.dll (виконуваний код + EAT)</tspan><tspan x="260.0" dy="16.2">• mylib.lib (короткі COFF-заглушки імпорту)</tspan></text>
<rect x="570.0" y="30.0" width="460.0" height="440.0" rx="6" fill="#f8fafc" stroke="#047857" stroke-width="1.5"/>
<text x="800.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#047857" text-anchor="middle" font-weight="700">Споживач бібліотеки (app.exe)</text>
<rect x="590.0" y="85.0" width="420.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="105.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Сирцевий код застосунку (.cpp):</tspan><tspan x="800.0" dy="16.2">#define MYLIB_API __declspec(dllimport)</tspan><tspan x="800.0" dy="16.2">MYLIB_API int calculate_sum(int a, int b);</tspan></text>
<line x1="800.0" y1="155.0" x2="800.0" y2="185.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="590.0" y="185.0" width="420.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="203.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Компіляція з __declspec(dllimport):</tspan><tspan x="800.0" dy="16.2">Генерує пряме непряме звернення:</tspan><tspan x="800.0" dy="16.2">call qword ptr [__imp_calculate_sum]</tspan></text>
<line x1="800.0" y1="250.0" x2="800.0" y2="280.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="590.0" y="280.0" width="420.0" height="80.0" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="800.0" y="300.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Компонування: link.exe app.obj mylib.lib</tspan><tspan x="800.0" dy="15.6">Лінкер бере символ __imp_calculate_sum з mylib.lib</tspan><tspan x="800.0" dy="15.6">і формує таблицю IAT (Import Address Table)</tspan><tspan x="800.0" dy="15.6">у заголовку app.exe</tspan></text>
<line x1="800.0" y1="365.0" x2="800.0" y2="395.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="590.0" y="395.0" width="420.0" height="60.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="800.0" y="413.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Завантаження процесу (NT Loader):</tspan><tspan x="800.0" dy="16.2">Завантажувач кладе адресу функції з mylib.dll</tspan><tspan x="800.0" dy="16.2">безпосередньо у комірку IAT app.exe</tspan></text>
<line x1="470.0" y1="320.0" x2="590.0" y2="320.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="494.3" y="294.5" width="71.4" height="21.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="530.0" y="308.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">mylib.lib</tspan></text>
</svg>