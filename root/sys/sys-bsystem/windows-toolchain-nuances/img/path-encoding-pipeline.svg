<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="25.0" width="940.0" height="110.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="500.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівень коду та компілятора (MSVC cl.exe)</text>
<rect x="50.0" y="65.0" width="420.0" height="55.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="88.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Вихідний текст у UTF-8 без BOM:</tspan><tspan x="260.0" dy="15.6">const char* path = &quot;C:/проєкт/data.txt&quot;;</tspan></text>
<rect x="530.0" y="65.0" width="420.0" height="55.0" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="740.0" y="81.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Прапорець /utf-8:</tspan><tspan x="740.0" dy="15.6">• /source-charset:utf-8 (парсинг коду)</tspan><tspan x="740.0" dy="15.6">• /execution-charset:utf-8 (байти в .rdata)</tspan></text>
<line x1="500.0" y1="135.0" x2="500.0" y2="165.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30.0" y="165.0" width="940.0" height="130.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="500.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівень середовища процесу (PEB / Win32 Subsystem)</text>
<rect x="50.0" y="205.0" width="420.0" height="75.0" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/><text x="260.0" y="224.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Традиційний режим (Legacy ACP):</tspan><tspan x="260.0" dy="15.0">ANSI кодова сторінка (CP1251 / CP1252)</tspan><tspan x="260.0" dy="15.0">Виклики *A конвертують байти через ACP;</tspan><tspan x="260.0" dy="15.0">символи поза сторінкою замінюються на '?'</tspan></text>
<rect x="530.0" y="205.0" width="420.0" height="75.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="740.0" y="224.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Маніфест застосунку (Windows 10 1903+):</tspan><tspan x="740.0" dy="15.0">&lt;activeCodePage&gt;UTF-8&lt;/activeCodePage&gt;</tspan><tspan x="740.0" dy="15.0">Встановлює CP_UTF8 (65001) як системну ACP;</tspan><tspan x="740.0" dy="15.0">функції *A сприймають char* як чесний UTF-8</tspan></text>
<line x1="500.0" y1="295.0" x2="500.0" y2="325.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30.0" y="325.0" width="940.0" height="140.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="500.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівень Win32 API та ядра NT (Filesystem Limits)</text>
<rect x="50.0" y="365.0" width="420.0" height="85.0" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/><text x="260.0" y="389.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Обмеження MAX_PATH (260 символів):</tspan><tspan x="260.0" dy="15.0">CreateFileA / fopen / GetFullPathName</tspan><tspan x="260.0" dy="15.0">Фіксований буфер: char szPath[260];</tspan><tspan x="260.0" dy="15.0">Перевищення → ERROR_PATH_NOT_FOUND (3)</tspan></text>
<rect x="530.0" y="365.0" width="420.0" height="85.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="740.0" y="389.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Розширений префікс \\?\ та UTF-16LE:</tspan><tspan x="740.0" dy="15.0">CreateFileW(L&quot;\\?\\C:\\довгий_шлях...&quot;, ...)</tspan><tspan x="740.0" dy="15.0">Обходить перевірку MAX_PATH та нормалізацію;</tspan><tspan x="740.0" dy="15.0">Ядро NT (NtCreateFile) підтримує 32 767 символів</tspan></text>
</svg>