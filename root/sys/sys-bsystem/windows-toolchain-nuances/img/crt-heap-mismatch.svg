<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="1040.0" height="480.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="540.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Адресний простір одного процесу (Windows Virtual Memory)</text>
<rect x="40.0" y="70.0" width="430.0" height="410.0" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="255.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700">Головний застосунок (app.exe — /MD)</text>
<rect x="60.0" y="115.0" width="390.0" height="45.0" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="255.0" y="133.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Динамічний рантайм: ucrtbase.dll</tspan><tspan x="255.0" dy="16.2">Дескриптор купи: _crtheap_A (HeapCreate)</tspan></text>
<rect x="60.0" y="175.0" width="390.0" height="55.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="198.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Виклик бібліотеки:</tspan><tspan x="255.0" dy="16.2">void* ptr = mylib_get_data();</tspan></text>
<line x1="255.0" y1="235.0" x2="255.0" y2="265.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="265.0" width="390.0" height="60.0" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/><text x="255.0" y="291.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">Спроба звільнення чужої пам'яті:</tspan><tspan x="255.0" dy="16.2">free(ptr);  → HeapFree(_crtheap_A, 0, ptr);</tspan></text>
<line x1="255.0" y1="330.0" x2="255.0" y2="360.0" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="360.0" width="390.0" height="100.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="255.0" y="390.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">Крах процесу: STATUS_HEAP_CORRUPTION (0xC0000374)</tspan><tspan x="255.0" dy="15.6">Менеджер купи NT виявляє, що блок пам'яті ptr</tspan><tspan x="255.0" dy="15.6">не належить дескриптору _crtheap_A або пошкоджено</tspan><tspan x="255.0" dy="15.6">службові метадані сегмента купи.</tspan></text>
<rect x="610.0" y="70.0" width="430.0" height="410.0" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.8"/>
<text x="825.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#047857" text-anchor="middle" font-weight="700">Динамічна бібліотека (plugin.dll — /MT)</text>
<rect x="630.0" y="115.0" width="390.0" height="45.0" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="825.0" y="133.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Статичний рантайм: вшита копія libucrt.lib</tspan><tspan x="825.0" dy="16.2">Дескриптор купи: _crtheap_B (HeapCreate)</tspan></text>
<rect x="630.0" y="175.0" width="390.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="825.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Виділення пам'яті всередині DLL:</tspan><tspan x="825.0" dy="15.6">void* ptr = malloc(1024);</tspan><tspan x="825.0" dy="15.6">→ HeapAlloc(_crtheap_B, 0, 1024);</tspan><tspan x="825.0" dy="15.6">Повертає адресу блоку з Купи B</tspan></text>
<rect x="630.0" y="265.0" width="390.0" height="65.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="825.0" y="286.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Фізичний блок пам'яті [ Купа B ]</tspan><tspan x="825.0" dy="15.6">[ Метадані купи B | Корисні дані 1024 B ]</tspan><tspan x="825.0" dy="15.6">Адреса ptr вказує на цей сегмент</tspan></text>
<line x1="630.0" y1="202.0" x2="450.0" y2="202.0" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="492.4" y="171.5" width="95.2" height="31.0" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/><text x="540.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Передача ptr</tspan></text>
<line x1="450.0" y1="295.0" x2="630.0" y2="295.0" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="4,4"/>
<rect x="487.1" y="292.9" width="105.8" height="34.1" rx="6" fill="#ffffff" stroke="#b91c1c" stroke-width="1.5"/><text x="540.0" y="306.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle"><tspan x="540.0" dy="0.0">Невідповідність:</tspan><tspan x="540.0" dy="13.7">_crtheap_A != B</tspan></text>
</svg>