<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поширення залежностей між компонентами</text>
<text x="500.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поширення залежностей між компонентами: публічні та приватні інтерфейси</text>
<rect x="40.0" y="70.0" width="260.0" height="330.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="170.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Компонент: main</text>
<rect x="55.0" y="120.0" width="230.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Головний код застосунку</tspan><tspan x="170.0" dy="15.6">main.c / main.cpp</tspan><tspan x="170.0" dy="15.6">#include &quot;sensor.h&quot;</tspan></text>
<rect x="55.0" y="210.0" width="230.0" height="80.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="225.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">main/CMakeLists.txt:</tspan><tspan x="170.0" dy="14.3">idf_component_register(</tspan><tspan x="170.0" dy="14.3">  SRCS &quot;main.c&quot;</tspan><tspan x="170.0" dy="14.3">  PRIV_REQUIRES sensor_hub</tspan><tspan x="170.0" dy="14.3">)</tspan></text>
<rect x="55.0" y="315.0" width="230.0" height="65.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="344.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Бачить: sensor.h (публічний)</tspan><tspan x="170.0" dy="14.3">НЕ бачить: i2c_bus.h (приватний)</tspan></text>
<line x1="300.0" y1="250.0" x2="370.0" y2="250.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="335.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">REQUIRES</text>
<rect x="370.0" y="70.0" width="280.0" height="330.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="510.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Компонент: sensor_hub</text>
<rect x="385.0" y="120.0" width="250.0" height="80.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="510.0" y="149.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Публічний інтерфейс:</tspan><tspan x="510.0" dy="15.0">include/sensor.h</tspan><tspan x="510.0" dy="15.0">(експортується усім споживачам)</tspan></text>
<rect x="385.0" y="210.0" width="250.0" height="100.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="229.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">sensor_hub/CMakeLists.txt:</tspan><tspan x="510.0" dy="13.7">idf_component_register(</tspan><tspan x="510.0" dy="13.7">  SRCS &quot;sensor.c&quot;</tspan><tspan x="510.0" dy="13.7">  INCLUDE_DIRS &quot;include&quot;</tspan><tspan x="510.0" dy="13.7">  PRIV_REQUIRES i2c_driver</tspan><tspan x="510.0" dy="13.7">)</tspan></text>
<rect x="385.0" y="325.0" width="250.0" height="55.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="510.0" y="349.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Реалізація sensor.c викликає</tspan><tspan x="510.0" dy="14.3">приватний драйвер i2c_driver</tspan></text>
<line x1="650.0" y1="250.0" x2="710.0" y2="250.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="680.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">PRIV_REQ</text>
<rect x="710.0" y="70.0" width="250.0" height="330.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="835.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Компонент: i2c_driver</text>
<rect x="725.0" y="120.0" width="220.0" height="80.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="835.0" y="149.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">Публічний для sensor_hub:</tspan><tspan x="835.0" dy="15.0">include/i2c_bus.h</tspan><tspan x="835.0" dy="15.0">(робота з регістрами I2C)</tspan></text>
<rect x="725.0" y="210.0" width="220.0" height="85.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="835.0" y="222.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">i2c_driver/CMakeLists.txt:</tspan><tspan x="835.0" dy="13.7">idf_component_register(</tspan><tspan x="835.0" dy="13.7">  SRCS &quot;i2c_bus.c&quot;</tspan><tspan x="835.0" dy="13.7">  INCLUDE_DIRS &quot;include&quot;</tspan><tspan x="835.0" dy="13.7">  REQUIRES driver</tspan><tspan x="835.0" dy="13.7">)</tspan></text>
<rect x="725.0" y="315.0" width="220.0" height="65.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="835.0" y="337.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">Ізольований від main:</tspan><tspan x="835.0" dy="14.3">зміна i2c_driver не викликає</tspan><tspan x="835.0" dy="14.3">перекомпіляції main.c</tspan></text>
</svg>