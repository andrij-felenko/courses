<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізична розкладка SPI Flash та послідовність завантаження</text>
<text x="520.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізична розкладка SPI Flash у ESP32 та послідовність завантаження</text>
<rect x="30.0" y="70.0" width="90.0" height="90.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.8"/>
<text x="75.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">ROM / Header</text>
<text x="75.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Вектори скидання</text>
<text x="35.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="start">0x0000</text>
<rect x="125.0" y="70.0" width="135.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="192.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">2nd Bootloader</text>
<text x="192.5" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">bootloader.bin (~28 КБ)</text>
<text x="130.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="start">0x1000</text>
<rect x="265.0" y="70.0" width="110.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="320.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Partition Table</text>
<text x="320.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">partitions.bin (4 КБ)</text>
<text x="270.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="start">0x8000</text>
<rect x="380.0" y="70.0" width="100.0" height="90.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.8"/>
<text x="430.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">NVS (Data)</text>
<text x="430.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Енергонезалежна (16 КБ)</text>
<text x="385.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="start">0x9000</text>
<rect x="485.0" y="70.0" width="90.0" height="90.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.8"/>
<text x="530.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">otadata</text>
<text x="530.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Вибір OTA (8 КБ)</text>
<text x="490.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="start">0xD000</text>
<rect x="580.0" y="70.0" width="200.0" height="90.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="680.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Factory / OTA_0 (App)</text>
<text x="680.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Головна прошивка app.bin (1 МБ)</text>
<text x="585.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="start">0x10000</text>
<rect x="785.0" y="70.0" width="220.0" height="90.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/>
<text x="895.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">OTA_1 (App)</text>
<text x="895.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Резервний розділ OTA (1 МБ)</text>
<text x="790.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="start">0x110000</text>
<text x="1005.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="end">0x400000 (4 МБ)</text>
<rect x="20.0" y="210.0" width="1000.0" height="220.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="520.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хронологічний ланцюг виконання коду при старті мікроконтролера</text>
<rect x="35.0" y="255.0" width="220.0" height="155.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.6"/>
<text x="145.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">1. ROM Bootloader</text>
<text x="145.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Зашитий у кремній.</tspan><tspan x="145.0" dy="14.9">Перевіряє strapping-піни,</tspan><tspan x="145.0" dy="14.9">ініціалізує базовий SPI,</tspan><tspan x="145.0" dy="14.9">зчитує 0x1000 у IRAM</tspan></text>
<rect x="285.0" y="255.0" width="220.0" height="155.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="395.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2. 2nd Stage Bootloader</text>
<text x="395.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">Виконується з IRAM.</tspan><tspan x="395.0" dy="14.9">Читає таблицю 0x8000,</tspan><tspan x="395.0" dy="14.9">зчитує otadata (0xD000),</tspan><tspan x="395.0" dy="14.9">перевіряє хеш SHA256 образу</tspan></text>
<rect x="535.0" y="255.0" width="220.0" height="155.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="645.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">3. Ініціалізація MMU Flash</text>
<text x="645.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">Налаштовує кеш-сторінки MMU</tspan><tspan x="645.0" dy="14.9">для виконання інструкцій (XIP)</tspan><tspan x="645.0" dy="14.9">безпосередньо з NOR Flash</tspan></text>
<rect x="785.0" y="255.0" width="220.0" height="155.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="895.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">4. Application (app_main)</text>
<text x="895.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">Запуск FreeRTOS планувальника,</tspan><tspan x="895.0" dy="14.9">ініціалізація периферії,</tspan><tspan x="895.0" dy="14.9">виклик користувацького коду</tspan></text>
<line x1="257.0" y1="332.0" x2="283.0" y2="332.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="507.0" y1="332.0" x2="533.0" y2="332.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="757.0" y1="332.0" x2="783.0" y2="332.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>