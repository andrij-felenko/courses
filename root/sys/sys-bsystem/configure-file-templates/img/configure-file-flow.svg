<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потік трансформації шаблону configure_file у заголовок збірки</text>
<text x="240.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дерево джерел (лише читання)</text>
<text x="800.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Каталог збірки (згенеровані файли)</text>
<rect x="50.0" y="95.7" width="380.0" height="68.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="117.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">CMAKE_CURRENT_SOURCE_DIR</tspan><tspan x="240.0" dy="17.6">  config.h.in (шаблон з @VAR@)</tspan><tspan x="240.0" dy="17.6">  CMakeLists.txt (змінні збірки)</tspan></text>
<rect x="290.0" y="215.7" width="460.0" height="68.6" rx="6" fill="#eaf2fb" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="237.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">configure_file(config.h.in include/app/config.h @ONLY)</tspan><tspan x="520.0" dy="17.6">Виконується на фазі конфігурації (Configure Time)</tspan><tspan x="520.0" dy="17.6">Підстановка значень: @APP_VERSION@ -&gt; &quot;2.4.1&quot;</tspan></text>
<line x1="240.0" y1="180.0" x2="420.0" y2="220.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="290.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">вхідний шаблон</text>
<rect x="620.0" y="95.7" width="360.0" height="68.6" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="117.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">CMAKE_CURRENT_BINARY_DIR</tspan><tspan x="800.0" dy="17.6">  include/app/config.h</tspan><tspan x="800.0" dy="17.6">  (готовий заголовок C/C++)</tspan></text>
<line x1="620.0" y1="220.0" x2="780.0" y2="180.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="710.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">запис результату</text>
<rect x="286.8" y="346.9" width="466.3" height="86.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="368.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">target_include_directories(app PUBLIC</tspan><tspan x="520.0" dy="17.6">    $&lt;BUILD_INTERFACE:${CMAKE_CURRENT_BINARY_DIR}/include&gt;</tspan><tspan x="520.0" dy="17.6">)</tspan><tspan x="520.0" dy="17.6">Компілятор бачить #include &lt;app/config.h&gt;</tspan></text>
<line x1="800.0" y1="180.0" x2="680.0" y2="350.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="520.0" y1="305.0" x2="520.0" y2="345.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="470.0" width="920.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="497.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Дерево джерел лишається недоторканним (чистий репозиторій);</tspan><tspan x="520.0" dy="17.6">згенеровані заголовки потрапляють у каталог збірки та ізолюються за префіксом простору імен</tspan></text>
</svg>