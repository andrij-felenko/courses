<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Забруднення простору каталогу проти інкапсуляції цілей</text>
<text x="270.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">CMake 2.8: Глобальний стан каталогу</text>
<text x="810.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Modern CMake: Інкапсуляція цілей</text>
<rect x="50.0" y="75.0" width="440.0" height="370.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="270.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кореневий CMakeLists.txt</text>
<text x="270.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">include_directories(/opt/crypto/include)</text>
<text x="270.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">add_definitions(-DENABLE_OPENSSL)</text>
<line x1="270.0" y1="160.0" x2="270.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="270.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">add_subdirectory(lib) &amp; (app) &amp; (tests)</text>
<rect x="68.1" y="212.5" width="183.9" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="233.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">src/lib</tspan><tspan x="160.0" dy="16.2">Бачить /opt/crypto</tspan><tspan x="160.0" dy="16.2">Бачить -DENABLE_OPENSSL</tspan></text>
<rect x="295.2" y="212.5" width="169.6" height="65.0" rx="6" fill="#fff3cd" stroke="#e67e22" stroke-width="1.5"/><text x="380.0" y="233.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">tests/unit</tspan><tspan x="380.0" dy="16.2">Випадково бачить чужі</tspan><tspan x="380.0" dy="16.2">внутрішні заголовки!</tspan></text>
<rect x="70.0" y="320.0" width="400.0" height="105.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="353.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Властивості каталогу протікають у всі підкаталоги:</tspan><tspan x="270.0" dy="15.6">• Неможливо розмежувати внутрішні та публічні заголовки</tspan><tspan x="270.0" dy="15.6">• Колізії імен файлів (наприклад, config.h або utils.h)</tspan><tspan x="270.0" dy="15.6">• Непотрібні прапорці дістаються юніт-тестам</tspan></text>
<rect x="590.0" y="75.0" width="440.0" height="370.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/>
<text x="810.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ціль crypto_lib (add_library)</text>
<rect x="696.7" y="134.4" width="226.6" height="81.2" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Властивості цілі crypto_lib</tspan><tspan x="810.0" dy="16.2">• PRIVATE: src/internal_aes.h</tspan><tspan x="810.0" dy="16.2">• PUBLIC: include/crypto.h</tspan><tspan x="810.0" dy="16.2">• INTERFACE: -DUSE_CRYPTO_API</tspan></text>
<line x1="810.0" y1="240.0" x2="810.0" y2="280.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="810.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">target_link_libraries(app PRIVATE crypto_lib)</text>
<rect x="643.2" y="304.4" width="333.5" height="81.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="810.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Ціль app (add_executable)</tspan><tspan x="810.0" dy="16.2">• Отримує ЛИШЕ PUBLIC та INTERFACE вимоги</tspan><tspan x="810.0" dy="16.2">• Внутрішні шляхи src/lib ізольовані від app</tspan><tspan x="810.0" dy="16.2">• Тести мають чистий контекст без витоків</tspan></text>
<rect x="50.0" y="465.0" width="980.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="486.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Директиви каталогу діють за місцем у файловому дереві й забруднюють дочірні папки.</tspan><tspan x="540.0" dy="17.6">Цільові команди (target_*) прив'язують вимоги до конкретного артефакту й поширюють</tspan><tspan x="540.0" dy="17.6">виключно публічний інтерфейс через граф лінкування.</tspan></text>
</svg>