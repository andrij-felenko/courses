<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">In-source збірка проти Out-of-source розділення</text>
<text x="270.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Антипатерн: In-source збірка (cmake .)</text>
<text x="810.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Modern CMake: Out-of-source (cmake -B build)</text>
<rect x="50.0" y="75.0" width="440.0" height="360.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="270.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Каталог сирців проєкту (src_dir/)</text>
<rect x="99.7" y="140.0" width="340.6" height="130.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="160.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">├── CMakeLists.txt</tspan><tspan x="270.0" dy="16.2">├── main.cpp, util.cpp, include/...</tspan><tspan x="270.0" dy="16.2">├── CMakeCache.txt           [ЗГЕНЕРОВАНО]</tspan><tspan x="270.0" dy="16.2">├── CMakeFiles/               [СМІТТЯ]</tspan><tspan x="270.0" dy="16.2">├── Makefile / build.ninja    [АРТЕФАКТ]</tspan><tspan x="270.0" dy="16.2">├── main.o, util.o           [ОБ'ЄКТНІ ФАЙЛИ]</tspan><tspan x="270.0" dy="16.2">└── libengine.so             [БІНАРНИК]</tspan></text>
<rect x="65.0" y="305.0" width="410.0" height="115.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="335.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Наслідки in-source збірки:</tspan><tspan x="270.0" dy="15.6">• git status виводить десятки тимчасових файлів</tspan><tspan x="270.0" dy="15.6">• Неможливо паралельно тримати Debug та Release</tspan><tspan x="270.0" dy="15.6">• Повне очищення вимагає видалення невідстежуваних файлів</tspan><tspan x="270.0" dy="15.6">• Кеш CMakeCache.txt заважає повторній конфігурації</tspan></text>
<rect x="590.0" y="75.0" width="440.0" height="360.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/>
<text x="810.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повне розділення дерева сирців і бінарників</text>
<rect x="668.2" y="134.4" width="283.6" height="81.2" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Каталог сирців (лише вихідний код):</tspan><tspan x="810.0" dy="16.2">├── CMakeLists.txt</tspan><tspan x="810.0" dy="16.2">├── src/ (main.cpp, util.cpp)</tspan><tspan x="810.0" dy="16.2">└── include/ (чистий репозиторій Git)</tspan></text>
<line x1="810.0" y1="235.0" x2="810.0" y2="275.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="810.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">cmake -B build/debug -DCMAKE_BUILD_TYPE=Debug</text>
<rect x="625.4" y="304.4" width="369.1" height="81.2" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Каталоги збірки (build/debug/, build/release/):</tspan><tspan x="810.0" dy="16.2">• Усі артефакти та CMakeCache ізольовані в build/</tspan><tspan x="810.0" dy="16.2">• Очищення: rm -rf build/</tspan><tspan x="810.0" dy="16.2">• Дерево сирців лишається недоторканим</tspan></text>
<rect x="50.0" y="460.0" width="980.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="481.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Збирання всередині сирців засмічує дерево джерел генерованими файлами та руйнує робочу копію Git.</tspan><tspan x="540.0" dy="17.6">Modern CMake вимагає суворого out-of-source розділення через прапорець -B,</tspan><tspan x="540.0" dy="17.6">дозволяючи мати кілька незалежних конфігурацій збірки поруч.</tspan></text>
</svg>