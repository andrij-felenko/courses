<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сліпота генератора збірки до нових файлів при використанні GLOB</text>
<text x="260.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фаза 1: Конфігурація (cmake -B build)</text>
<text x="820.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фаза 2: Додано файл і збірка (ninja)</text>
<rect x="173.1" y="75.7" width="173.9" height="68.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="97.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Файлова система src/</tspan><tspan x="260.0" dy="17.6">├── a.cpp</tspan><tspan x="260.0" dy="17.6">└── b.cpp</tspan></text>
<line x1="260.0" y1="150.0" x2="260.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="285.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">file(GLOB SRC src/*.cpp)</text>
<rect x="150.0" y="210.7" width="220.1" height="68.6" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.5"/><text x="260.0" y="232.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">CMakeLists.txt</tspan><tspan x="260.0" dy="17.6">set(SRC a.cpp b.cpp)</tspan><tspan x="260.0" dy="17.6">add_executable(app ${SRC})</tspan></text>
<line x1="260.0" y1="298.0" x2="260.0" y2="345.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="285.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Генерація графу</text>
<rect x="150.0" y="351.9" width="220.1" height="86.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="373.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">build.ninja (або Makefile)</tspan><tspan x="260.0" dy="17.6">Правило для a.cpp.o</tspan><tspan x="260.0" dy="17.6">Правило для b.cpp.o</tspan><tspan x="260.0" dy="17.6">Лінкування app &lt;- a.o b.o</tspan></text>
<rect x="713.8" y="66.9" width="212.4" height="86.2" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="88.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Файлова система src/</tspan><tspan x="820.0" dy="17.6">├── a.cpp</tspan><tspan x="820.0" dy="17.6">├── b.cpp</tspan><tspan x="820.0" dy="17.6">└── c.cpp   (новий файл!)</tspan></text>
<line x1="820.0" y1="160.0" x2="820.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="845.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Запуск команди ninja</text>
<rect x="652.3" y="231.9" width="335.5" height="86.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="820.0" y="253.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">build.ninja перевіряє часові мітки:</tspan><tspan x="820.0" dy="17.6">• CMakeLists.txt НЕ змінено</tspan><tspan x="820.0" dy="17.6">• Залежності від вмісту каталогу НЕМАЄ</tspan><tspan x="820.0" dy="17.6">-&gt; Повторна конфігурація НЕ викликається!</tspan></text>
<line x1="820.0" y1="340.0" x2="820.0" y2="385.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="671.5" y="385.7" width="297.0" height="68.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="820.0" y="407.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Збірка виконує старий граф:</tspan><tspan x="820.0" dy="17.6">c.cpp НЕ компілюється взагалі</tspan><tspan x="820.0" dy="17.6">Помилка лінкера: undefined reference</tspan></text>
<rect x="60.0" y="480.0" width="960.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="501.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">file(GLOB) обчислюється один раз під час конфігурації.</tspan><tspan x="540.0" dy="17.6">Генератор збірки (Ninja/Make) не відстежує появу нових файлів на диску,</tspan><tspan x="540.0" dy="17.6">якщо сам CMakeLists.txt не змінював мітку часу.</tspan></text>
</svg>