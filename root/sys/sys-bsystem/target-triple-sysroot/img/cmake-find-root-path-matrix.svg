<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Політики маршрутизації пошуку в CMake: CMAKE_FIND_ROOT_PATH_MODE_*</text>
<text x="530.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Політики маршрутизації пошуку в CMake: CMAKE_FIND_ROOT_PATH_MODE_*</text>
<rect x="60.6" y="120.6" width="238.9" height="78.8" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="140.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">find_program(PROTOC protoc)</tspan><tspan x="180.0" dy="15.6">find_program(PYTHON python3)</tspan><tspan x="180.0" dy="15.6">Ціль: інструменти генерації коду</tspan><tspan x="180.0" dy="15.6">Мусять запускатися на хості!</tspan></text>
<rect x="33.2" y="340.6" width="293.6" height="78.8" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="360.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">find_path(OPENSSL_INCLUDE openssl/ssl.h)</tspan><tspan x="180.0" dy="15.6">find_library(OPENSSL_LIB ssl)</tspan><tspan x="180.0" dy="15.6">find_package(ZLIB REQUIRED)</tspan><tspan x="180.0" dy="15.6">Ціль: заголовки й бібліотеки лінкування</tspan></text>
<rect x="349.6" y="121.8" width="360.9" height="76.4" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="141.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">CMAKE_FIND_ROOT_PATH_MODE_PROGRAM = NEVER</tspan><tspan x="530.0" dy="15.0">• Ігнорує CMAKE_SYSROOT та CMAKE_FIND_ROOT_PATH</tspan><tspan x="530.0" dy="15.0">• Шукає виключно в хостових /usr/bin, /usr/local/bin</tspan><tspan x="530.0" dy="15.0">• Результат: виконуваний x86_64 бінарник на хості</tspan></text>
<rect x="356.1" y="334.4" width="347.8" height="91.3" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="354.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">CMAKE_FIND_ROOT_PATH_MODE_INCLUDE = ONLY</tspan><tspan x="530.0" dy="15.0">CMAKE_FIND_ROOT_PATH_MODE_LIBRARY = ONLY</tspan><tspan x="530.0" dy="15.0">CMAKE_FIND_ROOT_PATH_MODE_PACKAGE = ONLY</tspan><tspan x="530.0" dy="15.0">• Додає CMAKE_SYSROOT префікс до кожного шляху</tspan><tspan x="530.0" dy="15.0">• Повністю блокує хостові /usr/include та /usr/lib</tspan></text>
<line x1="310.0" y1="160.0" x2="360.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="310.0" y1="380.0" x2="360.0" y2="380.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="160.0" x2="750.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="380.0" x2="750.0" y2="380.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="799.6" y="121.8" width="170.8" height="76.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="885.0" y="141.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">Хостовий бінарник</tspan><tspan x="885.0" dy="15.0">/usr/bin/protoc</tspan><tspan x="885.0" dy="15.0">Архітектура: x86_64</tspan><tspan x="885.0" dy="15.0">Виконується генератором</tspan></text>
<rect x="776.7" y="341.8" width="216.6" height="76.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="885.0" y="361.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">Цільові артефакти</tspan><tspan x="885.0" dy="15.0">${SYSROOT}/usr/include/openssl</tspan><tspan x="885.0" dy="15.0">${SYSROOT}/usr/lib/libssl.so</tspan><tspan x="885.0" dy="15.0">Архітектура: AArch64</tspan></text>
<rect x="172.6" y="471.8" width="714.8" height="46.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="491.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Небезпека режиму BOTH: якщо бібліотека відсутня в sysroot, CMake тихо підхопить хостову x86_64 бібліотеку,</tspan><tspan x="530.0" dy="15.0">що спричинить збій на стадії компонування. Для цільових залежностей завжди використовуйте режим ONLY!</tspan></text>
</svg>