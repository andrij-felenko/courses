<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Концепція Sysroot: ізоляція цільових заголовків та бібліотек від хоста</text>
<text x="530.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Концепція Sysroot: ізоляція цільових заголовків та бібліотек від хоста</text>
<rect x="76.9" y="70.0" width="326.3" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Хостова файлова система (/)</tspan><tspan x="240.0" dy="16.9">Архітектура комп'ютера збірки (x86_64)</tspan></text>
<rect x="118.6" y="176.8" width="242.9" height="76.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="196.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">/usr/include</tspan><tspan x="240.0" dy="15.0">• Заголовки хостового glibc 2.38</tspan><tspan x="240.0" dy="15.0">• x86_64 системні типи та макроси</tspan><tspan x="240.0" dy="15.0">• struct stat з 64-бітними зсувами</tspan></text>
<rect x="115.3" y="316.8" width="249.4" height="76.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="336.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">/usr/lib / /lib</tspan><tspan x="240.0" dy="15.0">• x86_64 ELF динамічні бібліотеки</tspan><tspan x="240.0" dy="15.0">• libc.so.6, libm.so.6 (x86_64 ABI)</tspan><tspan x="240.0" dy="15.0">• Несумісні з цільовим процесором!</tspan></text>
<rect x="386.6" y="237.8" width="286.8" height="94.4" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="530.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Крос-компілятор / Лінкер</tspan><tspan x="530.0" dy="15.6">Прапорець: --sysroot=/opt/sysroot-arm64</tspan><tspan x="530.0" dy="15.6">Перенаправляє абсолютні системні</tspan><tspan x="530.0" dy="15.6">шляхи /usr/include та /usr/lib</tspan><tspan x="530.0" dy="15.6">усередину ізольованого каталогу</tspan></text>
<line x1="400.0" y1="285.0" x2="335.0" y2="285.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="370.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">блокує</text>
<line x1="660.0" y1="285.0" x2="725.0" y2="285.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="690.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">дозволяє</text>
<rect x="648.8" y="70.0" width="342.4" height="49.9" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">Цільовий Sysroot (/opt/sysroot-arm64)</tspan><tspan x="820.0" dy="16.9">Архітектура цільового пристрою (AArch64)</tspan></text>
<rect x="678.9" y="176.8" width="282.2" height="76.4" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="196.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">/opt/sysroot-arm64/usr/include</tspan><tspan x="820.0" dy="15.0">• Заголовки цільової системи (ARM64)</tspan><tspan x="820.0" dy="15.0">• Відповідають цільовому ядру та libc</tspan><tspan x="820.0" dy="15.0">• Коректні типи time_t, розкладки struct</tspan></text>
<rect x="678.9" y="316.8" width="282.2" height="76.4" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="336.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">/opt/sysroot-arm64/usr/lib</tspan><tspan x="820.0" dy="15.0">• AArch64 ELF бібліотеки</tspan><tspan x="820.0" dy="15.0">• libc.so.6, libpthread.so (AArch64 ABI)</tspan><tspan x="820.0" dy="15.0">• Відносні symlink: libz.so -&gt; libz.so.1</tspan></text>
<rect x="149.6" y="456.8" width="760.7" height="46.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="476.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Пастка абсолютних symlink: посилання libfoo.so -&gt; /lib/libfoo.so.1 усередині sysroot втече на хост!</tspan><tspan x="530.0" dy="15.0">Рішення: санація посилань у відносні (relative: libfoo.so -&gt; ../../lib/libfoo.so.1) або використання ld --sysroot</tspan></text>
</svg>