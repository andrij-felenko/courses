<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія та декомпозиція цільового кортежу (Target Triple)</text>
<text x="530.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія та декомпозиція цільового кортежу (Target Triple)</text>
<rect x="40.6" y="40.6" width="238.9" height="78.8" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="60.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">1. Архітектура (arch)</tspan><tspan x="160.0" dy="15.6">ISA, розрядність, порядок байтів</tspan><tspan x="160.0" dy="15.6">Приклади: x86_64, aarch64,</tspan><tspan x="160.0" dy="15.6">armv7-a, riscv64, thumbv7em</tspan></text>
<rect x="306.1" y="40.6" width="197.8" height="78.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="405.0" y="60.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">2. Виробник (vendor)</tspan><tspan x="405.0" dy="15.6">Організація / постачальник</tspan><tspan x="405.0" dy="15.6">Приклади: unknown, none,</tspan><tspan x="405.0" dy="15.6">pc, w64, apple, poky</tspan></text>
<rect x="525.3" y="40.6" width="259.4" height="78.8" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="655.0" y="60.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">3. Операційна система (os)</tspan><tspan x="655.0" dy="15.6">Ядро або системне середовище</tspan><tspan x="655.0" dy="15.6">Приклади: linux, none (bare-metal),</tspan><tspan x="655.0" dy="15.6">windows, darwin, android</tspan></text>
<rect x="761.6" y="40.6" width="286.8" height="78.8" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="905.0" y="60.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="905.0" dy="0.0">4. Двійковий інтерфейс (abi/libc)</tspan><tspan x="905.0" dy="15.6">Конвенція викликів, плаваюча кома, libc</tspan><tspan x="905.0" dy="15.6">Приклади: gnu (glibc), musl,</tspan><tspan x="905.0" dy="15.6">eabi, gnueabihf, msvc, android</tspan></text>
<text x="275.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">—</text>
<text x="530.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">—</text>
<text x="780.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">—</text>
<line x1="40.0" y1="140.0" x2="1020.0" y2="140.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="530.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Типові канонічні кортежі та їхній вплив на кодогенерацію</text>
<rect x="89.6" y="191.9" width="360.9" height="106.2" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">aarch64-unknown-linux-gnu</tspan><tspan x="270.0" dy="15.0">• arch: 64-бітний ARMv8-A Little-Endian</tspan><tspan x="270.0" dy="15.0">• vendor: unknown (універсальний дистрибутив)</tspan><tspan x="270.0" dy="15.0">• os: Linux (системні виклики через svc)</tspan><tspan x="270.0" dy="15.0">• abi: GNU EABI64 з бібліотекою GNU C (glibc)</tspan><tspan x="270.0" dy="15.0">Ціль: Сервери та SBC (Raspberry Pi 4, Ubuntu/Debian)</tspan></text>
<rect x="622.7" y="191.9" width="334.6" height="106.2" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="790.0" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">arm-none-eabi</tspan><tspan x="790.0" dy="15.0">• arch: 32-бітний ARM (Cortex-M / Cortex-R)</tspan><tspan x="790.0" dy="15.0">• vendor: none (немає прив'язки до вендора)</tspan><tspan x="790.0" dy="15.0">• os: none (Bare-metal, автономна прошивка)</tspan><tspan x="790.0" dy="15.0">• abi: ARM EABI (Newlib/Picolibc, софтварна FPU)</tspan><tspan x="790.0" dy="15.0">Ціль: Мікроконтролери STM32, NXP, RP2040</tspan></text>
<rect x="89.6" y="341.9" width="360.9" height="106.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="361.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">arm-linux-gnueabihf</tspan><tspan x="270.0" dy="15.0">• arch: 32-бітний ARMv7-A</tspan><tspan x="270.0" dy="15.0">• os: Linux</tspan><tspan x="270.0" dy="15.0">• abi: GNU EABI + Hard-Float (hf)</tspan><tspan x="270.0" dy="15.0">Регістри: апаратні VFP/NEON для аргументів float</tspan><tspan x="270.0" dy="15.0">Несумісний бінарно з arm-linux-gnueabi (Soft-Float)!</tspan></text>
<rect x="606.3" y="341.9" width="367.4" height="106.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="361.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">x86_64-w64-mingw32</tspan><tspan x="790.0" dy="15.0">• arch: 64-бітний x86-64 (AMD64)</tspan><tspan x="790.0" dy="15.0">• vendor: w64 (проєкт MinGW-w64)</tspan><tspan x="790.0" dy="15.0">• os: Windows (Win32/Win64 API, підсистема PE/COFF)</tspan><tspan x="790.0" dy="15.0">• abi: Microsoft x64 calling convention (MSVCRT/UCRT)</tspan><tspan x="790.0" dy="15.0">Ціль: Крос-компіляція Windows .exe/.dll з-під Linux</tspan></text>
<rect x="246.4" y="481.2" width="567.2" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="501.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Тулчейн формує префікс команд: &lt;triple&gt;-gcc, &lt;triple&gt;-ld, &lt;triple&gt;-objcopy (GCC)</tspan><tspan x="530.0" dy="15.6">або передається єдиному компілятору через прапорець clang --target=&lt;triple&gt;</tspan></text>
</svg>