<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двофазна модель GNU Make: зчитування проти виконання</text>
<rect x="40.0" y="50.0" width="430.0" height="420.0" rx="8" fill="#f0f5ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="255.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Фаза 1: Зчитування та розбір (Read Phase)</text>
<rect x="55.0" y="110.0" width="400.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="255.0" y="135.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">1. Порядкове читання Makefile та include</tspan></text>
<rect x="55.0" y="164.0" width="400.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="255.0" y="189.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">2. Негайне розгортання змінних (:=, ::=)</tspan></text>
<rect x="55.0" y="218.0" width="400.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="255.0" y="243.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">3. Виконання директив ifeq/ifdef/include</tspan></text>
<rect x="55.0" y="272.0" width="400.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="255.0" y="297.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">4. Виконання команд оболонки $(shell ...)</tspan></text>
<rect x="55.0" y="326.0" width="400.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="255.0" y="351.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">5. Побудова графа залежностей (DAG) у пам'яті</tspan></text>
<rect x="55.0" y="380.0" width="400.0" height="42.0" rx="6" fill="#fff6f5" stroke="#c0392b" stroke-width="1.5"/><text x="255.0" y="405.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">6. Відкладені змінні (=) і рецепти НЕ обчислюються</tspan></text>
<line x1="475.0" y1="260.0" x2="545.0" y2="260.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="510.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">DAG готовий</text>
<rect x="550.0" y="50.0" width="430.0" height="420.0" rx="8" fill="#f4faf5" stroke="#27ae60" stroke-width="2.0"/>
<text x="765.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Фаза 2: Виконання та оновлення (Execute Phase)</text>
<rect x="565.0" y="110.0" width="400.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="765.0" y="135.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">1. Вибір цілі (перша явна або передана в CLI)</tspan></text>
<rect x="565.0" y="164.0" width="400.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="765.0" y="189.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">2. Топологічний обхід графа залежностей (DFS)</tspan></text>
<rect x="565.0" y="218.0" width="400.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="765.0" y="243.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">3. Порівняння міток часу: mtime(prereq) &gt; mtime(target)</tspan></text>
<rect x="565.0" y="272.0" width="400.0" height="42.0" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="1.5"/><text x="765.0" y="297.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">4. Якщо ціль застаріла: розгортання рядків рецепта</tspan></text>
<rect x="565.0" y="326.0" width="400.0" height="42.0" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="1.5"/><text x="765.0" y="351.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">5. Обчислення автоматичних змінних ($@, $&lt;, $^, $*)</tspan></text>
<rect x="565.0" y="380.0" width="400.0" height="42.0" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="1.5"/><text x="765.0" y="405.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">6. Запуск команд окремими підпроцесами sh -c</tspan></text>
<text x="510.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Makefile не виконується лінійно зверху вниз: спершу повністю будується граф, а вже потім запускаються рецепти</text>
</svg>