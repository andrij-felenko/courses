<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рекурсивний Make проти цілісного графа залежностей</text>
<rect x="40.0" y="50.0" width="450.0" height="420.0" rx="8" fill="#fff7f7" stroke="#c0392b" stroke-width="2.0"/>
<text x="265.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Рекурсивний Make (make -C)</text>
<rect x="60.0" y="105.0" width="410.0" height="40.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="265.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">Головний Makefile (ізольований DAG 1)</tspan></text>
<line x1="180.0" y1="150.0" x2="180.0" y2="185.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="130.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">make -C lib</text>
<line x1="350.0" y1="150.0" x2="350.0" y2="185.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">make -C app</text>
<rect x="60.0" y="190.0" width="195.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="157.5" y="208.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="157.5" dy="0.0">lib/Makefile</tspan><tspan x="157.5" dy="15.6">(ізольований DAG 2)</tspan><tspan x="157.5" dy="15.6">будує libfoo.a</tspan></text>
<rect x="275.0" y="190.0" width="195.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="372.5" y="208.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="372.5" dy="0.0">app/Makefile</tspan><tspan x="372.5" dy="15.6">(ізольований DAG 3)</tspan><tspan x="372.5" dy="15.6">будує app.o</tspan></text>
<rect x="60.0" y="270.0" width="410.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="265.0" y="292.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">✖ Граф розірвано на незалежні шматки</tspan></text>
<rect x="60.0" y="314.0" width="410.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="265.0" y="336.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">✖ Неможливо відстежити зміни між підкаталогами</tspan></text>
<rect x="60.0" y="358.0" width="410.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="265.0" y="380.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">✖ Помилки порядку збірки та дублювання роботи</tspan></text>
<rect x="60.0" y="402.0" width="410.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="265.0" y="424.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">✖ Неповний паралелізм (-jN не бачить всю картину)</tspan></text>
<rect x="550.0" y="50.0" width="450.0" height="420.0" rx="8" fill="#f4faf5" stroke="#27ae60" stroke-width="2.0"/>
<text x="775.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Нерекурсивний Make (Єдиний DAG)</text>
<rect x="570.0" y="105.0" width="410.0" height="40.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">Головний Makefile (включає module.mk)</tspan></text>
<rect x="570.0" y="160.0" width="410.0" height="85.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="191.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">Єдиний зв'язний граф залежностей:</tspan><tspan x="775.0" dy="15.6">app : bin/app ← obj/app.o ← src/app.c</tspan><tspan x="775.0" dy="15.6">      bin/app ← lib/libfoo.a ← obj/foo.o ← lib/foo.c</tspan></text>
<rect x="570.0" y="270.0" width="410.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="292.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">✓ Точний глобальний топологічний порядок</tspan></text>
<rect x="570.0" y="314.0" width="410.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="336.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">✓ Зміна lib/foo.h миттєво перезбирає і libfoo, і app</tspan></text>
<rect x="570.0" y="358.0" width="410.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="380.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">✓ Ідеальне завантаження процесорних ядер (-jN)</tspan></text>
<rect x="570.0" y="402.0" width="410.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="424.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">✓ Жодного зайвого виклику процесів make</tspan></text>
<text x="520.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Розбиття Make на підпроцеси робить збірку сліпою до міжмодульних залежностей</text>
</svg>