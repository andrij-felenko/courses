<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конфлікт ODR та стану RTTI при використанні libc++_static у кількох .so</text>
<text x="520.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конфлікт ODR та стану RTTI при використанні libc++_static у кількох .so</text>
<text x="260.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">НЕБЕЗПЕЧНО: libc++_static у кількох модулях</text>
<rect x="18.4" y="115.9" width="233.2" height="88.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="135.0" y="135.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">libcore.so</tspan><tspan x="135.0" dy="14.3">Вшито копію STL #1:</tspan><tspan x="135.0" dy="14.3">• Власний стан iostreams</tspan><tspan x="135.0" dy="14.3">• typeinfo(std::runtime_error) [A]</tspan><tspan x="135.0" dy="14.3">• throw std::runtime_error()</tspan></text>
<rect x="268.4" y="115.9" width="233.2" height="88.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="385.0" y="135.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">libplugin.so</tspan><tspan x="385.0" dy="14.3">Вшито копію STL #2:</tspan><tspan x="385.0" dy="14.3">• Власний стан iostreams</tspan><tspan x="385.0" dy="14.3">• typeinfo(std::runtime_error) [B]</tspan><tspan x="385.0" dy="14.3">• catch (const std::exception&amp;)</tspan></text>
<line x1="240.0" y1="160.0" x2="275.0" y2="160.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="260.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">throw</text>
<rect x="43.5" y="314.4" width="433.0" height="91.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="334.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">НАСЛІДКИ ПОДВІЙНОГО СТАТИЧНОГО РАНТАЙМУ:</tspan><tspan x="260.0" dy="15.0">1. Збій RTTI: Адреса typeinfo [A] != typeinfo [B]</tspan><tspan x="260.0" dy="15.0">   catch не впізнає тип винятку -&gt; виклик std::terminate()</tspan><tspan x="260.0" dy="15.0">2. Порушення ODR: дублювання статичних буферів та пулів пам'яті</tspan><tspan x="260.0" dy="15.0">3. Збільшення розміру кожного .so на вагу коду STL</tspan></text>
<line x1="260.0" y1="235.0" x2="260.0" y2="290.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="520.0" y1="55.0" x2="520.0" y2="495.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="780.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ПРАВИЛЬНО: єдиний libc++_shared.so</text>
<rect x="574.2" y="123.0" width="151.7" height="73.9" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">libcore.so</tspan><tspan x="650.0" dy="14.3">Без власного коду STL</tspan><tspan x="650.0" dy="14.3">DT_NEEDED:</tspan><tspan x="650.0" dy="14.3">libc++_shared.so</tspan></text>
<rect x="834.2" y="123.0" width="151.7" height="73.9" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="910.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">libplugin.so</tspan><tspan x="910.0" dy="14.3">Без власного коду STL</tspan><tspan x="910.0" dy="14.3">DT_NEEDED:</tspan><tspan x="910.0" dy="14.3">libc++_shared.so</tspan></text>
<rect x="583.2" y="256.8" width="393.6" height="76.4" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="276.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">libc++_shared.so (Єдиний спільний рантайм)</tspan><tspan x="780.0" dy="15.0">• Єдина таблиця RTTI / typeinfo для всіх модулів</tspan><tspan x="780.0" dy="15.0">• Коректна передача винятків через межі .so бібліотек</tspan><tspan x="780.0" dy="15.0">• Єдиний стан потоків введення/виведення та пулів пам'яті</tspan></text>
<line x1="650.0" y1="215.0" x2="720.0" y2="255.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="910.0" y1="215.0" x2="840.0" y2="255.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="586.5" y="406.8" width="387.1" height="46.5" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="426.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Результат: стабільна робота, передбачуваний перехоплювач</tspan><tspan x="780.0" dy="15.0">винятків та мінімальний підсумковий розмір APK</tspan></text>
<line x1="780.0" y1="350.0" x2="780.0" y2="395.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>