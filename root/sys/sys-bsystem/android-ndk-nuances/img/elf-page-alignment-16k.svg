<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вимога вирівнювання сегментів ELF під розмір сторінки 16 KB (Android 15+)</text>
<text x="520.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вимога вирівнювання сегментів ELF під розмір сторінки 16 KB (Android 15+)</text>
<text x="260.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Старе вирівнювання (max-page-size = 4096)</text>
<rect x="52.5" y="123.0" width="415.0" height="73.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">ELF Заголовки (PT_LOAD сегменти)</tspan><tspan x="260.0" dy="14.3">Сегмент #1 (Code): Offset 0x0000 -&gt; VAddr 0x0000 (Aligned 4 KB)</tspan><tspan x="260.0" dy="14.3">Сегмент #2 (Data): Offset 0x1000 -&gt; VAddr 0x6000 (Aligned 4 KB)</tspan><tspan x="260.0" dy="14.3">Зміщення 0x1000 НЕ кратне 16 KB (0x4000)!</tspan></text>
<line x1="260.0" y1="215.0" x2="260.0" y2="275.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="55.6" y="313.8" width="408.7" height="102.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="333.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Спроба завантаження на ядрі з 16 KB сторінками:</tspan><tspan x="260.0" dy="14.3">mmap() ядра вимагає рівності залишків:</tspan><tspan x="260.0" dy="14.3">p_vaddr % PageSize == p_offset % PageSize</tspan><tspan x="260.0" dy="14.3">0x6000 % 16384 != 0x1000 % 16384 -&gt; конфлікт сторінок пам'яті!</tspan><tspan x="260.0" dy="14.3">Помилка динамічного лінкера:</tspan><tspan x="260.0" dy="14.3">dlopen failed: ... LOAD segment not page-aligned</tspan></text>
<line x1="520.0" y1="55.0" x2="520.0" y2="495.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="780.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">16 KB сумісне вирівнювання (-Wl,-z,max-page-size=16384)</text>
<rect x="569.4" y="123.0" width="421.3" height="73.9" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">ELF Заголовки (PT_LOAD сегменти)</tspan><tspan x="780.0" dy="14.3">Сегмент #1 (Code): Offset 0x0000 -&gt; VAddr 0x0000 (Aligned 16 KB)</tspan><tspan x="780.0" dy="14.3">Сегмент #2 (Data): Offset 0x4000 -&gt; VAddr 0x8000 (Aligned 16 KB)</tspan><tspan x="780.0" dy="14.3">Зміщення у файлі та VAddr вирівняно на межу 16384 байти</tspan></text>
<line x1="780.0" y1="215.0" x2="780.0" y2="275.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="578.8" y="313.8" width="402.5" height="102.5" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="333.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Завантаження на будь-якому ядрі (4 KB або 16 KB):</tspan><tspan x="780.0" dy="14.3">• Працює без модифікацій на старих 4 KB ядрах</tspan><tspan x="780.0" dy="14.3">  (16384 ділиться на 4096 без залишку)</tspan><tspan x="780.0" dy="14.3">• Успішно завантажується mmap() на нових 16 KB ядрах</tspan><tspan x="780.0" dy="14.3">• zipalign -p 16384 гарантує правильне зміщення всередині APK</tspan><tspan x="780.0" dy="14.3">Результат: сумісність з Android 15 та майбутніми версіями</tspan></text>
</svg>