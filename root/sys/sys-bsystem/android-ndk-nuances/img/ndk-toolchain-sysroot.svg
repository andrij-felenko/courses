<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура крос-компіляції Android NDK: від джерела до Bionic на пристрої</text>
<text x="520.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура крос-компіляції Android NDK: від джерела до Bionic на пристрої</text>
<rect x="58.4" y="69.3" width="223.2" height="91.3" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="89.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Хостовий компілятор NDK</tspan><tspan x="170.0" dy="15.0">clang / clang++ (LLVM)</tspan><tspan x="170.0" dy="15.0">Тріплет компілятора:</tspan><tspan x="170.0" dy="15.0">aarch64-linux-android29-clang</tspan><tspan x="170.0" dy="15.0">Фіксує архітектуру та API level</tspan></text>
<rect x="346.1" y="61.9" width="347.8" height="106.2" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="81.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">NDK Sysroot (Час збірки на хості)</tspan><tspan x="520.0" dy="15.0">1. Уніфіковані заголовки: sysroot/usr/include</tspan><tspan x="520.0" dy="15.0">   Містять макроси __INTRODUCED_IN(api_level)</tspan><tspan x="520.0" dy="15.0">2. Бібліотеки-заглушки (Stub libs):</tspan><tspan x="520.0" dy="15.0">   platforms/android-29/arch-arm64/usr/lib/libc.so</tspan><tspan x="520.0" dy="15.0">   Лише таблиця символів для lld (без тіл функцій)</tspan></text>
<line x1="295.0" y1="115.0" x2="345.0" y2="115.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="773.1" y="69.3" width="183.9" height="91.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="89.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">Цільова бібліотека ELF</tspan><tspan x="865.0" dy="15.0">libapp.so (ARM64)</tspan><tspan x="865.0" dy="15.0">DT_NEEDED: libc.so</tspan><tspan x="865.0" dy="15.0">DT_NEEDED: libm.so</tspan><tspan x="865.0" dy="15.0">Потребує Bionic API &gt;= 29</tspan></text>
<line x1="695.0" y1="115.0" x2="755.0" y2="115.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="865.0" y1="175.0" x2="865.0" y2="275.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="745.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Пакування в APK / adb install</text>
<line x1="40.0" y1="255.0" x2="1000.0" y2="255.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="120.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">ХОСТ (ЕТАП ЗБІРКИ)</text>
<text x="130.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">ПРИСТРІЙ (ANDROID RUNTIME)</text>
<rect x="102.2" y="349.4" width="275.6" height="91.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="369.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Динамічний лінкер пристрою</tspan><tspan x="240.0" dy="15.0">/system/bin/linker64</tspan><tspan x="240.0" dy="15.0">• Linker Namespaces (ізоляція)</tspan><tspan x="240.0" dy="15.0">• Зчитує DT_NEEDED та розв'язує символи</tspan><tspan x="240.0" dy="15.0">• Завантажує залежності з APEX/System</tspan></text>
<rect x="459.2" y="349.4" width="321.5" height="91.3" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="369.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Справжній Bionic libc (Цільовий пристрій)</tspan><tspan x="620.0" dy="15.0">/apex/com.android.runtime/lib64/bionic/libc.so</tspan><tspan x="620.0" dy="15.0">• Повноцінна реалізація системних викликів</tspan><tspan x="620.0" dy="15.0">• Аллокатор Scudo / jemalloc із MTE захистом</tspan><tspan x="620.0" dy="15.0">• Пряма взаємодія з ядром Linux</tspan></text>
<line x1="390.0" y1="395.0" x2="450.0" y2="395.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="831.0" y="364.3" width="138.0" height="61.4" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="900.0" y="384.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Ядро Linux</tspan><tspan x="900.0" dy="15.0">Syscall Dispatcher</tspan><tspan x="900.0" dy="15.0">SELinux / Seccomp</tspan></text>
<line x1="790.0" y1="395.0" x2="830.0" y2="395.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="865.0" y1="335.0" x2="390.0" y2="365.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="640.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">dlopen(&quot;libapp.so&quot;) через Linker</text>
</svg>