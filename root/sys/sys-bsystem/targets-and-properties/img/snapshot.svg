<text x="60.0" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">set(CMAKE_CXX_STANDARD 23)</text>
<rect x="470.0" y="384.0" width="470.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="705.0" y="412.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">на core і app НЕ впливає — вони вже створені</tspan></text>
