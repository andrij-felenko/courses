<line x1="270.0" y1="325.0" x2="270.0" y2="350.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="350.0" width="420.0" height="55.0" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="270.0" y="373.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Фаза 2 (Cleanup): Розмотка кадрів стека,</tspan><tspan x="270.0" dy="16.2">виклики деструкторів RAII та перехід у блок catch</tspan></text>
<rect x="540.0" y="50.0" width="460.0" height="410.0" rx="6" fill="#f8fafc" stroke="#047857" stroke-width="1.5"/>
<text x="770.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#047857" text-anchor="middle" font-weight="700">Microsoft C++: Windows SEH + __CxxFrameHandler</text>
<rect x="560.0" y="105.0" width="420.0" height="50.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Нормальне виконання на x64: також Zero-Cost</tspan><tspan x="770.0" dy="16.2">(усі метадані збережені у статичних секціях PE)</tspan></text>
