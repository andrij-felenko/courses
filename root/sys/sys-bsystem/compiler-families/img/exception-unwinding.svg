<text x="270.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="700">Itanium ABI: DWARF .eh_frame (Zero-Cost)</text>
<rect x="60.0" y="105.0" width="420.0" height="50.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="126.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Нормальне виконання: жодних накладних витрат</tspan><tspan x="270.0" dy="16.2">(реєстрація блоків try/catch у рантаймі відсутня)</tspan></text>
<line x1="270.0" y1="160.0" x2="270.0" y2="185.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="185.0" width="420.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="206.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Виклик throw → libunwind (_Unwind_RaiseException)</tspan><tspan x="270.0" dy="16.2">Фаза 1 (Search): Пошук обробника catch стеком угору</tspan></text>
<line x1="270.0" y1="240.0" x2="270.0" y2="265.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
