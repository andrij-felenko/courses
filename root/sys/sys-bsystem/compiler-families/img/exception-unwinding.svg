<line x1="770.0" y1="240.0" x2="770.0" y2="265.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="560.0" y="265.0" width="420.0" height="55.0" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/><text x="770.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Читання .xdata (UNWIND_INFO) + виклик __CxxFrameHandler3/4</tspan><tspan x="770.0" dy="15.0">Аналіз таблиць станів (State Index) та типів CatchableType</tspan></text>
<line x1="770.0" y1="325.0" x2="770.0" y2="350.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="560.0" y="350.0" width="420.0" height="55.0" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="770.0" y="373.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">RtlUnwindEx: виклик деструкторів локальних об'єктів</tspan><tspan x="770.0" dy="16.2">за таблицею станів та передача керування в catch-блок</tspan></text>
</svg>