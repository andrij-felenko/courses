<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стековий механізм політик CMake</text>
<text x="520.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Ізоляція та успадкування стека політик у підпроєктах і модулях</text>
<rect x="40.0" y="75.0" width="450.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="265.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">ІЄРАРХІЯ КАТАЛОГІВ (add_subdirectory)</tspan></text>
<rect x="40.0" y="130.0" width="450.0" height="150.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="265.0" y="176.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Головний проєкт (кореневий CMakeLists.txt):</tspan><tspan x="265.0" dy="16.2"></tspan><tspan x="265.0" dy="16.2">• cmake_minimum_required(VERSION 3.28)</tspan><tspan x="265.0" dy="16.2">• Стек політик: рівень 3.28 (усі сучасні NEW)</tspan><tspan x="265.0" dy="16.2">• add_subdirectory(subprojects/legacy_lib)</tspan></text>
<line x1="265.0" y1="280.0" x2="265.0" y2="330.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="275.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">створює копію стека</text>
<rect x="40.0" y="330.0" width="450.0" height="160.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="265.0" y="373.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Підпроєкт (legacy_lib/CMakeLists.txt):</tspan><tspan x="265.0" dy="16.2"></tspan><tspan x="265.0" dy="16.2">• cmake_minimum_required(VERSION 3.0)</tspan><tspan x="265.0" dy="16.2">• Змінює рівень політик ЛОКАЛЬНО на 3.0</tspan><tspan x="265.0" dy="16.2">• По завершенні каталогу локальний стек видаляється</tspan><tspan x="265.0" dy="16.2">• Головний проєкт зберігає свій рівень 3.28</tspan></text>
<rect x="530.0" y="75.0" width="470.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="765.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="765.0" dy="0.0">МОДУЛІ ТА МАКРОСИ (include)</tspan></text>
<rect x="530.0" y="130.0" width="470.0" height="360.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="765.0" y="206.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">Безпечний модуль (cmake/FindCustomPackage.cmake):</tspan><tspan x="765.0" dy="14.3"></tspan><tspan x="765.0" dy="14.3">cmake_policy(PUSH)                    # 1. Зберегти поточний стек</tspan><tspan x="765.0" dy="14.3">cmake_policy(SET CMP0054 NEW)         # 2. Локально виставити потрібні</tspan><tspan x="765.0" dy="14.3">cmake_policy(SET CMP0077 NEW)         #    налаштування політик</tspan><tspan x="765.0" dy="14.3"></tspan><tspan x="765.0" dy="14.3"># ... тіло модуля, логіка пошуку, цілі ...</tspan><tspan x="765.0" dy="14.3"></tspan><tspan x="765.0" dy="14.3">cmake_policy(POP)                     # 3. Відновити стек викликача</tspan><tspan x="765.0" dy="14.3"></tspan><tspan x="765.0" dy="14.3">─────────────────────────────────────────</tspan><tspan x="765.0" dy="14.3">Сучасна альтернатива (CMake 3.25+):</tspan><tspan x="765.0" dy="14.3">block(SCOPE_FOR POLICIES)</tspan><tspan x="765.0" dy="14.3">  cmake_policy(SET CMP0144 NEW)</tspan><tspan x="765.0" dy="14.3">  find_package(OpenSSL REQUIRED)</tspan><tspan x="765.0" dy="14.3">endblock()  # Автоматичне відновлення політик</tspan></text>
<rect x="40.0" y="515.0" width="960.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="520.0" y="541.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Правило безпеки: include() виконується в поточному скоупі й може змінити політики викликача.</tspan><tspan x="520.0" dy="16.2">Кожен сторонній модуль або макрос зобов'язаний огортати зміну політик у пару PUSH/POP.</tspan></text>
</svg>