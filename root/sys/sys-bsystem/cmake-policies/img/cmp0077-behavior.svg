<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поведінка option() за CMP0077</text>
<text x="520.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Поведінка команди option() за політики CMP0077 (OLD проти NEW)</text>
<rect x="40.0" y="70.0" width="960.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="96.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Вхідна ситуація у головному CMakeLists.txt перед add_subdirectory(foo):</tspan><tspan x="520.0" dy="16.9">set(FOO_BUILD_TESTS OFF)   # Звичайна локальна змінна викликача</tspan></text>
<rect x="40.0" y="150.0" width="460.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="174.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">СТАН OLD: ігнорування звичайної змінної</tspan></text>
<rect x="40.0" y="200.0" width="460.0" height="240.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">У підпроєкті foo/CMakeLists.txt:</tspan><tspan x="270.0" dy="15.6">option(FOO_BUILD_TESTS &quot;Build tests&quot; ON)</tspan><tspan x="270.0" dy="15.6"></tspan><tspan x="270.0" dy="15.6">1. option() перевіряє тільки файл кешу CMakeCache.txt.</tspan><tspan x="270.0" dy="15.6">2. Звичайна змінна FOO_BUILD_TESTS = OFF ігнорується.</tspan><tspan x="270.0" dy="15.6">3. option() безумовно записує FOO_BUILD_TESTS = ON у кеш.</tspan><tspan x="270.0" dy="15.6"></tspan><tspan x="270.0" dy="15.6">НАСЛІДОК: Тести підпроєкта збираються проти</tspan><tspan x="270.0" dy="15.6">бажання кореневого проєкту. Щоб вимкнути, доводилося</tspan><tspan x="270.0" dy="15.6">писати set(FOO_BUILD_TESTS OFF CACHE BOOL &quot;&quot; FORCE).</tspan></text>
<rect x="540.0" y="150.0" width="460.0" height="40.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="174.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">СТАН NEW: повага до звичайної змінної</tspan></text>
<rect x="540.0" y="200.0" width="460.0" height="240.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">У підпроєкті foo/CMakeLists.txt:</tspan><tspan x="770.0" dy="15.6">option(FOO_BUILD_TESTS &quot;Build tests&quot; ON)</tspan><tspan x="770.0" dy="15.6"></tspan><tspan x="770.0" dy="15.6">1. option() спершу перевіряє, чи існує звичайна змінна.</tspan><tspan x="770.0" dy="15.6">2. Змінна FOO_BUILD_TESTS = OFF знайдена у скоупі.</tspan><tspan x="770.0" dy="15.6">3. option() нічого не записує в кеш і лишає OFF.</tspan><tspan x="770.0" dy="15.6"></tspan><tspan x="770.0" dy="15.6">НАСЛІДОК: Чисте й передбачуване перевизначення</tspan><tspan x="770.0" dy="15.6">параметрів підпроєктів через FetchContent або</tspan><tspan x="770.0" dy="15.6">add_subdirectory без забруднення кешу!</tspan></text>
<rect x="40.0" y="460.0" width="960.0" height="68.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="490.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">CMP0077 дозволяє кореневому проєкту прозоро конфігурувати сторонні залежності.</tspan><tspan x="520.0" dy="16.9">Це усуває потребу у небезпечному модифікаторі FORCE при взаємодії з опціями.</tspan></text>
</svg>