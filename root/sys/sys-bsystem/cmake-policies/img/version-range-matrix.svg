<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Діапазон версій у cmake_minimum_required</text>
<text x="520.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Розгортання діапазону cmake_minimum_required(VERSION 3.15...3.30)</text>
<rect x="40.0" y="70.0" width="960.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="99.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Декларація у проєкті: cmake_minimum_required(VERSION 3.15...3.30)</tspan></text>
<rect x="40.0" y="140.0" width="215.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="147.5" y="165.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="147.5" dy="0.0">Запуск на CMake 3.12</tspan></text>
<rect x="40.0" y="192.0" width="215.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="147.5" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="147.5" dy="0.0">3.12 &lt; 3.15 (нижня межа)</tspan></text>
<rect x="40.0" y="238.0" width="215.0" height="190.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="147.5" y="324.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="147.5" dy="0.0">ФАТАЛЬНА ПОМИЛКА:</tspan><tspan x="147.5" dy="11.7">CMake зупиняє роботу, оскільки інструмент</tspan><tspan x="147.5" dy="11.7">старіший за мінімально підтримувану версію.</tspan></text>
<rect x="285.0" y="140.0" width="215.0" height="42.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="392.5" y="165.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="392.5" dy="0.0">Запуск на CMake 3.20</tspan></text>
<rect x="285.0" y="192.0" width="215.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="392.5" y="213.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="392.5" dy="0.0">3.15 &lt;= 3.20 &lt;= 3.30 (всередині)</tspan></text>
<rect x="285.0" y="238.0" width="215.0" height="190.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="392.5" y="324.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="392.5" dy="0.0">УСПІШНА КОНФІГУРАЦІЯ:</tspan><tspan x="392.5" dy="11.7">Всі політики до CMake 3.20 включно стають NEW.</tspan><tspan x="392.5" dy="11.7">Політики новіших версій (3.21+) відсутні у бінарнику.</tspan></text>
<rect x="530.0" y="140.0" width="215.0" height="42.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="637.5" y="165.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="637.5" dy="0.0">Запуск на CMake 3.30</tspan></text>
<rect x="530.0" y="192.0" width="215.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="637.5" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="637.5" dy="0.0">3.30 = 3.30 (верхня межа)</tspan></text>
<rect x="530.0" y="238.0" width="215.0" height="190.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="637.5" y="324.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="637.5" dy="0.0">МАКСИМАЛЬНИЙ НАБІР ПОЛІТИК:</tspan><tspan x="637.5" dy="11.7">Всі політики до CMake 3.30 включно стають NEW.</tspan><tspan x="637.5" dy="11.7">Проєкт повністю протестований під цю версію.</tspan></text>
<rect x="775.0" y="140.0" width="215.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="882.5" y="165.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="882.5" dy="0.0">Запуск на CMake 3.35</tspan></text>
<rect x="775.0" y="192.0" width="215.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="882.5" y="213.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="882.5" dy="0.0">3.35 &gt; 3.30 (вище верхньої межі)</tspan></text>
<rect x="775.0" y="238.0" width="215.0" height="190.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="882.5" y="318.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="882.5" dy="0.0">ЗАХИСТ ВІД НЕОЧІКУВАНИХ ЗМІН:</tspan><tspan x="882.5" dy="11.7">Політики до 3.30 стають NEW. Політики версій</tspan><tspan x="882.5" dy="11.7">3.31...3.35 залишаються UNSET / OLD, захищаючи</tspan><tspan x="882.5" dy="11.7">проєкт від неперевірених змін поведінки!</tspan></text>
<rect x="40.0" y="450.0" width="960.0" height="90.0" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="466.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">ЧОМУ ДІАПАЗОН ВЕРСІЙ КРАЩИЙ ЗА ОДНУ ФІКСОВАНУ ВЕРСІЮ:</tspan><tspan x="520.0" dy="16.2"></tspan><tspan x="520.0" dy="16.2">1. Дозволяє розробникам з новими версіями CMake користуватися найсучаснішими оптимізаціями та політиками.</tspan><tspan x="520.0" dy="16.2">2. Не вимагає від користувачів зі старішими дистрибутивами (наприклад, Ubuntu LTS) оновлювати CMake вище 3.15.</tspan><tspan x="520.0" dy="16.2">3. Обмежує набір активних політик верхньою межею (3.30), гарантуючи стабільність на майбутніх релізах CMake.</tspan></text>
</svg>