<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія запису в CMakeCache.txt</text>
<text x="520.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Формат рядка CMakeCache.txt та його відображення в інструментах</text>
<rect x="60.0" y="70.0" width="920.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="97.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">// Описовий рядок документації (Help String)</tspan><tspan x="520.0" dy="18.2">CMAKE_BUILD_TYPE:STRING=Release</tspan></text>
<rect x="60.0" y="170.0" width="200.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">ІМ'Я ЗМІННОЇ</tspan><tspan x="160.0" dy="16.2"></tspan><tspan x="160.0" dy="16.2">CMAKE_BUILD_TYPE</tspan><tspan x="160.0" dy="16.2">Унікальний ключ у кеші</tspan></text>
<rect x="280.0" y="170.0" width="200.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="196.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">ТИП ЗНАЧЕННЯ</tspan><tspan x="380.0" dy="15.0"></tspan><tspan x="380.0" dy="15.0">STRING / BOOL /</tspan><tspan x="380.0" dy="15.0">PATH / FILEPATH / INTERNAL</tspan></text>
<rect x="500.0" y="170.0" width="220.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">ЗНАЧЕННЯ</tspan><tspan x="610.0" dy="16.2"></tspan><tspan x="610.0" dy="16.2">Release</tspan><tspan x="610.0" dy="16.2">Поточний збережений стан</tspan></text>
<rect x="740.0" y="170.0" width="240.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">ВЛАСТИВОСТІ (PROPERTIES)</tspan><tspan x="860.0" dy="16.2"></tspan><tspan x="860.0" dy="16.2">ADVANCED (прихована)</tspan><tspan x="860.0" dy="16.2">STRINGS (список вибору)</tspan></text>
<rect x="60.0" y="290.0" width="440.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="320.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">ccmake / cmake-gui:</tspan><tspan x="280.0" dy="16.9"></tspan><tspan x="280.0" dy="16.9">• BOOL → Прапорець (Checkbox / ON-OFF)</tspan><tspan x="280.0" dy="16.9">• PATH / FILEPATH → Діалог вибору каталогу чи файлу</tspan><tspan x="280.0" dy="16.9">• STRING + STRINGS → Випадаючий список (Combobox)</tspan></text>
<rect x="540.0" y="290.0" width="440.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="320.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Фільтрація через ADVANCED:</tspan><tspan x="760.0" dy="16.9"></tspan><tspan x="760.0" dy="16.9">• Звичайний режим: видно лише 5–10 опцій проєкту</tspan><tspan x="760.0" dy="16.9">• Режим «t» (ccmake) / Advanced (GUI): відкриває</tspan><tspan x="760.0" dy="16.9">  всі системні шляхи компілятора та прапорці</tspan></text>
<rect x="60.0" y="440.0" width="920.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Змінні типу INTERNAL ніколи не показуються в GUI й слугують для збереження</tspan><tspan x="520.0" dy="17.6">результатів тестів try_compile, версій інструментів та внутрішнього стану CMake.</tspan></text>
