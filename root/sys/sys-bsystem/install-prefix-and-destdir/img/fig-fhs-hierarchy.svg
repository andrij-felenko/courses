<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія просторів FHS у системі Linux</text>
<text x="520.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Розподіл просторів імен у файловій системі Linux за стандартом FHS</text>
<rect x="40.0" y="70.0" width="460.0" height="200.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="106.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">/usr (Дистрибутивні пакети)</tspan><tspan x="270.0" dy="15.0"></tspan><tspan x="270.0" dy="15.0">Власник: Менеджер пакетів (apt, dnf, pacman)</tspan><tspan x="270.0" dy="15.0">• /usr/bin     — системні виконувані файли</tspan><tspan x="270.0" dy="15.0">• /usr/lib     — динамічні бібліотеки (.so)</tspan><tspan x="270.0" dy="15.0">• /usr/share   — архітектурно-незалежні ресурси</tspan><tspan x="270.0" dy="15.0">• /usr/include — системні C/C++ заголовки</tspan><tspan x="270.0" dy="15.0"></tspan><tspan x="270.0" dy="15.0">Ручний запис у /usr суворо заборонений:</tspan><tspan x="270.0" dy="15.0">будь-яке оновлення ОС перезапише ваші файли!</tspan></text>
<rect x="540.0" y="70.0" width="460.0" height="200.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">/usr/local (Локальний адміністратор)</tspan><tspan x="770.0" dy="15.0"></tspan><tspan x="770.0" dy="15.0">Власник: Системний адміністратор (ручна збірка)</tspan><tspan x="770.0" dy="15.0">• /usr/local/bin     — локально зібрані утиліти</tspan><tspan x="770.0" dy="15.0">• /usr/local/lib     — локальні спільні бібліотеки</tspan><tspan x="770.0" dy="15.0">• /usr/local/include — додаткові заголовки C/C++</tspan><tspan x="770.0" dy="15.0"></tspan><tspan x="770.0" dy="15.0">Пакетний менеджер ОС ніколи не чіпає цей каталог.</tspan><tspan x="770.0" dy="15.0">Стандартний префікс за замовчуванням у CMake та GNU.</tspan></text>
<rect x="40.0" y="290.0" width="460.0" height="160.0" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="321.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">/opt (Автономні сторонні пакети)</tspan><tspan x="270.0" dy="15.0"></tspan><tspan x="270.0" dy="15.0">Власник: Сторонній розробник / вендор (Chrome, CLion, CUDA)</tspan><tspan x="270.0" dy="15.0">• /opt/vendor/app/bin — ізольований виконуваний файл</tspan><tspan x="270.0" dy="15.0">• /opt/vendor/app/lib — приватні зв'язані бібліотеки</tspan><tspan x="270.0" dy="15.0"></tspan><tspan x="270.0" dy="15.0">Кожен пакет живе у власній замкненій ієрархії.</tspan><tspan x="270.0" dy="15.0">Не змішується з іншими програмами системи.</tspan></text>
<rect x="540.0" y="290.0" width="460.0" height="160.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="321.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">~/.local (Користувацький простір XDG)</tspan><tspan x="770.0" dy="15.0"></tspan><tspan x="770.0" dy="15.0">Власник: Звичайний користувач без root-прав</tspan><tspan x="770.0" dy="15.0">• ~/.local/bin   — особисті скрипти та утиліти</tspan><tspan x="770.0" dy="15.0">• ~/.local/lib   — локальні бібліотеки користувача</tspan><tspan x="770.0" dy="15.0">• ~/.local/share — дані застосунків користувача</tspan><tspan x="770.0" dy="15.0"></tspan><tspan x="770.0" dy="15.0">Безпечне встановлення через CMAKE_INSTALL_PREFIX=$HOME/.local</tspan></text>
<rect x="40.0" y="470.0" width="960.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="520.0" y="499.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Головне правило: /usr належить ОС; /usr/local — адміністратору хоста; /opt — вендорам; ~/.local — користувачу</tspan></text>
</svg>