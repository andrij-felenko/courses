<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Релокабельність бібліотек через відносний $ORIGIN у RPATH</text>
<text x="520.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Динамічне обчислення шляху до спільних бібліотек через $ORIGIN у RUNPATH</text>
<rect x="40.0" y="70.0" width="460.0" height="190.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Варіант А: Абсолютний RUNPATH (/opt/myapp/lib)</tspan><tspan x="270.0" dy="15.0"></tspan><tspan x="270.0" dy="15.0">Встановлений виконуваний файл: /opt/myapp/bin/app</tspan><tspan x="270.0" dy="15.0">RUNPATH у заголовку ELF: /opt/myapp/lib</tspan><tspan x="270.0" dy="15.0"></tspan><tspan x="270.0" dy="15.0">• Якщо користувач перемістить пакет у /home/user/apps/myapp:</tspan><tspan x="270.0" dy="15.0">  Бінарник шукатиме /opt/myapp/lib/libcore.so</tspan><tspan x="270.0" dy="15.0">  ПОМИЛКА: libcore.so not found! Пакет не переміщуваний.</tspan></text>
<rect x="540.0" y="70.0" width="460.0" height="190.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Варіант Б: Відносний RUNPATH ($ORIGIN/../lib)</tspan><tspan x="770.0" dy="15.0"></tspan><tspan x="770.0" dy="15.0">Встановлений виконуваний файл: &lt;будь-де&gt;/bin/app</tspan><tspan x="770.0" dy="15.0">RUNPATH у заголовку ELF: $ORIGIN/../lib</tspan><tspan x="770.0" dy="15.0"></tspan><tspan x="770.0" dy="15.0">• $ORIGIN динамічно розгортається завантажувачем у шлях до bin/</tspan><tspan x="770.0" dy="15.0">• $ORIGIN/../lib завжди точно вказує на сусідній каталог lib/</tspan><tspan x="770.0" dy="15.0">  УСПІХ: пакет працює в /opt, /usr/local, ~/.local чи на USB-носії!</tspan></text>
<rect x="40.0" y="280.0" width="960.0" height="150.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="320.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Структура релокабельного пакета:</tspan><tspan x="520.0" dy="15.6">myapp-bundle/</tspan><tspan x="520.0" dy="15.6"> ├── bin/</tspan><tspan x="520.0" dy="15.6"> │    └── app        &lt;── виконуваний файл ($ORIGIN = /шлях/до/myapp-bundle/bin)</tspan><tspan x="520.0" dy="15.6"> └── lib/</tspan><tspan x="520.0" dy="15.6">      └── libcore.so &lt;── знайдено через $ORIGIN/../lib/libcore.so</tspan></text>
<rect x="40.0" y="450.0" width="960.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="476.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Конфігурація в CMake: set(CMAKE_INSTALL_RPATH &quot;$ORIGIN/../lib&quot;)</tspan><tspan x="520.0" dy="16.2">На macOS використовується аналог @executable_path/../lib або @loader_path/../lib</tspan></text>
</svg>