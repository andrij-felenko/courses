<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівняння DESTDIR + PREFIX: розведення шляхів копіювання та виконання</text>
<text x="520.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Розведення шляхів копіювання та шляхів виконання під час пакування</text>
<rect x="40.0" y="70.0" width="430.0" height="180.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="255.0" y="104.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">1. КОМПІЛЯЦІЯ: Цільовий PREFIX (/usr)</tspan><tspan x="255.0" dy="15.0"></tspan><tspan x="255.0" dy="15.0">cmake -B build -DCMAKE_INSTALL_PREFIX=/usr</tspan><tspan x="255.0" dy="15.0"></tspan><tspan x="255.0" dy="15.0">Зашивається в бінарні артефакти:</tspan><tspan x="255.0" dy="15.0">• Шлях до ресурсів: /usr/share/myapp/data.json</tspan><tspan x="255.0" dy="15.0">• Пошуковий RUNPATH: /usr/lib/myapp</tspan><tspan x="255.0" dy="15.0">• Shebang скриптів: #!/usr/bin/python3</tspan><tspan x="255.0" dy="15.0">• pkg-config (.pc): prefix=/usr</tspan></text>
<rect x="570.0" y="70.0" width="430.0" height="180.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="785.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">2. ПАКУВАННЯ: Тимчасовий DESTDIR (/tmp/pkg)</tspan><tspan x="785.0" dy="15.0"></tspan><tspan x="785.0" dy="15.0">DESTDIR=/tmp/pkg cmake --install build</tspan><tspan x="785.0" dy="15.0"></tspan><tspan x="785.0" dy="15.0">Фізичне копіювання файлів у тимчасовий каталог:</tspan><tspan x="785.0" dy="15.0">• DESTDIR діє ТІЛЬКИ як префікс файлової операції копіювання</tspan><tspan x="785.0" dy="15.0">• Файл потрапляє у /tmp/pkg/usr/bin/myapp</tspan><tspan x="785.0" dy="15.0">• Дані потрапляють у /tmp/pkg/usr/share/myapp/data.json</tspan></text>
<rect x="40.0" y="270.0" width="960.0" height="60.0" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Рівняння пакувальника: Шлях запису на диск = ${DESTDIR}${PREFIX}/${PATH_SUFFIX}</tspan><tspan x="520.0" dy="16.9">Приклад: /tmp/pkg + /usr + /bin/app  →  /tmp/pkg/usr/bin/app</tspan></text>
<rect x="40.0" y="350.0" width="430.0" height="90.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="255.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">3. Складання пакета (.deb / .rpm / .apk)</tspan><tspan x="255.0" dy="13.7">Пакувальник бере дерево з /tmp/pkg/ і пакує в архів.</tspan><tspan x="255.0" dy="13.7">Префікс /tmp/pkg відкидається — в архіві файли мають шлях /usr/...</tspan></text>
<rect x="570.0" y="350.0" width="430.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="785.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">4. Виконання на машині клієнта (dpkg -i / rpm -i)</tspan><tspan x="785.0" dy="12.3">Архів розпаковується в /usr/...</tspan><tspan x="785.0" dy="12.3">Бінарник запускається і шукає дані за вшитим /usr/share/myapp — УСПІХ!</tspan></text>
<rect x="40.0" y="460.0" width="960.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="520.0" y="493.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Критична помилка: якщо DESTDIR випадково потрапить у бінарник (-DDATADIR=&quot;$DESTDIR/usr/share&quot;), програма впаде на клієнтській машині, бо каталогу /tmp/pkg там не існує!</tspan></text>
</svg>