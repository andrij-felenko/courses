<text x="520.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Структура файлів і зон відповідальності всередині out-of-tree оточення</text>
<rect x="65.0" y="110.0" width="275.0" height="185.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="202.5" y="158.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="202.5" dy="0.0">КЕШ КОНФІГУРАЦІЇ</tspan><tspan x="202.5" dy="16.2"></tspan><tspan x="202.5" dy="16.2">CMakeCache.txt</tspan><tspan x="202.5" dy="16.2">• Збережені опції користувача</tspan><tspan x="202.5" dy="16.2">• Виявлені шляхи до компіляторів</tspan><tspan x="202.5" dy="16.2">• Прапорці трансляції</tspan><tspan x="202.5" dy="16.2">• Запобігає повторним тестам</tspan></text>
<rect x="382.0" y="110.0" width="275.0" height="185.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="519.5" y="158.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="519.5" dy="0.0">ПРОСТІР ЗОНДУВАННЯ</tspan><tspan x="519.5" dy="16.2"></tspan><tspan x="519.5" dy="16.2">CMakeFiles/</tspan><tspan x="519.5" dy="16.2">• CMakeConfigureLog.yaml</tspan><tspan x="519.5" dy="16.2">• CMakeScratch/ (тривалі проби)</tspan><tspan x="519.5" dy="16.2">• Логи викликів try_compile()</tspan><tspan x="519.5" dy="16.2">• Виявлені ABI та розміри типів</tspan></text>
<rect x="700.0" y="110.0" width="275.0" height="185.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="837.5" y="158.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="837.5" dy="0.0">ЗГЕНЕРОВАНІ ДЖЕРЕЛА</tspan><tspan x="837.5" dy="16.2"></tspan><tspan x="837.5" dy="16.2">generated/</tspan><tspan x="837.5" dy="16.2">• config.h (з config.h.in)</tspan><tspan x="837.5" dy="16.2">• version.cpp (номер релізу/комміт)</tspan><tspan x="837.5" dy="16.2">• Protobuf / Flex / Bison генерати</tspan><tspan x="837.5" dy="16.2">• Підключаються через -I build/gen</tspan></text>
<rect x="65.0" y="320.0" width="275.0" height="185.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="202.5" y="368.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="202.5" dy="0.0">НИЗЬКОРІВНЕВИЙ ГРАФ</tspan><tspan x="202.5" dy="16.2"></tspan><tspan x="202.5" dy="16.2">build.ninja / Makefile</tspan><tspan x="202.5" dy="16.2">• Детерміновані правила запуску</tspan><tspan x="202.5" dy="16.2">• Повні шляхи до файлів та утиліт</tspan><tspan x="202.5" dy="16.2">• Жодної логіки чи розгалужень</tspan><tspan x="202.5" dy="16.2">• Вхід для Ninja / Make</tspan></text>
<rect x="382.0" y="320.0" width="275.0" height="185.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="519.5" y="371.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="519.5" dy="0.0">ЖУРНАЛИ АКТУАЛЬНОСТІ</tspan><tspan x="519.5" dy="15.0"></tspan><tspan x="519.5" dy="15.0">.ninja_deps · .ninja_log</tspan><tspan x="519.5" dy="15.0">• База включень заголовків (depfiles)</tspan><tspan x="519.5" dy="15.0">• Історія часу виконання команд</tspan><tspan x="519.5" dy="15.0">• Обчислення застарілих вершин</tspan><tspan x="519.5" dy="15.0">• Швидкий інкрементальний старт</tspan></text>
<rect x="700.0" y="320.0" width="275.0" height="185.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="837.5" y="368.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="837.5" dy="0.0">ОБ'ЄКТНИКИ ТА АРТЕФАКТИ</tspan><tspan x="837.5" dy="16.2"></tspan><tspan x="837.5" dy="16.2">CMakeFiles/app.dir/ &amp; bin/</tspan><tspan x="837.5" dy="16.2">• main.cpp.o, util.cpp.o</tspan><tspan x="837.5" dy="16.2">• libcore.a / libcore.so</tspan><tspan x="837.5" dy="16.2">• Фінальний бінарник bin/app</tspan><tspan x="837.5" dy="16.2">• Ізоляція між різними цілями</tspan></text>
</svg>