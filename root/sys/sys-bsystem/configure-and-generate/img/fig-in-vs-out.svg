<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння in-source та out-of-source підходів до збірки</text>
<rect x="40.0" y="40.0" width="450.0" height="460.0" rx="8" fill="#f8fafc" stroke="#c0392b" stroke-width="2.0"/>
<text x="265.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">In-Source збірка (антипатерн)</text>
<text x="265.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Джерела змішані з артефактами в одному каталозі</text>
<rect x="60.0" y="115.0" width="410.0" height="180.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="265.0" y="152.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Каталог проєкту:  my_project/</tspan><tspan x="265.0" dy="16.2">├── src/ (main.cpp, util.cpp, util.h)</tspan><tspan x="265.0" dy="16.2">├── CMakeLists.txt</tspan><tspan x="265.0" dy="16.2">├── main.o, util.o        ← тимчасові об'єктні файли</tspan><tspan x="265.0" dy="16.2">├── CMakeCache.txt        ← кеш конфігурації</tspan><tspan x="265.0" dy="16.2">├── CMakeFiles/           ← проміжне сміття тестів</tspan><tspan x="265.0" dy="16.2">├── config.h              ← згенерований заголовок</tspan><tspan x="265.0" dy="16.2">└── app                   ← скомпільований бінарник</tspan></text>
<rect x="60.0" y="310.0" width="410.0" height="170.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="265.0" y="361.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">НАСЛІДКИ ТА ВАДИ:</tspan><tspan x="265.0" dy="15.0">✖ git status показує сотні сміттєвих файлів</tspan><tspan x="265.0" dy="15.0">✖ Неможливо зібрати Debug і Release одночасно</tspan><tspan x="265.0" dy="15.0">✖ Дерево джерел не можна змонтувати як Read-Only</tspan><tspan x="265.0" dy="15.0">✖ Очищення небезпечне: make clean може потерти джерела</tspan><tspan x="265.0" dy="15.0">✖ Перемикання гілок Git призводить до колізій артефактів</tspan></text>
<rect x="550.0" y="40.0" width="450.0" height="460.0" rx="8" fill="#f8fafc" stroke="#27ae60" stroke-width="2.0"/>
<text x="775.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Out-of-Source збірка (канон)</text>
<text x="775.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Джерела Read-Only, збірки повністю ізольовані</text>
<rect x="570.0" y="115.0" width="410.0" height="110.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">ДЕРЕВО ДЖЕРЕЛ (Тільки для читання / Git):</tspan><tspan x="775.0" dy="16.2">my_project/  (чисте, без жодного артефакту)</tspan><tspan x="775.0" dy="16.2">├── src/ (main.cpp, util.cpp, util.h)</tspan><tspan x="775.0" dy="16.2">└── CMakeLists.txt</tspan></text>
<rect x="570.0" y="240.0" width="410.0" height="65.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="775.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">build-debug/  (Debug + ASan, -O0 -g)</tspan><tspan x="775.0" dy="15.6">└── CMakeCache.txt, build.ninja, main.o, app</tspan></text>
<rect x="570.0" y="315.0" width="410.0" height="65.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="775.0" y="343.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">build-release/  (Release + LTO, -O3)</tspan><tspan x="775.0" dy="15.6">└── CMakeCache.txt, build.ninja, main.o, app</tspan></text>
<rect x="570.0" y="390.0" width="410.0" height="65.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="775.0" y="418.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">build-arm/  (Крос-збірка під Cortex-M4)</tspan><tspan x="775.0" dy="15.6">└── CMakeCache.txt, build.ninja, firmware.elf</tspan></text>
<rect x="570.0" y="465.0" width="410.0" height="26.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="481.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">Очищення: rm -rf build-debug/ — 100% повернення до чистого стану</tspan></text>
</svg>