<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія герметичної пісочниці ядра Linux</text>
<text x="520.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія герметичної пісочниці ядра Linux (Linux Sandbox)</text>
<rect x="40.0" y="55.0" width="960.0" height="445.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="220.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Хостова операційна система Linux (Ядро / Простір користувача)</text>
<rect x="60.0" y="95.0" width="620.0" height="385.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="370.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Ізольований простір пісочниці (Sandbox Isolation)</text>
<rect x="80.0" y="145.0" width="280.0" height="150.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.3"/>
<text x="220.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">1. Mount Namespace (CLONE_NEWNS)</text>
<rect x="95.0" y="185.0" width="250.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="204.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Приватний корінь /sandbox/root</tspan><tspan x="220.0" dy="15.0">створений через pivot_root</tspan></text>
<rect x="95.0" y="238.0" width="250.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="257.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">tmpfs для тимчасових файлів,</tspan><tspan x="220.0" dy="15.0">read-only bind mounts для сирців</tspan></text>
<rect x="380.0" y="145.0" width="280.0" height="150.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.3"/>
<text x="520.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2. Network Namespace (CLONE_NEWNET)</text>
<rect x="395.0" y="185.0" width="250.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="204.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Повна відсутність інтерфейсів eth0/wlan</tspan><tspan x="520.0" dy="13.7">лише відключений loopback lo</tspan></text>
<rect x="395.0" y="238.0" width="250.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="257.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Будь-який виклик socket()/connect()</tspan><tspan x="520.0" dy="12.3">миттєво повертає помилку EPERM / ENETDOWN</tspan></text>
<rect x="80.0" y="310.0" width="580.0" height="155.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.3"/>
<text x="370.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">3. User Namespace (CLONE_NEWUSER) та Seccomp фільтри</text>
<rect x="95.0" y="350.0" width="265.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="227.5" y="371.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="227.5" dy="0.0">Мапування UID 0 всередині на</tspan><tspan x="227.5" dy="15.0">звичайний непривілейований UID хоста</tspan></text>
<rect x="375.0" y="350.0" width="270.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="371.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Заборона системних викликів:</tspan><tspan x="510.0" dy="15.0">ptrace, reboot, mount, settimeofday</tspan></text>
<rect x="95.0" y="408.0" width="550.0" height="45.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="426.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Дерево символічних посилань (Symlink Forest):</tspan><tspan x="370.0" dy="15.6">компілятор бачить лише явно задекларовані входи дії</tspan></text>
<rect x="700.0" y="95.0" width="280.0" height="385.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="840.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Заблоковано на рівні ядра</text>
<rect x="715.0" y="145.0" width="250.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="840.0" y="164.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">Хостовий /usr/include та /usr/lib</tspan><tspan x="840.0" dy="15.0">(неможливо прочитати заголовки)</tspan></text>
<rect x="715.0" y="198.0" width="250.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="840.0" y="217.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">Каталоги користувача /home</tspan><tspan x="840.0" dy="15.0">та конфігурації ~/.bashrc, ~/.ssh</tspan></text>
<rect x="715.0" y="251.0" width="250.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="840.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">Глобальна мережа Internet</tspan><tspan x="840.0" dy="15.0">(заборонено curl, git, pip)</tspan></text>
<rect x="715.0" y="304.0" width="250.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="840.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">Системний час хоста</tspan><tspan x="840.0" dy="15.0">(стабілізовано через віртуалізацію)</tspan></text>
<rect x="715.0" y="357.0" width="250.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="840.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">Міжпроцесна взаємодія IPC</tspan><tspan x="840.0" dy="15.0">(ізоляція спільних черг і пам'яті)</tspan></text>
<rect x="715.0" y="415.0" width="250.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="840.0" y="437.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">Спроба доступу до неоголошеного файлу</tspan><tspan x="840.0" dy="12.3">призводить до негайної помилки ENOENT</tspan></text>
</svg>