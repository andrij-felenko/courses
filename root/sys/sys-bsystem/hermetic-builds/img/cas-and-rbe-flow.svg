<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контентно-адресоване сховище та конвеєр Remote Build Execution</text>
<text x="520.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контентно-адресоване сховище (CAS) та конвеєр Remote Execution</text>
<rect x="40.0" y="60.0" width="240.0" height="430.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="160.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">1. Клієнт (Bazel / Buck2)</text>
<rect x="55.0" y="105.0" width="210.0" height="55.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="128.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Побудова Action Graph</tspan><tspan x="160.0" dy="15.6">на основі Starlark правил</tspan></text>
<rect x="55.0" y="170.0" width="210.0" height="65.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="191.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Обчислення Action Digest</tspan><tspan x="160.0" dy="15.6">(хеш команди, дерева</tspan><tspan x="160.0" dy="15.6">входів, тулчейна та env)</tspan></text>
<rect x="55.0" y="245.0" width="210.0" height="55.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Запит до Action Cache (AC):</tspan><tspan x="160.0" dy="15.6">«Чи готова дія з цим хешем?»</tspan></text>
<rect x="55.0" y="310.0" width="210.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="330.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Якщо промах кешу:</tspan><tspan x="160.0" dy="15.6">завантаження відсутніх</tspan><tspan x="160.0" dy="15.6">блоків коду в CAS</tspan><tspan x="160.0" dy="15.6">через gRPC протокол</tspan></text>
<rect x="55.0" y="400.0" width="210.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="426.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Отримання результату:</tspan><tspan x="160.0" dy="15.6">завантаження артефактів</tspan><tspan x="160.0" dy="15.6">або посилання у CAS</tspan></text>
<line x1="280.0" y1="160.0" x2="360.0" y2="160.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="320.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Запит</text>
<rect x="365.0" y="80.0" width="260.0" height="160.0" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/>
<text x="495.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">2. Action Cache (AC)</text>
<rect x="380.0" y="120.0" width="230.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="495.0" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">Індекс відповідності:</tspan><tspan x="495.0" dy="14.3">ActionDigest → ActionResultDigest</tspan></text>
<rect x="380.0" y="175.0" width="230.0" height="50.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="495.0" y="197.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="495.0" dy="0.0">Cache Hit: повернення результату</tspan><tspan x="495.0" dy="12.3">(збірка миттєва, 0 мс на виконання)</tspan></text>
<line x1="495.0" y1="240.0" x2="495.0" y2="290.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="540.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Посилання</text>
<rect x="365.0" y="295.0" width="260.0" height="195.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="495.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. CAS (Content-Addressed Storage)</text>
<rect x="380.0" y="335.0" width="230.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="495.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">Незмінне сховище блоків:</tspan><tspan x="495.0" dy="15.0">Ключ = SHA-256 вмісту файлу</tspan></text>
<rect x="380.0" y="388.0" width="230.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="495.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">Глобальна дедуплікація:</tspan><tspan x="495.0" dy="15.0">спільні блоки для всіх проєктів</tspan></text>
<rect x="380.0" y="440.0" width="230.0" height="40.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.5"/><text x="495.0" y="463.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">Зберігає вхідні сирці та готові .o/.a</tspan></text>
<line x1="625.0" y1="160.0" x2="710.0" y2="160.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="668.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Cache Miss</text>
<rect x="715.0" y="60.0" width="285.0" height="430.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="857.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" font-weight="700">4. RBE Кластер воркерів</text>
<rect x="730.0" y="105.0" width="255.0" height="55.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="857.5" y="128.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="857.5" dy="0.0">Пул віддалених воркерів:</tspan><tspan x="857.5" dy="15.6">масштабування на 10 000+ ядер</tspan></text>
<rect x="730.0" y="170.0" width="255.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="857.5" y="196.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="857.5" dy="0.0">Завантаження входів із CAS</tspan><tspan x="857.5" dy="15.6">(лише тих блоків, яких нема)</tspan></text>
<rect x="730.0" y="240.0" width="255.0" height="75.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="857.5" y="266.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="857.5" dy="0.0">Виконання дії в контейнері:</tspan><tspan x="857.5" dy="15.6">повна ізоляція (Namespaces),</tspan><tspan x="857.5" dy="15.6">детермінований запуск команди</tspan></text>
<rect x="730.0" y="325.0" width="255.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="857.5" y="353.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="857.5" dy="0.0">Збереження згенерованих .o</tspan><tspan x="857.5" dy="15.6">та stdout/stderr у CAS</tspan></text>
<rect x="730.0" y="400.0" width="255.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="857.5" y="426.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="857.5" dy="0.0">Оновлення Action Cache:</tspan><tspan x="857.5" dy="15.0">новий ActionResult стає доступним</tspan><tspan x="857.5" dy="15.0">для всіх розробників компанії</tspan></text>
<line x1="715.0" y1="355.0" x2="625.0" y2="355.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>