<rect x="55.0" y="190.0" width="230.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="216.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Hermetic Toolchain</tspan><tspan x="170.0" dy="15.0">Фіксований двійковий Clang/GCC</tspan><tspan x="170.0" dy="15.0">та версія sysroot / libc</tspan></text>
