<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюжок побудови AST та індексації в clangd</text>
<rect x="40.0" y="40.0" width="980.0" height="480.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="530.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як мовний сервер (clangd) перетворює запис у семантичний індекс</text>
<rect x="70.0" y="100.0" width="260.0" height="95.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">1. Подія редактора</tspan><tspan x="200.0" dy="16.9">Користувач відкриває</tspan><tspan x="200.0" dy="16.9">src/math_utils.cpp</tspan><tspan x="200.0" dy="16.9">(або include/math_utils.h)</tspan></text>
<line x1="335.0" y1="147.0" x2="385.0" y2="147.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="390.0" y="100.0" width="280.0" height="95.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="127.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">2. Пошук бази</tspan><tspan x="530.0" dy="16.2">clangd сканує каталог файлу,</tspan><tspan x="530.0" dy="16.2">потім батьківські теки, теки build/,</tspan><tspan x="530.0" dy="16.2">знаходить compile_commands.json</tspan></text>
<line x1="675.0" y1="147.0" x2="725.0" y2="147.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="730.0" y="100.0" width="260.0" height="95.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="860.0" y="127.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">3. Резолюція прапорців</tspan><tspan x="860.0" dy="16.2">Витягує точний запис.</tspan><tspan x="860.0" dy="16.2">Для заголовків (.h) застосовує</tspan><tspan x="860.0" dy="16.2">евристику файлу-близнюка</tspan></text>
<line x1="860.0" y1="200.0" x2="860.0" y2="250.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="580.0" y="255.0" width="410.0" height="105.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="785.0" y="287.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">4. Ініціалізація Clang FrontendAction</tspan><tspan x="785.0" dy="16.2">Формує екземпляр CompilerInstance із реальними:</tspan><tspan x="785.0" dy="16.2">-I шляхами, -D макросами, -std стандартом,</tspan><tspan x="785.0" dy="16.2">та системними include через --query-driver</tspan></text>
<line x1="575.0" y1="307.0" x2="485.0" y2="307.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="70.0" y="255.0" width="410.0" height="105.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="275.0" y="287.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">5. Побудова AST та Індексу</tspan><tspan x="275.0" dy="16.2">Повне розгортання макросів і шаблонів.</tspan><tspan x="275.0" dy="16.2">Відстеження AST-вузлів, перехресних посилань,</tspan><tspan x="275.0" dy="16.2">типів та сигнатур функцій</tspan></text>
<line x1="275.0" y1="365.0" x2="275.0" y2="405.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="70.0" y="410.0" width="920.0" height="85.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="530.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Можливості LSP та інструментів розробки:</text>
<text x="530.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">• Бездоганне автодоповнення   • Перехід до визначення (F12)   • clang-tidy перевірки   • Безпечний рефакторинг</text>
</svg>