<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два шляхи отримання бази: генерація проти перехоплення</text>
<rect x="40.0" y="50.0" width="465.0" height="470.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="272.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">1. Декларативний експорт (CMake / Meson / Ninja)</text>
<rect x="70.0" y="115.0" width="405.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="272.5" y="143.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="272.5" dy="0.0">Вхід: Опис структури проєкту</tspan><tspan x="272.5" dy="16.9">(CMakeLists.txt / meson.build / build.ninja)</tspan></text>
<line x1="150.0" y1="180.0" x2="150.0" y2="235.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="165.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-style="italic">CMAKE_EXPORT_COMPILE_COMMANDS=ON</text>
<rect x="70.0" y="235.0" width="405.0" height="80.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="272.5" y="262.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="272.5" dy="0.0">Генератор збірки</tspan><tspan x="272.5" dy="16.9">Знає кожен target, його PRIVATE/PUBLIC</tspan><tspan x="272.5" dy="16.9">включення, прапорці мови та дефайни</tspan></text>
<line x1="150.0" y1="315.0" x2="150.0" y2="370.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="165.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-style="italic">прямий запис на етапі генерації</text>
<rect x="70.0" y="370.0" width="405.0" height="125.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="272.5" y="404.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="272.5" dy="0.0">Переваги:</tspan><tspan x="272.5" dy="16.2">• Миттєво (не треба запускати збірку проєкту)</tspan><tspan x="272.5" dy="16.2">• Точно відповідає налаштованій конфігурації</tspan><tspan x="272.5" dy="16.2">Обмеження:</tspan><tspan x="272.5" dy="16.2">• Потребує сумісної метасистеми (CMake + Ninja/Make)</tspan></text>
<rect x="555.0" y="50.0" width="465.0" height="470.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="787.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">2. Перехоплення процесів (Bear / intercept-build)</text>
<rect x="585.0" y="115.0" width="405.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="787.5" y="143.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="787.5" dy="0.0">Вхід: Довільна чорна скринька збірки</tspan><tspan x="787.5" dy="16.9">(Спадковий Makefile, Autotools, bash-скрипт)</tspan></text>
<line x1="665.0" y1="180.0" x2="665.0" y2="235.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="680.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-style="italic">bear -- make -j8</text>
<rect x="585.0" y="235.0" width="405.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="787.5" y="263.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="787.5" dy="0.0">Механізм перехоплення (LD_PRELOAD / ptrace)</tspan><tspan x="787.5" dy="16.2">Обгортає системні виклики execve() / posix_spawn().</tspan><tspan x="787.5" dy="16.2">Фільтрує виклики компіляторів (gcc, g++, clang)</tspan></text>
<line x1="665.0" y1="315.0" x2="665.0" y2="370.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="680.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-style="italic">дамп перехоплених argv + getcwd()</text>
<rect x="585.0" y="370.0" width="405.0" height="125.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="787.5" y="408.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="787.5" dy="0.0">Переваги:</tspan><tspan x="787.5" dy="13.7">• Працює з будь-якою системою збірки без її модифікації</tspan><tspan x="787.5" dy="13.7">Обмеження:</tspan><tspan x="787.5" dy="13.7">• Потрібна повна чиста збірка (інкрементальна пропустить файли)</tspan><tspan x="787.5" dy="13.7">• Залежить від прав доступу, SIP на macOS і ptrace</tspan></text>
</svg>