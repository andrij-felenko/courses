<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розділення Build Tree та Install Tree у CMake</text>
<text x="520.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Генераторні вирази ізолюють внутрішні шляхи розробника від кінцевого префікса споживача</text>
<rect x="40.0" y="75.0" width="430.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="255.0" y="97.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">ДЕРЕВО ЗБІРКИ (Build Tree — простір розробника)</tspan></text>
<rect x="40.0" y="120.0" width="430.0" height="210.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="169.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">project/ (Дерево джерел)</tspan><tspan x="255.0" dy="15.0"> ├── include/mylib/core.hpp   (Публічні та внутрішні заголовки)</tspan><tspan x="255.0" dy="15.0"> ├── src/core.cpp             (Вихідний код реалізації)</tspan><tspan x="255.0" dy="15.0"> └── tests/test_core.cpp      (Внутрішні модульні тести)</tspan><tspan x="255.0" dy="15.0"></tspan><tspan x="255.0" dy="15.0">build/ (Каталог збірки)</tspan><tspan x="255.0" dy="15.0"> ├── libmylib.so              (Скомпільований бінарний файл)</tspan><tspan x="255.0" dy="15.0"> ├── CMakeFiles/...           (Службові об'єктні файли .o)</tspan><tspan x="255.0" dy="15.0"> └── unit_tests               (Тимчасовий виконуваний файл)</tspan></text>
<rect x="40.0" y="340.0" width="430.0" height="105.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="255.0" y="374.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">$&lt;BUILD_INTERFACE:...&gt;</tspan><tspan x="255.0" dy="15.0">Шлях: ${CMAKE_CURRENT_SOURCE_DIR}/include</tspan><tspan x="255.0" dy="15.0">• Діє під час компіляції бібліотеки та власних тестів</tspan><tspan x="255.0" dy="15.0">• Повністю зникає з властивостей під час інсталяції</tspan></text>
<line x1="480.0" y1="230.0" x2="560.0" y2="230.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="520.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">cmake --install</text>
<text x="520.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Копіювання публічних</text>
<text x="520.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">артефактів</text>
<rect x="570.0" y="75.0" width="430.0" height="36.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="785.0" y="97.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">ДЕРЕВО ІНСТАЛЯЦІЇ (Install Tree — чистий префікс)</tspan></text>
<rect x="570.0" y="120.0" width="430.0" height="210.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="187.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">&lt;prefix&gt;/ (/usr/local, /opt/mylib або vcpkg)</tspan><tspan x="785.0" dy="13.7"> ├── include/mylib/core.hpp   (CMAKE_INSTALL_INCLUDEDIR)</tspan><tspan x="785.0" dy="13.7"> ├── lib/libmylib.so          (CMAKE_INSTALL_LIBDIR)</tspan><tspan x="785.0" dy="13.7"> └── lib/cmake/MyLib/         (Метадані пакета для споживачів)</tspan><tspan x="785.0" dy="13.7">      ├── MyLibConfig.cmake         (Головний файл конфігурації)</tspan><tspan x="785.0" dy="13.7">      ├── MyLibConfigVersion.cmake  (Перевірка версій)</tspan><tspan x="785.0" dy="13.7">      └── MyLibTargets.cmake        (Імпортовані цілі MyLib::mylib)</tspan></text>
<rect x="570.0" y="340.0" width="430.0" height="105.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="785.0" y="374.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">$&lt;INSTALL_INTERFACE:...&gt;</tspan><tspan x="785.0" dy="15.0">Шлях: ${CMAKE_INSTALL_INCLUDEDIR} (include)</tspan><tspan x="785.0" dy="15.0">• Активний для зовнішніх проєктів у find_package()</tspan><tspan x="785.0" dy="15.0">• Прив'язується до динамічного префікса без жорстких шляхів</tspan></text>
<rect x="40.0" y="465.0" width="960.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="520.0" y="494.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Головний принцип: шляхи до коду розробника ніколи не повинні потрапляти у згенеровані конфіги інсталяції</tspan></text>
</svg>