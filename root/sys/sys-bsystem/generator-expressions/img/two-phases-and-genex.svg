<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві фази CMake: де обчислюються генераторні вирази</text>
<rect x="40.0" y="50.0" width="460.0" height="420.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="270.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Фаза конфігурації (Configure)</text>
<text x="270.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Читання CMakeLists.txt згори вниз</text>
<rect x="60.0" y="135.0" width="420.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="270.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Виконуються звичайні команди й змінні: set(), if(), message()</tspan></text>
<rect x="60.0" y="197.0" width="420.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="270.0" y="227.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Створюються цілі: add_library(), add_executable()</tspan></text>
<rect x="60.0" y="259.0" width="420.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="270.0" y="289.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Властивості цілей записують сирі рядки з виразами</tspan></text>
<rect x="60.0" y="321.0" width="420.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="270.0" y="350.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Multi-config генератори НЕ знають поточної конфігурації (Debug/Release)</tspan></text>
<rect x="60.0" y="383.0" width="420.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="270.0" y="413.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Точні файлові шляхи майбутніх бінарників ще не обчислені</tspan></text>
<line x1="510.0" y1="260.0" x2="550.0" y2="260.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="530.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">модель</text>
<rect x="560.0" y="50.0" width="460.0" height="420.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="790.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">2. Фаза генерації (Generate)</text>
<text x="790.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Побудова файлів збірки для Ninja, MSVC, Make</text>
<rect x="580.0" y="135.0" width="420.0" height="52.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="790.0" y="165.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Рушій обчислює генераторні вирази $&lt;...&gt; для кожної цілі</tspan></text>
<rect x="580.0" y="197.0" width="420.0" height="52.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="790.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Відома активна конфігурація: $&lt;CONFIG:Debug&gt; стає 1 або 0</tspan></text>
<rect x="580.0" y="259.0" width="420.0" height="52.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="790.0" y="288.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Відомий цільовий компілятор: $&lt;CXX_COMPILER_ID:...&gt; розгортається</tspan></text>
<rect x="580.0" y="321.0" width="420.0" height="52.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="790.0" y="351.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Обчислені абсолютні шляхи до файлів: $&lt;TARGET_FILE:tgt&gt;</tspan></text>
<rect x="580.0" y="383.0" width="420.0" height="52.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="790.0" y="413.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Запис build.ninja / .vcxproj з фінальними прапорцями</tspan></text>
<rect x="40.0" y="485.0" width="980.0" height="58.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Звичайний if() бачить лише стан під час конфігурації;</tspan><tspan x="530.0" dy="17.6">генераторний вираз $&lt;...&gt; чекає другої фази й обчислюється для кожного споживача окремо</tspan></text>
</svg>