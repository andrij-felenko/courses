<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рекурсивне обчислення вкладених генераторних виразів</text>
<text x="530.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вихідний вираз: $&lt;IF:$&lt;CONFIG:Debug&gt;,-DDEBUG_LOGS,$&lt;IF:$&lt;CONFIG:Release&gt;,-DRELEASE_OPT,-DDEFAULT&gt;&gt;</text>
<rect x="380.0" y="80.0" width="300.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Корінь: $&lt;IF: cond1 , val_true , val_false &gt;</tspan><tspan x="530.0" dy="13.0">(чекає обчислення гілок)</tspan></text>
<line x1="430.0" y1="136.0" x2="230.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="136.0" x2="530.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="630.0" y1="136.0" x2="830.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="310.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">умова 1</text>
<text x="500.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">якщо 1</text>
<text x="750.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">якщо 0</text>
<rect x="90.0" y="195.0" width="280.0" height="75.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="228.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Вузол 1: $&lt;CONFIG:Debug&gt;</tspan><tspan x="230.0" dy="16.2">Для збірки Release обчислюється в: 0</tspan></text>
<rect x="410.0" y="195.0" width="240.0" height="75.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="530.0" y="220.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Гілка True:</tspan><tspan x="530.0" dy="16.2">-DDEBUG_LOGS</tspan><tspan x="530.0" dy="16.2">(пропускається, бо умова 0)</tspan></text>
<rect x="690.0" y="195.0" width="300.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="840.0" y="228.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">Вузол 2: $&lt;IF: cond2 , opt , def &gt;</tspan><tspan x="840.0" dy="16.2">(обчислюється, бо умова 1 була 0)</tspan></text>
<line x1="740.0" y1="270.0" x2="640.0" y2="335.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="840.0" y1="270.0" x2="790.0" y2="335.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="940.0" y1="270.0" x2="940.0" y2="335.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="670.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">умова 2</text>
<text x="800.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">якщо 1</text>
<text x="920.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">якщо 0</text>
<rect x="530.0" y="335.0" width="210.0" height="65.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="635.0" y="363.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">$&lt;CONFIG:Release&gt;</tspan><tspan x="635.0" dy="16.2">Обчислюється в: 1</tspan></text>
<rect x="755.0" y="335.0" width="140.0" height="65.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="825.0" y="363.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="825.0" dy="0.0">-DRELEASE_OPT</tspan><tspan x="825.0" dy="16.2">(обрано)</tspan></text>
<rect x="910.0" y="335.0" width="120.0" height="65.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="970.0" y="363.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">-DDEFAULT</tspan><tspan x="970.0" dy="16.2">(пропущено)</tspan></text>
<line x1="790.0" y1="400.0" x2="530.0" y2="460.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="280.0" y="450.0" width="500.0" height="50.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="479.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Результат обчислення для Release:   -DRELEASE_OPT</tspan></text>
<rect x="40.0" y="515.0" width="980.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="544.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Рушій генерації обчислює листки дерева знизу вгору, згортаючи вирази у фінальний рядок</tspan></text>
</svg>