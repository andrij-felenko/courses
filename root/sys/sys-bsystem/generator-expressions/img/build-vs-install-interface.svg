<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розділення шляхів заголовків: BUILD_INTERFACE проти INSTALL_INTERFACE</text>
<rect x="60.0" y="45.0" width="940.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="58.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">target_include_directories(core PUBLIC</tspan><tspan x="530.0" dy="16.9">    $&lt;BUILD_INTERFACE:${CMAKE_CURRENT_SOURCE_DIR}/include&gt;</tspan><tspan x="530.0" dy="16.9">    $&lt;INSTALL_INTERFACE:include&gt;)</tspan></text>
<rect x="60.0" y="115.0" width="450.0" height="345.0" rx="8" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/>
<text x="285.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Локальна збірка проєкту</text>
<text x="285.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Ціль core збирається або лінкується сусідом</text>
<rect x="80.0" y="190.0" width="410.0" height="68.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="285.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="285.0" dy="0.0">$&lt;BUILD_INTERFACE:...&gt;  →  розгортається в:</tspan><tspan x="285.0" dy="16.2">/home/user/project/src/core/include</tspan></text>
<rect x="80.0" y="275.0" width="410.0" height="60.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="285.0" y="301.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">$&lt;INSTALL_INTERFACE:...&gt;  →  розгортається в:</tspan><tspan x="285.0" dy="16.2">&quot;&quot; (порожній рядок, ігнорується)</tspan></text>
<rect x="80.0" y="350.0" width="410.0" height="92.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="285.0" y="384.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Результат компілятора:</tspan><tspan x="285.0" dy="16.2">-I/home/user/project/src/core/include</tspan><tspan x="285.0" dy="16.2">Локальні сирці бачать власні заголовки</tspan></text>
<rect x="550.0" y="115.0" width="450.0" height="345.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="775.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Встановлений пакет (install / export)</text>
<text x="775.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Сторонній проєкт робить find_package(core)</text>
<rect x="570.0" y="190.0" width="410.0" height="68.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="775.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">$&lt;BUILD_INTERFACE:...&gt;  →  розгортається в:</tspan><tspan x="775.0" dy="16.2">&quot;&quot; (порожній рядок, видаляється)</tspan></text>
<rect x="570.0" y="275.0" width="410.0" height="60.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="775.0" y="301.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">$&lt;INSTALL_INTERFACE:...&gt;  →  розгортається в:</tspan><tspan x="775.0" dy="16.2">${_IMPORT_PREFIX}/include</tspan></text>
<rect x="570.0" y="350.0" width="410.0" height="92.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="775.0" y="384.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Результат в coreTargets.cmake:</tspan><tspan x="775.0" dy="16.2">-I/usr/local/include (або C:/Program Files/include)</tspan><tspan x="775.0" dy="16.2">Немає витоку шляхів розробницької машини</tspan></text>
<rect x="60.0" y="475.0" width="940.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="504.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Дуальність інтерфейсів ізолює файлову систему розробника від файлової системи кінцевого користувача</tspan></text>
</svg>