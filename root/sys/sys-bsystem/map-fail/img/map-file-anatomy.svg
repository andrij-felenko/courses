<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1021.8 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1021.8" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія Map-файлу компонувальника GNU ld</text>
<rect x="30.0" y="20.0" width="940.0" height="520.0" rx="8" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.2"/>
<text x="500.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура Linker Map файлу (GNU ld) і напрям діагностики</text>
<rect x="41.6" y="83.4" width="416.7" height="63.2" rx="6" fill="#fffbe6" stroke="#6b7280" stroke-width="1.5"/><text x="250.0" y="103.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">1. Archive Members Included</tspan><tspan x="250.0" dy="15.6">Втягнуті об'єкти зі статичних бібліотек (libc.a, libgcc.a)</tspan><tspan x="250.0" dy="15.6">Показує: який саме символ змусив лінкер підтягнути весь .o</tspan></text>
<rect x="550.0" y="83.4" width="400.0" height="63.2" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="750.0" y="103.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">2. Memory Configuration</tspan><tspan x="750.0" dy="15.6">Межі регіонів із Linker Script (FLASH, RAM, CCMRAM)</tspan><tspan x="750.0" dy="15.6">Показує: ORIGIN, LENGTH та апаратні атрибути (xr, rw)</tspan></text>
<rect x="50.0" y="228.4" width="400.0" height="63.2" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">3. Discarded Input Sections</tspan><tspan x="250.0" dy="15.6">Секції, викинуті через -Wl,--gc-sections</tspan><tspan x="250.0" dy="15.6">Показує: які функції та змінні визнано мертвим кодом</tspan></text>
<rect x="498.2" y="228.4" width="503.6" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="750.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">4. Linker Script &amp; Memory Map</tspan><tspan x="750.0" dy="15.6">Повна розкладка кожного символу за адресами VMA/LMA</tspan><tspan x="750.0" dy="15.6">Показує: точний розмір у hex/dec, падінг (*fill*) і внесок файлів</tspan></text>
<rect x="150.0" y="387.5" width="700.0" height="65.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="408.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">5. Cross Reference Table (--cref)</tspan><tspan x="500.0" dy="16.2">Таблиця перехресних посилань між символами та об'єктними файлами</tspan><tspan x="500.0" dy="16.2">Показує: де символ визначено і звідки саме його викликають у проєкті</tspan></text>
<line x1="250.0" y1="148.6" x2="250.0" y2="224.4" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="750.0" y1="148.6" x2="750.0" y2="224.4" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="750.0" y1="293.6" x2="650.0" y2="383.5" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="760.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Знайшли важкий символ</text>
<line x1="350.0" y1="383.5" x2="250.0" y2="293.6" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="240.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">Чому не викинуто?</text>
<text x="500.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">Алгоритм пошуку: Розмір у карті (4) → Хто викликав у cref (5) → Чи спрацював gc-sections (3)</text>
</svg>