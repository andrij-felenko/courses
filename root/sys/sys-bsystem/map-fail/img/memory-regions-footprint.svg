<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл секцій прошивки між Flash та SRAM</text>
<text x="520.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл секцій прошивки між енергонезалежною Flash та SRAM</text>
<rect x="40.0" y="55.0" width="430.0" height="480.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="255.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">FLASH (Енергонезалежна ROM)</text>
<text x="255.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Зберігається при вимкненні живлення</text>
<rect x="65.0" y="400.0" width="380.0" height="115.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.2"/>
<text x="255.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Переповнення: region 'FLASH' overflowed</text>
<text x="255.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Сума (.text + .rodata + .data LMA) &gt; Розмір Flash</text>
<text x="255.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Причина: важкий код бібліотек, RTTI,</text>
<text x="255.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">відсутність const у великих таблицях</text>
<rect x="570.0" y="55.0" width="430.0" height="480.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="785.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">SRAM (Оперативна пам'ять RAM)</text>
<text x="785.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Втрачається при вимкненні, швидкий доступ (rwx/rw)</text>
<rect x="595.0" y="400.0" width="380.0" height="115.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.2"/>
<text x="785.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Переповнення: region 'RAM' overflowed</text>
<text x="785.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Сума (.data VMA + .bss + Стек + Купа) &gt; Розмір RAM</text>
<text x="785.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Причина: великі нестатичні буфери,</text>
<text x="785.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">переповнення стеку, забутий const</text>
<rect x="65.0" y="127.3" width="380.0" height="45.3" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="255.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">.text (Машинний код функцій, переривання, стартап)</tspan><tspan x="255.0" dy="14.3">Розмір: десятки/сотні КБ. Лише читання (rx)</tspan></text>
<rect x="65.0" y="207.3" width="380.0" height="45.3" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="255.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">.rodata (Незмінні константи, рядки, lookup-таблиці)</tspan><tspan x="255.0" dy="14.3">Розмір: байти — десятки КБ. Лише читання (r)</tspan></text>
<rect x="65.0" y="295.2" width="380.0" height="59.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="255.0" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">.data LMA (Початкові значення змінних)</tspan><tspan x="255.0" dy="14.3">Зберігається у Flash, копіюється в RAM при старті!</tspan><tspan x="255.0" dy="14.3">Платить подвійну ціну за розмір</tspan></text>
<rect x="595.0" y="127.3" width="380.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="785.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="785.0" dy="0.0">.data VMA (Робоча копія ініціалізованих змінних)</tspan><tspan x="785.0" dy="14.3">Адреса виконання в RAM, модифікується під час роботи</tspan></text>
<rect x="590.0" y="207.3" width="389.9" height="45.3" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="785.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">.bss (Неініціалізовані статичні/глобальні змінні)</tspan><tspan x="785.0" dy="14.3">Заповнюється нулями стартап-кодом. У Flash займає 0 байтів!</tspan></text>
<rect x="595.0" y="295.2" width="380.0" height="59.6" rx="6" fill="#fffbe6" stroke="#6b7280" stroke-width="1.5"/><text x="785.0" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Купа (Heap) та Стек (Stack)</tspan><tspan x="785.0" dy="14.3">Динамічна пам'ять (malloc/new) росте вгору ↑</tspan><tspan x="785.0" dy="14.3">Стек викликів локальних змінних росте вниз ↓</tspan></text>
<text x="520.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Копіювання</text>
<text x="520.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Reset_Handler</text>
<line x1="450.0" y1="305.0" x2="590.0" y2="170.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>