<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1051.6 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1051.6" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм пошуку причини роздування пам'яті через Cross Reference Table</text>
<text x="510.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюжок розслідування: від помилки лінкера до винного рядка</text>
<rect x="47.0" y="108.4" width="206.0" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Крок 1: Симптом</tspan><tspan x="150.0" dy="15.6">region 'FLASH' overflowed</tspan><tspan x="150.0" dy="15.6">by 24188 bytes</tspan></text>
<rect x="290.0" y="100.6" width="220.0" height="78.8" rx="6" fill="#fffbe6" stroke="#6b7280" stroke-width="1.5"/><text x="400.0" y="120.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Крок 2: Memory Map</tspan><tspan x="400.0" dy="15.6">Знаходимо найбільшу секцію:</tspan><tspan x="400.0" dy="15.6">.text._dtoa_r (0x2140 байтів)</tspan><tspan x="400.0" dy="15.6">у складі libc_nano.a</tspan></text>
<rect x="550.0" y="100.6" width="240.0" height="78.8" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="670.0" y="120.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Крок 3: Розділ Cross Reference</tspan><tspan x="670.0" dy="15.6">Шукаємо символ _dtoa_r:</tspan><tspan x="670.0" dy="15.6">_dtoa_r ← vfprintf_r ← vsprintf</tspan><tspan x="670.0" dy="15.6">← sprintf (усі з libc_nano.a)</tspan></text>
<rect x="788.4" y="100.6" width="243.2" height="78.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="910.0" y="120.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">Крок 4: Точка входу</tspan><tspan x="910.0" dy="15.6">Пошук виклику sprintf:</tspan><tspan x="910.0" dy="15.6">telemetry.c:84</tspan><tspan x="910.0" dy="15.6">викликає sprintf(buf, &quot;%f&quot;, v)</tspan></text>
<line x1="255.0" y1="140.0" x2="286.0" y2="140.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="512.0" y1="140.0" x2="546.0" y2="140.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="792.0" y1="140.0" x2="784.4" y2="140.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="250.0" width="900.0" height="230.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="510.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Крок 5: Інженерне усунення причини роздування</text>
<rect x="110.0" y="321.8" width="240.0" height="76.4" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="341.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Рішення А: nano.specs</tspan><tspan x="230.0" dy="15.0">Підключити -specs=nano.specs</tspan><tspan x="230.0" dy="15.0">та вимкнути float у printf</tspan><tspan x="230.0" dy="15.0">Заощаджує: ~18–25 КБ Flash</tspan></text>
<rect x="388.6" y="321.8" width="242.9" height="76.4" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="510.0" y="341.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Рішення Б: Легкий форматер</tspan><tspan x="510.0" dy="15.0">Заміна sprintf на власну</tspan><tspan x="510.0" dy="15.0">функцію форматування (fixed-point)</tspan><tspan x="510.0" dy="15.0">Заощаджує: ~30 КБ Flash</tspan></text>
<rect x="662.0" y="321.8" width="256.0" height="76.4" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="341.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Рішення В: C++ Прапорці</tspan><tspan x="790.0" dy="15.0">Вимкнути -fno-exceptions</tspan><tspan x="790.0" dy="15.0">та -fno-rtti, прибрати зайвий vtable</tspan><tspan x="790.0" dy="15.0">Заощаджує: ~20–50 КБ Flash</tspan></text>
<line x1="910.0" y1="181.4" x2="790.0" y2="290.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="910.0" y1="181.4" x2="510.0" y2="290.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="910.0" y1="181.4" x2="230.0" y2="290.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
