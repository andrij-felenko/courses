<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія тріплета та поділ на Target і Host</text>
<text x="500.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Керування платформою, зв'язуванням CRT і генераторами коду при крос-компіляції</text>
<rect x="65.0" y="108.3" width="430.0" height="153.3" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="280.0" y="127.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Target Triplet (наприклад, arm64-android)</tspan><tspan x="280.0" dy="13.7"></tspan><tspan x="280.0" dy="13.7">VCPKG_TARGET_ARCHITECTURE = arm64</tspan><tspan x="280.0" dy="13.7">VCPKG_CMAKE_SYSTEM_NAME = Android</tspan><tspan x="280.0" dy="13.7">VCPKG_CRT_LINKAGE = dynamic</tspan><tspan x="280.0" dy="13.7">VCPKG_LIBRARY_LINKAGE = static</tspan><tspan x="280.0" dy="13.7">VCPKG_CHAINLOAD_TOOLCHAIN_FILE = ndk.toolchain.cmake</tspan><tspan x="280.0" dy="13.7"></tspan><tspan x="280.0" dy="13.7">Призначення: компіляція бібліотек для запуску</tspan><tspan x="280.0" dy="13.7">на цільовому пристрої (смартфон, SBC, сервер)</tspan></text>
<rect x="505.0" y="115.1" width="430.0" height="139.7" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="134.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Host Triplet (наприклад, x64-linux / x64-windows)</tspan><tspan x="720.0" dy="13.7"></tspan><tspan x="720.0" dy="13.7">VCPKG_TARGET_ARCHITECTURE = x64</tspan><tspan x="720.0" dy="13.7">VCPKG_CMAKE_SYSTEM_NAME = Linux (нативна)</tspan><tspan x="720.0" dy="13.7">VCPKG_CRT_LINKAGE = dynamic</tspan><tspan x="720.0" dy="13.7">VCPKG_LIBRARY_LINKAGE = dynamic</tspan><tspan x="720.0" dy="13.7"></tspan><tspan x="720.0" dy="13.7">Призначення: компіляція інструментів генерації коду,</tspan><tspan x="720.0" dy="13.7">які запускаються ПІД ЧАС ЗБІРКИ (protoc, flatc, flex)</tspan></text>
<rect x="65.0" y="315.2" width="870.0" height="59.6" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Оголошення залежності в маніфесті vcpkg.json:</tspan><tspan x="500.0" dy="14.3">{&quot;name&quot;: &quot;protobuf&quot;, &quot;host&quot;: true}  -&gt;  збирається через Host Triplet (генератор protoc)</tspan><tspan x="500.0" dy="14.3">{&quot;name&quot;: &quot;protobuf&quot;}                -&gt;  збирається через Target Triplet (бібліотека libprotobuf.a)</tspan></text>
<line x1="280.0" y1="275.0" x2="380.0" y2="315.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="720.0" y1="275.0" x2="620.0" y2="315.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="65.0" y="426.1" width="870.0" height="57.8" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Overlay Triplets (власні тріплети проєкту):</tspan><tspan x="500.0" dy="13.7">Додаються прапорцем --overlay-triplets=custom-triplets/ або через vcpkg-configuration.json</tspan><tspan x="500.0" dy="13.7">Дозволяють задавати специфічні прапорці компілятора (VCPKG_CXX_FLAGS) та кастомні крос-тулчейни</tspan></text>
</svg>