<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія та послідовність фаз portfile.cmake</text>
<text x="520.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Покроковий конвеєр збірки порту та нормалізації структури встановлення</text>
<rect x="25.0" y="85.2" width="270.0" height="59.6" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">1. Отримання коду</tspan><tspan x="160.0" dy="14.3">vcpkg_from_github / git / url</tspan><tspan x="160.0" dy="14.3">Перевірка SHA-512 хешу</tspan></text>
<rect x="385.0" y="85.2" width="270.0" height="59.6" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">2. Патчування</tspan><tspan x="520.0" dy="14.3">vcpkg_apply_patches</tspan><tspan x="520.0" dy="14.3">Виправлення CMake та крос-платформ</tspan></text>
<rect x="745.0" y="85.2" width="270.0" height="59.6" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="880.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">3. Конфігурація</tspan><tspan x="880.0" dy="14.3">vcpkg_cmake_configure</tspan><tspan x="880.0" dy="14.3">Генерація через Ninja / Triplet flags</tspan></text>
<line x1="295.0" y1="115.0" x2="385.0" y2="115.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="655.0" y1="115.0" x2="745.0" y2="115.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="880.0" y1="155.0" x2="880.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="745.0" y="245.2" width="270.0" height="59.6" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="880.0" y="264.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">4. Збірка й монтаж</tspan><tspan x="880.0" dy="14.3">vcpkg_cmake_install</tspan><tspan x="880.0" dy="14.3">Інсталяція Release + Debug у packages/</tspan></text>
<rect x="378.3" y="245.2" width="283.3" height="59.6" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="264.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">5. Нормалізація</tspan><tspan x="520.0" dy="14.3">vcpkg_cmake_config_fixup</tspan><tspan x="520.0" dy="14.3">Перенесення share/, очищення debug/include</tspan></text>
<rect x="25.0" y="245.2" width="270.0" height="59.6" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="264.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">6. Фіналізація</tspan><tspan x="160.0" dy="14.3">vcpkg_install_copyright</tspan><tspan x="160.0" dy="14.3">Копіювання ліцензії, PDB та pkgconfig</tspan></text>
<line x1="745.0" y1="275.0" x2="655.0" y2="275.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="385.0" y1="275.0" x2="295.0" y2="275.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="45.0" y="395.9" width="950.0" height="88.2" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="415.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Результат виконання portfile: ізольований каталог packages/&lt;port&gt;_&lt;triplet&gt;/</tspan><tspan x="520.0" dy="14.3">• share/&lt;port&gt;/*Config.cmake  -&gt;  гарантія роботи find_package(&lt;port&gt; CONFIG)</tspan><tspan x="520.0" dy="14.3">• include/                    -&gt;  заголовкові файли (однакові для Release і Debug)</tspan><tspan x="520.0" dy="14.3">• lib/ та debug/lib/          -&gt;  бібліотеки .lib / .a без змішування конфігурацій</tspan><tspan x="520.0" dy="14.3">• bin/ та debug/bin/          -&gt;  виконувані файли та DLL для Windows (з супутніми PDB)</tspan></text>
<line x1="160.0" y1="315.0" x2="160.0" y2="380.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>