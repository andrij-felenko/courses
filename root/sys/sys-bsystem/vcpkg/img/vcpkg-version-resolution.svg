<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель версіонування та алгоритм Minimal Version Selection (MVS)</text>
<text x="500.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Як vcpkg детерміновано обирає версії за допомогою baselines, version&gt;= та overrides</text>
<rect x="65.0" y="83.8" width="270.0" height="112.4" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="200.0" y="102.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">1. builtin-baseline</tspan><tspan x="200.0" dy="13.7">(Git commit хеш репо vcpkg)</tspan><tspan x="200.0" dy="13.7"></tspan><tspan x="200.0" dy="13.7">Встановлює початковий зріз:</tspan><tspan x="200.0" dy="13.7">fmt: 9.1.0</tspan><tspan x="200.0" dy="13.7">openssl: 3.0.8</tspan><tspan x="200.0" dy="13.7">zlib: 1.2.13</tspan></text>
<rect x="365.0" y="83.8" width="270.0" height="112.4" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="102.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">2. Обмеження: version&gt;=</tspan><tspan x="500.0" dy="13.7">(запити в vcpkg.json)</tspan><tspan x="500.0" dy="13.7"></tspan><tspan x="500.0" dy="13.7">Пакет A просить: fmt &gt;= 9.1.0</tspan><tspan x="500.0" dy="13.7">Пакет B просить: fmt &gt;= 10.0.0</tspan><tspan x="500.0" dy="13.7">Базовий зріз дає: fmt = 9.1.0</tspan><tspan x="500.0" dy="13.7">High-Water Mark обирає: 10.0.0</tspan></text>
<rect x="665.0" y="83.8" width="270.0" height="112.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="800.0" y="102.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">3. Блок overrides</tspan><tspan x="800.0" dy="13.7">(найвищий пріоритет)</tspan><tspan x="800.0" dy="13.7"></tspan><tspan x="800.0" dy="13.7">&quot;overrides&quot;: [</tspan><tspan x="800.0" dy="13.7">  {&quot;name&quot;: &quot;fmt&quot;, &quot;version&quot;: &quot;10.1.1&quot;}</tspan><tspan x="800.0" dy="13.7">]</tspan><tspan x="800.0" dy="13.7">Фіксує fmt рівно на 10.1.1</tspan></text>
<line x1="335.0" y1="140.0" x2="365.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="635.0" y1="140.0" x2="665.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="500.0" y1="210.0" x2="500.0" y2="280.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="45.0" y="328.1" width="910.0" height="73.9" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="347.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Фінальний вибір версій для побудови графа залежностей:</tspan><tspan x="500.0" dy="14.3">1. Якщо пакет є в секції 'overrides' -&gt; береться ТОЧНА версія з override (ігноруючи baseline та version&gt;=)</tspan><tspan x="500.0" dy="14.3">2. Інакше -&gt; береться максимум із (версія в baseline, максимальна з усіх version&gt;= транзитивних вимог)</tspan><tspan x="500.0" dy="14.3">3. Відсутність спонтанних оновлень (Sat-solver не шукає останню версію в інтернеті) -&gt; 100% повторюваність</tspan></text>
</svg>