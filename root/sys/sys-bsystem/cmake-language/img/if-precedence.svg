<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пріоритет операторів if()</text>
<text x="60.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">if(&lt;умова&gt;) згортає аргументи згори вниз:</text>
<rect x="60.0" y="88.0" width="880.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="115.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">1 · дужки ( … ) — усе всередині обчислюється першим</tspan></text>
<rect x="60.0" y="152.0" width="880.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="179.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">2 · унарні перевірки: DEFINED, COMMAND, TARGET, TEST, POLICY,</tspan><tspan x="500.0" dy="18.2">EXISTS, IS_DIRECTORY, IS_SYMLINK, IS_ABSOLUTE, IS_READABLE …</tspan></text>
<rect x="60.0" y="234.0" width="880.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="261.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">3 · бінарні перевірки: STREQUAL, EQUAL, VERSION_LESS, MATCHES,</tspan><tspan x="500.0" dy="18.2">IN_LIST, PATH_EQUAL, IS_NEWER_THAN …</tspan></text>
<rect x="60.0" y="316.0" width="880.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="343.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">4 · NOT</tspan></text>
<rect x="60.0" y="380.0" width="880.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="407.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">5 · AND і OR — РІВНІ між собою, зліва направо, без короткого замикання</tspan></text>
<line x1="60.0" y1="450.0" x2="940.0" y2="450.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="60.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">приклад: if(NOT A AND B OR C)</text>
<text x="60.0" y="516.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">читається як  ((NOT A) AND B) OR C  —  а не як  (NOT A) AND (B OR C)</text>
<text x="60.0" y="544.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">AND не «сильніший» за OR: обидва йдуть у порядку запису, тож дужки ставлять руками</text>
</svg>