<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ціни 1976 року: чому ознакою став час зміни, а не вміст</text>
<text x="168.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">операція</text>
<text x="565.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">час (логарифмічна шкала)</text>
<rect x="34.0" y="68.0" width="268.0" height="48.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="168.0" y="97.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="168.0" dy="0.0">обійти мітки часу</tspan></text>
<rect x="330.0" y="72.0" width="40.4" height="40.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="384.4" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">≈ мілісекунди</text>
<rect x="34.0" y="160.0" width="268.0" height="48.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="168.0" y="189.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="168.0" dy="0.0">прогешувати весь вміст</tspan></text>
<rect x="330.0" y="164.0" width="292.2" height="40.0" rx="6" fill="#fdf3e0" stroke="#b7791f" stroke-width="2.0"/>
<text x="636.2" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b7791f" text-anchor="start" font-weight="700">≈ секунда</text>
<rect x="34.0" y="252.0" width="268.0" height="48.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="168.0" y="281.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="168.0" dy="0.0">скомпілювати ОДИН файл</tspan></text>
<rect x="330.0" y="256.0" width="443.3" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="787.3" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">≈ десятки секунд</text>
<text x="490.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">мітка часу дешевша за геш на два порядки — а геш всього дерева забирав помітну частку однієї компіляції</text>
</svg>