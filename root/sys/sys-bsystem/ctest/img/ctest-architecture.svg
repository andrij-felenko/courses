<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл тестування: від CMakeLists.txt до звітів CTest</text>
<text x="530.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл тестування в CMake та CTest</text>
<text x="530.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Розділення фаз конфігурації, компіляції бінарників та оркестрації процесів</text>
<rect x="50.0" y="100.0" width="280.0" height="360.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="190.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Конфігурація (CMake)</text>
<rect x="65.0" y="148.0" width="250.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="168.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">enable_testing()</tspan><tspan x="190.0" dy="16.2">add_test(NAME ... COMMAND ...)</tspan><tspan x="190.0" dy="16.2">set_tests_properties(...)</tspan></text>
<line x1="190.0" y1="222.0" x2="190.0" y2="252.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="190.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">генерація метаданих</text>
<rect x="65.0" y="260.0" width="250.0" height="75.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="278.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Дерево CTestTestfile.cmake:</tspan><tspan x="190.0" dy="15.6">• команди запуску й аргументи</tspan><tspan x="190.0" dy="15.6">• властивості (TIMEOUT, LABELS)</tspan><tspan x="190.0" dy="15.6">• фікстури й залежності</tspan></text>
<rect x="390.0" y="100.0" width="280.0" height="360.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="530.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Компіляція (Build Tool)</text>
<rect x="405.0" y="148.0" width="250.0" height="64.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="176.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">cmake --build build</tspan><tspan x="530.0" dy="16.2">(Ninja / Make / MSBuild)</tspan></text>
<line x1="530.0" y1="222.0" x2="530.0" y2="252.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="530.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">компіляція й лінкування</text>
<rect x="405.0" y="260.0" width="250.0" height="75.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="278.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Тестові виконувані файли:</tspan><tspan x="530.0" dy="15.6">• unit_tests (GoogleTest)</tspan><tspan x="530.0" dy="15.6">• integration_tests (Catch2)</tspan><tspan x="530.0" dy="15.6">• допоміжні утиліти й скрипти</tspan></text>
<line x1="330.0" y1="300.0" x2="385.0" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="670.0" y1="300.0" x2="725.0" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="730.0" y="100.0" width="280.0" height="360.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="870.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Виконання (CTest)</text>
<rect x="745.0" y="148.0" width="250.0" height="74.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="870.0" y="165.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">ctest --test-dir build -j8</tspan><tspan x="870.0" dy="15.6">• читає CTestTestfile.cmake</tspan><tspan x="870.0" dy="15.6">• паралельно спавнить процеси</tspan><tspan x="870.0" dy="15.6">• стежить за кодами й таймаутом</tspan></text>
<line x1="870.0" y1="232.0" x2="870.0" y2="262.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="870.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">збір результатів і логів</text>
<rect x="745.0" y="270.0" width="250.0" height="75.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="870.0" y="288.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">Артефакти й звіти:</tspan><tspan x="870.0" dy="15.6">• LastTest.log (детальні логи)</tspan><tspan x="870.0" dy="15.6">• junit-report.xml (для CI/CD)</tspan><tspan x="870.0" dy="15.6">• MemoryCheck / Sanitize звіти</tspan></text>
<rect x="50.0" y="480.0" width="960.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="505.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">CMake описує тести й генерує CTestTestfile.cmake; білд-система компілює бінарники;</tspan><tspan x="530.0" dy="17.6">CTest запускає зібрані програми як окремі процеси, контролює ізоляцію, час і повернення.</tspan></text>
</svg>