<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Реєстрація тестів: статичний аналіз проти динамічного опитування</text>
<text x="530.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Реєстрація тестів GoogleTest у CMake</text>
<text x="530.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Статичний розбір вихідних файлів проти динамічного виявлення бінарником</text>
<rect x="50.0" y="100.0" width="450.0" height="340.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="275.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">gtest_add_tests (CMake Configure Time)</text>
<rect x="70.0" y="148.0" width="410.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="168.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">CMake сканує .cpp вихідники регулярними виразами</tspan><tspan x="275.0" dy="16.2">під час виконання cmake -B build.</tspan><tspan x="275.0" dy="16.2">Шукає TEST(), TEST_F(), TYPED_TEST().</tspan></text>
<line x1="275.0" y1="220.0" x2="275.0" y2="255.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="275.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">парсинг тексту</text>
<rect x="70.0" y="260.0" width="410.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="275.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Вразливості методу:</tspan><tspan x="275.0" dy="13.0">• Не бачить тестів, згенерованих C++ макросами/шаблонами</tspan><tspan x="275.0" dy="13.0">• Не бачить Value-Parameterized тестів (INSTANTIATE_TEST_SUITE_P)</tspan><tspan x="275.0" dy="13.0">• Додавання тесту в .cpp вимагає перезапуску CMake конфігурації!</tspan></text>
<text x="275.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Застарілий підхід (статичний парсинг)</text>
<rect x="560.0" y="100.0" width="450.0" height="340.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="785.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">gtest_discover_tests (Post-Build / Test Time)</text>
<rect x="580.0" y="148.0" width="410.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="168.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">CMake створює скрипт пост-збірки.</tspan><tspan x="785.0" dy="16.2">Після компіляції запускається бінарник:</tspan><tspan x="785.0" dy="16.2">./test_runner --gtest_list_tests</tspan></text>
<line x1="785.0" y1="220.0" x2="785.0" y2="255.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="785.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">динамічне опитування бінарника</text>
<rect x="580.0" y="260.0" width="410.0" height="100.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="785.0" y="295.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Переваги методу:</tspan><tspan x="785.0" dy="11.7">• 100% точний список усіх тестів (включно з параметризованими)</tspan><tspan x="785.0" dy="11.7">• Редагування .cpp не вимагає cmake конфігурації — CTest оновить список сам</tspan><tspan x="785.0" dy="11.7">• Кожен тест GoogleTest стає окремою одиницею CTest з власним логом</tspan></text>
<text x="785.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Сучасний стандарт (динамічний discovery)</text>
<rect x="50.0" y="460.0" width="960.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="485.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">gtest_add_tests парсить текст на етапі конфігурації й пропускає динамічні тести;</tspan><tspan x="530.0" dy="17.6">gtest_discover_tests опитує скомпільований бінарник і реєструє точний список тестів без перезапуску CMake.</tspan></text>
</svg>