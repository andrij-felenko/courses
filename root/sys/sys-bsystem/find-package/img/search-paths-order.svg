<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія та порядок перевірки шляхів пошуку CMake</text>
<text x="520.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пріоритет пошуку шляхів у Config Mode та командах find_*</text>
<text x="520.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">CMake перевіряє каталоги згори вниз до першого збігу:</text>
<rect x="80.0" y="86.0" width="880.0" height="54.0" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="109.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">1. Точковий корінь пакета</tspan><tspan x="520.0" dy="16.2">&lt;PackageName&gt;_ROOT (змінна CMake або оточення), &lt;PackageName&gt;_DIR</tspan></text>
<line x1="520.0" y1="140.0" x2="520.0" y2="156.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="156.0" width="880.0" height="54.0" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="179.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">2. Шляхи проєкту та розробника</tspan><tspan x="520.0" dy="16.2">CMAKE_PREFIX_PATH, CMAKE_FRAMEWORK_PATH, CMAKE_APPBUNDLE_PATH</tspan></text>
<line x1="520.0" y1="210.0" x2="520.0" y2="226.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="226.0" width="880.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="520.0" y="249.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">3. Тулчейн та менеджер пакетів</tspan><tspan x="520.0" dy="16.2">CMAKE_PREFIX_PATH від vcpkg / Conan, CMAKE_FIND_ROOT_PATH (крос-компіляція)</tspan></text>
<line x1="520.0" y1="280.0" x2="520.0" y2="296.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="296.0" width="880.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="520.0" y="319.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">4. Підказки з виклику команди</tspan><tspan x="520.0" dy="16.2">HINTS із find_package(...) / find_path(...) / find_library(...)</tspan></text>
<line x1="520.0" y1="350.0" x2="520.0" y2="366.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="366.0" width="880.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="389.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">5. Системні каталоги оточення</tspan><tspan x="520.0" dy="16.2">PATH (змінна оточення), стандартні префікси /usr/local, /usr, /opt</tspan></text>
<line x1="520.0" y1="420.0" x2="520.0" y2="436.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="436.0" width="880.0" height="54.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="459.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">6. Системні реєстри та жорсткі шляхи</tspan><tspan x="520.0" dy="16.2">Реєстр Windows (HKLM/HKCU), PATHS із виклику команди</tspan></text>
<rect x="80.0" y="526.0" width="880.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="554.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Ключ NO_DEFAULT_PATH вимикає кроки 2, 5 і 6, залишаючи лише явні HINTS та PATHS;</tspan><tspan x="520.0" dy="16.9">прапорець --debug-find у командному рядку виводить кожен перевірений каталог.</tspan></text>
</svg>