<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1065.7 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1065.7" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок завантаження файлу тулчейна під час конфігурації CMake</text>
<text x="520.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок завантаження файлу тулчейна під час конфігурації CMake</text>
<rect x="57.7" y="40.6" width="204.7" height="78.8" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="60.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">1. Запуск конфігурації</tspan><tspan x="160.0" dy="15.6">cmake -B build -S .</tspan><tspan x="160.0" dy="15.6">-DCMAKE_TOOLCHAIN_FILE=...</tspan><tspan x="160.0" dy="15.6">або через CMakePresets.json</tspan></text>
<line x1="270.0" y1="80.0" x2="360.0" y2="80.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="364.2" y="40.6" width="211.5" height="78.8" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="60.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">2. Виклик project(App C CXX)</tspan><tspan x="470.0" dy="15.6">CMake ініціалізує мови</tspan><tspan x="470.0" dy="15.6">та починає опитування</tspan><tspan x="470.0" dy="15.6">цільової платформи</tspan></text>
<line x1="580.0" y1="80.0" x2="670.0" y2="80.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.8" y="40.6" width="218.4" height="78.8" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="60.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">3. Виконання Toolchain File</tspan><tspan x="810.0" dy="15.6">Завантажується ДО тестів</tspan><tspan x="810.0" dy="15.6">Встановлює CMAKE_SYSTEM_NAME,</tspan><tspan x="810.0" dy="15.6">CMAKE_C_COMPILER, sysroot</tspan></text>
<line x1="810.0" y1="135.0" x2="810.0" y2="185.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="686.0" y="197.5" width="248.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="810.0" y="218.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">4. Визначення режиму збірки</tspan><tspan x="810.0" dy="16.2">Чи встановлено CMAKE_SYSTEM_NAME</tspan><tspan x="810.0" dy="16.2">відмінним від хост-системи?</tspan></text>
<line x1="680.0" y1="230.0" x2="520.0" y2="230.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Ні (не задано)</text>
<line x1="810.0" y1="275.0" x2="810.0" y2="325.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="885.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Так (Generic / Linux)</text>
<rect x="264.0" y="190.6" width="232.0" height="78.8" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="380.0" y="210.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Нативна збірка (Host)</tspan><tspan x="380.0" dy="15.6">CMAKE_CROSSCOMPILING = FALSE</tspan><tspan x="380.0" dy="15.6">Компілятор тестується для хоста</tspan><tspan x="380.0" dy="15.6">Пошук у стандартних /usr/lib</tspan></text>
<rect x="680.3" y="335.6" width="259.4" height="78.8" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="355.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Крос-компіляція (Target)</tspan><tspan x="810.0" dy="15.6">CMAKE_CROSSCOMPILING = TRUE</tspan><tspan x="810.0" dy="15.6">try_compile() запускається для цілі</tspan><tspan x="810.0" dy="15.6">Пошукові команди блокують хост</tspan></text>
<line x1="810.0" y1="425.0" x2="810.0" y2="460.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="380.0" y1="280.0" x2="380.0" y2="480.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="380.0" y1="480.0" x2="670.0" y2="480.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="574.3" y="456.2" width="471.4" height="47.6" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="810.0" y="476.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">5. Виконання основного тіла CMakeLists.txt</tspan><tspan x="810.0" dy="15.6">Цілі компілюються цільовим тулчейном за правилами ізоляції sysroot</tspan></text>
</svg>