<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Маршрутизація пошуку між хостом та sysroot за CMAKE_FIND_ROOT_PATH_MODE_*</text>
<text x="520.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Маршрутизація пошуку між хостом та sysroot за CMAKE_FIND_ROOT_PATH_MODE_*</text>
<rect x="73.8" y="117.5" width="212.4" height="65.0" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="138.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Команда CMake:</tspan><tspan x="180.0" dy="16.2">find_program(PROTOC protoc)</tspan><tspan x="180.0" dy="16.2">Потрібен генератор коду</tspan></text>
<rect x="80.9" y="341.2" width="198.1" height="97.5" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="361.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Команди CMake:</tspan><tspan x="180.0" dy="16.2">find_path(PNG_H png.h)</tspan><tspan x="180.0" dy="16.2">find_library(PNG_LIB png)</tspan><tspan x="180.0" dy="16.2">find_package(OpenSSL)</tspan><tspan x="180.0" dy="16.2">Потрібні цільові файли</tspan></text>
<rect x="345.8" y="118.4" width="348.3" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">CMAKE_FIND_ROOT_PATH_MODE_PROGRAM = NEVER</tspan><tspan x="520.0" dy="15.6">Правило: виконувані інструменти збірки</tspan><tspan x="520.0" dy="15.6">мають запускатися на ЦЬОМУ комп'ютері (Host CPU)</tspan></text>
<rect x="321.9" y="350.6" width="396.2" height="78.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="370.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">CMAKE_FIND_ROOT_PATH_MODE_INCLUDE = ONLY</tspan><tspan x="520.0" dy="15.6">CMAKE_FIND_ROOT_PATH_MODE_LIBRARY = ONLY</tspan><tspan x="520.0" dy="15.6">CMAKE_FIND_ROOT_PATH_MODE_PACKAGE = ONLY</tspan><tspan x="520.0" dy="15.6">Правило: заголовки й бібліотеки беруться ЛИШЕ з sysroot</tspan></text>
<line x1="300.0" y1="150.0" x2="370.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="300.0" y1="390.0" x2="350.0" y2="390.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="720.0" y="110.6" width="279.9" height="78.8" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="860.0" y="130.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Хостова система (Host OS)</tspan><tspan x="860.0" dy="15.6">Каталоги: /usr/bin, /usr/local/bin</tspan><tspan x="860.0" dy="15.6">Бінарники x86_64: виконуються на хості</tspan><tspan x="860.0" dy="15.6">Результат: /usr/bin/protoc [УСПІХ]</tspan></text>
<rect x="713.2" y="342.8" width="293.6" height="94.4" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="860.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Цільовий Sysroot (Target Root)</tspan><tspan x="860.0" dy="15.6">Шлях: CMAKE_SYSROOT = /opt/sysroot-arm64</tspan><tspan x="860.0" dy="15.6">Каталоги: /opt/sysroot-arm64/usr/include</tspan><tspan x="860.0" dy="15.6">та /opt/sysroot-arm64/usr/lib</tspan><tspan x="860.0" dy="15.6">Результат: libpng.so для ARM64 [УСПІХ]</tspan></text>
<line x1="670.0" y1="150.0" x2="720.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="690.0" y1="390.0" x2="720.0" y2="390.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="372.3" y="246.8" width="295.3" height="46.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="520.0" y="266.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">ІЗОЛЯЦІЯ: Хостові /usr/lib та /usr/include</tspan><tspan x="520.0" dy="15.0">заблоковані для пошуку (режим ONLY)</tspan></text>
<line x1="680.0" y1="270.0" x2="770.0" y2="200.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="750.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">заборонено</text>
</svg>