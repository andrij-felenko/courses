<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм адресації даних: жорсткі зміщення проти таблиці глобальних зсувів (GOT)</text>
<rect x="45.0" y="60.0" width="425.0" height="360.0" rx="8" fill="#fafbfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="257.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Пряма адресація (Non-PIC)</text>
<rect x="124.7" y="120.0" width="264.5" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="257.0" y="141.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="257.0" dy="0.0">Код: mov eax, [0x00405000]</tspan><tspan x="257.0" dy="16.9">(абсолютна адреса зашита в .text)</tspan></text>
<rect x="79.6" y="215.6" width="354.9" height="48.8" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="257.0" y="236.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="257.0" dy="0.0">Секція .text модифікується під час завантаження</tspan><tspan x="257.0" dy="16.2">(Text Relocations — сторінки пам'яті 'брудні')</tspan></text>
<rect x="92.0" y="320.6" width="330.0" height="48.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="257.0" y="341.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="257.0" dy="0.0">Неможливо розділити .text між процесами;</tspan><tspan x="257.0" dy="16.2">ASLR блокується або вимагає копіювання</tspan></text>
<line x1="257.0" y1="172.9" x2="257.0" y2="210.6" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="257.0" y1="267.4" x2="257.0" y2="315.6" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="530.0" y="60.0" width="425.0" height="360.0" rx="8" fill="#fafbfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="742.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Позиційно-незалежний код (-fPIC / -fPIE)</text>
<rect x="609.7" y="120.0" width="264.5" height="49.9" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="742.0" y="141.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="742.0" dy="0.0">Код: mov rax, [rip + offset_GOT]</tspan><tspan x="742.0" dy="16.9">(RIP-відносна адресація до слота)</tspan></text>
<rect x="589.5" y="215.6" width="305.0" height="48.8" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="742.0" y="236.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="742.0" dy="0.0">Таблиця GOT (.got у секції даних)</tspan><tspan x="742.0" dy="16.2">динамічний лінкер оновлює лише покажчики</tspan></text>
<rect x="546.0" y="320.6" width="392.0" height="48.8" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="742.0" y="341.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="742.0" dy="0.0">Секція .text лишається незмінною (Read-Only),</tspan><tspan x="742.0" dy="16.2">спільною для сотень процесів; повний захист ASLR</tspan></text>
<line x1="742.0" y1="172.9" x2="742.0" y2="210.6" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="742.0" y1="267.4" x2="742.0" y2="315.6" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>