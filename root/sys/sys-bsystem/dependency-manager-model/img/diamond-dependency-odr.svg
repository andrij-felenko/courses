<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ромбоподібний конфлікт залежностей і наслідки порушення ODR</text>
<text x="460.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Неможливість одночасного співіснування двох версій однієї бібліотеки в єдиному адресному просторі C++</text>
<rect x="373.4" y="70.0" width="173.1" height="49.9" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="460.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Головний застосунок</tspan><tspan x="460.0" dy="16.9">App (main.cpp)</tspan></text>
<rect x="154.4" y="181.2" width="191.1" height="47.6" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/><text x="250.0" y="201.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Бібліотека LibAudio</tspan><tspan x="250.0" dy="15.6">(вимагає Logger v1.2.0)</tspan></text>
<rect x="574.4" y="181.2" width="191.1" height="47.6" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/><text x="670.0" y="201.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">Бібліотека LibRender</tspan><tspan x="670.0" dy="15.6">(вимагає Logger v2.1.0)</tspan></text>
<line x1="415.0" y1="118.0" x2="290.0" y2="180.0" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="505.0" y1="118.0" x2="630.0" y2="180.0" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="171.0" y="280.9" width="157.9" height="88.2" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="250.0" y="300.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Logger v1.2.0</tspan><tspan x="250.0" dy="14.3">struct LogRecord {</tspan><tspan x="250.0" dy="14.3">  int level;   // 4 B</tspan><tspan x="250.0" dy="14.3">  char msg[64];// 64 B</tspan><tspan x="250.0" dy="14.3">}; // Total 68 B</tspan></text>
<rect x="591.0" y="273.8" width="157.9" height="102.5" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="670.0" y="293.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Logger v2.1.0</tspan><tspan x="670.0" dy="14.3">struct LogRecord {</tspan><tspan x="670.0" dy="14.3">  uint64_t ts; // 8 B</tspan><tspan x="670.0" dy="14.3">  int level;   // 4 B</tspan><tspan x="670.0" dy="14.3">  string msg;  // 32 B</tspan><tspan x="670.0" dy="14.3">}; // Total 48 B</tspan></text>
<line x1="250.0" y1="238.0" x2="250.0" y2="280.0" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="670.0" y1="238.0" x2="670.0" y2="280.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="140.0" y="400.0" width="640.0" height="100.0" rx="8" fill="#fff1f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="460.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">КАТАСТРОФА ЛІНКУВАННЯ ТА ВИКОНАННЯ (ODR VIOLATION)</text>
<text x="460.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Статичне лінкування: помилка 'duplicate symbol Logger::format(LogRecord*)' або підміна версії</text>
<text x="460.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Динамічне лінкування (ELF Interposition): застосунок виконує один екземпляр класу з хибним зміщенням полів</text>
<text x="460.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">• Наслідок: непередбачуване пошкодження пам'яті (Memory Corruption) та збій SIGSEGV під час виконання</text>
<line x1="250.0" y1="372.0" x2="340.0" y2="400.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="670.0" y1="372.0" x2="580.0" y2="400.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>