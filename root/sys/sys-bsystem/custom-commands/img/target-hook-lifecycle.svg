<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хуки життєвого циклу цілі у CMake</text>
<text x="520.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">Стадії збірки цілі та хуки add_custom_command(TARGET ...)</text>
<rect x="40.0" y="80.0" width="160.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="108.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">1. Початок збірки</tspan><tspan x="120.0" dy="15.6">Підготовка дерева</tspan></text>
<rect x="240.0" y="80.0" width="160.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="108.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">2. Компіляція</tspan><tspan x="320.0" dy="15.6">src.cpp -&gt; src.o</tspan></text>
<rect x="440.0" y="80.0" width="160.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="108.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">3. Перед лінкуванням</tspan><tspan x="520.0" dy="15.6">Усі .o готові</tspan></text>
<rect x="640.0" y="80.0" width="160.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="108.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">4. Лінкування</tspan><tspan x="720.0" dy="15.6">ld -&gt; binary.elf</tspan></text>
<rect x="840.0" y="80.0" width="160.0" height="65.0" rx="6" fill="#eafaf1" stroke="#333333" stroke-width="1.5"/><text x="920.0" y="108.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">5. Фінал</tspan><tspan x="920.0" dy="15.6">Бінарник готовий</tspan></text>
<line x1="200.0" y1="112.0" x2="240.0" y2="112.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="112.0" x2="440.0" y2="112.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="112.0" x2="640.0" y2="112.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="800.0" y1="112.0" x2="840.0" y2="112.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="185.0" width="230.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="155.0" y="212.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">PRE_BUILD</tspan><tspan x="155.0" dy="12.3"></tspan><tspan x="155.0" dy="12.3">• Працює у Visual Studio (MSVC)</tspan><tspan x="155.0" dy="12.3">• Виконується до компіляції файлів</tspan><tspan x="155.0" dy="12.3">• У Ninja/Makefile працює як PRE_LINK</tspan><tspan x="155.0" dy="12.3">  (не підходить для генерації .h!)</tspan></text>
<line x1="120.0" y1="145.0" x2="120.0" y2="185.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="390.0" y="185.0" width="260.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="212.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">PRE_LINK</tspan><tspan x="520.0" dy="12.3"></tspan><tspan x="520.0" dy="12.3">• Виконується після компіляції всіх .o,</tspan><tspan x="520.0" dy="12.3">  але перед викликом лінкера</tspan><tspan x="520.0" dy="12.3">• Вбудовування маніфестів, перевірка</tspan><tspan x="520.0" dy="12.3">  експортованих символів, генерація табл.</tspan></text>
<line x1="520.0" y1="145.0" x2="520.0" y2="185.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="770.0" y="185.0" width="230.0" height="110.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="885.0" y="213.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">POST_BUILD</tspan><tspan x="885.0" dy="11.7"></tspan><tspan x="885.0" dy="11.7">• Виконується після успішного лінкування</tspan><tspan x="885.0" dy="11.7">• Конвертація objcopy (.elf -&gt; .bin/.hex)</tspan><tspan x="885.0" dy="11.7">• Підпис бінарника кодом (codesign)</tspan><tspan x="885.0" dy="11.7">• Копіювання .dll поруч із .exe</tspan></text>
<line x1="920.0" y1="145.0" x2="920.0" y2="185.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="335.0" width="960.0" height="175.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="379.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">ПРАВИЛА ВИКОРИСТАННЯ ХУКІВ ЦІЛІ:</tspan><tspan x="520.0" dy="15.6"></tspan><tspan x="520.0" dy="15.6">1. Хуки add_custom_command(TARGET ...) ПРИВ'ЯЗАНІ ДО ЦІЛІ, а не до файлів на диску.</tspan><tspan x="520.0" dy="15.6">2. Вони не можуть замінити add_custom_command(OUTPUT ...): генератор коду .cpp/.h, запущений</tspan><tspan x="520.0" dy="15.6">   у PRE_BUILD на генераторах Ninja або Make, виконається ЗАПІЗНО — компілятор уже спробує</tspan><tspan x="520.0" dy="15.6">   прочитати відсутні файли джерел і завершиться з помилкою!</tspan><tspan x="520.0" dy="15.6">3. POST_BUILD — найнадійніший і найпоширеніший хук для вторинної обробки вже готового бінарника.</tspan></text>
</svg>