<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відстеження залежностей через DEPFILE у Ninja</text>
<text x="510.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">Відстеження неявних залежностей кодогенератора через DEPFILE</text>
<rect x="50.0" y="70.0" width="280.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="89.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Вхідні файли схеми:</tspan><tspan x="190.0" dy="15.0">• schema.dsl (відомий CMake)</tspan><tspan x="190.0" dy="15.0">• types.dsl (імпортується)</tspan><tspan x="190.0" dy="15.0">• consts.dsl (імпортується)</tspan></text>
<rect x="370.0" y="70.0" width="280.0" height="76.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="510.0" y="89.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Кастомний кодогенератор:</tspan><tspan x="510.0" dy="15.0">1. Парсить schema.dsl</tspan><tspan x="510.0" dy="15.0">2. Знаходить include/import</tspan><tspan x="510.0" dy="15.0">3. Генерує код та .d файл</tspan></text>
<rect x="690.0" y="70.0" width="280.0" height="76.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="830.0" y="97.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Артефакти генерації:</tspan><tspan x="830.0" dy="15.0">• msg.cpp + msg.h (код)</tspan><tspan x="830.0" dy="15.0">• msg.cpp.d (depfile формату Makefile)</tspan></text>
<line x1="330.0" y1="108.0" x2="370.0" y2="108.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="650.0" y1="108.0" x2="690.0" y2="108.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="150.0" y="175.0" width="720.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="197.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Вміст файлу msg.cpp.d:</tspan><tspan x="510.0" dy="15.6">msg.cpp: schema.dsl types.dsl consts.dsl</tspan><tspan x="510.0" dy="15.6">(Синтаксис Makefile: вихідний файл залежить від повного списку відкритих джерел)</tspan></text>
<line x1="830.0" y1="146.0" x2="830.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="275.0" width="920.0" height="150.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="510.0" y="307.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">ЖИТТЄВИЙ ЦИКЛ ОНОВЛЕННЯ БЕЗ ПЕРЕКОНФІГУРАЦІЇ CMAKE:</tspan><tspan x="510.0" dy="15.6"></tspan><tspan x="510.0" dy="15.6">1. Рушій збірки (Ninja) читає msg.cpp.d після першого запуску генератора</tspan><tspan x="510.0" dy="15.6">2. Залежності між msg.cpp та types.dsl/consts.dsl записуються у внутрішню базу .ninja_deps</tspan><tspan x="510.0" dy="15.6">3. Розробник змінює consts.dsl (який не згаданий у CMakeLists.txt!)</tspan><tspan x="510.0" dy="15.6">4. На наступному кроці 'ninja' виявляє mtime(consts.dsl) &gt; mtime(msg.cpp) і перезапускає генератор</tspan><tspan x="510.0" dy="15.6">5. Конфігурація CMake не потрібна — граф актуалізується миттєво під час збірки</tspan></text>
<line x1="510.0" y1="243.0" x2="510.0" y2="275.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="455.0" width="920.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="510.0" y="483.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Без DEPFILE довелося б вручну перелічувати всі імпортовані файли в DEPENDS</tspan><tspan x="510.0" dy="16.2">або запускати переконфігурацію CMake при будь-якій зміні внутрішньої структури схеми.</tspan></text>
</svg>