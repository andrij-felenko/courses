<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 606" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="606" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди потрапляє перелік залежностей після компіляції</text>
<rect x="50.0" y="62.0" width="430.0" height="478.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="265.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">ninja · deps = gcc</text>
<rect x="71.0" y="112.0" width="388.0" height="62.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="265.0" y="139.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">правило в build.ninja:</tspan><tspan x="265.0" dy="16.9">depfile = $out.d · deps = gcc</tspan></text>
<rect x="71.0" y="200.0" width="388.0" height="62.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="265.0" y="227.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">компілятор пише build/util.o.d</tspan><tspan x="265.0" dy="16.9">текстовий, живе кілька секунд</tspan></text>
<rect x="71.0" y="288.0" width="388.0" height="62.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="265.0" y="315.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">ninja розбирає його одразу</tspan><tspan x="265.0" dy="16.9">після команди — і видаляє</tspan></text>
<rect x="71.0" y="376.0" width="388.0" height="62.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="265.0" y="403.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">.ninja_deps · двійковий журнал</tspan><tspan x="265.0" dy="16.9">наступний прогін читає лише його</tspan></text>
<line x1="265.0" y1="176.0" x2="265.0" y2="196.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="265.0" y1="264.0" x2="265.0" y2="284.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="265.0" y1="352.0" x2="265.0" y2="372.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="148.6" y="476.1" width="232.9" height="47.9" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="265.0" y="496.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">на старті збірки — один файл,</tspan><tspan x="265.0" dy="16.9">один послідовний прохід</tspan></text>
<rect x="560.0" y="62.0" width="430.0" height="478.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="775.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">make · -include</text>
<rect x="581.0" y="112.0" width="388.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="775.0" y="139.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">рецепт у Makefile:</tspan><tspan x="775.0" dy="16.9">gcc -MMD -MP -MF $(@:.o=.d)</tspan></text>
<rect x="581.0" y="200.0" width="388.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="775.0" y="227.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">компілятор пише build/util.d</tspan><tspan x="775.0" dy="16.9">текстовий, лишається на диску</tspan></text>
<rect x="581.0" y="288.0" width="388.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="775.0" y="315.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">-include $(OBJ:.o=.d)</tspan><tspan x="775.0" dy="16.9">make читає всі .d як makefile</tspan></text>
<rect x="581.0" y="376.0" width="388.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="775.0" y="403.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">прочитавши, make ще й пробує</tspan><tspan x="775.0" dy="16.9">оновити кожен із них</tspan></text>
<line x1="775.0" y1="176.0" x2="775.0" y2="196.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="775.0" y1="264.0" x2="775.0" y2="284.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="775.0" y1="352.0" x2="775.0" y2="372.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="673.4" y="476.1" width="203.2" height="47.9" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="775.0" y="496.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">на старті збірки — тисячі</tspan><tspan x="775.0" dy="16.9">дрібних файлів щоразу</tspan></text>
</svg>