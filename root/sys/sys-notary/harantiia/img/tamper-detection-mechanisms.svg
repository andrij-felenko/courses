<rect x="30.0" y="52.0" width="260.0" height="38.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
<text x="160.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c2410c" text-anchor="middle" font-weight="700">1. Сенсори втручання та середовища</text>
<rect x="40.0" y="100.0" width="240.0" height="68.0" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/><text x="160.0" y="123.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Tamper Mesh / Switches</tspan><tspan x="160.0" dy="14.3">Серпантинні провідні доріжки та</tspan><tspan x="160.0" dy="14.3">мікроперемикачі розкриття корпуса</tspan></text>
<rect x="40.0" y="176.0" width="240.0" height="68.0" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/><text x="160.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">LCI &amp; Capacitive Moisture</tspan><tspan x="160.0" dy="14.3">Хімічні індикатори контакту з рідиною</tspan><tspan x="160.0" dy="14.3">та сенсорні пари виявлення конденсату</tspan></text>
<rect x="40.0" y="252.0" width="240.0" height="68.0" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/><text x="160.0" y="275.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Shock &amp; Free-Fall Sensor</tspan><tspan x="160.0" dy="14.3">3-осьовий акселерометр з апаратним</tspan><tspan x="160.0" dy="14.3">фіксатором ударів понад 50g</tspan></text>
<rect x="40.0" y="328.0" width="240.0" height="68.0" rx="6" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/><text x="160.0" y="351.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Thermal Monolithic Sensors</tspan><tspan x="160.0" dy="14.3">Кремнієві термодатчики з тригерами</tspan><tspan x="160.0" dy="14.3">перевищення максимальної T_junction</tspan></text>
<rect x="310.0" y="52.0" width="260.0" height="425.0" rx="8" fill="#f4f8fe" stroke="#2457d6" stroke-width="2.0"/>
<rect x="310.0" y="52.0" width="260.0" height="38.0" rx="8" fill="#e2edfd" stroke="#2457d6" stroke-width="1.5"/>
<text x="440.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2. Сенсори електроживлення</text>
<rect x="320.0" y="100.0" width="240.0" height="68.0" rx="6" fill="#ffffff" stroke="#c8ddfa" stroke-width="1.5"/><text x="440.0" y="123.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Overvoltage &amp; EOS Detector</tspan><tspan x="440.0" dy="14.3">Швидкодіючі компаратори фіксації</tspan><tspan x="440.0" dy="14.3">викидів напруги понад Absolute Max</tspan></text>
<rect x="320.0" y="176.0" width="240.0" height="68.0" rx="6" fill="#ffffff" stroke="#c8ddfa" stroke-width="1.5"/><text x="440.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Reverse Polarity Trigger</tspan><tspan x="440.0" dy="14.3">Апаратний моніторинг зворотної</tspan><tspan x="440.0" dy="14.3">полярності вхідного живлення</tspan></text>
<rect x="320.0" y="252.0" width="240.0" height="68.0" rx="6" fill="#ffffff" stroke="#c8ddfa" stroke-width="1.5"/><text x="440.0" y="275.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">eFuse Tripping Counter</tspan><tspan x="440.0" dy="14.3">Незворотні електронні запобіжники</tspan><tspan x="440.0" dy="14.3">зі статусом спрацювання захисту</tspan></text>
<rect x="320.0" y="328.0" width="240.0" height="68.0" rx="6" fill="#ffffff" stroke="#c8ddfa" stroke-width="1.5"/><text x="440.0" y="351.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Supply Glitch Monitors</tspan><tspan x="440.0" dy="14.3">Детектори короткочасних провалів</tspan><tspan x="440.0" dy="14.3">напруги живлення ядра процесора</tspan></text>
<rect x="590.0" y="52.0" width="350.0" height="425.0" rx="8" fill="#f4fbf7" stroke="#27ae60" stroke-width="2.0"/>
<rect x="590.0" y="52.0" width="350.0" height="38.0" rx="8" fill="#e1f5eb" stroke="#27ae60" stroke-width="1.5"/>
<text x="765.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3. Захищений контролер &amp; Black-Box EEPROM</text>
<rect x="600.0" y="100.0" width="330.0" height="68.0" rx="6" fill="#ffffff" stroke="#c3e6d5" stroke-width="1.5"/><text x="765.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">Monotonic Lifetime Timers</tspan><tspan x="765.0" dy="13.0">Незворотні апаратні лічильники мотогодин (POH) та циклів</tspan></text>
<rect x="600.0" y="176.0" width="330.0" height="68.0" rx="6" fill="#ffffff" stroke="#c3e6d5" stroke-width="1.5"/><text x="765.0" y="207.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">Violation Event Ring-Buffer</tspan><tspan x="765.0" dy="11.7">Кільцевий буфер запису подій порушення у захищену пам'ять EEPROM</tspan></text>
<rect x="600.0" y="252.0" width="330.0" height="68.0" rx="6" fill="#ffffff" stroke="#c3e6d5" stroke-width="1.5"/><text x="765.0" y="283.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">Cryptographic Tamper Seals</tspan><tspan x="765.0" dy="11.7">Обчислення HMAC-SHA256 для кожного блоку запису з апаратним ключем</tspan></text>
<rect x="600.0" y="328.0" width="330.0" height="68.0" rx="6" fill="#ffffff" stroke="#c3e6d5" stroke-width="1.5"/><text x="765.0" y="359.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">UDS / Secure Diagnostic API</tspan><tspan x="765.0" dy="11.7">Захищений протокол видачі діагностичних даних техніку з RMA-токеном</tspan></text>
<line x1="290.0" y1="172.0" x2="590.0" y2="172.0" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="570.0" y1="292.0" x2="590.0" y2="292.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="480.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Сенсорна телеметрія формує криптографічно захищений доказовий базис для об'єктивного аудиту гарантійних випадків</text>
