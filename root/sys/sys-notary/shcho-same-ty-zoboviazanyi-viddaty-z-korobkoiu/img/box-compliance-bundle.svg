<text x="250.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Застереження про відмову від гарантій (Warranty Disclaimer)</text>
