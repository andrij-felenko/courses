<text x="730.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Точні версії ядра Linux, U-Boot, BusyBox</text>
<text x="730.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Усі вендорські патчі та драйвери під копілефтом</text>
<text x="730.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Файли опису апаратури (Device Tree: .dts / .dtsi)</text>
