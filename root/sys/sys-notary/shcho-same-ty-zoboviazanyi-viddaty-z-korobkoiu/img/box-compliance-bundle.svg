<text x="730.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Makefiles, CMakeLists.txt, складальні скрипти</text>
<text x="730.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Рецепти Yocto / Buildroot для відтворення середовища</text>
<text x="730.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Точні версії тулчейна (GCC/Clang, binutils, libc)</text>
<rect x="540.0" y="398.0" width="380.0" height="76.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
