<text x="250.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Чинна щонайменше 3 роки від дати дистрибуції</text>
<text x="250.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Надається будь-якій третій особі (GPLv2 §3b)</text>
