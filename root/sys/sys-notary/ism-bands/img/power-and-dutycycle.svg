<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обмеження випромінюваної потужності EIRP та робочого циклу Duty Cycle</text>
<rect x="40.0" y="40.0" width="320.0" height="260.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="200.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Потужність випромінювання (EIRP)</text>
<rect x="60.0" y="90.0" width="120.0" height="35.0" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.0"/><text x="120.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Вихід Tx (P_tx)</tspan><tspan x="120.0" dy="13.0">напр. +14 dBm</tspan></text>
<text x="195.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">+</text>
<rect x="215.0" y="90.0" width="120.0" height="35.0" rx="6" fill="#f0fff4" stroke="#38a169" stroke-width="1.0"/><text x="275.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Антена (G_ant)</tspan><tspan x="275.0" dy="13.0">напр. +2.15 dBi</tspan></text>
<text x="200.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">− Кабель (L_cable)</text>
<line x1="200.0" y1="155.0" x2="200.0" y2="180.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="80.0" y="185.0" width="240.0" height="45.0" rx="6" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5"/><text x="200.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">EIRP = P_tx + G_ant − L_cable</tspan><tspan x="200.0" dy="14.3">Обмеження: ≤ +14 dBm (25 мВт)</tspan></text>
<rect x="60.0" y="245.0" width="280.0" height="40.0" rx="6" fill="#f8f9fa" stroke="none" stroke-width="0.0"/><text x="200.0" y="268.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="200.0" dy="0.0">Перевищення EIRP створює завади сусіднім каналам і є порушенням регламенту.</tspan></text>
<rect x="400.0" y="40.0" width="320.0" height="260.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="560.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Робочий цикл (Duty Cycle)</text>
<line x1="430.0" y1="170.0" x2="690.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="680.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Час (1 година)</text>
<rect x="450.0" y="135.0" width="12.0" height="35.0" rx="6" fill="#e53e3e" stroke="#9b2c2c" stroke-width="1.0"/>
<rect x="530.0" y="135.0" width="8.0" height="35.0" rx="6" fill="#e53e3e" stroke="#9b2c2c" stroke-width="1.0"/>
<rect x="610.0" y="135.0" width="14.0" height="35.0" rx="6" fill="#e53e3e" stroke="#9b2c2c" stroke-width="1.0"/>
<text x="456.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9b2c2c" text-anchor="middle" font-weight="700">Tx</text>
<text x="534.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9b2c2c" text-anchor="middle" font-weight="700">Tx</text>
<text x="617.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9b2c2c" text-anchor="middle" font-weight="700">Tx</text>
<rect x="430.0" y="200.0" width="260.0" height="45.0" rx="6" fill="#f7fafc" stroke="#4a5568" stroke-width="1.0"/><text x="560.0" y="219.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Duty Cycle = (Σ t_on / T_total) × 100%</tspan><tspan x="560.0" dy="11.7">Наприклад, 1% = максимум 36 с передачі на годину</tspan></text>
<rect x="420.0" y="255.0" width="280.0" height="35.0" rx="6" fill="#f8f9fa" stroke="none" stroke-width="0.0"/><text x="560.0" y="275.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="560.0" dy="0.0">Після передачі передавач МОВЧИТЬ решту часу, звільняючи ефір іншим вузлам.</tspan></text>
</svg>