<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл стану підписки: плавний перехід між пільговим періодом та блокуванням</text>
<rect x="32.5" y="115.9" width="195.0" height="88.2" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="2.0"/><text x="130.0" y="135.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">ACTIVE</tspan><tspan x="130.0" dy="14.3">(Нормальний стан)</tspan><tspan x="130.0" dy="14.3"></tspan><tspan x="130.0" dy="14.3">Повний доступ;</tspan><tspan x="130.0" dy="14.3">усі функції відкриті</tspan></text>
<rect x="292.2" y="108.8" width="195.6" height="102.5" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="2.0"/><text x="390.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">PAST DUE</tspan><tspan x="390.0" dy="14.3">(Пільговий період 7-14 днів)</tspan><tspan x="390.0" dy="14.3"></tspan><tspan x="390.0" dy="14.3">Доступ відкрито;</tspan><tspan x="390.0" dy="14.3">банери про помилку картки;</tspan><tspan x="390.0" dy="14.3">спроби повторного списання</tspan></text>
<rect x="559.1" y="108.8" width="201.8" height="102.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="660.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">RESTRICTED / SUSPENDED</tspan><tspan x="660.0" dy="14.3">(Заблоковано запис)</tspan><tspan x="660.0" dy="14.3"></tspan><tspan x="660.0" dy="14.3">Тільки читання (read-only);</tspan><tspan x="660.0" dy="14.3">створення заблоковано;</tspan><tspan x="660.0" dy="14.3">402 Payment Required на запис</tspan></text>
<rect x="822.5" y="108.8" width="195.0" height="102.5" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/><text x="920.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">CHURNED / ARCHIVED</tspan><tspan x="920.0" dy="14.3">(Деактивовано)</tspan><tspan x="920.0" dy="14.3"></tspan><tspan x="920.0" dy="14.3">Повне блокування;</tspan><tspan x="920.0" dy="14.3">збереження даних за SLA;</tspan><tspan x="920.0" dy="14.3">видалення після терміну</tspan></text>
<line x1="230.0" y1="160.0" x2="290.0" y2="160.0" stroke="#d4ac0d" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="260.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d4ac0d" text-anchor="middle">Невдалий платіж</text>
<line x1="490.0" y1="160.0" x2="560.0" y2="160.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="525.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Сплив пільговий час</text>
<line x1="760.0" y1="160.0" x2="820.0" y2="160.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="790.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Не сплачено &gt; 30д</text>
<line x1="390.0" y1="240.0" x2="200.0" y2="240.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="295.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Успішне списання (Self-heal)</text>
<line x1="660.0" y1="290.0" x2="160.0" y2="290.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="410.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Оновлення платіжних даних клієнтом</text>
<rect x="150.0" y="340.0" width="740.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="362.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Принцип м'якого згасання: збій транзакції не має ламати роботу користувача миттєво</tspan></text>
</svg>