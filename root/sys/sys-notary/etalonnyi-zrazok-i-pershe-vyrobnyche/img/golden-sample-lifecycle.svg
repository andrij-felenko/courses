<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл та регламент збереження еталонного зразка (Golden Sample)</text>
<rect x="24.0" y="65.0" width="172.0" height="170.0" rx="8" fill="#edf4fc" stroke="#2457d6" stroke-width="2.0"/>
<text x="110.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Заморожування бази</text>
<line x1="34.0" y1="99.0" x2="186.0" y2="99.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="3,2"/>
<text x="34.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Ревізія схемотехніки</text>
<text x="34.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Хеш специфікації BOM</text>
<text x="34.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Геометрія Gerber / ODB++</text>
<text x="34.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Координати CPL (X, Y, θ)</text>
<text x="34.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• SHA-256 прошивки й OTP</text>
<line x1="199.0" y1="150.0" x2="211.0" y2="150.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="214.0" y="65.0" width="172.0" height="170.0" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.0"/>
<text x="300.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#22c55e" text-anchor="middle" font-weight="700">2. Кваліфікація FAI</text>
<line x1="224.0" y1="99.0" x2="376.0" y2="99.0" stroke="#22c55e" stroke-width="1.0" stroke-dasharray="3,2"/>
<text x="224.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• AS9102 Form 1, 2, 3</text>
<text x="224.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• 100% замір геометрії</text>
<text x="224.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• 3D Рентген (BGA/QFN)</text>
<text x="224.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Мікрошліфи зрізів плат</text>
<text x="224.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Перевірка класу IPC-610</text>
<line x1="389.0" y1="150.0" x2="401.0" y2="150.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="404.0" y="65.0" width="172.0" height="170.0" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2.0"/>
<text x="490.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ca8a04" text-anchor="middle" font-weight="700">3. Зняття сигнатур</text>
<line x1="414.0" y1="99.0" x2="566.0" y2="99.0" stroke="#ca8a04" stroke-width="1.0" stroke-dasharray="3,2"/>
<text x="414.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Еталонні форми сигналів</text>
<text x="414.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Пульсації шин живлення</text>
<text x="414.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Фазовий джитер тактування</text>
<text x="414.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• ВЧ спектр і потужність</text>
<text x="414.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Профіль струмів споживання</text>
<line x1="579.0" y1="150.0" x2="591.0" y2="150.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="594.0" y="65.0" width="172.0" height="170.0" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="2.0"/>
<text x="680.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9333ea" text-anchor="middle" font-weight="700">4. Азотне сховище</text>
<line x1="604.0" y1="99.0" x2="756.0" y2="99.0" stroke="#9333ea" stroke-width="1.0" stroke-dasharray="3,2"/>
<text x="604.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Шафа з сухим азотом (N2)</text>
<text x="604.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Вологість RH &lt; 5%, 21°C</text>
<text x="604.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Пакет MBB + картка HIC</text>
<text x="604.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Пломби захисту від змін</text>
<text x="604.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Дублікати (OEM + EMS)</text>
<line x1="769.0" y1="150.0" x2="781.0" y2="150.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="784.0" y="65.0" width="172.0" height="170.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2.0"/>
<text x="870.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">5. Аудит та калібрування</text>
<line x1="794.0" y1="99.0" x2="946.0" y2="99.0" stroke="#475569" stroke-width="1.0" stroke-dasharray="3,2"/>
<text x="794.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Валідація тестерів FCT/ICT</text>
<text x="794.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Тест перед кожною зміною</text>
<text x="794.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Контроль дрейфу сенсорів</text>
<text x="794.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Планова річна переповірка</text>
<text x="794.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Журнал вилучення зразка</text>
<rect x="24.0" y="265.0" width="455.0" height="230.0" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="2.0"/>
<text x="251.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e11d48" text-anchor="middle" font-weight="700">Петля інженерних змін (ECO / ECN)</text>
<line x1="40.0" y1="305.0" x2="460.0" y2="305.0" stroke="#e11d48" stroke-width="1.0" stroke-dasharray="4,3"/>
<text x="40.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Зміна ревізії: будь-яка заміна компонентів у BOM,</text>
<text x="40.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   зміна топології PCB чи оновлення bootloader/прошивки.</text>
<text x="40.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Інвалідація: поточний Golden Sample втрачає статус</text>
<text x="40.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   еталона для нової партії продукції.</text>
<text x="40.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Delta-FAI: виконання цільової перевірки змінених вузлів</text>
<text x="40.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   та виготовлення нового комплекту Golden Sample.</text>
<text x="40.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">4. Архівування: старий зразок маркується як «Застарілий»</text>
<text x="40.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   і зберігається 10 років для сервісних рекламацій.</text>
<rect x="501.0" y="265.0" width="455.0" height="230.0" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.0"/>
<text x="728.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0d9488" text-anchor="middle" font-weight="700">Лімітні зразки (Limit Samples / Boundary Boards)</text>
<line x1="517.0" y1="305.0" x2="940.0" y2="305.0" stroke="#0d9488" stroke-width="1.0" stroke-dasharray="4,3"/>
<text x="517.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Призначення: на відміну від ідеального Golden Sample,</text>
<text x="517.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   лімітні зразки задають граничні межі допуску (Go / No-Go).</text>
<text x="517.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Візуальні дефекти: мінімально допустиме змочування</text>
<text x="517.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   припою, допустимий кут перекосу компонентів 0402.</text>
<text x="517.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. Електричні межі: плати з граничним зміщенням частоти</text>
<text x="517.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   кварца (±20 ppm) та мінімальним порогом напруги живлення.</text>
<text x="517.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">4. Налаштування AOI/AXOI: навчання оптичних алгоритмів</text>
<text x="517.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   для відсіювання хибних спрацьовувань (False Positive).</text>
</svg>