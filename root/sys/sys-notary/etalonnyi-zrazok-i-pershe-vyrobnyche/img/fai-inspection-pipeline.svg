<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр перевірки та кваліфікації першої партії (FAI AS9102 / IPC-A-610)</text>
<rect x="24.0" y="60.0" width="172.0" height="430.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.0"/>
<text x="110.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#3b82f6" text-anchor="middle" font-weight="700">Етап 1: SMT Паста</text>
<text x="110.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3D SPI Контроль</text>
<line x1="34.0" y1="109.0" x2="186.0" y2="109.0" stroke="#3b82f6" stroke-width="1.0" stroke-dasharray="3,2"/>
<text x="34.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Трафарет: товщина</text>
<text x="34.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  100–120 мкм (лазер)</text>
<text x="34.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Паста: SAC305 Type 4</text>
<text x="34.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• 3D SPI лазерний сканер:</text>
<text x="34.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  Об'єм: 100% ± 20%</text>
<text x="34.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  Висота шару: ±15 мкм</text>
<text x="34.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  Зсув відбитка &lt; 10%</text>
<text x="34.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Запобігання мікро-</text>
<text x="34.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  перемичкам і пустотам</text>
<text x="34.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Відбраковка до пайки</text>
<line x1="199.0" y1="275.0" x2="211.0" y2="275.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="214.0" y="60.0" width="172.0" height="430.0" rx="8" fill="#fdf4ff" stroke="#c026d3" stroke-width="2.0"/>
<text x="300.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c026d3" text-anchor="middle" font-weight="700">Етап 2: Pick &amp; Place</text>
<text x="300.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Монтаж і Оплавлення</text>
<line x1="224.0" y1="109.0" x2="376.0" y2="109.0" stroke="#c026d3" stroke-width="1.0" stroke-dasharray="3,2"/>
<text x="224.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Точність PnP: ±25 мкм</text>
<text x="224.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Зусилля притискання</text>
<text x="224.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  (без витіснення пасти)</text>
<text x="224.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Термопрофіль печі:</text>
<text x="224.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - Зона Soak: 150-190°C</text>
<text x="224.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - Час TAL (&gt;217°C):</text>
<text x="224.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">    45–75 секунд</text>
<text x="224.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - Пік: 235–245°C</text>
<text x="224.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - Охолодження &lt; 3°C/c</text>
<text x="224.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Запис профілю KIC</text>
<line x1="389.0" y1="275.0" x2="401.0" y2="275.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="404.0" y="60.0" width="172.0" height="430.0" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2.0"/>
<text x="490.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ca8a04" text-anchor="middle" font-weight="700">Етап 3: AOI + AXOI</text>
<text x="490.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Оптика і Рентген</text>
<line x1="414.0" y1="109.0" x2="566.0" y2="109.0" stroke="#ca8a04" stroke-width="1.0" stroke-dasharray="3,2"/>
<text x="414.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• 3D AOI (Оптика):</text>
<text x="414.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - Зсув компонентів</text>
<text x="414.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - Полярність діодів/IC</text>
<text x="414.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - Меніск припою пайки</text>
<text x="414.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• 3D AXOI (Рентген):</text>
<text x="414.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - Пустоти BGA &lt; 15%</text>
<text x="414.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - QFN thermal pad &gt; 70%</text>
<text x="414.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - Мостики під чіпами</text>
<text x="414.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Відповідність IPC-610</text>
<text x="414.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  Class 2 / Class 3</text>
<line x1="579.0" y1="275.0" x2="591.0" y2="275.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="594.0" y="60.0" width="172.0" height="430.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.0"/>
<text x="680.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">Етап 4: ICT &amp; FCT</text>
<text x="680.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Тестування схем</text>
<line x1="604.0" y1="109.0" x2="756.0" y2="109.0" stroke="#16a34a" stroke-width="1.0" stroke-dasharray="3,2"/>
<text x="604.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• ICT (Bed of Nails):</text>
<text x="604.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - КЗ та обриви ліній</text>
<text x="604.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - Номінали R, C, L</text>
<text x="604.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• JTAG Boundary Scan:</text>
<text x="604.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - BGA трасування шин</text>
<text x="604.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• FCT (Функціонал):</text>
<text x="604.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - Запис bootloader/FW</text>
<text x="604.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - Прошивка ключів OTP</text>
<text x="604.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - Замір струмів і шин</text>
<text x="604.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - Калібрування ВЧ RF</text>
<line x1="769.0" y1="275.0" x2="781.0" y2="275.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="784.0" y="60.0" width="172.0" height="430.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2.0"/>
<text x="870.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ea580c" text-anchor="middle" font-weight="700">Етап 5: AS9102 Акт</text>
<text x="870.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Статистичний звіт</text>
<line x1="794.0" y1="109.0" x2="946.0" y2="109.0" stroke="#ea580c" stroke-width="1.0" stroke-dasharray="3,2"/>
<text x="794.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Звіт AS9102:</text>
<text x="794.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - Form 1: Part Number</text>
<text x="794.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - Form 2: Сировина/BOM</text>
<text x="794.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - Form 3: Заміри ТТХ</text>
<text x="794.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Статистика стабільності:</text>
<text x="794.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - Індекс Cp ≥ 1.67</text>
<text x="794.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  - Індекс Cpk ≥ 1.33</text>
<text x="794.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Дозвіл на серію:</text>
<text x="794.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  Підпис QC, OEM та EMS</text>
</svg>