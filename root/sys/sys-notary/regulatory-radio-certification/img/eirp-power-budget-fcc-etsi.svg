<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бюджет потужності передавача та EIRP на частоті 2.4 ГГц: FCC проти ETSI</text>
<rect x="40.0" y="45.0" width="800.0" height="115.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="440.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Радіотракт випромінювача: кондуктивна потужність проти випромінюваної (EIRP)</text>
<rect x="60.0" y="85.0" width="150.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="135.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">RF Трансивер / PA</tspan><tspan x="135.0" dy="13.0">Кондуктивна потужність</tspan><tspan x="135.0" dy="13.0">P_conducted (дБм)</tspan></text>
<line x1="210.0" y1="112.0" x2="280.0" y2="112.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="280.0" y="85.0" width="150.0" height="55.0" rx="6" fill="#e2e8f0" stroke="#6b7280" stroke-width="1.5"/><text x="355.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">Фідер / Доріжка / Фільтр</tspan><tspan x="355.0" dy="11.7">Втрати у тракті</tspan><tspan x="355.0" dy="11.7">L_cable (дБ)</tspan></text>
<line x1="430.0" y1="112.0" x2="500.0" y2="112.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="500.0" y="85.0" width="140.0" height="55.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="570.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Антена виробу</tspan><tspan x="570.0" dy="13.0">Коефіцієнт підсилення</tspan><tspan x="570.0" dy="13.0">G_antenna (дБі)</tspan></text>
<line x1="640.0" y1="112.0" x2="700.0" y2="112.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="700.0" y="85.0" width="120.0" height="55.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="760.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">Ефір</tspan><tspan x="760.0" dy="13.0">EIRP (дБм / мВт)</tspan><tspan x="760.0" dy="13.0">EIRP = P + G − L</tspan></text>
<rect x="40.0" y="175.0" width="385.0" height="225.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/>
<text x="232.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">США: FCC Title 47 Part 15.247 (2.4 ГГц)</text>
<rect x="55.0" y="212.0" width="355.0" height="175.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="232.5" y="255.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="232.5" dy="0.0">• Максимальна кондуктивна потужність: 30 дБм (1.0 Вт)</tspan><tspan x="232.5" dy="11.7">• Базове підсилення антени: до 6.0 дБі</tspan><tspan x="232.5" dy="11.7">• Максимальна випромінювана потужність (EIRP):</tspan><tspan x="232.5" dy="11.7">  30 дБм + 6 дБі = 36 дБм (4.0 Вт EIRP!)</tspan><tspan x="232.5" dy="11.7"></tspan><tspan x="232.5" dy="11.7">Правило де-рейтингу (De-rating rule):</tspan><tspan x="232.5" dy="11.7">Якщо підсилення антени G &gt; 6 дБі:</tspan><tspan x="232.5" dy="11.7">  - Point-to-Multipoint: P_cond зменшується на 1 дБ за кожен 1 дБі</tspan><tspan x="232.5" dy="11.7">  - Point-to-Point: P_cond зменшується на 1 дБ на кожні 3 дБі</tspan></text>
<rect x="455.0" y="175.0" width="385.0" height="225.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
<text x="647.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ЄС: ETSI EN 300 328 / RED (2.4 ГГц)</text>
<rect x="470.0" y="212.0" width="355.0" height="175.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="647.5" y="253.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="647.5" dy="0.0">• Максимальна сумарна потужність: 20 дБм (100 мВт EIRP)</tspan><tspan x="647.5" dy="12.3">• Кондуктивна потужність НЕ нормується окремо:</tspan><tspan x="647.5" dy="12.3">  P_conducted = 20 дБм − G_antenna + L_cable</tspan><tspan x="647.5" dy="12.3">• Якщо антена має підсилення 5 дБі:</tspan><tspan x="647.5" dy="12.3">  P_conducted повинна бути ≤ 15 дБм (31.6 мВт)</tspan><tspan x="647.5" dy="12.3"></tspan><tspan x="647.5" dy="12.3">Вимога до адаптивності (LBT / CCA):</tspan><tspan x="647.5" dy="12.3">  - При потужності &gt; 10 дБм EIRP пристрій зобов'язаний</tspan><tspan x="647.5" dy="12.3">    мати адаптивний механізм доступу до ефіру</tspan></text>
</svg>