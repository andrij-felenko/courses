<text x="32.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="32.0" dy="0.0">• Звірка поточного залишку BOM на складі.</tspan><tspan x="32.0" dy="12.2">• Прогнозування річного випуску виробів.</tspan><tspan x="32.0" dy="12.2">• Оцінка резерву на гарантійний ремонт.</tspan><tspan x="32.0" dy="12.2">• Розрахунок дефіциту та бюджету LTB.</tspan></text>
