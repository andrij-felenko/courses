<text x="359.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="359.0" dy="0.0">• Оформлення NCNR-контрактів із заводом.</tspan><tspan x="359.0" dy="12.2">• Пакування за стандартом IPC/J-STD-033 (MSL).</tspan><tspan x="359.0" dy="12.2">• Сухе зберігання в азоті (N2, RH &lt; 5%).</tspan><tspan x="359.0" dy="12.2">• Контроль деградації паяності (J-STD-002).</tspan></text>
<rect x="674.0" y="418.0" width="305.0" height="165.0" rx="6" fill="#fdf2f8" stroke="#db2777" stroke-width="1.6"/>
<text x="826.5" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#be185d" text-anchor="middle" font-weight="700">3. ДЕЛЬТА-ВАЛІДАЦІЯ ТА РЕДИЗАЙН</text>
<text x="686.0" y="464.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="686.0" dy="0.0">• Пошук аналогів за критеріями FFF (Pin-to-Pin).</tspan><tspan x="686.0" dy="12.2">• Лабораторна Delta-кваліфікація (JESD47).</tspan><tspan x="686.0" dy="12.2">• Оновлення схемотехніки / перерозведення PCB.</tspan><tspan x="686.0" dy="12.2">• Повторна сертифікація EMC/Safety за потреби.</tspan></text>
