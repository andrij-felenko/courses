<text x="685.0" y="550.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="685.0" dy="0.0">• Емісія випромінювання CISPR 32</tspan><tspan x="685.0" dy="11.7">• Стійкість до ESD (IEC 61000-4-2)</tspan><tspan x="685.0" dy="11.7">• Стійкість до EFT наносекундних пачок</tspan><tspan x="685.0" dy="11.7">• Аудит файлу технічного досьє</tspan></text>
