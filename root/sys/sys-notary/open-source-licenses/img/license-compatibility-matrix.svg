<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спрямовані потоки та сумісність поєднання ліцензійних сімейств</text>
<rect x="40.0" y="70.0" width="200.0" height="80.0" rx="6" fill="#eaf5ea" stroke="#27ae60" stroke-width="1.5"/><text x="140.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">MIT / BSD-2/3 / ISC</tspan><tspan x="140.0" dy="15.6">• Дозвільні ліцензії</tspan><tspan x="140.0" dy="15.6">• Сумісні майже з усім</tspan></text>
<rect x="40.0" y="220.0" width="200.0" height="90.0" rx="6" fill="#eaf5ea" stroke="#27ae60" stroke-width="1.5"/><text x="140.0" y="247.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Apache 2.0</tspan><tspan x="140.0" dy="14.3">• Дозвільна + патентний грант</tspan><tspan x="140.0" dy="14.3">• Застереження про відсіч</tspan><tspan x="140.0" dy="14.3">• Конфлікт із GPL v2</tspan></text>
<rect x="350.0" y="70.0" width="200.0" height="80.0" rx="6" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5"/><text x="450.0" y="92.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">LGPL v2.1 / v3.0</tspan><tspan x="450.0" dy="14.3">• Слабкий копілефт</tspan><tspan x="450.0" dy="14.3">• Дозволяє пропрієтарний лінк</tspan><tspan x="450.0" dy="14.3">• Реліцензування у GPL</tspan></text>
<rect x="350.0" y="220.0" width="200.0" height="90.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="450.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">GPL v2.0-only</tspan><tspan x="450.0" dy="13.0">• Сильний копілефт (1991)</tspan><tspan x="450.0" dy="13.0">• Заборона нових обмежень (§6)</tspan><tspan x="450.0" dy="13.0">• НЕСУМІСНА з Apache 2.0</tspan></text>
<rect x="660.0" y="140.0" width="200.0" height="90.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="760.0" y="165.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">GPL v3.0-only</tspan><tspan x="760.0" dy="15.6">• Сильний копілефт (2007)</tspan><tspan x="760.0" dy="15.6">• Антитайвоізація (§6)</tspan><tspan x="760.0" dy="15.6">• СУМІСНА з Apache 2.0</tspan></text>
<rect x="660.0" y="310.0" width="200.0" height="80.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="760.0" y="332.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">AGPL v3.0</tspan><tspan x="760.0" dy="14.3">• Мережевий копілефт</tspan><tspan x="760.0" dy="14.3">• Сумісна з GPL v3 через §13</tspan><tspan x="760.0" dy="14.3">• Максимальне поглинання</tspan></text>
<line x1="140.0" y1="150.0" x2="140.0" y2="220.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="148.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">Поглинається</text>
<line x1="240.0" y1="110.0" x2="350.0" y2="110.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="295.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Дозволено</text>
<line x1="550.0" y1="110.0" x2="660.0" y2="160.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="605.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">Реліцензування</text>
<line x1="450.0" y1="150.0" x2="450.0" y2="220.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="458.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="start">§3 (GPL v2)</text>
<line x1="240.0" y1="265.0" x2="660.0" y2="195.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="450.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Сумісно: Apache 2.0 → GPL v3</text>
<line x1="240.0" y1="280.0" x2="350.0" y2="280.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,3"/>
<text x="295.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">НЕСУМІСНО ✖</text>
<text x="295.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Патентні вимоги §3</text>
<line x1="760.0" y1="230.0" x2="760.0" y2="310.0" stroke="#ea580c" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="768.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ea580c" text-anchor="start">§13 AGPL</text>
<rect x="40.0" y="380.0" width="580.0" height="70.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="330.0" y="404.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">Правило односторонньої сумісності (One-Way Compatibility):</tspan><tspan x="330.0" dy="14.3">Код під більш дозвільною ліцензією може входити до проєкту під більш суворою ліцензією,</tspan><tspan x="330.0" dy="14.3">але результуючий бінарний комбінований артефакт підпорядковується найсуворішим умовам.</tspan></text>
</svg>