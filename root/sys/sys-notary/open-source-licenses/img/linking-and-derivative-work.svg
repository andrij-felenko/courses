<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектурні межі програми та глибина поширення копілефту</text>
<rect x="40.0" y="60.0" width="400.0" height="390.0" rx="10" fill="#fff1f2" stroke="#f43f5e" stroke-width="2.0"/>
<text x="240.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Єдиний адресний простір (Похідний твір)</text>
<rect x="60.0" y="110.0" width="360.0" height="80.0" rx="6" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/><text x="240.0" y="132.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">1. Статичне компонування (.a / .o)</tspan><tspan x="240.0" dy="14.3">• Спільний файл ELF / PE</tspan><tspan x="240.0" dy="14.3">• Символи та структури склеєні лінкером</tspan><tspan x="240.0" dy="14.3">➔ Обов'язкове розкриття всього коду під GPL</tspan></text>
<rect x="60.0" y="205.0" width="360.0" height="105.0" rx="6" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/><text x="240.0" y="232.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">2. Динамічне завантаження (.so / .dll)</tspan><tspan x="240.0" dy="14.3">• DT_NEEDED, dlopen() та спільна пам'ять</tspan><tspan x="240.0" dy="14.3">• Обмін внутрішніми C/C++ структурами даних</tspan><tspan x="240.0" dy="14.3">➔ За версією FSF створює комбінований твір</tspan><tspan x="240.0" dy="14.3">(Виняток: LGPL дозволяє динамічний лінк)</tspan></text>
<rect x="60.0" y="325.0" width="360.0" height="105.0" rx="6" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/><text x="240.0" y="352.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">3. C++ Templates / Inline Headers</tspan><tspan x="240.0" dy="14.3">• Тіла функцій компілюються прямо у ваш .o</tspan><tspan x="240.0" dy="14.3">• Істотний обсяг чужого коду в бінарнику</tspan><tspan x="240.0" dy="14.3">➔ Інфікує пропрієтарний об'єктний код</tspan><tspan x="240.0" dy="14.3">(Вимагає Header-only винятків, напр. LLVM)</tspan></text>
<rect x="480.0" y="60.0" width="400.0" height="390.0" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.0"/>
<text x="680.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Розділені адресні простори (Незалежні твори)</text>
<rect x="500.0" y="110.0" width="360.0" height="80.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="680.0" y="132.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">1. UNIX Sockets / Pipes / IPC</tspan><tspan x="680.0" dy="14.3">• Окремі PID процесів у ядрі</tspan><tspan x="680.0" dy="14.3">• Серіалізований текстовий або бінарний потік</tspan><tspan x="680.0" dy="14.3">➔ Процеси залишаються юридично незалежними</tspan></text>
<rect x="500.0" y="205.0" width="360.0" height="105.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="680.0" y="232.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">2. Мережевий виклик (REST / gRPC / RPC)</tspan><tspan x="680.0" dy="14.3">• Стандартизований відкритий протокол</tspan><tspan x="680.0" dy="14.3">• Фізично незалежні сервери / мікросервіси</tspan><tspan x="680.0" dy="14.3">➔ GPL v2/v3 НЕ вимагає відкриття клієнта</tspan><tspan x="680.0" dy="14.3">(Увага: AGPL вимагає відкриття серверної частини)</tspan></text>
<rect x="500.0" y="325.0" width="360.0" height="105.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="680.0" y="352.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">3. Виклик утиліти через fork() + execve()</tspan><tspan x="680.0" dy="14.3">• Взаємодія через argv[] та stdout/stdin</tspan><tspan x="680.0" dy="14.3">• Використання як окремого інструменту ОС</tspan><tspan x="680.0" dy="14.3">➔ Не створює похідного твору (Arms-Length)</tspan><tspan x="680.0" dy="14.3">при умові загального стандарту обміну</tspan></text>
</svg>