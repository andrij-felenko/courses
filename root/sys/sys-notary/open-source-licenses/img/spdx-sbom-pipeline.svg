<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автоматизований конвеєр аудиту ліцензійної чистоти та SBOM у CI/CD</text>
<rect x="40.0" y="70.0" width="170.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="125.0" y="102.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">1. Вхідні дані</tspan><tspan x="125.0" dy="13.0">• Вихідний код git</tspan><tspan x="125.0" dy="13.0">• Залежності (conan/vcpkg)</tspan><tspan x="125.0" dy="13.0">• Бінарний образ ELF</tspan><tspan x="125.0" dy="13.0">• .comment / .note секції</tspan></text>
<rect x="250.0" y="70.0" width="180.0" height="110.0" rx="6" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5"/><text x="340.0" y="100.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">2. Сканери ліцензій</tspan><tspan x="340.0" dy="14.3">• SPDX-ідентифікатори</tspan><tspan x="340.0" dy="14.3">• Fossology / ScanCode</tspan><tspan x="340.0" dy="14.3">• DT_NEEDED парсер</tspan><tspan x="340.0" dy="14.3">• syft / trivy сканер</tspan></text>
<rect x="470.0" y="70.0" width="200.0" height="110.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="570.0" y="102.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">3. Двигун ліцензійних правил</tspan><tspan x="570.0" dy="13.0">• Парсер виразів (AND, OR, WITH)</tspan><tspan x="570.0" dy="13.0">• Матриця несумісностей</tspan><tspan x="570.0" dy="13.0">• Перевірка Allow/Deny-list</tspan><tspan x="570.0" dy="13.0">• Виявлення прихованого GPL</tspan></text>
<rect x="710.0" y="70.0" width="170.0" height="110.0" rx="6" fill="#eaf5ea" stroke="#27ae60" stroke-width="1.5"/><text x="795.0" y="100.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">4. Вихідні артефакти</tspan><tspan x="795.0" dy="14.3">• SBOM (SPDX 2.3 / 3.0)</tspan><tspan x="795.0" dy="14.3">• CycloneDX JSON</tspan><tspan x="795.0" dy="14.3">• Compliance Report</tspan><tspan x="795.0" dy="14.3">• Відкриті коди (tar.gz)</tspan></text>
<line x1="210.0" y1="125.0" x2="250.0" y2="125.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="430.0" y1="125.0" x2="470.0" y2="125.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="670.0" y1="125.0" x2="710.0" y2="125.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="220.0" width="840.0" height="190.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="460.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Критерії автоматичного блокування збірки (CI/CD Quality Gate)</text>
<rect x="60.0" y="265.0" width="380.0" height="130.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="305.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">✖ БЛОКУВАННЯ ЗБІРКИ (Gate FAILED):</tspan><tspan x="250.0" dy="14.3">• GPL/AGPL статично влінковано у комерційний образ</tspan><tspan x="250.0" dy="14.3">• Поєднання Apache 2.0 із кодом GPL-2.0-only</tspan><tspan x="250.0" dy="14.3">• Відсутня атрибуція та обов'язковий текст ліцензії</tspan><tspan x="250.0" dy="14.3">• Нерозпізнаний або невалідний вираз ліцензії</tspan></text>
<rect x="480.0" y="265.0" width="380.0" height="130.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="305.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">✔ УСПІШНИЙ ПРОХІД (Gate PASSED):</tspan><tspan x="670.0" dy="14.3">• Усі залежності входять до дозволеного списку (Allowlist)</tspan><tspan x="670.0" dy="14.3">• Для LGPL забезпечено динамічний лінк (.so)</tspan><tspan x="670.0" dy="14.3">• Згенеровано повний SBOM для технічного файлу</tspan><tspan x="670.0" dy="14.3">• Сформовано юридичний пакет ліцензій та копірайтів</tspan></text>
</svg>