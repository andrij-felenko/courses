<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія бінарного образу прошивки: кодові та не-кодові цифрові активи</text>
<rect x="40.0" y="60.0" width="260.0" height="430.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2.0"/>
<text x="170.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Образ Flash-пам'яті (ROM)</text>
<text x="170.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0x08000000 – 0x08400000 (4 МБ)</text>
<rect x="55.0" y="120.0" width="230.0" height="60.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="170.0" y="140.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Код застосунку (C/C++)</tspan><tspan x="170.0" dy="13.0">• Вектори переривань, main()</tspan><tspan x="170.0" dy="13.0">• Відкриті бібліотеки (MIT/BSD)</tspan></text>
<rect x="55.0" y="190.0" width="230.0" height="65.0" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/><text x="170.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Вендорські блоби (HAL / PHY)</tspan><tspan x="170.0" dy="13.0">• libwifi_phy.a, BLE контролер</tspan><tspan x="170.0" dy="13.0">• Закритий DSP мікрокод</tspan></text>
<rect x="55.0" y="265.0" width="230.0" height="65.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="170.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Шрифтові ресурси GUI</tspan><tspan x="170.0" dy="13.0">• Байткод TTF / OTF таблиці</tspan><tspan x="170.0" dy="13.0">• Растровий C-масив гліфів (BDF)</tspan></text>
<rect x="55.0" y="340.0" width="230.0" height="65.0" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/><text x="170.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Ваги нейромережі (Edge AI)</tspan><tspan x="170.0" dy="13.0">• INT8 тензори TFLite Micro</tspan><tspan x="170.0" dy="13.0">• Фільтри CNN та зміщення (bias)</tspan></text>
<rect x="55.0" y="415.0" width="230.0" height="60.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="170.0" y="436.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Калібрувальні таблиці й NVM</tspan><tspan x="170.0" dy="11.7">• RF LUT таблиці, підписи, сертифікати</tspan><tspan x="170.0" dy="11.7">• Таблиці поправок сенсорів</tspan></text>
<rect x="330.0" y="60.0" width="590.0" height="98.0" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/><text x="625.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">1. Вендорські блоби (HAL, DSP, Radio PHY)</tspan><tspan x="625.0" dy="13.0">• Юридична природа: пропрієтарний об'єктний код, clickwrap EULA, комерційні NDA.</tspan><tspan x="625.0" dy="13.0">• Головні ризики: пряма заборона поширення третім особам, порушення GPL при статичному лінкуванні,</tspan><tspan x="625.0" dy="13.0">  прив'язка ліцензії лише до конкретного SKU чипа (Evaluation-only застереження).</tspan></text>
<rect x="330.0" y="170.0" width="590.0" height="98.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="625.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">2. Шрифти та типографіка (Font Software vs Glyphs)</tspan><tspan x="625.0" dy="13.0">• Юридична природа: файл .ttf/.otf є комп'ютерною програмою з байткодом хінтингу (Font Software).</tspan><tspan x="625.0" dy="13.0">• Головні ризики: десктопна ліцензія забороняє вшивання у ROM пристрою (ROM Embedding License);</tspan><tspan x="625.0" dy="13.0">  SIL OFL вимагає дотримання Reserved Font Name (RFN) та забороняє продаж шрифту окремо.</tspan></text>
<rect x="330.0" y="280.0" width="590.0" height="98.0" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/><text x="625.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">3. Ваги нейромереж та параметри моделей (Model Weights &amp; Tensors)</tspan><tspan x="625.0" dy="13.0">• Юридична природа: масиви коефіцієнтів оптимізації; режим захисту даних та умов ліцензії ваг.</tspan><tspan x="625.0" dy="13.0">• Головні ризики: юридична токсичність датасету (CC BY-NC забороняє комерційний edge-випуск);</tspan><tspan x="625.0" dy="13.0">  поведінкові обмеження ліцензій OpenRAIL/RAIL (заборона військового або біометричного вжитку).</tspan></text>
<rect x="330.0" y="390.0" width="590.0" height="100.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="625.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">4. Складений не-кодовий SBOM (Multi-Layer Asset Compliance)</tspan><tspan x="625.0" dy="13.0">• Проблема: традиційні менеджери пакунків (cargo, vcpkg) бачать лише сирцевий код C/C++.</tspan><tspan x="625.0" dy="13.0">• Рішення: повна інвентаризація бінарних ресурсів через SPDX 3.0 (AIModel/Dataset) та CycloneDX 1.6</tspan><tspan x="625.0" dy="13.0">  з фіксацією SHA-256 хешів, походження датасетів, EULA-договорів та прав на вшивання.</tspan></text>
<line x1="285.0" y1="222.0" x2="330.0" y2="110.0" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="285.0" y1="297.0" x2="330.0" y2="215.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="285.0" y1="372.0" x2="330.0" y2="325.0" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>