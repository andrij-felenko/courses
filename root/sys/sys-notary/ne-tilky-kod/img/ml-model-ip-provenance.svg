<text x="475.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Експорт</text>
<text x="705.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Вшивання</text>
<rect x="40.0" y="250.0" width="860.0" height="200.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="470.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Юридичні ризики та пастки походження ваг нейромереж</text>
<rect x="60.0" y="295.0" width="260.0" height="135.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="190.0" y="334.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Пастка CC BY-NC датасетів</tspan><tspan x="190.0" dy="12.3"></tspan><tspan x="190.0" dy="12.3">Якщо базова модель тренувалася</tspan><tspan x="190.0" dy="12.3">на академічному датасеті (Non-Commercial),</tspan><tspan x="190.0" dy="12.3">комерційний реліз пристрою з цими вагами</tspan><tspan x="190.0" dy="12.3">є прямим порушенням авторських прав.</tspan></text>
<rect x="340.0" y="295.0" width="260.0" height="135.0" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/><text x="470.0" y="334.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Поведінкові ліцензії (OpenRAIL)</tspan><tspan x="470.0" dy="12.3"></tspan><tspan x="470.0" dy="12.3">Сучасні ваги часто ліцензуються під OpenRAIL.</tspan><tspan x="470.0" dy="12.3">Вони прямо забороняють використання моделі</tspan><tspan x="470.0" dy="12.3">у військовій сфері, системах стеження</tspan><tspan x="470.0" dy="12.3">чи критичній медичній діагностиці.</tspan></text>
<rect x="620.0" y="295.0" width="260.0" height="135.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="750.0" y="334.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Патентні гарантії та чистота</tspan><tspan x="750.0" dy="12.3"></tspan><tspan x="750.0" dy="12.3">Архітектура моделі може бути під Apache 2.0,</tspan><tspan x="750.0" dy="12.3">але самі ваги не мають патентного захисту.</tspan><tspan x="750.0" dy="12.3">Захист від патентних претензій на алгоритми</tspan><tspan x="750.0" dy="12.3">потребує окремого патентного клірингу.</tspan></text>
