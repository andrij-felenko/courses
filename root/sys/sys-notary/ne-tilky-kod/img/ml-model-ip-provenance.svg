<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг походження прав (IP Provenance) у машинному навчанні для мікроконтролерів</text>
<rect x="40.0" y="70.0" width="200.0" height="150.0" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/><text x="140.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">1. Навчальний датасет</tspan><tspan x="140.0" dy="13.0">(Training Dataset)</tspan><tspan x="140.0" dy="13.0"></tspan><tspan x="140.0" dy="13.0">• Зображення, аудіо, спектри</tspan><tspan x="140.0" dy="13.0">• Ліцензії: CC0, CC BY, CC BY-NC</tspan><tspan x="140.0" dy="13.0">➔ NC ліцензія блокує</tspan><tspan x="140.0" dy="13.0">   комерційне використання!</tspan></text>
<rect x="270.0" y="70.0" width="190.0" height="150.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="365.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">2. Код моделі</tspan><tspan x="365.0" dy="13.0">(Model Source)</tspan><tspan x="365.0" dy="13.0"></tspan><tspan x="365.0" dy="13.0">• PyTorch / Keras скрипти</tspan><tspan x="365.0" dy="13.0">• Описи шарів CNN, RNN</tspan><tspan x="365.0" dy="13.0">• Ліцензії: MIT, Apache 2.0,</tspan><tspan x="365.0" dy="13.0">  GPLv3 (копілефт на скрипт)</tspan></text>
<rect x="490.0" y="70.0" width="200.0" height="150.0" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/><text x="590.0" y="105.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">3. Тензори та ваги</tspan><tspan x="590.0" dy="14.3">(Model Weights .tflite)</tspan><tspan x="590.0" dy="14.3"></tspan><tspan x="590.0" dy="14.3">• INT8 коефіцієнти, зміщення</tspan><tspan x="590.0" dy="14.3">• OpenRAIL / Custom EULA</tspan><tspan x="590.0" dy="14.3">➔ Юридична токсичність</tspan><tspan x="590.0" dy="14.3">   передається від датасету</tspan></text>
<rect x="720.0" y="70.0" width="180.0" height="150.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="810.0" y="105.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">4. Рантайм інференсу</tspan><tspan x="810.0" dy="14.3">(Inference Engine)</tspan><tspan x="810.0" dy="14.3"></tspan><tspan x="810.0" dy="14.3">• TFLite Micro / ONNX RT</tspan><tspan x="810.0" dy="14.3">• C/C++ бібліотека у ROM</tspan><tspan x="810.0" dy="14.3">• Ліцензія: Apache 2.0</tspan><tspan x="810.0" dy="14.3">  (чистий дозвільний код)</tspan></text>
