<rect x="40.0" y="70.0" width="200.0" height="160.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="140.0" y="110.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Векторний шрифт</tspan><tspan x="140.0" dy="14.3">(TTF / OTF)</tspan><tspan x="140.0" dy="14.3"></tspan><tspan x="140.0" dy="14.3">• Байткод TrueType</tspan><tspan x="140.0" dy="14.3">• Криві Безьє, кернінг</tspan><tspan x="140.0" dy="14.3">• Юридично: програма</tspan><tspan x="140.0" dy="14.3">  (Font Software)</tspan></text>
