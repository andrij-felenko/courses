<rect x="748.0" y="158.0" width="144.0" height="58.0" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/><text x="820.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Десктопна EULA</tspan><tspan x="820.0" dy="12.3">• ЗАБОРОНЯЄ ROM</tspan><tspan x="820.0" dy="12.3">• Ризик позову</tspan></text>
<rect x="748.0" y="224.0" width="144.0" height="58.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="820.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">OEM Hardware</tspan><tspan x="820.0" dy="12.3">• Дорога ліцензія</tspan><tspan x="820.0" dy="12.3">• Роялті за одиницю</tspan></text>
<rect x="40.0" y="310.0" width="860.0" height="150.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="470.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключові юридичні правила роботи зі шрифтами у прошивках</text>
<rect x="60.0" y="348.0" width="260.0" height="95.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="190.0" y="378.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">1. Статус Font Software</tspan><tspan x="190.0" dy="13.7">Векторний шрифт — це виконуваний код.</tspan><tspan x="190.0" dy="13.7">Звичайна ліцензія (Desktop/Web)</tspan><tspan x="190.0" dy="13.7">не дає права вшивати бінарник у ROM.</tspan></text>
<rect x="340.0" y="348.0" width="260.0" height="95.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="470.0" y="378.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">2. Reserved Font Name (RFN)</tspan><tspan x="470.0" dy="13.7">При зміні гліфів під SIL OFL заборонено</tspan><tspan x="470.0" dy="13.7">використовувати оригінальну назву</tspan><tspan x="470.0" dy="13.7">шрифту у назві продукту та меню.</tspan></text>
<rect x="620.0" y="348.0" width="260.0" height="95.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="750.0" y="378.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">3. Растеризація та похідний твір</tspan><tspan x="750.0" dy="13.7">Конвертація TTF у растровий C-масив</tspan><tspan x="750.0" dy="13.7">часто трактується правовласниками як</tspan><tspan x="750.0" dy="13.7">похідний твір (Derivative Work).</tspan></text>
</svg>