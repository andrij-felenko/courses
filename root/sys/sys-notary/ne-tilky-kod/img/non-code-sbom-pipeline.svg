<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автоматизований конвеєр аудиту не-кодових артефактів та генерації SBOM</text>
<rect x="40.0" y="70.0" width="190.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="96.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">1. Бінарний образ</tspan><tspan x="135.0" dy="12.3">(Firmware Inputs)</tspan><tspan x="135.0" dy="12.3"></tspan><tspan x="135.0" dy="12.3">• target.elf, flash.bin</tspan><tspan x="135.0" dy="12.3">• Секції .rodata, .data</tspan><tspan x="135.0" dy="12.3">• Бінарні блоби .a / .fw</tspan><tspan x="135.0" dy="12.3">• Вшиті C-масиви ваг і шрифтів</tspan></text>
<rect x="260.0" y="70.0" width="190.0" height="120.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="355.0" y="98.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">2. Сканер сигнатур</tspan><tspan x="355.0" dy="11.7">(Asset Extractor)</tspan><tspan x="355.0" dy="11.7"></tspan><tspan x="355.0" dy="11.7">• Аналіз ентропії (блоби)</tspan><tspan x="355.0" dy="11.7">• Пошук магічних чисел TTF/TFLite</tspan><tspan x="355.0" dy="11.7">• Парсер секцій objdump/readelf</tspan><tspan x="355.0" dy="11.7">• Витяг SHA-256 та розмірів</tspan></text>
<rect x="480.0" y="70.0" width="200.0" height="120.0" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/><text x="580.0" y="98.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">3. Верифікатор ліцензій</tspan><tspan x="580.0" dy="11.7">(Policy Compliance)</tspan><tspan x="580.0" dy="11.7"></tspan><tspan x="580.0" dy="11.7">• Звірка з базою ліцензій EULA</tspan><tspan x="580.0" dy="11.7">• Перевірка прав вшивання шрифтів</tspan><tspan x="580.0" dy="11.7">• Контроль походження ML-датасетів</tspan><tspan x="580.0" dy="11.7">• Детекція заборонених NC/GPL лінків</tspan></text>
<rect x="710.0" y="70.0" width="190.0" height="120.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="805.0" y="96.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">4. Вихідні SBOM-артефакти</tspan><tspan x="805.0" dy="12.3">(Compliance Deliverables)</tspan><tspan x="805.0" dy="12.3"></tspan><tspan x="805.0" dy="12.3">• CycloneDX 1.6 (ML + Font)</tspan><tspan x="805.0" dy="12.3">• SPDX 3.0 AI Model Package</tspan><tspan x="805.0" dy="12.3">• Реєстр ліцензій для нотаріуса</tspan><tspan x="805.0" dy="12.3">• Пакунок для аудиту OEM</tspan></text>
<line x1="230.0" y1="130.0" x2="260.0" y2="130.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="450.0" y1="130.0" x2="480.0" y2="130.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="680.0" y1="130.0" x2="710.0" y2="130.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="225.0" width="860.0" height="205.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="470.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Критерії шлюзу валідації не-кодових активів (CI/CD Release Gate)</text>
<rect x="60.0" y="270.0" width="390.0" height="140.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="255.0" y="309.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">✖ БЛОКУВАННЯ РЕЛІЗУ (Gate FAILED):</tspan><tspan x="255.0" dy="13.7"></tspan><tspan x="255.0" dy="13.7">• Виявлено вшитий комерційний TTF-шрифт без OEM ROM ліцензії</tspan><tspan x="255.0" dy="13.7">• Ваги нейромережі мають походження від CC BY-NC датасету</tspan><tspan x="255.0" dy="13.7">• Вендорський HAL-блоб не має дозволу на субліцензування</tspan><tspan x="255.0" dy="13.7">• Виявлено статичне компонування GPL-коду з закритим блобом</tspan></text>
<rect x="480.0" y="270.0" width="400.0" height="140.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="312.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">✔ ДОЗВІЛ НА РЕЛІЗ (Gate PASSED):</tspan><tspan x="680.0" dy="12.3"></tspan><tspan x="680.0" dy="12.3">• Усі шрифти мають верифіковану ліцензію SIL OFL (із врахуванням RFN)</tspan><tspan x="680.0" dy="12.3">• Ваги ML навчені на дозволених комерційних датасетах (Apache/CC-BY)</tspan><tspan x="680.0" dy="12.3">• Для вендорських блобів підтверджено дистрибуційні права виробника</tspan><tspan x="680.0" dy="12.3">• Сформовано повний CycloneDX 1.6 SBOM із метаданими моделей</tspan></text>
</svg>