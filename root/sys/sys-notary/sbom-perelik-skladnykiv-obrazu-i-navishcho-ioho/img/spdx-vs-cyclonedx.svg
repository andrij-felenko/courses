<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння архітектури стандартів SPDX та CycloneDX</text>
<rect x="40.0" y="55.0" width="390.0" height="380.0" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.8"/>
<text x="235.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">SPDX 2.3 / 3.0 (Linux Foundation / ISO)</text>
<line x1="55.0" y1="96.0" x2="415.0" y2="96.0" stroke="#2563eb" stroke-width="1.0" stroke-dasharray="2,2"/>
<rect x="55.0" y="110.0" width="360.0" height="60.0" rx="6" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5"/><text x="235.0" y="137.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Первинна мета:</tspan><tspan x="235.0" dy="11.7">Юридична відповідність та аудит ліцензій (License Compliance)</tspan></text>
<rect x="55.0" y="180.0" width="360.0" height="75.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="235.0" y="201.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Модель даних:</tspan><tspan x="235.0" dy="13.0">• Пакети (SPDXID:SPDXRef-Package-...)</tspan><tspan x="235.0" dy="13.0">• Окремі файли та сніпети коду (Snippets)</tspan><tspan x="235.0" dy="13.0">• Явні типи зв'язків (DEPENDS_ON, CONTAINS)</tspan></text>
<rect x="55.0" y="265.0" width="360.0" height="75.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="235.0" y="286.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">SPDX 3.0 Профілі:</tspan><tspan x="235.0" dy="13.0">• Core, Software, Licensing, Security</tspan><tspan x="235.0" dy="13.0">• Build Profile (хеші тулчейну, вхідні файли)</tspan><tspan x="235.0" dy="13.0">• AI / Dataset Profile (ваги, датасети)</tspan></text>
<rect x="55.0" y="350.0" width="360.0" height="65.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="235.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Формати серіалізації:</tspan><tspan x="235.0" dy="13.0">JSON, Tag-Value (.spdx), YAML, RDF/XML</tspan><tspan x="235.0" dy="13.0">Стандарт ISO/IEC 5962:2021</tspan></text>
<rect x="470.0" y="55.0" width="390.0" height="380.0" rx="8" fill="#f8fafc" stroke="#27ae60" stroke-width="1.8"/>
<text x="665.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">CycloneDX 1.5 / 1.6 (OWASP Foundation)</text>
<line x1="485.0" y1="96.0" x2="845.0" y2="96.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="2,2"/>
<rect x="485.0" y="110.0" width="360.0" height="60.0" rx="6" fill="#eaf5ea" stroke="#27ae60" stroke-width="1.5"/><text x="665.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Первинна мета:</tspan><tspan x="665.0" dy="13.0">DevSecOps, аналіз вразливостей (CVE) та ланцюг постачання</tspan></text>
<rect x="485.0" y="180.0" width="360.0" height="75.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="665.0" y="201.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Модель даних:</tspan><tspan x="665.0" dy="13.0">• Компоненти (bom-ref, type: library/framework/os)</tspan><tspan x="665.0" dy="13.0">• Дерево залежностей (dependencies.ref)</tspan><tspan x="665.0" dy="13.0">• Вбудовані блоки вразливостей (vulnerabilities)</tspan></text>
<rect x="485.0" y="265.0" width="360.0" height="75.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="665.0" y="286.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Розширені можливості (BOM-сімейство):</tspan><tspan x="665.0" dy="13.0">• Вбудований VEX (статуси експлуатованості)</tspan><tspan x="665.0" dy="13.0">• HBOM (апаратний склад), CBOM (криптографія)</tspan><tspan x="665.0" dy="13.0">• SaaS-BOM (хмарні ендпоінти, API-потоки)</tspan></text>
<rect x="485.0" y="350.0" width="360.0" height="65.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="665.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Формати серіалізації:</tspan><tspan x="665.0" dy="13.0">JSON (RFC 8259), XML (XSD-валідація), Protobuf</tspan><tspan x="665.0" dy="13.0">Специфікація OWASP Flagship Standard</tspan></text>
</svg>