<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура двійкових повідомлень ASTM F3411 / Open Drone ID</text>
<rect x="40.0" y="60.0" width="200.0" height="75.0" rx="6" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.5"/><text x="140.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Байт 0: Заголовок кадру</tspan><tspan x="140.0" dy="13.0">- Msg Type (4 біти: 0x0..0xF)</tspan><tspan x="140.0" dy="13.0">- Protocol Version (4 біти)</tspan></text>
<rect x="250.0" y="60.0" width="670.0" height="75.0" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/><text x="585.0" y="93.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="585.0" dy="0.0">Байти 1..24: Корисне навантаження повідомлення (24 байти фіксованого формату)</tspan><tspan x="585.0" dy="15.6">(Дані Basic ID, Location/Vector, Authentication, Self-ID або System Data)</tspan></text>
<rect x="40.0" y="160.0" width="430.0" height="70.0" rx="6" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/><text x="255.0" y="177.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">0x0: Basic ID (Ідентифікатор апарата)</tspan><tspan x="255.0" dy="14.3">- ID Type: 1 (ANSI/CTA-2063-A), 2 (CAA), 4 (Session ID)</tspan><tspan x="255.0" dy="14.3">- UA Type: Мультиротор, Літак, Гелікоптер (0..15)</tspan><tspan x="255.0" dy="14.3">- UAS ID: 20 байтів унікального серійного номера</tspan></text>
<rect x="490.0" y="160.0" width="430.0" height="70.0" rx="6" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/><text x="705.0" y="170.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">0x1: Location / Vector (Просторові координати)</tspan><tspan x="705.0" dy="14.3">- Статус: На землі, У повітрі, Аварія (Emergency)</tspan><tspan x="705.0" dy="14.3">- Широта й довгота: int32 (масштаб 1e-7 градуса)</tspan><tspan x="705.0" dy="14.3">- Висота WGS84 та барометрична (крок 0.5 м)</tspan><tspan x="705.0" dy="14.3">- Швидкість (horiz/vert), курс, точність (HAcc/VAcc)</tspan></text>
<rect x="40.0" y="245.0" width="430.0" height="70.0" rx="6" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/><text x="255.0" y="255.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">0x2: Authentication (Цифровий підпис)</tspan><tspan x="255.0" dy="14.3">- Auth Type: 1 (UAS ID Signature), 2 (Operator Sig)</tspan><tspan x="255.0" dy="14.3">- Page Number / Last Page Index (фрагментація)</tspan><tspan x="255.0" dy="14.3">- Timestamp: UTC секунди від 01.01.2019</tspan><tspan x="255.0" dy="14.3">- Auth Data: 17 байтів фрагмента підпису ECDSA</tspan></text>
<rect x="490.0" y="245.0" width="430.0" height="70.0" rx="6" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/><text x="705.0" y="262.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">0x3: Self-ID (Текстовий опис місії)</tspan><tspan x="705.0" dy="14.3">- Description Type: 0 (Текстовий опис мети польоту)</tspan><tspan x="705.0" dy="14.3">- Text: 23 байти ASCII (наприклад, «SEARCH-RESCUE-01»)</tspan><tspan x="705.0" dy="14.3">- Застосовується для інформування оточуючих</tspan></text>
<rect x="40.0" y="330.0" width="430.0" height="70.0" rx="6" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/><text x="255.0" y="340.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">0x4: System Data (Дані оператора й зони)</tspan><tspan x="255.0" dy="14.3">- Operator Location Type: 0 (Takeoff), 1 (Live GNSS)</tspan><tspan x="255.0" dy="14.3">- Широта й довгота пілота: int32 (1e-7 градуса)</tspan><tspan x="255.0" dy="14.3">- Висота пілота WGS84, радіус групи апаратів</tspan><tspan x="255.0" dy="14.3">- Класифікація категорії ризику EASA (Open/Specific)</tspan></text>
<rect x="490.0" y="330.0" width="430.0" height="70.0" rx="6" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/><text x="705.0" y="347.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">0x5: Operator Location (Позиція пілота)</tspan><tspan x="705.0" dy="14.3">- Додатковий формат для розширених координат</tspan><tspan x="705.0" dy="14.3">- Вектор руху оператора при керуванні в русі</tspan><tspan x="705.0" dy="14.3">- Точність визначення позиції пункту керування</tspan></text>
<rect x="40.0" y="420.0" width="880.0" height="75.0" rx="6" fill="#feebc8" stroke="#dd6b20" stroke-width="1.5"/><text x="480.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">0xF: Message Pack (Пакет агрегованих повідомлень для BT5 Coded PHY та Wi-Fi Beacon)</tspan><tspan x="480.0" dy="13.0">[ Заголовок 0xF0 ] + [ Кількість Msg (1 байт) ] + [ Повідомлення 0 (25Б) ] + [ Повідомлення 1 (25Б) ] + [ Повідомлення 2 (25Б) ] ...</tspan><tspan x="480.0" dy="13.0">Дозволяє передавати Basic ID + Location + System в одному радіокадрі без втрати синхронізації</tspan></text>
</svg>