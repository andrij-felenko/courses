<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фрагментація та верифікація повідомлень автентифікації (Authentication Paging)</text>
<rect x="40.0" y="60.0" width="880.0" height="80.0" rx="6" fill="#feebc8" stroke="#dd6b20" stroke-width="1.5"/><text x="480.0" y="90.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Повний криптографічний блок автентифікації (72 байти)</tspan><tspan x="480.0" dy="13.0">[ Auth Type 1B: ECDSA P-256 ] [ Timestamp 4B: UTC Unix ] [ UAS ID Hash / Key ID 4B ] [ Цифровий підпис R (32B) + S (32B) = 64B ]</tspan><tspan x="480.0" dy="13.0">*Підписує хеш SHA-256 від поточних координат (Location), серійного номера (Basic ID) та часової мітки*</tspan></text>
<rect x="40.0" y="180.0" width="205.0" height="100.0" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/><text x="142.5" y="194.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="142.5" dy="0.0">Сторінка 0 (Page 0/3)</tspan><tspan x="142.5" dy="13.0">- Hdr: Type 0x2, Ver 1</tspan><tspan x="142.5" dy="13.0">- Auth Type: 1 (ECDSA)</tspan><tspan x="142.5" dy="13.0">- Page: 0, LastPage: 3</tspan><tspan x="142.5" dy="13.0">- Length: 72 байти</tspan><tspan x="142.5" dy="13.0">- Timestamp: 4 байти</tspan><tspan x="142.5" dy="13.0">- Дані підпису: 13 байтів</tspan></text>
<rect x="265.0" y="180.0" width="205.0" height="100.0" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/><text x="367.5" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="367.5" dy="0.0">Сторінка 1 (Page 1/3)</tspan><tspan x="367.5" dy="13.0">- Hdr: Type 0x2, Ver 1</tspan><tspan x="367.5" dy="13.0">- Auth Type: 1 (ECDSA)</tspan><tspan x="367.5" dy="13.0">- Page: 1, LastPage: 3</tspan><tspan x="367.5" dy="13.0">- Дані підпису: 23 байти</tspan><tspan x="367.5" dy="13.0">  (продовження R/S)</tspan></text>
<rect x="490.0" y="180.0" width="205.0" height="100.0" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/><text x="592.5" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="592.5" dy="0.0">Сторінка 2 (Page 2/3)</tspan><tspan x="592.5" dy="13.0">- Hdr: Type 0x2, Ver 1</tspan><tspan x="592.5" dy="13.0">- Auth Type: 1 (ECDSA)</tspan><tspan x="592.5" dy="13.0">- Page: 2, LastPage: 3</tspan><tspan x="592.5" dy="13.0">- Дані підпису: 23 байти</tspan><tspan x="592.5" dy="13.0">  (продовження R/S)</tspan></text>
<rect x="715.0" y="180.0" width="205.0" height="100.0" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/><text x="817.5" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="817.5" dy="0.0">Сторінка 3 (Page 3/3)</tspan><tspan x="817.5" dy="13.0">- Hdr: Type 0x2, Ver 1</tspan><tspan x="817.5" dy="13.0">- Auth Type: 1 (ECDSA)</tspan><tspan x="817.5" dy="13.0">- Page: 3, LastPage: 3</tspan><tspan x="817.5" dy="13.0">- Дані підпису: 13 байтів</tspan><tspan x="817.5" dy="13.0">  (залишок + Key ID)</tspan></text>
<line x1="142.0" y1="140.0" x2="142.0" y2="180.0" stroke="#dd6b20" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="367.0" y1="140.0" x2="367.0" y2="180.0" stroke="#dd6b20" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="592.0" y1="140.0" x2="592.0" y2="180.0" stroke="#dd6b20" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="817.0" y1="140.0" x2="817.0" y2="180.0" stroke="#dd6b20" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="320.0" width="880.0" height="95.0" rx="6" fill="#f0fff4" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="349.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Верифікація на приймачі (Receiver Authentication Pipeline)</tspan><tspan x="480.0" dy="14.3">1. Буферизація сторінок 0..3 протягом вікна трансляції (1-2 секунди) -&gt; Збирання єдиного блоку 72 байти</tspan><tspan x="480.0" dy="14.3">2. Перевірка свіжості часової мітки (Δt &lt; 1.0 с відносно Location Timestamp) для захисту від Replay Attack</tspan><tspan x="480.0" dy="14.3">3. Отримання публічного ключа виробника/регулятора за Key ID -&gt; Перевірка підпису ECDSA P-256 / SHA-256</tspan></text>
</svg>