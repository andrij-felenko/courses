<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура прямої цифрової ідентифікації Remote ID</text>
<rect x="40.0" y="60.0" width="240.0" height="160.0" rx="6" fill="#edf2f7" stroke="#2b6cb0" stroke-width="1.5"/><text x="160.0" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Безпілотне повітряне судно (БПС)</tspan><tspan x="160.0" dy="14.3">- Бортовий GNSS-приймач</tspan><tspan x="160.0" dy="14.3">- Політний контролер (FC)</tspan><tspan x="160.0" dy="14.3">- Модуль Direct Remote ID</tspan><tspan x="160.0" dy="14.3">- ANSI/CTA-2063-A Серійний №</tspan></text>
<rect x="40.0" y="270.0" width="240.0" height="150.0" rx="6" fill="#edf2f7" stroke="#2b6cb0" stroke-width="1.5"/><text x="160.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Пульт керування (GCS / Pilot)</tspan><tspan x="160.0" dy="15.6">- Координати оператора (WGS84)</tspan><tspan x="160.0" dy="15.6">- Номер реєстрації EASA/FAA</tspan><tspan x="160.0" dy="15.6">- Висота точки зльоту (Home)</tspan><tspan x="160.0" dy="15.6">- Телеметричний канал зв'язку</tspan></text>
<line x1="160.0" y1="270.0" x2="160.0" y2="220.0" stroke="#2b6cb0" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="165.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">Телеметрія</text>
<rect x="340.0" y="60.0" width="280.0" height="360.0" rx="6" fill="#f0fff4" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="150.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Пряме радіомовлення (Broadcast RF)</tspan><tspan x="480.0" dy="14.3">(Без встановлення з'єднання, 1-3 Гц)</tspan><tspan x="480.0" dy="14.3"></tspan><tspan x="480.0" dy="14.3">• Bluetooth 4 Legacy (0xFFFA)</tspan><tspan x="480.0" dy="14.3">  (25-байтні ADV_IND пакети)</tspan><tspan x="480.0" dy="14.3"></tspan><tspan x="480.0" dy="14.3">• Bluetooth 5 Long Range</tspan><tspan x="480.0" dy="14.3">  (Coded PHY S=8, Message Pack)</tspan><tspan x="480.0" dy="14.3"></tspan><tspan x="480.0" dy="14.3">• Wi-Fi Beacon (2.4 ГГц)</tspan><tspan x="480.0" dy="14.3">  (Vendor IE 0xDD, OUI 0xFA0BBC)</tspan><tspan x="480.0" dy="14.3"></tspan><tspan x="480.0" dy="14.3">• Wi-Fi NAN / Wi-Fi Aware</tspan><tspan x="480.0" dy="14.3">  (Action Frame / Social Ch 6, 44)</tspan></text>
<line x1="280.0" y1="140.0" x2="340.0" y2="140.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="310.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">RF ефір</text>
<rect x="680.0" y="60.0" width="240.0" height="105.0" rx="6" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.5"/><text x="800.0" y="93.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">Смартфон перехожого / пілота</tspan><tspan x="800.0" dy="15.6">- Додаток OpenDroneID</tspan><tspan x="800.0" dy="15.6">- Wi-Fi / Bluetooth скан</tspan><tspan x="800.0" dy="15.6">- Локальна візуалізація карти</tspan></text>
<rect x="680.0" y="185.0" width="240.0" height="110.0" rx="6" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.5"/><text x="800.0" y="220.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">Служби безпеки та поліція</tspan><tspan x="800.0" dy="15.6">- Стаціонарні RF-сенсори</tspan><tspan x="800.0" dy="15.6">- Миттєва пеленгація оператора</tspan><tspan x="800.0" dy="15.6">- Валідація цифрового підпису</tspan></text>
<rect x="680.0" y="315.0" width="240.0" height="105.0" rx="6" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.5"/><text x="800.0" y="351.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">Система U-Space / UTM Radar</tspan><tspan x="800.0" dy="13.0">- Злиття з даними транспондерів</tspan><tspan x="800.0" dy="13.0">- Моніторинг повітряного простору</tspan><tspan x="800.0" dy="13.0">- Виявлення конфліктів трафіку</tspan></text>
