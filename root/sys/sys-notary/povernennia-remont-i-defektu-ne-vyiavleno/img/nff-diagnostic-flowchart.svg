<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Діагностичний маршрут RMA: локалізація інтермітуючих дефектів і NFF</text>
<rect x="25.0" y="55.0" width="230.0" height="600.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="140.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">1. ВХІД І ТЕЛЕМЕТРІЯ</text>
<rect x="40.0" y="105.0" width="200.0" height="110.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="140.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Прийом виробу (RMA)</tspan><tspan x="140.0" dy="14.3">Реєстрація скарги клієнта</tspan><tspan x="140.0" dy="14.3">Візуальний огляд корпусу</tspan><tspan x="140.0" dy="14.3">Перевірка пломб та вологи</tspan></text>
<line x1="140.0" y1="215.0" x2="140.0" y2="240.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="240.0" width="200.0" height="125.0" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/><text x="140.0" y="277.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Зчитування Crash Dump</tspan><tspan x="140.0" dy="14.3">Вичитка енергонезалежної</tspan><tspan x="140.0" dy="14.3">пам'яті (FRAM / Flash)</tspan><tspan x="140.0" dy="14.3">Аналіз лічильників BOR/WDT</tspan><tspan x="140.0" dy="14.3">Скидання дампа регістрів</tspan></text>
<line x1="140.0" y1="365.0" x2="140.0" y2="390.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="390.0" width="200.0" height="110.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="140.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Стендовий статичний тест</tspan><tspan x="140.0" dy="13.0">Перевірка за 25 °C і V_nom</tspan><tspan x="140.0" dy="13.0">Базовий функціональний тест</tspan><tspan x="140.0" dy="13.0">Вимірювання струмів споживання</tspan></text>
<line x1="140.0" y1="500.0" x2="140.0" y2="525.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="525.0" width="200.0" height="105.0" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="140.0" y="559.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Початкова розвилка</tspan><tspan x="140.0" dy="14.3">Дефект є на столі?</tspan><tspan x="140.0" dy="14.3">ТАК → Прямий ремонт</tspan><tspan x="140.0" dy="14.3">НІ → Підозра на NFF/CND</tspan></text>
<line x1="240.0" y1="577.0" x2="275.0" y2="577.0" stroke="#047857" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="280.0" y="55.0" width="460.0" height="600.0" rx="8" fill="#fdf4ff" stroke="#c084fc" stroke-width="1.5"/>
<text x="510.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#581c87" text-anchor="middle" font-weight="700">2. БАГАТОФАКТОРНИЙ СТРЕС-ПРОСІВ (HALT / HASS)</text>
<rect x="300.0" y="105.0" width="420.0" height="95.0" rx="6" fill="#fae8ff" stroke="#a855f7" stroke-width="1.5"/><text x="510.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Термічний градієнт (Thermal Shock)</tspan><tspan x="510.0" dy="14.3">Швидка зміна: -40 °C ↔ +85 °C (до 60 °C/хв)</tspan><tspan x="510.0" dy="14.3">Виявлення CTE-розривів та мікротріщин BGA</tspan></text>
<line x1="510.0" y1="200.0" x2="510.0" y2="225.0" stroke="#a855f7" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="225.0" width="420.0" height="95.0" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/><text x="510.0" y="262.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Електричний марджинінг (Voltage Margining)</tspan><tspan x="510.0" dy="14.3">Коливання живлення: V_core ±10%, V_io ±5%</tspan><tspan x="510.0" dy="14.3">Перевірка часових затримок і просідання LDO</tspan></text>
<line x1="510.0" y1="320.0" x2="510.0" y2="345.0" stroke="#a855f7" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="345.0" width="420.0" height="95.0" rx="6" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/><text x="510.0" y="382.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Широкосмугова вібрація (6-DOF Vibration)</tspan><tspan x="510.0" dy="14.3">Псевдовипадкова вібрація 10–2000 Гц (до 20 Grms)</tspan><tspan x="510.0" dy="14.3">Фретинг-корозія та деградація роз'ємів</tspan></text>
<line x1="510.0" y1="440.0" x2="510.0" y2="465.0" stroke="#a855f7" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="465.0" width="420.0" height="95.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="510.0" y="502.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Граничне навантаження шин (Bus Saturation)</tspan><tspan x="510.0" dy="14.3">100% навантаження DMA, SPI, PCIe, eMMC</tspan><tspan x="510.0" dy="14.3">Виявлення збоїв синхронізації та джиттеру</tspan></text>
<line x1="720.0" y1="272.0" x2="765.0" y2="272.0" stroke="#db2777" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="720.0" y1="512.0" x2="765.0" y2="512.0" stroke="#7c3aed" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="770.0" y="55.0" width="245.0" height="600.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="892.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">3. КЛАСИФІКАЦІЯ Й ДІЯ</text>
<rect x="785.0" y="115.0" width="215.0" height="120.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="892.5" y="150.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="892.5" dy="0.0">ДЕФЕКТ СПРОВОКОВАНО</tspan><tspan x="892.5" dy="14.3">Локалізовано збій BGA,</tspan><tspan x="892.5" dy="14.3">деградацію LDO/MLCC</tspan><tspan x="892.5" dy="14.3">або race condition</tspan><tspan x="892.5" dy="14.3">Шлях: Компонентний ремонт</tspan></text>
<line x1="892.0" y1="235.0" x2="892.0" y2="275.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="785.0" y="275.0" width="215.0" height="140.0" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/><text x="892.5" y="320.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="892.5" dy="0.0">8D / CAPA АНАЛІЗ</tspan><tspan x="892.5" dy="14.3">Оновлення трасування PCB</tspan><tspan x="892.5" dy="14.3">Корекція профілю паяння</tspan><tspan x="892.5" dy="14.3">Патч таймінгів прошивки</tspan><tspan x="892.5" dy="14.3">Зниження рівня повернень</tspan></text>
<line x1="892.0" y1="415.0" x2="892.0" y2="455.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="785.0" y="455.0" width="215.0" height="175.0" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="892.5" y="503.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="892.5" dy="0.0">ІСТИННИЙ NFF / CND</tspan><tspan x="892.5" dy="14.3">Дефект не проявився за</tspan><tspan x="892.5" dy="14.3">всіх стрес-границь HALT</tspan><tspan x="892.5" dy="14.3">1. Перевірка кабелів клієнта</tspan><tspan x="892.5" dy="14.3">2. Оновлення прошивки</tspan><tspan x="892.5" dy="14.3">3. Встановлення логера</tspan><tspan x="892.5" dy="14.3">4. Карантин або повернення</tspan></text>
</svg>