<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія сертифікаційного досьє: Публічна декларація та Технічний файл</text>
<rect x="40.0" y="55.0" width="880.0" height="150.0" rx="8" fill="#edf4fc" stroke="#2457d6" stroke-width="2.0"/>
<text x="60.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">ПУБЛІЧНИЙ РІВЕНЬ: Декларація відповідності (EU Declaration of Conformity — DoC)</text>
<text x="60.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">1–2 сторінки • Юридично обов'язковий документ під одноосібну відповідальність керівника</text>
<rect x="55.0" y="115.0" width="200.0" height="75.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="155.0" y="134.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Ідентифікація виробу</tspan><tspan x="155.0" dy="14.3">Модель, тип, артикул,</tspan><tspan x="155.0" dy="14.3">серійний номер/партія,</tspan><tspan x="155.0" dy="14.3">фото та опис призначення</tspan></text>
<rect x="270.0" y="115.0" width="200.0" height="75.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="370.0" y="134.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Виробник / Представник</tspan><tspan x="370.0" dy="14.3">Юридична назва компанії,</tspan><tspan x="370.0" dy="14.3">офіційна адреса в ЄС,</tspan><tspan x="370.0" dy="14.3">заява про відповідальність</tspan></text>
<rect x="485.0" y="115.0" width="200.0" height="75.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="585.0" y="134.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Директиви та Стандарти</tspan><tspan x="585.0" dy="14.3">Перелік (RED, LVD, EMC, RoHS)</tspan><tspan x="585.0" dy="14.3">та точні версії стандартів</tspan><tspan x="585.0" dy="14.3">(EN 300 328, EN 62368-1)</tspan></text>
<rect x="700.0" y="115.0" width="200.0" height="75.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="800.0" y="138.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Підпис і Нотифікація</tspan><tspan x="800.0" dy="11.7">Сертифікат Notified Body (якщо є),</tspan><tspan x="800.0" dy="11.7">ПІБ, посада (CEO/CTO),</tspan><tspan x="800.0" dy="11.7">дата, місце та підпис</tspan></text>
<line x1="40.0" y1="225.0" x2="920.0" y2="225.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="6,4"/>
<text x="480.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">▼  DoC спирається на внутрішній інженерний масив доказів  ▼</text>
<rect x="40.0" y="245.0" width="880.0" height="255.0" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2.0"/>
<text x="60.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e293b" text-anchor="start" font-weight="700">ВНУТРІШНІЙ РІВЕНЬ: Технічний файл (Technical Documentation File — TDF)</text>
<text x="60.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">50–300+ сторінок • Конфіденційне досьє інженерних розрахунків, схем, протоколів випробувань та оцінки ризиків</text>
<rect x="55.0" y="305.0" width="200.0" height="175.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="155.0" y="360.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">1. Схеми й Архітектура</tspan><tspan x="155.0" dy="14.3">• Принципові схеми (SCH)</tspan><tspan x="155.0" dy="14.3">• Топологія плат (Gerber)</tspan><tspan x="155.0" dy="14.3">• Специфікація BOM</tspan><tspan x="155.0" dy="14.3">• Блок-схеми та опис роботи</tspan><tspan x="155.0" dy="14.3">• Версії прошивки/HW</tspan></text>
<rect x="270.0" y="305.0" width="200.0" height="175.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="370.0" y="360.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">2. Оцінка ризиків</tspan><tspan x="370.0" dy="14.3">• Матриця ризиків (ISO 12100)</tspan><tspan x="370.0" dy="14.3">• Електробезпека (EN 62368-1)</tspan><tspan x="370.0" dy="14.3">• Тепловий розгін батареї</tspan><tspan x="370.0" dy="14.3">• Вплив випромінення (SAR)</tspan><tspan x="370.0" dy="14.3">• Заходи зниження ризиків</tspan></text>
<rect x="485.0" y="305.0" width="200.0" height="175.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="585.0" y="363.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">3. Протоколи випробувань</tspan><tspan x="585.0" dy="13.0">• Лабораторія ISO 17025</tspan><tspan x="585.0" dy="13.0">• Радіоспектр (RED 3.2)</tspan><tspan x="585.0" dy="13.0">• ЕМС завади й стійкість (3.1b)</tspan><tspan x="585.0" dy="13.0">• Електробезпека (3.1a)</tspan><tspan x="585.0" dy="13.0">• Хім. склад RoHS (EN 63000)</tspan></text>
<rect x="700.0" y="305.0" width="200.0" height="175.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="800.0" y="360.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">4. Експлуатація та контроль</tspan><tspan x="800.0" dy="14.3">• Інструкція користувача</tspan><tspan x="800.0" dy="14.3">• Попередження безпеки</tspan><tspan x="800.0" dy="14.3">• Креслення маркування CE</tspan><tspan x="800.0" dy="14.3">• Журнал змін (ECO)</tspan><tspan x="800.0" dy="14.3">• Процедури контролю якості</tspan></text>
</svg>