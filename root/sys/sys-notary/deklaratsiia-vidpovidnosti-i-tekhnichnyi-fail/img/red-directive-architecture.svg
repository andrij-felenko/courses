<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Суттєві вимоги Директиви RED 2014/53/EU для бездротових пристроїв</text>
<rect x="340.0" y="200.0" width="280.0" height="95.0" rx="8" fill="#edf4fc" stroke="#2457d6" stroke-width="2.5"/>
<text x="480.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Радіообладнання (RED)</text>
<text x="480.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Поглинає вимоги LVD та EMC;</text>
<text x="480.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Діє без нижньої межі напруги</text>
<rect x="40.0" y="65.0" width="270.0" height="130.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="175.0" y="103.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Стаття 3.1(a): Здоров'я та Безпека</tspan><tspan x="175.0" dy="11.7">• Електробезпека: EN 62368-1 / EN 60950</tspan><tspan x="175.0" dy="11.7">• Опромінення людини: EN 62311 (EMF)</tspan><tspan x="175.0" dy="11.7">• Питоме поглинання: EN 50663 / EN 62209 (SAR)</tspan><tspan x="175.0" dy="11.7">• Захист від опіків, механічних травм,</tspan><tspan x="175.0" dy="11.7">  вибуху акумулятора (немає межі 50 В!)</tspan></text>
<line x1="340.0" y1="220.0" x2="310.0" y2="160.0" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="650.0" y="65.0" width="270.0" height="130.0" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/><text x="785.0" y="103.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Стаття 3.1(b): ЕМС (Сумісність)</tspan><tspan x="785.0" dy="11.7">• Загальні вимоги ЕМС: EN 301 489-1</tspan><tspan x="785.0" dy="11.7">• Специфіка для Wi-Fi/BT: EN 301 489-17</tspan><tspan x="785.0" dy="11.7">• Специфіка для стільникового зв'язку: EN 301 489-52</tspan><tspan x="785.0" dy="11.7">• Кондуктивні та радіаційні емісії,</tspan><tspan x="785.0" dy="11.7">  стійкість до ESD, сплесків та полів</tspan></text>
<line x1="620.0" y1="220.0" x2="650.0" y2="160.0" stroke="#eab308" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="310.0" width="270.0" height="140.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="175.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Стаття 3.2: Радіоспектр</tspan><tspan x="175.0" dy="11.7">• Діапазон 2.4 ГГц: ETSI EN 300 328 (BT, Wi-Fi)</tspan><tspan x="175.0" dy="11.7">• Діапазон 5 ГГц: ETSI EN 301 893 (Wi-Fi 5/6)</tspan><tspan x="175.0" dy="11.7">• Діапазон до 1 ГГц: ETSI EN 300 220 (SRD, LoRa)</tspan><tspan x="175.0" dy="11.7">• Вихідна потужність (EIRP), маска спектра,</tspan><tspan x="175.0" dy="11.7">  побічні випромінення (Spurious emissions),</tspan><tspan x="175.0" dy="11.7">  робочий цикл (Duty cycle), LBT</tspan></text>
<line x1="340.0" y1="275.0" x2="310.0" y2="335.0" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="650.0" y="310.0" width="270.0" height="140.0" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/><text x="785.0" y="353.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Стаття 3.3: Кібербезпека (d/e/f)</tspan><tspan x="785.0" dy="11.7">• Безпека IoT: EN 303 645 / IEC 62443-4-2</tspan><tspan x="785.0" dy="11.7">• 3.3(d): Захист мережі від перевантажень</tspan><tspan x="785.0" dy="11.7">• 3.3(e): Захист персональних даних та приватності</tspan><tspan x="785.0" dy="11.7">• 3.3(f): Захист фінансових транзакцій від шахрайства</tspan><tspan x="785.0" dy="11.7">• Обов'язкова верифікація прошивки та ключів</tspan></text>
<line x1="620.0" y1="275.0" x2="650.0" y2="335.0" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="465.0" width="880.0" height="40.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480.0" y="489.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">Виконання гармонізованих стандартів надає презумпцію відповідності кожній окремій статті RED</text>
</svg>