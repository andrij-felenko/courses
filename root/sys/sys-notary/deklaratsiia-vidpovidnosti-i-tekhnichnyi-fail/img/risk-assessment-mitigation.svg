<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія зниження ризиків (ISO 12100 / EN 62368-1) у технічному файлі</text>
<rect x="40.0" y="70.0" width="200.0" height="330.0" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2.0"/>
<text x="140.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ef4444" text-anchor="middle" font-weight="700">1. Виявлення небезпек</text>
<line x1="55.0" y1="115.0" x2="225.0" y2="115.0" stroke="#fca5a5" stroke-width="1.0"/>
<text x="60.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="start"><tspan x="60.0" dy="0.0">• Електричний удар</tspan><tspan x="60.0" dy="13.2">  (пробій ізоляції, висока V)</tspan></text>
<text x="60.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="start"><tspan x="60.0" dy="0.0">• Тепловий розгін</tspan><tspan x="60.0" dy="13.2">  (Li-ion акумулятор)</tspan></text>
<text x="60.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="start"><tspan x="60.0" dy="0.0">• ВЧ-перегрів тканин</tspan><tspan x="60.0" dy="13.2">  (перевищення SAR)</tspan></text>
<text x="60.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="start"><tspan x="60.0" dy="0.0">• Збій керування</tspan><tspan x="60.0" dy="13.2">  (через ЕМС-заваду)</tspan></text>
<text x="60.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="start"><tspan x="60.0" dy="0.0">• Програмний збій</tspan><tspan x="60.0" dy="13.2">  (зависання у небезпеці)</tspan></text>
<text x="60.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="start"><tspan x="60.0" dy="0.0">• Займання пластику</tspan><tspan x="60.0" dy="13.2">  (UL94 займання)</tspan></text>
<line x1="240.0" y1="235.0" x2="275.0" y2="235.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="285.0" y="70.0" width="410.0" height="330.0" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2.0"/>
<text x="490.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">2. Трирівнева ієрархія захисту</text>
<rect x="305.0" y="115.0" width="370.0" height="80.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="490.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Рівень I: Внутрішньо безпечна конструкція</tspan><tspan x="490.0" dy="13.0">• Гальванічна розв'язка, повітряні зазори (Creepage/Clearance)</tspan><tspan x="490.0" dy="13.0">• Робота на безпечній наднизькій напрузі (SELV / ES1)</tspan><tspan x="490.0" dy="13.0">• Обмеження потужності передавача апаратними атенюаторами</tspan></text>
<rect x="305.0" y="205.0" width="370.0" height="85.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="490.0" y="231.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Рівень II: Апаратний та програмний захист</tspan><tspan x="490.0" dy="13.0">• Самовідновні запобіжники (PTC), супресори TVS, NTC-датчики</tspan><tspan x="490.0" dy="13.0">• Контролер захисту акумулятора (BMS OVP/UVP/OCP)</tspan><tspan x="490.0" dy="13.0">• Апаратний сторожовий таймер (Watchdog), безпечний стан</tspan></text>
<rect x="305.0" y="300.0" width="370.0" height="85.0" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/><text x="490.0" y="326.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Рівень III: Інструкції та маркування</tspan><tspan x="490.0" dy="13.0">• Піктограми безпеки на корпусі (WEEE, знаки застереження)</tspan><tspan x="490.0" dy="13.0">• Обмеження монтажу та мінімальна дистанція до тіла в Manual</tspan><tspan x="490.0" dy="13.0">• Заборона відкривання корпуса некваліфікованим персоналом</tspan></text>
<line x1="695.0" y1="235.0" x2="730.0" y2="235.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="740.0" y="70.0" width="180.0" height="330.0" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2.0"/>
<text x="830.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#065f46" text-anchor="middle" font-weight="700">3. Результат</text>
<line x1="755.0" y1="115.0" x2="905.0" y2="115.0" stroke="#6ee7b7" stroke-width="1.0"/>
<text x="830.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="middle"><tspan x="830.0" dy="0.0">Допустимий</tspan><tspan x="830.0" dy="14.3">залишковий</tspan><tspan x="830.0" dy="14.3">ризик</tspan><tspan x="830.0" dy="14.3"></tspan><tspan x="830.0" dy="14.3">Всі ризики</tspan><tspan x="830.0" dy="14.3">переведені у</tspan><tspan x="830.0" dy="14.3">зелену зону</tspan><tspan x="830.0" dy="14.3">матриці FMEA.</tspan><tspan x="830.0" dy="14.3"></tspan><tspan x="830.0" dy="14.3">Документується</tspan><tspan x="830.0" dy="14.3">в розділі 5</tspan><tspan x="830.0" dy="14.3">Технічного</tspan><tspan x="830.0" dy="14.3">файлу.</tspan></text>
</svg>