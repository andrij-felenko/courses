<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нормативний простір безпеки коду та вбудованих систем у ЄС</text>
<rect x="30.0" y="60.0" width="270.0" height="350.0" rx="8" fill="#f8fafc" stroke="#2457d6" stroke-width="2.0"/>
<text x="165.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">ETSI EN 303 645</text>
<text x="165.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Галузевий технічний стандарт</text>
<line x1="45.0" y1="120.0" x2="285.0" y2="120.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="44.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Об'єкт: Споживчий IoT (Consumer IoT)</text>
<text x="44.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">13 базових вимог кібербезпеки:</text>
<text x="44.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"> • Заборона дефолтних паролів (5.1)</text>
<text x="44.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"> • Політика вразливостей CVD (5.2)</text>
<text x="44.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"> • Криптографічні оновлення (5.3)</text>
<text x="44.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"> • Безпечне зберігання секретів (5.4)</text>
<text x="44.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"> • Захист інтерфейсів зв'язку (5.5)</text>
<text x="44.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"> • Контроль поверхні атак і телеметрії</text>
<text x="44.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Статус: Гармонізована основа для RED</text>
<rect x="335.0" y="60.0" width="275.0" height="350.0" rx="8" fill="#fdfbf7" stroke="#d97706" stroke-width="2.0"/>
<text x="472.5" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b45309" text-anchor="middle" font-weight="700">RED Art. 3.3 (d / e / f)</text>
<text x="472.5" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Делегований регламент (EU) 2022/30</text>
<line x1="350.0" y1="120.0" x2="595.0" y2="120.0" stroke="#d97706" stroke-width="1.0"/>
<text x="349.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Об'єкт: Бездротові пристрої (Wi-Fi/BLE/Cellular)</text>
<text x="349.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Три обов'язкові юридичні статті:</text>
<text x="349.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"> • 3.3(d) Захист мереж від перевантажень</text>
<text x="349.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"> • 3.3(e) Захист персональних даних/приватності</text>
<text x="349.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"> • 3.3(f) Захист фінансових транзакцій</text>
<text x="349.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Стандарти: EN 18031-1, EN 18031-2, EN 18031-3</text>
<text x="349.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Обов'язковість: З серпня 2025 року</text>
<text x="349.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start" font-weight="700">Наслідок: Заборона продажу без CE-RED</text>
<rect x="645.0" y="60.0" width="270.0" height="350.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="780.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Cyber Resilience Act (CRA)</text>
<text x="780.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Регламент (EU) 2024/2847</text>
<line x1="660.0" y1="120.0" x2="900.0" y2="120.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="659.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Об'єкт: УСІ цифрові продукти (ПЗ + залізо)</text>
<text x="659.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Повний життєвий цикл виробу:</text>
<text x="659.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"> • Security by Design / Security by Default</text>
<text x="659.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"> • Обов'язковий маніфест SBOM (SPDX/CycloneDX)</text>
<text x="659.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"> • Сповіщення ENISA/CSIRT про 0-day за 24 год</text>
<text x="659.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"> • Обов'язкові патчі безпеки (до 5+ років)</text>
<text x="659.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Класи: Звичайні / Важливі I-II / Критичні</text>
<text x="659.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Штрафи: До 15 млн € або 2.5% річного обороту</text>
</svg>