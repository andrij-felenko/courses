<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Периметр токенізації: чому бекенд не бачить сирих номерів карток</text>
<text x="440.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">сирі реквізити (PAN, CVV) ізольовані у захищеному iframe провайдера (SAQ A)</text>
<rect x="30.0" y="75.0" width="250.0" height="420.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="155.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Клієнт (Браузер / Мобільний)</text>
<rect x="45.0" y="120.0" width="220.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="155.0" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Форма чекауту</tspan><tspan x="155.0" dy="14.3">(Хост-сторінка магазину)</tspan></text>
<rect x="45.0" y="195.0" width="220.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="155.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Hosted Fields (iframe PSP)</tspan><tspan x="155.0" dy="14.3">Введення номера картки (PAN)</tspan><tspan x="155.0" dy="14.3">і коду безпеки (CVV)</tspan></text>
<rect x="45.0" y="305.0" width="220.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/><text x="155.0" y="331.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Отримання токена</tspan><tspan x="155.0" dy="14.3">pm_1N4x9k... (без PAN)</tspan></text>
<rect x="45.0" y="385.0" width="220.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="155.0" y="419.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Передача токена на бекенд</tspan><tspan x="155.0" dy="14.3">разом із номером замовлення</tspan><tspan x="155.0" dy="14.3">(POST /api/checkout)</tspan></text>
<rect x="315.0" y="75.0" width="250.0" height="420.0" rx="6" fill="#fbfcfd" stroke="#27ae60" stroke-width="1.8"/>
<text x="440.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Платіжний провайдер (PSP)</text>
<rect x="330.0" y="120.0" width="220.0" height="45.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Сховище карток (PCI Vault)</tspan><tspan x="440.0" dy="14.3">Шифрування HSM / L1</tspan></text>
<rect x="330.0" y="205.0" width="220.0" height="65.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Генерація токена методу</tspan><tspan x="440.0" dy="14.3">PAN → pm_1N4x9k...</tspan><tspan x="440.0" dy="14.3">(Одноразовий / прив'язаний)</tspan></text>
<rect x="330.0" y="310.0" width="220.0" height="75.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="337.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Авторизація / Списання</tspan><tspan x="440.0" dy="14.3">Запит до МПС (Visa/Mastercard)</tspan><tspan x="440.0" dy="14.3">та банку-емітента</tspan></text>
<rect x="330.0" y="410.0" width="220.0" height="65.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="432.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Формування результату</tspan><tspan x="440.0" dy="14.3">і відправка вебхука</tspan><tspan x="440.0" dy="14.3">(payment_intent.succeeded)</tspan></text>
<rect x="600.0" y="75.0" width="250.0" height="420.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="725.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бекенд магазину</text>
<rect x="615.0" y="120.0" width="220.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="725.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">Межа безпеки:</tspan><tspan x="725.0" dy="14.3">Жодних PAN / CVV у базі,</tspan><tspan x="725.0" dy="14.3">пам'яті чи логах!</tspan></text>
<rect x="615.0" y="205.0" width="220.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="725.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Створення PaymentIntent</tspan><tspan x="725.0" dy="14.3">(Сума, валюта, Idempotency-Key)</tspan><tspan x="725.0" dy="14.3">POST /v1/payment_intents</tspan></text>
<rect x="615.0" y="305.0" width="220.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="725.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Підтвердження списання</tspan><tspan x="725.0" dy="14.3">через API з секретним ключем</tspan><tspan x="725.0" dy="14.3">(Secret Key sk_live_...)</tspan></text>
<rect x="615.0" y="410.0" width="220.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="725.0" y="432.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Фіксація результату</tspan><tspan x="725.0" dy="14.3">та виконання замовлення</tspan><tspan x="725.0" dy="14.3">у внутрішній БД</tspan></text>
