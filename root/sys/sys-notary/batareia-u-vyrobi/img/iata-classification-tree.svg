<text x="500.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">КРИТЕРІЇ ПОДІЛУ НА СЕКЦІЇ ТА РЕЖИМИ РЕГУЛЮВАННЯ (PACKING SECTIONS)</text>
<rect x="55.0" y="330.0" width="285.0" height="205.0" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
<text x="197.5" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">СЕКЦІЯ IA (Повне регулювання Class 9)</text>
<text x="69.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="69.0" dy="0.0">Поріг: Комірка &gt; 20 Вт·год або АКБ &gt; 100 Вт·год</tspan><tspan x="69.0" dy="12.0">(для Li-metal: комірка &gt; 1 г або АКБ &gt; 2 г літію)</tspan><tspan x="69.0" dy="12.0"></tspan><tspan x="69.0" dy="12.0">• Сертифікована UN-тара (UN Specification 4G, PG II)</tspan><tspan x="69.0" dy="12.0">• Декларація небезпечного вантажу (DGD / Shipper's Dec)</tspan><tspan x="69.0" dy="12.0">• Знак небезпеки Class 9A + наліпка CAO (для UN 3480/3090)</tspan><tspan x="69.0" dy="12.0">• Сертифікований персонал з підготовкою DGR</tspan></text>
<rect x="360.0" y="330.0" width="285.0" height="205.0" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
<text x="502.5" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">СЕКЦІЯ IB (Малі елементи у великій кількості)</text>
<text x="374.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="374.0" dy="0.0">Поріг: Комірка ≤ 20 Вт·год, АКБ ≤ 100 Вт·год</tspan><tspan x="374.0" dy="12.0">(але вага пакунка або кількість перевищує Section II)</tspan><tspan x="374.0" dy="12.0"></tspan><tspan x="374.0" dy="12.0">• Жорстка міцна тара (випробування падінням 1.2 м)</tspan><tspan x="374.0" dy="12.0">• Декларація небезпечного вантажу (DGD)</tspan><tspan x="374.0" dy="12.0">• Маркування: Знак Lithium Battery Mark + Class 9A Label</tspan><tspan x="374.0" dy="12.0">• Обмеження ваги: макс. 10 кг нетто на вантажний борт</tspan></text>
<rect x="665.0" y="330.0" width="285.0" height="205.0" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
<text x="807.5" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">СЕКЦІЯ II (Виняток / Спрощений режим)</text>
<text x="679.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="679.0" dy="0.0">Поріг: Комірка ≤ 20 Вт·год, АКБ ≤ 100 Вт·год</tspan><tspan x="679.0" dy="12.0">(PI 966/967/969/970, обмежена кількість)</tspan><tspan x="679.0" dy="12.0"></tspan><tspan x="679.0" dy="12.0">• Без декларації DGD, без UN-специфікації тари</tspan><tspan x="679.0" dy="12.0">• Знак Lithium Battery Mark (якщо &gt; 2 приладів у пакунку)</tspan><tspan x="679.0" dy="12.0">• Захист клем від КЗ, фіксація всередині корпусу</tspan><tspan x="679.0" dy="12.0">• Випробування тари на падіння з висоти 1.2 м</tspan></text>
