<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 495" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="495" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратна та програмна архітектура транспортного режиму (Ship Mode)</text>
<rect x="27.9" y="80.2" width="204.1" height="59.6" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8"/><text x="130.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Li-Ion Акумулятор</tspan><tspan x="130.0" dy="14.3">3.7 В (1S / 3S)</tspan><tspan x="130.0" dy="14.3">SoC ≤ 30% при відвантаженні</tspan></text>
<rect x="40.0" y="194.3" width="180.0" height="71.4" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/><text x="130.0" y="213.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Первинний захист BMS IC</tspan><tspan x="130.0" dy="13.7">(BQ29700 / DW01A)</tspan><tspan x="130.0" dy="13.7">Контроль OVP / UVP / OCP</tspan><tspan x="130.0" dy="13.7">Ключі Dual N-MOSFET</tspan></text>
<rect x="39.2" y="314.3" width="181.6" height="71.4" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="130.0" y="333.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Вторинний захист (SCP)</tspan><tspan x="130.0" dy="13.7">Триполюсний керований</tspan><tspan x="130.0" dy="13.7">хімічний плавкий запобіжник</tspan><tspan x="130.0" dy="13.7">(самознищення при відмові)</tspan></text>
<line x1="130.0" y1="145.0" x2="130.0" y2="185.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="130.0" y1="275.0" x2="130.0" y2="310.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="300.0" y="70.0" width="370.0" height="370.0" rx="8" fill="#f8fafc" stroke="#4338ca" stroke-width="2.0"/>
<text x="485.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4338ca" text-anchor="middle" font-weight="700">КОНТРОЛЕР ЖИВЛЕННЯ ТА SHIP MODE (PMIC / GATE)</text>
<rect x="320.0" y="133.5" width="330.0" height="43.0" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="485.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="485.0" dy="0.0">Силовий ключ розриву навантаження (Load Switch)</tspan><tspan x="485.0" dy="13.0">P-MOSFET / E-Fuse з витоком I_leak &lt; 100 нА</tspan></text><rect x="320.0" y="217.0" width="330.0" height="56.0" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="485.0" y="235.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="485.0" dy="0.0">Апаратний тригер стану (Ship Mode Latch)</tspan><tspan x="485.0" dy="13.0">Блокує подачу живлення на шину V_SYS</tspan><tspan x="485.0" dy="13.0">Споживання у сні: I_q ≤ 0.5 мкА (проти 50 мкА штатно)</tspan></text><rect x="320.0" y="317.0" width="330.0" height="56.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="485.0" y="335.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="485.0" dy="0.0">Логіка розблокування (Wake-up Engine)</tspan><tspan x="485.0" dy="13.0">• Детекція підключення зарядного пристрою (V_BUS)</tspan><tspan x="485.0" dy="13.0">• Апаратний дебаунс кнопки: утримання &gt; 3–5 секунд</tspan></text>
<line x1="220.0" y1="230.0" x2="300.0" y2="155.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="485.0" y1="285.0" x2="485.0" y2="310.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="720.0" y="119.3" width="220.0" height="71.4" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="830.0" y="138.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Системна шина V_SYS</tspan><tspan x="830.0" dy="13.7">DC-DC перетворювачі</tspan><tspan x="830.0" dy="13.7">Повністю знеструмлені (0 В)</tspan><tspan x="830.0" dy="13.7">Виключено випадковий запуск</tspan></text><rect x="720.0" y="244.0" width="220.0" height="82.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="830.0" y="262.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Мікроконтролер (MCU)</tspan><tspan x="830.0" dy="13.0">Прошивка контролює перехід:</tspan><tspan x="830.0" dy="13.0">1. Перевірка SoC ≤ 30%</tspan><tspan x="830.0" dy="13.0">2. Запис прапорця в EEPROM</tspan><tspan x="830.0" dy="13.0">3. Команда I2C: ENTER_SHIP_MODE</tspan></text>
<line x1="650.0" y1="155.0" x2="720.0" y2="155.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="830.0" y1="230.0" x2="830.0" y2="215.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="720.0" y1="320.0" x2="650.0" y2="260.0" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="445.0" width="900.0" height="30.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="500.0" y="463.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Захист від глибокого саморозряду (U &lt; 2.0 В) протягом 12 місяців складування та захист від вібраційного ввімкнення під час руху</tspan></text>
</svg>