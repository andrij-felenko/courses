<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="235.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний корінь довіри (Root of Trust)</text>
<text x="705.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Енергонезалежна Flash-пам'ять (NAND / eMMC)</text>
<rect x="40.0" y="65.0" width="390.0" height="435.0" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
<rect x="60.0" y="85.0" width="350.0" height="49.9" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/><text x="235.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">Secure Element / TPM 2.0 / BBRAM</tspan><tspan x="235.0" dy="16.9">Апаратно ізольоване захищене сховище</tspan></text>
<rect x="70.0" y="171.2" width="330.0" height="47.6" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="235.0" y="191.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">Master Key / KEK (Key Encryption Key)</tspan><tspan x="235.0" dy="15.6">256-бітний симетричний ключ обгортки</tspan></text>
<rect x="70.0" y="256.2" width="330.0" height="47.6" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="235.0" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">DEK (Data Encryption Key)</tspan><tspan x="235.0" dy="15.6">Ключ шифрування розділів даних</tspan></text>
<rect x="60.0" y="363.4" width="350.0" height="63.2" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="235.0" y="383.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">КОМАНДА САНІТИЗАЦІЇ / НУЛІФІКАЦІЯ</tspan><tspan x="235.0" dy="15.6">Апаратний скид (Zeroization) / TPM2_Clear</tspan><tspan x="235.0" dy="15.6">DEK знищується за &lt; 1 мс у захищеній пам'яті</tspan></text>
<rect x="510.0" y="65.0" width="390.0" height="435.0" rx="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
<rect x="523.9" y="86.2" width="362.2" height="47.6" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/><text x="705.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="705.0" dy="0.0">Шифротекст розділів Flash</tspan><tspan x="705.0" dy="15.6">AES-256-XTS / AES-CBC з апаратним крипторушієм</tspan></text>
<rect x="540.0" y="171.2" width="330.0" height="47.6" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="705.0" y="191.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Користувацькі дані та облікові записи</tspan><tspan x="705.0" dy="15.6">Wi-Fi PSK, TLS сертифікати, телеметрія, PII</tspan></text>
<rect x="538.2" y="257.4" width="333.5" height="45.3" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="705.0" y="276.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Службові зони та резерв FTL (Over-Provisioning)</tspan><tspan x="705.0" dy="14.3">Зносостійкі сторінки, журнали помилок, зняті блоки</tspan></text>
<rect x="520.2" y="363.4" width="369.7" height="63.2" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="705.0" y="383.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#14532d" text-anchor="middle" font-weight="700"><tspan x="705.0" dy="0.0">КРИПТОГРАФІЧНИЙ БАР'ЄР (ШУМ)</tspan><tspan x="705.0" dy="15.6">Без DEK усі фізичні комірки Flash стають</tspan><tspan x="705.0" dy="15.6">незворотно закритим білим шумом (2²⁵⁶ операцій)</tspan></text>
