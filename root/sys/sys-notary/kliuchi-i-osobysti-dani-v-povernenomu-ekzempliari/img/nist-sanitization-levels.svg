<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівні санітизації носіїв даних за стандартом NIST SP 800-88 Rev 1</text>
<rect x="25.0" y="65.0" width="285.0" height="410.0" rx="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="39.5" y="88.0" width="255.0" height="34.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="167.0" y="109.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="167.0" dy="0.0">1. Clear (Очищення)</tspan></text>
<rect x="39.5" y="153.1" width="255.0" height="73.9" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="167.0" y="172.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="167.0" dy="0.0">Логічне перезаписування</tspan><tspan x="167.0" dy="14.3">• Команди dd, blkdiscard, zeros</tspan><tspan x="167.0" dy="14.3">• Запис шаблонів у логічні LBA</tspan><tspan x="167.0" dy="14.3">• Стандартні файлові операції</tspan></text>
<rect x="31.6" y="253.1" width="270.8" height="73.9" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="167.0" y="272.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="167.0" dy="0.0">Обмеження та ризики</tspan><tspan x="167.0" dy="14.3">• Дані лишаються в FTL Over-Provisioning</tspan><tspan x="167.0" dy="14.3">• Не стирає збійні (bad) блоки</tspan><tspan x="167.0" dy="14.3">• Вразливе до апаратної випайки Flash</tspan></text>
<rect x="37.9" y="370.2" width="258.3" height="59.6" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="167.0" y="389.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="167.0" dy="0.0">Сфера застосування</tspan><tspan x="167.0" dy="14.3">Повторне використання всередині</tspan><tspan x="167.0" dy="14.3">тієї самої безпекової зони організації</tspan></text>
<rect x="337.0" y="65.0" width="285.0" height="410.0" rx="8" fill="none" stroke="#27ae60" stroke-width="1.8"/>
<rect x="352.5" y="88.0" width="255.0" height="34.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="109.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">2. Purge (Знешкодження)</tspan></text>
<rect x="352.5" y="153.1" width="255.0" height="73.9" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="480.0" y="172.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Апаратне / криптостирання</tspan><tspan x="480.0" dy="14.3">• ATA/NVMe Enhanced Secure Erase</tspan><tspan x="480.0" dy="14.3">• eMMC SECURE_ERASE / TRIM</tspan><tspan x="480.0" dy="14.3">• Crypto-Shredding (знищення DEK)</tspan></text>
<rect x="333.6" y="253.1" width="292.8" height="73.9" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="272.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Стійкість до атак</tspan><tspan x="480.0" dy="14.3">• Очищає OP-зони, кеші та збійні блоки</tspan><tspan x="480.0" dy="14.3">• Захист від лабораторій (Chip-Off, SEM)</tspan><tspan x="480.0" dy="14.3">• Зберігає працездатність плати</tspan></text>
<rect x="350.9" y="370.2" width="258.3" height="59.6" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="389.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Сфера застосування</tspan><tspan x="480.0" dy="14.3">Повернення виробнику, гарантійний</tspan><tspan x="480.0" dy="14.3">ремонт (RMA), вторинний ринок / лізинг</tspan></text>
<rect x="650.0" y="65.0" width="285.0" height="410.0" rx="8" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<rect x="664.5" y="88.0" width="255.0" height="34.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="792.0" y="109.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="792.0" dy="0.0">3. Destroy (Знищення)</tspan></text>
<rect x="664.5" y="153.1" width="255.0" height="73.9" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><text x="792.0" y="172.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="792.0" dy="0.0">Фізична деструкція</tspan><tspan x="792.0" dy="14.3">• Подрібнення шредером (&lt; 2 мм)</tspan><tspan x="792.0" dy="14.3">• Спалювання / піроліз (&gt; 1000 °C)</tspan><tspan x="792.0" dy="14.3">• Хімічне розчинення кристала</tspan></text>
<rect x="664.5" y="253.1" width="255.0" height="73.9" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="792.0" y="272.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="792.0" dy="0.0">Результат</tspan><tspan x="792.0" dy="14.3">• 100% неможливість відновлення</tspan><tspan x="792.0" dy="14.3">• Повна втрата обладнання</tspan><tspan x="792.0" dy="14.3">• Висока вартість та відходи WEEE</tspan></text>
<rect x="664.5" y="370.2" width="255.0" height="59.6" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="792.0" y="389.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="792.0" dy="0.0">Сфера застосування</tspan><tspan x="792.0" dy="14.3">Кінець життєвого циклу (EOL),</tspan><tspan x="792.0" dy="14.3">дефектні носії, надсекретні модулі</tspan></text>
</svg>