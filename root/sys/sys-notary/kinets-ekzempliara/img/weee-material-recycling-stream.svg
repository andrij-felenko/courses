<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матеріальні потоки селективної переробки електронних відходів (WEEE Annex VII)</text>
<rect x="30.0" y="160.0" width="200.0" height="200.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<rect x="30.0" y="160.0" width="200.0" height="40.0" rx="8" fill="#e5e7eb" stroke="#333333" stroke-width="1.5"/>
<text x="130.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Знятий пристрій (WEEE)</text>
<text x="130.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Комплексний електронний</tspan><tspan x="130.0" dy="14.3">виріб у зборі:</tspan><tspan x="130.0" dy="14.3">• Корпус і кріплення</tspan><tspan x="130.0" dy="14.3">• Li-Ion / LiFePO4 АКБ</tspan><tspan x="130.0" dy="14.3">• Плати PCB з мікросхемами</tspan><tspan x="130.0" dy="14.3">• Дисплейний модуль</tspan></text>
<line x1="230.0" y1="260.0" x2="290.0" y2="260.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="290.0" y="180.0" width="210.0" height="160.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="2.0"/>
<rect x="290.0" y="180.0" width="210.0" height="38.0" rx="8" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/>
<text x="395.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Селективна обробка</text>
<text x="395.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">Вимоги WEEE Annex VII:</tspan><tspan x="395.0" dy="14.3">• Обов'язкове зняття АКБ</tspan><tspan x="395.0" dy="14.3">• Сепарація плат &gt;10 см²</tspan><tspan x="395.0" dy="14.3">• Відокремлення РК-панелей</tspan><tspan x="395.0" dy="14.3">• Демонтаж BFR-пластиків</tspan></text>
<line x1="500.0" y1="200.0" x2="570.0" y2="102.5" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="570.0" y="55.0" width="380.0" height="95.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="582.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">1. Небезпечні субстанції та АКБ (EU 2023/1542)</text>
<text x="582.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="582.0" dy="0.0">• Li-Ion / LiFePO4 батареї, електроліти, ртутні перемикачі</tspan><tspan x="582.0" dy="13.7">• Спеціалізована гідрометалургія: регенерація Li, Co, Ni</tspan><tspan x="582.0" dy="13.7">• Повне запобігання термічному розгону та викидам HF</tspan></text>
<line x1="500.0" y1="235.0" x2="570.0" y2="215.5" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="570.0" y="168.0" width="380.0" height="95.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="582.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="start" font-weight="700">2. Друковані вузли PCB (Піро- та гідрометалургія)</text>
<text x="582.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="582.0" dy="0.0">• Вилучення дорогоцінних металів: Au, Ag, Pd, Pt</tspan><tspan x="582.0" dy="13.7">• Регенерація мідної основи дорожок та олов'яного припою</tspan><tspan x="582.0" dy="13.7">• Шлакування епоксидного склотекстоліту FR4</tspan></text>
<line x1="500.0" y1="285.0" x2="570.0" y2="328.5" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="570.0" y="281.0" width="380.0" height="95.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="582.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">3. Корпусні термопласти (RoHS-сумісні ABS, PC, PA)</text>
<text x="582.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="582.0" dy="0.0">• Оптична спектроскопічна сепарація (NIR / XRF)</tspan><tspan x="582.0" dy="13.7">• Подрібнення у гранулят для вторинного лиття</tspan><tspan x="582.0" dy="13.7">• Ізоляція фракцій із бромованими антипіренами (BFR)</tspan></text>
<line x1="500.0" y1="320.0" x2="570.0" y2="441.5" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="570.0" y="394.0" width="380.0" height="95.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="582.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">4. Конструкційні метали (Алюміній, сталь, мідь)</text>
<text x="582.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="582.0" dy="0.0">• Магнітна та вихрострумова (Eddy Current) сепарація</tspan><tspan x="582.0" dy="13.7">• 100% переплавка радіаторів, шасі, екранів та кріплень</tspan><tspan x="582.0" dy="13.7">• Мінімальний вуглецевий слід вторинного алюмінію</tspan></text>
</svg>