<rect x="753.0" y="110.0" width="199.0" height="75.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><text x="852.5" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="852.5" dy="0.0">Вилучення АКБ</tspan><tspan x="852.5" dy="13.0">Безпечний розряд і демонтаж</tspan><tspan x="852.5" dy="13.0">Li-Ion / LiFePO4 (EU 2023/1542)</tspan></text>
