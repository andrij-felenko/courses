<rect x="33.0" y="195.0" width="199.0" height="75.0" rx="6" fill="#ffffff" stroke="#c4d8fa" stroke-width="1.5"/><text x="132.5" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="132.5" dy="0.0">Криптографічні ключі</tspan><tspan x="132.5" dy="14.3">Анулювання сертифікатів,</tspan><tspan x="132.5" dy="14.3">розірвання Trust Anchors</tspan></text>
<rect x="33.0" y="280.0" width="199.0" height="75.0" rx="6" fill="#ffffff" stroke="#c4d8fa" stroke-width="1.5"/><text x="132.5" y="307.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="132.5" dy="0.0">Дані власника</tspan><tspan x="132.5" dy="14.3">Відв'язка облікового запису,</tspan><tspan x="132.5" dy="14.3">скасування підписок</tspan></text>
