<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інженерні патерни правової ізоляції: Як зберегти пропрієтарний код у системі з GPL</text>
<rect x="40.0" y="55.0" width="415.0" height="195.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="247.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">Патерн 1: Апаратний прошарок (AOSP HAL Model)</text>
<rect x="55.0" y="92.0" width="385.0" height="45.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="247.5" y="111.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="247.5" dy="0.0">Пропрієтарний додаток / Сервіс (Apache 2.0 / Commercial)</tspan><tspan x="247.5" dy="13.0">Не містить GPL-символів, викликає чистий HAL C++ API</tspan></text>
<rect x="55.0" y="142.0" width="385.0" height="45.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="247.5" y="161.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="247.5" dy="0.0">Vendor HAL (.so плагін закритий) ➔ Linus Exception</tspan><tspan x="247.5" dy="13.0">Спілкується з ядром виключно через ioctl() та /dev вузли</tspan></text>
<rect x="55.0" y="192.0" width="385.0" height="45.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="247.5" y="211.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="247.5" dy="0.0">Ядро Linux (GPLv2-only) — Драйвер контролера</tspan><tspan x="247.5" dy="13.0">Ізольоване межею системних викликів (Syscall Boundary)</tspan></text>
<rect x="485.0" y="55.0" width="415.0" height="195.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="692.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">Патерн 2: Демон-проксі через сокет (IPC Proxy)</text>
<rect x="500.0" y="92.0" width="385.0" height="45.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="692.5" y="111.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="692.5" dy="0.0">Пропрієтарний процес (PID 1024, Commercial)</tspan><tspan x="692.5" dy="13.0">Алгоритми ноу-хау, закрита математика та ліцензійні ключі</tspan></text>
<rect x="500.0" y="142.0" width="385.0" height="45.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="692.5" y="161.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="692.5" dy="0.0">Межа ізоляції: UNIX Domain Socket / FIFO Pipe / Protobuf</tspan><tspan x="692.5" dy="13.0">Обмін серіалізованими повідомленнями без спільних типів</tspan></text>
<rect x="500.0" y="192.0" width="385.0" height="45.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="692.5" y="211.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="692.5" dy="0.0">Окремий GPL-демон (PID 1025, GPLv3-сервіс)</tspan><tspan x="692.5" dy="13.0">Повний вихідний код демона відкрито замовнику</tspan></text>
<rect x="40.0" y="265.0" width="415.0" height="195.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="247.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">Патерн 3: Виклик підпроцесу (fork/execve CLI)</text>
<rect x="55.0" y="302.0" width="385.0" height="45.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="247.5" y="321.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="247.5" dy="0.0">Комерційна програма керування</tspan><tspan x="247.5" dy="13.0">Формує текстові аргументи командного рядка argv[]</tspan></text>
<rect x="55.0" y="352.0" width="385.0" height="45.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="247.5" y="371.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="247.5" dy="0.0">Виклик fork() + execve(&quot;/usr/bin/ffmpeg&quot;, ...)</tspan><tspan x="247.5" dy="13.0">Взаємодія через стандартні дескриптори stdin/stdout</tspan></text>
<rect x="55.0" y="402.0" width="385.0" height="45.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="247.5" y="421.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="247.5" dy="0.0">Стороння автономна утиліта (GPLv3 Binary)</tspan><tspan x="247.5" dy="13.0">Використовується як окремий загальносистемний інструмент</tspan></text>
<rect x="485.0" y="265.0" width="415.0" height="195.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="692.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">Патерн 4: Динамічний шим LGPL (Relinkable Shim)</text>
<rect x="500.0" y="302.0" width="385.0" height="45.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="692.5" y="321.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="692.5" dy="0.0">Пропрієтарний бінарник ELF (Dynamic Linked)</tspan><tspan x="692.5" dy="13.0">Компонується динамічно з .so бібліотекою через PLT/GOT</tspan></text>
<rect x="500.0" y="352.0" width="385.0" height="45.0" rx="6" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5"/><text x="692.5" y="371.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="692.5" dy="0.0">Динамічна бібліотека libcrypto.so (LGPL v2.1)</tspan><tspan x="692.5" dy="13.0">Користувач має право замінити .so на власну скомпільовану версію</tspan></text>
<rect x="500.0" y="402.0" width="385.0" height="45.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="692.5" y="421.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="692.5" dy="0.0">Обов'язкова умова прошивки:</tspan><tspan x="692.5" dy="13.0">Файлова система дозволяє перезапис .so або LD_LIBRARY_PATH</tspan></text>
</svg>