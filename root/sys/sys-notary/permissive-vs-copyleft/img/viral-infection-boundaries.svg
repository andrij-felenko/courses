<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм ліцензійного зараження (Viral Effect) та ізоляційні межі архітектури</text>
<rect x="40.0" y="50.0" width="860.0" height="195.0" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="2.0"/>
<text x="470.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ЗОНА ПОХІДНОГО ТВОРУ: Спільний адресний простір процесу ➔ ЗАРАЖЕННЯ GPL</text>
<rect x="60.0" y="85.0" width="260.0" height="145.0" rx="6" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/><text x="190.0" y="118.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">1. Статичне компонування (.a)</tspan><tspan x="190.0" dy="14.3"></tspan><tspan x="190.0" dy="14.3">• Символи об'єднані лінкером</tspan><tspan x="190.0" dy="14.3">• Єдиний ELF / PE бінарник</tspan><tspan x="190.0" dy="14.3">• Спільна таблиця релокацій</tspan><tspan x="190.0" dy="14.3">➔ 100% комбінований твір,</tspan><tspan x="190.0" dy="14.3">весь продукт стає GPL</tspan></text>
<rect x="340.0" y="85.0" width="260.0" height="145.0" rx="6" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/><text x="470.0" y="118.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">2. Динамічне лінкування (.so)</tspan><tspan x="470.0" dy="14.3"></tspan><tspan x="470.0" dy="14.3">• DT_NEEDED, dlopen()</tspan><tspan x="470.0" dy="14.3">• Обмін структурами в RAM</tspan><tspan x="470.0" dy="14.3">• Взаємозалежні типи C/C++</tspan><tspan x="470.0" dy="14.3">➔ Позиція FSF: комбінований твір</tspan><tspan x="470.0" dy="14.3">(Виняток: LGPL дозволяє .so)</tspan></text>
<rect x="620.0" y="85.0" width="260.0" height="145.0" rx="6" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/><text x="750.0" y="118.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">3. C++ Templates та Inline</tspan><tspan x="750.0" dy="14.3"></tspan><tspan x="750.0" dy="14.3">• Тіла функцій в заголовках .h</tspan><tspan x="750.0" dy="14.3">• Код компілюється в чужий .o</tspan><tspan x="750.0" dy="14.3">• Істотне фізичне запозичення</tspan><tspan x="750.0" dy="14.3">➔ Інфікує об'єктний код</tspan><tspan x="750.0" dy="14.3">безпосередньо компілятором</tspan></text>
<rect x="40.0" y="260.0" width="860.0" height="210.0" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.0"/>
<text x="470.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ЗОНА НЕЗАЛЕЖНИХ ТВОРІВ: Розділені адресні простори ОС ➔ ЗБЕРЕЖЕННЯ ЗАКРИТОСТІ</text>
<rect x="60.0" y="295.0" width="260.0" height="160.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="190.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">1. Міжпроцесний обмін (IPC)</tspan><tspan x="190.0" dy="14.3"></tspan><tspan x="190.0" dy="14.3">• UNIX Sockets / Named Pipes</tspan><tspan x="190.0" dy="14.3">• Серіалізований протокол</tspan><tspan x="190.0" dy="14.3">• Окремі PID процесів у ядрі</tspan><tspan x="190.0" dy="14.3">➔ Незалежні програми,</tspan><tspan x="190.0" dy="14.3">пропрієтарний код захищено</tspan></text>
<rect x="340.0" y="295.0" width="260.0" height="160.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="470.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">2. Мережевий REST / gRPC API</tspan><tspan x="470.0" dy="14.3"></tspan><tspan x="470.0" dy="14.3">• Мережевий сокет TCP/IP</tspan><tspan x="470.0" dy="14.3">• Формати JSON / Protobuf</tspan><tspan x="470.0" dy="14.3">• Фізично або логічно окремо</tspan><tspan x="470.0" dy="14.3">➔ Чисто для GPLv2 / GPLv3</tspan><tspan x="470.0" dy="14.3">(Увага: AGPL вимагає відкриття)</tspan></text>
<rect x="620.0" y="295.0" width="260.0" height="160.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="750.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">3. Системні виклики ядра</tspan><tspan x="750.0" dy="14.3"></tspan><tspan x="750.0" dy="14.3">• Інтерфейс syscall (libc)</tspan><tspan x="750.0" dy="14.3">• Торвальдсів виняток у COPYING</tspan><tspan x="750.0" dy="14.3">• Драйвери через /dev і ioctl</tspan><tspan x="750.0" dy="14.3">➔ Простір користувача не</tspan><tspan x="750.0" dy="14.3">заражається ядром GPLv2</tspan></text>
</svg>