<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Екосистема ідентифікаторів та членств апаратного продукту</text>
<rect x="30.0" y="60.0" width="215.0" height="60.0" rx="6" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.5"/><text x="137.5" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="137.5" dy="0.0">IEEE-RA (Реєстратор)</tspan><tspan x="137.5" dy="14.3">IEEE Registration Authority</tspan></text>
<rect x="30.0" y="130.0" width="215.0" height="220.0" rx="6" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/><text x="137.5" y="179.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="137.5" dy="0.0">Простір адрес MAC / EUI</tspan><tspan x="137.5" dy="14.3"></tspan><tspan x="137.5" dy="14.3">• MA-L (24 біти OUI, 16.7M)</tspan><tspan x="137.5" dy="14.3">• MA-M (28 бітів, 1.04M)</tspan><tspan x="137.5" dy="14.3">• MA-S (36 бітів, 4096)</tspan><tspan x="137.5" dy="14.3">• Company ID (CID)</tspan><tspan x="137.5" dy="14.3"></tspan><tspan x="137.5" dy="14.3">Юридичний статус:</tspan><tspan x="137.5" dy="14.3">Одноразова купівля блоку</tspan><tspan x="137.5" dy="14.3">у власність (без роялті)</tspan></text>
<rect x="30.0" y="360.0" width="215.0" height="90.0" rx="6" fill="#edf2f7" stroke="#2b6cb0" stroke-width="1.5"/><text x="137.5" y="387.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="137.5" dy="0.0">Призначення:</tspan><tspan x="137.5" dy="14.3">Унікальність у L2-мережах</tspan><tspan x="137.5" dy="14.3">(Ethernet, Wi-Fi, BLE)</tspan><tspan x="137.5" dy="14.3">Запобігання ARP-колапсу</tspan></text>
<rect x="265.0" y="60.0" width="215.0" height="60.0" rx="6" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.5"/><text x="372.5" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="372.5" dy="0.0">USB-IF (Консорціум)</tspan><tspan x="372.5" dy="15.6">USB Implementers Forum</tspan></text>
<rect x="265.0" y="130.0" width="215.0" height="220.0" rx="6" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/><text x="372.5" y="179.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="372.5" dy="0.0">Дескриптори USB</tspan><tspan x="372.5" dy="14.3"></tspan><tspan x="372.5" dy="14.3">• Vendor ID (16 бітів, 65k PID)</tspan><tspan x="372.5" dy="14.3">• Нечлен: $6,000 разово</tspan><tspan x="372.5" dy="14.3">• Членство: $5,000 / рік</tspan><tspan x="372.5" dy="14.3">• Logo Admin: $3,500 / 2 роки</tspan><tspan x="372.5" dy="14.3"></tspan><tspan x="372.5" dy="14.3">Субліцензування:</tspan><tspan x="372.5" dy="14.3">Заборонено третьою стороною;</tspan><tspan x="372.5" dy="14.3">дозвіл від вендорів кремнію</tspan></text>
<rect x="265.0" y="360.0" width="215.0" height="90.0" rx="6" fill="#edf2f7" stroke="#2b6cb0" stroke-width="1.5"/><text x="372.5" y="387.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="372.5" dy="0.0">Призначення:</tspan><tspan x="372.5" dy="14.3">Монтування драйверів ОС</tspan><tspan x="372.5" dy="14.3">(WHQL, udev, CDC, HID)</tspan><tspan x="372.5" dy="14.3">Право на знак USB Trident</tspan></text>
<rect x="500.0" y="60.0" width="215.0" height="60.0" rx="6" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.5"/><text x="607.5" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="607.5" dy="0.0">Bluetooth SIG (Альянс)</tspan><tspan x="607.5" dy="15.6">Special Interest Group</tspan></text>
<rect x="500.0" y="130.0" width="215.0" height="220.0" rx="6" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/><text x="607.5" y="179.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="607.5" dy="0.0">Кваліфікація та лістинг</tspan><tspan x="607.5" dy="14.3"></tspan><tspan x="607.5" dy="14.3">• Adopter Member ($0/рік)</tspan><tspan x="607.5" dy="14.3">• Associate ($7.5k–$35k/рік)</tspan><tspan x="607.5" dy="14.3">• Declaration Fee: $9,600</tspan><tspan x="607.5" dy="14.3">  (або $2,500 за IIP стартапу)</tspan><tspan x="607.5" dy="14.3">• QDID (дизайн) + DID (виріб)</tspan><tspan x="607.5" dy="14.3"></tspan><tspan x="607.5" dy="14.3">Вимога:</tspan><tspan x="607.5" dy="14.3">Обов'язковий лістинг виробу</tspan></text>
<rect x="500.0" y="360.0" width="215.0" height="90.0" rx="6" fill="#edf2f7" stroke="#2b6cb0" stroke-width="1.5"/><text x="607.5" y="387.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="607.5" dy="0.0">Призначення:</tspan><tspan x="607.5" dy="14.3">Ліцензія на патенти PRLA</tspan><tspan x="607.5" dy="14.3">і торговельну марку Bluetooth</tspan><tspan x="607.5" dy="14.3">(захист від арешту митницею)</tspan></text>
<rect x="735.0" y="60.0" width="215.0" height="60.0" rx="6" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.5"/><text x="842.5" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="842.5" dy="0.0">Wi-Fi Alliance (Торг. марка)</tspan><tspan x="842.5" dy="14.3">Wi-Fi Alliance (WFA)</tspan></text>
<rect x="735.0" y="130.0" width="215.0" height="220.0" rx="6" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/><text x="842.5" y="179.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="842.5" dy="0.0">Маркетинг і логотипи</tspan><tspan x="842.5" dy="14.3"></tspan><tspan x="842.5" dy="14.3">• Членство: $5.8k–$38.5k/рік</tspan><tspan x="842.5" dy="14.3">• Тести в лабораторії ATL</tspan><tspan x="842.5" dy="14.3">• Wi-Fi CERTIFIED 6 / WPA3</tspan><tspan x="842.5" dy="14.3">• Passpoint / Agile Multiband</tspan><tspan x="842.5" dy="14.3"></tspan><tspan x="842.5" dy="14.3">IEEE 802.11 vs WFA:</tspan><tspan x="842.5" dy="14.3">Стандарт відкритий (IEEE),</tspan><tspan x="842.5" dy="14.3">логотип приватний (WFA)</tspan></text>
<rect x="735.0" y="360.0" width="215.0" height="90.0" rx="6" fill="#edf2f7" stroke="#2b6cb0" stroke-width="1.5"/><text x="842.5" y="387.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="842.5" dy="0.0">Призначення:</tspan><tspan x="842.5" dy="14.3">Допуск до тендерів операторів,</tspan><tspan x="842.5" dy="14.3">корпоративних RFP та право</tspan><tspan x="842.5" dy="14.3">нанесення логотипів Wi-Fi</tspan></text>
