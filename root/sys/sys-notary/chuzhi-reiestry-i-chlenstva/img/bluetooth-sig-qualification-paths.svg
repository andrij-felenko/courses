<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шляхи кваліфікації продукту в Bluetooth SIG Launch Studio</text>
<rect x="360.0" y="60.0" width="260.0" height="60.0" rx="6" fill="#e2e8f0" stroke="#4a5568" stroke-width="1.5"/><text x="490.0" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Вибір бездротової архітектури</tspan><tspan x="490.0" dy="15.6">(Bluetooth Core Specification)</tspan></text>
<rect x="40.0" y="150.0" width="420.0" height="80.0" rx="6" fill="#f0fff4" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="165.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Шлях А: Інтеграція готового RF-модуля</tspan><tspan x="250.0" dy="14.3">(Nordic, Espressif, Telink, Silicon Labs)</tspan><tspan x="250.0" dy="14.3"></tspan><tspan x="250.0" dy="14.3">• Модуль уже має готові QDID (Controller + Host + RF-PHY)</tspan><tspan x="250.0" dy="14.3">• Антена та RF-розводка не змінюються</tspan></text>
<rect x="40.0" y="255.0" width="420.0" height="95.0" rx="6" fill="#f7fafc" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="270.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Кваліфікація без повторного тестування:</tspan><tspan x="250.0" dy="14.3">1. Підписання угоди Adopter Member ($0)</tspan><tspan x="250.0" dy="14.3">2. Створення Declaration у Launch Studio</tspan><tspan x="250.0" dy="14.3">3. Посилання на наявні QDID постачальника</tspan><tspan x="250.0" dy="14.3">4. Оплата Declaration Fee ($9,600 або $2,500 IIP)</tspan><tspan x="250.0" dy="14.3">5. Отримання унікального Declaration ID (DID)</tspan></text>
<rect x="520.0" y="150.0" width="420.0" height="80.0" rx="6" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5"/><text x="730.0" y="165.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Шлях Б: Власний дизайн Chip-down / Нова антена</tspan><tspan x="730.0" dy="14.3">(Розведення трансивера на спільній платі)</tspan><tspan x="730.0" dy="14.3"></tspan><tspan x="730.0" dy="14.3">• Зміна топології друкованої плати або П-контуру узгодження</tspan><tspan x="730.0" dy="14.3">• Інтеграція власної друкованої антени (PCB trace)</tspan></text>
<rect x="520.0" y="255.0" width="420.0" height="95.0" rx="6" fill="#f7fafc" stroke="#dd6b20" stroke-width="1.5"/><text x="730.0" y="270.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Повна кваліфікація з тестуванням:</tspan><tspan x="730.0" dy="14.3">1. Випробування RF-PHY у лабораторії BQTF ($5k–$15k)</tspan><tspan x="730.0" dy="14.3">2. Заповнення форм ICS / IXIT у Launch Studio</tspan><tspan x="730.0" dy="14.3">3. Реєстрація нового Qualified Design (новий QDID)</tspan><tspan x="730.0" dy="14.3">4. Оплата Declaration Fee ($9,600 або $4,800 Associate)</tspan><tspan x="730.0" dy="14.3">5. Отримання DID та лістинг кінцевого продукту</tspan></text>
<line x1="430.0" y1="120.0" x2="250.0" y2="150.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="550.0" y1="120.0" x2="730.0" y2="150.0" stroke="#dd6b20" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="380.0" width="900.0" height="70.0" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/><text x="490.0" y="397.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Юридичний результат: Офіційне право на маркування</tspan><tspan x="490.0" dy="14.3">- Внесення моделі до публічної бази сертифікованих пристроїв Bluetooth SIG</tspan><tspan x="490.0" dy="14.3">- Право нанесення торговельної марки Bluetooth® та B-логотипу на корпус, пакування та софт</tspan><tspan x="490.0" dy="14.3">- Повний захист від арешту партії митними органами США (CBP) та ЄС за порушення прав інтелектуальної власності</tspan></text>
<line x1="250.0" y1="350.0" x2="250.0" y2="380.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="730.0" y1="350.0" x2="730.0" y2="380.0" stroke="#dd6b20" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>