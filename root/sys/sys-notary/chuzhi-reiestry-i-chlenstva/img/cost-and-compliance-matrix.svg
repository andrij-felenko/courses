<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця витрат на ідентифікатори та членства за фазами виробництва</text>
<rect x="30.0" y="60.0" width="290.0" height="45.0" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/><text x="175.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Фаза 1: Прототип та R&amp;D (&lt; 100 шт)</tspan></text>
<rect x="30.0" y="115.0" width="290.0" height="250.0" rx="6" fill="#f7fafc" stroke="#4a5568" stroke-width="1.5"/><text x="175.0" y="150.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Оптимізація витрат: $0 .. $100</tspan><tspan x="175.0" dy="14.3"></tspan><tspan x="175.0" dy="14.3">• MAC-адреси:</tspan><tspan x="175.0" dy="14.3">  Вбудовані унікальні ID чипа</tspan><tspan x="175.0" dy="14.3">  (ESP32 MAC, STM32 UID)</tspan><tspan x="175.0" dy="14.3">  або EEPROM 24AA02E48 ($0.30/шт)</tspan><tspan x="175.0" dy="14.3"></tspan><tspan x="175.0" dy="14.3">• USB VID/PID:</tspan><tspan x="175.0" dy="14.3">  Субліцензія вендора (ST/Microchip)</tspan><tspan x="175.0" dy="14.3">  або open-source pid.codes</tspan><tspan x="175.0" dy="14.3"></tspan><tspan x="175.0" dy="14.3">• Bluetooth / Wi-Fi:</tspan><tspan x="175.0" dy="14.3">  Внутрішнє тестування, без лістингу,</tspan><tspan x="175.0" dy="14.3">  без публічного використання знаків</tspan></text>
<rect x="345.0" y="60.0" width="290.0" height="45.0" rx="6" fill="#feebc8" stroke="#dd6b20" stroke-width="1.5"/><text x="490.0" y="86.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Фаза 2: Пілотна комерція (500 .. 5k шт)</tspan></text>
<rect x="345.0" y="115.0" width="290.0" height="250.0" rx="6" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5"/><text x="490.0" y="136.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Оптимізація витрат: $3,305 .. $9,305</tspan><tspan x="490.0" dy="14.3"></tspan><tspan x="490.0" dy="14.3">• MAC-адреси:</tspan><tspan x="490.0" dy="14.3">  Купівля блоку IEEE MA-S ($805)</tspan><tspan x="490.0" dy="14.3">  (4,096 унікальних EUI-48)</tspan><tspan x="490.0" dy="14.3"></tspan><tspan x="490.0" dy="14.3">• USB VID/PID:</tspan><tspan x="490.0" dy="14.3">  Субліцензований PID вендора ($0)</tspan><tspan x="490.0" dy="14.3">  або власний USB VID ($6,000)</tspan><tspan x="490.0" dy="14.3"></tspan><tspan x="490.0" dy="14.3">• Bluetooth SIG:</tspan><tspan x="490.0" dy="14.3">  Adopter ($0) + IIP Declaration ($2,500)</tspan><tspan x="490.0" dy="14.3">  зі спадкуванням QDID модуля</tspan><tspan x="490.0" dy="14.3"></tspan><tspan x="490.0" dy="14.3">• Wi-Fi:</tspan><tspan x="490.0" dy="14.3">  Маркування IEEE 802.11 ($0)</tspan></text>
<rect x="660.0" y="60.0" width="290.0" height="45.0" rx="6" fill="#c6f6d5" stroke="#27ae60" stroke-width="1.5"/><text x="805.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">Фаза 3: Масштаб (&gt; 50,000 шт)</tspan></text>
<rect x="660.0" y="115.0" width="290.0" height="250.0" rx="6" fill="#f0fff4" stroke="#27ae60" stroke-width="1.5"/><text x="805.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Повний стек відповідності: ~$25,000+</tspan><tspan x="805.0" dy="13.0"></tspan><tspan x="805.0" dy="13.0">• MAC-адреси:</tspan><tspan x="805.0" dy="13.0">  Купівля блоку IEEE MA-L ($3,255)</tspan><tspan x="805.0" dy="13.0">  (16.7M унікальних адрес)</tspan><tspan x="805.0" dy="13.0"></tspan><tspan x="805.0" dy="13.0">• USB VID/PID:</tspan><tspan x="805.0" dy="13.0">  Власний USB-IF VID ($6,000)</tspan><tspan x="805.0" dy="13.0">  + логотипна угода ($3,500)</tspan><tspan x="805.0" dy="13.0"></tspan><tspan x="805.0" dy="13.0">• Bluetooth SIG:</tspan><tspan x="805.0" dy="13.0">  Associate Member ($7.5k/рік)</tspan><tspan x="805.0" dy="13.0">  + Declaration Fee ($4,800/модель)</tspan><tspan x="805.0" dy="13.0"></tspan><tspan x="805.0" dy="13.0">• Wi-Fi Alliance:</tspan><tspan x="805.0" dy="13.0">  Implementer ($5.8k/рік) + ATL сертифікація</tspan></text>
<rect x="30.0" y="385.0" width="920.0" height="65.0" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/><text x="490.0" y="407.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Економіка на одиницю продукції (Unit Cost):</tspan><tspan x="490.0" dy="14.3">- При тиражі 1,000 шт ідентифікатори додають ~$3.30 до собівартості кожного виробу.</tspan><tspan x="490.0" dy="14.3">- При тиражі 100,000 шт повний юридичний стек ідентифікаторів коштує менше $0.25 на один пристрій.</tspan></text>
</svg>