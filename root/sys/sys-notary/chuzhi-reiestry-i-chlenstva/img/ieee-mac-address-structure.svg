<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія адреси EUI-48 (MAC) та рівні розподілу IEEE-RA</text>
<rect x="40.0" y="60.0" width="440.0" height="45.0" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/><text x="260.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Старші 24..36 бітів: Префікс організації (IEEE-RA OUI)</tspan></text>
<rect x="500.0" y="60.0" width="440.0" height="45.0" rx="6" fill="#f0fff4" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Молодші 12..24 біти: Серійний номер пристрою (Extension / Device ID)</tspan></text>
<rect x="40.0" y="120.0" width="135.0" height="45.0" rx="6" fill="#feebc8" stroke="#dd6b20" stroke-width="1.5"/><text x="107.5" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="107.5" dy="0.0">Байт 0 (Octet 1)</tspan><tspan x="107.5" dy="14.3">[ b7 .. b1 | b0 ]</tspan></text>
<rect x="190.0" y="120.0" width="135.0" height="45.0" rx="6" fill="#feebc8" stroke="#dd6b20" stroke-width="1.5"/><text x="257.5" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="257.5" dy="0.0">Байт 1 (Octet 2)</tspan><tspan x="257.5" dy="14.3">[ 8 бітів ]</tspan></text>
<rect x="345.0" y="120.0" width="135.0" height="45.0" rx="6" fill="#feebc8" stroke="#dd6b20" stroke-width="1.5"/><text x="412.5" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="412.5" dy="0.0">Байт 2 (Octet 3)</tspan><tspan x="412.5" dy="14.3">[ 8 бітів ]</tspan></text>
<rect x="500.0" y="120.0" width="135.0" height="45.0" rx="6" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5"/><text x="567.5" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="567.5" dy="0.0">Байт 3 (Octet 4)</tspan><tspan x="567.5" dy="14.3">[ 8 бітів ]</tspan></text>
<rect x="655.0" y="120.0" width="135.0" height="45.0" rx="6" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5"/><text x="722.5" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="722.5" dy="0.0">Байт 4 (Octet 5)</tspan><tspan x="722.5" dy="14.3">[ 8 бітів ]</tspan></text>
<rect x="805.0" y="120.0" width="135.0" height="45.0" rx="6" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5"/><text x="872.5" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="872.5" dy="0.0">Байт 5 (Octet 6)</tspan><tspan x="872.5" dy="14.3">[ 8 бітів ]</tspan></text>
<rect x="40.0" y="185.0" width="440.0" height="125.0" rx="6" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5"/><text x="260.0" y="194.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Анатомія Байта 0 (Least Significant Bit транслюється першим):</tspan><tspan x="260.0" dy="14.3"></tspan><tspan x="260.0" dy="14.3">• Біт 0 (I/G — Individual/Group):</tspan><tspan x="260.0" dy="14.3">  0 = Unicast (індивідуальна адреса пристрою)</tspan><tspan x="260.0" dy="14.3">  1 = Multicast / Broadcast (групова адреса)</tspan><tspan x="260.0" dy="14.3"></tspan><tspan x="260.0" dy="14.3">• Біт 1 (U/L — Universal/Local):</tspan><tspan x="260.0" dy="14.3">  0 = Universally Administered (офіційно видана IEEE OUI)</tspan><tspan x="260.0" dy="14.3">  1 = Locally Administered (LAA, локальна рандомізація)</tspan></text>
<rect x="500.0" y="185.0" width="440.0" height="38.0" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/><text x="720.0" y="207.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">MA-L (Large, $3,255): 24 біти префікс → 16,777,216 адрес (2^24)</tspan></text>
<rect x="500.0" y="230.0" width="440.0" height="38.0" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/><text x="720.0" y="252.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">MA-M (Medium, $1,860): 28 бітів префікс → 1,048,576 адрес (2^20)</tspan></text>
<rect x="500.0" y="275.0" width="440.0" height="38.0" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/><text x="720.0" y="297.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">MA-S (Small, $805): 36 бітів префікс → 4,096 адрес (2^12)</tspan></text>
<rect x="40.0" y="330.0" width="900.0" height="115.0" rx="6" fill="#f7fafc" stroke="#2b6cb0" stroke-width="1.5"/><text x="490.0" y="362.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Конвертація EUI-48 в EUI-64 (для IPv6 SLAAC та Zigbee/Thread IEEE 802.15.4):</tspan><tspan x="490.0" dy="14.3">1. Адреса EUI-48 ділиться навпіл: [Байт 0..2 (OUI)] та [Байт 3..5 (Device ID)].</tspan><tspan x="490.0" dy="14.3">2. Посередині вставляється фіксоване 16-бітне значення 0xFFFE.</tspan><tspan x="490.0" dy="14.3">3. У першому байті інвертується біт U/L (Modified EUI-64 format для IPv6 Interface Identifier).</tspan><tspan x="490.0" dy="14.3">Приклад: 00:1A:2B : 3C:4D:5E → 00:1A:2B : FF:FE : 3C:4D:5E → IPv6 ID: 021A:2BFF:FE3C:4D5E</tspan></text>
</svg>