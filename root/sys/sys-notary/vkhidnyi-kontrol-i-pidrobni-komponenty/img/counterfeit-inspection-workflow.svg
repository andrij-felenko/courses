<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1012 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1012" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Багаторівневий протокол вхідного контролю компонентів за стандартами AS6081 та IDEA-STD-1010</text>
<rect x="25.0" y="60.0" width="172.0" height="190.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="104.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">Рівень 1: Пакування та документи</text>
<text x="35.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="35.0" dy="0.0">• Сертифікат відповідності (CoC)</tspan><tspan x="35.0" dy="12.8">• Перевірка захисту MSL (J-STD-033)</tspan><tspan x="35.0" dy="12.8">• Заводські стрічки, маркування, 2D-код</tspan><tspan x="35.0" dy="12.8">• Пакувальний антистатичний ESD-аудит</tspan></text>
<line x1="199.0" y1="155.0" x2="213.0" y2="155.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="217.0" y="60.0" width="172.0" height="190.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8"/>
<text x="303.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ca8a04" text-anchor="middle" font-weight="700">Рівень 2: Зовнішній оптичний огляд</text>
<text x="227.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="227.0" dy="0.0">• Мікроскопія поверхні компаунду</tspan><tspan x="227.0" dy="12.8">• Тест розчинниками (Acetone, NMP)</tspan><tspan x="227.0" dy="12.8">• Виявлення Blacktop та перемаркування</tspan><tspan x="227.0" dy="12.8">• Стан виводів, копланарність, дефекти</tspan></text>
<line x1="391.0" y1="155.0" x2="405.0" y2="155.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="409.0" y="60.0" width="172.0" height="190.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<text x="495.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">Рівень 3: Рентгенографія та XRF</text>
<text x="419.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="419.0" dy="0.0">• Рентген (X-Ray): кристал і розварка</tspan><tspan x="419.0" dy="12.8">• Виявлення пустот і зміщення підкладки</tspan><tspan x="419.0" dy="12.8">• Спектрометрія XRF: склад припою</tspan><tspan x="419.0" dy="12.8">• Перевірка вмісту свинцю (Pb / RoHS)</tspan></text>
<line x1="583.0" y1="155.0" x2="597.0" y2="155.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="601.0" y="60.0" width="172.0" height="190.0" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8"/>
<text x="687.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9333ea" text-anchor="middle" font-weight="700">Рівень 4: Декапсуляція та кристал</text>
<text x="611.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="611.0" dy="0.0">• Кислотне травлення (HNO3 / H2SO4)</tspan><tspan x="611.0" dy="12.8">• Огляд топології кристала (Die mask)</tspan><tspan x="611.0" dy="12.8">• Верифікація логотипу та копірайту</tspan><tspan x="611.0" dy="12.8">• Перевірка ревізії кремнієвої топології</tspan></text>
<line x1="775.0" y1="155.0" x2="789.0" y2="155.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="793.0" y="60.0" width="172.0" height="190.0" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.8"/>
<text x="879.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e11d48" text-anchor="middle" font-weight="700">Рівень 5: Електропараметрика</text>
<text x="803.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="803.0" dy="0.0">• Зняття сигнатур переходів (Curve Tracer)</tspan><tspan x="803.0" dy="12.8">• Струм спокою споживання (IDD_q)</tspan><tspan x="803.0" dy="12.8">• Вхідні/вихідні струми витоку та рівні</tspan><tspan x="803.0" dy="12.8">• Тестування на температурних межах</tspan></text>
<rect x="25.0" y="275.0" width="950.0" height="275.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="500.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">МАТРИЦЯ ПРИЙНЯТТЯ РІШЕНЬ ТА ПРОЦЕДУРА КВАЛІФІКАЦІЇ ПАРТІЇ</text>
<rect x="45.0" y="325.0" width="425.0" height="205.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
<text x="257.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">ПРИДАТНО: ДОПУСК У СЕРІЙНЕ ВИРОБНИЦТВО</text>
<text x="60.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">1. Усі 5 рівнів пройдено без зауважень за вибіркою ANSI/ASQ Z1.4.</tspan><tspan x="60.0" dy="12.8">2. V-I сигнатури ESD-діодів повністю відповідають еталону (UUT ≈ Gold).</tspan><tspan x="60.0" dy="12.8">3. Відсутні сліди шліфування, розчинники не змивають маркування.</tspan><tspan x="60.0" dy="12.8">4. Рентген підтверджує автентичну геометрію підкладки та дротів.</tspan><tspan x="60.0" dy="12.8">5. Формується верифікаційний паспорт партії та вноситься в PLM/ERP.</tspan></text>
<rect x="530.0" y="325.0" width="425.0" height="205.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
<text x="742.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">ВІДХИЛЕНО: ВИЯВЛЕНО ПІДРОБКУ АБО БРАК</text>
<text x="545.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="545.0" dy="0.0">1. Негайна ізоляція всієї партії у фізичний карантинний ізолятор.</tspan><tspan x="545.0" dy="12.8">2. Блокування лоту в ERP-системі для унеможливлення видачі на склад.</tspan><tspan x="545.0" dy="12.8">3. Оформлення акта невідповідності (Non-Conformance Report, NCR).</tspan><tspan x="545.0" dy="12.8">4. Внесення інциденту до баз даних контрафакту GIDEP та ERAI.</tspan><tspan x="545.0" dy="12.8">5. Юридична претензія постачальнику й утилізація без повернення на ринок.</tspan></text>
</svg>