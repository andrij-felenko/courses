<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця технічних порогових показників експортного контролю (ECCN / CCL)</text>
<rect x="30.0" y="60.0" width="176.0" height="55.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="118.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">Апаратна криптографія</text>
<text x="118.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Категорія 5 (Part 2)</text>
<rect x="30.0" y="125.0" width="176.0" height="195.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="118.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">Комерційний / Масовий ринок</text>
<text x="118.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="118.0" dy="0.0">Симетрична &lt;= 56 біт,</tspan><tspan x="118.0" dy="11.7">асиметрична &lt;= 512 біт.</tspan><tspan x="118.0" dy="11.7">Загальнодоступні протоколи</tspan><tspan x="118.0" dy="11.7">TLS/SSH/Wi-Fi (Note 4 / ENC).</tspan><tspan x="118.0" dy="11.7">Класифікація: 5A992 / EAR99.</tspan></text>
<rect x="30.0" y="330.0" width="176.0" height="225.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="118.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">Подвійне призначення (5A002)</text>
<text x="118.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="118.0" dy="0.0">Апаратні AES-128/256,</tspan><tspan x="118.0" dy="11.7">RSA &gt; 512, ECC &gt; 112 біт.</tspan><tspan x="118.0" dy="11.7">Власні криптопротоколи,</tspan><tspan x="118.0" dy="11.7">прискорювачі шифрування,</tspan><tspan x="118.0" dy="11.7">інструменти криптоаналізу.</tspan></text>
<rect x="220.0" y="60.0" width="176.0" height="55.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="308.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">Швидкодіючі АЦП та ЦАП</text>
<text x="308.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Категорія 3 (3A001.a.5)</text>
<rect x="220.0" y="125.0" width="176.0" height="195.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="308.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">Стандартні промислові</text>
<text x="308.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="308.0" dy="0.0">Аудіокодеки, промислова</tspan><tspan x="308.0" dy="11.7">телеметрія та вимірювання.</tspan><tspan x="308.0" dy="11.7">Частота &lt; 100 MSPS при 12-16 біт.</tspan><tspan x="308.0" dy="11.7">Класифікація: 3A991 / EAR99.</tspan></text>
<rect x="220.0" y="330.0" width="176.0" height="225.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="308.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">Високошвидкісні (3A001)</text>
<text x="308.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="308.0" dy="0.0">Частота &gt;= 1 GSPS при</tspan><tspan x="308.0" dy="11.7">роздільності ENOB &gt; 10–12 біт.</tspan><tspan x="308.0" dy="11.7">Багатоканальні АЦП для SDR,</tspan><tspan x="308.0" dy="11.7">радарів з ФАР та станцій РЕБ.</tspan></text>
<rect x="410.0" y="60.0" width="176.0" height="55.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="498.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">Температурний діапазон</text>
<text x="498.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Категорія 3 (3A001.a.2)</text>
<rect x="410.0" y="125.0" width="176.0" height="195.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="498.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">Commercial / Industrial</text>
<text x="498.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="498.0" dy="0.0">Комерційний: 0 °C .. +70 °C</tspan><tspan x="498.0" dy="11.7">Промисловий: -40 °C .. +85 °C</tspan><tspan x="498.0" dy="11.7">Стандартний кремній для ПЗ</tspan><tspan x="498.0" dy="11.7">та побутової електроніки.</tspan><tspan x="498.0" dy="11.7">Класифікація: EAR99.</tspan></text>
<rect x="410.0" y="330.0" width="176.0" height="225.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="498.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">Military / Space (3A001)</text>
<text x="498.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="498.0" dy="0.0">Повний діапазон:</tspan><tspan x="498.0" dy="11.7">від -55 °C до +125 °C і вище.</tspan><tspan x="498.0" dy="11.7">Стійкість до екстремальних</tspan><tspan x="498.0" dy="11.7">термоударів ракетних пусків</tspan><tspan x="498.0" dy="11.7">і перевантажень (MIL-STD-883).</tspan></text>
<rect x="600.0" y="60.0" width="176.0" height="55.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="688.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">Радіаційна стійкість</text>
<text x="688.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Категорія 3 (3A001.a.1)</text>
<rect x="600.0" y="125.0" width="176.0" height="195.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="688.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">Цивільний кремній</text>
<text x="688.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="688.0" dy="0.0">Звичайні комерційні ІС.</tspan><tspan x="688.0" dy="11.7">Без гарантованої стійкості</tspan><tspan x="688.0" dy="11.7">до сумарної дози радіації</tspan><tspan x="688.0" dy="11.7">(TID &lt; 5 крад).</tspan><tspan x="688.0" dy="11.7">Класифікація: EAR99.</tspan></text>
<rect x="600.0" y="330.0" width="176.0" height="225.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="688.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">Rad-Hard (3A001.a.1)</text>
<text x="688.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="688.0" dy="0.0">Сумарна доза (TID):</tspan><tspan x="688.0" dy="11.7">&gt; 5×10³ Гр(Si) (500 крад(Si)).</tspan><tspan x="688.0" dy="11.7">Стійкість до замикання (SEL)</tspan><tspan x="688.0" dy="11.7">при LET &gt; 80 МеВ·см²/мг.</tspan><tspan x="688.0" dy="11.7">Космічні та військові системи.</tspan></text>
<rect x="790.0" y="60.0" width="176.0" height="55.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="878.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">MEMS-гіроскопи (IMU)</text>
<text x="878.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Категорія 7 (7A002 / 7A102)</text>
<rect x="790.0" y="125.0" width="176.0" height="195.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="878.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">Споживчі / Автомобільні</text>
<text x="878.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="878.0" dy="0.0">Дрейф нуля (In-run bias):</tspan><tspan x="878.0" dy="11.7">&gt; 5..10 °/год (смартфони, авто).</tspan><tspan x="878.0" dy="11.7">Непридатні для тривалого</tspan><tspan x="878.0" dy="11.7">автономного счислення шляху.</tspan><tspan x="878.0" dy="11.7">Класифікація: 7A994 / EAR99.</tspan></text>
<rect x="790.0" y="330.0" width="176.0" height="225.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="878.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">Навігаційні (7A002/7A102)</text>
<text x="878.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="878.0" dy="0.0">Дрейф нуля &lt; 0.1..0.5 °/год.</tspan><tspan x="878.0" dy="11.7">Висока стабільність масштабного</tspan><tspan x="878.0" dy="11.7">коефіцієнта (&lt; 500 ppm).</tspan><tspan x="878.0" dy="11.7">Автономна навігація ракет</tspan><tspan x="878.0" dy="11.7">та БПЛА без сигналів GNSS.</tspan></text>
</svg>