<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дерево ухвалення рішень експортного контролю: ITAR, EAR та EAR99</text>
<rect x="40.0" y="60.0" width="420.0" height="110.0" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
<text x="250.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">1. Оцінка юрисдикції: ITAR чи EAR?</text>
<text x="250.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Чи розроблено виріб/ПЗ спеціально для військових</tspan><tspan x="250.0" dy="13.7">систем за переліком озброєнь США (USML)?</tspan><tspan x="250.0" dy="13.7">(Правило повного контролю «see-through»)</tspan></text>
<line x1="460.0" y1="115.0" x2="540.0" y2="115.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">ТАК</text>
<rect x="550.0" y="60.0" width="410.0" height="110.0" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.0"/>
<text x="755.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7f1d1d" text-anchor="middle" font-weight="700">Юрисдикція ITAR (USML / Держдепартамент)</text>
<text x="755.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle"><tspan x="755.0" dy="0.0">• Військовий виріб або компонент зброї / космосу</tspan><tspan x="755.0" dy="13.7">• Сувора заборона передачі без ліцензії DDTC</tspan><tspan x="755.0" dy="13.7">• Будь-який іноземний доступ = кримінальний злочин</tspan></text>
<line x1="250.0" y1="170.0" x2="250.0" y2="220.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="275.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">НІ</text>
<rect x="40.0" y="220.0" width="420.0" height="110.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
<text x="250.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700">2. Перевірка контрольного списку (CCL)</text>
<text x="250.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Чи підпадають параметри виробу під конкретний</tspan><tspan x="250.0" dy="13.7">5-значний номер ECCN (наприклад, 3A001, 5A002, 7A002)</tspan><tspan x="250.0" dy="13.7">через високі інженерні характеристики?</tspan></text>
<line x1="460.0" y1="275.0" x2="540.0" y2="275.0" stroke="#059669" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle" font-weight="700">НІ</text>
<rect x="550.0" y="220.0" width="410.0" height="110.0" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2.0"/>
<text x="755.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#065f46" text-anchor="middle" font-weight="700">Кошик EAR99 (Комерційні вироби)</text>
<text x="755.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#065f46" text-anchor="middle"><tspan x="755.0" dy="0.0">• Товари загального комерційного призначення</tspan><tspan x="755.0" dy="13.7">• За замовчуванням експорт без ліцензії (NLR)</tspan><tspan x="755.0" dy="13.7">• Перевірка лише ембарго та санкційних списків</tspan></text>
<line x1="250.0" y1="330.0" x2="250.0" y2="380.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="275.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">ТАК</text>
<rect x="40.0" y="380.0" width="420.0" height="110.0" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
<text x="250.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">3. Аналіз критеріїв ECCN та винятків</text>
<text x="250.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">• Криптографія: масовий ринок Note 4 / 5A992.c?</tspan><tspan x="250.0" dy="13.7">• Температура, АЦП, дрейф гіроскопа, радіація?</tspan><tspan x="250.0" dy="13.7">• Чи діють винятки з ліцензування (наприклад, ENC)?</tspan></text>
<line x1="460.0" y1="435.0" x2="540.0" y2="435.0" stroke="#4f46e5" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#4f46e5" text-anchor="middle" font-weight="700">Виняток</text>
<rect x="550.0" y="380.0" width="410.0" height="110.0" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2.0"/>
<text x="755.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#3730a3" text-anchor="middle" font-weight="700">Винятки з ліцензування (License Exceptions)</text>
<text x="755.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#3730a3" text-anchor="middle"><tspan x="755.0" dy="0.0">• 5A992.c / ENC: споживча криптографія масового ринку</tspan><tspan x="755.0" dy="13.7">• LVS (обмежена вартість), TMP (тимчасовий вивіз)</tspan><tspan x="755.0" dy="13.7">• Спрощене декларування без індивідуальної ліцензії</tspan></text>
<line x1="250.0" y1="490.0" x2="250.0" y2="520.0" stroke="#475569" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="520.0" width="920.0" height="75.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="500.0" y="545.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">4. Фінальний комплаєнс: Країна (Country Chart) + Кінцевий користувач (Entity List / KYC)</text>
<text x="500.0" y="570.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Перевірка отримувача за базами Denied Persons, Entity List, військового кінцевого використання (MEU)</tspan><tspan x="500.0" dy="12.5">Розрахунок правила De Minimis (10% для країн ембарго, 25% загальне) -&gt; Рішення: Ліцензія BIS або NLR</tspan></text>
</svg>