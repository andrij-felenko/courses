<rect x="500.0" y="200.0" width="190.0" height="100.0" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="595.0" y="227.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Фізична природа:</tspan><tspan x="595.0" dy="13.0">• Гарячий радіатор (&gt;65 °C)</tspan><tspan x="595.0" dy="13.0">• Гострі кромки шасі</tspan><tspan x="595.0" dy="13.0">• Ризик затискання пальців</tspan><tspan x="595.0" dy="13.0">• Акустичний шум сигналізатора</tspan></text>
