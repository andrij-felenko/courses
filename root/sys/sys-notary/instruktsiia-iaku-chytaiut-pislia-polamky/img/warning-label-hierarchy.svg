<rect x="730.0" y="310.0" width="190.0" height="95.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="825.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Обов'язкова дія:</tspan><tspan x="825.0" dy="13.0">Одягти антистатичний браслет.</tspan><tspan x="825.0" dy="13.0">Вимкнути живлення перед</tspan><tspan x="825.0" dy="13.0">підключенням датчиків.</tspan><tspan x="825.0" dy="13.0">Не вимикати під час запису.</tspan></text>
