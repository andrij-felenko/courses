<rect x="40.0" y="115.0" width="190.0" height="75.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="135.0" y="136.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Рівень ризику:</tspan><tspan x="135.0" dy="13.0">НЕМАЄ ПРАВА НА ПОМИЛКУ.</tspan><tspan x="135.0" dy="13.0">Неминуча загроза життю</tspan><tspan x="135.0" dy="13.0">або найтяжчого каліцтва.</tspan></text>
<rect x="40.0" y="200.0" width="190.0" height="100.0" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text x="135.0" y="229.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Фізична природа:</tspan><tspan x="135.0" dy="11.7">• Висока напруга (&gt;600 В)</tspan><tspan x="135.0" dy="11.7">• Відкриті обертові вали</tspan><tspan x="135.0" dy="11.7">• Летальні отруйні гази</tspan><tspan x="135.0" dy="11.7">• Пряме лазерне випромінювання 4 класу</tspan></text>
<rect x="40.0" y="310.0" width="190.0" height="95.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="135.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Обов'язкова дія:</tspan><tspan x="135.0" dy="13.0">НЕГАЙНО ЗНЕСТРУМИТИ.</tspan><tspan x="135.0" dy="13.0">Вхід дозволено лише після</tspan><tspan x="135.0" dy="13.0">повної процедури LOTO</tspan><tspan x="135.0" dy="13.0">(Lockout / Tagout).</tspan></text>
