<rect x="45.0" y="98.0" width="220.0" height="46.0" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="155.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">2G (GSM / GPRS / EDGE)</text>
<text x="155.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1991 — 2025/2030</text>
<rect x="275.0" y="98.0" width="680.0" height="46.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="615.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Спектральна ефективність: 0.1–0.2 біт/с/Гц</tspan><tspan x="615.0" dy="11.9">США: вимкнено (2017–2020); ЄС: тримається через eCall і лічильники (до 2026–2030)</tspan><tspan x="615.0" dy="11.9">Статус: критичний ризик раптового відключення</tspan></text>
<rect x="45.0" y="154.0" width="220.0" height="46.0" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="155.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c2410c" text-anchor="middle" font-weight="700">3G (UMTS / HSPA+)</text>
<text x="155.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">2001 — 2022/2025</text>
<rect x="275.0" y="154.0" width="680.0" height="46.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="615.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Спектральна ефективність: 0.5–1.0 біт/с/Гц</tspan><tspan x="615.0" dy="11.9">США/ЄС/Азія: масове вимкнення завершено / на фінальній стадії</tspan><tspan x="615.0" dy="11.9">Частоти 2100/900 МГц повністю передані під LTE та 5G NR</tspan></text>
<rect x="45.0" y="210.0" width="220.0" height="46.0" rx="5" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="155.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#047857" text-anchor="middle" font-weight="700">4G (LTE / LTE-M / NB-IoT)</text>
<text x="155.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">2010 — 2040+</text>
<rect x="275.0" y="210.0" width="680.0" height="46.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="615.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Спектральна ефективність: 2.0–4.0 біт/с/Гц</tspan><tspan x="615.0" dy="11.9">Фундаментальний несучий шар для IoT (Rel 13–16). Гарантована робота в 2030-х</tspan><tspan x="615.0" dy="11.9">Підтримка PSM, eDRX, автономність до 10–15 років на батареї</tspan></text>
<rect x="45.0" y="266.0" width="220.0" height="46.0" rx="5" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.5"/>
<text x="155.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#4338ca" text-anchor="middle" font-weight="700">5G &amp; NTN (RedCap / 5G NR / Супутник)</text>
<text x="155.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">2020 — 2045+</text>
<rect x="275.0" y="266.0" width="680.0" height="46.0" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="615.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Спектральна ефективність: 5.0–10.0+ біт/с/Гц</tspan><tspan x="615.0" dy="11.9">3GPP Rel 17/18: пряме підключення до супутників (NTN) та дешеві RedCap-модеми</tspan><tspan x="615.0" dy="11.9">Масове розгортання та заміна вибулих стандартів</tspan></text>
<rect x="30.0" y="345.0" width="940.0" height="215.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="500.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">РЕФАРМІНГ СПЕКТРА: МІГРАЦІЯ СМУГ ВІД 2G/3G ДО LTE-M, NB-IoT ТА 5G NR</text>
<rect x="55.0" y="385.0" width="285.0" height="155.0" rx="6" fill="#dbeafe" stroke="#1d4999" stroke-width="1.8"/>
<text x="197.5" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4999" text-anchor="middle" font-weight="700"><tspan x="197.5" dy="0.0">Sub-1GHz (800 / 900 МГц)</tspan><tspan x="197.5" dy="13.2">B8, B20, B28</tspan></text>
<text x="197.5" y="457.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="197.5" dy="0.0">Раніше: GSM-900 (200 кГц канали)</tspan><tspan x="197.5" dy="12.3">Зараз: NB-IoT (Guard-band/In-band) + LTE-M</tspan><tspan x="197.5" dy="12.3">Перевага: проникнення крізь стіни та радіус до 15–35 км</tspan></text>
<rect x="365.0" y="385.0" width="285.0" height="155.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="507.5" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700"><tspan x="507.5" dy="0.0">Mid-band (1800 / 2100 МГц)</tspan><tspan x="507.5" dy="13.2">B1, B3</tspan></text>
<text x="507.5" y="457.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="507.5" dy="0.0">Раніше: DCS-1800, 3G UMTS-2100</tspan><tspan x="507.5" dy="12.3">Зараз: LTE FDD (15–20 МГц) та 5G NR Band n1/n3</tspan><tspan x="507.5" dy="12.3">Перевага: висока пропускна здатність</tspan></text>
<rect x="675.0" y="385.0" width="285.0" height="155.0" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
<text x="817.5" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6d28d9" text-anchor="middle" font-weight="700"><tspan x="817.5" dy="0.0">Супутниковий S/L-band</tspan><tspan x="817.5" dy="13.2">3GPP Rel 17 NTN</tspan></text>
<text x="817.5" y="457.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="817.5" dy="0.0">Прямий канал модем ↔ супутник (LEO/GEO)</tspan><tspan x="817.5" dy="12.3">Компенсація доплерівського зсуву та RTT ~250–540 мс</tspan><tspan x="817.5" dy="12.3">Резервний канал за повної відсутності вишок</tspan></text>
</svg>