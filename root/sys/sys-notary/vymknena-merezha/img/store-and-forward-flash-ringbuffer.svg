<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура циклічного Flash-буфера Store-and-Forward при втраті мережі</text>
<rect x="30.0" y="55.0" width="940.0" height="245.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="500.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">СТАН СЕКТОРІВ FLASH-ПАМ'ЯТІ (4 КБ СЕКТОРИ З ВИРІВНЮВАННЯМ ЗНОСУ)</text>
<rect x="55.0" y="98.0" width="165.0" height="140.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
<text x="137.5" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-weight="700">Сектор #0 (DIRTY)</text>
<text x="137.5" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="137.5" dy="0.0">Статус: 0x00</tspan><tspan x="137.5" dy="12.3">Всі записи підтверджено</tspan><tspan x="137.5" dy="12.3">(ACK отримано)</tspan><tspan x="137.5" dy="12.3">Очікує background erase</tspan></text>
<line x1="222.0" y1="168.0" x2="236.0" y2="168.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="240.0" y="98.0" width="165.0" height="140.0" rx="6" fill="#e0e7ff" stroke="#4338ca" stroke-width="1.8"/>
<text x="322.5" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#4338ca" text-anchor="middle" font-weight="700">Сектор #1 (TAIL)</text>
<text x="322.5" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="322.5" dy="0.0">Статус: 0xFC (FULL)</tspan><tspan x="322.5" dy="12.3">Поточний хвіст зчитування</tspan><tspan x="322.5" dy="12.3">Вивантаження в мережу</tspan><tspan x="322.5" dy="12.3">Зчитування батчів</tspan></text>
<line x1="407.0" y1="168.0" x2="421.0" y2="168.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="425.0" y="98.0" width="165.0" height="140.0" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
<text x="507.5" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">Сектор #2 (QUEUED)</text>
<text x="507.5" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="507.5" dy="0.0">Статус: 0xFC (FULL)</tspan><tspan x="507.5" dy="12.3">Черга невідправлених даних</tspan><tspan x="507.5" dy="12.3">Записи з CRC-32</tspan><tspan x="507.5" dy="12.3">Очікує своєї черги</tspan></text>
<line x1="592.0" y1="168.0" x2="606.0" y2="168.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="610.0" y="98.0" width="165.0" height="140.0" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
<text x="692.5" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#047857" text-anchor="middle" font-weight="700">Сектор #3 (HEAD)</text>
<text x="692.5" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="692.5" dy="0.0">Статус: 0xFE (ACTIVE)</tspan><tspan x="692.5" dy="12.3">Поточна голова запису</tspan><tspan x="692.5" dy="12.3">Дописування телеметрії</tspan><tspan x="692.5" dy="12.3">Вказівник Write Head</tspan></text>
<line x1="777.0" y1="168.0" x2="791.0" y2="168.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="795.0" y="98.0" width="165.0" height="140.0" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.8"/>
<text x="877.5" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle" font-weight="700">Сектор #4 (FREE)</text>
<text x="877.5" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="877.5" dy="0.0">Статус: 0xFF (ERASED)</tspan><tspan x="877.5" dy="12.3">Стертий сектор (0xFF)</tspan><tspan x="877.5" dy="12.3">Готовий до ротації</tspan><tspan x="877.5" dy="12.3">Знос: N циклів</tspan></text>
<text x="500.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-style="italic">Циклічна ротація секторів (Tail Cursor вивантажує -&gt; Sector Erase -&gt; Head переходить до стертого)</text>
<rect x="30.0" y="315.0" width="940.0" height="245.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="500.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">СТРУКТУРА ЗАПИСУ ТА АТОМАРНІ ПЕРЕХОДИ БІТІВ (1 -&gt; 0 БЕЗ СТИРАННЯ)</text>
<rect x="55.0" y="360.0" width="260.0" height="180.0" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
<text x="185.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0284c7" text-anchor="middle" font-weight="700">Заголовок сектора (16 байтів)</text>
<text x="185.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">• Magic: 0x53464C53 ('SFLS')</tspan><tspan x="185.0" dy="12.8">• Seq Number: uint32_t (монотонний)</tspan><tspan x="185.0" dy="12.8">• Erase Count: uint32_t (лічильник зносу)</tspan><tspan x="185.0" dy="12.8">• Sector State: 1 байт</tspan><tspan x="185.0" dy="12.8">   0xFF (ERASED) -&gt; 0xFE (ACTIVE)</tspan><tspan x="185.0" dy="12.8">   -&gt; 0xFC (FULL) -&gt; 0x00 (DIRTY)</tspan><tspan x="185.0" dy="12.8">• CRC-16 заголовка</tspan></text>
<rect x="340.0" y="360.0" width="300.0" height="180.0" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
<text x="490.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle" font-weight="700">Запис телеметрії (Frame Layout)</text>
<text x="490.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">• Magic Record: 0xAA55 (2 байти)</tspan><tspan x="490.0" dy="12.8">• Record State: 0xFF -&gt; 0xFE (Writing)</tspan><tspan x="490.0" dy="12.8">   -&gt; 0xFC (Committed) -&gt; 0x00 (Acked)</tspan><tspan x="490.0" dy="12.8">• Payload Length: uint16_t</tspan><tspan x="490.0" dy="12.8">• Sequence ID: uint32_t</tspan><tspan x="490.0" dy="12.8">• Timestamp Delta: Varint (1–4 байти)</tspan><tspan x="490.0" dy="12.8">• Compressed Payload (Delta+Varint)</tspan><tspan x="490.0" dy="12.8">• Checksum: CRC-32 (4 байти)</tspan></text>
<rect x="665.0" y="360.0" width="280.0" height="180.0" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="805.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e11d48" text-anchor="middle" font-weight="700">Аварійне знеструмлення (Power-Fail)</text>
<text x="805.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">1. Запис заголовка і даних у Flash</tspan><tspan x="805.0" dy="12.3">2. Обчислення CRC-32 буфера даних</tspan><tspan x="805.0" dy="12.3">3. Фінальний коміт: запис 0xFC у State</tspan><tspan x="805.0" dy="12.3"></tspan><tspan x="805.0" dy="12.3">При раптовому вимиканні живлення:</tspan><tspan x="805.0" dy="12.3">• Якщо State == 0xFE або CRC бітий:</tspan><tspan x="805.0" dy="12.3">  запис вважається незавершеним,</tspan><tspan x="805.0" dy="12.3">  ігнорується та затирається.</tspan></text>
</svg>