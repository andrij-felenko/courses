<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура розблокування Secure Boot: перехідний завантажувач та обхід верифікації</text>
<rect x="40.0" y="60.0" width="410.0" height="410.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="245.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">Заводський Secure Boot (Виробництво)</text>
<line x1="55.0" y1="105.0" x2="435.0" y2="105.0" stroke="#64748b" stroke-width="1.0" stroke-dasharray="2,2"/>
<rect x="60.0" y="120.0" width="370.0" height="65.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="245.0" y="149.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">1. Апаратний BootROM:</tspan><tspan x="245.0" dy="14.3">Зчитує eFuses (SRK Hash) -&gt; Перевіряє підпис SPL вендора</tspan></text>
<line x1="245.0" y1="185.0" x2="245.0" y2="205.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="205.0" width="370.0" height="65.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="245.0" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">2. Заводський U-Boot (Підписаний RSA-2048/4096):</tspan><tspan x="245.0" dy="13.0">Ініціалізує DDR RAM -&gt; Перевіряє RSA-підпис образу `fitImage`</tspan></text>
<line x1="245.0" y1="270.0" x2="245.0" y2="290.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="290.0" width="370.0" height="75.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="245.0" y="317.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">3. Перевірка ядра Linux та DTB:</tspan><tspan x="245.0" dy="14.3">Якщо геш або цифровий підпис не збігаються:</tspan><tspan x="245.0" dy="14.3">`panic(&quot;Signature verification failed: CPU Halted&quot;)`</tspan></text>
<line x1="245.0" y1="365.0" x2="245.0" y2="385.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="385.0" width="370.0" height="65.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="245.0" y="414.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Результат спроби запуску модифікованого ядра:</tspan><tspan x="245.0" dy="14.3">Процесор зупиняється, сторонній код блокується [✗]</tspan></text>
<rect x="490.0" y="60.0" width="410.0" height="410.0" rx="8" fill="#eaf5ea" stroke="#27ae60" stroke-width="1.8"/>
<text x="695.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">EOL Transition Bootloader (Розблокований режим)</text>
<line x1="505.0" y1="105.0" x2="885.0" y2="105.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="2,2"/>
<rect x="510.0" y="120.0" width="370.0" height="65.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="695.0" y="149.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">1. Апаратний BootROM (Незмінний кремній):</tspan><tspan x="695.0" dy="13.0">Успішно валідує підпис фінального перехідного SPL вендора [✓]</tspan></text>
<line x1="695.0" y1="185.0" x2="695.0" y2="205.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="510.0" y="205.0" width="370.0" height="75.0" rx="6" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5"/><text x="695.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">2. Перехідний U-Boot (Freedom Payload, підписаний вендором):</tspan><tspan x="695.0" dy="13.0">• Деактивує прапорець перевірки `CONFIG_FIT_SIGNATURE`</tspan><tspan x="695.0" dy="13.0">• Вмикає завантаження з SD-карти, eMMC або TFTP</tspan></text>
<line x1="695.0" y1="280.0" x2="695.0" y2="300.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="510.0" y="300.0" width="370.0" height="75.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="695.0" y="327.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">3. Завантаження кастомного ядра спільноти:</tspan><tspan x="695.0" dy="14.3">• Підтримка сучасних ядер Linux 6.x та OpenWrt/Yocto</tspan><tspan x="695.0" dy="14.3">• Заміна хмарних демонів на локальні сервіси</tspan></text>
<line x1="695.0" y1="375.0" x2="695.0" y2="395.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="510.0" y="395.0" width="370.0" height="60.0" rx="6" fill="#eaf5ea" stroke="#27ae60" stroke-width="1.5"/><text x="695.0" y="421.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Результат для власника пристрою:</tspan><tspan x="695.0" dy="14.3">Повний контроль над залізом без порушення eFuses [✓]</tspan></text>
</svg>