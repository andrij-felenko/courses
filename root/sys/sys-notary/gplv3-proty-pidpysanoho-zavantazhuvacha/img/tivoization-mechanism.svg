<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Феномен тайвоізації: легальна відкритість коду проти апаратного блокування запуску</text>
<rect x="40.0" y="60.0" width="260.0" height="390.0" rx="8" fill="#eef2ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="170.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">Рівень вихідного коду</text>
<text x="170.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(GPLv2 формально дотримана)</text>
<line x1="55.0" y1="120.0" x2="285.0" y2="120.0" stroke="#2563eb" stroke-width="1.0" stroke-dasharray="2,2"/>
<rect x="55.0" y="135.0" width="230.0" height="65.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="170.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Вендор публікує повний код:</tspan><tspan x="170.0" dy="14.3">• Ядро Linux під GPLv2</tspan><tspan x="170.0" dy="14.3">• Скрипти збирання образу</tspan></text>
<line x1="170.0" y1="205.0" x2="170.0" y2="230.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="55.0" y="235.0" width="230.0" height="75.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="170.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Користувач / Інженер:</tspan><tspan x="170.0" dy="14.3">• Читає та модифікує код</tspan><tspan x="170.0" dy="14.3">• Успішно компілює бінарник</tspan><tspan x="170.0" dy="14.3">• Записує образ у флеш-пам'ять</tspan></text>
<line x1="170.0" y1="315.0" x2="170.0" y2="340.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="55.0" y="345.0" width="230.0" height="85.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="170.0" y="369.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Результат компіляції:</tspan><tspan x="170.0" dy="14.3">`vmlinux.bin` готовий,</tspan><tspan x="170.0" dy="14.3">але НЕ підписаний приватним</tspan><tspan x="170.0" dy="14.3">ключем виробника</tspan></text>
<rect x="330.0" y="60.0" width="260.0" height="390.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="460.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний рівень (SoC / ROM)</text>
<text x="460.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Root of Trust у кремнії)</text>
<line x1="345.0" y1="120.0" x2="575.0" y2="120.0" stroke="#64748b" stroke-width="1.0" stroke-dasharray="2,2"/>
<rect x="345.0" y="135.0" width="230.0" height="75.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="460.0" y="154.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Захищений кремній (SoC):</tspan><tspan x="460.0" dy="14.3">• Публічний ключ у eFuses</tspan><tspan x="460.0" dy="14.3">• Незмінний BootROM</tspan><tspan x="460.0" dy="14.3">• Криптографічний акселератор</tspan></text>
<line x1="460.0" y1="215.0" x2="460.0" y2="240.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="345.0" y="245.0" width="230.0" height="75.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="460.0" y="264.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Алгоритм перевірки цілісності:</tspan><tspan x="460.0" dy="14.3">`RSA_Verify(pub_key, hash, sig)`</tspan><tspan x="460.0" dy="14.3">Перевірка цифрового підпису</tspan><tspan x="460.0" dy="14.3">перед передачею керування</tspan></text>
<line x1="460.0" y1="325.0" x2="460.0" y2="350.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="345.0" y="355.0" width="230.0" height="75.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="460.0" y="374.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Криптографічний ключ:</tspan><tspan x="460.0" dy="14.3">Приватний ключ RSA/ECDSA</tspan><tspan x="460.0" dy="14.3">знаходиться виключно на</tspan><tspan x="460.0" dy="14.3">захищеному сервері вендора</tspan></text>
<line x1="290.0" y1="275.0" x2="325.0" y2="275.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="620.0" y="60.0" width="260.0" height="390.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="750.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">Статус виконання на платі</text>
<text x="750.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Практичний підсумок)</text>
<line x1="635.0" y1="120.0" x2="865.0" y2="120.0" stroke="#dc2626" stroke-width="1.0" stroke-dasharray="2,2"/>
<rect x="635.0" y="135.0" width="230.0" height="80.0" rx="6" fill="#eaf5ea" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="157.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Офіційна прошивка вендора:</tspan><tspan x="750.0" dy="14.3">• Має дійсний RSA-підпис</tspan><tspan x="750.0" dy="14.3">• BootROM верифікує хеш</tspan><tspan x="750.0" dy="14.3">• Пристрій завантажується [✓]</tspan></text>
<line x1="460.0" y1="395.0" x2="630.0" y2="315.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="635.0" y="245.0" width="230.0" height="95.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="750.0" y="267.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Модифікована користувачем:</tspan><tspan x="750.0" dy="14.3">• Підпис відсутній або чужий</tspan><tspan x="750.0" dy="14.3">• BootROM фіксує помилку</tspan><tspan x="750.0" dy="14.3">• SoC блокує шину пам'яті</tspan><tspan x="750.0" dy="14.3">• Плата переходить у reset [✗]</tspan></text>
<rect x="635.0" y="355.0" width="230.0" height="80.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="750.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Парадокс тайвоізації:</tspan><tspan x="750.0" dy="13.0">Користувач володіє кодом,</tspan><tspan x="750.0" dy="13.0">але позбавлений права</tspan><tspan x="750.0" dy="13.0">запустити його на своєму залізі</tspan></text>
</svg>