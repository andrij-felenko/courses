<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг довіри Secure Boot: дотримання GPLv3 на ПК проти блокування у Smart-пристроях</text>
<rect x="40.0" y="70.0" width="200.0" height="90.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="140.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Hardware Root of Trust</text>
<text x="140.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">UEFI SPI Flash / eFuses</tspan><tspan x="140.0" dy="12.0">Зберігає сертифікати PK, KEK,</tspan><tspan x="140.0" dy="12.0">базу дозволених ключів `db`</tspan></text>
<rect x="270.0" y="70.0" width="200.0" height="90.0" rx="6" fill="#eaf5ea" stroke="#27ae60" stroke-width="1.5"/>
<text x="370.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Shim Loader (BSD-2)</text>
<text x="370.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Підписаний Microsoft UEFI CA.</tspan><tspan x="370.0" dy="12.0">Містить власний ключ вендора та</tspan><tspan x="370.0" dy="12.0">інтерфейс MokManager (MOK)</tspan></text>
<rect x="500.0" y="70.0" width="200.0" height="90.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="600.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. GRUB 2 (GPLv3)</text>
<text x="600.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Підписаний дистрибутивним ключем.</tspan><tspan x="600.0" dy="12.0">Завантажує меню та передає</tspan><tspan x="600.0" dy="12.0">керування ядру операційної системи</tspan></text>
<rect x="730.0" y="70.0" width="180.0" height="90.0" rx="6" fill="#eef2ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="820.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Linux Kernel (GPLv2)</text>
<text x="820.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Перевіряє сигнатури модулів.</tspan><tspan x="820.0" dy="12.0">Активує Kernel Lockdown Mode</tspan><tspan x="820.0" dy="12.0">для захисту пам'яті ядра</tspan></text>
<line x1="245.0" y1="115.0" x2="265.0" y2="115.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="475.0" y1="115.0" x2="495.0" y2="115.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="705.0" y1="115.0" x2="725.0" y2="115.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="200.0" width="420.0" height="260.0" rx="8" fill="#eaf5ea" stroke="#27ae60" stroke-width="1.8"/>
<text x="250.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Відкрита ПК-платформа (x86 Desktop / Server)</text>
<line x1="55.0" y1="240.0" x2="445.0" y2="240.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="2,2"/>
<rect x="55.0" y="252.0" width="390.0" height="55.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Механізми контролю користувача:</tspan><tspan x="250.0" dy="13.0">• Можливість повністю вимкнути Secure Boot в UEFI Setup</tspan><tspan x="250.0" dy="13.0">• Генерація та імпорт власного сертифіката через `mokutil`</tspan></text>
<rect x="55.0" y="317.0" width="390.0" height="60.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="338.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Статус ліцензійної відповідності:</tspan><tspan x="250.0" dy="11.7">• Користувач може замінити бінарник `grubx64.efi` і підписати його MOK</tspan><tspan x="250.0" dy="11.7">• Вимога «Installation Information» статті 6 GPLv3 повністю виконана</tspan></text>
<rect x="55.0" y="387.0" width="390.0" height="55.0" rx="6" fill="#eaf5ea" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Підсумок:</tspan><tspan x="250.0" dy="13.0">Використання GRUB 2 під GPLv3 у дистрибутивах</tspan><tspan x="250.0" dy="13.0">(Ubuntu, Fedora, Debian) є абсолютно законним [✓]</tspan></text>
<rect x="480.0" y="200.0" width="430.0" height="260.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="695.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">Заблокований споживчий пристрій (User Product)</text>
<line x1="495.0" y1="240.0" x2="895.0" y2="240.0" stroke="#dc2626" stroke-width="1.0" stroke-dasharray="2,2"/>
<rect x="495.0" y="252.0" width="400.0" height="55.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="695.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Обмеження прошивки та заліза:</tspan><tspan x="695.0" dy="13.0">• UEFI Setup / BIOS Setup відсутній або заблокований паролем</tspan><tspan x="695.0" dy="13.0">• Меню MOK недоступне, eFuses зашиті єдиним OEM-ключем</tspan></text>
<rect x="495.0" y="317.0" width="400.0" height="60.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="695.0" y="337.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Юридичний конфлікт:</tspan><tspan x="695.0" dy="13.0">• Модифікований GRUB 2 не може запуститися без закритого ключа</tspan><tspan x="695.0" dy="13.0">• Вендор відмовляється надати приватний ключ або механізм підпису</tspan></text>
<rect x="495.0" y="387.0" width="400.0" height="55.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="695.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">Підсумок:</tspan><tspan x="695.0" dy="13.0">Пряме порушення статті 6 GPLv3! Вендор зобов'язаний</tspan><tspan x="695.0" dy="13.0">надати ключі або вилучити компоненти GPLv3 [✗]</tspan></text>
</svg>