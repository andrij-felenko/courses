<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Великий ліцензійний розкол: компоненти GPLv2 проти GPLv3 у прошивках</text>
<rect x="40.0" y="60.0" width="400.0" height="370.0" rx="8" fill="#eef2ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="240.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">Табір GPLv2: Програмний копілефт</text>
<text x="240.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Філософія Лінуса Торвальдса: захист коду, а не контроль заліза</text>
<line x1="55.0" y1="120.0" x2="425.0" y2="120.0" stroke="#2563eb" stroke-width="1.0" stroke-dasharray="2,2"/>
<rect x="55.0" y="132.0" width="370.0" height="85.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="240.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Ядро Linux (GPL-2.0-only)</tspan><tspan x="240.0" dy="14.3">Головна системна основа. Вендори можуть підписувати</tspan><tspan x="240.0" dy="14.3">образи власним ключем без розкриття самого ключа.</tspan></text>
<rect x="55.0" y="227.0" width="370.0" height="85.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="240.0" y="259.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">U-Boot / Barebox (GPL-2.0)</tspan><tspan x="240.0" dy="14.3">Завантажувачі вбудованих систем. Зберігають GPLv2</tspan><tspan x="240.0" dy="14.3">для сумісності з криптографічними BootROM виробників.</tspan></text>
<rect x="55.0" y="322.0" width="370.0" height="85.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="240.0" y="354.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">BusyBox (GPL-2.0-only)</tspan><tspan x="240.0" dy="14.3">Компактний набір утиліт командного рядка для IoT,</tspan><tspan x="240.0" dy="14.3">активно судиться за розкриття коду, але не за ключі.</tspan></text>
<rect x="480.0" y="60.0" width="400.0" height="370.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
<text x="680.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="700">Табір GPLv3: Антитайвоізація</text>
<text x="680.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Філософія FSF / Річарда Столмана: свобода виконання на залізі</text>
<line x1="495.0" y1="120.0" x2="865.0" y2="120.0" stroke="#ea580c" stroke-width="1.0" stroke-dasharray="2,2"/>
<rect x="495.0" y="132.0" width="370.0" height="85.0" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/><text x="680.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">GRUB 2 (GPL-3.0-or-later)</tspan><tspan x="680.0" dy="14.3">Універсальний завантажувач. Вимагає Installation Info,</tspan><tspan x="680.0" dy="14.3">через що вендори IoT уникають його у закритих платах.</tspan></text>
<rect x="495.0" y="227.0" width="370.0" height="85.0" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/><text x="680.0" y="259.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">GCC Toolchain &amp; GDB (GPL-3.0)</tspan><tspan x="680.0" dy="14.3">Компілятор і дебагер. GCC Runtime Library Exception</tspan><tspan x="680.0" dy="14.3">дозволяє поширювати бінарники без копілефту рантайму.</tspan></text>
<rect x="495.0" y="322.0" width="370.0" height="85.0" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/><text x="680.0" y="354.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">GNU Coreutils, Bash (GPL-3.0)</tspan><tspan x="680.0" dy="14.3">Базовий системний стек. Apple повністю відмовилася</tspan><tspan x="680.0" dy="14.3">від оновлення Bash у macOS через перехід на GPLv3.</tspan></text>
</svg>