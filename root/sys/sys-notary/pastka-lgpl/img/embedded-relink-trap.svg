<rect x="615.8" y="288.8" width="308.4" height="102.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="308.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Варіант Б: Надання .o файлів та скриптів</tspan><tspan x="770.0" dy="14.3"></tspan><tspan x="770.0" dy="14.3">• Витік комерційної таємниці (декомпіляція .o)</tspan><tspan x="770.0" dy="14.3">• Вимога дати ключі прошивання (LGPLv3)</tspan><tspan x="770.0" dy="14.3">• Зобов'язання підтримувати toolchain роками</tspan><tspan x="770.0" dy="14.3">• Ризик зламу апаратного захисту пристрою</tspan></text>
