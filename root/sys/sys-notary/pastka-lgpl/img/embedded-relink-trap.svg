<rect x="64.2" y="53.6" width="191.6" height="112.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="70.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">1. Збирання прошивки</tspan><tspan x="160.0" dy="14.3"></tspan><tspan x="160.0" dy="14.3">• proprietary_main.o</tspan><tspan x="160.0" dy="14.3">• motor_control.o</tspan><tspan x="160.0" dy="14.3">• liblgpl_codec.a (LGPL)</tspan><tspan x="160.0" dy="14.3">  ↓ (ld / arm-none-eabi-gcc)</tspan><tspan x="160.0" dy="14.3">  firmware.bin</tspan></text>
