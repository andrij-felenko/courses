<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння динамічного та статичного лінкування в контексті зобов'язань LGPL</text>
<rect x="40.0" y="30.0" width="450.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="265.0" y="54.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">Динамічне лінкування (ОС / POSIX / ld.so)</tspan></text>
<rect x="45.5" y="107.9" width="179.0" height="84.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="125.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Пропрієтарний бінарник</tspan><tspan x="135.0" dy="14.3">(ELF / Mach-O / PE)</tspan><tspan x="135.0" dy="14.3"></tspan><tspan x="135.0" dy="14.3">• Тільки виклики символів</tspan><tspan x="135.0" dy="14.3">• Закритий код у бінарнику</tspan></text>
<rect x="312.4" y="107.9" width="185.3" height="84.2" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="405.0" y="125.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">Бібліотека LGPL</tspan><tspan x="405.0" dy="14.3">(libcrypto.so / libav.so)</tspan><tspan x="405.0" dy="14.3"></tspan><tspan x="405.0" dy="14.3">• Окремий файл на диску</tspan><tspan x="405.0" dy="14.3">• Динамічні таблиці PLT/GOT</tspan></text>
<line x1="228.5" y1="150.0" x2="230.0" y2="150.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="270.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Динамічний виклик</text>
<line x1="310.0" y1="150.0" x2="308.4" y2="150.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="75.0" y="225.9" width="389.9" height="88.2" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="245.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Механізм оновлення користувачем:</tspan><tspan x="270.0" dy="14.3"></tspan><tspan x="270.0" dy="14.3">1. Користувач компілює власну модифіковану версію libfoo.so</tspan><tspan x="270.0" dy="14.3">2. Підміняє файл на диску або задає LD_LIBRARY_PATH</tspan><tspan x="270.0" dy="14.3">3. Пропрієтарний бінарник підхоплює нову .so при запуску</tspan></text>
<rect x="81.3" y="360.1" width="377.5" height="69.9" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="377.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Статус виконання LGPLv2.1 §6 / LGPLv3 §4:</tspan><tspan x="270.0" dy="14.3"></tspan><tspan x="270.0" dy="14.3">Повна відповідність без розкриття пропрієтарного коду</tspan><tspan x="270.0" dy="14.3">та без надання об'єктних файлів (.o)</tspan></text>
<line x1="520.0" y1="20.0" x2="520.0" y2="460.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="550.0" y="30.0" width="450.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="775.0" y="54.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">Статичне лінкування (Bare-metal / RTOS / MCU)</tspan></text>
<rect x="617.7" y="91.6" width="314.7" height="116.8" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="775.0" y="110.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Єдиний монолітний образ (firmware.bin)</tspan><tspan x="775.0" dy="14.3"></tspan><tspan x="775.0" dy="14.3">┌──────────────────────┬──────────────────────┐</tspan><tspan x="775.0" dy="14.3">│ Пропрієтарні .o      │ Бібліотека LGPL (.a) │</tspan><tspan x="775.0" dy="14.3">│ (алгоритми, драйвери)│ (mbedtls, ffmpeg)    │</tspan><tspan x="775.0" dy="14.3">└──────────────────────┴──────────────────────┘</tspan><tspan x="775.0" dy="14.3">Усі символи та адреси жорстко зв'язані лінкером</tspan></text>
<rect x="580.0" y="218.8" width="389.9" height="102.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="775.0" y="238.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Вимога LGPL для монолітного образу:</tspan><tspan x="775.0" dy="14.3"></tspan><tspan x="775.0" dy="14.3">Оскільки підміна .so неможлива, вендор ЗОБОВ'ЯЗАНИЙ надати:</tspan><tspan x="775.0" dy="14.3">• Усі пропрієтарні об'єктні файли (.o) або вихідний код</tspan><tspan x="775.0" dy="14.3">• Скрипти лінкування (.ld), Makefile та версію toolchain</tspan><tspan x="775.0" dy="14.3">• Інструкцію для повторного збирання firmware.bin</tspan></text>
<rect x="559.0" y="360.1" width="432.0" height="69.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="775.0" y="377.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">Пастка вендора:</tspan><tspan x="775.0" dy="14.3"></tspan><tspan x="775.0" dy="14.3">Розкриття .o файлів відкриває структури даних, назви функцій,</tspan><tspan x="775.0" dy="14.3">алгоритми для декомпіляції та ламає комерційну таємницю</tspan></text>
</svg>