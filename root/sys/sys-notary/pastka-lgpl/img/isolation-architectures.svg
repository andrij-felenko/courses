<rect x="99.9" y="239.3" width="160.2" height="41.3" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Окремий процес LGPL</tspan><tspan x="180.0" dy="14.3">(Кодек, мережевий стек)</tspan></text>
<rect x="68.5" y="335.1" width="222.9" height="69.9" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="352.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Властивості:</tspan><tspan x="180.0" dy="14.3">• Незалежні адресні простори</tspan><tspan x="180.0" dy="14.3">• Відкритий протокол обміну</tspan><tspan x="180.0" dy="14.3">• LGPL не заражає сусідній процес</tspan></text>
<rect x="370.0" y="30.0" width="300.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="54.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Патерн 2: Модульний завантажувач</tspan></text>
<rect x="421.1" y="109.3" width="197.8" height="41.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Пропрієтарна прошивка</tspan><tspan x="520.0" dy="14.3">Таблиця стрибків (Jump Table)</tspan></text>
<line x1="520.0" y1="165.0" x2="520.0" y2="220.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="532.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">Виклик за адресою</text>
<rect x="436.8" y="239.3" width="166.5" height="41.3" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">LGPL-модуль у Flash</tspan><tspan x="520.0" dy="14.3">(Окремий сектор пам'яті)</tspan></text>
<rect x="392.9" y="335.1" width="254.3" height="69.9" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="352.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Властивості:</tspan><tspan x="520.0" dy="14.3">• Незалежне прошивання сектора</tspan><tspan x="520.0" dy="14.3">• Користувач може оновити модуль</tspan><tspan x="520.0" dy="14.3">• Пропрієтарний код лишається закритим</tspan></text>
<rect x="710.0" y="30.0" width="300.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="860.0" y="53.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">Патерн 3: Чиста заміна або Dual-License</tspan></text>
<rect x="783.0" y="95.0" width="153.9" height="69.9" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="860.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Дозвільні аналоги:</tspan><tspan x="860.0" dy="14.3">• mbedTLS (Apache 2.0)</tspan><tspan x="860.0" dy="14.3">• lwIP (BSD-3-Clause)</tspan><tspan x="860.0" dy="14.3">• miniz (MIT)</tspan></text>
<rect x="770.5" y="225.1" width="179.0" height="69.9" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="860.0" y="242.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Комерційна ліцензія:</tspan><tspan x="860.0" dy="14.3">• Викуп у правовласника</tspan><tspan x="860.0" dy="14.3">• Скасування умов LGPL</tspan><tspan x="860.0" dy="14.3">• Повна свобода лінкування</tspan></text>
<rect x="739.1" y="335.1" width="241.7" height="69.9" rx="6" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.5"/><text x="860.0" y="352.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Властивості:</tspan><tspan x="860.0" dy="14.3">• Нульові копілефтні зобов'язання</tspan><tspan x="860.0" dy="14.3">• Можливе статичне лінкування</tspan><tspan x="860.0" dy="14.3">• Повний захист комерційної таємниці</tspan></text>
