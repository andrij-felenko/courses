<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектурні патерни безпечного використання або заміни LGPL-компонентів</text>
<rect x="30.0" y="30.0" width="300.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="54.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Патерн 1: Ізоляція через IPC</tspan></text>
<rect x="103.0" y="109.3" width="153.9" height="41.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Пропрієтарний процес</tspan><tspan x="180.0" dy="14.3">(Керування, алгоритми)</tspan></text>
<line x1="180.0" y1="160.0" x2="180.0" y2="210.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
