<text x="468.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Паяний шов (Solder Joint):</text>
<text x="468.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Сплав SAC305 (Sn96.5 Ag3.0 Cu0.5, Pb &lt; 0.1%)</text>
<rect x="445.0" y="301.0" width="350.0" height="32.0" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<circle cx="456.0" cy="317.0" r="4.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="468.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Маркування шовкографією (Legend):</text>
<text x="468.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Фарба без важких металів (Pb, Cd, Cr VI)</text>
<rect x="35.0" y="360.0" width="770.0" height="60.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="420.0" y="386.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Гомогенний матеріал — речовина однорідного складу, яку не можна механічно розділити (розкрутити, розрізати,</tspan><tspan x="420.0" dy="13.7">розтерти) на окремі матеріали. Перевірка 10 речовин (Pb, Hg, Cd, Cr VI, PBB, PBDE, 4 фталати) проводиться для КОЖНОГО шару!</tspan></text>
</svg>