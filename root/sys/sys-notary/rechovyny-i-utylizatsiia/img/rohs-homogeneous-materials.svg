<text x="68.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Матове олово Sn (без свинцю Pb &lt; 0.1%)</text>
