<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гомогенні матеріали в електронному вузлі за директивою RoHS</text>
<rect x="15.0" y="15.0" width="810.0" height="420.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="35.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Концепція «гомогенного матеріалу» в електронному вузлі (RoHS)</text>
<text x="35.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Ліміти концентрації 10 заборонених речовин діють для кожного шару окремо, а не для плати чи чіпа загалом</text>
