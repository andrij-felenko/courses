<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип Once An Article Always An Article у регламенті REACH</text>
<rect x="15.0" y="15.0" width="810.0" height="400.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="35.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Принцип «Once An Article, Always An Article» (OAOA) у регламенті REACH</text>
<text x="35.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Рішення Суду ЄС (C-106/14): ліміт SVHC 0.1% w/w розраховується для кожної складової деталі окремо</text>
<rect x="35.0" y="75.0" width="370.0" height="245.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<rect x="35.0" y="75.0" width="370.0" height="28.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
<text x="220.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">ХИБНО: Розмивання маси виробу</text>
<text x="48.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Готовий прилад у зборі (вага 1000 г)</text>
<text x="48.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Усередині встановлено гумове кільце ущільнювача (1 г)</text>
<text x="48.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Кільце містить 15 мг пластифікатора DEHP (1.5% w/w)</text>
<rect x="48.0" y="172.0" width="344.0" height="46.0" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.0"/>
<text x="220.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Концентрація на весь прилад: 15 мг / 1000 г = 0.0015%</text>
<text x="220.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">0.0015% &lt; 0.1%  →  виробник помилково не декларує</text>
<text x="220.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">✖ ПОРУШЕННЯ ЗАКОНУ ЄС (ШТРАФ ТА ВІДКЛИКАННЯ)</text>
<text x="220.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Заборонено розчиняти токсичну речовину у вазі корпусу чи рами</text>
<rect x="435.0" y="75.0" width="370.0" height="245.0" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="435.0" y="75.0" width="370.0" height="28.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
<text x="620.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">ЗАКОННО: Принцип OAOA (C-106/14)</text>
<text x="448.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Оцінка кожної деталі як окремого виробу</text>
<text x="448.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Гумове кільце зберігає статус «виробу» (Article) у зборі</text>
<text x="448.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Вага кільця = 1.0 г, вага DEHP = 15 мг</text>
<rect x="448.0" y="172.0" width="344.0" height="46.0" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.0"/>
<text x="620.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Концентрація у виробі: 15 мг / 1.0 г = 1.5% w/w</text>
<text x="620.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="700">1.5% &gt; 0.1%  →  активуються зобов'язання REACH та SCIP</text>
<text x="620.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">✓ ПОВНИЙ ЮРИДИЧНИЙ КОМПЛАЄНС</text>
<text x="620.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Повідомлення клієнтів (Art. 33) + обов'язкове досьє в базі SCIP</text>
<rect x="35.0" y="330.0" width="770.0" height="70.0" rx="6" fill="#fbfbfe" stroke="#7c3aed" stroke-width="1.5"/><text x="420.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Судове правило ЄС: якщо деталь була виробом до монтажу (гвинт, ущільнювач, чіп, кабель), вона залишається виробом</tspan><tspan x="420.0" dy="13.7">і всередині складного приладу. Ліміт концентрації SVHC 0.1% w/w рахується за власною масою деталі.</tspan><tspan x="420.0" dy="13.7">Перевищення 0.1% вимагає негайного інформування клієнтів (Art. 33) та подання досьє до бази даних ECHA SCIP.</tspan></text>
</svg>