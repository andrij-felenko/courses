<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр оцінки відповідності матеріалів за стандартом EN IEC 63000</text>
<rect x="15.0" y="15.0" width="810.0" height="400.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/>
<text x="35.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Конвеєр оцінки відповідності матеріалів за стандартом EN IEC 63000:2018</text>
<text x="35.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Гармонізований стандарт для підтвердження дотримання директиви RoHS та нанесення маркування CE</text>
<rect x="35.0" y="75.0" width="180.0" height="235.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="35.0" y="75.0" width="180.0" height="28.0" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="125.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Етап 1: Ризики</text>
<text x="125.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оцінка ризиків:</text>
<rect x="45.0" y="135.0" width="160.0" height="90.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="125.0" y="171.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="125.0" dy="0.0">Класифікація BOM за типами:</tspan><tspan x="125.0" dy="11.7">низький, середній або високий</tspan><tspan x="125.0" dy="11.7">ризик наявності токсинів</tspan></text>
<circle cx="125.0" cy="265.0" r="12.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="125.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">1</text>
<line x1="217.0" y1="190.0" x2="228.0" y2="190.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="230.0" y="75.0" width="180.0" height="235.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="230.0" y="75.0" width="180.0" height="28.0" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="320.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Етап 2: Декларації</text>
<text x="320.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Документи від постачальника:</text>
<rect x="240.0" y="135.0" width="160.0" height="90.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="320.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="320.0" dy="0.0">Збір сертифікатів CoC</tspan><tspan x="320.0" dy="12.3">та FMD за стандартами</tspan><tspan x="320.0" dy="12.3">IPC-1752A / IEC 62474</tspan></text>
<circle cx="320.0" cy="265.0" r="12.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="320.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">2</text>
<line x1="412.0" y1="190.0" x2="423.0" y2="190.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="425.0" y="75.0" width="180.0" height="235.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="425.0" y="75.0" width="180.0" height="28.0" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="515.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Етап 3: Лабораторія</text>
<text x="515.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Аналітичний контроль:</text>
<rect x="435.0" y="135.0" width="160.0" height="90.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="515.0" y="171.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="515.0" dy="0.0">Експрес-скринінг XRF</tspan><tspan x="515.0" dy="11.7">та мокра хімія ICP / GC-MS</tspan><tspan x="515.0" dy="11.7">для деталей високого ризику</tspan></text>
<circle cx="515.0" cy="265.0" r="12.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="515.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">3</text>
<line x1="607.0" y1="190.0" x2="618.0" y2="190.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="620.0" y="75.0" width="180.0" height="235.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="620.0" y="75.0" width="180.0" height="28.0" rx="6" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
<text x="710.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Етап 4: Техфайл</text>
<text x="710.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Юридичне оформлення:</text>
<rect x="630.0" y="135.0" width="160.0" height="90.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="710.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="710.0" dy="0.0">Складання Technical File,</tspan><tspan x="710.0" dy="12.3">підписання EU DoC</tspan><tspan x="710.0" dy="12.3">та нанесення знака CE</tspan></text>
<circle cx="710.0" cy="265.0" r="12.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="710.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">4</text>
<rect x="35.0" y="325.0" width="770.0" height="75.0" rx="6" fill="#f0f9ff" stroke="#2563eb" stroke-width="1.5"/><text x="420.0" y="352.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">EN IEC 63000:2018 не вимагає тестувати кожен резистор у лабораторії, якщо постачальник має високу надійність</tspan><tspan x="420.0" dy="13.7">та надав повне розкриття складу (FMD). Лабораторні випробування (XRF-скринінг та мокра хімія ICP-OES / GC-MS)</tspan><tspan x="420.0" dy="13.7">проводяться цільово для компонентів з високим оціненим ризиком наявності заборонених речовин.</tspan></text>
</svg>