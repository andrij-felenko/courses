<circle cx="332.0" cy="127.0" r="4.5" fill="#059669" stroke="#059669" stroke-width="1.0"/>
<text x="344.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Реєстрація виробника</text>
<text x="344.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Національний реєстр кожної країни ЄС (stiftung ear, ADEME) + фінансова гарантія</text>
<rect x="320.0" y="151.0" width="475.0" height="34.0" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<circle cx="332.0" cy="167.0" r="4.5" fill="#059669" stroke="#059669" stroke-width="1.0"/>
<text x="344.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Еко-внески (Eco-fees)</text>
<text x="344.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Оплата внесків операторам PRO пропорційно масі обладнання, виведеного на ринок</text>
<rect x="320.0" y="191.0" width="475.0" height="34.0" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<circle cx="332.0" cy="207.0" r="4.5" fill="#059669" stroke="#059669" stroke-width="1.0"/>
<text x="344.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Роздільне збирання</text>
<text x="344.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Муніципальні та комерційні пункти приймання відходів електроніки від споживачів</text>
<rect x="320.0" y="231.0" width="475.0" height="34.0" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<circle cx="332.0" cy="247.0" r="4.5" fill="#059669" stroke="#059669" stroke-width="1.0"/>
<text x="344.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">4. Переробка та афінаж</text>
<text x="344.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Вилучення акумуляторів, конденсаторів; рециклінг металів (Cu, Au, Sn) та полімерів</text>
<rect x="320.0" y="271.0" width="475.0" height="34.0" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<circle cx="332.0" cy="287.0" r="4.5" fill="#059669" stroke="#059669" stroke-width="1.0"/>
<text x="344.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">5. Щорічна звітність</text>
<text x="344.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Підтвердження виконання нормативів рециклінгу (55–85% маси) державним органам</text>
<rect x="35.0" y="345.0" width="770.0" height="75.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="420.0" y="372.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">EPR переносить фінансовий тягар утилізації з муніципалітетів на виробника або імпортера.</tspan><tspan x="420.0" dy="13.7">Перед продажем у будь-якій країні ЄС виробник реєструється в національному реєстрі (EAR, ADEME тощо),</tspan><tspan x="420.0" dy="13.7">сплачує еко-внески операторам PRO та щорічно звітує про масу виведеного на ринок і зібраного обладнання.</tspan></text>
</svg>