<rect x="310.0" y="75.0" width="495.0" height="28.0" rx="6" fill="#059669" stroke="#059669" stroke-width="1.6"/>
<text x="557.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Замкнений життєвий цикл та обов'язки EPR</text>
