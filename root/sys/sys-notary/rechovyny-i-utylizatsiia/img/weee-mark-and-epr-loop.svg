<text x="35.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Маркування WEEE (EN 50419) та розширена відповідальність виробника (EPR)</text>
<text x="35.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Виробник фінансово та організаційно забезпечує збирання й переробку відходів власного обладнання</text>
