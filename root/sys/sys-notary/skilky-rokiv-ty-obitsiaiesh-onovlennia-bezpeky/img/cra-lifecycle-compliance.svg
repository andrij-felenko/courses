<text x="342.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700"> • Публікація VEX-звітів (OpenVEX/CSAF)</text>
