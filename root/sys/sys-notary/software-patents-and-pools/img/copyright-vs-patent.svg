<line x1="505.0" y1="96.0" x2="885.0" y2="96.0" stroke="#ea580c" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="506.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Об'єкт захисту:</text>
<text x="506.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="506.0" dy="0.0">Метод, послідовність кроків алгоритму, математична трансформація даних.</tspan></text>
<line x1="510.0" y1="161.0" x2="880.0" y2="161.0" stroke="#d1d5db" stroke-width="0.8"/>
<text x="506.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Що НЕ захищається:</text>
<text x="506.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="506.0" dy="0.0">Текст коду (патенту байдуже, якою мовою і якими іменами змінних записано суть).</tspan></text>
<line x1="510.0" y1="217.0" x2="880.0" y2="217.0" stroke="#d1d5db" stroke-width="0.8"/>
<text x="506.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Чиста кімната (Clean-room):</text>
<text x="506.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="506.0" dy="0.0">БЕЗСИЛА. Навіть якщо алгоритм винайдено незалежно, реалізація порушує патент.</tspan></text>
<line x1="510.0" y1="273.0" x2="880.0" y2="273.0" stroke="#d1d5db" stroke-width="0.8"/>
<text x="506.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Дія відкритих ліцензій:</text>
<text x="506.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="506.0" dy="0.0">MIT / GPLv2 не дають захисту від сторонніх власників патентів (Third-party SEPs).</tspan></text>
<line x1="510.0" y1="329.0" x2="880.0" y2="329.0" stroke="#d1d5db" stroke-width="0.8"/>
<text x="506.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Правовий наслідок:</text>
<text x="506.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="506.0" dy="0.0">Будь-який працюючий декодер чи кодер порушує пункт формули патенту (Patent Claim).</tspan></text>
