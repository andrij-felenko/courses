<text x="56.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="56.0" dy="0.0">Повна легальність! Написання власного коду за специфікацією з нуля НЕ є порушенням.</tspan></text>
