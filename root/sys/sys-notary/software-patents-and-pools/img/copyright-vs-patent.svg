<text x="56.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Правовий наслідок:</text>
<text x="56.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="56.0" dy="0.0">Якщо код написаний власноруч без копіювання чужих рядків — ризик копірайту дорівнює нулю.</tspan></text>
