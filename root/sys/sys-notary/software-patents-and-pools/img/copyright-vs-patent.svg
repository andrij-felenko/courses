<text x="56.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="56.0" dy="0.0">MIT, BSD, GPL повністю знімають претензії автора тексту коду.</tspan></text>
