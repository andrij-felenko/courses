<text x="56.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Об'єкт захисту:</text>
<text x="56.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start"><tspan x="56.0" dy="0.0">Конкретне текстове вираження: текст коду, двійковий бінарник, структура файлу.</tspan></text>
