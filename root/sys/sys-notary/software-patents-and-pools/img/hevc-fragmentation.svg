<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фрагментація ліцензування: успіх H.264 проти кризи H.265 (HEVC)</text>
<rect x="40.0" y="56.0" width="410.0" height="400.0" rx="8" fill="#eaf5ea" stroke="#27ae60" stroke-width="1.8"/>
<text x="245.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">H.264 / AVC (Єдиний монолітний пул)</text>
<line x1="55.0" y1="96.0" x2="435.0" y2="96.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="85.0" y="115.0" width="320.0" height="70.0" rx="6" fill="#eef2ff" stroke="#2563eb" stroke-width="1.4"/>
<text x="245.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">Єдиний адміністратор: MPEG LA</text>
<text x="245.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Охоплює &gt;90% обов'язкових патентів</text>
<rect x="60.0" y="205.0" width="370.0" height="140.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="75.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="75.0" dy="0.0">• Передбачувана вартість: ~$0.20 за пристрій</tspan><tspan x="75.0" dy="14.9">• Перші 100 000 екземплярів щороку — БЕЗОПЛАТНО</tspan><tspan x="75.0" dy="14.9">• Жорсткий річний ліміт виплат (Cap: $9.75M)</tspan><tspan x="75.0" dy="14.9">• Безкоштовний некомерційний інтернет-стрімінг</tspan><tspan x="75.0" dy="14.9">• Результат: тотальне впровадження у всьому світі,</tspan><tspan x="75.0" dy="14.9">  апаратна підтримка в кожному процесорі.</tspan></text>
<rect x="85.0" y="365.0" width="320.0" height="70.0" rx="6" fill="#eaf5ea" stroke="#27ae60" stroke-width="1.2"/>
<text x="245.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Результат для індустрії:</text>
<text x="245.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Світовий стандарт на 20+ років</text>
<rect x="490.0" y="56.0" width="410.0" height="400.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="695.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">H.265 / HEVC (Війна кількох пулів)</text>
<line x1="505.0" y1="96.0" x2="885.0" y2="96.0" stroke="#dc2626" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="510.0" y="110.0" width="110.0" height="50.0" rx="4" fill="#eef2ff" stroke="#2563eb" stroke-width="1.0"/>
<text x="565.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="700"><tspan x="565.0" dy="0.0">MPEG LA</tspan><tspan x="565.0" dy="11.5">(Pool 1)</tspan></text>
<rect x="640.0" y="110.0" width="110.0" height="50.0" rx="4" fill="#eef2ff" stroke="#2563eb" stroke-width="1.0"/>
<text x="695.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">HEVC Advance</tspan><tspan x="695.0" dy="11.5">(Pool 2)</tspan></text>
<rect x="770.0" y="110.0" width="110.0" height="50.0" rx="4" fill="#eef2ff" stroke="#2563eb" stroke-width="1.0"/>
<text x="825.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="700"><tspan x="825.0" dy="0.0">Velos Media</tspan><tspan x="825.0" dy="11.5">(Pool 3)</tspan></text>
<text x="695.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">+ Десятки незалежних компаній (Qualcomm, Technicolor...)</text>
<rect x="510.0" y="205.0" width="370.0" height="140.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="525.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="525.0" dy="0.0">• Сумарна ціна за пристрій: $2.00–$4.50+</tspan><tspan x="525.0" dy="14.9">• Відсутність єдиного річного ліміту (кожен пул має свій)</tspan><tspan x="525.0" dy="14.9">• Спроба збирати відсоток від доходів за трансляцію контенту</tspan><tspan x="525.0" dy="14.9">• Невизначеність: ліцензія на 3 пули НЕ захищає від інших</tspan><tspan x="525.0" dy="14.9">• Наслідок: браузери відмовились від HEVC, а ринок створив</tspan><tspan x="525.0" dy="14.9">  відкритий альянс AOMedia для розробки AV1.</tspan></text>
<rect x="535.0" y="365.0" width="320.0" height="70.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="695.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Наслідок для індустрії:</text>
<text x="695.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">Створення відкритого кодека AV1</text>
</svg>