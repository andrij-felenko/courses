<text x="280.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">Тракт прийому (RX Path)</text>
<line x1="470.0" y1="235.0" x2="350.0" y2="235.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="210.0" y="210.0" width="140.0" height="50.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="280.0" y="232.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">Малошумний підсилювач</tspan><tspan x="280.0" dy="11.7">(LNA, Gain 15dB, NF 1.5dB)</tspan></text>
<line x1="210.0" y1="235.0" x2="150.0" y2="235.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="470.0" y="90.0" width="100.0" height="170.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
<text x="520.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#78350f" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">T/R</tspan><tspan x="520.0" dy="14.3">Перемикач</tspan><tspan x="520.0" dy="14.3">(RF Switch)</tspan></text>
