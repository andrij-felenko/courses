<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура форматування std::format</text>
<text x="470.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура std::format: двофазна обробка та типобезпека</text>
<rect x="40.0" y="65.0" width="410.0" height="180.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="245.0" y="123.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">1. Перевірка рядка формату (Compile-time Phase)</tspan><tspan x="245.0" dy="11.7"></tspan><tspan x="245.0" dy="11.7">std::format(&quot;Температура: {:.2f} °C&quot;, temp)</tspan><tspan x="245.0" dy="11.7">               ▲</tspan><tspan x="245.0" dy="11.7">               └─ std::basic_format_string&lt;char, double&gt;</tspan><tspan x="245.0" dy="11.7">                  consteval конструювання перевіряє</tspan><tspan x="245.0" dy="11.7">                  граматику та відповідність типів у під час компіляції!</tspan></text>
<rect x="490.0" y="65.0" width="410.0" height="180.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="695.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">2. Стирання типів аргументів (Argument Packaging)</tspan><tspan x="695.0" dy="13.0"></tspan><tspan x="695.0" dy="13.0">std::make_format_args(temp)</tspan><tspan x="695.0" dy="13.0">               ▲</tspan><tspan x="695.0" dy="13.0">               └─ Створює легковаговий масив std::format_args</tspan><tspan x="695.0" dy="13.0">                  Типи аргументів стіраються до таблиці</tspan><tspan x="695.0" dy="13.0">                  вказівників на функцій-форматирувачі (vtable)</tspan></text>
<line x1="245.0" y1="245.0" x2="470.0" y2="280.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="695.0" y1="245.0" x2="470.0" y2="280.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="200.0" y="285.0" width="540.0" height="100.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="315.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">3. Диспетчеризація та форматування (Runtime Engine)</tspan><tspan x="470.0" dy="15.6"></tspan><tspan x="470.0" dy="15.6">std::vformat_to(out_iter, format_str, format_args)</tspan><tspan x="470.0" dy="15.6">Викликає відповідні std::formatter&lt;T&gt;::format() для кожного елемента</tspan></text>
<line x1="470.0" y1="385.0" x2="470.0" y2="415.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="150.0" y="420.0" width="640.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="446.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Вихідний буфер: std::string / std::back_inserter / стековий масив / stdout</tspan></text>
</svg>