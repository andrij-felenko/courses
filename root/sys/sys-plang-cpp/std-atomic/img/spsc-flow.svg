<text x="475.1" y="304.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">3</text>
<circle cx="410.0" cy="327.0" r="15.0" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="410.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">4</text>
<circle cx="344.9" cy="300.1" r="15.0" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/>
<text x="344.9" y="304.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">5</text>
<circle cx="318.0" cy="235.0" r="15.0" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/>
<text x="318.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">6</text>
<circle cx="344.9" cy="169.9" r="15.0" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/>
<text x="344.9" y="173.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">7</text>
<text x="410.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">head → 0</text>
<text x="326.9" y="330.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">tail → 5</text>
<text x="150.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ПРОДЮСЕР (пише head)</text>
<rect x="45.0" y="100.0" width="210.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="116.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">buf[head] = x;</tspan></text>
<rect x="45.0" y="140.0" width="210.0" height="24.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="156.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">head.store(next,</tspan></text>
<rect x="45.0" y="180.0" width="210.0" height="24.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="196.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">     release);</tspan></text>
<text x="150.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1) ДАНІ у слот</text>
<text x="150.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2) публікує head</text>
<line x1="230.0" y1="150.0" x2="314.0" y2="215.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="670.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">КОНСЮМЕР (пише tail)</text>
<rect x="565.0" y="100.0" width="210.0" height="24.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="116.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">h = head.load(</tspan></text>
<rect x="565.0" y="140.0" width="210.0" height="24.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="156.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">     acquire);</tspan></text>
<rect x="565.0" y="180.0" width="210.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="196.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">x = buf[tail];</tspan></text>
<text x="670.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1) підхоплює head</text>
<text x="670.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2) бере ДАНІ</text>
<line x1="590.0" y1="200.0" x2="506.0" y2="259.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="148.0" y="392.2" width="523.9" height="45.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="411.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">кожен покажчик має ОДНОГО хазяїна: head — продюсер, tail — консюмер;</tspan><tspan x="410.0" dy="15.6">чуже читають atomic-ом, тож гонки за запис немає — замок зайвий</tspan></text>
</svg>