<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">SPSC-кільце: head пише продюсер, tail читає консюмер</text>
<circle cx="410.0" cy="235.0" r="92.0" fill="none" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="410.0" cy="143.0" r="15.0" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="410.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0</text>
<circle cx="475.1" cy="169.9" r="15.0" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="475.1" y="173.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1</text>
<circle cx="502.0" cy="235.0" r="15.0" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
<text x="502.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">2</text>
