<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три рівні порядку: сила гарантій ↔ ціна</text>
<rect x="60.0" y="70.0" width="600.0" height="82.0" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="80.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">relaxed</text>
<text x="80.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">лише неподільність; порядок не обіцяно</text>
<text x="80.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">приклад: лічильники, статистика</text>
<text x="640.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-style="italic">найдешевший</text>
<rect x="60.0" y="164.0" width="600.0" height="82.0" rx="10" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="80.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">acquire / release</text>
<text x="80.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">пара «віддав → захопив» синхронізує один канал</text>
<text x="80.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">приклад: прапорець готовності, черга</text>
<text x="640.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-style="italic">середина</text>
<rect x="60.0" y="258.0" width="600.0" height="82.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="80.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">seq_cst (типовий)</text>
<text x="80.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">єдиний спільний порядок усіх seq_cst-дій</text>
<text x="80.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">приклад: коли не певен — бери це</text>
<text x="640.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-style="italic">найдорожчий</text>
<text x="30.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">слабше</text>
<text x="30.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сильніше</text>
<line x1="30.0" y1="300.0" x2="30.0" y2="120.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>