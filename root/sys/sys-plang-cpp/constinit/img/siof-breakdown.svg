<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подолання Static Initialization Order Fiasco за допомогою constinit</text>
<text x="500.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">МІЖФАЙЛОВА ЗАЛЕЖНІСТЬ ГЛОБАЛЬНИХ ОБ'ЄКТІВ</text>
<rect x="40.0" y="60.0" width="440.0" height="400.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="2.0"/>
<text x="260.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">БЕЗ constinit: ДИНАМІЧНИЙ ХАОС</text>
<rect x="60.0" y="115.0" width="400.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="138.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">logger.cpp:</tspan><tspan x="260.0" dy="15.6">Logger g_logger(&quot;app.log&quot;); // динамічний ctor</tspan></text>
<rect x="60.0" y="185.0" width="400.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="208.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">network.cpp:</tspan><tspan x="260.0" dy="15.6">Client g_client(&amp;g_logger); // динамічний ctor</tspan></text>
<line x1="260.0" y1="245.0" x2="260.0" y2="275.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="280.0" width="400.0" height="66.0" rx="6" fill="#f8d7da" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="309.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Якщо лінкер спочатку ініціалізує network.cpp:</tspan><tspan x="260.0" dy="14.3">g_client звертається до g_logger ДО виклику його ctor!</tspan></text>
<line x1="260.0" y1="352.0" x2="260.0" y2="380.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="385.0" width="400.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="408.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Результат: Падіння програми (SIGSEGV)</tspan><tspan x="260.0" dy="15.6">або читання сміття з пам'яті (UB)</tspan></text>
<rect x="520.0" y="60.0" width="440.0" height="400.0" rx="6" fill="#f4faf6" stroke="#27ae60" stroke-width="2.0"/>
<text x="740.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">З constinit: ГАРАНТОВАНА ГОТОВНІСТЬ</text>
<rect x="540.0" y="115.0" width="400.0" height="54.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="138.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">logger.cpp:</tspan><tspan x="740.0" dy="15.6">constinit Logger g_logger{}; // constexpr ctor</tspan></text>
<rect x="540.0" y="185.0" width="400.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="208.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">network.cpp:</tspan><tspan x="740.0" dy="15.6">Client g_client(&amp;g_logger); // динамічний ctor</tspan></text>
<line x1="740.0" y1="245.0" x2="740.0" y2="275.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540.0" y="280.0" width="400.0" height="66.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="309.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">g_logger ВЖЕ ініціалізовано на етапі збірки!</tspan><tspan x="740.0" dy="14.3">Порядок динамічної ініціалізації network.cpp байдужий</tspan></text>
<line x1="740.0" y1="352.0" x2="740.0" y2="380.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540.0" y="385.0" width="400.0" height="55.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="408.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Результат: 100% передбачуваність,</tspan><tspan x="740.0" dy="15.6">без блокувань, без накладних витрат у main()</tspan></text>
<text x="500.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="500.0" dy="0.0">constinit розриває циклічні та невизначені часові залежності між модулями,</tspan><tspan x="500.0" dy="15.4">перетворюючи порядок завантаження на несуттєву деталь.</tspan></text>
</svg>