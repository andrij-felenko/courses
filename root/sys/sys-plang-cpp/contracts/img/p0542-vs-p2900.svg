<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння підходів P0542 та P2900</text>
<line x1="540.0" y1="30.0" x2="540.0" y2="430.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6 5"/>
<rect x="40.0" y="30.0" width="460.0" height="400.0" rx="10" fill="#fdf7f7" stroke="#c0392b" stroke-width="1.6"/>
<text x="270.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Спроба C++20: P0542 (відхилено)</text>
<rect x="60.0" y="90.0" width="420.0" height="66.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="76.0" y="110.4" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#c0392b" text-anchor="start">[[expects: x &gt; 0]]</text><text x="76.0" y="127.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#c0392b" text-anchor="start">[[ensures r: r &gt;= 0]]</text><text x="76.0" y="143.7" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#c0392b" text-anchor="start">[[assert: p != nullptr]]</text>
<text x="270.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Проблеми та суперечності:</text>
<text x="80.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Синтаксис атрибутів [[...]] — конфлікт семантики</text>
<text x="80.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Рівні побудови: default / audit / axiom</text>
<text x="80.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• Небезпека UB: невиконаний контракт як припущення</text>
<text x="80.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">  компілятора (оптимізатор видаляє перевірки безпеки)</text>
<text x="80.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Невизначеність щодо обробника порушень</text>
<text x="80.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Розкол у комітеті в Кельні (2019) → вилучено</text>
<text x="270.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Підсумок: відсутність консенсусу, ризик UB</text>
<rect x="580.0" y="30.0" width="460.0" height="400.0" rx="10" fill="#f6fbf7" stroke="#27ae60" stroke-width="1.6"/>
<text x="810.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Консенсус C++26: P2900 (SG21)</text>
<rect x="600.0" y="90.0" width="420.0" height="66.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="616.0" y="110.4" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#27ae60" text-anchor="start">pre: x &gt; 0</text><text x="616.0" y="127.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#27ae60" text-anchor="start">post(r): r &gt;= 0</text><text x="616.0" y="143.7" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#27ae60" text-anchor="start">contract_assert: p != nullptr</text>
<text x="810.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключові досягнення консенсусу:</text>
<text x="600.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Прямий синтаксис (першокласні елементи мови)</text>
<text x="600.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Чіткі семантики: ignore / observe / enforce</text>
<text x="600.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Жодного прихованого UB в режимі ignore:</text>
<text x="600.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">  контракт не перетворюється на небезпечну аксіому</text>
<text x="600.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Стандартизований заголовок &lt;contracts&gt;</text>
<text x="600.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Керований std::contracts::contract_violation</text>
<text x="810.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Підсумок: надійність інтерфейсів без дірок в оптимізації</text>
</svg>