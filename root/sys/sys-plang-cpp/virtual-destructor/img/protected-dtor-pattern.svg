<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Патерн захищеного невіртуального деструктора</text>
<rect x="40.0" y="40.0" width="410.0" height="220.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="245.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Спроба видалення через Base*</text>
<rect x="55.0" y="85.0" width="380.0" height="75.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="245.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="245.0" dy="0.0">Base* p = new Derived();</tspan><tspan x="245.0" dy="14.3">delete p;  // ❌ ПОМИЛКА КОМПІЛЯЦІЇ!</tspan><tspan x="245.0" dy="14.3">error: '~Base' is protected within this context</tspan></text>
<rect x="55.0" y="170.0" width="380.0" height="75.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="245.0" y="204.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Компілятор фізично блокує поліморфне видалення.</tspan><tspan x="245.0" dy="11.7">Випадкове руйнування через невіртуальну базу стає неможливим ще на етапі збирання.</tspan></text>
<rect x="490.0" y="40.0" width="410.0" height="220.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.4"/>
<text x="695.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Безпечне використання Derived</text>
<rect x="505.0" y="85.0" width="380.0" height="75.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="695.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="695.0" dy="0.0">Derived d;         // ✔ Автоматичний стек</tspan><tspan x="695.0" dy="14.3">auto p = std::make_unique&lt;Derived&gt;(); // ✔ Купа</tspan><tspan x="695.0" dy="14.3">delete derived_p;  // ✔ Явне видалення Derived*</tspan></text>
<rect x="505.0" y="170.0" width="380.0" height="75.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="695.0" y="204.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Деструктор Derived має доступ до protected-деструктора ~Base().</tspan><tspan x="695.0" dy="11.7">Об'єкт безпечно будується і руйнується з нульовими накладними витратами.</tspan></text>
<rect x="40.0" y="280.0" width="860.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="306.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">protected ~Base() = default — ідеальний вибір для базових класів mixin, CRTP та класів-політик:</tspan><tspan x="470.0" dy="14.3">100% захист від UB при нульовому розмірі (0 байтів на vptr) та повній можливості інлайнінгу деструктора.</tspan></text>
</svg>