<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок розгортання ланцюга деструкторів</text>
<rect x="40.0" y="40.0" width="200.0" height="210.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/>
<rect x="48.0" y="48.0" width="184.0" height="32.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="140.0" y="68.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">1. Вхід у ~Derived()</tspan></text>
<rect x="48.0" y="88.0" width="184.0" height="150.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="140.0" y="154.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">vptr вказує на vtable Derived.</tspan><tspan x="140.0" dy="11.7">Виконується тіло користувацького</tspan><tspan x="140.0" dy="11.7">деструктора Derived::~Derived().</tspan></text>
<rect x="260.0" y="40.0" width="200.0" height="210.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/>
<rect x="268.0" y="48.0" width="184.0" height="32.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="68.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">2. Члени Derived</tspan></text>
<rect x="268.0" y="88.0" width="184.0" height="150.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="360.0" y="154.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Нестатичні члени Derived</tspan><tspan x="360.0" dy="11.7">руйнуються у зворотному порядку</tspan><tspan x="360.0" dy="11.7">до їхнього оголошення в класі.</tspan></text>
<rect x="480.0" y="40.0" width="200.0" height="210.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
<rect x="488.0" y="48.0" width="184.0" height="32.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="580.0" y="68.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">3. Зміна vptr → Base</tspan></text>
<rect x="488.0" y="88.0" width="184.0" height="150.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="580.0" y="154.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Середовище перемикає vptr об'єкта</tspan><tspan x="580.0" dy="11.7">на vtable класу Base!</tspan><tspan x="580.0" dy="11.7">Частини Derived більше не існує.</tspan></text>
<rect x="700.0" y="40.0" width="200.0" height="210.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/>
<rect x="708.0" y="48.0" width="184.0" height="32.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="800.0" y="68.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">4. Тіло й члени Base</tspan></text>
<rect x="708.0" y="88.0" width="184.0" height="150.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="800.0" y="154.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Виконується Base::~Base().</tspan><tspan x="800.0" dy="11.7">Члени Base руйнуються у зворотному</tspan><tspan x="800.0" dy="11.7">порядку. Об'єкт помер.</tspan></text>
<line x1="240.0" y1="145.0" x2="258.0" y2="145.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="460.0" y1="145.0" x2="478.0" y2="145.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="680.0" y1="145.0" x2="698.0" y2="145.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="275.0" width="860.0" height="80.0" rx="6" fill="#fdfbf7" stroke="#d97706" stroke-width="1.5"/><text x="470.0" y="304.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Критичний інваріант: усередині деструктора базового класу об'єкт уже втратив свою похідну природу.</tspan><tspan x="470.0" dy="14.3">Перемикання vptr гарантує, що віртуальні виклики з Base::~Base() підуть у версію Base (або викличуть паніку pure virtual call),</tspan><tspan x="470.0" dy="14.3">а не звертатимуться до вже мертвої пам'яті й зруйнованих членів Derived.</tspan></text>
</svg>