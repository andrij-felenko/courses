<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура розділів Core Guidelines</text>
<text x="480.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура розділів C++ Core Guidelines та Профілі Безпеки</text>
<text x="250.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тематичні розділи правил (Sections)</text>
<rect x="30.0" y="90.0" width="440.0" height="52.0" rx="6" fill="#eef2ff" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="112.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">P: Philosophy</tspan><tspan x="250.0" dy="14.3">Фундаментальні цілі: виражати наміри в типах, стандартний C++, RAII</tspan></text>
<rect x="30.0" y="152.0" width="440.0" height="52.0" rx="6" fill="#f0fdf4" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="174.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">I: Interfaces</tspan><tspan x="250.0" dy="14.3">Явні інтерфейси, заборона глобальних змінних, сильна типізація</tspan></text>
<rect x="30.0" y="214.0" width="440.0" height="52.0" rx="6" fill="#fefce8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="236.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">F: Functions &amp; C: Classes</tspan><tspan x="250.0" dy="14.3">Короткі функції, Rule of Zero/Five, незмінні інваріанти класів</tspan></text>
<rect x="30.0" y="276.0" width="440.0" height="52.0" rx="6" fill="#fff7ed" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="298.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">ES: Expr &amp; Statements</tspan><tspan x="250.0" dy="14.3">Заборона небезпечних кастів, явна ініціалізація, auto, без goto</tspan></text>
<rect x="30.0" y="338.0" width="440.0" height="52.0" rx="6" fill="#faf5ff" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="360.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Per, CP, E: Perf, Concurrency, Errors</tspan><tspan x="250.0" dy="14.3">Zero-overhead абстракції, безпечні потоки, RAII-блокування, винятки</tspan></text>
<text x="710.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Профілі автоматизованої безпеки (Enforcement Profiles)</text>
<rect x="510.0" y="90.0" width="420.0" height="90.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="117.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Type Safety Profile (Типобезпека)</tspan><tspan x="720.0" dy="14.3">• Заборона reinterpret_cast та C-style casts</tspan><tspan x="720.0" dy="14.3">• Заборона небезпечних varargs (...)</tspan><tspan x="720.0" dy="14.3">• Заборона нетипізованих union (використовувати std::variant)</tspan></text>
<rect x="510.0" y="195.0" width="420.0" height="90.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="222.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Bounds Safety Profile (Безпека меж пам'яті)</tspan><tspan x="720.0" dy="14.3">• Заборона адресної арифметики над сирими вказівниками</tspan><tspan x="720.0" dy="14.3">• Заборона C-масивів у публічних інтерфейсах</tspan><tspan x="720.0" dy="14.3">• Вимога використовувати std::span&lt;T&gt; та std::array</tspan></text>
<rect x="510.0" y="300.0" width="420.0" height="90.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="327.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Lifetime Safety Profile (Безпека життєвого циклу)</tspan><tspan x="720.0" dy="14.3">• Статичне виявлення висячих посилань (Dangling References)</tspan><tspan x="720.0" dy="14.3">• Відстеження повернення посилань на локальні змінні стека</tspan><tspan x="720.0" dy="14.3">• Контроль валідності ітераторів та анулювання вказівників</tspan></text>
<line x1="475.0" y1="230.0" x2="505.0" y2="230.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>