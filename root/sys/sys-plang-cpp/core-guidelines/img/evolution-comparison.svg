<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція підходів до безпеки C++</text>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція парадигм безпеки та культури коду в C++</text>
<text x="170.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1990-ті: Ручна дисципліна (C із класами)</text>
<rect x="30.0" y="95.0" width="280.0" height="240.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="147.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Практика:</tspan><tspan x="170.0" dy="14.3">• Ручне виділення malloc/free, new/delete</tspan><tspan x="170.0" dy="14.3">• Нетипізовані буфери void* та C-масиви</tspan><tspan x="170.0" dy="14.3">• Сирі вказівники володіють пам'яттю</tspan><tspan x="170.0" dy="14.3">• Сигналізація помилок через int коди</tspan><tspan x="170.0" dy="14.3"></tspan><tspan x="170.0" dy="14.3">Наслідки:</tspan><tspan x="170.0" dy="14.3">• Регулярні витоки пам'яті (Leaks)</tspan><tspan x="170.0" dy="14.3">• Use-After-Free та подвійне звільнення</tspan><tspan x="170.0" dy="14.3">• ~70% вразливостей безпеки (CVE)</tspan><tspan x="170.0" dy="14.3">• Помилки знаходять користувачі</tspan></text>
<text x="480.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2000-ні: Книжкові правила та гайди компаній</text>
<rect x="340.0" y="95.0" width="280.0" height="240.0" rx="6" fill="#f0f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="147.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Практика:</tspan><tspan x="480.0" dy="14.3">• Книги Скотта Меєрса (Effective C++)</tspan><tspan x="480.0" dy="14.3">• Google C++ Style Guide, запрети фіч</tspan><tspan x="480.0" dy="14.3">• Ручний код-рев'ю колегами по команді</tspan><tspan x="480.0" dy="14.3">• Поява std::auto_ptr та boost::shared_ptr</tspan><tspan x="480.0" dy="14.3"></tspan><tspan x="480.0" dy="14.3">Наслідки:</tspan><tspan x="480.0" dy="14.3">• Суб'єктивність трактування правил</tspan><tspan x="480.0" dy="14.3">• Людський фактор пропускає витоки</tspan><tspan x="480.0" dy="14.3">• Відсутність єдиного стандарту індустрії</tspan><tspan x="480.0" dy="14.3">• Заборона корисних фіч замість правил</tspan></text>
<text x="790.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">2015+: C++ Core Guidelines &amp; Статаналіз</text>
<rect x="650.0" y="95.0" width="280.0" height="240.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="153.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Практика:</tspan><tspan x="790.0" dy="13.0">• Формальний звід правил Страуструпа/Саттера</tspan><tspan x="790.0" dy="13.0">• Залізне правило володіння (RAII, smart ptrs)</tspan><tspan x="790.0" dy="13.0">• Бібліотека підтримки GSL (span, not_null)</tspan><tspan x="790.0" dy="13.0">• Автоматичний аналіз (Clang-Tidy, MSVC)</tspan><tspan x="790.0" dy="13.0"></tspan><tspan x="790.0" dy="13.0">Наслідки:</tspan><tspan x="790.0" dy="13.0">• Помилки блокуються на етапі компіляції</tspan><tspan x="790.0" dy="13.0">• Механічний аудит через CI/CD конвеєр</tspan><tspan x="790.0" dy="13.0">• Профілі безпеки (Type, Bounds, Lifetime)</tspan><tspan x="790.0" dy="13.0">• Швидкість C++ без жертв безпекою</tspan></text>
<rect x="30.0" y="355.0" width="900.0" height="50.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="480.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перехід: від «пам'ятай сотні заборон у голові» до «компілятор механічно гарантує відсутність дефектів»</text>
</svg>