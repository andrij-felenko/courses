<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель володіння ресурсами в Core Guidelines</text>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель володіння та семантика доступу в C++ Core Guidelines</text>
<text x="240.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Власники ресурсів (Керують життєвим циклом через RAII)</text>
<rect x="30.0" y="95.0" width="420.0" height="120.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="137.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Одноосібне володіння: std::unique_ptr&lt;T&gt;</tspan><tspan x="240.0" dy="14.3">• Повний контроль над ресурсом у купі</tspan><tspan x="240.0" dy="14.3">• Заборонено копіювання, передача через std::move</tspan><tspan x="240.0" dy="14.3">• Деструктор гарантовано звільняє пам'ять</tspan></text>
<rect x="480.0" y="95.0" width="450.0" height="120.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="705.0" y="137.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Спільне володіння: std::shared_ptr&lt;T&gt; / weak_ptr&lt;T&gt;</tspan><tspan x="705.0" dy="14.3">• Атомарний лічильник посилань (Control Block)</tspan><tspan x="705.0" dy="14.3">• Використовується ЛИШЕ коли власників справді кілька</tspan><tspan x="705.0" dy="14.3">• weak_ptr запобігає циклічним залежностям</tspan></text>
<text x="480.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Неволодіючі позичальники (Передаються у функції як параметри)</text>
<rect x="30.0" y="265.0" width="280.0" height="140.0" rx="6" fill="#f0f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="310.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Посилання: T&amp; / const T&amp;</tspan><tspan x="170.0" dy="14.3">• Обов'язковий аргумент</tspan><tspan x="170.0" dy="14.3">• Гарантовано не null</tspan><tspan x="170.0" dy="14.3">• const T&amp; — читання без копії</tspan><tspan x="170.0" dy="14.3">• T&amp; — модифікація in-place</tspan></text>
<rect x="340.0" y="265.0" width="280.0" height="140.0" rx="6" fill="#f0f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="312.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Вказівники: T* / not_null&lt;T*&gt;</tspan><tspan x="480.0" dy="13.0">• T* — опціональний об'єкт (може бути nullptr)</tspan><tspan x="480.0" dy="13.0">• not_null&lt;T*&gt; — гарантовано дійсний вказівник</tspan><tspan x="480.0" dy="13.0">• СУВОРО ЗАБОРОНЕНО викликати delete над T*!</tspan><tspan x="480.0" dy="13.0">• Вказівник ніколи не володіє ресурсом</tspan></text>
<rect x="650.0" y="265.0" width="280.0" height="140.0" rx="6" fill="#f0f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="790.0" y="310.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Буфери: std::span&lt;T&gt; / string_view</tspan><tspan x="790.0" dy="14.3">• Перегляд неперервного масиву</tspan><tspan x="790.0" dy="14.3">• Зберігає пару [pointer, size]</tspan><tspan x="790.0" dy="14.3">• Захист від виходу за межі масиву</tspan><tspan x="790.0" dy="14.3">• Заміна небезпечної пари (T* data, int n)</tspan></text>
</svg>