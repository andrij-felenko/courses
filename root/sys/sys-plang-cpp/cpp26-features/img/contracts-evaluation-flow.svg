<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Семантичні режими виконання контрактів у C++26</text>
<text x="480.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Три семантичні режими перевірки контрактних преумов та інваріантів</text>
<rect x="40.0" y="75.0" width="250.0" height="325.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="2.0"/>
<text x="165.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Режим: ignore</text>
<text x="165.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нульовий оверхед</text>
<line x1="52.0" y1="133.0" x2="278.0" y2="133.0" stroke="#6b7280" stroke-width="1.0"/>
<rect x="52.0" y="146.5" width="226.0" height="21.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/><text x="165.0" y="160.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">1. pre (x &gt; 0) не обчислюється</tspan></text>
<rect x="52.0" y="184.5" width="226.0" height="21.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/><text x="165.0" y="198.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">2. У машинний код перевірка</tspan></text>
<rect x="52.0" y="222.5" width="226.0" height="21.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/><text x="165.0" y="236.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">   не генерується</tspan></text>
<rect x="52.0" y="260.5" width="226.0" height="21.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/><text x="165.0" y="274.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">3. Компілятор може використати</tspan></text>
<rect x="52.0" y="298.5" width="226.0" height="21.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/><text x="165.0" y="312.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">   твердження для оптимізації</tspan></text>
<line x1="52.0" y1="327.0" x2="278.0" y2="327.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="165.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Для релізних білдів</tspan><tspan x="165.0" dy="14.9">максимальної швидкості</tspan></text>
<rect x="355.0" y="75.0" width="250.0" height="325.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2.0"/>
<text x="480.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">Режим: observe</text>
<text x="480.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Логування без зупинки</text>
<line x1="367.0" y1="133.0" x2="593.0" y2="133.0" stroke="#d97706" stroke-width="1.0"/>
<rect x="367.0" y="146.5" width="226.0" height="21.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/><text x="480.0" y="160.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">1. pre (x &gt; 0) обчислюється</tspan></text>
<rect x="367.0" y="184.5" width="226.0" height="21.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/><text x="480.0" y="198.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">2. Якщо умова хибна:</tspan></text>
<rect x="367.0" y="222.5" width="226.0" height="21.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/><text x="480.0" y="236.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">   викликається violation handler</tspan></text>
<rect x="367.0" y="260.5" width="226.0" height="21.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/><text x="480.0" y="274.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">3. Фіксується стек/лог помилки</tspan></text>
<rect x="367.0" y="298.5" width="226.0" height="21.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/><text x="480.0" y="312.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">4. Робота програми триває</tspan></text>
<line x1="367.0" y1="327.0" x2="593.0" y2="327.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="480.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Для діагностики в продакшені</tspan><tspan x="480.0" dy="14.9">без аварійного падіння</tspan></text>
<rect x="670.0" y="75.0" width="250.0" height="325.0" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="795.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Режим: enforce</text>
<text x="795.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сувора безпека</text>
<line x1="682.0" y1="133.0" x2="908.0" y2="133.0" stroke="#c0392b" stroke-width="1.0"/>
<rect x="682.0" y="146.5" width="226.0" height="21.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/><text x="795.0" y="160.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">1. pre (x &gt; 0) обчислюється</tspan></text>
<rect x="682.0" y="184.5" width="226.0" height="21.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/><text x="795.0" y="198.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">2. Якщо умова хибна:</tspan></text>
<rect x="682.0" y="222.5" width="226.0" height="21.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/><text x="795.0" y="236.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">   викликається violation handler</tspan></text>
<rect x="682.0" y="260.5" width="226.0" height="21.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/><text x="795.0" y="274.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">3. Викликається std::terminate()</tspan></text>
<rect x="682.0" y="298.5" width="226.0" height="21.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/><text x="795.0" y="312.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">4. Програма негайно завершується</tspan></text>
<line x1="682.0" y1="327.0" x2="908.0" y2="327.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="795.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Для тестування, відладки</tspan><tspan x="795.0" dy="14.9">та критичних за безпекою систем</tspan></text>
</svg>