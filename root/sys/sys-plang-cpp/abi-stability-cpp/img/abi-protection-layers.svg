<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
<rect width="960" height="460" fill="#ffffff"/>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Багаторівнева архітектура захисту стабільності двійкового інтерфейсу (ABI Firewall)</text>
<rect x="50.0" y="70.0" width="260.0" height="80.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="101.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">1. Ідіома PImpl (Opaque Pointer)</tspan><tspan x="180.0" dy="11.7">Публічний клас містить лише std::unique_ptr&lt;Impl&gt;.</tspan><tspan x="180.0" dy="11.7">Розмір і vtable клієнта фіксовані назавжди (8 байтів).</tspan></text>
<rect x="350.0" y="70.0" width="260.0" height="80.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="95.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">2. Inline Namespaces (ABI Versioning)</tspan><tspan x="480.0" dy="11.7">inline namespace v2 { class Engine; }</tspan><tspan x="480.0" dy="11.7">Манглене ім'я кодує версію (_ZN6engine2v2…),</tspan><tspan x="480.0" dy="11.7">запобігаючи тихим ODR-помилкам.</tspan></text>
<rect x="650.0" y="70.0" width="260.0" height="80.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="101.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">3. extern &quot;C&quot; Boundary</tspan><tspan x="780.0" dy="11.7">Непрозорі дескриптори (typedef struct Handle*).</tspan><tspan x="780.0" dy="11.7">Стабільний плоский ABI між будь-якими компіляторами.</tspan></text>
<line x1="180.0" y1="155.0" x2="180.0" y2="195.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="480.0" y1="155.0" x2="480.0" y2="195.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="780.0" y1="155.0" x2="780.0" y2="195.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="150.0" y="200.0" width="660.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="219.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">4. Контроль видимості символів (Symbol Visibility Firewall)</tspan><tspan x="480.0" dy="14.3">Прапорець компілятора: -fvisibility=hidden -fvisibility-inlines-hidden</tspan><tspan x="480.0" dy="14.3">Експортуються лише явно помічені символи: __attribute__((visibility(&quot;default&quot;)))</tspan><tspan x="480.0" dy="14.3">Приватні класи, шаблони та деталі реалізації НЕ потрапляють у таблицю .dynsym!</tspan></text>
<line x1="480.0" y1="280.0" x2="480.0" y2="315.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="150.0" y="320.0" width="660.0" height="105.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="354.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">5. Символьне версіонування у лінкері та Автоматичний CI-аудит (libabigail)</tspan><tspan x="480.0" dy="14.3">• GNU Version Script: MYLIB_1.0 { global: mylib_*; local: *; };</tspan><tspan x="480.0" dy="14.3">• abidw / abidiff у конвеєрі CI: аналізує DWARF-дерева типів між комітами;</tspan><tspan x="480.0" dy="14.3">• Автоматичне блокування pull request при зміні зміщень полів або слотів vtable.</tspan></text>
</svg>
