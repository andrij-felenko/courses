<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450">
<rect width="960" height="450" fill="#ffffff"/>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Невідповідність розміщення полів (Padding і Alignment) між бібліотекою та клієнтом</text>
<text x="240.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Бібліотека v1.0 (sizeof = 16 байтів)</text>
<rect x="40.0" y="80.0" width="400.0" height="340.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<rect x="60.0" y="100.0" width="110.0" height="50.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="115.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">int32_t id</tspan><tspan x="115.0" dy="14.3">[4 байти]</tspan></text>
<rect x="175.0" y="100.0" width="110.0" height="50.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">uint32_t flags</tspan><tspan x="230.0" dy="14.3">[4 байти]</tspan></text>
<rect x="290.0" y="100.0" width="130.0" height="50.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="355.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">double score</tspan><tspan x="355.0" dy="14.3">[8 байтів]</tspan></text>
<text x="60.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Зміщення в пам'яті (Offset):</text>
<text x="60.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• offsetof(id)    = 0x00</text>
<text x="60.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• offsetof(flags) = 0x04</text>
<text x="60.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• offsetof(score) = 0x08 (вирівняно за 8 байтів)</text>
<rect x="60.0" y="260.0" width="360.0" height="140.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="305.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Клієнт зчитує score:</tspan><tspan x="240.0" dy="14.3">movsd xmm0, [rdi + 8]</tspan><tspan x="240.0" dy="14.3"></tspan><tspan x="240.0" dy="14.3">Обидві сторони однаково розуміють адресу score.</tspan><tspan x="240.0" dy="14.3">Читання коректне: значення 99.5 потрапляє в xmm0.</tspan></text>
<text x="720.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Бібліотека v1.1 з новим полем (sizeof = 24 байти)</text>
<rect x="520.0" y="80.0" width="400.0" height="340.0" rx="6" fill="#fdf8f8" stroke="#c0392b" stroke-width="1.5"/>
<rect x="535.0" y="100.0" width="80.0" height="50.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="575.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">int32_t id</tspan><tspan x="575.0" dy="13.0">[4 б]</tspan></text>
<rect x="620.0" y="100.0" width="85.0" height="50.0" rx="6" fill="#ffebee" stroke="#c0392b" stroke-width="1.5"/><text x="662.5" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="662.5" dy="0.0">int16_t tag</tspan><tspan x="662.5" dy="13.0">[2 б]</tspan></text>
<rect x="710.0" y="100.0" width="60.0" height="50.0" rx="6" fill="#fff3e0" stroke="#6b7280" stroke-width="1.5"/><text x="740.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">pad</tspan><tspan x="740.0" dy="13.0">[2 б]</tspan></text>
<rect x="775.0" y="100.0" width="65.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="807.5" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="807.5" dy="0.0">flags</tspan><tspan x="807.5" dy="13.0">[4 б]</tspan></text>
<rect x="845.0" y="100.0" width="65.0" height="50.0" rx="6" fill="#fff3e0" stroke="#6b7280" stroke-width="1.5"/><text x="877.5" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="877.5" dy="0.0">pad</tspan><tspan x="877.5" dy="13.0">[4 б]</tspan></text>
<text x="535.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Реальні зміщення у v1.1:</text>
<text x="535.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• offsetof(id)    = 0x00, offsetof(tag) = 0x04</text>
<text x="535.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• offsetof(flags) = 0x08 (зсунувся з 0x04 на 0x08!)</text>
<text x="535.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">• offsetof(score) = 0x10 (зсунувся з 0x08 на 0x10!)</text>
<rect x="535.0" y="260.0" width="370.0" height="140.0" rx="6" fill="#ffebee" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Незбіжний клієнт (v1.0) зчитує score за старим зміщенням:</tspan><tspan x="720.0" dy="13.0">movsd xmm0, [rdi + 8]</tspan><tspan x="720.0" dy="13.0"></tspan><tspan x="720.0" dy="13.0">Помилка: за адресою [rdi + 8] тепер лежать flags та padding!</tspan><tspan x="720.0" dy="13.0">Цілі числа інтерпретуються як double (сміття/NaN).</tspan><tspan x="720.0" dy="13.0">При записі клієнт перетирає чужі поля у v1.1 структурі!</tspan></text>
<line x1="480.0" y1="75.0" x2="480.0" y2="425.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
</svg>
