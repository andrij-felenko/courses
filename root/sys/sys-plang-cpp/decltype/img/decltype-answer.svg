<text x="510.0" y="515.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">prvalue місця не має — кодувати нічого, тому тип лишається голим</text>
