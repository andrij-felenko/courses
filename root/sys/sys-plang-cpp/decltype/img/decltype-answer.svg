<line x1="199.1" y1="95.0" x2="395.8" y2="95.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="614.2" y1="95.0" x2="782.6" y2="95.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="297.4" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">що знає компілятор</text>
<text x="698.4" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">закодовано в один тип</text>
<text x="510.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">категорію кодують посиланням — тим самим, чим її задають у типі повернення функції</text>
<rect x="130.0" y="225.0" width="214.0" height="64.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="237.0" y="261.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="237.0" dy="0.0">категорія виразу</tspan></text>
