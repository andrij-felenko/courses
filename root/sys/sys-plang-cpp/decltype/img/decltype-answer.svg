<rect x="610.0" y="225.0" width="294.0" height="64.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="757.0" y="252.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="757.0" dy="0.0">так само оголосили б функцію,</tspan><tspan x="757.0" dy="18.2">щоб її виклик дав такий вираз</tspan></text>
<rect x="130.0" y="295.0" width="214.0" height="56.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="237.0" y="328.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="237.0" dy="0.0">lvalue</tspan></text>
