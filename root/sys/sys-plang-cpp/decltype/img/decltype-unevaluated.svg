<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Операнд decltype аналізують, але не обчислюють</text>
<rect x="267.8" y="39.5" width="544.5" height="45.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">decltype( std::declval&lt;A&gt;() + std::declval&lt;B&gt;() )</tspan></text>
<rect x="166.4" y="162.8" width="237.2" height="144.5" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="285.0" y="191.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">компілятор робить</tspan><tspan x="285.0" dy="19.5">знаходить імена</tspan><tspan x="285.0" dy="19.5">розв'язує перевантаження</tspan><tspan x="285.0" dy="19.5">перевіряє доступ</tspan><tspan x="285.0" dy="19.5">інстанціює сигнатури</tspan><tspan x="285.0" dy="19.5">обчислює тип результату</tspan></text>
<rect x="634.4" y="162.8" width="331.2" height="144.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="800.0" y="191.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">компілятор не робить</tspan><tspan x="800.0" dy="19.5">не викликає функцію</tspan><tspan x="800.0" dy="19.5">не вимагає її визначення</tspan><tspan x="800.0" dy="19.5">не створює жодного об'єкта</tspan><tspan x="800.0" dy="19.5">не змінює нічого: i++ не збільшує i</tspan><tspan x="800.0" dy="19.5">не кладе в бінарник ані байта</tspan></text>
<line x1="450.0" y1="88.5" x2="285.0" y2="154.8" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="630.0" y1="88.5" x2="800.0" y2="154.8" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="540.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">тому питати тип операції можна навіть там, де виконати її нема на чому</text>
</svg>