<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві поведінки decltype і перемикач між ними</text>
<rect x="443.5" y="35.0" width="173.1" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="64.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">decltype( E )</tspan></text>
<text x="530.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">int i = 0;    const int&amp; r = i;    int&amp;&amp; x = 0;</text>
<rect x="319.4" y="140.5" width="421.3" height="43.0" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/><text x="530.0" y="167.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">E — це ім'я або звертання до члена, без дужок?</tspan></text>
<line x1="530.0" y1="85.0" x2="530.0" y2="134.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="152.7" y="244.0" width="224.6" height="82.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="265.0" y="270.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">правило імені</tspan><tspan x="265.0" dy="19.5">тип, як його оголошено;</tspan><tspan x="265.0" dy="19.5">категорію не питають</tspan></text>
<rect x="665.6" y="244.0" width="258.9" height="82.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="795.0" y="270.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">правило виразу</tspan><tspan x="795.0" dy="19.5">тип, доповнений категорією:</tspan><tspan x="795.0" dy="19.5">lvalue → T&amp;,  xvalue → T&amp;&amp;</tspan></text>
<line x1="470.0" y1="187.5" x2="265.0" y2="236.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="590.0" y1="187.5" x2="795.0" y2="236.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="355.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">так</text>
<text x="705.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ні</text>
<rect x="131.3" y="374.0" width="267.4" height="82.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="400.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">decltype(i)   →   int</tspan><tspan x="265.0" dy="19.5">decltype(r)   →   const int&amp;</tspan><tspan x="265.0" dy="19.5">decltype(x)   →   int&amp;&amp;</tspan></text>
<rect x="635.6" y="374.0" width="318.7" height="82.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="795.0" y="400.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">decltype((i))            →   int&amp;</tspan><tspan x="795.0" dy="19.5">decltype(i + 1)          →   int</tspan><tspan x="795.0" dy="19.5">decltype(std::move(i))   →   int&amp;&amp;</tspan></text>
<line x1="265.0" y1="330.0" x2="265.0" y2="368.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="795.0" y1="330.0" x2="795.0" y2="368.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="530.0" y="508.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">круглі дужки нічого не роблять зі значенням — вони лише переводять стрілку</text>
</svg>