<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Монадичний конвеєр обробки std::optional</text>
<text x="470.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Монадичний конвеєр обробки std::optional (C++23)</text>
<rect x="40.0" y="90.0" width="160.0" height="90.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="131.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Вхідні дані</tspan><tspan x="120.0" dy="15.6">std::optional&lt;T&gt;</tspan></text>
<line x1="200.0" y1="135.0" x2="245.0" y2="135.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="250.0" y="90.0" width="180.0" height="90.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="340.0" y="123.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">.and_then(f)</tspan><tspan x="340.0" dy="15.6">[T -&gt; optional&lt;U&gt;]</tspan><tspan x="340.0" dy="15.6">Коротке замикання</tspan></text>
<line x1="430.0" y1="135.0" x2="475.0" y2="135.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="480.0" y="90.0" width="180.0" height="90.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="570.0" y="123.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">.transform(g)</tspan><tspan x="570.0" dy="15.6">[U -&gt; V]</tspan><tspan x="570.0" dy="15.6">Обгортка у optional</tspan></text>
<line x1="660.0" y1="135.0" x2="705.0" y2="135.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="710.0" y="90.0" width="180.0" height="90.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="800.0" y="123.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">.or_else(h)</tspan><tspan x="800.0" dy="15.6">[ () -&gt; optional&lt;V&gt; ]</tspan><tspan x="800.0" dy="15.6">Запасний результат</tspan></text>
<line x1="470.0" y1="180.0" x2="470.0" y2="230.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="270.0" y="235.0" width="400.0" height="75.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Підсумковий результат: std::optional&lt;V&gt;</tspan><tspan x="470.0" dy="15.6">(або обчислене значення, або дефолт без винятків)</tspan></text>
<text x="470.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Якщо на будь-якому кроці повертається nullopt, and_then та transform пропускають обчислення</text>
<text x="470.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">or_else активується лише тоді, коли ланцюжок порожній, надаючи альтернативний відновлений результат</text>
</svg>