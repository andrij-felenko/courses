<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Макет пам'яті std::optional&lt;T&gt;</text>
<text x="470.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Макет пам'яті std::optional&lt;T&gt; та альтернативних підходів</text>
<text x="50.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">1. Указівник на купу (std::unique_ptr&lt;T&gt;): відсутнє значення = nullptr</text>
<rect x="50.0" y="95.0" width="260.0" height="90.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">std::unique_ptr&lt;T&gt;</tspan><tspan x="180.0" dy="15.6">ptr ────────────────┐</tspan><tspan x="180.0" dy="15.6">(sizeof = 8 байтів)   │</tspan></text>
<line x1="310.0" y1="140.0" x2="420.0" y2="140.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="425.0" y="95.0" width="460.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="655.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Динамічний буфер у купі (Heap Allocation)</tspan><tspan x="655.0" dy="15.6">Об'єкт T [sizeof(T) байтів]</tspan><tspan x="655.0" dy="15.6">Додатковий виклик malloc/free + pointer chasing</tspan></text>
<line x1="40.0" y1="205.0" x2="900.0" y2="205.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="50.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">2. std::optional&lt;T&gt;: суцільна пам'ять без купі (Stack-allocated continuous memory)</text>
<rect x="50.0" y="245.0" width="410.0" height="110.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="255.0" y="291.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Порожній стан (std::nullopt):</tspan><tspan x="255.0" dy="11.7">[ storage: Uninitialized memory (alignas T) ] [ bool has_value = false ]</tspan><tspan x="255.0" dy="11.7">Конструктор T НЕ викликався. Пам'ять у купі НЕ виділяється.</tspan></text>
<rect x="480.0" y="245.0" width="410.0" height="110.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="685.0" y="290.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Заповнений стан (Engaged optional):</tspan><tspan x="685.0" dy="13.0">[ storage: Constructed object T(args...) ] [ bool has_value = true  ]</tspan><tspan x="685.0" dy="13.0">Об'єкт T сконструйовано за допомогою placement new у буфері.</tspan></text>
<text x="50.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Обчислення розміру: sizeof(std::optional&lt;T&gt;) = sizeof(T) + alignof(T) (з урахуванням padding байтів)</text>
<text x="50.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Приклади: optional&lt;char&gt; = 2 байти, optional&lt;int32_t&gt; = 8 байтів, optional&lt;double&gt; = 16 байтів</text>
</svg>