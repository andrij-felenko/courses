<rect x="544.3" y="214.6" width="231.5" height="70.8" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/><text x="660.0" y="237.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">C++14 Alias Template Helper:</tspan><tspan x="660.0" dy="16.9">remove_reference_t&lt;T&gt;</tspan><tspan x="660.0" dy="16.9">⇒ using type</tspan></text>
<text x="480.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Метафункція перетворює типи або значення під час компіляції через спадкування від integral_constant</text>
