<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія метафункції типу (Type Trait Meta-function)</text>
<rect x="100.3" y="76.8" width="199.4" height="66.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="105.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Аргумент-тип T</tspan><tspan x="200.0" dy="19.5">const std::string&amp;</tspan></text>
<text x="200.0" y="60.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Вхідний тип у метафункцію</text>
<rect x="360.3" y="59.7" width="239.5" height="100.6" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="87.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">template&lt;class T&gt;</tspan><tspan x="480.0" dy="18.2">struct is_lvalue_reference</tspan><tspan x="480.0" dy="18.2">: false_type {};</tspan><tspan x="480.0" dy="18.2">/* спеціалізація для T&amp; */</tspan></text>
<text x="480.0" y="43.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Механізм часткової спеціалізації шаблону</text>
