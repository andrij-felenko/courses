<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Етапи трансформації типів у std::decay</text>
<rect x="86.1" y="66.2" width="127.7" height="87.7" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="89.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Вхідний тип:</tspan><tspan x="150.0" dy="16.9">const int[5]</tspan><tspan x="150.0" dy="16.9">або const int&amp;</tspan><tspan x="150.0" dy="16.9">або void(int)</tspan></text>
<rect x="297.6" y="66.2" width="164.8" height="87.7" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="89.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">1. remove_reference</tspan><tspan x="380.0" dy="16.9">const int[5]</tspan><tspan x="380.0" dy="16.9">const int</tspan><tspan x="380.0" dy="16.9">void(int)</tspan></text>
<rect x="530.2" y="66.2" width="179.6" height="87.7" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="89.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">2. Array / Func Decay</tspan><tspan x="620.0" dy="16.9">const int*</tspan><tspan x="620.0" dy="16.9">const int</tspan><tspan x="620.0" dy="16.9">void(*)(int)</tspan></text>
<rect x="782.4" y="66.2" width="135.1" height="87.7" rx="6" fill="#eaf7ee" stroke="#c0392b" stroke-width="1.5"/><text x="850.0" y="89.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">3. Stripping CV</tspan><tspan x="850.0" dy="16.9">const int*</tspan><tspan x="850.0" dy="16.9">int</tspan><tspan x="850.0" dy="16.9">void(*)(int)</tspan></text>
<line x1="219.9" y1="110.0" x2="291.6" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="468.4" y1="110.0" x2="524.2" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="715.8" y1="110.0" x2="776.4" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="216.7" y="222.6" width="546.7" height="74.8" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="247.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Правило std::decay імітує передачу за значенням у функцію:</tspan><tspan x="490.0" dy="16.9">масиви стають вказівниками, функції — вказівниками на функції,</tspan><tspan x="490.0" dy="16.9">а для звичайних типів видаляються посилання та зовнішні const/volatile</tspan></text>
</svg>