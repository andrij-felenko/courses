<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двофазне виконання виразу new</text>
<rect x="40.0" y="20.0" width="860.0" height="42.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="46.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Вираз new T(args...): що генерує компілятор під капотом</tspan></text>
<rect x="50.0" y="95.0" width="240.0" height="52.0" rx="6" fill="#e8f4fd" stroke="#1976d2" stroke-width="1.5"/><text x="170.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0d47a1" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Фаза 1: Отримання пам'яті</tspan><tspan x="170.0" dy="13.0">void* raw = operator new(sizeof(T))</tspan></text>
<line x1="290.0" y1="121.0" x2="340.0" y2="121.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="345.0" y="95.0" width="180.0" height="52.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="435.0" y="117.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="435.0" dy="0.0">Пам'ять успішно</tspan><tspan x="435.0" dy="15.6">виділено?</tspan></text>
<line x1="435.0" y1="147.0" x2="435.0" y2="205.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="320.0" y="210.0" width="230.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="435.0" y="230.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="435.0" dy="0.0">Викид std::bad_alloc</tspan><tspan x="435.0" dy="14.3">(або nullptr для std::nothrow)</tspan></text>
<line x1="525.0" y1="121.0" x2="575.0" y2="121.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="550.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Так</text>
<rect x="580.0" y="95.0" width="310.0" height="52.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="735.0" y="117.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">Фаза 2: Ініціалізація об'єкта</tspan><tspan x="735.0" dy="15.6">виклик конструктора T::T(raw, args...)</tspan></text>
<line x1="735.0" y1="147.0" x2="735.0" y2="225.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="610.0" y="230.0" width="250.0" height="54.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="735.0" y="253.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">Успіх: час життя об'єкта почався</tspan><tspan x="735.0" dy="14.3">повернення T* клієнту</tspan></text>
<line x1="890.0" y1="121.0" x2="915.0" y2="121.0" stroke="#c0392b" stroke-width="1.6"/>
<line x1="915.0" y1="121.0" x2="915.0" y2="340.0" stroke="#c0392b" stroke-width="1.6"/>
<line x1="915.0" y1="340.0" x2="785.0" y2="340.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="855.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Виняток!</text>
<rect x="500.0" y="315.0" width="275.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="637.5" y="332.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="637.5" dy="0.0">Автоматичний відкат компілятора:</tspan><tspan x="637.5" dy="14.3">виклик operator delete(raw)</tspan><tspan x="637.5" dy="14.3">та ретрансляція винятку</tspan></text>
<rect x="40.0" y="395.0" width="860.0" height="60.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="421.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Вираз new неподільний у синтаксисі, але строго двоетапний під час виконання.</tspan><tspan x="470.0" dy="15.6">Якщо конструктор завершується аварійно, компілятор сам звільняє сиру пам'ять, запобігаючи витоку.</tspan></text>
</svg>