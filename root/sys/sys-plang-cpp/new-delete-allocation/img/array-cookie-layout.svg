<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розкладка пам'яті масиву й небезпека непарного delete</text>
<rect x="40.0" y="20.0" width="860.0" height="40.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="45.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Розкладка масиву new Widget[4] у динамічній пам'яті (Itanium ABI)</tspan></text>
<rect x="30.0" y="75.0" width="150.0" height="40.0" rx="6" fill="#e8f4fd" stroke="#1976d2" stroke-width="1.5"/><text x="105.0" y="91.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0d47a1" text-anchor="middle"><tspan x="105.0" dy="0.0">p_raw (початок)</tspan><tspan x="105.0" dy="14.3">від operator new[]</tspan></text>
<rect x="200.0" y="75.0" width="160.0" height="40.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="280.0" y="91.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">p_user = p_raw + 8</tspan><tspan x="280.0" dy="14.3">повертається клієнту</tspan></text>
<line x1="105.0" y1="115.0" x2="105.0" y2="155.0" stroke="#1976d2" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="240.0" y1="115.0" x2="240.0" y2="155.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="100.0" y="160.0" width="740.0" height="65.0" rx="6" fill="#fafafa" stroke="#333333" stroke-width="1.5"/>
<rect x="100.0" y="160.0" width="140.0" height="65.0" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="2.0"/>
<text x="170.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e65100" text-anchor="middle" font-weight="700">Cookie (8 байтів)</text>
<text x="170.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e65100" text-anchor="middle">Лічильник: N = 4</text>
<rect x="240.0" y="160.0" width="150.0" height="65.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="315.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Widget[0]</text>
<text x="315.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">sizeof(Widget)</text>
<rect x="390.0" y="160.0" width="150.0" height="65.0" rx="6" fill="#e8f4fd" stroke="#27ae60" stroke-width="1.5"/>
<text x="465.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Widget[1]</text>
<text x="465.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">sizeof(Widget)</text>
<rect x="540.0" y="160.0" width="150.0" height="65.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="615.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Widget[2]</text>
<text x="615.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">sizeof(Widget)</text>
<rect x="690.0" y="160.0" width="150.0" height="65.0" rx="6" fill="#e8f4fd" stroke="#27ae60" stroke-width="1.5"/>
<text x="765.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Widget[3]</text>
<text x="765.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">sizeof(Widget)</text>
<rect x="40.0" y="245.0" width="410.0" height="105.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="245.0" y="279.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="245.0" dy="0.0">Правильно: delete[] p_user</tspan><tspan x="245.0" dy="14.3">1. Зчитує N = 4 із позиції (p_user - 8)</tspan><tspan x="245.0" dy="14.3">2. Викликає Widget::~Widget() для [3], [2], [1], [0]</tspan><tspan x="245.0" dy="14.3">3. Передає адресу p_raw у operator delete[]</tspan></text>
<rect x="470.0" y="245.0" width="430.0" height="105.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="685.0" y="281.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">Катастрофа: непарний delete p_user (UB!)</tspan><tspan x="685.0" dy="13.0">✖ Викликає деструктор ЛИШЕ для Widget[0]</tspan><tspan x="685.0" dy="13.0">✖ Деструктори Widget[1..3] НЕ викликаються (витік ресурсів!)</tspan><tspan x="685.0" dy="13.0">✖ Передає p_user замість p_raw у heap allocator -&gt; крах купи!</tspan></text>
<rect x="40.0" y="370.0" width="860.0" height="85.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="401.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Array Cookie зберігає кількість елементів для коректного виклику всіх деструкторів.</tspan><tspan x="470.0" dy="15.6">Зсув покажчика робить виклики new[] і delete несумісними на рівні пам'яті:</tspan><tspan x="470.0" dy="15.6">алокатор отримує невірну адресу блоку, що призводить до негайного пошкодження купи.</tspan></text>
</svg>