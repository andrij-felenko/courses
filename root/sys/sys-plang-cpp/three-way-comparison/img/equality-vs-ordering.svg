<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="1020.0" height="460.0" rx="10" fill="#fafbfc" stroke="#333333" stroke-width="1.2"/>
<text x="520.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому перевірка рівності (==) відділена від тричленного порядку (&lt;=&gt;)</text>
<rect x="40.0" y="68.0" width="460.0" height="380.0" rx="8" fill="#eef7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="270.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">operator== (Тест на збіг)</text>
<text x="270.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Питання: чи ідентичні два об'єкти? (true / false)</text>
<line x1="60.0" y1="136.0" x2="480.0" y2="136.0" stroke="#27ae60" stroke-width="1.2"/>
<rect x="60.0" y="150.0" width="420.0" height="56.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.2"/>
<text x="80.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Крок 1: Швидка перевірка розміру / ємності</text>
<text x="80.0" y="192.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">if (size() != other.size()) return false;  // O(1)</text>
<line x1="270.0" y1="206.0" x2="270.0" y2="226.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="226.0" width="420.0" height="56.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.2"/>
<text x="80.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Крок 2: Порівняння буфера (memcmp / SIMD)</text>
<text x="80.0" y="268.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">return memcmp(data(), other.data(), size()) == 0;</text>
<rect x="60.0" y="305.0" width="420.0" height="125.0" rx="6" fill="#e3f2e3" stroke="#27ae60" stroke-width="1.0"/>
<text x="80.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Переваги для std::string / контейнерів:</text>
<text x="80.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Якщо рядки різної довжини — миттєвий вихід O(1)</text>
<text x="80.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Не потрібно читати байти з пам'яті в купі (heap)</text>
<text x="80.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Немає навантаження на L1/L2 кеш процесора</text>
<text x="80.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Векторизація SIMD для блоків по 16/32 байти</text>
<rect x="540.0" y="68.0" width="460.0" height="380.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="770.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">operator&lt;=&gt; (Лексикографічний порядок)</text>
<text x="770.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Питання: хто стоїть раніше в алфавіті? (less/equal/greater)</text>
<line x1="560.0" y1="136.0" x2="980.0" y2="136.0" stroke="#c0392b" stroke-width="1.2"/>
<rect x="560.0" y="150.0" width="420.0" height="56.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.2"/>
<text x="580.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Крок 1: Побайтне порівняння префікса</text>
<text x="580.0" y="192.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">auto cmp = memcmp(data, o.data, min_len); // O(N)</text>
<line x1="770.0" y1="206.0" x2="770.0" y2="226.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560.0" y="226.0" width="420.0" height="56.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.2"/>
<text x="580.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Крок 2: Перевірка різниці префіксів</text>
<text x="580.0" y="268.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">if (cmp != 0) return cmp &lt;=&gt; 0;</text>
<line x1="770.0" y1="282.0" x2="770.0" y2="302.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560.0" y="302.0" width="420.0" height="56.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.2"/>
<text x="580.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Крок 3: Тайбрейкер за довжиною</text>
<text x="580.0" y="344.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">return size() &lt;=&gt; other.size();</text>
<rect x="560.0" y="375.0" width="420.0" height="55.0" rx="6" fill="#fbe6e6" stroke="#c0392b" stroke-width="1.0"/>
<text x="580.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Чому не можна одразу дивитися на size():</text>
<text x="580.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">&quot;b&quot; довжини 1 стоїть ПІЗНІШЕ за &quot;aaaaa&quot; довжини 5!</text>
</svg>