<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="980.0" height="460.0" rx="10" fill="#fafbfc" stroke="#333333" stroke-width="1.2"/>
<text x="500.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія категорій порівняння C++20 у &lt;compare&gt;</text>
<rect x="50.0" y="75.0" width="270.0" height="350.0" rx="8" fill="#eef7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="185.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">std::strong_ordering</text>
<text x="185.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Сильний порядок (повний)</text>
<line x1="65.0" y1="140.0" x2="305.0" y2="140.0" stroke="#27ae60" stroke-width="1.2"/>
<text x="70.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Значення:</text>
<text x="80.0" y="187.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="start">• less</text>
<text x="80.0" y="207.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="start">• equal / equivalent</text>
<text x="80.0" y="227.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="start">• greater</text>
<text x="70.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Головна властивість:</text>
<text x="70.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Взаємозамінність:</text>
<text x="70.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">якщо a == b, то f(a) == f(b)</text>
<text x="70.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">для будь-якої спостережної f</text>
<text x="70.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Приклади типів:</text>
<text x="70.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">int, std::string, покажчики,</text>
<text x="70.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">почленні структури значень</text>
<rect x="365.0" y="75.0" width="270.0" height="350.0" rx="8" fill="#f0f4ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="500.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">std::weak_ordering</text>
<text x="500.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Слабкий порядок</text>
<line x1="380.0" y1="140.0" x2="620.0" y2="140.0" stroke="#2457d6" stroke-width="1.2"/>
<text x="385.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Значення:</text>
<text x="395.0" y="187.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="start">• less</text>
<text x="395.0" y="207.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="start">• equivalent</text>
<text x="395.0" y="227.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="start">• greater</text>
<text x="385.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Головна властивість:</text>
<text x="385.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Еквівалентність без рівності:</text>
<text x="385.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">a еквівалентне b, але</text>
<text x="385.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">стан f(a) і f(b) може різнитися</text>
<text x="385.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Приклади типів:</text>
<text x="385.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Регістронезалежні рядки,</text>
<text x="385.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">об'єкти з кешем/неключовими полями</text>
<rect x="680.0" y="75.0" width="270.0" height="350.0" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="815.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">std::partial_ordering</text>
<text x="815.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Частковий порядок</text>
<line x1="695.0" y1="140.0" x2="935.0" y2="140.0" stroke="#c0392b" stroke-width="1.2"/>
<text x="700.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Значення:</text>
<text x="710.0" y="187.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="start">• less</text>
<text x="710.0" y="207.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="start">• equivalent</text>
<text x="710.0" y="227.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#1a1a1a" text-anchor="start">• greater</text>
<text x="710.0" y="247.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">• unordered</text>
<text x="700.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Головна властивість:</text>
<text x="700.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Незрівнюваність (unordered):</text>
<text x="700.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">деякі значення не можна</text>
<text x="700.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">розташувати на одній осі</text>
<text x="700.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Приклади типів:</text>
<text x="700.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">float, double (через NaN),</text>
<text x="700.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">вектори в просторі, множини</text>
<line x1="320.0" y1="200.0" x2="365.0" y2="200.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="323.0" y="175.0" width="40.0" height="20.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
