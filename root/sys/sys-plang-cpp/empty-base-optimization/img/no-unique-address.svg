<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розкладка пам'яті з атрибутом [[no_unique_address]]</text>
<text x="480.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">C++20 [[no_unique_address]]: чиста композиція без спадкування</text>
<text x="480.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">struct ModernHolder { int* ptr; [[no_unique_address]] Deleter d; };</text>
<rect x="180.0" y="115.0" width="600.0" height="110.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="480.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Адреса 0x1000 (зсув 0 байтів)</text>
<rect x="244.8" y="165.1" width="190.4" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="340.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">int* ptr</tspan><tspan x="340.0" dy="16.9">корисне поле (8 байтів)</tspan></text>
<rect x="491.4" y="165.1" width="257.1" height="49.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Deleter d</tspan><tspan x="620.0" dy="16.9">[[no_unique_address]] (0 байтів)</tspan></text>
<rect x="45.0" y="255.0" width="270.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="291.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Композиція замість спадкування</tspan><tspan x="180.0" dy="15.6">Немає ризику зрізання типів (slicing)</tspan><tspan x="180.0" dy="15.6">і витоку внутрішнього інтерфейсу</tspan></text>
<rect x="345.0" y="255.0" width="270.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="291.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Працює з типами final</tspan><tspan x="480.0" dy="15.6">EBO не може спадкувати final-класи,</tspan><tspan x="480.0" dy="15.6">а атрибут члена підтримує їх вільно</tspan></text>
<rect x="645.0" y="255.0" width="270.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="291.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Краща підтримка шаблонів</tspan><tspan x="780.0" dy="15.6">Працює з lambdas, лямбда-делітерами</tspan><tspan x="780.0" dy="15.6">й stateless алокаторами прямо в полях</tspan></text>
<text x="480.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Підсумок: sizeof(ModernHolder) = 8 байтів (розмір 1 покажчика)</text>
</svg>