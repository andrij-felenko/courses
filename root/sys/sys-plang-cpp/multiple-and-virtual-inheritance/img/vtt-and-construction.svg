<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Таблиця віртуальних таблиць (VTT) та етапи конструювання</text>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#8e44ad" text-anchor="middle" font-weight="700">Таблиця віртуальних таблиць (VTT) під час конструювання</text>
<rect x="40.0" y="63.4" width="340.0" height="63.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="83.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">1. Конструювання DeviceNode</tspan><tspan x="210.0" dy="15.6">Найбільш похідний клас (AudioDuplex)</tspan><tspan x="210.0" dy="15.6">викликає конструктор віртуальної бази.</tspan></text>
<rect x="40.0" y="165.6" width="340.0" height="78.8" rx="6" fill="#e8f4fd" stroke="#2980b9" stroke-width="1.5"/><text x="210.0" y="185.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">2. Конструювання AudioInput</tspan><tspan x="210.0" dy="15.6">AudioInput конструюється як підоб'єкт.</tspan><tspan x="210.0" dy="15.6">Йому потрібен vptr для його методів,</tspan><tspan x="210.0" dy="15.6">але зсув vbase має вести до AudioDuplex.</tspan></text>
<rect x="40.0" y="283.4" width="340.0" height="63.2" rx="6" fill="#eaeded" stroke="#566573" stroke-width="1.5"/><text x="210.0" y="303.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">3. Фіналізація AudioDuplex</tspan><tspan x="210.0" dy="15.6">Встановлюється повна vtable</tspan><tspan x="210.0" dy="15.6">для AudioDuplex з усіма перевизначеннями.</tspan></text>
<line x1="210.0" y1="135.0" x2="210.0" y2="165.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="210.0" y1="245.0" x2="210.0" y2="275.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="755.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура VTT (Virtual Table Table) для AudioDuplex</text>
<rect x="550.0" y="80.0" width="410.0" height="48.0" rx="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/>
<text x="755.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6c3483" text-anchor="middle" font-weight="700">VTT[0]: Головна vtable AudioDuplex</text>
<rect x="550.0" y="128.0" width="410.0" height="48.0" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="2.0"/>
<text x="755.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1b4f72" text-anchor="middle" font-weight="700">VTT[1]: Construction vtable для AudioInput-в-AudioDuplex</text>
<rect x="550.0" y="176.0" width="410.0" height="48.0" rx="6" fill="#fef5e7" stroke="#d35400" stroke-width="2.0"/>
<text x="755.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7e5109" text-anchor="middle" font-weight="700">VTT[2]: Construction vtable для AudioOutput-в-AudioDuplex</text>
<rect x="550.0" y="224.0" width="410.0" height="48.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="755.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">VTT[3]: Вторинні таблиці віртуальних баз</text>
<line x1="390.0" y1="205.0" x2="540.0" y2="152.0" stroke="#2980b9" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="465.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2980b9" text-anchor="middle" font-weight="700">передає VTT[1]</text>
<rect x="40.0" y="380.6" width="920.0" height="78.8" rx="6" fill="#fdfefe" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="400.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Навіщо потрібен VTT:</tspan><tspan x="500.0" dy="15.6">Під час роботи конструктора AudioInput заборонено викликати віртуальні методи ще не створеного AudioDuplex,</tspan><tspan x="500.0" dy="15.6">але водночас зміщення до віртуальної бази DeviceNode має відповідати геометрії кінцевого AudioDuplex.</tspan><tspan x="500.0" dy="15.6">Construction vtable з масиву VTT задовольняє обидві вимоги одночасно.</tspan></text>
</svg>