<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розвилка на final_suspend</text>
<text x="590.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">тіло дійшло кінця: co_await promise.final_suspend()</text>
<rect x="430.0" y="72.0" width="320.0" height="46.0" rx="6" fill="#eef2fb" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">кінець тіла корутини</tspan></text>
<line x1="560.0" y1="118.0" x2="340.0" y2="166.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="620.0" y1="118.0" x2="840.0" y2="166.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="170.0" width="440.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="340.0" y="199.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">повертає suspend_never</tspan></text>
<rect x="120.0" y="238.0" width="440.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="340.0" y="272.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">кадр знищує сам себе</tspan><tspan x="340.0" dy="15.6">handle одразу висячий</tspan><tspan x="340.0" dy="15.6">результат із promise вже не прочитати</tspan></text>
<rect x="620.0" y="170.0" width="440.0" height="50.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="840.0" y="199.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">повертає suspend_always</tspan></text>
<rect x="620.0" y="238.0" width="440.0" height="92.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="840.0" y="272.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">кадр лишається живим</tspan><tspan x="840.0" dy="15.6">значення й виняток у promise доступні</tspan><tspan x="840.0" dy="15.6">хтось мусить покликати h.destroy()</tspan></text>
<text x="590.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">саме тут вирішується, хто володіє кадром — і саме тут беруться витоки</text>
</svg>