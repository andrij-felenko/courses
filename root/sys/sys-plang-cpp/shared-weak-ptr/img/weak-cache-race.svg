<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому видаляч не має права стирати запис наосліп</text>
<text x="24.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">потік A</text>
<text x="24.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">мапа кешу</text>
<text x="24.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">потік B</text>
<line x1="365.0" y1="52.0" x2="890.0" y2="52.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 5"/>
<text x="627.5" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">вікно: об'єкта вже нема, запис іще є</text>
<rect x="185.0" y="70.0" width="165.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="267.5" y="98.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="267.5" dy="0.0">останній власник пішов</tspan><tspan x="267.5" dy="14.3">сильних → 0, ~Texture()</tspan></text>
<rect x="725.0" y="70.0" width="165.0" height="64.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="807.5" y="99.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="807.5" dy="0.0">видаляч бере замок:</tspan><tspan x="807.5" dy="11.7">запис не expired → не чіпає</tspan></text>
<rect x="365.0" y="180.0" width="165.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="447.5" y="208.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="447.5" dy="0.0">weak є, об'єкта нема:</tspan><tspan x="447.5" dy="14.3">expired() == true</tspan></text>
<rect x="545.0" y="180.0" width="165.0" height="64.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="627.5" y="208.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="627.5" dy="0.0">запис перезаписано</tspan><tspan x="627.5" dy="14.3">на новий об'єкт</tspan></text>
<rect x="545.0" y="290.0" width="165.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="627.5" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="627.5" dy="0.0">get(): lock() дає порожньо</tspan><tspan x="627.5" dy="13.0">→ вантажить новий</tspan></text>
<text x="24.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Без перевірки expired() видаляч A стер би живий запис B — і на один ключ у програмі було б два об'єкти.</text>
</svg>