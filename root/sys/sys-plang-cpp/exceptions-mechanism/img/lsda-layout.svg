<rect x="420.0" y="202.0" width="700.0" height="112.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="770.0" y="245.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">на кожен запис — чотири числа:</tspan><tspan x="770.0" dy="16.9">початок ділянки · довжина · landing pad (0 — нічого не робити)</tspan><tspan x="770.0" dy="16.9">зсув у таблицю дій, зсунутий на 1 (0 — самі деструктори)</tspan></text>
<line x1="300.0" y1="258.0" x2="420.0" y2="258.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5 4"/>
