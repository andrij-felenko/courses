<rect x="420.0" y="334.0" width="700.0" height="112.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="770.0" y="377.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">запис — два sleb128, записи зчеплені в список:</tspan><tspan x="770.0" dy="16.9">ttypeIndex ( &gt;0 — номер типу, 0 — прибирання, &lt;0 — специфікація )</tspan><tspan x="770.0" dy="16.9">зсув до наступного запису ( 0 — кінець списку )</tspan></text>
<line x1="300.0" y1="390.0" x2="420.0" y2="390.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5 4"/>
