<rect x="420.0" y="466.0" width="700.0" height="112.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="770.0" y="509.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">покажчики на std::type_info, індексовані НАЗАД від кінця:</tspan><tspan x="770.0" dy="16.9">номер 1 — останній запис, номер 2 — передостанній</tspan><tspan x="770.0" dy="16.9">запис зі значенням 0 означає catch (...)</tspan></text>
<line x1="300.0" y1="522.0" x2="420.0" y2="522.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5 4"/>
