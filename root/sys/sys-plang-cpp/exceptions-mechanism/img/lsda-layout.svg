<rect x="420.0" y="70.0" width="700.0" height="112.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="770.0" y="113.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">LPStart-кодування (1 байт)  ·  сам LPStart, якщо не пропущено</tspan><tspan x="770.0" dy="16.9">TType-кодування (1 байт)  ·  зсув до таблиці типів (uleb128)</tspan><tspan x="770.0" dy="16.9">кодування точок виклику (1 байт)  ·  довжина їхньої таблиці</tspan></text>
<line x1="300.0" y1="126.0" x2="420.0" y2="126.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5 4"/>
