<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відновлення проти завершення</text>
<text x="300.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відновлення: PL/I, Mesa</text>
<rect x="130.0" y="84.0" width="340.0" height="58.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="109.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">обробник вирішує:</tspan><tspan x="300.0" dy="15.6">«полагодив — працюй далі»</tspan></text>
<rect x="130.0" y="164.0" width="340.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="197.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">проміжний кадр — живий</tspan></text>
<rect x="130.0" y="244.0" width="340.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="300.0" y="269.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">SIGNAL Err</tspan><tspan x="300.0" dy="15.6">наступний рядок ВИКОНАЄТЬСЯ</tspan></text>
<line x1="112.0" y1="250.0" x2="112.0" y2="148.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="78.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">сигнал</text>
<line x1="496.0" y1="148.0" x2="496.0" y2="250.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="534.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">resume</text>
<text x="300.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="300.0" dy="0.0">точка кидка мусить бути готова продовжити роботу</tspan><tspan x="300.0" dy="14.3">і не може вважати передумови перевіреними</tspan></text>
<line x1="600.0" y1="40.0" x2="600.0" y2="430.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 5"/>
<text x="880.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Завершення: CLU, Ada, C++</text>
<rect x="710.0" y="84.0" width="340.0" height="58.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="880.0" y="109.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">catch (Err&amp;)</tspan><tspan x="880.0" dy="15.6">керування лишається тут</tspan></text>
<rect x="710.0" y="164.0" width="340.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="880.0" y="197.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">проміжний кадр — знищено</tspan></text>
<rect x="710.0" y="244.0" width="340.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="880.0" y="269.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">throw Err{}</tspan><tspan x="880.0" dy="15.6">наступний рядок НЕДОСЯЖНИЙ</tspan></text>
<line x1="692.0" y1="250.0" x2="692.0" y2="148.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="658.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">кидок</text>
<text x="880.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="880.0" dy="0.0">дороги назад немає — кадри вже розібрано,</tspan><tspan x="880.0" dy="14.3">тож після throw передумови гарантовано не діють</tspan></text>
<text x="600.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">суперечка 1989–1990 років була саме про цю стрілку вниз</text>
</svg>