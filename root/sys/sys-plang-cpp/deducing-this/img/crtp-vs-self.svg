<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто називає похідний тип</text>
<text x="300.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">CRTP: похідний тип називають руками</text>
<text x="820.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Явний параметр: Self виводиться</text>
<rect x="40.0" y="86.0" width="520.0" height="224.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="56.0" y="128.4" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start">template &lt;class D&gt;</text><text x="56.0" y="146.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start">struct Printable {</text><text x="56.0" y="165.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start">  void print() const {</text><text x="56.0" y="183.6" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start">    std::cout &lt;&lt;</text><text x="56.0" y="202.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start">      static_cast&lt;const D&amp;&gt;(*this).text();</text><text x="56.0" y="220.4" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start">  }</text><text x="56.0" y="238.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start">};</text><text x="56.0" y="257.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start"></text><text x="56.0" y="275.6" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start">struct Note : Printable&lt;Note&gt; { ... };</text>
<rect x="580.0" y="86.0" width="500.0" height="224.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/><text x="596.0" y="128.4" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start">struct Printable {</text><text x="596.0" y="146.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start">  void print(this const auto&amp; self) {</text><text x="596.0" y="165.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start">    std::cout &lt;&lt; self.text();</text><text x="596.0" y="183.6" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start">  }</text><text x="596.0" y="202.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start">};</text><text x="596.0" y="220.4" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start"></text><text x="596.0" y="238.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start"></text><text x="596.0" y="257.2" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start"></text><text x="596.0" y="275.6" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start">struct Note : Printable { ... };</text>
<text x="56.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">· база — шаблон: Printable&lt;Note&gt; і Printable&lt;Tag&gt;</text>
<text x="56.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">· різні типи, спільної бази немає</text>
<text x="56.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">· автор бази пише приведення сам</text>
<text x="596.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">· база — один звичайний тип для всіх нащадків</text>
<text x="596.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">· Self = Note постає з типу виразу виклику</text>
<text x="596.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">· приведення робить виведення аргументів</text>
<rect x="230.0" y="442.0" width="660.0" height="54.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="560.0" y="464.4" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="middle">Note n;  n.print();  — обидва варіанти статичні:</text><text x="560.0" y="481.6" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#1a1a1a" text-anchor="middle">функцію обирає тип виразу, а не таблиця віртуальних методів</text>
</svg>