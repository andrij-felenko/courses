<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель пам'яті C++11: синхронізація між потоками через acquire-release</text>
<text x="460.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Міжпотокова синхронізація через std::atomic і впорядкування пам'яті</text>
<rect x="55.0" y="75.0" width="330.0" height="260.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="220.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Потік 1: Producer</text>
<rect x="139.2" y="117.1" width="161.6" height="49.8" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">1. Звичайний запис даних:</tspan><tspan x="220.0" dy="13.7">data = 42;</tspan><tspan x="220.0" dy="13.7">(non-atomic payload)</tspan></text>
<line x1="220.0" y1="175.0" x2="220.0" y2="205.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="300.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">sequenced-before</text>
<rect x="131.4" y="221.0" width="177.3" height="48.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/><text x="220.0" y="235.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">2. Атомарний реліз прапорця:</tspan><tspan x="220.0" dy="13.0">ready.store(true,</tspan><tspan x="220.0" dy="13.0">  std::memory_order_release);</tspan></text>
<rect x="535.0" y="75.0" width="330.0" height="260.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="700.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Потік 2: Consumer</text>
<rect x="608.5" y="118.0" width="183.0" height="48.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="132.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">3. Атомарне захоплення:</tspan><tspan x="700.0" dy="13.0">while (!ready.load(</tspan><tspan x="700.0" dy="13.0">  std::memory_order_acquire));</tspan></text>
<line x1="700.0" y1="185.0" x2="700.0" y2="215.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="780.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">sequenced-before</text>
<rect x="610.2" y="230.1" width="179.6" height="49.8" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">4. Безпечне читання даних:</tspan><tspan x="700.0" dy="13.7">assert(data == 42);</tspan><tspan x="700.0" dy="13.7">(гарантовано без data race!)</tspan></text>
<rect x="377.2" y="168.1" width="165.6" height="53.8" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/><text x="460.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">synchronizes-with</tspan><tspan x="460.0" dy="13.7">міжпотокова синхронізація</tspan><tspan x="460.0" dy="13.7">(реліз-аквайр бар'єр)</tspan></text>
<line x1="385.0" y1="245.0" x2="375.0" y2="215.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="545.0" y1="175.0" x2="535.0" y2="142.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="360.0" width="800.0" height="48.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="460.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Транзитивне відношення пам'яті: (1) happens-before (4)</text>
<text x="460.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Компілятор і процесор не мають права переставити інструкції через бар'єри синхронізації</text>
</svg>