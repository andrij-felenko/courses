<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трамплін зворотного виклику (Callback Trampoline)</text>
<text x="480.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трамплін зворотного виклику: зв'язування C function pointer та C++ контексту</text>
<rect x="67.9" y="127.8" width="184.2" height="94.4" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">C Джерело подій</tspan><tspan x="160.0" dy="15.6">on_event(cb, user_data)</tspan><tspan x="160.0" dy="15.6">Збережено: вказівник</tspan><tspan x="160.0" dy="15.6">на функцію + void* ptr</tspan><tspan x="160.0" dy="15.6">Спрацювання: cb(id, ptr)</tspan></text>
<rect x="341.5" y="123.8" width="277.1" height="102.5" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="143.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Статичний трамплін (C++)</tspan><tspan x="480.0" dy="14.3">static void trampoline(int id, void* u) {</tspan><tspan x="480.0" dy="14.3">  auto* obj = static_cast&lt;Listener*&gt;(u);</tspan><tspan x="480.0" dy="14.3">  obj-&gt;handle(id);</tspan><tspan x="480.0" dy="14.3">}</tspan><tspan x="480.0" dy="14.3">Вільна функція без захоплення</tspan></text>
<rect x="699.1" y="123.8" width="201.8" height="102.5" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="143.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">C++ Об'єкт / Замикання</tspan><tspan x="800.0" dy="14.3">class Listener {</tspan><tspan x="800.0" dy="14.3">  std::vector&lt;Event&gt; log;</tspan><tspan x="800.0" dy="14.3">  void handle(int id) { ... }</tspan><tspan x="800.0" dy="14.3">};</tspan><tspan x="800.0" dy="14.3">Повноцінний стан і методи</tspan></text>
<line x1="257.1" y1="150.0" x2="336.5" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="623.5" y1="150.0" x2="694.1" y2="150.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="320.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">cb(id, user_data)</text>
<text x="640.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">obj-&gt;handle(id)</text>
<text x="480.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">Покажчик на метод класу C++ або лямбда із захопленням не відповідають сигнатурі C function pointer</text>
<text x="480.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Параметр void* user_data передає покажчик на екземпляр, який трамплін безпечно відновлює через static_cast</text>
</svg>