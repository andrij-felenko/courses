<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 412" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="412" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Устрій сильної гарантії: спершу все ризиковане, потім безризикова фіксація</text>
<text x="490.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">лінія фіксації</text>
<line x1="490.0" y1="66.0" x2="490.0" y2="352.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="7 5"/>
<text x="250.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">до неї — працюємо збоку</text>
<text x="730.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">після неї — робимо видимим</text>
<rect x="50.0" y="104.0" width="400.0" height="108.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">усе, що здатне кинути:</tspan><tspan x="250.0" dy="16.2">виділення пам'яті, копії рядків,</tspan><tspan x="250.0" dy="16.2">побудова нового вмісту —</tspan><tspan x="250.0" dy="16.2">у тимчасовому об'єкті збоку</tspan></text>
<rect x="530.0" y="104.0" width="400.0" height="108.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">усе, що кинути не здатне:</tspan><tspan x="730.0" dy="16.2">обмін вказівниками, присвоєння чисел,</tspan><tspan x="730.0" dy="16.2">swap, помічений noexcept —</tspan><tspan x="730.0" dy="16.2">над справжнім об'єктом</tspan></text>
<line x1="250.0" y1="216.0" x2="250.0" y2="246.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="730.0" y1="216.0" x2="730.0" y2="246.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="248.0" width="400.0" height="86.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="279.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">виняток тут: видимий об'єкт</tspan><tspan x="250.0" dy="16.2">не змінювався ані на біт,</tspan><tspan x="250.0" dy="16.2">відкочувати нічого</tspan></text>
<rect x="530.0" y="248.0" width="400.0" height="86.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="730.0" y="279.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">виняток тут неможливий за побудовою —</tspan><tspan x="730.0" dy="16.2">інакше об'єкт застряг би</tspan><tspan x="730.0" dy="16.2">між двома станами</tspan></text>
<text x="490.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">сильна гарантія існує рівно там, де фіксацію вдається скласти з операцій, які не кидають</text>
</svg>