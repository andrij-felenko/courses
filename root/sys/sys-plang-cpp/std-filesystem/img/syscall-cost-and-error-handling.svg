<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двокамерна обробка помилок та продуктивність</text>
<text x="470.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двокамерний механізм обробки помилок та кешування lstat/stat</text>
<text x="50.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">1. Двокамерний API операцій (No-throw vs Throwing)</text>
<rect x="50.0" y="95.0" width="410.0" height="140.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="133.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Гілка A: Виклики з винятками</tspan><tspan x="255.0" dy="14.3">auto sz = fs::file_size(path);</tspan><tspan x="255.0" dy="14.3">──&gt; При помильні (ENOENT/EACCES):</tspan><tspan x="255.0" dy="14.3">    throw std::filesystem_error(</tspan><tspan x="255.0" dy="14.3">        &quot;file_size: no such file&quot;, path, ec);</tspan><tspan x="255.0" dy="14.3">• Накладні витрати: алокація винятку, unwind стеку</tspan></text>
<rect x="480.0" y="95.0" width="410.0" height="140.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="685.0" y="140.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Гілка B: Виклики з std::error_code (No-throw)</tspan><tspan x="685.0" dy="14.3">std::error_code ec;</tspan><tspan x="685.0" dy="14.3">auto sz = fs::file_size(path, ec);</tspan><tspan x="685.0" dy="14.3">if (ec) { /* Обробка без винятків */ }</tspan><tspan x="685.0" dy="14.3">• Накладні витрати: 0 (запис значення еквивалента errno в ec)</tspan></text>
<text x="50.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">2. Продуктивність: Кешування атрибутів у directory_entry проти прямого lstat()</text>
<rect x="50.0" y="285.0" width="410.0" height="110.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="255.0" y="322.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Прямий системний виклик (Висока ціна)</tspan><tspan x="255.0" dy="14.3">if (fs::exists(p) &amp;&amp; fs::is_regular_file(p))</tspan><tspan x="255.0" dy="14.3">  auto sz = fs::file_size(p);</tspan><tspan x="255.0" dy="14.3">──&gt; 3 окремі системні виклики stat() / TOCTOU гонка!</tspan></text>
<rect x="480.0" y="285.0" width="410.0" height="110.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="685.0" y="315.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Оптимальний обхід через directory_entry</tspan><tspan x="685.0" dy="14.3">for (const auto&amp; entry : fs::directory_iterator(dir))</tspan><tspan x="685.0" dy="14.3">  if (entry.is_regular_file())</tspan><tspan x="685.0" dy="14.3">    auto sz = entry.file_size(); // Взяття з кешу d_type/stat</tspan><tspan x="685.0" dy="14.3">──&gt; 0 додаткових системних викликів!</tspan></text>
<text x="470.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Використання методів directory_entry зменшує кількість системних викликів stat() у 3-5 разів</text>
</svg>