<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема атомарного очікування на умовній змінній</text>
<text x="430.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0b0c0c" text-anchor="middle" font-weight="700">Послідовність виконання std::condition_variable::wait(lock, pred)</text>
<rect x="34.8" y="76.6" width="190.4" height="66.8" rx="6" fill="#eef6fc" stroke="#1d70b8" stroke-width="1.5"/><text x="130.0" y="97.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">1. Захоплення м'ютекса</tspan><tspan x="130.0" dy="16.9">lock.lock()</tspan><tspan x="130.0" dy="16.9">Потік володіє м'ютексом</tspan></text>
<rect x="267.4" y="76.6" width="205.2" height="66.8" rx="6" fill="#eef6fc" stroke="#1d70b8" stroke-width="1.5"/><text x="370.0" y="97.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">2. Перевірка предиката</tspan><tspan x="370.0" dy="16.9">if (pred()) return;</tspan><tspan x="370.0" dy="16.9">Предикат хибний → чекаємо</tspan></text>
<rect x="525.0" y="85.0" width="170.0" height="49.9" rx="6" fill="#fdf0ed" stroke="#d4351c" stroke-width="1.5"/><text x="610.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">3. Атомарний перехід</tspan><tspan x="610.0" dy="16.9">Основа механізму CV</tspan></text>
<line x1="225.2" y1="110.0" x2="267.4" y2="110.0" stroke="#1d70b8" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="472.6" y1="110.0" x2="525.0" y2="110.0" stroke="#1d70b8" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="525.0" y="226.6" width="170.0" height="66.8" rx="6" fill="#f3f2f1" stroke="#505a5f" stroke-width="1.5"/><text x="610.0" y="247.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Атомарно:</tspan><tspan x="610.0" dy="16.9">а) Відпускає м'ютекс</tspan><tspan x="610.0" dy="16.9">б) Стає в чергу ОС</tspan></text>
<rect x="260.0" y="226.6" width="220.1" height="66.8" rx="6" fill="#eaf7ee" stroke="#28a745" stroke-width="1.5"/><text x="370.0" y="247.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">4. Сигнал &amp; Пробудження</tspan><tspan x="370.0" dy="16.9">notify_one() / notify_all()</tspan><tspan x="370.0" dy="16.9">Потік виходить зі сну</tspan></text>
<rect x="23.7" y="226.6" width="212.7" height="66.8" rx="6" fill="#eef6fc" stroke="#1d70b8" stroke-width="1.5"/><text x="130.0" y="247.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">5. Повторне захоплення</tspan><tspan x="130.0" dy="16.9">lock.lock() всередині wait</tspan><tspan x="130.0" dy="16.9">Знову перевірка pred()!</tspan></text>
