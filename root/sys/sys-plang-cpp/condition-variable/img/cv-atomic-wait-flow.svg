<text x="210.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d70b8" text-anchor="middle" font-weight="700">Цикл while(!pred)</text>
<text x="430.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Атомарність виключно запобігає втраті сигналу (lost wakeup race condition)</text>
