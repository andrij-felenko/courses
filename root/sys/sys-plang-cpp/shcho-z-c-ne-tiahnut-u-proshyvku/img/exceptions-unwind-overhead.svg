<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння розгортання винятків та передачі помилок через значення</text>
<rect x="76.7" y="30.5" width="386.7" height="39.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="55.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Механізм винятків (Itanium / ARM EHABI)</tspan></text>
<rect x="109.5" y="90.6" width="321.0" height="78.8" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Таблиці Flash (.ARM.exidx / .ARM.extab):</tspan><tspan x="270.0" dy="15.6">• Описи діапазонів адрес функцій</tspan><tspan x="270.0" dy="15.6">• Інструкції відновлення регістрів</tspan><tspan x="270.0" dy="15.6">• Вказівники на Landing Pads (+15-30% Flash)</tspan></text>
<rect x="92.4" y="190.6" width="355.2" height="78.8" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="210.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Виклик throw Error{}:</tspan><tspan x="270.0" dy="15.6">1. __cxa_allocate_exception (динамічна пам'ять)</tspan><tspan x="270.0" dy="15.6">2. Personality Routine сканує таблиці розгортання</tspan><tspan x="270.0" dy="15.6">3. Відновлення регістрів стек-фрейм за фреймом</tspan></text>
<rect x="96.3" y="308.4" width="347.4" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="328.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Результат у прошивці:</tspan><tspan x="270.0" dy="15.6">• Недетермінована затримка (500–5000 тактів)</tspan><tspan x="270.0" dy="15.6">• Роздутий двійковий файл через таблиці</tspan></text>
<line x1="270.0" y1="175.0" x2="270.0" y2="195.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="270.0" y1="280.0" x2="270.0" y2="305.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="30.0" x2="530.0" y2="390.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="573.4" y="30.5" width="433.2" height="39.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="55.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Значення результату (std::expected / статус)</tspan></text>
<rect x="615.8" y="90.6" width="348.3" height="78.8" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Розміщення в регістрах або на стеку:</tspan><tspan x="790.0" dy="15.6">• Об'єднання union { T val; E err; } + bool flag</tspan><tspan x="790.0" dy="15.6">• Без допоміжних таблиць метаданих у Flash</tspan><tspan x="790.0" dy="15.6">• Нульові накладні витрати на рівні бінарника</tspan></text>
<rect x="629.5" y="190.6" width="321.0" height="78.8" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="210.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Повернення значення:</tspan><tspan x="790.0" dy="15.6">1. Запис коду/значення в регістри R0-R1</tspan><tspan x="790.0" dy="15.6">2. Пряма інструкція процесора BX LR</tspan><tspan x="790.0" dy="15.6">3. Умовний перехід за прапорцем (CBZ / CBNZ)</tspan></text>
<rect x="605.2" y="308.4" width="369.7" height="63.2" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="328.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Результат у прошивці:</tspan><tspan x="790.0" dy="15.6">• Жорсткий детермінізм (1–3 такти процесора)</tspan><tspan x="790.0" dy="15.6">• Компактний машинний код без схованих викликів</tspan></text>
<line x1="790.0" y1="175.0" x2="790.0" y2="195.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="790.0" y1="280.0" x2="790.0" y2="305.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>