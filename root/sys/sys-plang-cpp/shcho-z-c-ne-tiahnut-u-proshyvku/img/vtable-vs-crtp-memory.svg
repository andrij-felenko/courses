<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розкладка в пам'яті та механізм виклику: vtable проти CRTP</text>
<rect x="81.3" y="30.5" width="377.4" height="39.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="55.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Динамічний поліморфізм (vptr + vtable)</tspan></text>
<rect x="147.1" y="106.2" width="245.7" height="47.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Об'єкт у SRAM (+4 або +8 байтів):</tspan><tspan x="270.0" dy="15.6">[ vptr = &amp;vtable | data_field ]</tspan></text>
<rect x="126.6" y="191.2" width="286.8" height="47.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Таблиця vtable у Flash (Flash .rodata):</tspan><tspan x="270.0" dy="15.6">[ typeinfo* | &amp;UartDriver::send ]</tspan></text>
<rect x="102.7" y="270.6" width="334.6" height="78.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="290.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Виклик uart-&gt;send(byte):</tspan><tspan x="270.0" dy="15.6">• LDR R3, [R0] (завантаження vptr)</tspan><tspan x="270.0" dy="15.6">• LDR R3, [R3, #4] (адреса методу)</tspan><tspan x="270.0" dy="15.6">• BLX R3 (непрямий перехід, скидання конвеєра)</tspan></text>
<line x1="270.0" y1="160.0" x2="270.0" y2="185.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="270.0" y1="250.0" x2="270.0" y2="275.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="30.0" x2="530.0" y2="365.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="601.3" y="30.5" width="377.4" height="39.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="55.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Статичний поліморфізм (CRTP / Шаблони)</tspan></text>
<rect x="622.7" y="106.2" width="334.6" height="47.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Об'єкт у SRAM (0 байтів оверхеду):</tspan><tspan x="790.0" dy="15.6">[ data_field ] (жодного службового вказівника)</tspan></text>
<rect x="653.5" y="191.2" width="273.1" height="47.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Таблиця у Flash:</tspan><tspan x="790.0" dy="15.6">ВІДСУТНЯ (компілятор знає точний тип)</tspan></text>
<rect x="609.0" y="270.6" width="362.0" height="78.8" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="290.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Виклик uart.send(byte):</tspan><tspan x="790.0" dy="15.6">• Прямий виклик BL або повний інлайнінг (0 тактів)</tspan><tspan x="790.0" dy="15.6">• Оптимізація регістрів та видалення мертвого коду</tspan><tspan x="790.0" dy="15.6">• Повна передбачуваність часу виконання</tspan></text>
<line x1="790.0" y1="160.0" x2="790.0" y2="185.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="790.0" y1="250.0" x2="790.0" y2="275.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>