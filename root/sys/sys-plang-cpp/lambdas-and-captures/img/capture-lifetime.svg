<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна й та сама послідовність подій, два види захоплення</text>
<rect x="210.0" y="55.0" width="200.0" height="60.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="310.0" y="80.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="310.0" dy="0.0">1. локальна</tspan><tspan x="310.0" dy="18.2">змінна x = 5</tspan></text>
<rect x="450.0" y="55.0" width="200.0" height="60.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="550.0" y="80.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="550.0" dy="0.0">2. створено</tspan><tspan x="550.0" dy="18.2">замикання</tspan></text>
<rect x="690.0" y="55.0" width="200.0" height="60.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="790.0" y="80.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="790.0" dy="0.0">3. область</tspan><tspan x="790.0" dy="18.2">скінчилася</tspan></text>
<rect x="930.0" y="55.0" width="200.0" height="60.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1030.0" y="80.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="1030.0" dy="0.0">4. замикання</tspan><tspan x="1030.0" dy="18.2">викликали</tspan></text>
<rect x="30.0" y="140.0" width="160.0" height="110.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="110.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">[x]</tspan><tspan x="110.0" dy="18.2">за значенням</tspan></text>
<rect x="210.0" y="140.0" width="200.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="310.0" y="199.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">x = 5 живе</tspan></text>
<line x1="415.0" y1="195.0" x2="445.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="450.0" y="140.0" width="200.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">у замиканні</tspan><tspan x="550.0" dy="18.2">своя копія 5</tspan></text>
<line x1="655.0" y1="195.0" x2="685.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="690.0" y="140.0" width="200.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">x зникає —</tspan><tspan x="790.0" dy="18.2">замиканню байдуже</tspan></text>
<line x1="895.0" y1="195.0" x2="925.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="930.0" y="140.0" width="200.0" height="110.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="1030.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">читає свою копію</tspan><tspan x="1030.0" dy="18.2">→ 5</tspan></text>
<rect x="30.0" y="290.0" width="160.0" height="110.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="110.0" y="340.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">[&amp;x]</tspan><tspan x="110.0" dy="18.2">за посиланням</tspan></text>
<rect x="210.0" y="290.0" width="200.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="310.0" y="349.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">x = 5 живе</tspan></text>
<line x1="415.0" y1="345.0" x2="445.0" y2="345.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="450.0" y="290.0" width="200.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="340.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">у замиканні</tspan><tspan x="550.0" dy="18.2">адреса x</tspan></text>
<line x1="655.0" y1="345.0" x2="685.0" y2="345.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="690.0" y="290.0" width="200.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="340.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">x зникає,</tspan><tspan x="790.0" dy="18.2">адреса лишається</tspan></text>
<line x1="895.0" y1="345.0" x2="925.0" y2="345.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="930.0" y="290.0" width="200.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1030.0" y="340.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">читає мертву</tspan><tspan x="1030.0" dy="18.2">пам'ять</tspan></text>
<text x="580.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">Різниця тільки в тому, що лежить у полі замикання: власна копія чи чужа адреса.</text>
</svg>