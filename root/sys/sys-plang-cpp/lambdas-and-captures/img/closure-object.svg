<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="230.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">що написано</text>
<rect x="40.0" y="90.0" width="380.0" height="116.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="54.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="54.0" dy="0.0">int limit = 10;</tspan><tspan x="54.0" dy="22.0">auto f = [limit](int x) {</tspan><tspan x="54.0" dy="22.0">    return x &gt; limit;</tspan><tspan x="54.0" dy="22.0">};</tspan></text>
<text x="780.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">який тип і об'єкт створює компілятор</text>
<rect x="580.0" y="70.0" width="400.0" height="160.0" rx="6" fill="#eef3fd" stroke="#333333" stroke-width="1.5"/><text x="594.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start"><tspan x="594.0" dy="0.0">class /* без імені */ {</tspan><tspan x="594.0" dy="22.0">    int limit;</tspan><tspan x="594.0" dy="22.0">public:</tspan><tspan x="594.0" dy="22.0">    bool operator()(int x) const</tspan><tspan x="594.0" dy="22.0">    { return x &gt; limit; }</tspan><tspan x="594.0" dy="22.0">} f{ limit };</tspan></text>
<text x="500.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">компілятор</text>
<line x1="430.0" y1="162.0" x2="570.0" y2="162.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="510.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">Захоплення стає полем об'єкта, а не аргументом функції.</text>
<text x="510.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">Копію зроблено там, де обчислено лямбда-вираз, — не в момент виклику.</text>
</svg>