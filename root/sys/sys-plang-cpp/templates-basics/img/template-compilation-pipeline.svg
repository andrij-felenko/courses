<rect x="789.2" y="253.1" width="151.7" height="73.9" rx="6" fill="#eef7ee" stroke="#c0392b" stroke-width="1.5"/><text x="865.0" y="272.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">class Vector_double {</tspan><tspan x="865.0" dy="14.3">  double* data_;</tspan><tspan x="865.0" dy="14.3">  void push(double);</tspan><tspan x="865.0" dy="14.3">};</tspan></text>
<rect x="789.2" y="343.1" width="151.7" height="73.9" rx="6" fill="#eef7ee" stroke="#c0392b" stroke-width="1.5"/><text x="865.0" y="362.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">class Vector_Widget {</tspan><tspan x="865.0" dy="14.3">  Widget* data_;</tspan><tspan x="865.0" dy="14.3">  void push(Widget);</tspan><tspan x="865.0" dy="14.3">};</tspan></text>
<rect x="123.1" y="468.5" width="793.8" height="33.0" rx="6" fill="#f4f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="489.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Статичний поліморфізм: нульовий оверхед під час виконання, оптимізація та інлайнінг кожного типу</tspan></text>
