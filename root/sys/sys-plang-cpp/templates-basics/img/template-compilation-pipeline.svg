<text x="520.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="520.0" dy="0.0">Підстановка аргументів</tspan><tspan x="520.0" dy="15.6">та генерація AST</tspan></text>
<rect x="448.4" y="173.4" width="143.1" height="63.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="193.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Vector&lt;int&gt; vi;</tspan><tspan x="520.0" dy="15.6">Vector&lt;double&gt; vd;</tspan><tspan x="520.0" dy="15.6">Vector&lt;Widget&gt; vw;</tspan></text>
