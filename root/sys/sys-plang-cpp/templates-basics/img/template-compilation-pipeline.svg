<rect x="207.4" y="17.0" width="625.1" height="36.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="40.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Конвеєр інстанціювання шаблону: від рецепта до бінарного коду</tspan></text>
<rect x="40.0" y="75.0" width="270.0" height="380.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="175.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шаблон (Blueprint)</text>
<text x="175.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="175.0" dy="0.0">Єдиний вихідний код</tspan><tspan x="175.0" dy="15.6">без конкретних типів</tspan></text>
<rect x="93.2" y="157.2" width="163.6" height="125.6" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="177.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">template &lt;typename T&gt;</tspan><tspan x="175.0" dy="15.6">class Vector {</tspan><tspan x="175.0" dy="15.6">  T* data_;</tspan><tspan x="175.0" dy="15.6">  size_t sz_;</tspan><tspan x="175.0" dy="15.6">public:</tspan><tspan x="175.0" dy="15.6">  void push(T val);</tspan><tspan x="175.0" dy="15.6">};</tspan></text>
