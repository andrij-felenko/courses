<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтеграція packaged_task у пул потоків</text>
<text x="50.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Використання std::packaged_task у черзі задач пулу потоків</text>
<rect x="50.0" y="75.0" width="200.0" height="160.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="101.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Клієнтські потоки</tspan><tspan x="150.0" dy="14.3">┌──────────────────────────┐</tspan><tspan x="150.0" dy="14.3">│ pool.enqueue(fn1) ──► fut1│</tspan><tspan x="150.0" dy="14.3">│ pool.enqueue(fn2) ──► fut2│</tspan><tspan x="150.0" dy="14.3">│ pool.enqueue(fn3) ──► fut3│</tspan><tspan x="150.0" dy="14.3">└──────────────────────────┘</tspan><tspan x="150.0" dy="14.3">Упаковка функції в</tspan><tspan x="150.0" dy="14.3">packaged_task&lt;R()&gt; через</tspan><tspan x="150.0" dy="14.3">std::make_shared</tspan></text>
<line x1="255.0" y1="155.0" x2="315.0" y2="155.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="320.0" y="75.0" width="280.0" height="160.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="460.0" y="108.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Потокобезпечна черга задач</tspan><tspan x="460.0" dy="14.3">std::queue&lt;std::function&lt;void()&gt;&gt;</tspan><tspan x="460.0" dy="14.3">┌──────────────────────────┐</tspan><tspan x="460.0" dy="14.3">│ [Task 3] [Task 2] [Task 1]│</tspan><tspan x="460.0" dy="14.3">└──────────────────────────┘</tspan><tspan x="460.0" dy="14.3">Синхронізація:</tspan><tspan x="460.0" dy="14.3">• std::mutex</tspan><tspan x="460.0" dy="14.3">• std::condition_variable</tspan></text>
<line x1="605.0" y1="155.0" x2="665.0" y2="155.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="670.0" y="75.0" width="220.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="101.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Пул робочих потоків</tspan><tspan x="780.0" dy="14.3">Worker Threads (std::jthread)</tspan><tspan x="780.0" dy="14.3">┌──────────────────────────┐</tspan><tspan x="780.0" dy="14.3">│ Worker 1 ──► task()      │</tspan><tspan x="780.0" dy="14.3">│ Worker 2 ──► idle        │</tspan><tspan x="780.0" dy="14.3">│ Worker N ──► task()      │</tspan><tspan x="780.0" dy="14.3">└──────────────────────────┘</tspan><tspan x="780.0" dy="14.3">Витягують void() задачу,</tspan><tspan x="780.0" dy="14.3">викликають task()</tspan></text>
<line x1="40.0" y1="260.0" x2="900.0" y2="260.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 5"/>
<rect x="50.0" y="280.0" width="840.0" height="100.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="312.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Перевага схем з std::packaged_task:</tspan><tspan x="470.0" dy="14.3">• Типи R та аргументів стираються до std::function&lt;void()&gt;</tspan><tspan x="470.0" dy="14.3">• Клієнт отримує чистий std::future&lt;R&gt; і чекає лише свій результат</tspan><tspan x="470.0" dy="14.3">• Пул потоків не знає про типи R чи аргументи — він просто викликає task()</tspan></text>
</svg>