<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Блокування деструктора тимчасового future</text>
<text x="50.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Пастка деструктора std::future при асинхронному виклику std::async</text>
<text x="50.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Правильно: Збереження у змінну `auto fut = std::async(...)`</text>
<rect x="50.0" y="95.0" width="410.0" height="110.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="255.0" y="118.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Потік 1: std::async(launch::async, task1);</tspan><tspan x="255.0" dy="14.3">Потік 2: std::async(launch::async, task2);</tspan><tspan x="255.0" dy="14.3">┌──────────────────────────────────────────────┐</tspan><tspan x="255.0" dy="14.3">│ Потоки працюють паралельно в тлі            │</tspan><tspan x="255.0" dy="14.3">│ fut1.get() і fut2.get() чекають лише в кінці  │</tspan><tspan x="255.0" dy="14.3">└──────────────────────────────────────────────┘</tspan></text>
<rect x="480.0" y="95.0" width="410.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="685.0" y="125.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Часова шкала (Паралельно):</tspan><tspan x="685.0" dy="14.3">Main:  [async1] ─── [async2] ────────────► fut.get()</tspan><tspan x="685.0" dy="14.3">Worker1: ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓ (Завдання 1)</tspan><tspan x="685.0" dy="14.3">Worker2: ▓▓▓▓▓▓▓▓▓▓▓▓▓▓▓ (Завдання 2)</tspan><tspan x="685.0" dy="14.3">Загальний час = max(T1, T2)</tspan></text>
<text x="50.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Пастка: Виклик без збереження `std::async(...)` (тимчасовий об'єкт)</text>
<rect x="50.0" y="255.0" width="410.0" height="110.0" rx="6" fill="#fff0f0" stroke="#2457d6" stroke-width="1.5"/><text x="255.0" y="278.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">std::async(launch::async, task1); // Створює temp future</tspan><tspan x="255.0" dy="14.3">std::async(launch::async, task2); // Тимчасовий об'єкт!</tspan><tspan x="255.0" dy="14.3">┌──────────────────────────────────────────────┐</tspan><tspan x="255.0" dy="14.3">│ ~future() блокує потік у крапці з комою!     │</tspan><tspan x="255.0" dy="14.3">│ Друга задача не почнеться, поки перша не дге │</tspan><tspan x="255.0" dy="14.3">└──────────────────────────────────────────────┘</tspan></text>
<rect x="480.0" y="255.0" width="410.0" height="110.0" rx="6" fill="#fff0f0" stroke="#2457d6" stroke-width="1.5"/><text x="685.0" y="285.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Часова шкала (Послідовне блокування!):</tspan><tspan x="685.0" dy="14.3">Main:  [async1]──[wait T1]──[async2]──[wait T2]─►</tspan><tspan x="685.0" dy="14.3">Worker1: ▓▓▓▓▓▓▓▓▓▓</tspan><tspan x="685.0" dy="14.3">Worker2:           ▓▓▓▓▓▓▓▓▓▓</tspan><tspan x="685.0" dy="14.3">Загальний час = T1 + T2 (Паралельність втрачено!)</tspan></text>
<text x="470.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Деструктор rvalue-future, поверненого з std::async, викликає ~future(), який чекає завершення потоку</text>
</svg>