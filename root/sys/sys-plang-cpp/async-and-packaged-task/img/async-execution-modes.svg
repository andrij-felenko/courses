<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Режими запуску std::async</text>
<text x="50.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Режими виконання std::async: Негайне (async) проти Лінивого (deferred)</text>
<text x="50.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Режим 1: std::launch::async (Окремий фоновий потік)</text>
<rect x="50.0" y="100.0" width="240.0" height="90.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Потік-викликач (Caller)</tspan><tspan x="170.0" dy="14.3">std::async(launch::async, fn)</tspan><tspan x="170.0" dy="14.3">• Негайно створює потік</tspan><tspan x="170.0" dy="14.3">• Повертає std::future&lt;T&gt;</tspan></text>
<line x1="295.0" y1="145.0" x2="365.0" y2="145.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="370.0" y="100.0" width="260.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Фоновий потік (Worker Thread)</tspan><tspan x="500.0" dy="14.3">fn(args...) виконується паралельно</tspan><tspan x="500.0" dy="14.3">• Запис результату в Shared State</tspan><tspan x="500.0" dy="14.3">• Сигнал готовності майбутнього</tspan></text>
<line x1="635.0" y1="145.0" x2="705.0" y2="145.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="710.0" y="100.0" width="180.0" height="90.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="136.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Споживач (Consumer)</tspan><tspan x="800.0" dy="11.7">future.get()</tspan><tspan x="800.0" dy="11.7">Отримує результат без затримки</tspan></text>
<text x="50.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">Режим 2: std::launch::deferred (Обчислення за вимогою у тому ж потоці)</text>
<rect x="50.0" y="250.0" width="240.0" height="90.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="277.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Потік-викликач (Caller)</tspan><tspan x="170.0" dy="14.3">std::async(launch::deferred, fn)</tspan><tspan x="170.0" dy="14.3">• Потік НЕ створюється</tspan><tspan x="170.0" dy="14.3">• Функцію відкладено</tspan></text>
<line x1="295.0" y1="295.0" x2="365.0" y2="295.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="370.0" y="250.0" width="260.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="284.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Стан очікування (Deferred State)</tspan><tspan x="500.0" dy="14.3">Функція виклику спарована з future,</tspan><tspan x="500.0" dy="14.3">але підвішена до першого .get()</tspan></text>
<line x1="635.0" y1="295.0" x2="705.0" y2="295.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="710.0" y="250.0" width="180.0" height="90.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="800.0" y="286.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Споживач (Consumer)</tspan><tspan x="800.0" dy="11.7">future.get()</tspan><tspan x="800.0" dy="11.7">Синхронний виклик fn() прямо тут!</tspan></text>
<text x="470.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Комбінація (async | deferred) залишає вибір рантайму залежно від завантаження системи</text>
</svg>