<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура std::packaged_task</text>
<text x="50.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Внутрішня структура та конвеєр даних std::packaged_task</text>
<rect x="50.0" y="70.0" width="250.0" height="150.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="91.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">std::packaged_task&lt;R(Args...)&gt;</tspan><tspan x="175.0" dy="14.3">┌────────────────────────────┐</tspan><tspan x="175.0" dy="14.3">│ Wrapped Callable          │</tspan><tspan x="175.0" dy="14.3">│ (Lambda / Function / Bind) │</tspan><tspan x="175.0" dy="14.3">├────────────────────────────┤</tspan><tspan x="175.0" dy="14.3">│ Shared State Pointer       │</tspan><tspan x="175.0" dy="14.3">└────────────────────────────┘</tspan><tspan x="175.0" dy="14.3">• Move-only обгортка</tspan><tspan x="175.0" dy="14.3">• Відокремлює запуск від виклику</tspan></text>
<line x1="305.0" y1="145.0" x2="365.0" y2="145.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="370.0" y="70.0" width="250.0" height="150.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="495.0" y="91.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">Спільний стан (Shared State)</tspan><tspan x="495.0" dy="14.3">┌────────────────────────────┐</tspan><tspan x="495.0" dy="14.3">│ State: Empty / Ready / Err │</tspan><tspan x="495.0" dy="14.3">├────────────────────────────┤</tspan><tspan x="495.0" dy="14.3">│ Storage for Return Value R │</tspan><tspan x="495.0" dy="14.3">│ or std::exception_ptr      │</tspan><tspan x="495.0" dy="14.3">├────────────────────────────┤</tspan><tspan x="495.0" dy="14.3">│ Mutex + Condition Variable │</tspan><tspan x="495.0" dy="14.3">└────────────────────────────┘</tspan></text>
<line x1="625.0" y1="145.0" x2="685.0" y2="145.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="690.0" y="70.0" width="200.0" height="150.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="96.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">std::future&lt;R&gt;</tspan><tspan x="790.0" dy="13.0">┌────────────────────────────┐</tspan><tspan x="790.0" dy="13.0">│ Shared State Pointer       │</tspan><tspan x="790.0" dy="13.0">└────────────────────────────┘</tspan><tspan x="790.0" dy="13.0">Отримано через</tspan><tspan x="790.0" dy="13.0">task.get_future()</tspan><tspan x="790.0" dy="13.0"></tspan><tspan x="790.0" dy="13.0">Метод .get() зчитує R</tspan><tspan x="790.0" dy="13.0">або перевикидає виняток</tspan></text>
<line x1="40.0" y1="245.0" x2="900.0" y2="245.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 5"/>
<text x="50.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Послідовність подій у часі:</text>
<rect x="50.0" y="290.0" width="260.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="322.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">1. Створення й підготовка</tspan><tspan x="180.0" dy="14.3">• Instantiation task(fn)</tspan><tspan x="180.0" dy="14.3">• fut = task.get_future()</tspan><tspan x="180.0" dy="14.3">• Move task в інший потік/чергу</tspan></text>
<rect x="340.0" y="290.0" width="260.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="322.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">2. Виконання у Worker Thread</tspan><tspan x="470.0" dy="14.3">• Виклик task(args...)</tspan><tspan x="470.0" dy="14.3">• Обчислення R = fn(args)</tspan><tspan x="470.0" dy="14.3">• Запис R у Shared State</tspan></text>
<rect x="630.0" y="290.0" width="260.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="322.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">3. Отримання у Consumer Thread</tspan><tspan x="760.0" dy="14.3">• fut.get() чекає готовності</tspan><tspan x="760.0" dy="14.3">• Забирає результат R</tspan><tspan x="760.0" dy="14.3">• Спільний стан звільняється</tspan></text>
</svg>