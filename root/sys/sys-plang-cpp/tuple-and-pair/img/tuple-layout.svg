<text x="40.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Всього sizeof(std::pair&lt;char, double&gt;) = 16 байтів через вимогу alignof(double) = 8</text>
