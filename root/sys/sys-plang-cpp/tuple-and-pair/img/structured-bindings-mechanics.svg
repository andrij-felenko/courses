<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Протокол структурованих зв'язувань</text>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Протокол структурованих зв'язувань (Structured Bindings) у C++17</text>
<rect x="40.0" y="75.0" width="860.0" height="45.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Код розробника: auto [x, y, z] = get_data_tuple();</tspan></text>
<rect x="40.0" y="140.0" width="260.0" height="120.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="191.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Крок 1: Запит розміру</tspan><tspan x="170.0" dy="11.7">std::tuple_size&lt;E&gt;::value</tspan><tspan x="170.0" dy="11.7">Перевіряється кількість елементів (повинна бути 3)</tspan></text>
<line x1="300.0" y1="200.0" x2="335.0" y2="200.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="340.0" y="140.0" width="260.0" height="120.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="191.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Крок 2: Запит типів</tspan><tspan x="470.0" dy="11.7">std::tuple_element&lt;i, E&gt;::type</tspan><tspan x="470.0" dy="11.7">Визначення типів x, y, z для кожного індексу i</tspan></text>
<line x1="600.0" y1="200.0" x2="635.0" y2="200.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="640.0" y="140.0" width="260.0" height="120.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="191.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Крок 3: Извлечення даних</tspan><tspan x="770.0" dy="11.7">get&lt;i&gt;(e)</tspan><tspan x="770.0" dy="11.7">Метод e.get&lt;i&gt;() або вільна функція get&lt;i&gt;(e)</tspan></text>
<line x1="470.0" y1="260.0" x2="470.0" y2="290.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="170.0" y="295.0" width="600.0" height="50.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="316.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Імена x, y, z стають псевдонімами для елементів прихованого об'єкта e</tspan><tspan x="470.0" dy="14.3">Привязка до rvalue/lvalue відповідно до авто-специфікатора (auto, const auto&amp;, auto&amp;&amp;)</tspan></text>
<text x="470.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Будь-який користувацький тип може підтримувати розкладання, реалізувавши цю трійку метафункцій</text>
</svg>