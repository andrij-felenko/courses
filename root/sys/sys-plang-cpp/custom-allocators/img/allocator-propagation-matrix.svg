<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поведінка алокаторів при копіюванні, переміщенні та обміні</text>
<rect x="40.0" y="48.0" width="180.0" height="40.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="130.0" y="72.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Операція контейнера</tspan></text>
<rect x="230.0" y="48.0" width="330.0" height="40.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="395.0" y="72.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">Якщо ознака (trait) = true</tspan></text>
<rect x="570.0" y="48.0" width="330.0" height="40.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="735.0" y="72.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">Якщо ознака (trait) = false</tspan></text>
<rect x="40.0" y="98.0" width="180.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="139.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Копіювальне присвоєння</tspan><tspan x="130.0" dy="11.7">(propagate_on_container_copy_assignment)</tspan></text>
<rect x="230.0" y="98.0" width="330.0" height="88.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="395.0" y="131.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="395.0" dy="0.0">Старий буфер звільняється старим алокатором;</tspan><tspan x="395.0" dy="14.3">алокатор копіюється з джерела;</tspan><tspan x="395.0" dy="14.3">новий буфер виділяється новим алокатором</tspan></text>
<rect x="570.0" y="98.0" width="330.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="735.0" y="131.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="735.0" dy="0.0">Алокатор залишається незмінним;</tspan><tspan x="735.0" dy="14.3">новий буфер виділяється власним алокатором;</tspan><tspan x="735.0" dy="14.3">елементи копіюються</tspan></text>
<rect x="40.0" y="198.0" width="180.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="239.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Переміщувальне присвоєння</tspan><tspan x="130.0" dy="11.7">(propagate_on_container_move_assignment)</tspan></text>
<rect x="230.0" y="198.0" width="330.0" height="88.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="395.0" y="231.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="395.0" dy="0.0">Алокатор переміщується;</tspan><tspan x="395.0" dy="14.3">буфер миттєво крадеться за O(1)</tspan><tspan x="395.0" dy="14.3">(просте копіювання вказівника на пам'ять)</tspan></text>
<rect x="570.0" y="198.0" width="330.0" height="88.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="735.0" y="232.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="735.0" dy="0.0">Якщо alloc == other.alloc → крадіжка буфера O(1).</tspan><tspan x="735.0" dy="13.0">Якщо alloc != other.alloc → виділення свого буфера,</tspan><tspan x="735.0" dy="13.0">поелементний move і O(N) час!</tspan></text>
<rect x="40.0" y="298.0" width="180.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="339.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Обмін (swap)</tspan><tspan x="130.0" dy="11.7">(propagate_on_container_swap)</tspan></text>
<rect x="230.0" y="298.0" width="330.0" height="88.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="395.0" y="338.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="395.0" dy="0.0">Алокатори міняються місцями;</tspan><tspan x="395.0" dy="14.3">буфери міняються вказівниками за O(1)</tspan></text>
<rect x="570.0" y="298.0" width="330.0" height="88.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="735.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="735.0" dy="0.0">Якщо alloc == other.alloc → swap вказівників O(1).</tspan><tspan x="735.0" dy="13.0">Якщо alloc != other.alloc → Невизначена поведінка (UB)!</tspan></text>
<rect x="40.0" y="408.0" width="860.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="434.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Критичний нюанс: нерівні алокатори ламають гарантію O(1) для move-операцій і призводять до UB у swap, якщо поширення вимкнено.</tspan></text>
</svg>