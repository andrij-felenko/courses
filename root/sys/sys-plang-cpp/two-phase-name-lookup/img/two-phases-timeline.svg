<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="311.5" y="27.0" width="397.0" height="36.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="50.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Два етапи аналізу шаблону компілятором</tspan></text>
<rect x="40.0" y="95.0" width="440.0" height="310.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="260.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фаза 1: Аналіз визначення (Definition Time)</text>
<text x="260.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="260.0" dy="0.0">Компілятор бачить сирий шаблон без T;</tspan><tspan x="260.0" dy="16.9">перевіряється синтаксична коректність;</tspan></text>
<rect x="90.7" y="210.1" width="338.6" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="260.0" y="231.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Незалежні імена (Non-dependent)</tspan><tspan x="260.0" dy="16.9">Прив'язуються негайно через звичайний пошук</tspan></text>
<rect x="68.5" y="300.1" width="383.1" height="49.9" rx="6" fill="#fff8e7" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="321.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Залежні імена (Dependent)</tspan><tspan x="260.0" dy="16.9">Перевіряється лише синтаксис, пошук ВІДКЛАДАЄТЬСЯ</tspan></text>
<line x1="485.0" y1="250.0" x2="535.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="510.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">T = Concrete</text>
<rect x="540.0" y="95.0" width="440.0" height="310.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="760.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фаза 2: Інстанціювання (Instantiation Time)</text>
<text x="760.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="760.0" dy="0.0">Відомий конкретний тип T (наприклад Widget);</tspan><tspan x="760.0" dy="16.9">створюється конкретний код у POI;</tspan></text>
<rect x="601.8" y="210.1" width="316.4" height="49.9" rx="6" fill="#eef7ee" stroke="#c0392b" stroke-width="1.5"/><text x="760.0" y="231.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Підстановка параметрів T → Widget</tspan><tspan x="760.0" dy="16.9">Генерується AST конкретної функції/класу</tspan></text>
<rect x="557.3" y="300.1" width="405.3" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="760.0" y="321.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Розв'язання залежних імен</tspan><tspan x="760.0" dy="16.9">Пошук у контексті POI + ADL в асоційованих просторах</tspan></text>
<line x1="260.0" y1="410.0" x2="510.0" y2="450.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="760.0" y1="410.0" x2="510.0" y2="450.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="152.8" y="458.0" width="714.4" height="34.0" rx="6" fill="#f4f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="510.0" y="479.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Результат: Незалежні імена зафіксовані на Фазі 1, залежні — розв'язані на Фазі 2</tspan></text>
</svg>