<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка неповного типу при руйнуванні unique_ptr</text>
<text x="490.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому деструктор класу з PIMPL не можна генерувати за замовчуванням у заголовку</text>
<rect x="40.0" y="60.0" width="420.0" height="36.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="82.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Помилка: деструктор у заголовку (або неявний)</tspan></text>
<rect x="40.0" y="105.0" width="420.0" height="120.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="118.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">// Widget.h</tspan><tspan x="250.0" dy="14.3">class Widget {</tspan><tspan x="250.0" dy="14.3">    struct Impl; // неповний тип (Incomplete Type)</tspan><tspan x="250.0" dy="14.3">    std::unique_ptr&lt;Impl&gt; pImpl_;</tspan><tspan x="250.0" dy="14.3">public:</tspan><tspan x="250.0" dy="14.3">    Widget();</tspan><tspan x="250.0" dy="14.3">    ~Widget() = default; // помилка інстанціювання!</tspan><tspan x="250.0" dy="14.3">};</tspan></text>
<line x1="250.0" y1="228.0" x2="250.0" y2="260.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="265.0" width="420.0" height="140.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="250.0" dy="0.0">// main.cpp (#include &quot;Widget.h&quot;)</tspan><tspan x="250.0" dy="13.0">void foo() { Widget w; } // на виході викликається ~Widget()</tspan><tspan x="250.0" dy="13.0"></tspan><tspan x="250.0" dy="13.0">~unique_ptr&lt;Impl&gt;() викликає std::default_delete&lt;Impl&gt;::operator()</tspan><tspan x="250.0" dy="13.0">який робить static_assert(sizeof(Impl) &gt; 0) або delete (Impl*);</tspan><tspan x="250.0" dy="13.0">Компілятор бачить: sizeof(Impl) невідомий → ПОМИЛКА КОМПІЛЯЦІЇ!</tspan></text>
<rect x="520.0" y="60.0" width="420.0" height="36.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="82.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Правильно: деструктор визначений у .cpp файлі</tspan></text>
<rect x="520.0" y="105.0" width="420.0" height="120.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="118.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">// Widget.h</tspan><tspan x="730.0" dy="14.3">class Widget {</tspan><tspan x="730.0" dy="14.3">    struct Impl;</tspan><tspan x="730.0" dy="14.3">    std::unique_ptr&lt;Impl&gt; pImpl_;</tspan><tspan x="730.0" dy="14.3">public:</tspan><tspan x="730.0" dy="14.3">    Widget();</tspan><tspan x="730.0" dy="14.3">    ~Widget(); // лише оголошення!</tspan><tspan x="730.0" dy="14.3">};</tspan></text>
<line x1="730.0" y1="228.0" x2="730.0" y2="260.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="520.0" y="265.0" width="420.0" height="140.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="299.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">// Widget.cpp</tspan><tspan x="730.0" dy="13.0">#include &quot;Widget.h&quot;</tspan><tspan x="730.0" dy="13.0">struct Widget::Impl {</tspan><tspan x="730.0" dy="13.0">    // повне визначення структури: розмір відомий!</tspan><tspan x="730.0" dy="13.0">};</tspan><tspan x="730.0" dy="13.0">Widget::Widget() : pImpl_(std::make_unique&lt;Impl&gt;()) {}</tspan><tspan x="730.0" dy="13.0">Widget::~Widget() = default; // тепер Impl повний, delete коректний!</tspan></text>
<text x="490.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">std::default_delete вимагає повного типу в точці інстанціювання деструктора</text>
</svg>