<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Однойменні злитні символи лінкер зводить до одного</text>
<rect x="40.0" y="64.0" width="280.0" height="112.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="180.0" y="100.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">config.o</tspan><tspan x="180.0" dy="15.6">зібрано з -DWITH_TIMESTAMP</tspan><tspan x="180.0" dy="15.6">тіло: return 16;</tspan><tspan x="180.0" dy="15.6">символ _ZNK6Packet4sizeEv</tspan></text>
<line x1="180.0" y1="180.0" x2="180.0" y2="226.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="370.0" y="64.0" width="280.0" height="112.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="100.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">render.o</tspan><tspan x="510.0" dy="15.6">зібрано без прапорця</tspan><tspan x="510.0" dy="15.6">тіло: return 8;</tspan><tspan x="510.0" dy="15.6">символ _ZNK6Packet4sizeEv</tspan></text>
<line x1="510.0" y1="180.0" x2="510.0" y2="226.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.0" y="64.0" width="280.0" height="112.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="840.0" y="100.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">log.o</tspan><tspan x="840.0" dy="15.6">зібрано без прапорця</tspan><tspan x="840.0" dy="15.6">тіло: return 8;</tspan><tspan x="840.0" dy="15.6">символ _ZNK6Packet4sizeEv</tspan></text>
<line x1="840.0" y1="180.0" x2="840.0" y2="226.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="232.0" width="940.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="510.0" y="275.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">лінкер: імена збігаються — лишає ОДНУ копію, решту викидає; тіла не звіряє</tspan></text>
<line x1="510.0" y1="314.0" x2="510.0" y2="358.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="190.0" y="364.0" width="640.0" height="82.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="510.0" y="401.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">у програмі лишилося одне тіло: return 16;</tspan><tspan x="510.0" dy="16.9">render.o й log.o рахують крок масиву як 8, а дістають 16</tspan></text>
<rect x="40.0" y="464.0" width="940.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="510.0" y="490.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="510.0" dy="0.0">збірка чиста: попереджень немає ні від компілятора, ні від лінкера</tspan></text>
</svg>