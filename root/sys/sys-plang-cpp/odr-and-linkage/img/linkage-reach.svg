<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири рівні зв'язування</text>
<text x="500.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">як далеко ім'я позначає ТУ САМУ сутність</text>
<rect x="40.0" y="76.0" width="250.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="110.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">без зв'язування</tspan><tspan x="165.0" dy="15.6">змінна в тілі функції</tspan></text>
<rect x="320.0" y="76.0" width="140.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="390.0" y="118.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">блок</tspan></text>
<rect x="40.0" y="176.0" width="250.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">внутрішнє</tspan><tspan x="165.0" dy="13.0">static · безіменний простір імен · const</tspan></text>
<rect x="320.0" y="176.0" width="300.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="218.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">одна одиниця трансляції</tspan></text>
<rect x="40.0" y="276.0" width="250.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="310.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">модульне (C++20)</tspan><tspan x="165.0" dy="14.3">оголошене в модулі, не експортоване</tspan></text>
<rect x="320.0" y="276.0" width="460.0" height="76.0" rx="6" fill="#eef6ee" stroke="#27ae60" stroke-width="1.5"/><text x="550.0" y="318.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">усі одиниці одного модуля</tspan></text>
<rect x="40.0" y="376.0" width="250.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="411.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">зовнішнє</tspan><tspan x="165.0" dy="13.0">звичайна функція · extern-змінна · клас</tspan></text>
<rect x="320.0" y="376.0" width="620.0" height="76.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="630.0" y="418.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">уся програма — тут діє «рівно одне визначення»</tspan></text>
<rect x="40.0" y="460.0" width="900.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="490.0" y="487.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="490.0" dy="0.0">ширина смуги — коло оголошень, у якому однакове ім'я означає один об'єкт</tspan></text>
</svg>