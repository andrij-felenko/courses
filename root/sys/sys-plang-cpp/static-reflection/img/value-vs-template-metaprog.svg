<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння підходів: типи проти значень</text>
<line x1="560.0" y1="50.0" x2="560.0" y2="440.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="285.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Шаблонне метапрограмування (C++98 — C++20)</text>
<text x="845.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Значеннєва рефлексія C++26 (P2996)</text>
<rect x="40.0" y="68.0" width="480.0" height="110.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="56.0" y="85.6" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">// Типове кодування властивостей через типи:</text><text x="56.0" y="102.1" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">template &lt;typename T&gt;</text><text x="56.0" y="118.6" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">struct inspect_fields : std::false_type {};</text><text x="56.0" y="135.1" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">template &lt;&gt; struct inspect_fields&lt;User&gt; {</text><text x="56.0" y="151.6" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">  using types = std::tuple&lt;string, int&gt;;</text><text x="56.0" y="168.1" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">};</text>
<text x="60.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Кожна мета-операція створює новий тип у таблиці символів</text>
<text x="60.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Рекурсивне розгортання шаблонів засмічує пам'ять компілятора</text>
<text x="60.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Неможливо дізнатися назви полів без макросів (BOOST_HANA / PFR)</text>
<text x="60.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Помилки компіляції розгортаються на сотні рядків шаблонів</text>
<text x="60.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Експоненційне сповільнення часу збірки для великих проектів</text>
<rect x="600.0" y="68.0" width="480.0" height="110.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/><text x="616.0" y="77.3" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">// Значеннєве обчислення в consteval:</text><text x="616.0" y="93.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">consteval auto get_field_names(info type) {</text><text x="616.0" y="110.3" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">  std::vector&lt;std::string_view&gt; names;</text><text x="616.0" y="126.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">  for (info f : nonstatic_data_members_of(type))</text><text x="616.0" y="143.3" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">    names.push_back(name_of(f));</text><text x="616.0" y="159.8" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">  return names;</text><text x="616.0" y="176.3" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">}</text>
<text x="620.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Один скалярний тип std::meta::info для всіх метаданих</text>
<text x="620.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Стандартні структури даних (std::vector, std::string_view) у consteval</text>
<text x="620.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Прямий доступ до назв, типів, вирівнювання, специфікаторів доступу</text>
<text x="620.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Зрозумілі компіляторні діагностики та звичайні помилки C++</text>
<text x="620.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Швидкість компіляції в десятки разів вища за шаблонні рекурсії</text>
<text x="560.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Заміна обчислень у системі типів на звичайні алгоритми над значеннями info радикально спрощує метапрограмування</text>
</svg>