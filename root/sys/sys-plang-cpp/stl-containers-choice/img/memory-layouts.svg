<text x="255.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Кожен елемент — окрема алокація у купі (+16/24 байт оверхеду).</tspan><tspan x="255.0" dy="15.4">Повна інвалідаційна стабільність: вказівники не ламаються.</tspan><tspan x="255.0" dy="15.4">Кеш-промахи на кожному кроці iterator++ (pointer chasing).</tspan></text>
