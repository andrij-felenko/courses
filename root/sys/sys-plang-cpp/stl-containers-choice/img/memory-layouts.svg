<text x="255.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">100% кеш-локальність: елементи лежать один за одним.</tspan><tspan x="255.0" dy="15.4">Виділення: 1 цілісний блок у купі (або стек для std::array).</tspan><tspan x="255.0" dy="15.4">Крок ітератора: просто зсув вказівника ptr++.</tspan></text>
