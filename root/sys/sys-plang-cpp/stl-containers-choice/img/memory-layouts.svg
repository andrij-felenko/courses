<text x="745.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Заміна std::map для переважно читальних сценаріїв.</tspan><tspan x="745.0" dy="15.4">Пошук: std::lower_bound (двійковий пошук у кеш-дружньому масиві).</tspan><tspan x="745.0" dy="15.4">Вставка: O(N) через зсув елементів, але без алокації нових вузлів.</tspan></text>
