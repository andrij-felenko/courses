<text x="255.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">CPU L1 Cache Line (64 байти)</text>
<text x="255.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Завантажує 8-16 елементів за один такт!</text>
<line x1="255.0" y1="170.0" x2="255.0" y2="220.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
