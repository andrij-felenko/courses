<rect x="530.0" y="40.0" width="430.0" height="380.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="745.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Вузловий список (std::list / std::map)</text>
<rect x="560.0" y="110.0" width="370.0" height="60.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="745.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Pointer Chasing (Стрибок за адресою)</text>
<text x="745.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Адреса наступного вузла невідома до прочитання поточного!</text>
<line x1="745.0" y1="170.0" x2="745.0" y2="220.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560.0" y="220.0" width="370.0" height="70.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="745.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">L3 / Main RAM Miss</text>
<text x="745.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Кожен вузол лежить у випадковому місці купи (промах кешу)</text>
