<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура пам'яті std::variant</text>
<text x="460.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішня структура пам'яті std::variant&lt;int, std::string, double&gt;</text>
<text x="220.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Суцільний блок пам'яті std::variant на стеку</text>
<rect x="105.4" y="116.4" width="229.2" height="67.2" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.8"/><text x="220.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">storage_type storage[max_size]</tspan><tspan x="220.0" dy="15.6">sizeof = sizeof(std::string)</tspan><tspan x="220.0" dy="15.6">alignas = alignof(std::string)</tspan></text>
<rect x="122.5" y="216.4" width="195.0" height="67.2" rx="6" fill="#fcf8e3" stroke="#6b7280" stroke-width="1.8"/><text x="220.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">size_t index_</tspan><tspan x="220.0" dy="15.6">Значення: 0..N-1 або npos</tspan><tspan x="220.0" dy="15.6">Визначає активний тип</tspan></text>
<rect x="107.4" y="308.4" width="225.2" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="220.0" y="328.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Padding (вирівнювання)</tspan><tspan x="220.0" dy="15.6">Забезпечує кордон вирівнювання</tspan><tspan x="220.0" dy="15.6">типу для процесора</tspan></text>
<rect x="60.0" y="395.0" width="320.0" height="35.0" rx="4" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="220.0" y="417.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Загальний sizeof = max(sizeof(T_i)) + sizeof(index_) + padding</text>
<text x="670.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Варіанти розміщення альтернатив у буфері</text>
<rect x="506.1" y="106.2" width="327.8" height="47.6" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">index_ = 0  -&gt;  int (4 bytes)</tspan><tspan x="670.0" dy="15.6">Решта буфера не ініціалізована (char storage)</tspan></text>
<rect x="475.3" y="196.2" width="389.4" height="47.6" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="670.0" y="216.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">index_ = 1  -&gt;  std::string (32 bytes)</tspan><tspan x="670.0" dy="15.6">Займає весь буфер, викликається конструктор/деструктор</tspan></text>
<rect x="550.6" y="286.2" width="238.9" height="47.6" rx="6" fill="#fcf8e3" stroke="#6b7280" stroke-width="1.5"/><text x="670.0" y="306.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">index_ = 2  -&gt;  double (8 bytes)</tspan><tspan x="670.0" dy="15.6">Вирівнювання по 8 байт</tspan></text>
<rect x="492.4" y="366.2" width="355.2" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="670.0" y="386.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">index_ = variant_npos  -&gt;  valueless_by_exception</tspan><tspan x="670.0" dy="15.6">Буфер не містить жодного об'єкта</tspan></text>
<line x1="340.0" y1="150.0" x2="480.0" y2="130.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340.0" y1="190.0" x2="480.0" y2="220.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340.0" y1="250.0" x2="480.0" y2="310.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340.0" y1="280.0" x2="480.0" y2="390.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="460.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Гарантія безпеки: std::variant автоматично відстежує активний тип та керує його життєвим циклом</text>
</svg>