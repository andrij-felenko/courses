<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири стадії добору перевантаження</text>
<rect x="40.0" y="66.0" width="470.0" height="86.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.4"/>
<text x="60.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">1 · Пошук імені</text>
<text x="60.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">збираємо все, що оголошено</tspan><tspan x="60.0" dy="17.6">під цим іменем</tspan></text>
<text x="556.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="556.0" dy="0.0">аргументи ще не дивимось;</tspan><tspan x="556.0" dy="18.2">пошук зупиняється на першій</tspan><tspan x="556.0" dy="18.2">області, де ім'я знайшлося</tspan></text>
<line x1="275.0" y1="158.0" x2="275.0" y2="192.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="198.0" width="470.0" height="86.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.4"/>
<text x="60.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">2 · Придатність</text>
<text x="60.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">чи можна цього кандидата</tspan><tspan x="60.0" dy="17.6">викликати з такими аргументами</tspan></text>
<text x="556.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="556.0" dy="0.0">вибуває той, у кого не сходиться</tspan><tspan x="556.0" dy="18.2">кількість аргументів або немає</tspan><tspan x="556.0" dy="18.2">перетворення хоч для одного</tspan></text>
<line x1="275.0" y1="290.0" x2="275.0" y2="324.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="330.0" width="470.0" height="86.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.4"/>
<text x="60.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">3 · Порівняння</text>
<text x="60.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">для кожного аргументу — розряд</tspan><tspan x="60.0" dy="17.6">перетворення; вектори зіставляють</tspan></text>
<text x="556.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="556.0" dy="0.0">єдиного найкращого немає →</tspan><tspan x="556.0" dy="18.2">неоднозначність, а не жереб</tspan></text>
<line x1="275.0" y1="422.0" x2="275.0" y2="456.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="462.0" width="470.0" height="86.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.4"/>
<text x="60.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">4 · Перевірки після вибору</text>
<text x="60.0" y="514.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">доступ, = delete, explicit</tspan></text>
<text x="556.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="556.0" dy="0.0">переможець не поступається</tspan><tspan x="556.0" dy="18.2">місцем наступному: програма</tspan><tspan x="556.0" dy="18.2">просто стає неправильною</tspan></text>
<text x="510.0" y="598.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">одна функція на виході — або чесна помилка компіляції</text>
</svg>