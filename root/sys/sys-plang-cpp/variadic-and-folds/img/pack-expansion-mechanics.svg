<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="198.4" y="12.5" width="643.1" height="35.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="35.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Механіка розпакування пакетів: оголошення, патерн та інстанціювання</tspan></text>
<rect x="30.0" y="65.0" width="300.0" height="355.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="180.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оголошення пакетів</text>
<text x="180.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="180.0" dy="0.0">Синтаксис еліпсиса (...) створює</tspan><tspan x="180.0" dy="14.3">пакет типів або значень</tspan></text>
<rect x="76.0" y="172.3" width="208.1" height="45.3" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="191.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">template &lt;typename... Types&gt;</tspan><tspan x="180.0" dy="14.3">void print_all(Types... args);</tspan></text>
<rect x="101.0" y="245.9" width="157.9" height="88.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="265.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Types: пакет типів</tspan><tspan x="180.0" dy="14.3">&lt;int, double, string&gt;</tspan><tspan x="180.0" dy="14.3"></tspan><tspan x="180.0" dy="14.3">args: пакет аргументів</tspan><tspan x="180.0" dy="14.3">(42, 3.14, &quot;text&quot;)</tspan></text>
<rect x="85.4" y="362.4" width="189.3" height="45.3" rx="6" fill="#eef7ee" stroke="#c0392b" stroke-width="1.5"/><text x="180.0" y="381.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">sizeof...(Types) == 3</tspan><tspan x="180.0" dy="14.3">(константа часу компіляції)</tspan></text>
<line x1="335.0" y1="240.0" x2="375.0" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="355.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Патерн</text>
<rect x="380.0" y="65.0" width="300.0" height="355.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="530.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Патерн розпакування</text>
<text x="530.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="530.0" dy="0.0">Вираз зліва від еліпсиса</tspan><tspan x="530.0" dy="14.3">тиражується для кожного елемента</tspan></text>
<rect x="432.2" y="158.1" width="195.6" height="73.9" rx="6" fill="#fff8e7" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="177.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Pattern(pack)... </tspan><tspan x="530.0" dy="14.3"></tspan><tspan x="530.0" dy="14.3">Приклад:</tspan><tspan x="530.0" dy="14.3">std::forward&lt;Types&gt;(args)...</tspan></text>
<rect x="447.9" y="250.9" width="164.2" height="88.2" rx="6" fill="#fdf0ed" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="270.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Синхронне розпакування:</tspan><tspan x="530.0" dy="14.3">func(keys, values)...</tspan><tspan x="530.0" dy="14.3"></tspan><tspan x="530.0" dy="14.3">Вимога: довжини пакетів</tspan><tspan x="530.0" dy="14.3">мусять точно збігатися!</tspan></text>
<rect x="435.4" y="362.4" width="189.3" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="381.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Контексти: виклики, списки,</tspan><tspan x="530.0" dy="14.3">ініціалізація, спадкування</tspan></text>
<line x1="685.0" y1="240.0" x2="725.0" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="705.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Генерація</text>
<rect x="730.0" y="65.0" width="280.0" height="355.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="870.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Синтезований виклик</text>
<text x="870.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="870.0" dy="0.0">Кома-розділений список</tspan><tspan x="870.0" dy="14.3">в абстрактному дереві (AST)</tspan></text>
<rect x="775.4" y="160.9" width="189.3" height="88.2" rx="6" fill="#eef7ee" stroke="#c0392b" stroke-width="1.5"/><text x="870.0" y="180.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">consume(</tspan><tspan x="870.0" dy="14.3">  std::forward&lt;int&gt;(a1),</tspan><tspan x="870.0" dy="14.3">  std::forward&lt;double&gt;(a2),</tspan><tspan x="870.0" dy="14.3">  std::forward&lt;string&gt;(a3)</tspan><tspan x="870.0" dy="14.3">);</tspan></text>
<rect x="778.5" y="310.2" width="183.0" height="59.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="870.0" y="329.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">Повний інлайнінг:</tspan><tspan x="870.0" dy="14.3">відсутні масиви у пам'яті,</tspan><tspan x="870.0" dy="14.3">нульовий оверхед виклику</tspan></text>
<rect x="164.0" y="434.0" width="711.9" height="32.0" rx="6" fill="#f4f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="454.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Розпакування пакета — це синтаксична трансформація AST на етапі компіляції без рантайм-витрат</tspan></text>
</svg>