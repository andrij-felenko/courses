<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="217.8" y="10.5" width="624.5" height="35.0" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="33.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Чотири граматичні форми виразів згортки (Fold Expressions, C++17)</tspan></text>
<rect x="30.0" y="60.0" width="235.0" height="385.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="147.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Unary Left (... op E)</text>
<text x="147.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="147.0" dy="0.0">Ліва унарна згортка</tspan><tspan x="147.0" dy="14.3">Асоціативність: вліво</tspan></text>
<rect x="92.4" y="144.0" width="109.3" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="147.0" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="147.0" dy="0.0">(... + args)</tspan></text>
<rect x="61.8" y="181.6" width="170.5" height="116.8" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="147.0" y="200.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="147.0" dy="0.0">Розкриття виразу:</tspan><tspan x="147.0" dy="14.3">(((a1 + a2) + a3) + a4)</tspan><tspan x="147.0" dy="14.3"></tspan><tspan x="147.0" dy="14.3">Порожній пакет:</tspan><tspan x="147.0" dy="14.3">&amp;&amp; -&gt; true, || -&gt; false,</tspan><tspan x="147.0" dy="14.3">,  -&gt; void()</tspan><tspan x="147.0" dy="14.3">інші op -&gt; помилка!</tspan></text>
<rect x="58.6" y="350.2" width="176.8" height="59.6" rx="6" fill="#eef7ee" stroke="#c0392b" stroke-width="1.5"/><text x="147.0" y="369.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="147.0" dy="0.0">Застосування:</tspan><tspan x="147.0" dy="14.3">потоки (std::cout &lt;&lt; ...)</tspan><tspan x="147.0" dy="14.3">та додавання чисел</tspan></text>
<rect x="280.0" y="60.0" width="235.0" height="385.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="397.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Unary Right (E op ...)</text>
<text x="397.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="397.0" dy="0.0">Права унарна згортка</tspan><tspan x="397.0" dy="14.3">Асоціативність: вправо</tspan></text>
<rect x="342.4" y="144.0" width="109.3" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="397.0" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="397.0" dy="0.0">(args + ...)</tspan></text>
<rect x="311.8" y="181.6" width="170.5" height="116.8" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="397.0" y="200.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="397.0" dy="0.0">Розкриття виразу:</tspan><tspan x="397.0" dy="14.3">(a1 + (a2 + (a3 + a4)))</tspan><tspan x="397.0" dy="14.3"></tspan><tspan x="397.0" dy="14.3">Порожній пакет:</tspan><tspan x="397.0" dy="14.3">&amp;&amp; -&gt; true, || -&gt; false,</tspan><tspan x="397.0" dy="14.3">,  -&gt; void()</tspan><tspan x="397.0" dy="14.3">інші op -&gt; помилка!</tspan></text>
<rect x="324.3" y="350.2" width="145.4" height="59.6" rx="6" fill="#eef7ee" stroke="#c0392b" stroke-width="1.5"/><text x="397.0" y="369.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="397.0" dy="0.0">Застосування:</tspan><tspan x="397.0" dy="14.3">правоасоціативні op:</tspan><tspan x="397.0" dy="14.3">присвоєння (=), стек</tspan></text>
<rect x="535.0" y="60.0" width="245.0" height="385.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="657.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Binary Left (I op ... op E)</text>
<text x="657.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="657.0" dy="0.0">Ліва бінарна згортка</tspan><tspan x="657.0" dy="14.3">З явним ініціалізатором I</tspan></text>
<rect x="576.3" y="144.0" width="161.4" height="32.0" rx="6" fill="#fff8e7" stroke="#27ae60" stroke-width="1.5"/><text x="657.0" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="657.0" dy="0.0">(init + ... + args)</tspan></text>
<rect x="546.7" y="188.8" width="220.6" height="102.5" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="657.0" y="208.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="657.0" dy="0.0">Розкриття виразу:</tspan><tspan x="657.0" dy="14.3">((((init + a1) + a2) + a3) + a4)</tspan><tspan x="657.0" dy="14.3"></tspan><tspan x="657.0" dy="14.3">Порожній пакет:</tspan><tspan x="657.0" dy="14.3">Результат == init</tspan><tspan x="657.0" dy="14.3">(дозволено для всіх op)</tspan></text>
<rect x="565.5" y="350.2" width="183.0" height="59.6" rx="6" fill="#eef7ee" stroke="#c0392b" stroke-width="1.5"/><text x="657.0" y="369.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="657.0" dy="0.0">Застосування:</tspan><tspan x="657.0" dy="14.3">друк у потік із префіксом,</tspan><tspan x="657.0" dy="14.3">початкове накопичення</tspan></text>
<rect x="795.0" y="60.0" width="235.0" height="385.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="912.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Binary Right (E op ... op I)</text>
<text x="912.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="912.0" dy="0.0">Права бінарна згортка</tspan><tspan x="912.0" dy="14.3">З кінцевим значенням I</tspan></text>
<rect x="831.3" y="144.0" width="161.4" height="32.0" rx="6" fill="#fff8e7" stroke="#27ae60" stroke-width="1.5"/><text x="912.0" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="912.0" dy="0.0">(args + ... + init)</tspan></text>
<rect x="801.7" y="188.8" width="220.6" height="102.5" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="912.0" y="208.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="912.0" dy="0.0">Розкриття виразу:</tspan><tspan x="912.0" dy="14.3">(a1 + (a2 + (a3 + (a4 + init))))</tspan><tspan x="912.0" dy="14.3"></tspan><tspan x="912.0" dy="14.3">Порожній пакет:</tspan><tspan x="912.0" dy="14.3">Результат == init</tspan><tspan x="912.0" dy="14.3">(дозволено для всіх op)</tspan></text>
<rect x="823.6" y="350.2" width="176.8" height="59.6" rx="6" fill="#eef7ee" stroke="#c0392b" stroke-width="1.5"/><text x="912.0" y="369.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="912.0" dy="0.0">Застосування:</tspan><tspan x="912.0" dy="14.3">ланцюжки трансформацій,</tspan><tspan x="912.0" dy="14.3">термінальні вузли списків</tspan></text>
<rect x="136.8" y="454.0" width="786.3" height="32.0" rx="6" fill="#f4f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="530.0" y="474.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Вираз згортки обов'язково обмежується круглими дужками; бінарна форма гарантує безпеку порожніх пакетів</tspan></text>
</svg>