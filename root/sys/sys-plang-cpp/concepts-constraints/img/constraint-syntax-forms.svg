<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири синтаксичні форми застосування обмежень у C++20</text>
<rect x="25.0" y="15.0" width="990.0" height="36.0" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/>
<text x="520.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2d3748" text-anchor="middle" font-weight="700">Чотири форми синтаксису обмежень шаблонів у C++20</text>
<rect x="25.0" y="65.0" width="480.0" height="155.0" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.2"/>
<text x="265.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2b6cb0" text-anchor="middle" font-weight="700">1. Речення requires після заголовка шаблону</text>
<rect x="130.8" y="116.0" width="268.5" height="48.0" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/><text x="265.0" y="130.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">template&lt;typename T&gt;</tspan><tspan x="265.0" dy="13.0">requires std::integral&lt;T&gt; &amp;&amp; (sizeof(T) &gt;= 4)</tspan><tspan x="265.0" dy="13.0">void process(T val);</tspan></text>
<text x="265.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="middle" font-style="italic">Найкраще для: складних кон'юнкцій, диз'юнкцій та ad-hoc предикатів</text>
<rect x="535.0" y="65.0" width="480.0" height="155.0" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.2"/>
<text x="775.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2b6cb0" text-anchor="middle" font-weight="700">2. Типізоване обмеження параметра (Type-constraint)</text>
<rect x="623.6" y="122.5" width="302.7" height="35.0" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/><text x="775.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">template&lt;std::integral T, std::convertible_to&lt;T&gt; U&gt;</tspan><tspan x="775.0" dy="13.0">void process(T val, U other);</tspan></text>
<text x="775.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="middle" font-style="italic">Найкраще для: лаконічного декларування одинарних концептів параметрів</text>
<rect x="25.0" y="240.0" width="480.0" height="160.0" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.2"/>
<text x="265.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2b6cb0" text-anchor="middle" font-weight="700">3. Хвостове речення requires (Trailing requires-clause)</text>
<rect x="79.5" y="291.0" width="371.1" height="48.0" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/><text x="265.0" y="305.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">template&lt;typename T&gt;</tspan><tspan x="265.0" dy="13.0">auto compute(T x) -&gt; typename T::value_type</tspan><tspan x="265.0" dy="13.0">    requires std::copyable&lt;T&gt; &amp;&amp; std::default_initializable&lt;T&gt;;</tspan></text>
<text x="265.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="middle" font-style="italic">Обов'язкове для: методів шаблонних класів та перевірки виведеного типу повернення</text>
<rect x="535.0" y="240.0" width="480.0" height="160.0" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.2"/>
<text x="775.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2b6cb0" text-anchor="middle" font-weight="700">4. Скорочені шаблони функцій (Abbreviated Function Template)</text>
<rect x="578.0" y="297.5" width="393.9" height="35.0" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/><text x="775.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">void sort_buffer(std::ranges::random_access_range auto&amp; buf);</tspan><tspan x="775.0" dy="13.0">void print_value(std::integral auto x, std::floating_point auto y);</tspan></text>
<text x="775.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4a5568" text-anchor="middle" font-style="italic">Найкраще для: повсякденних функцій без явного оголошення template&lt;typename T&gt;</text>
</svg>