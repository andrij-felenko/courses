<rect x="122.2" y="79.3" width="285.6" height="41.3" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/><text x="265.0" y="96.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Виклик: std::sort(list.begin(), list.end())</tspan><tspan x="265.0" dy="14.3">Аргумент: BidirectionalIterator (std::list)</tspan></text>
<rect x="68.9" y="150.5" width="392.2" height="39.0" rx="6" fill="#fed7d7" stroke="#e53e3e" stroke-width="1.5"/><text x="265.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9b2c2c" text-anchor="middle"><tspan x="265.0" dy="0.0">Глибоке інстанціювання тіла шаблону</tspan><tspan x="265.0" dy="13.0">std::__sort -&gt; std::__introsort_loop -&gt; std::__unguarded_partition</tspan></text>
<rect x="114.5" y="229.0" width="301.0" height="52.0" rx="6" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/><text x="265.0" y="245.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#742a2a" text-anchor="middle"><tspan x="265.0" dy="0.0">Помилка глибоко в надрах STL:</tspan><tspan x="265.0" dy="13.0">stl_algo.h:1842: error: no match for operator-</tspan><tspan x="265.0" dy="13.0">iterators do not support random access subtraction</tspan></text>
<rect x="63.2" y="330.5" width="403.6" height="39.0" rx="6" fill="#ffffff" stroke="#e53e3e" stroke-width="1.5"/><text x="265.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c53030" text-anchor="middle"><tspan x="265.0" dy="0.0">Результат: каскад із 150+ рядків стек-трейсу інстанціювання</tspan><tspan x="265.0" dy="13.0">Розробник змушений шукати першопричину в чужих внутрішніх заголовках</tspan></text>
<line x1="265.0" y1="125.0" x2="265.0" y2="145.0" stroke="#e53e3e" stroke-width="1.5" marker-end="url(#arrow)"/>
