<rect x="535.0" y="65.0" width="480.0" height="345.0" rx="8" fill="#f0fff4" stroke="#9ae6b4" stroke-width="1.2"/>
<rect x="604.0" y="79.3" width="342.0" height="41.3" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/><text x="775.0" y="96.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Виклик: std::ranges::sort(list)</tspan><tspan x="775.0" dy="14.3">Вимога: template&lt;std::ranges::random_access_range R&gt;</tspan></text>
<rect x="604.5" y="155.5" width="340.9" height="39.0" rx="6" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5"/><text x="775.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#22543d" text-anchor="middle"><tspan x="775.0" dy="0.0">Перевірка предикатів концепту на межі інтерфейсу</tspan><tspan x="775.0" dy="13.0">std::random_access_iterator&lt;I&gt; == false (немає operator-)</tspan></text>
<rect x="593.1" y="235.5" width="363.7" height="39.0" rx="6" fill="#e6fffa" stroke="#319795" stroke-width="1.5"/><text x="775.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#234e52" text-anchor="middle"><tspan x="775.0" dy="0.0">Миттєва зупинка ДО інстанціювання тіла</tspan><tspan x="775.0" dy="13.0">Шаблон відсіюється з набору кандидатів без помилок у нутрощах</tspan></text>
<rect x="573.2" y="324.0" width="403.6" height="52.0" rx="6" fill="#ffffff" stroke="#38a169" stroke-width="1.5"/><text x="775.0" y="340.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#22543d" text-anchor="middle"><tspan x="775.0" dy="0.0">Результат: чітка локалізована діагностика у 2 рядки:</tspan><tspan x="775.0" dy="13.0">main.cpp:12: error: constraints not satisfied for sort(list)</tspan><tspan x="775.0" dy="13.0">note: concept random_access_range&lt;std::list&lt;int&gt;&gt; evaluated to false</tspan></text>
