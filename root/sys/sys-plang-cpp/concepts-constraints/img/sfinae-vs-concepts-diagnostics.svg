<text x="265.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2d3748" text-anchor="middle" font-weight="700">Невимушений шаблон / SFINAE (до C++20)</text>
<rect x="535.0" y="15.0" width="480.0" height="36.0" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.5"/>
<text x="775.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2d3748" text-anchor="middle" font-weight="700">Шаблон із концептами C++20 (requires)</text>
