<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Делегування через elements_of</text>
<text x="50.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Рекурсивна передача керування через std::ranges::elements_of (Symmetric Transfer)</text>
<text x="50.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Традиційний циклічний yield (O(N^2) оверхед):</text>
<rect x="50.0" y="95.0" width="410.0" height="140.0" rx="6" fill="#fff0f0" stroke="#2457d6" stroke-width="1.5"/><text x="255.0" y="140.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">for (auto x : sub_generator()) {</tspan><tspan x="255.0" dy="14.3">    co_yield x;</tspan><tspan x="255.0" dy="14.3">}</tspan><tspan x="255.0" dy="14.3">// Проблема: Кожен виклик проходить призупинення</tspan><tspan x="255.0" dy="14.3">// та відновлення через усі проміжні рівні стеку!</tspan></text>
<text x="490.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">C++23 elements_of (O(1) Symmetric Transfer):</text>
<rect x="490.0" y="95.0" width="400.0" height="140.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="140.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">co_yield std::ranges::elements_of(</tspan><tspan x="690.0" dy="14.3">    sub_generator()</tspan><tspan x="690.0" dy="14.3">);</tspan><tspan x="690.0" dy="14.3">// Перевага: Посилання parent_link зв'язує</tspan><tspan x="690.0" dy="14.3">// вкладені обіцянки напряму у зв'язаний список!</tspan></text>
<text x="50.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Прямий ланцюжок вкладених обіцянок (Promise Chain Pointer):</text>
<rect x="50.0" y="285.0" width="260.0" height="95.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="322.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Батьківська корутина:</tspan><tspan x="180.0" dy="14.3">promise_type (Root)</tspan><tspan x="180.0" dy="14.3">top_promise ────────┐</tspan></text>
<line x1="310.0" y1="330.0" x2="370.0" y2="330.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="375.0" y="285.0" width="260.0" height="95.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="505.0" y="322.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">Вкладена корутина L1:</tspan><tspan x="505.0" dy="14.3">promise_type (Node)</tspan><tspan x="505.0" dy="14.3">parent_link ──────┐</tspan></text>
<line x1="635.0" y1="330.0" x2="695.0" y2="330.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="700.0" y="285.0" width="190.0" height="95.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="795.0" y="322.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Листова корутина L2:</tspan><tspan x="795.0" dy="14.3">co_yield value;</tspan><tspan x="795.0" dy="14.3">Відновлення напряму!</tspan></text>
</svg>