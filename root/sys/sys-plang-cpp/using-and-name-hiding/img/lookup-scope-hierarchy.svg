<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пошук імені зупиняється на першій знайденій області</text>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пошук імені (Name Lookup) зупиняється на першій же знайденій області</text>
<rect x="70.0" y="55.0" width="420.0" height="49.9" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.2"/><text x="280.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">1. Локальний блок (Local block)</tspan><tspan x="280.0" dy="16.9">x, y, локальні змінні</tspan></text>
<rect x="70.0" y="125.0" width="420.0" height="49.9" rx="6" fill="#fff8e6" stroke="#c0392b" stroke-width="2.0"/><text x="280.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">2. Похідний клас (Derived class)</tspan><tspan x="280.0" dy="16.9">foo(double) — ім'я ЗНАЙДЕНО!</tspan></text>
<rect x="70.0" y="195.1" width="420.0" height="49.9" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.2"/><text x="280.0" y="216.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">3. Базовий клас (Base class)</tspan><tspan x="280.0" dy="16.9">foo(int), foo(string_view) — ЗАТУЛЕНО</tspan></text>
<rect x="70.0" y="265.1" width="420.0" height="49.9" rx="6" fill="#f8f9fa" stroke="#6b7280" stroke-width="1.2"/><text x="280.0" y="286.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">4. Простір імен (Namespace)</tspan><tspan x="280.0" dy="16.9">foo(char) — пошук сюди не дійде</tspan></text>
<rect x="70.0" y="335.1" width="420.0" height="49.9" rx="6" fill="#f8f9fa" stroke="#6b7280" stroke-width="1.2"/><text x="280.0" y="356.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">5. Глобальна область (Global scope)</tspan><tspan x="280.0" dy="16.9">foo(float) — пошук сюди не дійде</tspan></text>
<line x1="40.0" y1="100.0" x2="40.0" y2="360.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="40.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Напрям</text>
<text x="40.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">пошуку</text>
<rect x="580.0" y="137.6" width="280.0" height="164.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="720.0" y="161.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Множина кандидатів (Candidate Set):</tspan><tspan x="720.0" dy="15.6">Лише { Derived::foo(double) }</tspan><tspan x="720.0" dy="15.6"></tspan><tspan x="720.0" dy="15.6">Виклик: d.foo(&quot;рядок&quot;)</tspan><tspan x="720.0" dy="15.6">✗ Помилка: неможливо перетворити</tspan><tspan x="720.0" dy="15.6">  const char* на double.</tspan><tspan x="720.0" dy="15.6"></tspan><tspan x="720.0" dy="15.6">Base::foo(string_view) навіть</tspan><tspan x="720.0" dy="15.6">не розглядалася компілятором!</tspan></text>
<line x1="500.0" y1="150.0" x2="570.0" y2="170.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>