<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 957.7 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="957.7" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Різниця механізмів using-оголошення та using-директиви</text>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">using-оголошення (введення в область) vs using-директива (видимість у предку)</text>
<text x="240.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">using-оголошення: using A::f;</text>
<rect x="53.6" y="85.2" width="372.8" height="129.6" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.8"/><text x="240.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">namespace A { void f(double); }</tspan><tspan x="240.0" dy="15.6">void f(int); // глобальна функція</tspan><tspan x="240.0" dy="15.6"></tspan><tspan x="240.0" dy="15.6">void test() {</tspan><tspan x="240.0" dy="15.6">    using A::f; // вносить f у поточну область test</tspan><tspan x="240.0" dy="15.6">    f(1);       // викликає A::f(double)</tspan><tspan x="240.0" dy="15.6">}</tspan></text>
<rect x="80.0" y="255.6" width="320.0" height="78.8" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="275.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Механізм:</tspan><tspan x="240.0" dy="15.6">• f стає локальним символом у test().</tspan><tspan x="240.0" dy="15.6">• Повністю ЗАТУЛЯЄ глобальну f(int).</tspan><tspan x="240.0" dy="15.6">• Overload resolution обирає A::f(double).</tspan></text>
<line x1="470.0" y1="55.0" x2="470.0" y2="385.0" stroke="#333333" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="700.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">using-директива: using namespace A;</text>
<rect x="462.3" y="85.2" width="475.4" height="129.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="700.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">namespace A { void f(double); }</tspan><tspan x="700.0" dy="15.6">void f(int); // глобальна функція</tspan><tspan x="700.0" dy="15.6"></tspan><tspan x="700.0" dy="15.6">void test() {</tspan><tspan x="700.0" dy="15.6">    using namespace A; // вільний доступ на рівні спільного предка</tspan><tspan x="700.0" dy="15.6">    f(1); // ✗ Неоднозначність (ambiguity)!</tspan><tspan x="700.0" dy="15.6">}</tspan></text>
<rect x="525.8" y="247.8" width="348.3" height="94.4" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Механізм:</tspan><tspan x="700.0" dy="15.6">• Символи A стають видимими в найближчому</tspan><tspan x="700.0" dy="15.6">  спільному просторі-предку (тут: global).</tspan><tspan x="700.0" dy="15.6">• Обидві f(int) та f(double) на одному рівні!</tspan><tspan x="700.0" dy="15.6">• Виклик f(1) спричиняє помилку неоднозначності.</tspan></text>
</svg>