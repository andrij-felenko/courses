<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зміна прав доступу до членів базового класу через using</text>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переналаштування прав доступу в похідному класі через using</text>
<rect x="80.0" y="105.2" width="280.0" height="129.6" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">class SocketBase {</tspan><tspan x="220.0" dy="15.6">protected:</tspan><tspan x="220.0" dy="15.6">    void set_timeout(int ms);</tspan><tspan x="220.0" dy="15.6">    void raw_write(span&lt;byte&gt;);</tspan><tspan x="220.0" dy="15.6">public:</tspan><tspan x="220.0" dy="15.6">    void close();</tspan><tspan x="220.0" dy="15.6">};</tspan></text>
<rect x="463.1" y="81.8" width="413.9" height="176.4" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.8"/><text x="670.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">class TcpStream : private SocketBase {</tspan><tspan x="670.0" dy="15.6">public:</tspan><tspan x="670.0" dy="15.6">    // 1. Відкриваємо protected-метод назовні</tspan><tspan x="670.0" dy="15.6">    using SocketBase::set_timeout;</tspan><tspan x="670.0" dy="15.6"></tspan><tspan x="670.0" dy="15.6">    // 2. Відкриваємо окремі public-методи з private бази</tspan><tspan x="670.0" dy="15.6">    using SocketBase::close;</tspan><tspan x="670.0" dy="15.6"></tspan><tspan x="670.0" dy="15.6">    // raw_write лишається схованою в private</tspan><tspan x="670.0" dy="15.6">};</tspan></text>
<line x1="370.0" y1="140.0" x2="470.0" y2="140.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">робимо public</text>
<line x1="370.0" y1="200.0" x2="470.0" y2="200.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">зберігаємо public</text>
<text x="460.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Права доступу визначаються секцією (public/protected/private), у якій стоїть using</text>
</svg>