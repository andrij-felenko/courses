<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки компілятор бере begin і end</text>
<rect x="370.0" y="56.5" width="260.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="79.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">тип виразу-діапазону</tspan></text>
<rect x="121.5" y="159.2" width="96.9" height="33.5" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="180.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">масив T[N]</tspan></text>
<rect x="114.0" y="262.5" width="112.1" height="51.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">__range</tspan><tspan x="170.0" dy="17.6">__range + N</tspan></text>
<line x1="500.0" y1="98.0" x2="170.0" y2="148.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="170.0" y1="206.0" x2="170.0" y2="254.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="397.7" y="150.5" width="204.7" height="51.1" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="171.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">клас, де знайдено ОБИДВА</tspan><tspan x="500.0" dy="17.6">імені-члени begin і end</tspan></text>
<rect x="427.2" y="262.5" width="145.6" height="51.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">__range.begin()</tspan><tspan x="500.0" dy="17.6">__range.end()</tspan></text>
<line x1="500.0" y1="98.0" x2="500.0" y2="148.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="500.0" y1="206.0" x2="500.0" y2="254.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="789.2" y="159.2" width="81.6" height="33.5" rx="6" fill="#eef3f8" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="180.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">усе інше</tspan></text>
<rect x="748.9" y="253.7" width="162.3" height="68.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="275.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">begin(__range)</tspan><tspan x="830.0" dy="17.6">end(__range)</tspan><tspan x="830.0" dy="17.6">пошук лише за ADL</tspan></text>
<line x1="500.0" y1="98.0" x2="830.0" y2="148.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="830.0" y1="206.0" x2="830.0" y2="254.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="500.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="500.0" dy="0.0">Перевірка йде зліва направо: спрацював варіант — решту не розглядають.</tspan><tspan x="500.0" dy="16.9">Знайдено лише одне з двох імен-членів — члени не беруть узагалі (з C++20).</tspan></text>
</svg>