<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цикл за діапазоном — правило переписування, а не окремий вид циклу</text>
<text x="230.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">що пише програміст</text>
<text x="775.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">у що це розгортається</text>
<rect x="30.0" y="64.0" width="400.0" height="150.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="52.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">for (auto&amp; item : basket)</text>
<text x="52.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">{</text>
<text x="52.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">    total += item.price;</text>
<text x="52.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">}</text>
<rect x="560.0" y="64.0" width="430.0" height="300.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="578.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">{</text>
<text x="578.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">  auto&amp;&amp; __range = basket;</text>
<text x="578.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">  auto __begin = __range.begin();</text>
<text x="578.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">  auto __end   = __range.end();</text>
<text x="578.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">  for ( ; __begin != __end; ++__begin)</text>
<text x="578.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">  {</text>
<text x="578.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">    auto&amp; item = *__begin;</text>
<text x="578.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">    total += item.price;</text>
<text x="578.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">  }</text>
<text x="578.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">}</text>
<line x1="438.0" y1="100.0" x2="552.0" y2="124.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="438.0" y1="156.0" x2="552.0" y2="292.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="510.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="510.0" dy="0.0">Діапазон обчислюють один раз, кінець — теж один раз,</tspan><tspan x="510.0" dy="16.9">а змінна циклу народжується заново на кожному кроці.</tspan></text>
</svg>