<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1251 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1251" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Видимість імені проти досяжності типу</text>
<text x="620.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Видимість імені (Visibility) проти Досяжності типу (Reachability)</text>
<text x="620.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Чому тип може бути повністю відомим компілятору, хоча його назву заборонено писати в коді</text>
<text x="300.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Оголошення всередині модуля network</text>
<rect x="60.0" y="130.0" width="480.0" height="180.0" rx="6" fill="#eef2fb" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">export module network;</tspan><tspan x="300.0" dy="15.6"></tspan><tspan x="300.0" dy="15.6">// 1. Неекспортований внутрішній тип</tspan><tspan x="300.0" dy="15.6">struct SocketHandle {</tspan><tspan x="300.0" dy="15.6">    int fd;</tspan><tspan x="300.0" dy="15.6">    void send_bytes(const char* data, int len);</tspan><tspan x="300.0" dy="15.6">};</tspan><tspan x="300.0" dy="15.6"></tspan><tspan x="300.0" dy="15.6">// 2. Експортована фабрична функція</tspan><tspan x="300.0" dy="15.6">export SocketHandle open_socket(const char* url);</tspan></text>
<text x="300.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">SocketHandle НЕ позначено як export</text>
<text x="300.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Його ім'я залишається невидимим поза модулем</text>
<line x1="545.0" y1="240.0" x2="695.0" y2="240.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="620.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">import network;</text>
<text x="940.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поведінка в коді клієнта (main.cpp)</text>
<rect x="700.0" y="130.0" width="480.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="940.0" y="161.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">// ❌ НЕВИДИМІСТЬ (Visibility: False)</tspan><tspan x="940.0" dy="15.6">SocketHandle sock = open_socket(&quot;...&quot;);</tspan><tspan x="940.0" dy="15.6">// Помилка: ім'я 'SocketHandle' не знайдено в таблиці імен</tspan></text>
<rect x="700.0" y="230.0" width="480.0" height="125.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="940.0" y="273.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">//  ДОСЯЖНІСТЬ (Reachability: True)</tspan><tspan x="940.0" dy="15.6">auto sock = open_socket(&quot;...&quot;); // Тип виведено через auto</tspan><tspan x="940.0" dy="15.6">sock.send_bytes(&quot;ping&quot;, 4);     // OK! Методи й поля відомі</tspan><tspan x="940.0" dy="15.6">size_t sz = sizeof(sock);       // OK! Розмір структури відомий</tspan></text>
<text x="940.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Компілятор володіє повним макетом типу (розмір, вирівнювання, vtable, методи),</text>
<text x="940.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">але лексичний пошук імен (Name Lookup) блокує пряме використання неекспортованого ідентифікатора.</text>
</svg>