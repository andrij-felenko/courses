<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр збірки модулів C++20 та протокол P1689</text>
<text x="620.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр збірки модулів: динамічне сканування (P1689R5) та топологічний порядок</text>
<text x="620.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Чому бінарний інтерфейс (BMI) мусить бути згенерований раніше, ніж почнеться компіляція споживача</text>
<rect x="50.0" y="110.0" width="180.0" height="240.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">1. Джерельні файли</tspan><tspan x="140.0" dy="15.6"></tspan><tspan x="140.0" dy="15.6">math.cppm</tspan><tspan x="140.0" dy="15.6">(export module math;)</tspan><tspan x="140.0" dy="15.6"></tspan><tspan x="140.0" dy="15.6">engine.cppm</tspan><tspan x="140.0" dy="15.6">(import math;)</tspan><tspan x="140.0" dy="15.6"></tspan><tspan x="140.0" dy="15.6">app.cpp</tspan><tspan x="140.0" dy="15.6">(import engine;)</tspan></text>
<line x1="235.0" y1="230.0" x2="295.0" y2="230.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="110.0" width="230.0" height="240.0" rx="6" fill="#fff4d6" stroke="#c0392b" stroke-width="1.5"/><text x="415.0" y="171.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">2. Сканування (Scan)</tspan><tspan x="415.0" dy="15.6">Компілятор: -scan-deps</tspan><tspan x="415.0" dy="15.6"></tspan><tspan x="415.0" dy="15.6">Швидкий препроцесорний</tspan><tspan x="415.0" dy="15.6">прохід шукає 'import' та</tspan><tspan x="415.0" dy="15.6">'export module' без повної</tspan><tspan x="415.0" dy="15.6">генерації коду.</tspan><tspan x="415.0" dy="15.6"></tspan><tspan x="415.0" dy="15.6">Формує JSON за P1689R5</tspan></text>
<line x1="535.0" y1="230.0" x2="595.0" y2="230.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="600.0" y="110.0" width="240.0" height="240.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="720.0" y="171.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">3. Граф робіт (Ninja)</tspan><tspan x="720.0" dy="15.6"></tspan><tspan x="720.0" dy="15.6">Топологічне сортування:</tspan><tspan x="720.0" dy="15.6"></tspan><tspan x="720.0" dy="15.6">1) Збірка math.pcm (BMI)</tspan><tspan x="720.0" dy="15.6">2) Збірка engine.pcm</tspan><tspan x="720.0" dy="15.6">   (вимагає math.pcm)</tspan><tspan x="720.0" dy="15.6">3) Збірка app.o</tspan><tspan x="720.0" dy="15.6">   (вимагає engine.pcm)</tspan></text>
<line x1="845.0" y1="230.0" x2="905.0" y2="230.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="910.0" y="110.0" width="280.0" height="240.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="1050.0" y="156.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">4. Виконання компіляції</tspan><tspan x="1050.0" dy="15.6"></tspan><tspan x="1050.0" dy="15.6">Крок A: Генерація BMI</tspan><tspan x="1050.0" dy="15.6">math.pcm -&gt; engine.pcm</tspan><tspan x="1050.0" dy="15.6"></tspan><tspan x="1050.0" dy="15.6">Крок B: Компіляція коду</tspan><tspan x="1050.0" dy="15.6">math.o, engine.o, app.o</tspan><tspan x="1050.0" dy="15.6">(може йти паралельно)</tspan><tspan x="1050.0" dy="15.6"></tspan><tspan x="1050.0" dy="15.6">Крок C: Лінкування</tspan><tspan x="1050.0" dy="15.6">app (виконуваний бінарник)</tspan></text>
<rect x="50.0" y="385.0" width="1140.0" height="70.0" rx="6" fill="#fafbfc" stroke="#6b7280" stroke-width="1.0"/>
<text x="620.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключова зміна: у класичному C++ усі .cpp компілювалися повністю паралельно без взаємного очікування.</text>
<text x="620.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">У модульному C++ поява бінарного інтерфейсу (BMI) вводить строгий порядок компіляції інтерфейсів до споживачів.</text>
</svg>