<rect x="70.0" y="446.0" width="800.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="476.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="470.0" dy="0.0">виняток на кроці 3: кроки 2 і 1 руйнуються у зворотному порядку, а тіло ~Widget() не виконається зовсім</tspan></text>
