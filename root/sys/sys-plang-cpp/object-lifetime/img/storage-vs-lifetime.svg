<text x="450.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Вказівник на ці байти дійсний увесь час — але «об'єктом» вони є лише в зеленому проміжку.</text>
