<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектурні стовпи стандарту C++17</text>
<text x="470.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0b0c0c" text-anchor="middle" font-weight="700">Архітектурні стовпи стандарту C++17 (ISO/IEC 14882:2017)</text>
<rect x="363.3" y="51.6" width="213.4" height="66.8" rx="6" fill="#ffffff" stroke="#333333" stroke-width="2.0"/><text x="470.0" y="72.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">C++17</tspan><tspan x="470.0" dy="16.9">Практичність, ергономіка</tspan><tspan x="470.0" dy="16.9">та словникові типи</tspan></text>
<rect x="50.0" y="152.8" width="320.0" height="94.4" rx="6" fill="#eef6fc" stroke="#1d70b8" stroke-width="1.5"/><text x="210.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Синтаксична ергономіка ядра</tspan><tspan x="210.0" dy="15.6">• auto [a, b] = ... (Structured Bindings)</tspan><tspan x="210.0" dy="15.6">• if / switch (init; condition)</tspan><tspan x="210.0" dy="15.6">• inline-змінні для заголовочних файлів</tspan><tspan x="210.0" dy="15.6">• Спрощені вкладені простори назв A::B::C</tspan></text>
<rect x="570.0" y="152.8" width="320.0" height="94.4" rx="6" fill="#f3f0fc" stroke="#6f42c1" stroke-width="1.5"/><text x="730.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Шаблони та метапрограмування</tspan><tspan x="730.0" dy="15.6">• if constexpr (усунення гілок без SFINAE)</tspan><tspan x="730.0" dy="15.6">• Fold Expressions: (... + args)</tspan><tspan x="730.0" dy="15.6">• CTAD: виведення аргументів класів</tspan><tspan x="730.0" dy="15.6">• auto в нетипових параметрах шаблону</tspan></text>
<rect x="50.0" y="342.8" width="320.0" height="94.4" rx="6" fill="#fdf2e9" stroke="#d35400" stroke-width="1.5"/><text x="210.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Життєвий цикл і матеріалізація</tspan><tspan x="210.0" dy="15.6">• Гарантований пропуск копіювання (RVO)</tspan><tspan x="210.0" dy="15.6">• prvalue як інструкція ініціалізації</tspan><tspan x="210.0" dy="15.6">• Повернення non-movable типів за значенням</tspan><tspan x="210.0" dy="15.6">• Строгий порядок обчислення виразів</tspan></text>
<rect x="570.0" y="342.8" width="320.0" height="94.4" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Стандартна бібліотека (STL)</tspan><tspan x="730.0" dy="15.6">• std::optional, std::variant, std::any</tspan><tspan x="730.0" dy="15.6">• std::string_view (безкоштовний зріз)</tspan><tspan x="730.0" dy="15.6">• std::filesystem (кросплатформні файли)</tspan><tspan x="730.0" dy="15.6">• &lt;execution&gt;: паралельні алгоритми STL</tspan></text>
<line x1="390.0" y1="110.0" x2="270.0" y2="152.8" stroke="#1d70b8" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="550.0" y1="110.0" x2="670.0" y2="152.8" stroke="#6f42c1" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="390.0" y1="115.0" x2="270.0" y2="342.8" stroke="#d35400" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="550.0" y1="115.0" x2="670.0" y2="342.8" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="470.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Стандарт C++17 усунув щоденний шаблонний шум і дав уніфіковані типи для надійного системного коду</text>
</svg>