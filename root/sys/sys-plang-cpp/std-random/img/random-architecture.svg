<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двошарова архітектура бібліотеки std::random у C++</text>
<rect x="30.0" y="40.0" width="380.0" height="290.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="220.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Застарілий підхід (C stdlib)</text>
<rect x="166.6" y="103.0" width="106.8" height="34.0" rx="6" fill="#ffe3e3" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="124.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">rand() % N</tspan></text>
<text x="220.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">❌ Модульне зміщення (Modulo Bias)</tspan><tspan x="220.0" dy="18.2">❌ Глобальний прихований стан (не thread-safe)</tspan><tspan x="220.0" dy="18.2">❌ Лише рівномірне цілочисельне значення</tspan><tspan x="220.0" dy="18.2">❌ Низька якість молодших бітів в LCG</tspan></text>
<rect x="440.0" y="40.0" width="450.0" height="290.0" rx="8" fill="#f4faf5" stroke="#27ae60" stroke-width="1.5"/>
<text x="665.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Двошарова модель C++11 &lt;random&gt;</text>
<rect x="510.5" y="86.6" width="309.0" height="66.8" rx="6" fill="#e8f8ed" stroke="#27ae60" stroke-width="1.5"/><text x="665.0" y="107.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">1. Джерело бітів (Engine / URBG)</tspan><tspan x="665.0" dy="16.9">std::mt19937 / std::random_device</tspan><tspan x="665.0" dy="16.9">Генерує псевдовипадкові цілі [min, max]</tspan></text>
<line x1="665.0" y1="160.0" x2="665.0" y2="195.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="680.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="left" font-style="italic">сирі біти</text>
<rect x="484.6" y="211.6" width="360.9" height="66.8" rx="6" fill="#d2f1da" stroke="#27ae60" stroke-width="1.5"/><text x="665.0" y="232.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">2. Математичний розподіл (Distribution)</tspan><tspan x="665.0" dy="16.9">uniform_int_distribution / normal_distribution</tspan><tspan x="665.0" dy="16.9">Перетворює біти у цільовий діапазон і форму</tspan></text>
<text x="460.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Чиста сепарація відповідальностей: генератор дає ентропію, розподіл дає форму</text>
</svg>