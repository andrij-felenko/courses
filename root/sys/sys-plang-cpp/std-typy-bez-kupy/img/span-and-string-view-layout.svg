<rect x="40.0" y="260.0" width="420.0" height="215.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="335.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Властивості std::span:</tspan><tspan x="250.0" dy="14.3">• Не володіє пам'яттю, розмір 2 слова (8 або 16 байтів)</tspan><tspan x="250.0" dy="14.3">• Передається у регістри процесора без копіювання буфера</tspan><tspan x="250.0" dy="14.3">• Безпечний поділ: frame.subspan(4, 24) формує зріз за O(1)</tspan><tspan x="250.0" dy="14.3">• Захист від втрати довжини: завжди знає власні межі</tspan><tspan x="250.0" dy="14.3">• Перетворюється на типізовані байти через std::as_bytes</tspan></text>
