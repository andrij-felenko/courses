<rect x="717.0" y="228.0" width="201.0" height="18.0" rx="6" fill="#eafaf1" stroke="#eafaf1" stroke-width="1.5"/><text x="817.5" y="240.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="817.5" dy="0.0">кількість символів (без '\0')</tspan></text>
<rect x="500.0" y="260.0" width="420.0" height="215.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="335.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Властивості std::string_view:</tspan><tspan x="710.0" dy="14.3">• Нульовий термінатор '\0' НЕ потрібен для роботи</tspan><tspan x="710.0" dy="14.3">• Не модифікує вхідний буфер (на відміну від C-функції strtok)</tspan><tspan x="710.0" dy="14.3">• Дозволяє безпечний парсинг Flash-пам'яті (ROM) та ОЗП</tspan><tspan x="710.0" dy="14.3">• Методи remove_prefix / remove_suffix зсувають вікно за O(1)</tspan><tspan x="710.0" dy="14.3">• Порівняння payload == &quot;+GPS&quot; виконується без алокації</tspan></text>
