<rect x="40.0" y="25.0" width="420.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="47.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Динамічна купа: фрагментація та небезпека</tspan></text>
<rect x="500.0" y="25.0" width="420.0" height="36.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="47.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Freestanding без купи: детермінована пам'ять</tspan></text>
<rect x="40.0" y="75.0" width="420.0" height="26.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="250.0" y="91.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">ОЗП мікроконтролера з купою (malloc / new / std::vector)</tspan></text>
