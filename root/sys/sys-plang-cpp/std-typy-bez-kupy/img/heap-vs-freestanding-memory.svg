<rect x="195.0" y="110.0" width="120.0" height="50.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/>
<rect x="197.0" y="122.0" width="116.0" height="26.0" rx="6" fill="#fadbd8" stroke="#fadbd8" stroke-width="1.5"/><text x="255.0" y="138.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">Зайнято: obj2 (128 Б)</tspan></text>
<rect x="315.0" y="110.0" width="70.0" height="50.0" rx="6" fill="#eaecee" stroke="#6b7280" stroke-width="1.5"/>
<rect x="317.0" y="122.0" width="66.0" height="26.0" rx="6" fill="#eaecee" stroke="#eaecee" stroke-width="1.5"/><text x="350.0" y="138.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Дірка (48 Б)</tspan></text>
<rect x="385.0" y="110.0" width="75.0" height="50.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/>
<rect x="387.0" y="122.0" width="71.0" height="26.0" rx="6" fill="#fadbd8" stroke="#fadbd8" stroke-width="1.5"/><text x="422.5" y="138.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="422.5" dy="0.0">obj3 (64 Б)</tspan></text>
<rect x="40.0" y="175.0" width="420.0" height="120.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="217.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">• Невизначений час алокації: O(N) пошук вільного блоку</tspan><tspan x="250.0" dy="14.3">• Фрагментація RAM: пам'ять є, але неперервного шматка нема</tspan><tspan x="250.0" dy="14.3">• Ризик вичерпання пам'яті (OOM) і раптового аварійного збою</tspan><tspan x="250.0" dy="14.3">• Заборонено в MISRA C++, DO-178C та ISO 26262</tspan></text>
<rect x="40.0" y="310.0" width="420.0" height="180.0" rx="6" fill="#fdf2e9" stroke="#e67e22" stroke-width="1.5"/><text x="250.0" y="375.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Ціна покажчиків і метаданих:</tspan><tspan x="250.0" dy="14.3">Кожен блок у купі вимагає прихованого заголовка (8–16 байтів)</tspan><tspan x="250.0" dy="14.3">із розміром та прапорцями стану. При частих дрібних виділеннях</tspan><tspan x="250.0" dy="14.3">накладні витрати пам'яті перевищують обсяг корисних даних,</tspan><tspan x="250.0" dy="14.3">а збій виділення в обробнику переривання веде до паніки ядра.</tspan></text>
<rect x="500.0" y="75.0" width="420.0" height="26.0" rx="6" fill="#eef2f7" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="91.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Статичні області пам'яті та безпечні проєкції</tspan></text>
<rect x="500.0" y="110.0" width="130.0" height="50.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/>
<rect x="502.0" y="113.0" width="126.0" height="22.0" rx="6" fill="#d4edda" stroke="#d4edda" stroke-width="1.5"/><text x="565.0" y="127.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="565.0" dy="0.0">Flash (.rodata)</tspan></text>
<rect x="502.0" y="135.0" width="126.0" height="22.0" rx="6" fill="#d4edda" stroke="#d4edda" stroke-width="1.5"/><text x="565.0" y="149.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">constexpr таблиці</tspan></text>
<rect x="640.0" y="110.0" width="135.0" height="50.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/>
<rect x="642.0" y="113.0" width="131.0" height="22.0" rx="6" fill="#d4edda" stroke="#d4edda" stroke-width="1.5"/><text x="707.5" y="127.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="707.5" dy="0.0">Static RAM (.bss)</tspan></text>
<rect x="642.0" y="135.0" width="131.0" height="22.0" rx="6" fill="#d4edda" stroke="#d4edda" stroke-width="1.5"/><text x="707.5" y="149.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="707.5" dy="0.0">std::array (DMA буфери)</tspan></text>
<rect x="785.0" y="110.0" width="135.0" height="50.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/>
<rect x="787.0" y="113.0" width="131.0" height="22.0" rx="6" fill="#d4edda" stroke="#d4edda" stroke-width="1.5"/><text x="852.5" y="127.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="852.5" dy="0.0">Стек процесу</tspan></text>
<rect x="787.0" y="135.0" width="131.0" height="22.0" rx="6" fill="#d4edda" stroke="#d4edda" stroke-width="1.5"/><text x="852.5" y="149.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="852.5" dy="0.0">std::optional / variant</tspan></text>
<rect x="500.0" y="175.0" width="420.0" height="120.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">• Гарантований час доступу O(1) без викликів системного алокатора</tspan><tspan x="710.0" dy="13.0">• Нульова фрагментація: розміри визначено на етапі компіляції</tspan><tspan x="710.0" dy="13.0">• Неволодіючі проєкції: std::span та std::string_view над буферами</tspan><tspan x="710.0" dy="13.0">• Значеннєва семантика: збереження об'єктів безпосередньо за місцем</tspan></text>
<rect x="500.0" y="310.0" width="420.0" height="180.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="377.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Механізм нульових накладних витрат (Zero-overhead):</tspan><tspan x="710.0" dy="13.0">Об'єкти std::array та std::optional розміщуються безпосередньо</tspan><tspan x="710.0" dy="13.0">у стек-фреймі чи статичному секторі пам'яті. Проєкції std::span</tspan><tspan x="710.0" dy="13.0">і std::string_view передаються в регістрах процесора без жодного</tspan><tspan x="710.0" dy="13.0">копіювання байтів чи динамічного захоплення пам'яті.</tspan></text>
</svg>