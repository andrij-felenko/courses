<rect x="517.0" y="135.0" width="246.0" height="20.0" rx="6" fill="#d4edda" stroke="#d4edda" stroke-width="1.5"/><text x="640.0" y="148.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Data (16 Б) | Error (4 Б) | Ping (1 Б)</tspan></text>
<rect x="770.0" y="110.0" width="70.0" height="50.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.2"/>
<rect x="772.0" y="115.0" width="66.0" height="20.0" rx="6" fill="#fadbd8" stroke="#fadbd8" stroke-width="1.5"/><text x="805.0" y="128.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">index_</tspan></text>
<rect x="772.0" y="135.0" width="66.0" height="20.0" rx="6" fill="#fadbd8" stroke="#fadbd8" stroke-width="1.5"/><text x="805.0" y="148.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">дискримінант</tspan></text>
<rect x="845.0" y="110.0" width="60.0" height="50.0" rx="6" fill="#eaecee" stroke="#6b7280" stroke-width="1.2"/>
<rect x="847.0" y="115.0" width="56.0" height="20.0" rx="6" fill="#eaecee" stroke="#eaecee" stroke-width="1.5"/><text x="875.0" y="128.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="875.0" dy="0.0">pad</tspan></text>
<rect x="847.0" y="135.0" width="56.0" height="20.0" rx="6" fill="#eaecee" stroke="#eaecee" stroke-width="1.5"/><text x="875.0" y="148.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="875.0" dy="0.0">3 байти</tspan></text>
<rect x="500.0" y="190.0" width="420.0" height="260.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Семантика та життєвий цикл std::variant:</tspan><tspan x="710.0" dy="11.7">• Об'єднує альтернативні типи без динамічного виділення пам'яті</tspan><tspan x="710.0" dy="11.7">• Зберігає активний індекс типу (index_ = 0, 1, 2...)</tspan><tspan x="710.0" dy="11.7">• Безпека типів: не дозволяє прочитати помилковий тип (std::holds_alternative)</tspan><tspan x="710.0" dy="11.7">• Обробка подій через std::visit або патерн Overload без віртуальних таблиць</tspan><tspan x="710.0" dy="11.7">• Економія пам'яті: альтернативи використовують один і той самий блок ОЗП</tspan><tspan x="710.0" dy="11.7">• Повна сумісність із freestanding за відсутності винятків</tspan></text>
</svg>