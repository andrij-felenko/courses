<rect x="345.0" y="110.0" width="100.0" height="50.0" rx="6" fill="#eaecee" stroke="#6b7280" stroke-width="1.2"/>
<rect x="347.0" y="115.0" width="96.0" height="20.0" rx="6" fill="#eaecee" stroke="#eaecee" stroke-width="1.5"/><text x="395.0" y="128.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">padding</tspan></text>
<rect x="347.0" y="135.0" width="96.0" height="20.0" rx="6" fill="#eaecee" stroke="#eaecee" stroke-width="1.5"/><text x="395.0" y="148.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="395.0" dy="0.0">вирівнювання 3 Б</tspan></text>
<rect x="40.0" y="190.0" width="420.0" height="260.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="284.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Семантика та життєвий цикл std::optional:</tspan><tspan x="250.0" dy="13.0">• Пам'ять під об'єкт T зарезервована всередині структури заздалегідь</tspan><tspan x="250.0" dy="13.0">• Конструктор T викликається через placement new ТІЛЬКИ при емпласі</tspan><tspan x="250.0" dy="13.0">• При відсутності значення прапорець has_value = false</tspan><tspan x="250.0" dy="13.0">• Деструктор ~T() викликається явно при reset() або знищенні</tspan><tspan x="250.0" dy="13.0">• Повна відсутність магічних констант помилок (-1, 0xFFFFFFFF, NULL)</tspan><tspan x="250.0" dy="13.0">• Ідеально для повернення результатів читання АЦП чи парсингу</tspan></text>
<rect x="500.0" y="25.0" width="420.0" height="36.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="47.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">std::variant&lt;Data, Error, Ping&gt;: типізований союз</tspan></text>
<rect x="500.0" y="75.0" width="420.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<rect x="505.0" y="80.0" width="410.0" height="22.0" rx="6" fill="#eef2f7" stroke="#eef2f7" stroke-width="1.5"/><text x="710.0" y="94.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Розмір: max(sizeof(Ti)) + sizeof(index) + padding = 20 Б</tspan></text>
<rect x="515.0" y="110.0" width="250.0" height="50.0" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="1.2"/>
