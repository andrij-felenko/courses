<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 555" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="555" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один і той самий constexpr обчислюється або компілятором, або процесором</text>
<rect x="310.0" y="40.0" width="400.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="72.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">constexpr int square(int x) { return x * x; }</tspan></text>
<line x1="430.0" y1="98.0" x2="250.0" y2="148.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="590.0" y1="98.0" x2="770.0" y2="148.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="156.0" width="320.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="184.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">контекст вимагає сталої</tspan><tspan x="200.0" dy="15.6">static_assert(square(7) == 49)</tspan></text>
<line x1="200.0" y1="222.0" x2="200.0" y2="266.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="272.0" width="320.0" height="64.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="200.0" y="300.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">обчислювач сталих</tspan><tspan x="200.0" dy="16.9">усередині компілятора</tspan></text>
<line x1="200.0" y1="338.0" x2="200.0" y2="382.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="388.0" width="320.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="420.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">у код лягає готове 49</tspan></text>
<rect x="660.0" y="156.0" width="320.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="184.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">звичайний контекст</tspan><tspan x="820.0" dy="15.6">int m = square(n);</tspan></text>
<line x1="820.0" y1="222.0" x2="820.0" y2="266.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="660.0" y="272.0" width="320.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="820.0" y="300.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">звичайна функція</tspan><tspan x="820.0" dy="16.9">в машинному коді</tspan></text>
<line x1="820.0" y1="338.0" x2="820.0" y2="382.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="660.0" y="388.0" width="320.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="420.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">множення в час виконання</tspan></text>
<text x="510.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="510.0" dy="0.0">Шлях обирає не ключове слово, а місце виклику.</tspan><tspan x="510.0" dy="16.5">Правий шлях оптимізатор теж може згорнути — але це вже правило «ніби»,</tspan><tspan x="510.0" dy="16.5">а не обіцянка мови.</tspan></text>
</svg>