<rect x="654.0" y="116.0" width="222.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="765.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">a:    data → блок B</tspan></text>
<rect x="654.0" y="156.0" width="222.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="765.0" y="178.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">rhs знищено, A звільнено</tspan></text>
<rect x="654.0" y="212.0" width="222.0" height="110.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="765.0" y="255.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="765.0" dy="0.0">деструктор параметра</tspan><tspan x="765.0" dy="15.6">віддає старе — і про це</tspan><tspan x="765.0" dy="15.6">в операторі жодного рядка</tspan></text>
<text x="460.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Оператор не згадує ні new, ні delete: копію робить конструктор, звільнення — деструктор параметра.</text>
