<rect x="349.0" y="116.0" width="222.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">a:    data → блок B</tspan></text>
<rect x="349.0" y="156.0" width="222.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="178.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">rhs:  data → блок A</tspan></text>
<rect x="349.0" y="212.0" width="222.0" height="110.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="460.0" y="255.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="460.0" dy="0.0">обмін вказівника й числа:</tspan><tspan x="460.0" dy="15.6">noexcept, зірватися</tspan><tspan x="460.0" dy="15.6">вже нічому</tspan></text>
