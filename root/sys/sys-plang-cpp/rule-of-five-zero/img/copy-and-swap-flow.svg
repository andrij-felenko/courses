<rect x="44.0" y="116.0" width="222.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">a:    data → блок A</tspan></text>
<rect x="44.0" y="156.0" width="222.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="178.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">rhs:  data → блок B</tspan></text>
<rect x="44.0" y="212.0" width="222.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="155.0" y="255.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="155.0" dy="0.0">кинути може лише цей крок;</tspan><tspan x="155.0" dy="15.6">*this ще не змінено —</tspan><tspan x="155.0" dy="15.6">звідси сильна гарантія</tspan></text>
