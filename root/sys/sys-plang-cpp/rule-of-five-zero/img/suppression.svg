<rect x="562.0" y="244.0" width="218.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="671.0" y="268.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="671.0" dy="0.0">будь-яка копія —</tspan><tspan x="671.0" dy="18.2">відмова</tspan></text>
