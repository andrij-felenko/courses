<rect x="40.0" y="156.0" width="740.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="183.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">ТИХО: збирається, працює правильно — просто копіює там, де мав переміщувати</tspan></text>
<rect x="40.0" y="244.0" width="200.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="268.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">оголошено</tspan><tspan x="140.0" dy="18.2">Widget(Widget&amp;&amp;)</tspan></text>
