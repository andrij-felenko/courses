<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 452" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="452" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки компілятор знає, на які частини ділити</text>
<rect x="30.0" y="58.0" width="322.0" height="70.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="191.0" y="98.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="191.0" dy="0.0">коли застосовується</tspan></text>
<rect x="360.0" y="58.0" width="192.0" height="70.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="456.0" y="88.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="456.0" dy="0.0">скільки імен</tspan><tspan x="456.0" dy="19.5">має бути</tspan></text>
<rect x="560.0" y="58.0" width="292.0" height="70.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="706.0" y="88.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="706.0" dy="0.0">як компілятор дістає</tspan><tspan x="706.0" dy="19.5">i-ту частину</tspan></text>
<rect x="860.0" y="58.0" width="282.0" height="70.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.5"/><text x="1001.0" y="98.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1001.0" dy="0.0">що дає decltype(iм'я)</tspan></text>
<rect x="30.0" y="136.0" width="322.0" height="80.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="191.0" y="181.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="191.0" dy="0.0">E — масив T[N]</tspan></text>
<rect x="360.0" y="136.0" width="192.0" height="80.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="456.0" y="181.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="456.0" dy="0.0">рівно N</tspan></text>
<rect x="560.0" y="136.0" width="292.0" height="80.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="706.0" y="181.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="706.0" dy="0.0">e[i]</tspan></text>
<rect x="860.0" y="136.0" width="282.0" height="80.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="1001.0" y="181.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1001.0" dy="0.0">T — тип елемента</tspan></text>
<rect x="30.0" y="224.0" width="322.0" height="80.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="191.0" y="259.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="191.0" dy="0.0">std::tuple_size&lt;E&gt;</tspan><tspan x="191.0" dy="19.5">— повний тип</tspan></text>
<rect x="360.0" y="224.0" width="192.0" height="80.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="456.0" y="260.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="456.0" dy="0.0">стільки, скільки каже</tspan><tspan x="456.0" dy="15.6">std::tuple_size&lt;E&gt;::value</tspan></text>
<rect x="560.0" y="224.0" width="292.0" height="80.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="706.0" y="259.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="706.0" dy="0.0">e.get&lt;i&gt;()</tspan><tspan x="706.0" dy="19.5">або get&lt;i&gt;(e) через ADL</tspan></text>
<rect x="860.0" y="224.0" width="282.0" height="80.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="1001.0" y="259.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1001.0" dy="0.0">std::tuple_element&lt;i, E&gt;::type</tspan><tspan x="1001.0" dy="19.5">(може бути посиланням)</tspan></text>
<rect x="30.0" y="312.0" width="322.0" height="80.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="191.0" y="347.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="191.0" dy="0.0">усі нестатичні поля E</tspan><tspan x="191.0" dy="19.5">лежать в одному класі</tspan></text>
<rect x="360.0" y="312.0" width="192.0" height="80.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="456.0" y="357.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="456.0" dy="0.0">скільки полів</tspan></text>
<rect x="560.0" y="312.0" width="292.0" height="80.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="706.0" y="347.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="706.0" dy="0.0">e.поле</tspan><tspan x="706.0" dy="19.5">(у порядку оголошення)</tspan></text>
<rect x="860.0" y="312.0" width="282.0" height="80.0" rx="6" fill="#f7f9fb" stroke="#333333" stroke-width="1.5"/><text x="1001.0" y="357.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1001.0" dy="0.0">тип поля</tspan></text>
<text x="590.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">порядок перевірки саме такий: масив → tuple_size → поля; жоден із них не «майже підходить»</text>
</svg>