<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Синтез кандидатів виведення у механізмі CTAD</text>
<rect x="53.1" y="61.0" width="253.7" height="118.0" rx="6" fill="#eef4ff" stroke="#6b7280" stroke-width="1.5"/><text x="180.0" y="85.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Шаблон класу та конструктори</tspan><tspan x="180.0" dy="15.6">template&lt;typename T&gt;</tspan><tspan x="180.0" dy="15.6">struct Vector {</tspan><tspan x="180.0" dy="15.6">  Vector(T val);</tspan><tspan x="180.0" dy="15.6">  Vector(const T* b, const T* e);</tspan><tspan x="180.0" dy="15.6">};</tspan></text>
<text x="180.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Первинний шаблон класу</text>
<rect x="350.7" y="25.8" width="338.6" height="98.4" rx="6" fill="#f7f9fb" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Неявні кандидати CTAD (Implicit)</tspan><tspan x="520.0" dy="15.6">template&lt;typename T&gt;</tspan><tspan x="520.0" dy="15.6">auto __f(T val) -&gt; Vector&lt;T&gt;;</tspan><tspan x="520.0" dy="15.6">template&lt;typename T&gt;</tspan><tspan x="520.0" dy="15.6">auto __f(const T* b, const T* e) -&gt; Vector&lt;T&gt;;</tspan></text>
<rect x="316.5" y="153.6" width="407.0" height="82.8" rx="6" fill="#fff8e1" stroke="#b8860b" stroke-width="1.5"/><text x="520.0" y="175.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Явні правила виведення (Deduction Guides)</tspan><tspan x="520.0" dy="15.6">template&lt;typename Iter&gt;</tspan><tspan x="520.0" dy="15.6">Vector(Iter b, Iter e)</tspan><tspan x="520.0" dy="15.6">  -&gt; Vector&lt;typename iterator_traits&lt;Iter&gt;::value_type&gt;;</tspan></text>
<rect x="716.9" y="87.2" width="306.2" height="95.7" rx="6" fill="#eaf7ee" stroke="#c0392b" stroke-width="1.5"/><text x="870.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">Спільний набір перевантажень</tspan><tspan x="870.0" dy="16.9">Overload Resolution</tspan><tspan x="870.0" dy="16.9">Знаходження найкращого кандидата</tspan><tspan x="870.0" dy="16.9">⇒ Створення спеціалізації Vector&lt;int&gt;</tspan></text>
<text x="870.0" y="71.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Результат вирішення виклику</text>
<line x1="316.9" y1="100.0" x2="340.7" y2="75.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="316.9" y1="140.0" x2="306.5" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="699.3" y1="75.0" x2="706.9" y2="115.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="733.5" y1="195.0" x2="706.9" y2="155.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="150.3" y="292.6" width="739.4" height="74.8" rx="6" fill="#f0f4f8" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="317.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Ініціалізація: Vector v(arr, arr + 10);</tspan><tspan x="520.0" dy="16.9">Компілятор формує уявний набір перевантажень функцій, запускає звичайне виведення типів функцій,</tspan><tspan x="520.0" dy="16.9">обирає найбільш спеціалізований кандидат (Deduction Guide) і підставляє виведений тип у клас.</tspan></text>
</svg>