<rect x="390.0" y="174.0" width="420.0" height="78.0" rx="6" fill="#f8f9fb" stroke="#6b7280" stroke-width="1.5"/><text x="600.0" y="217.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">T a;  ...  return a;</tspan></text>
