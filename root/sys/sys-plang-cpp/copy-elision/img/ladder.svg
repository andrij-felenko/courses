<rect x="30.0" y="78.0" width="340.0" height="78.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="200.0" y="112.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Гарантовано мовою (з C++17)</tspan><tspan x="200.0" dy="18.2">нічого усувати не треба</tspan></text>
<rect x="390.0" y="78.0" width="420.0" height="78.0" rx="6" fill="#f8f9fb" stroke="#6b7280" stroke-width="1.5"/><text x="600.0" y="121.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">return T(args);   T x = make();</tspan></text>
