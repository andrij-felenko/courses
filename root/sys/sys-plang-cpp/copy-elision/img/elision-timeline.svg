<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від дозволу не копіювати до обіцянки, що копії немає</text>
<rect x="30.0" y="40.0" width="150.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="105.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">1991</tspan></text>
<rect x="200.0" y="40.0" width="790.0" height="70.0" rx="6" fill="#f8f9fb" stroke="#6b7280" stroke-width="1.5"/><text x="595.0" y="71.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Zortech C++ Волтера Брайта: усунення копії для іменованої змінної</tspan><tspan x="595.0" dy="16.9">реалізовано без обіцяного розширення мови</tspan></text>
<rect x="30.0" y="126.0" width="150.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="105.0" y="166.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">1998</tspan></text>
<rect x="200.0" y="126.0" width="790.0" height="70.0" rx="6" fill="#f8f9fb" stroke="#6b7280" stroke-width="1.5"/><text x="595.0" y="157.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">C++98, 12.8/15 — перший дозвіл: копію вільно не робити,</tspan><tspan x="595.0" dy="16.9">«навіть якщо конструктор чи деструктор мають побічні дії»</tspan></text>
<rect x="30.0" y="212.0" width="150.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="105.0" y="252.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">2004</tspan></text>
<rect x="200.0" y="212.0" width="790.0" height="70.0" rx="6" fill="#f8f9fb" stroke="#6b7280" stroke-width="1.5"/><text x="595.0" y="243.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Стенлі Ліппман публічно формулює головну ваду дозволу:</tspan><tspan x="595.0" dy="16.9">за текстом програми неможливо дізнатися, чи він застосований</tspan></text>
<rect x="30.0" y="298.0" width="150.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="105.0" y="338.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">2011</tspan></text>
<rect x="200.0" y="298.0" width="790.0" height="70.0" rx="6" fill="#f8f9fb" stroke="#6b7280" stroke-width="1.5"/><text x="595.0" y="329.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">C++11 — неявне переміщення як запасний хід: коли усунути не вийшло,</tspan><tspan x="595.0" dy="16.9">копіювання замінюють переміщенням; об'єктів усе одно два</tspan></text>
<rect x="30.0" y="384.0" width="150.0" height="70.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="105.0" y="424.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">2015–16</tspan></text>
<rect x="200.0" y="384.0" width="790.0" height="70.0" rx="6" fill="#f8f9fb" stroke="#6b7280" stroke-width="1.5"/><text x="595.0" y="415.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">P0135 Річарда Сміта: замість нового дозволу — переозначення prvalue.</tspan><tspan x="595.0" dy="16.9">R0 — вересень 2015, R1 — 20 червня 2016, ухвалено в Оулу → C++17</tspan></text>
<rect x="30.0" y="470.0" width="150.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="105.0" y="510.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">2020–21</tspan></text>
<rect x="200.0" y="470.0" width="790.0" height="70.0" rx="6" fill="#f8f9fb" stroke="#6b7280" stroke-width="1.5"/><text x="595.0" y="501.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">P2025 Антона Жиліна: та сама гарантія для іменованої змінної.</tspan><tspan x="595.0" dy="16.9">Три редакції, статус «потребує доопрацювання», у стандарт не ввійшов</tspan></text>
</svg>