<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди дівається об'єкт, повернений за значенням</text>
<text x="480.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">Наївне читання тексту: три об'єкти, два копіювання</text>
<rect x="96.2" y="103.9" width="147.7" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="125.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">локальний об'єкт</tspan><tspan x="170.0" dy="18.2">у кадрі функції</tspan></text>
<rect x="434.1" y="103.9" width="91.8" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="125.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">повернене</tspan><tspan x="480.0" dy="18.2">значення</tspan></text>
<rect x="724.1" y="103.9" width="131.7" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="125.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">змінна в того,</tspan><tspan x="790.0" dy="18.2">хто викликав</tspan></text>
<line x1="255.8" y1="130.0" x2="422.1" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="537.9" y1="130.0" x2="712.1" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="339.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">копія</text>
<text x="625.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">копія</text>
<line x1="40.0" y1="205.0" x2="920.0" y2="205.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6,6"/>
<text x="480.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">Як воно влаштоване насправді: комірка одна</text>
<rect x="86.3" y="313.9" width="227.5" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="335.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">кадр функції:</tspan><tspan x="200.0" dy="18.2">будує об'єкт за покажчиком</tspan></text>
<rect x="594.3" y="304.8" width="251.4" height="70.4" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="326.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">комірка під результат</tspan><tspan x="720.0" dy="18.2">= змінна в того, хто викликав</tspan><tspan x="720.0" dy="18.2">(одна й та сама пам'ять)</tspan></text>
<line x1="327.7" y1="340.0" x2="580.3" y2="340.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="454.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="454.0" dy="0.0">прихований покажчик</tspan><tspan x="454.0" dy="16.2">на комірку результату</tspan></text>
</svg>