<text x="500.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9b2c2c" text-anchor="middle" font-weight="700">Результат: 3 тимчасові масиви в купі, 3 окремих цикли, 6 читань і 3 записи в RAM на елемент</text>
