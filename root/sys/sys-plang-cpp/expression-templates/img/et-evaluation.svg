<text x="380.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c53030" text-anchor="middle" font-weight="700">+ C</text>
<line x1="551.9" y1="130.0" x2="648.1" y2="130.0" stroke="#e53e3e" stroke-width="1.8" marker-end="url(#arrow)"/>
