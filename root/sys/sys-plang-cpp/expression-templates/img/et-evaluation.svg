<line x1="502.7" y1="360.0" x2="783.8" y2="360.0" stroke="#2f855a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="643.3" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#276749" text-anchor="middle" font-weight="700">operator= (Один цикл)</text>
<text x="500.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#22543d" text-anchor="middle" font-weight="700">Код циклу: for (i) result[i] = A[i] + B[i] + C[i] + D[i];  (0 буферів, 1 цикл, SIMD-векторизація)</text>
