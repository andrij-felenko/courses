<rect x="212.1" y="106.2" width="115.8" height="47.6" rx="6" fill="#fed7d7" stroke="#e53e3e" stroke-width="1.5"/><text x="270.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Тимчасовий T1</tspan><tspan x="270.0" dy="15.6">(Heap alloc 1)</tspan></text>
<rect x="432.1" y="106.2" width="115.8" height="47.6" rx="6" fill="#fed7d7" stroke="#e53e3e" stroke-width="1.5"/><text x="490.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Тимчасовий T2</tspan><tspan x="490.0" dy="15.6">(Heap alloc 2)</tspan></text>
<rect x="652.1" y="106.2" width="115.8" height="47.6" rx="6" fill="#fed7d7" stroke="#e53e3e" stroke-width="1.5"/><text x="710.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Тимчасовий T3</tspan><tspan x="710.0" dy="15.6">(Heap alloc 3)</tspan></text>
<rect x="877.8" y="113.5" width="64.5" height="33.0" rx="6" fill="#ffffff" stroke="#fc8181" stroke-width="1.5"/><text x="910.0" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">Result</tspan></text>
