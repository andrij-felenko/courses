<rect x="105.3" y="328.4" width="389.4" height="63.2" rx="6" fill="#ffffff" stroke="#48bb78" stroke-width="1.5"/><text x="300.0" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Об'єкт AST дерева типів (0 байтів алокацій):</tspan><tspan x="300.0" dy="15.6">VecAdd&lt;VecAdd&lt;VecAdd&lt;Vector, Vector&gt;, Vector&gt;, Vector&gt;</tspan><tspan x="300.0" dy="15.6">Зберігає лише const&amp; посилання на A, B, C, D</tspan></text>
