<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 816" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="816" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двадцять років двом словам: паперовий слід decltype і auto</text>
<line x1="210.0" y1="68.0" x2="210.0" y2="759.0" stroke="#6b7280" stroke-width="2.0"/>
<circle cx="210.0" cy="103.0" r="7.0" fill="#f3f3f3" stroke="#6b7280" stroke-width="2.0"/>
<text x="188.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1984</text>
<rect x="250.0" y="76.0" width="730.0" height="54.0" rx="6" fill="#f3f3f3" stroke="#6b7280" stroke-width="1.5"/><text x="615.0" y="98.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Cfront: виведення типу з ініціалізатора вже працює — і його прибирають</tspan><tspan x="615.0" dy="18.2">перешкода — сумісність із C, де auto означало тривалість зберігання</tspan></text>
<circle cx="210.0" cy="175.0" r="7.0" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<text x="188.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">квіт. 2003</text>
<rect x="250.0" y="148.0" width="730.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="615.0" y="170.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">N1478 «Decltype and auto» — Järvi, Stroustrup, Gregor, Siek</tspan><tspan x="615.0" dy="18.2">привід: тип результату шаблонної функції неможливо записати</tspan></text>
<circle cx="210.0" cy="247.0" r="7.0" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<text x="188.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">2003</text>
<rect x="250.0" y="220.0" width="730.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="615.0" y="242.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">N1527: те саме, але вже під іменем decltype</tspan><tspan x="615.0" dy="18.2">typeof зайняте розбіжними розширеннями компіляторів</tspan></text>
<circle cx="210.0" cy="319.0" r="7.0" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<text x="188.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">лист. 2004</text>
<rect x="250.0" y="292.0" width="730.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="615.0" y="314.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">N1737, Walter E. Brown: повернути кілька деклараторів</tspan><tspan x="615.0" dy="18.2">щоб можна було писати for (auto it = m.begin(), e = m.end(); …)</tspan></text>
<circle cx="210.0" cy="391.0" r="7.0" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<text x="188.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">квіт. 2006</text>
<rect x="250.0" y="364.0" width="730.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="615.0" y="386.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">N1984 — редакція, якою auto ввійшло в чернетку C++0x</tspan><tspan x="615.0" dy="18.2">auto й decltype відтоді рухаються окремими паперами</tspan></text>
<circle cx="210.0" cy="463.0" r="7.0" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<text x="188.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">2007</text>
<rect x="250.0" y="436.0" width="730.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="615.0" y="458.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">N2337 (синтаксис auto) і N2343 (формулювання decltype)</tspan><tspan x="615.0" dy="18.2">фічі перекладено мовою тексту стандарту</tspan></text>
<circle cx="210.0" cy="535.0" r="7.0" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<text x="188.0" y="540.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">лют. 2008</text>
<rect x="250.0" y="508.0" width="730.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="615.0" y="530.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">N2546: старе значення auto вилучено остаточно</tspan><tspan x="615.0" dy="18.2">у мільйонах рядків знайшли лише поодинокі вжитки</tspan></text>
<circle cx="210.0" cy="607.0" r="7.0" fill="#eaf7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="188.0" y="612.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">верес. 2011</text>
<rect x="250.0" y="580.0" width="730.0" height="54.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="615.0" y="602.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">C++11: auto й decltype стають частиною мови</tspan><tspan x="615.0" dy="18.2">GCC 4.3 має decltype, GCC 4.4 — auto; VC++ 2010 — обидва</tspan></text>
<circle cx="210.0" cy="679.0" r="7.0" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<text x="188.0" y="684.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">квіт. 2013</text>
<rect x="250.0" y="652.0" width="730.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="615.0" y="674.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">N3638, Jason Merrill: тип повернення звичайних функцій і decltype(auto)</tspan><tspan x="615.0" dy="18.2">реалізовано в GCC ще до ухвалення; увійшло в C++14</tspan></text>
<circle cx="210.0" cy="751.0" r="7.0" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<text x="188.0" y="756.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">лют. 2014</text>
<rect x="250.0" y="724.0" width="730.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="615.0" y="746.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">N3922: нові правила виведення з фігурних дужок</tspan><tspan x="615.0" dy="18.2">EWG визнала стару поведінку дефектом; чинне з C++17</tspan></text>
</svg>