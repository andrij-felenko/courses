<line x1="340.0" y1="115.0" x2="340.0" y2="170.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="140.0" y1="230.0" x2="340.0" y2="230.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="340.0" y1="245.0" x2="140.0" y2="245.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="240.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">A чекає на M2</text>
<text x="240.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">B чекає на M1</text>
<rect x="104.0" y="295.1" width="271.9" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="240.0" y="316.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Взаємний замок!</tspan><tspan x="240.0" dy="16.9">Обидва потоки заблоковані назавжди</tspan></text>
<rect x="568.1" y="77.5" width="263.8" height="35.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="700.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">std::scoped_lock lock(m1, m2);</tspan></text>
<rect x="559.3" y="174.1" width="281.3" height="51.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="196.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Алгоритм std::lock / deadlock-free:</tspan><tspan x="700.0" dy="16.9">впорядкування або спроба + відкат</tspan></text>
<rect x="559.3" y="294.1" width="281.3" height="51.9" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="2.0"/><text x="700.0" y="316.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Атомарне захоплення обох м'ютексів:</tspan><tspan x="700.0" dy="16.9">Дедлок технічно неможливий</tspan></text>
