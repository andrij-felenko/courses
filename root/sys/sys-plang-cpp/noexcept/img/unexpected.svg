<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порушення throw(A, B) ловилося аж у час виконання</text>
<rect x="330.0" y="62.0" width="380.0" height="54.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="93.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">функція з throw(A, B) кидає виняток типу C</tspan></text>
<line x1="520.0" y1="116.0" x2="520.0" y2="148.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="330.0" y="151.0" width="380.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">C — це A або B?</tspan></text>
<text x="258.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">так</text>
<line x1="330.0" y1="178.0" x2="200.0" y2="178.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20.0" y="151.0" width="180.0" height="54.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="110.0" y="182.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">летить далі</tspan></text>
<text x="534.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ні</text>
<line x1="520.0" y1="205.0" x2="520.0" y2="239.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="330.0" y="242.0" width="380.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="520.0" y="273.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">std::unexpected()</tspan></text>
<line x1="520.0" y1="296.0" x2="520.0" y2="326.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="310.0" y="329.0" width="420.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="358.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">поточний unexpected_handler</tspan></text>
<line x1="520.0" y1="379.0" x2="520.0" y2="398.0" stroke="#333333" stroke-width="1.5"/>
<line x1="136.0" y1="398.0" x2="904.0" y2="398.0" stroke="#333333" stroke-width="1.5"/>
<line x1="136.0" y1="398.0" x2="136.0" y2="418.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="15.0" y="421.0" width="242.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="136.0" y="463.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="136.0" dy="0.0">типовий handler:</tspan><tspan x="136.0" dy="14.3">std::terminate()</tspan></text>
<line x1="392.0" y1="398.0" x2="392.0" y2="418.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="271.0" y="421.0" width="242.0" height="92.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="392.0" y="463.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="392.0" dy="0.0">handler кинув A або B:</tspan><tspan x="392.0" dy="14.3">виняток летить далі</tspan></text>
<line x1="648.0" y1="398.0" x2="648.0" y2="418.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="527.0" y="421.0" width="242.0" height="92.0" rx="6" fill="#fff7e6" stroke="#6b7280" stroke-width="1.5"/><text x="648.0" y="456.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="648.0" dy="0.0">handler кинув інше,</tspan><tspan x="648.0" dy="14.3">але в списку є bad_exception:</tspan><tspan x="648.0" dy="14.3">далі летить bad_exception</tspan></text>
<line x1="904.0" y1="398.0" x2="904.0" y2="418.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="783.0" y="421.0" width="242.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="904.0" y="456.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="904.0" dy="0.0">handler кинув інше,</tspan><tspan x="904.0" dy="14.3">а bad_exception у списку немає:</tspan><tspan x="904.0" dy="14.3">std::terminate()</tspan></text>
</svg>