<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бюджет переїздів при послідовних push_back</text>
<text x="60.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">базова робота: побудувати 8000 елементів — однаково в обох варіантах</text>
<rect x="60.0" y="52.0" width="432.8" height="36.0" rx="3" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.0"/><text x="276.4" y="74.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="276.4" dy="0.0">8000 побудов</tspan></text>
<text x="60.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">переїзди при коефіцієнті 2 — libstdc++, libc++</text>
<rect x="60.0" y="148.0" width="220.6" height="36.0" rx="3" fill="#e3ebf9" stroke="#6b7280" stroke-width="1.0"/><text x="170.3" y="170.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.3" dy="0.0">4096</tspan></text>
<rect x="282.6" y="148.0" width="109.3" height="36.0" rx="3" fill="#eef2fb" stroke="#6b7280" stroke-width="1.0"/><text x="337.3" y="170.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="337.3" dy="0.0">2048</tspan></text>
<rect x="393.9" y="148.0" width="109.2" height="36.0" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.0"/><text x="448.5" y="169.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="448.5" dy="0.0">решта 2047</tspan></text>
<text x="60.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">усього переїздів: 8191, буферів: 14 — приблизно ще один такий самий обсяг роботи</text>
<text x="60.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">переїзди при коефіцієнті 1.5 — MSVC STL</text>
<rect x="60.0" y="266.0" width="291.2" height="36.0" rx="3" fill="#e3ebf9" stroke="#6b7280" stroke-width="1.0"/><text x="205.6" y="288.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.6" dy="0.0">5395</tspan></text>
<rect x="353.2" y="266.0" width="193.5" height="36.0" rx="3" fill="#eef2fb" stroke="#6b7280" stroke-width="1.0"/><text x="450.0" y="288.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">3597</tspan></text>
<rect x="548.7" y="266.0" width="389.3" height="36.0" rx="3" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.0"/><text x="743.3" y="287.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="743.3" dy="0.0">решта 7200</tspan></text>
<text x="60.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">усього переїздів: 16192, буферів: 23 — удвічі більше, ніж при подвоєнні</text>
<rect x="60.0" y="352.0" width="880.0" height="92.0" rx="6" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.0"/><text x="500.0" y="385.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">переїздів ≈ N / (r − 1):   r = 2 → ≈ N,   r = 1.5 → ≈ 2·N</tspan><tspan x="500.0" dy="16.9">копіювання коштує стільки ж, скільки перша побудова, тож увесь цикл довшає приблизно в 1 + 1/(r − 1) разів:</tspan><tspan x="500.0" dy="16.9">удвічі при подвоєнні, утричі при коефіцієнті 1.5</tspan></text>
</svg>