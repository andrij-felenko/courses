<rect x="117.1" y="80.5" width="265.8" height="39.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="105.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">C++98 .. C++20: CRTP Mixin</tspan></text>
<rect x="73.8" y="155.2" width="352.3" height="129.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="177.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">template &lt;typename Derived&gt;</tspan><tspan x="250.0" dy="15.6">struct Printable {</tspan><tspan x="250.0" dy="15.6">  void print() const {</tspan><tspan x="250.0" dy="15.6">    static_cast&lt;const Derived*&gt;(this)-&gt;format();</tspan><tspan x="250.0" dy="15.6">  }</tspan><tspan x="250.0" dy="15.6">};</tspan><tspan x="250.0" dy="15.6">struct Item : Printable&lt;Item&gt; {};</tspan></text>
