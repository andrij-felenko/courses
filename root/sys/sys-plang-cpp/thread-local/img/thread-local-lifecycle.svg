<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл thread_local</text>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл thread_local об'єкта: від виділення до деструктора</text>
<rect x="40.0" y="70.0" width="240.0" height="80.0" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="85.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">1. Створення потоку ОС</tspan><tspan x="160.0" dy="14.3">pthread_create() / std::jthread</tspan><tspan x="160.0" dy="14.3"></tspan><tspan x="160.0" dy="14.3">Виділення пам'яті під TCB</tspan><tspan x="160.0" dy="14.3">та статичний сегмент TLS</tspan></text>
<line x1="280.0" y1="110.0" x2="340.0" y2="110.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="340.0" y="70.0" width="260.0" height="80.0" rx="6" fill="#fef5e7" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="85.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">2. Ініціалізація змінної</tspan><tspan x="470.0" dy="14.3"></tspan><tspan x="470.0" dy="14.3">constinit: миттєво при старті</tspan><tspan x="470.0" dy="14.3">Динамічна: ліниво при першому</tspan><tspan x="470.0" dy="14.3">зверненні потоку (__tls_guard)</tspan></text>
<line x1="600.0" y1="110.0" x2="660.0" y2="110.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="660.0" y="70.0" width="240.0" height="80.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="70.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">3. Реєстрація деструктора</tspan><tspan x="780.0" dy="14.3"></tspan><tspan x="780.0" dy="14.3">__cxa_thread_atexit(</tspan><tspan x="780.0" dy="14.3">  ~MyClass,</tspan><tspan x="780.0" dy="14.3">  &amp;instance,</tspan><tspan x="780.0" dy="14.3">  &amp;__dso_handle</tspan><tspan x="780.0" dy="14.3">)</tspan></text>
<line x1="780.0" y1="150.0" x2="780.0" y2="190.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="500.0" y="190.0" width="380.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="209.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">4. Активна робота потоку</tspan><tspan x="690.0" dy="14.3">Читання та запис у thread_local змінну</tspan><tspan x="690.0" dy="14.3">Повна ізоляція: 0 блокувань, 0 гонок даних</tspan></text>
<line x1="690.0" y1="250.0" x2="690.0" y2="290.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="290.0" width="840.0" height="70.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="460.0" y="307.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">5. Завершення виконання функції потоку (Thread Exit)</tspan><tspan x="460.0" dy="14.3"></tspan><tspan x="460.0" dy="14.3">C++ Runtime розгортає внутрішній список зареєстрованих деструкторів:</tspan><tspan x="460.0" dy="14.3">Виклик деструкторів у ЗВОРОТНОМУ порядку створення  ──►  Звільнення TLS-пам'яті ОС</tspan></text>
<rect x="40.0" y="375.0" width="840.0" height="45.0" rx="6" fill="#fef5e7" stroke="#c0392b" stroke-width="1.5"/><text x="460.0" y="401.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Увага: std::exit() НЕ викликає деструктори thread_local для інших потоків! Тільки завершення функції потоку гарантує очищення.</tspan></text>
</svg>