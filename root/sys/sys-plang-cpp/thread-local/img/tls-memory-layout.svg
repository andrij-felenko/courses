<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізична організація пам'яті TLS</text>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізична організація пам'яті Thread-Local Storage (TLS) в x86-64 / ELF</text>
<text x="210.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Шаблон ініціалізації у файлі ELF</text>
<rect x="40.0" y="80.0" width="340.0" height="60.0" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Секція .tdata (ініціалізовані TLS-змінні)</tspan><tspan x="210.0" dy="14.3">Копіюється як байтовий зліпок у кожен новий потік</tspan></text>
<rect x="40.0" y="150.0" width="340.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Секція .tbss (неініціалізовані TLS-змінні)</tspan><tspan x="210.0" dy="13.0">Резервує розмір у RAM; занулюється при створенні потоку</tspan></text>
<line x1="380.0" y1="145.0" x2="480.0" y2="145.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">pthread_create()</text>
<text x="690.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Пам'ять Потоку 1 (Thread 1 Context)</text>
<rect x="500.0" y="80.0" width="380.0" height="50.0" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="690.0" y="101.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Статичний TLS-блок: Зліпок .tdata + Занулений .tbss</tspan><tspan x="690.0" dy="14.3">[ thread_local int counter = 42; ] (Адреса = %fs:offset)</tspan></text>
<rect x="500.0" y="140.0" width="380.0" height="50.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="161.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">TCB (Thread Control Block) та Thread Pointer (TP)</tspan><tspan x="690.0" dy="14.3">Сегментний регістр %fs вказує на базу TCB потоку 1</tspan></text>
<rect x="500.0" y="200.0" width="380.0" height="50.0" rx="6" fill="#fef5e7" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="221.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">DTV (Dynamic Thread Vector)</tspan><tspan x="690.0" dy="14.3">Масив вказівників на динамічні TLS-модулі (dlopen)</tspan></text>
<line x1="500.0" y1="165.0" x2="460.0" y2="165.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="460.0" y1="165.0" x2="460.0" y2="105.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="460.0" y1="105.0" x2="495.0" y2="105.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">%fs:offset</text>
<text x="690.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Пам'ять Потоку 2 (Thread 2 Context)</text>
<rect x="500.0" y="295.0" width="380.0" height="50.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="316.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Ізольований TLS-блок: Окремий зліпок .tdata + .tbss</tspan><tspan x="690.0" dy="14.3">[ counter = 42 ] (Зміна в Потоці 1 не впливає на Потік 2)</tspan></text>
<rect x="500.0" y="355.0" width="380.0" height="50.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="376.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">TCB Потоку 2: Сегментний регістр %fs потоку 2</tspan><tspan x="690.0" dy="14.3">Вказує на незалежну фізичну сторінку пам'яті</tspan></text>
<rect x="40.0" y="420.0" width="860.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="439.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Ключовий принцип: Кожен потік володіє власним TCB та унікальним зміщенням у регістрі %fs / %gs.</tspan><tspan x="470.0" dy="14.3">Нульові блокування (Lock-Free) та відсутність кеш-контеншну між ядрами CPU.</tspan></text>
</svg>