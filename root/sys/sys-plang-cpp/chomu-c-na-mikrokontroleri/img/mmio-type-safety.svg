<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Типобезпека MMIO регістрів у C++</text>
<text x="480.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Типобезпека доступу до регістрів: перевірка на етапі компіляції</text>
<rect x="57.8" y="73.8" width="214.4" height="102.5" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="93.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">1. Перевірка адреси та порту</tspan><tspan x="165.0" dy="14.3">using GpioA = Gpio&lt;0x40020000&gt;;</tspan><tspan x="165.0" dy="14.3">using GpioB = Gpio&lt;0x40020400&gt;;</tspan><tspan x="165.0" dy="14.3">Порти є різними типами.</tspan><tspan x="165.0" dy="14.3">Неможливо передати пін</tspan><tspan x="165.0" dy="14.3">порту B у драйвер порту A</tspan></text>
<rect x="350.9" y="73.8" width="258.3" height="102.5" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="93.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">2. Контроль прав доступу</tspan><tspan x="480.0" dy="14.3">Register&lt;0x40020010, Access::ReadOnly&gt;</tspan><tspan x="480.0" dy="14.3">Регістр вхідних даних (IDR).</tspan><tspan x="480.0" dy="14.3">Метод write() відсутній у типі.</tspan><tspan x="480.0" dy="14.3">Спроба запису викликає</tspan><tspan x="480.0" dy="14.3">помилку компіляції</tspan></text>
<rect x="687.8" y="73.8" width="214.4" height="102.5" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="795.0" y="93.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">3. Ізоляція бітових полів</tspan><tspan x="795.0" dy="14.3">enum class PinMode : uint32_t {</tspan><tspan x="795.0" dy="14.3">  Input = 0b00, Output = 0b01</tspan><tspan x="795.0" dy="14.3">};</tspan><tspan x="795.0" dy="14.3">Строга типізація виключає</tspan><tspan x="795.0" dy="14.3">запис випадкових бітових масок</tspan></text>
<rect x="122.7" y="273.1" width="314.7" height="73.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="280.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Помилковий код (помилка на етапі збирання):</tspan><tspan x="280.0" dy="14.3">GpioA::Idr::write(0x1234);</tspan><tspan x="280.0" dy="14.3">static_assert failure: 'Register is Read-Only!'</tspan><tspan x="280.0" dy="14.3">Помилка виявлена за 0.05 с компілятором!</tspan></text>
<rect x="532.1" y="273.1" width="295.9" height="73.9" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Коректний типізований код:</tspan><tspan x="680.0" dy="14.3">auto val = GpioA::Idr::read();</tspan><tspan x="680.0" dy="14.3">GpioA::Moder::set(Pin::P5, PinMode::Output);</tspan><tspan x="680.0" dy="14.3">Чистий машинний код без рантайм-перевірок!</tspan></text>
<line x1="380.0" y1="180.0" x2="310.0" y2="265.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="580.0" y1="180.0" x2="650.0" y2="265.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>