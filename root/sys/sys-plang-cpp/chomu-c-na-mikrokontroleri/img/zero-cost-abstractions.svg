<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип нульових накладних витрат у C++ на мікроконтролері</text>
<text x="480.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип нульових накладних витрат: трансляція C та C++ в інструкції MMIO</text>
<text x="240.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Підхід C (макроси та сирі вказівники):</text>
<text x="720.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Підхід C++ (типізовані реєстри та constexpr):</text>
<rect x="63.8" y="95.2" width="352.3" height="59.6" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Код мовою C:</tspan><tspan x="240.0" dy="14.3">#define GPIOA_MODER *((volatile uint32_t*)0x40020000)</tspan><tspan x="240.0" dy="14.3">GPIOA_MODER |= (1U &lt;&lt; 10);</tspan></text>
<rect x="101.5" y="193.1" width="277.1" height="73.9" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="212.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Компілятор C:</tspan><tspan x="240.0" dy="14.3">• Немає перевірки типу регістра</tspan><tspan x="240.0" dy="14.3">• Немає контролю сумісності бітових масок</tspan><tspan x="240.0" dy="14.3">• Пряма генерація маски 0x400</tspan></text>
<rect x="575.2" y="95.2" width="289.6" height="59.6" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Код мовою C++:</tspan><tspan x="720.0" dy="14.3">using GpioA = GpioPort&lt;0x40020000&gt;;</tspan><tspan x="720.0" dy="14.3">GpioA::Moder::set&lt;Pin::P5, Mode::Output&gt;();</tspan></text>
<rect x="543.8" y="193.1" width="352.3" height="73.9" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="212.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Компілятор C++:</tspan><tspan x="720.0" dy="14.3">• Повна перевірка типів та прав доступу</tspan><tspan x="720.0" dy="14.3">• constexpr згортання зсуву та маски під час збирання</tspan><tspan x="720.0" dy="14.3">• 100% інлайнінг шаблонних методів</tspan></text>
<line x1="240.0" y1="157.0" x2="240.0" y2="192.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="720.0" y1="157.0" x2="720.0" y2="192.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="242.3" y="301.8" width="475.4" height="106.5" rx="6" fill="#fff3cd" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="323.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Результуючий машинний код (ARM Thumb-2):</tspan><tspan x="480.0" dy="14.3">LDR  R0, =0x40020000     ; Завантаження адреси MMIO регістра</tspan><tspan x="480.0" dy="14.3">LDR  R1, [R0]            ; Читання поточного значення</tspan><tspan x="480.0" dy="14.3">ORR  R1, R1, #1024       ; Накладання маски біта 10 (0x400)</tspan><tspan x="480.0" dy="14.3">STR  R1, [R0]            ; Запис результату назад у регістр</tspan><tspan x="480.0" dy="14.3">Витрати Flash: 12 байтів | Витрати SRAM: 0 байтів | Накладні витрати: 0%</tspan></text>
<line x1="240.0" y1="268.0" x2="400.0" y2="307.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="720.0" y1="268.0" x2="560.0" y2="307.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>