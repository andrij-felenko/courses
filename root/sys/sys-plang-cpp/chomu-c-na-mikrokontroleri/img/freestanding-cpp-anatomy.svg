<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія Freestanding C++ для мікроконтролерів</text>
<text x="480.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія Freestanding C++: дозволені можливості та відсічений рантайм</text>
<text x="245.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Дозволено та ефективно (0 байт оверхеду):</text>
<rect x="62.4" y="139.5" width="365.1" height="171.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="245.0" y="160.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Ядро мови та компіляція:</tspan><tspan x="245.0" dy="13.7">• Шаблони класів та функцій (Templates, CRTP)</tspan><tspan x="245.0" dy="13.7">• Обчислення під час збирання (constexpr / consteval)</tspan><tspan x="245.0" dy="13.7">• Автоматичне управління ресурсами (RAII деструктори)</tspan><tspan x="245.0" dy="13.7">• Строга типізація (enum class, concepts, static_assert)</tspan><tspan x="245.0" dy="13.7">• Структури, методи та інлайнінг (zero-overhead wrapping)</tspan><tspan x="245.0" dy="13.7">• Простори імен (namespaces), лямбди без захвату</tspan><tspan x="245.0" dy="13.7"></tspan><tspan x="245.0" dy="13.7">Freestanding стандартні заголовки:</tspan><tspan x="245.0" dy="13.7">• &lt;cstdint&gt;, &lt;cstddef&gt;, &lt;type_traits&gt;, &lt;concepts&gt;</tspan><tspan x="245.0" dy="13.7">• &lt;array&gt;, &lt;span&gt;, &lt;string_view&gt;, &lt;optional&gt;, &lt;bit&gt;</tspan></text>
<text x="715.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Відсікається прапорцями компілятора:</text>
<rect x="529.4" y="132.7" width="371.1" height="184.7" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="715.0" y="153.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Динамічний рантайм (відсікається):</tspan><tspan x="715.0" dy="13.7">• Винятки (-fno-exceptions):</tspan><tspan x="715.0" dy="13.7">  - Заощаджує кілобайти таблиць розгортання стеку</tspan><tspan x="715.0" dy="13.7">• Інформація про типи в рантаймі (-fno-rtti):</tspan><tspan x="715.0" dy="13.7">  - Заощаджує пам'ять type_info та vtable-дескрипторів</tspan><tspan x="715.0" dy="13.7">• Невикористовувані таблиці unwinding (-fno-unwind-tables)</tspan><tspan x="715.0" dy="13.7">• Динамічна купа (malloc/new):</tspan><tspan x="715.0" dy="13.7">  - Відмова від купи (heap) усуває фрагментацію RAM</tspan><tspan x="715.0" dy="13.7"></tspan><tspan x="715.0" dy="13.7">Результат збирання прошивки:</tspan><tspan x="715.0" dy="13.7">Детермінована пам'ять, нульовий час ініціалізації</tspan><tspan x="715.0" dy="13.7">та повний контроль над кожним байтом Flash і SRAM</tspan></text>
</svg>