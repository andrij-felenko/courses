<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від симетричної пари ітераторів до концепту вартового в C++20</text>
<text x="230.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель C++98/17: Симетрична пара</text>
<rect x="86.7" y="85.0" width="86.7" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">begin()</tspan><tspan x="130.0" dy="16.9">тип: Iter</tspan></text>
<rect x="249.6" y="85.0" width="160.8" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">end()</tspan><tspan x="330.0" dy="16.9">той самий тип: Iter</tspan></text>
<line x1="173.3" y1="110.0" x2="249.6" y2="110.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="230.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">Вимагає обчислення кінця наперед!</text>
<text x="670.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Модель C++20: Iterator + Sentinel</text>
<rect x="526.7" y="85.0" width="86.7" height="49.9" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="570.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">it</tspan><tspan x="570.0" dy="16.9">тип: Iter</tspan></text>
<rect x="689.6" y="85.0" width="160.8" height="49.9" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">sentinel</tspan><tspan x="770.0" dy="16.9">інший тип: Sentinel</tspan></text>
<line x1="613.3" y1="110.0" x2="689.6" y2="110.0" stroke="#27ae60" stroke-width="1.5"/>
<text x="670.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">Перевірка: it != sentinel (наприклад *it == '\0')</text>
<rect x="125.0" y="231.1" width="650.0" height="57.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="256.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Вартовий (Sentinel) виражає умову зупинки, а не обов'язково конкретну адресу.</tspan><tspan x="450.0" dy="16.9">Це дозволяє обробку нескінченних потоків та рядків без попереднього strlen().</tspan></text>
</svg>