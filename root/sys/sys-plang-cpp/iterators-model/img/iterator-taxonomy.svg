<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія категорій ітераторів та їхніх можливостей</text>
<rect x="195.3" y="57.0" width="149.4" height="45.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">InputIterator</tspan><tspan x="270.0" dy="16.9">читання (std::cin)</tspan></text>
<rect x="599.0" y="57.0" width="142.0" height="45.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="670.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">OutputIterator</tspan><tspan x="670.0" dy="16.9">запис (std::cout)</tspan></text>
<text x="470.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Однопрохідний обхід (single-pass), read/write</text>
<rect x="290.6" y="128.1" width="358.9" height="47.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="148.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">ForwardIterator</tspan><tspan x="470.0" dy="16.9">Мультипрохідний (multi-pass), збереження стану</tspan></text>
<line x1="470.0" y1="130.0" x2="470.0" y2="102.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="342.4" y="200.1" width="255.1" height="47.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="220.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">BidirectionalIterator</tspan><tspan x="470.0" dy="16.9">Двонапрямлений обхід: operator--</tspan></text>
<line x1="470.0" y1="202.0" x2="470.0" y2="174.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="283.2" y="272.1" width="373.7" height="47.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="292.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">RandomAccessIterator</tspan><tspan x="470.0" dy="16.9">Довільний доступ за O(1): operator+=, operator[]</tspan></text>
<line x1="470.0" y1="274.0" x2="470.0" y2="246.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="268.3" y="344.1" width="403.3" height="47.9" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="364.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">ContiguousIterator</tspan><tspan x="470.0" dy="16.9">Суцільна пам'ять у RAM: std::to_address, raw pointer</tspan></text>
<line x1="470.0" y1="346.0" x2="470.0" y2="318.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="470.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Кожна наступна категорія розширює вимоги та гарантії попередньої</text>
</svg>