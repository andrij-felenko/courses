<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 712" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="712" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від двох бітів захисту пам'яті до кваліфікатора типу</text>
<line x1="238.0" y1="76.0" x2="238.0" y2="664.0" stroke="#6b7280" stroke-width="2.0"/>
<rect x="260.0" y="88.9" width="800.0" height="58.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">меморандум Bell Labs «Extensions of the C Language Type Concept»:</tspan><tspan x="660.0" dy="18.2">кваліфікатори readonly і writeonly — про права доступу, не про сталі</tspan></text>
<circle cx="238.0" cy="118.0" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
<text x="214.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">січень 1981</text>
<rect x="260.0" y="172.9" width="800.0" height="58.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="197.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">розмова з Деннісом Рітчі: кваліфікувати можна й сам вказівник</tspan><tspan x="660.0" dy="18.2">→ друга позиція, праворуч від зірочки: char* const</tspan></text>
<circle cx="238.0" cy="202.0" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
<text x="214.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1981</text>
<rect x="260.0" y="256.9" width="800.0" height="58.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="281.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">комітет зі стандартів C у Bell Labs (голова Ларрі Рослер) голосує:</tspan><tspan x="660.0" dy="18.2">«беремо в C — але перейменуйте на const». Компілятори не змінилися</tspan></text>
<circle cx="238.0" cy="286.0" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
<text x="214.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">початок 1980-х</text>
<rect x="260.0" y="350.0" width="800.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="374.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">створено комітет ANSI X3J11; пропозиція const відроджується там</tspan></text>
<circle cx="238.0" cy="370.0" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
<text x="214.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1983</text>
<rect x="260.0" y="424.9" width="800.0" height="58.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="449.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Рітчі публічно заперечує проти noalias і сумнівається,</tspan><tspan x="660.0" dy="18.2">що const і volatile «виправдовують свою вагу»</tspan></text>
<circle cx="238.0" cy="454.0" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
<text x="214.0" y="459.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">20 березня 1988</text>
<rect x="260.0" y="518.0" width="800.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="542.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">ANSI X3.159-1989: const і volatile у стандарті C як «кваліфікатори типу»</tspan></text>
<circle cx="238.0" cy="538.0" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
<text x="214.0" y="543.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1989</text>
<rect x="260.0" y="592.9" width="800.0" height="58.2" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="660.0" y="617.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">C не бере правила «глобальний const локальний до файлу»</tspan><tspan x="660.0" dy="18.2">→ у C++ const придатний як константний вираз, у C — ні</tspan></text>
<circle cx="238.0" cy="622.0" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
<text x="214.0" y="627.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">і далі</text>
<text x="540.0" y="678.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">перейменування на етапі 3 змістило наголос: readonly називав право доступу, const називає сталість</text>
</svg>