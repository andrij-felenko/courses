<rect x="655.9" y="208.6" width="172.2" height="70.8" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="742.0" y="231.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="742.0" dy="0.0">Impl</tspan><tspan x="742.0" dy="16.9">мінливий:</tspan><tspan x="742.0" dy="16.9">const сюди не дістає</tspan></text>
