<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дозорне значення C-API проти порожнього стану власника</text>
<rect x="50.0" y="56.0" width="280.0" height="44.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">що повернув open()</tspan></text>
<rect x="350.0" y="56.0" width="320.0" height="44.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">наївне: дескриптор у void*</tspan></text>
<rect x="690.0" y="56.0" width="280.0" height="44.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="82.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">власний тип FdHandle</tspan></text>
<rect x="50.0" y="118.0" width="280.0" height="66.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="155.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">-1  —  відкрити не вдалося</tspan></text>
<rect x="350.0" y="118.0" width="320.0" height="66.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="147.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">не нульова адреса:</tspan><tspan x="510.0" dy="15.6">власник вважає, що володіє</tspan></text>
<rect x="690.0" y="118.0" width="280.0" height="66.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="147.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">дорівнює nullptr:</tspan><tspan x="830.0" dy="15.6">власник порожній</tspan></text>
<rect x="50.0" y="196.0" width="280.0" height="66.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="225.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">0  —  робочий дескриптор</tspan><tspan x="190.0" dy="16.9">(коли stdin закрито)</tspan></text>
<rect x="350.0" y="196.0" width="320.0" height="66.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="225.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">нульова адреса:</tspan><tspan x="510.0" dy="15.6">видалювача не покличуть</tspan></text>
<rect x="690.0" y="196.0" width="280.0" height="66.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="225.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">не nullptr:</tspan><tspan x="830.0" dy="15.6">власник володіє, close(0)</tspan></text>
<rect x="50.0" y="274.0" width="280.0" height="66.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="311.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">3  —  робочий дескриптор</tspan></text>
<rect x="350.0" y="274.0" width="320.0" height="66.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="303.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">не нульова адреса:</tspan><tspan x="510.0" dy="15.6">close(3) на виході</tspan></text>
<rect x="690.0" y="274.0" width="280.0" height="66.0" rx="6" fill="#e8f6ee" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="303.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">не nullptr:</tspan><tspan x="830.0" dy="15.6">close(3) на виході</tspan></text>
<text x="510.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">порожній стан власника мусить збігатися з дозорним значенням API, а не з нулем машини</text>
</svg>