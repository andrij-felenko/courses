<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому unique_ptr не передається в регістрі</text>
<text x="60.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">T*  —  тривіальний тип, іде в регістрі</text>
<rect x="60.0" y="62.0" width="220.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">викликач</tspan><tspan x="170.0" dy="16.9">має адресу</tspan></text>
<text x="454.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">один регістр</text>
<line x1="288.0" y1="103.0" x2="620.0" y2="103.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="630.0" y="62.0" width="250.0" height="66.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="755.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">викликана функція</tspan><tspan x="755.0" dy="16.9">бере значення</tspan></text>
<line x1="50.0" y1="176.0" x2="910.0" y2="176.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 5"/>
<text x="60.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">unique_ptr&lt;T&gt;  —  нетривіальний, іде через пам'ять</text>
<rect x="60.0" y="244.0" width="210.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="273.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">викликач</tspan><tspan x="165.0" dy="16.9">будує тимчасовий</tspan></text>
<line x1="278.0" y1="285.0" x2="340.0" y2="285.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="348.0" y="244.0" width="210.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="453.0" y="273.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="453.0" dy="0.0">комірка в кадрі</tspan><tspan x="453.0" dy="16.9">стека викликача</tspan></text>
<line x1="566.0" y1="285.0" x2="628.0" y2="285.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="636.0" y="244.0" width="244.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="758.0" y="273.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="758.0" dy="0.0">викликана функція</tspan><tspan x="758.0" dy="16.9">дістає адресу комірки</tspan></text>
<text x="470.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">зайвий запис у пам'ять і зайве читання на кожне передавання</text>
<text x="470.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">знищити параметр зобов'язана викликана функція</text>
</svg>