<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння концепцій поліморфізму у C++</text>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння підходів до поліморфізму у C++</text>
<rect x="40.0" y="60.0" width="270.0" height="40.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="76.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">1. Статичний поліморфізм</tspan><tspan x="175.0" dy="15.6">(Templates / Monomorphization)</tspan></text>
<rect x="40.0" y="110.0" width="270.0" height="270.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="184.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">template &lt;typename F&gt;</tspan><tspan x="175.0" dy="14.3">void execute(F func) {</tspan><tspan x="175.0" dy="14.3">    func();</tspan><tspan x="175.0" dy="14.3">}</tspan><tspan x="175.0" dy="14.3"></tspan><tspan x="175.0" dy="14.3">✔ Повне вбудовування</tspan><tspan x="175.0" dy="14.3">✔ Нульові витрати runtime</tspan><tspan x="175.0" dy="14.3"></tspan><tspan x="175.0" dy="14.3">✖ Новий код для кожного F</tspan><tspan x="175.0" dy="14.3">✖ Немає контейнерів (std::vector)</tspan></text>
<rect x="335.0" y="60.0" width="270.0" height="40.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="76.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">2. Динамічний поліморфізм</tspan><tspan x="470.0" dy="15.6">(Virtual Inheritance / OOP)</tspan></text>
<rect x="335.0" y="110.0" width="270.0" height="270.0" rx="6" fill="#fffbf2" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="184.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">class IAction {</tspan><tspan x="470.0" dy="14.3">public:</tspan><tspan x="470.0" dy="14.3">    virtual void run() = 0;</tspan><tspan x="470.0" dy="14.3">};</tspan><tspan x="470.0" dy="14.3"></tspan><tspan x="470.0" dy="14.3">✔ Єдиний тип покажчика</tspan><tspan x="470.0" dy="14.3">✔ Збереження у контейнери</tspan><tspan x="470.0" dy="14.3"></tspan><tspan x="470.0" dy="14.3">✖ Спадкування від IAction</tspan><tspan x="470.0" dy="14.3">✖ Не працює з лямбдами напряму</tspan></text>
<rect x="630.0" y="60.0" width="270.0" height="40.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="765.0" y="76.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="765.0" dy="0.0">3. Стирання типів</tspan><tspan x="765.0" dy="15.6">(Type Erasure / std::function)</tspan></text>
<rect x="630.0" y="110.0" width="270.0" height="270.0" rx="6" fill="#f2f9f4" stroke="#27ae60" stroke-width="1.5"/><text x="765.0" y="198.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">std::function&lt;void()&gt; fn = f;</tspan><tspan x="765.0" dy="14.3"></tspan><tspan x="765.0" dy="14.3">✔ Однорідний зовнішній тип</tspan><tspan x="765.0" dy="14.3">✔ Приймає БУДЬ-ЯКИЙ Callable</tspan><tspan x="765.0" dy="14.3">✔ Поєднує шаблони та vtable</tspan><tspan x="765.0" dy="14.3"></tspan><tspan x="765.0" dy="14.3">✖ Непрямий виклик (vtable)</tspan><tspan x="765.0" dy="14.3">✖ Можлива купа (Heap)</tspan></text>
<text x="470.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Type Erasure ізолює шаблонне конструювання від нешаблонного інтерфейсу виклику</text>
</svg>