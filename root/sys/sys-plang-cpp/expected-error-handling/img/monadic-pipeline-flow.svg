<text x="50.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Конвеєр монадичних трансформацій std::expected</text>
<rect x="50.0" y="65.0" width="180.0" height="80.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="95.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">read_file(path)</tspan><tspan x="140.0" dy="13.0">───►</tspan><tspan x="140.0" dy="13.0">std::expected&lt;string, Error&gt;</tspan></text>
