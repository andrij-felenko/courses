<line x1="755.0" y1="135.0" x2="760.0" y2="135.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="765.0" y="45.0" width="140.0" height="120.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="835.0" y="69.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">Результат:</tspan><tspan x="835.0" dy="13.0">.or_else(fallback)</tspan><tspan x="835.0" dy="13.0"></tspan><tspan x="835.0" dy="13.0">Помилка пролітає</tspan><tspan x="835.0" dy="13.0">повз and_then,</tspan><tspan x="835.0" dy="13.0">але перехоплюється</tspan><tspan x="835.0" dy="13.0">в or_else()</tspan></text>
<line x1="40.0" y1="195.0" x2="900.0" y2="195.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6 5"/>
<text x="50.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Правила проходження сигналів у монадичних операторах:</text>
<rect x="50.0" y="245.0" width="410.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">and_then(f): T -&gt; std::expected&lt;U, E&gt;</tspan><tspan x="255.0" dy="11.7">• Якщо has_value() == true  ──► викликає f(value()), повертає новий expected&lt;U, E&gt;</tspan><tspan x="255.0" dy="11.7">• Якщо has_value() == false ──► пропускає f, повертає std::unexpected(error())</tspan></text>
<rect x="480.0" y="245.0" width="410.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="685.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">transform(f): T -&gt; U</tspan><tspan x="685.0" dy="11.7">• Якщо has_value() == true  ──► обгортає f(value()) у новий expected&lt;U, E&gt;</tspan><tspan x="685.0" dy="11.7">• Якщо has_value() == false ──► повертає std::unexpected(error()) без змін</tspan></text>
</svg>