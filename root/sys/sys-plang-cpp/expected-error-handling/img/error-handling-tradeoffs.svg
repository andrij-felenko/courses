<rect x="50.0" y="65.0" width="200.0" height="310.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="170.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">C Return Codes / errno</tspan><tspan x="150.0" dy="11.7"></tspan><tspan x="150.0" dy="11.7">➕ Оверхед: 0 байтів</tspan><tspan x="150.0" dy="11.7">➕ Таблиці винятків: Ні</tspan><tspan x="150.0" dy="11.7">➕ Виклик: 100% детермінований</tspan><tspan x="150.0" dy="11.7"></tspan><tspan x="150.0" dy="11.7">➖ Типобезпека: Низька (-1)</tspan><tspan x="150.0" dy="11.7">➖ Контроль: Легко ігнорувати</tspan><tspan x="150.0" dy="11.7">➖ Канал: Забруднює результат</tspan><tspan x="150.0" dy="11.7">➖ Читабельність: goto out / nested if</tspan></text>
<rect x="265.0" y="65.0" width="200.0" height="310.0" rx="6" fill="#fff0f0" stroke="#2457d6" stroke-width="1.5"/><text x="365.0" y="176.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">C++ Exceptions</tspan><tspan x="365.0" dy="11.7"></tspan><tspan x="365.0" dy="11.7">➕ Читабельність: Висока</tspan><tspan x="365.0" dy="11.7">➕ Ігнорування: Неможливо</tspan><tspan x="365.0" dy="11.7">➕ Контекст: Повний (call stack)</tspan><tspan x="365.0" dy="11.7"></tspan><tspan x="365.0" dy="11.7">➖ Оверхед: Блоут тексту (.eh_frame)</tspan><tspan x="365.0" dy="11.7">➖ Надійність: Надертермінова затримка стеку</tspan><tspan x="365.0" dy="11.7">➖ Сфера: Заборонено в RTOS / Kernel</tspan></text>
<rect x="480.0" y="65.0" width="200.0" height="310.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.5"/><text x="580.0" y="176.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">std::optional&lt;T&gt;</tspan><tspan x="580.0" dy="11.7"></tspan><tspan x="580.0" dy="11.7">➕ Оверхед: Лише sizeof(bool)</tspan><tspan x="580.0" dy="11.7">➕ Без винятків: Детерміновано</tspan><tspan x="580.0" dy="11.7">➕ Типобезпека: Висока</tspan><tspan x="580.0" dy="11.7"></tspan><tspan x="580.0" dy="11.7">➖ Інформативність: Лише факт 'немає'</tspan><tspan x="580.0" dy="11.7">➖ Причина: Втрачено код помилки</tspan><tspan x="580.0" dy="11.7">➖ Композиція: Потребує C++23 monadic</tspan></text>
