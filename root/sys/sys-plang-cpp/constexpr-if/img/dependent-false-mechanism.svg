<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм відкладеної перевірки static_assert через dependent_false</text>
<rect x="30.0" y="20.0" width="440.0" height="60.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="46.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Проблема: static_assert(false) у відкинутій гілці</tspan><tspan x="250.0" dy="16.9">Помилка компіляції виникає ЗАВЖДИ на Фазі 1</tspan></text>
<rect x="30.0" y="95.0" width="440.0" height="110.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="250.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">template&lt;typename T&gt;</tspan><tspan x="250.0" dy="15.6">void handle(T val) {</tspan><tspan x="250.0" dy="15.6">  if constexpr (std::is_integral_v&lt;T&gt;) { ... }</tspan><tspan x="250.0" dy="15.6">  else static_assert(false, &quot;Unsupported type!&quot;);</tspan><tspan x="250.0" dy="15.6">}</tspan></text>
<rect x="30.0" y="220.0" width="440.0" height="115.0" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="245.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Чому це не працює:</tspan><tspan x="250.0" dy="14.3"></tspan><tspan x="250.0" dy="14.3">1. Вираз false НЕ залежить від параметра шаблону T.</tspan><tspan x="250.0" dy="14.3">2. Згідно з [temp.res], компілятор зобов'язаний</tspan><tspan x="250.0" dy="14.3">   перевірити незалежні вирази на Фазі 1 (парсинг).</tspan><tspan x="250.0" dy="14.3">3. Збірка аварійно зупиняється ще до інстанціювання!</tspan></text>
<rect x="530.0" y="20.0" width="440.0" height="60.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="46.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">Рішення: шаблон dependent_false&lt;T&gt;</tspan><tspan x="750.0" dy="14.3">Перевірка відкладається до моменту вибору гілки на Фазі 2</tspan></text>
<rect x="530.0" y="95.0" width="440.0" height="110.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="750.0" y="110.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">template&lt;typename&gt; inline constexpr bool dependent_false = false;</tspan><tspan x="750.0" dy="14.3"></tspan><tspan x="750.0" dy="14.3">template&lt;typename T&gt;</tspan><tspan x="750.0" dy="14.3">void handle(T val) {</tspan><tspan x="750.0" dy="14.3">  if constexpr (std::is_integral_v&lt;T&gt;) { ... }</tspan><tspan x="750.0" dy="14.3">  else static_assert(dependent_false&lt;T&gt;, &quot;Unsupported type!&quot;);</tspan><tspan x="750.0" dy="14.3">}</tspan></text>
<rect x="530.0" y="220.0" width="440.0" height="115.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="245.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Як це працює:</tspan><tspan x="750.0" dy="14.3"></tspan><tspan x="750.0" dy="14.3">1. dependent_false&lt;T&gt; синтаксично залежить від типу T.</tspan><tspan x="750.0" dy="14.3">2. Компілятор відкладає обчислення на Фазу 2 (інстанціювання).</tspan><tspan x="750.0" dy="14.3">3. Якщо гілка else відкинута, вираз НЕ інстанціюється.</tspan><tspan x="750.0" dy="14.3">4. Помилка виникає ЛИШЕ якщо дійсно передано непідтримуваний T.</tspan></text>
</svg>