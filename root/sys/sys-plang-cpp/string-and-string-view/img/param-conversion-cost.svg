<rect x="240.0" y="290.0" width="210.0" height="80.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="345.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="345.0" dy="0.0">1 алокація</tspan><tspan x="345.0" dy="13.0">Створення нового рядка</tspan></text>
