<rect x="270.0" y="320.0" width="420.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="339.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Чи змінюється динамічний тип поліморфного</tspan><tspan x="480.0" dy="15.6">об'єкта або його віртуальна таблиця?</tspan></text>
<line x1="692.0" y1="343.0" x2="780.0" y2="343.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
