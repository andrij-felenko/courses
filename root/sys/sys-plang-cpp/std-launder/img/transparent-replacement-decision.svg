<rect x="20.0" y="165.0" width="160.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="100.0" y="182.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="100.0" dy="0.0">Потрібен std::launder</tspan><tspan x="100.0" dy="14.3">(зміна ієрархії)</tspan></text>
