<rect x="290.0" y="165.0" width="380.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="189.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">X і Y — повні об'єкти (не підоб'єкти базових класів)?</tspan></text>
<line x1="290.0" y1="186.0" x2="190.0" y2="186.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="240.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Ні</text>
