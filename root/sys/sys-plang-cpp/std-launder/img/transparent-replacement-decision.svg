<rect x="790.0" y="320.0" width="150.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="865.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="865.0" dy="0.0">Девіртуалізація!</tspan><tspan x="865.0" dy="13.0">Потрібен std::launder</tspan></text>
<rect x="280.0" y="400.0" width="400.0" height="52.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="415.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Прозоре заміщення (Transparently Replaceable):</tspan><tspan x="480.0" dy="14.3">старий вказівник автоматично вказує на новий об'єкт.</tspan><tspan x="480.0" dy="14.3">std::launder не потрібен.</tspan></text>
<text x="480.0" y="485.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Якщо хоча б одна перевірка дає збій — старий вказівник стає «висячим», а звернення через нього — UB.</text>
