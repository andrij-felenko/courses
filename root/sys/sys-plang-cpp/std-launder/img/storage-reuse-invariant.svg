<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повторне використання пам'яті й оптимізація Constant Propagation</text>
<rect x="40.0" y="30.0" width="420.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="54.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Без std::launder (невизначена поведінка)</tspan></text>
<rect x="500.0" y="30.0" width="420.0" height="40.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="54.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Із застосуванням std::launder (коректно)</tspan></text>
<rect x="280.0" y="85.0" width="400.0" height="44.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="480.0" y="103.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Пам'ять 0x1000: Config{ const int id = 100; }</tspan><tspan x="480.0" dy="15.6">Компілятор кешує id = 100 у регістрі</tspan></text>
<line x1="380.0" y1="132.0" x2="250.0" y2="155.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="580.0" y1="132.0" x2="710.0" y2="155.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="160.0" width="400.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="181.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">1. p-&gt;~Config()  // знищення старого об'єкта</tspan><tspan x="250.0" dy="15.6">2. new (p) Config{500}  // запис 500 у пам'ять 0x1000</tspan></text>
<line x1="250.0" y1="212.0" x2="250.0" y2="235.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="240.0" width="400.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="258.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Читання через старий вказівник: int x = p-&gt;id;</tspan><tspan x="250.0" dy="15.6">Оптимізатор: «id константний, отже не змінювався».</tspan><tspan x="250.0" dy="15.6">Значення береться з регістра (100 замість 500)!</tspan></text>
<line x1="250.0" y1="302.0" x2="250.0" y2="325.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="330.0" width="400.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="352.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="250.0" dy="0.0">Порушення інваріантів абстрактної машини:</tspan><tspan x="250.0" dy="15.6">тихе пошкодження логіки (Silent Data Corruption)</tspan></text>
<rect x="510.0" y="160.0" width="400.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="710.0" y="181.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">1. p-&gt;~Config()  // знищення старого об'єкта</tspan><tspan x="710.0" dy="15.6">2. new (p) Config{500}  // запис 500 у пам'ять 0x1000</tspan></text>
<line x1="710.0" y1="212.0" x2="710.0" y2="235.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="510.0" y="240.0" width="400.0" height="60.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="258.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Бар'єр оптимізатора: auto* np = std::launder(p);</tspan><tspan x="710.0" dy="15.6">Читання через оновлений вказівник: int x = np-&gt;id;</tspan><tspan x="710.0" dy="15.6">Оптимізатор зобов'язаний перечитати пам'ять!</tspan></text>
<line x1="710.0" y1="302.0" x2="710.0" y2="325.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="510.0" y="330.0" width="400.0" height="52.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="352.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="710.0" dy="0.0">Завантаження з RAM/кешу: x отримує 500.</tspan><tspan x="710.0" dy="15.6">Інваріанти збережено, нуль накладних витрат у рантаймі.</tspan></text>
<text x="480.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">std::launder розриває ланцюжок припущень оптимізатора про незмінність const-полів за фіксованою адресою.</text>
</svg>