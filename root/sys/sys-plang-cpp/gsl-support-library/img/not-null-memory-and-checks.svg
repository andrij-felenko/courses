<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура gsl::not_null</text>
<text x="50.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Анатомія gsl::not_null&lt;T*&gt;: конструювання, інваріанти та пам'ять</text>
<text x="50.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Фільтрація при конструюванні</text>
<rect x="50.0" y="90.0" width="270.0" height="130.0" rx="6" fill="#fff0f0" stroke="#c0392b" stroke-width="1.5"/><text x="185.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">Спроба nullptr:</tspan><tspan x="185.0" dy="13.0">gsl::not_null&lt;int*&gt; p = nullptr;</tspan><tspan x="185.0" dy="13.0">──► ПОМИЛКА КОМПІЛЯЦІЇ</tspan><tspan x="185.0" dy="13.0">(конструктор з nullptr_t видалено)</tspan><tspan x="185.0" dy="13.0"></tspan><tspan x="185.0" dy="13.0">Динамічний вказівник:</tspan><tspan x="185.0" dy="13.0">gsl::not_null&lt;int*&gt; p(raw_ptr);</tspan><tspan x="185.0" dy="13.0">──► Runtime-перевірка Expects(p != nullptr)</tspan></text>
<text x="350.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">2. Фізичне розміщення (Zero-Overhead)</text>
<rect x="350.0" y="90.0" width="270.0" height="130.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="485.0" y="106.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="485.0" dy="0.0">Макет у пам'яті:</tspan><tspan x="485.0" dy="13.0">┌─────────────────────────────────┐</tspan><tspan x="485.0" dy="13.0">│   ptr_: T*  (8 байтів у x86-64) │</tspan><tspan x="485.0" dy="13.0">└─────────────────────────────────┘</tspan><tspan x="485.0" dy="13.0">sizeof(gsl::not_null&lt;T*&gt;) == sizeof(T*)</tspan><tspan x="485.0" dy="13.0"></tspan><tspan x="485.0" dy="13.0">Асемблерний виклик:</tspan><tspan x="485.0" dy="13.0">Передається через регістр RDI/RCX</tspan><tspan x="485.0" dy="13.0">без додаткових обгорток чи vtable</tspan></text>
<text x="650.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">3. Обмеження операцій (Rule Bounds.1)</text>
<rect x="650.0" y="90.0" width="260.0" height="130.0" rx="6" fill="#f0f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="780.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Дозволені операції:</tspan><tspan x="780.0" dy="13.0">• *p (розіменування без null-check)</tspan><tspan x="780.0" dy="13.0">• p-&gt;field (доступ до полів)</tspan><tspan x="780.0" dy="13.0">• p.get() (отримання сирого T*)</tspan><tspan x="780.0" dy="13.0"></tspan><tspan x="780.0" dy="13.0">Заборонені операції:</tspan><tspan x="780.0" dy="13.0">• p++ / p-- (арифметика заборонена)</tspan><tspan x="780.0" dy="13.0">• p + 4 (для масивів є gsl::span)</tspan></text>
<line x1="40.0" y1="245.0" x2="920.0" y2="245.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="50.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Порівняння обробки розіменування у скомпільованому коді:</text>
<rect x="50.0" y="295.0" width="420.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="317.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Традиційний підхід (defensive programming):</tspan><tspan x="260.0" dy="14.3">void render(Widget* w) {</tspan><tspan x="260.0" dy="14.3">    if (!w) return; // Зайва runtime-перевірка у кожній функції!</tspan><tspan x="260.0" dy="14.3">    w-&gt;draw();</tspan><tspan x="260.0" dy="14.3">}</tspan></text>
<rect x="490.0" y="295.0" width="420.0" height="95.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="317.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Підхід GSL (Type-Driven Contract):</tspan><tspan x="700.0" dy="14.3">void render(gsl::not_null&lt;Widget*&gt; w) {</tspan><tspan x="700.0" dy="14.3">    w-&gt;draw(); // Перевірка виконана один раз на межі введення!</tspan><tspan x="700.0" dy="14.3">               // Нуль зайвих інструкцій у тілі функції.</tspan><tspan x="700.0" dy="14.3">}</tspan></text>
</svg>