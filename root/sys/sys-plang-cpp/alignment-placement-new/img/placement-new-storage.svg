<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл пам'яті та об'єкта при розміщувальному new</text>
<rect x="40.0" y="35.0" width="260.0" height="95.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">1. Сирий буфер пам'яті</tspan></text>
<rect x="320.0" y="35.0" width="580.0" height="95.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="78.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">alignas(T) std::byte buffer[sizeof(T)];</tspan><tspan x="610.0" dy="15.6">Байти виділені на стеку, у статичній пам'яті чи купі. Об'єкта ще нема.</tspan></text>
<line x1="170.0" y1="130.0" x2="170.0" y2="155.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="155.0" width="260.0" height="95.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="207.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">2. Контроль вирівнювання</tspan></text>
<rect x="320.0" y="155.0" width="580.0" height="95.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="206.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">std::align перевіряє адресу та зсуває вказівник на потрібне зміщення (padding offset).</tspan></text>
<line x1="170.0" y1="250.0" x2="170.0" y2="275.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="275.0" width="260.0" height="95.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="327.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">3. Розміщувальний new</tspan></text>
<rect x="320.0" y="275.0" width="580.0" height="95.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="318.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">new (ptr) Type(args...);</tspan><tspan x="610.0" dy="15.6">Виклик конструктора на підготовлених байтах. Початок часу життя об'єкта.</tspan></text>
<line x1="170.0" y1="370.0" x2="170.0" y2="395.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="395.0" width="260.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="447.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">4. Ручний виклик деструктора</tspan></text>
<rect x="320.0" y="395.0" width="580.0" height="95.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="439.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">ptr-&gt;~Type();</tspan><tspan x="610.0" dy="14.3">Завершення часу життя об'єкта. Буфер лишається цілим і готовим до повторного вжитку.</tspan></text>
</svg>