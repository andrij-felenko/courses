<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вирівнювання на розмір кеш-лінії та запобігання False Sharing</text>
<rect x="40.0" y="25.0" width="860.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="47.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Проблема: дві змінні в одній 64-байтній кеш-лінії (False Sharing)</tspan></text>
<rect x="60.0" y="75.0" width="820.0" height="75.0" rx="6" fill="#fff3cd" stroke="#c0392b" stroke-width="1.8"/>
<rect x="70.0" y="85.0" width="380.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Ядро 0 змінює a:</tspan><tspan x="260.0" dy="14.3">struct Data { int a; int b; } data;</tspan><tspan x="260.0" dy="14.3">(data.a на байті 0..3)</tspan></text>
<rect x="470.0" y="85.0" width="390.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="665.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">Ядро 1 змінює b:</tspan><tspan x="665.0" dy="14.3">(data.b на байті 4..7)</tspan><tspan x="665.0" dy="14.3">Постійне скидання лінії між кешами L1!</tspan></text>
<rect x="60.0" y="160.0" width="820.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="186.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Протокол когерентності (MESI) передає всю 64-байтну лінію між ядрами при кожному записі. Продуктивність падає в десятки разів.</tspan></text>
<line x1="40.0" y1="225.0" x2="900.0" y2="225.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="40.0" y="245.0" width="860.0" height="36.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="267.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Розв'язання: розділення на окремі кеш-лінії через alignas(hardware_destructive_interference_size)</tspan></text>
<rect x="60.0" y="295.0" width="390.0" height="85.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.6"/>
<rect x="75.0" y="305.0" width="360.0" height="65.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="255.0" y="327.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">Кеш-лінія 0 (64 байти):</tspan><tspan x="255.0" dy="14.3">alignas(64) int a;</tspan><tspan x="255.0" dy="14.3">Належить виключно Ядру 0</tspan></text>
<rect x="490.0" y="295.0" width="390.0" height="85.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.6"/>
<rect x="505.0" y="305.0" width="360.0" height="65.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="685.0" y="327.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">Кеш-лінія 1 (64 байти):</tspan><tspan x="685.0" dy="14.3">alignas(64) int b;</tspan><tspan x="685.0" dy="14.3">Належить виключно Ядру 1</tspan></text>
<rect x="60.0" y="395.0" width="820.0" height="55.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="426.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="470.0" dy="0.0">Ядра модифікують свої змінні повністю незалежно у власних кешах L1 без взаємного блокування та інвалідації шини.</tspan></text>
</svg>