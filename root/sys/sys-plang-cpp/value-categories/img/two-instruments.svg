<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="456" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два прилади відповідають на два різні питання</text>
<rect x="30.0" y="34.0" width="440.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="250.0" y="62.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">VALUE_CATEGORY(expr)</tspan><tspan x="250.0" dy="18.2">мірять на етапі компіляції</tspan></text>
<rect x="30.0" y="118.0" width="440.0" height="140.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="250.0" y="141.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">БАЧИТЬ</tspan><tspan x="250.0" dy="16.9"></tspan><tspan x="250.0" dy="16.9">категорію виразу:</tspan><tspan x="250.0" dy="16.9">lvalue · xvalue · prvalue</tspan><tspan x="250.0" dy="16.9">константність, що вимикає переміщення</tspan><tspan x="250.0" dy="16.9">нічого не виконує — навіть</tspan><tspan x="250.0" dy="16.9">ділення на нуль безпечне</tspan></text>
<rect x="30.0" y="274.0" width="440.0" height="104.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/><text x="250.0" y="305.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">НЕ БАЧИТЬ</tspan><tspan x="250.0" dy="16.9"></tspan><tspan x="250.0" dy="16.9">який конструктор справді спрацював</tspan><tspan x="250.0" dy="16.9">чи була копія, чи не була</tspan></text>
<rect x="490.0" y="34.0" width="440.0" height="66.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/><text x="710.0" y="62.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">тип, що кричить у конструкторах</tspan><tspan x="710.0" dy="18.2">мірять на етапі виконання</tspan></text>
<rect x="490.0" y="118.0" width="440.0" height="140.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/><text x="710.0" y="158.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">БАЧИТЬ</tspan><tspan x="710.0" dy="16.9"></tspan><tspan x="710.0" dy="16.9">який конструктор викликано</tspan><tspan x="710.0" dy="16.9">скільки разів скопійовано</tspan><tspan x="710.0" dy="16.9">чи спрацювало усунення копій</tspan></text>
<rect x="490.0" y="274.0" width="440.0" height="104.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/><text x="710.0" y="296.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">НЕ БАЧИТЬ</tspan><tspan x="710.0" dy="16.9"></tspan><tspan x="710.0" dy="16.9">категорію виразу, з якого</tspan><tspan x="710.0" dy="16.9">нічого не будують</tspan><tspan x="710.0" dy="16.9">відповідь коштує запуску програми</tspan></text>
<rect x="30.0" y="396.0" width="900.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="480.0" y="424.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">категорія — намір виразу, конструктор — наслідок: питання різні, отже й приладів два</tspan></text>
</svg>