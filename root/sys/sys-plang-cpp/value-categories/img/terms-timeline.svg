<rect x="214.0" y="152.0" width="176.0" height="152.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/><text x="302.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="302.0" dy="0.0">C · Денніс Річі</tspan><tspan x="302.0" dy="15.6"></tspan><tspan x="302.0" dy="15.6">лишилося одне слово:</tspan><tspan x="302.0" dy="15.6">lvalue проти</tspan><tspan x="302.0" dy="15.6">«не lvalue»</tspan></text>
<text x="486.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#c0392b" text-anchor="middle" font-weight="700">2002</text>
