<line x1="118.0" y1="104.0" x2="118.0" y2="120.0" stroke="#2457d6" stroke-width="3.0"/>
<rect x="30.0" y="152.0" width="176.0" height="152.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="118.0" y="193.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="118.0" dy="0.0">CPL · Крістофер Стрейчі</tspan><tspan x="118.0" dy="15.6"></tspan><tspan x="118.0" dy="15.6">L-режим дає місце,</tspan><tspan x="118.0" dy="15.6">R-режим дає вміст —</tspan><tspan x="118.0" dy="15.6">два способи обчислити</tspan><tspan x="118.0" dy="15.6">один вираз</tspan></text>
<text x="302.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#6b7280" text-anchor="middle" font-weight="700">1978</text>
