<line x1="342.0" y1="155.0" x2="383.0" y2="155.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="537.0" y1="155.0" x2="573.0" y2="155.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="650.0" y1="220.0" x2="650.0" y2="260.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="650.0" y1="260.0" x2="70.0" y2="260.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="70.0" y1="260.0" x2="70.0" y2="222.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="360.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">світ рухає тіло → давачі бачать наслідок</text>
<text x="390.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">той самий контур, що й у дрона чи ровера — змінюється лише вміст крайніх шарів</text>
