<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="810.0" height="410.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<rect x="30.0" y="35.0" width="360.0" height="370.0" rx="5" fill="#f8fafc" stroke="#2457d6" stroke-width="1.5"/>
<text x="210.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">ДОК-СТАНЦІЯ (Ground Station)</text>
<rect x="50.0" y="80.0" width="320.0" height="50.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="210.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Силове джерело (CC / CV Power Supply)</text>
<text x="210.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">U_out = 25.2V / 50.4V, I_limit = 15.0A</text>
<rect x="50.0" y="145.0" width="320.0" height="50.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="210.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Силове реле захисту (Power Interlock MOSFET/Relay)</text>
<text x="210.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Розімкнено у стані спокою, увімкнення лише після handshake</text>
<rect x="50.0" y="210.0" width="320.0" height="65.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="210.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Вузол 4-провідної діагностики контакту</text>
<text x="210.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Тестовий зонд струму: I_probe = 200 мА</text>
<text x="210.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Контроль падіння напруги dU → розрахунок R_contact</text>
<rect x="50.0" y="290.0" width="320.0" height="100.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="210.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Керівний MCU / Safety Watchdog</text>
<text x="210.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Перевірка полярності напруги (Reverse Polarity)</text>
<text x="210.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Примусове аварійне розмикання при струмі КЗ (&lt;10 мкс)</text>
<text x="210.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Моніторинг балансування комірок по CAN / SMBus</text>
<line x1="390.0" y1="105.0" x2="450.0" y2="105.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="390.0" y1="240.0" x2="450.0" y2="240.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="4,3"/>
<line x1="390.0" y1="370.0" x2="450.0" y2="370.0" stroke="#2457d6" stroke-width="2.0"/>
<rect x="405.0" y="95.0" width="30.0" height="20.0" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
<text x="420.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle" font-weight="700">V+</text>
<rect x="405.0" y="230.0" width="30.0" height="20.0" rx="3" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
<text x="420.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle" font-weight="700">Sense</text>
<rect x="405.0" y="360.0" width="30.0" height="20.0" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
<text x="420.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">GND</text>
<rect x="450.0" y="35.0" width="360.0" height="370.0" rx="5" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/>
<text x="630.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">БОРТ ДРОНА (UAV Onboard)</text>
<rect x="470.0" y="80.0" width="320.0" height="50.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="630.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захисний модуль (TVS + Ідеальний діод)</text>
<text x="630.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Захист від переполюсовки, іскрогасник soft-start</text>
<rect x="470.0" y="145.0" width="320.0" height="75.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="630.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">LiPo / Li-ion Акумуляторний блок (6S–12S)</text>
<text x="630.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• NTC термистори: T_max ≤ 45°C під час заряду</text>
<text x="630.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Окремий балансувальний порт комірок</text>
<rect x="470.0" y="235.0" width="320.0" height="75.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="630.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Смарт-BMS (Battery Management System)</text>
<text x="630.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Контроль напруги кожної комірки (±1 мВ)</text>
<text x="630.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Автоматичний захист від перезаряду (&gt;4.22 В/ком)</text>
<rect x="470.0" y="325.0" width="320.0" height="65.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="630.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Польотний контролер / Companion Computer</text>
<text x="630.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Телеметрія стану батареї по CAN / MAVLink</text>
<text x="630.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Блокування зльоту під час підключеного кабелю</text>
</svg>