<text x="820.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#047857" text-anchor="middle">• Стеження за кодом (DLL)</text>
<text x="820.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#047857" text-anchor="middle">• Стеження за фазою (PLL)</text>
<text x="820.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#047857" text-anchor="middle">• Оцінка C/N0 та детекція зриву</text>
<text x="820.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f766e" text-anchor="middle" font-weight="700">Вихід: C/N0, Doppler, Псевдодальності</text>
