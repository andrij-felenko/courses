<text x="450.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6d28d9" text-anchor="middle">AGC Monitor Value (0...8191)</text>
<rect x="35.0" y="335.0" width="430.0" height="155.0" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/>
<rect x="35.0" y="335.0" width="430.0" height="26.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.0"/>
<text x="250.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">Нормальний стан (Чистий ефір / Clean RF)</text>
<text x="50.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="start">• Вхідна потужність: P_in ≈ -111 dBm (тільки фоновий тепловий шум)</text>
<text x="50.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="start">• Підсилення VGA: максимальне (Gain 100%, agcCnt ≈ 7000...8191)</text>
<text x="50.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="start">• Квантування АЦП: оптимальне співвідношення бітів Знаку/Величини</text>
<text x="50.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="start">• C/N0 супутників: 40...48 dB-Hz, стабільне супроводження коду й фази</text>
<text x="50.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="start" font-weight="700">• Статус РЕБ: jamInd &lt; 30, jammingState = OK (загрози немає)</text>
<rect x="495.0" y="335.0" width="430.0" height="155.0" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
<rect x="495.0" y="335.0" width="430.0" height="26.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.0"/>
<text x="710.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">Дія РЕБ (Широкосмугова або тональна завада)</text>
<text x="510.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="start">• Вхідна потужність: P_in зростає до -80...-50 dBm (+30...+60 dB)</text>
<text x="510.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="start">• Підсилення VGA: петля АРП миттєво скидає Gain (agcCnt &lt; 1000)</text>
<text x="510.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="start">• Наслідок: сигнал супутника тоне в заваді нижче шуму квантування</text>
<text x="510.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="start">• C/N0 супутників: синхронний обвал до &lt; 25 dB-Hz, зрив PLL/DLL</text>
<text x="510.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="700">• Статус РЕБ: jamInd &gt; 180, jammingState = CRITICAL (втрата фіксу)</text>
</svg>