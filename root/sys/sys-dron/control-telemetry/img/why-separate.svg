<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Навіщо розділяти лінії (і часто — діапазони)</text>
<text x="470.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">вимоги ролей майже протилежні</text>
<rect x="60.0" y="76.0" width="270.0" height="200.0" rx="8" fill="#fafafa" stroke="#c0392b" stroke-width="1.6"/>
<text x="195.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Різні вимоги</text>
<line x1="80.0" y1="116.0" x2="310.0" y2="116.0" stroke="#e2e2e2" stroke-width="1.0"/>
<text x="195.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">керуванню — затримка,</tspan><tspan x="195.0" dy="15.0">телеметрії — обсяг даних,</tspan><tspan x="195.0" dy="15.0">відео — смуга; один канал</tspan><tspan x="195.0" dy="15.0">усе не потягне оптимально</tspan></text>
<rect x="355.0" y="76.0" width="270.0" height="200.0" rx="8" fill="#fafafa" stroke="#b08900" stroke-width="1.6"/>
<text x="490.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b08900" text-anchor="middle" font-weight="700">Різні діапазони</text>
<line x1="375.0" y1="116.0" x2="605.0" y2="116.0" stroke="#e2e2e2" stroke-width="1.0"/>
<text x="490.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">керування 2.4/868/433 МГц,</tspan><tspan x="490.0" dy="15.0">телеметрія 433/915 МГц,</tspan><tspan x="490.0" dy="15.0">відео 5.8 ГГц —</tspan><tspan x="490.0" dy="15.0">не глушать одне одного</tspan></text>
<rect x="650.0" y="76.0" width="270.0" height="200.0" rx="8" fill="#fafafa" stroke="#27ae60" stroke-width="1.6"/>
<text x="785.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Безпека</text>
<line x1="670.0" y1="116.0" x2="900.0" y2="116.0" stroke="#e2e2e2" stroke-width="1.0"/>
<text x="785.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">критичну лінію керування</tspan><tspan x="785.0" dy="15.0">ізолюють, щоб збій відео</tspan><tspan x="785.0" dy="15.0">чи телеметрії її</tspan><tspan x="785.0" dy="15.0">не зачепив</tspan></text>
</svg>