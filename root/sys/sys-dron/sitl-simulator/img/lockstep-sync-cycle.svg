<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 914 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="914" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Покрокова синхронізація lockstep: гарантія точного відтворення польоту</text>
<rect x="20.0" y="20.0" width="820.0" height="380.0" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="430.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Синхронізація часу Lockstep (узгоджений крок) проти вільного ходу</text>
<rect x="70.0" y="70.0" width="220.0" height="38.0" rx="6" fill="#eff5ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="180.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Симулятор фізики (FDM)</text>
<rect x="570.0" y="70.0" width="220.0" height="38.0" rx="6" fill="#eaf8ed" stroke="#27ae60" stroke-width="1.6"/>
<text x="680.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Автопілот (ArduPilot / PX4)</text>
<line x1="180.0" y1="115.0" x2="180.0" y2="375.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="680.0" y1="115.0" x2="680.0" y2="375.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="168.0" y="130.0" width="24.0" height="40.0" rx="6" fill="#eff5ff" stroke="#2457d6" stroke-width="1.2"/>
<line x1="192.0" y1="145.0" x2="668.0" y2="165.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">1. Пакет сенсорів [ t = t₀, IMU, Baro, GPS ]</text>
<rect x="115.0" y="178.0" width="130.0" height="75.0" rx="4" fill="#fef8e7" stroke="#c28200" stroke-width="1.2"/>
<text x="180.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#855800" text-anchor="middle" font-weight="700">ПАУЗА ЧАСУ</text>
<text x="180.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Фізика зупинена,</text>
<text x="180.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">очікування команд u(t₀)</text>
<rect x="668.0" y="165.0" width="24.0" height="60.0" rx="6" fill="#eaf8ed" stroke="#27ae60" stroke-width="1.2"/>
<text x="705.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Оновлення годинника автопілота: t_sim = t₀</text>
<text x="705.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Такт фільтрації EKF та обчислення PID</text>
<text x="705.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Розрахунок вихідних сигналів мікшера</text>
<line x1="668.0" y1="225.0" x2="192.0" y2="255.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">2. Команди актуаторів [ u(t₀) = {PWM₁, PWM₂, ...} ]</text>
<rect x="168.0" y="255.0" width="24.0" height="65.0" rx="6" fill="#eff5ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="155.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end">Інтегрування 6 DOF на крок Δt</text>
<text x="155.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#855800" text-anchor="end" font-weight="700">Новий час: t₁ = t₀ + Δt</text>
<text x="155.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="end">Генерація шуму нових сенсорів</text>
<line x1="192.0" y1="320.0" x2="668.0" y2="340.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">3. Пакет сенсорів [ t = t₁ = t₀ + Δt ]</text>
<rect x="40.0" y="368.0" width="780.0" height="24.0" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="430.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Повна детермінованість: навантаження процесора змінює реальну швидкість, але не математичний результат польоту</text>
</svg>