<text x="210.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">FTDI 3–12 Мбіт/с або CAN-адаптер</text>
<rect x="480.0" y="75.0" width="340.0" height="270.0" rx="10" fill="#eaf8ed" stroke="#27ae60" stroke-width="2.0"/>
<text x="650.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ФІЗИЧНИЙ ПОЛЬОТНИЙ КОНТРОЛЕР</text>
<text x="650.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Реальна плата: STM32H7 / RTOS NuttX / ChibiOS</text>
