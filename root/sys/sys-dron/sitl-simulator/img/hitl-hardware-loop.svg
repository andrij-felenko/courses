<text x="430.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Команди ШІМ</text>
<rect x="40.0" y="365.0" width="780.0" height="26.0" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="430.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">HITL виявляє апаратні вузькі місця: переповнення стека, переривання DMA, затримки шини та реальні таймінги ОС</text>
