<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стенд апаратного моделювання в контурі (HITL): фізичний контролер у віртуальному середовищі</text>
<rect x="20.0" y="20.0" width="820.0" height="380.0" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="430.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратне моделювання в контурі (Hardware-In-The-Loop — HITL)</text>
<rect x="40.0" y="75.0" width="340.0" height="270.0" rx="10" fill="#eff5ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="210.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ХОСТОВИЙ ПК (СИМУЛЯТОР ФІЗИКИ)</text>
<text x="210.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">JSBSim / Gazebo / X-Plane у реальному часі</text>
