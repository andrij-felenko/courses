<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Генерація шумів сенсорів: моделювання похибок акселерометра, гіроскопа, барометра та GNSS</text>
<rect x="20.0" y="20.0" width="820.0" height="340.0" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="430.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Синтез сигналів сенсорів: перетворення істинного стану в зашумлені виміри</text>
<rect x="40.0" y="75.0" width="170.0" height="260.0" rx="8" fill="#eaf8ed" stroke="#27ae60" stroke-width="1.8"/>
<text x="125.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ІСТИННИЙ СТАН</text>
<text x="125.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ground Truth FDM</text>
<line x1="55.0" y1="130.0" x2="195.0" y2="130.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="60.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Положення: r_ned</text>
<text x="60.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Швидкість: v_ned</text>
<text x="60.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Прискорення: a_ned</text>
<text x="60.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Кутова шв.: ω_body</text>
<text x="60.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Орієнтація: q_nb</text>
<text x="60.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Атмосфера: P(h), T(h)</text>
<rect x="250.0" y="75.0" width="360.0" height="260.0" rx="8" fill="#fef8e7" stroke="#c28200" stroke-width="1.8"/>
<text x="430.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#855800" text-anchor="middle" font-weight="700">ШУМОВІ МОДЕЛІ ДАВАЧІВ</text>
<text x="430.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Фізичні спотворення реального світу</text>
<line x1="265.0" y1="130.0" x2="595.0" y2="130.0" stroke="#c28200" stroke-width="1.0"/>
<rect x="265.0" y="140.0" width="330.0" height="38.0" rx="4" fill="#ffffff" stroke="#c28200" stroke-width="1.0"/>
<text x="275.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#855800" text-anchor="start" font-weight="700">Акселерометр:</text>
<text x="370.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">a_meas = R(a - g) + bias + w_acc</text>
<text x="275.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Дрейф зміщення 1-го порядку Гаусса-Маркова</text>
<rect x="265.0" y="185.0" width="330.0" height="38.0" rx="4" fill="#ffffff" stroke="#c28200" stroke-width="1.0"/>
<text x="275.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#855800" text-anchor="start" font-weight="700">Гіроскоп:</text>
<text x="340.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ω_meas = ω + bias_gyro + w_gyro</text>
<text x="275.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Вібраційний шум від обертів двигунів</text>
<rect x="265.0" y="230.0" width="330.0" height="44.0" rx="4" fill="#ffffff" stroke="#c28200" stroke-width="1.0"/>
<text x="275.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#855800" text-anchor="start" font-weight="700">Барометр / GNSS:</text>
<text x="390.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">P_baro = P₀ · (1 - L·h/T₀)^(gM/RL)</text>
<text x="275.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">GNSS: затримка 200 мс, джиттер HDOP/VDOP, 5-10 Гц</text>
<rect x="265.0" y="280.0" width="330.0" height="44.0" rx="4" fill="#ffffff" stroke="#c28200" stroke-width="1.0"/>
<text x="275.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#855800" text-anchor="start" font-weight="700">Магнітометр:</text>
<text x="370.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">B_meas = A_soft · R · B_earth + V_hard</text>
<text x="275.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Модель геомагнітного поля WMM + наведення струму</text>
<rect x="650.0" y="75.0" width="170.0" height="260.0" rx="8" fill="#eff5ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="735.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">СИНТЕТИЧНІ ДАНІ</text>
<text x="735.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Сирі виміри для HAL</text>
<line x1="665.0" y1="130.0" x2="805.0" y2="130.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="670.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• IMU (1000 Гц)</text>
<text x="670.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Baro (50-100 Гц)</text>
<text x="670.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Mag (50-100 Гц)</text>
<text x="670.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• GNSS (5-10 Гц)</text>
<text x="670.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• Квантування АЦП</text>
<line x1="210.0" y1="205.0" x2="250.0" y2="205.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="610.0" y1="205.0" x2="650.0" y2="205.0" stroke="#c28200" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>