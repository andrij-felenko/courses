<text x="270.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">PID коефіцієнти (MC_ROLL_P), офсети сенсорів (ACC_OFF_X), матриця інерції</text>
