<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де саме зникає різниця між двома описами</text>
<rect x="160.2" y="67.0" width="179.6" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="90.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">опис із полем quality</tspan><tspan x="250.0" dy="16.9">CRC-16 = 0x098A</tspan></text>
<rect x="660.2" y="67.0" width="179.6" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="90.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">опис із полем quarity</tspan><tspan x="750.0" dy="16.9">CRC-16 = 0x20A3</tspan></text>
<line x1="250.0" y1="124.0" x2="250.0" y2="166.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="750.0" y1="124.0" x2="750.0" y2="166.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="175.0" y="169.1" width="150.0" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="192.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">згортання половин</tspan><tspan x="250.0" dy="16.9">0x8A ^ 0x09</tspan></text>
<rect x="675.0" y="169.1" width="150.0" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="192.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">згортання половин</tspan><tspan x="750.0" dy="16.9">0xA3 ^ 0x20</tspan></text>
<line x1="250.0" y1="228.0" x2="430.0" y2="278.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="750.0" y1="228.0" x2="570.0" y2="278.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="373.1" y="287.5" width="253.7" height="37.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="310.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">CRC_EXTRA = 0x83 = 131 — в обох</tspan></text>
<line x1="500.0" y1="328.0" x2="500.0" y2="352.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="291.6" y="355.1" width="416.7" height="53.9" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="378.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="500.0" dy="0.0">Δ = 0x098A ^ 0x20A3 = 0x2929</tspan><tspan x="500.0" dy="16.9">старший байт дорівнює молодшому — згортання їх знищує</tspan></text>
<text x="500.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">таких ненульових Δ рівно 255 із 65535; у кожного байта рівно 256 прообразів</text>
</svg>