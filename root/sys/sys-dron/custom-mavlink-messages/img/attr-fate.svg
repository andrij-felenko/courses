<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Опис багатший за заголовок: більшість атрибутів у C не доходить</text>
<text x="245.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">Написано в описі</text>
<text x="870.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">Видно в згенерованому заголовку</text>
<rect x="70.0" y="92.0" width="350.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="245.0" y="136.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">type · name</tspan></text>
<line x1="426.0" y1="131.0" x2="634.0" y2="131.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="92.0" width="460.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="870.0" y="117.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">член структури, зсув у кадрі, MAVLINK_TYPE_*,</tspan><tspan x="870.0" dy="18.2">аргументи _pack і назви геттерів,</tspan><tspan x="870.0" dy="18.2">і — головне — байт CRC_EXTRA</tspan></text>
<rect x="70.0" y="196.0" width="350.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="245.0" y="232.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">print_format</tspan></text>
<line x1="426.0" y1="227.0" x2="634.0" y2="227.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="196.0" width="460.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="870.0" y="222.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">рядок формату в MAVLINK_MESSAGE_INFO;</tspan><tspan x="870.0" dy="18.2">без атрибута там стоїть NULL</tspan></text>
<rect x="70.0" y="286.0" width="350.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="245.0" y="322.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">units</tspan></text>
<line x1="426.0" y1="317.0" x2="634.0" y2="317.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="286.0" width="460.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="870.0" y="312.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">коментар біля члена структури</tspan><tspan x="870.0" dy="18.2">й @param у doxygen — і більше нічого</tspan></text>
<rect x="70.0" y="376.0" width="350.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="245.0" y="436.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle"><tspan x="245.0" dy="0.0">enum · display · instance</tspan><tspan x="245.0" dy="19.5">invalid · multiplier · default</tspan><tspan x="245.0" dy="19.5">minValue · maxValue · increment</tspan></text>
<line x1="426.0" y1="451.0" x2="634.0" y2="451.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="376.0" width="460.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="870.0" y="437.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="870.0" dy="0.0">у C-заголовку немає жодного сліду;</tspan><tspan x="870.0" dy="18.2">їх читають генератор документації,</tspan><tspan x="870.0" dy="18.2">генератори інших мов і наземні станції</tspan></text>
</svg>