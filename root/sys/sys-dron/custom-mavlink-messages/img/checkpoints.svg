<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1140" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Після кожного кроку — своя перевірка: протокол діагностики не дає</text>
<text x="183.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">Крок</text>
<text x="504.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">Чим перевірити</text>
<text x="891.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">Що бачите, якщо крок не спрацював</text>
<rect x="40.0" y="100.0" width="286.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="183.0" y="140.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="183.0" dy="0.0">1. Опис у діалекті</tspan></text>
<rect x="344.0" y="100.0" width="320.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="504.0" y="132.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="504.0" dy="0.0">mavgen руками,</tspan><tspan x="504.0" dy="16.9">без збірки станції</tspan></text>
<rect x="682.0" y="100.0" width="418.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="891.0" y="132.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="891.0" dy="0.0">генератор лається на XML —</tspan><tspan x="891.0" dy="16.9">єдина гучна помилка на шляху</tspan></text>
<line x1="334.0" y1="136.0" x2="336.0" y2="136.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="186.0" width="286.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="183.0" y="218.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="183.0" dy="0.0">2. Станція зібрана</tspan><tspan x="183.0" dy="16.9">з вашим діалектом</tspan></text>
<rect x="344.0" y="186.0" width="320.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="504.0" y="218.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="504.0" dy="0.0">три сталі згенерованого</tspan><tspan x="504.0" dy="16.9">заголовка з обох боків</tspan></text>
<rect x="682.0" y="186.0" width="418.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="891.0" y="218.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="891.0" dy="0.0">сталі різні: кадр гинутиме</tspan><tspan x="891.0" dy="16.9">як «погана сума»</tspan></text>
<line x1="334.0" y1="222.0" x2="336.0" y2="222.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="272.0" width="286.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="183.0" y="312.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="183.0" dy="0.0">3. Кадр доходить у ефірі</tspan></text>
<rect x="344.0" y="272.0" width="320.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="504.0" y="304.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="504.0" dy="0.0">інспектор MAVLink,</tspan><tspan x="504.0" dy="16.9">жодного рядка коду</tspan></text>
<rect x="682.0" y="272.0" width="418.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="891.0" y="304.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="891.0" dy="0.0">повідомлення немає в списку,</tspan><tspan x="891.0" dy="16.9">росте лічильник утрат</tspan></text>
<line x1="334.0" y1="308.0" x2="336.0" y2="308.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="358.0" width="286.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="183.0" y="398.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="183.0" dy="0.0">4. Розбір і факт</tspan></text>
<rect x="344.0" y="358.0" width="320.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="504.0" y="390.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="504.0" dy="0.0">показник на екрані</tspan><tspan x="504.0" dy="16.9">проти інспектора</tspan></text>
<rect x="682.0" y="358.0" width="418.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="891.0" y="390.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="891.0" dy="0.0">інспектор показує, екран — ні:</tspan><tspan x="891.0" dy="16.9">гачок не викликано</tspan></text>
<line x1="334.0" y1="394.0" x2="336.0" y2="394.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="444.0" width="286.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="183.0" y="484.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="183.0" dy="0.0">5. Кнопка й частота</tspan></text>
<rect x="344.0" y="444.0" width="320.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="504.0" y="476.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="504.0" dy="0.0">значення, що повернула</tspan><tspan x="504.0" dy="16.9">відправка, і відгук борту</tspan></text>
<rect x="682.0" y="444.0" width="418.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="891.0" y="476.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="891.0" dy="0.0">відправка вернула «ні»:</tspan><tspan x="891.0" dy="16.9">основного каналу вже немає</tspan></text>
<line x1="334.0" y1="480.0" x2="336.0" y2="480.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>