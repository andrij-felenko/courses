<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три споживачі власного повідомлення, і один із них безкоштовний</text>
<rect x="369.8" y="73.5" width="320.4" height="37.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="96.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Цілий кадр із вашим номером повідомлення</tspan></text>
<line x1="430.0" y1="124.0" x2="190.0" y2="184.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="124.0" x2="530.0" y2="184.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="630.0" y1="124.0" x2="870.0" y2="184.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="110.0" y="191.1" width="150.0" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="214.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">Інспектор MAVLink</tspan><tspan x="185.0" dy="16.9">без жодного коду</tspan></text>
<rect x="410.6" y="191.1" width="238.9" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="214.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">QGCCorePlugin::mavlinkMessage</tspan><tspan x="530.0" dy="16.9">у вендорській збірці</tspan></text>
<rect x="774.1" y="191.1" width="201.8" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="875.0" y="214.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">Своя група фактів</tspan><tspan x="875.0" dy="16.9">і прив'язка в інтерфейсі</tspan></text>
<text x="185.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="185.0" dy="0.0">читає поля з таблиці описів</tspan><tspan x="185.0" dy="15.6">(MAVLINK_USE_MESSAGE_INFO)</tspan></text>
<text x="530.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="530.0" dy="0.0">файли апстриму</tspan><tspan x="530.0" dy="15.6">не змінено жодного</tspan></text>
<text x="875.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="875.0" dy="0.0">величина стає такою самою,</tspan><tspan x="875.0" dy="15.6">як висота чи напруга</tspan></text>
<line x1="80.0" y1="372.0" x2="980.0" y2="372.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,5"/>
<rect x="317.9" y="409.5" width="424.1" height="37.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="530.0" y="432.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="530.0" dy="0.0">Правка Vehicle.cc — лише разом із відправкою в апстрим</tspan></text>
