<text x="150.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">PX4 / ArduPilot</tspan><tspan x="150.0" dy="12.3">Диспетчер потоків MAVLink</tspan></text>
<rect x="290.0" y="95.0" width="220.0" height="80.0" rx="5" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="400.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Маршрутизатор каналів</text>
<text x="400.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="400.0" dy="0.0">Визначення стану каналів</tspan><tspan x="400.0" dy="12.3">Перемикання Standard ↔ HLP</tspan></text>
