<line x1="665.0" y1="156.0" x2="695.0" y2="156.0" stroke="#d97706" stroke-width="1.2"/>
<rect x="35.0" y="205.0" width="375.0" height="115.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="222.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Основний канал: Пряма радіовидимість (LOS)</text>
<text x="222.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="222.0" dy="0.0">Частота: 433 / 868 / 915 МГц або Wi-Fi / COFDM</tspan><tspan x="222.0" dy="12.3">Пропускна здатність: 57.6 .. 115.2 кбіт/с</tspan><tspan x="222.0" dy="12.3">Затримка (RTT): 20 .. 80 мс</tspan><tspan x="222.0" dy="12.3">Повний потік телеметрії: 2000 байт/с (10..50 Гц)</tspan></text>
<rect x="430.0" y="205.0" width="375.0" height="115.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="617.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">Резервний канал: Супутниковий зв'язок (BVLOS)</text>
<text x="617.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="617.0" dy="0.0">Супутникова мережа: Iridium SBD / Inmarsat IDP</tspan><tspan x="617.0" dy="12.3">Пропускна здатність: лімітовані пакети (SBD ~340 B)</tspan><tspan x="617.0" dy="12.3">Затримка (RTT): 5 .. 30 секунд</tspan><tspan x="617.0" dy="12.3">Агреговане повідомлення HIGH_LATENCY2: 3.85 байт/с</tspan></text>
<line x1="607.0" y1="195.0" x2="222.0" y2="205.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="607.0" y1="195.0" x2="617.0" y2="205.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="35.0" y="335.0" width="770.0" height="105.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="420.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наземна станція керування (GCS: QGroundControl / Mission Planner)</text>
<rect x="50.0" y="370.0" width="350.0" height="58.0" rx="4" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="225.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Режим прямого зв'язку (Standard)</text>
<text x="225.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Плавний авіагоризонт, жива телеметрія 20 Гц,</tspan><tspan x="225.0" dy="12.3">миттєве підтвердження команд оператора</tspan></text>
<rect x="440.0" y="370.0" width="350.0" height="58.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="615.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700">Режим високої затримки (High Latency)</text>
<text x="615.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Оновлення позиції 1 раз на 20..100 с, тайм-аути</tspan><tspan x="615.0" dy="12.3">команд 60 с, відображення бітових прапорців відмов</tspan></text>
