<text x="420.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура каналів зв'язку БПЛА: лінія прямої видимості та супутниковий міст</text>
