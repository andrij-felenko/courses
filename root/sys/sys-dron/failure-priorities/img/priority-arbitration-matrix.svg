<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр пріоритетного арбітражу аварійних ситуацій</text>
<text x="110.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Детектори відмов</text>
<rect x="20.0" y="78.0" width="180.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="104.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Втрата зв'язку RC / GCS</tspan></text>
<rect x="20.0" y="143.0" width="180.0" height="44.0" rx="6" fill="#fef9e7" stroke="#b7791f" stroke-width="1.5"/><text x="110.0" y="168.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Низький заряд батареї (30%)</tspan></text>
<rect x="20.0" y="208.0" width="180.0" height="44.0" rx="6" fill="#fef9e7" stroke="#b7791f" stroke-width="1.5"/><text x="110.0" y="233.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Глушіння GNSS / збій EKF</tspan></text>
<rect x="20.0" y="273.0" width="180.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="110.0" y="299.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Критичний розряд (&lt;10%)</tspan></text>
<rect x="20.0" y="338.0" width="180.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="110.0" y="363.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Втрата просторового контролю</tspan></text>
<rect x="280.0" y="75.0" width="200.0" height="310.0" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2.0"/>
<text x="380.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пріоритетний арбітр</text>
<text x="380.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(таблиця ваг і рангів)</text>
<line x1="200.0" y1="100.0" x2="280.0" y2="100.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="200.0" y1="165.0" x2="280.0" y2="165.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="200.0" y1="230.0" x2="280.0" y2="230.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="200.0" y1="295.0" x2="280.0" y2="295.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="200.0" y1="360.0" x2="280.0" y2="360.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="295.0" y="142.0" width="170.0" height="26.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="380.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Ранг 0: FTS / Парашут</text>
<rect x="295.0" y="178.0" width="170.0" height="26.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="380.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Ранг 1: Emergency Land</text>
<rect x="295.0" y="214.0" width="170.0" height="26.0" rx="4" fill="#ffffff" stroke="#b7791f" stroke-width="1.2"/>
<text x="380.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b7791f" text-anchor="middle" font-weight="700">Ранг 2: Geofence Breach</text>
<rect x="295.0" y="250.0" width="170.0" height="26.0" rx="4" fill="#ffffff" stroke="#b7791f" stroke-width="1.2"/>
<text x="380.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b7791f" text-anchor="middle" font-weight="700">Ранг 3: Low Battery RTL</text>
<rect x="295.0" y="286.0" width="170.0" height="26.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="380.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Ранг 4: RC Loss Action</text>
<rect x="295.0" y="322.0" width="170.0" height="26.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="380.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Ранг 5: Sensor Degradation</text>
<rect x="540.0" y="110.0" width="160.0" height="240.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="620.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Сенсорна</text>
<text x="620.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">здійсненність</text>
<text x="620.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Перевірка 3D-позиції,</text>
<text x="620.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">висоти та орієнтації</text>
<rect x="552.0" y="215.0" width="136.0" height="44.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="620.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">RTL без GNSS ➔</text>
<text x="620.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">деградація до Land</text>
<rect x="552.0" y="272.0" width="136.0" height="44.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="620.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Land без барометра ➔</text>
<text x="620.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">фіксований газ / FTS</text>
<line x1="480.0" y1="230.0" x2="540.0" y2="230.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="230.0" x2="750.0" y2="230.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="745.0" y="175.0" width="110.0" height="110.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="2.0"/><text x="800.0" y="210.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">Атомарна</tspan><tspan x="800.0" dy="15.6">безпечна</tspan><tspan x="800.0" dy="15.6">дія</tspan><tspan x="800.0" dy="15.6">(Dispatch)</tspan></text>
<rect x="50.0" y="415.0" width="780.0" height="45.0" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.2"/>
<text x="440.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b21a8" text-anchor="middle" font-weight="700">Правило витіснення: аварія рангу 1 (Critical Battery) негайно перериває RTL (ранг 3),</text>
<text x="440.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b21a8" text-anchor="middle">а відсутність GNSS-фіксу деградує навігаційні маневри до керованої посадки на місці.</text>
</svg>