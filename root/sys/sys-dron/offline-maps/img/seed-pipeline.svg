<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1320" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сім кроків складання набору й три місця, де він тихо ламається</text>
<rect x="60.0" y="76.0" width="440.0" height="64.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/><text x="280.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">1 · прямокутник і рівні</tspan><tspan x="280.0" dy="18.2">→ перелік клітинок z / x / y</tspan></text>
<rect x="560.0" y="76.0" width="700.0" height="64.0" rx="6" fill="#ffffff" stroke="#c8d2dc" stroke-width="1.4"/><text x="910.0" y="104.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">широту затискаємо на ±85.0511°: далі tan(90°) вибухає,</tspan><tspan x="910.0" dy="16.9">а клітинок за цією межею просто немає</tspan></text>
<line x1="280.0" y1="143.0" x2="280.0" y2="158.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="162.0" width="440.0" height="64.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/><text x="280.0" y="189.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">2 · качалка: рівний темп,</tspan><tspan x="280.0" dy="18.2">одне з'єднання на робітника</tspan></text>
<rect x="560.0" y="162.0" width="700.0" height="64.0" rx="6" fill="#ffffff" stroke="#c8d2dc" stroke-width="1.4"/><text x="910.0" y="190.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">тисячі запитів з однієї адреси — саме те, що забороняють</tspan><tspan x="910.0" dy="16.9">умови більшості тайлових служб</tspan></text>
<line x1="280.0" y1="229.0" x2="280.0" y2="244.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="248.0" width="440.0" height="64.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/><text x="280.0" y="275.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">3 · відсів: заглушки</tspan><tspan x="280.0" dy="18.2">й не-картинки — за борт</tspan></text>
<rect x="560.0" y="248.0" width="700.0" height="64.0" rx="6" fill="#ffffff" stroke="#c8d2dc" stroke-width="1.4"/><text x="910.0" y="276.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">«немає знімка» приходить із кодом 200; ловимо за</tspan><tspan x="910.0" dy="16.9">повторюваністю тіла, а не за статусом відповіді</tspan></text>
<line x1="280.0" y1="315.0" x2="280.0" y2="330.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="334.0" width="440.0" height="64.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/><text x="280.0" y="361.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">4 · Tiles: hash, format, tile,</tspan><tspan x="280.0" dy="18.2">size, type, date</tspan></text>
<rect x="560.0" y="334.0" width="700.0" height="64.0" rx="6" fill="#fdeceb" stroke="#c0392b" stroke-width="1.8"/><text x="910.0" y="362.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">код провайдера з чужої збірки — рядок у базі є,</tspan><tspan x="910.0" dy="16.9">але станція питає інший ключ: тайла ніби немає</tspan></text>
<text x="542.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">!</text>
<line x1="280.0" y1="401.0" x2="280.0" y2="416.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="420.0" width="440.0" height="64.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/><text x="280.0" y="447.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">5 · SetTiles: (setID, tileID)</tspan><tspan x="280.0" dy="18.2">на КОЖЕН тайл</tspan></text>
<rect x="560.0" y="420.0" width="700.0" height="64.0" rx="6" fill="#fdeceb" stroke="#c0392b" stroke-width="1.8"/><text x="910.0" y="448.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">без цього рядка злиття не перенесе тайл узагалі:</tspan><tspan x="910.0" dy="16.9">імпорт іде наборами, а не таблицею Tiles</tspan></text>
<text x="542.0" y="457.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">!</text>
<line x1="280.0" y1="487.0" x2="280.0" y2="502.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="506.0" width="440.0" height="64.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/><text x="280.0" y="533.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">6 · TileSets: numTiles =</tspan><tspan x="280.0" dy="18.2">фактична кількість</tspan></text>
<rect x="560.0" y="506.0" width="700.0" height="64.0" rx="6" fill="#ffffff" stroke="#c8d2dc" stroke-width="1.4"/><text x="910.0" y="534.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">не оновив — набір приїде з нулем у лічильнику</tspan><tspan x="910.0" dy="16.9">й виглядатиме порожнім</tspan></text>
<line x1="280.0" y1="573.0" x2="280.0" y2="588.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="592.0" width="440.0" height="64.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/><text x="280.0" y="619.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">7 · PRAGMA user_version = 1</tspan><tspan x="280.0" dy="18.2">→ файл .qgctiledb</tspan></text>
<rect x="560.0" y="592.0" width="700.0" height="64.0" rx="6" fill="#fdeceb" stroke="#c0392b" stroke-width="1.8"/><text x="910.0" y="620.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">інший номер схеми — станція скине ВЕСЬ кеш</tspan><tspan x="910.0" dy="16.9">при першому ж запуску</tspan></text>
<text x="542.0" y="629.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">!</text>
</svg>