<line x1="680.0" y1="140.0" x2="160.0" y2="140.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1. HEARTBEAT (#0) — тип апарата, автопілот, стан готовності</text>
<line x1="160.0" y1="205.0" x2="680.0" y2="205.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2. COMMAND_LONG: MAV_CMD_REQUEST_MESSAGE (#512) [param1 = 148]</text>
<line x1="680.0" y1="270.0" x2="160.0" y2="270.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="420.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. AUTOPILOT_VERSION (#148) — маска capabilities, версії SemVer, UID2</text>
<line x1="680.0" y1="330.0" x2="160.0" y2="330.0" stroke="#16a085" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="420.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a085" text-anchor="middle">4. COMMAND_ACK (#77) — command=512, result=MAV_RESULT_ACCEPTED</text>
<rect x="49.1" y="368.7" width="221.8" height="62.6" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="384.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Розбір маски capabilities:</tspan><tspan x="160.0" dy="12.3">✓ MISSION_INT (int32 координати)</tspan><tspan x="160.0" dy="12.3">✓ PARAM_UNION / FTP (швидкі параметри)</tspan><tspan x="160.0" dy="12.3">✓ PROTOCOL_V2 (MAVLink 2.0)</tspan></text>
<line x1="160.0" y1="460.0" x2="680.0" y2="460.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
