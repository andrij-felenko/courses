<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Процедура запиту та узгодження можливостей (Capability Handshake)</text>
<rect x="40.9" y="47.3" width="238.2" height="45.3" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="66.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Наземна станція (GCS)</tspan><tspan x="160.0" dy="14.3">QGroundControl / Mission Planner</tspan></text>
<rect x="564.3" y="47.3" width="231.4" height="45.3" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="680.0" y="66.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">Польотний контролер (Autopilot)</tspan><tspan x="680.0" dy="14.3">PX4 / ArduPilot</tspan></text>
<line x1="160.0" y1="98.0" x2="160.0" y2="360.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="160.0" y1="445.0" x2="160.0" y2="480.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
