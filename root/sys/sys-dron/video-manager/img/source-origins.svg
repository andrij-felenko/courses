<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="660" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три походження адреси відеопотоку</text>
<rect x="60.0" y="93.9" width="380.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="115.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Налаштування користувача</tspan><tspan x="250.0" dy="18.2">тип джерела + поле адреси</tspan></text>
<rect x="540.0" y="84.8" width="330.0" height="70.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="705.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">схема за типом:</tspan><tspan x="705.0" dy="18.2">udp:// udp265://</tspan><tspan x="705.0" dy="18.2">mpegts:// tcp:// rtsp://</tspan></text>
<line x1="448.0" y1="120.0" x2="532.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="273.9" width="380.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="295.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">VIDEO_STREAM_INFORMATION</tspan><tspan x="250.0" dy="18.2">метадані камери з борту</tspan></text>
<rect x="540.0" y="264.8" width="330.0" height="70.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="705.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">тип потоку → джерело,</tspan><tspan x="705.0" dy="18.2">сам порт добудовується</tspan><tspan x="705.0" dy="18.2">до повної адреси</tspan></text>
<line x1="448.0" y1="300.0" x2="532.0" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="940.0" y="183.9" width="250.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/><text x="1065.0" y="205.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1065.0" dy="0.0">рядок-адреса</tspan><tspan x="1065.0" dy="18.2">у приймача</tspan></text>
<line x1="878.0" y1="120.0" x2="932.0" y2="186.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="878.0" y1="300.0" x2="932.0" y2="234.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="453.9" width="380.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="475.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Локальна USB-камера</tspan><tspan x="250.0" dy="18.2">пристрій, який бачить система</tspan></text>
<rect x="540.0" y="453.9" width="330.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="705.0" y="475.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">лише ідентифікатор</tspan><tspan x="705.0" dy="18.2">пристрою, без адреси</tspan></text>
<rect x="940.0" y="453.9" width="250.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/><text x="1065.0" y="475.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1065.0" dy="0.0">елемент QML</tspan><tspan x="1065.0" dy="18.2">малює камеру сам</tspan></text>
<line x1="448.0" y1="480.0" x2="532.0" y2="480.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="878.0" y1="480.0" x2="932.0" y2="480.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="40.0" y1="390.0" x2="1200.0" y2="390.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="7,6"/>
<text x="60.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-style="italic">мережевий потік — через приймач</text>
<text x="60.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-style="italic">локальний пристрій — повз приймач</text>
<text x="705.0" y="574.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="705.0" dy="0.0">доки апарат надсилає метадані потоку,</tspan><tspan x="705.0" dy="18.2">вибір джерела в налаштуваннях неактивний</tspan></text>
</svg>