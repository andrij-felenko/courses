<text x="735.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">інтервали змикаються: кінець одного = початок наступного, тож накладка не блимає</text>
