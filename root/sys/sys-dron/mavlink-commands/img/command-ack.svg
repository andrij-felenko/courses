<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Команда й підтвердження: COMMAND_LONG → COMMAND_ACK</text>
<rect x="70.0" y="34.0" width="220.0" height="30.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="180.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">наземна станція</text>
<rect x="640.0" y="34.0" width="160.0" height="30.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="720.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">дрон</text>
<line x1="180.0" y1="70.0" x2="180.0" y2="430.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,5"/>
<line x1="720.0" y1="70.0" x2="720.0" y2="430.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,5"/>
<line x1="180.0" y1="120.0" x2="490.0" y2="148.0" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="2,4"/>
<text x="194.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">COMMAND_LONG  (взліт, confirmation=0)</text>
<text x="520.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">✗ загубилось у каналі</text>
<text x="166.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">тайм-аут → повтор</text>
<line x1="180.0" y1="210.0" x2="720.0" y2="228.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="194.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">COMMAND_LONG  (та сама, confirmation=1)</text>
<rect x="714.0" y="228.0" width="12.0" height="44.0" rx="3" fill="#fff6e5" stroke="#b7791f" stroke-width="2.0"/>
<text x="736.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b7791f" text-anchor="start">перевіряє
й виконує</text>
<line x1="720.0" y1="302.0" x2="180.0" y2="320.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="706.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">COMMAND_ACK  (result = ACCEPTED)</text>
<text x="194.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">✓ станція певна: команду прийнято</text>
<rect x="55.4" y="426.8" width="789.2" height="34.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="448.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">разова дія = «надіслав → чекай ACK → не прийшов → повтори». Це надійність поверх ненадійного каналу</tspan></text>
