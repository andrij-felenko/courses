<rect x="0.0" y="0.0" width="860.0" height="340.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Векторні простори FOC: Трифазний (a-b-c) → Нерухомий (α-β) → Обертовий роторний (d-q)</text>
