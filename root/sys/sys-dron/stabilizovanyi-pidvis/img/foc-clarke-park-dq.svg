<text x="145.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">i_a + i_b + i_c = 0</text>
<line x1="265.0" y1="175.0" x2="315.0" y2="175.0" stroke="#d97706" stroke-width="2.2" marker-end="url(#arrow)"/>
