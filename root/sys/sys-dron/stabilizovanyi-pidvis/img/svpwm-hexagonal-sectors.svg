<text x="697.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">T0 = T_s − T1 − T2 (нульовий стан)</text>
<line x1="580.0" y1="195.0" x2="815.0" y2="195.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="697.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Ключові переваги над SPWM:</text>
<text x="697.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• +15.5% використання шини DC</text>
<text x="697.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Коефіцієнт: 1 / √3 ≈ 0.577 V_dc</text>
<text x="697.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Мінімальні гармоніки струму</text>
<text x="697.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Плавний крутний момент без ривків</text>
<text x="697.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Симетричне вирівнювання імпульсів</text>
