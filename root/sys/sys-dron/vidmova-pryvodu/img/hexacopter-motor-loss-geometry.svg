<text x="670.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Аналіз керованості на 5 моторах</text>
<text x="510.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Крен (Roll, M_x):</text>
<text x="525.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Парирується асиметрією тяги моторів 2, 3 та 5, 6.</text>
<text x="525.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="start">Баланс M_x = 0 досягається повністю.</text>
<text x="510.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Тангаж (Pitch, M_y):</text>
<text x="525.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Протилежний мотор M4 (180°) зменшує тягу,</text>
<text x="525.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="start">щоб компенсувати плече тяги M1. Баланс M_y = 0.</text>
<text x="510.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Рискання (Yaw, M_z) — головний дефіцит:</text>
<text x="525.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="start">Сумарний реактивний момент гвинтів ≠ 0.</text>
<text x="525.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="start">Неможливо утримати курс без втрати висоти.</text>
<rect x="505.0" y="312.0" width="330.0" height="46.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="670.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700">Стратегія: авторотація / релаксація Yaw</text>
<text x="670.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#92400e" text-anchor="middle">Дрон швидко крутиться навколо Z, але керовано сідає</text>
<text x="440.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Втрата тяги мотора M1 вимагає зменшення тяги мотора M4 та перерозподілу сил бічних моторів.</text>
<text x="440.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Незбалансований реактивний момент перетворюється на контрольоване обертання по рисканню (Yaw relaxation).</text>
</svg>