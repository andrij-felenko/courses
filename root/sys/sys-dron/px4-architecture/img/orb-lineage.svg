<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід назви uORB: від брокера об'єктних запитів до буфера на тему</text>
<rect x="30.0" y="56.0" width="220.0" height="150.0" rx="6" fill="#ffffff" stroke="#1a5276" stroke-width="2.0"/>
<rect x="42.0" y="66.0" width="196.0" height="36.0" rx="6" fill="#d6eaf8" stroke="#1a5276" stroke-width="1.2"/><text x="140.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a5276" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">CORBA · OMG, від 1991</tspan></text>
<text x="140.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">«брокер об'єктних запитів»:</tspan><tspan x="140.0" dy="15.2">клієнт кличе метод об'єкта,</tspan><tspan x="140.0" dy="15.2">не знаючи, де той живе</tspan></text>
<rect x="290.0" y="56.0" width="220.0" height="150.0" rx="6" fill="#ffffff" stroke="#7d3c98" stroke-width="2.0"/>
<rect x="302.0" y="66.0" width="196.0" height="36.0" rx="6" fill="#f0e6fa" stroke="#7d3c98" stroke-width="1.2"/><text x="400.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d3c98" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">ORB як загальне слово</tspan></text>
<text x="400.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">у робототехніці ним описують</tspan><tspan x="400.0" dy="15.2">і легкі шини — наприклад LCM</tspan><tspan x="400.0" dy="15.2">(Huang, Olson, Moore, 2010)</tspan></text>
<rect x="550.0" y="56.0" width="220.0" height="150.0" rx="6" fill="#ffffff" stroke="#7d3c98" stroke-width="2.0"/>
<rect x="562.0" y="66.0" width="196.0" height="36.0" rx="6" fill="#f0e6fa" stroke="#7d3c98" stroke-width="1.2"/><text x="660.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d3c98" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">mORB · проза статті 2015</tspan></text>
<text x="660.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">«micro object request broker»:</tspan><tspan x="660.0" dy="15.2">той самий задум, урізаний</tspan><tspan x="660.0" dy="15.2">до мікроконтролера</tspan></text>
<rect x="810.0" y="56.0" width="220.0" height="150.0" rx="6" fill="#ffffff" stroke="#1e8449" stroke-width="2.0"/>
<rect x="822.0" y="66.0" width="196.0" height="36.0" rx="6" fill="#eafaf0" stroke="#1e8449" stroke-width="1.2"/><text x="920.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e8449" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">uORB · код і фігури</tspan></text>
<text x="920.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">у заголовку файлу —</tspan><tspan x="920.0" dy="15.2">«lightweight object broker»;</tspan><tspan x="920.0" dy="15.2">саме ця назва й прижилася</tspan></text>
<line x1="250.0" y1="131.0" x2="290.0" y2="131.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="510.0" y1="131.0" x2="550.0" y2="131.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="770.0" y1="131.0" x2="810.0" y2="131.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30.0" y="244.0" width="500.0" height="240.0" rx="6" fill="#ffffff" stroke="#1e8449" stroke-width="2.0"/>
<text x="280.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e8449" text-anchor="middle" font-weight="700">Що з тієї лінії взяли</text>
<text x="52.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">· іменований посередник між сторонами,</text>
<text x="52.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">· які не знають одна одну на ім'я</text>
<text x="52.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">· тема як семантичний канал: «attitude», «position»</text>
<text x="52.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">· єдиний невеликий API замість чужих заголовків</text>
<text x="52.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">· видавець оголошує тему, читачі підписуються</text>
<rect x="560.0" y="244.0" width="470.0" height="240.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="795.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Що викинули без жалю</text>
<text x="582.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">· мережеву прозорість і заглушки з IDL</text>
<text x="582.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">· динамічний пошук служби за іменем у мережі</text>
<text x="582.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">· синхронний виклик методу з відповіддю</text>
<text x="582.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">· будь-які гарантії доставки й порядку</text>
<text x="582.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">· динамічну пам'ять у роботі шини</text>
<text x="530.0" y="538.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Від CORBA лишилася думка, а не машинерія: буфер на тему, лічильник публікацій — і жодного посередника в мережі</text>
</svg>