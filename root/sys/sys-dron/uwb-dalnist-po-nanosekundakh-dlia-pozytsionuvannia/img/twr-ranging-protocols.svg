<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Протоколи вимірювання дальності: односторонній (SS-TWR) та подвійний (DS-TWR)</text>
<rect x="20.0" y="50.0" width="390.0" height="315.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="215.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Single-Sided TWR (SS-TWR)</text>
<text x="215.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2 повідомлення: чутливий до дрейфу кварцу</text>
<line x1="80.0" y1="115.0" x2="80.0" y2="275.0" stroke="#64748b" stroke-width="2.0"/>
<line x1="350.0" y1="115.0" x2="350.0" y2="275.0" stroke="#64748b" stroke-width="2.0"/>
<text x="80.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дрон (Tag)</text>
<text x="350.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анкер (Anchor)</text>
<line x1="80.0" y1="135.0" x2="350.0" y2="175.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="215.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">1. Poll</text>
<circle cx="80.0" cy="135.0" r="3.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<circle cx="350.0" cy="175.0" r="3.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="65.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">t₁</text>
<text x="365.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">t₂</text>
<line x1="350.0" y1="215.0" x2="80.0" y2="255.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="215.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">2. Response (містить t₂, t₃)</text>
<circle cx="350.0" cy="215.0" r="3.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<circle cx="80.0" cy="255.0" r="3.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="365.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">t₃</text>
<text x="65.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">t₄</text>
<line x1="45.0" y1="135.0" x2="45.0" y2="255.0" stroke="#27ae60" stroke-width="1.5"/>
<text x="30.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">T_round</text>
<line x1="385.0" y1="175.0" x2="385.0" y2="215.0" stroke="#c0392b" stroke-width="1.5"/>
<text x="398.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">T_reply</text>
<text x="215.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">ToF = ½ (T_round − T_reply)</text>
<text x="215.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Похибка: Δf · T_reply (при 20 ppm і 1 мс → 6 метрів!)</text>
<text x="215.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Використовується лише з підстроюванням несучої</text>
<rect x="430.0" y="50.0" width="390.0" height="315.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="625.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Double-Sided TWR (DS-TWR)</text>
<text x="625.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">3 повідомлення: повна взаємна компенсація дрейфу</text>
<line x1="490.0" y1="115.0" x2="490.0" y2="280.0" stroke="#64748b" stroke-width="2.0"/>
<line x1="760.0" y1="115.0" x2="760.0" y2="280.0" stroke="#64748b" stroke-width="2.0"/>
<text x="490.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дрон (Tag)</text>
<text x="760.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анкер (Anchor)</text>
<line x1="490.0" y1="130.0" x2="760.0" y2="160.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="625.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">1. Poll</text>
<circle cx="490.0" cy="130.0" r="3.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<circle cx="760.0" cy="160.0" r="3.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="475.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">t₁</text>
<text x="775.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">t₂</text>
<line x1="760.0" y1="190.0" x2="490.0" y2="220.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="625.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">2. Response</text>
<circle cx="760.0" cy="190.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<circle cx="490.0" cy="220.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="775.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">t₃</text>
<text x="475.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">t₄</text>
<line x1="490.0" y1="245.0" x2="760.0" y2="275.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="625.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#333333" text-anchor="middle" font-weight="700">3. Final (містить t₁, t₄, t₅)</text>
<circle cx="490.0" cy="245.0" r="3.0" fill="#333333" stroke="#333333" stroke-width="1.0"/>
<circle cx="760.0" cy="275.0" r="3.0" fill="#333333" stroke="#333333" stroke-width="1.0"/>
<text x="475.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">t₅</text>
<text x="775.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">t₆</text>
<text x="625.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ToF = (T_r1 · T_r2 − T_p1 · T_p2) / (T_r1 + T_r2 + T_p1 + T_p2)</text>
<text x="625.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Залишкова похибка: ~0.4 пс (0.12 мм при 20 ppm)</text>
<text x="625.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Стандарт точного 3D-позиціонування дронів</text>
</svg>