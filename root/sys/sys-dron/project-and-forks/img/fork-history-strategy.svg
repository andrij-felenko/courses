<text x="70.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">B. Ребейз довгоживучої гілки: старої бази більше немає</text>
