<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна кодова база — дві ліцензійні гілки</text>
<rect x="327.9" y="58.8" width="344.2" height="62.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="85.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Кодова база QGroundControl</tspan><tspan x="500.0" dy="19.5">видана під ДВОМА ліцензіями одразу</tspan></text>
<line x1="440.0" y1="124.0" x2="300.0" y2="180.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="560.0" y1="124.0" x2="700.0" y2="180.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="146.3" y="185.7" width="247.4" height="92.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="209.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">GPL v3 — копілефт</tspan><tspan x="270.0" dy="18.2">похідне теж відкрите</tspan><tspan x="270.0" dy="18.2">джерела змін — на вимогу</tspan><tspan x="270.0" dy="18.2">вистачає відкритої версії Qt</tspan></text>
<rect x="590.3" y="185.7" width="279.4" height="92.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="730.0" y="209.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Apache 2.0 — дозвільна</tspan><tspan x="730.0" dy="18.2">можна в закритий продукт</tspan><tspan x="730.0" dy="18.2">віддавати нічого не треба</tspan><tspan x="730.0" dy="18.2">за документацією — комерційна Qt</tspan></text>
<rect x="146.0" y="312.0" width="250.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="271.0" y="339.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="271.0" dy="0.0">кого це влаштовує:</tspan><tspan x="271.0" dy="16.9">збірка з відкритих джерел</tspan></text>
<rect x="604.0" y="312.0" width="250.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="729.0" y="339.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="729.0" dy="0.0">кого це влаштовує:</tspan><tspan x="729.0" dy="16.9">застосунок у магазині</tspan></text>
<rect x="130.0" y="418.0" width="740.0" height="112.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="460.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Умова, на якій тримаються обидві гілки</tspan><tspan x="500.0" dy="18.2">всередину приймають лише оригінальний код або запозичення під MIT, BSD-2/3, Apache 2.0</tspan><tspan x="500.0" dy="18.2">копілефтний код не беруть: він зробив би дозвільну гілку неможливою</tspan></text>
</svg>