<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 800" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="800" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Станція старша за свій репозиторій</text>
<line x1="296.0" y1="100.0" x2="296.0" y2="688.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6,5"/>
<text x="268.0" y="105.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700"><tspan x="268.0" dy="0.0">2008</tspan></text>
<circle cx="296.0" cy="100.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/>
<rect x="332.0" y="63.0" width="676.0" height="74.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="670.0" y="95.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">ETH Zürich, лабораторія комп'ютерного зору й геометрії:</tspan><tspan x="670.0" dy="18.2">задача — автономний політ за зображенням на апараті ≈1 кг</tspan></text>
<text x="268.0" y="193.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700"><tspan x="268.0" dy="0.0">14–17 вересня</tspan><tspan x="268.0" dy="19.5">2009</tspan></text>
<circle cx="296.0" cy="198.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/>
<rect x="332.0" y="161.0" width="676.0" height="74.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="670.0" y="193.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Делфт: команда PIXHAWK виграє місію Indoor Autonomy на EMAV</tspan><tspan x="670.0" dy="18.2">апарат летить будівлею без GPS і без обчислювача на землі</tspan></text>
<text x="268.0" y="301.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700"><tspan x="268.0" dy="0.0">2011</tspan></text>
<circle cx="296.0" cy="296.0" r="7.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/>
<rect x="332.0" y="259.0" width="676.0" height="74.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="670.0" y="291.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">публікація описує систему цілком: плата pxIMU, обчислювач pxCOMEx,</tspan><tspan x="670.0" dy="18.2">протокол MAVLink і наземна станція — усе з однієї роботи</tspan></text>
<text x="268.0" y="399.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700"><tspan x="268.0" dy="0.0">13 жовтня 2011</tspan></text>
<circle cx="296.0" cy="394.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/>
<rect x="332.0" y="357.0" width="676.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="670.0" y="389.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">на GitHub створено репозиторій mavlink/qgroundcontrol</tspan><tspan x="670.0" dy="18.2">код старший за свій репозиторій</tspan></text>
<text x="268.0" y="497.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700"><tspan x="268.0" dy="0.0">13 жовтня 2014</tspan></text>
<circle cx="296.0" cy="492.0" r="7.0" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/>
<rect x="332.0" y="455.0" width="676.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="670.0" y="487.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Linux Foundation оголошує Dronecode — вендор-нейтральний дім</tspan><tspan x="670.0" dy="18.2">станції в тому переліку ще немає; коли приєдналася — не задокументовано</tspan></text>
<text x="268.0" y="585.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700"><tspan x="268.0" dy="0.0">27 липня 2016</tspan><tspan x="268.0" dy="19.5">1 серпня 2016</tspan></text>
<circle cx="296.0" cy="590.0" r="7.0" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/>
<rect x="332.0" y="553.0" width="676.0" height="74.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="585.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">реліз 3.0: інтерфейс, перебудований під планшет</tspan><tspan x="670.0" dy="18.2">146 файлів QML — і ще 22 старі форми поряд із ними</tspan></text>
<text x="268.0" y="693.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700"><tspan x="268.0" dy="0.0">≈2022</tspan></text>
<circle cx="296.0" cy="688.0" r="7.0" fill="#eafaf1" stroke="#27ae60" stroke-width="2.2"/>
<rect x="332.0" y="651.0" width="676.0" height="74.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="683.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">реліз 4.2.0: 275 файлів QML, старих форм — жодної</tspan><tspan x="670.0" dy="18.2">перехід, оголошений 2016 року, завершився аж тут</tspan></text>
<rect x="332.0" y="750.0" width="676.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="670.0" y="774.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="670.0" dy="0.0">синє — лабораторія в Цюриху · біле — переїзд у спільний дім · зелене — зріла станція</tspan></text>
</svg>