<text x="772.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Кадр</text>
<circle cx="808.0" cy="180.0" r="4.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="808.0" y1="180.0" x2="808.0" y2="204.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2,2"/>
<text x="808.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Кадр</text>
<circle cx="845.0" cy="180.0" r="4.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="845.0" y1="180.0" x2="845.0" y2="204.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2,2"/>
<text x="845.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Кадр</text>
<text x="790.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Крок ΔS = const</text>
<text x="664.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Спрацьовування кожні ΔS = D_int</text>
<text x="664.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Фільтрація радіального шуму GNSS</text>
<text x="664.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Блокування на віражах (|крен| &gt; 15°)</text>
<text x="664.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Застосування: ортофотозйомка, LiDAR</text>
