<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Просторові та часові механізми синхронізації дій на точці</text>
<rect x="30.0" y="50.0" width="280.0" height="410.0" rx="8" fill="#fdfefe" stroke="#c0392b" stroke-width="2.0"/>
<text x="170.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Радіус досягнення</text>
<text x="170.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Acceptance Radius)</text>
<circle cx="170.0" cy="180.0" r="48.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<line x1="100.0" y1="210.0" x2="240.0" y2="150.0" stroke="#333333" stroke-width="2.0"/>
<line x1="205.0" y1="165.0" x2="240.0" y2="150.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<circle cx="170.0" cy="180.0" r="5.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="170.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">WP (R_acc)</text>
<circle cx="145.0" cy="191.0" r="4.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="145.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ТРИГЕР</text>
<text x="44.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Миттєве спрацьовування на прольоті</text>
<text x="44.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Умова: d_2D &lt;= R_acc та |dz| &lt;= z_tol</text>
<text x="44.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Без зависання та втрати швидкості</text>
<text x="44.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Застосування: скид маркерів, імпульс</text>
<rect x="340.0" y="50.0" width="280.0" height="410.0" rx="8" fill="#fdfefe" stroke="#27ae60" stroke-width="2.0"/>
<text x="480.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Час зависання</text>
<text x="480.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(Loiter / Dwell Time)</text>
<circle cx="480.0" cy="180.0" r="48.0" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<circle cx="480.0" cy="180.0" r="6.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="415.0" y1="198.0" x2="470.0" y2="180.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="480.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Стоп: V &lt; 0.2 м/с</text>
<text x="480.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Таймер t_dwell</text>
<text x="480.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">-&gt; ДІЯ НАВАНТАЖЕННЯ</text>
<text x="354.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Вхід у сферу зупиняє траєкторію</text>
<text x="354.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Таймер стартує лише при |V| &lt;= V_max</text>
<text x="354.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Стабілізація коливань перед дією</text>
<text x="354.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Застосування: точний скид, датчики</text>
<rect x="650.0" y="50.0" width="280.0" height="410.0" rx="8" fill="#fdfefe" stroke="#2457d6" stroke-width="2.0"/>
<text x="790.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Інтервал шляху</text>
