<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1400" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто вирішує, у якій нитці виконається обробник</text>
<rect x="550.0" y="46.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="75.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">emit сигнал у нитці T</tspan></text>
<line x1="700.0" y1="96.0" x2="700.0" y2="122.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="520.0" y="122.0" width="360.0" height="48.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="150.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">оголошений у connect() тип з'єднання</tspan></text>
<line x1="700.0" y1="170.0" x2="700.0" y2="190.0" stroke="#333333" stroke-width="1.5"/>
<line x1="175.0" y1="190.0" x2="1225.0" y2="190.0" stroke="#333333" stroke-width="1.5"/>
<line x1="175.0" y1="190.0" x2="175.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="525.0" y1="190.0" x2="525.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="875.0" y1="190.0" x2="875.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1225.0" y1="190.0" x2="1225.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20.0" y="210.0" width="310.0" height="46.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="237.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">Qt::AutoConnection (0)</tspan></text>
<rect x="370.0" y="210.0" width="310.0" height="46.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="525.0" y="237.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">Qt::DirectConnection (1)</tspan></text>
<rect x="720.0" y="210.0" width="310.0" height="46.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="875.0" y="237.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="875.0" dy="0.0">Qt::QueuedConnection (2)</tspan></text>
<rect x="1070.0" y="210.0" width="310.0" height="46.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1225.0" y="237.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1225.0" dy="0.0">Qt::BlockingQueuedConnection (3)</tspan></text>
<line x1="175.0" y1="256.0" x2="175.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20.0" y="290.0" width="310.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="326.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">порівняти нитку отримувача</tspan><tspan x="175.0" dy="15.6">з ниткою, що ВИПУСТИЛА сигнал;</tspan><tspan x="175.0" dy="15.6">рішення — на кожному emit</tspan></text>
<line x1="525.0" y1="256.0" x2="525.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="370.0" y="290.0" width="310.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="525.0" y="326.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">звичайний виклик по стеку</tspan><tspan x="525.0" dy="15.6">в нитці, що випустила сигнал;</tspan><tspan x="525.0" dy="15.6">відправник чекає завершення</tspan></text>
<line x1="875.0" y1="256.0" x2="875.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="720.0" y="290.0" width="310.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="875.0" y="326.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">аргументи копіюються в подію,</tspan><tspan x="875.0" dy="15.6">подія лягає в чергу отримувача;</tspan><tspan x="875.0" dy="15.6">відправник вертається одразу</tspan></text>
<line x1="1225.0" y1="256.0" x2="1225.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1070.0" y="290.0" width="310.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1225.0" y="326.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1225.0" dy="0.0">подія лягає в чергу отримувача,</tspan><tspan x="1225.0" dy="15.6">відправник СТОЇТЬ,</tspan><tspan x="1225.0" dy="15.6">поки обробник не завершиться</tspan></text>
<line x1="175.0" y1="386.0" x2="175.0" y2="420.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20.0" y="420.0" width="310.0" height="100.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="458.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">нитки збіглися → як Direct,</tspan><tspan x="175.0" dy="15.6">різні → як Queued;</tspan><tspan x="175.0" dy="15.6">власного механізму не має</tspan></text>
<line x1="525.0" y1="386.0" x2="525.0" y2="420.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="370.0" y="420.0" width="310.0" height="100.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="525.0" y="458.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">через межу — це чужа нитка</tspan><tspan x="525.0" dy="15.6">в даних отримувача,</tspan><tspan x="525.0" dy="15.6">і Qt не скаржиться взагалі</tspan></text>
<line x1="875.0" y1="386.0" x2="875.0" y2="420.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="720.0" y="420.0" width="310.0" height="100.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="875.0" y="458.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">потрібен цикл подій у отримувача;</tspan><tspan x="875.0" dy="15.6">типи аргументів — зареєстровані</tspan><tspan x="875.0" dy="15.6">в метасистемі Qt</tspan></text>
<line x1="1225.0" y1="386.0" x2="1225.0" y2="420.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1070.0" y="420.0" width="310.0" height="100.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="1225.0" y="458.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1225.0" dy="0.0">отримувач у тій самій нитці —</tspan><tspan x="1225.0" dy="15.6">дедлок; Qt друкує попередження</tspan><tspan x="1225.0" dy="15.6">і все одно блокується</tspan></text>
<text x="700.0" y="562.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Нитку обробника визначає ОТРИМУВАЧ — той, хто випустив сигнал, на неї не впливає.</text>
</svg>