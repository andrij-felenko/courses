<rect x="820.0" y="290.0" width="330.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="985.0" y="323.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="985.0" dy="0.0">нитки GStreamer</tspan><tspan x="985.0" dy="15.6">володіють конвеєром відео</tspan><tspan x="985.0" dy="15.6">через межу: майже нічого</tspan></text>
<line x1="760.0" y1="185.0" x2="820.0" y2="185.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
