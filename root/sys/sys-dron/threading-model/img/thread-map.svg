<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Карта ниток: нитка тут володіє ресурсом, а не роботою</text>
<rect x="420.0" y="110.0" width="340.0" height="430.0" rx="12" fill="#eef2f6" stroke="#98a6b4" stroke-width="2.0"/>
<text x="590.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ГОЛОВНА НИТКА</text>
<rect x="440.0" y="170.0" width="300.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="194.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">LinkManager — облік каналів</tspan></text>
<rect x="440.0" y="220.0" width="300.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">MAVLinkProtocol — розбір</tspan></text>
<rect x="440.0" y="270.0" width="300.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="294.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Vehicle — стан апаратів</tspan></text>
<rect x="440.0" y="320.0" width="300.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="344.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">FactSystem — факти й параметри</tspan></text>
<rect x="440.0" y="370.0" width="300.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="394.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">план місії та геозона</tspan></text>
<rect x="440.0" y="420.0" width="300.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="444.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">рушій QML і прив'язки</tspan></text>
<text x="590.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">весь стан — тут, по черзі, без замків</text>
<rect x="30.0" y="140.0" width="330.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="195.0" y="173.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">нитки каналів — по одній на з'єднання</tspan><tspan x="195.0" dy="15.6">володіють портом або сокетом</tspan><tspan x="195.0" dy="15.6">через межу: сирі байти</tspan></text>
<rect x="30.0" y="290.0" width="330.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="195.0" y="323.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">нитка відтворення логу</tspan><tspan x="195.0" dy="15.6">читає файл за мітками часу</tspan><tspan x="195.0" dy="15.6">через межу: ті самі сирі байти</tspan></text>
<rect x="30.0" y="440.0" width="330.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="195.0" y="473.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">нитка кешу тайлів</tspan><tspan x="195.0" dy="15.6">володіє базою SQLite</tspan><tspan x="195.0" dy="15.6">через межу: задачі й готові тайли</tspan></text>
