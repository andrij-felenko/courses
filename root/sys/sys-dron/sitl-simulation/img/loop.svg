<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 392" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="392" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">SITL: код автопілота крутиться на ПК, фізику дає симулятор</text>
<rect x="300.0" y="150.0" width="220.0" height="110.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.4"/>
<text x="410.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">КОД АВТОПІЛОТА</text>
<text x="410.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">той самий, що й у плату</text>
<text x="410.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">оцінка стану · керування</text>
<text x="410.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">звичайний процес на ПК</text>
<rect x="40.0" y="120.0" width="200.0" height="80.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="2.0"/>
<text x="140.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d1a" text-anchor="middle" font-weight="700">СИМУЛЯТОР</text>
<text x="140.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">модель фізики й давачів</text>
<text x="140.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">гіроскоп, GPS, баро…</text>
<line x1="240.0" y1="158.0" x2="298.0" y2="178.0" stroke="#caa24a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="270.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#8a6d1a" text-anchor="middle" font-weight="700">виміри</text>
<rect x="580.0" y="120.0" width="200.0" height="80.0" rx="10" fill="#fff6e0" stroke="#caa24a" stroke-width="2.0"/>
<text x="680.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d1a" text-anchor="middle" font-weight="700">ТА САМА МОДЕЛЬ</text>
<text x="680.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">рахує, як апарат полетів</text>
<text x="680.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">→ нові виміри</text>
<line x1="522.0" y1="178.0" x2="580.0" y2="158.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="558.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">тяга моторів</text>
<path d="M 680 200 L 680 300 L 140 300 L 140 200" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="410.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">замкнене коло: фізика → виміри → рішення → тяга → фізика…</text>
<line x1="410.0" y1="148.0" x2="410.0" y2="78.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="260.0" y="44.0" width="300.0" height="32.0" rx="8" fill="#e9eefb" stroke="#2457d6" stroke-width="1.6"/>
<text x="410.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">MAVLink — як зі справжнім дроном (наземна станція, скрипти)</text>
<text x="410.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">жодного заліза — а код поводиться так, ніби летить</text>
</svg>