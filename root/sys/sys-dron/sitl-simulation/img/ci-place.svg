<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де SITL у тесті: системний поверх над пірамідою</text>
<text x="225.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">тести ШМАТКІВ коду</text>
<rect x="75.0" y="196.0" width="300.0" height="40.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="225.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">юніт-тести логіки</text>
<rect x="100.0" y="244.0" width="250.0" height="40.0" rx="8" fill="#fff6e0" stroke="#caa24a" stroke-width="1.8"/>
<text x="225.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d1a" text-anchor="middle" font-weight="700">моки периферії</text>
<rect x="140.0" y="292.0" width="170.0" height="40.0" rx="8" fill="#e9eefb" stroke="#2457d6" stroke-width="1.8"/>
<text x="225.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">HIL — чіп у петлі</text>
<text x="225.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">кожен бачить свій шматок</text>
<line x1="455.0" y1="80.0" x2="455.0" y2="360.0" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="635.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">SITL — ВЕСЬ автопілот як цілість</text>
<rect x="490.0" y="90.0" width="290.0" height="168.0" rx="12" fill="#fbecec" stroke="#c0392b" stroke-width="2.2"/>
<circle cx="516.0" cy="118.0" r="4.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="532.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">зліт і посадка</text>
<circle cx="516.0" cy="152.0" r="4.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="532.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">ціла місія за планом</text>
<circle cx="516.0" cy="186.0" r="4.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="532.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">відмова давача / GPS</text>
<circle cx="516.0" cy="220.0" r="4.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="532.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">регресія: та сама місія після правки</text>
<rect x="490.0" y="280.0" width="290.0" height="64.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="635.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">у CI — на кожен коміт, без дрона</text>
<text x="635.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">зламав політ правкою — знаєш за хвилини</text>
<text x="410.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">піраміда перевіряє частини; SITL доводить, що вони разом таки літають</text>
</svg>