<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="24.0" y="170.0" width="212.0" height="150.0" rx="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.2"/>
<text x="130.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="700">Ручний режим</text>
<text x="130.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">пілот тримає кут</text>
<text x="130.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">апарат вирівнює нахил</text>
<text x="130.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">усе інше — на пілоті</text>
<text x="130.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">потрібні лише гіроскопи</text>
<circle cx="46.0" cy="192.0" r="13.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.5"/>
<text x="46.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<rect x="254.0" y="114.0" width="212.0" height="206.0" rx="10" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.2"/>
<text x="360.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">Утримання висоти</text>
<text x="360.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">апарат тримає H</text>
<text x="360.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">додається барометр</text>
<text x="360.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">вертикаль — на автопілоті</text>
<text x="360.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">по горизонту досі керує пілот</text>
<circle cx="276.0" cy="136.0" r="13.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="276.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<rect x="484.0" y="58.0" width="212.0" height="262.0" rx="10" fill="#f7fbf8" stroke="#27ae60" stroke-width="2.2"/>
<text x="590.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">Режими з позицією</text>
<text x="590.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">апарат тримає точку</text>
<text x="590.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">потрібна оцінка положення</text>
<text x="590.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">горизонт — на автопілоті</text>
<text x="590.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">апарат сам повертається на місце</text>
<circle cx="506.0" cy="80.0" r="13.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="506.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<line x1="24.0" y1="334.0" x2="696.0" y2="334.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="360.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">що краще апарат знає свій стан — то більше він робить сам</text>
</svg>