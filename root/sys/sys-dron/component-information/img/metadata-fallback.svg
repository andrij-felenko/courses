<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки береться опис параметра</text>
<rect x="90.0" y="80.0" width="390.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="285.0" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="285.0" dy="0.0">Бортовий файл (mftp)</tspan></text>
<rect x="670.0" y="82.0" width="440.0" height="56.0" rx="6" fill="#eaf3ea" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">опис збігається з прошивкою</tspan></text>
<line x1="492.0" y1="110.0" x2="658.0" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90.0" y="192.0" width="390.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="285.0" y="227.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="285.0" dy="0.0">Запасна адреса (https)</tspan></text>
<rect x="670.0" y="194.0" width="440.0" height="56.0" rx="6" fill="#eaf3ea" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="226.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">опис тієї самої збірки з мережі</tspan></text>
<line x1="492.0" y1="222.0" x2="658.0" y2="222.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="285.0" y1="148.0" x2="285.0" y2="184.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="299.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">немає файлу на борту</text>
<rect x="90.0" y="304.0" width="390.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="285.0" y="339.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="285.0" dy="0.0">База плагіна прошивки</tspan></text>
<rect x="670.0" y="306.0" width="440.0" height="56.0" rx="6" fill="#eaf3ea" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="338.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">опис версії, з якою зібрано станцію</tspan></text>
<line x1="492.0" y1="334.0" x2="658.0" y2="334.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="285.0" y1="260.0" x2="285.0" y2="296.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="299.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">немає мережі</text>
<rect x="90.0" y="416.0" width="390.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="285.0" y="451.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="285.0" dy="0.0">Порожні метадані</tspan></text>
<rect x="670.0" y="418.0" width="440.0" height="56.0" rx="6" fill="#eaf3ea" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="450.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">тип і група з імені — і все</tspan></text>
<line x1="492.0" y1="446.0" x2="658.0" y2="446.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="285.0" y1="372.0" x2="285.0" y2="408.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="299.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">немає бази</text>
<text x="590.0" y="544.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">нижчі двері дають гірший опис, але жодні не дають відмови</text>
</svg>