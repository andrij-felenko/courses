<text x="322.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">e_los</text>
<line x1="252.8" y1="276.9" x2="273.5" y2="322.4" stroke="#7c3aed" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="260.6" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">e_los_⊥</text>
<text x="255.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle" font-weight="700">λ</text>
<text x="380.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дальність R = ||r_t - r_d||</text>
<text x="380.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Швидкість зближення V_c = -dR/dt</text>
<circle cx="180.0" cy="310.0" r="8.0" fill="#2457d6" stroke="#333333" stroke-width="2.0"/>
<text x="160.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">D (Дрон)</text>
<line x1="180.0" y1="310.0" x2="290.0" y2="190.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="300.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">V_d (Швидкість дрона)</text>
<text x="225.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">δ_d</text>
<line x1="220.0" y1="270.0" x2="135.0" y2="265.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="100.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">a_cmd = N · V_c · Ω</text>
