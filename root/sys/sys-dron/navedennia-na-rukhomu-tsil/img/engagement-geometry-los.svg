<text x="50.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Y_I (Північ / Північний)</text>
<line x1="180.0" y1="310.0" x2="380.0" y2="310.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="620.0" y1="110.0" x2="760.0" y2="110.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
