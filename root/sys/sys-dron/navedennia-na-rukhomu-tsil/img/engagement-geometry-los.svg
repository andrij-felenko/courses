<text x="645.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">T (Ціль)</text>
<line x1="620.0" y1="110.0" x2="700.0" y2="50.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="710.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">V_t (Швидкість цілі)</text>
<text x="460.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">Кутова швидкість LOS: Ω = dλ/dt = (R × V_r) / R²</text>
<rect x="30.0" y="360.0" width="780.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="420.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Закон наведення: прискорення a_cmd прикладається перпендикулярно до лінії візування</text>
<text x="420.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Мета контуру керування — обнулити кутову швидкість обертання лінії візування (Ω → 0)</text>
</svg>