<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 880 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="880" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="360.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура трифазного зближення та посадки на рухому морську платформу</text>
<rect x="20.0" y="60.0" width="260.0" height="240.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="150.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Фаза 1: PN-Рандеву</text>
<text x="150.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Дальність: 500 м → 20 м</text>
<text x="150.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Наведення PN з профілем V_c(R)</text>
<text x="150.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Гальмування відносної швидкості</text>
<text x="150.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Вирівнювання векторів швидкості</text>
<text x="150.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Захоплення палуби камерою/GNSS</text>
<rect x="35.0" y="245.0" width="230.0" height="40.0" rx="6" fill="#e0e7ff" stroke="#2457d6" stroke-width="1.0"/>
<text x="150.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Критерій: R &lt; 20м, ΔV &lt; 2 м/с</text>
<line x1="285.0" y1="175.0" x2="305.0" y2="175.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="310.0" y="60.0" width="260.0" height="240.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="440.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">Фаза 2: Синхронізація</text>
<text x="440.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Дальність: 20 м → 2 м над палубою</text>
<text x="440.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Перехід у локальний NED палуби</text>
<text x="440.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Відносне PD-стеження позиції</text>
<text x="440.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Оцінка кілевої/бортової качки</text>
<text x="440.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Утримання точки зависання над H</text>
<rect x="325.0" y="245.0" width="230.0" height="40.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.0"/>
<text x="440.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">Критерій: похибка &lt; 0.2м, фаза качки</text>
<line x1="575.0" y1="175.0" x2="595.0" y2="175.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="600.0" y="60.0" width="240.0" height="240.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="720.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Фаза 3: Торкання</text>
<text x="720.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Висота: 2 м → 0 м (Контакт)</text>
<text x="720.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Швидке вертикальне зниження</text>
<text x="720.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Синхронізація з фазою качки</text>
<text x="720.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Компенсація екранного ефекту</text>
<text x="720.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Вимкнення моторів (Disarm)</text>
<rect x="615.0" y="245.0" width="210.0" height="40.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.0"/>
<text x="720.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Контакт: розпізнавання посадки</text>
<rect x="20.0" y="315.0" width="820.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="430.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Головна відмінність від перехоплення: при посадці відносна швидкість V_r у момент контакту має дорівнювати нулю</text>
</svg>