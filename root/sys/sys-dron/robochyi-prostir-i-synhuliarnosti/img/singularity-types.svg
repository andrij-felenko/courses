<line x1="278.0" y1="207.0" x2="292.0" y2="223.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="245.0" y1="215.0" x2="245.0" y2="180.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="235.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">v_t ≠ 0</text>
<rect x="42.0" y="280.0" width="256.0" height="90.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="170.0" y="306.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Втрата 1 ступеня вільності:</tspan><tspan x="170.0" dy="15.0">радіальний рух назовні</tspan><tspan x="170.0" dy="15.0">фізично неможливий;</tspan><tspan x="170.0" dy="15.0">det(J) = 0 на краю W_R.</tspan></text>
<rect x="350.0" y="65.0" width="280.0" height="330.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="490.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2. Сингулярність зап'ястка</text>
<text x="490.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">вирівнювання осей (Gimbal Lock)</text>
