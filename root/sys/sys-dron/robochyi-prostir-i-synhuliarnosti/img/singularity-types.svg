<rect x="785.0" y="255.0" width="50.0" height="14.0" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<line x1="810.0" y1="240.0" x2="855.0" y2="210.0" stroke="#334155" stroke-width="4.0"/>
<line x1="855.0" y1="210.0" x2="810.0" y2="190.0" stroke="#334155" stroke-width="4.0"/>
<circle cx="810.0" cy="240.0" r="5.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="855.0" cy="210.0" r="5.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="810.0" cy="190.0" r="6.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="810.0" y1="190.0" x2="780.0" y2="190.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="776.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">v_y</text>
<text x="818.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Зап'ясток P_w</text>
<rect x="682.0" y="280.0" width="256.0" height="90.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="810.0" y="306.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Зап'ясток на осі обертання z₁:</tspan><tspan x="810.0" dy="15.0">рух перпендикулярно руці</tspan><tspan x="810.0" dy="15.0">вимагає миттєвого розвороту</tspan><tspan x="810.0" dy="15.0">бази на 180° (q̇₁ → ∞).</tspan></text>
