<line x1="445.0" y1="192.0" x2="445.0" y2="228.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="535.0" y1="192.0" x2="535.0" y2="228.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">z₄ || z₆ (колінеарні)</text>
<rect x="362.0" y="280.0" width="256.0" height="90.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="490.0" y="306.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Осі z₄ та z₆ збігаються:</tspan><tspan x="490.0" dy="15.0">втрачено поворот вбік;</tspan><tspan x="490.0" dy="15.0">намагання повернути рух</tspan><tspan x="490.0" dy="15.0">вимагає q̇₄ = −q̇₆ → ∞.</tspan></text>
<rect x="670.0" y="65.0" width="280.0" height="330.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="810.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">3. Плечова сингулярність</text>
<text x="810.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">зап'ясток на осі колони (x=0, y=0)</text>
<line x1="810.0" y1="170.0" x2="810.0" y2="260.0" stroke="#2457d6" stroke-width="2.0" stroke-dasharray="5,3"/>
