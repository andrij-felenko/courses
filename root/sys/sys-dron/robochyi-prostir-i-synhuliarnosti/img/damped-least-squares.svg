<text x="730.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Математичний алгоритм DLS</text>
<rect x="603.0" y="118.2" width="254.1" height="43.6" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="730.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Цільовий функціонал оптимізації:</tspan><tspan x="730.0" dy="15.6">min ||J q̇ − v_e||² + λ² ||q̇||²</tspan></text>
<rect x="609.6" y="202.6" width="240.8" height="44.8" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="730.0" y="221.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Аналітичний розв'язок:</tspan><tspan x="730.0" dy="16.2">q̇ = Jᵀ (J Jᵀ + λ² I)⁻¹ · v_e</tspan></text>
<rect x="597.5" y="301.3" width="265.1" height="57.4" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="319.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Адаптивний коефіцієнт λ(w):</tspan><tspan x="730.0" dy="15.0">• λ² = 0, якщо w(q) ≥ w₀ (чиста IK)</tspan><tspan x="730.0" dy="15.0">• λ² = λ_max² (1 − w/w₀)², якщо w &lt; w₀</tspan></text>
