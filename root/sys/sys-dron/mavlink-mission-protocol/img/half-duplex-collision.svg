<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 880 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="880" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="460.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><rect x="150.9" y="8.0" width="558.2" height="34.0" rx="6" fill="#eef2f7" stroke="#2c3e50" stroke-width="1.5"/><text x="430.0" y="29.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">ПЕРЕДАЧА В НАПІВДУПЛЕКСНОМУ КАНАЛІ З ЧАСОВИМ РОЗДІЛЕННЯМ (TDD)</tspan></text><text x="50.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">1. ПОТОКОВИЙ PUSH (БЕЗ STOP-AND-WAIT) — ЗУСТРІЧНА КОЛІЗІЯ</text><line x1="50.0" y1="125.0" x2="800.0" y2="125.0" stroke="#2c3e50" stroke-width="2.0" marker-end="url(#arrow)"/><text x="810.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Час (t)</text><rect x="128.5" y="85.5" width="83.0" height="19.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="98.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">GCS: ITEM_0</tspan></text><rect x="258.5" y="85.5" width="83.0" height="19.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="98.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">GCS: ITEM_1</tspan></text><rect x="388.5" y="85.5" width="83.0" height="19.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="430.0" y="98.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">GCS: ITEM_2</tspan></text><rect x="169.0" y="146.0" width="132.0" height="18.0" rx="6" fill="#fdf2e9" stroke="#d35400" stroke-width="1.5"/><text x="235.0" y="158.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">FCU: ATTITUDE (50Hz)</tspan></text><rect x="314.5" y="146.0" width="101.0" height="18.0" rx="6" fill="#fdf2e9" stroke="#d35400" stroke-width="1.5"/><text x="365.0" y="158.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">FCU: GLOBAL_POS</tspan></text><rect x="512.2" y="106.3" width="175.7" height="37.3" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="128.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">КОЛІЗІЯ В ЕФІРІ</tspan><tspan x="600.0" dy="14.3">Взаємне глушіння пакетів</tspan></text><text x="50.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">2. ТРАНЗАКЦІЙНИЙ STOP-AND-WAIT (PULL) — ЧЕРГУВАННЯ RX/TX БЕЗ КОЛІЗІЙ</text><line x1="50.0" y1="300.0" x2="800.0" y2="300.0" stroke="#2c3e50" stroke-width="2.0" marker-end="url(#arrow)"/><text x="810.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Час (t)</text><rect x="91.9" y="251.0" width="76.2" height="18.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="263.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">GCS → COUNT</tspan></text><rect x="199.2" y="286.6" width="31.6" height="26.7" rx="6" fill="#f4f6f8" stroke="#7f8c8d" stroke-width="1.5"/><text x="215.0" y="297.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">TX→RX</tspan><tspan x="215.0" dy="11.7">10 мс</tspan></text><rect x="258.8" y="331.0" width="82.4" height="18.0" rx="6" fill="#fdf2e9" stroke="#d35400" stroke-width="1.5"/><text x="300.0" y="343.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">FCU → REQ(0)</tspan></text><rect x="369.2" y="286.6" width="31.6" height="26.7" rx="6" fill="#f4f6f8" stroke="#7f8c8d" stroke-width="1.5"/><text x="385.0" y="297.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">RX→TX</tspan><tspan x="385.0" dy="11.7">10 мс</tspan></text><rect x="425.7" y="251.0" width="88.6" height="18.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="263.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">GCS → ITEM(0)</tspan></text><rect x="533.8" y="286.6" width="62.4" height="26.7" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="565.0" y="290.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">Flash Write</tspan><tspan x="565.0" dy="11.7">+ REQ(1)</tspan></text><rect x="618.8" y="331.0" width="82.4" height="18.0" rx="6" fill="#fdf2e9" stroke="#d35400" stroke-width="1.5"/><text x="660.0" y="343.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">FCU → REQ(1)</tspan></text><rect x="129.3" y="396.4" width="601.4" height="37.3" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="411.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Отримувач сам запитує кожен наступний пункт лише тоді, коли готовий прийняти та записати його,</tspan><tspan x="430.0" dy="14.3">що гарантує відсутність колізій на фізичному рівні радіомодему SiK / ELRS / Crossfire</tspan></text>
</svg>