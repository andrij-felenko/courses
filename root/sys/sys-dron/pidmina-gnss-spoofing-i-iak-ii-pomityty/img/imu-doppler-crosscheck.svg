<line x1="220.0" y1="210.0" x2="244.0" y2="210.0" stroke="#333333" stroke-width="3.0"/>
<line x1="276.0" y1="210.0" x2="300.0" y2="210.0" stroke="#333333" stroke-width="3.0"/>
