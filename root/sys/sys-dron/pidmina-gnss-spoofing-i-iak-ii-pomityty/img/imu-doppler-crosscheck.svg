<circle cx="220.0" cy="210.0" r="10.0" fill="#cbd5e1" stroke="#333333" stroke-width="1.5"/>
<circle cx="300.0" cy="210.0" r="10.0" fill="#cbd5e1" stroke="#333333" stroke-width="1.5"/>
<circle cx="260.0" cy="180.0" r="10.0" fill="#cbd5e1" stroke="#333333" stroke-width="1.5"/>
<circle cx="260.0" cy="240.0" r="10.0" fill="#cbd5e1" stroke="#333333" stroke-width="1.5"/>
<circle cx="260.0" cy="210.0" r="15.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="260.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ІВБ</text>
<line x1="275.0" y1="200.0" x2="335.0" y2="170.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="355.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">v_imu (швидкість)</text>
<rect x="55.0" y="103.0" width="50.0" height="24.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="80.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Супутник 1</text>
<line x1="260.0" y1="210.0" x2="80.0" y2="115.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="260.0" y1="210.0" x2="215.8" y2="186.7" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="225.8" y="190.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">e₁</text>
<rect x="235.0" y="93.0" width="50.0" height="24.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="260.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Супутник 2</text>
<line x1="260.0" y1="210.0" x2="260.0" y2="105.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="260.0" y1="210.0" x2="260.0" y2="160.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="270.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">e₂</text>
<rect x="405.0" y="113.0" width="50.0" height="24.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="430.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Супутник 3</text>
<line x1="260.0" y1="210.0" x2="430.0" y2="125.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="260.0" y1="210.0" x2="304.7" y2="187.6" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="314.7" y="191.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">e₃</text>
<rect x="30.0" y="280.0" width="460.0" height="44.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="260.0" y="299.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Доплерівська швидкість GNSS: ρ̇_i = −λ · f_d_i = (v_sat − v_drone) · e_i + c·ḋt</tspan><tspan x="260.0" dy="11.7">Нев'язка проекції IMU: r_doppler_i = ρ̇_i − (v_sat · e_i − v_imu · e_i + c·ḋt)</tspan></text>
<rect x="520.0" y="55.0" width="300.0" height="280.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="670.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поведінка під час маневру</text>
<rect x="535.0" y="105.0" width="270.0" height="80.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="124.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Автентичний політ:</tspan><tspan x="670.0" dy="11.7">Кожен ривок або крен дрона миттєво</tspan><tspan x="670.0" dy="11.7">відображається як в акселерометрі ІВБ,</tspan><tspan x="670.0" dy="11.7">так і в доплерівських зсувах усіх супутників.</tspan><tspan x="670.0" dy="11.7">Нев'язка r_doppler ≈ 0.</tspan></text>
<rect x="535.0" y="200.0" width="270.0" height="115.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="670.0" y="228.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Атака підміни (Spoofing):</tspan><tspan x="670.0" dy="13.0">Наземний спуфер транслює фіктивну</tspan><tspan x="670.0" dy="13.0">траєкторію або статичну точку. При маневрі</tspan><tspan x="670.0" dy="13.0">дрона інерційні сили реєструються ІВБ,</tspan><tspan x="670.0" dy="13.0">але відсутні у підробленому Доплері.</tspan><tspan x="670.0" dy="13.0">Нев'язка |r_doppler| &gt; 1.5 м/с → ТРИВОГА!</tspan></text>
</svg>