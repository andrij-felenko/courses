<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Багаторівневий контур виявлення підміни GNSS на борту БПЛА</text>
<rect x="20.0" y="55.0" width="170.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="105.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Сирі вимірювання GNSS</tspan><tspan x="105.0" dy="13.0">(UBX-RAWX/SFRBX)</tspan><tspan x="105.0" dy="13.0">C/N0, AGC, Доплер, L1/L5</tspan></text>
<rect x="20.0" y="140.0" width="170.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="105.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Інерціальний блок (ІВБ)</tspan><tspan x="105.0" dy="11.7">(Акселерометр + Гіроскоп)</tspan><tspan x="105.0" dy="11.7">Швидкість v_imu, кути R</tspan></text>
<rect x="20.0" y="225.0" width="170.0" height="65.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="105.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Багатосузірне PVT</tspan><tspan x="105.0" dy="13.0">GPS, Galileo, BeiDou</tspan><tspan x="105.0" dy="13.0">Незалежні розв'язки</tspan></text>
<rect x="225.0" y="55.0" width="340.0" height="55.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/>
<text x="240.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">1. РФ та енергетичний профіль</text>
<text x="240.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Перевірка стрибка AGC, однорідності C/N0</text>
<rect x="225.0" y="125.0" width="340.0" height="55.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/>
<text x="240.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">2. Доплерівсько-інерціальний тест</text>
<text x="240.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Нев'язка |ρ̇_i − (v_sat − v_imu)·e_i| &lt; ε_dopp</text>
<rect x="225.0" y="195.0" width="340.0" height="55.0" rx="6" fill="#ffffff" stroke="#b7791f" stroke-width="1.4"/>
<text x="240.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b7791f" text-anchor="start" font-weight="700">3. Статистичний контроль цілісності RAIM</text>
<text x="240.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Вектор нев'язок p = S·y, тест хі-квадрат SSE</text>
<rect x="225.0" y="265.0" width="340.0" height="55.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/>
<text x="240.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">4. Мультисистемна та міжчастотна дельта</text>
<text x="240.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">GPS vs Galileo vs BeiDou, іоносферна дисперсія</text>
