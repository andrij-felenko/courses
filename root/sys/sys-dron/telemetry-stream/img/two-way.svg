<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Це РОЗМОВА, а не мовлення: потік у два боки</text>
<rect x="110.0" y="146.0" width="60.0" height="38.0" rx="6" fill="#fbfbfb" stroke="#2457d6" stroke-width="1.8"/><line x1="140.0" y1="146.0" x2="140.0" y2="124.0" stroke="#6b7280" stroke-width="3.0"/><line x1="134.0" y1="124.0" x2="146.0" y2="120.0" stroke="#6b7280" stroke-width="2.4"/><text x="140.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">борт</text>
<rect x="735.0" y="141.2" width="150.0" height="47.6" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="810.0" y="161.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">наземна</tspan><tspan x="810.0" dy="15.6">станція (GCS)</tspan></text>
<line x1="710.0" y1="120.0" x2="200.0" y2="120.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="470.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ВНИЗ: стан — висота, GPS, заряд, кути, режим</text>
<line x1="200.0" y1="215.0" x2="710.0" y2="215.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="470.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ВГОРУ: команди, читання/запис параметрів, місія, RC-override</text>
<rect x="110.0" y="270.0" width="720.0" height="36.0" rx="6" fill="#fbf3df" stroke="#b08900" stroke-width="1.5"/><text x="470.0" y="292.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Та сама лінія несе обидва напрями — тому це дім для MAVLink (мови запитів і відповідей)</tspan></text>
</svg>