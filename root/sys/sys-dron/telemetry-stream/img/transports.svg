<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна мова (MAVLink) — різні «труби»</text>
<rect x="32.0" y="80.0" width="200.0" height="70.0" rx="6" fill="#fbfbfb" stroke="#27ae60" stroke-width="1.5"/><text x="132.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="132.0" dy="0.0">телеметрійне</tspan><tspan x="132.0" dy="16.9">радіо (SiK/RFD900)</tspan></text>
<text x="132.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">кілометри</text>
<line x1="132.0" y1="190.0" x2="132.0" y2="232.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="264.0" y="80.0" width="200.0" height="70.0" rx="6" fill="#fbfbfb" stroke="#1a1a1a" stroke-width="1.5"/><text x="364.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="364.0" dy="0.0">USB-кабель</tspan></text>
<text x="364.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">стіл / стенд</text>
<line x1="364.0" y1="190.0" x2="364.0" y2="232.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="496.0" y="80.0" width="200.0" height="70.0" rx="6" fill="#fbfbfb" stroke="#2457d6" stroke-width="1.5"/><text x="596.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="596.0" dy="0.0">Wi-Fi / Bluetooth</tspan><tspan x="596.0" dy="16.9">(ESP32-міст)</tspan></text>
<text x="596.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">TCP/UDP, телефон</text>
<line x1="596.0" y1="190.0" x2="596.0" y2="232.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="728.0" y="80.0" width="200.0" height="70.0" rx="6" fill="#fbfbfb" stroke="#c0392b" stroke-width="1.5"/><text x="828.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="828.0" dy="0.0">спільно з RC</tspan><tspan x="828.0" dy="16.9">(CRSF / ELRS)</tspan></text>
<text x="828.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">один лінк на все</text>
<line x1="828.0" y1="190.0" x2="828.0" y2="232.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="32.0" y="236.0" width="896.0" height="40.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="480.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">той самий потік MAVLink — мова не змінюється</text>
<text x="480.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">особливий випадок: бортовий комп'ютер ПОРЯД із контролером, короткий UART без радіо</text>
</svg>