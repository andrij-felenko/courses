<text x="195.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Пилкоподібне сканування (10–50 мкс, 20 МГц)</text>
<text x="195.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Найдешевший і наймасовіший тип глушника</text>
<text x="195.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Обходить режекторні решітки та зриває DLL</text>
<text x="195.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Миттєво перевантажує вхідний тракт і АЦП</text>
<rect x="475.0" y="265.0" width="410.0" height="180.0" rx="6" fill="#f8fafc" stroke="#d97706" stroke-width="1.2"/>
<rect x="485.0" y="275.0" width="390.0" height="26.0" rx="4" fill="#d97706" stroke="#d97706" stroke-width="1.0"/>
<text x="680.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">4. Імпульсна завада (Pulsed Jammer)</text>
