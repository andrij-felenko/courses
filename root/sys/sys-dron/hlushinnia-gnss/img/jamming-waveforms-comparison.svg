<text x="560.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#fef08a" text-anchor="middle" font-weight="700">P_peak імпульс</text>
<text x="635.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Короткі надпотужні імпульси (1–100 мкс)</text>
<text x="635.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Вводить вхідний МШУ (LNA) у компресію</text>
<text x="635.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Блокує часову константу петлі АРП (AGC)</text>
<text x="635.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Спричиняє циклічні зриви фазового супроводу</text>
