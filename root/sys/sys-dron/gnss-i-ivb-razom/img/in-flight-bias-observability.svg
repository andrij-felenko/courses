<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спостережуваність зміщень ІВБ (Bias Observability): статика проти маневру</text>
<rect x="20.0" y="50.0" width="385.0" height="290.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="212.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Статичне зависання: невизначеність</text>
<text x="212.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Зміщення b_a_z невіддільне від гравітації g</text>
<line x1="130.0" y1="160.0" x2="290.0" y2="160.0" stroke="#333333" stroke-width="3.0"/>
<circle cx="130.0" cy="155.0" r="12.0" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/>
<circle cx="290.0" cy="155.0" r="12.0" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/>
<rect x="190.0" y="145.0" width="44.0" height="30.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="212.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">IMU</text>
<line x1="212.0" y1="175.0" x2="212.0" y2="240.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="232.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" font-weight="700">g (9.81 м/с²)</text>
<line x1="202.0" y1="175.0" x2="202.0" y2="210.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="150.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">b_a_z (зсув)</text>
<rect x="35.0" y="250.0" width="355.0" height="75.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="212.5" y="271.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Рівняння виміру: a_z = g + b_a_z</tspan><tspan x="212.5" dy="13.0">GNSS бачить v = 0, p = const.</tspan><tspan x="212.5" dy="13.0">Неможливо розділити: чи це g = 9.81, чи це b_a_z ≠ 0.</tspan><tspan x="212.5" dy="13.0">Зміщення вертикальної осі НЕ спостережуване!</tspan></text>
<rect x="425.0" y="50.0" width="395.0" height="290.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="622.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Динамічний маневр: повна спостережуваність</text>
<text x="622.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Зміна орієнтації та прискорення розкривають зміщення</text>
<line x1="545.8" y1="190.0" x2="694.2" y2="130.0" stroke="#333333" stroke-width="3.0"/>
<circle cx="545.8" cy="185.0" r="12.0" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/>
<circle cx="694.2" cy="125.0" r="12.0" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/>
<rect x="598.0" y="145.0" width="44.0" height="30.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/>
<text x="620.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">IMU</text>
<line x1="620.0" y1="145.0" x2="675.0" y2="115.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="685.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">a_kin (рух)</text>
<line x1="650.0" y1="190.0" x2="730.0" y2="190.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="695.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">v_gnss (росте)</text>
<rect x="440.0" y="250.0" width="365.0" height="75.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="622.5" y="271.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="622.5" dy="0.0">Прискорення створює крос-кореляцію в EKF:</tspan><tspan x="622.5" dy="13.0">1) GNSS дає істинну похідну швидкості dv/dt;</tspan><tspan x="622.5" dy="13.0">2) IMU вимірює R(q)ᵀ · (a + g) + b_a;</tspan><tspan x="622.5" dy="13.0">3) Маневр розділяє кутову похибку δθ та зміщення b_a!</tspan></text>
</svg>