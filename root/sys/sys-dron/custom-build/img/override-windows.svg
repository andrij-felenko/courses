<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1300" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три вікна: що піддається перевизначенню, а що ні</text>
<rect x="40.0" y="70.0" width="390.0" height="58.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">1 · прочитано ДО теки виробника</tspan></text>
<rect x="460.0" y="70.0" width="380.0" height="58.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">2 · вікно перевизначення</tspan></text>
<rect x="880.0" y="70.0" width="380.0" height="58.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="1070.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1070.0" dy="0.0">3 · обчислено ПІСЛЯ</tspan></text>
<rect x="40.0" y="148.0" width="390.0" height="178.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="193.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">QGC_CUSTOM_DIR</tspan><tspan x="235.0" dy="19.5"></tspan><tspan x="235.0" dy="19.5">саме за нею кореневий файл</tspan><tspan x="235.0" dy="19.5">шукає теку виробника —</tspan><tspan x="235.0" dy="19.5">і робить це раніше, ніж</tspan><tspan x="235.0" dy="19.5">виконає include(CustomOverrides)</tspan></text>
<rect x="460.0" y="148.0" width="380.0" height="178.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="203.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">усі ручки, оголошені в</tspan><tspan x="650.0" dy="19.5">cmake/CustomOptions.cmake:</tspan><tspan x="650.0" dy="19.5"></tspan><tspan x="650.0" dy="19.5">ідентичність · набір функцій ·</tspan><tspan x="650.0" dy="19.5">шляхи артефактів платформ</tspan></text>
<rect x="880.0" y="148.0" width="380.0" height="178.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1070.0" y="183.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1070.0" dy="0.0">QGC_APP_VERSION</tspan><tspan x="1070.0" dy="19.5">QGC_APP_VERSION_STR</tspan><tspan x="1070.0" dy="19.5">QGC_APP_DATE · QGC_GIT_HASH</tspan><tspan x="1070.0" dy="19.5"></tspan><tspan x="1070.0" dy="19.5">їх ставить include(Git)</tspan><tspan x="1070.0" dy="19.5">звичайним set() — уже</tspan><tspan x="1070.0" dy="19.5">після вашого файлу</tspan></text>
<rect x="40.0" y="348.0" width="390.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="235.0" y="389.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">перевизначенню не піддається:</tspan><tspan x="235.0" dy="18.2">задається лише з командного рядка</tspan></text>
<rect x="460.0" y="348.0" width="380.0" height="92.0" rx="6" fill="#f8f4ee" stroke="#c0392b" stroke-width="2.2"/><text x="650.0" y="389.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">set(… CACHE &lt;ТИП&gt; … FORCE) діє —</tspan><tspan x="650.0" dy="18.2">і перебиває навіть -D… у виклику</tspan></text>
<rect x="880.0" y="348.0" width="380.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1070.0" y="389.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1070.0" dy="0.0">звичайна змінна затінює кеш:</tspan><tspan x="1070.0" dy="18.2">версію задають теги git</tspan></text>
<line x1="434.0" y1="237.0" x2="456.0" y2="237.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="844.0" y1="237.0" x2="876.0" y2="237.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="650.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">коли яка змінна набуває значення під час конфігурації</text>
<rect x="40.0" y="472.0" width="1220.0" height="104.0" rx="6" fill="#f8f4ee" stroke="#c0392b" stroke-width="2.2"/><text x="650.0" y="509.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">похідне типове значення — знімок, а не посилання:</tspan><tspan x="650.0" dy="19.5">QGC_MACOS_BUNDLE_ID і QGC_ANDROID_PACKAGE_NAME взяли ${QGC_PACKAGE_NAME} ще з апстримовим значенням,</tspan><tspan x="650.0" dy="19.5">тому перевизначення QGC_PACKAGE_NAME їх уже не змінює — кожне задається окремим рядком</tspan></text>
</svg>