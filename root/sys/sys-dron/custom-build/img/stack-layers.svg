<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1320" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три шари підтримки польотного стеку й що забирає кожен перемикач</text>
<rect x="40.0" y="62.0" width="210.0" height="52.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="93.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">шар підтримки</tspan></text>
<rect x="280.0" y="62.0" width="330.0" height="52.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="445.0" y="93.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">що це насправді</tspan></text>
<rect x="640.0" y="62.0" width="330.0" height="52.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="93.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">перемикач збірки</tspan></text>
<rect x="1000.0" y="62.0" width="280.0" height="52.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="1140.0" y="93.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1140.0" dy="0.0">що зникає з бінарника</tspan></text>
<rect x="40.0" y="134.0" width="210.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="194.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Діалект</tspan></text>
<rect x="280.0" y="134.0" width="330.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="445.0" y="184.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">набір повідомлень,</tspan><tspan x="445.0" dy="18.2">згенерований з XML-опису</tspan></text>
<rect x="640.0" y="134.0" width="330.0" height="110.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="185.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">QGC_DISABLE_APM_MAVLINK</tspan><tspan x="805.0" dy="16.9">→ QGC_NO_ARDUPILOT_DIALECT</tspan></text>
<rect x="1000.0" y="134.0" width="280.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1140.0" y="184.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">структури, ідентифікатори</tspan><tspan x="1140.0" dy="18.2">й код розбору повідомлень</tspan></text>
<rect x="40.0" y="260.0" width="210.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="320.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Плагін</tspan></text>
<rect x="280.0" y="260.0" width="330.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="445.0" y="310.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">клас поведінки: назви режимів,</tspan><tspan x="445.0" dy="18.2">перейменування параметрів</tspan></text>
<rect x="640.0" y="260.0" width="330.0" height="110.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="319.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">QGC_DISABLE_APM_PLUGIN</tspan></text>
<rect x="1000.0" y="260.0" width="280.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1140.0" y="310.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">весь код поведінки</tspan><tspan x="1140.0" dy="18.2">цього польотного стеку</tspan></text>
<rect x="40.0" y="386.0" width="210.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="446.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Фабрика</tspan></text>
<rect x="280.0" y="386.0" width="330.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="445.0" y="436.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">той, хто за типом автопілота</tspan><tspan x="445.0" dy="18.2">вирішує, який плагін створити</tspan></text>
<rect x="640.0" y="386.0" width="330.0" height="110.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="437.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">QGC_DISABLE_APM_PLUGIN_FACTORY</tspan><tspan x="805.0" dy="16.9">QGC_DISABLE_PX4_PLUGIN_FACTORY</tspan></text>
<rect x="1000.0" y="386.0" width="280.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1140.0" y="436.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">лише право вибору;</tspan><tspan x="1140.0" dy="18.2">сам плагін лишається</tspan></text>
<rect x="40.0" y="526.0" width="1240.0" height="78.0" rx="6" fill="#f8f4ee" stroke="#c0392b" stroke-width="2.2"/><text x="660.0" y="560.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">приклад в апстримі: три перемикачі APM увімкнено, плюс вимкнено фабрику PX4 —</tspan><tspan x="660.0" dy="19.5">плагін PX4 лишається у збірці, але створює його вже виробникова фабрика</tspan></text>
</svg>