<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 780" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1260" height="780" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому перезапис спрацьовує саме тут</text>
<rect x="60.0" y="78.0" width="600.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="121.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">cmake/CustomOptions.cmake</tspan><tspan x="360.0" dy="20.8">типові значення всіх ручок лягають у кеш</tspan></text>
<rect x="760.0" y="78.0" width="440.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="980.0" y="121.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="980.0" dy="0.0">set(… CACHE …) без FORCE означає</tspan><tspan x="980.0" dy="18.2">«поклади, якщо ще немає»</tspan></text>
<line x1="676.0" y1="126.0" x2="744.0" y2="126.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,5"/>
<line x1="360.0" y1="174.0" x2="360.0" y2="218.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="218.0" width="600.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="261.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">перевірка: чи є тека custom/</tspan><tspan x="360.0" dy="20.8">якщо є — QGC_CUSTOM_BUILD = ON</tspan></text>
<rect x="760.0" y="218.0" width="440.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="980.0" y="261.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="980.0" dy="0.0">окремого прапорця немає:</tspan><tspan x="980.0" dy="18.2">перемикачем є сама наявність теки</tspan></text>
<line x1="676.0" y1="266.0" x2="744.0" y2="266.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,5"/>
<line x1="360.0" y1="314.0" x2="360.0" y2="358.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="358.0" width="600.0" height="96.0" rx="6" fill="#f8f4ee" stroke="#c0392b" stroke-width="2.2"/><text x="360.0" y="401.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">custom/cmake/CustomOverrides.cmake</tspan><tspan x="360.0" dy="20.8">виробник перезаписує потрібні ручки</tspan></text>
<rect x="760.0" y="358.0" width="440.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="980.0" y="401.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="980.0" dy="0.0">значення вже лежать у кеші,</tspan><tspan x="980.0" dy="18.2">тому кожен рядок закінчується FORCE</tspan></text>
<line x1="676.0" y1="406.0" x2="744.0" y2="406.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,5"/>
<line x1="360.0" y1="454.0" x2="360.0" y2="498.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="498.0" width="600.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="541.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">project(${QGC_APP_NAME} …)</tspan><tspan x="360.0" dy="20.8">оголошення проєкту</tspan></text>
<rect x="760.0" y="498.0" width="440.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="980.0" y="541.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="980.0" dy="0.0">ім'я вже виробникове —</tspan><tspan x="980.0" dy="18.2">таким буде й ім'я цілі, і файлу</tspan></text>
<line x1="676.0" y1="546.0" x2="744.0" y2="546.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,5"/>
<line x1="360.0" y1="594.0" x2="360.0" y2="638.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="638.0" width="600.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="681.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">add_subdirectory(custom)  →  add_subdirectory(src)</tspan><tspan x="360.0" dy="20.8">власний код і ресурси вливаються в головну ціль</tspan></text>
<rect x="760.0" y="638.0" width="440.0" height="96.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="980.0" y="681.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="980.0" dy="0.0">переліки джерел і визначень</tspan><tspan x="980.0" dy="18.2">їдуть через кешовані змінні</tspan></text>
<line x1="676.0" y1="686.0" x2="744.0" y2="686.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,5"/>
<text x="360.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">порядок виконання конфігурації</text>
</svg>