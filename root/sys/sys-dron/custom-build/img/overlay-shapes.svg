<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 1050" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1420" height="1050" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="710.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві форми репозиторію виробникової збірки й рахунок до кожної</text>
<rect x="50.0" y="58.0" width="640.0" height="52.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">форк: ваша тека всередині чужого репозиторію</tspan></text>
<rect x="730.0" y="58.0" width="640.0" height="52.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="1050.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1050.0" dy="0.0">накладка: чужий репозиторій підмодулем усередині вашого</tspan></text>
<rect x="50.0" y="130.0" width="640.0" height="176.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="174.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">my-qgroundcontrol/         форк усього апстриму</tspan><tspan x="370.0" dy="19.5">├── custom/                ваше</tspan><tspan x="370.0" dy="19.5">├── custom-example/        апстримове</tspan><tspan x="370.0" dy="19.5">├── src/ cmake/ android/ deploy/</tspan><tspan x="370.0" dy="19.5">├── .github/workflows/     апстримові</tspan><tspan x="370.0" dy="19.5">└── CMakeLists.txt         апстримовий</tspan></text>
<rect x="730.0" y="130.0" width="640.0" height="176.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1050.0" y="174.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">my-gcs/                    ваш репозиторій</tspan><tspan x="1050.0" dy="19.5">├── custom/                ваше</tspan><tspan x="1050.0" dy="19.5">├── upstream/qgroundcontrol/   підмодуль на тезі</tspan><tspan x="1050.0" dy="19.5">├── scripts/overlay.sh  scripts/bump-upstream.sh</tspan><tspan x="1050.0" dy="19.5">├── upstream-watch.txt  options.snapshot</tspan><tspan x="1050.0" dy="19.5">└── .github/workflows/build.yml</tspan></text>
<text x="710.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">що показує git log --oneline</text>
<rect x="50.0" y="344.0" width="640.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="389.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">ваші коміти впереміш із тисячами чужих;</tspan><tspan x="370.0" dy="19.5">без « -- custom/ » журнал не читається</tspan></text>
<rect x="730.0" y="344.0" width="640.0" height="100.0" rx="6" fill="#eef7ef" stroke="#333333" stroke-width="1.5"/><text x="1050.0" y="389.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">лише ваші коміти;</tspan><tspan x="1050.0" dy="19.5">чужа історія лежить окремо, у підмодулі</tspan></text>
<text x="710.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">як виглядає оновлення</text>
<rect x="50.0" y="490.0" width="640.0" height="112.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="541.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">git merge upstream/master —</tspan><tspan x="370.0" dy="19.5">тисячі чужих комітів у вашу гілку</tspan></text>
<rect x="730.0" y="490.0" width="640.0" height="112.0" rx="6" fill="#eef7ef" stroke="#333333" stroke-width="1.5"/><text x="1050.0" y="531.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">один рядок в індексі:</tspan><tspan x="1050.0" dy="19.5">-Subproject commit 9f3c1ad…</tspan><tspan x="1050.0" dy="19.5">+Subproject commit 4b81e02…</tspan></text>
<text x="710.0" y="638.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">що доводиться робити перед конфігурацією</text>
<rect x="50.0" y="648.0" width="640.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="699.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">нічого: тека вже під коренем дерева</tspan></text>
<rect x="730.0" y="648.0" width="640.0" height="92.0" rx="6" fill="#eef7ef" stroke="#333333" stroke-width="1.5"/><text x="1050.0" y="689.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">накладання: посилання на машині розробника,</tspan><tspan x="1050.0" dy="19.5">копія в CI</tspan></text>
<text x="710.0" y="776.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle">де проходить межа дисципліни</text>
<rect x="50.0" y="786.0" width="640.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="831.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">чужі файли поруч і відкриті на запис —</tspan><tspan x="370.0" dy="19.5">правку «лише один рядок» ніщо не зупиняє</tspan></text>
<rect x="730.0" y="786.0" width="640.0" height="100.0" rx="6" fill="#eef7ef" stroke="#333333" stroke-width="1.5"/><text x="1050.0" y="831.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">чужі файли в підмодулі — правка там</tspan><tspan x="1050.0" dy="19.5">одразу видно й не потрапляє у ваш коміт</tspan></text>
<rect x="50.0" y="916.0" width="1320.0" height="84.0" rx="6" fill="#f8f4ee" stroke="#c0392b" stroke-width="2.2"/><text x="710.0" y="953.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">спільне для обох форм: на момент конфігурації тека виробника</tspan><tspan x="710.0" dy="20.8">мусить фізично лежати всередині дерева джерел апстриму</tspan></text>
</svg>