<text x="680.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві згадки теки в конфігурації висувають різні вимоги до шляху</text>
<rect x="300.0" y="62.0" width="760.0" height="128.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="112.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">кореневий CMakeLists.txt апстриму</tspan><tspan x="680.0" dy="18.2">if(IS_DIRECTORY &quot;${CMAKE_SOURCE_DIR}/${QGC_CUSTOM_DIR}&quot;)  …  include(CustomOverrides)</tspan><tspan x="680.0" dy="18.2">if(QGC_CUSTOM_BUILD)   add_subdirectory(&quot;${QGC_CUSTOM_DIR}&quot;)</tspan></text>
<rect x="60.0" y="236.0" width="590.0" height="54.0" rx="6" fill="#eef7ef" stroke="#333333" stroke-width="1.5"/><text x="355.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="355.0" dy="0.0">✓  тека всередині дерева джерел</tspan></text>
