<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один принцип, шість втілень: запобіжник, який знімають свідомо</text>
<rect x="165.0" y="52.0" width="560.0" height="52.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="445.0" y="82.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b08900" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">кремінний замок (half-cock, doglock)</tspan></text>
<text x="70.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">XVII ст.</text>
<text x="177.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">окремий бар'єр поверх заряду; знімається лише навмисним рухом</text>
<line x1="445.0" y1="110.0" x2="445.0" y2="122.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="165.0" y="128.0" width="560.0" height="52.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="445.0" y="158.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">залізничний interlock (Дж. Саксбі)</tspan></text>
<text x="70.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1856</text>
<text x="177.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">несумісні дії взаємно замкнені сталевими планками</text>
<line x1="445.0" y1="186.0" x2="445.0" y2="198.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="165.0" y="204.0" width="560.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="445.0" y="234.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">дворучний прес; блокування огорожі</tspan></text>
<text x="70.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">XX ст.</text>
<text x="177.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">дозвіл лише через жест, несумісний із небезпекою</text>
<line x1="445.0" y1="262.0" x2="445.0" y2="274.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="165.0" y="280.0" width="560.0" height="52.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="445.0" y="310.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b08900" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">граната Міллза (чека + важіль)</tspan></text>
<text x="70.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1915</text>
<text x="177.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">arm/disarm; зводити важко, знешкодити — легко</text>
<line x1="445.0" y1="338.0" x2="445.0" y2="350.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="165.0" y="356.0" width="560.0" height="52.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="445.0" y="386.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">рукоятка мерця (Ф. Спрейг, 1880-ті)</tspan></text>
<text x="70.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">XX ст.</text>
<text x="177.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">безпека за замовчуванням: зникло керування — гальмуй сам</text>
<line x1="445.0" y1="414.0" x2="445.0" y2="426.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="165.0" y="432.0" width="560.0" height="52.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="445.0" y="462.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">arming у прошивці дрона (armed)</tspan></text>
<text x="70.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">наші дні</text>
<text x="177.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">той самий бар'єр у коді + автоматична перевірка готовності</text>
<rect x="125.0" y="517.8" width="640.0" height="32.5" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="445.0" y="538.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">дрон не винайшов принцип — переніс його в код і додав перевірку готовності</tspan></text>
</svg>