<rect x="10.0" y="10.0" width="800.0" height="500.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
<line x1="180.0" y1="430.0" x2="180.0" y2="40.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="180.0" y1="430.0" x2="180.0" y2="40.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="180.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">Північ (North / 0°)</text>
<line x1="263.4" y1="173.2" x2="263.4" y2="73.2" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M 180.0,300.0 A 130.0,130.0 0 0,1 220.2,306.4" fill="none" stroke="#2457d6" stroke-width="2.0"/>
<text x="212.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ψ (Heading)</text>
<path d="M 180.0,245.0 A 185.0,185.0 0 0,1 313.1,301.5" fill="none" stroke="#27ae60" stroke-width="2.0"/>
<text x="280.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">χ (Track)</text>
<path d="M 252.6,206.5 A 235.0,235.0 0 0,1 349.0,266.8" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="3 3"/>
<text x="310.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">α_c = χ − ψ (Crab)</text>
<line x1="180.0" y1="430.0" x2="263.4" y2="173.2" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="186.7" y="311.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">V_a (Airspeed)</text>
