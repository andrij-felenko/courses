<text x="358.1" y="326.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">V_g = V_a + W (Ground Speed)</text>
<circle cx="180.0" cy="430.0" r="5.0" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.5"/>
<text x="164.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">O (Старт)</text>
<circle cx="263.4" cy="173.2" r="4.0" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="446.2" cy="173.0" r="5.0" fill="#27ae60" stroke="#ffffff" stroke-width="1.5"/>
<text x="461.2" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Фактичний рух</text>
<rect x="434.9" y="37.4" width="270.2" height="145.2" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/><text x="570.0" y="59.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Векторне рівняння:</tspan><tspan x="570.0" dy="15.6">V_g = V_a + W</tspan><tspan x="570.0" dy="15.6"></tspan><tspan x="570.0" dy="15.6">Кути орієнтації:</tspan><tspan x="570.0" dy="15.6">• ψ (Heading) — кут осі носа</tspan><tspan x="570.0" dy="15.6">• χ (Track) — напрямок руху по землі</tspan><tspan x="570.0" dy="15.6">• α_c = χ − ψ — кут крабування</tspan><tspan x="570.0" dy="15.6">• W — швидкість і напрямок вітру</tspan></text>
</svg>