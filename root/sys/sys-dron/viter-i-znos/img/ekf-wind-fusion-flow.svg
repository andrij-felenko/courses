<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="840.0" height="460.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="430.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура оцінки вітру (EKF) та формування кута крабування</text>
<rect x="30.0" y="65.0" width="190.0" height="65.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="125.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">GNSS Приймач</tspan><tspan x="125.0" dy="14.3">• Шляхова швидкість V_g</tspan><tspan x="125.0" dy="14.3">• Координати (X, Y)</tspan></text>
<rect x="30.0" y="145.0" width="190.0" height="65.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="125.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">Трубка Піто (Airspeed)</tspan><tspan x="125.0" dy="14.3">• Динамічний тиск q</tspan><tspan x="125.0" dy="14.3">• Повітряна швидкість V_a</tspan></text>
<rect x="30.0" y="225.0" width="190.0" height="65.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="125.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">IMU / AHRS</tspan><tspan x="125.0" dy="13.0">• Орієнтація (q_att / Euler)</tspan><tspan x="125.0" dy="13.0">• Кутова швидкість ω</tspan></text>
<rect x="275.0" y="75.0" width="270.0" height="225.0" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2.0"/>
<text x="410.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бортовий фільтр EKF</text>
<line x1="290.0" y1="109.0" x2="530.0" y2="109.0" stroke="#cbd5e1" stroke-width="1.0"/>
<rect x="285.0" y="120.0" width="250.0" height="165.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.0"/><text x="410.0" y="173.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Вектор стану: x = [W_N, W_E, k_scale]^T</tspan><tspan x="410.0" dy="13.0"></tspan><tspan x="410.0" dy="13.0">Прогноз: Ẇ = 0 + w_wind</tspan><tspan x="410.0" dy="13.0">Вимірювання:</tspan><tspan x="410.0" dy="13.0">z = V_g − R_b^n · [k · V_a, 0, 0]^T</tspan><tspan x="410.0" dy="13.0">Інновація: y = z − W</tspan></text>
<line x1="220.0" y1="97.0" x2="275.0" y2="120.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="220.0" y1="177.0" x2="275.0" y2="177.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="220.0" y1="257.0" x2="275.0" y2="235.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="585.0" y="75.0" width="245.0" height="225.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="707.5" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Контур наведення (L1)</text>
<line x1="600.0" y1="109.0" x2="815.0" y2="109.0" stroke="#bbf7d0" stroke-width="1.0"/>
<rect x="595.0" y="120.0" width="225.0" height="165.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/><text x="707.5" y="170.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="707.5" dy="0.0">1. Бажаний шлях: χ_cmd</tspan><tspan x="707.5" dy="14.3">2. Кут крабування:</tspan><tspan x="707.5" dy="14.3">   α_c = arcsin( W_cross / V_a )</tspan><tspan x="707.5" dy="14.3">3. Цільовий курс носа:</tspan><tspan x="707.5" dy="14.3">   ψ_cmd = χ_cmd − α_c</tspan><tspan x="707.5" dy="14.3">4. Команда крену / рискання</tspan></text>
<line x1="545.0" y1="175.0" x2="585.0" y2="175.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="565.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Вектор W</text>
<line x1="707.5" y1="300.0" x2="707.5" y2="395.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="575.0" y="395.0" width="265.0" height="55.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="707.5" y="419.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="707.5" dy="0.0">Контур кутової стабілізації</tspan><tspan x="707.5" dy="14.3">(Уставка курсу ψ_cmd → Елерони / Руль)</tspan></text>
<rect x="30.0" y="355.0" width="510.0" height="95.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.2"/><text x="285.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Оцінка без трубки Піто (Synthetic Wind Observer):</tspan><tspan x="285.0" dy="13.0">Під час віражів та маневрів модуль V_g модулюється за курсом ψ:</tspan><tspan x="285.0" dy="13.0">V_g(t) = V_a + W_N·cos(ψ) + W_E·sin(ψ). Фільтр відновлює W та V_a без датчика тиску.</tspan></text>
</svg>