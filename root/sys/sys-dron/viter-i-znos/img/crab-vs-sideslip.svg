<rect x="35.0" y="330.0" width="360.0" height="115.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/><text x="215.0" y="368.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">• Обтікання симетричне: кут ковзання β = 0</tspan><tspan x="215.0" dy="15.6">• Мінімальний аеродинамічний опір</tspan><tspan x="215.0" dy="15.6">• Відсутні бокові сили на кіль і фюзеляж</tspan><tspan x="215.0" dy="15.6">• Основний режим автопілота в круїзі</tspan></text>
