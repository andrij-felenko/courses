<rect x="465.0" y="330.0" width="360.0" height="115.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.2"/><text x="645.0" y="368.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">• Вітер обдуває літак збоку: β ≠ 0</tspan><tspan x="645.0" dy="15.6">• Високий паразитна сила та перевитрата енергії</tspan><tspan x="645.0" dy="15.6">• Потребує постійного крену та керма напрямку</tspan><tspan x="645.0" dy="15.6">• Застосовується лише перед торканням ЗПС</tspan></text>
