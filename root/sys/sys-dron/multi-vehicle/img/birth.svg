<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від серцебиття до об'єкта: чотири умови поспіль</text>
<rect x="60.0" y="52.0" width="420.0" height="50.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="82.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">HEARTBEAT з каналу: sysid = 3, compid = 1</tspan></text>
<line x1="270.0" y1="102.0" x2="270.0" y2="126.0" stroke="#333333" stroke-width="1.4"/>
<line x1="270.0" y1="114.0" x2="270.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="132.0" width="420.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="169.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">compid = 1 — це автопілот?</tspan></text>
<line x1="486.0" y1="165.0" x2="556.0" y2="165.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="566.0" y="134.0" width="366.0" height="62.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="749.0" y="161.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8c2b20" text-anchor="middle"><tspan x="749.0" dy="0.0">ні → підвіс, камера, компаньйон:</tspan><tspan x="749.0" dy="15.6">телеметрію приймемо, апарата не створимо</tspan></text>
<line x1="270.0" y1="198.0" x2="270.0" y2="234.0" stroke="#333333" stroke-width="1.4"/>
<line x1="270.0" y1="222.0" x2="270.0" y2="238.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="240.0" width="420.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="268.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">тип не GCS, не компаньйон,</tspan><tspan x="270.0" dy="18.2">не підвіс, не ADSB?</tspan></text>
<line x1="486.0" y1="273.0" x2="556.0" y2="273.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="566.0" y="242.0" width="366.0" height="62.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="749.0" y="277.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8c2b20" text-anchor="middle"><tspan x="749.0" dy="0.0">ні → це вузол мережі, а не апарат</tspan></text>
<line x1="270.0" y1="306.0" x2="270.0" y2="342.0" stroke="#333333" stroke-width="1.4"/>
<line x1="270.0" y1="330.0" x2="270.0" y2="346.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="348.0" width="420.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="385.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">складання дозволяє кілька апаратів?</tspan></text>
<line x1="486.0" y1="381.0" x2="556.0" y2="381.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="566.0" y="350.0" width="366.0" height="62.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="749.0" y="377.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8c2b20" text-anchor="middle"><tspan x="749.0" dy="0.0">ні → лишається тільки перший,</tspan><tspan x="749.0" dy="15.6">вендорська збірка так вимкнула багатоапаратність</tspan></text>
<line x1="270.0" y1="414.0" x2="270.0" y2="450.0" stroke="#333333" stroke-width="1.4"/>
<line x1="270.0" y1="438.0" x2="270.0" y2="454.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="456.0" width="420.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="493.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">sysid ще не знайомий, і він не 0?</tspan></text>
<line x1="486.0" y1="489.0" x2="556.0" y2="489.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="566.0" y="458.0" width="366.0" height="62.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="749.0" y="485.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8c2b20" text-anchor="middle"><tspan x="749.0" dy="0.0">ні → апарат уже в списку,</tspan><tspan x="749.0" dy="15.6">серцебиття просто оновлює його стан</tspan></text>
<line x1="270.0" y1="522.0" x2="270.0" y2="558.0" stroke="#333333" stroke-width="1.4"/>
<line x1="270.0" y1="546.0" x2="270.0" y2="562.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="564.0" width="420.0" height="62.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="598.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">new Vehicle(...) — і одразу серцебиття станції у відповідь</tspan></text>
<rect x="566.0" y="566.0" width="366.0" height="58.0" rx="6" fill="#f7f8fa" stroke="#6b7280" stroke-width="1.5"/><text x="749.0" y="591.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="749.0" dy="0.0">перший апарат стає активним,</tspan><tspan x="749.0" dy="15.6">другий і далі — лише повідомленням</tspan></text>
</svg>