<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння схем кадрування: потоковий ULog проти кадрового DataFlash</text>
<rect x="30.0" y="60.0" width="400.0" height="360.0" rx="8" fill="#f8fafc" stroke="#2457d6" stroke-width="1.5"/>
<text x="230.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">PX4 ULog: Потоковий формат</text>
<rect x="45.0" y="105.0" width="370.0" height="48.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Заголовок 'ULog' лише на початку файлу.</tspan><tspan x="230.0" dy="13.0">Далі безперервний потік: [Length (2B)][Type (1B)][Payload]</tspan></text>
<text x="230.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переваги архітектури:</text>
<text x="230.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">• Мінімальний оверхед (3 байти заголовка на пакет)</tspan><tspan x="230.0" dy="14.9">• Підтримка вкладених та динамічних типів uORB</tspan><tspan x="230.0" dy="14.9">• Розділення визначення (Add 'A') та даних ('D')</tspan><tspan x="230.0" dy="14.9">• Компактний 2-байтний msg_id замість повтору схеми</tspan></text>
<rect x="45.0" y="275.0" width="370.0" height="65.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/>
<text x="230.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Слабке місце кадрування:</text>
<text x="230.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">При пошкодженні байтів поля довжини (Length)</text>
<text x="230.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">парсер втрачає потік до кінця сесії або блоку.</text>
<rect x="45.0" y="350.0" width="370.0" height="55.0" rx="6" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="374.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Призначення: максимальна щільність запису</tspan><tspan x="230.0" dy="14.3">та глибока інтеграція з мікроядерною шиною uORB</tspan></text>
<rect x="450.0" y="60.0" width="400.0" height="360.0" rx="8" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/>
<text x="650.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ArduPilot DataFlash: Покадровий формат</text>
<rect x="465.0" y="105.0" width="370.0" height="48.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="125.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Синхромаркер 0xA3 0x95 перед КОЖНИМ повідомленням.</tspan><tspan x="650.0" dy="14.3">Фіксована довжина касет після їх реєстрації у FMT.</tspan></text>
<text x="650.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переваги архітектури:</text>
<text x="650.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">• Миттєве відновлення синхронізації при втраті байтів</tspan><tspan x="650.0" dy="14.9">• Можливість довільного позиціонування (Seek / Jump)</tspan><tspan x="650.0" dy="14.9">• Простий лінійний парсинг без стану складних структур</tspan><tspan x="650.0" dy="14.9">• Стійкість до апаратного скидання живлення в польоті</tspan></text>
<rect x="465.0" y="275.0" width="370.0" height="65.0" rx="4" fill="#fff2cc" stroke="#d6b656" stroke-width="1.0"/>
<text x="650.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b78103" text-anchor="middle" font-weight="700">Слабке місце кадрування:</text>
<text x="650.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b78103" text-anchor="middle">Додаткові 3 байти (0xA3 0x95 Type) на КОЖЕН семпл</text>
<text x="650.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b78103" text-anchor="middle">і фіксований ліміт на 16 полів на один пакет FMT.</text>
<rect x="465.0" y="350.0" width="370.0" height="55.0" rx="6" fill="#d5e8d4" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="374.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Призначення: висока надійність збереження даних</tspan><tspan x="650.0" dy="14.3">у разі аварійних вимкнень та пошкоджень носія</tspan></text>
</svg>