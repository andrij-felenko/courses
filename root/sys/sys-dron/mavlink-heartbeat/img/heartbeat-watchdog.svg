<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сторожовий таймер серцебиття: часова шкала виявлення втрати лінку</text>
<line x1="60.0" y1="120.0" x2="780.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="770.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">Час (секунди)</text>
<circle cx="110.0" cy="120.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="110.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">t = 0.0 с</text>
<text x="110.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">HEARTBEAT #1</text>
<line x1="110.0" y1="85.0" x2="110.0" y2="112.0" stroke="#27ae60" stroke-width="1.5"/>
<circle cx="230.0" cy="120.0" r="6.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="230.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">t = 1.0 с</text>
<text x="230.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">HEARTBEAT #2</text>
<line x1="230.0" y1="85.0" x2="230.0" y2="112.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="278.0" y1="95.0" x2="302.0" y2="145.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="278.0" y1="145.0" x2="302.0" y2="95.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="290.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Обрив зв'язку / завада</text>
<rect x="230.0" y="160.0" width="140.0" height="32.0" rx="4" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.2"/>
<text x="300.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Норма (джиттер)</text>
<circle cx="440.0" cy="120.0" r="6.0" fill="#f39c12" stroke="#f39c12" stroke-width="1.5"/>
<text x="440.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">t = 3.0 с</text>
<rect x="380.0" y="160.0" width="170.0" height="32.0" rx="4" fill="#f4f6f8" stroke="#f39c12" stroke-width="1.2"/>
<text x="465.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#f39c12" text-anchor="middle" font-weight="700">Деградація лінку (Warning)</text>
<circle cx="620.0" cy="120.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<text x="620.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">t = 4.5 с (Поріг)</text>
<line x1="620.0" y1="70.0" x2="620.0" y2="110.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="3,3"/>
<rect x="540.0" y="25.0" width="180.0" height="44.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="2.2"/>
<text x="630.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">FAILSAFE АКТИВОВАНО</text>
<text x="630.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">RTL / Land / Loiter</text>
<rect x="60.0" y="235.0" width="720.0" height="60.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="420.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сторожовий таймер (Watchdog) відлічує: Δt = t_поточний - t_останнього_HEARTBEAT.</text>
<text x="420.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Якщо Δt &gt; 4.5 с: станція позначає зв'язок втраченим, автопілот переходить у режим захисту (GCS Failsafe).</text>
</svg>