<rect x="690.0" y="70.0" width="270.0" height="160.0" rx="6" fill="#f7fafc" stroke="#1a1a1a" stroke-width="1.4"/><text x="825.0" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Правило парності (Even-Odd)</tspan><tspan x="825.0" dy="15.6">• Лічильник перетинів k = 0</tspan><tspan x="825.0" dy="15.6">• Кожен перетин променя x ≥ P.x</tspan><tspan x="825.0" dy="15.6">  інвертує статус: k = k + 1</tspan><tspan x="825.0" dy="15.6">• k непарне (1, 3, ...) → ВСЕРЕДИНІ</tspan><tspan x="825.0" dy="15.6">• k парне (0, 2, 4, ...) → ЗОВНІ</tspan></text>
<rect x="690.0" y="250.0" width="270.0" height="190.0" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.4"/><text x="825.0" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Обробка крайових умов</tspan><tspan x="825.0" dy="15.0">• Напіввідкритий інтервал:</tspan><tspan x="825.0" dy="15.0">  (V_i.y ≤ P.y &lt; V_j.y) або</tspan><tspan x="825.0" dy="15.0">  (V_j.y ≤ P.y &lt; V_i.y)</tspan><tspan x="825.0" dy="15.0">• Вершина рахується РІВНО 1 раз</tspan><tspan x="825.0" dy="15.0">• Горизонтальні ребра: V_i.y == V_j.y</tspan><tspan x="825.0" dy="15.0">  автоматично ігноруються</tspan><tspan x="825.0" dy="15.0">• Без ділення: порівняння знака</tspan></text>
</svg>