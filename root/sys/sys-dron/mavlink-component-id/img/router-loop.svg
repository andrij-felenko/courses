<text x="510.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Один кадр обертається колом: 1 → 2 → 4 → 8 копій.</text>
<text x="510.0" y="550.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">У заголовку MAVLink немає лічильника переходів — само це не згасне.</text>
