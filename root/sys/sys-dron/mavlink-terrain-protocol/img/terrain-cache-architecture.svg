<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 940 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="940" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="920.0" height="520.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><rect x="226.8" y="8.5" width="466.4" height="35.0" rx="6" fill="#eef2f7" stroke="#2c3e50" stroke-width="1.5"/><text x="460.0" y="31.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">БОРТОВА АРХІТЕКТУРА ОБРОБКИ РЕЛЬЄФУ В АВТОПІЛОТІ</tspan></text><rect x="7.9" y="67.5" width="204.2" height="35.0" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/><text x="110.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">GNSS / Інерціальна система</tspan><tspan x="110.0" dy="13.0">Поточні (lat, lon, alt_amsl, V)</tspan></text><rect x="1.7" y="157.5" width="216.6" height="35.0" rx="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/><text x="110.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Менеджер місій (AP_Mission)</tspan><tspan x="110.0" dy="13.0">Ціль MAV_FRAME_GLOBAL_TERRAIN_ALT</tspan></text><rect x="213.1" y="106.0" width="253.8" height="48.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="340.0" y="120.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">Предиктор траєкторії та черги запитів</tspan><tspan x="340.0" dy="13.0">(Lookahead = V_gps · TERRAIN_LOOKAHEAD)</tspan><tspan x="340.0" dy="13.0">Розрахунок необхідних секторів сітки</tspan></text><line x1="215.0" y1="85.0" x2="235.0" y2="120.0" stroke="#2980b9" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="215.0" y1="175.0" x2="235.0" y2="140.0" stroke="#8e44ad" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="219.3" y="377.5" width="241.4" height="35.0" rx="6" fill="#efebe9" stroke="#795548" stroke-width="1.5"/><text x="340.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">Енергонезалежне сховище MicroSD</tspan><tspan x="340.0" dy="13.0">Файли /TERRAIN/xxxx.DAT (тайли 1°×1°)</tspan></text><rect x="231.7" y="257.5" width="216.6" height="35.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="340.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">Оперативний LRU-кеш блоків у RAM</tspan><tspan x="340.0" dy="13.0">(Кільцевий пул 32..64 блоків 4x4)</tspan></text><line x1="300.0" y1="310.0" x2="300.0" y2="360.0" stroke="#795548" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="315.1" y="329.5" width="109.7" height="11.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="370.0" y="338.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#795548" text-anchor="middle"><tspan x="370.0" dy="0.0">Запис / Читання тайлу</tspan></text><line x1="340.0" y1="175.0" x2="340.0" y2="240.0" stroke="#d35400" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="566.2" y="251.0" width="247.6" height="48.0" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.5"/><text x="690.0" y="265.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">Трансивер MAVLink (GCS)</tspan><tspan x="690.0" dy="13.0">TERRAIN_REQUEST &lt;-&gt; TERRAIN_DATA</tspan><tspan x="690.0" dy="13.0">Завантаження по радіолінку при промаху</tspan></text><line x1="460.0" y1="268.0" x2="545.0" y2="268.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="545.0" y1="282.0" x2="460.0" y2="282.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502.4" y="106.0" width="235.2" height="48.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="120.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Модуль білінійної інтерполяції</tspan><tspan x="620.0" dy="13.0">Розрахунок h(lat, lon) між 4 вузлами</tspan><tspan x="620.0" dy="13.0">Обчислення точної висоти поверхні</tspan></text><line x1="380.0" y1="240.0" x2="520.0" y2="150.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="406.7" y="178.5" width="76.5" height="13.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="445.0" y="188.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">4 вузли сітки</tspan></text><rect x="725.3" y="106.0" width="179.4" height="48.0" rx="6" fill="#fdf2e9" stroke="#d35400" stroke-width="1.5"/><text x="815.0" y="120.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">Контур висоти</tspan><tspan x="815.0" dy="13.0">Target_AMSL = WP_AGL + SRTM</tspan><tspan x="815.0" dy="13.0">Стабілізація кліренсу</tspan></text><line x1="725.0" y1="130.0" x2="735.0" y2="130.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="599.0" y="372.0" width="262.0" height="76.0" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="730.0" y="387.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Монітор безпеки (Terrain Failsafe)</tspan><tspan x="730.0" dy="13.0">Якщо блок відсутній у радіусі lookahead:</tspan><tspan x="730.0" dy="13.0">1. Екстрений набір висоти до RTL_ALT</tspan><tspan x="730.0" dy="13.0">2. Режим Loiter / Очікування даних</tspan><tspan x="730.0" dy="13.0">3. Повернення на базу (RTL)</tspan></text><line x1="460.0" y1="130.0" x2="620.0" y2="365.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="479.4" y="228.5" width="121.2" height="13.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="238.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Промах кешу &gt; таймаут</tspan></text>
</svg>