<rect x="630.0" y="84.0" width="310.0" height="66.0" rx="8" fill="#eaf7ef" stroke="#333333" stroke-width="1.6"/>
<text x="785.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">PARAM_VALUE</text>
