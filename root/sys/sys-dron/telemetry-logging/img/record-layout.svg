<text x="640.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лог телеметрії: ланцюг записів «мітка часу + кадр»</text>
