<rect x="70.0" y="600.0" width="560.0" height="190.0" rx="6" fill="#fdf3e7" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="661.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">ВІД ПОПЕРЕДНЬОГО КРОКУ</tspan><tspan x="350.0" dy="19.5">спати (tᵢ − tᵢ₋₁) / швидкість</tspan><tspan x="350.0" dy="19.5">кожне спрацювання таймера запізнюється</tspan><tspan x="350.0" dy="19.5">на ε &gt; 0, і ці ε додаються:</tspan><tspan x="350.0" dy="19.5">N кроків → відставання N · ε</tspan></text>
<rect x="670.0" y="600.0" width="560.0" height="190.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.5"/><text x="950.0" y="661.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">ВІД ОПОРИ НА ПОЧАТКУ</tspan><tspan x="950.0" dy="19.5">бажаний = опора + (t − t₀) / швидкість</tspan><tspan x="950.0" dy="19.5">чекати = бажаний − зараз</tspan><tspan x="950.0" dy="19.5">запізнення попереднього кроку просто</tspan><tspan x="950.0" dy="19.5">вкорочує наступне чекання; ε не росте</tspan></text>
<rect x="70.0" y="812.0" width="1160.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="836.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">чекати вийшло від'ємним — програвач відстав і читає без пауз, поки не наздожене графік</tspan></text>
