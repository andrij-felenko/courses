<text x="437" y="234" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">ОС зайнялась</text>
<rect x="485" y="216" width="5" height="28" rx="2" fill="#bbf0cb" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.0"/>
<rect x="490" y="216" width="32" height="28" rx="4" fill="#f4b8b8" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.3"/>
<text x="506" y="234" font-size="9.5" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">пізно</text>
<text x="560" y="268" font-size="11" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">× такт пропущено</text>
<text x="437" y="286" font-size="11.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">⚠ контур не оновився вчасно → апарат хитнуло</text>
<line x1="80" y1="320" x2="900" y2="320" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="900" y="314" font-size="11" fill="#6b7280" text-anchor="end" font-weight="normal" font-style="normal">час</text>
<text x="490.0" y="408" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Внутрішній контур мусить устигати КОЖЕН такт. Універсальна ОС буває швидкою, але не ГАРАНТУЄ строку — а тут запізнення = падіння.</text>
