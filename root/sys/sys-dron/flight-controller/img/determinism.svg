<text x="90" y="204" font-size="12" fill="#d98a00" text-anchor="start" font-weight="bold" font-style="normal">Універсальна ОС — інколи зайнята чимось іншим</text>
<rect x="90" y="216" width="28" height="28" rx="4" fill="#bbf0cb" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.3"/>
<rect x="190" y="216" width="28" height="28" rx="4" fill="#bbf0cb" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.3"/>
<rect x="290" y="216" width="28" height="28" rx="4" fill="#bbf0cb" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.3"/>
<rect x="590" y="216" width="28" height="28" rx="4" fill="#bbf0cb" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.3"/>
<rect x="690" y="216" width="28" height="28" rx="4" fill="#bbf0cb" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.3"/>
<rect x="790" y="216" width="28" height="28" rx="4" fill="#bbf0cb" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.3"/>
