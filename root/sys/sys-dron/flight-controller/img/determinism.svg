<rect x="490" y="108" width="28" height="28" rx="4" fill="#bbf0cb" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.3"/>
<rect x="590" y="108" width="28" height="28" rx="4" fill="#bbf0cb" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.3"/>
