<text x="490" y="100" font-size="10" fill="#cc0000" text-anchor="middle" font-weight="normal" font-style="normal">дедлайн</text>
<text x="90" y="100" font-size="12" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">Виділений МК + RTOS — кожен такт вчасно</text>
<rect x="90" y="108" width="28" height="28" rx="4" fill="#bbf0cb" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.3"/>
<rect x="190" y="108" width="28" height="28" rx="4" fill="#bbf0cb" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.3"/>
