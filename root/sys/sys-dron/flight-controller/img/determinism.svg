  <rect x="0" y="0" width="980" height="420" fill="white"/>
<text x="490.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Реальний час: вчасно — важливіше, ніж «швидко в середньому»</text>
<text x="490.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">той самий контур на виділеному МК і на універсальній ОС; такт ~2.5 мс (≈400 Гц)</text>
<line x1="190" y1="104" x2="190" y2="252" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4" stroke-opacity="0.5" stroke-linecap="round"/>
