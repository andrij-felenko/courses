<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450"
     viewBox="0 0 900 450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="450" fill="white"/>
<text x="450.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Надійність: на кожну біду — заздалегідь задана безпечна реакція</text>
<text x="450.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">політний контролер не «думає» в аварії, а виконує наперед визначений failsafe</text>
<rect x="36" y="80" width="224" height="60" rx="10" fill="#fff3f3" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.5"/>
<text x="148" y="115" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Втрата RC-зв'язку</text>
<line x1="260" y1="110" x2="326" y2="240" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="36" y="160" width="224" height="60" rx="10" fill="#fff3f3" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.5"/>
<text x="148" y="195" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Низький заряд батареї</text>
<line x1="260" y1="190" x2="326" y2="240" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="36" y="240" width="224" height="60" rx="10" fill="#fff3f3" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.5"/>
<text x="148" y="275" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Втрата GNSS-сигналу</text>
<line x1="260" y1="270" x2="326" y2="240" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="36" y="320" width="224" height="60" rx="10" fill="#fff3f3" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.5"/>
<text x="148" y="355" font-size="12.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Вихід за геозону</text>
<line x1="260" y1="350" x2="326" y2="240" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="330" y="150" width="184" height="180" rx="12" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.9"/>
<text x="422" y="222" font-size="12.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ПОЛІТНИЙ</text>
<text x="422" y="242" font-size="12.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">КОНТРОЛЕР</text>
<text x="422" y="262" font-size="12.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">— безпечні реакції</text>
<line x1="514" y1="240" x2="596" y2="110" stroke="#0a8f3c" stroke-width="1.6" marker-end="url(#arrG)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="600" y="82" width="268" height="56" rx="10" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<text x="734" y="115" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Утримання на місці (Loiter)</text>
<line x1="514" y1="240" x2="596" y2="190" stroke="#0a8f3c" stroke-width="1.6" marker-end="url(#arrG)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="600" y="162" width="268" height="56" rx="10" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<text x="734" y="195" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Повернення додому (RTL)</text>
<line x1="514" y1="240" x2="596" y2="270" stroke="#0a8f3c" stroke-width="1.6" marker-end="url(#arrG)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="600" y="242" width="268" height="56" rx="10" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<text x="734" y="275" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Посадка (Land)</text>
<line x1="514" y1="240" x2="596" y2="350" stroke="#0a8f3c" stroke-width="1.6" marker-end="url(#arrG)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="600" y="322" width="268" height="56" rx="10" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<text x="734" y="355" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Роззброєння — лише на землі</text>
<text x="450.0" y="438" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Реакції зашиті заздалегідь, тож спрацьовують навіть тоді, коли решта системи відмовила. У цьому й суть «надійного» контролера.</text>
</svg>
