<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400"
     viewBox="0 0 900 400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="400" fill="white"/>
<text x="450.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Резервування: три IMU не для точності, а щоб пережити відмову</text>
<text x="450.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">якщо один давач «збожеволів», голосування виявляє й відкидає його</text>
<rect x="46" y="78" width="210" height="60" rx="10" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<text x="64" y="102" font-size="12.5" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">IMU 1</text>
<text x="64" y="122" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">крен = +12.1°</text>
<line x1="256" y1="108" x2="356" y2="200" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="46" y="170" width="210" height="60" rx="10" fill="#fff3f3" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.8"/>
<text x="64" y="194" font-size="12.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">IMU 2</text>
<text x="64" y="214" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">крен = −47°  ⚠</text>
<line x1="256" y1="200" x2="356" y2="200" stroke="#cc0000" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrR)" stroke-opacity="1.0" stroke-linecap="round"/>
<text x="300" y="192" font-size="10.5" fill="#cc0000" text-anchor="start" font-weight="bold" font-style="normal">✗ відкинуто</text>
<rect x="46" y="262" width="210" height="60" rx="10" fill="white" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<text x="64" y="286" font-size="12.5" fill="#0a8f3c" text-anchor="start" font-weight="bold" font-style="normal">IMU 3</text>
<text x="64" y="306" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">крен = +12.3°</text>
<line x1="256" y1="292" x2="356" y2="200" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="360" y="140" width="180" height="120" rx="11" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.7"/>
<text x="450" y="188" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">ГОЛОСУВАННЯ</text>
<text x="450" y="208" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">виявлення відмови</text>
<text x="450" y="228" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">→ відкинуто IMU 2</text>
<line x1="540" y1="200" x2="596" y2="200" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arr)" stroke-opacity="1.0" stroke-linecap="round"/>
<rect x="600" y="165" width="260" height="70" rx="11" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.7"/>
<text x="730" y="193" font-size="12.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ОЦІНЮВАЧ отримує</text>
<text x="730" y="213" font-size="12.5" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">крен ≈ +12.2°</text>
<text x="450.0" y="388" font-size="11.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Дублюються не лише IMU: бувають два барометри, кілька GNSS, подвійне живлення. Мета — не лишити жодної єдиної точки відмови.</text>
</svg>
