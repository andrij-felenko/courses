<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автономна система PTU та часова послідовність порятунку</text>
<text x="35.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">1. АПАРАТНА АРХІТЕКТУРА АВТОНОМНОГО БЛОКУ (PTU)</text>
<rect x="35.0" y="70.0" width="160.0" height="95.0" rx="6" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/><text x="115.0" y="93.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">Резервне живлення</tspan><tspan x="115.0" dy="13.7">1S LiPo (3.7 В)</tspan><tspan x="115.0" dy="13.7">+</tspan><tspan x="115.0" dy="13.7">Суперконденсатор</tspan><tspan x="115.0" dy="13.7">(незалежно від борту)</tspan></text>
<line x1="195.0" y1="117.0" x2="240.0" y2="117.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="240.0" y="70.0" width="240.0" height="95.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="93.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Мікроконтролер PTU</tspan><tspan x="360.0" dy="13.7">(STM32 Bare-Metal / RTOS)</tspan><tspan x="360.0" dy="13.7">• Виділений 6-DOF IMU (1 кГц)</tspan><tspan x="360.0" dy="13.7">• Фільтр вільного падіння / tumble</tspan><tspan x="360.0" dy="13.7">• Захист від помилкового запуску</tspan></text>
<line x1="480.0" y1="95.0" x2="535.0" y2="95.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="507.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">1. FTS</text>
<rect x="535.0" y="70.0" width="185.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="627.5" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="627.5" dy="0.0">Motor Cutoff (FTS)</tspan><tspan x="627.5" dy="13.0">Оптрони / DShot переривач</tspan><tspan x="627.5" dy="13.0">(миттєва зупинка моторів)</tspan></text>
<line x1="480.0" y1="140.0" x2="535.0" y2="140.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="507.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">2. Eject</text>
<rect x="535.0" y="120.0" width="185.0" height="45.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="627.5" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="627.5" dy="0.0">Ejection Actuator</tspan><tspan x="627.5" dy="13.0">MOSFET-ключ підпалу</tspan><tspan x="627.5" dy="13.0">(піропатрон / CO₂ / серво)</tspan></text>
<rect x="750.0" y="70.0" width="175.0" height="95.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="837.5" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="837.5" dy="0.0">Зв'язок з автопілотом</tspan><tspan x="837.5" dy="13.0">(MAVLink / GPIO Arm)</tspan><tspan x="837.5" dy="13.0">• Статус Arm/Disarm</tspan><tspan x="837.5" dy="13.0">• Блокування на землі</tspan><tspan x="837.5" dy="13.0">(ручний спуск з GCS)</tspan></text>
<line x1="750.0" y1="117.0" x2="720.0" y2="117.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="35.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">2. ЧАСОВА ШКАЛА АВАРІЙНОЇ ПОСЛІДОВНОСТІ (CUT BEFORE DEPLOY)</text>
<line x1="50.0" y1="310.0" x2="910.0" y2="310.0" stroke="#333333" stroke-width="2.5"/>
