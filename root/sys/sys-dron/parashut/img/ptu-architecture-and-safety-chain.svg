<line x1="60.0" y1="310.0" x2="60.0" y2="285.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="2,2"/>
<rect x="0.0" y="217.0" width="120.0" height="68.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="60.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Аварія</text>
<rect x="5.0" y="239.0" width="110.0" height="42.0" rx="6" fill="#fdecea" stroke="#fdecea" stroke-width="1.5"/><text x="60.0" y="257.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="60.0" dy="0.0">Вільне падіння a&lt;0.2g</tspan><tspan x="60.0" dy="11.7">або зрив ω&gt;350°/с</tspan></text>
<circle cx="180.0" cy="310.0" r="5.0" fill="#b08900" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="180.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="700">+80 мс</text>
<line x1="180.0" y1="310.0" x2="180.0" y2="285.0" stroke="#b08900" stroke-width="1.2" stroke-dasharray="2,2"/>
<rect x="120.0" y="217.0" width="120.0" height="68.0" rx="5" fill="#fdf6e3" stroke="#b08900" stroke-width="1.5"/>
<text x="180.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="700">Детекція PTU</text>
<rect x="125.0" y="239.0" width="110.0" height="42.0" rx="6" fill="#fdf6e3" stroke="#fdf6e3" stroke-width="1.5"/><text x="180.0" y="257.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Підтвердження аварії</tspan><tspan x="180.0" dy="11.7">(фільтр шуму IMU)</tspan></text>
<circle cx="320.0" cy="310.0" r="5.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="320.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">+90 мс</text>
<line x1="320.0" y1="310.0" x2="320.0" y2="285.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="2,2"/>
<rect x="260.0" y="217.0" width="120.0" height="68.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="320.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Motor Cutoff</text>
<rect x="265.0" y="239.0" width="110.0" height="42.0" rx="6" fill="#fdecea" stroke="#fdecea" stroke-width="1.5"/><text x="320.0" y="257.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">FTS: вимкнення ESC</tspan><tspan x="320.0" dy="11.7">Активне гальмування</tspan></text>
<circle cx="470.0" cy="310.0" r="5.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="470.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">+140 мс</text>
<line x1="470.0" y1="310.0" x2="470.0" y2="285.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="2,2"/>
<rect x="410.0" y="217.0" width="120.0" height="68.0" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="470.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Викид купола</text>
<rect x="415.0" y="239.0" width="110.0" height="42.0" rx="6" fill="#e9f7ef" stroke="#e9f7ef" stroke-width="1.5"/><text x="470.0" y="257.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Мотори зупинено!</tspan><tspan x="470.0" dy="11.7">Підпал піропатрона</tspan></text>
<circle cx="640.0" cy="310.0" r="5.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="640.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">+320 мс</text>
<line x1="640.0" y1="310.0" x2="640.0" y2="285.0" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="2,2"/>
<rect x="580.0" y="217.0" width="120.0" height="68.0" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="640.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Line Stretch</text>
<rect x="585.0" y="239.0" width="110.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#eaf0fd" stroke-width="1.5"/><text x="640.0" y="257.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Повний вихід строп</tspan><tspan x="640.0" dy="11.7">Початок наповнення</tspan></text>
<circle cx="820.0" cy="310.0" r="5.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="820.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">+650 мс</text>
<line x1="820.0" y1="310.0" x2="820.0" y2="285.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="2,2"/>
<rect x="760.0" y="217.0" width="120.0" height="68.0" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="820.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Full Inflation</text>
<rect x="765.0" y="239.0" width="110.0" height="42.0" rx="6" fill="#e9f7ef" stroke="#e9f7ef" stroke-width="1.5"/><text x="820.0" y="257.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Купол розкрито!</tspan><tspan x="820.0" dy="11.7">Усталений спуск V_term</tspan></text>
<rect x="50.0" y="375.0" width="860.0" height="125.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="70.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Критичне правило безпеки: FTS (Motor Cutoff) ЗАВЖДИ передує викиду купола</text>
<rect x="70.0" y="412.0" width="820.0" height="75.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="480.0" y="439.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Якщо викинути парашут до повної зупинки моторів, стропи намотуються на пропелери за 5–15 мс.</tspan><tspan x="480.0" dy="13.7">Це призводить до перерізання строп карбоновими лопатями, блокування розкриття купола та пожежі моторів.</tspan><tspan x="480.0" dy="13.7">Затримка між FTS та підпалом (50 мс) з активним DShot-гальмуванням гарантує чистий вихід купола вбік або вгору.</tspan></text>
</svg>