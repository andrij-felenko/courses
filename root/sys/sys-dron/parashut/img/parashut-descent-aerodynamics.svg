<line x1="560.0" y1="286.0" x2="880.0" y2="286.0" stroke="#e5e7eb" stroke-width="1.0"/>
<rect x="560.0" y="296.0" width="320.0" height="178.0" rx="6" fill="#fdf2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="720.0" y="334.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Кінетична енергія удару:</tspan><tspan x="720.0" dy="13.7">E_k = 0.5 · m · V_term²</tspan><tspan x="720.0" dy="13.7"></tspan><tspan x="720.0" dy="13.7">• Безпечна швидкість: V_term ≤ 3.0–4.5 м/с</tspan><tspan x="720.0" dy="13.7">• Ліміт енергії для людей: E_k &lt; 80 Дж</tspan><tspan x="720.0" dy="13.7">  (критичний поріг важких травм голови)</tspan><tspan x="720.0" dy="13.7">• Жорсткий поріг (OOP Cat 2): E_k &lt; 34 Дж</tspan><tspan x="720.0" dy="13.7">• Приклад (дрон 4.0 кг при V = 3.5 м/с):</tspan><tspan x="720.0" dy="13.7">  E_k = 0.5 · 4.0 · 3.5² = 24.5 Дж  (безпечно)</tspan></text>
