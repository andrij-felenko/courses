<rect x="560.0" y="106.0" width="320.0" height="115.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="720.0" y="138.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">F_d = F_g  ⇒  прискорення a = 0</tspan><tspan x="720.0" dy="14.3">0.5 · ρ · V_term² · S_p · C_d = m · g</tspan><tspan x="720.0" dy="14.3">V_term = √( (2 · m · g) / (ρ · S_p · C_d) )</tspan><tspan x="720.0" dy="14.3">ρ ≈ 1.225 кг/м³ (густина повітря на рівні моря)</tspan><tspan x="720.0" dy="14.3">C_d ≈ 1.5–1.75 (хрестоподібний купол)</tspan></text>
