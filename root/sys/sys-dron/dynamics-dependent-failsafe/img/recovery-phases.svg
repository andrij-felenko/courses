<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири фази динамічного відновлення керованості апарата</text>
<rect x="32.5" y="75.0" width="205.0" height="320.0" rx="8" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.8"/>
<text x="135.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Фаза 1</text>
<text x="135.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">Гасіння кутових</tspan><tspan x="135.0" dy="15.6">швидкостей та крену</tspan></text>
<line x1="44.5" y1="163.0" x2="225.5" y2="163.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="135.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Пріоритет: крен і обертання</text>
<text x="46.5" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Демпфування p, q, r</text>
<text x="46.5" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Виведення крену |φ| &lt; 15°</text>
<text x="46.5" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Зняття авторотації</text>
<text x="46.5" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Запобігання затягуванню</text>
<text x="46.5" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">  у спіральне пікірування</text>
<rect x="47.5" y="357.5" width="175.0" height="23.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="135.0" y="372.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">Крен нейтралізовано</tspan></text>
<line x1="240.5" y1="235.0" x2="259.5" y2="235.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="262.5" y="75.0" width="205.0" height="320.0" rx="8" fill="#fdeede" stroke="#c0560b" stroke-width="1.8"/>
<text x="365.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0560b" text-anchor="middle" font-weight="700">Фаза 2</text>
<text x="365.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">Вивід з пікірування</tspan><tspan x="365.0" dy="15.6">з обмеженням G</tspan></text>
<line x1="274.5" y1="163.0" x2="455.5" y2="163.0" stroke="#c0560b" stroke-width="1.0"/>
<text x="365.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0560b" text-anchor="middle" font-weight="700">Пріоритет: вектор підйому</text>
<text x="276.5" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Вибірка тангажу θ ↑</text>
<text x="276.5" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Лімітер nz ≤ nz_max (2.5g)</text>
<text x="276.5" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Дросель у нуль при V &gt; Vmax</text>
<text x="276.5" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Контроль втрати висоти</text>
<text x="276.5" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Захист від руйнування крила</text>
<rect x="277.5" y="357.5" width="175.0" height="23.0" rx="6" fill="#ffffff" stroke="#c0560b" stroke-width="1.5"/><text x="365.0" y="372.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0560b" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">Пікірування подолано</tspan></text>
<line x1="470.5" y1="235.0" x2="489.5" y2="235.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="492.5" y="75.0" width="205.0" height="320.0" rx="8" fill="#fdf8ea" stroke="#b08900" stroke-width="1.8"/>
<text x="595.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b08900" text-anchor="middle" font-weight="700">Фаза 3</text>
<text x="595.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">Стабілізація швидкості</tspan><tspan x="595.0" dy="15.6">й набір висоти</tspan></text>
<line x1="504.5" y1="163.0" x2="685.5" y2="163.0" stroke="#b08900" stroke-width="1.0"/>
<text x="595.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="700">Пріоритет: запас енергії</text>
<text x="506.5" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Відновлення тяги двигуна</text>
<text x="506.5" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Захист від звалювання</text>
<text x="506.5" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Контроль Vias &gt; 1.3 Vstall</text>
<text x="506.5" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Пологий набір (γ = 5°..10°)</text>
<text x="506.5" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Вихід на безпечний ешелон</text>
<rect x="507.5" y="357.5" width="175.0" height="23.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.5"/><text x="595.0" y="372.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">Енергію відновлено</tspan></text>
<line x1="700.5" y1="235.0" x2="719.5" y2="235.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="722.5" y="75.0" width="205.0" height="320.0" rx="8" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="825.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Фаза 4</text>
<text x="825.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="825.0" dy="0.0">Передача керування</tspan><tspan x="825.0" dy="15.6">в навігацію (RTL)</tspan></text>
<line x1="734.5" y1="163.0" x2="915.5" y2="163.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="825.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Пріоритет: маршрут повернення</text>
<text x="736.5" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Горизонтальний політ</text>
<text x="736.5" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Похибки |Δφ|, |Δθ| &lt; 3°</text>
<text x="736.5" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Висота H ≥ Hsafe</text>
<text x="736.5" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Вмикання автопілота</text>
<text x="736.5" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Повернення на точку старту</text>
<rect x="737.5" y="357.5" width="175.0" height="23.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="825.0" y="372.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="825.0" dy="0.0">Автономна місія</tspan></text>
<rect x="50.0" y="420.0" width="860.0" height="42.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="480.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключовий принцип: спочатку вирівнювання крил (крен), потім вивід з пікірування (перевантаження), і лише наприкінці — навігація</text>
</svg>