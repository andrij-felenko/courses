<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="870.0" height="450.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="450.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Трирівневе просторове зонування безпілотного апарата</text>
<rect x="35.0" y="60.0" width="830.0" height="110.0" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="155.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="700">РАДІОЧАСТОТНА ЗОНА (RF Zone)</text>
<text x="155.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle">Винос на щогли та законцівки</text>
<rect x="290.0" y="72.0" width="160.0" height="85.0" rx="4" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
<text x="370.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700">Модуль GNSS + Компас</text>
<text x="370.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Піднятий на щоглі 12–20 см</text>
<text x="370.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Екран Ground Plane 50 мм</text>
<text x="370.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">Вихідний потік: CAN / UART</text>
<rect x="470.0" y="72.0" width="175.0" height="85.0" rx="4" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
<text x="557.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700">Приймач RC (868 / 2400 МГц)</text>
<text x="557.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Т-антена на передньому промені</text>
<text x="557.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Вертикальна поляризація</text>
<text x="557.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle">Чутливість: −120 dBm</text>
<rect x="665.0" y="72.0" width="185.0" height="85.0" rx="4" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
<text x="757.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700">Відеопередавач VTX (5.8 ГГц)</text>
<text x="757.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Антена винесена назад / вниз</text>
<text x="757.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">Випромінювання: +30 dBm (1 Вт)</text>
<text x="757.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">RHCP кругова поляризація</text>
<rect x="35.0" y="185.0" width="830.0" height="130.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="155.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">СЕНСОРНА ЗОНА (Sensor Zone)</text>
<text x="155.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#22c55e" text-anchor="middle">Центр мас та вібророзв'язка</text>
<rect x="290.0" y="198.0" width="260.0" height="105.0" rx="4" fill="#ffffff" stroke="#4ade80" stroke-width="1.2"/>
<text x="420.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#14532d" text-anchor="middle" font-weight="700">Політний контролер (FC / IMU)</text>
<text x="420.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Силіконові демпфери (M3 ізолятори)</text>
<text x="420.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• IMU точно в центрі жорсткості рами</text>
<text x="420.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Барометр під світлозахисним поролоном</text>
<text x="420.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle">• Окреме стабілізоване живлення BEC 5V</text>
<rect x="570.0" y="198.0" width="280.0" height="105.0" rx="4" fill="#ffffff" stroke="#4ade80" stroke-width="1.2"/>
<text x="710.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#14532d" text-anchor="middle" font-weight="700">Бортовий комп'ютер (Companion SBC)</text>
<text x="710.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Екранований металевий кожух (EMI Shield)</text>
<text x="710.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Зв'язок з FC через ізольований UART/CAN</text>
<text x="710.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">• Віддалений від антени GNSS на ≥ 15 см</text>
<text x="710.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle">• Живлення від окремого DC-DC з фільтром</text>
<rect x="35.0" y="330.0" width="830.0" height="120.0" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="155.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">СИЛОВА ЗОНА (Power Zone)</text>
<text x="155.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ef4444" text-anchor="middle">Струми 50–200 А, комутація</text>
<rect x="290.0" y="342.0" width="160.0" height="95.0" rx="4" fill="#ffffff" stroke="#f87171" stroke-width="1.2"/>
<text x="370.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7f1d1d" text-anchor="middle" font-weight="700">Акумулятор (LiPo 6S/12S)</text>
<text x="370.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Головний масовий центр</text>
<text x="370.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">Короткі силові дроти AWG 10</text>
<text x="370.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Конектор XT90-S (Anti-Spark)</text>
<text x="370.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">Струми віддачі до 150–200 А</text>
<rect x="470.0" y="342.0" width="175.0" height="95.0" rx="4" fill="#ffffff" stroke="#f87171" stroke-width="1.2"/>
<text x="557.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7f1d1d" text-anchor="middle" font-weight="700">Плата PDB / 4-in-1 ESC</text>
<text x="557.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">ШІМ-комутація 24–48 кГц</text>
<text x="557.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle">Low-ESR конденсатори 1000 мкФ</text>
<text x="557.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Товсті мідні полігони 3–4 oz</text>
<text x="557.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">Інтенсивне поле dI/dt</text>
<rect x="665.0" y="342.0" width="185.0" height="95.0" rx="4" fill="#ffffff" stroke="#f87171" stroke-width="1.2"/>
<text x="757.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7f1d1d" text-anchor="middle" font-weight="700">Двигуни BLDC на променях</text>
<text x="757.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Трифазні кабелі сплетені в джгут</text>
<text x="757.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle">Мінімізація площі магнітної петлі</text>
<text x="757.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">Захист від кромки карбону</text>
<text x="757.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Вібраційне джерело 100–500 Гц</text>
