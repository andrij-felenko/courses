<text x="667.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">• Момент інерції I_pitch / I_roll в рази більший</text>
<text x="667.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Фазове запізнення в контурі керування PID</text>
<text x="667.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Насичення моторів при спробі швидкого гальмування</text>
