<text x="232.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle" font-weight="700">ДИНАМІЧНІ ХАРАКТЕРИСТИКИ:</text>
<text x="232.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700">• Тензор інерції I = ∑ m_i·r_i² — МІНІМАЛЬНИЙ</text>
<text x="232.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Кутове прискорення α = τ / I — максимальне</text>
<text x="232.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Смуга пропускання PID контуру: 35–50 рад/с</text>
<text x="232.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">• Мотори не перегріваються при маневрах</text>
<text x="232.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#059669" text-anchor="middle">• Миттєвий відгук на збурення вітру</text>
