<text x="207.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Площа контакту збільшується у 2.5–3 рази → ризик повзучості усунуто</text>
<text x="207.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Обов'язкові шайби з фаскою або гвинти ISO 7380-2 з фланцем</text>
