<text x="700.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle" font-weight="700">Нерж. вставка</text>
<text x="700.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Діаметр зрізу більший на 30%</text>
<text x="700.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Повний натяг болта класу 8.8/10.9</text>
<text x="700.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Багаторазове загвинчування</text>
<text x="607.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило для м'яких сплавів (6061/6082):</text>
<text x="607.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Мінімальна довжина прямої різьби: L_eff ≥ 1.8...2.2 · d (для M3 ≥ 6 мм)</text>
<text x="607.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Для високонавантажених точок (мотори, стійки) — різьбові гільзи Helicoil</text>
<text x="607.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Зниження моменту затягування на 30–40% при прямій різьбі в 6061</text>
