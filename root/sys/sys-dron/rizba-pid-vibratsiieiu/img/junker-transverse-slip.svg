<text x="207.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">F_friction &gt; F_unwind (tg ρ' &gt; tg β)</text>
<text x="207.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Сила тертя надійно блокує відкручування</text>
