<text x="612.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Результат: лавиноподібна втрата натягу (Preload Loss)</text>
