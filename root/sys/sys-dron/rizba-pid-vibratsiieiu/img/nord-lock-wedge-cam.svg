<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 840 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="840" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="820.0" height="320.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="20.0" y="20.0" width="420.0" height="275.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="230.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Клиновий ефект Nord-Lock: кут α &gt; кут β</text>
<rect x="60.0" y="75.0" width="340.0" height="30.0" rx="2" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/>
<text x="230.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Головка болта (радіальні насічки зчіплюються з шайбою)</text>
<polygon points="60,110 400,110 400,140 315,155 230,140 145,155 60,140" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="230.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="700">Верхня шайба: клинові скоси під кутом α</text>
<polygon points="60,158 145,173 230,158 315,173 400,158 400,188 60,188" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.8"/>
<text x="230.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="700">Нижня шайба: клинові скоси під кутом α</text>
<rect x="60.0" y="193.0" width="340.0" height="30.0" rx="2" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/>
<text x="230.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Скріплювана деталь (насічки врізаються в метал)</text>
<line x1="100.0" y1="150.0" x2="70.0" y2="150.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="105.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Спроба відкручування</text>
<line x1="230.0" y1="145.0" x2="230.0" y2="115.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="230.0" y1="168.0" x2="230.0" y2="198.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="230.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Осьове видовження болта: ΔL_cam = r · tg α · Δθ</text>
<text x="230.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Підйом різьби: ΔL_thread = r · tg β · Δθ</text>
<text x="230.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Оскільки α &gt; β, натяг F_p зростає — обертання стопориться!</text>
<rect x="460.0" y="20.0" width="340.0" height="275.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="630.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому клиновий замок непереможний</text>
<rect x="475.0" y="70.0" width="310.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="90.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">1. Зовнішні радіальні насічки:</tspan><tspan x="630.0" dy="11.7">Твердість шайби (HRC 46–48) вища за болт.</tspan><tspan x="630.0" dy="11.7">Насічки чіпляються за метал — ковзання лише по клинах.</tspan></text>
<rect x="475.0" y="138.0" width="310.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle"><tspan x="630.0" dy="0.0">2. Кутова умова блокування:</tspan><tspan x="630.0" dy="13.0">Кут клина α = 13°...15°</tspan><tspan x="630.0" dy="13.0">Кут підйому різьби β = 2.5°...3.5°</tspan><tspan x="630.0" dy="13.0">Співвідношення: tg(α) &gt; tg(β) у 4–5 разів!</tspan></text>
<rect x="475.0" y="206.0" width="310.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="227.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="630.0" dy="0.0">3. Динамічний відгук на вібрацію:</tspan><tspan x="630.0" dy="13.0">Будь-який імпульс на відкручування миттєво</tspan><tspan x="630.0" dy="13.0">піднімає силу затягування (клиновий бар'єр).</tspan><tspan x="630.0" dy="13.0">Розбирання можливе лише гайковим ключем.</tspan></text>
</svg>