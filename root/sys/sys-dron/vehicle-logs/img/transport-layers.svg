<rect x="210.0" y="92.0" width="1000.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="710.0" y="126.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">LOG_REQUEST_LIST / LOG_ENTRY / LOG_REQUEST_DATA / LOG_DATA</tspan><tspan x="710.0" dy="18.2">щоб прибрати текстову консоль APM2: 90 Б у порції, номери записів</tspan></text>
