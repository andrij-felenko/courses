<text x="640.0" y="526.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">жоден шар не прибрано — станція мусить уміти всі три, бо прошивки в полі оновлять не всі</text>
