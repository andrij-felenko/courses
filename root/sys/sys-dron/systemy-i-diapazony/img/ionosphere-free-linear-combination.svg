<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="910.0" height="350.0" rx="8" fill="#fcfdfe" stroke="#333333" stroke-width="1.2"/>
<text x="470.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пряме виключення іоносферної дисперсії комбінацією L1 + L5</text>
<rect x="30.0" y="65.0" width="410.0" height="280.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.0"/>
<text x="235.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дисперсія радіохвиль в іонізованій плазмі</text>
<rect x="45.0" y="110.0" width="380.0" height="55.0" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
<text x="235.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">Іоносфера: вільні електрони (TEC = ∫ N_e ds)</text>
<text x="235.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">Групова затримка коду: I_iono = +40.3 · TEC / f²</text>
<rect x="45.0" y="180.0" width="180.0" height="75.0" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
<text x="135.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">Сигнал L1 (1575.42 МГц)</text>
<text x="135.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Затримка: I₁ = K / f₁²</text>
<text x="135.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Наприклад: +10.0 метрів</text>
<rect x="245.0" y="180.0" width="180.0" height="75.0" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
<text x="335.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Сигнал L5 (1176.45 МГц)</text>
<text x="335.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Затримка: I₅ = K / f₅²</text>
<text x="335.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="700">I₅ = I₁ · (f₁/f₅)² = +17.93 м</text>
<text x="235.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Нижча частота f5 відчуває значно сильнішу затримку плазми.</text>
<text x="235.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">Різниця псевдодальностей (ρ5 − ρ1) прямо вимірює TEC!</text>
<text x="235.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle">Не потрібні неточні табличні моделі (Klobuchar / NeQuick).</text>
<rect x="460.0" y="65.0" width="450.0" height="280.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="685.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Безрозмірна лінійна комбінація (Ionosphere-Free, IF)</text>
<rect x="475.0" y="110.0" width="420.0" height="75.0" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="685.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Рівняння комбінації псевдодальностей ρ_IF:</text>
<text x="685.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ρ_IF = (f₁² · ρ₁ − f₅² · ρ₅) / (f₁² − f₅²)</text>
<text x="685.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700">= 2.261 · ρ₁ − 1.261 · ρ₅</text>
<rect x="475.0" y="195.0" width="420.0" height="135.0" rx="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
<text x="485.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Підставляємо ρ₁ = r + c·δt + I₁  та  ρ₅ = r + c·δt + I₁·(f₁²/f₅²):</text>
<text x="485.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">ρ_IF = 2.261·(r + c·δt + I₁) − 1.261·(r + c·δt + 1.7934·I₁)</text>
<text x="485.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">= (2.261 − 1.261)·(r + c·δt) + (2.261·I₁ − 2.261·I₁)</text>
<text x="485.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="start" font-weight="700">= r + c·δt + 0 · I_iono   [Іоносферну похибку скорочено на 100%!]</text>
<text x="485.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Плата за комбінацію: зростання некорельованого шуму в √(α²+β²) ≈ 2.59 раза.</text>
</svg>