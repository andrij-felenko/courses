<rect x="35.0" y="335.0" width="380.0" height="90.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="225.0" y="365.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Фатальна помилка наївного алгоритму:</tspan><tspan x="225.0" dy="11.7">1. Планування від точки t_now ігнорує зсув за час рахунку t_plan.</tspan><tspan x="225.0" dy="11.7">2. Спроба рушити з v=0 дає стрибок прискорення Δa та зрив кутів.</tspan><tspan x="225.0" dy="11.7">3. Склеювання вимагає старту з S(t_now + t_plan) по старій траєкторії.</tspan></text>
