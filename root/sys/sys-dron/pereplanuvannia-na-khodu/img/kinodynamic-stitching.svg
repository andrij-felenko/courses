<text x="760.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">C²: плавна тяга</text>
<rect x="490.0" y="335.0" width="350.0" height="90.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="665.0" y="365.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Кінодинамічна сумісність (Kinodynamic Feasibility):</tspan><tspan x="665.0" dy="11.7">• C⁰: позиція не має просторових телепортацій.</tspan><tspan x="665.0" dy="11.7">• C¹: швидкість збігається за напрямком і величиною.</tspan><tspan x="665.0" dy="11.7">• C²: вектор прискорення неперервний (немає миттєвих змін кута крену/тангажу й тяги моторів).</tspan></text>
</svg>