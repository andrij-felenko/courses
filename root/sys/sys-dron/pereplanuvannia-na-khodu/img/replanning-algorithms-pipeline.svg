<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 895 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="895" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="168.1" y="11.5" width="543.9" height="33.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="32.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Архітектура трирівневого динамічного перепланування на борту БПЛА</tspan></text>
<rect x="25.0" y="65.0" width="190.0" height="320.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="35.0" y="75.0" width="170.0" height="32.0" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.0"/>
<text x="120.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Сенсорика та карта</text>
<rect x="35.0" y="120.0" width="170.0" height="245.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="120.0" y="187.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Джерела даних:</tspan><tspan x="120.0" dy="11.7">• Стереокамера / Лідар</tspan><tspan x="120.0" dy="11.7">• IMU + Одометрія (VIO/GNSS)</tspan><tspan x="120.0" dy="11.7"></tspan><tspan x="120.0" dy="11.7">Локальна карта:</tspan><tspan x="120.0" dy="11.7">• Voxel Grid (OctoMap)</tspan><tspan x="120.0" dy="11.7">• Dynamic ESDF (3D поле знакових відстаней)</tspan><tspan x="120.0" dy="11.7">• Ring-Buffer оновлення</tspan><tspan x="120.0" dy="11.7"></tspan><tspan x="120.0" dy="11.7">Частота: 20–50 Гц</tspan><tspan x="120.0" dy="11.7">Затримка: &lt; 15 мс</tspan></text>
<line x1="215.0" y1="225.0" x2="243.0" y2="225.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="245.0" y="65.0" width="190.0" height="320.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="255.0" y="75.0" width="170.0" height="32.0" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.0"/>
<text x="340.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle" font-weight="700">2. Дискретний пошук</text>
<rect x="255.0" y="120.0" width="170.0" height="245.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="340.0" y="187.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Алгоритми пошуку:</tspan><tspan x="340.0" dy="11.7">• D* Lite (інкрементний граф)</tspan><tspan x="340.0" dy="11.7">• Kinodynamic A*</tspan><tspan x="340.0" dy="11.7">• Jump Point Search (JPS)</tspan><tspan x="340.0" dy="11.7"></tspan><tspan x="340.0" dy="11.7">Результат:</tspan><tspan x="340.0" dy="11.7">• Безпечний коридор (SFC)</tspan><tspan x="340.0" dy="11.7">• Опорні шляхові точки</tspan><tspan x="340.0" dy="11.7">• Ініціалізація для бекенду</tspan><tspan x="340.0" dy="11.7"></tspan><tspan x="340.0" dy="11.7">Час пошуку: 1–5 мс</tspan></text>
<line x1="435.0" y1="225.0" x2="463.0" y2="225.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="465.0" y="65.0" width="190.0" height="320.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="475.0" y="75.0" width="170.0" height="32.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.0"/>
<text x="560.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">3. Оптимізація траєкторії</text>
<rect x="475.0" y="120.0" width="170.0" height="245.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="560.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Математичний апарат:</tspan><tspan x="560.0" dy="11.7">• Градієнтна деформація B-сплайнів у полі ESDF</tspan><tspan x="560.0" dy="11.7">• Minimum Snap / Jerk QP</tspan><tspan x="560.0" dy="11.7">• Часова репараметризація</tspan><tspan x="560.0" dy="11.7"></tspan><tspan x="560.0" dy="11.7">Обмеження:</tspan><tspan x="560.0" dy="11.7">• v_max, a_max, j_max</tspan><tspan x="560.0" dy="11.7">• C²-склеювання в t_stitch</tspan><tspan x="560.0" dy="11.7"></tspan><tspan x="560.0" dy="11.7">Час розрахунку: 2–8 мс</tspan></text>
<line x1="655.0" y1="225.0" x2="683.0" y2="225.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="685.0" y="65.0" width="190.0" height="320.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="695.0" y="75.0" width="170.0" height="32.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.0"/>
<text x="780.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">4. Трекінг та уставки</text>
<rect x="695.0" y="120.0" width="170.0" height="245.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="780.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Вихідний потік:</tspan><tspan x="780.0" dy="11.7">• Уставки p_ref, v_ref, a_ref</tspan><tspan x="780.0" dy="11.7">• Курс yaw, yaw_rate</tspan><tspan x="780.0" dy="11.7"></tspan><tspan x="780.0" dy="11.7">Виконавчий контур:</tspan><tspan x="780.0" dy="11.7">• Geometric Attitude Tracking (SO3)</tspan><tspan x="780.0" dy="11.7">• Motor Mixer / Allocation</tspan><tspan x="780.0" dy="11.7"></tspan><tspan x="780.0" dy="11.7">Частота: 250–500 Гц</tspan><tspan x="780.0" dy="11.7">Прямий зв'язок (Feedforward)</tspan></text>
<line x1="780.0" y1="395.0" x2="120.0" y2="395.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="120.0" y1="395.0" x2="120.0" y2="387.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="450.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Замкнений контур: реальний стан БПЛА постійно передається у генератор уставок та планувальник</text>
</svg>