<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Диференціальна кінематика: відображення швидкостей через матрицю Якобі J(q)</text>
<text x="480.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">перетворення одиничної сфери швидкостей суглобів у декартів еліпсоїд швидкостей</text>
<text x="200.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Простір зчленувань (Joint Space)</text>
<text x="200.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">вектор кутових швидкостей q̇ = [q̇_1, q̇_2, ..., q̇_n]ᵀ</text>
<line x1="110.0" y1="240.0" x2="290.0" y2="240.0" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="200.0" y1="150.0" x2="200.0" y2="330.0" stroke="#cbd5e1" stroke-width="1.5"/>
<circle cx="200.0" cy="240.0" r="65.0" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<circle cx="200.0" cy="240.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="200.0" y1="240.0" x2="245.0" y2="195.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="255.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">q̇</text>
<text x="200.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">‖q̇‖ ≤ 1 (одинична сфера)</text>
<line x1="410.0" y1="240.0" x2="480.0" y2="240.0" stroke="#333333" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="340.3" y="172.1" width="209.4" height="45.9" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="445.0" y="191.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">Пряма: v_ee = J(q) · q̇</tspan><tspan x="445.0" dy="16.9">Обернена: q̇ = J⁺ · v_ee</tspan></text>
<text x="740.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Декартів простір: Регулярна поза (Regular)</text>
<ellipse cx="740" cy="170" rx="90" ry="45" fill="#f0f9ff" stroke="#2457d6" stroke-width="2" transform="rotate(-20 740 170)"/>
<circle cx="740.0" cy="170.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="740.0" y1="170.0" x2="815.0" y2="145.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="825.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">σ_1 · u_1</text>
<line x1="740.0" y1="170.0" x2="725.0" y2="130.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="715.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">σ_2 · u_2</text>
<text x="740.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Рух вільний у всіх напрямках (det(J) ≠ 0)</text>
<text x="740.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Сингулярна поза (Singularity): втрата DOF</text>
<ellipse cx="740" cy="360" rx="95" ry="4" fill="#fef2f2" stroke="#c0392b" stroke-width="2.5" transform="rotate(-20 740 360)"/>
<circle cx="740.0" cy="360.0" r="3.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="740.0" y1="360.0" x2="820.0" y2="333.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="835.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">σ_1</text>
<line x1="720.0" y1="325.0" x2="760.0" y2="395.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="700.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">σ_min = 0</text>
<text x="740.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Рух поперек сплющення НЕМОЖЛИВИЙ (q̇ → ∞)</text>
<rect x="107.1" y="432.8" width="745.9" height="24.5" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="449.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Маніпулятивність Йошикави: w(q) = √(det(J · Jᵀ)) = σ_1 · σ_2 · ... · σ_m  (w = 0 у точці сингулярності)</tspan></text>
</svg>