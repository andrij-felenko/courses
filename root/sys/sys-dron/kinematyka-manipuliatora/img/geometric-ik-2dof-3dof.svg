<line x1="295.0" y1="185.0" x2="295.0" y2="260.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="295.0" y1="185.0" x2="200.0" y2="185.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
