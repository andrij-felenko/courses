<rect x="123.5" y="397.1" width="153.0" height="45.9" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="416.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">θ_1 = atan2(y, x)</tspan><tspan x="200.0" dy="16.9">r = √(x² + y²)</tspan></text>
<text x="680.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Плоска рука в осях r–Z (дві конфігурації)</text>
