<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрична обернена кінематика: розв'язки ліктем угору та ліктем униз</text>
<text x="480.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">розщеплення просторової задачі 3-DOF на азимут основи та плоску руку 2-DOF</text>
<text x="200.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Азимут основи (вид зверху X-Y)</text>
<line x1="80.0" y1="260.0" x2="340.0" y2="260.0" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="200.0" y1="380.0" x2="200.0" y2="120.0" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="200.0" y1="260.0" x2="330.0" y2="260.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="345.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">X_0</text>
