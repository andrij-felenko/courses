<rect x="489.9" y="412.6" width="380.2" height="44.8" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="431.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">cos(θ_3) = (s² − L_1² − L_2²) / (2 · L_1 · L_2)</tspan><tspan x="680.0" dy="16.2">θ_3 = ± atan2(√(1 − cos²θ_3), cos θ_3)</tspan></text>
