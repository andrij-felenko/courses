<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="210.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Супутник (атомний годинник)</text>
<text x="650.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приймач дрона (кварцовий генератор)</text>
<rect x="60.0" y="55.0" width="300.0" height="110.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="210.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Випромінювання PRN-коду</text>
<text x="210.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Мітка часу передачі: t_tx (GPS-час)</text>
<text x="210.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">Похибка атомного годинника: δt_sat ≈ 0</text>
<text x="210.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(коригується ефемеридами до наносекунд)</text>
<rect x="500.0" y="55.0" width="300.0" height="110.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="650.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зсув кодової репліки корелятором</text>
<text x="650.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">Мітка часу прийому: t_rx = t_true + δt_rcv</text>
<text x="650.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Зсув кварцового годинника: δt_rcv</text>
<text x="650.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">Навіть 1 мкс зсуву дає помилку c·δt = 299.79 м!</text>
<line x1="360.0" y1="110.0" x2="500.0" y2="110.0" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="430.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">Радіохвиля (c)</text>
<text x="430.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Час польоту τ</text>
<rect x="60.0" y="195.0" width="740.0" height="65.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="80.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="start" font-weight="700">Справжня геометрична дальність r:</text>
<text x="80.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">r = c · (t_rx_true − t_tx) = √[(X_sat − X)² + (Y_sat − Y)² + (Z_sat − Z)²]</text>
<rect x="60.0" y="275.0" width="740.0" height="70.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="80.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="start" font-weight="700">Виміряна псевдодальність ρ (Pseudorange):</text>
<text x="80.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">ρ = c · (t_rx − t_tx) = r + c · δt_rcv − c · δt_sat + I_iono + T_trop + ε</text>
</svg>