<circle cx="130.0" cy="190.0" r="8.0" fill="#cbd5e1" stroke="#333333" stroke-width="1.5"/>
<circle cx="230.0" cy="130.0" r="8.0" fill="#cbd5e1" stroke="#333333" stroke-width="1.5"/>
<line x1="360.0" y1="140.0" x2="260.0" y2="140.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="310.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Зустрічний вітер V_wind</text>
<line x1="180.0" y1="160.0" x2="220.0" y2="80.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="240.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Повна тяга T_max</text>
<line x1="180.0" y1="160.0" x2="180.0" y2="80.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="125.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">T_z = T · cos θ</text>
<line x1="180.0" y1="160.0" x2="240.0" y2="160.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="260.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">T_xy = T · sin θ</text>
<line x1="180.0" y1="160.0" x2="180.0" y2="250.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="202.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вага m · g</text>
<rect x="420.0" y="15.0" width="385.0" height="290.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="612.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Захист від втрати висоти (Climb Priority)</text>
<rect x="452.0" y="73.5" width="320.0" height="23.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="612.0" y="88.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="612.0" dy="0.0">Оцінка вертикальної швидкості: V_z &lt; V_z_min?</tspan></text>
<line x1="612.0" y1="108.0" x2="612.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="452.0" y="141.3" width="320.0" height="37.3" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="612.0" y="156.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="612.0" dy="0.0">Насичення газу (Throttle Saturation &gt; 95%)</tspan><tspan x="612.0" dy="14.3">Двигуни не можуть утримати висоту!</tspan></text>
<line x1="612.0" y1="192.0" x2="612.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="442.0" y="224.2" width="340.0" height="51.6" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="612.0" y="239.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="612.0" dy="0.0">Автоматичне обмеження кута крену/тангажу:</tspan><tspan x="612.0" dy="14.3">θ_max = arccos(m·g / T_avail) -&gt; Зменшення V_xy</tspan><tspan x="612.0" dy="14.3">Пріоритет: збереження висоти ціною швидкості</tspan></text>
</svg>