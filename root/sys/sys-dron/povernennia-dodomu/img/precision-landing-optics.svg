<text x="670.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">1. Детекція кутів мітки у кадрі</tspan><tspan x="670.0" dy="14.0">2. PnP-розв'язок: [X, Y, Z, Yaw]rel</tspan><tspan x="670.0" dy="14.0">3. Фільтр Калмана: компенсація шуму</tspan><tspan x="670.0" dy="14.0">4. Корекція швидкості: V_xy = K_p · ΔP</tspan><tspan x="670.0" dy="14.0">5. Зниження лише при |ΔP| &lt; R_safe</tspan></text>
