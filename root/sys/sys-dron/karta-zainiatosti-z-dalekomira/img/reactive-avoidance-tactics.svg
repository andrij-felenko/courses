<rect x="617.0" y="220.0" width="241.0" height="185.0" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/><text x="737.5" y="268.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="737.5" dy="0.0">Критерій спрацювання:</tspan><tspan x="737.5" dy="11.7">• Горизонтальний об'їзд заблокований</tspan><tspan x="737.5" dy="11.7">• Висота перешкоди &lt; допустимої стелі</tspan><tspan x="737.5" dy="11.7">• Вільний простір над об'єктом за 3D-сіткою</tspan><tspan x="737.5" dy="11.7"></tspan><tspan x="737.5" dy="11.7">Дія регулятора:</tspan><tspan x="737.5" dy="11.7">• Уставка вертикальної швидкості v_z &gt; 0</tspan><tspan x="737.5" dy="11.7">• Формування кліренсу h_obs + h_margin</tspan><tspan x="737.5" dy="11.7">• Переліт та повернення на робочий ешелон</tspan></text>
