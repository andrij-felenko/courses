<rect x="37.0" y="220.0" width="241.0" height="185.0" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text x="157.5" y="274.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="157.5" dy="0.0">Критерій спрацювання:</tspan><tspan x="157.5" dy="11.7">• Немає вільного коридору для маневру</tspan><tspan x="157.5" dy="11.7">• d &lt; v² / (2 · a_max) + v · t_react + d_safe</tspan><tspan x="157.5" dy="11.7"></tspan><tspan x="157.5" dy="11.7">Дія регулятора:</tspan><tspan x="157.5" dy="11.7">• Миттєве скидання уставки швидкості до 0</tspan><tspan x="157.5" dy="11.7">• Перехід у режим Loiter / Position Hold</tspan><tspan x="157.5" dy="11.7">• Утримання координат проти зносу вітром</tspan></text>
<rect x="315.0" y="60.0" width="265.0" height="360.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
