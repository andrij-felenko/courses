<rect x="226.4" y="11.5" width="447.2" height="33.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="32.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Три тактичні реакції автопілота на виявлену перешкоду</tspan></text>
