<rect x="327.0" y="220.0" width="241.0" height="185.0" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/><text x="447.5" y="268.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="447.5" dy="0.0">Критерій спрацювання:</tspan><tspan x="447.5" dy="11.7">• Прямий промінь перекрито</tspan><tspan x="447.5" dy="11.7">• Виявлено вільний сектор (долину H_k &lt; τ)</tspan><tspan x="447.5" dy="11.7"></tspan><tspan x="447.5" dy="11.7">Дія регулятора:</tspan><tspan x="447.5" dy="11.7">• Мінімізація функції вартості:</tspan><tspan x="447.5" dy="11.7">  J(θ) = c₁·|θ - θ_target| + c₂·|θ - θ_current|</tspan><tspan x="447.5" dy="11.7">• Плавний поворот вектора швидкості</tspan><tspan x="447.5" dy="11.7">• Збереження крейсерської швидкості</tspan></text>
<rect x="605.0" y="60.0" width="265.0" height="360.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="605.0" y="60.0" width="265.0" height="36.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="737.5" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3. Набір висоти (Climb over)</text>
<rect x="725.0" y="145.0" width="60.0" height="45.0" rx="2" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
