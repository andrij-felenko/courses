<rect x="90.0" y="600.0" width="1060.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="631.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Через 10 с після поломки на екрані 0.8 %, через хвилину — 4.5 %, через п'ять — 16.7 %.</tspan><tspan x="620.0" dy="19.5">Половини справжніх втрат показник досягає рівно тоді, коли поганий відтинок став</tspan><tspan x="620.0" dy="19.5">таким же довгим, як добрий перед ним, — тут через десять хвилин, на позначці 25 %.</tspan></text>
<rect x="90.0" y="706.0" width="1060.0" height="64.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="733.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Крива не залежить від частоти телеметрії: чисельник і знаменник ростуть однаково.</tspan><tspan x="620.0" dy="19.5">Важить лише те, яку частку всього з'єднання канал був поганий.</tspan></text>
