<text x="966.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="966.0" dy="0.0">кадр ще не добудовано</tspan></text>
<rect x="700.0" y="152.0" width="250.0" height="60.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.5"/><text x="825.0" y="187.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="825.0" dy="0.0">1  OK</tspan></text>
<text x="966.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="966.0" dy="0.0">цілий кадр, забирай</tspan></text>
<rect x="700.0" y="228.0" width="250.0" height="60.0" rx="6" fill="#fdf3e7" stroke="#333333" stroke-width="1.5"/><text x="825.0" y="263.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="825.0" dy="0.0">2  BAD_CRC</tspan></text>
<text x="966.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="966.0" dy="0.0">сума не зійшлася або чужий msgid</tspan></text>
<rect x="700.0" y="304.0" width="250.0" height="60.0" rx="6" fill="#fdf3e7" stroke="#333333" stroke-width="1.5"/><text x="825.0" y="339.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="825.0" dy="0.0">3  BAD_SIGNATURE</tspan></text>
<text x="966.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="966.0" dy="0.0">сума ціла, підпис ні</tspan></text>
