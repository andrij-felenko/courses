<rect x="40.0" y="76.0" width="210.0" height="92.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="117.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">черговий байт</tspan><tspan x="145.0" dy="19.5">із порції</tspan></text>
