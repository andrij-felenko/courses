<rect x="66.0" y="476.0" width="518.0" height="66.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.5"/><text x="325.0" y="514.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">віддає вердикт як є: 0, 1, 2, 3</tspan></text>
<rect x="66.0" y="556.0" width="518.0" height="108.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="325.0" y="595.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">усі чотири лічильники можливі,</tspan><tspan x="325.0" dy="19.5">але ресинхронізацію після битого кадру</tspan><tspan x="325.0" dy="19.5">робиш ти сам</tspan></text>
<rect x="650.0" y="424.0" width="570.0" height="258.0" rx="10" fill="#eef2f6" stroke="#c8d2dc" stroke-width="1.2"/>
<text x="935.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">mavlink_parse_char(chan, …)</text>
<rect x="676.0" y="476.0" width="518.0" height="66.0" rx="6" fill="#fdf3e7" stroke="#333333" stroke-width="1.5"/><text x="935.0" y="514.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">2 і 3 перетворює на 0, віддає лише 0 і 1</tspan></text>
<rect x="676.0" y="556.0" width="518.0" height="108.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="935.0" y="595.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">ресинк робить сам — але тільки на 0xFD</tspan><tspan x="935.0" dy="19.5">і не чіпає ні magic, ні прапорця версії;</tspan><tspan x="935.0" dy="19.5">лічильник поганих сум лишиться порожнім</tspan></text>
