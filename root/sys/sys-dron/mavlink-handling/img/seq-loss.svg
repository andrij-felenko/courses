<text x="70.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">номери послідовності одного відправника</text>
<text x="70.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">зелене — прийнято станцією · червоне — не долетіло</text>
<rect x="80.0" y="250.0" width="520.0" height="150.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="311.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">прийнято 254, попередній 251</tspan><tspan x="340.0" dy="18.2">очікуваний = 251 + 1 = 252</tspan><tspan x="340.0" dy="18.2">254 ≥ 252 → втрачено 254 − 252 = 2</tspan></text>
<rect x="640.0" y="250.0" width="520.0" height="150.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="311.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">прийнято 1, попередній 254</tspan><tspan x="900.0" dy="18.2">очікуваний = 254 + 1 = 255</tspan><tspan x="900.0" dy="18.2">1 &lt; 255 → втрачено 1 + 256 − 255 = 2</tspan></text>
<text x="340.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">звичайний розрив</text>
<text x="900.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">розрив через межу байта</text>
<rect x="80.0" y="470.0" width="1080.0" height="96.0" rx="6" fill="#fdf3e7" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="513.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">СЛІПА ПЛЯМА: номер займає один байт, тож лічильник міряє різницю за модулем 256.</tspan><tspan x="620.0" dy="18.2">Рівно 256 загублених кадрів дадуть різницю 0, а 300 загублених виглядатимуть як 44.</tspan></text>
