<rect x="142.2" y="9.0" width="575.5" height="34.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="430.0" y="30.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Конвеєр вибору та ранжування запасних майданчиків (Rally Points)</tspan></text>
<text x="430.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Поетапна фільтрація реєстру, розрахунок витрат та запобігання хибним перемиканням</text>
