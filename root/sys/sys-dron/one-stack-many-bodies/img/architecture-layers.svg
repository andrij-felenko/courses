<rect x="0.0" y="0.0" width="880.0" height="480.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="30.0" y="20.0" width="520.0" height="430.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="290.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">УНІФІКОВАНІ ШАРИ СТЕКА (80% коду, спільні для всіх тіл)</text>
