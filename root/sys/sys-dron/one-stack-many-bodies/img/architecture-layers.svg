<text x="290.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Політ по точках, ведення по лінії шляху, орбіта, обхід перешкод</text>
