<text x="290.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">IMU (акселерометр/гіроскоп), GNSS, магнітометр, барометр, трубка Піто</text>
