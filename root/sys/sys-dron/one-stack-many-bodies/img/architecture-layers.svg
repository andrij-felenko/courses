<text x="290.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Формування віртуального вектора зусиль τ = [F_x, F_y, F_z, M_x, M_y, M_z]ᵀ</text>
