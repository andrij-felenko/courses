<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 840" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="840" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок запуску: кожен крок додає те, на що спирається наступний</text>
<rect x="55.0" y="73.9" width="470.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="96.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">main(): розбір командного рядка,</tspan><tspan x="290.0" dy="16.9">вибір режиму запуску</tspan></text>
<rect x="55.0" y="165.9" width="470.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="188.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">QGCApplication: імена, QSettings,</tspan><tspan x="290.0" dy="16.9">звірка версії налаштувань</tspan></text>
<rect x="55.0" y="257.9" width="470.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="280.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">кореневе вікно QML</tspan><tspan x="290.0" dy="16.9">(створює плагін ядра)</tspan></text>
<rect x="55.0" y="359.0" width="470.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="380.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">звук · FollowMe · позиція · NTRIP</tspan></text>
<rect x="55.0" y="451.0" width="470.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="472.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">LinkManager</tspan></text>
<rect x="55.0" y="543.0" width="470.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="564.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">VideoManager(mainRootWindow)</tspan></text>
<rect x="55.0" y="635.0" width="470.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="656.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">JoystickManager</tspan></text>
<rect x="55.0" y="727.0" width="470.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="748.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">автопідключення каналів</tspan></text>
<line x1="290.0" y1="130.1" x2="290.0" y2="161.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="290.0" y1="222.1" x2="290.0" y2="253.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="290.0" y1="314.1" x2="290.0" y2="355.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="290.0" y1="397.0" x2="290.0" y2="447.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="290.0" y1="489.0" x2="290.0" y2="539.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="290.0" y1="581.0" x2="290.0" y2="631.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="290.0" y1="673.0" x2="290.0" y2="723.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="570.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="570.0" dy="0.0">спільного стану ще немає зовсім</tspan></text>
<text x="570.0" y="183.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="570.0" dy="0.0">з цієї миті будь-хто далі</tspan><tspan x="570.0" dy="16.2">може читати налаштування</tspan></text>
<text x="570.0" y="275.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="570.0" dy="0.0">є поверхня, на якій</tspan><tspan x="570.0" dy="16.2">малюватиме відео</tspan></text>
<text x="570.0" y="367.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="570.0" dy="0.0">служби, яким потрібні лише</tspan><tspan x="570.0" dy="16.2">налаштування, і нічого більше</tspan></text>
<text x="570.0" y="459.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="570.0" dy="0.0">реєстр каналів готовий,</tspan><tspan x="570.0" dy="16.2">але жодного ще не відкрито</tspan></text>
<text x="570.0" y="551.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="570.0" dy="0.0">вимагає вікна — тому</tspan><tspan x="570.0" dy="16.2">стоїть після нього</tspan></text>
<text x="570.0" y="643.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="570.0" dy="0.0">джойстик шукає активний апарат,</tspan><tspan x="570.0" dy="16.2">апаратів поки нема</tspan></text>
<text x="570.0" y="735.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="570.0" dy="0.0">останнім: щойно канал відкрито,</tspan><tspan x="570.0" dy="16.2">у застосунок ринуть байти</tspan></text>
</svg>