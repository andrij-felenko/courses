<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратна архітектура незалежної системи припинення польоту (FTS)</text>
<rect x="40.0" y="55.0" width="270.0" height="445.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="175.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="700">Головний контур (Primary FC)</text>
<line x1="55.0" y1="89.0" x2="295.0" y2="89.0" stroke="#cbd5e1" stroke-width="1.0"/>
<rect x="60.0" y="103.0" width="230.0" height="60.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="175.0" y="129.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Основна батарея (LiPo 6S)</tspan><tspan x="175.0" dy="14.3">та плата PDB / BEC 5V</tspan></text>
<rect x="60.0" y="180.0" width="230.0" height="85.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="175.0" y="205.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Польотний контролер (FC)</tspan><tspan x="175.0" dy="13.7">• Основна RTOS / автопілот</tspan><tspan x="175.0" dy="13.7">• Первинний GNSS + IMU</tspan><tspan x="175.0" dy="13.7">• Телеметрія MAVLink</tspan></text>
<rect x="60.0" y="285.0" width="230.0" height="65.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="175.0" y="314.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">ШІМ / DShot лінії керування</tspan><tspan x="175.0" dy="13.7">(сигнали на регулятори ESC)</tspan></text>
<rect x="60.0" y="370.0" width="230.0" height="80.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="175.0" y="393.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Силова установка</tspan><tspan x="175.0" dy="13.7">• Регулятори швидкості (ESC)</tspan><tspan x="175.0" dy="13.7">• Безколекторні мотори</tspan><tspan x="175.0" dy="13.7">• Тягові пропелери</tspan></text>
<text x="175.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Зона ризику: зависання або PDB-відмова</text>
<rect x="345.0" y="55.0" width="270.0" height="445.0" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="480.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700">Бар'єр ізоляції та переривання</text>
<line x1="360.0" y1="89.0" x2="600.0" y2="89.0" stroke="#fde68a" stroke-width="1.0"/>
<rect x="360.0" y="103.0" width="240.0" height="80.0" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><text x="480.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Оптоізолятори / Швидкісні буфери</tspan><tspan x="480.0" dy="13.0">Повна гальванічна розв'язка сигналів</tspan><tspan x="480.0" dy="13.0">між FC та резервним FTS</tspan><tspan x="480.0" dy="13.0">(пробивна напруга &gt; 2.5 кВ)</tspan></text>
<rect x="360.0" y="203.0" width="240.0" height="88.0" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><text x="480.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Апаратний селектор ШІМ / eFuse</tspan><tspan x="480.0" dy="13.0">• High-Side MOSFET переривач</tspan><tspan x="480.0" dy="13.0">• Миттєве заземлення ліній DShot</tspan><tspan x="480.0" dy="13.0">• Апаратний пріоритет FTS Kill</tspan></text>
<rect x="360.0" y="311.0" width="240.0" height="105.0" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><text x="480.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Двоконтурний інтерлок піропатрона</tspan><tspan x="480.0" dy="13.0">• Ключ ARM (увімкнення заряду)</tspan><tspan x="480.0" dy="13.0">• Ключ FIRE (імпульс підриву)</tspan><tspan x="480.0" dy="13.0">• Захист від брязкоту живлення</tspan><tspan x="480.0" dy="13.0">• Ємнісний накопичувач струму</tspan></text>
<rect x="360.0" y="435.0" width="240.0" height="52.0" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="480.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Силовий вихід:</tspan><tspan x="480.0" dy="13.0">Миттєве відсікання живлення моторів</tspan></text>
<rect x="650.0" y="55.0" width="270.0" height="445.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="785.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">Підсистема FTS (Dedicated Safe)</text>
<line x1="665.0" y1="89.0" x2="905.0" y2="89.0" stroke="#bfdbfe" stroke-width="1.0"/>
<rect x="665.0" y="103.0" width="240.0" height="75.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="785.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Автономне живлення FTS</tspan><tspan x="785.0" dy="13.0">• Окрема батарея LiFePO4 2S</tspan><tspan x="785.0" dy="13.0">• Суперконденсаторний буфер 5Ф</tspan><tspan x="785.0" dy="13.0">• Робота ≥ 45 хв без головного борту</tspan></text>
<rect x="665.0" y="195.0" width="240.0" height="95.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="785.0" y="222.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Незалежний мікроконтролер FTS</tspan><tspan x="785.0" dy="11.7">• Виділений чип (STM32G0/RP2040)</tspan><tspan x="785.0" dy="11.7">• Власний тривісний IMU (детектор штопору)</tspan><tspan x="785.0" dy="11.7">• Автономний FSM безпеки</tspan><tspan x="785.0" dy="11.7">• Апаратний сторожовий таймер</tspan></text>
<rect x="665.0" y="307.0" width="240.0" height="80.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="785.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Резервний радіоканал (868/433 МГц)</tspan><tspan x="785.0" dy="13.0">• Прямий LoRa/GFSK канал зв'язку</tspan><tspan x="785.0" dy="13.0">• Криптографічна автентифікація</tspan><tspan x="785.0" dy="13.0">• Незалежна антена на кілі/промені</tspan></text>
<rect x="665.0" y="405.0" width="240.0" height="82.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="785.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Активатор парашута</tspan><tspan x="785.0" dy="13.0">• Балістичний піропатрон (Squib)</tspan><tspan x="785.0" dy="13.0">• Механічний викидач купола</tspan><tspan x="785.0" dy="13.0">• Спуск дрона: V &lt; 4.0 м/с</tspan></text>
