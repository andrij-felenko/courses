<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Критерії спрацьовування та часова діаграма аварійної термінації</text>
<text x="480.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">Вхідні тригери аварійного стану (Критерії ухвалення рішення)</text>
<rect x="25.0" y="72.0" width="215.0" height="120.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="132.5" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1. Прорив геозони</text>
<rect x="35.0" y="100.0" width="195.0" height="84.0" rx="6" fill="#fef2f2" stroke="#fee2e2" stroke-width="1.5"/><text x="132.5" y="126.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="132.5" dy="0.0">Порушення невідкличної</tspan><tspan x="132.5" dy="12.3">межі утримання (Hard Geofence).</tspan><tspan x="132.5" dy="12.3">Виліт за межі полігону</tspan><tspan x="132.5" dy="12.3">у бік населених пунктів.</tspan></text>
<rect x="255.0" y="72.0" width="215.0" height="120.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="362.5" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">2. Некерований штопор</text>
<rect x="265.0" y="100.0" width="195.0" height="84.0" rx="6" fill="#fef2f2" stroke="#fee2e2" stroke-width="1.5"/><text x="362.5" y="126.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="362.5" dy="0.0">Кутова швидкість обертання</tspan><tspan x="362.5" dy="12.3">|ω| &gt; 450 °/с по двох осях</tspan><tspan x="362.5" dy="12.3">довше ніж t &gt; 300 мс.</tspan><tspan x="362.5" dy="12.3">Втрата стійкості рами.</tspan></text>
<rect x="485.0" y="72.0" width="215.0" height="120.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="592.5" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">3. Розбіжність EKF</text>
<rect x="495.0" y="100.0" width="195.0" height="84.0" rx="6" fill="#fef2f2" stroke="#fee2e2" stroke-width="1.5"/><text x="592.5" y="126.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="592.5" dy="0.0">Коваріація нев'язок фільтра</tspan><tspan x="592.5" dy="12.3">перевищує поріг (ratio &gt; 5.0).</tspan><tspan x="592.5" dy="12.3">Повна втрата просторової</tspan><tspan x="592.5" dy="12.3">орієнтації та координат.</tspan></text>
<rect x="715.0" y="72.0" width="215.0" height="120.0" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="822.5" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">4. Ручна Kill-команда</text>
<rect x="725.0" y="100.0" width="195.0" height="84.0" rx="6" fill="#fef2f2" stroke="#fee2e2" stroke-width="1.5"/><text x="822.5" y="126.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="822.5" dy="0.0">Пряма команда оператора</tspan><tspan x="822.5" dy="12.3">через резервний канал 868 МГц.</tspan><tspan x="822.5" dy="12.3">Двостадійне взведення:</tspan><tspan x="822.5" dy="12.3">ARM -&gt; TERMINATE + HMAC.</tspan></text>
