<rect x="245.0" y="318.0" width="170.0" height="85.0" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="330.0" y="339.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">КРОК 2:</tspan><tspan x="330.0" dy="12.3">Активація піропатрона</tspan><tspan x="330.0" dy="12.3">• Зупинка обертання гвинтів</tspan><tspan x="330.0" dy="12.3">• Імпульс струму на Squib</tspan><tspan x="330.0" dy="12.3">• Балістичний відстріл</tspan></text>
