<rect x="505.0" y="318.0" width="170.0" height="85.0" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="590.0" y="339.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">КРОК 3:</tspan><tspan x="590.0" dy="12.3">Витягування та наповнення</tspan><tspan x="590.0" dy="12.3">• Вихід строп із тубуса</tspan><tspan x="590.0" dy="12.3">• Розгортання полотнища</tspan><tspan x="590.0" dy="12.3">• Початок гальмування</tspan></text>
