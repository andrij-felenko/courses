<rect x="20.0" y="318.0" width="140.0" height="85.0" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="90.0" y="339.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="90.0" dy="0.0">КРОК 1:</tspan><tspan x="90.0" dy="12.3">Миттєвий Motor Kill</tspan><tspan x="90.0" dy="12.3">• Зняття ШІМ/DShot</tspan><tspan x="90.0" dy="12.3">• Відсікання eFuse</tspan><tspan x="90.0" dy="12.3">• Знеструмлення ESC</tspan></text>
