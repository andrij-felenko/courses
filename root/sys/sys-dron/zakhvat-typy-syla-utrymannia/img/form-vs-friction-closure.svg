<polygon points="150,165 110,135 110,195" fill="#fef08a" opacity="0.6" stroke="#ca8a04" stroke-width="1"/>
<text x="125.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#854d0e" text-anchor="middle">Конус тертя α</text>
<rect x="45.0" y="245.0" width="375.0" height="170.0" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="232.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="700">ФІЗИЧНИЙ МЕХАНІЗМ І ОБМЕЖЕННЯ:</text>
<text x="232.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="700">• Утримання за рахунок сили тертя: F_f = μ · F_N</text>
<text x="232.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">• Умова рівноваги зсуву: ∑ F_f ≥ k_safe · F_ext</text>
<text x="232.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">• Вектор контактної сили лежить всередині конуса тертя</text>
<text x="232.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">• Вимагає потужного постійного стискання сервоприводу</text>
<text x="232.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">• Ризик прослизання при масляній плівці або вібраціях</text>
<text x="232.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle" font-weight="700">• Необхідний запас безпеки k_safe ≥ 2.0...3.0</text>
<text x="232.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle" font-weight="700">Чутливість до коефіцієнта тертя μ: КРИТИЧНА</text>
<rect x="465.0" y="60.0" width="405.0" height="370.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="667.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#14532d" text-anchor="middle" font-weight="700">Геометричне замикання (Form Closure)</text>
