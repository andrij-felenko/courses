<rect x="480.0" y="245.0" width="375.0" height="170.0" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.0"/>
<text x="667.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle" font-weight="700">ФІЗИЧНИЙ МЕХАНІЗМ І ПЕРЕВАГИ:</text>
<text x="667.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle" font-weight="700">• Повне обмеження ступенів вільності (6-DoF блокування)</text>
<text x="667.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#059669" text-anchor="middle">• Утримання діє навіть при абсолютно слизькій поверхні (μ = 0)</text>
<text x="667.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">• Зовнішні сили сприймаються жорсткими нормальними реакціями N_i</text>
<text x="667.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#059669" text-anchor="middle">• Сила стискання потрібна мінімальна (лише для вибору зазору)</text>
<text x="667.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#059669" text-anchor="middle">• Абсолютна стійкість до ударів, вібрацій та бічних ривків</text>
<text x="667.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">• Вимагає точного збігу геометрії губок та пазів вантажу</text>
<text x="667.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle" font-weight="700">Енергоспоживання приводу: МІНІМАЛЬНЕ</text>
