<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="870.0" height="440.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="450.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Пневмоелектрична схема та фізика ежекторного вакуумного захвату</text>
<rect x="30.0" y="60.0" width="410.0" height="380.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="235.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Генерація вакууму: Ежектор Вентурі</text>
<rect x="50.0" y="115.0" width="75.0" height="35.0" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
<text x="87.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle" font-weight="700">P_in = 4..6 бар</text>
<line x1="125.0" y1="132.0" x2="160.0" y2="132.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<path d="M 160,115 L 210,128 L 260,110 L 260,155 L 210,137 L 160,150 Z" fill="#93c5fd" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="210.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e3a8a" text-anchor="middle">Критичне звуження</text>
<rect x="260.0" y="115.0" width="60.0" height="35.0" rx="2" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
<text x="290.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Вихлоп</text>
<line x1="320.0" y1="132.0" x2="350.0" y2="132.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="195.0" y="145.0" width="30.0" height="55.0" rx="2" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
<line x1="210.0" y1="220.0" x2="210.0" y2="180.0" stroke="#b45309" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="210.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="middle" font-weight="700">Вакуумний порт P_vac</text>
<rect x="45.0" y="255.0" width="380.0" height="170.0" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="235.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">ТЕРМОДИНАМІЧНИЙ ПРИНЦИП БЕРНУЛЛІ:</text>
<text x="235.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle" font-weight="700">P_static + 0.5·ρ·v² = const  [рівняння нестисливого струменя]</text>
<text x="235.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">1. Стиснене повітря розганяється у звуженні до v &gt; 300 м/с</text>
<text x="235.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">2. Динамічний напір 0.5·ρ·v² різко зростає</text>
<text x="235.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">3. Статичний тиск P_static падає нижче атмосферного:</text>
<text x="235.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="middle" font-weight="700">   P_vac = P_atm − ΔP = 101.3 − 80 = 21.3 кПа (абсолютний)</text>
<text x="235.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#059669" text-anchor="middle">4. Повітря з присоски захоплюється швидкісним струменем</text>
<text x="235.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#059669" text-anchor="middle" font-weight="700">Час утворення вакууму: 15–40 мс</text>
<rect x="460.0" y="60.0" width="410.0" height="380.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="665.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Бортова пневматична лінія з клапанами</text>
<rect x="475.0" y="110.0" width="85.0" height="45.0" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="517.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle" font-weight="700">Джерело P_in</text>
<text x="517.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Помпа / CO₂</text>
<rect x="590.0" y="110.0" width="75.0" height="45.0" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
<text x="627.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle" font-weight="700">Клапан V1</text>
<text x="627.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#059669" text-anchor="middle">Подача вакууму</text>
<line x1="560.0" y1="132.0" x2="590.0" y2="132.0" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="695.0" y="110.0" width="65.0" height="45.0" rx="3" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
<text x="727.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#854d0e" text-anchor="middle" font-weight="700">Ежектор</text>
<text x="727.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#854d0e" text-anchor="middle">Вентурі</text>
<line x1="665.0" y1="132.0" x2="695.0" y2="132.0" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="727.0" y1="155.0" x2="727.0" y2="210.0" stroke="#b45309" stroke-width="2.0"/>
<rect x="775.0" y="175.0" width="80.0" height="40.0" rx="3" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
<text x="815.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle" font-weight="700">Датчик тиску</text>
<text x="815.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle">I2C / Аналог</text>
<line x1="727.0" y1="195.0" x2="775.0" y2="195.0" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,2"/>
<rect x="590.0" y="175.0" width="75.0" height="40.0" rx="3" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.2"/>
<text x="627.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9f1239" text-anchor="middle" font-weight="700">Клапан V2</text>
<text x="627.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9f1239" text-anchor="middle">Скидання (Blow)</text>
<line x1="665.0" y1="195.0" x2="727.0" y2="195.0" stroke="#f43f5e" stroke-width="1.5"/>
<path d="M 710,210 L 695,235 L 760,235 L 745,210 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
<rect x="670.0" y="237.0" width="115.0" height="12.0" rx="1" fill="#94a3b8" stroke="#475569" stroke-width="1.2"/>
<text x="727.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle">Вантаж</text>
<rect x="475.0" y="260.0" width="380.0" height="165.0" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="665.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">АЛГОРИТМ КЕРУВАННЯ ВАКУУМОМ:</text>
<text x="490.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="start">1. ЗАХВАТ: Відкрити V1 → потік через ежектор → розрідження</text>
<text x="490.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#059669" text-anchor="start" font-weight="700">2. ВАЛІДАЦІЯ: Датчик фіксує P &lt; −50 кПа → статус GRIPPED</text>
<text x="490.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="start" font-weight="700">3. АВАРІЯ ВИТОКУ: P &gt; −30 кПа → тривога SLIP_ALARM</text>
<text x="490.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="start">4. СКИНУТИ: Закрити V1 + імпульс V2 (20 мс) → миттєвий відрив</text>
<text x="490.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">5. Розрахунок сили: F = ΔP · S_cup = 75 кПа · 0.002 м² = 150 Н</text>
<text x="665.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle" font-weight="700">Зсувне навантаження: F_shear = μ_гума · F_vac ≈ 0.6 · 150 = 90 Н</text>
</svg>