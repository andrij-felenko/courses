<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 880 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="880" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="320.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="20.0" y="20.0" width="820.0" height="280.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="430.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура корисного навантаження MISSION_ITEM_INT (#73, 38 байтів)</text>
<rect x="40.0" y="70.0" width="380.0" height="100.0" rx="6" fill="#edf2f7" stroke="#333333" stroke-width="1.2"/>
<text x="230.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Плаваюча кома: 4 × float32 (16 байтів)</text>
<text x="230.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">param1: Hold Time (с) / Loiter Turns / Min Pitch</text>
<text x="230.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">param2: Acceptance Radius R_acc (м)</text>
<text x="230.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">param3: Pass / Orbit Radius (м) [+CW, -CCW]</text>
<text x="230.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">param4: Desired Yaw Angle (град або NaN)</text>
<rect x="440.0" y="70.0" width="380.0" height="100.0" rx="6" fill="#e8f4fd" stroke="#333333" stroke-width="1.2"/>
<text x="630.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Просторові координати: 2 × int32 + 1 × float32</text>
<text x="630.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">x (int32_t): Широта Latitude × 10⁷ (degE7)</text>
<text x="630.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">y (int32_t): Довгота Longitude × 10⁷ (degE7)</text>
<text x="630.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">z (float): Висота Altitude (м) [AMSL / Rel / Terrain]</text>
<text x="630.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Дискретність: 10⁻⁷ град ≈ 1.11 см на екваторі</text>
<rect x="40.0" y="185.0" width="780.0" height="95.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.2"/>
<text x="430.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Службові поля послідовності, навігаційної команди та фрейму</text>
<text x="160.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">seq (uint16_t, 2 байта)</text>
<text x="160.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Порядковий індекс 0..N-1</text>
<text x="340.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">command (uint16_t, 2 байта)</text>
<text x="340.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">MAV_CMD (NAV, DO, CONDITION)</text>
<text x="520.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">frame (uint8_t, 1 байт)</text>
<text x="520.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">GLOBAL_REL / TERRAIN_ALT</text>
<text x="700.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">current / autocontinue / type</text>
<text x="700.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">3 × uint8_t (активна ціль, прапорці)</text>
</svg>