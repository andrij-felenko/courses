<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розкладка полів повідомлення з тегом &lt;extensions&gt; у MAVLink 2</text>
<text x="80.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Оголошення в XML-схемі діалекту</text>
<rect x="80.0" y="80.0" width="480.0" height="140.0" rx="6" fill="#f8fafc" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="105.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">&lt;message id=&quot;12000&quot; name=&quot;PAYLOAD_STATUS&quot;&gt;</tspan><tspan x="320.0" dy="13.7">  &lt;field type=&quot;uint32_t&quot; name=&quot;time_boot_ms&quot;&gt;Час роботи (мс)&lt;/field&gt;</tspan><tspan x="320.0" dy="13.7">  &lt;field type=&quot;float&quot;    name=&quot;temperature&quot;&gt;Температура матриці&lt;/field&gt;</tspan><tspan x="320.0" dy="13.7">  &lt;field type=&quot;uint8_t&quot;  name=&quot;sensor_status&quot;&gt;Стан сенсора&lt;/field&gt;</tspan><tspan x="320.0" dy="13.7">  &lt;extensions/&gt;</tspan><tspan x="320.0" dy="13.7">  &lt;field type=&quot;uint32_t&quot; name=&quot;exposure_us&quot;&gt;Експозиція кадру (мкс)&lt;/field&gt;</tspan><tspan x="320.0" dy="13.7">  &lt;field type=&quot;uint16_t&quot; name=&quot;gain_raw&quot;&gt;Чутливість матриці&lt;/field&gt;</tspan><tspan x="320.0" dy="13.7">&lt;/message&gt;</tspan></text>
<text x="580.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b9770e" text-anchor="start" font-weight="700">Базова частина (до &lt;extensions&gt;):</text>
<text x="580.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Поля сортуються за спаданням розміру (4B → 4B → 1B).</text>
<text x="580.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Формують рядок для обчислення CRC_EXTRA.</text>
<text x="580.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0d9488" text-anchor="start" font-weight="700">Розширена частина (після &lt;extensions&gt;):</text>
<text x="580.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Поля НЕ сортуються (додаються в порядку оголошення).</text>
<text x="580.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• НЕ входять до CRC_EXTRA (CRC лишається незмінним!).</text>
<text x="80.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Розкладка байтів у корисних даних (Payload Buffer)</text>
<rect x="80.0" y="265.0" width="150.0" height="50.0" rx="6" fill="#fef9e7" stroke="#b9770e" stroke-width="1.5"/><text x="155.0" y="286.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">time_boot_ms</tspan><tspan x="155.0" dy="13.7">uint32_t (зсув 0..3)</tspan></text>
<rect x="235.0" y="265.0" width="150.0" height="50.0" rx="6" fill="#fef9e7" stroke="#b9770e" stroke-width="1.5"/><text x="310.0" y="286.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">temperature</tspan><tspan x="310.0" dy="13.7">float (зсув 4..7)</tspan></text>
<rect x="390.0" y="265.0" width="90.0" height="50.0" rx="6" fill="#fef9e7" stroke="#b9770e" stroke-width="1.5"/><text x="435.0" y="287.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="435.0" dy="0.0">sensor_status</tspan><tspan x="435.0" dy="11.7">uint8_t (8)</tspan></text>
<line x1="488.0" y1="257.0" x2="488.0" y2="323.0" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4,3"/>
<text x="488.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">&lt;extensions/&gt;</text>
<rect x="495.0" y="265.0" width="160.0" height="50.0" rx="6" fill="#e0f2f1" stroke="#0d9488" stroke-width="1.5"/><text x="575.0" y="286.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="575.0" dy="0.0">exposure_us [ext]</tspan><tspan x="575.0" dy="13.7">uint32_t (зсув 9..12)</tspan></text>
<rect x="660.0" y="265.0" width="130.0" height="50.0" rx="6" fill="#e0f2f1" stroke="#0d9488" stroke-width="1.5"/><text x="725.0" y="286.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">gain_raw [ext]</tspan><tspan x="725.0" dy="13.7">uint16_t (13..14)</tspan></text>
<text x="285.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle" font-weight="700">Базова довжина = 9 байтів (Захищена CRC_EXTRA)</text>
<text x="645.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0d9488" text-anchor="middle" font-weight="700">Розширена довжина = +6 байтів (Разом 15 байтів)</text>
<text x="80.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Нульове обтинання в ефірі (Zero-Truncation) та зворотна сумісність</text>
<rect x="80.0" y="390.0" width="780.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#7d3c98" stroke-width="1.5"/><text x="470.0" y="401.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Старий приймач (знає лише базові 9 байтів) ← отримує 15-байтовий пакет MAVLink 2:</tspan><tspan x="470.0" dy="13.7">• Перевіряє CRC_EXTRA з насінням базової структури → CRC збігається!</tspan><tspan x="470.0" dy="13.7">• Зчитує 9 відомих байтів; додаткові 6 байтів розширення безпечно ігнорує.</tspan><tspan x="470.0" dy="13.7">Новий приймач ← отримує старий 9-байтовий або скорочений пакет (кінцеві нулі обтято):</tspan><tspan x="470.0" dy="13.7">• Розгортає структуру на 15 байтів: поля exposure_us та gain_raw автоматично заповнюються нулями (0x00).</tspan></text>
<text x="470.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Тег &lt;extensions&gt; дозволяє додавати нові поля до існуючих повідомлень без зміни діалекту у всій мережі.</text>
</svg>