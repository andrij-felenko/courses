<rect x="90.0" y="431.8" width="760.0" height="46.5" rx="6" fill="#f4f6f8" stroke="#b9770e" stroke-width="1.5"/><text x="470.0" y="451.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">all.xml — агрегатний опис для наземних станцій (QGroundControl, Mission Planner)</tspan><tspan x="470.0" dy="15.0">Включає всі публічні діалекти вендорів для декодування будь-якого борту на одній лінії зв'язку</tspan></text>
<text x="470.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Генератор mavgen розгортає ланцюг тегів &lt;include&gt; без дублювання та будує єдине дерево типів.</text>
