<rect x="-13.8" y="280.3" width="447.5" height="69.4" rx="6" fill="#f4f6f8" stroke="#7d3c98" stroke-width="1.5"/><text x="210.0" y="304.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">common.xml (Загальний стандарт БПЛА)</tspan><tspan x="210.0" dy="15.0">ATTITUDE (#30), GLOBAL_POSITION_INT (#33), BATTERY_STATUS (#147)</tspan><tspan x="210.0" dy="15.0">Універсальні навігаційні команди MAV_CMD</tspan></text>
