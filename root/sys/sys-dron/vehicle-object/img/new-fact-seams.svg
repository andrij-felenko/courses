<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дорога нового значення й місця мовчазної втрати</text>
<text x="300.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">дорога нового значення</text>
<text x="845.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">де воно тихо зникає</text>
<rect x="85.0" y="90.0" width="430.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">WINCH_STATUS від борту</tspan><tspan x="300.0" dy="16.9">line_length = 12.4 (float, метри)</tspan></text>
<rect x="85.0" y="205.1" width="430.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="226.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">_handleWinchStatus:</tspan><tspan x="300.0" dy="16.9">mavlink_msg_winch_status_decode(...)</tspan></text>
<rect x="85.0" y="328.5" width="430.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="349.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">lineLength()-&gt;setRawValue(12.4)</tspan></text>
<rect x="85.0" y="435.1" width="430.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="456.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">метадані з WinchFact.json:</tspan><tspan x="300.0" dy="16.9">units «m» · decimalPlaces 2</tspan></text>
<rect x="85.0" y="550.0" width="430.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="571.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">таймер групи: раз на 1000 мс —</tspan><tspan x="300.0" dy="16.9">valueChanged</tspan></text>
<rect x="85.0" y="665.0" width="430.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="686.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">QML: winch.lineLength.valueString</tspan><tspan x="300.0" dy="16.9">«12.40» плюс units «m» або «ft»</tspan></text>
<line x1="300.0" y1="147.0" x2="300.0" y2="198.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
