<line x1="300.0" y1="607.0" x2="300.0" y2="658.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610.0" y="91.2" width="470.0" height="47.6" rx="6" fill="#fbeeee" stroke="#c0392b" stroke-width="1.5"/><text x="845.0" y="111.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">Борт не шле WINCH_STATUS — і жодного сліду ніде.</tspan><tspan x="845.0" dy="15.6">Попросити: MAV_CMD_SET_MESSAGE_INTERVAL</tspan></text>
<rect x="610.0" y="333.4" width="470.0" height="63.2" rx="6" fill="#fbeeee" stroke="#c0392b" stroke-width="1.5"/><text x="845.0" y="353.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">Ім'я факту не збіглося з ключем «name» у JSON:</tspan><tspan x="845.0" dy="15.6">метадані не приліпилися, попередження НЕМАЄ —</tspan><tspan x="845.0" dy="15.6">число без одиниць і з довгим хвостом</tspan></text>
<rect x="610.0" y="453.4" width="470.0" height="63.2" rx="6" fill="#fbeeee" stroke="#c0392b" stroke-width="1.5"/><text x="845.0" y="473.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">Файл JSON не внесено в JSON_FILES:</tspan><tspan x="845.0" dy="15.6">«Internal Error» у журналі — і вся група</tspan><tspan x="845.0" dy="15.6">лишилася без метаданих</tspan></text>
<rect x="610.0" y="581.2" width="470.0" height="47.6" rx="6" fill="#fbeeee" stroke="#c0392b" stroke-width="1.5"/><text x="845.0" y="601.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">Період 0 замість 1000 — сигнал на кожен кадр;</tspan><tspan x="845.0" dy="15.6">потрібна кожна зміна — setLiveUpdates(true)</tspan></text>
<rect x="610.0" y="691.2" width="470.0" height="47.6" rx="6" fill="#fbeeee" stroke="#c0392b" stroke-width="1.5"/><text x="845.0" y="711.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">Ім'я групи або перша літера факту розійшлися:</tspan><tspan x="845.0" dy="15.6">«Unknown Fact» у журналі, порожнє поле на екрані</tspan></text>
