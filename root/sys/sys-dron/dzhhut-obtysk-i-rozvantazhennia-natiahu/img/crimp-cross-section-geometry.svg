<text x="817.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">(жили не доходять до піна)</text>
<rect x="475.0" y="355.0" width="415.0" height="120.0" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1.0"/>
<text x="485.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="start" font-weight="700">Типові дефекти та їхній наслідок на борту:</text>
<text x="485.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="start">• Недообтиск (CH завеликий) → виривання жили під вібрацією</text>
<text x="485.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="start">• Переобтиск (CH замалий) → надріз жил, окрихчування дроту</text>
<text x="485.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="start">• Відсутній задній розтруб → зріз жили об гострий край гільзи</text>
<text x="485.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="start">• Ізоляція потрапила в гільзу → плаваючий опір шини I2C/CAN</text>
<text x="485.0" y="463.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="start">• Довга щітка жил → заклинювання піна та відсутність контакту</text>
</svg>