<text x="55.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">Критерії газонепроникного обтиску:</text>
<text x="55.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Коефіцієнт ущільнення жил &gt; 85–90% (без пустот)</text>
<text x="55.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Симетричний підгин крил гільзи без задирок і тріщин</text>
<text x="55.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Руйнування оксидної плівки та металічний контакт</text>
<text x="55.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Товщина дна гільзи не стоншена нижче допустимої</text>
<text x="55.0" y="463.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="start">• Відсутність підрізання або надлому окремих провідників</text>
