<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скільки часу кожна стала дозволяє мовчати, перш ніж це визнають невдачею</text>
<text x="30.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Хеш-звірка з кешем</text>
<text x="30.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="30.0" dy="0.0">kHashCheckTimeoutMs 1000 мс,</tspan><tspan x="30.0" dy="15.6">спроба одна, без повторів</tspan></text>
<rect x="430.0" y="78.0" width="27.6" height="34.0" rx="6" fill="#fff8e1" stroke="#6b7280" stroke-width="1.8"/>
<text x="471.6" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">1 с → падаємо на звичайне завантаження</text>
<text x="30.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Запит списку без відповіді</text>
<text x="30.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="30.0" dy="0.0">kParamRequestListTimeoutMs 5000 мс ×</tspan><tspan x="30.0" dy="15.6">(1 + kMaxInitialRequestListRetry 4)</tspan></text>
<rect x="430.0" y="156.0" width="690.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="775.0" y="177.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">25 с → «апарат не відповів на запит»</tspan></text>
<text x="30.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Тиша посеред потоку</text>
<text x="30.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="30.0" dy="0.0">таймер 3000 мс, перезапуск</tspan><tspan x="30.0" dy="15.6">на кожному PARAM_VALUE</tspan></text>
<rect x="430.0" y="234.0" width="82.8" height="34.0" rx="6" fill="#fff8e1" stroke="#6b7280" stroke-width="1.8"/>
<text x="526.8" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">3 с → вмикається доборка дір</text>
<text x="30.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Один номер у доборці</text>
<text x="30.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="30.0" dy="0.0">1000 мс × (1 + 2) на коло,</tspan><tspan x="30.0" dy="15.6">до 5 кіл на один номер</tspan></text>
<rect x="430.0" y="312.0" width="414.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="637.0" y="333.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="637.0" dy="0.0">15 с → номер визнано втраченим</tspan></text>
<text x="30.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Запис одного параметра</text>
<text x="30.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="30.0" dy="0.0">kWaitForParamValueAckMs 1000 мс ×</tspan><tspan x="30.0" dy="15.6">(1 + kParamSetRetryCount 2)</tspan></text>
<rect x="430.0" y="390.0" width="82.8" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="526.8" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start">3 с → невдача й перечитування</text>
<text x="30.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Паузи між колами bulkRefresh</text>
<text x="30.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="30.0" dy="0.0">kRetryBaseDelayMs 1000 мс,</tspan><tspan x="30.0" dy="15.6">подвоєння щокола: 1 + 2 + 4</tspan></text>
<rect x="430.0" y="468.0" width="193.2" height="34.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="637.2" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start">7 с самих лише пауз на 3 кола</text>
<line x1="416.0" y1="545.0" x2="1144.0" y2="545.0" stroke="#6b7280" stroke-width="1.4"/>
<line x1="430.0" y1="545.0" x2="430.0" y2="554.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="430.0" y="572.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
<line x1="568.0" y1="545.0" x2="568.0" y2="554.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="568.0" y="572.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">5</text>
<line x1="706.0" y1="545.0" x2="706.0" y2="554.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="706.0" y="572.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">10</text>
<line x1="844.0" y1="545.0" x2="844.0" y2="554.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="844.0" y="572.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">15</text>
<line x1="982.0" y1="545.0" x2="982.0" y2="554.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="982.0" y="572.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">20</text>
<line x1="1120.0" y1="545.0" x2="1120.0" y2="554.0" stroke="#6b7280" stroke-width="1.4"/>
<text x="1120.0" y="572.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">25</text>
<text x="30.0" y="572.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">час мовчання, секунди</text>
</svg>