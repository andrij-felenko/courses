<text x="539.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">лише НЕспільний хвіст</text>
<rect x="672.0" y="252.0" width="190.0" height="56.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.6"/>
<text x="767.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">значення</text>
<text x="767.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1, 2 або 4 байти</text>
<rect x="870.0" y="252.0" width="230.0" height="56.0" rx="6" fill="#fff8e1" stroke="#6b7280" stroke-width="1.6"/>
