<text x="870.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">байт 1 = 0xB0</text>
<rect x="700.0" y="422.0" width="170.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="785.0" y="452.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">старший напівбайт</tspan><tspan x="785.0" dy="15.6">name_len − 1 = 0xB</tspan><tspan x="785.0" dy="15.6">(ім'я 12 байтів)</tspan></text>
<rect x="870.0" y="422.0" width="170.0" height="84.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="955.0" y="452.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="955.0" dy="0.0">молодший напівбайт</tspan><tspan x="955.0" dy="15.6">common_len = 0</tspan><tspan x="955.0" dy="15.6">(спільного нема)</tspan></text>
