<text x="366.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">magic</text>
<text x="366.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="366.0" dy="0.0">0x671B — без замовчувань</tspan><tspan x="366.0" dy="15.6">0x671C — із ними</tspan></text>
<rect x="490.0" y="90.0" width="200.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="590.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">num_params</text>
<text x="590.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="590.0" dy="0.0">скільки записів у файлі</tspan></text>
