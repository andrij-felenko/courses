<text x="351.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">довжини імені</text>
<rect x="414.0" y="252.0" width="250.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/>
