<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 478.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="478.8" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Неголономне кінематичне обмеження та розклад швидкостей</text>
<text x="240.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Неголономна в'язь кочення</text>
<text x="240.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">нульова швидкість поперек площини колеса</text>
<polygon points="208.3,175.1 233.7,163.3 271.7,244.9 246.3,256.7" fill="#e2e8f0" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="240.0" cy="210.0" r="6.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="240.0" y1="210.0" x2="286.5" y2="110.3" stroke="#27ae60" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="276.5" y="98.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">v_поздовжнє (вільне кочення)</text>
<line x1="240.0" y1="210.0" x2="317.0" y2="245.9" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="305.0" y1="233.9" x2="329.0" y2="257.9" stroke="#c0392b" stroke-width="3.0"/>
<line x1="305.0" y1="257.9" x2="329.0" y2="233.9" stroke="#c0392b" stroke-width="3.0"/>
<text x="335.0" y="251.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">v_поперечне = 0
(бокове ковзання заборонене)</text>
<rect x="130.2" y="326.6" width="219.5" height="46.8" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="346.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Рівняння в'язі Пфаффа:</tspan><tspan x="240.0" dy="16.2">−ẋ·sin(θ) + ẏ·cos(θ) = 0</tspan></text>
<text x="700.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Проєкції на світові осі (X, Y)</text>
<text x="700.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">перехід від швидкості корпусу v до (ẋ, ẏ)</text>
<line x1="610.0" y1="280.0" x2="790.0" y2="280.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="795.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">X (світ)</text>
<line x1="610.0" y1="280.0" x2="610.0" y2="100.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="610.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Y (світ)</text>
<line x1="610.0" y1="280.0" x2="720.3" y2="193.8" stroke="#2457d6" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="732.3" y="185.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">v (вектор швидкості)</text>
<line x1="720.3" y1="193.8" x2="720.3" y2="280.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
<line x1="720.3" y1="193.8" x2="610.0" y2="193.8" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="720.3" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ẋ = v·cos(θ + β)</text>
<text x="600.0" y="193.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">ẏ = v·sin(θ + β)</text>
<path d="M 665 280 A 55 55 0 0 0 653 246" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<text x="675.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">θ + β</text>
<rect x="547.6" y="326.6" width="304.8" height="46.8" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="700.0" y="346.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Диференціальний зв'язок:</tspan><tspan x="700.0" dy="16.2">ẋ = v·cos(θ + β),  ẏ = v·sin(θ + β)</tspan></text>
<rect x="189.8" y="411.2" width="560.4" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="431.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Неголономна в'язь обмежує миттєвий простір швидкостей до 2 ступенів (v, δ),</tspan><tspan x="470.0" dy="15.6">але дозволяє роботу досягти будь-якої точки конфігураційного простору (x, y, θ)</tspan></text>
</svg>