<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація та конвеєр виконання команд місії</text><text x="430.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Як автопілот обробляє навігаційні точки, паралельні дії та умовні бар'єри</text><rect x="30.0" y="75.0" width="250.0" height="315.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><rect x="30.0" y="75.0" width="250.0" height="38.0" rx="6" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/><text x="155.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">НАВІГАЦІЯ (MAV_CMD_NAV_*)</text><text x="45.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Керують просторовим рухом</text><text x="45.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Активна рівно одна команда</text><text x="45.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Блокує перехід до досягнення цілі</text><text x="45.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Приклади команд:</text><text x="45.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• WAYPOINT (точка польоту)</text><text x="45.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• TAKEOFF / LAND (зліт / посадка)</text><text x="45.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• LOITER_UNLIM / TIME / TURNS</text><text x="45.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• RETURN_TO_LAUNCH (повернення)</text><text x="45.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• SPLINE_WAYPOINT (плавна дуга)</text><rect x="305.0" y="75.0" width="250.0" height="315.0" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.5"/><rect x="305.0" y="75.0" width="250.0" height="38.0" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">ДІЇ ТА НАЛАШТУВАННЯ (DO_*)</text><text x="320.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Виконуються миттєво / паралельно</text><text x="320.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Не мають просторових цілей</text><text x="320.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Не блокують навігаційний рух</text><text x="320.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Приклади команд:</text><text x="320.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• DO_SET_SERVO (керування серво)</text><text x="320.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• DO_SET_RELAY (перемикач реле)</text><text x="320.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• DO_CHANGE_SPEED (зміна швидкості)</text><text x="320.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• DO_SET_CAM_TRIGG_DIST (фото)</text><text x="320.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• DO_MOUNT_CONTROL (підвіс камери)</text><text x="320.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• DO_JUMP (циклічний перехід)</text><rect x="580.0" y="75.0" width="250.0" height="315.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><rect x="580.0" y="75.0" width="250.0" height="38.0" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/><text x="705.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">УМОВИ (CONDITION_*)</text><text x="595.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Бар'єри виконання черги дій</text><text x="595.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Призупиняють виклик наступних DO</text><text x="595.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Чекають виконання умови</text><text x="595.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Приклади команд:</text><text x="595.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• CONDITION_DELAY (затримка в с)</text><text x="595.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• CONDITION_DISTANCE (відстань до WPT)</text><text x="595.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• CONDITION_YAW (доворот на кут)</text><text x="595.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• CONDITION_GATE (прохід створу)</text>
</svg>