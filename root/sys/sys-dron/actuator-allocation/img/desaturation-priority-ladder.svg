<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b"/></marker></defs>
<rect x="0.0" y="0.0" width="800.0" height="280.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="400.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія пріоритетів збереження керованості при насиченні приводів</text>
<rect x="50.0" y="60.0" width="700.0" height="50.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.8"/>
<text x="180.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Пріоритет 1: Крен і Тангаж (Roll &amp; Pitch)</text>
<text x="520.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Гарантія кутової стійкості (втрата = перекидання апарата)</text>
<rect x="100.0" y="125.0" width="650.0" height="50.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="230.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">Пріоритет 2: Рискання (Yaw)</text>
<text x="540.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Масштабується або обнуляється при дефіциті тяги мотора</text>
<rect x="150.0" y="190.0" width="600.0" height="50.0" rx="6" fill="#e0e7ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="280.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Пріоритет 3: Загальна тяга (Thrust)</text>
<text x="560.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Зсувається вниз/вгору для вивільнення запасу під моменти</text>
<line x1="35.0" y1="65.0" x2="35.0" y2="235.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="25.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Пріоритет</text>
<text x="400.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Краще втратити кілька метрів висоти чи градусів курсу, ніж допустити неконтрольований крен</text>
</svg>