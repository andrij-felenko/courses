<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="820.0" height="320.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="20.0" y="20.0" width="360.0" height="275.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="200.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізична модель ротора i</text>
<circle cx="90.0" cy="180.0" r="7.0" fill="#333333" stroke="#333333" stroke-width="1.5"/>
<text x="90.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Центр мас (0,0,0)</text>
<line x1="90.0" y1="180.0" x2="260.0" y2="110.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="150.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Плече r_i = [x_i, y_i, z_i]ᵀ</text>
<circle cx="260.0" cy="110.0" r="16.0" fill="#fee2e2" stroke="#c0392b" stroke-width="2.0"/>
<text x="260.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">M_i</text>
<line x1="260.0" y1="94.0" x2="260.0" y2="40.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="310.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Тяга F_i = c_t · u_i</text>
<text x="200.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Реактивний момент: Q_i = d_i · c_m · u_i</text>
<text x="200.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Момент від тяги: M_i = r_i × F_i</text>
<rect x="400.0" y="20.0" width="400.0" height="275.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="600.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стовпчик b_i матриці ефективності B</text>
<text x="430.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">F_z :  -c_t · n_z,i</text>
<text x="430.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">M_x :  c_t · (y_i · n_z,i - z_i · n_y,i) + c_m · d_i · n_x,i</text>
<text x="430.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">M_y :  c_t · (z_i · n_x,i - x_i · n_z,i) + c_m · d_i · n_y,i</text>
<text x="430.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">M_z :  c_t · (x_i · n_y,i - y_i · n_x,i) + c_m · d_i · n_z,i</text>
<text x="600.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">n_i — напрямний вектор осі тяги; d_i ∈ {+1, -1} — напрям обертання</text>
</svg>