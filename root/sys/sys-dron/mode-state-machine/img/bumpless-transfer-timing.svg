<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Синхронізація сетопоінтів (Bumpless Transfer) при переході STABILIZE -&gt; ALT_HOLD</text>
<rect x="30.0" y="60.0" width="740.0" height="150.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.2"/>
<text x="45.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">БЕЗ синхронізації (Hard Switch): ривок і провал висоти</text>
<line x1="70.0" y1="180.0" x2="740.0" y2="180.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="70.0" y1="100.0" x2="70.0" y2="190.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="65.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Z, м</text>
<text x="740.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">час (t)</text>
<line x1="360.0" y1="95.0" x2="360.0" y2="195.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="360.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">t_switch (перемикання)</text>
<line x1="70.0" y1="135.0" x2="360.0" y2="135.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="360.0" y1="135.0" x2="400.0" y2="170.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="400.0" y1="170.0" x2="720.0" y2="160.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="180.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Фактична висота Z_real = 50 м</text>
<line x1="70.0" y1="175.0" x2="360.0" y2="175.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="180.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Стара уставка Z_target = 0 м</text>
<line x1="360.0" y1="175.0" x2="720.0" y2="175.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
<line x1="375.0" y1="135.0" x2="375.0" y2="175.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="385.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Велика помилка e = 50м -&gt; удар газом униз!</text>
<rect x="30.0" y="240.0" width="740.0" height="150.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="45.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">З Bumpless Transfer: Z_target := Z_real, інтегратор предзавантажено</text>
<line x1="70.0" y1="360.0" x2="740.0" y2="360.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="70.0" y1="280.0" x2="70.0" y2="370.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="65.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">Z, м</text>
<text x="740.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">час (t)</text>
<line x1="360.0" y1="275.0" x2="360.0" y2="375.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="360.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">t_switch</text>
<line x1="70.0" y1="315.0" x2="720.0" y2="315.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="180.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Фактична висота Z_real = 50 м (без коливань)</text>
<line x1="70.0" y1="355.0" x2="360.0" y2="355.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
<line x1="360.0" y1="355.0" x2="360.0" y2="317.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="350.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">Z_target := 50 м</text>
<line x1="360.0" y1="315.0" x2="720.0" y2="315.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="400.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Помилка e = 0, тяга = T_hover -&gt; плавне зависання</text>
<text x="400.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Плавний перехід вимагає синхронізації сетопоінтів та ініціалізації внутрішнього стану інтеграторів PID.</text>
</svg>