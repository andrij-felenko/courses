<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Під одним іменем «Bluetooth» ховаються два несхожі канали</text>
<rect x="50.0" y="90.0" width="500.0" height="380.0" rx="12" fill="#ffffff" stroke="#98a6b4" stroke-width="1.8"/>
<text x="300.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">класичний режим</text>
<text x="300.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">профіль послідовного порту</text>
<rect x="90.0" y="180.0" width="420.0" height="66.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="209.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">стек ОС видає сокет, що поводиться</tspan><tspan x="300.0" dy="16.2">як відкритий серійний порт</tspan></text>
<rect x="90.0" y="266.0" width="420.0" height="66.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="295.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">потік байтів без меж — рівно те,</tspan><tspan x="300.0" dy="16.2">чого чекає розбирач</tspan></text>
<rect x="90.0" y="352.0" width="420.0" height="88.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="384.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">спарення робить система;</tspan><tspan x="300.0" dy="16.2">застосунок лише вибирає пристрій</tspan><tspan x="300.0" dy="16.2">зі списку знайдених</tspan></text>
<rect x="610.0" y="90.0" width="500.0" height="380.0" rx="12" fill="#ffffff" stroke="#98a6b4" stroke-width="1.8"/>
<text x="860.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">режим малого споживання</text>
<text x="860.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">характеристики й сповіщення</text>
<rect x="650.0" y="180.0" width="420.0" height="66.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="209.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">потоку немає взагалі: є запис</tspan><tspan x="860.0" dy="16.2">і сповіщення про зміну значення</tspan></text>
<rect x="650.0" y="266.0" width="420.0" height="66.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="295.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">кожна порція обмежена розміром пакета —</tspan><tspan x="860.0" dy="16.2">десятки, зрідка дві сотні байтів</tspan></text>
<rect x="650.0" y="352.0" width="420.0" height="88.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="384.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">труба байтів складається зі шматків</tspan><tspan x="860.0" dy="16.2">вже в застосунку; пропускна здатність</tspan><tspan x="860.0" dy="16.2">у рази менша</tspan></text>
</svg>