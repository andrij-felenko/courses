<rect x="96.0" y="570.0" width="504.0" height="92.0" rx="6" fill="#fdecea" stroke="#f5c6c0" stroke-width="1.0"/><text x="348.0" y="604.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="348.0" dy="0.0">recvfrom бере скільки влізло, решту датаграми ядро ВИКИДАЄ.</tspan><tspan x="348.0" dy="15.6">Наступний байт у циклі — початок уже іншої датаграми,</tspan><tspan x="348.0" dy="15.6">тож обірваний кадр з'їдає й сусідній: суцільні помилки CRC.</tspan></text>
