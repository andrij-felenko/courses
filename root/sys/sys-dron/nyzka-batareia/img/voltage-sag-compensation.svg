<text x="245.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">U_ocv = U_measured + I · R_internal</text>
<rect x="65.0" y="315.9" width="360.0" height="88.2" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="335.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Приклад маневру (6S LiPo, R_int = 10 мОм/банку):</tspan><tspan x="245.0" dy="14.3">• Струм зависання: 20 А  →  просідання 0.20 В/банку</tspan><tspan x="245.0" dy="14.3">• Ривок газу (Punch): 80 А →  просідання 0.80 В/банку</tspan><tspan x="245.0" dy="14.3">• Заряд 60% (3.80 В) при 80 А просідає до 3.00 В!</tspan><tspan x="245.0" dy="14.3">Без компенсації автопілот виконає хибний LAND.</tspan></text>
