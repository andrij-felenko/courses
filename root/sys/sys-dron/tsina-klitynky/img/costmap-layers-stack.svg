<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура шарів карти вартості (Layered Costmap)</text>
<rect x="35.0" y="55.0" width="185.0" height="370.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<rect x="35.0" y="55.0" width="185.0" height="46.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
<text x="127.5" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Статичний шар</text>
<text x="127.5" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Static Layer</text>
<text x="45.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Тверді стіни та споруди</text>
<text x="45.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Двійкова сітка зайнятості</text>
<text x="45.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• LETHAL_OBSTACLE = 254</text>
<text x="45.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• FREE_SPACE = 0</text>
<text x="45.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Джерело: стаціонарна карта,</text>
<text x="45.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  план приміщення, висотна сітка</text>
<rect x="245.0" y="55.0" width="185.0" height="370.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8"/>
<rect x="245.0" y="55.0" width="185.0" height="46.0" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.2"/>
<text x="337.5" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Шар інфляції</text>
<text x="337.5" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Inflation Layer</text>
<text x="255.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Вписаний радіус r_insc</text>
<text x="255.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  INSCRIBED_COST = 253</text>
<text x="255.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Експоненційний спад:</text>
<text x="255.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  cost(d) = exp(-α·Δd)·252</text>
<text x="255.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Радіус інфляції r_inf</text>
<text x="255.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Створює градієнт відштовхування</text>
<text x="255.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  від кутів та ребер стін</text>
<rect x="455.0" y="55.0" width="185.0" height="370.0" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8"/>
<rect x="455.0" y="55.0" width="185.0" height="46.0" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.2"/>
<text x="547.5" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Динамічний шар</text>
<text x="547.5" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Hazard / Sensor Layer</text>
<text x="465.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Зони вітрової турбулентності</text>
<text x="465.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Сліпі зони сенсорів (FOV)</text>
<text x="465.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Зони завад GNSS / зв'язку</text>
<text x="465.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Тимчасові заборонені геозони</text>
<text x="465.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Штраф: додаткова вартість</text>
<text x="465.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  cost_hazard ∈ [20..180]</text>
<rect x="665.0" y="55.0" width="180.0" height="370.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<rect x="665.0" y="55.0" width="180.0" height="46.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="755.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Master Costmap</text>
<text x="755.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Зведена карта вартості</text>
<text x="675.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Пошарова суперпозиція:</text>
<text x="675.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  C_total = max(L_stat, L_inf)</text>
<text x="675.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">            + L_hazard</text>
<text x="675.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Вхідні дані для A* / Dijkstra</text>
<text x="675.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Шлях проходить долинами</text>
<text x="675.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  мінімального інтегралу вартості</text>
<line x1="220.0" y1="240.0" x2="245.0" y2="240.0" stroke="#64748b" stroke-width="2.0"/>
<circle cx="245.0" cy="240.0" r="3.0" fill="#64748b" stroke="none" stroke-width="1.5"/>
<line x1="430.0" y1="240.0" x2="455.0" y2="240.0" stroke="#64748b" stroke-width="2.0"/>
<circle cx="455.0" cy="240.0" r="3.0" fill="#64748b" stroke="none" stroke-width="1.5"/>
<line x1="640.0" y1="240.0" x2="665.0" y2="240.0" stroke="#16a34a" stroke-width="2.5"/>
<circle cx="665.0" cy="240.0" r="4.0" fill="#16a34a" stroke="none" stroke-width="1.5"/>
<rect x="194.7" y="439.5" width="490.6" height="31.0" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/><text x="440.0" y="458.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Планувальник оптимізує інтегральну функцію вартості вздовж траєкторії</tspan></text>
</svg>