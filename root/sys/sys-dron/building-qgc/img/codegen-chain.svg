<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1280" height="780" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг кодогенерації: від XML-опису до заголовків, які включає станція</text>
<rect x="60.0" y="64.0" width="470.0" height="86.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="102.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">message_definitions/v1.0/all.xml</tspan><tspan x="295.0" dy="20.8">+ ланцюг &lt;include&gt;: common, minimal, standard, …</tspan></text>
<line x1="295.0" y1="150.0" x2="295.0" y2="196.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="200.0" width="470.0" height="78.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="234.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">mavgen  --lang=C  --wire-protocol=2.0</tspan><tspan x="295.0" dy="20.8">PYTHONHASHSEED=0</tspan></text>
<line x1="295.0" y1="278.0" x2="295.0" y2="324.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="328.0" width="470.0" height="190.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="389.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">include/mavlink/</tspan><tspan x="295.0" dy="19.5">сталі файли: protocol.h, mavlink_types.h, checksum.h</tspan><tspan x="295.0" dy="19.5">all/   common/   minimal/   ardupilotmega/   …</tspan><tspan x="295.0" dy="19.5">&lt;діалект&gt;.h — таблиці CRC і перелічення</tspan><tspan x="295.0" dy="19.5">mavlink_msg_*.h — структура, пакувальник, CRC_EXTRA</tspan></text>
<rect x="720.0" y="328.0" width="500.0" height="118.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="371.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">mavlink_enums.py</tspan><tspan x="970.0" dy="20.8">читає ЗГЕНЕРОВАНІ заголовки</tspan><tspan x="970.0" dy="20.8">→ MAVLinkEnums.h + обгортка для QML</tspan></text>
<rect x="720.0" y="500.0" width="500.0" height="118.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="543.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">mavlink_instance_fields.py</tspan><tspan x="970.0" dy="20.8">читає XML НАПРЯМУ</tspan><tspan x="970.0" dy="20.8">→ MAVLinkInstanceFields.h</tspan></text>
<line x1="536.0" y1="387.0" x2="714.0" y2="387.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="536.0" y1="107.0" x2="625.0" y2="107.0" stroke="#2457d6" stroke-width="1.8"/>
<line x1="625.0" y1="107.0" x2="625.0" y2="559.0" stroke="#2457d6" stroke-width="1.8"/>
<line x1="625.0" y1="559.0" x2="714.0" y2="559.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="640.0" width="1160.0" height="100.0" rx="6" fill="#f8f4ee" stroke="#c0392b" stroke-width="2.2"/><text x="640.0" y="675.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">позначка instance=&quot;true&quot; до C-заголовків не доходить —</tspan><tspan x="640.0" dy="19.5">тому один генератор бере готовий вихід mavgen, а другий вертається до першоджерела</tspan><tspan x="640.0" dy="19.5">обидва пишуть файл лише за зміни вмісту, щоб не запускати перезбірку дарма</tspan></text>
</svg>