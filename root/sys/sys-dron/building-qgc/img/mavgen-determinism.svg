<rect x="650.0" y="230.0" width="520.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="910.0" y="271.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">константа в заголовку та сама</tspan></text>
