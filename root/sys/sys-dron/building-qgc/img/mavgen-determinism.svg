<rect x="50.0" y="56.0" width="520.0" height="50.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="310.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">засіл хешування випадковий</tspan></text>
