<rect x="50.0" y="548.0" width="600.0" height="120.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="593.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">після кожного оновлення апстриму вендор</tspan><tspan x="350.0" dy="19.5">прогонить скрипт і комітить перегенеровані копії:</tspan><tspan x="350.0" dy="19.5">69 КБ чужого переліку ресурсів у власному дереві</tspan></text>
