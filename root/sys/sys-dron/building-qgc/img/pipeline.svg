<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 800" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1220" height="800" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стадії збірки застосунку і властиві їм поламки</text>
<text x="295.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">стадія — і що вона робить</text>
<text x="890.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">як упізнати саме її у виводі</text>
<rect x="60.0" y="76.0" width="470.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">Клон джерел</tspan></text>
<rect x="620.0" y="76.0" width="540.0" height="84.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">дерево без підмодулів;</tspan><tspan x="890.0" dy="18.2">без історії git — без версії</tspan></text>
<line x1="544.0" y1="118.0" x2="606.0" y2="118.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,5"/>
<line x1="295.0" y1="160.0" x2="295.0" y2="188.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="192.0" width="470.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="239.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">Системні залежності</tspan></text>
<rect x="620.0" y="192.0" width="540.0" height="84.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="229.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">«не знайдено пакет» під час</tspan><tspan x="890.0" dy="18.2">встановлення, а не збірки</tspan></text>
<line x1="544.0" y1="234.0" x2="606.0" y2="234.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,5"/>
<line x1="295.0" y1="276.0" x2="295.0" y2="304.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="308.0" width="470.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="355.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">Пошук Qt і компілятора</tspan></text>
<rect x="620.0" y="308.0" width="540.0" height="84.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="345.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">Could not find … &quot;Qt6Location&quot;</tspan><tspan x="890.0" dy="18.2">версія Qt поза діапазоном</tspan></text>
<line x1="544.0" y1="350.0" x2="606.0" y2="350.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,5"/>
<line x1="295.0" y1="392.0" x2="295.0" y2="420.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="424.0" width="470.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="471.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">Добування залежностей</tspan></text>
<rect x="620.0" y="424.0" width="540.0" height="84.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="461.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">не вдалося клонувати MAVLink;</tspan><tspan x="890.0" dy="18.2">не збіглася сума архіву SDK</tspan></text>
<line x1="544.0" y1="466.0" x2="606.0" y2="466.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,5"/>
<line x1="295.0" y1="508.0" x2="295.0" y2="536.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="540.0" width="470.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="588.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">Кодогенерація</tspan></text>
<rect x="620.0" y="540.0" width="540.0" height="84.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="577.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">немає mavlink_msg_*.h;</tspan><tspan x="890.0" dy="18.2">трасування Python у виводі</tspan></text>
<line x1="544.0" y1="582.0" x2="606.0" y2="582.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,5"/>
<line x1="295.0" y1="624.0" x2="295.0" y2="652.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="656.0" width="470.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="704.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">Компіляція й лінкування</tspan></text>
<rect x="620.0" y="656.0" width="540.0" height="84.0" rx="6" fill="#f8f4ee" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="693.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">попередження як помилка (WERROR);</tspan><tspan x="890.0" dy="18.2">процес убито при лінкуванні</tspan></text>
<line x1="544.0" y1="698.0" x2="606.0" y2="698.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,5"/>
<rect x="180.0" y="736.0" width="860.0" height="48.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="765.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">кожна стадія спирається на завершену попередню — звідси й порядок кроків</tspan></text>
</svg>