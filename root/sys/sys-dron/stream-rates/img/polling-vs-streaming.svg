<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Опитування (Polling) проти Потокової передачі (Streaming)</text>
<text x="470.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Чому запит-відповідь паралізує вузький радіолінк, а періодична підписка зберігає смугу</text>
<rect x="40.0" y="65.0" width="410.0" height="355.0" rx="8" fill="#fdfefe" stroke="#c0392b" stroke-width="1.5"/>
<text x="245.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Індивідуальне опитування (Polling)</text>
<rect x="60.0" y="115.0" width="100.0" height="30.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="110.0" y="133.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">GCS (Земля)</tspan></text>
<rect x="330.0" y="115.0" width="100.0" height="30.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="380.0" y="133.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">БПЛА (Борт)</tspan></text>
<line x1="110.0" y1="165.0" x2="380.0" y2="190.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="245.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">1. Запит GET(ATTITUDE) [14 B]</text>
<line x1="380.0" y1="210.0" x2="110.0" y2="235.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="245.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">2. Відповідь ATTITUDE [40 B]</text>
<line x1="80.0" y1="190.0" x2="80.0" y2="235.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<text x="65.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">RTT</text>
<line x1="110.0" y1="250.0" x2="380.0" y2="275.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="245.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">3. Запит GET(POSITION) [14 B]</text>
<line x1="380.0" y1="295.0" x2="110.0" y2="320.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="245.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">4. Відповідь POSITION [40 B]</text>
<rect x="60.0" y="345.0" width="370.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="245.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="245.0" dy="0.0">Марнування каналу: подвійний трафік у радіоефірі,</tspan><tspan x="245.0" dy="13.7">напівдуплексні затримки TDD перемикання (30-80 мс RTT),</tspan><tspan x="245.0" dy="13.7">максимальна частота обмежена кількома герцами!</tspan></text>
<rect x="490.0" y="65.0" width="410.0" height="355.0" rx="8" fill="#fdfefe" stroke="#27ae60" stroke-width="1.5"/>
<text x="695.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Потокова підписка (Streaming)</text>
<rect x="510.0" y="115.0" width="100.0" height="30.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="560.0" y="133.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">GCS (Земля)</tspan></text>
<rect x="780.0" y="115.0" width="100.0" height="30.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.5"/><text x="830.0" y="133.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">БПЛА (Борт)</tspan></text>
<line x1="560.0" y1="165.0" x2="830.0" y2="185.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="695.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1. Одноразове налаштування частоти</text>
<line x1="830.0" y1="205.0" x2="560.0" y2="220.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="695.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">ATTITUDE (t = 0 мс)</text>
<line x1="830.0" y1="230.0" x2="560.0" y2="245.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="695.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">ATTITUDE (t = 20 мс)</text>
<line x1="830.0" y1="255.0" x2="560.0" y2="270.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="695.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">GLOBAL_POSITION (t = 50 мс)</text>
<line x1="830.0" y1="280.0" x2="560.0" y2="295.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="695.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">ATTITUDE (t = 40 мс)</text>
<line x1="830.0" y1="305.0" x2="560.0" y2="320.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="695.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">HEARTBEAT (t = 1000 мс)</text>
<rect x="510.0" y="345.0" width="370.0" height="60.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="695.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="695.0" dy="0.0">Ефективна утилізація: контролер шле дані сам за таймером,</tspan><tspan x="695.0" dy="13.7">вгору йдуть лише короткі команди керування,</tspan><tspan x="695.0" dy="13.7">частота оновлення телеметрії досягає 50 Гц!</tspan></text>
</svg>