<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1400" height="820" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дерево об'єктів інспектора: хто кого тримає і що сповіщає про зміну</text>
<rect x="80.0" y="86.0" width="540.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="123.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">MAVLinkInspectorController</tspan><tspan x="350.0" dy="20.8">зареєстрований як тип QML — створюється з QML</tspan></text>
<rect x="690.0" y="86.0" width="630.0" height="84.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="1005.0" y="115.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1005.0" dy="0.0">systemsChanged — з'явився або зник апарат</tspan><tspan x="1005.0" dy="16.9">activeSystemChanged — інший активний апарат</tspan><tspan x="1005.0" dy="16.9">timeScalesChanged, rangeListChanged — не спрацьовують ніколи</tspan></text>
<rect x="80.0" y="232.0" width="540.0" height="84.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="269.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">QGCMAVLinkSystem — апарат за sysid</tspan><tspan x="350.0" dy="20.8">типом QML НЕ зареєстрований</tspan></text>
<rect x="690.0" y="232.0" width="630.0" height="84.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="1005.0" y="270.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1005.0" dy="0.0">compIDsChanged — побачено новий компонент</tspan><tspan x="1005.0" dy="16.9">selectedChanged — вибрано інший рядок списку</tspan></text>
<rect x="80.0" y="378.0" width="540.0" height="84.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="415.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">QGCMAVLinkMessage — рядок списку</tspan><tspan x="350.0" dy="20.8">типом QML НЕ зареєстрований</tspan></text>
<rect x="690.0" y="378.0" width="630.0" height="84.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="1005.0" y="407.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1005.0" dy="0.0">countChanged — прийшов кадр (на КОЖЕН кадр)</tspan><tspan x="1005.0" dy="16.9">actualRateHzChanged — раз на секунду</tspan><tspan x="1005.0" dy="16.9">targetRateHzChanged, selectedChanged, fieldSelectedChanged</tspan></text>
<rect x="80.0" y="524.0" width="540.0" height="84.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="561.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">QGCMAVLinkMessageField — поле</tspan><tspan x="350.0" dy="20.8">типом QML НЕ зареєстрований</tspan></text>
<rect x="690.0" y="524.0" width="630.0" height="84.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="1005.0" y="553.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1005.0" dy="0.0">valueChanged — рядок значення став іншим</tspan><tspan x="1005.0" dy="16.9">seriesChanged — поле стало кривою або перестало нею бути</tspan><tspan x="1005.0" dy="16.9">selectableChanged — поле визнано невибірним</tspan></text>
<line x1="350.0" y1="170.0" x2="350.0" y2="232.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="368.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">systems : QmlObjectListModel   (CONSTANT)</text>
<line x1="350.0" y1="316.0" x2="350.0" y2="378.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="368.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">messages : QmlObjectListModel   (CONSTANT)</text>
<line x1="350.0" y1="462.0" x2="350.0" y2="524.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="368.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">fields : QmlObjectListModel   (CONSTANT)</text>
<rect x="690.0" y="640.0" width="630.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1005.0" y="675.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1005.0" dy="0.0">MAVLinkChartController — другий тип QML</tspan><tspan x="1005.0" dy="16.9">chartFields тримає ТІ САМІ об'єкти полів</tspan><tspan x="1005.0" dy="16.9">chartFieldsChanged, rangeX*/rangeY*Changed, plotPixelWidthChanged</tspan></text>
<line x1="620.0" y1="566.0" x2="1005.0" y2="640.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="640.0" width="540.0" height="96.0" rx="6" fill="#eaf7ef" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="674.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">Створити з QML можна лише два контролери.</tspan><tspan x="350.0" dy="18.2">Систему, рядок і поле беруть уже готовими —</tspan><tspan x="350.0" dy="18.2">через властивості й get(i) моделі.</tspan></text>
</svg>