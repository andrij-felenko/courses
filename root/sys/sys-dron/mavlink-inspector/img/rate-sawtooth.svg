<rect x="150.0" y="500.0" width="480.0" height="130.0" rx="6" fill="#fdf3e7" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="541.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Пік дорівнює 0.8 незалежно від справжньої частоти:</tspan><tspan x="390.0" dy="19.5">один кадр у порожньому такті дає 0.8·1. Так само</tspan><tspan x="390.0" dy="19.5">стрибне і рядок, що приходить раз на хвилину.</tspan><tspan x="390.0" dy="19.5">Різницю несе лише те, ЯК ЧАСТО спалахує пік.</tspan></text>
