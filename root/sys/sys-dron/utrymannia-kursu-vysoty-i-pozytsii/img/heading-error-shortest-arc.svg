<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Утримання курсу: обчислення найкоротшої дуги на колі S¹</text>
<circle cx="210.0" cy="160.0" r="95.0" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="100.0" y1="160.0" x2="320.0" y2="160.0" stroke="#cbd5e1" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="210.0" y1="50.0" x2="210.0" y2="270.0" stroke="#cbd5e1" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="210.0" y="59.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">0° / Північ</text>
<text x="329.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">+90° (Схід)</text>
<text x="210.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">±180° (Розрив)</text>
<text x="91.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">-90° (Захід)</text>
<line x1="210.0" y1="160.0" x2="226.5" y2="253.6" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="241.5" y="261.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">ψ_meas (+170°)</text>
<line x1="210.0" y1="160.0" x2="193.5" y2="253.6" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="178.5" y="261.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">ψ_target (-170°)</text>
<circle cx="210.0" cy="255.0" r="12.0" fill="#fef3c7" stroke="#c0392b" stroke-width="1.5"/>
<text x="210.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">20°</text>
<rect x="440.0" y="55.0" width="395.0" height="220.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="637.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка наївного віднімання кутів</text>
<rect x="460.0" y="98.0" width="355.0" height="62.0" rx="5" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="475.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Наївне віднімання: e = ψ_target - ψ_meas</text>
<text x="475.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">e = -170° - (+170°) = -340°</text>
<text x="475.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-style="italic">✖ Дрон робить майже повний розворот (unwinding)</text>
<rect x="460.0" y="172.0" width="355.0" height="88.0" rx="5" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="475.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Нормалізація на S¹ (найкоротша дуга):</text>
<text x="475.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">e_yaw = atan2(sin(Δψ), cos(Δψ))</text>
<text x="475.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">e_yaw = wrap_pi(-340°) = +20°</text>
<text x="475.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-style="italic">✔ Короткий доворот на 20° через нульовий розрив</text>
</svg>