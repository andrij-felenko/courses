<rect x="36.0" y="470.0" width="1288.0" height="104.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="501.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Розширені поля mission_type й opaque_id додали до повідомлень уже після появи MAVLink 2.</tspan><tspan x="680.0" dy="16.9">Кадр MAVLink 1 їх не везе взагалі, а MAVLink 2 обрізає нульовий хвіст тіла перед відправленням.</tspan><tspan x="680.0" dy="16.9">Приймач добиває коротке тіло нулями — тож «поля немає» і «поле дорівнює нулю» на дроті нерозрізненні,</tspan><tspan x="680.0" dy="16.9">а нуль у mission_type означає «місія».</tspan></text>
