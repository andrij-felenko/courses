<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="720" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що з чим пов'язують два імені власної групи налаштувань</text>
<rect x="143.2" y="90.6" width="313.6" height="78.8" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/><text x="300.0" y="117.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">РЕСУРС ІЗ МЕТАДАНИМИ</tspan><tspan x="300.0" dy="16.9">:/json/Payload.SettingsGroup.json</tspan><tspan x="300.0" dy="16.9">тип · межі · одиниці · підпис · типове</tspan></text>
<rect x="786.9" y="90.6" width="306.2" height="78.8" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/><text x="940.0" y="117.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">СХОВИЩЕ НА ДИСКУ</tspan><tspan x="940.0" dy="16.9">QGroundControl.ini → [PayloadPlanner]</tspan><tspan x="940.0" dy="16.9">лише ключі, яких хтось торкався</tspan></text>
<rect x="409.3" y="310.1" width="421.3" height="99.7" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.4"/><text x="620.0" y="339.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">class PayloadSettings : public SettingsGroup</tspan><tspan x="620.0" dy="16.9">DECLARE_SETTINGGROUP(Payload, &quot;PayloadPlanner&quot;)</tspan><tspan x="620.0" dy="16.9">DEFINE_SETTINGFACT(triggerInterval)</tspan><tspan x="620.0" dy="16.9">у SettingsManager::init(): new PayloadSettings(this)</tspan></text>
<rect x="145.2" y="562.6" width="309.6" height="74.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="587.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">З КОДУ C++</tspan><tspan x="300.0" dy="16.9">SettingsManager::instance()</tspan><tspan x="300.0" dy="16.9">-&gt;payloadSettings()-&gt;triggerInterval()</tspan></text>
<rect x="807.4" y="562.6" width="265.1" height="74.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="940.0" y="587.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">З QML</tspan><tspan x="940.0" dy="16.9">QGroundControl.settingsManager</tspan><tspan x="940.0" dy="16.9">.payloadSettings.triggerInterval</tspan></text>
<line x1="420.0" y1="169.0" x2="540.0" y2="300.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="310.0" x2="930.0" y2="178.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="520.0" y1="414.0" x2="320.0" y2="559.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="720.0" y1="414.0" x2="920.0" y2="559.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="430.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end">немає ключа → exit(-1) при першому доступі</text>
<text x="468.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end">ім'я «Payload» → який JSON</text>
<text x="468.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end">читати при створенні групи</text>
<text x="838.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">значення: читає при народженні,</text>
<text x="838.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">пише при кожній зміні</text>
<text x="620.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">факт народжується при першому доступі —</text>
<text x="620.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">і тут-таки читає своє значення з диска</text>
<text x="620.0" y="690.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">два імені в одному рядку оголошення ведуть у два різні світи: ліве — у ресурс збірки, праве — у файл на диску</text>
</svg>