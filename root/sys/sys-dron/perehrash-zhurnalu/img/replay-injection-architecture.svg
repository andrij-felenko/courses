<rect x="545.0" y="205.0" width="410.0" height="60.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="231.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Модуль Replay Engine &amp; Віртуальний годинник</tspan><tspan x="750.0" dy="14.3">Пріоритетна черга за timestamp, дискретний Simulated Time</tspan></text>
