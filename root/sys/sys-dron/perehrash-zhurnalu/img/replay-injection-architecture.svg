<rect x="545.0" y="295.0" width="410.0" height="65.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Віртуальна шина повідомлень SITL</tspan><tspan x="750.0" dy="13.0">[Драйвери апаратних сенсорів ВИМКНЕНО]</tspan><tspan x="750.0" dy="13.0">Підміна вхідних потоків даними з логу з точним таймінгом</tspan></text>
