<rect x="390.0" y="176.0" width="490.0" height="116.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="635.0" y="220.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">1/1 — автопілот</tspan><tspan x="635.0" dy="18.2">1/100 — камера</tspan><tspan x="635.0" dy="18.2">1/154 — підвіс</tspan></text>
<rect x="910.0" y="176.0" width="350.0" height="116.0" rx="6" fill="#e6f6ec" stroke="#27ae60" stroke-width="2.2"/><text x="1085.0" y="229.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1085.0" dy="0.0">ТАК</tspan><tspan x="1085.0" dy="18.2">систему 1 звідси чути</tspan></text>
<rect x="60.0" y="316.0" width="300.0" height="116.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="369.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">UDP</tspan><tspan x="210.0" dy="18.2">до наземної станції</tspan></text>
<rect x="390.0" y="316.0" width="490.0" height="116.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="635.0" y="378.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">255/190 — QGroundControl</tspan></text>
<rect x="910.0" y="316.0" width="350.0" height="116.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="1085.0" y="369.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1085.0" dy="0.0">НІ</tspan><tspan x="1085.0" dy="18.2">звідси кадр і прийшов</tspan></text>
<rect x="60.0" y="456.0" width="300.0" height="116.0" rx="6" fill="#eef2f6" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="509.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">TCP</tspan><tspan x="210.0" dy="18.2">до бортового логера</tspan></text>
<rect x="390.0" y="456.0" width="490.0" height="116.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="635.0" y="518.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">порожньо: жодного кадру ще не було</tspan></text>
<rect x="910.0" y="456.0" width="350.0" height="116.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="1085.0" y="509.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1085.0" dy="0.0">НІ</tspan><tspan x="1085.0" dy="18.2">системи 1 звідти не чули</tspan></text>
<text x="660.0" y="616.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">жодних оголошень і жодного протоколу маршрутизації: рядок з'являється тоді, коли на каналі почули цю пару чисел</text>
