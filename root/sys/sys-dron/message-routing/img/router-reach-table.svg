<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 660" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1320" height="660" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Таблиця досяжності: її ніхто не налаштовує — вона намацується з трафіку</text>
<rect x="390.0" y="62.0" width="540.0" height="50.0" rx="6" fill="#e6f6ec" stroke="#27ae60" stroke-width="2.4"/><text x="660.0" y="91.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">кадр COMMAND_LONG:  від 255/190,  адресовано 1/1</tspan></text>
<text x="210.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">канал</text>
<text x="635.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">кого чули на цьому каналі (sysid/compid)</text>
<text x="1085.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">слати цей кадр сюди?</text>
