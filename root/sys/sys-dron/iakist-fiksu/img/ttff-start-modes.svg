<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія часу до першого визначення координат (TTFF)</text>
<rect x="40.0" y="60.0" width="780.0" height="80.0" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
<text x="55.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b91c1c" text-anchor="start" font-weight="700">Холодний старт (Cold Start): 30–60 с</text>
<text x="55.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Немає альманаху, ефемерид, часу й координат. Повний перебір супутників.</text>
<rect x="55.0" y="106.0" width="180.0" height="24.0" rx="3" fill="#fca5a5" stroke="#ffffff" stroke-width="1.0"/>
<text x="145.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Пошук сітки: частота Доплера ±10 кГц, фаза PRN</text>
<rect x="240.0" y="106.0" width="145.0" height="24.0" rx="3" fill="#f87171" stroke="#ffffff" stroke-width="1.0"/>
<text x="312.5" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Захоплення несучої та кадрова синхронізація</text>
<rect x="390.0" y="106.0" width="265.0" height="24.0" rx="3" fill="#ef4444" stroke="#ffffff" stroke-width="1.0"/>
<text x="522.5" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Вичитування ефемерид (субкадри 1–3: 18–30 с)</text>
<rect x="660.0" y="106.0" width="155.0" height="24.0" rx="3" fill="#dc2626" stroke="#ffffff" stroke-width="1.0"/>
<text x="737.5" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Обчислення 3D Fix</text>
<rect x="40.0" y="150.0" width="780.0" height="80.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
<text x="55.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="start" font-weight="700">Теплий старт (Warm Start): 15–30 с</text>
<text x="55.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Є альманах і приблизний час RTC. Потрібно завантажити свіжі ефемериди.</text>
<rect x="55.0" y="196.0" width="240.0" height="24.0" rx="3" fill="#fde68a" stroke="#ffffff" stroke-width="1.0"/>
<text x="175.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цільовий пошук відомих супутників (альманах у NVRAM)</text>
<rect x="300.0" y="196.0" width="355.0" height="24.0" rx="3" fill="#f59e0b" stroke="#ffffff" stroke-width="1.0"/>
<text x="477.5" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Завантаження свіжих ефемерид із субкадрів 1–3</text>
<rect x="660.0" y="196.0" width="155.0" height="24.0" rx="3" fill="#d97706" stroke="#ffffff" stroke-width="1.0"/>
<text x="737.5" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">3D Fix</text>
<rect x="40.0" y="240.0" width="780.0" height="80.0" rx="6" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
<text x="55.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="start" font-weight="700">Гарячий старт (Hot Start): 1–3 с</text>
<text x="55.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Є все: валідні ефемериди (&lt;2 год), точний RTC-час та координати.</text>
<rect x="55.0" y="286.0" width="360.0" height="24.0" rx="3" fill="#86efac" stroke="#ffffff" stroke-width="1.0"/>
<text x="235.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Миттєве захоплення частот і кодів</text>
<rect x="420.0" y="286.0" width="395.0" height="24.0" rx="3" fill="#22c55e" stroke="#ffffff" stroke-width="1.0"/>
<text x="617.5" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">3D Fix</text>
<rect x="40.0" y="330.0" width="780.0" height="80.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
<text x="55.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="start" font-weight="700">A-GNSS (Assisted GNSS через IP/LTE/MAVLink): 1–2 с</text>
<text x="55.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Ефемериди передаються через стільниковий зв'язок або наземну станцію QGC.</text>
<rect x="55.0" y="376.0" width="480.0" height="24.0" rx="3" fill="#93c5fd" stroke="#ffffff" stroke-width="1.0"/>
<text x="295.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Ін'єкція ефемерид та часу через інтернет/радіоканал</text>
<rect x="540.0" y="376.0" width="275.0" height="24.0" rx="3" fill="#3b82f6" stroke="#ffffff" stroke-width="1.0"/>
<text x="677.5" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">Миттєвий 3D Fix</text>
</svg>