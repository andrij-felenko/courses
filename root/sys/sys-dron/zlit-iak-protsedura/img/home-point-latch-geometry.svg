<text x="440.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Home Point жорстко прив'язує нуль локальної системи координат NED та нуль відносної висоти</text>
