<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<line x1="430.0" y1="20.0" x2="430.0" y2="410.0" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="43.8" y="18.5" width="342.4" height="33.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="215.0" y="39.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Топологія SE(2) = ℝ² × S¹ (дрон / ровер)</tspan></text>
<text x="215.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Циліндричний простір: періодичність кута θ ∈ [−π, π)</text>
<rect x="60.0" y="95.0" width="310.0" height="220.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="80.0" y="235.0" width="270.0" height="60.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="95.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">θ = −π/2</text>
<polygon points="190,265 240,250 250,280 200,285" fill="#fecaca" stroke="#c0392b" stroke-width="1.2"/>
<rect x="80.0" y="165.0" width="270.0" height="60.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="95.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">θ = 0</text>
<polygon points="180,185 245,185 245,215 180,215" fill="#fecaca" stroke="#c0392b" stroke-width="1.2"/>
<rect x="80.0" y="105.0" width="270.0" height="60.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="95.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">θ = +π/2</text>
<polygon points="195,115 225,115 235,155 205,155" fill="#fecaca" stroke="#c0392b" stroke-width="1.2"/>
<line x1="360.0" y1="115.0" x2="380.0" y2="115.0" stroke="#2457d6" stroke-width="1.5"/>
<line x1="380.0" y1="115.0" x2="380.0" y2="285.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
<line x1="380.0" y1="285.0" x2="360.0" y2="285.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="385.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Замикання: +π ≡ −π</text>
<rect x="60.0" y="330.0" width="310.0" height="75.0" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/><text x="215.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Метрика з урахуванням періодичності:</tspan><tspan x="215.0" dy="13.0">d_S1(θ₁, θ₂) = min(|θ₁ − θ₂|, 2π − |θ₁ − θ₂|)</tspan><tspan x="215.0" dy="13.0">d_SE2 = √(w_xy · Δp² + w_θ · d_S1²)</tspan></text>
<rect x="457.7" y="18.5" width="374.6" height="33.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="645.0" y="39.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">Топологія тора T² = S¹ × S¹ (маніпулятор 2R)</tspan></text>
<text x="645.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Розгортка тора на площину кутів зчленувань (θ₁, θ₂)</text>
<rect x="490.0" y="95.0" width="220.0" height="220.0" rx="4" fill="#f8fafc" stroke="#333333" stroke-width="1.8"/>
<line x1="490.0" y1="205.0" x2="710.0" y2="205.0" stroke="#94a3b8" stroke-width="1.0" stroke-dasharray="2,2"/>
<line x1="600.0" y1="95.0" x2="600.0" y2="315.0" stroke="#94a3b8" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="600.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">θ₁ ∈ [−π, π)</text>
<text x="475.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">θ₂</text>
<line x1="540.0" y1="95.0" x2="660.0" y2="95.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="540.0" y1="315.0" x2="660.0" y2="315.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="490.0" y1="260.0" x2="490.0" y2="150.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="710.0" y1="260.0" x2="710.0" y2="150.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<path d="M 490,140 Q 530,150 560,180 Q 540,210 490,200 Z" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<path d="M 710,140 Q 670,150 640,180 Q 660,210 710,200 Z" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="600.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">C_obs</text>
<line x1="520.0" y1="270.0" x2="490.0" y2="250.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="710.0" y1="250.0" x2="660.0" y2="230.0" stroke="#27ae60" stroke-width="2.0"/>
<circle cx="520.0" cy="270.0" r="3.5" fill="#27ae60" stroke="none" stroke-width="1.5"/>
<circle cx="660.0" cy="230.0" r="3.5" fill="#27ae60" stroke="none" stroke-width="1.5"/>
<text x="725.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">Перехід межі</text>
<rect x="490.0" y="345.0" width="310.0" height="60.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="645.0" y="365.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">Топологічні властивості тора:</tspan><tspan x="645.0" dy="13.0">Траєкторія, перетинаючи праву межу θ₁=+π,</tspan><tspan x="645.0" dy="13.0">безперервно продовжується з лівої межі θ₁=−π</tspan></text>
</svg>