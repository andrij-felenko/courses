<text x="440.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">2. Подвійна різниця ∇ΔΦ_BR^jk: повністю скасовує похибки годинників обох приймачів (δt_R та δt_B)</text>
