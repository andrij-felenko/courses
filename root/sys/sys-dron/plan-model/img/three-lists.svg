<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 680" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1220" height="680" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три списки на борту, розрізнені одним байтом типу</text>
<rect x="304.9" y="65.9" width="610.2" height="52.2" rx="6" fill="#fffbea" stroke="#b8860b" stroke-width="1.5"/><text x="610.0" y="87.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">один протокол місій, один канал:</tspan><tspan x="610.0" dy="18.2">MISSION_COUNT · MISSION_REQUEST_INT · MISSION_ITEM_INT · MISSION_ACK</tspan></text>
<line x1="220.0" y1="132.0" x2="220.0" y2="202.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="210.0" width="340.0" height="340.0" rx="10" fill="#eef4fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="220.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="middle" font-weight="700">Маршрут</text>
<text x="220.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">тип місії 0</text>
<text x="220.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">«зроби це, потім те»</text>
<text x="220.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">читає навігатор</text>
<text x="220.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">послідовно, крок за кроком</text>
<text x="220.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">порядок = сам зміст</text>
<text x="220.0" y="508.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">живе один політ</text>
<line x1="610.0" y1="132.0" x2="610.0" y2="202.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="440.0" y="210.0" width="340.0" height="340.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="610.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">Геозона</text>
<text x="610.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">тип місії 1</text>
<text x="610.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">«сюди ніколи не заходь»</text>
<text x="610.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">читає сторож безпеки</text>
<text x="610.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">щоцикла, десятки разів</text>
<text x="610.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">порядок нічого не значить</text>
<text x="610.0" y="508.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">живе тижнями</text>
<line x1="1000.0" y1="132.0" x2="1000.0" y2="202.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="830.0" y="210.0" width="340.0" height="340.0" rx="10" fill="#fbf1ee" stroke="#c0392b" stroke-width="2.0"/>
<text x="1000.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">Точки збору</text>
<text x="1000.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">тип місії 2</text>
<text x="1000.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">«якщо біда — сюди»</text>
<text x="1000.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">читає логіка відмови</text>
<text x="1000.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">один раз, у мить рішення</text>
<text x="1000.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">точки рівноправні</text>
<text x="1000.0" y="508.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">живе місяцями</text>
<rect x="396.5" y="589.9" width="427.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="610.0" y="611.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Списки незалежні: заміна маршруту не чіпає геозони,</tspan><tspan x="610.0" dy="18.2">а стирання геозони не чіпає точок збору</tspan></text>
</svg>