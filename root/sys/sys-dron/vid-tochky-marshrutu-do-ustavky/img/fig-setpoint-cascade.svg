<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 775.5 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="775.5" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Місце генератора траєкторії в каскадному контурі керування</text>
<rect x="14.8" y="70.2" width="190.5" height="59.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="110.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Список точок місії</tspan><tspan x="110.0" dy="14.3">(WP₁, WP₂, WP₃...)</tspan><tspan x="110.0" dy="14.3">Низька частота (0.1–1 Гц)</tspan></text>
<line x1="195.0" y1="100.0" x2="245.0" y2="100.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="220.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">точки</text>
<rect x="242.3" y="61.0" width="235.4" height="77.9" rx="6" fill="#f2f9f4" stroke="#27ae60" stroke-width="2.0"/><text x="360.0" y="82.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Генератор траєкторії</tspan><tspan x="360.0" dy="14.3">• Зрізання кутів (дуги / Безьє)</tspan><tspan x="360.0" dy="14.3">• S-криві швидкості</tspan><tspan x="360.0" dy="14.3">• Висока частота (50–250 Гц)</tspan></text>
<line x1="475.0" y1="100.0" x2="555.0" y2="100.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="515.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Уставка щотакту:</text>
<text x="515.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">p_sp (позиція)</text>
<text x="515.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">v_ff (швидкість)</text>
<text x="515.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">a_ff (прискорення)</text>
<rect x="551.3" y="70.2" width="197.3" height="59.6" rx="6" fill="#fdfaf2" stroke="#1a1a1a" stroke-width="1.5"/><text x="650.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Контур позиції</tspan><tspan x="650.0" dy="14.3">(P-регулятор)</tspan><tspan x="650.0" dy="14.3">v_target = v_ff + Kp·e_pos</tspan></text>
<line x1="650.0" y1="150.0" x2="650.0" y2="210.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="665.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">v_target</text>
<rect x="544.5" y="230.2" width="211.0" height="59.6" rx="6" fill="#fdfaf2" stroke="#1a1a1a" stroke-width="1.5"/><text x="650.0" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Контур швидкості</tspan><tspan x="650.0" dy="14.3">(PID + a_ff feedforward)</tspan><tspan x="650.0" dy="14.3">a_target = a_ff + PID(e_vel)</tspan></text>
<line x1="550.0" y1="260.0" x2="450.0" y2="260.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">a_target + g</text>
<rect x="227.7" y="230.2" width="224.6" height="59.6" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="340.0" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">Перерахунок у тягу й кути</tspan><tspan x="340.0" dy="14.3">Roll, Pitch = f(a_target, yaw)</tspan><tspan x="340.0" dy="14.3">Thrust = m · ||a_target − g||</tspan></text>
<line x1="230.0" y1="260.0" x2="160.0" y2="260.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="25.4" y="230.2" width="129.1" height="59.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="90.0" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">Кутові швидкості</tspan><tspan x="90.0" dy="14.3">й мікшер моторів</tspan><tspan x="90.0" dy="14.3">(500–1000 Гц)</tspan></text>
<rect x="110.8" y="335.2" width="538.3" height="59.6" rx="6" fill="#f2f9f4" stroke="#27ae60" stroke-width="1.4"/><text x="380.0" y="354.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Чому потрібен прямий канал (Feedforward):</tspan><tspan x="380.0" dy="14.3">Пряма передача v_ff та a_ff ліквідує фазове запізнення в каскаді,</tspan><tspan x="380.0" dy="14.3">дозволяючи дрону летіти точно по гладкій кривій без відставання на динаміці.</tspan></text>
</svg>