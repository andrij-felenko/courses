<rect x="650.0" y="250.0" width="160.0" height="60.0" rx="6" fill="#fef08a" stroke="#333333" stroke-width="1.8"/><text x="730.0" y="276.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">BURST_STREAMING</tspan><tspan x="730.0" dy="14.3">(Прийом пакетів Burst)</tspan></text>
