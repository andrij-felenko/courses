<text x="75.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ACK / Reset</text>
<rect x="55.0" y="410.0" width="750.0" height="65.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="430.0" y="439.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Гарантії надійності: клієнт веде лічильник спроб (зазвичай до 3-5 повторів з таймаутом 500-1000 мс).</tspan><tspan x="430.0" dy="14.3">У разі збою автопілот скидає неактивні сесії за таймаутом бездіяльності (inactivity timeout ≈ 2-5 с).</tspan></text>
