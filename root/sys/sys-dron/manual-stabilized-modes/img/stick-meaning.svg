<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий рух стіка — три різні смисли</text>
<rect x="30.0" y="60.0" width="230.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="145.0" y="81.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">РУЧНИЙ (manual)</tspan></text>
<rect x="280.0" y="60.0" width="230.0" height="34.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/><text x="395.0" y="81.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">КУТ. ШВИДКІСТЬ (rate)</tspan></text>
<rect x="530.0" y="60.0" width="230.0" height="34.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/><text x="645.0" y="81.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">КУТ (angle)</tspan></text>
<text x="30.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">стік відхилено вперед:</text>
<rect x="30.0" y="120.0" width="230.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="145.0" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">серво/мотор</tspan><tspan x="145.0" dy="16.9">відхиляється</tspan><tspan x="145.0" dy="16.9">на фіксовану</tspan><tspan x="145.0" dy="16.9">величину</tspan></text>
<rect x="280.0" y="120.0" width="230.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="395.0" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">апарат</tspan><tspan x="395.0" dy="16.9">обертається</tspan><tspan x="395.0" dy="16.9">з певною</tspan><tspan x="395.0" dy="16.9">швидкістю (°/с)</tspan></text>
<rect x="530.0" y="120.0" width="230.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="645.0" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">апарат</tspan><tspan x="645.0" dy="16.9">нахиляється</tspan><tspan x="645.0" dy="16.9">на певний</tspan><tspan x="645.0" dy="16.9">кут (°)</tspan></text>
<text x="30.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">стік відпущено (центр):</text>
<rect x="30.0" y="240.0" width="230.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="145.0" y="264.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">керма</tspan><tspan x="145.0" dy="16.9">повертаються</tspan><tspan x="145.0" dy="16.9">в нейтраль —</tspan><tspan x="145.0" dy="16.9">кут «пливе»</tspan></text>
<rect x="280.0" y="240.0" width="230.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="395.0" y="264.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">обертання</tspan><tspan x="395.0" dy="16.9">спиняється,</tspan><tspan x="395.0" dy="16.9">апарат ЗАВМИРАЄ</tspan><tspan x="395.0" dy="16.9">у поточному куті</tspan></text>
<rect x="530.0" y="240.0" width="230.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="645.0" y="264.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="645.0" dy="0.0">апарат САМ</tspan><tspan x="645.0" dy="16.9">вирівнюється</tspan><tspan x="645.0" dy="16.9">в горизонт</tspan><tspan x="645.0" dy="16.9">(кут = 0)</tspan></text>
<rect x="30.0" y="348.0" width="230.0" height="30.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="145.0" y="367.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">тримає ПІЛОТ</tspan></text>
<rect x="280.0" y="348.0" width="230.0" height="30.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="395.0" y="367.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">тримає ПІЛОТ</tspan></text>
