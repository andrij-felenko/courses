<text x="63.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="100.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">Утримання висоти</text>
<text x="100.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">сам тримає висоту</text>
<text x="666.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-style="italic">+ барометр</text>
<line x1="660.0" y1="368.0" x2="660.0" y2="380.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="380.0" width="640.0" height="68.0" rx="8" fill="#ffffff" stroke="#8e44ad" stroke-width="2.0"/>
<rect x="40.0" y="380.0" width="46.0" height="68.0" rx="8" fill="#8e44ad" stroke="#8e44ad" stroke-width="0.0"/>
<text x="63.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<text x="100.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#8e44ad" text-anchor="start" font-weight="700">Утримання позиції</text>
<text x="100.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">сам висить на місці</text>
<text x="666.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-style="italic">+ GNSS (супутники)</text>
<text x="20.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">менше</text>
<text x="20.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">більше</text>
