<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Асинхронний мережевий I/O та механізм зворотного тиску (Backpressure)</text>
<rect x="30.0" y="55.0" width="800.0" height="75.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="160.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Корутина застосунку (Writer)</text>
<rect x="280.0" y="68.0" width="250.0" height="50.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="405.0" y="89.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">writer.write(chunk)</tspan><tspan x="405.0" dy="14.3">(Неблокувальний запис у буфер)</tspan></text>
<rect x="560.0" y="68.0" width="250.0" height="50.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="685.0" y="89.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">await writer.drain()</tspan><tspan x="685.0" dy="14.3">(Очікування звільнення буфера)</tspan></text>
<rect x="30.0" y="150.0" width="800.0" height="160.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="430.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Внутрішній буфер передачі (asyncio.Transport)</text>
<rect x="60.0" y="195.0" width="740.0" height="35.0" rx="4" fill="#f1f5f9" stroke="#333333" stroke-width="1.5"/>
<rect x="60.0" y="195.0" width="480.0" height="35.0" rx="4" fill="#fed7aa" stroke="#c0392b" stroke-width="1.5"/>
<text x="150.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дані в черзі сокета</text>
<line x1="240.0" y1="185.0" x2="240.0" y2="240.0" stroke="#27ae60" stroke-width="2.0" stroke-dasharray="4,3"/>
<text x="240.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">low_water (16 КБ)</text>
<line x1="520.0" y1="185.0" x2="520.0" y2="240.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4,3"/>
<text x="520.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">high_water (64 КБ)</text>
<rect x="60.0" y="270.0" width="740.0" height="30.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="430.0" y="288.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Поточний розмір &gt; high_water: protocol.pause_writing() переводить drain() в очікування PENDING</tspan></text>
<rect x="30.0" y="330.0" width="800.0" height="105.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="150.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Ядро ОС (Системні виклики)</text>
<rect x="280.0" y="350.0" width="250.0" height="65.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="405.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">Системний сокетний буфер SO_SNDBUF</tspan><tspan x="405.0" dy="13.0">Відправка пакетів через TCP стек</tspan><tspan x="405.0" dy="13.0">в мережевий інтерфейс (NIC)</tspan></text>
<rect x="560.0" y="350.0" width="250.0" height="65.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="685.0" y="368.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Звільнення буфера нижче low_water:</tspan><tspan x="685.0" dy="11.7">protocol.resume_writing()</tspan><tspan x="685.0" dy="11.7">Встановлює результат waiter.set_result(None)</tspan><tspan x="685.0" dy="11.7">Корутина виходить з await drain()</tspan></text>
<line x1="405.0" y1="118.0" x2="405.0" y2="150.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="405.0" y1="310.0" x2="405.0" y2="330.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="685.0" y1="350.0" x2="685.0" y2="118.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>