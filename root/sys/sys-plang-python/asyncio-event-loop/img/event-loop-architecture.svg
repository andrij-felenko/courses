<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура циклу подій asyncio та цикл ітерації _run_once()</text>
<rect x="30.0" y="55.0" width="250.0" height="185.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="155.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Черга таймерів (_scheduled)</text>
<rect x="45.0" y="95.0" width="220.0" height="130.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="155.0" y="135.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Бінарна мін-купа (heapq)</tspan><tspan x="155.0" dy="14.3">• Об'єкти TimerHandle</tspan><tspan x="155.0" dy="14.3">• Впорядковані за міткою when</tspan><tspan x="155.0" dy="14.3">• loop.call_later() / call_at()</tspan><tspan x="155.0" dy="14.3">• Вершина: найближчий дедлайн</tspan></text>
<rect x="580.0" y="55.0" width="250.0" height="185.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="705.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Черга готових дій (_ready)</text>
<rect x="595.0" y="95.0" width="220.0" height="130.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="705.0" y="137.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Двобічна черга (collections.deque)</tspan><tspan x="705.0" dy="13.0">• Об'єкти Handle</tspan><tspan x="705.0" dy="13.0">• loop.call_soon() / Task._step</tspan><tspan x="705.0" dy="13.0">• Колбеки I/O та готові таймери</tspan><tspan x="705.0" dy="13.0">• FIFO виконання без затримок</tspan></text>
<rect x="300.0" y="55.0" width="260.0" height="185.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="430.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Селектор системних подій</text>
<rect x="315.0" y="95.0" width="230.0" height="130.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">selectors.DefaultSelector</tspan><tspan x="430.0" dy="14.3">• epoll (Linux) / kqueue (macOS)</tspan><tspan x="430.0" dy="14.3">• IOCP (Windows Proactor)</tspan><tspan x="430.0" dy="14.3">• Розрахунок таймауту:</tspan><tspan x="430.0" dy="14.3">timeout = min(when - now, max)</tspan><tspan x="430.0" dy="14.3">• selector.select(timeout)</tspan></text>
<rect x="30.0" y="275.0" width="800.0" height="215.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="430.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність виконання однієї ітерації: BaseEventLoop._run_once()</text>
<rect x="45.0" y="315.0" width="175.0" height="155.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="132.5" y="360.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="132.5" dy="0.0">Крок 1: Оцінка часу</tspan><tspan x="132.5" dy="11.7"></tspan><tspan x="132.5" dy="11.7">• Перевірка вершини купи</tspan><tspan x="132.5" dy="11.7">  _scheduled[0].when</tspan><tspan x="132.5" dy="11.7">• Якщо _ready не порожня,</tspan><tspan x="132.5" dy="11.7">  timeout = 0</tspan><tspan x="132.5" dy="11.7">• Інакше timeout = time_to_next</tspan></text>
<rect x="240.0" y="315.0" width="175.0" height="155.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="327.5" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="327.5" dy="0.0">Крок 2: Селектор</tspan><tspan x="327.5" dy="13.0"></tspan><tspan x="327.5" dy="13.0">• Виклик ОС select(timeout)</tspan><tspan x="327.5" dy="13.0">• Отримання подій сокетів</tspan><tspan x="327.5" dy="13.0">• Перетворення подій</tspan><tspan x="327.5" dy="13.0">  (EVENT_READ/WRITE)</tspan><tspan x="327.5" dy="13.0">  на виклики колбеків</tspan></text>
<rect x="435.0" y="315.0" width="180.0" height="155.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="525.0" y="360.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">Крок 3: Перенесення</tspan><tspan x="525.0" dy="11.7"></tspan><tspan x="525.0" dy="11.7">• Зсув дозрілих таймерів</tspan><tspan x="525.0" dy="11.7">  з _scheduled у _ready</tspan><tspan x="525.0" dy="11.7">• Додавання сокетних</tspan><tspan x="525.0" dy="11.7">  обробників у кінець _ready</tspan><tspan x="525.0" dy="11.7">• Скасовані Handle фільтруються</tspan></text>
<rect x="635.0" y="315.0" width="180.0" height="155.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="725.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Крок 4: Виконання пачки</tspan><tspan x="725.0" dy="13.0"></tspan><tspan x="725.0" dy="13.0">• ntasks = len(_ready)</tspan><tspan x="725.0" dy="13.0">• Вилучення ntasks елементів</tspan><tspan x="725.0" dy="13.0">• Виконання handle._run()</tspan><tspan x="725.0" dy="13.0">• Вивільнення контексту для</tspan><tspan x="725.0" dy="13.0">  наступного циклу</tspan></text>
