<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Взаємодія Coroutine, Task та Future у потоці керування</text>
<rect x="30.0" y="55.0" width="245.0" height="395.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="152.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Coroutine (PyCoroObject)</text>
<rect x="45.0" y="100.0" width="215.0" height="80.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="152.5" y="122.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="152.5" dy="0.0">Генераторний фрейм CPython</tspan><tspan x="152.5" dy="14.3">• Локальні змінні та стек</tspan><tspan x="152.5" dy="14.3">• Поточний байткод-офсет</tspan><tspan x="152.5" dy="14.3">• Інструкція await виклику</tspan></text>
<rect x="45.0" y="195.0" width="215.0" height="105.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="152.5" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="152.5" dy="0.0">Стани корутини:</tspan><tspan x="152.5" dy="13.0">• CORO_CREATED (створена)</tspan><tspan x="152.5" dy="13.0">• CORO_RUNNING (виконується)</tspan><tspan x="152.5" dy="13.0">• CORO_SUSPENDED (призупинена)</tspan><tspan x="152.5" dy="13.0">• CORO_CLOSED (завершена)</tspan></text>
<rect x="45.0" y="315.0" width="215.0" height="115.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="152.5" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="152.5" dy="0.0">Інструкція await:</tspan><tspan x="152.5" dy="13.0">1. Отримує об'єкт-awaitable</tspan><tspan x="152.5" dy="13.0">2. Викликає __await__()</tspan><tspan x="152.5" dy="13.0">3. Зупиняється через YIELD_VALUE</tspan><tspan x="152.5" dy="13.0">4. Повертає очікуваний Future</tspan></text>
<rect x="305.0" y="55.0" width="250.0" height="395.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="430.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">asyncio.Task (Керівний рушій)</text>
<rect x="320.0" y="100.0" width="220.0" height="80.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Обгортка корутини</tspan><tspan x="430.0" dy="13.0">• Успадковує asyncio.Future</tspan><tspan x="430.0" dy="13.0">• Зберігає посилання на _coro</tspan><tspan x="430.0" dy="13.0">• Зареєстрована в Task.all_tasks()</tspan></text>
<rect x="320.0" y="195.0" width="220.0" height="120.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="228.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Метод Task._step(val):</tspan><tspan x="430.0" dy="11.7">1. coro.send(val) відновлює код</tspan><tspan x="430.0" dy="11.7">2. Якщо корутина повернула значення:</tspan><tspan x="430.0" dy="11.7">   set_result() завершує Task</tspan><tspan x="430.0" dy="11.7">3. Якщо yield-нула Future:</tspan><tspan x="430.0" dy="11.7">   fut.add_done_callback(_wakeup)</tspan></text>
<rect x="320.0" y="330.0" width="220.0" height="100.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Метод Task._wakeup(fut):</tspan><tspan x="430.0" dy="13.0">• Отримує результат fut.result()</tspan><tspan x="430.0" dy="13.0">• loop.call_soon(self._step, res)</tspan><tspan x="430.0" dy="13.0">• Планує наступне просування</tspan></text>
<rect x="585.0" y="55.0" width="245.0" height="395.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="707.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">asyncio.Future (Контейнер результату)</text>
<rect x="600.0" y="100.0" width="215.0" height="80.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="707.5" y="125.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="707.5" dy="0.0">Низькорівневий примітив</tspan><tspan x="707.5" dy="11.7">• _state: PENDING / CANCELLED / FINISHED</tspan><tspan x="707.5" dy="11.7">• _result: збережене значення</tspan><tspan x="707.5" dy="11.7">• _exception: збережений виняток</tspan></text>
<rect x="600.0" y="195.0" width="215.0" height="110.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="707.5" y="227.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="707.5" dy="0.0">Зворотні виклики (_callbacks):</tspan><tspan x="707.5" dy="13.0">• Список функцій для сповіщення</tspan><tspan x="707.5" dy="13.0">• fut.add_done_callback(cb)</tspan><tspan x="707.5" dy="13.0">• Під час завершення циклічно</tspan><tspan x="707.5" dy="13.0">  викликає loop.call_soon(cb, fut)</tspan></text>
<rect x="600.0" y="320.0" width="215.0" height="110.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="707.5" y="354.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="707.5" dy="0.0">Завершення події I/O:</tspan><tspan x="707.5" dy="11.7">• Селектор фіксує готовність сокета</tspan><tspan x="707.5" dy="11.7">• fut.set_result(data)</tspan><tspan x="707.5" dy="11.7">• Стан переходить у FINISHED</tspan><tspan x="707.5" dy="11.7">• Спрацьовує Task._wakeup()</tspan></text>
<line x1="320.0" y1="245.0" x2="260.0" y2="245.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="260.0" y1="365.0" x2="320.0" y2="365.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="540.0" y1="255.0" x2="600.0" y2="255.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="600.0" y1="375.0" x2="540.0" y2="375.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>