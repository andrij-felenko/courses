<text x="65.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. WSGI-сервери (Gunicorn sync) вичерпують пул потоків при досягненні ліміту паралельних з'єднань.</text>
<text x="65.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Будь-яка затримка у зовнішньому сервісі чи БД спричиняє каскадне зростання черги й виснаження пам'яті у WSGI.</text>
<text x="65.0" y="447.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. ASGI-сервер (Uvicorn/FastAPI) утримує стабільну затримку завдяки неблокувальному мультиплексуванню сокетів.</text>
