<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектурні моделі: WSGI (Синхронна) проти ASGI (Асинхронна)</text>
<rect x="30.0" y="50.0" width="445.0" height="450.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<rect x="30.0" y="50.0" width="445.0" height="36.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="252.5" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">WSGI: Gunicorn + Flask (1 потік / процес на клієнта)</text>
<rect x="50.0" y="105.0" width="110.0" height="45.0" rx="4" fill="#eef2f7" stroke="#333333" stroke-width="1.2"/>
<text x="105.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сенсор A</text>
<text x="105.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">HTTP POST</text>
<rect x="50.0" y="165.0" width="110.0" height="45.0" rx="4" fill="#eef2f7" stroke="#333333" stroke-width="1.2"/>
<text x="105.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сенсор B</text>
<text x="105.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">HTTP POST</text>
<rect x="50.0" y="230.0" width="110.0" height="45.0" rx="4" fill="#fadbd8" stroke="#c0392b" stroke-width="1.2"/>
<text x="105.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Сенсор C (Черга)</text>
<text x="105.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Очікує воркер</text>
<rect x="220.0" y="105.0" width="230.0" height="45.0" rx="4" fill="#fdedec" stroke="#c0392b" stroke-width="1.2"/>
<text x="335.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Воркер 1 (Блокування)</text>
<text x="335.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">I/O очікування БД (10 мс)</text>
<line x1="160.0" y1="127.0" x2="218.0" y2="127.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="220.0" y="165.0" width="230.0" height="45.0" rx="4" fill="#fdedec" stroke="#c0392b" stroke-width="1.2"/>
<text x="335.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Воркер 2 (Блокування)</text>
<text x="335.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">I/O очікування сокета (15 мс)</text>
<line x1="160.0" y1="187.0" x2="218.0" y2="187.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="50.0" y="290.0" width="405.0" height="195.0" rx="6" fill="#fff9f8" stroke="#c0392b" stroke-width="1.0"/>
<text x="252.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Обмеження моделі WSGI:</text>
<text x="65.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Пул обмежений (наприклад, 4-16 процесів Gunicorn)</text>
<text x="65.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Пам'ять: ~30-50 МБ на окремий процес CPython</text>
<text x="65.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Потоки ОС: стек 2-8 МБ, дорогий Context Switching</text>
<text x="65.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• При I/O блокуванні нові сенсори отримують 504 Gateway</text>
<text x="65.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Не підтримує довгі відкриті з'єднання (WebSockets)</text>
<text x="65.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Межа пропускної здатності: сотні req/sec</text>
<rect x="505.0" y="50.0" width="445.0" height="450.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<rect x="505.0" y="50.0" width="445.0" height="36.0" rx="8" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/>
<text x="727.5" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ASGI: Uvicorn + FastAPI (Event Loop + Корутини)</text>
<rect x="525.0" y="105.0" width="105.0" height="170.0" rx="4" fill="#eef2f7" stroke="#333333" stroke-width="1.2"/>
<text x="577.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">10 000+</text>
<text x="577.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Одночасних</text>
<text x="577.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">сенсорів</text>
<text x="577.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">HTTP / WS</text>
<text x="577.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Keep-Alive</text>
<text x="577.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Non-blocking</text>
<rect x="685.0" y="105.0" width="245.0" height="170.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/>
<text x="807.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Цикл подій (uvloop / epoll)</text>
<line x1="695.0" y1="136.0" x2="920.0" y2="136.0" stroke="#27ae60" stroke-width="1.0"/>
<rect x="700.0" y="145.0" width="215.0" height="26.0" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="807.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Task 1: Sensor A (await db.save)</text>
<rect x="700.0" y="177.0" width="215.0" height="26.0" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="807.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Task 2: Sensor B (parsing Pydantic)</text>
<rect x="700.0" y="209.0" width="215.0" height="26.0" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="807.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Task N: Sensor N (ready in epoll)</text>
<rect x="700.0" y="241.0" width="215.0" height="26.0" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="807.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">1 потік ОС обробляє всі задачі</text>
<line x1="630.0" y1="190.0" x2="683.0" y2="190.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="525.0" y="290.0" width="405.0" height="195.0" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.0"/>
<text x="727.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Переваги моделі ASGI:</text>
<text x="540.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Кооперативна багатозадачність (async/await)</text>
<text x="540.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Пам'ять: ~2-4 КБ на корутину замість мегабайтів потоку</text>
<text x="540.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Безперервна обробка I/O через ядра epoll / kqueue</text>
<text x="540.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Нативна підтримка WebSockets та Streaming HTTP</text>
<text x="540.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Нульові витрати на перемикання контексту ОС ядра</text>
<text x="540.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">• Пропускна здатність: 20 000+ req/sec на процес</text>
</svg>