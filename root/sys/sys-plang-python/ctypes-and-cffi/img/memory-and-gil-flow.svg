<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Керування пам'яттю, протокол буфера та життєвий цикл GIL</text>
<rect x="30.0" y="60.0" width="360.0" height="385.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="210.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Простір пам'яті Python і Zero-Copy</text>
<rect x="45.0" y="105.0" width="330.0" height="65.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Об'єкти Python з підтримкою буфера</tspan><tspan x="210.0" dy="14.3">bytes, bytearray, memoryview, numpy.ndarray</tspan><tspan x="210.0" dy="14.3">(У купі CPython, керованій GC)</tspan></text>
<rect x="45.0" y="195.0" width="330.0" height="70.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="220.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">ffi.from_buffer() / ctypes.from_buffer()</tspan><tspan x="210.0" dy="13.0">Пряме отримання сирого вказівника на пам'ять</tspan><tspan x="210.0" dy="13.0">БЕЗ копіювання даних (Нульове копіювання / Zero-Copy)</tspan></text>
<rect x="45.0" y="290.0" width="330.0" height="65.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="312.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Автоматичне очищення C-ресурсів</tspan><tspan x="210.0" dy="14.3">ptr = ffi.gc(c_alloc(), free_func)</tspan><tspan x="210.0" dy="14.3">Прив'язка C-деструктора до фіналізатора Python</tspan></text>
<rect x="45.0" y="375.0" width="330.0" height="55.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="210.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Захист від Use-After-Free:</tspan><tspan x="210.0" dy="13.0">ffi.gc гарантує звільнення пам'яті лише коли</tspan><tspan x="210.0" dy="13.0">всі Python-посилання зникають</tspan></text>
<line x1="210.0" y1="170.0" x2="210.0" y2="195.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="210.0" y1="265.0" x2="210.0" y2="290.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="210.0" y1="355.0" x2="210.0" y2="375.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="430.0" y="60.0" width="380.0" height="385.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="620.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Виконання C-коду та синхронізація GIL</text>
<rect x="445.0" y="105.0" width="350.0" height="65.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">1. Потік у Python (Володіє GIL)</tspan><tspan x="620.0" dy="14.3">Виклик ffi_call або C-розширення</tspan><tspan x="620.0" dy="14.3">Підготовка сирих аргументів C</tspan></text>
<rect x="445.0" y="190.0" width="350.0" height="60.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="209.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">2. Відпускання GIL: PyEval_SaveThread()</tspan><tspan x="620.0" dy="14.3">Інші потоки Python вільно виконують байткод</tspan><tspan x="620.0" dy="14.3">на інших ядрах процесора</tspan></text>
<rect x="445.0" y="270.0" width="350.0" height="65.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="292.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">3. Обчислення в нативному C/C++ коді</tspan><tspan x="620.0" dy="14.3">Тривала математика, блокувальний I/O</tspan><tspan x="620.0" dy="14.3">Паралельність на рівні ядра ОС</tspan></text>
<rect x="445.0" y="355.0" width="350.0" height="75.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="374.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">4. Повернення та захоплення GIL</tspan><tspan x="620.0" dy="14.3">PyEval_RestoreThread()</tspan><tspan x="620.0" dy="14.3">(У разі C-callback: PyGILState_Ensure()</tspan><tspan x="620.0" dy="14.3">перед викликом Python-коду)</tspan></text>
<line x1="620.0" y1="170.0" x2="620.0" y2="190.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="620.0" y1="250.0" x2="620.0" y2="270.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="620.0" y1="335.0" x2="620.0" y2="355.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>