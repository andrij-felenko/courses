<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця архітектурних режимів cffi: ABI проти API</text>
<rect x="160.0" y="55.0" width="310.0" height="35.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="315.0" y="76.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">Режим ABI (двійковий інтерфейс / libffi)</tspan></text>
<rect x="490.0" y="55.0" width="320.0" height="35.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="76.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Режим API (компіляція C-коду розширення)</tspan></text>
<rect x="20.0" y="100.0" width="120.0" height="175.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="80.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="80.0" dy="0.0">In-line</tspan><tspan x="80.0" dy="14.3">(Динамічно під</tspan><tspan x="80.0" dy="14.3">час імпорту)</tspan></text>
<rect x="20.0" y="295.0" width="120.0" height="185.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="80.0" y="378.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="80.0" dy="0.0">Out-of-line</tspan><tspan x="80.0" dy="11.7">(Попередня збірка</tspan><tspan x="80.0" dy="11.7">у .whl / .so)</tspan></text>
<rect x="160.0" y="100.0" width="310.0" height="175.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="315.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ABI In-line (Швидкий прототип)</text>
<text x="315.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">• ffi.cdef() парсить C-типи під час запуску</tspan><tspan x="315.0" dy="13.5">• ffi.dlopen(&quot;lib.so&quot;) динамічно вантажить бібліотеку</tspan><tspan x="315.0" dy="13.5">• Виклики через динамічний libffi</tspan><tspan x="315.0" dy="13.5">• Ризик: помилки розкладки структур при зсувах полів</tspan><tspan x="315.0" dy="13.5">• Накладні витрати: 80–120 нс на виклик</tspan></text>
<rect x="490.0" y="100.0" width="320.0" height="175.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="650.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">API In-line (Рідкісний режим)</text>
<text x="650.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">• ffi.cdef() + ffi.set_source()</tspan><tspan x="650.0" dy="13.5">• Викликає C-компілятор у фоні під час імпорту</tspan><tspan x="650.0" dy="13.5">• Генерує тимчасовий C-extension модуль</tspan><tspan x="650.0" dy="13.5">• Гарантує відповідність системним заголовкам</tspan><tspan x="650.0" dy="13.5">• Мінус: затримка старту програми (компіляція)</tspan></text>
<rect x="160.0" y="295.0" width="310.0" height="185.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="315.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ABI Out-of-line (Без компілятора C)</text>
<text x="315.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">• Скрипт збірки компілює лише C-декларації у Python</tspan><tspan x="315.0" dy="13.5">• Імпорт згенерованого модуля без парсингу cdef</tspan><tspan x="315.0" dy="13.5">• ffi.dlopen() під час виконання</tspan><tspan x="315.0" dy="13.5">• Плюс: не потребує gcc/clang на кінцевому сервері</tspan><tspan x="315.0" dy="13.5">• Мінус: зберігаються накладні витрати libffi</tspan></text>
<rect x="490.0" y="295.0" width="320.0" height="185.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="650.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">API Out-of-line (Промисловий еталон ⭐)</text>
<text x="650.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">• ffibuilder.compile() під час wheel-пакування</tspan><tspan x="650.0" dy="13.5">• Генерує нативний C-код без посередництва libffi</tspan><tspan x="650.0" dy="13.5">• Прямий виклик функцій через вказівники нативного C</tspan><tspan x="650.0" dy="13.5">• Безпека: перевірка макросів, enum і struct компілятором</tspan><tspan x="650.0" dy="13.5">• Максимальна швидкість: 5–15 нс на виклик</tspan></text>
</svg>