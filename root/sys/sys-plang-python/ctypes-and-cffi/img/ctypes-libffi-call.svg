<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Динамічний виклик ctypes: від об'єкта Python до машинних регістрів C</text>
<rect x="30.0" y="60.0" width="220.0" height="390.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="140.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Простір Python (CPython)</text>
<rect x="45.0" y="110.0" width="190.0" height="65.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="140.0" y="138.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Python Objects</tspan><tspan x="140.0" dy="15.6">(int, float, bytes, list)</tspan></text>
<rect x="45.0" y="205.0" width="190.0" height="75.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="140.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">ctypes Types Wrapper</tspan><tspan x="140.0" dy="14.3">(c_int, c_double, POINTER)</tspan><tspan x="140.0" dy="14.3">Маршалінг у C-структури</tspan></text>
<rect x="45.0" y="310.0" width="190.0" height="65.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="140.0" y="338.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">CDLL / WinDLL Object</tspan><tspan x="140.0" dy="15.6">Адреса символу (dlsym)</tspan></text>
<rect x="45.0" y="395.0" width="190.0" height="45.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="140.0" y="414.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Відпускання GIL</tspan><tspan x="140.0" dy="14.3">(PyEval_SaveThread)</tspan></text>
<rect x="290.0" y="60.0" width="240.0" height="390.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="410.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Ядро FFI (libffi)</text>
<rect x="305.0" y="110.0" width="210.0" height="70.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">ffi_cif (Call Interface)</tspan><tspan x="410.0" dy="14.3">• Тип повернення</tspan><tspan x="410.0" dy="14.3">• Масив типів аргументів</tspan><tspan x="410.0" dy="14.3">• ABI (cdecl, sysv, win64)</tspan></text>
<rect x="305.0" y="210.0" width="210.0" height="70.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="235.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">ffi_prep_cif()</tspan><tspan x="410.0" dy="13.0">Розрахунок зсувів, вирівнювання</tspan><tspan x="410.0" dy="13.0">та розміру стекового кадру</tspan></text>
<rect x="305.0" y="310.0" width="210.0" height="120.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="347.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">ffi_call() / Трамплін</tspan><tspan x="410.0" dy="13.0">1. Розкладка значень у регістри</tspan><tspan x="410.0" dy="13.0">   (RDI, RSI, RDX, XMM0...)</tspan><tspan x="410.0" dy="13.0">2. Запис залишку в стек процесу</tspan><tspan x="410.0" dy="13.0">3. Машинна інструкція call</tspan></text>
<rect x="570.0" y="60.0" width="220.0" height="390.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="680.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Нативна C/C++ бібліотека</text>
<rect x="585.0" y="110.0" width="190.0" height="75.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="680.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Динамічна бібліотека</tspan><tspan x="680.0" dy="14.3">.so / .dll / .dylib</tspan><tspan x="680.0" dy="14.3">(Завантажена через dlopen)</tspan></text>
<rect x="585.0" y="210.0" width="190.0" height="85.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="680.0" y="234.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Цільова C-функція</tspan><tspan x="680.0" dy="14.3">Виконання нативного коду</tspan><tspan x="680.0" dy="14.3">без знання про Python</tspan><tspan x="680.0" dy="14.3">(Апаратна швидкодія)</tspan></text>
<rect x="585.0" y="325.0" width="190.0" height="105.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="680.0" y="352.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Повернення результату</tspan><tspan x="680.0" dy="14.3">Регістри RAX / XMM0</tspan><tspan x="680.0" dy="14.3">→ Конвертація у ffi_call</tspan><tspan x="680.0" dy="14.3">→ Зворотний маршалінг</tspan><tspan x="680.0" dy="14.3">→ Захоплення GIL</tspan></text>
