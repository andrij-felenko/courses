<text x="49.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• sys.path[0]: абсолютний шлях до каталогу app/</text>
