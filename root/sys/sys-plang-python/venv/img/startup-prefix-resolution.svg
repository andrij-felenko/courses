<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм ініціалізації шляхів CPython (getpath)</text>
<rect x="220.0" y="43.2" width="480.0" height="43.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="61.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">1. Запуск: execve(&quot;.venv/bin/python3&quot;)</tspan><tspan x="460.0" dy="15.6">Отримання argv[0] та обчислення sys.executable</tspan></text>
<line x1="460.0" y1="95.0" x2="460.0" y2="125.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="198.9" y="133.2" width="522.2" height="43.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="151.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">2. Пошук pyvenv.cfg</tspan><tspan x="460.0" dy="15.6">Перевірка каталогу бінарника (.venv/bin) та батьківського каталогу (.venv)</tspan></text>
<line x1="460.0" y1="185.0" x2="460.0" y2="220.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="110.0" y="233.2" width="280.0" height="43.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="251.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">pyvenv.cfg ЗНАЙДЕНО</tspan><tspan x="250.0" dy="15.6">Режим PEP 405 venv</tspan></text>
<rect x="530.0" y="233.2" width="280.0" height="43.6" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="670.0" y="251.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">pyvenv.cfg ВІДСУТНІЙ</tspan><tspan x="670.0" dy="15.6">Стандартний системний режим</tspan></text>
<line x1="350.0" y1="185.0" x2="250.0" y2="230.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="570.0" y1="185.0" x2="670.0" y2="230.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="90.0" y="310.1" width="320.0" height="69.9" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="327.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">3. Зчитування home з pyvenv.cfg</tspan><tspan x="250.0" dy="14.3">sys.base_prefix = home (/usr)</tspan><tspan x="250.0" dy="14.3">sys.prefix = .venv</tspan><tspan x="250.0" dy="14.3">sys.exec_prefix = .venv</tspan></text>
<line x1="250.0" y1="285.0" x2="250.0" y2="315.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="510.0" y="310.1" width="320.0" height="69.9" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="327.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">3. Пошук орієнтирів (Landmarks: os.py)</tspan><tspan x="670.0" dy="14.3">sys.base_prefix = /usr</tspan><tspan x="670.0" dy="14.3">sys.prefix = /usr</tspan><tspan x="670.0" dy="14.3">sys.exec_prefix = /usr</tspan></text>
<line x1="670.0" y1="285.0" x2="670.0" y2="315.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="250.0" y1="385.0" x2="400.0" y2="430.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="670.0" y1="385.0" x2="520.0" y2="430.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="140.0" y="437.2" width="640.0" height="55.6" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="460.0" y="454.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">4. Ініціалізація site.py та формування sys.path</tspan><tspan x="460.0" dy="14.3">Додавання sys.prefix + /lib/python3.X/site-packages/</tspan><tspan x="460.0" dy="14.3">Якщо include-system-site-packages = true -&gt; додається також системний site-packages</tspan></text>
</svg>