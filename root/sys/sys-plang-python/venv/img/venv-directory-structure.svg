<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія віртуального середовища PEP 405</text>
<rect x="40.0" y="50.0" width="360.0" height="400.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="220.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Системний префікс (sys.base_prefix = /usr)</text>
<rect x="70.0" y="98.2" width="300.0" height="43.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">/usr/bin/python3.12</tspan><tspan x="220.0" dy="15.6">(Головний двійковий образ ELF)</tspan></text>
<rect x="70.0" y="188.2" width="300.0" height="43.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="206.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">/usr/lib/python3.12/</tspan><tspan x="220.0" dy="15.6">(Стандартна бібліотека: os, sys, math...)</tspan></text>
<rect x="70.0" y="273.2" width="300.0" height="43.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="291.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">/usr/lib/python3.12/lib-dynload/</tspan><tspan x="220.0" dy="15.6">(C-розширення: _socket.so, _ssl.so)</tspan></text>
<rect x="70.0" y="358.2" width="300.0" height="43.6" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="220.0" y="376.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">/usr/lib/python3/dist-packages/</tspan><tspan x="220.0" dy="15.6">(Системні пакунки apt / dnf / pacman)</tspan></text>
<rect x="500.0" y="50.0" width="360.0" height="400.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="680.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Ізольований префікс (sys.prefix = .venv)</text>
<rect x="530.0" y="97.2" width="300.0" height="55.6" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="680.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">pyvenv.cfg</tspan><tspan x="680.0" dy="14.3">home = /usr/bin</tspan><tspan x="680.0" dy="14.3">include-system-site-packages = false</tspan></text>
<rect x="530.0" y="194.3" width="300.0" height="41.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">bin/python3 -&gt; /usr/bin/python3.12 (symlink)</tspan><tspan x="680.0" dy="14.3">bin/activate, bin/pip, bin/pytest</tspan></text>
<rect x="530.0" y="282.2" width="300.0" height="55.6" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="299.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">lib/python3.12/site-packages/</tspan><tspan x="680.0" dy="14.3">Ізольовані пакунки проєкту (pip install)</tspan><tspan x="680.0" dy="14.3">requests, fastapi, pydantic, numpy...</tspan></text>
<rect x="530.0" y="383.5" width="300.0" height="23.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="680.0" y="398.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">include/ (Заголовні файли C/C++ для збірки)</tspan></text>
<line x1="530.0" y1="215.0" x2="370.0" y2="130.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Символічне посилання</text>
<line x1="530.0" y1="125.0" x2="370.0" y2="120.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">home вказує базу</text>
<line x1="530.0" y1="225.0" x2="370.0" y2="210.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">stdlib береться з бази</text>
</svg>