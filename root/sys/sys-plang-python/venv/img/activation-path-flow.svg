<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механіка виклику: прямий шлях проти активації через shell</text>
<rect x="40.0" y="50.0" width="380.0" height="380.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="230.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Варіант А: Прямий виклик бінарника</text>
<rect x="60.0" y="94.3" width="340.0" height="41.3" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">$ /home/user/app/.venv/bin/python main.py</tspan><tspan x="230.0" dy="14.3">або $ .venv/bin/pytest</tspan></text>
<rect x="60.0" y="174.3" width="340.0" height="41.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="230.0" y="191.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Змінна $PATH: НЕ ЗМІНЮЄТЬСЯ</tspan><tspan x="230.0" dy="14.3">(/usr/bin:/bin:/usr/local/bin)</tspan></text>
<rect x="60.0" y="247.2" width="340.0" height="55.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="264.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Пошук pyvenv.cfg: АВТОМАТИЧНО</tspan><tspan x="230.0" dy="14.3">CPython обчислює шлях від власного argv[0]</tspan><tspan x="230.0" dy="14.3">і самостійно підміняє sys.prefix</tspan></text>
<rect x="60.0" y="337.2" width="340.0" height="55.6" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="354.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Shebang у консольних скриптах:</tspan><tspan x="230.0" dy="14.3">#!/home/user/app/.venv/bin/python</tspan><tspan x="230.0" dy="14.3">Скрипти pip/pytest викликають потрібний venv</tspan></text>
<rect x="480.0" y="50.0" width="380.0" height="380.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="670.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Варіант Б: Робота через source bin/activate</text>
<rect x="500.0" y="94.3" width="340.0" height="41.3" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">$ source .venv/bin/activate</tspan><tspan x="670.0" dy="14.3">(.venv) $ python main.py</tspan></text>
<rect x="500.0" y="167.2" width="340.0" height="55.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="670.0" y="184.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Змінна $PATH: МОДИФІКОВАНА</tspan><tspan x="670.0" dy="14.3">PATH=&quot;/home/user/app/.venv/bin:$PATH&quot;</tspan><tspan x="670.0" dy="14.3">Команда 'python' тепер вказує на .venv/bin</tspan></text>
<rect x="500.0" y="240.1" width="340.0" height="69.9" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Змінні середовища:</tspan><tspan x="670.0" dy="14.3">VIRTUAL_ENV=&quot;/home/user/app/.venv&quot;</tspan><tspan x="670.0" dy="14.3">PS1=&quot;(.venv) $PS1&quot;</tspan><tspan x="670.0" dy="14.3">Функція deactivate() для відкату</tspan></text>
<rect x="500.0" y="337.2" width="340.0" height="55.6" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="670.0" y="354.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Поведінка у підпроцесах:</tspan><tspan x="670.0" dy="14.3">Дочірні процеси успадковують $PATH,</tspan><tspan x="670.0" dy="14.3">проте ізоляція працює за рахунок pyvenv.cfg</tspan></text>
</svg>