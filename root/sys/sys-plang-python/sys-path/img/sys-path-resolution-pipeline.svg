<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шість етапів формування sys.path під час старту CPython</text>
<rect x="35.0" y="65.0" width="280.0" height="200.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="175.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. Точка входу (sys.path[0])</text>
<line x1="45.0" y1="101.0" x2="305.0" y2="101.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="49.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• python script.py  →  каталог скрипту</text>
<text x="49.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• python -m mod    →  поточний каталог (cwd)</text>
<text x="49.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• REPL / stdin     →  порожній рядок (&quot;&quot;)</text>
<text x="49.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• python -P        →  вилучення небезпечного [0]</text>
<line x1="319.0" y1="165.0" x2="351.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="355.0" y="65.0" width="280.0" height="200.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="495.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2. Змінна PYTHONPATH</text>
<line x1="365.0" y1="101.0" x2="625.0" y2="101.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="369.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Зчитування з середовища процесу</text>
<text x="369.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Розбиття за os.pathsep (: або ;)</text>
<text x="369.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Вставка одразу після sys.path[0]</text>
<text x="369.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Ігнорування при -E або в режимі -I</text>
<line x1="639.0" y1="165.0" x2="671.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="675.0" y="65.0" width="280.0" height="200.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="815.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">3. Стандартна бібліотека (Landmarks)</text>
<line x1="685.0" y1="101.0" x2="945.0" y2="101.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="689.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Пошук префікса: pyvenv.cfg або landmark</text>
<text x="689.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Додавання pythonXY.zip (якщо є)</text>
<text x="689.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Додавання каталогу stdlib (prefix/lib/pythonX.Y)</text>
<text x="689.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Додавання lib-dynload (C-розширення)</text>
<line x1="815.0" y1="265.0" x2="815.0" y2="311.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="815.0" y1="311.0" x2="175.0" y2="311.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="175.0" y1="311.0" x2="175.0" y2="368.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="35.0" y="370.0" width="280.0" height="200.0" rx="8" fill="#fef9e7" stroke="#b78103" stroke-width="1.8"/>
<text x="175.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b78103" text-anchor="middle" font-weight="700">4. Модуль site.py (site-packages)</text>
<line x1="45.0" y1="406.0" x2="305.0" y2="406.0" stroke="#b78103" stroke-width="1.0"/>
<text x="49.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Автоматичний запуск site.main() (якщо не -S)</text>
<text x="49.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Визначення системного prefix/lib/site-packages</text>
<text x="49.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Виклик site.addsitedir() для кожного шляху</text>
<text x="49.0" y="522.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Створення об'єктів шляхів у пам'яті</text>
<line x1="319.0" y1="470.0" x2="351.0" y2="470.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="355.0" y="370.0" width="280.0" height="200.0" rx="8" fill="#fef9e7" stroke="#b78103" stroke-width="1.8"/>
<text x="495.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b78103" text-anchor="middle" font-weight="700">5. Обробка файлів .pth</text>
<line x1="365.0" y1="406.0" x2="625.0" y2="406.0" stroke="#b78103" stroke-width="1.0"/>
<text x="369.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Алфавітне сканування файлів *.pth</text>
<text x="369.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Прості рядки  →  додавання шляхів у sys.path</text>
<text x="369.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Рядки 'import ...'  →  виконання коду</text>
<text x="369.0" y="522.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Рекурсивний обхід вкладених каталогів</text>
<line x1="639.0" y1="470.0" x2="671.0" y2="470.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="675.0" y="370.0" width="280.0" height="200.0" rx="8" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="815.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">6. Користувацькі пакунки (User Site)</text>
<line x1="685.0" y1="406.0" x2="945.0" y2="406.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="689.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Додавання ~/.local/lib/pythonX.Y/site-packages</text>
<text x="689.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Вимкнення через PYTHONNOUSERSITE або -s</text>
<text x="689.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Виконання хуків sitecustomize та usercustomize</text>
<text x="689.0" y="522.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Формування фінального списку sys.path</text>
</svg>