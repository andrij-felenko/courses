<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ізоляція блокувального коду: мости між asyncio та пулами виконання</text>
<rect x="20.0" y="50.0" width="260.0" height="400.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="150.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Головний потік (Event Loop)</text>
<rect x="35.0" y="95.0" width="230.0" height="65.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Цикл подій asyncio</tspan><tspan x="150.0" dy="14.3">• epoll / kqueue / IOCP</tspan><tspan x="150.0" dy="14.3">• Опитування дескрипторів</tspan></text>
<rect x="35.0" y="175.0" width="230.0" height="80.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="197.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Асинхронна корутина</tspan><tspan x="150.0" dy="14.3">res = await asyncio.to_thread(f)</tspan><tspan x="150.0" dy="14.3">або</tspan><tspan x="150.0" dy="14.3">loop.run_in_executor(pool, f)</tspan></text>
<rect x="35.0" y="270.0" width="230.0" height="60.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="289.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">asyncio.Future</tspan><tspan x="150.0" dy="14.3">Очікує результату</tspan><tspan x="150.0" dy="14.3">(не блокуючи селектор)</tspan></text>
<rect x="35.0" y="345.0" width="230.0" height="85.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="150.0" y="369.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Пробудження циклу</tspan><tspan x="150.0" dy="14.3">loop.call_soon_threadsafe()</tspan><tspan x="150.0" dy="14.3">→ запис 1 байта у self-pipe</tspan><tspan x="150.0" dy="14.3">→ пробудження epoll.poll()</tspan></text>
<rect x="310.0" y="50.0" width="250.0" height="400.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="435.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ThreadPoolExecutor</text>
<rect x="325.0" y="95.0" width="220.0" height="75.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="435.0" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="435.0" dy="0.0">Призначення: I/O-bound</tspan><tspan x="435.0" dy="14.3">• Дискові файли (open, write)</tspan><tspan x="435.0" dy="14.3">• Синхронні БД (sqlite3)</tspan><tspan x="435.0" dy="14.3">• C-бібліотеки без GIL</tspan></text>
<rect x="325.0" y="185.0" width="220.0" height="70.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="435.0" y="209.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="435.0" dy="0.0">Пам'ять: Спільна купа</tspan><tspan x="435.0" dy="14.3">Спільний адресний простір</tspan><tspan x="435.0" dy="14.3">Нульові витрати на копіювання</tspan></text>
<rect x="325.0" y="270.0" width="220.0" height="75.0" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/><text x="435.0" y="289.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="435.0" dy="0.0">Обмеження CPython:</tspan><tspan x="435.0" dy="14.3">Байткод Python виконується</tspan><tspan x="435.0" dy="14.3">під спільним GIL!</tspan><tspan x="435.0" dy="14.3">Не для CPU-bound Python</tspan></text>
<rect x="325.0" y="360.0" width="220.0" height="70.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="435.0" y="377.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="435.0" dy="0.0">Повернення результату</tspan><tspan x="435.0" dy="14.3">concurrent.futures.Future</tspan><tspan x="435.0" dy="14.3">Виклик зворотного колбека</tspan></text>
<rect x="590.0" y="50.0" width="250.0" height="400.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="715.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ProcessPoolExecutor</text>
<rect x="605.0" y="95.0" width="220.0" height="75.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="715.0" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Призначення: CPU-bound</tspan><tspan x="715.0" dy="14.3">• Важка математика</tspan><tspan x="715.0" dy="14.3">• Стиснення даних / криптографія</tspan><tspan x="715.0" dy="14.3">• Парсинг великих JSON/XML</tspan></text>
<rect x="605.0" y="185.0" width="220.0" height="70.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="715.0" y="209.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Пам'ять: Окремі процеси</tspan><tspan x="715.0" dy="14.3">Власна купа та власний GIL</tspan><tspan x="715.0" dy="14.3">Паралелізм на всіх ядрах CPU</tspan></text>
<rect x="605.0" y="270.0" width="220.0" height="75.0" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/><text x="715.0" y="289.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Накладні витрати:</tspan><tspan x="715.0" dy="14.3">Серіалізація через pickle</tspan><tspan x="715.0" dy="14.3">IPC-канали (pipe/socket)</tspan><tspan x="715.0" dy="14.3">Витрати на fork / spawn</tspan></text>
<rect x="605.0" y="360.0" width="220.0" height="70.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="715.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Передача результату</tspan><tspan x="715.0" dy="14.3">Десеріалізація через IPC</tspan><tspan x="715.0" dy="14.3">Установка значення у Future</tspan></text>
