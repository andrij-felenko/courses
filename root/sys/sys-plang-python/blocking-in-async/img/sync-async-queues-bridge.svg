<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потокобезпечний обмін даними між асинхронним та синхронним контекстами</text>
<rect x="20.0" y="50.0" width="380.0" height="380.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="210.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Асинхронний контекст (Event Loop)</text>
<rect x="40.0" y="95.0" width="340.0" height="60.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Асинхронні корутини</tspan><tspan x="210.0" dy="14.3">(Мережеві сокети, WebSockets, HTTP-сервер)</tspan></text>
<rect x="40.0" y="170.0" width="340.0" height="65.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">asyncio.Queue (НЕ є thread-safe!)</tspan><tspan x="210.0" dy="14.3">• await queue.get()</tspan><tspan x="210.0" dy="14.3">• await queue.put(item)</tspan></text>
<rect x="40.0" y="255.0" width="340.0" height="75.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="282.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Запис у синхронну чергу з корутини:</tspan><tspan x="210.0" dy="14.3">await asyncio.to_thread(sync_q.put, item)</tspan><tspan x="210.0" dy="14.3">(виконується в пулі, не блокує цикл)</tspan></text>
<rect x="40.0" y="345.0" width="340.0" height="65.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="374.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Прийом із потоку в асинхронну чергу:</tspan><tspan x="210.0" dy="14.3">loop.call_soon_threadsafe(async_q.put_nowait, val)</tspan></text>
<rect x="440.0" y="50.0" width="380.0" height="380.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="630.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Синхронний контекст (Робочі потоки)</text>
<rect x="460.0" y="95.0" width="340.0" height="60.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Синхронні Worker Threads</tspan><tspan x="630.0" dy="14.3">(Дисковий запис, C-розрахунки, синхронні SDK)</tspan></text>
<rect x="460.0" y="170.0" width="340.0" height="65.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">queue.Queue (Потокобезпечна з блокуванням)</tspan><tspan x="630.0" dy="14.3">• sync_q.get() [блокує потік до появи даних]</tspan><tspan x="630.0" dy="14.3">• sync_q.put(item)</tspan></text>
<rect x="460.0" y="255.0" width="340.0" height="75.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="630.0" y="282.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Заборонено в Event Loop:</tspan><tspan x="630.0" dy="14.3">sync_q.get() без потоку -&gt; зупинка циклу!</tspan><tspan x="630.0" dy="14.3">async_q.put() з потоку -&gt; стан гонитви!</tspan></text>
<rect x="460.0" y="345.0" width="340.0" height="65.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="374.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Передача завдання в корутину:</tspan><tspan x="630.0" dy="14.3">asyncio.run_coroutine_threadsafe(coro, loop)</tspan></text>
<line x1="380.0" y1="290.0" x2="460.0" y2="205.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="460.0" y1="375.0" x2="380.0" y2="375.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>