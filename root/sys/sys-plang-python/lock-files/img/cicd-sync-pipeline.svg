<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Традиційний підхід: pip install -r requirements.txt (Недетермінований та повільний)</text>
<rect x="45.0" y="62.0" width="170.0" height="56.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="80.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">1. Читання requirements</tspan><tspan x="130.0" dy="13.0">(Без хешів або лише</tspan><tspan x="130.0" dy="13.0">верхній рівень)</tspan></text>
<rect x="265.0" y="62.0" width="190.0" height="56.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="80.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">2. Звернення до PyPI</tspan><tspan x="360.0" dy="13.0">(Пошук коліс у мережі,</tspan><tspan x="360.0" dy="13.0">латентність 500-2000 мс)</tspan></text>
<rect x="500.0" y="62.0" width="200.0" height="56.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="80.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">3. Резолвінг бектрекінгом</tspan><tspan x="600.0" dy="13.0">(Потенційний несподіваний</tspan><tspan x="600.0" dy="13.0">дрейф підпакетів)</tspan></text>
<rect x="740.0" y="62.0" width="180.0" height="56.0" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="830.0" y="80.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">4. Повільна інсталяція</tspan><tspan x="830.0" dy="13.0">(Розпакування tar/whl,</tspan><tspan x="830.0" dy="13.0">час: 30-120 сек)</tspan></text>
<line x1="220.0" y1="90.0" x2="260.0" y2="90.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="460.0" y1="90.0" x2="495.0" y2="90.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="705.0" y1="90.0" x2="735.0" y2="90.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="50.0" y1="160.0" x2="890.0" y2="160.0" stroke="#333333" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="470.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Сучасний підхід: uv sync --frozen (Атомарний, верифікований та миттєвий)</text>
<rect x="45.0" y="237.0" width="170.0" height="56.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="255.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">1. Зчитування uv.lock</tspan><tspan x="130.0" dy="13.0">(Повне дерево рішень,</tspan><tspan x="130.0" dy="13.0">статичний файл)</tspan></text>
<rect x="265.0" y="237.0" width="190.0" height="56.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="360.0" y="255.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">2. Валідація SHA-256</tspan><tspan x="360.0" dy="13.0">(Перевірка цілісності коліс,</tspan><tspan x="360.0" dy="13.0">захист від підміни)</tspan></text>
<rect x="500.0" y="237.0" width="200.0" height="56.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="255.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">3. Синхронізація venv</tspan><tspan x="600.0" dy="13.0">(Hardlink/Reflink з кешу,</tspan><tspan x="600.0" dy="13.0">видалення зайвого)</tspan></text>
<rect x="740.0" y="237.0" width="180.0" height="56.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="830.0" y="255.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">4. Готове середовище</tspan><tspan x="830.0" dy="13.0">(Ідентичне до байта,</tspan><tspan x="830.0" dy="13.0">час: 10-50 мс!)</tspan></text>
<line x1="220.0" y1="265.0" x2="260.0" y2="265.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="460.0" y1="265.0" x2="495.0" y2="265.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="705.0" y1="265.0" x2="735.0" y2="265.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="359.5" width="820.0" height="31.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="378.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Результат для CI/CD: 0% ризику падіння через зовнішній PyPI · 100% захист Supply Chain · Економія 95% часу пайплайну</tspan></text>
<line x1="470.0" y1="310.0" x2="470.0" y2="345.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>