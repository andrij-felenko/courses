<text x="140.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Потоки ОС (pthread / Win32)</text>
<rect x="40.0" y="105.0" width="200.0" height="70.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="140.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Потік 1 (Thread-1)</tspan><tspan x="140.0" dy="14.3">Виконує Python-код</tspan><tspan x="140.0" dy="14.3">Утримує GIL [АКТИВНИЙ]</tspan></text>
<rect x="40.0" y="195.0" width="200.0" height="75.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="140.0" y="214.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Потік 2 (Thread-2)</tspan><tspan x="140.0" dy="14.3">CPU-bound обчислення</tspan><tspan x="140.0" dy="14.3">Очікує на gil_mutex / cond</tspan><tspan x="140.0" dy="14.3">[ЗАБЛОКОВАНИЙ]</tspan></text>
<rect x="40.0" y="290.0" width="200.0" height="75.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="140.0" y="309.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Потік 3 (Thread-3)</tspan><tspan x="140.0" dy="14.3">Мережевий сокет / I/O</tspan><tspan x="140.0" dy="14.3">Відпустив GIL (SaveThread)</tspan><tspan x="140.0" dy="14.3">[НЕБЛОКОВАНИЙ I/O]</tspan></text>
<rect x="40.0" y="385.0" width="200.0" height="65.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="140.0" y="399.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Потік 4 (Thread-4)</tspan><tspan x="140.0" dy="14.3">C/C++ розширення</tspan><tspan x="140.0" dy="14.3">Відпустив GIL (AllowThreads)</tspan><tspan x="140.0" dy="14.3">[ПАРАЛЕЛЬНИЙ CPU]</tspan></text>
<rect x="280.0" y="55.0" width="275.0" height="410.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="417.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Структура GIL (_gil_runtime_state)</text>
<rect x="295.0" y="105.0" width="245.0" height="95.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="417.5" y="134.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="417.5" dy="0.0">gil_mutex (М'ютекс ядра)</tspan><tspan x="417.5" dy="14.3">• PyMUTEX_T системний замок</tspan><tspan x="417.5" dy="14.3">• locked = 1 (зайнятий Потоком 1)</tspan><tspan x="417.5" dy="14.3">• last_holder = ThreadState-1</tspan></text>
<rect x="295.0" y="220.0" width="245.0" height="110.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="417.5" y="250.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="417.5" dy="0.0">switch_cond &amp; switch_interval</tspan><tspan x="417.5" dy="14.3">• PyCOND_T умовна змінна</tspan><tspan x="417.5" dy="14.3">• sys.getswitchinterval() = 5 мс</tspan><tspan x="417.5" dy="14.3">• Таймер примусового запиту:</tspan><tspan x="417.5" dy="14.3">  gil_drop_request = 1</tspan></text>
<rect x="295.0" y="350.0" width="245.0" height="95.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="417.5" y="379.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="417.5" dy="0.0">eval_breaker &amp; ceval loop</tspan><tspan x="417.5" dy="14.3">• Сигнальний прапорець перевірки</tspan><tspan x="417.5" dy="14.3">• drop_gil() на межі інструкцій</tspan><tspan x="417.5" dy="14.3">• Безпечна точка перемикання</tspan></text>
<rect x="580.0" y="55.0" width="235.0" height="410.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="697.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Виконання на CPU Cores</text>
