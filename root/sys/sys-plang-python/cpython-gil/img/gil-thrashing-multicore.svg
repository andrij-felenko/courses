<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хронологія GIL Thrashing: конфлікт ядер і втрата квантів часу</text>
<line x1="50.0" y1="60.0" x2="790.0" y2="60.0" stroke="#333333" stroke-width="2.0"/>
<text x="760.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Час (t)</text>
<rect x="30.0" y="80.0" width="140.0" height="50.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="100.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">Ядро 0</tspan><tspan x="100.0" dy="13.0">(Потік 1 CPU-bound)</tspan></text>
<rect x="180.0" y="80.0" width="220.0" height="50.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/>
<text x="290.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Виконує байткод під GIL (5 мс)</text>
<rect x="410.0" y="80.0" width="40.0" height="50.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="430.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">drop</text>
<rect x="460.0" y="80.0" width="200.0" height="50.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/>
<text x="560.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Миттєво перехоплює GIL знову!</text>
<rect x="670.0" y="80.0" width="130.0" height="50.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/>
<text x="735.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">Продовжує роботу</text>
<rect x="30.0" y="160.0" width="140.0" height="50.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="100.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">Ядро 1</tspan><tspan x="100.0" dy="13.0">(Потік 2 CPU-bound)</tspan></text>
<rect x="180.0" y="160.0" width="220.0" height="50.0" rx="6" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.0"/>
<text x="290.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Спить у futex_wait (очікує 5 мс)</text>
<rect x="410.0" y="160.0" width="110.0" height="50.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="465.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="middle" font-weight="700">Пробудження ОС (~50 мкс)</text>
<rect x="530.0" y="160.0" width="130.0" height="50.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="595.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Замок зайнятий! Спить</text>
<rect x="670.0" y="160.0" width="130.0" height="50.0" rx="6" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.0"/>
<text x="735.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Спить у futex_wait</text>
<line x1="400.0" y1="110.0" x2="410.0" y2="165.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="430.0" y1="80.0" x2="470.0" y2="80.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="530.0" y1="160.0" x2="560.0" y2="130.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30.0" y="240.0" width="780.0" height="205.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="420.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому виникає сповільнення багатопотокового CPU-bound коду:</text>
<rect x="45.0" y="285.0" width="230.0" height="140.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="160.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">1. Асиметрія кешу</tspan><tspan x="160.0" dy="13.0">М'ютекс gil_mutex перебуває</tspan><tspan x="160.0" dy="13.0">у L1/L2 кеші Ядра 0.</tspan><tspan x="160.0" dy="13.0">Ядро 0 повторно захоплює</tspan><tspan x="160.0" dy="13.0">його за лічені наносекунди,</tspan><tspan x="160.0" dy="13.0">перш ніж Ядро 1 прокинеться.</tspan></text>
<rect x="295.0" y="285.0" width="240.0" height="140.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="415.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">2. Затримка планувальника</tspan><tspan x="415.0" dy="13.0">Перемикання контексту ОС між</tspan><tspan x="415.0" dy="13.0">ядрами займає 20–80 мкс.</tspan><tspan x="415.0" dy="13.0">Потік 2 прокидається запізно,</tspan><tspan x="415.0" dy="13.0">бачить GIL зайнятим і знову</tspan><tspan x="415.0" dy="13.0">ініціює системний виклик сну.</tspan></text>
<rect x="555.0" y="285.0" width="240.0" height="140.0" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/><text x="675.0" y="332.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">3. Наслідки Thrashing</tspan><tspan x="675.0" dy="13.0">• Мільйони марних futex-викликів</tspan><tspan x="675.0" dy="13.0">• Постійні промахи кешу (MESI)</tspan><tspan x="675.0" dy="13.0">• Деградація швидкодії на 20–50%</tspan><tspan x="675.0" dy="13.0">порівняно з одним потоком!</tspan></text>
</svg>