<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Моделі пам'яті між процесами: multiprocessing.Queue проти SharedMemory</text>
<rect x="25.0" y="55.0" width="380.0" height="400.0" rx="8" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="215.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Модель 1: multiprocessing.Queue / Pipe (Pickle)</text>
<rect x="45.0" y="105.0" width="340.0" height="60.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="131.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Процес 1 (Купа процесу 1)</tspan><tspan x="215.0" dy="14.3">Об'єкт телеметрії / Масив NumPy (100 МБ)</tspan></text>
<rect x="45.0" y="180.0" width="340.0" height="65.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">pickle.dumps() Серіалізація</tspan><tspan x="215.0" dy="13.0">Перетворення об'єкта в потік байтів</tspan><tspan x="215.0" dy="13.0">[Високе навантаження CPU + копія в ОЗП]</tspan></text>
<rect x="45.0" y="260.0" width="340.0" height="65.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Системний канал (Pipe / Socket Buffer)</tspan><tspan x="215.0" dy="13.0">Копіювання байтів через ядро ОС (kernel space)</tspan><tspan x="215.0" dy="13.0">[Обмеження буфера пайпа: 64 КБ]</tspan></text>
<rect x="45.0" y="340.0" width="340.0" height="65.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">pickle.loads() Десеріалізація у Процесі 2</tspan><tspan x="215.0" dy="13.0">Створення дублікатів об'єктів у новій купі</tspan><tspan x="215.0" dy="13.0">[Загалом 3x копіювання пам'яті]</tspan></text>
<line x1="215.0" y1="165.0" x2="215.0" y2="180.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="215.0" y1="245.0" x2="215.0" y2="260.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="215.0" y1="325.0" x2="215.0" y2="340.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="435.0" y="55.0" width="380.0" height="400.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="625.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Модель 2: SharedMemory / POSIX shm (Zero-Copy)</text>
<rect x="455.0" y="105.0" width="340.0" height="65.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Процес 1 (Адресний простір 1)</tspan><tspan x="625.0" dy="13.0">Ініціалізація SharedMemory(create=True)</tspan><tspan x="625.0" dy="13.0">Створення numpy.ndarray над спільним буфером</tspan></text>
<rect x="455.0" y="195.0" width="340.0" height="110.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="227.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Спільний сегмент пам'яті ОС (POSIX shm)</tspan><tspan x="625.0" dy="13.0">/dev/shm або CreateFileMapping</tspan><tspan x="625.0" dy="13.0">Фізичні сторінки ОЗП відображені в таблиці</tspan><tspan x="625.0" dy="13.0">сторінок обох процесів (Shared Page Table)</tspan><tspan x="625.0" dy="13.0">[0 байтів копіювання, 0 накладних витрат]</tspan></text>
<rect x="455.0" y="330.0" width="340.0" height="65.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Процес 2 (Адресний простір 2)</tspan><tspan x="625.0" dy="13.0">Підключення SharedMemory(name=shm.name)</tspan><tspan x="625.0" dy="13.0">Пряме читання/запис без десеріалізації</tspan></text>
<rect x="455.0" y="405.0" width="340.0" height="35.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="625.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">Швидкодія: миттєвий доступ на швидкості ОЗП ⭐</tspan></text>
<line x1="625.0" y1="170.0" x2="625.0" y2="195.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="625.0" y1="305.0" x2="625.0" y2="330.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>