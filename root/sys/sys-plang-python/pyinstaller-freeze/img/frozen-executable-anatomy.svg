<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="220.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура автономного бінарного файлу (.exe / ELF)</text>
<text x="660.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Призначення та обробка компонента</text>
<rect x="50.0" y="65.0" width="340.0" height="45.0" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/><text x="220.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Заголовок образу (ELF / PE / Mach-O)</tspan></text>
<line x1="400.0" y1="87.5" x2="450.0" y2="87.5" stroke="#3949ab" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="65.0" width="400.0" height="45.0" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1.5"/><text x="660.0" y="90.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Містить точку входу, заголовки секцій і розмітку віртуальної пам'яті для ОС.</tspan></text>
<rect x="50.0" y="118.0" width="340.0" height="65.0" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/><text x="220.0" y="155.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Завантажувач (Bootloader на C)</tspan></text>
<line x1="400.0" y1="150.5" x2="450.0" y2="150.5" stroke="#1e88e5" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="118.0" width="400.0" height="65.0" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1.5"/><text x="660.0" y="153.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Скомпільований нативний код: шукає хвіст архіву, розпаковує файли та викликає CPython API.</tspan></text>
<rect x="50.0" y="191.0" width="340.0" height="55.0" rx="6" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/><text x="220.0" y="223.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Зміст архіву (Table of Contents / TOC)</tspan></text>
<line x1="400.0" y1="218.5" x2="450.0" y2="218.5" stroke="#8e24aa" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="191.0" width="400.0" height="55.0" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1.5"/><text x="660.0" y="221.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Карта зміщених блоків: імена файлів, розміри, прапорці стиснення та цільові підкаталоги.</tspan></text>
<rect x="50.0" y="254.0" width="340.0" height="65.0" rx="6" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/><text x="220.0" y="289.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Спільні бібліотеки (.so / .dll) та C-розширення (.pyd)</tspan></text>
<line x1="400.0" y1="286.5" x2="450.0" y2="286.5" stroke="#00897b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="254.0" width="400.0" height="65.0" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1.5"/><text x="660.0" y="289.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Бінарні залежності: libpython, C-модулі (numpy, cryptography) та системні DLL.</tspan></text>
<rect x="50.0" y="327.0" width="340.0" height="65.0" rx="6" fill="#fff8e1" stroke="#f57f17" stroke-width="1.5"/><text x="220.0" y="364.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Архів байткоду (PYZ / ZlibArchive)</tspan></text>
<line x1="400.0" y1="359.5" x2="450.0" y2="359.5" stroke="#f57f17" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="327.0" width="400.0" height="65.0" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1.5"/><text x="660.0" y="362.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Стиснені скомпільовані модулі .pyc стандартної бібліотеки та застосунку без сирців.</tspan></text>
<rect x="50.0" y="400.0" width="340.0" height="55.0" rx="6" fill="#fbe9e7" stroke="#d84315" stroke-width="1.5"/><text x="220.0" y="432.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Ресурси даних (Data Files &amp; Assets)</tspan></text>
<line x1="400.0" y1="427.5" x2="450.0" y2="427.5" stroke="#d84315" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="400.0" width="400.0" height="55.0" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1.5"/><text x="660.0" y="430.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Вбудовані небінарні файли: конфігурації, іконки, SSL-сертифікати, статичні шаблони.</tspan></text>
<rect x="50.0" y="463.0" width="340.0" height="45.0" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/><text x="220.0" y="490.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Кінцева мітка (Cookie / Trailer)</tspan></text>
<line x1="400.0" y1="485.5" x2="450.0" y2="485.5" stroke="#c62828" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="463.0" width="400.0" height="45.0" rx="6" fill="#fafafa" stroke="#cfd8dc" stroke-width="1.5"/><text x="660.0" y="488.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Службовий хвіст: зміщення до TOC, магічний рядок MEI, версія пакувальника.</tspan></text>
</svg>