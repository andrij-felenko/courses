<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="235.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1565c0" text-anchor="middle" font-weight="700">Режим One-Folder (--onedir)</text>
<rect x="40.0" y="50.0" width="390.0" height="410.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="55.0" y="70.0" width="360.0" height="48.0" rx="6" fill="#ffffff" stroke="#0288d1" stroke-width="1.5"/><text x="235.0" y="91.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">1. Запуск двійкового файлу в каталозі</tspan><tspan x="235.0" dy="11.7">Користувач запускає ./my_app. Бінарник лежить поруч із каталогом _internal.</tspan></text>
<line x1="235.0" y1="120.0" x2="235.0" y2="136.0" stroke="#0288d1" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="55.0" y="140.0" width="360.0" height="56.0" rx="6" fill="#ffffff" stroke="#0288d1" stroke-width="1.5"/><text x="235.0" y="165.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">2. Пряме завантаження DLL / .so на місці</tspan><tspan x="235.0" dy="11.7">Завантажувач налаштовує шляхи пошуку бібліотек на локальний каталог без копіювання.</tspan></text>
<line x1="235.0" y1="198.0" x2="235.0" y2="214.0" stroke="#0288d1" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="55.0" y="218.0" width="360.0" height="56.0" rx="6" fill="#ffffff" stroke="#0288d1" stroke-width="1.5"/><text x="235.0" y="243.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">3. Ініціалізація CPython і запуск коду</tspan><tspan x="235.0" dy="11.7">sys.frozen=True, sys._MEIPASS вказує на поточну теку застосунку. Байткод читається з PYZ.</tspan></text>
<line x1="235.0" y1="276.0" x2="235.0" y2="292.0" stroke="#0288d1" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="55.0" y="296.0" width="360.0" height="52.0" rx="6" fill="#ffffff" stroke="#0288d1" stroke-width="1.5"/><text x="235.0" y="319.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">4. Миттєвий старт без I/O накладних витрат</tspan><tspan x="235.0" dy="11.7">Дисковий ввід/вивід мінімальний: файли не розпаковуються у тимчасові теки.</tspan></text>
<line x1="235.0" y1="350.0" x2="235.0" y2="366.0" stroke="#0288d1" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="665.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c2410c" text-anchor="middle" font-weight="700">Режим One-File (--onefile)</text>
<rect x="470.0" y="50.0" width="390.0" height="410.0" rx="8" fill="#fffaf5" stroke="#fdba74" stroke-width="1.5"/>
<rect x="485.0" y="70.0" width="360.0" height="48.0" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/><text x="665.0" y="91.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">1. Запуск єдиного саморозпаковного файлу</tspan><tspan x="665.0" dy="11.7">Завантажувач вичитує зміщення з власного хвоста і знаходить вбудований TOC.</tspan></text>
<line x1="665.0" y1="120.0" x2="665.0" y2="136.0" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="485.0" y="140.0" width="360.0" height="56.0" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/><text x="665.0" y="165.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">2. Створення тимчасового каталогу _MEIxxxxxx</tspan><tspan x="665.0" dy="11.7">У /tmp або %TEMP% створюється унікальна тека, куди розпаковуються .so, DLL та ресурси.</tspan></text>
<line x1="665.0" y1="198.0" x2="665.0" y2="214.0" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="485.0" y="218.0" width="360.0" height="56.0" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/><text x="665.0" y="243.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">3. Ініціалізація CPython із sys._MEIPASS</tspan><tspan x="665.0" dy="11.7">sys._MEIPASS вказує на _MEIxxxxxx. Імпортер монтує PYZ, виконується точка входу.</tspan></text>
<line x1="665.0" y1="276.0" x2="665.0" y2="292.0" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="485.0" y="296.0" width="360.0" height="52.0" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/><text x="665.0" y="319.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">4. Завершення процесу та очищення</tspan><tspan x="665.0" dy="11.7">При коректному виході завантажувач рекурсивно видаляє теку _MEI. При збої тека лишається.</tspan></text>
<line x1="665.0" y1="350.0" x2="665.0" y2="366.0" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>