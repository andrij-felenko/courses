<text x="90.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Неправильно: межа посеред сектора → A і B ділять один сектор</text>
