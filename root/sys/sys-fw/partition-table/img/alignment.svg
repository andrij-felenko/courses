<text x="360.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Flash поділений на сектори по 4 КБ (стирання — цілим сектором)</text>
<text x="90.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Правильно: межі збігаються з межами секторів</text>
