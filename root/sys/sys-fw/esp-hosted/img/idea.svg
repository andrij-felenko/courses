<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="290" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ESP-Hosted: хост бере радіо сусіднього чипа</text>
<rect x="56.0" y="92.0" width="250.0" height="92.0" rx="10" fill="#fbfbfb" stroke="#2457d6" stroke-width="1.8"/>
<text x="181.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">ХОСТ (ведучий)</text>
<text x="181.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="181.0" dy="0.0">ESP32-P4 / Linux / STM32</tspan><tspan x="181.0" dy="13.0">рахує, але радіо НЕ має</tspan></text>
<text x="181.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-style="italic">✗ без власної антени</text>
<rect x="454.0" y="92.0" width="250.0" height="92.0" rx="10" fill="#fbfbfb" stroke="#27ae60" stroke-width="1.8"/>
<text x="579.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ВЕДЕНИЙ (радіо-чип)</text>
<text x="579.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="579.0" dy="0.0">ESP32-C6 / C3 / 32</tspan><tspan x="579.0" dy="13.0">увесь Wi-Fi і Bluetooth</tspan></text>
<text x="579.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-style="italic">((•)) має радіо</text>
<line x1="310.0" y1="126.0" x2="450.0" y2="126.0" stroke="#b08900" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="450.0" y1="150.0" x2="310.0" y2="150.0" stroke="#b08900" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="380.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b08900" text-anchor="middle" font-weight="700">SDIO / SPI / UART</text>
<text x="380.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">радіо фізично в сусіда — а хост користується ним, наче власним</text>
</svg>