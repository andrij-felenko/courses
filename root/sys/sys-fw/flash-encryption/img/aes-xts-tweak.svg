<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="800.0" height="340.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.5"/>
<text x="410.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм модифікатора адреси (Tweak) у режимі AES-XTS</text>
<rect x="30.0" y="55.0" width="360.0" height="275.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="210.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Блок 1 (Фізична адреса 0x010000)</text>
<rect x="60.0" y="96.3" width="300.0" height="37.3" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="210.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Відкритий текст P₁ (32 байти)</tspan><tspan x="210.0" dy="14.3">[0xFF, 0xFF, 0xFF, ... 0xFF]</tspan></text>
<rect x="90.0" y="166.3" width="240.0" height="37.3" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="210.0" y="181.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Обчислення твіка:</tspan><tspan x="210.0" dy="14.3">T₁ = AES_K2 (0x010000)</tspan></text>
<rect x="60.0" y="254.3" width="300.0" height="41.3" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="271.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Шифротекст C₁ (у Flash):</tspan><tspan x="210.0" dy="14.3">0x8F 3A D1 90 BC ... 4E</tspan></text>
<line x1="210.0" y1="138.0" x2="210.0" y2="162.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="210.0" y1="212.0" x2="210.0" y2="245.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="210.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">P₁ ⊕ T₁ → AES_K1 → ⊕ T₁</text>
<rect x="430.0" y="55.0" width="360.0" height="275.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="610.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Блок 2 (Фізична адреса 0x020000)</text>
<rect x="460.0" y="96.3" width="300.0" height="37.3" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="610.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Той самий відкритий текст P₂ = P₁</tspan><tspan x="610.0" dy="14.3">[0xFF, 0xFF, 0xFF, ... 0xFF]</tspan></text>
<rect x="490.0" y="166.3" width="240.0" height="37.3" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="610.0" y="181.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Обчислення твіка:</tspan><tspan x="610.0" dy="14.3">T₂ = AES_K2 (0x020000)  [T₂ ≠ T₁]</tspan></text>
<rect x="460.0" y="254.3" width="300.0" height="41.3" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="610.0" y="271.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Геть інший шифротекст C₂:</tspan><tspan x="610.0" dy="14.3">0x1B 9C 04 F7 82 ... D3  (C₂ ≠ C₁)</tspan></text>
<line x1="610.0" y1="138.0" x2="610.0" y2="162.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="610.0" y1="212.0" x2="610.0" y2="245.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="610.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">P₂ ⊕ T₂ → AES_K1 → ⊕ T₂</text>
</svg>