<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 852.8 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="852.8" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="370.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.5"/>
<text x="420.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Етапи первинного шифрування Flash під час першого завантаження</text>
<rect x="10.2" y="115.1" width="179.6" height="49.8" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="100.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="100.0" dy="0.0">ПК записує відкритий</tspan><tspan x="100.0" dy="13.7">завантажувач, таблицю</tspan><tspan x="100.0" dy="13.7">розділів та додаток у Flash.</tspan></text>
<text x="100.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="700">1. Прошивання через UART</text>
<rect x="167.2" y="115.1" width="185.6" height="49.8" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="260.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">ROM бачить прапорець</tspan><tspan x="260.0" dy="13.7">активації у меню конфігурації</tspan><tspan x="260.0" dy="13.7">та передає хід завантажувачу.</tspan></text>
<text x="260.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle" font-weight="700">2. Старт ROM Bootloader</text>
<rect x="321.2" y="115.1" width="197.5" height="49.8" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="420.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Апаратний RNG генерує</tspan><tspan x="420.0" dy="13.7">256-біт ключ. Запис у eFuse</tspan><tspan x="420.0" dy="13.7">і блокування зчитування RD_DIS.</tspan></text>
<text x="420.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">3. Генерація ключа eFuse</text>
<rect x="493.2" y="115.1" width="173.6" height="49.8" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/><text x="580.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Завантажувач читає сектори,</tspan><tspan x="580.0" dy="13.7">шифрує через AES-XTS і пише</tspan><tspan x="580.0" dy="13.7">назад у Flash (in-place).</tspan></text>
<text x="580.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ca8a04" text-anchor="middle" font-weight="700">4. Шифрування за місцем</text>
<rect x="647.2" y="115.1" width="185.6" height="49.8" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Пропалювання FLASH_CRYPT_CNT.</tspan><tspan x="740.0" dy="13.7">М'яке перезавантаження чипа.</tspan><tspan x="740.0" dy="13.7">Надалі шина завжди шифрована.</tspan></text>
<text x="740.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">5. Фіксація лічильника</text>
<line x1="170.0" y1="140.0" x2="190.0" y2="140.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="330.0" y1="140.0" x2="350.0" y2="140.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="490.0" y1="140.0" x2="510.0" y2="140.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="650.0" y1="140.0" x2="670.0" y2="140.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="235.0" width="760.0" height="120.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="420.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння режимів Flash Encryption в ESP-IDF</text>
<rect x="55.0" y="275.0" width="350.0" height="65.0" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.0"/>
<text x="230.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">Development Mode (Розробка)</text>
<text x="230.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Дозволяє повторне перепрошивання через UART</text>
<text x="230.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• FLASH_CRYPT_CNT можна перемикати (до вичерпання бітів)</text>
<rect x="435.0" y="275.0" width="350.0" height="65.0" rx="4" fill="#fef2f2" stroke="#c0392b" stroke-width="1.0"/>
<text x="610.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Release Mode (Серійне виробництво)</text>
<text x="610.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Незворотне блокування: FLASH_CRYPT_CNT = max</text>
<text x="610.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">• UART ROM Download і JTAG назавжди відключені</text>
</svg>