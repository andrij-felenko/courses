<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фрагментація пам'яті: heap_2 проти злиття блоків у heap_4</text>
<rect x="20.0" y="20.0" width="780.0" height="390.0" rx="10" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="410.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виділено три блоки (A=200Б, B=300Б, C=200Б), після чого блоки A та B звільнено</text>
<rect x="40.0" y="75.0" width="740.0" height="135.0" rx="6" fill="#fdfcf7" stroke="#b8860b" stroke-width="1.5"/>
<text x="60.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="start" font-weight="700">heap_2 (Best-Fit, список за розміром, БЕЗ злиття сусідів):</text>
<rect x="60.0" y="113.0" width="160.0" height="50.0" rx="4" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/>
<text x="140.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b8860b" text-anchor="middle" font-weight="700">Вільний A (200 Б)</text>
<rect x="230.0" y="113.0" width="220.0" height="50.0" rx="4" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/>
<text x="340.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b8860b" text-anchor="middle" font-weight="700">Вільний B (300 Б)</text>
<rect x="460.0" y="113.0" width="160.0" height="50.0" rx="4" fill="#d6eaf8" stroke="#2457d6" stroke-width="1.5"/>
<text x="540.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Зайнятий C (200 Б)</text>
<rect x="630.0" y="113.0" width="130.0" height="50.0" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="695.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Решта пулу...</text>
<text x="60.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Запит на 400 Б → ВІДМОВА (NULL)! Сусідні блоки A і B ізольовані й не об'єднуються.</text>
<rect x="40.0" y="230.0" width="740.0" height="160.0" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/>
<text x="60.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">heap_4 (First-Fit, список за адресою, ЗЛИВАННЯ суміжних вільних блоків):</text>
<rect x="60.0" y="268.0" width="390.0" height="50.0" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="2.0"/>
<text x="255.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Об'єднаний вільний блок (A + B = 500 Б)</text>
<text x="255.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Суміжні вільні ділянки зшиваються в єдиний монолітний простір</text>
<rect x="460.0" y="268.0" width="160.0" height="50.0" rx="4" fill="#d6eaf8" stroke="#2457d6" stroke-width="1.5"/>
<text x="540.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Зайнятий C (200 Б)</text>
<rect x="630.0" y="268.0" width="130.0" height="50.0" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/>
<text x="695.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Решта пулу...</text>
<text x="60.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Запит на 400 Б → УСПІХ! Виділяється 400 Б, залишок 100 Б повертається у список.</text>
<text x="60.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">Зовнішня фрагментація активно нівелюється під час кожного виклику vPortFree()</text>
</svg>