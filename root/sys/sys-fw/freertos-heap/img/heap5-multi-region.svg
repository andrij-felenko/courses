<text x="410.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Критичне правило впорядкування: Регіони в масиві МУСЯТЬ бути відсортовані за зростанням адрес!</text>
<text x="410.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Масив завершується нульовим термінатором: { NULL, 0 }. Усі регіони зшиваються в єдиний First-Fit список.</text>
<text x="410.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Злиття блоків (coalescing) працює всередині кожного банку; між банками межі фізично ізольовані.</text>
