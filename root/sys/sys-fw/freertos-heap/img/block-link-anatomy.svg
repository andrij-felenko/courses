<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія заголовка блока BlockLink_t у FreeRTOS</text>
<rect x="20.0" y="20.0" width="740.0" height="280.0" rx="10" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="390.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія виділеного блока пам'яті та заголовка BlockLink_t (32-бітний MCU)</text>
<rect x="50.0" y="75.0" width="680.0" height="90.0" rx="6" fill="#fcfcfc" stroke="#333333" stroke-width="1.5"/>
<rect x="50.0" y="75.0" width="230.0" height="90.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="165.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Службовий заголовок BlockLink_t (8 Б)</text>
<rect x="60.0" y="107.0" width="100.0" height="48.0" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/>
<text x="110.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">pxNextFreeBlock</text>
<text x="110.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">4 байти</text>
<rect x="170.0" y="107.0" width="100.0" height="48.0" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/>
<text x="220.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">xBlockSize | MSB</text>
<text x="220.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">4 байти (MSB=стан)</text>
<rect x="280.0" y="75.0" width="450.0" height="90.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="505.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Корисне навантаження (Payload) користувача</text>
<text x="505.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Вирівняно на 8 байтів (portBYTE_ALIGNMENT)</text>
<rect x="50.0" y="195.0" width="310.0" height="85.0" rx="6" fill="#fef9e7" stroke="#b8860b" stroke-width="1.2"/>
<text x="205.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b8860b" text-anchor="middle" font-weight="700">Біт стану xBlockAllocatedBit (старший біт MSB):</text>
<text x="205.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Біт 31 = 1: Блок виділено (зайнято користувачем)</text>
<text x="205.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Біт 31 = 0: Блок вільний у списку xStart/xEnd</text>
<text x="205.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-style="italic">Економить 4 байти на прапорець зайнятості!</text>
<rect x="390.0" y="195.0" width="340.0" height="85.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/>
<text x="560.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Вказівник pv від pvPortMalloc():</text>
<text x="560.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">pv = (void*)( (uint8_t*)pBlock + xHeapStructSize )</text>
<text x="560.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">При vPortFree(pv) заголовок шукається зсувом назад:</text>
<text x="560.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">pBlock = (BlockLink_t*)( (uint8_t*)pv - xHeapStructSize )</text>
</svg>