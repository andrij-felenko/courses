<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому Flash Encryption несумісний із прямим оновленням NVS</text>
<rect x="40.0" y="60.0" width="320.0" height="210.0" rx="10" fill="#fff8f6" stroke="#c0392b" stroke-width="1.8"/>
<text x="200.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Апаратний Flash Encryption</text>
<text x="200.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Блочний шифр AES-XTS (по 32 байти)</text>
<rect x="56.0" y="122.0" width="288.0" height="46.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="200.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зміна стану: 11 → 10 (гасимо 1 біт)</text>
<text x="200.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Лавинний ефект: усі 32 байти шифру інші</text>
<rect x="56.0" y="180.0" width="288.0" height="72.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="200.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ПОМИЛКА ЗАПИСУ FLASH</text>
<text x="200.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Шифротекст вимагає 0 → 1 без стирання;</text>
<text x="200.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">потрібно прати весь сектор 4 КБ!</text>
<rect x="400.0" y="60.0" width="320.0" height="210.0" rx="10" fill="#f6fbf7" stroke="#27ae60" stroke-width="1.8"/>
<text x="560.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Шифрування NVS (ESP-IDF)</text>
<text x="560.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Дворівневе розділення заголовків і даних</text>
<rect x="416.0" y="122.0" width="288.0" height="46.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="560.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Заголовки й бітова карта — ВІДКРИТІ</text>
<text x="560.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Біти 11 → 10 → 00 гасяться прямо у Flash</text>
<rect x="416.0" y="180.0" width="288.0" height="72.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/>
<text x="560.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ТІЛО ЗАПИСУ — ЗАШИФРОВАНЕ</text>
<text x="560.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Кожен запис шифрується AES-XTS окремо;</text>
<text x="560.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">tweak прив'язаний до адреси запису</text>
<text x="380.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">NVS лишає службові прапорці відкритими для гасіння бітів 1→0, шифруючи лише корисні дані</text>
</svg>