<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність безпечної ініціалізації NVS</text>
<rect x="40.0" y="70.0" width="150.0" height="80.0" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="115.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Знайти розділи</text>
<text x="115.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">nvs та nvs_key</tspan><tspan x="115.0" dy="12.5">у Partition Table</tspan></text>
<rect x="230.0" y="70.0" width="150.0" height="80.0" rx="8" fill="#f0f6ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="305.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2. Читати ключ</text>
<text x="305.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">nvs_flash_read_</tspan><tspan x="305.0" dy="12.5">security_cfg()</tspan></text>
<rect x="420.0" y="70.0" width="150.0" height="80.0" rx="8" fill="#fffbf0" stroke="#d97706" stroke-width="1.6"/>
<text x="495.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">3. Перевірити ключ</text>
<text x="495.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">Знайдено? Чи ключ</tspan><tspan x="495.0" dy="12.5">ще не записано?</tspan></text>
<rect x="610.0" y="70.0" width="120.0" height="80.0" rx="8" fill="#fff8f6" stroke="#c0392b" stroke-width="1.6"/>
<text x="670.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">4а. Генерація</text>
<text x="670.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Генерація TRNG</tspan><tspan x="670.0" dy="12.5">та запис у Flash</tspan></text>
<rect x="420.0" y="190.0" width="150.0" height="70.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="495.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">4б. Secure Init</text>
<text x="495.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">nvs_flash_secure_</tspan><tspan x="495.0" dy="12.5">init_partition()</tspan></text>
<rect x="40.0" y="190.0" width="340.0" height="70.0" rx="8" fill="#f6fbf7" stroke="#27ae60" stroke-width="1.6"/>
<text x="210.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">5. Готово до роботи</text>
<text x="210.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">nvs_open_from_partition() → get / set / commit</tspan><tspan x="210.0" dy="12.5">Повне шифрування прозоре для програми</tspan></text>
<line x1="190.0" y1="110.0" x2="230.0" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380.0" y1="110.0" x2="420.0" y2="110.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="570.0" y1="110.0" x2="610.0" y2="110.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="590.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Немає</text>
<path d="M670 150 L670 225 L570 225" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="495.0" y1="150.0" x2="495.0" y2="190.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="515.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Є ключ</text>
<line x1="420.0" y1="225.0" x2="380.0" y2="225.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="380.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Автоматичний життєвий цикл: читання наявних ключів або безпечна одноразова генерація через TRNG</text>
</svg>