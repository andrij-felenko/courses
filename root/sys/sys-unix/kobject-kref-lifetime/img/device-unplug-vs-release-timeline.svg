<svg xmlns="http://www.w3.org/2000/svg" viewBox="-49.6 -10 1099.6 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-49.6" y="-10" width="1099.6" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="152.9" y="17.0" width="744.2" height="36.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="525.0" y="40.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">Розділення фізичного від'єднання (Unplug) та звільнення пам'яті (Release)</tspan></text>
<line x1="100.0" y1="80.0" x2="950.0" y2="80.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="960.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Час (t)</text>
<text x="90.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">Апаратний стан:</text>
<rect x="140.0" y="107.3" width="220.0" height="45.3" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="250.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Пристрій підключено</tspan><tspan x="250.0" dy="14.3">Нормальна робота (USB/PCI)</tspan></text>
<line x1="365.0" y1="130.0" x2="445.0" y2="130.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="405.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Hot-Unplug!</text>
<rect x="490.0" y="107.3" width="220.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Апаратура фізично відсутня</tspan><tspan x="600.0" dy="14.3">Лінії шини відключено</tspan></text>
<text x="90.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">Ядро та sysfs:</text>
<rect x="140.0" y="197.3" width="220.0" height="45.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="216.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">/sys/devices/.../dev0 існує</tspan><tspan x="250.0" dy="14.3">Каталог і файли доступні</tspan></text>
<rect x="480.0" y="190.2" width="240.0" height="59.6" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="209.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">kobject_del() / kernfs_drain</tspan><tspan x="600.0" dy="14.3">Каталог миттєво видалено з /sys</tspan><tspan x="600.0" dy="14.3">Нові open/read дають -ENODEV</tspan></text>
<text x="90.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">Процеси користувача:</text>
<rect x="140.0" y="297.4" width="220.0" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="316.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Процес А: відкрив /sys/.../stat</tspan><tspan x="250.0" dy="14.3">Процес Б: виконує ioctl()</tspan></text>
<rect x="480.0" y="290.2" width="240.0" height="59.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="309.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Процес А читає буфер kernfs</tspan><tspan x="600.0" dy="14.3">Процес Б завершує системний виклик</tspan><tspan x="600.0" dy="14.3">Поточні виклики добігають кінця</tspan></text>
<rect x="780.0" y="297.4" width="180.0" height="45.3" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="870.0" y="316.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">close(fd)</tspan><tspan x="870.0" dy="14.3">Всі дескриптори закрито</tspan></text>
<text x="90.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">refcount &amp; Пам'ять:</text>
<rect x="140.0" y="410.2" width="220.0" height="59.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="429.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">kref refcount = 3</tspan><tspan x="250.0" dy="14.3">(драйвер + процес А + процес Б)</tspan><tspan x="250.0" dy="14.3">Пам'ять валідна</tspan></text>
<rect x="480.0" y="410.2" width="240.0" height="59.6" rx="6" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="429.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Драйвер скинув своє посилання</tspan><tspan x="600.0" dy="14.3">kref refcount = 2 ──► 1</tspan><tspan x="600.0" dy="14.3">Пам'ять все ще утримується!</tspan></text>
<rect x="740.6" y="410.2" width="258.7" height="59.6" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="870.0" y="429.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">kref refcount = 0</tspan><tspan x="870.0" dy="14.3">ktype-&gt;release(kobj)</tspan><tspan x="870.0" dy="14.3">kfree(my_dev) ──► Пам'ять звільнено</tspan></text>
<line x1="450.0" y1="95.0" x2="450.0" y2="480.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="450.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">t1: Від'єднання пристрою</text>
<line x1="735.0" y1="95.0" x2="735.0" y2="480.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="735.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">t2: Завершення I/O</text>
<line x1="960.0" y1="95.0" x2="960.0" y2="480.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="960.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">t3: Фінальний release()</text>
<text x="500.0" y="545.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Завдяки kref аварія use-after-free неможлива: пам'ять живе довше за апаратуру рівно на стільки, скільки триває I/O</text>
</svg>