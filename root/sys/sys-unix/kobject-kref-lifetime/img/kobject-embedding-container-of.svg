<rect x="93.2" y="17.0" width="813.6" height="36.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="40.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Вбудовування struct kobject у структуру драйвера та перехід через container_of()</tspan></text>
