<text x="25.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">dev (базова адреса)</text>
<rect x="80.0" y="131.2" width="400.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="151.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">int dev_id</tspan><tspan x="280.0" dy="15.6">ідентифікатор екземпляра [offset 0]</tspan></text>
<rect x="80.0" y="191.2" width="400.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">void __iomem *mmio_base</tspan><tspan x="280.0" dy="15.6">відображені регістри пристрою [offset 8]</tspan></text>
<rect x="80.0" y="260.0" width="400.0" height="170.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="280.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">struct kobject kobj [offset 24]</text>
<text x="100.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="100.0" dy="0.0">const char *name  ──► &quot;my_dev0&quot;</tspan><tspan x="100.0" dy="14.9">struct kref kref  ──► refcount = 1</tspan><tspan x="100.0" dy="14.9">struct kobject *parent, *kset</tspan><tspan x="100.0" dy="14.9">const struct kobj_type *ktype ──► my_ktype</tspan><tspan x="100.0" dy="14.9">struct kernfs_node *sd ──► /sys/devices/.../my_dev0</tspan></text>
<line x1="30.0" y1="280.0" x2="78.0" y2="280.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="25.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">kobj_ptr (&amp;dev-&gt;kobj)</text>
<rect x="80.0" y="446.2" width="400.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="466.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">struct cdev cdev</tspan><tspan x="280.0" dy="15.6">інтерфейс символьного пристрою [offset 104]</tspan></text>
<rect x="540.0" y="90.0" width="420.0" height="430.0" rx="8" fill="none" stroke="#333333" stroke-width="1.8"/>
<text x="750.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Арифметика container_of(ptr, type, member)</text>
<text x="560.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="560.0" dy="0.0">1. Макрос отримує вказівник на kobject:</tspan><tspan x="560.0" dy="15.5">   struct kobject *kobj_ptr = ...;</tspan><tspan x="560.0" dy="15.5"></tspan><tspan x="560.0" dy="15.5">2. Обчислюється байтовий зсув поля:</tspan><tspan x="560.0" dy="15.5">   size_t offset = offsetof(struct my_device, kobj);</tspan><tspan x="560.0" dy="15.5">   // offset = 24 байти</tspan><tspan x="560.0" dy="15.5"></tspan><tspan x="560.0" dy="15.5">3. Від адреси kobj віднімається зсув:</tspan><tspan x="560.0" dy="15.5">   char *raw = (char *)kobj_ptr - offset;</tspan><tspan x="560.0" dy="15.5"></tspan><tspan x="560.0" dy="15.5">4. Приведення до цільового типу структури:</tspan><tspan x="560.0" dy="15.5">   struct my_device *dev = (struct my_device *)raw;</tspan></text>
<rect x="511.8" y="431.8" width="476.3" height="46.5" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="451.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">dev = container_of(kobj_ptr, struct my_device, kobj);</tspan><tspan x="750.0" dy="15.0">Єдиний безпечний спосіб дістатися драйвера з release() чи show()</tspan></text>
<line x1="480.0" y1="280.0" x2="538.0" y2="280.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>