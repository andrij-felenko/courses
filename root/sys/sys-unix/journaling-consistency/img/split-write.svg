<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 800" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="800" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три записи однієї операції — і те, що лишає збій</text>
<text x="60.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">echo &quot;17:42 запуск&quot; &gt;&gt; /var/log/app.log   —   три записи в три різні місця</text>
<rect x="60.0" y="120.0" width="1000.0" height="90.0" rx="8" fill="#eef1f4" stroke="#6b7280" stroke-width="1.4"/>
<rect x="90.0" y="136.0" width="220.0" height="58.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><text x="200.0" y="161.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">бітова карта</tspan><tspan x="200.0" dy="16.9">5000 → зайнятий</tspan></text>
<circle cx="200.0" cy="100.0" r="15.0" fill="#fff6e5" stroke="#b8860b" stroke-width="2.0"/>
<text x="200.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="middle" font-weight="700">1</text>
