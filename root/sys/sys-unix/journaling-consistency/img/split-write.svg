<rect x="590.0" y="285.0" width="470.0" height="435.0" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<rect x="590.0" y="285.0" width="470.0" height="44.0" rx="10" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="825.0" y="312.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="825.0" dy="0.0">збій: не встиг inode</tspan></text>
<rect x="610.0" y="352.0" width="430.0" height="32.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.4"/><text x="825.0" y="372.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">бітова карта: 5000 зайнятий — записано</tspan></text>
<rect x="610.0" y="394.0" width="430.0" height="32.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.4"/><text x="825.0" y="414.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">блок даних 5000 — записано</tspan></text>
<rect x="610.0" y="436.0" width="430.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="825.0" y="456.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">inode: розмір і вказівник — НІ</tspan></text>
<line x1="825.0" y1="488.0" x2="825.0" y2="522.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610.0" y="528.0" width="430.0" height="108.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.6"/><text x="825.0" y="569.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">на блок 5000 не вказує ніхто;</tspan><tspan x="825.0" dy="16.9">його вже ніколи не видадуть —</tspan><tspan x="825.0" dy="16.9">місце просто зникло з тому</tspan></text>
<rect x="754.2" y="661.0" width="141.5" height="34.0" rx="16" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/><text x="825.0" y="682.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="825.0" dy="0.0">втрачене місце</tspan></text>
