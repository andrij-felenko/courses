<circle cx="550.0" cy="100.0" r="15.0" fill="#fff6e5" stroke="#b8860b" stroke-width="2.0"/>
<text x="550.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="middle" font-weight="700">2</text>
<rect x="790.0" y="136.0" width="220.0" height="58.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><text x="900.0" y="161.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">inode файлу</tspan><tspan x="900.0" dy="16.9">розмір, вказівник</tspan></text>
<circle cx="900.0" cy="100.0" r="15.0" fill="#fff6e5" stroke="#b8860b" stroke-width="2.0"/>
<text x="900.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="middle" font-weight="700">3</text>
<text x="60.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">носій виконує їх по одному й у порядку, який обирає сам — збій ловить будь-яку підмножину</text>
<rect x="60.0" y="285.0" width="470.0" height="435.0" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
