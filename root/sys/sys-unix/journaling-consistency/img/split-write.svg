<rect x="80.0" y="394.0" width="430.0" height="32.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.4"/><text x="295.0" y="414.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">inode: «мій блок 5000» — записано</tspan></text>
<rect x="80.0" y="436.0" width="430.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="295.0" y="456.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">бітова карта: 5000 вільний — НІ</tspan></text>
<line x1="295.0" y1="488.0" x2="295.0" y2="522.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="528.0" width="430.0" height="108.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="295.0" y="569.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">той самий блок видадуть другому файлу;</tspan><tspan x="295.0" dy="16.9">два власники пишуть в одну комірку</tspan><tspan x="295.0" dy="16.9">й псують дані одне одному</tspan></text>
