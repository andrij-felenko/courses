<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1170 720" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1170" height="720" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Транзакція журналу: опис, печатка, відтворення, перенесення</text>
<rect x="60.0" y="90.0" width="1040.0" height="150.0" rx="8" fill="#eef1f4" stroke="#6b7280" stroke-width="1.4"/>
<text x="70.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">журнал — кільце: дійшли до кінця, пишемо спочатку</text>
<text x="348.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">транзакція №41 — запечатана</text>
<text x="838.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">транзакція №42 — обірвана</text>
<rect x="90.0" y="140.0" width="120.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="150.0" y="174.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">дескриптор</tspan><tspan x="150.0" dy="15.6">№41</tspan></text>
<rect x="222.0" y="140.0" width="120.0" height="76.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="282.0" y="174.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="282.0" dy="0.0">копія</tspan><tspan x="282.0" dy="15.6">блока</tspan></text>
<rect x="354.0" y="140.0" width="120.0" height="76.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="414.0" y="174.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="414.0" dy="0.0">копія</tspan><tspan x="414.0" dy="15.6">блока</tspan></text>
<rect x="486.0" y="140.0" width="120.0" height="76.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="546.0" y="174.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="546.0" dy="0.0">БЛОК</tspan><tspan x="546.0" dy="15.6">ФІКСАЦІЇ №41</tspan></text>
<rect x="646.0" y="140.0" width="120.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="706.0" y="174.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="706.0" dy="0.0">дескриптор</tspan><tspan x="706.0" dy="15.6">№42</tspan></text>
<rect x="778.0" y="140.0" width="120.0" height="76.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="838.0" y="174.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="838.0" dy="0.0">копія</tspan><tspan x="838.0" dy="15.6">блока</tspan></text>
<rect x="910.0" y="140.0" width="120.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="970.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="970.0" dy="0.0">фіксації</tspan><tspan x="970.0" dy="15.6">немає</tspan></text>
<text x="60.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">скидання кешу носія — перед блоком фіксації і після нього; без них порядок не гарантований</text>
<line x1="348.0" y1="282.0" x2="348.0" y2="312.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="838.0" y1="282.0" x2="838.0" y2="312.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="148.0" y="316.0" width="400.0" height="82.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="348.0" y="353.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="348.0" dy="0.0">печатка є → відтворити:</tspan><tspan x="348.0" dy="16.9">переписати копії в їхні справжні місця</tspan></text>
<rect x="638.0" y="316.0" width="400.0" height="82.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="838.0" y="353.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="838.0" dy="0.0">печатки немає → відкинути:</tspan><tspan x="838.0" dy="16.9">том такий, ніби операції не було</tspan></text>
<rect x="160.0" y="438.0" width="700.0" height="84.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="510.0" y="476.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">перенесення: блоки з журналу переписують у їхні справжні місця —</tspan><tspan x="510.0" dy="16.9">і лише після цього займане місце в кільці стає вільним</tspan></text>
<line x1="300.0" y1="526.0" x2="300.0" y2="562.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="200.0" y="568.0" width="200.0" height="62.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><text x="300.0" y="603.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">бітова карта</tspan></text>
<line x1="570.0" y1="526.0" x2="570.0" y2="562.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="470.0" y="568.0" width="200.0" height="62.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><text x="570.0" y="603.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">таблиця inode</tspan></text>
<line x1="840.0" y1="526.0" x2="840.0" y2="562.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="740.0" y="568.0" width="200.0" height="62.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><text x="840.0" y="603.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">блок каталогу</tspan></text>
<text x="60.0" y="676.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">ціна відновлення залежить від того, скільки роботи було в польоті, а не від розміру тому</text>
</svg>