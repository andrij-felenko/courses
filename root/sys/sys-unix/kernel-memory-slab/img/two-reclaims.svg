<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому пам'ять ядра звільняють проханням, а не забиранням</text>
<rect x="60.0" y="44.0" width="540.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.9"/><text x="330.0" y="74.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">СТОРІНКИ ПРОЦЕСІВ</tspan></text>
<rect x="620.0" y="44.0" width="540.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.9"/><text x="890.0" y="74.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">ОБ'ЄКТИ ЯДРА</tspan></text>
<rect x="60.0" y="112.0" width="540.0" height="84.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.3"/><text x="330.0" y="158.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">черги: видно, до чого давно не зверталися</tspan></text>
<rect x="620.0" y="112.0" width="540.0" height="84.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.3"/><text x="890.0" y="150.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">черг нема: на сторінці слаба</tspan><tspan x="890.0" dy="15.6">десятки об'єктів різних власників</tspan></text>
<rect x="60.0" y="208.0" width="540.0" height="84.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.3"/><text x="330.0" y="246.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">зворотні відображення: видно всіх,</tspan><tspan x="330.0" dy="15.6">хто на сторінку посилається</tspan></text>
<rect x="620.0" y="208.0" width="540.0" height="84.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.3"/><text x="890.0" y="246.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">зворотних відображень нема: хто тримає</tspan><tspan x="890.0" dy="15.6">вказівник на об'єкт — невідомо нікому</tspan></text>
<rect x="60.0" y="304.0" width="540.0" height="84.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.3"/><text x="330.0" y="342.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">підкладка: вміст є куди відкласти —</tspan><tspan x="330.0" dy="15.6">у файл або у своп</tspan></text>
<rect x="620.0" y="304.0" width="540.0" height="84.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.3"/><text x="890.0" y="342.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">підкладки нема: структуру ядра</tspan><tspan x="890.0" dy="15.6">нікуди відкласти й нізвідки перечитати</tspan></text>
<rect x="60.0" y="404.0" width="540.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="330.0" y="442.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">відбір ЗАБИРАЄ сам</tspan></text>
<rect x="620.0" y="404.0" width="540.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="890.0" y="442.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">відбір може лише ПОПРОСИТИ</tspan></text>
<text x="610.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">протокол прохання складається з двох запитань</text>
<rect x="60.0" y="536.0" width="300.0" height="76.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="210.0" y="570.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">скільки об'єктів</tspan><tspan x="210.0" dy="15.6">ти міг би звільнити?</tspan></text>
<rect x="400.0" y="536.0" width="300.0" height="76.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.6"/><text x="550.0" y="570.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">стільки-то —</tspan><tspan x="550.0" dy="15.6">відповідає власник</tspan></text>
<rect x="740.0" y="536.0" width="300.0" height="76.0" rx="6" fill="#fdf6e3" stroke="#b7791f" stroke-width="1.6"/><text x="890.0" y="570.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">звільни ось таку</tspan><tspan x="890.0" dy="15.6">частку від них</tspan></text>
<line x1="366.0" y1="574.0" x2="396.0" y2="574.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="706.0" y1="574.0" x2="736.0" y2="574.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1076.0" y="536.0" width="84.0" height="76.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="1118.0" y="578.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="1118.0" dy="0.0">звіт</tspan></text>
<line x1="1046.0" y1="574.0" x2="1072.0" y2="574.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="610.0" y="660.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">частку рахують однакову для всіх — і для черг сторінок, і для кожного кеша ядра</text>
</svg>