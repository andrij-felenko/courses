<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розв'язання символів і phandle під час накладання DTBO</text>
<rect x="40.0" y="80.0" width="360.0" height="580.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="296.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Базове Дерево Пристроїв (of_root)</tspan><tspan x="220.0" dy="15.6"></tspan><tspan x="220.0" dy="15.6">/soc/bus@40000000/i2c@40001000</tspan><tspan x="220.0" dy="15.6">  (phandle = 0x00000001)</tspan><tspan x="220.0" dy="15.6"></tspan><tspan x="220.0" dy="15.6">/soc/bus@40000000/gpio@40002000</tspan><tspan x="220.0" dy="15.6">  (phandle = 0x00000002)</tspan><tspan x="220.0" dy="15.6"></tspan><tspan x="220.0" dy="15.6">Вузол __symbols__:</tspan><tspan x="220.0" dy="15.6">  i2c1 = &quot;/soc/bus@40000000/i2c@40001000&quot;</tspan><tspan x="220.0" dy="15.6">  gpio2 = &quot;/soc/bus@40000000/gpio@40002000&quot;</tspan></text>
<rect x="900.0" y="80.0" width="360.0" height="580.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="1080.0" y="288.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">Фрагмент DTBO для накладання</tspan><tspan x="1080.0" dy="15.6"></tspan><tspan x="1080.0" dy="15.6">Target path / phandle: ???</tspan><tspan x="1080.0" dy="15.6">  (потребує i2c1)</tspan><tspan x="1080.0" dy="15.6"></tspan><tspan x="1080.0" dy="15.6">Вузол temp-sensor@48</tspan><tspan x="1080.0" dy="15.6">  interrupt-parent: ???</tspan><tspan x="1080.0" dy="15.6">  (потребує gpio2)</tspan><tspan x="1080.0" dy="15.6"></tspan><tspan x="1080.0" dy="15.6">Метадані __fixups__:</tspan><tspan x="1080.0" dy="15.6">  i2c1 -&gt; target</tspan><tspan x="1080.0" dy="15.6">  gpio2 -&gt; interrupt-parent</tspan></text>
<rect x="430.0" y="130.0" width="440.0" height="480.0" rx="10" fill="#eaf6ef" stroke="#333333" stroke-width="1.8"/>
<text x="450.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Механізм ядра of_overlay_fdt_apply()</text>
<rect x="536.0" y="206.0" width="228.0" height="28.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="224.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">1. Читання __fixups__ з оверлею</tspan></text>
<rect x="491.5" y="286.0" width="317.0" height="28.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="304.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">2. Пошук міток в __symbols__ базового дерева</tspan></text>
<rect x="488.1" y="366.0" width="323.8" height="28.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="384.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">3. Підстановка phandle: i2c1-&gt;0x1, gpio2-&gt;0x2</tspan></text>
<rect x="498.4" y="446.0" width="303.3" height="28.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="464.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">4. Перерахунок локальних phandle в оверлеї</tspan></text>
<rect x="512.0" y="526.0" width="275.9" height="28.0" rx="6" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="544.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">5. Злиття вузлів у живе дерево of_root</tspan></text>
