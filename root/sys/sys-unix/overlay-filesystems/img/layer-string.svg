<text x="655.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#c0392b" text-anchor="middle" font-weight="700">::</text>
<text x="850.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#c0392b" text-anchor="middle" font-weight="700">::</text>
<text x="655.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">подвійна двокрапка</text>
<text x="655.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">відкриває шари-лише-дані</text>
<line x1="600.0" y1="196.0" x2="600.0" y2="232.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">лівіше — вище</text>
<rect x="155.0" y="249.0" width="230.0" height="46.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="270.0" y="277.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">upperdir=/u</tspan></text>
<text x="413.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">усі зміни, білило, непрозорість</text>
<rect x="155.0" y="309.0" width="230.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.5"/><text x="270.0" y="337.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">/l1</tspan></text>
<text x="413.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">пошук імені спиняється на першому влучанні</text>
<rect x="155.0" y="369.0" width="230.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.5"/><text x="270.0" y="397.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">/l2</tspan></text>
<text x="413.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">каталоги зливаються з усіх цих шарів</text>
<rect x="155.0" y="429.0" width="230.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.5"/><text x="270.0" y="457.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">/l3</tspan></text>
<text x="413.0" y="457.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">останній шар, де шукають за іменем</text>
<line x1="90.0" y1="488.0" x2="1160.0" y2="488.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="96.0" y="508.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">межа злиття імен: нижче ядро імен не шукає</text>
<rect x="155.0" y="513.0" width="230.0" height="46.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="270.0" y="541.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">/d1</tspan></text>
<rect x="155.0" y="573.0" width="230.0" height="46.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="270.0" y="601.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">/d2</tspan></text>
<text x="413.0" y="560.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">шари-лише-дані: імен звідси не видно;</text>
<text x="413.0" y="580.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">до вмісту веде лише metacopy-файл</text>
<text x="413.0" y="600.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">з абсолютним redirect у верхньому шарі</text>
<text x="620.0" y="672.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">upperdir і workdir у рядок lowerdir не входять — це окремі опції</text>
</svg>