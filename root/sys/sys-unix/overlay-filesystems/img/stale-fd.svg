<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди веде вже відкритий дескриптор після копіювання вгору</text>
<rect x="67.7" y="256.2" width="204.7" height="47.6" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.3"/><text x="170.0" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">процес А</tspan><tspan x="170.0" dy="15.6">fd, відкритий до копіювання</tspan></text>
<rect x="478.2" y="136.2" width="163.6" height="47.6" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.3"/><text x="560.0" y="156.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">нижній inode</tspan><tspan x="560.0" dy="15.6">оригінал у шарі lower</tspan></text>
<rect x="488.4" y="376.2" width="143.1" height="47.6" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.3"/><text x="560.0" y="396.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">верхній inode</tspan><tspan x="560.0" dy="15.6">копія в шарі upper</tspan></text>
<rect x="851.3" y="256.2" width="177.3" height="47.6" rx="6" fill="#eaf6ef" stroke="#6b7280" stroke-width="1.3"/><text x="940.0" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">спільне відображення</tspan><tspan x="940.0" dy="15.6">MAP_SHARED того ж файлу</tspan></text>
<line x1="280.0" y1="262.0" x2="452.0" y2="178.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="366.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">1. спершу читання — звідси</text>
<line x1="280.0" y1="298.0" x2="452.0" y2="382.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="366.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2. після копіювання ядро перечіпляє читання на верхню копію</text>
<line x1="870.0" y1="262.0" x2="674.0" y2="180.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="770.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">сторінки лишаються з нижнього файлу</text>
<text x="560.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">дескриптор і відображення прив'язані до справжнього файлу, а не до імені</text>
</svg>