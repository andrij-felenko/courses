<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1280" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">close(fd): порядок кроків усередині виклику</text>
<rect x="50.0" y="86.0" width="1180.0" height="42.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="640.0" y="111.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="640.0" dy="0.0">з цієї миті номер вільний — його негайно забирає наступний open у цьому процесі</tspan></text>
<rect x="50.0" y="150.0" width="262.0" height="112.0" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="181.0" y="201.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="181.0" dy="0.0">1 · номер вилучено</tspan><tspan x="181.0" dy="17.6">з таблиці процесу</tspan></text>
<rect x="356.0" y="150.0" width="262.0" height="112.0" rx="9" fill="#f0f0f2" stroke="#6b7280" stroke-width="1.8"/><text x="487.0" y="201.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="487.0" dy="0.0">2 · лічильник посилань</tspan><tspan x="487.0" dy="17.6">на опис −1</tspan></text>
<rect x="662.0" y="150.0" width="262.0" height="112.0" rx="9" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="793.0" y="193.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="793.0" dy="0.0">3 · якщо став 0:</tspan><tspan x="793.0" dy="17.6">скинути дані,</tspan><tspan x="793.0" dy="17.6">звільнити опис</tspan></text>
<rect x="968.0" y="150.0" width="262.0" height="112.0" rx="9" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="1099.0" y="201.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1099.0" dy="0.0">4 · повернути</tspan><tspan x="1099.0" dy="17.6">0 або −1</tspan></text>
<line x1="317.0" y1="206.0" x2="351.0" y2="206.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="623.0" y1="206.0" x2="657.0" y2="206.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="929.0" y1="206.0" x2="963.0" y2="206.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="181.0" y1="268.0" x2="181.0" y2="282.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="50.0" y="288.0" width="262.0" height="84.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="181.0" y="318.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="181.0" dy="0.0">EBADF — номера</tspan><tspan x="181.0" dy="16.2">в таблиці не було;</tspan><tspan x="181.0" dy="16.2">решти кроків немає</tspan></text>
<line x1="793.0" y1="268.0" x2="793.0" y2="282.0" stroke="#b8860b" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="662.0" y="288.0" width="262.0" height="84.0" rx="8" fill="#fff6e5" stroke="#b8860b" stroke-width="1.4"/><text x="793.0" y="318.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="793.0" dy="0.0">EIO, ENOSPC, EINTR —</tspan><tspan x="793.0" dy="16.2">номер уже втрачено,</tspan><tspan x="793.0" dy="16.2">повторювати нічого</tspan></text>
<text x="640.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">код помилки приходить, коли номера вже нема — тому fsync() роблять ДО close()</text>
</svg>