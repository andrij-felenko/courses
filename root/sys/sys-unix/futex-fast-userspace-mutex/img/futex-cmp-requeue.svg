<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перепідключення черги FUTEX_CMP_REQUEUE</text>
<text x="550.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оптимізація FUTEX_CMP_REQUEUE для умовних змінних (Condition Variables)</text>
<rect x="40.0" y="65.0" width="490.0" height="470.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="285.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">До виклику: 4 потоки чекають на Condvar</text>
<rect x="70.0" y="130.0" width="430.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="285.0" y="158.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="285.0" dy="0.0">Condvar Futex Bucket (uaddr_cond)</tspan><tspan x="285.0" dy="16.9">Wait Queue: Thread A, Thread B, Thread C, Thread D</tspan></text>
<text x="285.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Проблема без CMP_REQUEUE (Thundering Herd):</text>
<rect x="70.0" y="235.0" width="430.0" height="90.0" rx="6" fill="#fff6e5" stroke="#c0392b" stroke-width="1.5"/><text x="285.0" y="260.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Викликом WAKE пробуджуються всі 4 потоки.</tspan><tspan x="285.0" dy="15.6">Усі 4 повертаються у юзерспейс і змагаються</tspan><tspan x="285.0" dy="15.6">за м'ютекс. 1 захоплює, 3 знову йдуть у ядро!</tspan><tspan x="285.0" dy="15.6">Результат: 6 марних перемикань контексту.</tspan></text>
<rect x="70.0" y="350.0" width="430.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="285.0" y="376.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Mutex Futex Bucket (uaddr_mutex)</tspan><tspan x="285.0" dy="16.9">Wait Queue: (Порожня або 1 власник)</tspan></text>
<rect x="570.0" y="65.0" width="490.0" height="470.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="815.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Після FUTEX_CMP_REQUEUE(wake=1, requeue=3)</text>
<rect x="600.0" y="130.0" width="430.0" height="65.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="815.0" y="158.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Condvar Futex Bucket (uaddr_cond)</tspan><tspan x="815.0" dy="16.9">Wait Queue: Порожня (усі перенесені)</tspan></text>
<line x1="815.0" y1="205.0" x2="815.0" y2="240.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="600.0" y="240.0" width="430.0" height="90.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="815.0" y="265.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">Ядро атомарно:</tspan><tspan x="815.0" dy="15.6">1. Пробуджує Thread A (wake=1) у юзерспейс.</tspan><tspan x="815.0" dy="15.6">2. Переносить Thread B, C, D (requeue=3) з черги</tspan><tspan x="815.0" dy="15.6">   condvar прямо в чергу mutex усередині ядра!</tspan></text>
<line x1="815.0" y1="340.0" x2="815.0" y2="375.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="600.0" y="375.0" width="430.0" height="65.0" rx="6" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/><text x="815.0" y="403.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">Mutex Futex Bucket (uaddr_mutex)</tspan><tspan x="815.0" dy="16.9">Wait Queue: Thread B, Thread C, Thread D</tspan></text>
<text x="815.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-style="italic">Нуль марних переходів у простір користувача для заблокованих потоків!</text>
</svg>