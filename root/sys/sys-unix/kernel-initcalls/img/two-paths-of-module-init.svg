<rect x="30.0" y="438.0" width="210.0" height="96.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="135.0" y="481.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">хто й коли</tspan><tspan x="135.0" dy="18.2">викликає</tspan></text>
<rect x="268.0" y="438.0" width="552.0" height="96.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="544.0" y="481.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="544.0" dy="0.0">цикл do_initcall_level(6) у потоці pid 1,</tspan><tspan x="544.0" dy="18.2">до першої програми простору користувача</tspan></text>
<rect x="848.0" y="438.0" width="552.0" height="96.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="1124.0" y="481.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1124.0" dy="0.0">завантажувач модулів у мить insmod,</tspan><tspan x="1124.0" dy="18.2">у контексті процесу, що вантажить</tspan></text>
<rect x="30.0" y="548.0" width="210.0" height="96.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="135.0" y="591.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">що видно</tspan><tspan x="135.0" dy="18.2">в журналі</tspan></text>
<rect x="268.0" y="548.0" width="552.0" height="96.0" rx="6" fill="#fff6e5" stroke="#2457d6" stroke-width="1.2"/><text x="544.0" y="600.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="544.0" dy="0.0">calling  lab_init+0x0/0x18 @ 1</tspan></text>
<rect x="848.0" y="548.0" width="552.0" height="96.0" rx="6" fill="#fff6e5" stroke="#27ae60" stroke-width="1.2"/><text x="1124.0" y="600.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1124.0" dy="0.0">calling  lab_init+0x0/0x18 [lab] @ 1423</tspan></text>
<rect x="30.0" y="658.0" width="210.0" height="96.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="135.0" y="701.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">коли тіло</tspan><tspan x="135.0" dy="18.2">зникає</tspan></text>
<rect x="268.0" y="658.0" width="552.0" height="96.0" rx="6" fill="#eceff1" stroke="#2457d6" stroke-width="1.2"/><text x="544.0" y="701.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="544.0" dy="0.0">free_initmem() наприкінці завантаження —</tspan><tspan x="544.0" dy="18.2">разом з усією секцією ініціалізації</tspan></text>
<rect x="848.0" y="658.0" width="552.0" height="96.0" rx="6" fill="#eceff1" stroke="#27ae60" stroke-width="1.2"/><text x="1124.0" y="701.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1124.0" dy="0.0">одразу після вдалого insmod —</tspan><tspan x="1124.0" dy="18.2">звільняють init-пам'ять самого модуля</tspan></text>
<rect x="30.0" y="780.0" width="1370.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="715.0" y="806.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Дороги різні від початку до кінця, а сходяться рівно в одній функції — do_one_initcall().</tspan><tspan x="715.0" dy="18.2">Тому пара рядків у журналі однакова, і лише номер процесу та суфікс [lab] кажуть, якою дорогою прийшов виклик.</tspan></text>
