<rect x="268.0" y="328.0" width="552.0" height="96.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="544.0" y="371.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="544.0" dy="0.0">зсув до функції в секції .initcall6.init,</tspan><tspan x="544.0" dy="18.2">між __initcall6_start і __initcall7_start</tspan></text>
