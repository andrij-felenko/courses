<rect x="268.0" y="218.0" width="552.0" height="96.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="544.0" y="270.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="544.0" dy="0.0">розгортається в device_initcall(lab_init)</tspan></text>
