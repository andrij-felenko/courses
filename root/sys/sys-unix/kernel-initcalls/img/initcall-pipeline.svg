<rect x="984.0" y="204.0" width="396.0" height="30.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.2"/><text x="1182.0" y="223.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1182.0" dy="0.0">__initcall4_start</tspan></text>
<rect x="984.0" y="242.0" width="396.0" height="40.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.1"/><text x="1182.0" y="266.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1182.0" dy="0.0">записи рівня subsys, зібрані з усіх .o</tspan></text>
<rect x="984.0" y="290.0" width="396.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.1"/><text x="1182.0" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1182.0" dy="0.0">наш запис — foo_init</tspan></text>
<rect x="984.0" y="338.0" width="396.0" height="40.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.1"/><text x="1182.0" y="362.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1182.0" dy="0.0">решта записів рівня subsys</tspan></text>
<rect x="984.0" y="386.0" width="396.0" height="30.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.2"/><text x="1182.0" y="405.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1182.0" dy="0.0">__initcall5_start</tspan></text>
<line x1="452.0" y1="196.0" x2="500.0" y2="196.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="476.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">компілятор</text>
<line x1="904.0" y1="196.0" x2="952.0" y2="196.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="928.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">компонувальник</text>
<rect x="40.0" y="516.0" width="1360.0" height="66.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="720.0" y="544.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Масив ніхто не оголошував: він виник сам, бо компонувальник зсипає однойменні секції всіх об'єктних файлів в одне суцільне місце.</tspan><tspan x="720.0" dy="18.2">Ядру лишається пройти його від межі до межі — і в цьому весь механізм.</tspan></text>
</svg>