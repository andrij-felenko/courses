<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1450 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1450" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="240.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">У джерелі підсистеми</text>
<text x="702.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">В об'єктному файлі</text>
<text x="1182.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">У зібраному образі ядра</text>
<rect x="40.0" y="96.0" width="400.0" height="200.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="58.0" y="120.0" width="364.0" height="60.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.0"/><text x="240.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">static int __init foo_init(void)</tspan><tspan x="240.0" dy="18.2">{ ... }</tspan></text>
<rect x="58.0" y="200.0" width="364.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="240.0" y="226.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">subsys_initcall(foo_init);</tspan></text>
<rect x="58.0" y="254.0" width="364.0" height="30.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><text x="240.0" y="273.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">жодного центрального списку не правимо</tspan></text>
<rect x="512.0" y="96.0" width="380.0" height="200.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="530.0" y="120.0" width="344.0" height="40.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="702.0" y="144.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="702.0" dy="0.0">секція .initcall4.init</tspan></text>
<rect x="530.0" y="172.0" width="344.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="702.0" y="206.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="702.0" dy="0.0">один запис завдовжки 4 байти:</tspan><tspan x="702.0" dy="16.9">зсув від цього місця до foo_init</tspan></text>
<rect x="530.0" y="256.0" width="344.0" height="28.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><text x="702.0" y="274.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="702.0" dy="0.0">де саме — вирішує число 4 в макросі</tspan></text>
<rect x="964.0" y="96.0" width="436.0" height="372.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
