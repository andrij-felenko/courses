<text x="400.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle" font-weight="700">VHOST_USER_SET_VRING_NUM (розмір черги, напр. 256)</text>
<line x1="190.0" y1="342.0" x2="610.0" y2="342.0" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle">VHOST_USER_SET_VRING_ADDR (HVA дескрипторів, avail і used ring)</text>
<line x1="190.0" y1="368.0" x2="610.0" y2="368.0" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle" font-weight="700">VHOST_USER_SET_VRING_BASE (початковий індекс черги)</text>
<rect x="40.0" y="400.0" width="720.0" height="85.0" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.0"/>
<text x="50.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b21a8" text-anchor="start" font-weight="700">4. Передача сигнальних дескрипторів (Signaling Setup)</text>
<line x1="190.0" y1="435.0" x2="610.0" y2="435.0" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="400.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7e22ce" text-anchor="middle" font-weight="700">VHOST_USER_SET_VRING_KICK + SCM_RIGHTS [kick_fd / ioeventfd]</text>
<line x1="190.0" y1="465.0" x2="610.0" y2="465.0" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="400.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7e22ce" text-anchor="middle" font-weight="700">VHOST_USER_SET_VRING_CALL + SCM_RIGHTS [call_fd / irqfd]</text>
<rect x="40.0" y="495.0" width="720.0" height="75.0" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.0"/>
<text x="50.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="start" font-weight="700">5. Активація та запуск Data Plane</text>
<line x1="190.0" y1="532.0" x2="610.0" y2="532.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="527.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">VHOST_USER_SET_VRING_ENABLE (queue_index, enable=1)</text>
<text x="610.0" y="555.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">Старт робочого циклу опитування (PMD Loop)</text>
</svg>