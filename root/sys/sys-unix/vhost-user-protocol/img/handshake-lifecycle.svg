<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Послідовність рукостискання протоколу vhost-user (QEMU &lt;-&gt; Backend)</text>
<rect x="90.0" y="50.0" width="200.0" height="40.0" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="190.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#713f12" text-anchor="middle" font-weight="700">QEMU / VMM (Master)</text>
<line x1="190.0" y1="90.0" x2="190.0" y2="580.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="510.0" y="50.0" width="200.0" height="40.0" rx="6" fill="#ede9fe" stroke="#9333ea" stroke-width="1.5"/>
<text x="610.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#581c87" text-anchor="middle" font-weight="700">Сервер (Slave / Backend)</text>
<line x1="610.0" y1="90.0" x2="610.0" y2="580.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="40.0" y="105.0" width="720.0" height="75.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="50.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="start" font-weight="700">1. Узгодження можливостей (Feature Negotiation)</text>
<line x1="190.0" y1="135.0" x2="610.0" y2="135.0" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle" font-weight="700">VHOST_USER_GET_FEATURES</text>
<line x1="610.0" y1="155.0" x2="190.0" y2="155.0" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0369a1" text-anchor="middle">Відповідь: підтримувані біти virtio features (64-bit)</text>
<line x1="190.0" y1="172.0" x2="610.0" y2="172.0" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0369a1" text-anchor="middle" font-weight="700">VHOST_USER_SET_FEATURES / SET_PROTOCOL_FEATURES</text>
<rect x="40.0" y="190.0" width="720.0" height="85.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.0"/>
<text x="50.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="start" font-weight="700">2. Передача таблиці пам'яті (Memory Regions)</text>
<line x1="190.0" y1="225.0" x2="610.0" y2="225.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">VHOST_USER_SET_MEM_TABLE + SCM_RIGHTS [fd_0, fd_1, ...]</text>
<text x="610.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle" font-weight="700">mmap() кожного отриманого fd</text>
<rect x="40.0" y="285.0" width="720.0" height="105.0" rx="6" fill="#fefce8" stroke="#fde047" stroke-width="1.0"/>
<text x="50.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#854d0e" text-anchor="start" font-weight="700">3. Налаштування віртчерг (Virtqueue Configuration)</text>
