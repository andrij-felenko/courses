<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один рядок коду: що з нього робить glibc, а що — ядро</text>
<rect x="50.0" y="62.0" width="500.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">printf(&quot;h=%.1f\n&quot;, h)  — рядок коду програми</tspan></text>
<rect x="50.0" y="152.0" width="500.0" height="56.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="184.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">розбір формату, локаль, число → текст у буфер</tspan></text>
<rect x="50.0" y="242.0" width="500.0" height="56.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">буфер stdout: до терміналу — скидання на '\n'</tspan></text>
<rect x="50.0" y="332.0" width="500.0" height="56.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="364.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">write(1, buf, n) — тонка обгортка glibc</tspan></text>
<rect x="50.0" y="422.0" width="500.0" height="56.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="454.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">rax = 1, rdi/rsi/rdx = аргументи, інструкція syscall</tspan></text>
