<line x1="300.0" y1="478.0" x2="300.0" y2="502.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="502.0" width="500.0" height="44.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="528.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">ЯДРО: справжній запис у файл-дескриптор 1</tspan></text>
<line x1="550.0" y1="180.0" x2="588.0" y2="180.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="596.0" y="152.0" width="268.0" height="56.0" rx="6" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.5"/><text x="730.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">цього ядро не вміє:</tspan><tspan x="730.0" dy="15.6">воно приймає лише байти</tspan></text>
<line x1="550.0" y1="270.0" x2="588.0" y2="270.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="596.0" y="242.0" width="268.0" height="56.0" rx="6" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.5"/><text x="730.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">тут зникає більшість</tspan><tspan x="730.0" dy="15.6">системних викликів</tspan></text>
<line x1="550.0" y1="450.0" x2="588.0" y2="450.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="596.0" y="422.0" width="268.0" height="56.0" rx="6" fill="#fbfbfc" stroke="#6b7280" stroke-width="1.5"/><text x="730.0" y="446.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">повернення −9 → glibc кладе</tspan><tspan x="730.0" dy="15.6">errno = EBADF і віддає −1</tspan></text>
