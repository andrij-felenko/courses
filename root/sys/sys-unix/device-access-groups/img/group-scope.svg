<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1430 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1430" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="710.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Число групи відмикає клас вузлів, а не один пристрій</text>
<rect x="50.0" y="50.0" width="210.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="86.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">група</tspan></text>
<rect x="286.0" y="50.0" width="340.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="456.0" y="78.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="456.0" dy="0.0">на які вузли правило</tspan><tspan x="456.0" dy="16.9">штампує це число</tspan></text>
<rect x="652.0" y="50.0" width="470.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="887.0" y="86.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="887.0" dy="0.0">що це відмикає насправді</tspan></text>
<rect x="1148.0" y="50.0" width="222.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1259.0" y="86.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1259.0" dy="0.0">чим це є за вагою</tspan></text>
<rect x="50.0" y="138.0" width="210.0" height="108.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="155.0" y="187.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">dialout</tspan><tspan x="155.0" dy="18.2">на Arch — uucp</tspan></text>
<rect x="286.0" y="138.0" width="340.0" height="108.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="456.0" y="188.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="456.0" dy="0.0">усі послідовні порти:</tspan><tspan x="456.0" dy="16.9">ttyUSB*, ttyACM*, ttyS*</tspan></text>
<rect x="652.0" y="138.0" width="470.0" height="108.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="887.0" y="179.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="887.0" dy="0.0">прошити будь-яку підключену плату;</tspan><tspan x="887.0" dy="16.9">говорити з ttyS0, а це на сервері</tspan><tspan x="887.0" dy="16.9">часто консоль самої машини</tspan></text>
<rect x="1148.0" y="138.0" width="222.0" height="108.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1259.0" y="188.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1259.0" dy="0.0">широко, але</tspan><tspan x="1259.0" dy="16.9">в межах портів</tspan></text>
<rect x="50.0" y="272.0" width="210.0" height="108.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="155.0" y="330.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">video</tspan></text>
<rect x="286.0" y="272.0" width="340.0" height="108.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="456.0" y="322.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="456.0" dy="0.0">усі /dev/video*</tspan><tspan x="456.0" dy="16.9">і вузли відеокарти</tspan></text>
<rect x="652.0" y="272.0" width="470.0" height="108.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="887.0" y="313.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="887.0" dy="0.0">кадри з кожної камери машини,</tspan><tspan x="887.0" dy="16.9">без жодного натяку для того,</tspan><tspan x="887.0" dy="16.9">кого знімають</tspan></text>
<rect x="1148.0" y="272.0" width="222.0" height="108.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1259.0" y="330.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1259.0" dy="0.0">широко</tspan></text>
<rect x="50.0" y="406.0" width="210.0" height="108.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="155.0" y="464.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">input</tspan></text>
<rect x="286.0" y="406.0" width="340.0" height="108.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="456.0" y="464.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="456.0" dy="0.0">усі /dev/input/event*</tspan></text>
<rect x="652.0" y="406.0" width="470.0" height="108.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="887.0" y="447.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="887.0" dy="0.0">читати кожне натискання клавіші</tspan><tspan x="887.0" dy="16.9">в системі — зокрема пароль,</tspan><tspan x="887.0" dy="16.9">набраний у чужому сеансі</tspan></text>
<rect x="1148.0" y="406.0" width="222.0" height="108.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1259.0" y="464.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1259.0" dy="0.0">фактично root</tspan></text>
<rect x="50.0" y="540.0" width="210.0" height="116.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="155.0" y="602.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">disk</tspan></text>
<rect x="286.0" y="540.0" width="340.0" height="116.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="456.0" y="594.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="456.0" dy="0.0">блокові пристрої цілком:</tspan><tspan x="456.0" dy="16.9">sda, nvme0n1</tspan></text>
<rect x="652.0" y="540.0" width="470.0" height="116.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="887.0" y="585.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="887.0" dy="0.0">писати блоки повз файлову систему:</tspan><tspan x="887.0" dy="16.9">підмінити будь-який файл, змінити</tspan><tspan x="887.0" dy="16.9">будь-які права, покласти setuid-root</tspan></text>
<rect x="1148.0" y="540.0" width="222.0" height="116.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1259.0" y="594.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1259.0" dy="0.0">це root,</tspan><tspan x="1259.0" dy="16.9">названий інакше</tspan></text>
<rect x="50.0" y="692.0" width="1320.0" height="78.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="710.0" y="717.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">перевірка прав файлової системи живе НАД блоковим пристроєм —</tspan><tspan x="710.0" dy="18.2">тому той, кому дозволено писати в /dev/sda, просто проходить під нею,</tspan><tspan x="710.0" dy="18.2">і жоден режим на жодному файлі його не спинить</tspan></text>
</svg>