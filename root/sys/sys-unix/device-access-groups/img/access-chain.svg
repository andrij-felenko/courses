<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1290 950" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1290" height="950" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два ланцюги, що сходяться в одному порівнянні чисел</text>
<rect x="60.0" y="50.0" width="520.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="84.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">бік пристрою</tspan></text>
<rect x="700.0" y="50.0" width="520.0" height="58.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="960.0" y="84.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="960.0" dy="0.0">бік людини</tspan></text>
<rect x="60.0" y="140.0" width="520.0" height="74.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="173.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">перехідник устромили в роз'єм;</tspan><tspan x="320.0" dy="16.9">ядро створює пристрій і повідомляє udev</tspan></text>
<rect x="60.0" y="250.0" width="520.0" height="74.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="283.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">udev перебирає правила й знаходить те,</tspan><tspan x="320.0" dy="16.9">яке збіглося з цим пристроєм</tspan></text>
<rect x="60.0" y="360.0" width="520.0" height="74.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="393.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">правило каже, чим має стати вузол:</tspan><tspan x="320.0" dy="16.9">GROUP=&quot;dialout&quot;   MODE=&quot;0660&quot;</tspan></text>
<rect x="60.0" y="470.0" width="520.0" height="96.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="514.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">у /dev виникає вузол ttyUSB0</tspan><tspan x="320.0" dy="16.9">власник root · група 20 · режим crw-rw----</tspan></text>
<rect x="700.0" y="140.0" width="520.0" height="74.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="960.0" y="173.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">адміністратор один раз:</tspan><tspan x="960.0" dy="16.9">usermod -aG dialout andrij</tspan></text>
<rect x="700.0" y="250.0" width="520.0" height="74.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="960.0" y="283.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">у файлі /etc/group з'являється рядок</tspan><tspan x="960.0" dy="16.9">dialout:x:20:andrij</tspan></text>
<rect x="700.0" y="360.0" width="520.0" height="74.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="960.0" y="393.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">при вході login збирає перелік груп</tspan><tspan x="960.0" dy="16.9">і кладе його в процес сеансу</tspan></text>
<rect x="700.0" y="470.0" width="520.0" height="96.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="960.0" y="514.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">процес несе знімок списку</tspan><tspan x="960.0" dy="16.9">[1000, 20, ...] — і передає його нащадкам</tspan></text>
<line x1="320.0" y1="218.0" x2="320.0" y2="246.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="320.0" y1="328.0" x2="320.0" y2="356.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="320.0" y1="438.0" x2="320.0" y2="466.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="960.0" y1="218.0" x2="960.0" y2="246.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="960.0" y1="328.0" x2="960.0" y2="356.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="960.0" y1="438.0" x2="960.0" y2="466.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="320.0" y1="570.0" x2="320.0" y2="616.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="960.0" y1="570.0" x2="960.0" y2="616.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="622.0" width="1160.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="665.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">процес просить open(&quot;/dev/ttyUSB0&quot;, O_RDWR) — і аж тепер два числа вперше зустрічаються</tspan></text>
<rect x="60.0" y="726.0" width="1160.0" height="116.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="770.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">fsuid збігається з root?                                   ні</tspan><tspan x="640.0" dy="18.2">число 20 є серед додаткових груп процесу?    так   →   клас «група», трійка rw</tspan><tspan x="640.0" dy="18.2">у трійці стоять і r, і w                                     →   дозволено</tspan></text>
<rect x="60.0" y="862.0" width="1160.0" height="62.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="640.0" y="888.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">спільне в обох ланцюгів рівно одне — число 20; правило udev не знає про людину,</tspan><tspan x="640.0" dy="18.2">а /etc/group не знає про пристрій, якого ще не встромили</tspan></text>
</svg>