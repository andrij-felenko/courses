<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три режими: різні питання про ту саму сторінку</text>
<rect x="30.0" y="44.0" width="210.0" height="56.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="77.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">Режим реєстрації</tspan></text>
<rect x="256.0" y="44.0" width="330.0" height="56.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="421.0" y="77.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="421.0" dy="0.0">Стан сторінки перед збоєм</tspan></text>
<rect x="610.0" y="44.0" width="330.0" height="56.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="775.0" y="77.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="775.0" dy="0.0">Про що приходить повідомлення</tspan></text>
<rect x="964.0" y="44.0" width="306.0" height="56.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="1117.0" y="77.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1117.0" dy="0.0">Чим збій закривають</tspan></text>
<rect x="30.0" y="124.0" width="210.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="167.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">MISSING</tspan><tspan x="135.0" dy="20.8">(з 4.3)</tspan></text>
<rect x="256.0" y="124.0" width="330.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="421.0" y="167.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="421.0" dy="0.0">фізичного кадру немає,</tspan><tspan x="421.0" dy="18.2">запису в таблиці немає</tspan></text>
<rect x="610.0" y="124.0" width="330.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="775.0" y="167.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">за цією адресою</tspan><tspan x="775.0" dy="18.2">ще нічого не лежить</tspan></text>
<rect x="964.0" y="124.0" width="306.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1117.0" y="167.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1117.0" dy="0.0">UFFDIO_COPY</tspan><tspan x="1117.0" dy="18.2">або UFFDIO_ZEROPAGE</tspan></text>
<rect x="30.0" y="240.0" width="210.0" height="96.0" rx="6" fill="#fdf3e6" stroke="#c0392b" stroke-width="1.5"/><text x="135.0" y="283.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">WP</tspan><tspan x="135.0" dy="20.8">(з 5.7)</tspan></text>
<rect x="256.0" y="240.0" width="330.0" height="96.0" rx="6" fill="#fdf3e6" stroke="#c0392b" stroke-width="1.5"/><text x="421.0" y="283.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="421.0" dy="0.0">кадр є, запис є,</tspan><tspan x="421.0" dy="18.2">але дозвіл на запис знято</tspan></text>
<rect x="610.0" y="240.0" width="330.0" height="96.0" rx="6" fill="#fdf3e6" stroke="#c0392b" stroke-width="1.5"/><text x="775.0" y="283.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">у цю сторінку</tspan><tspan x="775.0" dy="18.2">щойно спробували писати</tspan></text>
<rect x="964.0" y="240.0" width="306.0" height="96.0" rx="6" fill="#fdf3e6" stroke="#c0392b" stroke-width="1.5"/><text x="1117.0" y="283.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1117.0" dy="0.0">UFFDIO_WRITEPROTECT</tspan><tspan x="1117.0" dy="18.2">(зняти захист)</tspan></text>
<rect x="30.0" y="356.0" width="210.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="135.0" y="399.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">MINOR</tspan><tspan x="135.0" dy="20.8">(з 5.13 / 5.14)</tspan></text>
<rect x="256.0" y="356.0" width="330.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="421.0" y="399.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="421.0" dy="0.0">кадр уже в кеші сторінок,</tspan><tspan x="421.0" dy="18.2">бракує лише запису</tspan></text>
<rect x="610.0" y="356.0" width="330.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="775.0" y="399.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">вміст готовий,</tspan><tspan x="775.0" dy="18.2">відображення ще нема</tspan></text>
<rect x="964.0" y="356.0" width="306.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1117.0" y="399.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1117.0" dy="0.0">UFFDIO_CONTINUE</tspan><tspan x="1117.0" dy="18.2">(відобразити наявне)</tspan></text>
