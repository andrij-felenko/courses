<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Заповнення сторінки: дві дії проти однієї</text>
<rect x="34.0" y="106.0" width="300.0" height="68.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="184.0" y="135.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="184.0" dy="0.0">mprotect,</tspan><tspan x="184.0" dy="20.8">а потім запис руками</tspan></text>
<line x1="366.0" y1="140.0" x2="1140.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1140.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">час</text>
<rect x="560.0" y="78.0" width="340.0" height="124.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<line x1="560.0" y1="124.0" x2="560.0" y2="156.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="560.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">mprotect:</tspan><tspan x="560.0" dy="18.2">права відкрито</tspan></text>
<line x1="900.0" y1="124.0" x2="900.0" y2="156.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="900.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">дані вписано</tspan></text>
<text x="753.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="753.0" dy="0.0">у цій смузі другий потік читає з ділянки нулі —</tspan><tspan x="753.0" dy="19.5">і не спотикається, бо права вже відкрито</tspan></text>
<rect x="34.0" y="356.0" width="300.0" height="68.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="184.0" y="395.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="184.0" dy="0.0">UFFDIO_COPY</tspan></text>
<line x1="366.0" y1="390.0" x2="1140.0" y2="390.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="1140.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="end">час</text>
<line x1="730.0" y1="374.0" x2="730.0" y2="406.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="730.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">кадр заповнено й запис</tspan><tspan x="730.0" dy="18.2">у таблиці з'явився разом</tspan></text>
<text x="753.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="753.0" dy="0.0">проміжного стану немає: доти кожен, хто звернеться,</tspan><tspan x="753.0" dy="19.5">просто спотикається й чекає в тій самій черзі</tspan></text>
</svg>