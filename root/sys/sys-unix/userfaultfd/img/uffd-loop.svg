<text x="30.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="start" font-weight="700">Робить апаратура й ядро — без участи програми</text>
<text x="30.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="start" font-weight="700">Крок 5 — єдине місце, де рішення ухвалює програма</text>
