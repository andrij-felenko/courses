<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1366 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1366" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="670.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кругообіг одного сторінкового збою через userfaultfd</text>
<rect x="30.0" y="96.0" width="296.0" height="128.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="178.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="178.0" dy="0.0">1  Звернення за адресою</tspan></text>
<text x="178.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="178.0" dy="0.0">запису в таблиці сторінок</tspan><tspan x="178.0" dy="18.2">немає — інструкція спиняється</tspan></text>
<rect x="370.0" y="96.0" width="296.0" height="128.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="518.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="518.0" dy="0.0">2  Керування в ядрі</tspan></text>
<text x="518.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="518.0" dy="0.0">ядро бачить: ділянку зареєстровано,</tspan><tspan x="518.0" dy="18.2">отже, звичайний шлях не для неї</tspan></text>
<rect x="710.0" y="96.0" width="296.0" height="128.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="858.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="858.0" dy="0.0">3  Повідомлення в чергу</tspan></text>
<text x="858.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="858.0" dy="0.0">адресу й ознаку «читання чи запис»</tspan><tspan x="858.0" dy="18.2">кладуть у чергу дескриптора</tspan></text>
<rect x="1050.0" y="96.0" width="296.0" height="128.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="1198.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1198.0" dy="0.0">4  Винуватця вкладено спати</tspan></text>
<text x="1198.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1198.0" dy="0.0">дескриптор став читабельним —</tspan><tspan x="1198.0" dy="18.2">наглядач прокидається на poll</tspan></text>
<rect x="30.0" y="336.0" width="296.0" height="128.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="178.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="178.0" dy="0.0">7  Інструкція наново</tspan></text>
<text x="178.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="178.0" dy="0.0">та сама інструкція виконується</tspan><tspan x="178.0" dy="18.2">вдруге — і цього разу успішно</tspan></text>
<rect x="370.0" y="336.0" width="296.0" height="128.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="518.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="518.0" dy="0.0">6  UFFDIO_COPY</tspan></text>
<text x="518.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="518.0" dy="0.0">ядро заповнює кадр, вписує запис</tspan><tspan x="518.0" dy="18.2">у таблицю й будить винуватця</tspan></text>
<rect x="710.0" y="336.0" width="296.0" height="128.0" rx="6" fill="#fdf3e6" stroke="#333333" stroke-width="1.5"/>
<text x="858.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="858.0" dy="0.0">5  Наглядач бере вміст</tspan></text>
<text x="858.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="858.0" dy="0.0">мережа, файл, генератор —</tspan><tspan x="858.0" dy="18.2">джерело знає тільки програма</tspan></text>
