<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1390 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1390" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="690.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стани об'єкта userfaultfd і дозволені на кожному кроці операції</text>
<rect x="38.0" y="118.0" width="372.0" height="104.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/>
<text x="224.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="224.0" dy="0.0">Створено</tspan></text>
<text x="224.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="224.0" dy="0.0">userfaultfd(2)</tspan><tspan x="224.0" dy="18.2">або USERFAULTFD_IOC_NEW</tspan></text>
<rect x="504.0" y="118.0" width="372.0" height="104.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="690.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">Версію узгоджено</tspan></text>
<text x="690.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="690.0" dy="0.0">після UFFDIO_API:</tspan><tspan x="690.0" dy="18.2">відомі features й ioctls</tspan></text>
<rect x="970.0" y="118.0" width="372.0" height="104.0" rx="6" fill="#fdf3e6" stroke="#333333" stroke-width="1.5"/>
<text x="1156.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1156.0" dy="0.0">Діапазон під наглядом</tspan></text>
<text x="1156.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="1156.0" dy="0.0">після UFFDIO_REGISTER:</tspan><tspan x="1156.0" dy="18.2">черга наповнюється</tspan></text>
<line x1="418.0" y1="170.0" x2="496.0" y2="170.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="457.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="457.0" dy="0.0">UFFDIO_API</tspan></text>
<line x1="884.0" y1="170.0" x2="962.0" y2="170.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="923.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="923.0" dy="0.0">UFFDIO_REGISTER</tspan></text>
<rect x="38.0" y="282.0" width="372.0" height="158.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="224.0" y="338.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="224.0" dy="0.0">Дозволено лише UFFDIO_API.</tspan><tspan x="224.0" dy="18.2"></tspan><tspan x="224.0" dy="18.2">Будь-який інший ioctl і навіть read()</tspan><tspan x="224.0" dy="18.2">дають EINVAL — об'єкт ще не ввімкнено.</tspan></text>
<rect x="504.0" y="282.0" width="372.0" height="158.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="329.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">UFFDIO_REGISTER, UFFDIO_UNREGISTER.</tspan><tspan x="690.0" dy="18.2"></tspan><tspan x="690.0" dy="18.2">Повторний UFFDIO_API — лише поки</tspan><tspan x="690.0" dy="18.2">жодної можливости не ввімкнено;</tspan><tspan x="690.0" dy="18.2">інакше EINVAL і нулі в структурі.</tspan></text>
<rect x="970.0" y="282.0" width="372.0" height="158.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1156.0" y="338.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1156.0" dy="0.0">Те, що ядро дозволило в reg.ioctls:</tspan><tspan x="1156.0" dy="18.2">COPY · ZEROPAGE · WAKE · WRITEPROTECT</tspan><tspan x="1156.0" dy="18.2">CONTINUE · POISON · MOVE.</tspan><tspan x="1156.0" dy="18.2">read() віддає uffd_msg.</tspan></text>
<text x="38.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="start" font-weight="700">Що приймає ioctl у цьому стані</text>
<rect x="38.0" y="486.0" width="1304.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="523.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Порядок обов'язковий і незворотний: features узгоджують ДО першого повідомлення, бо ввімкнені можливості змінюють сам потік подій у черзі —</tspan><tspan x="690.0" dy="19.5">наглядач, який не просив EVENT_FORK, прочитає таке повідомлення як зіпсоване.</tspan></text>
</svg>