<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння втрати метаданих при звичайному та точному копіюванні</text>
<rect x="50.0" y="35.0" width="1160.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="59.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Наївне копіювання (cp -r) перезаписує атрибути через umask і системні виклики поточного користувача.</tspan><tspan x="630.0" dy="18.2">Архівний режим (cp -a, rsync -aHAX) повноцінно відтворює стан об'єктів VFS на стороні призначення</tspan></text>
<rect x="50.0" y="110.0" width="340.0" height="44.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="220.0" y="136.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Джерело (Оригінал VFS)</tspan></text>
<rect x="440.0" y="110.0" width="360.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="136.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Наївне копіювання (cp -r)</tspan></text>
<rect x="850.0" y="110.0" width="360.0" height="44.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1030.0" y="136.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1030.0" dy="0.0">Точне копіювання (cp -a / rsync -aHAX)</tspan></text>
<rect x="50.0" y="168.0" width="340.0" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="220.0" y="203.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Мітки часу (mtime, atime):</tspan><tspan x="220.0" dy="15.6">2021-04-12 10:00:00</tspan></text>
<rect x="440.0" y="168.0" width="360.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="203.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Перезапис на ПОТОЧНИЙ ЧАС</tspan><tspan x="620.0" dy="15.6">(ламає кеші, make, бекапи)</tspan></text>
<rect x="850.0" y="168.0" width="360.0" height="78.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1030.0" y="203.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">Точний час у наносекундах</tspan><tspan x="1030.0" dy="15.6">(utimensat відтворює mtime/atime)</tspan></text>
<rect x="50.0" y="258.0" width="340.0" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="220.0" y="293.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Права доступу та біти:</tspan><tspan x="220.0" dy="15.6">mode 0600 (rw-------) + SUID</tspan></text>
<rect x="440.0" y="258.0" width="360.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="293.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Накладання umask (022 → 0644),</tspan><tspan x="620.0" dy="15.6">скидання бітів SUID/SGID</tspan></text>
<rect x="850.0" y="258.0" width="360.0" height="78.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1030.0" y="293.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">Повний збіг mode 0600,</tspan><tspan x="1030.0" dy="15.6">збереження бітів SUID/SGID/Sticky</tspan></text>
<rect x="50.0" y="348.0" width="340.0" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="220.0" y="383.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Власник та група:</tspan><tspan x="220.0" dy="15.6">UID=1000 (mysql), GID=1000</tspan></text>
<rect x="440.0" y="348.0" width="360.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="383.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">UID/GID процесу, що копіює</tspan><tspan x="620.0" dy="15.6">(mysql втрачає доступ до бази)</tspan></text>
<rect x="850.0" y="348.0" width="360.0" height="78.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1030.0" y="383.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">Збереження UID/GID 1000:1000</tspan><tspan x="1030.0" dy="15.6">(fchownat за наявності прав root)</tspan></text>
<rect x="50.0" y="438.0" width="340.0" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="220.0" y="473.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Жорсткі посилання (Hardlinks):</tspan><tspan x="220.0" dy="15.6">2 файли → 1 спільний inode</tspan></text>
<rect x="440.0" y="438.0" width="360.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="473.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Дублювання: 2 окремі inode,</tspan><tspan x="620.0" dy="15.6">подвійна витрата місця на диску</tspan></text>
<rect x="850.0" y="438.0" width="360.0" height="78.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1030.0" y="473.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">Таблиця (dev,ino) → linkat:</tspan><tspan x="1030.0" dy="15.6">збережено 1 inode та 2 посилання</tspan></text>
<rect x="50.0" y="528.0" width="340.0" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="220.0" y="563.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Розріджені файли (Sparse):</tspan><tspan x="220.0" dy="15.6">100 ГБ логічно, 5 ГБ на диску</tspan></text>
<rect x="440.0" y="528.0" width="360.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="563.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Запис нулів: фізичне роздування</tspan><tspan x="620.0" dy="15.6">файлу до повних 100 ГБ на диску</tspan></text>
<rect x="850.0" y="528.0" width="360.0" height="78.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1030.0" y="563.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">Детекція дірок (SEEK_HOLE):</tspan><tspan x="1030.0" dy="15.6">виділено лише 5 ГБ блоків</tspan></text>
<rect x="50.0" y="618.0" width="340.0" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="220.0" y="653.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Атрибути xattr, ACL, SELinux:</tspan><tspan x="220.0" dy="15.6">system.posix_acl, security.selinux</tspan></text>
<rect x="440.0" y="618.0" width="360.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="653.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Втрачено повністю:</tspan><tspan x="620.0" dy="15.6">атрибути ігноруються</tspan></text>
<rect x="850.0" y="618.0" width="360.0" height="78.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1030.0" y="653.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">Збережено через lsetxattr:</tspan><tspan x="1030.0" dy="15.6">всі простори імен xattr, ACL, SELinux</tspan></text>
<rect x="50.0" y="715.0" width="1160.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="743.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Головне правило: звичайний read() / write() передає лише потік байтів вмісту, відкидаючи всі метадані вузла VFS</tspan></text>
</svg>