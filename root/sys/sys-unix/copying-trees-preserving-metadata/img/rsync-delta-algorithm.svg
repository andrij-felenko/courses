<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип роботи блочного дельта-алгоритму rsync</text>
<rect x="50.0" y="35.0" width="1140.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="58.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Алгоритм дельта-передачі rsync: мінімізація мережевого трафіку шляхом порівняння</tspan><tspan x="620.0" dy="18.2">блокових хешів замість передачі всього файлу цілком</tspan></text>
<rect x="50.0" y="110.0" width="480.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="290.0" y="137.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="290.0" dy="0.0">Отримувач (Receiver / Цільовий файл)</tspan></text>
<rect x="710.0" y="110.0" width="480.0" height="46.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="950.0" y="137.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="950.0" dy="0.0">Відправник (Sender / Вихідний файл)</tspan></text>
<rect x="50.0" y="175.0" width="480.0" height="140.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="210.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">1. Розбиття наявного файлу на фіксовані блоки (наприклад, 4 КБ):</tspan><tspan x="290.0" dy="15.6">• Блок 0: Adler-32 (32 біти) + MD5/MD4 (128 бітів)</tspan><tspan x="290.0" dy="15.6">• Блок 1: Adler-32 (32 біти) + MD5/MD4 (128 бітів)</tspan><tspan x="290.0" dy="15.6">• Блок 2: Adler-32 (32 біти) + MD5/MD4 (128 бітів)</tspan><tspan x="290.0" dy="15.6">• ...</tspan><tspan x="290.0" dy="15.6">Складання компактної таблиці контрольних сум</tspan></text>
<line x1="540.0" y1="245.0" x2="700.0" y2="245.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="545.0" y="215.0" width="150.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="222.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Передача таблиці</tspan><tspan x="620.0" dy="14.3">хешів блоків</tspan><tspan x="620.0" dy="14.3">(мережа / сокет)</tspan></text>
<rect x="710.0" y="175.0" width="480.0" height="230.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="950.0" y="239.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">2. Побайтовий пошук збігів у джерелі:</tspan><tspan x="950.0" dy="15.6">• Обчислення ковзної контрольної суми (Rolling Adler-32)</tspan><tspan x="950.0" dy="15.6">  для вікна розміром у блок на кожному зміщенні i, i+1, i+2...</tspan><tspan x="950.0" dy="15.6">• Швидка перевірка: чи є такий Adler-32 у хеш-таблиці?</tspan><tspan x="950.0" dy="15.6">  – НІ: поточний байт додається до буфера нових даних</tspan><tspan x="950.0" dy="15.6">  – ТАК: обчислюється сильний хеш MD5 для підтвердження</tspan><tspan x="950.0" dy="15.6">• При збігу сильного хешу: фіксується тотожний блок,</tspan><tspan x="950.0" dy="15.6">  вікно пересувається одразу на довжину цілого блоку</tspan></text>
<line x1="700.0" y1="450.0" x2="540.0" y2="450.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="545.0" y="420.0" width="150.0" height="60.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="620.0" y="427.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Передача дельти:</tspan><tspan x="620.0" dy="14.3">[сирі байти] +</tspan><tspan x="620.0" dy="14.3">[номери блоків]</tspan></text>
<rect x="50.0" y="355.0" width="480.0" height="200.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="420.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">3. Реконструкція цільового файлу:</tspan><tspan x="290.0" dy="15.6">• Створення тимчасового файлу (.filename.XXXXXX)</tspan><tspan x="290.0" dy="15.6">• Запис нових байтів із потоку відправника</tspan><tspan x="290.0" dy="15.6">• Пряме копіювання збіглих блоків із наявного локального файлу</tspan><tspan x="290.0" dy="15.6">• Атомарне перейменування rename() поверх старого файлу</tspan><tspan x="290.0" dy="15.6">• Застосування прав, xattr, ACL та timestamps (utimensat)</tspan></text>
<rect x="50.0" y="580.0" width="1140.0" height="160.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="620.0" y="639.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Чому дельта-алгоритм такий швидкий:</tspan><tspan x="620.0" dy="16.9">• Ковзна сума Adler-32 обчислюється за O(1) операцій на кожен зсув байта (віднімання вибулого байта + додавання нового)</tspan><tspan x="620.0" dy="16.9">• Важкий криптографічний хеш рахується лише у разі збігу легкого 32-бітного хешу</tspan><tspan x="620.0" dy="16.9">• При повторній синхронізації 10 ГБ файлу зі зміною в 1 МБ мережею передається лише ~1 МБ даних та кілька кілобайтів хешів</tspan></text>
</svg>