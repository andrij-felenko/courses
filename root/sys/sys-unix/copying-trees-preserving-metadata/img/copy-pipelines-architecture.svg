<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 770" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="770" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура трьох конвеєрів копіювання: cp, tar, rsync</text>
<rect x="50.0" y="35.0" width="1160.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="58.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Три архітектурні моделі копіювання дерев каталогів у Linux:</tspan><tspan x="630.0" dy="18.2">локальний CoW у просторі ядра, серіалізація потоку в конвеєрі та синхронізація дельти процесами</tspan></text>
<rect x="50.0" y="110.0" width="360.0" height="48.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="129.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">1. cp -a --reflink=auto</tspan><tspan x="230.0" dy="18.2">(Локальне пряме VFS)</tspan></text>
<rect x="50.0" y="170.0" width="360.0" height="440.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="277.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Простір користувача:</tspan><tspan x="230.0" dy="15.6">Один процес cp рекурсивно обходить каталог</tspan><tspan x="230.0" dy="15.6">через openat() / readdir()</tspan><tspan x="230.0" dy="15.6"></tspan><tspan x="230.0" dy="15.6">Простір ядра (VFS):</tspan><tspan x="230.0" dy="15.6">1. Створення вузла-приймача</tspan><tspan x="230.0" dy="15.6">2. copy_file_range() або ioctl(FICLONE)</tspan><tspan x="230.0" dy="15.6">   → Якщо CoW (Btrfs/XFS): шаринг екстентів,</tspan><tspan x="230.0" dy="15.6">     нуль читань/записів на фізичний носій!</tspan><tspan x="230.0" dy="15.6">   → Якщо звичайний диск: прямий копір блоків</tspan><tspan x="230.0" dy="15.6">3. lsetxattr() / fchownat() / fchmodat()</tspan><tspan x="230.0" dy="15.6">4. Пост-обхід: utimensat() для каталогів</tspan><tspan x="230.0" dy="15.6"></tspan><tspan x="230.0" dy="15.6">Переваги: максимальна швидкість на NVMe,</tspan><tspan x="230.0" dy="15.6">миттєве копіювання при CoW reflink.</tspan><tspan x="230.0" dy="15.6">Обмеження: лише в межах одного хоста.</tspan></text>
<rect x="450.0" y="110.0" width="360.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="630.0" y="129.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">2. tar -cf - . | tar -xpf -</tspan><tspan x="630.0" dy="18.2">(Байтовий потік через Pipe / SSH)</tspan></text>
<rect x="450.0" y="170.0" width="360.0" height="440.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="277.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Процес 1 (Архіватор tar):</tspan><tspan x="630.0" dy="15.6">• Серіалізація файлів, каталогів, метаданих,</tspan><tspan x="630.0" dy="15.6">  xattr та ACL у суцільний потік USTAR/PAX</tspan><tspan x="630.0" dy="15.6">• Запис у стандартний вивід stdout</tspan><tspan x="630.0" dy="15.6"></tspan><tspan x="630.0" dy="15.6">Міжпроцесний канал (Pipe / SSH сокет):</tspan><tspan x="630.0" dy="15.6">• Буферизація ядра (64 КБ pipe buffer)</tspan><tspan x="630.0" dy="15.6">• Опціональне стиснення zstd / gzip</tspan><tspan x="630.0" dy="15.6"></tspan><tspan x="630.0" dy="15.6">Процес 2 (Розархіватор tar):</tspan><tspan x="630.0" dy="15.6">• Читання зі stdin потоку блоків по 512 байтів</tspan><tspan x="630.0" dy="15.6">• Відновлення вузлів, розпакування вмісту,</tspan><tspan x="630.0" dy="15.6">  відновлення прав, xattr та міток часу</tspan><tspan x="630.0" dy="15.6"></tspan><tspan x="630.0" dy="15.6">Переваги: без проміжних файлів на диску,</tspan><tspan x="630.0" dy="15.6">ідеально для передачі мережею через SSH.</tspan></text>
<rect x="850.0" y="110.0" width="360.0" height="48.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="1030.0" y="129.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1030.0" dy="0.0">3. rsync -aHAX --sparse</tspan><tspan x="1030.0" dy="18.2">(Трійка процесів та дельта)</tspan></text>
<rect x="850.0" y="170.0" width="360.0" height="440.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1030.0" y="293.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">Архітектура з трьох компонентів:</tspan><tspan x="1030.0" dy="14.3">1. Generator (Ціль):</tspan><tspan x="1030.0" dy="14.3">   Сканує приймач, формує список файлів</tspan><tspan x="1030.0" dy="14.3">   та хеші наявних блоків</tspan><tspan x="1030.0" dy="14.3"></tspan><tspan x="1030.0" dy="14.3">2. Sender (Джерело):</tspan><tspan x="1030.0" dy="14.3">   Порівнює список, шукає дельти,</tspan><tspan x="1030.0" dy="14.3">   відправляє лише змінені фрагменти</tspan><tspan x="1030.0" dy="14.3"></tspan><tspan x="1030.0" dy="14.3">3. Receiver (Ціль):</tspan><tspan x="1030.0" dy="14.3">   Збирає оновлений файл у тимчасовий вузол,</tspan><tspan x="1030.0" dy="14.3">   здійснює атомарне перейменування rename()</tspan><tspan x="1030.0" dy="14.3"></tspan><tspan x="1030.0" dy="14.3">Переваги: ідемпотентність, докачування (--partial),</tspan><tspan x="1030.0" dy="14.3">мінімальний трафік при регулярних бекапах.</tspan></text>
<rect x="50.0" y="630.0" width="1160.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="656.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Практичний вибір інструмента:</tspan><tspan x="630.0" dy="16.9">• Локальний бекап на тому ж сервері / CoW файлова система → cp -a --reflink=auto</tspan><tspan x="630.0" dy="16.9">• Одноразове швидке перенесення великого дерева через швидку мережу без дельти → tar pipe через SSH / nc</tspan><tspan x="630.0" dy="16.9">• Регулярна синхронізація, повільна або нестабільна мережа, інкрементне оновлення → rsync -aHAX --sparse</tspan></text>
</svg>