<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класичний обряд подвійного fork: навіщо потрібен кожен крок</text>
<rect x="30.0" y="75.0" width="240.0" height="175.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="150.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">1. Перший fork()</text>
<rect x="40.0" y="115.0" width="220.0" height="125.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="150.0" y="134.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Батько: exit(0)</tspan><tspan x="150.0" dy="15.6">Дитина: продовжує</tspan><tspan x="150.0" dy="15.6"></tspan><tspan x="150.0" dy="15.6">Мета: гарантувати, що</tspan><tspan x="150.0" dy="15.6">дитина не є лідером групи</tspan><tspan x="150.0" dy="15.6">(PID != PGID),</tspan><tspan x="150.0" dy="15.6">і відпустити оболонку</tspan></text>
<rect x="305.0" y="75.0" width="240.0" height="175.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/>
<text x="425.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">2. setsid()</text>
<rect x="315.0" y="115.0" width="220.0" height="125.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="425.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="425.0" dy="0.0">Дитина викликає setsid()</tspan><tspan x="425.0" dy="15.6"></tspan><tspan x="425.0" dy="15.6">Створюється новий сеанс:</tspan><tspan x="425.0" dy="15.6">SID = PID, PGID = PID</tspan><tspan x="425.0" dy="15.6">Дитина — лідер сеансу.</tspan><tspan x="425.0" dy="15.6">Керівний термінал скинуто</tspan></text>
<rect x="580.0" y="75.0" width="240.0" height="175.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="700.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">3. Другий fork()</text>
<rect x="590.0" y="115.0" width="220.0" height="125.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="700.0" y="134.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Лідер сеансу: exit(0)</tspan><tspan x="700.0" dy="15.6">Онук: продовжує</tspan><tspan x="700.0" dy="15.6"></tspan><tspan x="700.0" dy="15.6">Мета: онук не є лідером</tspan><tspan x="700.0" dy="15.6">сеансу (PID != SID),</tspan><tspan x="700.0" dy="15.6">тому ніколи не захопить</tspan><tspan x="700.0" dy="15.6">термінал через open()</tspan></text>
<rect x="855.0" y="75.0" width="240.0" height="175.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/>
<text x="975.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" font-weight="700">4. Очищення</text>
<rect x="865.0" y="115.0" width="220.0" height="125.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="975.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">umask(0) — повний контроль</tspan><tspan x="975.0" dy="15.6">chdir(&quot;/&quot;) — розблокувати ФС</tspan><tspan x="975.0" dy="15.6"></tspan><tspan x="975.0" dy="15.6">close(0, 1, 2) або</tspan><tspan x="975.0" dy="15.6">dup2(/dev/null, 0, 1, 2)</tspan><tspan x="975.0" dy="15.6">Ізоляція від спадщини</tspan></text>
<line x1="275.0" y1="162.5" x2="300.0" y2="162.5" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="550.0" y1="162.5" x2="575.0" y2="162.5" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="825.0" y1="162.5" x2="850.0" y2="162.5" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="30.0" y="275.0" width="1065.0" height="150.0" rx="6" fill="#fdfefe" stroke="#6b7280" stroke-width="1.5"/>
<text x="560.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключова різниця між першим та другим fork у стандарті POSIX / System V:</text>
<text x="560.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">• Без першого fork виклик setsid() поверне EPERM, якщо процес запущено як лідер групи в пайплайні оболонки.</tspan><tspan x="560.0" dy="16.9">• Без другого fork лідер сеансу на системах System V при відкритті будь-якого модему чи tty без прапорця O_NOCTTY</tspan><tspan x="560.0" dy="16.9">  автоматично робить його новим керуючим терміналом сеансу і знову стає вразливим до сигналів SIGHUP.</tspan></text>
<text x="560.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Подвійний fork перетворює процес на сироту без прав лідера сеансу, унеможливлюючи повернення термінала</text>
</svg>