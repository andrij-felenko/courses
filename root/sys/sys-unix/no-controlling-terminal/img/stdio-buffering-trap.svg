<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка буферизації stdio: чому зникають логи в неінтерактивному середовищі</text>
<rect x="40.0" y="75.0" width="1000.0" height="160.0" rx="8" fill="#f8fafc" stroke="#27ae60" stroke-width="2.0"/>
<text x="80.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Інтерактивний запуск у терміналі (isatty(fileno(stdout)) == 1)</text>
<rect x="60.0" y="125.0" width="260.0" height="85.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="147.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">printf(&quot;Processing batch...\n&quot;);</tspan><tspan x="190.0" dy="16.2"></tspan><tspan x="190.0" dy="16.2">libc визначає:</tspan><tspan x="190.0" dy="16.2">пристрій є терміналом</tspan></text>
<line x1="330.0" y1="167.0" x2="410.0" y2="167.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="370.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">Символ '\n'</text>
<rect x="420.0" y="125.0" width="310.0" height="85.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="575.0" y="155.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">Режим _IOLBF (Line Buffered):</tspan><tspan x="575.0" dy="16.2">Буфер скидається негайно</tspan><tspan x="575.0" dy="16.2">при кожному переході рядка</tspan></text>
<line x1="740.0" y1="167.0" x2="820.0" y2="167.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="830.0" y="125.0" width="190.0" height="85.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="925.0" y="147.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">Термінал / Екран</tspan><tspan x="925.0" dy="16.2"></tspan><tspan x="925.0" dy="16.2">Користувач бачить</tspan><tspan x="925.0" dy="16.2">рядок миттєво</tspan></text>
<rect x="40.0" y="265.0" width="1000.0" height="160.0" rx="8" fill="#f8fafc" stroke="#c0392b" stroke-width="2.0"/>
<text x="80.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">Запуск у cron / systemd / пайпі Docker (isatty(fileno(stdout)) == 0)</text>
<rect x="60.0" y="315.0" width="260.0" height="85.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="337.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">printf(&quot;Processing batch...\n&quot;);</tspan><tspan x="190.0" dy="16.2"></tspan><tspan x="190.0" dy="16.2">libc визначає:</tspan><tspan x="190.0" dy="16.2">вихід перенаправлено</tspan></text>
<line x1="330.0" y1="357.0" x2="410.0" y2="357.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="370.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">Буфер чекає</text>
<rect x="420.0" y="315.0" width="310.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="575.0" y="345.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">Режим _IOFBF (Fully Buffered):</tspan><tspan x="575.0" dy="16.2">Буфер розміром 4096 байтів</tspan><tspan x="575.0" dy="16.2">утримує рядки всередині пам'яті</tspan></text>
<line x1="740.0" y1="357.0" x2="820.0" y2="357.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="830.0" y="315.0" width="190.0" height="85.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="925.0" y="337.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">Журнал / Файл / Pipe</tspan><tspan x="925.0" dy="16.2"></tspan><tspan x="925.0" dy="16.2">Порожньо до 4 КіБ</tspan><tspan x="925.0" dy="16.2">або до падіння процесу</tspan></text>
<text x="540.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Лікування: setvbuf(stdout, NULL, _IOLBF, 0) або явний fflush(stdout) після кожного запису логу</text>
</svg>