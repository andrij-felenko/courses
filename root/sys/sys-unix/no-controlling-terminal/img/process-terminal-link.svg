<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія процесу в ядрі: наявність проти відсутності керуючого термінала</text>
<rect x="40.0" y="70.0" width="490.0" height="400.0" rx="8" fill="#f8fafc" stroke="#27ae60" stroke-width="2.0"/>
<text x="285.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Інтерактивний процес (Bash / SSH / TTY)</text>
<rect x="60.0" y="120.0" width="450.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="285.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">task_struct -&gt; signal_struct</tspan><tspan x="285.0" dy="16.9">tty = struct tty_struct* (наприклад, /dev/pts/4)</tspan><tspan x="285.0" dy="16.9">Лідер або член сеансу термінала</tspan></text>
<rect x="60.0" y="205.0" width="450.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="285.0" y="230.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Дескриптори входу/виходу:</tspan><tspan x="285.0" dy="16.9">0 (stdin) -&gt; /dev/pts/4 (читання з клавіатури)</tspan><tspan x="285.0" dy="16.9">1, 2 (stdout, stderr) -&gt; /dev/pts/4 (екран)</tspan></text>
<rect x="60.0" y="295.0" width="450.0" height="65.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="285.0" y="315.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Буферизація libc (isatty(1) == 1):</tspan><tspan x="285.0" dy="16.2">stdout: лінійна (_IOLBF) — скидання на кожному '\n'</tspan><tspan x="285.0" dy="16.2">Інтерактивні підказки з'являються миттєво</tspan></text>
<rect x="60.0" y="375.0" width="450.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="285.0" y="403.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Взаємодія з /dev/tty та сигналами:</tspan><tspan x="285.0" dy="16.2">open(&quot;/dev/tty&quot;) -&gt; успіх (дескриптор на /dev/pts/4)</tspan><tspan x="285.0" dy="16.2">Сигнали клавіатури: Ctrl+C -&gt; SIGINT, Ctrl+Z -&gt; SIGTSTP</tspan></text>
<rect x="570.0" y="70.0" width="490.0" height="400.0" rx="8" fill="#f8fafc" stroke="#c0392b" stroke-width="2.0"/>
<text x="815.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Headless-процес (systemd / cron / Docker / CI)</text>
<rect x="590.0" y="120.0" width="450.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="815.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">task_struct -&gt; signal_struct</tspan><tspan x="815.0" dy="16.9">tty = NULL (керівний термінал відсутній)</tspan><tspan x="815.0" dy="16.9">Сеанс від'єднаний від будь-якого TTY</tspan></text>
<rect x="590.0" y="205.0" width="450.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="815.0" y="231.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Дескриптори входу/виходу:</tspan><tspan x="815.0" dy="15.6">0 (stdin) -&gt; /dev/null або закритий</tspan><tspan x="815.0" dy="15.6">1, 2 (stdout, stderr) -&gt; journald socket / pipe / /dev/null</tspan></text>
<rect x="590.0" y="295.0" width="450.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="815.0" y="315.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Буферизація libc (isatty(1) == 0):</tspan><tspan x="815.0" dy="16.2">stdout: блочна (_IOFBF) — накопичення до 4096 байтів</tspan><tspan x="815.0" dy="16.2">Вивід у журнал затримується або губиться при падінні</tspan></text>
<rect x="590.0" y="375.0" width="450.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="815.0" y="404.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Взаємодія з /dev/tty та сигналами:</tspan><tspan x="815.0" dy="15.0">open(&quot;/dev/tty&quot;) -&gt; фатальна помилка ENXIO</tspan><tspan x="815.0" dy="15.0">Немає клавіатурних сигналів; зупинка лише через SIGTERM/SIGKILL</tspan></text>
<text x="550.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ядро зв'язує процес із терміналом через покажчик tty; коли покажчик NULL — середовище стає неінтерактивним</text>
</svg>