<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="880.0" height="420.0" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="450.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#263238" text-anchor="middle" font-weight="700">Режими буферизації stdio у конвеєрах та ін'єкція stdbuf</text>
<rect x="25.0" y="60.0" width="265.0" height="340.0" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
<text x="157.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0d47a1" text-anchor="middle" font-weight="700">Інтерактивний TTY</text>
<text x="157.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1565c0" text-anchor="middle">isatty(STDOUT) == 1</text>
<rect x="40.0" y="125.0" width="235.0" height="95.0" rx="4" fill="#ffffff" stroke="#90caf9" stroke-width="1.5"/>
<text x="157.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0d47a1" text-anchor="middle" font-weight="700">Порядковий буфер (_IOLBF)</text>
<text x="157.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1b5e20" text-anchor="middle">Скидання на кожному '\n'</text>
<text x="157.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#37474f" text-anchor="middle">Мінімальна затримка</text>
<text x="157.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#546e7a" text-anchor="middle">Миттєвий вивід людині</text>
<rect x="40.0" y="235.0" width="235.0" height="145.0" rx="4" fill="#ffffff" stroke="#90caf9" stroke-width="1.5"/>
<text x="157.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#263238" text-anchor="middle" font-weight="700">Поведінка команд:</text>
<text x="157.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#37474f" text-anchor="middle">grep, sed, awk напряму в термінал</text>
<text x="157.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1b5e20" text-anchor="middle" font-weight="700">працюють без затримок</text>
<text x="157.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0d47a1" text-anchor="middle" font-weight="700">write(1, line, len)</text>
<text x="157.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#546e7a" text-anchor="middle">після кожного рядка</text>
<rect x="305.0" y="60.0" width="265.0" height="340.0" rx="6" fill="#ffebee" stroke="#d32f2f" stroke-width="1.5"/>
<text x="437.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b71c1c" text-anchor="middle" font-weight="700">Конвеєр / Pipe (Проблема)</text>
<text x="437.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c62828" text-anchor="middle">isatty(STDOUT) == 0</text>
<rect x="320.0" y="125.0" width="235.0" height="95.0" rx="4" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.5"/>
<text x="437.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b71c1c" text-anchor="middle" font-weight="700">Повний буфер (_IOFBF)</text>
<text x="437.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d32f2f" text-anchor="middle" font-weight="700">Розмір: 4096 / 65536 байтів</text>
<text x="437.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#37474f" text-anchor="middle">Скидання лише при переповненні</text>
<text x="437.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#546e7a" text-anchor="middle">або при закритті процесу</text>
<rect x="320.0" y="235.0" width="235.0" height="145.0" rx="4" fill="#ffffff" stroke="#ef9a9a" stroke-width="1.5"/>
<text x="437.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b71c1c" text-anchor="middle" font-weight="700">Ефект «зависання»:</text>
<text x="437.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#212121" text-anchor="middle">tail -f log | grep ... | awk ...</text>
<text x="437.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c62828" text-anchor="middle" font-weight="700">Дані застрягають у буфері grep</text>
<text x="437.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#546e7a" text-anchor="middle">Вивід затримується на хвилини</text>
<text x="437.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d32f2f" text-anchor="middle">до накопичення 4КБ/64КБ даних</text>
<rect x="585.0" y="60.0" width="275.0" height="340.0" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
<text x="722.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1b5e20" text-anchor="middle" font-weight="700">Рішення: stdbuf -oL</text>
<text x="722.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle">LD_PRELOAD=libstdbuf.so</text>
<rect x="600.0" y="125.0" width="245.0" height="95.0" rx="4" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.5"/>
<text x="722.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1b5e20" text-anchor="middle" font-weight="700">Конструктор бібліотеки</text>
<text x="722.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2e7d32" text-anchor="middle">Виклик до старту main()</text>
<text x="722.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#004d40" text-anchor="middle" font-weight="700">setvbuf(stdout, NULL, _IOLBF, 0)</text>
<text x="722.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#546e7a" text-anchor="middle">Примусове ввімкнення рядка</text>
<rect x="600.0" y="235.0" width="245.0" height="145.0" rx="4" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.5"/>
<text x="722.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1b5e20" text-anchor="middle" font-weight="700">Миттєве проходження:</text>
<text x="722.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#212121" text-anchor="middle">stdbuf -oL grep ... | awk ...</text>
<text x="722.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1b5e20" text-anchor="middle" font-weight="700">Рядки надходять негайно</text>
<text x="722.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#37474f" text-anchor="middle" font-weight="700">Прапорці утиліт:</text>
<text x="722.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2e7d32" text-anchor="middle">grep --line-buffered, sed -u</text>
</svg>