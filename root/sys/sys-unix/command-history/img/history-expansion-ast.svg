<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність розкриття історії та фільтрації</text>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр обробки рядка введення: місце історії та фільтрації</text>
<rect x="30.0" y="70.0" width="150.0" height="80.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="105.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">1. Сире введення</text>
<text x="105.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle"><tspan x="105.0" dy="0.0">Рядок від Readline:</tspan><tspan x="105.0" dy="13.0">&quot;sudo !!; echo $?&quot;</tspan></text>
<line x1="180.0" y1="110.0" x2="215.0" y2="110.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="220.0" y="70.0" width="170.0" height="80.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="305.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">2. History Expansion</text>
<text x="305.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle"><tspan x="305.0" dy="0.0">Розкриття !, !!, !$, ^old^new</tspan><tspan x="305.0" dy="13.0">Виконується ПЕРШИМ</tspan></text>
<line x1="390.0" y1="110.0" x2="425.0" y2="110.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="70.0" width="160.0" height="80.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<text x="510.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">3. Фільтрація історії</text>
<text x="510.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle"><tspan x="510.0" dy="0.0">HISTCONTROL (space/dups)</tspan><tspan x="510.0" dy="13.0">HISTIGNORE (маски)</tspan></text>
<line x1="510.0" y1="150.0" x2="510.0" y2="195.0" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="590.0" y1="110.0" x2="625.0" y2="110.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="200.0" width="160.0" height="75.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="510.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700">add_history()</text>
<text x="510.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle"><tspan x="510.0" dy="0.0">Запис у кільцевий</tspan><tspan x="510.0" dy="13.0">буфер пам'яті</tspan></text>
<rect x="630.0" y="70.0" width="100.0" height="340.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="680.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">4. Синтаксис</text>
<text x="680.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle"><tspan x="680.0" dy="0.0">Alias</tspan><tspan x="680.0" dy="10.8">───</tspan><tspan x="680.0" dy="10.8">Brace</tspan><tspan x="680.0" dy="10.8">───</tspan><tspan x="680.0" dy="10.8">Tilde</tspan><tspan x="680.0" dy="10.8">───</tspan><tspan x="680.0" dy="10.8">Parameter</tspan><tspan x="680.0" dy="10.8">───</tspan><tspan x="680.0" dy="10.8">Command sub</tspan><tspan x="680.0" dy="10.8">───</tspan><tspan x="680.0" dy="10.8">Arithmetic</tspan><tspan x="680.0" dy="10.8">───</tspan><tspan x="680.0" dy="10.8">Word split</tspan><tspan x="680.0" dy="10.8">───</tspan><tspan x="680.0" dy="10.8">Path glob</tspan><tspan x="680.0" dy="10.8">───</tspan><tspan x="680.0" dy="10.8">Quote removal</tspan><tspan x="680.0" dy="10.8">───</tspan><tspan x="680.0" dy="10.8">EXECVE()</tspan></text>
<rect x="30.0" y="290.0" width="360.0" height="120.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="210.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">Важливий порядок виконання:</text>
<text x="45.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start"><tspan x="45.0" dy="0.0">• Розкриття історії (!) відбувається ДО того, як оболонка</tspan><tspan x="45.0" dy="14.0">  розпізнає лапки, змінні чи підстановку команд.</tspan><tspan x="45.0" dy="14.0">• Рядок із подвійними лапками &quot;echo !$&quot; все одно розкриється.</tspan><tspan x="45.0" dy="14.0">• Рядок із одинарними лапками 'echo !$' НЕ розкривається.</tspan><tspan x="45.0" dy="14.0">• ignorespace ігнорує рядок, якщо перший символ — пробіл.</tspan></text>
</svg>