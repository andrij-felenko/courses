<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="410.0" height="440.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="225.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Простір користувача (User Space)</text>
<text x="225.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Інтерпретація: LC_CTYPE, libc, термінал</text>
<rect x="450.0" y="20.0" width="410.0" height="440.0" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="655.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ядро Linux / Unix (Kernel Space)</text>
<text x="655.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Неінтерпретований потік байтів (Opaque Bytes)</text>
<rect x="40.0" y="100.0" width="370.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="225.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прикладна програма / Текстовий редактор</text>
<text x="225.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Рядок: &quot;Звіт.txt&quot; (4 символи Unicode)</text>
<text x="225.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Символи: U+0417, U+0432, U+0456, U+0442 ...</text>
<line x1="225.0" y1="175.0" x2="225.0" y2="205.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="205.0" width="370.0" height="85.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="225.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бібліотека C (glibc / musl) &amp; LC_CTYPE</text>
<text x="225.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Кодування UTF-8: перетворення у байти</text>
<text x="225.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Результат: 12 байтів (D0 97 D0 B2 D1 96 D1 82 2E 74 78 74)</text>
<line x1="225.0" y1="290.0" x2="225.0" y2="320.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="320.0" width="370.0" height="120.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="225.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Термінал / Емулятор (pty / rendering)</text>
<text x="225.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Декодує потік UTF-8, шукає гліфи у шрифті</text>
<text x="225.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Обчислює ширину колонок (wcwidth)</text>
<text x="225.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Розпізнає керуючі коди: \n (LF), \r (CR), ESC[...m</text>
<text x="225.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Виводить растрові символи на екранну сітку</text>
<line x1="410.0" y1="245.0" x2="450.0" y2="245.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">open()</text>
<rect x="470.0" y="100.0" width="370.0" height="140.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="655.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Системні виклики та VFS</text>
<text x="655.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Отримує char* — масив невідомих байтів</text>
<rect x="485.0" y="160.0" width="340.0" height="40.0" rx="4" fill="#fef2f2" stroke="#c0392b" stroke-width="1.0"/>
<text x="655.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Ядро знає лише 2 особливі байти:</text>
<text x="655.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">0x00 (NUL) — кінець рядка; 0x2F (/) — роздільник шляху</text>
<text x="655.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Решта 254 байтів (0x01..0xFF) — сліпий вантаж</text>
<line x1="655.0" y1="240.0" x2="655.0" y2="275.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="470.0" y="275.0" width="370.0" height="85.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="655.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Файлові системи (ext4, XFS, Btrfs)</text>
<text x="655.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Зберігає імена у каталогах як сирі октети</text>
<text x="655.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Вміст файлу — лінійний масив байтів без схеми</text>
<line x1="655.0" y1="360.0" x2="655.0" y2="395.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="470.0" y="395.0" width="370.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="655.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Дисковий драйвер / Блоковий рівень (NVMe, SSD)</text>
</svg>