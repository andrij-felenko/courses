<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Безпека конвеєрів: \n (LF) проти NUL (0x00) як роздільника</text>
<rect x="30.0" y="55.0" width="820.0" height="160.0" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
<text x="140.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Небезпечний конвеєр (за замовчуванням):</text>
<text x="460.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">find . -name &quot;*.log&quot; | xargs rm</text>
<rect x="50.0" y="100.0" width="240.0" height="60.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="170.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Файл на файловій системі:</text>
<text x="170.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">&quot;my report 2026.log&quot;</text>
<line x1="290.0" y1="130.0" x2="350.0" y2="130.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="320.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">потік</text>
<rect x="350.0" y="100.0" width="210.0" height="60.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="455.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">xargs розбиває за пробілами:</text>
<text x="455.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">3 окремі аргументи</text>
<line x1="560.0" y1="130.0" x2="620.0" y2="130.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="620.0" y="100.0" width="210.0" height="60.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.0"/>
<text x="725.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">rm шукає три файли:</text>
<text x="725.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">&quot;my&quot;, &quot;report&quot;, &quot;2026.log&quot;</text>
<text x="440.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Катастрофа: випадкове видалення не тих файлів або помилки No such file</text>
<rect x="30.0" y="230.0" width="820.0" height="165.0" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
<text x="130.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Безпечний конвеєр (NUL-поділ):</text>
<text x="460.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">find . -name &quot;*.log&quot; -print0 | xargs -0 rm</text>
<rect x="50.0" y="275.0" width="240.0" height="60.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="170.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Файл із пробілами чи \n:</text>
<text x="170.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">&quot;my report 2026.log\0&quot;</text>
<line x1="290.0" y1="305.0" x2="350.0" y2="305.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="320.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">\0 потік</text>
<rect x="350.0" y="275.0" width="210.0" height="60.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="455.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">xargs -0 ділить ТІЛЬКИ по \0:</text>
<text x="455.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Пробіли та \n зберігаються</text>
<line x1="560.0" y1="305.0" x2="620.0" y2="305.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="620.0" y="275.0" width="210.0" height="60.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="1.0"/>
<text x="725.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">rm отримує точний шлях:</text>
<text x="725.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">argv[1] = &quot;my report 2026.log&quot;</text>
<text x="440.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">NUL (0x00) — єдиний байт, заборонений в іменах файлів Unix, гарантує цілісність</text>
</svg>