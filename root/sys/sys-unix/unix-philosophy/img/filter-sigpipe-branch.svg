<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що станеться, коли наступна ланка пішла раніше за вас</text>
<rect x="334.4" y="55.0" width="331.2" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="76.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">write() у канал, чий читач уже закрився</tspan></text>
<line x1="450.0" y1="92.0" x2="280.0" y2="146.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="550.0" y1="92.0" x2="720.0" y2="146.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="169.6" y="150.1" width="160.8" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="171.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">диспозиція SIGPIPE:</tspan><tspan x="250.0" dy="16.9">типова дія</tspan></text>
<rect x="669.6" y="150.1" width="160.8" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="750.0" y="171.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">SIGPIPE ігнорується</tspan><tspan x="750.0" dy="16.9">або має обробник</tspan></text>
<line x1="250.0" y1="201.0" x2="250.0" y2="244.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="750.0" y1="201.0" x2="750.0" y2="244.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="143.7" y="247.1" width="212.7" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="268.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">процес гине від сигналу 13</tspan><tspan x="250.0" dy="16.9">write() не повертається</tspan></text>
<rect x="640.0" y="247.1" width="220.1" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="268.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">write() повертає −1,</tspan><tspan x="750.0" dy="16.9">errno = EPIPE (32 на Linux)</tspan></text>
<line x1="250.0" y1="298.0" x2="250.0" y2="341.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="750.0" y1="298.0" x2="750.0" y2="341.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="132.6" y="344.1" width="234.9" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="365.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">оболонка звітує 141 = 128+13,</tspan><tspan x="250.0" dy="16.9">конвеєр згортається сам</tspan></text>
<rect x="617.7" y="344.1" width="264.5" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="365.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">ваш код мусить помітити EPIPE</tspan><tspan x="750.0" dy="16.9">і тихо вийти — це не ваша помилка</tspan></text>
<text x="500.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">саме ліва гілка робить «… | head -1» миттєвим на гігабайтному вході</text>
</svg>