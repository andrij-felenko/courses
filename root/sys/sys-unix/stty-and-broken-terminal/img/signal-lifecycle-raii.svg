<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл безпечного керування терміналом</text>
<rect x="20.0" y="20.0" width="1000.0" height="44.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="47.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Життєвий цикл програми: гарантоване відновлення termios у C та C++</tspan></text>
<rect x="20.0" y="80.0" width="480.0" height="390.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<rect x="30.0" y="90.0" width="460.0" height="36.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="112.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Штатний потік виконання (RAII / atexit)</tspan></text>
<rect x="30.0" y="134.0" width="460.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="260.0" y="157.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">1. Збереження початкового стану:</tspan><tspan x="260.0" dy="15.6">tcgetattr(STDIN_FILENO, &amp;orig_termios);</tspan></text>
<rect x="30.0" y="196.0" width="460.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="260.0" y="219.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">2. Вхід у сирий режим:</tspan><tspan x="260.0" dy="15.6">raw = orig_termios; cfmakeraw(&amp;raw); tcsetattr(...);</tspan></text>
<rect x="30.0" y="258.0" width="460.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="260.0" y="284.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">3. Робота програми:</tspan><tspan x="260.0" dy="15.6">Інтерактивний ввід, редагування, меню TUI.</tspan></text>
<rect x="30.0" y="326.0" width="460.0" height="60.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">4. Штатний вихід (Clean Exit):</tspan><tspan x="260.0" dy="15.6">Деструктор RAII або функція atexit() автоматично</tspan><tspan x="260.0" dy="15.6">викликає tcsetattr(STDIN_FILENO, TCSAFLUSH, &amp;orig_termios).</tspan></text>
<rect x="30.0" y="394.0" width="460.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="260.0" y="422.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">РЕЗУЛЬТАТ:</tspan><tspan x="260.0" dy="15.6">Термінал бездоганно чистий і готовий до роботи оболонки.</tspan></text>
<rect x="540.0" y="80.0" width="480.0" height="390.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<rect x="550.0" y="90.0" width="460.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="112.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Аварійні сигнали та Job Control (sigaction)</tspan></text>
<rect x="550.0" y="134.0" width="460.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="780.0" y="159.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Сигнали завершення (SIGINT, SIGTERM, SIGHUP, SIGQUIT):</tspan><tspan x="780.0" dy="15.6">• Обробник відновлює tcsetattr(..., &amp;orig_termios);</tspan><tspan x="780.0" dy="15.6">• Скидає дію на SIG_DFL та повторно шле сигнал через raise().</tspan></text>
<rect x="550.0" y="216.0" width="460.0" height="96.0" rx="6" fill="#fff8e7" stroke="#d97706" stroke-width="1.5"/><text x="780.0" y="244.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Зупинка процесу клавішею Ctrl+Z (SIGTSTP):</tspan><tspan x="780.0" dy="15.6">• Обробник ловить SIGTSTP;</tspan><tspan x="780.0" dy="15.6">• Відновлює початковий termios (віддає термінал shell);</tspan><tspan x="780.0" dy="15.6">• Розблоковує SIGTSTP і присипляє процес через raise(SIGTSTP).</tspan></text>
<rect x="550.0" y="320.0" width="460.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="780.0" y="342.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Повернення у foreground (SIGCONT):</tspan><tspan x="780.0" dy="15.6">• Обробник ловить SIGCONT після команди fg;</tspan><tspan x="780.0" dy="15.6">• Повторно застосовує сирий режим raw_termios.</tspan></text>
<rect x="550.0" y="396.0" width="460.0" height="62.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="423.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">РЕЗУЛЬТАТ:</tspan><tspan x="780.0" dy="14.3">Програма виживає при фонуванні й не ламає термінал при аварії.</tspan></text>
</svg>