<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура розподілу стану термінала</text>
<rect x="20.0" y="20.0" width="1000.0" height="44.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="47.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Розподіл стану термінальної сесії між трьома незалежними сутностями</tspan></text>
<rect x="20.0" y="80.0" width="310.0" height="400.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<rect x="30.0" y="90.0" width="290.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="175.0" y="114.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">1. Процес застосунку (vim, sudo, fzf)</tspan></text>
<rect x="30.0" y="142.0" width="290.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="175.0" y="168.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">• Пам'ять процесу (стек, купа)</tspan><tspan x="175.0" dy="15.6">• Буфери termios всередині libc</tspan><tspan x="175.0" dy="15.6">• Обробники сигналів та деструктори</tspan></text>
<rect x="30.0" y="228.0" width="290.0" height="100.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="175.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">АВАРІЯ:</tspan><tspan x="175.0" dy="15.6">• SIGKILL, SIGSEGV, обрив SSH</tspan><tspan x="175.0" dy="15.6">• Процес зникає миттєво</tspan><tspan x="175.0" dy="15.6">• Не встигає викликати tcsetattr()</tspan><tspan x="175.0" dy="15.6">• Пам'ять процесу очищено</tspan></text>
<rect x="30.0" y="340.0" width="290.0" height="126.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="175.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">НАСЛІДОК:</tspan><tspan x="175.0" dy="15.6">Увесь код відновлення в пам'яті</tspan><tspan x="175.0" dy="15.6">знищено. Але стан термінала</tspan><tspan x="175.0" dy="15.6">живе НЕ ТУТ, тому термінал</tspan><tspan x="175.0" dy="15.6">залишається спотвореним.</tspan></text>
<rect x="365.0" y="80.0" width="310.0" height="400.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<rect x="375.0" y="90.0" width="290.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">2. Ядро ОС (struct termios в N_TTY)</tspan></text>
<rect x="375.0" y="142.0" width="290.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="168.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">• c_lflag: ECHO, ICANON, ISIG</tspan><tspan x="520.0" dy="15.6">• c_oflag: OPOST, ONLCR</tspan><tspan x="520.0" dy="15.6">• c_iflag: ICRNL, IXON, BRKINT</tspan></text>
<rect x="375.0" y="228.0" width="290.0" height="100.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">ПОВЕДІНКА:</tspan><tspan x="520.0" dy="15.6">• Належить пристрою (/dev/pts/N)</tspan><tspan x="520.0" dy="15.6">• НЕ залежить від життя процесу</tspan><tspan x="520.0" dy="15.6">• Зберігає біти сирого режиму</tspan><tspan x="520.0" dy="15.6">• Передається наступній програмі</tspan></text>
<rect x="375.0" y="340.0" width="290.0" height="126.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">НАСЛІДОК:</tspan><tspan x="520.0" dy="15.6">Оболонка (bash/zsh) отримує</tspan><tspan x="520.0" dy="15.6">дескриптор із вимкненим ECHO</tspan><tspan x="520.0" dy="15.6">або ONLCR. Будь-який ввід стає</tspan><tspan x="520.0" dy="15.6">невидимим або кривим.</tspan></text>
<rect x="710.0" y="80.0" width="310.0" height="400.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/>
<rect x="720.0" y="90.0" width="290.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="865.0" y="114.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="865.0" dy="0.0">3. Емулятор (xterm, alacritty, kitty)</tspan></text>
<rect x="720.0" y="142.0" width="290.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="865.0" y="168.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">• Таблиця символів G0/G1 (DEC alt)</tspan><tspan x="865.0" dy="15.6">• Видимість курсора (DECTCEM)</tspan><tspan x="865.0" dy="15.6">• Альтернативний екранний буфер</tspan></text>
<rect x="720.0" y="228.0" width="290.0" height="100.0" rx="6" fill="#fff8e7" stroke="#d97706" stroke-width="1.5"/><text x="865.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">ПОВЕДІНКА:</tspan><tspan x="865.0" dy="15.6">• Керується байтами у stdout</tspan><tspan x="865.0" dy="15.6">• Бінарне сміття шле ESC ( 0 або SO</tspan><tspan x="865.0" dy="15.6">• Перемикає рендер на графіку</tspan><tspan x="865.0" dy="15.6">• Ядро про це нічого не знає</tspan></text>
<rect x="720.0" y="340.0" width="290.0" height="126.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="865.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">НАСЛІДОК:</tspan><tspan x="865.0" dy="15.6">Звичайні літери перетворюються</tspan><tspan x="865.0" dy="15.6">на лінії й кутики (┌─┐│).</tspan><tspan x="865.0" dy="15.6">Ядро працює ідеально, але екран</tspan><tspan x="865.0" dy="15.6">рендерить рунічне сміття.</tspan></text>
<rect x="20.0" y="494.0" width="1000.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="522.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">ВИСНОВОК: Лікування вимагає двох дій: (1) stty sane лагодить ядро; (2) reset / RIS лагодить емулятор.</tspan></text>
</svg>