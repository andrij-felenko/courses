<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Протокол покрокової реанімації термінала</text>
<rect x="20.0" y="20.0" width="1000.0" height="44.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="47.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Покроковий протокол реанімації (CPR) для термінала</tspan></text>
<rect x="20.0" y="80.0" width="235.0" height="360.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<rect x="28.0" y="90.0" width="219.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="137.5" y="112.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="137.5" dy="0.0">Крок 1: Очищення</tspan></text>
<rect x="28.0" y="134.0" width="219.0" height="44.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="137.5" y="159.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="137.5" dy="0.0">&lt;Ctrl+C&gt;</tspan></text>
<rect x="28.0" y="186.0" width="219.0" height="238.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="137.5" y="285.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="137.5" dy="0.0">Перериває завислу фонову</tspan><tspan x="137.5" dy="15.6">програму чи конвеєр,</tspan><tspan x="137.5" dy="15.6">якщо прапорець ISIG</tspan><tspan x="137.5" dy="15.6">ще активний у ядрі.</tspan></text>
<rect x="275.0" y="80.0" width="235.0" height="360.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<rect x="283.0" y="90.0" width="219.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="392.5" y="112.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="392.5" dy="0.0">Крок 2: Наосліп</tspan></text>
<rect x="283.0" y="134.0" width="219.0" height="44.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="392.5" y="159.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="392.5" dy="0.0">&lt;Ctrl+J&gt;stty sane&lt;Ctrl+J&gt;</tspan></text>
<rect x="283.0" y="186.0" width="219.0" height="238.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="392.5" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="392.5" dy="0.0">Якщо ICRNL вимкнено,</tspan><tspan x="392.5" dy="15.6">Enter (0x0D) ігнорується.</tspan><tspan x="392.5" dy="15.6">Ctrl+J шле LF (0x0A),</tspan><tspan x="392.5" dy="15.6">змушуючи shell виконати</tspan><tspan x="392.5" dy="15.6">скидання termios у ядрі.</tspan></text>
<rect x="530.0" y="80.0" width="235.0" height="360.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
<rect x="538.0" y="90.0" width="219.0" height="36.0" rx="6" fill="#fff8e7" stroke="#d97706" stroke-width="1.5"/><text x="647.5" y="112.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="647.5" dy="0.0">Крок 3: Графіка</tspan></text>
<rect x="538.0" y="134.0" width="219.0" height="44.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="647.5" y="159.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="647.5" dy="0.0">echo -e '\033(B\017'</tspan></text>
<rect x="538.0" y="186.0" width="219.0" height="238.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="647.5" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="647.5" dy="0.0">Шле послідовності:</tspan><tspan x="647.5" dy="15.6">ESC ( B (G0 -&gt; ASCII)</tspan><tspan x="647.5" dy="15.6">та SI (0x0F, Shift In).</tspan><tspan x="647.5" dy="15.6">Повертає нормальний</tspan><tspan x="647.5" dy="15.6">шрифт в емуляторі.</tspan></text>
<rect x="785.0" y="80.0" width="235.0" height="360.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<rect x="793.0" y="90.0" width="219.0" height="36.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="902.5" y="112.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="902.5" dy="0.0">Крок 4: Ресет</tspan></text>
<rect x="793.0" y="134.0" width="219.0" height="44.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="902.5" y="159.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="902.5" dy="0.0">reset / tput reset</tspan></text>
<rect x="793.0" y="186.0" width="219.0" height="238.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="902.5" y="285.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="902.5" dy="0.0">Шле терміналу код</tspan><tspan x="902.5" dy="15.6">ініціалізації RIS (ESC c),</tspan><tspan x="902.5" dy="15.6">очищає екранний буфер,</tspan><tspan x="902.5" dy="15.6">скидає шрифти й стан.</tspan></text>
<line x1="257.0" y1="240.0" x2="273.0" y2="240.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="512.0" y1="240.0" x2="528.0" y2="240.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="767.0" y1="240.0" x2="783.0" y2="240.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="20.0" y="456.0" width="1000.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="484.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Універсальна «сліпа рятівна комбінація»: &lt;Enter&gt;&lt;Ctrl+C&gt;&lt;Ctrl+J&gt;stty sane&lt;Ctrl+J&gt;</tspan></text>
</svg>