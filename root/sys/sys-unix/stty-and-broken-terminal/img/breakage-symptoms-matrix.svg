<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця симптомів пошкодження термінала</text>
<rect x="20.0" y="20.0" width="1000.0" height="44.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="47.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Чотири класичних синдроми зіпсованого термінала</tspan></text>
<rect x="20.0" y="80.0" width="480.0" height="195.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="30.0" y="90.0" width="460.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="260.0" y="110.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Синдром 1: Сліпий ввід</tspan></text>
<rect x="30.0" y="126.0" width="460.0" height="26.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="143.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Причина: Знято прапорець ECHO</tspan></text>
<rect x="30.0" y="156.0" width="460.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="260.0" y="165.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Прояв:</tspan><tspan x="260.0" dy="14.3">Клавіатура не відлунює ввід на екран.</tspan><tspan x="260.0" dy="14.3">Команди йдуть, але друк невидимий.</tspan></text>
<rect x="30.0" y="200.0" width="460.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="260.0" y="205.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Джерело:</tspan><tspan x="260.0" dy="14.3">sudo, ssh або ncurses впали</tspan><tspan x="260.0" dy="14.3">до відновлення прапорця ECHO.</tspan></text>
<rect x="30.0" y="236.0" width="460.0" height="28.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="254.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Лікування: stty echo  або  stty sane</tspan></text>
<rect x="540.0" y="80.0" width="480.0" height="195.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="550.0" y="90.0" width="460.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="780.0" y="110.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Синдром 2: Ефект сходів</tspan></text>
<rect x="550.0" y="126.0" width="460.0" height="26.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="143.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Причина: Знято прапорець ONLCR</tspan></text>
<rect x="550.0" y="156.0" width="460.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="780.0" y="165.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Прояв:</tspan><tspan x="780.0" dy="14.3">Символ \n не додає повернення каретки \r.</tspan><tspan x="780.0" dy="14.3">Текст з'їжджає вправо сходинками.</tspan></text>
<rect x="550.0" y="200.0" width="460.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="780.0" y="205.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Джерело:</tspan><tspan x="780.0" dy="14.3">Редактори вимикають ONLCR</tspan><tspan x="780.0" dy="14.3">для прямого позиціонування курсора.</tspan></text>
<rect x="550.0" y="236.0" width="460.0" height="28.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="254.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Лікування: stty opost onlcr  або  stty sane</tspan></text>
<rect x="20.0" y="290.0" width="480.0" height="195.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="30.0" y="300.0" width="460.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="260.0" y="320.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Синдром 3: Завислий сирий режим</tspan></text>
<rect x="30.0" y="336.0" width="460.0" height="26.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="353.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Причина: Знято ICANON та ISIG</tspan></text>
<rect x="30.0" y="366.0" width="460.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="260.0" y="375.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Прояв:</tspan><tspan x="260.0" dy="14.3">Забій пише ^H, Enter не завершує рядок,</tspan><tspan x="260.0" dy="14.3">Ctrl+C не шле SIGINT, а пише ^C.</tspan></text>
<rect x="30.0" y="410.0" width="460.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="260.0" y="415.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Джерело:</tspan><tspan x="260.0" dy="14.3">Програма сирого вводу впала;</tspan><tspan x="260.0" dy="14.3">ядро не редагує рядок і не шле сигнали.</tspan></text>
<rect x="30.0" y="446.0" width="460.0" height="28.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="464.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Лікування: &lt;Ctrl+J&gt;stty sane&lt;Ctrl+J&gt;</tspan></text>
<rect x="540.0" y="290.0" width="480.0" height="195.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="550.0" y="300.0" width="460.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="780.0" y="320.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Синдром 4: Графіка замість літер</tspan></text>
<rect x="550.0" y="336.0" width="460.0" height="26.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="353.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Причина: Увімкнено DEC VT100 Alt Charset</tspan></text>
<rect x="550.0" y="366.0" width="460.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="780.0" y="375.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Прояв:</tspan><tspan x="780.0" dy="14.3">Букви стають рамками й псевдографікою</tspan><tspan x="780.0" dy="14.3">(наприклад, ls друкує ┌⎺).</tspan></text>
<rect x="550.0" y="410.0" width="460.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="780.0" y="415.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Джерело:</tspan><tspan x="780.0" dy="14.3">cat бінарного файлу чи /dev/urandom</tspan><tspan x="780.0" dy="14.3">надіслав SO (0x0E) або ESC ( 0.</tspan></text>
<rect x="550.0" y="446.0" width="460.0" height="28.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="464.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Лікування: echo -e '\033(B\017'  або  reset</tspan></text>
</svg>