<rect x="470.0" y="66.0" width="460.0" height="84.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/><text x="700.0" y="104.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">iovec: один байт «x» — справжні дані</tspan><tspan x="700.0" dy="16.9">без них Linux керувального не надішле</tspan></text>
