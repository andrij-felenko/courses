<line x1="376.0" y1="216.0" x2="464.0" y2="254.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="50.0" y="410.0" width="880.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="490.0" y="445.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Ядро переносить не число, а посилання: одержувач дістає інший номер</tspan><tspan x="490.0" dy="16.9">дескриптора й той самий опис відкритого файлу — з тією ж позицією.</tspan><tspan x="490.0" dy="16.9">Дескриптор «у польоті» вже тримає опис живим, навіть якщо відправник закрив свій.</tspan></text>
</svg>