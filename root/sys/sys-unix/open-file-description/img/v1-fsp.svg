<text x="755.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">fsp — 50 записів на всю машину</text>
<text x="755.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">по 8 байтів кожен</text>
<rect x="586.0" y="124.0" width="338.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="755.0" y="143.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">запис 1</tspan></text>
<rect x="586.0" y="160.0" width="338.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="755.0" y="179.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">запис 2</tspan></text>
<rect x="586.0" y="196.0" width="338.0" height="118.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/><text x="755.0" y="226.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">запис 3</tspan><tspan x="755.0" dy="16.2">i-число файлу (знак = режим доступу)</tspan><tspan x="755.0" dy="16.2">номер пристрою</tspan><tspan x="755.0" dy="16.2">покажчик читання-запису</tspan><tspan x="755.0" dy="16.2">скільки процесів користується: 2</tspan></text>
<rect x="586.0" y="320.0" width="338.0" height="26.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="755.0" y="337.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">…</tspan></text>
<line x1="246.0" y1="116.0" x2="580.0" y2="226.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="300.0" width="330.0" height="122.0" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="215.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">дитина після fork — копія u.fp</text>
<rect x="74.0" y="344.0" width="282.0" height="62.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.4"/><text x="215.0" y="371.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">ті самі номери 3 і 7 —</tspan><tspan x="215.0" dy="16.2">ядро лише збільшує лічильник</tspan></text>
<line x1="360.0" y1="372.0" x2="580.0" y2="288.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="470.0" width="900.0" height="150.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="500.0" y="523.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Процес не тримає ані позиції, ані режиму доступу: у нього лише номер запису.</tspan><tspan x="500.0" dy="17.6">Тому seek одного співвласника зсуває покажчик усім, хто має той самий номер,</tspan><tspan x="500.0" dy="17.6">а fork не копіює стан відкриття — він додає ще одного користувача запису.</tspan><tspan x="500.0" dy="17.6">Це будова першої редакції Unix, листопад 1971: ще без dup і без каналів.</tspan></text>
</svg>