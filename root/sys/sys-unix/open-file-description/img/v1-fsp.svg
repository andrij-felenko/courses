<text x="84.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">слот 3</text>
<rect x="180.0" y="202.0" width="60.0" height="26.0" rx="4" fill="#eef3fb" stroke="#2457d6" stroke-width="1.4"/>
