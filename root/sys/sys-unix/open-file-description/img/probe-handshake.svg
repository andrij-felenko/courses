<text x="240.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">батько</text>
<text x="720.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">дитина</text>
<rect x="70.0" y="96.0" width="340.0" height="58.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="120.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">open(probe.txt) · write «AAAAA»</tspan><tspan x="240.0" dy="17.6">позиція опису: 0 → 5</tspan></text>
<text x="240.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">fork()</text>
<line x1="300.0" y1="172.0" x2="700.0" y2="196.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="550.0" y="206.0" width="340.0" height="58.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="230.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">write «BBBBB» тим самим fd</tspan><tspan x="720.0" dy="17.6">та сама позиція: 5 → 10</tspan></text>
<text x="480.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">канал up: «я записав»</text>
<line x1="548.0" y1="300.0" x2="412.0" y2="318.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70.0" y="302.0" width="340.0" height="76.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.7"/><text x="240.0" y="327.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">fdinfo(батько) · fdinfo(дитина)</tspan><tspan x="240.0" dy="17.6">kcmp(KCMP_FILE)</tspan><tspan x="240.0" dy="17.6">дитина ЩЕ ЖИВА</tspan></text>
<text x="480.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">канал down: «можна виходити»</text>
<line x1="412.0" y1="422.0" x2="548.0" y2="440.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="550.0" y="424.0" width="340.0" height="44.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="450.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">_exit(0)</tspan></text>
<rect x="70.0" y="462.0" width="340.0" height="44.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="488.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">waitpid(kid)</tspan></text>
<rect x="50.0" y="552.0" width="860.0" height="82.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="480.0" y="580.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Без обох рукостискань дитина встигає вийти раніше за вимір:</tspan><tspan x="480.0" dy="16.9">тека /proc/&lt;pid&gt;/fdinfo зникає разом із процесом, а kcmp повертає ESRCH.</tspan><tspan x="480.0" dy="16.9">Зомбі теж не рятує — таблицю дескрипторів звільняють на _exit, а не на waitpid.</tspan></text>
</svg>