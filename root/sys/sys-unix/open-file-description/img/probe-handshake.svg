<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">порядок виміру: дитина мусить дожити до kcmp</text>
<rect x="50.0" y="56.0" width="380.0" height="470.0" rx="12" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.3"/>
