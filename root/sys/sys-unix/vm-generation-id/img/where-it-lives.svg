<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1430 870" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1430" height="870" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="710.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ідентифікатор покоління — це не пристрій, а шістнадцять байтів у пам'яті</text>
<text x="330.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ГІПЕРВІЗОР</text>
<text x="1080.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ГОСТЬОВЕ ЯДРО</text>
<line x1="700.0" y1="95.0" x2="700.0" y2="700.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="7 6"/>
<rect x="204.9" y="132.6" width="250.3" height="74.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="157.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">опис пристрою в таблицях ACPI:</tspan><tspan x="330.0" dy="16.9">_CID = «VM_Gen_Counter»,</tspan><tspan x="330.0" dy="16.9">метод ADDR → фізична адреса</tspan></text>
<rect x="182.6" y="342.6" width="294.8" height="74.8" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="330.0" y="367.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">сторінка гостьової фізичної пам'яті,</tspan><tspan x="330.0" dy="16.9">вилучена з карти доступного ОЗП:</tspan><tspan x="330.0" dy="16.9">16 байтів, вирівняні на 8</tspan></text>
<rect x="193.7" y="562.6" width="272.5" height="74.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="330.0" y="587.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">під час клонування або відкоту</tspan><tspan x="330.0" dy="16.9">гіпервізор вписує сюди нове число</tspan><tspan x="330.0" dy="16.9">і б'є Notify(0x80)</tspan></text>
<line x1="330.0" y1="427.4" x2="330.0" y2="552.6" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="966.0" y="141.1" width="228.1" height="57.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1080.0" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">драйвер vmgenid бере адресу</tspan><tspan x="1080.0" dy="16.9">з ADDR і робить memremap</tspan></text>
<line x1="471.1" y1="170.0" x2="950.0" y2="170.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="947.4" y="351.1" width="265.1" height="57.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1080.0" y="376.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">next_id — покажчик у ту сторінку</tspan><tspan x="1080.0" dy="16.9">this_id — власна копія 16 байтів</tspan></text>
<line x1="493.4" y1="380.0" x2="931.4" y2="380.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="943.7" y="571.0" width="272.5" height="57.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1080.0" y="596.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">обробник звіряє this_id з next_id</tspan><tspan x="1080.0" dy="16.9">і, якщо різні, б'є тривогу</tspan></text>
<line x1="482.3" y1="600.0" x2="927.7" y2="600.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="366.4" y="732.6" width="667.2" height="54.8" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="700.0" y="756.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Пам'ять дає звірку будь-якої миті, сповіщення — поштовх;</tspan><tspan x="700.0" dy="16.2">без ACPI ту саму пару дає вузол дерева пристроїв «microsoft,vmgenid» з reg і перериванням.</tspan></text>
</svg>