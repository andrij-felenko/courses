<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1370 950" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1370" height="950" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="680.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Знімок роздвоює історію машини, і обидві гілки цього не помічають</text>
<text x="150.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ОДНА ІСТОРІЯ</text>
<line x1="80.0" y1="300.0" x2="560.0" y2="300.0" stroke="#333333" stroke-width="2.4"/>
<circle cx="560.0" cy="300.0" r="8.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<rect x="180.1" y="147.6" width="239.7" height="54.8" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="300.0" y="171.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">стан машини: ключ генератора,</tspan><tspan x="300.0" dy="16.2">лічильники, відкриті з'єднання</tspan></text>
<line x1="300.0" y1="210.4" x2="300.0" y2="288.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="447.0" y="402.1" width="226.1" height="55.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="560.0" y="426.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">ЗНІМОК</tspan><tspan x="560.0" dy="16.9">увесь стан збережено у файл</tspan></text>
<line x1="560.0" y1="312.0" x2="560.0" y2="394.1" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="560.0" y1="300.0" x2="700.0" y2="150.0" stroke="#333333" stroke-width="2.4"/>
<line x1="700.0" y1="150.0" x2="1130.0" y2="150.0" stroke="#333333" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="560.0" y1="300.0" x2="700.0" y2="560.0" stroke="#333333" stroke-width="2.4"/>
<line x1="700.0" y1="560.0" x2="1130.0" y2="560.0" stroke="#333333" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="841.5" y="40.6" width="197.0" height="54.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.3"/><text x="940.0" y="64.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">копія A: та сама гама,</tspan><tspan x="940.0" dy="16.2">ті самі одноразові числа</tspan></text>
<rect x="841.5" y="614.6" width="197.0" height="54.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.3"/><text x="940.0" y="638.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">копія B: та сама гама,</tspan><tspan x="940.0" dy="16.2">ті самі одноразові числа</tspan></text>
<text x="317.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">ID = G₁</text>
<text x="940.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">ID = G₂</text>
<text x="940.0" y="538.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">ID = G₃</text>
<rect x="417.8" y="761.0" width="524.5" height="57.9" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.4"/><text x="680.0" y="786.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Гість не бачить розгалуження: обидві копії пам'ятають лише стовбур.</tspan><tspan x="680.0" dy="16.9">Єдине, що їх розрізняє, — 128-бітне число, яке вписав гіпервізор.</tspan></text>
<rect x="340.2" y="881.8" width="679.5" height="36.5" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="680.0" y="904.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Пауза, перезавантаження гостя й жива міграція розгалуження не роблять — там ID лишається G₁.</tspan></text>
</svg>