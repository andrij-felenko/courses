<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="26.0" y="172.0" width="160.0" height="74.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="106.0" y="213.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="106.0" dy="0.0">епоха</tspan></text>
<rect x="26.0" y="272.0" width="160.0" height="116.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="106.0" y="334.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="106.0" dy="0.0">що додав</tspan></text>
<rect x="26.0" y="404.0" width="160.0" height="116.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="106.0" y="466.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="106.0" dy="0.0">яку проблему закрив</tspan></text>
<rect x="26.0" y="536.0" width="160.0" height="112.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="106.0" y="596.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="106.0" dy="0.0">де живе стан здогаду</tspan></text>
<line x1="186.0" y1="118.0" x2="1382.0" y2="118.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="26.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">час</text>
<circle cx="350.0" cy="118.0" r="7.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="350.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1975</text>
<rect x="210.0" y="172.0" width="280.0" height="74.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="350.0" y="205.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">breada</tspan><tspan x="350.0" dy="16.2">Unix, шоста редакція</tspan></text>
<rect x="210.0" y="272.0" width="280.0" height="116.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="350.0" y="318.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">наступний блок замовляють</tspan><tspan x="350.0" dy="15.6">асинхронно — виклик на нього</tspan><tspan x="350.0" dy="15.6">вже не чекає</tspan></text>
<rect x="210.0" y="404.0" width="280.0" height="116.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="350.0" y="450.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="350.0" dy="0.0">програма спинялася на кожному</tspan><tspan x="350.0" dy="15.6">блоці: чекання ніяк</tspan><tspan x="350.0" dy="15.6">не перекривалося обробкою</tspan></text>
<rect x="210.0" y="536.0" width="280.0" height="112.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="350.0" y="588.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">ніде: наступний блок</tspan><tspan x="350.0" dy="15.6">називає сам виклик</tspan></text>
<circle cx="642.0" cy="118.0" r="7.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.4"/>
<text x="642.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">1991</text>
<rect x="502.0" y="172.0" width="280.0" height="74.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="642.0" y="205.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="642.0" dy="0.0">кластерне читання</tspan><tspan x="642.0" dy="16.2">SunOS, файлова система BSD</tspan></text>
<rect x="502.0" y="272.0" width="280.0" height="116.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="642.0" y="318.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="642.0" dy="0.0">суміжні блоки збирають</tspan><tspan x="642.0" dy="15.6">в одне велике звертання</tspan><tspan x="642.0" dy="15.6">до пристрою</tspan></text>
<rect x="502.0" y="404.0" width="280.0" height="116.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="642.0" y="450.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="642.0" dy="0.0">сталу ціну звертання: вісім</tspan><tspan x="642.0" dy="15.6">запитів по 8 КБ коштували</tspan><tspan x="642.0" dy="15.6">восьмеро проти одного</tspan></text>
<rect x="502.0" y="536.0" width="280.0" height="112.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="642.0" y="580.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="642.0" dy="0.0">у розкладці файлу:</tspan><tspan x="642.0" dy="15.6">наскільки суцільно</tspan><tspan x="642.0" dy="15.6">лежать його блоки</tspan></text>
<circle cx="934.0" cy="118.0" r="7.0" fill="#ffffff" stroke="#b7791f" stroke-width="2.4"/>
<text x="934.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b7791f" text-anchor="middle" font-weight="700">2001–2006</text>
<rect x="794.0" y="172.0" width="280.0" height="74.0" rx="6" fill="#fdf3e7" stroke="#b7791f" stroke-width="1.6"/><text x="934.0" y="205.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="934.0" dy="0.0">поточне вікно й вікно-наперед</tspan><tspan x="934.0" dy="16.2">Linux 2.4–2.6</tspan></text>
<rect x="794.0" y="272.0" width="280.0" height="116.0" rx="6" fill="#ffffff" stroke="#b7791f" stroke-width="1.4"/><text x="934.0" y="318.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="934.0" dy="0.0">глибина здогаду росте сама,</tspan><tspan x="934.0" dy="15.6">а наступне замовлення йде</tspan><tspan x="934.0" dy="15.6">ще до кінця поточного вікна</tspan></text>
<rect x="794.0" y="404.0" width="280.0" height="116.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="934.0" y="450.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="934.0" dy="0.0">стелю в один крок наперед —</tspan><tspan x="934.0" dy="15.6">але обріс окремою латкою</tspan><tspan x="934.0" dy="15.6">на кожен незручний випадок</tspan></text>
<rect x="794.0" y="536.0" width="280.0" height="112.0" rx="6" fill="#fdf3e7" stroke="#b7791f" stroke-width="1.4"/><text x="934.0" y="580.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="934.0" dy="0.0">в окремій обліковій структурі:</tspan><tspan x="934.0" dy="15.6">ядро мусить бачити</tspan><tspan x="934.0" dy="15.6">кожнісіньке звертання</tspan></text>
<circle cx="1226.0" cy="118.0" r="7.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<text x="1226.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2007</text>
<rect x="1086.0" y="172.0" width="280.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="1226.0" y="205.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1226.0" dy="0.0">позначка PG_readahead</tspan><tspan x="1226.0" dy="16.2">Linux 2.6.23</tspan></text>
<rect x="1086.0" y="272.0" width="280.0" height="116.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="1226.0" y="318.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1226.0" dy="0.0">прапорець на одній сторінці</tspan><tspan x="1226.0" dy="15.6">замість другого вікна: дотик</tspan><tspan x="1226.0" dy="15.6">до неї й запускає наступне</tspan></text>
<rect x="1086.0" y="404.0" width="280.0" height="116.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1226.0" y="450.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1226.0" dy="0.0">потребу стежити за всім —</tspan><tspan x="1226.0" dy="15.6">латки на промахи, повтори</tspan><tspan x="1226.0" dy="15.6">й нестачу пам'яті зникли</tspan></text>
<rect x="1086.0" y="536.0" width="280.0" height="112.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="1226.0" y="588.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1226.0" dy="0.0">у самих даних, поряд</tspan><tspan x="1226.0" dy="15.6">зі сторінкою, якої стосується</tspan></text>
<text x="26.0" y="668.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">ідея за всі півстоліття не змінилася — переїжджав лише стан здогаду: від того, хто кличе, до розкладки на носії, звідти в облік ядра — і врешті в самі дані</text>
</svg>