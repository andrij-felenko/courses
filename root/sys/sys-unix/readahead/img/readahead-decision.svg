<line x1="980.0" y1="258.0" x2="980.0" y2="316.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="810.0" y="320.0" width="340.0" height="104.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="980.0" y="360.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">випадкове: вікна не відкривати,</tspan><tspan x="980.0" dy="16.2">прочитати рівно стільки,</tspan><tspan x="980.0" dy="16.2">скільки попросили</tspan></text>
<line x1="590.0" y1="100.0" x2="980.0" y2="166.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="590.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">стан здогаду живе в описі відкритого файлу: start, size, async_size, prev_pos</text>
</svg>