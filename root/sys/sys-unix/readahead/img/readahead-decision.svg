<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="310.0" y="40.0" width="560.0" height="58.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/><text x="590.0" y="73.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">чергове звертання: опис відкритого файлу, зсув, скільки байтів</tspan></text>
<rect x="30.0" y="170.0" width="340.0" height="84.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="200.0" y="208.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">зсув продовжує попереднє читання</tspan><tspan x="200.0" dy="16.2">або це початок файлу</tspan></text>
<line x1="200.0" y1="258.0" x2="200.0" y2="316.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="320.0" width="340.0" height="104.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="200.0" y="360.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">послідовне: відкрити вікно й нарощувати</tspan><tspan x="200.0" dy="16.2">його вчетверо, далі вдвічі —</tspan><tspan x="200.0" dy="16.2">до стелі read_ahead_kb</tspan></text>
