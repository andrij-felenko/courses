<line x1="590.0" y1="258.0" x2="590.0" y2="316.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="420.0" y="320.0" width="340.0" height="104.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="590.0" y="360.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">чекати нічого: зняти позначку</tspan><tspan x="590.0" dy="16.2">й замовити наступне вікно,</tspan><tspan x="590.0" dy="16.2">не зупиняючи читача</tspan></text>
<line x1="590.0" y1="100.0" x2="590.0" y2="166.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
