<rect x="400.3" y="503.1" width="679.5" height="49.9" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="740.0" y="524.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Усі записи одного списку однакового розміру — тому їх кількість не обходять, а рахують:</tspan><tspan x="740.0" dy="16.9">(SignatureListSize − 28 − SignatureHeaderSize) ÷ SignatureSize,   де 28 = 16 + 4 + 4 + 4.</tspan></text>
