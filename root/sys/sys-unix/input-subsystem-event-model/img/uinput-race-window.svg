<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1170 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1170" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="40.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Що встигає статися між народженням пристрою і першим читачем</text>
<rect x="120.0" y="64.0" width="880.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="560.0" y="90.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">усе, що програма пише в цьому вікні, зникає безслідно:</tspan><tspan x="560.0" dy="18.2">черг читачів ще не існує, а ядро нічого не притримує</tspan></text>
<line x1="60.0" y1="206.0" x2="1100.0" y2="206.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="120.0" y1="193.0" x2="120.0" y2="219.0" stroke="#333333" stroke-width="1.5"/>
<rect x="15.0" y="230.0" width="210.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">UI_DEV_CREATE</tspan><tspan x="120.0" dy="15.6">повернувся</tspan></text>
<line x1="340.0" y1="193.0" x2="340.0" y2="219.0" stroke="#333333" stroke-width="1.5"/>
<rect x="235.0" y="230.0" width="210.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="268.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">devtmpfs створив</tspan><tspan x="340.0" dy="15.6">/dev/input/eventN,</tspan><tspan x="340.0" dy="15.6">власник — root</tspan></text>
<line x1="565.0" y1="193.0" x2="565.0" y2="219.0" stroke="#333333" stroke-width="1.5"/>
<rect x="460.0" y="230.0" width="210.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="565.0" y="268.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">udev наклав правила:</tspan><tspan x="565.0" dy="15.6">група, список доступу,</tspan><tspan x="565.0" dy="15.6">ID_INPUT_KEYBOARD</tspan></text>
<line x1="790.0" y1="193.0" x2="790.0" y2="219.0" stroke="#333333" stroke-width="1.5"/>
<rect x="685.0" y="230.0" width="210.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="268.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">композитор побачив</tspan><tspan x="790.0" dy="15.6">пристрій у розсилці</tspan><tspan x="790.0" dy="15.6">від udev</tspan></text>
<line x1="1000.0" y1="193.0" x2="1000.0" y2="219.0" stroke="#333333" stroke-width="1.5"/>
<rect x="895.0" y="230.0" width="210.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="268.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">open(), запит</tspan><tspan x="1000.0" dy="15.6">можливостей —</tspan><tspan x="1000.0" dy="15.6">аж тепер читає</tspan></text>
<rect x="60.0" y="366.0" width="1040.0" height="62.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="392.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">надійний порядок: створити пристрій → дочекатися вузла → витримати паузу</tspan><tspan x="580.0" dy="18.2">і лише тоді забирати справжню клавіатуру собі</tspan></text>
</svg>