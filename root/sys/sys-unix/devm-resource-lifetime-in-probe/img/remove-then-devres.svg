<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1170 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1170" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">На відв'язці remove() виконується повністю до першого звільнення devres</text>
<line x1="120.0" y1="300.0" x2="1050.0" y2="300.0" stroke="#6b7280" stroke-width="1.6"/>
<text x="132.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">початок відв'язки</text>
<text x="1050.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">пристрій вільний</text>
<rect x="150.0" y="150.0" width="380.0" height="110.0" rx="6" fill="#fdeeec" stroke="#6b7280" stroke-width="1.2"/>
<text x="340.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">тіло remove() драйвера</text>
<text x="340.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">kfree(a-&gt;ring)</text>
<text x="340.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">зупинка робочої черги</text>
<rect x="620.0" y="150.0" width="400.0" height="110.0" rx="6" fill="#eef4fb" stroke="#6b7280" stroke-width="1.2"/>
<text x="820.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">devres_release_all()</text>
<text x="820.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">free_irq()  →  iounmap()</text>
<text x="820.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">зворотний порядок захоплення</text>
<line x1="536.0" y1="205.0" x2="612.0" y2="205.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="150.0" y="390.0" width="470.0" height="96.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="385.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">кероване переривання ще зареєстроване</text>
<text x="385.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">обробник може вистрелити в цю мить</text>
<line x1="150.0" y1="300.0" x2="150.0" y2="384.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="620.0" y1="300.0" x2="620.0" y2="384.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 5"/>
<text x="580.0" y="552.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">усе, чого торкається обробник, має звільнятися тим самим механізмом, що й саме переривання</text>
</svg>