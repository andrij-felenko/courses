<rect x="720.0" y="200.0" width="250.0" height="66.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="845.0" y="229.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">код задачі читає</tspan><tspan x="845.0" dy="16.2">counter = 41</tspan></text>
<rect x="1010.0" y="292.0" width="250.0" height="66.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="1135.0" y="321.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1135.0" dy="0.0">обробник переривання:</tspan><tspan x="1135.0" dy="16.2">counter = 42</tspan></text>
<rect x="720.0" y="384.0" width="250.0" height="66.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="845.0" y="413.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">код задачі записує 42,</tspan><tspan x="845.0" dy="16.2">обчислене з 41</tspan></text>
<line x1="845.0" y1="270.0" x2="1120.0" y2="286.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="1120.0" y1="360.0" x2="850.0" y2="378.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="720.0" y="470.0" width="540.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="990.0" y="498.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">приріст обробника зник — жодного іншого процесора тут немає</tspan></text>
<rect x="50.0" y="578.0" width="600.0" height="82.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="350.0" y="615.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">закриває заборона витіснення:</tspan><tspan x="350.0" dy="16.9">preempt_disable(), get_cpu_ptr(), local_lock()</tspan></text>
<rect x="690.0" y="578.0" width="600.0" height="82.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="990.0" y="615.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">закриває заборона переривань або неподільність:</tspan><tspan x="990.0" dy="16.9">local_irq_save(), this_cpu_inc() однією інструкцією</tspan></text>
</svg>