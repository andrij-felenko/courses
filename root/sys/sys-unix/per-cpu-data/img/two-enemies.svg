<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1350 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1350" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="670.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кого лишилося боятися у власній копії</text>
<rect x="50.0" y="66.0" width="600.0" height="470.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="350.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Ворог перший: міграція</text>
<rect x="80.0" y="120.0" width="250.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="205.0" y="151.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">ядро процесора 3</tspan></text>
<rect x="370.0" y="120.0" width="250.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="495.0" y="151.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="495.0" dy="0.0">ядро процесора 7</tspan></text>
<rect x="80.0" y="200.0" width="250.0" height="66.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="205.0" y="229.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">p = this_cpu_ptr(&amp;depot)</tspan><tspan x="205.0" dy="16.2">вказівник веде в копію 3</tspan></text>
<rect x="370.0" y="292.0" width="250.0" height="66.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="495.0" y="321.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">задачу перенесено сюди</tspan><tspan x="495.0" dy="16.2">планувальником</tspan></text>
<rect x="370.0" y="384.0" width="250.0" height="66.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="495.0" y="413.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">p-&gt;count++</tspan><tspan x="495.0" dy="16.2">запис іде в копію 3</tspan></text>
<line x1="205.0" y1="270.0" x2="480.0" y2="286.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="495.0" y1="360.0" x2="495.0" y2="378.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="80.0" y="470.0" width="540.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="350.0" y="498.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">запис коректний — копія чужа: одне ядро недорахує, друге перерахує</tspan></text>
<rect x="690.0" y="66.0" width="600.0" height="470.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="990.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Ворог другий: переривання</text>
