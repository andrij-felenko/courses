<rect x="84.0" y="350.0" width="472.0" height="38.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="320.0" y="373.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">переривання дозволені</tspan></text>
<rect x="84.0" y="396.0" width="472.0" height="38.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="320.0" y="419.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">ділянка неперервна на цьому ядрі</tspan></text>
<rect x="84.0" y="442.0" width="472.0" height="38.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="320.0" y="465.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">коштує нуль додаткових інструкцій</tspan></text>
<rect x="680.0" y="186.0" width="520.0" height="300.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="940.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">ядро з PREEMPT_RT</text>
<rect x="704.0" y="258.0" width="472.0" height="38.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="940.0" y="281.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">розгортається в спін-замок per-CPU</tspan></text>
