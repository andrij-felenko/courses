<text x="630.0" y="546.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">два сенси, склеєні в local_irq_save, розходяться</text>
<rect x="120.0" y="574.0" width="460.0" height="56.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.0"/><text x="350.0" y="598.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">«лишити мене на цьому ядрі»</tspan><tspan x="350.0" dy="16.9">→ прибиття задачі</tspan></text>
<rect x="680.0" y="574.0" width="460.0" height="56.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.0"/><text x="910.0" y="598.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">«не пускати сюди інших»</tspan><tspan x="910.0" dy="16.9">→ власне замок</tspan></text>
<text x="630.0" y="672.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">розділити їх стало можливо лише тому, що код тепер називає свій захист</text>
