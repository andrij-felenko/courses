<rect x="704.0" y="350.0" width="472.0" height="38.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="940.0" y="373.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">переривання не вимикаються</tspan></text>
