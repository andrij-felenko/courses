<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура трирівневої віртуалізації (L0, L1, L2)</text>
<rect x="50.0" y="50.0" width="720.0" height="75.0" rx="6" fill="#e8f4f8" stroke="#2980b9" stroke-width="1.5"/><text x="410.0" y="83.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">L2: Вкладена віртуальна машина (Nested Guest)</tspan><tspan x="410.0" dy="18.2">Виконується у VMX Non-Root режимі (апаратний стан VMCS02)</tspan></text>
<line x1="410.0" y1="125.0" x2="410.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="420.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Переривання / Trap в L1 або L0</text>
<rect x="50.0" y="160.0" width="720.0" height="105.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="410.0" y="199.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">L1: Гостьовий гіпервізор (Guest Hypervisor — KVM / Xen / Hyper-V)</tspan><tspan x="410.0" dy="18.2">Думає, що керує VMX/SVM у VMX Root. Насправді працює у VMX Non-Root L0</tspan><tspan x="410.0" dy="18.2">Утримує VMCS12 для L2 та керує власною таблицею EPT12</tspan></text>
<line x1="410.0" y1="265.0" x2="410.0" y2="300.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="420.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">VM Exit у L0 (апаратний вихід)</text>
<rect x="50.0" y="300.0" width="720.0" height="105.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="339.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">L0: Фізичний хостовий гіпервізор (Host KVM) + CPU (VT-x / AMD-V)</tspan><tspan x="410.0" dy="18.2">Працює у VMX Root. Фізично завантажує VMCS02 (злиття VMCS01 + VMCS12)</tspan><tspan x="410.0" dy="18.2">Будує Тіньовий EPT02 (EPT01 + EPT12) та обробляє фізичні переривання</tspan></text>
</svg>