<line x1="990.6" y1="330.0" x2="1094.1" y2="330.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="336.6" y="472.6" width="746.8" height="74.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="710.0" y="497.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Для асиметричних ключів (RSA, ECDSA): Pairwise Consistency Test (PCT)</tspan><tspan x="710.0" dy="16.9">Генерація пари ключів -&gt; Підпис випадкового гешу приватним ключем -&gt; Верифікація відкритим ключем</tspan><tspan x="710.0" dy="16.9">У разі розбіжності пара ключів негайно знищується і не повертається застосунку</tspan></text>
<text x="710.0" y="630.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Тестові вектори жорстко скомпільовані в образ ядра (testmgr.h) і не можуть бути модифіковані в рантаймі.</text>
