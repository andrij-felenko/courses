<rect x="414.4" y="203.6" width="211.2" height="72.8" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="227.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">testmgr.c: пошук векторів</tspan><tspan x="520.0" dy="16.9">Таблиці crypto/testmgr.h</tspan><tspan x="520.0" dy="16.9">Еталони: Key, PT, CT, IV</tspan></text>
<line x1="277.2" y1="240.0" x2="408.4" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="729.4" y="144.6" width="261.1" height="70.8" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="167.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Пряме перетворення</tspan><tspan x="860.0" dy="16.9">CT_actual = Encrypt(Key, PT)</tspan><tspan x="860.0" dy="16.9">Звірка: CT_actual == CT_expected</tspan></text>
<rect x="729.4" y="294.6" width="261.1" height="70.8" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="317.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Зворотне перетворення</tspan><tspan x="860.0" dy="16.9">PT_actual = Decrypt(Key, CT)</tspan><tspan x="860.0" dy="16.9">Звірка: PT_actual == PT_expected</tspan></text>
<line x1="625.6" y1="240.0" x2="723.4" y2="180.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
