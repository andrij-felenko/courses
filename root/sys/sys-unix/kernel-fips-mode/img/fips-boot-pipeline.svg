<line x1="840.0" y1="226.4" x2="840.0" y2="288.6" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1053.0" y="214.2" width="294.0" height="91.7" rx="6" fill="#eaf6ef" stroke="#c0392b" stroke-width="1.5"/><text x="1200.0" y="239.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1200.0" dy="0.0">/proc/sys/crypto/fips_enabled = 1</tspan><tspan x="1200.0" dy="16.9">Заборонено: MD5, DES, RC4</tspan><tspan x="1200.0" dy="16.9">Дозволено: FIPS-approved</tspan><tspan x="1200.0" dy="16.9">Система готова до роботи</tspan></text>
<line x1="937.2" y1="330.0" x2="1047.0" y2="280.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="941.9" y1="190.0" x2="1047.0" y2="240.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1095.0" y="416.4" width="210.0" height="67.2" rx="6" fill="#fde8e8" stroke="#2457d6" stroke-width="1.5"/><text x="1200.0" y="438.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1200.0" dy="0.0">Помилка KAT або DRBG</tspan><tspan x="1200.0" dy="15.6">fips_fail() -&gt; panic()</tspan><tspan x="1200.0" dy="15.6">Ядро аварійно зупиняється</tspan></text>
<line x1="840.0" y1="365.4" x2="1089.0" y2="450.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="710.0" y="595.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">У режимі FIPS будь-який збій цілісності бінарного образу або помилка Known Answer Test є фатальною.</text>
<text x="710.0" y="625.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ядро гарантує, що жодна криптографічна операція не виконається в невалідному або скомпрометованому стані.</text>
