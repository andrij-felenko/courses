<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1430 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1430" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="710.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність завантаження ядра та активація режиму FIPS</text>
<text x="180.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Параметри GRUB</text>
<text x="500.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Ранній простір (initramfs)</text>
<text x="840.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Ініціалізація ядра</text>
<text x="1200.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Підсумковий стан</text>
<rect x="83.4" y="163.1" width="193.3" height="53.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">cmdline: «fips=1»</tspan><tspan x="180.0" dy="16.9">boot_fips_enabled = 1</tspan></text>
<rect x="401.8" y="153.6" width="196.4" height="72.8" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="177.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Перевірка цілісності</tspan><tspan x="500.0" dy="16.9">vmlinuz + .vmlinuz.hmac</tspan><tspan x="500.0" dy="16.9">dracut-fips / fipscheck</tspan></text>
<line x1="276.6" y1="190.0" x2="395.8" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
