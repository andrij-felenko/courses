<line x1="500.0" y1="226.4" x2="500.0" y2="300.2" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="408.2" y="426.2" width="183.7" height="47.6" rx="6" fill="#fde8e8" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="446.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Зупинка завантаження</tspan><tspan x="500.0" dy="15.6">Emergency Shell / Stop</tspan></text>
<line x1="500.0" y1="353.8" x2="500.0" y2="420.2" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="738.1" y="153.6" width="203.8" height="72.8" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="840.0" y="177.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">Самоперевірки алгоритмів</tspan><tspan x="840.0" dy="16.9">KAT у crypto/testmgr.c</tspan><tspan x="840.0" dy="16.9">AES, SHA, HMAC, RSA, ECC</tspan></text>
<line x1="598.2" y1="190.0" x2="732.1" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
