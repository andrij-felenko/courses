<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#34495e" text-anchor="middle" font-weight="700">Шлях проходження запиту (I/O Path): dm-multipath проти Native NVMe Multipath</text>
<rect x="30.0" y="55.0" width="420.0" height="415.0" rx="6" fill="#fdfefe" stroke="#bdc3c7" stroke-width="1.5"/>
<text x="240.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Традиційний dm-multipath (SCSI / Старий NVMe)</text>
<rect x="50.0" y="100.0" width="380.0" height="45.0" rx="4" fill="#eaeded" stroke="#95a5a6" stroke-width="1.0"/>
<text x="240.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Користувач: /dev/dm-0 (Device Mapper)</text>
<line x1="240.0" y1="145.0" x2="240.0" y2="170.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="170.0" width="380.0" height="70.0" rx="4" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/>
<text x="240.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">dm-multipath core (Окремий шар)</text>
<text x="240.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1. Блокування dm_table spinlock (контенція CPU)</text>
<text x="240.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">2. Клонування bio / виділення struct request clone</text>
<line x1="240.0" y1="240.0" x2="240.0" y2="265.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="265.0" width="380.0" height="60.0" rx="4" fill="#eaeded" stroke="#95a5a6" stroke-width="1.0"/>
<text x="240.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нижні блокові пристрої: /dev/nvme0n1, /dev/nvme1n1</text>
<text x="240.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Повторне планування в черзі драйвера</text>
<line x1="240.0" y1="325.0" x2="240.0" y2="350.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="350.0" width="380.0" height="105.0" rx="4" fill="#fbfcfc" stroke="#bdc3c7" stroke-width="1.0"/>
<text x="240.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Опитування: multipathd (демон простору користувача)</text>
<text x="240.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Періодичний check_path (інтервал 1-5 секунд)</text>
<text x="240.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">• Затримка перемикання при аварії: 1-10 с</text>
<text x="240.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">• Додаткова затримка I/O: +8-20 мкс (оверхед)</text>
<rect x="490.0" y="55.0" width="420.0" height="415.0" rx="6" fill="#fdfefe" stroke="#bdc3c7" stroke-width="1.5"/>
<text x="700.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Native NVMe Multipath (Ядро Linux)</text>
<rect x="510.0" y="100.0" width="380.0" height="45.0" rx="4" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.0"/>
<text x="700.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2980b9" text-anchor="middle" font-weight="700">Користувач: /dev/nvme0n1 (struct nvme_ns_head)</text>
<line x1="700.0" y1="145.0" x2="700.0" y2="170.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="510.0" y="170.0" width="380.0" height="70.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="700.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">nvme_ns_head_submit_bio() (Швидкий шлях)</text>
<text x="700.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">1. Без блокувань: lockless RCU (nvme_find_path)</text>
<text x="700.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">2. Без клонування: пряма підміна bio-&gt;bi_bdev</text>
<line x1="700.0" y1="240.0" x2="700.0" y2="265.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="510.0" y="265.0" width="380.0" height="60.0" rx="4" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.0"/>
<text x="700.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2980b9" text-anchor="middle" font-weight="700">Апаратна черга blk-mq вибраного nvme_ns</text>
<text x="700.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Пряма передача в PCIe/RDMA/TCP Submission Queue</text>
<line x1="700.0" y1="325.0" x2="700.0" y2="350.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="510.0" y="350.0" width="380.0" height="105.0" rx="4" fill="#fbfcfc" stroke="#bdc3c7" stroke-width="1.0"/>
<text x="700.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Подієвий механізм: асинхронні події AER</text>
<text x="700.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Миттєве апаратне переривання від цілі (Notice)</text>
<text x="700.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">• Затримка перемикання при аварії: &lt; 500 мкс</text>
<text x="700.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">• Додаткова затримка I/O: &lt; 0.2 мкс (нуль копіювань)</text>
</svg>