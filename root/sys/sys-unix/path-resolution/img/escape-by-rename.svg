<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 716" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="716" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перевірка меж своїми руками: де відкривається щілина</text>
<rect x="60.0" y="56.0" width="500.0" height="44.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="310.0" y="83.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">наша програма: рахує глибину сама</tspan></text>
<rect x="620.0" y="56.0" width="460.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="850.0" y="83.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">нападник: пише у свою теку пісочниці</tspan></text>
<text x="30.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">час</text>
<line x1="30.0" y1="116.0" x2="30.0" y2="566.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="116.0" width="500.0" height="76.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="310.0" y="149.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">openat: spool → a → b → c → d</tspan><tspan x="310.0" dy="18.2">у руках дескриптор «d», лічильник = 5</tspan></text>
<line x1="310.0" y1="194.0" x2="310.0" y2="304.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="620.0" y="212.0" width="460.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="850.0" y="245.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">rename(«spool/a/b/c/d» → «spool/d»)</tspan><tspan x="850.0" dy="18.2">обидві теки його — право на це є</tspan></text>
<line x1="614.0" y1="250.0" x2="322.0" y2="250.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="308.0" width="500.0" height="76.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="310.0" y="341.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">«..» п'ять разів: 5 → 4 → 3 → 2 → 1 → 0</tspan><tspan x="310.0" dy="18.2">жоден крок не викликав заперечень</tspan></text>
<rect x="60.0" y="404.0" width="1020.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="570.0" y="437.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">а «d» лежить уже на глибині 2, тож «..» веде так:</tspan><tspan x="570.0" dy="18.2">/srv/box/spool → /srv/box → /srv → / → /      (корінь пісочниці позаду вже з третього кроку)</tspan></text>
<rect x="60.0" y="500.0" width="1020.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="570.0" y="536.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">далі «etc/passwd» відкривається від справжнього кореня</tspan></text>
<rect x="60.0" y="596.0" width="1020.0" height="86.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="570.0" y="634.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">дескриптор пришпилений до inode, а не до місця в дереві;</tspan><tspan x="570.0" dy="18.2">лічильник описує дерево, яким воно було на попередньому кроці</tspan></text>
</svg>