<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розбір шляху — цикл із одного питання</text>
<rect x="40.0" y="60.0" width="330.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="205.0" y="93.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">шлях починається з «/»</tspan><tspan x="205.0" dy="18.2">відлік — корінь процесу</tspan></text>
<rect x="395.0" y="60.0" width="330.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="560.0" y="93.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">шлях без «/» спереду</tspan><tspan x="560.0" dy="18.2">відлік — поточний каталог</tspan></text>
<rect x="750.0" y="60.0" width="330.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="915.0" y="93.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="915.0" dy="0.0">виклик із дескриптором</tspan><tspan x="915.0" dy="18.2">відлік — той каталог</tspan></text>
<rect x="330.0" y="190.0" width="460.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="229.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">поточний каталог обходу</tspan></text>
<rect x="330.0" y="290.0" width="460.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="326.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">відрізати складник до найближчої «/»</tspan></text>
<rect x="330.0" y="384.0" width="460.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="420.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">право на пошук (x) у цьому каталозі?</tspan></text>
<rect x="330.0" y="478.0" width="460.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="514.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">знайти складник у таблиці імен</tspan></text>
<rect x="330.0" y="572.0" width="460.0" height="76.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="560.0" y="614.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">куди веде знайдене?</tspan></text>
<line x1="205.0" y1="140.0" x2="430.0" y2="186.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="560.0" y1="140.0" x2="560.0" y2="186.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="915.0" y1="140.0" x2="690.0" y2="186.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="560.0" y1="260.0" x2="560.0" y2="286.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="560.0" y1="354.0" x2="560.0" y2="380.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="560.0" y1="448.0" x2="560.0" y2="474.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="560.0" y1="542.0" x2="560.0" y2="568.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="330.0" y1="610.0" x2="280.0" y2="610.0" stroke="#333333" stroke-width="1.5"/>
<line x1="280.0" y1="610.0" x2="280.0" y2="225.0" stroke="#333333" stroke-width="1.5"/>
<line x1="280.0" y1="225.0" x2="326.0" y2="225.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="160.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">наступний складник</text>
<rect x="820.0" y="372.0" width="270.0" height="128.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="955.0" y="406.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="955.0" dy="0.0">зупинка з помилкою:</tspan><tspan x="955.0" dy="16.9">ENOENT — імені немає</tspan><tspan x="955.0" dy="16.9">ENOTDIR — це не каталог</tspan><tspan x="955.0" dy="16.9">EACCES — немає права x</tspan><tspan x="955.0" dy="16.9">ELOOP — забагато переходів</tspan></text>
<rect x="820.0" y="546.0" width="270.0" height="104.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="955.0" y="585.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="955.0" dy="0.0">складників більше немає:</tspan><tspan x="955.0" dy="16.9">знайдений об'єкт</tspan><tspan x="955.0" dy="16.9">віддано викликові</tspan></text>
<line x1="794.0" y1="416.0" x2="816.0" y2="404.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="794.0" y1="510.0" x2="816.0" y2="436.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="794.0" y1="600.0" x2="816.0" y2="468.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="794.0" y1="628.0" x2="816.0" y2="592.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="676.0" width="880.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="560.0" y="709.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">жоден крок не бачить шляху цілком: ядро щоразу питає одне —</tspan><tspan x="560.0" dy="18.2">«який номер відповідає цьому імені в цьому каталозі»</tspan></text>
</svg>