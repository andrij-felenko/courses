<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння: підстановка параметра в пам'яті проти запуску підпроцесу</text>
<rect x="30.0" y="55.0" width="365.0" height="350.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="212.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">Внутрішній механізм оболонки</text>
<text x="212.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle">${path##*/}  або  ${var//foo/bar}</text>
<rect x="50.0" y="120.0" width="325.0" height="60.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
<text x="212.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle" font-weight="700">Єдиний процес оболонки (PID: 1042)</text>
<text x="212.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle">Хеш-таблиця змінних у купі процесу</text>
