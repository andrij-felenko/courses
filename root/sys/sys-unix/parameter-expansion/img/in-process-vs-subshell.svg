<text x="607.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle" font-weight="700">Батьківський процес (PID: 1042)</text>
<text x="607.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle">1. fork() -&gt; 2. pipe() -&gt; 3. wait4()</text>
<text x="607.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle">Блокування очікуванням завершення I/O</text>
