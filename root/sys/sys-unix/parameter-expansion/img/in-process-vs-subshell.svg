<text x="607.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">execve(/usr/bin/basename) + ld.so + libc</text>
<text x="607.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle">Копіювання таблиць сторінок, скидання TLB</text>
