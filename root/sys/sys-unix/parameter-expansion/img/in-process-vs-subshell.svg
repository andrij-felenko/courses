<text x="607.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">Зовнішній конвеєр / утиліта</text>
<text x="607.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle">$(basename &quot;$path&quot;)  або  $(echo &quot;$var&quot; | sed ...)</text>
