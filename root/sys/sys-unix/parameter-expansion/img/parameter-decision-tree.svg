<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Логіка перевірки стану змінних у виразах дефолтів</text>
<rect x="280.0" y="50.0" width="260.0" height="45.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="410.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Чи існує змінна у таблиці символів?</text>
<line x1="340.0" y1="95.0" x2="170.0" y2="140.0" stroke="#64748b" stroke-width="1.5"/>
<text x="210.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">НІ (unset)</text>
<rect x="30.0" y="140.0" width="280.0" height="135.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.3"/>
<text x="170.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">Стан: Unset (не встановлено)</text>
<text x="170.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">${var-def} та ${var:-def} ──► def</text>
<text x="170.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">${var=def} та ${var:=def} ──► var=def; def</text>
<text x="170.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">${var?err} та ${var:?err} ──► помилка, вихід</text>
<text x="170.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">${var+alt} та ${var:+alt} ──► порожньо (&quot;&quot;)</text>
<text x="170.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle" font-style="italic">(Двокрапка &quot;:&quot; не змінює результат)</text>
<line x1="480.0" y1="95.0" x2="620.0" y2="140.0" stroke="#64748b" stroke-width="1.5"/>
<text x="580.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">ТАК (встановлено)</text>
<rect x="490.0" y="140.0" width="260.0" height="45.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="620.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Яке значення має змінна?</text>
<line x1="550.0" y1="185.0" x2="450.0" y2="225.0" stroke="#64748b" stroke-width="1.5"/>
<text x="460.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">Порожнє (&quot;&quot;)</text>
<rect x="340.0" y="225.0" width="230.0" height="230.0" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
<text x="455.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">Стан: Null (var=&quot;&quot;)</text>
<text x="455.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">Без двокрапки (дійсна змінна):</text>
<text x="455.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="middle">${var-def}  ──► &quot;&quot;</text>
<text x="455.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="middle">${var=def}  ──► &quot;&quot; (без змін)</text>
<text x="455.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="middle">${var?err}  ──► &quot;&quot; (немає помилки)</text>
<text x="455.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="middle">${var+alt}  ──► alt</text>
<text x="455.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">З двокрапкою (якщо порожнє):</text>
<text x="455.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="middle">${var:-def} ──► def</text>
<text x="455.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="middle">${var:=def} ──► var=def; def</text>
<text x="455.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="middle">${var:?err} ──► помилка, вихід</text>
<text x="455.0" y="441.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="middle">${var:+alt} ──► &quot;&quot;</text>
<line x1="690.0" y1="185.0" x2="700.0" y2="225.0" stroke="#64748b" stroke-width="1.5"/>
<text x="725.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">Непорожнє (&quot;abc&quot;)</text>
<rect x="590.0" y="225.0" width="210.0" height="230.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
<text x="695.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">Стан: Set &amp; Non-null</text>
<text x="695.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Значення визначене:</text>
<text x="695.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle">${var-def} та ${var:-def}</text>
<text x="695.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700"> ──► &quot;abc&quot;</text>
<text x="695.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle">${var=def} та ${var:=def}</text>
<text x="695.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle"> ──► &quot;abc&quot; (var не змінюється)</text>
<text x="695.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle">${var?err} та ${var:?err}</text>
<text x="695.0" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle"> ──► &quot;abc&quot;</text>
<text x="695.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">${var+alt} та ${var:+alt} ──► alt</text>
</svg>