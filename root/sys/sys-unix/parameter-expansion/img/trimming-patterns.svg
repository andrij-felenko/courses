<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оператори обрізання префіксів та суфіксів за glob-шаблонами</text>
<rect x="50.0" y="55.0" width="720.0" height="50.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="410.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">Вихідний рядок:  path=&quot;/var/log/nginx/access.log.tar.gz&quot;</text>
<text x="410.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Складові: [/var/log/nginx/] [access] [.log] [.tar] [.gz]</text>
<rect x="50.0" y="120.0" width="345.0" height="65.0" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
<text x="222.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0369a1" text-anchor="middle" font-weight="700">${path#*/}</text>
<text x="222.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#075985" text-anchor="middle">Видаляє найкоротший префікс, що збігається з */</text>
<text x="222.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0c4a6e" text-anchor="middle" font-weight="700">Результат: &quot;var/log/nginx/access.log.tar.gz&quot;</text>
<rect x="425.0" y="120.0" width="345.0" height="65.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
<text x="597.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0369a1" text-anchor="middle" font-weight="700">${path##*/}</text>
<text x="597.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#075985" text-anchor="middle">Видаляє найдовший префікс до останнього / (basename)</text>
<text x="597.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0c4a6e" text-anchor="middle" font-weight="700">Результат: &quot;access.log.tar.gz&quot;</text>
<rect x="50.0" y="200.0" width="345.0" height="65.0" rx="6" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.2"/>
<text x="222.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a21caf" text-anchor="middle" font-weight="700">${path%.*}</text>
<text x="222.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#86198f" text-anchor="middle">Видаляє найкоротший суфікс від останньої крапки</text>
<text x="222.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#701a75" text-anchor="middle" font-weight="700">Результат: &quot;/var/log/nginx/access.log.tar&quot;</text>
<rect x="425.0" y="200.0" width="345.0" height="65.0" rx="6" fill="#fae8ff" stroke="#c026d3" stroke-width="1.2"/>
<text x="597.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a21caf" text-anchor="middle" font-weight="700">${path%%.*}</text>
<text x="597.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#86198f" text-anchor="middle">Видаляє найдовший суфікс від першої крапки (stem)</text>
<text x="597.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#701a75" text-anchor="middle" font-weight="700">Результат: &quot;/var/log/nginx/access&quot;</text>
<rect x="50.0" y="280.0" width="345.0" height="65.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.2"/>
<text x="222.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a16207" text-anchor="middle" font-weight="700">${path%/*}</text>
<text x="222.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle">Видаляє найкоротший суфікс від останнього / (dirname)</text>
<text x="222.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#713f12" text-anchor="middle" font-weight="700">Результат: &quot;/var/log/nginx&quot;</text>
<rect x="425.0" y="280.0" width="345.0" height="65.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
<text x="597.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">${path//\//_}  та  ${path/#\/var/\/opt}</text>
<text x="597.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle">Заміна всіх збігів (//) або якоріння на початку (/#)</text>
<text x="597.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle" font-weight="700">Результат: &quot;_var_log...&quot; та &quot;/opt/log/...&quot;</text>
<rect x="50.0" y="360.0" width="720.0" height="55.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="410.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle" font-weight="700">Пам'ятка запам'ятовування: # на клавіатурі стоїть лівіше за % (Shift+3 лівіше Shift+5).</text>
<text x="410.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Тому # та ## обрізають зліва (префікс), а % та %% обрізають справа (суфікс). Одинарний — короткий, подвійний — довгий.</text>
</svg>