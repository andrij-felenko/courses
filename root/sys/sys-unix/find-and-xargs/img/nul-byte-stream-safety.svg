<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Безпека потоку даних: розділювач Newline vs Нульовий байт NUL</text>
<rect x="20.0" y="50.0" width="880.0" height="165.0" rx="8" fill="#fdf7f7" stroke="#c0392b" stroke-width="1.5"/>
<text x="40.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">1. Небезпечний конвеєр з розділювачем \n / пробіл (find | xargs)</text>
<rect x="40.0" y="90.0" width="260.0" height="55.0" rx="4" fill="#ffffff" stroke="#e74c3c" stroke-width="1.5"/>
<text x="170.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Імена файлів у файловій системі:</text>
<text x="170.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">&quot;my report 2026.pdf&quot;, &quot;-rf&quot;, &quot;doc's.txt&quot;</text>
<line x1="305.0" y1="117.0" x2="345.0" y2="117.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350.0" y="90.0" width="250.0" height="55.0" rx="4" fill="#ffffff" stroke="#e74c3c" stroke-width="1.5"/>
<text x="475.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Токенізація xargs (за замовчуванням):</text>
<text x="475.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Розбиття за пробілами, \t, \n та лапками</text>
<line x1="605.0" y1="117.0" x2="645.0" y2="117.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="650.0" y="90.0" width="230.0" height="55.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="765.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Помилки та вразливості:</text>
<text x="765.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Пошкодження імен / Ін'єкція прапорців</text>
<text x="40.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">• 'my report 2026.pdf' розбивається на 3 аргументи: 'my', 'report', '2026.pdf' (помилка No such file)</text>
<text x="40.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">• Непарна лапка в імені 'doc\'s.txt' викликає фатальну зупинку: xargs: unmatched single quote</text>
<text x="40.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">• Файл з ім'ям '-rf' сприймається утилітою як прапорець (option injection), а не шлях до файлу</text>
<rect x="20.0" y="230.0" width="880.0" height="175.0" rx="8" fill="#f4faf6" stroke="#27ae60" stroke-width="1.5"/>
<text x="40.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">2. Безпечний конвеєр з нульовим байтом (find -print0 | xargs -0)</text>
<rect x="40.0" y="270.0" width="260.0" height="55.0" rx="4" fill="#ffffff" stroke="#2ecc71" stroke-width="1.5"/>
<text x="170.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вивід find -print0:</text>
<text x="170.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">./my report 2026.pdf\0./-rf\0./doc's.txt\0</text>
<line x1="305.0" y1="297.0" x2="345.0" y2="297.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350.0" y="270.0" width="250.0" height="55.0" rx="4" fill="#ffffff" stroke="#2ecc71" stroke-width="1.5"/>
<text x="475.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Читання xargs -0 (--null):</text>
<text x="475.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Розділювач — виключно байт 0x00 (NUL)</text>
<line x1="605.0" y1="297.0" x2="645.0" y2="297.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="650.0" y="270.0" width="230.0" height="55.0" rx="4" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.2"/>
<text x="765.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Гарантований результат:</text>
<text x="765.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">100% збереження байтового образу</text>
<text x="40.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">• Байт 0x00 (NUL) та 0x2F (/) — єдині заборонені байти в іменах файлів за стандартом POSIX</text>
<text x="40.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">• Пробіли, табуляції, лапки та символи перенесення рядків передаються як атомарні частини одного шляху</text>
<text x="40.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">• Префікс './' або розділювач аргументів '--' повністю унеможливлює ін'єкцію прапорців</text>
</svg>