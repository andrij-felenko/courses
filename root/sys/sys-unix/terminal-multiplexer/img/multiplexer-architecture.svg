<text x="500.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle" font-weight="700">Клієнтське середовище (локальний емулятор або віддалений SSH-сеанс)</text>
<rect x="60.0" y="88.0" width="380.0" height="58.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="250.0" y="113.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Емулятор термінала користувача</tspan><tspan x="250.0" dy="15.6">/dev/pts/0 · сирий режим (raw mode: ~ICANON, ~ECHO)</tspan></text>
<rect x="560.0" y="88.0" width="380.0" height="58.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="750.0" y="113.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Клієнтський процес (tmux attach)</tspan><tspan x="750.0" dy="15.6">читає клавіші stdin · пише вивід у stdout</tspan></text>
