<rect x="60.0" y="245.0" width="260.0" height="90.0" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/><text x="190.0" y="278.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Цикл подій (libevent / poll)</tspan><tspan x="190.0" dy="15.6">Обробка клієнтських з'єднань,</tspan><tspan x="190.0" dy="15.6">таймерів і дескрипторів PTY</tspan></text>
