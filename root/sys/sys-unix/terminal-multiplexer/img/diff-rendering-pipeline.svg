<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр емуляції та диференційного перемальовування екрана</text>
<rect x="40.0" y="70.0" width="200.0" height="45.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="140.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">1. Потік процесу</tspan></text>
<rect x="40.0" y="130.0" width="200.0" height="240.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="199.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Дочірня програма</tspan><tspan x="140.0" dy="15.6">(vim / top / bash)</tspan><tspan x="140.0" dy="15.6"></tspan><tspan x="140.0" dy="15.6">пише у slave PTY:</tspan><tspan x="140.0" dy="15.6"></tspan><tspan x="140.0" dy="15.6">текст UTF-8 та</tspan><tspan x="140.0" dy="15.6">керуючі коди ANSI</tspan><tspan x="140.0" dy="15.6">(\033[31m, \033[2J)</tspan></text>
<line x1="240.0" y1="250.0" x2="285.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="285.0" y="70.0" width="200.0" height="45.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="385.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="385.0" dy="0.0">2. Парсер емулятора</tspan></text>
<rect x="285.0" y="130.0" width="200.0" height="240.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="385.0" y="191.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">Машина станів tmux</tspan><tspan x="385.0" dy="15.6"></tspan><tspan x="385.0" dy="15.6">розбирає ESC-коди:</tspan><tspan x="385.0" dy="15.6">• координати курсора</tspan><tspan x="385.0" dy="15.6">• кольори (24-bit RGB)</tspan><tspan x="385.0" dy="15.6">• атрибути стилю</tspan><tspan x="385.0" dy="15.6"></tspan><tspan x="385.0" dy="15.6">Оновлює матрицю</tspan><tspan x="385.0" dy="15.6">комірок (grid_cell)</tspan></text>
<line x1="485.0" y1="250.0" x2="530.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="530.0" y="70.0" width="200.0" height="45.0" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/><text x="630.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">3. Механізм Diff</tspan></text>
<rect x="530.0" y="130.0" width="200.0" height="240.0" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/><text x="630.0" y="191.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Порядкове порівняння</tspan><tspan x="630.0" dy="15.6"></tspan><tspan x="630.0" dy="15.6">Поточна матриця вікна</tspan><tspan x="630.0" dy="15.6">проти</tspan><tspan x="630.0" dy="15.6">Попереднього стану</tspan><tspan x="630.0" dy="15.6">екрана клієнта</tspan><tspan x="630.0" dy="15.6"></tspan><tspan x="630.0" dy="15.6">Виявлення мінімальних</tspan><tspan x="630.0" dy="15.6">змінених фрагментів</tspan></text>
<line x1="730.0" y1="250.0" x2="775.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="775.0" y="70.0" width="200.0" height="45.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="875.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="875.0" dy="0.0">4. Вивід клієнту</tspan></text>
<rect x="775.0" y="130.0" width="200.0" height="240.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="875.0" y="199.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">Мінімізований потік</tspan><tspan x="875.0" dy="15.6"></tspan><tspan x="875.0" dy="15.6">Сервер генерує:</tspan><tspan x="875.0" dy="15.6">\033[row;colH + оновлення</tspan><tspan x="875.0" dy="15.6"></tspan><tspan x="875.0" dy="15.6">Клієнт малює лише</tspan><tspan x="875.0" dy="15.6">змінені ділянки</tspan><tspan x="875.0" dy="15.6">(економія трафіку)</tspan></text>
<rect x="40.0" y="395.0" width="920.0" height="55.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Оптимізація: замість пересилки 80×24 = 1920 комірок при кожному оновленні, сервер надсилає лічені байти змінених координат і символів</tspan></text>
</svg>