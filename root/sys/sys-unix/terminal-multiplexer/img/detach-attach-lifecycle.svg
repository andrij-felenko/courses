<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Збереження стану сеансу при розриві мережі та перепідключенні</text>
<rect x="40.0" y="50.0" width="280.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">1. Звичайний робочий сеанс</tspan></text>
<rect x="360.0" y="50.0" width="280.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">2. Розрив мережі (Detach)</tspan></text>
<rect x="680.0" y="50.0" width="280.0" height="42.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">3. Перепідключення (Attach)</tspan></text>
<rect x="40.0" y="105.0" width="280.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Клієнт SSH (pts/0)</tspan><tspan x="180.0" dy="14.3">Передає натискання клавіш</tspan><tspan x="180.0" dy="14.3">через UNIX-сокет до tmux-server</tspan></text>
<line x1="180.0" y1="175.0" x2="180.0" y2="205.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="205.0" width="280.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">tmux-server (без TTY)</tspan><tspan x="180.0" dy="14.3">Отримує байти, направляє у master PTY,</tspan><tspan x="180.0" dy="14.3">перемальовує віртуальну сітку</tspan></text>
<line x1="180.0" y1="285.0" x2="180.0" y2="315.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="315.0" width="280.0" height="80.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Дочірній процес (на pts/1)</tspan><tspan x="180.0" dy="14.3">Отримує ввід, виконує задачу,</tspan><tspan x="180.0" dy="14.3">пише результат у slave PTY</tspan></text>
<rect x="40.0" y="415.0" width="280.0" height="75.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="442.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Стан: з'єднання активне</tspan><tspan x="180.0" dy="14.3">Користувач бачить живий екран,</tspan><tspan x="180.0" dy="14.3">всі потоки синхронізовані</tspan></text>
<rect x="360.0" y="105.0" width="280.0" height="70.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">SSH клієнт відпав ✖</tspan><tspan x="500.0" dy="14.3">Мережеве з'єднання скинуто,</tspan><tspan x="500.0" dy="14.3">клієнтський процес завершено</tspan></text>
<line x1="500.0" y1="175.0" x2="500.0" y2="205.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="360.0" y="205.0" width="280.0" height="80.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">tmux-server (живий)</tspan><tspan x="500.0" dy="14.3">Закриває сокет клієнта,</tspan><tspan x="500.0" dy="14.3">але master PTY лишає відкритими</tspan></text>
<line x1="500.0" y1="285.0" x2="500.0" y2="315.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="360.0" y="315.0" width="280.0" height="80.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Дочірній процес (на pts/1)</tspan><tspan x="500.0" dy="14.3">НЕ отримує SIGHUP!</tspan><tspan x="500.0" dy="14.3">Продовжує рахувати у буфер</tspan></text>
<rect x="360.0" y="415.0" width="280.0" height="75.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="442.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Стан: ізольований фоновий біг</tspan><tspan x="500.0" dy="14.3">Дані не втрачено, буфер збирає</tspan><tspan x="500.0" dy="14.3">вивід у пам'ять сервера</tspan></text>
<rect x="680.0" y="105.0" width="280.0" height="70.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Новий клієнт (tmux attach)</tspan><tspan x="820.0" dy="14.3">Підключається з іншої машини,</tspan><tspan x="820.0" dy="14.3">передає новий розмір вікна</tspan></text>
<line x1="820.0" y1="175.0" x2="820.0" y2="205.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="680.0" y="205.0" width="280.0" height="80.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">tmux-server</tspan><tspan x="820.0" dy="14.3">Скидає повний зліпок екрана,</tspan><tspan x="820.0" dy="14.3">надсилає SIGWINCH на master PTY</tspan></text>
<line x1="820.0" y1="285.0" x2="820.0" y2="315.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="680.0" y="315.0" width="280.0" height="80.0" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Дочірній процес (на pts/1)</tspan><tspan x="820.0" dy="14.3">Адаптує розкладку під новий розмір,</tspan><tspan x="820.0" dy="14.3">продовжує інтерактивну роботу</tspan></text>
<rect x="680.0" y="415.0" width="280.0" height="75.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="442.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">Стан: сеанс відновлено</tspan><tspan x="820.0" dy="14.3">Повний контекст на місці,</tspan><tspan x="820.0" dy="14.3">жоден байт не загублено</tspan></text>
</svg>