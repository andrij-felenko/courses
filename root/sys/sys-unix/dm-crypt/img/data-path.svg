<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1350 810" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1350" height="810" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="670.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому запис через шифр дорожчий за читання</text>
<line x1="670.0" y1="95.0" x2="670.0" y2="700.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="350.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">читання</text>
<text x="990.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">запис</text>
<rect x="240.7" y="147.1" width="218.7" height="55.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="171.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">bio на читання</tspan><tspan x="350.0" dy="16.9">сторінки кеша поки порожні</tspan></text>
<rect x="222.1" y="272.1" width="255.7" height="55.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">клон указує на ТІ САМІ сторінки</tspan><tspan x="350.0" dy="16.9">жодного виділення пам'яті</tspan></text>
<rect x="251.8" y="397.1" width="196.4" height="55.9" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="421.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">носій заповнив сторінки</tspan><tspan x="350.0" dy="16.9">шифротекстом</tspan></text>
<rect x="255.5" y="522.0" width="189.0" height="55.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="546.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">розшифрувати на місці,</tspan><tspan x="350.0" dy="16.9">у тих самих сторінках</tspan></text>
<rect x="240.7" y="648.5" width="218.7" height="39.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="672.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">завершити оригінальний bio</tspan></text>
<line x1="350.0" y1="202.9" x2="350.0" y2="272.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="350.0" y1="327.9" x2="350.0" y2="397.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="350.0" y1="452.9" x2="350.0" y2="522.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="350.0" y1="578.0" x2="350.0" y2="648.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="869.6" y="147.1" width="240.9" height="55.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="990.0" y="171.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">bio на запис</tspan><tspan x="990.0" dy="16.9">у сторінках — відкритий текст</tspan></text>
<rect x="888.1" y="272.1" width="203.8" height="55.9" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="990.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">сторінки належать кешу:</tspan><tspan x="990.0" dy="16.9">переписувати їх не можна</tspan></text>
<rect x="854.7" y="397.1" width="270.5" height="55.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="990.0" y="421.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">узяти сторінки з резервного пулу,</tspan><tspan x="990.0" dy="16.9">зашифрувати в них</tspan></text>
<rect x="869.6" y="522.0" width="240.9" height="55.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="990.0" y="546.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">клон указує на НОВІ сторінки,</tspan><tspan x="990.0" dy="16.9">носій пише їх</tspan></text>
<rect x="906.6" y="640.0" width="166.8" height="55.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="990.0" y="664.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">звільнити сторінки,</tspan><tspan x="990.0" dy="16.9">завершити оригінал</tspan></text>
<line x1="990.0" y1="202.9" x2="990.0" y2="272.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="990.0" y1="327.9" x2="990.0" y2="397.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="990.0" y1="452.9" x2="990.0" y2="522.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="990.0" y1="578.0" x2="990.0" y2="640.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="350.0" y="745.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">додаткової пам'яті — нуль</text>
<text x="990.0" y="745.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">пам'яті — стільки ж, скільки даних у польоті</text>
</svg>