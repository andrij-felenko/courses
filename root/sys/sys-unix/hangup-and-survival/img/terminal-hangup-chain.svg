<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1450 850" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1450" height="850" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="720.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Каскад розриву сесії в ядрі Linux</text>
<text x="720.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Каскад подій при закритті термінала або розриві SSH</text>
<rect x="112.3" y="101.9" width="295.3" height="56.2" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="125.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Закриття PTY Master</tspan><tspan x="260.0" dy="18.2">close(ptm_fd) в sshd або терміналі</tspan></text>
<rect x="140.3" y="226.9" width="239.5" height="56.2" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="250.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Драйвер PTY у ядрі</tspan><tspan x="260.0" dy="18.2">pty_close() → tty_vhangup()</tspan></text>
<line x1="260.0" y1="158.1" x2="260.0" y2="226.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="124.3" y="347.8" width="271.4" height="74.4" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="371.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Маркування PTY Slave</tspan><tspan x="260.0" dy="18.2">Прапорець TTY_HUPPED</tspan><tspan x="260.0" dy="18.2">read() → 0 (EOF), write() → EIO</tspan></text>
<line x1="260.0" y1="283.1" x2="260.0" y2="347.8" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="567.1" y="215.8" width="305.8" height="78.4" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="241.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Лідер сесії (Session Leader)</tspan><tspan x="720.0" dy="18.2">Ядро надсилає SIGHUP процесу SID</tspan><tspan x="720.0" dy="18.2">kill_pgrp(tty-&gt;session, SIGHUP)</tspan></text>
<line x1="400.0" y1="255.0" x2="559.1" y2="255.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="483.6" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">kill_pgrp()</text>
<rect x="620.2" y="377.8" width="199.6" height="74.4" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="401.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Оболонка (Bash / Zsh)</tspan><tspan x="720.0" dy="18.2">Отримує SIGHUP або EOF</tspan><tspan x="720.0" dy="18.2">Обходить Jobs Table</tspan></text>
<line x1="720.0" y1="294.2" x2="720.0" y2="377.8" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="574.3" y="535.8" width="291.3" height="78.4" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="561.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Розсилка SIGHUP по завданнях</tspan><tspan x="720.0" dy="18.2">killpg(job-&gt;pgrp, SIGHUP)</tspan><tspan x="720.0" dy="18.2">для кожної активної групи процесу</tspan></text>
<line x1="720.0" y1="452.2" x2="720.0" y2="535.8" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1052.3" y="452.8" width="255.4" height="74.4" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="1180.0" y="476.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1180.0" dy="0.0">Група переднього плану (FG)</tspan><tspan x="1180.0" dy="18.2">Отримує SIGHUP від оболонки</tspan><tspan x="1180.0" dy="18.2">За замовчуванням — завершення</tspan></text>
<line x1="873.7" y1="560.0" x2="1044.3" y2="500.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1052.3" y="612.8" width="255.4" height="74.4" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="1180.0" y="636.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1180.0" dy="0.0">Фонові групи процесів (BG)</tspan><tspan x="1180.0" dy="18.2">Отримують SIGHUP від оболонки</tspan><tspan x="1180.0" dy="18.2">Завершуються без захисту</tspan></text>
<line x1="873.7" y1="585.0" x2="1044.3" y2="640.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="90.0" y1="715.0" x2="1350.0" y2="715.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6,6"/>
<rect x="313.0" y="746.9" width="814.0" height="56.2" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="770.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Захист ядра від вічного зависання зупинених процесів:</tspan><tspan x="720.0" dy="18.2">якщо група стає осиротілою (orphaned) і має процеси в TASK_STOPPED → ядро надсилає SIGHUP + SIGCONT</tspan></text>
</svg>