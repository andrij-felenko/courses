<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1450 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1450" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="720.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка дескрипторів мертвого термінала</text>
<text x="720.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка дескрипторів: чому живий процес гине на мертвому TTY</text>
<rect x="80.0" y="80.0" width="610.0" height="560.0" rx="10" fill="#fffaf9" stroke="#c0392b" stroke-width="1.5"/>
<text x="385.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">Без перенаправлення дескрипторів (ПОМИЛКА)</text>
<rect x="237.3" y="166.9" width="295.3" height="56.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="385.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">Процес ігнорує SIGHUP (живий)</tspan><tspan x="385.0" dy="18.2">Але fd 0, 1, 2 ведуть у /dev/pts/X</tspan></text>
<rect x="205.4" y="291.9" width="359.2" height="56.2" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="385.0" y="315.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">Термінал закрито: PTY Slave у стані HUPPED</tspan><tspan x="385.0" dy="18.2">Канал передачі зруйновано</tspan></text>
<line x1="385.0" y1="223.1" x2="385.0" y2="291.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="207.4" y="411.7" width="355.2" height="96.6" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="385.0" y="437.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">Операції введення-виведення:</tspan><tspan x="385.0" dy="18.2">• write(1, ...) → помилка EIO або падіння</tspan><tspan x="385.0" dy="18.2">• read(0, ...) → 0 (EOF) або помилка EIO</tspan><tspan x="385.0" dy="18.2">Процес аварійно завершується</tspan></text>
<line x1="385.0" y1="348.1" x2="385.0" y2="411.7" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="750.0" y="80.0" width="610.0" height="560.0" rx="10" fill="#f9fcf9" stroke="#27ae60" stroke-width="1.5"/>
<text x="1055.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">З ізоляцією дескрипторів (nohup / setsid)</text>
<rect x="875.4" y="166.9" width="359.2" height="56.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1055.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1055.0" dy="0.0">Перенаправлення дескрипторів:</tspan><tspan x="1055.0" dy="18.2">stdin: /dev/null · stdout: nohup.out / log</tspan></text>
<rect x="895.4" y="291.9" width="319.3" height="56.2" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="1055.0" y="315.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1055.0" dy="0.0">Відсутність зв'язку з slave PTY</tspan><tspan x="1055.0" dy="18.2">Дескриптори не залежать від емулятора</tspan></text>
<line x1="1055.0" y1="223.1" x2="1055.0" y2="291.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="877.4" y="411.7" width="355.2" height="96.6" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1055.0" y="437.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1055.0" dy="0.0">Стабільне виконання:</tspan><tspan x="1055.0" dy="18.2">• read(0, ...) повертає EOF штатно</tspan><tspan x="1055.0" dy="18.2">• write(1, ...) пише у дисковий файл логу</tspan><tspan x="1055.0" dy="18.2">Процес продовжує роботу без термінала</tspan></text>
<line x1="1055.0" y1="348.1" x2="1055.0" y2="411.7" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="720.0" y="675.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-style="italic">Живучість вимагає захисту в двох точках: сигнальної диспозиції (SIGHUP) та ізоляції каналів вводу-виводу (stdio)</text>
</svg>