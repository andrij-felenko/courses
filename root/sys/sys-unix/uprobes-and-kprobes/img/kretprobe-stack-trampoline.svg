<rect x="424.3" y="107.5" width="291.3" height="125.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="570.0" y="129.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">1. Процесор виконує RET</tspan><tspan x="570.0" dy="18.2">2. Стрибок на kretprobe_trampoline</tspan><tspan x="570.0" dy="18.2">3. Виклик kretprobe_handler()</tspan><tspan x="570.0" dy="18.2">   (інспекція RAX / retval)</tspan><tspan x="570.0" dy="18.2">4. Пошук справжньої адреси в task</tspan><tspan x="570.0" dy="18.2">5. Стрибок на справжню адресу</tspan></text>
