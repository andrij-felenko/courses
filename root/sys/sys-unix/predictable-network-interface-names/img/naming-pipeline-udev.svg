<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пайплайн призначення імені мережевого інтерфейсу в udev</text>
<rect x="30.0" y="60.0" width="240.0" height="100.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="150.0" y="85.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">1. Простір ядра (Linux Kernel)</tspan><tspan x="150.0" dy="14.3">• Драйвер виявляє контролер</tspan><tspan x="150.0" dy="14.3">• Реєстрація: alloc_netdev_mqs()</tspan><tspan x="150.0" dy="14.3">• Тимчасове ім'я ядра: eth0</tspan><tspan x="150.0" dy="14.3">• Подія uevent (ACTION=add)</tspan></text>
<line x1="270.0" y1="110.0" x2="330.0" y2="110.0" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0369a1" text-anchor="middle">netlink</text>
<rect x="330.0" y="60.0" width="260.0" height="130.0" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="460.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">2. udev: правило 80-net-setup-link</tspan><tspan x="460.0" dy="13.0">• IMPORT{builtin}=&quot;net_id&quot;</tspan><tspan x="460.0" dy="13.0">• Зчитування топології з sysfs:</tspan><tspan x="460.0" dy="13.0">  - DMI/SMBIOS: ID_NET_NAME_ONBOARD=eno1</tspan><tspan x="460.0" dy="13.0">  - PCI Slot: ID_NET_NAME_SLOT=ens1</tspan><tspan x="460.0" dy="13.0">  - PCI Path: ID_NET_NAME_PATH=enp3s0</tspan><tspan x="460.0" dy="13.0">  - MAC: ID_NET_NAME_MAC=enx78e7d1...</tspan></text>
<rect x="640.0" y="60.0" width="230.0" height="130.0" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/><text x="755.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">3. Обробка політик (.link)</tspan><tspan x="755.0" dy="13.0">• IMPORT{builtin}=&quot;net_setup_link&quot;</tspan><tspan x="755.0" dy="13.0">• 99-default.link:</tspan><tspan x="755.0" dy="13.0">  NamePolicy=onboard slot path mac</tspan><tspan x="755.0" dy="13.0">• Вибір першого валідного кандидата:</tspan><tspan x="755.0" dy="13.0">  ID_NET_NAME=&quot;enp3s0&quot;</tspan></text>
<line x1="590.0" y1="120.0" x2="640.0" y2="120.0" stroke="#ca8a04" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="755.0" y1="190.0" x2="755.0" y2="235.0" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="760.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7e22ce" text-anchor="start">Вибір: enp3s0</text>
<rect x="490.0" y="235.0" width="380.0" height="85.0" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="680.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">4. Виконання перейменування (udev daemon)</tspan><tspan x="680.0" dy="13.0">• Перевірка: інтерфейс перебуває в стані DOWN</tspan><tspan x="680.0" dy="13.0">• Системний виклик: RTM_SETLINK (IFLA_IFNAME=&quot;enp3s0&quot;)</tspan><tspan x="680.0" dy="13.0">• Ядро надсилає у відповідь: uevent (ACTION=move, DEVPATH=...)</tspan><tspan x="680.0" dy="13.0">• Створення альтернативних імен (IFLA_ALT_IFNAME)</tspan></text>
<line x1="490.0" y1="277.0" x2="410.0" y2="277.0" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="235.0" width="380.0" height="85.0" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/><text x="220.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">5. Готовий інтерфейс для конфігурації</tspan><tspan x="220.0" dy="13.0">• NetworkManager / systemd-networkd / ifupdown</tspan><tspan x="220.0" dy="13.0">• Застосування IP, маршрутів та правил фаєрвола</tspan><tspan x="220.0" dy="13.0">• Переведення інтерфейсу в стан UP (IFF_UP)</tspan><tspan x="220.0" dy="13.0">• Фіксація сталого імені enp3s0 між перезавантаженнями</tspan></text>
<rect x="30.0" y="345.0" width="840.0" height="70.0" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.0"/>
<text x="450.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">Ключова вимога: перейменування виконується ДО активації інтерфейсу (стан DOWN)</text>
<text x="450.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#78350f" text-anchor="middle">Якщо інтерфейс уже піднятий (UP), ядро повертає помилку -EBUSY на запит RTM_SETLINK</text>
</svg>