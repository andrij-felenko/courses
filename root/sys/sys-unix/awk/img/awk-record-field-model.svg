<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="770.0" height="370.0" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="400.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#263238" text-anchor="middle" font-weight="700">Модель декомпозиції даних: потік байтів → записи → поля</text>
<rect x="35.0" y="65.0" width="730.0" height="50.0" rx="5" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
<text x="120.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вхідний потік байтів:</text>
<text x="450.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#37474f" text-anchor="middle">user1 10.0.0.1 200\nuser2 10.0.0.2 404\nuser3 10.0.0.1 500\n</text>
<line x1="400.0" y1="115.0" x2="400.0" y2="145.0" stroke="#d32f2f" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="540.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d32f2f" text-anchor="middle" font-weight="700">Роздільник записів RS (за замовчуванням '\n')</text>
<rect x="35.0" y="150.0" width="730.0" height="75.0" rx="6" fill="#fff8e1" stroke="#ffa000" stroke-width="1.5"/>
<text x="150.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e65100" text-anchor="middle" font-weight="700">Поточний запис $0 (Record):</text>
<text x="520.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#bf360c" text-anchor="middle" font-weight="700">&quot;user2    10.0.0.2    404&quot;</text>
<text x="150.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Лічильники записів:</text>
<text x="330.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e65100" text-anchor="middle" font-weight="700">NR = 2 (глобальний)</text>
<text x="530.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e65100" text-anchor="middle" font-weight="700">FNR = 2 (у поточному файлі)</text>
<line x1="400.0" y1="225.0" x2="400.0" y2="255.0" stroke="#1976d2" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="540.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1976d2" text-anchor="middle" font-weight="700">Роздільник полів FS (за замовчуванням [ \t]+)</text>
<rect x="35.0" y="260.0" width="730.0" height="105.0" rx="6" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.5"/>
<text x="120.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a237e" text-anchor="middle" font-weight="700">Поля (Fields):</text>
<text x="350.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#283593" text-anchor="middle" font-weight="700">NF = 3 (кількість полів у поточному записі)</text>
<rect x="94.0" y="301.2" width="72.1" height="47.6" rx="6" fill="#ffffff" stroke="#3f51b5" stroke-width="1.5"/><text x="130.0" y="321.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">$1</tspan><tspan x="130.0" dy="15.6">&quot;user2&quot;</tspan></text>
<rect x="252.8" y="301.2" width="94.4" height="47.6" rx="6" fill="#ffffff" stroke="#3f51b5" stroke-width="1.5"/><text x="300.0" y="321.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">$2</tspan><tspan x="300.0" dy="15.6">&quot;10.0.0.2&quot;</tspan></text>
<rect x="441.4" y="301.2" width="57.2" height="47.6" rx="6" fill="#ffffff" stroke="#3f51b5" stroke-width="1.5"/><text x="470.0" y="321.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">$3</tspan><tspan x="470.0" dy="15.6">&quot;404&quot;</tspan></text>
<rect x="585.4" y="302.4" width="129.1" height="45.3" rx="6" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5"/><text x="650.0" y="321.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">$NF (тотожно $3)</tspan><tspan x="650.0" dy="14.3">&quot;404&quot;</tspan></text>
</svg>