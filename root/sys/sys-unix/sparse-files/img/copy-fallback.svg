<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1170 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1170" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">три шляхи копіювання і що обирає між ними</text>
<rect x="80.0" y="90.0" width="520.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="340.0" y="135.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">lseek(fd, 0, SEEK_HOLE) відповідає?</tspan></text>
<rect x="660.0" y="90.0" width="420.0" height="80.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/><text x="870.0" y="125.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">ТАК — йти по карті:</tspan><tspan x="870.0" dy="18.2">читати лише острови даних</tspan></text>
<line x1="604.0" y1="130.0" x2="654.0" y2="130.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="220.0" width="520.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="340.0" y="265.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">st_blocks · 512 менше за st_size?</tspan></text>
<rect x="660.0" y="220.0" width="420.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="870.0" y="255.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">НІ — файл щільний:</tspan><tspan x="870.0" dy="18.2">копіювати підряд, нулів не шукати</tspan></text>
<line x1="604.0" y1="260.0" x2="654.0" y2="260.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="350.0" width="1000.0" height="80.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="2.0"/><text x="580.0" y="385.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">ТАК — читати вікнами, кратними st_blksize приймача,</tspan><tspan x="580.0" dy="18.2">і не писати ті вікна, що складаються з самих нулів</tspan></text>
<line x1="340.0" y1="176.0" x2="340.0" y2="214.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="358.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">ні</text>
<line x1="340.0" y1="306.0" x2="340.0" y2="344.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="358.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">так</text>
<rect x="80.0" y="460.0" width="1000.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="580.0" y="493.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">жоден із трьох шляхів не губить байтів: помилитися вони можуть</tspan><tspan x="580.0" dy="18.9">лише в бік «копія зайняла більше місця, ніж могла б»</tspan></text>
