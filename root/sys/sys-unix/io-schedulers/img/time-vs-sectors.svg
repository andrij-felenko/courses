<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32.52 -10 1392.52 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-32.52" y="-10" width="1392.52" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="680.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому частку носія рахують у секторах, а не в часі</text>
<text x="130.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">Однакова скибка часу — 100 мс на обертовому диску</text>
<text x="106.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">послідовний читач</text>
<rect x="130.0" y="150.0" width="620.0" height="76.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.4"/>
<rect x="130.0" y="150.0" width="590.0" height="76.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.2"/>
<text x="425.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">15 МБ</text>
<text x="790.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">передавання майже без пауз</text>
<text x="106.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">випадковий читач</text>
<rect x="130.0" y="300.0" width="620.0" height="76.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.4"/>
<rect x="130.0" y="300.0" width="8.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>
<text x="156.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">32 КіБ</text>
<text x="790.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">вісім звертань, решта — переїзди головки</text>
<text x="130.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">корисна робота всередині скибки</text>
<rect x="106.0" y="440.0" width="1150.0" height="130.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="681.0" y="481.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="681.0" dy="0.0">Різниця — у чотириста з гаком разів, і вона не властивість процесу,</tspan><tspan x="681.0" dy="19.5">а властивість того, куди він звертається. Тому частку носія міряють</tspan><tspan x="681.0" dy="19.5">не мілісекундами, а секторами: бюджет у секторах обіцяє обсяг роботи,</tspan><tspan x="681.0" dy="19.5">а скибка часу обіцяє лише доступ до пристрою.</tspan></text>
</svg>