<text x="530.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">біт у stx_attributes_mask — «чи вміє ця ФС таке взагалі»</text>
<rect x="380.0" y="82.0" width="320.0" height="52.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="540.0" y="112.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">1 — уміє й відповідає</tspan></text>
<rect x="730.0" y="82.0" width="280.0" height="52.0" rx="6" fill="#eceef1" stroke="#6b7280" stroke-width="1.8"/><text x="870.0" y="112.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">0 — не має поняття</tspan></text>
<rect x="60.0" y="168.0" width="290.0" height="116.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="205.0" y="221.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">біт у stx_attributes</tspan><tspan x="205.0" dy="18.2">дорівнює 1</tspan></text>
<rect x="60.0" y="300.0" width="290.0" height="116.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="205.0" y="353.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">біт у stx_attributes</tspan><tspan x="205.0" dy="18.2">дорівнює 0</tspan></text>
<rect x="380.0" y="168.0" width="320.0" height="116.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/><text x="540.0" y="221.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">ТАК</tspan><tspan x="540.0" dy="19.5">властивість увімкнена</tspan></text>
<rect x="380.0" y="300.0" width="320.0" height="116.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="540.0" y="353.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">НІ</tspan><tspan x="540.0" dy="19.5">властивість вимкнена</tspan></text>
<rect x="730.0" y="168.0" width="280.0" height="248.0" rx="6" fill="#eceef1" stroke="#6b7280" stroke-width="2.0"/><text x="870.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">НЕ ЗНАЮ</tspan><tspan x="870.0" dy="19.5">нуль тут нічого</tspan><tspan x="870.0" dy="19.5">не означає —</tspan><tspan x="870.0" dy="19.5">поле читати не можна</tspan></text>
<rect x="60.0" y="472.0" width="940.0" height="96.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="530.0" y="506.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Btrfs уміє стискати вміст — і про стиснення відповідає обома бітами.</tspan><tspan x="530.0" dy="18.2">FAT такого поняття не має: там нуль у stx_attributes — це мовчання,</tspan><tspan x="530.0" dy="18.2">а не заперечення, і саме це розрізняє другий ярус масок.</tspan></text>
