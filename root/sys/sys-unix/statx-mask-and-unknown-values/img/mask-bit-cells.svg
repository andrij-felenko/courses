<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1170 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1170" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один біт: що означає кожне поєднання прохання й відповіді</text>
<text x="540.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">біт у stx_mask стоїть</text>
<text x="926.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">біт у stx_mask скинуто</text>
<text x="326.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700"><tspan x="326.0" dy="0.0">біт стояв</tspan><tspan x="326.0" dy="18.2">у масці запиту</tspan></text>
<rect x="360.0" y="108.0" width="360.0" height="176.0" rx="10" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="540.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">ПОЛЕ Є</text>
<text x="540.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">значення читати можна</tspan></text>
<rect x="746.0" y="108.0" width="360.0" height="176.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="926.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">ЦЯ ФС ТАКОГО НЕ ЗНАЄ</text>
<text x="926.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="926.0" dy="0.0">у полі нуль, і він</tspan><tspan x="926.0" dy="17.6">нічого не означає</tspan></text>
<text x="326.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700"><tspan x="326.0" dy="0.0">біта в масці</tspan><tspan x="326.0" dy="18.2">запиту не було</tspan></text>
<rect x="360.0" y="310.0" width="360.0" height="176.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="540.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">ДІСТАЛОСЯ ЗАДАРМА</text>
<text x="540.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">драйвер однаково прочитав</tspan><tspan x="540.0" dy="17.6">inode й позначив біт</tspan></text>
<rect x="746.0" y="310.0" width="360.0" height="176.0" rx="10" fill="#eceef1" stroke="#6b7280" stroke-width="2.0"/>
<text x="926.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="700">ТИША</text>
<text x="926.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="926.0" dy="0.0">ні прохання, ні відповіді</tspan></text>
<rect x="60.0" y="534.0" width="1046.0" height="96.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="583.0" y="577.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="583.0" dy="0.0">П'ятий випадок: у stx_mask стоїть біт, якого наш заголовок не називає.</tspan><tspan x="583.0" dy="18.2">Ядро новіше за програму — і саме цей залишок каже, наскільки.</tspan></text>
</svg>