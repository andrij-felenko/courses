<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 860" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="860" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від xstat() до statx(): віхи й правки за заперечення</text>
<line x1="60.0" y1="104.0" x2="1114.0" y2="104.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="155.0" y1="104.0" x2="155.0" y2="126.0" stroke="#2457d6" stroke-width="2.0"/>
<rect x="60.0" y="128.0" width="190.0" height="168.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="155.0" y="182.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">30.06.2010</tspan><tspan x="155.0" dy="16.9">xstat()/fxstat():</tspan><tspan x="155.0" dy="16.9">буфер із довжиною,</tspan><tspan x="155.0" dy="16.9">номер версії</tspan><tspan x="155.0" dy="16.9">всередині структури</tspan></text>
<line x1="371.0" y1="104.0" x2="371.0" y2="126.0" stroke="#2457d6" stroke-width="2.0"/>
<rect x="276.0" y="128.0" width="190.0" height="168.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="371.0" y="191.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="371.0" dy="0.0">15.07.2010</tspan><tspan x="371.0" dy="16.9">друга редакція;</tspan><tspan x="371.0" dy="16.9">далі обговорення</tspan><tspan x="371.0" dy="16.9">поволі згасає</tspan></text>
<line x1="587.0" y1="104.0" x2="587.0" y2="126.0" stroke="#b8860b" stroke-width="2.0"/>
<rect x="492.0" y="128.0" width="190.0" height="168.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="587.0" y="182.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="587.0" dy="0.0">квітень 2016</tspan><tspan x="587.0" dy="16.9">LSFMM: лишити те,</tspan><tspan x="587.0" dy="16.9">що має чітке значення;</tspan><tspan x="587.0" dy="16.9">29.04 — RFC уже</tspan><tspan x="587.0" dy="16.9">під назвою statx()</tspan></text>
<line x1="803.0" y1="104.0" x2="803.0" y2="126.0" stroke="#b8860b" stroke-width="2.0"/>
<rect x="708.0" y="128.0" width="190.0" height="168.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="803.0" y="182.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="803.0" dy="0.0">30.11.2016</tspan><tspan x="803.0" dy="16.9">третя редакція:</tspan><tspan x="803.0" dy="16.9">суперечка про</tspan><tspan x="803.0" dy="16.9">фемтосекунди</tspan><tspan x="803.0" dy="16.9">й вимога тестів</tspan></text>
<line x1="1019.0" y1="104.0" x2="1019.0" y2="126.0" stroke="#27ae60" stroke-width="2.0"/>
<rect x="924.0" y="128.0" width="190.0" height="168.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="1019.0" y="182.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1019.0" dy="0.0">03.03.2017</tspan><tspan x="1019.0" dy="16.9">Ал Віро бере</tspan><tspan x="1019.0" dy="16.9">патч у дерево;</tspan><tspan x="1019.0" dy="16.9">Linux 4.11 —</tspan><tspan x="1019.0" dy="16.9">30.04.2017</tspan></text>
<text x="590.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">заперечення рецензентів  →  що через нього змінилося</text>
<rect x="60.0" y="372.0" width="450.0" height="134.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="285.0" y="418.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">«Номер версії структури —</tspan><tspan x="285.0" dy="16.9">це роки життя з кількома</tspan><tspan x="285.0" dy="16.9">розкладками; дешевше додати</tspan><tspan x="285.0" dy="16.9">ще один виклик, ніж їх тягнути»</tspan></text>
<line x1="524.0" y1="439.0" x2="592.0" y2="439.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="606.0" y="372.0" width="508.0" height="134.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="860.0" y="418.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Версії немає взагалі.</tspan><tspan x="860.0" dy="16.9">Нова можливість — це новий біт</tspan><tspan x="860.0" dy="16.9">маски; сторона, яка його не знає,</tspan><tspan x="860.0" dy="16.9">просто його не бачить</tspan></text>
<rect x="60.0" y="526.0" width="450.0" height="134.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="285.0" y="572.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">«Одна структура і як вхід,</tspan><tspan x="285.0" dy="16.9">і як вихід — прохання</tspan><tspan x="285.0" dy="16.9">та відповідь злиплися</tspan><tspan x="285.0" dy="16.9">в одному буфері»</tspan></text>
<line x1="524.0" y1="593.0" x2="592.0" y2="593.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="606.0" y="526.0" width="508.0" height="134.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="860.0" y="572.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Прохання винесено окремим</tspan><tspan x="860.0" dy="16.9">аргументом виклику;</tspan><tspan x="860.0" dy="16.9">у буфер ядро тільки пише,</tspan><tspan x="860.0" dy="16.9">і пише завжди всі 256 байтів</tspan></text>
<rect x="60.0" y="680.0" width="450.0" height="134.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="285.0" y="726.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">«Повертати все, що комусь</tspan><tspan x="285.0" dy="16.9">колись здасться корисним» —</tspan><tspan x="285.0" dy="16.9">поля без чіткого значення</tspan><tspan x="285.0" dy="16.9">й без жодного споживача</tspan></text>
<line x1="524.0" y1="747.0" x2="592.0" y2="747.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="606.0" y="680.0" width="508.0" height="134.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="860.0" y="726.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Лишили те, що визначено</tspan><tspan x="860.0" dy="16.9">однозначно й комусь потрібне;</tspan><tspan x="860.0" dy="16.9">решта — у резерв структури,</tspan><tspan x="860.0" dy="16.9">куди її дописали пізніше</tspan></text>
</svg>