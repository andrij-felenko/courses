<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири конструкції, якими Kconfig зв'язує два символи</text>
<text x="170.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">конструкція</text>
<text x="470.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">напрям і межа</text>
<text x="900.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">наслідки</text>
<rect x="60.0" y="76.0" width="220.0" height="100.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="130.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">depends on B</tspan></text>
<rect x="320.0" y="76.0" width="300.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="122.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">A не може бути</tspan><tspan x="470.0" dy="16.9">більшим за B</tspan></text>
<rect x="660.0" y="76.0" width="480.0" height="100.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="900.0" y="114.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">питання A зникає з меню, доки B = n</tspan><tspan x="900.0" dy="15.6">власні залежності B шануються</tspan><tspan x="900.0" dy="15.6">найбезпечніша з чотирьох форм</tspan></text>
<line x1="282.0" y1="126.0" x2="316.0" y2="126.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="622.0" y1="126.0" x2="656.0" y2="126.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="206.0" width="220.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="260.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">select B  [if E]</tspan></text>
<rect x="320.0" y="206.0" width="300.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="252.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">A мовчки піднімає B</tspan><tspan x="470.0" dy="16.9">до свого значення</tspan></text>
<rect x="660.0" y="206.0" width="480.0" height="100.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="900.0" y="236.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">залежності B НЕ перевіряються</tspan><tspan x="900.0" dy="15.6">звідси попередження про незадоволену залежність</tspan><tspan x="900.0" dy="15.6">вимкнути B вручну неможливо</tspan><tspan x="900.0" dy="15.6">лише для невидимих символів без залежностей</tspan></text>
<line x1="282.0" y1="256.0" x2="316.0" y2="256.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="622.0" y1="256.0" x2="656.0" y2="256.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="336.0" width="220.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="390.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">imply B  [if E]</tspan></text>
<rect x="320.0" y="336.0" width="300.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="382.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">A піднімає лише</tspan><tspan x="470.0" dy="16.9">типове значення B</tspan></text>
<rect x="660.0" y="336.0" width="480.0" height="100.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="900.0" y="374.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">людина може лишити B = n</tspan><tspan x="900.0" dy="15.6">власні залежності B шануються</tspan><tspan x="900.0" dy="15.6">м'який родич select</tspan></text>
<line x1="282.0" y1="386.0" x2="316.0" y2="386.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="622.0" y1="386.0" x2="656.0" y2="386.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="466.0" width="220.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="511.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">visible if E</tspan><tspan x="170.0" dy="18.2">лише для menu</tspan></text>
<rect x="320.0" y="466.0" width="300.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="512.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">ховає підказки</tspan><tspan x="470.0" dy="16.9">всього блоку</tspan></text>
<rect x="660.0" y="466.0" width="480.0" height="100.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="900.0" y="504.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">значення символів усередині не міняються</tspan><tspan x="900.0" dy="15.6">їх усе одно може підняти чужий select</tspan><tspan x="900.0" dy="15.6">це не те саме, що depends on</tspan></text>
<line x1="282.0" y1="516.0" x2="316.0" y2="516.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="622.0" y1="516.0" x2="656.0" y2="516.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="608.0" width="1080.0" height="66.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="645.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">усі умови обчислюються в наборі n &lt; m &lt; y:   &amp;&amp; дає менше,   || дає більше,   ! дзеркалить (n у y, m лишається m)</tspan></text>
</svg>