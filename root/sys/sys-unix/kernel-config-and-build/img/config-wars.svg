<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві заміни старої мови конфігурації: одну відхилили, другу прийняли</text>
<text x="230.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">мова</text>
<text x="660.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">як зроблено</text>
<text x="1060.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">доля</text>
<rect x="70.0" y="100.0" width="320.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="230.0" y="150.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">стара система («CML1»)</tspan><tspan x="230.0" dy="19.5">до 2002</tspan></text>
<rect x="430.0" y="100.0" width="460.0" height="110.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="660.0" y="143.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Config.in синтаксисом shell, обхід дерева скриптом Configure;</tspan><tspan x="660.0" dy="15.6">меню й Tk-фронтенд читають ті самі файли кожен по-своєму;</tspan><tspan x="660.0" dy="15.6">довідка окремо, у Documentation/Configure.help</tspan></text>
<rect x="940.0" y="100.0" width="230.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="1055.0" y="151.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1055.0" dy="0.0">виріс за межі</tspan><tspan x="1055.0" dy="16.9">власної мови</tspan></text>
<rect x="70.0" y="250.0" width="320.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="300.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">CML2</tspan><tspan x="230.0" dy="19.5">2000 – 2002</tspan></text>
<rect x="430.0" y="250.0" width="460.0" height="110.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="660.0" y="293.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">цілком нова мова з розв'язувачем обмежень усередині;</tspan><tspan x="660.0" dy="15.6">дві програми на Python: cmlcompile і cmlconfigure;</tspan><tspan x="660.0" dy="15.6">сумісності з Config.in немає — база правил переписана</tspan></text>
<rect x="940.0" y="250.0" width="230.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1055.0" y="301.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1055.0" dy="0.0">у дерево</tspan><tspan x="1055.0" dy="16.9">не взяли</tspan></text>
<rect x="70.0" y="400.0" width="320.0" height="110.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="450.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Kconfig</tspan><tspan x="230.0" dy="19.5">з 2.5.45, жовтень 2002</tspan></text>
<rect x="430.0" y="400.0" width="460.0" height="110.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="660.0" y="443.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">мова, впізнавана для того, хто знав Config.in;</tspan><tspan x="660.0" dy="15.6">парсер і фронтенди на C, знайомий вигляд menuconfig;</tspan><tspan x="660.0" dy="15.6">довідка переїхала до самої опції, нових залежностей нема</tspan></text>
<rect x="940.0" y="400.0" width="230.0" height="110.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="1055.0" y="451.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1055.0" dy="0.0">у дереві</tspan><tspan x="1055.0" dy="16.9">досі</tspan></text>
<line x1="230.0" y1="214.0" x2="230.0" y2="246.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="230.0" y1="364.0" x2="230.0" y2="396.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="540.0" width="1100.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="572.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">вигране не найкращим дизайном, а найменшою ціною переходу для тих, хто щодня правив ці файли</tspan></text>
</svg>