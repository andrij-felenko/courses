<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1350 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1350" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="670.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Записи в кільце, стіна, дзвінок — і те саме кільце під двома різними адресами</text>
<rect x="60.0" y="72.0" width="420.0" height="128.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="270.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">ЗАПИСИ В КІЛЬЦЕ</tspan><tspan x="270.0" dy="19.5">ring[i].addr  = cpu_to_le64(buf)</tspan><tspan x="270.0" dy="19.5">ring[i].len   = cpu_to_le32(len)</tspan><tspan x="270.0" dy="19.5">ring[i].flags = DESC_OWN</tspan></text>
<rect x="530.0" y="72.0" width="150.0" height="128.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="605.0" y="121.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="605.0" dy="0.0">БАР'ЄР</tspan><tspan x="605.0" dy="19.5">усередині</tspan><tspan x="605.0" dy="19.5">writel</tspan></text>
<rect x="730.0" y="72.0" width="550.0" height="128.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="1005.0" y="121.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1005.0" dy="0.0">ДЗВІНОК</tspan><tspan x="1005.0" dy="19.5">writel(i, regs + REG_TX_KICK)</tspan><tspan x="1005.0" dy="19.5">одна транзакція завширшки чотири байти</tspan></text>
<line x1="480.0" y1="136.0" x2="526.0" y2="136.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="680.0" y1="136.0" x2="726.0" y2="136.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="730.0" y="250.0" width="550.0" height="96.0" rx="6" fill="#fff4e0" stroke="#c0392b" stroke-width="2.0"/><text x="1005.0" y="293.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1005.0" dy="0.0">КОНТРОЛЕР</tspan><tspan x="1005.0" dy="19.5">побачив дзвінок і сам іде читати кільце</tspan></text>
<line x1="1005.0" y1="200.0" x2="1005.0" y2="246.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="250.0" width="420.0" height="96.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="293.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">читає за адресою ring_dma</tspan><tspan x="270.0" dy="19.5">і бачить готовий прапорець DESC_OWN</tspan></text>
<line x1="726.0" y1="298.0" x2="484.0" y2="298.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="670.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна річ — дві адреси</text>
<rect x="60.0" y="434.0" width="590.0" height="92.0" rx="6" fill="#e6f5ec" stroke="#333333" stroke-width="1.5"/><text x="355.0" y="475.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">кільце для процесора: p-&gt;ring</tspan><tspan x="355.0" dy="19.5">віртуальна адреса ядра, яку дав dma_alloc_coherent</tspan></text>
<rect x="690.0" y="434.0" width="590.0" height="92.0" rx="6" fill="#fff4e0" stroke="#333333" stroke-width="1.5"/><text x="985.0" y="475.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="985.0" dy="0.0">кільце для пристрою: p-&gt;ring_dma</tspan><tspan x="985.0" dy="19.5">число, яке контролер виставить на шину</tspan></text>
<rect x="60.0" y="560.0" width="590.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="355.0" y="601.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="355.0" dy="0.0">регістр для процесора: p-&gt;regs + 0x18</tspan><tspan x="355.0" dy="19.5">віртуальна адреса ядра, яку дав ioremap</tspan></text>
<rect x="690.0" y="560.0" width="590.0" height="92.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="985.0" y="601.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="985.0" dy="0.0">регістр для пристрою: 0xe0001018</tspan><tspan x="985.0" dy="19.5">фізична адреса з опису плати</tspan></text>
</svg>