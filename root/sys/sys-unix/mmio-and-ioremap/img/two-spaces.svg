<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1370 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1370" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="680.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Число з документації живе не в тому просторі, у якому працює код</text>
<rect x="60.0" y="70.0" width="540.0" height="50.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="330.0" y="100.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">ФІЗИЧНІ АДРЕСИ — те, що їде дротами шини</tspan></text>
<rect x="760.0" y="70.0" width="540.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="1030.0" y="100.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1030.0" dy="0.0">ВІРТУАЛЬНІ АДРЕСИ — те, що бачить код ядра</tspan></text>
<rect x="60.0" y="150.0" width="540.0" height="78.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="184.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">0x00000000 – 0x7fffffff</tspan><tspan x="330.0" dy="18.2">оперативна пам'ять</tspan></text>
<rect x="60.0" y="250.0" width="540.0" height="78.0" rx="6" fill="#fff4e0" stroke="#c0392b" stroke-width="2.0"/><text x="330.0" y="284.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">0xe0001000 – 0xe0001fff</tspan><tspan x="330.0" dy="18.2">вікно регістрів контролера</tspan></text>
<rect x="60.0" y="350.0" width="540.0" height="78.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="393.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">решта — дірки, куди ніхто не відповідає</tspan></text>
<rect x="760.0" y="150.0" width="540.0" height="78.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="1030.0" y="184.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">пряма карта: уся оперативна пам'ять,</tspan><tspan x="1030.0" dy="18.2">відображена ядром наперед</tspan></text>
<rect x="760.0" y="250.0" width="540.0" height="78.0" rx="6" fill="#fff4e0" stroke="#c0392b" stroke-width="2.0"/><text x="1030.0" y="284.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">область vmalloc: сюди ioremap кладе</tspan><tspan x="1030.0" dy="18.2">свіжий запис таблиці сторінок</tspan></text>
<rect x="760.0" y="350.0" width="540.0" height="78.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="1030.0" y="384.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">адреси процесів — інша половина,</tspan><tspan x="1030.0" dy="18.2">до заліза стосунку не мають</tspan></text>
<line x1="600.0" y1="189.0" x2="760.0" y2="189.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="680.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">готове</text>
<line x1="600.0" y1="289.0" x2="760.0" y2="289.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="680.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ioremap()</text>
<rect x="230.0" y="470.0" width="900.0" height="88.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="680.0" y="509.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">ioremap робить дві речі одним ходом: заводить запис у таблиці сторінок ядра</tspan><tspan x="680.0" dy="19.5">на потрібні фізичні кадри — і ставить у ньому тип пам'яті «пристрій»</tspan></text>
<line x1="330.0" y1="430.0" x2="500.0" y2="466.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1030.0" y1="430.0" x2="860.0" y2="466.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="230.0" y="590.0" width="900.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="680.0" y="627.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">повернений вказівник має тип void __iomem * — і розіменовувати його не можна</tspan></text>
<line x1="680.0" y1="560.0" x2="680.0" y2="586.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>