<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що змінює біт set-user-ID під час exec</text>
<rect x="50.0" y="120.7" width="260.0" height="88.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="142.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">процес до exec</tspan><tspan x="180.0" dy="18.2">ruid  1000</tspan><tspan x="180.0" dy="18.2">euid  1000</tspan><tspan x="180.0" dy="18.2">suid  1000</tspan></text>
<rect x="494.2" y="129.8" width="211.5" height="70.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="151.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">/usr/bin/passwd</tspan><tspan x="600.0" dy="18.2">-rwsr-xr-x   root   root</tspan><tspan x="600.0" dy="18.2">біт set-user-ID стоїть</tspan></text>
<rect x="855.4" y="120.7" width="299.3" height="88.6" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="1005.0" y="142.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1005.0" dy="0.0">той самий процес після exec</tspan><tspan x="1005.0" dy="18.2">ruid  1000   не змінився</tspan><tspan x="1005.0" dy="18.2">euid  0      узято у власника файлу</tspan><tspan x="1005.0" dy="18.2">suid  0      копія нового діючого</tspan></text>
<line x1="320.0" y1="165.0" x2="448.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="752.0" y1="165.0" x2="838.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="300.0" width="1060.0" height="118.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="345.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">через exec переходить незмінним усе інше:</tspan><tspan x="600.0" dy="18.2">argv (включно з argv[0] і порожнім) · оточення: PATH, IFS, TZ, LOCPATH · відкриті дескриптори</tspan><tspan x="600.0" dy="18.2">робочий каталог · umask · обмеження ресурсів · маска сигналів · додаткові групи</tspan></text>
<rect x="378.5" y="463.0" width="442.9" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="484.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">усе, що в цій смузі, склав той, хто програму запустив</tspan></text>
</svg>