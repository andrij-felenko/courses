<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 866" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="866" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок викликів нового набору монтування (Linux 5.2)</text>
<rect x="40.0" y="60.0" width="380.0" height="52.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="230.0" y="90.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">створити новий примірник ФС</tspan></text>
<rect x="40.0" y="150.0" width="380.0" height="88.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="230.0" y="190.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">fsopen(&quot;ext4&quot;, 0)</tspan><tspan x="230.0" dy="16.2">→ fd контексту файлової системи</tspan></text>
<line x1="230.0" y1="238.0" x2="230.0" y2="272.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="272.0" width="380.0" height="88.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="230.0" y="304.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">fsconfig(SET_STRING, &quot;source&quot;, &quot;/dev/sdb1&quot;, 0)</tspan><tspan x="230.0" dy="16.2">fsconfig(SET_FLAG, &quot;ro&quot;, NULL, 0)</tspan><tspan x="230.0" dy="16.2">кожен параметр окремо — і окрема помилка</tspan></text>
<line x1="230.0" y1="360.0" x2="230.0" y2="394.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="394.0" width="380.0" height="88.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="230.0" y="434.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">fsconfig(CMD_CREATE, NULL, NULL, 0)</tspan><tspan x="230.0" dy="16.2">→ суперблок створено</tspan></text>
<line x1="230.0" y1="482.0" x2="230.0" y2="516.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="516.0" width="380.0" height="88.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="230.0" y="556.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">fsmount(fd, 0, MOUNT_ATTR_NODEV)</tspan><tspan x="230.0" dy="16.2">→ fd відокремленого монтування</tspan></text>
<line x1="230.0" y1="604.0" x2="230.0" y2="638.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="638.0" width="380.0" height="88.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.6"/><text x="230.0" y="670.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">move_mount(mfd, &quot;&quot;, AT_FDCWD, &quot;/mnt&quot;,</tspan><tspan x="230.0" dy="16.2">           MOVE_MOUNT_F_EMPTY_PATH)</tspan><tspan x="230.0" dy="16.2">→ монтування стало в дерево</tspan></text>
<line x1="230.0" y1="112.0" x2="230.0" y2="150.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="450.0" y="60.0" width="330.0" height="52.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/><text x="615.0" y="90.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">узяти вже наявне піддерево</tspan></text>
<rect x="450.0" y="150.0" width="330.0" height="88.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="615.0" y="182.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">open_tree(AT_FDCWD, &quot;/data&quot;,</tspan><tspan x="615.0" dy="16.2">  OPEN_TREE_CLONE | AT_RECURSIVE)</tspan><tspan x="615.0" dy="16.2">→ fd відокремленої копії</tspan></text>
<line x1="615.0" y1="238.0" x2="615.0" y2="272.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="450.0" y="272.0" width="330.0" height="88.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="615.0" y="304.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">mount_setattr(fd, &quot;&quot;, AT_EMPTY_PATH,</tspan><tspan x="615.0" dy="16.2">              &amp;attr, sizeof attr)</tspan><tspan x="615.0" dy="16.2">за потреби: ro, idmap, поширення</tspan></text>
<line x1="615.0" y1="360.0" x2="615.0" y2="394.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="450.0" y="394.0" width="330.0" height="88.0" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.6"/><text x="615.0" y="434.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">move_mount(fd, &quot;&quot;, AT_FDCWD,</tspan><tspan x="615.0" dy="16.2">           &quot;/srv/data&quot;, F_EMPTY_PATH)</tspan></text>
<line x1="615.0" y1="112.0" x2="615.0" y2="150.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="810.0" y="60.0" width="330.0" height="52.0" rx="8" fill="#fff6e5" stroke="#b8860b" stroke-width="2.0"/><text x="975.0" y="90.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="975.0" dy="0.0">перенастроїти змонтоване</tspan></text>
<rect x="810.0" y="150.0" width="330.0" height="88.0" rx="8" fill="#f4f6f8" stroke="#b8860b" stroke-width="1.6"/><text x="975.0" y="182.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">fspick(AT_FDCWD, &quot;/data&quot;,</tspan><tspan x="975.0" dy="16.2">       FSPICK_NO_AUTOMOUNT)</tspan><tspan x="975.0" dy="16.2">→ fd контексту наявної ФС</tspan></text>
<line x1="975.0" y1="238.0" x2="975.0" y2="272.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="810.0" y="272.0" width="330.0" height="88.0" rx="8" fill="#f4f6f8" stroke="#b8860b" stroke-width="1.6"/><text x="975.0" y="312.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">fsconfig(SET_FLAG, &quot;noatime&quot;, NULL, 0)</tspan><tspan x="975.0" dy="16.2">міняємо параметр</tspan></text>
<line x1="975.0" y1="360.0" x2="975.0" y2="394.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="810.0" y="394.0" width="330.0" height="88.0" rx="8" fill="#f4f6f8" stroke="#b8860b" stroke-width="1.6"/><text x="975.0" y="434.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">fsconfig(CMD_RECONFIGURE, NULL, NULL, 0)</tspan><tspan x="975.0" dy="16.2">≈ mount(2) з MS_REMOUNT</tspan></text>
<line x1="975.0" y1="112.0" x2="975.0" y2="150.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="758.0" width="1100.0" height="66.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="590.0" y="787.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Кожен крок віддає файловий дескриптор: монтування існує як річ у руках</tspan><tspan x="590.0" dy="17.6">ще до того, як у нього з'явилося місце в дереві — і навіть в іншому просторі імен</tspan></text>
</svg>