<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">module_init(): дві незалежні реєстрації</text>
<text x="30.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">1 · реєстр символьних пристроїв: номери → операції</text>
<rect x="30.0" y="92.0" width="300.0" height="82.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="180.0" y="120.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">alloc_chrdev_region()</tspan><tspan x="180.0" dy="16.9">ядро видає вільний</tspan><tspan x="180.0" dy="16.9">старший номер, скажімо 511</tspan></text>
<rect x="380.0" y="92.0" width="300.0" height="82.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="530.0" y="120.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">cdev_init() + cdev_add()</tspan><tspan x="530.0" dy="16.9">у реєстрі з'являється</tspan><tspan x="530.0" dy="16.9">511:0 → file_operations</tspan></text>
<rect x="730.0" y="92.0" width="300.0" height="82.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="880.0" y="120.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">open() по цих номерах</tspan><tspan x="880.0" dy="16.9">уже потрапляє в драйвер —</tspan><tspan x="880.0" dy="16.9">але вузла в /dev ще немає</tspan></text>
<line x1="330.0" y1="133.0" x2="376.0" y2="133.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="680.0" y1="133.0" x2="726.0" y2="133.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="30.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">2 · модель пристроїв у sysfs: звідки береться вузол</text>
<rect x="30.0" y="268.0" width="300.0" height="82.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="180.0" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">class_create() + device_create()</tspan><tspan x="180.0" dy="16.9">пристрій стає в модель,</tspan><tspan x="180.0" dy="16.9">несучи в собі той самий dev_t</tspan></text>
<rect x="380.0" y="268.0" width="300.0" height="82.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="530.0" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">devtmpfs підвішено до самої</tspan><tspan x="530.0" dy="16.9">реєстрації: вузол /dev/lichylnyk</tspan><tspan x="530.0" dy="16.9">з'являється одразу</tspan></text>
<rect x="730.0" y="268.0" width="300.0" height="82.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="880.0" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">udev дістає подію, читає</tspan><tspan x="880.0" dy="16.9">«511:0» з файла dev у sysfs</tspan><tspan x="880.0" dy="16.9">і доводить права та імена</tspan></text>
<line x1="330.0" y1="309.0" x2="376.0" y2="309.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="680.0" y1="309.0" x2="726.0" y2="309.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="150.0" y1="178.0" x2="150.0" y2="262.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="166.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">той самий dev_t</text>
<text x="540.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="540.0" dy="0.0">Прибрати верхній рядок — вузол у /dev є, а open дає ENXIO.</tspan><tspan x="540.0" dy="16.2">Прибрати нижній — драйвер працює, тільки вузол доводиться робити mknod вручну.</tspan></text>
</svg>