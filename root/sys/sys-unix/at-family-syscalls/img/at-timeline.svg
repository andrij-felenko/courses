<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 1140" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="1140" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три приходи родини *at: атрибути → гонки → знову атрибути</text>
<line x1="250.0" y1="121.0" x2="250.0" y2="919.0" stroke="#333333" stroke-width="2.0"/>
<rect x="50.0" y="50.0" width="1090.0" height="46.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="595.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">ДІЯ ПЕРША — двері у простір розширених атрибутів</tspan></text>
<rect x="300.0" y="118.0" width="840.0" height="66.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="720.0" y="146.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Solaris 9: openat з прапорцем O_XATTR і обгортка attropen.</tspan><tspan x="720.0" dy="19.5">Дескриптор каталогу тут — точка входу в атрибути, не захист від гонки</tspan></text>
<text x="208.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">2002</text>
<rect x="50.0" y="204.0" width="1090.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="595.0" y="232.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">ДІЯ ДРУГА — той самий важіль, але вже проти гонок</tspan></text>
<rect x="300.0" y="272.0" width="840.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="720.0" y="300.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Solaris 10: повний набір — fstatat, unlinkat, renameat,</tspan><tspan x="720.0" dy="19.5">fchownat, futimesat і решта; мотив названо прямо: гонка</tspan></text>
<text x="208.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">2005</text>
<rect x="300.0" y="358.0" width="840.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="720.0" y="386.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">березень: Linux 2.6.16 і glibc 2.4 — справжні виклики ядра</tspan><tspan x="720.0" dy="19.5">замість колишніх обхідних трюків у бібліотеці</tspan></text>
<text x="208.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">2006</text>
<rect x="300.0" y="444.0" width="840.0" height="66.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="482.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">POSIX.1-2008 (IEEE Std 1003.1-2008): набір стає обов'язковим</tspan></text>
<text x="208.0" y="483.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">2008</text>
<rect x="300.0" y="530.0" width="840.0" height="66.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="558.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">BSD підхоплюють: DragonFly і FreeBSD 2008–09 (openat — FreeBSD 8.0),</tspan><tspan x="720.0" dy="19.5">OpenBSD 2011, NetBSD і macOS — середина 2010-х</tspan></text>
<text x="208.0" y="569.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">2008–15</text>
<rect x="50.0" y="616.0" width="1090.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="595.0" y="645.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">ДІЯ ТРЕТЯ — якоря замало, і атрибути повертаються</tspan></text>
<rect x="300.0" y="684.0" width="840.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="712.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Linux 5.6: openat2 (Алекса Сараї, SUSE) — прапорці RESOLVE_*,</tspan><tspan x="720.0" dy="19.5">бо «..», абсолютні шляхи, посилання й монтування лишалися відчиненими</tspan></text>
<text x="208.0" y="723.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">2020</text>
<rect x="300.0" y="770.0" width="840.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="798.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">5.11 — заборонено пару RESOLVE_BENEATH|RESOLVE_IN_ROOT;</tspan><tspan x="720.0" dy="19.5">5.12 — додано RESOLVE_CACHED; перший споживач у просторі користувача — LXC</tspan></text>
<text x="208.0" y="809.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">2021</text>
<rect x="300.0" y="856.0" width="840.0" height="66.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="720.0" y="884.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">січень, Linux 6.13: setxattrat, getxattrat, listxattrat, removexattrat —</tspan><tspan x="720.0" dy="19.5">мотив знову атрибути: геть обхід через /proc/self/fd</tspan></text>
<text x="208.0" y="895.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end" font-weight="700">2025</text>
