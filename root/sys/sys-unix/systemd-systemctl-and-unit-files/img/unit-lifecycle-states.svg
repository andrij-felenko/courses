<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Діаграма станів юніта (ActiveState та SubState)</text>
<rect x="80.0" y="240.0" width="240.0" height="140.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="278.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">INACTIVE</tspan><tspan x="200.0" dy="18.2">(SubState: dead)</tspan><tspan x="200.0" dy="18.2"></tspan><tspan x="200.0" dy="18.2">Служба не виконується,</tspan><tspan x="200.0" dy="18.2">процеси відсутні</tspan></text>
<rect x="420.0" y="100.0" width="260.0" height="140.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="138.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">ACTIVATING</tspan><tspan x="550.0" dy="18.2">(SubState: start-pre, start)</tspan><tspan x="550.0" dy="18.2"></tspan><tspan x="550.0" dy="18.2">Виконуються командні рядки</tspan><tspan x="550.0" dy="18.2">ExecStartPre, ExecStart</tspan></text>
<rect x="780.0" y="240.0" width="260.0" height="140.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="910.0" y="278.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">ACTIVE</tspan><tspan x="910.0" dy="18.2">(SubState: running, exited)</tspan><tspan x="910.0" dy="18.2"></tspan><tspan x="910.0" dy="18.2">Головний процес працює або</tspan><tspan x="910.0" dy="18.2">oneshot успішно завершився</tspan></text>
<rect x="420.0" y="380.0" width="260.0" height="140.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="418.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">DEACTIVATING</tspan><tspan x="550.0" dy="18.2">(SubState: stop, stop-post)</tspan><tspan x="550.0" dy="18.2"></tspan><tspan x="550.0" dy="18.2">Виконуються ExecStop,</tspan><tspan x="550.0" dy="18.2">ExecStopPost</tspan></text>
<rect x="1100.0" y="240.0" width="240.0" height="140.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="1220.0" y="280.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1220.0" dy="0.0">FAILED</tspan><tspan x="1220.0" dy="16.9">(SubState: failed)</tspan><tspan x="1220.0" dy="16.9"></tspan><tspan x="1220.0" dy="16.9">Процес упав або повернув</tspan><tspan x="1220.0" dy="16.9">незапланований код помилки</tspan></text>
<line x1="200.0" y1="230.0" x2="410.0" y2="170.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="280.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">systemctl start / запуск</text>
<line x1="690.0" y1="170.0" x2="770.0" y2="230.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="750.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">успішний запуск</text>
<line x1="800.0" y1="390.0" x2="690.0" y2="430.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="770.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">systemctl stop</text>
<line x1="410.0" y1="430.0" x2="200.0" y2="390.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="280.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">зупинка завершена</text>
<line x1="690.0" y1="130.0" x2="1110.0" y2="230.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1040.0" y1="270.0" x2="1090.0" y2="270.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="960.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">аварія / помилка</text>
<line x1="1110.0" y1="380.0" x2="560.0" y2="400.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="850.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-style="italic">автоперезапуск (Restart=)</text>
</svg>