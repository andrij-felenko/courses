l(#arrow)"/><rect x="709.0" y="252.0" width="210.0" height="40.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="814.0" y="276.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="814.0" dy="0.0">IPI не треба</tspan></text><line x1="814.0" y1="294.0" x2="814.0" y2="322.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="709.0" y="324.0" width="210.0" height="90.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="814.0" y="357.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="814.0" dy="0.0">ядро не виконує коду,</tspan><tspan x="814.0" dy="15.6">тож і переставляти</tspan><tspan x="814.0" dy="15.6">нічого</tspan></text>
