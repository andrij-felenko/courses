<text x="610.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="610.0" dy="0.0">CPU активний, планувальник працює</tspan><tspan x="610.0" dy="13.7">Зависла конкретна задача</tspan></text>
<text x="610.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Рівень проблеми</text>
<text x="610.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="610.0" dy="0.0">TASK_UNINTERRUPTIBLE (D-state)</tspan><tspan x="610.0" dy="13.7">Блокування на I/O, NFS чи м'ютексі</tspan></text>
<text x="610.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Механізм виявлення</text>
<text x="610.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="610.0" dy="0.0">Демон ядра [khungtaskd]</tspan><tspan x="610.0" dy="13.7">(перевірка nvcsw + nivcsw)</tspan></text>
<text x="610.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Типовий поріг</text>
<text x="610.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="610.0" dy="0.0">hung_task_timeout_secs (типово: 120 с)</tspan></text>
<text x="610.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Наслідок / Реакція</text>
