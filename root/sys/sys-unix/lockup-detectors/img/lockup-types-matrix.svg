<text x="335.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="335.0" dy="0.0">IRQ увімкнено (таймери цокають)</tspan><tspan x="335.0" dy="13.7">Преемпцію вимкнено / немає yield</tspan></text>
