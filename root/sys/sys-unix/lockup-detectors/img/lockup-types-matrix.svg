<text x="335.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="335.0" dy="0.0">Нескінченний цикл у Ring 0 без schedule()</tspan><tspan x="335.0" dy="13.7">Голодування потоків користувача</tspan></text>
<text x="335.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700">Механізм виявлення</text>
<text x="335.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="335.0" dy="0.0">hrtimer + потік [watchdog/K]</tspan><tspan x="335.0" dy="13.7">(перевірка watchdog_touch_ts)</tspan></text>
<text x="335.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700">Типовий поріг</text>
<text x="335.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="335.0" dy="0.0">2 * watchdog_thresh (типово: 20 с)</tspan></text>
<text x="335.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700">Наслідок / Реакція</text>
<text x="335.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="335.0" dy="0.0">BUG: soft lockup - CPU#K stuck</tspan><tspan x="335.0" dy="13.7">Можлива паніка (softlockup_panic)</tspan></text>
