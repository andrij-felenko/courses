<text x="60.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">NMI Watchdog (perf_event)</tspan><tspan x="60.0" dy="13.7">Немасковані переривання NMI</tspan></text>
