<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівневі позначки вільної пам'яті й хто платить за прибирання</text>
<rect x="80.0" y="150.0" width="180.0" height="62.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/>
<text x="170.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">нижче min</text>
<rect x="260.0" y="150.0" width="220.0" height="62.0" rx="4" fill="#fdf6e3" stroke="#b7791f" stroke-width="1.7"/>
<text x="370.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b7791f" text-anchor="middle" font-weight="700">min … low</text>
<rect x="480.0" y="150.0" width="220.0" height="62.0" rx="4" fill="#eef7ff" stroke="#2457d6" stroke-width="1.7"/>
<text x="590.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">low … high</text>
<rect x="700.0" y="150.0" width="360.0" height="62.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/>
<text x="880.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">вище high</text>
<line x1="260.0" y1="132.0" x2="260.0" y2="236.0" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="260.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">min</text>
<line x1="480.0" y1="132.0" x2="480.0" y2="236.0" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="480.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">low</text>
<line x1="700.0" y1="132.0" x2="700.0" y2="236.0" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="4 4"/>
<text x="700.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">high</text>
<text x="80.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">вільної пам'яті обмаль</text>
<text x="1060.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">вільної пам'яті вдосталь</text>
<rect x="40.0" y="268.0" width="260.0" height="116.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">прохач витісняє сам —</tspan><tspan x="170.0" dy="15.6">прямий відбір його коштом;</tspan><tspan x="170.0" dy="15.6">не вийшло — OOM-вбивця</tspan></text>
<rect x="300.0" y="268.0" width="260.0" height="116.0" rx="6" fill="#fdf6e3" stroke="#b7791f" stroke-width="1.5"/><text x="430.0" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">kswapd вивільняє у фоні;</tspan><tspan x="430.0" dy="15.6">прохачі беруть із пулу</tspan><tspan x="430.0" dy="15.6">й нічого не помічають</tspan></text>
<rect x="580.0" y="268.0" width="260.0" height="116.0" rx="6" fill="#eef7ff" stroke="#2457d6" stroke-width="1.5"/><text x="710.0" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">розбуджений на low,</tspan><tspan x="710.0" dy="15.6">kswapd дотягує рівень</tspan><tspan x="710.0" dy="15.6">назад до high</tspan></text>
<rect x="860.0" y="268.0" width="240.0" height="116.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="980.0" y="330.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">ніхто нічого не робить</tspan></text>
<rect x="40.0" y="424.0" width="1060.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="570.0" y="468.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">kswapd прокидається на low і працює, доки не дотягне рівень до high</tspan><tspan x="570.0" dy="16.9">коли виділення випереджають його, рівень провалюється до min — і кожне наступне виділення саме йде в диск</tspan></text>
<text x="570.0" y="566.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">машина «встає» не тому, що диск повільний, а тому, що затримку диска приписали кожному, хто просить пам'ять</text>
</svg>