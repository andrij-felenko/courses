<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1186 802" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1186" height="802" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="588.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що означало слово «свопінг» у різні епохи лінії Unix</text>
<rect x="40.0" y="34.0" width="300.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="61.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">епоха</tspan></text>
<rect x="364.0" y="34.0" width="236.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="482.0" y="61.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="482.0" dy="0.0">одиниця витіснення</tspan></text>
<rect x="624.0" y="34.0" width="512.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="880.0" y="61.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">що з'явилося</tspan></text>
<rect x="40.0" y="90.0" width="300.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="136.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">1975 · Unix V6, PDP-11</tspan></text>
<rect x="364.0" y="90.0" width="236.0" height="84.0" rx="6" fill="#fdecea" stroke="#6b7280" stroke-width="1.3"/><text x="482.0" y="127.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="482.0" dy="0.0">образ процесу</tspan><tspan x="482.0" dy="18.2">цілком</tspan></text>
<rect x="624.0" y="90.0" width="512.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="880.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">нульовий процес перекачує образи через диск;</tspan><tspan x="880.0" dy="16.9">жертва — та, що найдовше просиділа в пам'яті</tspan></text>
<rect x="40.0" y="184.0" width="300.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="230.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">1979 · 3BSD, VAX-11/780</tspan></text>
<rect x="364.0" y="184.0" width="236.0" height="84.0" rx="6" fill="#eafaf0" stroke="#6b7280" stroke-width="1.3"/><text x="482.0" y="230.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="482.0" dy="0.0">сторінка</tspan></text>
<rect x="624.0" y="184.0" width="512.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="880.0" y="222.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">посторінкова підкачка (Джой, Бабаоглу);</tspan><tspan x="880.0" dy="16.9">біти звернення довелося імітувати програмно</tspan></text>
<rect x="40.0" y="278.0" width="300.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="324.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">2001 · Linux 2.4.10</tspan></text>
<rect x="364.0" y="278.0" width="236.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.3"/><text x="482.0" y="324.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="482.0" dy="0.0">сторінка</tspan></text>
<rect x="624.0" y="278.0" width="512.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="880.0" y="316.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">заміна підсистеми пам'яті посеред стабільної</tspan><tspan x="880.0" dy="16.9">гілки (Арканджелі замість ван Ріла)</tspan></text>
<rect x="40.0" y="372.0" width="300.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="418.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">2001–2004 · Linux 2.5–2.6</tspan></text>
<rect x="364.0" y="372.0" width="236.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.3"/><text x="482.0" y="418.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="482.0" dy="0.0">сторінка</tspan></text>
<rect x="624.0" y="372.0" width="512.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="880.0" y="410.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">зворотні відображення: rmap, далі об'єктні для</tspan><tspan x="880.0" dy="16.9">файлових (Маккракен) і anon_vma (Арканджелі)</tspan></text>
<rect x="40.0" y="466.0" width="300.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="512.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">2008 · Linux 2.6.28</tspan></text>
<rect x="364.0" y="466.0" width="236.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.3"/><text x="482.0" y="503.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="482.0" dy="0.0">сторінка</tspan><tspan x="482.0" dy="18.2">+ клас</tspan></text>
<rect x="624.0" y="466.0" width="512.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="880.0" y="504.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">окремі черги анонімних і файлових сторінок</tspan><tspan x="880.0" dy="16.9">(ван Ріл); незабирані — геть зі сканування</tspan></text>
<rect x="40.0" y="560.0" width="300.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="606.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">2014 · Linux 3.15</tspan></text>
<rect x="364.0" y="560.0" width="236.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.3"/><text x="482.0" y="597.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="482.0" dy="0.0">сторінка</tspan><tspan x="482.0" dy="18.2">+ історія</tspan></text>
<rect x="624.0" y="560.0" width="512.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="880.0" y="598.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">тінь у кеші й відстань повернення (Вайнер):</tspan><tspan x="880.0" dy="16.9">видно, що викинуто помилково</tspan></text>
<rect x="40.0" y="654.0" width="300.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="700.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">2022 · Linux 6.1</tspan></text>
<rect x="364.0" y="654.0" width="236.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.3"/><text x="482.0" y="691.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="482.0" dy="0.0">сторінка</tspan><tspan x="482.0" dy="18.2">+ покоління</tspan></text>
<rect x="624.0" y="654.0" width="512.0" height="84.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="880.0" y="692.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">багатопоколінна черга: замість двох черг —</tspan><tspan x="880.0" dy="16.9">покоління, а таблиці сторінок скануються прямо</tspan></text>
<text x="588.0" y="772.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">одиниця змінилася один раз — 1979 року; далі поглиблювався лише спосіб вибору</text>
</svg>