<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл транзакційного рушія PID 1 під час ізоляції (systemctl isolate)</text>
<rect x="50.0" y="100.0" width="280.0" height="160.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="142.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">1. Вхідна команда:</tspan><tspan x="190.0" dy="16.9">systemctl isolate kiosk.target</tspan><tspan x="190.0" dy="16.9"></tspan><tspan x="190.0" dy="16.9">(або D-Bus метод</tspan><tspan x="190.0" dy="16.9">StartUnit(&quot;kiosk.target&quot;,</tspan><tspan x="190.0" dy="16.9">&quot;isolate&quot;))</tspan></text>
<rect x="380.0" y="100.0" width="280.0" height="160.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="142.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">2. Перевірка прапорця:</tspan><tspan x="520.0" dy="16.9">AllowIsolate=yes</tspan><tspan x="520.0" dy="16.9"></tspan><tspan x="520.0" dy="16.9">Якщо AllowIsolate=no -&gt;</tspan><tspan x="520.0" dy="16.9">Транзакцію скасовується</tspan><tspan x="520.0" dy="16.9">з помилкою!</tspan></text>
<rect x="710.0" y="100.0" width="320.0" height="160.0" rx="6" fill="#f3e5f5" stroke="#333333" stroke-width="1.5"/><text x="870.0" y="150.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">3. Побудова транзакції в PID 1:</tspan><tspan x="870.0" dy="16.9"></tspan><tspan x="870.0" dy="16.9">- Обчислення графа kiosk.target</tspan><tspan x="870.0" dy="16.9">- Формування JOB_START для потрібних</tspan><tspan x="870.0" dy="16.9">- Формування JOB_STOP для зайвих</tspan></text>
<rect x="1080.0" y="100.0" width="270.0" height="160.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1215.0" y="150.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1215.0" dy="0.0">4. Перевірка захисту:</tspan><tspan x="1215.0" dy="16.9">IgnoreOnIsolate=yes</tspan><tspan x="1215.0" dy="16.9"></tspan><tspan x="1215.0" dy="16.9">(journald, dbus, sysinit</tspan><tspan x="1215.0" dy="16.9">НЕ зупиняються!)</tspan></text>
<line x1="330.0" y1="180.0" x2="380.0" y2="180.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="660.0" y1="180.0" x2="710.0" y2="180.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="1030.0" y1="180.0" x2="1080.0" y2="180.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="320.0" width="1300.0" height="300.0" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="700.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виконання робіт у транзакційній черзі (Job Queue)</text>
<rect x="80.0" y="390.0" width="370.0" height="200.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="452.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Роботи активації (JOB_START):</tspan><tspan x="265.0" dy="16.9"></tspan><tspan x="265.0" dy="16.9">- kiosk.target</tspan><tspan x="265.0" dy="16.9">- kiosk-browser.service</tspan><tspan x="265.0" dy="16.9">- kiosk-watchdog.service</tspan><tspan x="265.0" dy="16.9">- multi-user.target (залежність)</tspan></text>
<rect x="510.0" y="390.0" width="380.0" height="200.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="452.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Роботи зупинки (JOB_STOP):</tspan><tspan x="700.0" dy="16.9"></tspan><tspan x="700.0" dy="16.9">- graphical.target</tspan><tspan x="700.0" dy="16.9">- gdm.service / display-manager</tspan><tspan x="700.0" dy="16.9">- user-session.slice</tspan><tspan x="700.0" dy="16.9">- службові фонові юніти вне графа</tspan></text>
<rect x="930.0" y="390.0" width="390.0" height="200.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="1125.0" y="452.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1125.0" dy="0.0">Захищені збережені юніти:</tspan><tspan x="1125.0" dy="16.9"></tspan><tspan x="1125.0" dy="16.9">- systemd-journald.service</tspan><tspan x="1125.0" dy="16.9">- dbus.service</tspan><tspan x="1125.0" dy="16.9">- sysinit.target / basic.target</tspan><tspan x="1125.0" dy="16.9">- Точки монтування дискових масивів</tspan></text>
</svg>