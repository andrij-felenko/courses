<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спрямований ациклічний граф (DAG) завантажувальних таргетів systemd</text>
<rect x="50.0" y="100.0" width="260.0" height="110.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="125.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">1. Раннє завантаження:</tspan><tspan x="180.0" dy="16.9">sysinit.target</tspan><tspan x="180.0" dy="16.9"></tspan><tspan x="180.0" dy="16.9">(ФС /, swap, sysctl,</tspan><tspan x="180.0" dy="16.9">udev, LVM, crypto)</tspan></text>
<rect x="370.0" y="100.0" width="260.0" height="80.0" rx="6" fill="#f3e5f5" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Допоміжні майлстоуни:</tspan><tspan x="500.0" dy="16.9">sockets.target</tspan></text>
<rect x="370.0" y="200.0" width="260.0" height="80.0" rx="6" fill="#f3e5f5" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="236.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Допоміжні майлстоуни:</tspan><tspan x="500.0" dy="16.9">timers.target</tspan></text>
<rect x="370.0" y="300.0" width="260.0" height="80.0" rx="6" fill="#f3e5f5" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Допоміжні майлстоуни:</tspan><tspan x="500.0" dy="16.9">paths.target</tspan></text>
<rect x="370.0" y="400.0" width="260.0" height="80.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="436.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Точка синхронізації:</tspan><tspan x="500.0" dy="16.9">network.target</tspan></text>
<rect x="690.0" y="200.0" width="280.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="223.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">2. Базовий стан системи:</tspan><tspan x="830.0" dy="18.2">basic.target</tspan><tspan x="830.0" dy="18.2"></tspan><tspan x="830.0" dy="18.2">(Усі таймери, сокети та</tspan><tspan x="830.0" dy="18.2">локальні ФС активні)</tspan></text>
<rect x="1040.0" y="140.0" width="310.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1195.0" y="163.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1195.0" dy="0.0">3. Консольний режим (CLI):</tspan><tspan x="1195.0" dy="18.2">multi-user.target</tspan><tspan x="1195.0" dy="18.2"></tspan><tspan x="1195.0" dy="18.2">(Мережеві демони, SSH,</tspan><tspan x="1195.0" dy="18.2">TTY, cron, користувачі)</tspan></text>
<rect x="1040.0" y="340.0" width="310.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1195.0" y="363.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1195.0" dy="0.0">4. Графічний режим (GUI):</tspan><tspan x="1195.0" dy="18.2">graphical.target</tspan><tspan x="1195.0" dy="18.2"></tspan><tspan x="1195.0" dy="18.2">(Дисплейний менеджер,</tspan><tspan x="1195.0" dy="18.2">Wayland/X11 сесія)</tspan></text>
<rect x="1040.0" y="520.0" width="310.0" height="90.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1195.0" y="544.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1195.0" dy="0.0">Активна мережева точка:</tspan><tspan x="1195.0" dy="16.9">network-online.target</tspan><tspan x="1195.0" dy="16.9"></tspan><tspan x="1195.0" dy="16.9">(IP піднято, маршрут є)</tspan></text>
<line x1="310.0" y1="155.0" x2="370.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="310.0" y1="155.0" x2="370.0" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="310.0" y1="155.0" x2="370.0" y2="340.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
