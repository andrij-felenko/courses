<line x1="630.0" y1="140.0" x2="690.0" y2="235.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="630.0" y1="240.0" x2="690.0" y2="255.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="630.0" y1="340.0" x2="690.0" y2="275.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="970.0" y1="240.0" x2="1040.0" y2="195.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="1005.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">After/Wants</text>
<line x1="1195.0" y1="250.0" x2="1195.0" y2="340.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="1217.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">After/Wants</text>
<line x1="630.0" y1="440.0" x2="1040.0" y2="565.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="630.0" width="1300.0" height="65.0" rx="6" fill="#eceff1" stroke="#cfd8dc" stroke-width="1.0"/>
<text x="700.0" y="665.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Порядок запуску визначається директивою After=, а склад залежностей — Wants= / Requires=.
Вузли .target не містять ExecStart= та виконують роль чистих груп синхронізації.</text>
</svg>