<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Статичний аналіз сценаріїв через ShellCheck</text>
<rect x="50.0" y="35.0" width="1100.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="68.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Статичний аналіз ShellCheck: перетворення сценарію на абстрактне синтаксичне дерево та виявлення типових пасток</tspan></text>
<rect x="60.0" y="115.0" width="330.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="225.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">Вихідний скрипт</tspan><tspan x="225.0" dy="18.2">.sh / .bash</tspan></text>
<line x1="225.0" y1="190.0" x2="225.0" y2="230.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="235.0" width="330.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="225.0" y="267.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Лексичний і синтаксичний аналізатор</tspan><tspan x="225.0" dy="16.9">Побудова AST з урахуванням діалекту</tspan><tspan x="225.0" dy="16.9">(sh, bash, dash, ksh)</tspan></text>
<line x1="225.0" y1="330.0" x2="225.0" y2="370.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="375.0" width="330.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="225.0" y="410.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">Аналізатор контекстів і потоків</tspan><tspan x="225.0" dy="15.6">Перевірка розщеплення слів, масок,</tspan><tspan x="225.0" dy="15.6">маскування статусів, помилок синтаксису</tspan><tspan x="225.0" dy="15.6">та переносимості</tspan></text>
<line x1="225.0" y1="490.0" x2="225.0" y2="530.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="535.0" width="330.0" height="90.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="225.0" y="567.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Генератор звітів</tspan><tspan x="225.0" dy="16.9">Діагностика: помилка, попередження,</tspan><tspan x="225.0" dy="16.9">інформація, автофікс у форматі diff</tspan></text>
<rect x="430.0" y="115.0" width="730.0" height="120.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="795.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">SC2086: Unquoted Variable</tspan><tspan x="795.0" dy="16.9"></tspan><tspan x="795.0" dy="16.9">rm -rf $DIR  →  rm -rf &quot;$DIR&quot;</tspan><tspan x="795.0" dy="16.9">Запобігання розбиттю слів та розгортанню масок у шляхах із пробілами</tspan></text>
<rect x="430.0" y="251.0" width="730.0" height="120.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="795.0" y="290.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">SC2046: Unquoted Command Expansion</tspan><tspan x="795.0" dy="16.9"></tspan><tspan x="795.0" dy="16.9">for f in $(find .)  →  while IFS= read -r f; do ...</tspan><tspan x="795.0" dy="16.9">Підстановка команди розщеплюється за символами IFS</tspan></text>
<rect x="430.0" y="387.0" width="730.0" height="120.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="795.0" y="426.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">SC2155: Masked Return Value</tspan><tspan x="795.0" dy="16.9"></tspan><tspan x="795.0" dy="16.9">local x=$(failing_cmd)  →  local x; x=$(failing_cmd)</tspan><tspan x="795.0" dy="16.9">Оголошення local маскує ненульовий код повернення команди</tspan></text>
<rect x="430.0" y="523.0" width="730.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="795.0" y="570.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">SC2168: Invalid Local Scope</tspan><tspan x="795.0" dy="16.9"></tspan><tspan x="795.0" dy="16.9">local my_var=1 на рівні файлу поза функцією викликає помилку виконання</tspan></text>
<rect x="60.0" y="665.0" width="1100.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="706.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Інтеграція в CI: `shellcheck -f gcc scripts/*.sh` повертає ненульовий код виходу при виявленні дефектів, блокуючи злиття небезпечного коду до запуску тестів</tspan></text>
</svg>