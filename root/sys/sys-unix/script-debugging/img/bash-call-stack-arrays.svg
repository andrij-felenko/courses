<rect x="60.0" y="465.0" width="1100.0" height="120.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="610.0" y="504.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Правило адресації виклику в Bash:</tspan><tspan x="610.0" dy="16.9">• FUNCNAME[0] — поточна активна функція, де виникла подія;</tspan><tspan x="610.0" dy="16.9">• BASH_SOURCE[1] та BASH_LINENO[0] — файл і номер рядка, ЗВІДКИ її викликали;</tspan><tspan x="610.0" dy="16.9">• Змінна BASH_COMMAND містить сирий текст команди, яка зазнала невдачі ($? != 0).</tspan></text>
<rect x="60.0" y="605.0" width="1100.0" height="135.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="629.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Формування текстового бектрейсу в обробнику trap '...' ERR:</tspan><tspan x="610.0" dy="15.6">for ((i=1; i&lt;${#FUNCNAME[@]}; i++)); do</tspan><tspan x="610.0" dy="15.6">    caller_func=&quot;${FUNCNAME[$i]}&quot;</tspan><tspan x="610.0" dy="15.6">    caller_file=&quot;${BASH_SOURCE[$i]}&quot;</tspan><tspan x="610.0" dy="15.6">    caller_line=&quot;${BASH_LINENO[$((i-1))]}&quot;</tspan><tspan x="610.0" dy="15.6">    echo &quot;  at ${caller_func}() [${caller_file}:${caller_line}]&quot;</tspan><tspan x="610.0" dy="15.6">done</tspan></text>
</svg>