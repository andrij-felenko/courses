<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 850" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="850" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр інтерпретації команди та точки діагностики</text>
<rect x="50.0" y="35.0" width="1100.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="67.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Конвеєр обробки інструкції інтерпретатором Bash: від сирого тексту до системного виклику й точок вклинення діагностики</tspan></text>
<rect x="70.0" y="115.0" width="340.0" height="86.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="240.0" y="162.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">1. Читання та синтаксичний аналіз</tspan></text>
<rect x="425.0" y="115.0" width="705.0" height="86.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="777.5" y="154.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="777.5" dy="0.0">Парсинг тексту, побудова граматичного дерева команд</tspan><tspan x="777.5" dy="16.9">Тут діє bash -n (noexec): зупиняє конвеєр без виконання</tspan></text>
<line x1="600.0" y1="204.0" x2="600.0" y2="224.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="227.0" width="340.0" height="86.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="274.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">2. Розгортання (Expansions)</tspan></text>
<rect x="425.0" y="227.0" width="705.0" height="86.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="777.5" y="266.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="777.5" dy="0.0">Розкриття дужок {}, параметрів $VAR, підстановка команд $(...),</tspan><tspan x="777.5" dy="16.9">арифметика $((...)), поділ на слова IFS та розгортання масок *</tspan></text>
<line x1="600.0" y1="316.0" x2="600.0" y2="336.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="339.0" width="340.0" height="86.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="240.0" y="386.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">3. Точка перехоплення trap '...' DEBUG</tspan></text>
<rect x="425.0" y="339.0" width="705.0" height="86.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="777.5" y="378.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="777.5" dy="0.0">Виконується ПЕРЕД викликом команди. Змінна $BASH_COMMAND</tspan><tspan x="777.5" dy="16.9">містить текст наступної інструкції до виконання</tspan></text>
<line x1="600.0" y1="428.0" x2="600.0" y2="448.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="451.0" width="340.0" height="86.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="240.0" y="498.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">4. Трасування xtrace (set -x)</tspan></text>
<rect x="425.0" y="451.0" width="705.0" height="86.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="777.5" y="490.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="777.5" dy="0.0">Розгортання префіксу PS4 (час, файл, рядок, функція) та вивід</tspan><tspan x="777.5" dy="16.9">повного розгорнутого вектора команди в stderr або BASH_XTRACEFD</tspan></text>
<line x1="600.0" y1="540.0" x2="600.0" y2="560.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="563.0" width="340.0" height="86.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="610.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">5. Виконання команди</tspan></text>
<rect x="425.0" y="563.0" width="705.0" height="86.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="777.5" y="602.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="777.5" dy="0.0">Вбудована функція/builtin або виклик ядрового fork() + execve().</tspan><tspan x="777.5" dy="16.9">Формування кінцевого коду завершення $? (0..255)</tspan></text>
<line x1="600.0" y1="652.0" x2="600.0" y2="672.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="675.0" width="340.0" height="86.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="722.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">6. Точка перехоплення trap '...' ERR</tspan></text>
<rect x="425.0" y="675.0" width="705.0" height="86.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="777.5" y="714.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="777.5" dy="0.0">Спрацьовує автоматично при $? != 0 (якщо не в умовах if/while/||).</tspan><tspan x="777.5" dy="16.9">Дозволяє надрукувати стек викликів та аварійний стан</tspan></text>
<rect x="50.0" y="755.0" width="1100.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="785.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Прапорці set -T (functrace) та set -E (errtrace) змушують пастки DEBUG та ERR успадковуватися функціями та підоболонками</tspan></text>
</svg>