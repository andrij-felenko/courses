<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="36.0" y="48.0" width="440.0" height="336.0" rx="10" fill="#fbfcfd" stroke="#c3c9d1" stroke-width="1.4"/>
<text x="60.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Резервація буфера</text>
<rect x="60.0" y="100.0" width="392.0" height="52.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="256.0" y="130.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="256.0" dy="0.0">службова — ядро переносить буфер</tspan></text>
<rect x="60.0" y="168.0" width="392.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="256.0" y="198.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="256.0" dy="0.0">запис — камера заповнює кадр</tspan></text>
<rect x="60.0" y="236.0" width="392.0" height="52.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="256.0" y="266.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="256.0" dy="0.0">читання — обчислювач читає</tspan></text>
<rect x="60.0" y="300.0" width="392.0" height="52.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="256.0" y="330.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="256.0" dy="0.0">читання — дисплей виводить</tspan></text>
<rect x="560.0" y="96.0" width="420.0" height="96.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="140.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Збираюся читати</tspan><tspan x="770.0" dy="16.9">чекаю на записувачів і на службові</tspan></text>
<rect x="560.0" y="240.0" width="420.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="284.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Збираюся писати</tspan><tspan x="770.0" dy="16.9">чекаю на всіх без винятку</tspan></text>
<text x="36.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Позначка призначення — обіцянка на майбутнє: що власник огорожі збирається робити з буфером.</text>
</svg>