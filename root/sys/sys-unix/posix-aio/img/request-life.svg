<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один запит aio: від подання до забирання результату</text>
<rect x="40.0" y="62.0" width="220.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="89.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">aio_read(&amp;cb)</tspan><tspan x="150.0" dy="16.9">повертається одразу</tspan></text>
<rect x="290.0" y="62.0" width="210.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="395.0" y="89.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">aio_error(&amp;cb)</tspan><tspan x="395.0" dy="16.9">= EINPROGRESS</tspan></text>
<rect x="530.0" y="62.0" width="220.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="89.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">операція скінчилась</tspan><tspan x="640.0" dy="16.9">десь усередині</tspan></text>
<rect x="790.0" y="62.0" width="190.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="885.0" y="89.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">aio_return(&amp;cb)</tspan><tspan x="885.0" dy="16.9">результат і звільнення</tspan></text>
<line x1="260.0" y1="93.0" x2="290.0" y2="93.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="500.0" y1="93.0" x2="530.0" y2="93.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="750.0" y1="93.0" x2="790.0" y2="93.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40.0" y="152.0" width="940.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="510.0" y="178.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">увесь цей час aiocb, буфер і дескриптор належать реалізації:</tspan><tspan x="510.0" dy="16.9">не звільняти, не перезаписувати, не закривати, не подавати вдруге</tspan></text>
<text x="40.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">три способи дізнатися, що запит скінчився</text>
<rect x="40.0" y="272.0" width="296.0" height="32.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="188.0" y="292.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="188.0" dy="0.0">опитування</tspan></text>
<rect x="40.0" y="312.0" width="296.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="188.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="188.0" dy="0.0">aio_error() у циклі:</tspan><tspan x="188.0" dy="15.6">просто, але марно</tspan><tspan x="188.0" dy="15.6">палить процесор</tspan></text>
<rect x="356.0" y="272.0" width="296.0" height="32.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="504.0" y="292.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="504.0" dy="0.0">чекання</tspan></text>
<rect x="356.0" y="312.0" width="296.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="504.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="504.0" dy="0.0">aio_suspend(list, n, t):</tspan><tspan x="504.0" dy="15.6">сон до першого</tspan><tspan x="504.0" dy="15.6">завершення зі списку</tspan></text>
<rect x="672.0" y="272.0" width="308.0" height="32.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="826.0" y="292.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="826.0" dy="0.0">сповіщення</tspan></text>
<rect x="672.0" y="312.0" width="308.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="826.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="826.0" dy="0.0">aio_sigevent:</tspan><tspan x="826.0" dy="15.6">сигнал або виклик</tspan><tspan x="826.0" dy="15.6">функції в новому потоці</tspan></text>
<rect x="40.0" y="404.0" width="940.0" height="40.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="510.0" y="428.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">результат бере лише aio_return, і лише один раз: не забрати — лишити запит незакритим</tspan></text>
</svg>