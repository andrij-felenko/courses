<rect x="540.0" y="320.0" width="460.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="349.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">пул за замовчуванням — 20 потоків;</tspan><tspan x="770.0" dy="16.9">21-й запит просто чекає, помилки немає</tspan></text>
<rect x="40.0" y="410.0" width="960.0" height="48.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="438.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">системного виклику aio_read у Linux не існує: під сподом звичайні pread, pwrite і fsync</tspan></text>
