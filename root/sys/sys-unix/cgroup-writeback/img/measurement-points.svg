<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де шукати відповідь на кожне питання про облік буферизованого запису</text>
<text x="650.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">чотири лічильники на шляху одного мегабайта — і місце, де облік міняє одиницю</text>
<rect x="50.0" y="80.0" width="250.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="175.0" y="121.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">процес групи B</tspan><tspan x="175.0" dy="16.9">виконує write()</tspan></text>
<rect x="370.0" y="80.0" width="250.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="495.0" y="121.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="495.0" dy="0.0">сторінка кешу</tspan><tspan x="495.0" dy="16.9">стає брудною</tspan></text>
<rect x="690.0" y="80.0" width="250.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="815.0" y="121.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">inode потрапляє</tspan><tspan x="815.0" dy="16.9">у список одного wb</tspan></text>
<rect x="1010.0" y="80.0" width="250.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="1135.0" y="121.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1135.0" dy="0.0">bio лягає</tspan><tspan x="1135.0" dy="16.9">в чергу пристрою</tspan></text>
<line x1="306.0" y1="125.0" x2="364.0" y2="125.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="626.0" y1="125.0" x2="684.0" y2="125.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="946.0" y1="125.0" x2="1004.0" y2="125.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="250.0" width="250.0" height="108.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="175.0" y="284.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">секундомір писаря</tspan><tspan x="175.0" dy="15.6">time ./dirtier</tspan><tspan x="175.0" dy="15.6">сповільнюється, коли</tspan><tspan x="175.0" dy="15.6">спрацював зворотний зв'язок</tspan></text>
<rect x="370.0" y="250.0" width="250.0" height="108.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="495.0" y="284.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">memory.stat групи B</tspan><tspan x="495.0" dy="15.6">file_dirty / file_writeback</tspan><tspan x="495.0" dy="15.6">облік ПОСТОРІНКОВИЙ:</tspan><tspan x="495.0" dy="15.6">чия сторінка — тій і лічать</tspan></text>
<rect x="690.0" y="250.0" width="250.0" height="108.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="815.0" y="284.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">wb_stats пристрою</tspan><tspan x="815.0" dy="15.6">WbCgIno та b_dirty</tspan><tspan x="815.0" dy="15.6">облік ПОІНОДНИЙ:</tspan><tspan x="815.0" dy="15.6">власник один на весь файл</tspan></text>
<rect x="1010.0" y="250.0" width="250.0" height="108.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1135.0" y="284.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1135.0" dy="0.0">io.stat групи-власниці</tspan><tspan x="1135.0" dy="15.6">wbytes / wios</tspan><tspan x="1135.0" dy="15.6">сюди приходить</tspan><tspan x="1135.0" dy="15.6">увесь рахунок</tspan></text>
<line x1="175.0" y1="176.0" x2="175.0" y2="244.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="495.0" y1="176.0" x2="495.0" y2="244.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="815.0" y1="176.0" x2="815.0" y2="244.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1135.0" y1="176.0" x2="1135.0" y2="244.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="655.0" y1="66.0" x2="655.0" y2="378.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="7,5"/>
<text x="655.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">тут облік міняє одиницю: сторінка знає власника, а записують назад цілий inode</text>
<text x="655.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">розбіжність лічильників ліворуч і праворуч від цієї межі — не хиба вимірювання, а сам механізм</text>
</svg>