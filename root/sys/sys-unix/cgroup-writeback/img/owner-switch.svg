<text x="625.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коли inode переходить до групи, що бруднить його найбільше</text>
<text x="625.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">вікно історії inode: 2 секунди, шістнадцять комірок по 125 мс</text>
