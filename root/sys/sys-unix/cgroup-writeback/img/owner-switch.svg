<rect x="90.0" y="204.0" width="390.0" height="62.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="285.0" y="231.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">давній власник</tspan><tspan x="285.0" dy="15.6">утримує 6 комірок</tspan></text>
<rect x="486.0" y="204.0" width="324.0" height="62.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.4"/><text x="648.0" y="231.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="648.0" dy="0.0">перший обхід чужої групи:</tspan><tspan x="648.0" dy="15.6">не більш ніж 5 комірок</tspan></text>
<rect x="816.0" y="204.0" width="324.0" height="62.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.4"/><text x="978.0" y="231.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="978.0" dy="0.0">другий обхід:</tspan><tspan x="978.0" dy="15.6">ще 5 — разом 10</tspan></text>
<rect x="90.0" y="310.0" width="1050.0" height="76.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="615.0" y="344.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">межа — понад 8 комірок із 16: чужа група тримала inode більш ніж половину вікна,</tspan><tspan x="615.0" dy="16.9">і аж тоді ядро переписує власника на неї</tspan></text>
<text x="625.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">один обхід не здатний відібрати inode: щоб набрати 9, потрібні щонайменше два —</text>
<text x="625.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">поодинокий сплеск чужого запису власника не міняє, стала течія міняє за секунду</text>
