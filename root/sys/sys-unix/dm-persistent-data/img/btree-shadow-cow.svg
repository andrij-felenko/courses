<line x1="1230.0" y1="325.0" x2="1250.0" y2="400.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="730.0" y="400.0" width="120.0" height="60.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="790.0" y="426.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Листок L1</tspan><tspan x="790.0" dy="14.3">[блок 71]</tspan></text>
<rect x="870.0" y="400.0" width="120.0" height="60.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="930.0" y="426.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">Листок L2</tspan><tspan x="930.0" dy="14.3">[блок 72]</tspan></text>
<rect x="1040.0" y="400.0" width="120.0" height="60.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1100.0" y="426.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1100.0" dy="0.0">Листок L3</tspan><tspan x="1100.0" dy="14.3">[блок 85]</tspan></text>
<rect x="1190.0" y="400.0" width="120.0" height="60.0" rx="6" fill="#fff6e5" stroke="#c0392b" stroke-width="1.8"/><text x="1250.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1250.0" dy="0.0">Новий L4'</tspan><tspan x="1250.0" dy="13.0">[блок 104, ТІНЬ]</tspan></text>
<rect x="740.0" y="500.0" width="560.0" height="165.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="1020.0" y="555.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">Підсумок тіньового переписування (Copy-on-Write):</tspan><tspan x="1020.0" dy="15.6">• Гілка A1 (блоки 34, 71, 72) не змінювалась і розділяється між деревами</tspan><tspan x="1020.0" dy="15.6">• Листок L3 (блок 85) не змінювався і перевикористовується новим B2</tspan><tspan x="1020.0" dy="15.6">• До миті запису Суперблоку диск адресує R1; аварія поверне стан R1</tspan><tspan x="1020.0" dy="15.6">• Після запису Суперблоку активним стає R2, а блоки 12, 58, 89 звільняються</tspan></text>
<rect x="60.0" y="710.0" width="1260.0" height="65.0" rx="6" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.6"/><text x="690.0" y="746.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Інваріант стійкості: жоден блок, на який посилається зафіксований на диску суперблок, ніколи не змінюється на місці. Будь-яка зміна породжує нову гілку, роблячи дерево самодостатнім і стійким до аварій.</tspan></text>
</svg>