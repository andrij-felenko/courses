<rect x="380.0" y="400.0" width="130.0" height="60.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="445.0" y="426.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">Листок L3</tspan><tspan x="445.0" dy="14.3">[блок 85]</tspan></text>
<rect x="530.0" y="400.0" width="120.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="590.0" y="426.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Листок L4</tspan><tspan x="590.0" dy="14.3">[блок 89]</tspan></text>
<rect x="80.0" y="500.0" width="560.0" height="165.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="360.0" y="555.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Ціль: оновити відображення у листку L4.</tspan><tspan x="360.0" dy="15.6">• Замість перезапису блока 89 виділяється новий вільний блок 104</tspan><tspan x="360.0" dy="15.6">• Вузол B1 мусить отримати нову адресу листка → копіюється у блок 105 (B2)</tspan><tspan x="360.0" dy="15.6">• Корінь R1 мусить отримати адресу B2 → копіюється у блок 106 (R2)</tspan><tspan x="360.0" dy="15.6">• Усі старі блоки (12, 58, 89) залишаються недоторканими на диску!</tspan></text>
<rect x="720.0" y="80.0" width="600.0" height="610.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="1020.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">СТАН ПІСЛЯ ТІНЮВАННЯ (Підготовка транзакції N+1)</text>
<rect x="920.0" y="135.0" width="200.0" height="55.0" rx="6" fill="#fff6e5" stroke="#c0392b" stroke-width="1.8"/><text x="1020.0" y="158.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1020.0" dy="0.0">Новий Корінь R2</tspan><tspan x="1020.0" dy="15.6">[блок 106, ТІНЬ]</tspan></text>
