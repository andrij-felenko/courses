<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1390 850" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1390" height="850" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="60.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Двофазний протокол фіксації (dm_tm_commit): як гарантується атомарність без журналу</text>
<rect x="60.0" y="80.0" width="400.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="260.0" y="110.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Фаза 1: Скидання тіньових метаданих</tspan></text>
<rect x="60.0" y="148.0" width="400.0" height="56.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/><text x="260.0" y="180.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">1. Завершення мутацій у RAM</tspan></text>
<rect x="60.0" y="214.0" width="400.0" height="56.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/><text x="260.0" y="246.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">2. dm_sm_commit(sm_metadata)</tspan></text>
<rect x="60.0" y="280.0" width="400.0" height="56.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/><text x="260.0" y="312.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">3. dm_sm_commit(sm_disk)</tspan></text>
<rect x="60.0" y="346.0" width="400.0" height="56.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/><text x="260.0" y="378.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">4. dm_bm_flush(bm)</tspan></text>
<rect x="60.0" y="412.0" width="400.0" height="56.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.3"/><text x="260.0" y="436.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Змінені 4 КіБ блоки та space map</tspan><tspan x="260.0" dy="15.6">записуються у вільні блоки носія</tspan></text>
<rect x="60.0" y="500.0" width="400.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="260.0" y="545.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Якщо живлення зникне тут:</tspan><tspan x="260.0" dy="15.6">Суперблок ще вказує на корінь R1.</tspan><tspan x="260.0" dy="15.6">Записані нові блоки вважаються сміттям</tspan><tspan x="260.0" dy="15.6">і безпечно ігноруються. Нуль пошкоджень.</tspan></text>
<rect x="490.0" y="80.0" width="400.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="690.0" y="110.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">Бар'єр I/O та синхронізація</tspan></text>
<rect x="490.0" y="148.0" width="400.0" height="56.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="690.0" y="180.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">1. Очікування завершення I/O</tspan></text>
<rect x="490.0" y="214.0" width="400.0" height="56.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="690.0" y="246.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">2. REQ_PREFLUSH на диск</tspan></text>
<rect x="490.0" y="280.0" width="400.0" height="56.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="690.0" y="304.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">3. Гарантія, що блоки фізично</tspan><tspan x="690.0" dy="15.6">   записані на енергонезалежний носій</tspan></text>
<rect x="490.0" y="346.0" width="400.0" height="56.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="690.0" y="370.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">4. Підготовка блоку 0 (Суперблок)</tspan><tspan x="690.0" dy="15.6">   із новим transaction_id = N+1</tspan></text>
<rect x="490.0" y="412.0" width="400.0" height="56.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="690.0" y="444.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Розрахунок CRC32c для Суперблоку</tspan></text>
<rect x="490.0" y="500.0" width="400.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="690.0" y="545.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Апаратний бар'єр кешу:</tspan><tspan x="690.0" dy="15.6">Контролер диска не має права</tspan><tspan x="690.0" dy="15.6">переставити запис Суперблоку</tspan><tspan x="690.0" dy="15.6">перед записом самих блоків дерева!</tspan></text>
<rect x="920.0" y="80.0" width="400.0" height="52.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="1120.0" y="110.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1120.0" dy="0.0">Фаза 2: Атомарна зміна суперблоку</tspan></text>
<rect x="920.0" y="148.0" width="400.0" height="56.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="1120.0" y="180.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1120.0" dy="0.0">1. Запис Суперблоку в блок 0</tspan></text>
<rect x="920.0" y="214.0" width="400.0" height="56.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="1120.0" y="246.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1120.0" dy="0.0">2. REQ_FUA (Force Unit Access)</tspan></text>
<rect x="920.0" y="280.0" width="400.0" height="56.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="1120.0" y="312.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1120.0" dy="0.0">3. Оновлення кореня на R2</tspan></text>
<rect x="920.0" y="346.0" width="400.0" height="56.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="1120.0" y="378.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1120.0" dy="0.0">4. Інкремент transaction_id</tspan></text>
<rect x="920.0" y="412.0" width="400.0" height="56.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="1120.0" y="436.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1120.0" dy="0.0">5. Звільнення старих блоків</tspan><tspan x="1120.0" dy="15.6">   у space map для наступних дій</tspan></text>
<rect x="920.0" y="500.0" width="400.0" height="130.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="1120.0" y="545.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1120.0" dy="0.0">Якщо живлення зникне тут:</tspan><tspan x="1120.0" dy="15.6">Після завершення FUA новий суперблок на диску.</tspan><tspan x="1120.0" dy="15.6">При завантаженні ядро відкриє стан R2.</tspan><tspan x="1120.0" dy="15.6">Транзакція повністю успішна.</tspan></text>
<rect x="60.0" y="650.0" width="1260.0" height="155.0" rx="8" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="80.0" y="678.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">ТОЧКА АТОМАРНОГО ПЕРЕХОДУ (BARRIER / SUPERBLOCK FLUSH)</text>
<rect x="80.0" y="695.0" width="590.0" height="95.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="375.0" y="723.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">ДО ЗАПИСУ БЛОКУ 0:</tspan><tspan x="375.0" dy="15.6">• transaction_id = N, корінь = R1, valid CRC32c</tspan><tspan x="375.0" dy="15.6">• Будь-який збій → відкат до консистентного стану N</tspan><tspan x="375.0" dy="15.6">• Непотрібні shadow-блоки безпечно ігноруються</tspan></text>
<rect x="710.0" y="695.0" width="590.0" height="95.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="1005.0" y="723.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1005.0" dy="0.0">ПІСЛЯ ЗАПИСУ БЛОКУ 0 (FUA OK):</tspan><tspan x="1005.0" dy="15.6">• transaction_id = N+1, корінь = R2, valid CRC32c</tspan><tspan x="1005.0" dy="15.6">• Будь-який збій → старт із консистентного стану N+1</tspan><tspan x="1005.0" dy="15.6">• Транзакція зафіксована на 100% без жодного журналу / WAL</tspan></text>
</svg>