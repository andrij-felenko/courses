<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="40.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">як роблять — і чому не працює</text>
<rect x="40.0" y="56.0" width="250.0" height="96.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="99.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">подія add</tspan><tspan x="165.0" dy="18.2">про ttyUSB0</tspan></text>
<line x1="298.0" y1="104.0" x2="326.0" y2="104.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="334.0" y="56.0" width="250.0" height="96.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="459.0" y="99.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="459.0" dy="0.0">правило:</tspan><tspan x="459.0" dy="18.2">RUN+=&quot;…/agent &amp;&quot;</tspan></text>
<line x1="592.0" y1="104.0" x2="620.0" y2="104.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="628.0" y="56.0" width="250.0" height="96.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="753.0" y="99.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="753.0" dy="0.0">агент працює</tspan><tspan x="753.0" dy="18.2">усередині події</tspan></text>
<line x1="886.0" y1="104.0" x2="914.0" y2="104.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="922.0" y="56.0" width="250.0" height="96.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="1047.0" y="90.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1047.0" dy="0.0">подію завершено —</tspan><tspan x="1047.0" dy="18.2">усе, що породив</tspan><tspan x="1047.0" dy="18.2">робочий процес, убито</tspan></text>
<text x="620.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">ліміт події 180 с   ·   пісочниця без мережі й монтування</text>
<text x="40.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">як передають роботу</text>
<rect x="40.0" y="242.0" width="250.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="285.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">подія add</tspan><tspan x="165.0" dy="18.2">про ttyUSB0</tspan></text>
<line x1="298.0" y1="290.0" x2="326.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="334.0" y="242.0" width="250.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="459.0" y="276.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="459.0" dy="0.0">правило:</tspan><tspan x="459.0" dy="18.2">TAG+=&quot;systemd&quot;</tspan><tspan x="459.0" dy="18.2">SYSTEMD_WANTS</tspan></text>
<line x1="592.0" y1="290.0" x2="620.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="628.0" y="242.0" width="250.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="753.0" y="285.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="753.0" dy="0.0">подію завершено —</tspan><tspan x="753.0" dy="18.2">робочий процес вільний</tspan></text>
<line x1="886.0" y1="290.0" x2="914.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="922.0" y="242.0" width="250.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1047.0" y="276.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1047.0" dy="0.0">systemd підняв</tspan><tspan x="1047.0" dy="18.2">laser-agent@ttyUSB0</tspan><tspan x="1047.0" dy="18.2">у власному cgroup</tspan></text>
<text x="620.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">агент більше не має стосунку до udev: власний перезапуск, власний журнал</text>
<text x="201.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">і зворотний бік — вийняли шнур</text>
<rect x="201.0" y="428.0" width="250.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="326.0" y="480.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="326.0" dy="0.0">подія remove</tspan></text>
<line x1="459.0" y1="476.0" x2="487.0" y2="476.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="495.0" y="428.0" width="250.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="471.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">dev-ttyUSB0.device</tspan><tspan x="620.0" dy="18.2">стає неактивним</tspan></text>
<line x1="753.0" y1="476.0" x2="781.0" y2="476.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="789.0" y="428.0" width="250.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="914.0" y="471.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="914.0" dy="0.0">BindsTo= + After=</tspan><tspan x="914.0" dy="18.2">зупиняють службу</tspan></text>
<text x="620.0" y="550.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">зупинку ніхто не програмував — вона випливає з напрямку залежності</text>
</svg>