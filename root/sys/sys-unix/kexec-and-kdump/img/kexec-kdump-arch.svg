<rect x="300.0" y="145.0" width="200.0" height="40.0" rx="6" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/><text x="400.0" y="161.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Пам'ять процесів (Userspace)</tspan><tspan x="400.0" dy="14.3">і структури VFS</tspan></text>
<rect x="80.0" y="195.0" width="420.0" height="40.0" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/><text x="290.0" y="218.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#312e81" text-anchor="middle"><tspan x="290.0" dy="0.0">Дані для аварійного аналізу (PT_LOAD сторінки в /proc/vmcore)</tspan></text>
