<rect x="555.0" y="145.0" width="210.0" height="40.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><text x="660.0" y="161.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle"><tspan x="660.0" dy="0.0">Ізольоване аварійне ядро</tspan><tspan x="660.0" dy="15.6">(Crash Kernel в RAM)</tspan></text>
<rect x="555.0" y="195.0" width="210.0" height="40.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><text x="660.0" y="218.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle"><tspan x="660.0" dy="0.0">Спеціальний initramfs</tspan><tspan x="660.0" dy="15.6">(kdump-tools / makedumpfile)</tspan></text>
