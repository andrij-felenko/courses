<rect x="74.2" y="313.4" width="211.5" height="63.2" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="333.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle"><tspan x="180.0" dy="0.0">Стандартний kexec:</tspan><tspan x="180.0" dy="15.6">sys_kexec_load() → Purgatory</tspan><tspan x="180.0" dy="15.6">Заміна первинного ядра новим</tspan></text>
<line x1="660.0" y1="270.0" x2="660.0" y2="315.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
