<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="1160.0" height="600.0" rx="8" fill="#f8f9fa" stroke="#b0bec5" stroke-width="1.5"/>
<text x="600.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#263238" text-anchor="middle" font-weight="700">Механізм виявлення перегонів KCSAN (Watchpoint &amp; Micro-Delay)</text>
<rect x="50.0" y="90.0" width="350.0" height="480.0" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="2.0"/>
<rect x="50.0" y="90.0" width="350.0" height="45.0" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
<text x="225.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0d47a1" text-anchor="middle" font-weight="700">CPU 0 (Потік A: Запис)</text>
<rect x="70.0" y="150.0" width="310.0" height="55.0" rx="4" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.0"/>
<text x="225.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Доступ: *ptr = val</text>
<text x="225.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1565c0" text-anchor="middle">Викликається __tsan_write4(ptr)</text>
<rect x="70.0" y="220.0" width="310.0" height="65.0" rx="4" fill="#bbdefb" stroke="#1565c0" stroke-width="1.0"/>
<text x="225.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Вибір за семплюванням</text>
<text x="225.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0d47a1" text-anchor="middle">Слот хеш-таблиці = hash(ptr)</text>
<rect x="70.0" y="300.0" width="310.0" height="75.0" rx="4" fill="#fff9c4" stroke="#fbc02d" stroke-width="1.5"/>
<text x="225.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#f57f17" text-anchor="middle" font-weight="700">3. Активація Watchpoint</text>
<text x="225.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#f57f17" text-anchor="middle">Запис [Addr|Size|WriteBit|ThreadID]</text>
<text x="225.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#f57f17" text-anchor="middle">у kcsan_watchpoints[slot]</text>
<rect x="70.0" y="390.0" width="310.0" height="85.0" rx="4" fill="#ffe0b2" stroke="#f57c00" stroke-width="1.5"/>
<text x="225.0" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e65100" text-anchor="middle" font-weight="700">4. Штучна затримка (udelay)</text>
<text x="225.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e65100" text-anchor="middle" font-weight="700">Пауза ~80 мкс на CPU 0</text>
<text x="225.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#bf360c" text-anchor="middle">Розширення вікна перегонів!</text>
<rect x="70.0" y="490.0" width="310.0" height="60.0" rx="4" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.0"/>
<text x="225.0" y="513.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1b5e20" text-anchor="middle" font-weight="700">5. Реальне виконання *ptr = val</text>
<text x="225.0" y="533.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle">Очищення слота watchpoint</text>
<rect x="430.0" y="90.0" width="340.0" height="480.0" rx="6" fill="#ffffff" stroke="#7b1fa2" stroke-width="2.0"/>
<rect x="430.0" y="90.0" width="340.0" height="45.0" rx="6" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1.5"/>
<text x="600.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#4a148c" text-anchor="middle" font-weight="700">Таблиця KCSAN Watchpoints</text>
<rect x="450.0" y="150.0" width="300.0" height="45.0" rx="4" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.0"/>
<text x="600.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6a1b9a" text-anchor="middle">Слот 0: [ Порожньо ]</text>
<rect x="450.0" y="205.0" width="300.0" height="75.0" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="2.0"/>
<text x="600.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e65100" text-anchor="middle" font-weight="700">Слот Hash(ptr): [ АКТИВНИЙ ]</text>
<text x="600.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#bf360c" text-anchor="middle">Адреса = ptr | Розмір = 4 B</text>
<text x="600.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#bf360c" text-anchor="middle">Тип = WRITE | CPU = 0</text>
<rect x="450.0" y="290.0" width="300.0" height="40.0" rx="4" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.0"/>
<text x="470.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6a1b9a" text-anchor="start">Слот N: [ Порожньо ]</text>
<rect x="450.0" y="350.0" width="300.0" height="200.0" rx="4" fill="#fdecea" stroke="#c62828" stroke-width="2.0"/>
<text x="600.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b71c1c" text-anchor="middle" font-weight="700">РЕЄСТРАЦІЯ СТАНУ ПЕРЕГОНІВ</text>
<text x="600.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c62828" text-anchor="middle" font-weight="700">Збіг адреси: ptr == ptr</text>
<text x="600.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b71c1c" text-anchor="middle">Умова: Хоча б 1 доступ = WRITE</text>
<text x="600.0" y="453.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#263238" text-anchor="middle" font-weight="700">Отримано стеки викликів:</text>
<text x="600.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#37474f" text-anchor="middle">• CPU 0: update_counter+0x12</text>
<text x="600.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#37474f" text-anchor="middle">• CPU 1: read_counter+0x08</text>
<text x="600.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b71c1c" text-anchor="middle" font-weight="700">Дамп dmesg / kcsan report</text>
<rect x="800.0" y="90.0" width="350.0" height="480.0" rx="6" fill="#ffffff" stroke="#c62828" stroke-width="2.0"/>
<rect x="800.0" y="90.0" width="350.0" height="45.0" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1.5"/>
<text x="975.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#b71c1c" text-anchor="middle" font-weight="700">CPU 1 (Потік B: Читання/Запис)</text>
<rect x="820.0" y="150.0" width="310.0" height="55.0" rx="4" fill="#ffebee" stroke="#e53935" stroke-width="1.0"/>
<text x="975.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Одночасний доступ: r = *ptr</text>
<text x="975.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c62828" text-anchor="middle">Викликається __tsan_read4(ptr)</text>
<rect x="820.0" y="220.0" width="310.0" height="75.0" rx="4" fill="#ffcdd2" stroke="#d32f2f" stroke-width="1.5"/>
<text x="975.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b71c1c" text-anchor="middle" font-weight="700">2. Перевірка Watchpoint-ів</text>
<text x="975.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b71c1c" text-anchor="middle">Пошук ptr у kcsan_watchpoints</text>
<text x="975.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b71c1c" text-anchor="middle" font-weight="700">Збіг знайдено під час udelay!</text>
<rect x="820.0" y="310.0" width="310.0" height="75.0" rx="4" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<text x="975.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b71c1c" text-anchor="middle" font-weight="700">3. Фіксація Конфлікту</text>
<text x="975.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b71c1c" text-anchor="middle">Формування двох стек-трейсів</text>
<text x="975.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b71c1c" text-anchor="middle" font-weight="700">Виклик kcsan_report()</text>
<rect x="820.0" y="400.0" width="310.0" height="150.0" rx="4" fill="#f5f5f5" stroke="#757575" stroke-width="1.0"/>
<text x="975.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Результат для розробника:</text>
<text x="975.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#424242" text-anchor="middle">Звіт у dmesg деталізує:</text>
<text x="975.0" y="475.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#212121" text-anchor="middle">1) Яку саме змінну зачеплено</text>
<text x="975.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#212121" text-anchor="middle">2) Які функції виконувалися</text>
<text x="975.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="700">3) Рекомендація: READ_ONCE</text>
