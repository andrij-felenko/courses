<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обробник лише переносить факт у дескриптор — працює цикл</text>
<rect x="20.0" y="36.0" width="350.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="195.0" y="64.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="195.0" dy="0.0">обробник сигналу: руки звʼязані</tspan></text>
<rect x="650.0" y="36.0" width="350.0" height="46.0" rx="6" fill="#eaf7ee" stroke="#2457d6" stroke-width="1.6"/><text x="825.0" y="64.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="825.0" dy="0.0">головний цикл: тут можна все</tspan></text>
<rect x="20.0" y="104.0" width="350.0" height="56.0" rx="6" fill="#eef3fb" stroke="#6b7280" stroke-width="1.3"/><text x="195.0" y="127.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">прилетів SIGRTMIN,</tspan><tspan x="195.0" dy="18.2">у siginfo si_fd = 3</tspan></text>
<rect x="20.0" y="172.0" width="350.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="195.0" y="204.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">зберегти errno</tspan></text>
<rect x="20.0" y="240.0" width="350.0" height="56.0" rx="6" fill="#eaf7ee" stroke="#6b7280" stroke-width="1.3"/><text x="195.0" y="272.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">write(wake[1], &amp;fd, 1)</tspan></text>
<rect x="20.0" y="308.0" width="350.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="195.0" y="340.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">повернути errno</tspan></text>
<rect x="20.0" y="386.0" width="350.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="195.0" y="407.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">тут заборонено:</tspan><tspan x="195.0" dy="18.2">fsync · malloc · замок</tspan><tspan x="195.0" dy="18.2">мережа · printf</tspan></text>
<rect x="420.0" y="240.0" width="180.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="510.0" y="264.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">самотруба:</tspan><tspan x="510.0" dy="16.9">1 байт = 1 подія</tspan></text>
<rect x="650.0" y="104.0" width="350.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="825.0" y="127.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">поки труба порожня —</tspan><tspan x="825.0" dy="18.2">цикл спить у poll()</tspan></text>
<rect x="650.0" y="240.0" width="350.0" height="56.0" rx="6" fill="#eef3fb" stroke="#6b7280" stroke-width="1.3"/><text x="825.0" y="263.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">poll() прокинувся,</tspan><tspan x="825.0" dy="18.2">читаємо байт</tspan></text>
<rect x="650.0" y="308.0" width="350.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="825.0" y="331.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">доводимо файл до ладу</tspan><tspan x="825.0" dy="18.2">(скидаємо свій кеш)</tspan></text>
<rect x="650.0" y="376.0" width="350.0" height="56.0" rx="6" fill="#eef3fb" stroke="#6b7280" stroke-width="1.3"/><text x="825.0" y="399.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">fcntl(fd, F_GETLEASE):</tspan><tspan x="825.0" dy="18.2">чого від нас чекає ядро</tspan></text>
<rect x="650.0" y="444.0" width="168.0" height="76.0" rx="6" fill="#eaf7ee" stroke="#2457d6" stroke-width="1.4"/><text x="734.0" y="469.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="734.0" dy="0.0">F_RDLCK — прийшов</tspan><tspan x="734.0" dy="16.9">читач: знижуємо,</tspan><tspan x="734.0" dy="16.9">кеш лишається</tspan></text>
<rect x="832.0" y="444.0" width="168.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="916.0" y="469.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="916.0" dy="0.0">F_UNLCK — прийшов</tspan><tspan x="916.0" dy="16.9">письменник: віддаємо</tspan><tspan x="916.0" dy="16.9">оренду зовсім</tspan></text>
<line x1="374.0" y1="268.0" x2="414.0" y2="268.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="604.0" y1="268.0" x2="644.0" y2="268.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="737.5" y1="440.0" x2="734.0" y2="440.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="912.5" y1="440.0" x2="916.0" y2="440.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="510.0" y="562.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-style="italic">від сигналу до відповіді — не більш як lease-break-time (45 с)</text>
</svg>