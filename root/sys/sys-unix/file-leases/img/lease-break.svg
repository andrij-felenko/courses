<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1170 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1170" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перерва оренди: хто спить, хто діє і скільки на це часу</text>
<text x="261.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">орендар</text>
<text x="577.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ядро</text>
<text x="878.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">третій процес</text>
<text x="46.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">час</text>
<line x1="46.0" y1="92.0" x2="46.0" y2="616.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="96.0" y="86.0" width="330.0" height="58.0" rx="6" fill="#eef3fb" stroke="#6b7280" stroke-width="1.4"/><text x="261.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="261.0" dy="0.0">fcntl(fd, F_SETLEASE, F_WRLCK)</tspan><tspan x="261.0" dy="16.9">— «файл мій, попередьте про чужих»</tspan></text>
<rect x="728.0" y="166.0" width="300.0" height="58.0" rx="6" fill="#f7f2ea" stroke="#6b7280" stroke-width="1.4"/><text x="878.0" y="199.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="878.0" dy="0.0">open(&quot;doc&quot;, O_RDONLY)</tspan></text>
<rect x="452.0" y="246.0" width="250.0" height="58.0" rx="6" fill="#fdecea" stroke="#1a1a1a" stroke-width="1.4"/><text x="577.0" y="262.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="577.0" dy="0.0">оренда на цьому inode є:</tspan><tspan x="577.0" dy="16.9">відкривача — спати,</tspan><tspan x="577.0" dy="16.9">орендареві — сигнал</tspan></text>
<rect x="96.0" y="326.0" width="330.0" height="58.0" rx="6" fill="#eaf7ee" stroke="#6b7280" stroke-width="1.4"/><text x="261.0" y="351.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="261.0" dy="0.0">обробник: si_fd → у самотрубу</tspan><tspan x="261.0" dy="16.9">головний цикл: скинути кеш</tspan></text>
<rect x="96.0" y="406.0" width="330.0" height="58.0" rx="6" fill="#eaf7ee" stroke="#6b7280" stroke-width="1.4"/><text x="261.0" y="431.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="261.0" dy="0.0">fcntl(fd, F_SETLEASE, F_RDLCK)</tspan><tspan x="261.0" dy="16.9">— зниження, читати я ще можу</tspan></text>
<rect x="452.0" y="486.0" width="250.0" height="58.0" rx="6" fill="#eef3fb" stroke="#1a1a1a" stroke-width="1.4"/><text x="577.0" y="519.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="577.0" dy="0.0">будить того, хто відкривав</tspan></text>
<rect x="728.0" y="566.0" width="300.0" height="58.0" rx="6" fill="#f7f2ea" stroke="#6b7280" stroke-width="1.4"/><text x="878.0" y="599.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="878.0" dy="0.0">open повертає дескриптор</tspan></text>
<line x1="728.0" y1="195.0" x2="708.0" y2="267.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="452.0" y1="275.0" x2="432.0" y2="347.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="426.0" y1="435.0" x2="446.0" y2="507.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="702.0" y1="515.0" x2="722.0" y2="587.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="712.0" y="252.0" width="8.0" height="308.0" rx="4" fill="#f0d9d6" stroke="#c0392b" stroke-width="1.2"/>
<text x="878.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">спить в open</text>
<line x1="1052.0" y1="254.0" x2="1052.0" y2="456.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="1042.0" y1="254.0" x2="1052.0" y2="254.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="1042.0" y1="456.0" x2="1052.0" y2="456.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="1060.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start">не більше</text>
<text x="1060.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">45 секунд</text>
<text x="96.0" y="664.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">Промовчав орендар усі 45 секунд — ядро знімає оренду саме й будить відкривача без нього.</text>
<text x="96.0" y="692.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">Окремого сповіщення про це не буде: орендар дізнається лише з F_GETLEASE.</text>
</svg>