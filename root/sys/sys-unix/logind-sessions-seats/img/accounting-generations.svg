<rect x="1112.3" y="179.9" width="235.5" height="60.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1230.0" y="205.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1230.0" dy="0.0">pam_systemd у стеку входу,</tspan><tspan x="1230.0" dy="18.2">належність веде ядро</tspan></text>
<rect x="1164.1" y="319.9" width="131.7" height="60.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1230.0" y="345.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1230.0" dy="0.0">місце зібране</tspan><tspan x="1230.0" dy="18.2">з udev-міток</tspan></text>
