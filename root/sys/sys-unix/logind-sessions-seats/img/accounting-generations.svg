<rect x="381.4" y="87.6" width="137.1" height="64.8" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">utmp / wtmp</tspan><tspan x="450.0" dy="20.8">з 1979 року</tspan></text>
