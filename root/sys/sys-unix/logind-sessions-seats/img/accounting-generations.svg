<rect x="728.2" y="179.9" width="203.6" height="60.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="830.0" y="205.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">демон бачить вхід</tspan><tspan x="830.0" dy="18.2">і знає активну консоль</tspan></text>
