<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм перенаправлення стандартного виведення через dup2()</text>
<rect x="20.0" y="60.0" width="220.0" height="270.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="130.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">Крок 1: fork()</text>
<rect x="64.2" y="112.5" width="131.7" height="35.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Дочірній процес</tspan><tspan x="130.0" dy="13.0">успадковує FD 0, 1, 2</tspan></text>
<rect x="92.7" y="196.0" width="74.7" height="48.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="130.0" y="210.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">FD 0 -&gt; TTY</tspan><tspan x="130.0" dy="13.0">FD 1 -&gt; TTY</tspan><tspan x="130.0" dy="13.0">FD 2 -&gt; TTY</tspan></text>
<rect x="270.0" y="60.0" width="220.0" height="270.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="380.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">Крок 2: open()</text>
<rect x="302.8" y="112.5" width="154.5" height="35.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">open(&quot;out.txt&quot;, O_WRONLY)</tspan><tspan x="380.0" dy="13.0">отримує дескриптор 3</tspan></text>
<rect x="331.2" y="202.5" width="97.5" height="35.0" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="380.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">FD 1 -&gt; TTY</tspan><tspan x="380.0" dy="13.0">FD 3 -&gt; out.txt</tspan></text>
<rect x="520.0" y="60.0" width="220.0" height="270.0" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="630.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">Крок 3: dup2(3,1) + exec</text>
<rect x="564.1" y="112.5" width="131.7" height="35.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">dup2(3, 1); close(3);</tspan><tspan x="630.0" dy="13.0">execve(&quot;target&quot;, ...)</tspan></text>
<rect x="568.2" y="196.0" width="123.6" height="48.0" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/><text x="630.0" y="210.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">FD 1 -&gt; out.txt!</tspan><tspan x="630.0" dy="13.0">(Програма не знає,</tspan><tspan x="630.0" dy="13.0">що пише у файл)</tspan></text>
<line x1="240.0" y1="195.0" x2="270.0" y2="195.0" stroke="#64748b" stroke-width="2.0" marker-end="url(#arrow)"/>
