<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">де ширина зсуву ще плаває, а де вже ні</text>
<rect x="70.0" y="86.0" width="660.0" height="90.0" rx="8" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/>
<text x="90.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b8860b" text-anchor="start" font-weight="700">код програми</text>
<text x="90.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">власні змінні, структури й функції з off_t</text>
<text x="770.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">залежить від макроса</text>
<rect x="70.0" y="232.0" width="660.0" height="90.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="90.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">libc</text>
<text x="90.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">заголовки перевизначають типи й перенаправляють імена</text>
<text x="770.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">залежить від макроса</text>
<rect x="70.0" y="378.0" width="660.0" height="90.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="90.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">ядро</text>
<text x="90.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">зсув у файлі — loff_t, завжди 64 біти зі знаком</text>
<text x="770.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">стала: 64 біти</text>
<rect x="70.0" y="500.0" width="660.0" height="90.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="90.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">файлова система й носій</text>
<text x="90.0" y="564.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">розмір записано широким полем в inode</text>
<text x="770.0" y="550.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">стала: 64 біти</text>
<line x1="54.0" y1="200.0" x2="1020.0" y2="200.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="6,4"/>
<text x="54.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">заголовки libc — тут вирішує _FILE_OFFSET_BITS</text>
<line x1="54.0" y1="346.0" x2="1020.0" y2="346.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="6,4"/>
<text x="54.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">межа системного виклику — lseek або _llseek, stat або stat64</text>
<text x="560.0" y="596.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">великі файли існували завжди — бракувало лише способу назвати зсув у них</text>
</svg>