<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 660" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="660" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як від імені файлу дійти до лічильника скидань кеша</text>
<rect x="55.0" y="70.0" width="470.0" height="58.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.7"/><text x="290.0" y="95.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">шлях, довговічність якого перевіряємо</tspan><tspan x="290.0" dy="15.6">/srv/data</tspan></text>
<line x1="290.0" y1="130.0" x2="290.0" y2="156.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="55.0" y="158.0" width="470.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="290.0" y="185.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">stat(шлях).st_dev  →  major : minor</tspan><tspan x="290.0" dy="15.6">наприклад  259 : 2</tspan></text>
<text x="570.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="570.0" dy="0.0">st_dev називає не файлову систему, а блоковий пристрій;</tspan><tspan x="570.0" dy="14.9">розкладають його макросами major() і minor()</tspan><tspan x="570.0" dy="14.9">із &lt;sys/sysmacros.h&gt;</tspan></text>
<line x1="290.0" y1="222.0" x2="290.0" y2="248.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="55.0" y="250.0" width="470.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="290.0" y="277.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">/sys/dev/block/259:2</tspan><tspan x="290.0" dy="15.6">символьне посилання в дерево пристроїв</tspan></text>
<text x="570.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="570.0" dy="0.0">ціль — щось на кшталт</tspan><tspan x="570.0" dy="14.9">/sys/devices/…/nvme0n1/nvme0n1p2</tspan></text>
<line x1="290.0" y1="314.0" x2="290.0" y2="342.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="290.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b7791f" text-anchor="middle" font-weight="700">чи лежить поруч файл «partition»?</text>
<rect x="55.0" y="380.0" width="224.0" height="84.0" rx="6" fill="#fdf3e7" stroke="#b7791f" stroke-width="1.7"/><text x="167.0" y="411.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="167.0" dy="0.0">так — це РОЗДІЛ</tspan><tspan x="167.0" dy="15.0">беремо на рівень вище</tspan><tspan x="167.0" dy="15.0">…/259:2/../stat</tspan></text>
<rect x="301.0" y="380.0" width="224.0" height="84.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="413.0" y="411.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="413.0" dy="0.0">ні — це вже ЦІЛИЙ ДИСК</tspan><tspan x="413.0" dy="15.0">беремо як є</tspan><tspan x="413.0" dy="15.0">…/259:2/stat</tspan></text>
<text x="570.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start"><tspan x="570.0" dy="0.0">лічильники скидань для розділів НЕ ведуться —</tspan><tspan x="570.0" dy="14.9">рахує їх лише цілий диск, тож із розділу треба</tspan><tspan x="570.0" dy="14.9">піднятися на крок угору; «..» після символьного</tspan><tspan x="570.0" dy="14.9">посилання йде вгору від його цілі</tspan></text>
<line x1="167.0" y1="468.0" x2="256.0" y2="502.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="413.0" y1="468.0" x2="324.0" y2="502.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="55.0" y="506.0" width="470.0" height="108.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.8"/><text x="290.0" y="540.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">17 чисел одним рядком</tspan><tspan x="290.0" dy="15.6">поле 5 — записів завершено</tspan><tspan x="290.0" dy="15.6">поле 16 — скидань кеша завершено</tspan><tspan x="290.0" dy="15.6">поле 17 — мілісекунд на скидання</tspan></text>
<text x="570.0" y="522.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start"><tspan x="570.0" dy="0.0">поля 16 і 17 з'явилися в ядрі 5.5;</tspan><tspan x="570.0" dy="14.9">на старішому ядрі рядок коротший,</tspan><tspan x="570.0" dy="14.9">і перевірити скидання цим способом не вийде.</tspan><tspan x="570.0" dy="14.9">Блоковий шар зливає одночасні скидання в одне,</tspan><tspan x="570.0" dy="14.9">тож приріст поля 16 буває МЕНШИЙ за кількість fsync</tspan></text>
</svg>