<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 524" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="524" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скільки роботи мусить зробити пристрій на один виклик</text>
<rect x="35.0" y="66.0" width="300.0" height="52.0" rx="6" fill="#eceff2" stroke="#6b7280" stroke-width="1.4"/><text x="185.0" y="96.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">що саме змінює програма</tspan></text>
<rect x="345.0" y="66.0" width="375.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="532.5" y="96.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="532.5" dy="0.0">fdatasync(fd)</tspan></text>
<rect x="730.0" y="66.0" width="375.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="917.5" y="96.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="917.5" dy="0.0">fsync(fd)</tspan></text>
<rect x="35.0" y="132.0" width="300.0" height="142.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="185.0" y="199.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">перезапис уже виділених блоків</tspan><tspan x="185.0" dy="15.0">розмір файлу не змінюється</tspan></text>
<rect x="345.0" y="132.0" width="375.0" height="142.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="532.5" y="177.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="532.5" dy="0.0">дані блоків</tspan><tspan x="532.5" dy="15.0">і скидання кеша пристрою</tspan><tspan x="532.5" dy="15.0"></tspan><tspan x="532.5" dy="15.0">inode не оновлюють: час зміни</tspan><tspan x="532.5" dy="15.0">для читання не потрібен</tspan></text>
<rect x="730.0" y="132.0" width="375.0" height="142.0" rx="6" fill="#fdf3e7" stroke="#b7791f" stroke-width="1.5"/><text x="917.5" y="184.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="917.5" dy="0.0">дані блоків</tspan><tspan x="917.5" dy="15.0">і час зміни в inode</tspan><tspan x="917.5" dy="15.0">→ окремий коміт журналу</tspan><tspan x="917.5" dy="15.0">і скидання кеша пристрою</tspan></text>
<rect x="35.0" y="284.0" width="300.0" height="142.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="185.0" y="351.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">дописування в кінець</tspan><tspan x="185.0" dy="15.0">файл росте</tspan></text>
<rect x="345.0" y="284.0" width="375.0" height="142.0" rx="6" fill="#fdf3e7" stroke="#b7791f" stroke-width="1.5"/><text x="532.5" y="336.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="532.5" dy="0.0">дані блоків</tspan><tspan x="532.5" dy="15.0">новий розмір і карта блоків</tspan><tspan x="532.5" dy="15.0">→ коміт журналу</tspan><tspan x="532.5" dy="15.0">і скидання кеша пристрою</tspan></text>
<rect x="730.0" y="284.0" width="375.0" height="142.0" rx="6" fill="#fdf3e7" stroke="#b7791f" stroke-width="1.5"/><text x="917.5" y="344.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="917.5" dy="0.0">те саме, що ліворуч:</tspan><tspan x="917.5" dy="15.0">метадані все одно потрібні,</tspan><tspan x="917.5" dy="15.0">тож економити нема на чому</tspan></text>
<rect x="35.0" y="454.0" width="1070.0" height="50.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="570.0" y="483.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Різниця між двома викликами вимірюється тільки в лівому верхньому куті; на дописуванні вони роблять однакову роботу.</tspan></text>
</svg>