<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто побачить помилку зворотного запису: прапорець проти лічильника</text>
<rect x="40.0" y="46.0" width="560.0" height="46.0" rx="6" fill="#fdf3e7" stroke="#2457d6" stroke-width="1.8"/><text x="320.0" y="73.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">до ядра 4.13: один прапорець на весь inode</tspan></text>
<rect x="110.0" y="116.0" width="420.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="320.0" y="146.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="320.0" dy="0.0">address_space: AS_EIO</tspan></text>
<rect x="40.0" y="214.0" width="300.0" height="78.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="242.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">сторонній `sync`, що трапився</tspan><tspan x="190.0" dy="15.0">першим після невдалого</tspan><tspan x="190.0" dy="15.0">зворотного запису</tspan></text>
<line x1="346.0" y1="253.0" x2="356.0" y2="253.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="360.0" y="214.0" width="230.0" height="78.0" rx="6" fill="#fdeceb" stroke="#2457d6" stroke-width="1.4"/><text x="475.0" y="242.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">забирає прапорець</tspan><tspan x="475.0" dy="15.0">собі — і нікому</tspan><tspan x="475.0" dy="15.0">про це не каже</tspan></text>
<rect x="40.0" y="314.0" width="300.0" height="78.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="349.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">`fsync` бази даних,</tspan><tspan x="190.0" dy="15.0">чиї сторінки саме й загинули</tspan></text>
<line x1="346.0" y1="353.0" x2="356.0" y2="353.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="360.0" y="314.0" width="230.0" height="78.0" rx="6" fill="#fdeceb" stroke="#2457d6" stroke-width="1.4"/><text x="475.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">0 — успіх</tspan></text>
<rect x="40.0" y="414.0" width="300.0" height="78.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="449.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">повторний `fsync`</tspan><tspan x="190.0" dy="15.0">тієї самої бази</tspan></text>
<line x1="346.0" y1="453.0" x2="356.0" y2="453.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="360.0" y="414.0" width="230.0" height="78.0" rx="6" fill="#fdeceb" stroke="#2457d6" stroke-width="1.4"/><text x="475.0" y="449.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">0 — успіх, брудних</tspan><tspan x="475.0" dy="15.0">сторінок уже немає</tspan></text>
<rect x="660.0" y="46.0" width="560.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="940.0" y="73.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="940.0" dy="0.0">з ядра 4.13: лічильник помилок errseq_t</tspan></text>
<rect x="730.0" y="116.0" width="420.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="940.0" y="146.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="940.0" dy="0.0">address_space: {EIO, №7}   ·   опис файлу: f_wb_err</tspan></text>
<rect x="660.0" y="214.0" width="300.0" height="78.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="810.0" y="249.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">дескриптор, відкритий</tspan><tspan x="810.0" dy="15.0">до помилки (f_wb_err = №6)</tspan></text>
<line x1="966.0" y1="253.0" x2="976.0" y2="253.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="980.0" y="214.0" width="230.0" height="78.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="1095.0" y="249.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="1095.0" dy="0.0">EIO — рівно</tspan><tspan x="1095.0" dy="15.0">один раз</tspan></text>
<rect x="660.0" y="314.0" width="300.0" height="78.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="810.0" y="349.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">інший дескриптор того самого</tspan><tspan x="810.0" dy="15.0">файлу, теж відкритий раніше</tspan></text>
<line x1="966.0" y1="353.0" x2="976.0" y2="353.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="980.0" y="314.0" width="230.0" height="78.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="1095.0" y="349.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="1095.0" dy="0.0">теж EIO —</tspan><tspan x="1095.0" dy="15.0">свій, окремий</tspan></text>
<rect x="660.0" y="414.0" width="300.0" height="78.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="810.0" y="449.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">дескриптор, відкритий</tspan><tspan x="810.0" dy="15.0">вже ПІСЛЯ помилки (№7)</tspan></text>
<line x1="966.0" y1="453.0" x2="976.0" y2="453.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="980.0" y="414.0" width="230.0" height="78.0" rx="6" fill="#fdf3e7" stroke="#b7791f" stroke-width="1.4"/><text x="1095.0" y="449.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b7791f" text-anchor="middle" font-weight="700"><tspan x="1095.0" dy="0.0">0 — помилка</tspan><tspan x="1095.0" dy="15.0">для нього в минулому</tspan></text>
<rect x="40.0" y="524.0" width="1160.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="620.0" y="564.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">лічильник замінює «хто перший прочитав, той і забрав» на «кожен відкритий до помилки побачить її один раз»; але дескриптор, відкритий уже після невдалого запису, не бачить нічого — саме в цю щілину й потрапляв процес, який відкриває файли лише в момент контрольної точки</tspan></text>
</svg>