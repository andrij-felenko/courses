<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1290 950" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1290" height="950" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях запиту до сектора крізь loop-пристрій</text>
<rect x="263.7" y="66.0" width="272.5" height="57.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">файлова система всередині образу,</tspan><tspan x="400.0" dy="16.9">змонтована на /dev/loop0</tspan></text>
<rect x="263.7" y="186.1" width="272.5" height="57.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="211.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">блоковий шар: запит до /dev/loop0</tspan><tspan x="400.0" dy="16.9">сектори 2048…2055</tspan></text>
<rect x="260.0" y="311.1" width="279.9" height="57.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">драйвер loop</tspan><tspan x="400.0" dy="16.9">зсув у файлі = offset + 2048 · 512</tspan></text>
<rect x="260.0" y="441.1" width="279.9" height="57.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="466.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">читання/запис у disk.img</tspan><tspan x="400.0" dy="16.9">через звичайний файловий інтерфейс</tspan></text>
<rect x="237.8" y="571.0" width="324.4" height="57.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="596.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">файлова система, на якій лежить disk.img</tspan><tspan x="400.0" dy="16.9">розкладає зсув по своїх екстентах</tspan></text>
<rect x="267.4" y="704.5" width="265.1" height="41.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="729.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">блоковий шар: запит до /dev/sda2</tspan></text>
<rect x="330.4" y="834.5" width="139.1" height="41.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="859.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">справжній носій</tspan></text>
<line x1="400.0" y1="137.9" x2="400.0" y2="172.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="257.9" x2="400.0" y2="297.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="382.9" x2="400.0" y2="427.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="513.0" x2="400.0" y2="557.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="643.0" x2="400.0" y2="690.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="759.5" x2="400.0" y2="820.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="869.6" y="180.5" width="180.8" height="69.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="960.0" y="203.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">номер сектора —</tspan><tspan x="960.0" dy="16.2">єдине, що знає</tspan><tspan x="960.0" dy="16.2">верхня файлова система</tspan></text>
<line x1="650.0" y1="215.0" x2="853.6" y2="215.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="834.0" y="370.5" width="252.0" height="69.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="960.0" y="393.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">тут запит покидає блоковий шар</tspan><tspan x="960.0" dy="16.2">і повертається у файловий:</tspan><tspan x="960.0" dy="16.2">петля всередині того самого ядра</tspan></text>
<line x1="650.0" y1="405.0" x2="818.0" y2="405.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<rect x="866.1" y="698.6" width="187.9" height="52.8" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="960.0" y="721.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">звідси й далі — шлях,</tspan><tspan x="960.0" dy="16.2">яким іде будь-який файл</tspan></text>
<line x1="650.0" y1="725.0" x2="850.1" y2="725.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="5 4"/>
<text x="640.0" y="918.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ніщо в цьому ланцюгу не виходить у простір користувача: обидві половини — підсистеми ядра.</text>
</svg>