<svg viewBox="0 0 850 360" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="425" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e293b">Структура __sk_buff та прямий доступ до пам'яті пакета</text>
  <rect x="40" y="65" width="220" height="260" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="150" y="92" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">struct __sk_buff</text>
  <rect x="55" y="110" width="190" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="150" y="128" font-size="12" font-family="monospace" text-anchor="middle" fill="#1e293b">u32 len</text>
  <rect x="55" y="140" width="190" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="150" y="158" font-size="12" font-family="monospace" text-anchor="middle" fill="#1e293b">u32 pkt_type</text>
  <rect x="55" y="170" width="190" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="150" y="188" font-size="12" font-family="monospace" text-anchor="middle" fill="#1e293b">u32 mark / priority</text>
  <rect x="55" y="200" width="190" height="26" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="150" y="218" font-size="12" font-family="monospace" text-anchor="middle" fill="#1e293b">u32 ifindex</text>
  <rect x="55" y="230" width="190" height="26" rx="4" fill="#fef08a" stroke="#94a3b8"/>
  <text x="150" y="248" font-size="12" font-family="monospace" text-anchor="middle" fill="#1e293b">u32 data_meta</text>
  <rect x="55" y="260" width="190" height="26" rx="4" fill="#bbf7d0" stroke="#94a3b8"/>
  <text x="150" y="278" font-size="12" font-family="monospace" text-anchor="middle" fill="#1e293b">u32 data</text>
  <rect x="55" y="290" width="190" height="26" rx="4" fill="#fecaca" stroke="#94a3b8"/>
  <text x="150" y="308" font-size="12" font-family="monospace" text-anchor="middle" fill="#1e293b">u32 data_end</text>
  <rect x="330" y="65" width="480" height="260" rx="8" fill="#fafafa" stroke="#64748b" stroke-width="2"/>
  <text x="570" y="92" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Буфер пам'яті пакета (skb linear data)</text>
  <rect x="350" y="120" width="90" height="110" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="395" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#854d0e">Headroom</text>
  <text x="395" y="185" font-size="11" text-anchor="middle" fill="#854d0e">(data_meta)</text>
  <rect x="440" y="120" width="90" height="110" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="485" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#14532d">Ethernet</text>
  <text x="485" y="185" font-size="11" text-anchor="middle" fill="#14532d">14 байтів</text>
  <rect x="530" y="120" width="100" height="110" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="580" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">IPv4 / IPv6</text>
  <text x="580" y="185" font-size="11" text-anchor="middle" fill="#1e40af">20-40 байтів</text>
  <rect x="630" y="120" width="120" height="110" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="690" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b21a8">L4 + Payload</text>
  <text x="690" y="185" font-size="11" text-anchor="middle" fill="#6b21a8">Дані пакета</text>
  <rect x="750" y="120" width="40" height="110" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="770" y="175" font-size="10" text-anchor="middle" fill="#64748b" transform="rotate(-90 770 175)">Tailroom</text>
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-yellow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ca8a04"/>
    </marker>
  </defs>
  <path d="M 245 243 L 310 243 L 350 243 L 350 232" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arr-yellow)"/>
  <text x="300" y="235" font-size="11" text-anchor="middle" fill="#854d0e">data_meta</text>
  <path d="M 245 273 L 320 273 L 440 273 L 440 232" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="360" y="265" font-size="11" text-anchor="middle" fill="#15803d">skb->data</text>
  <path d="M 245 303 L 330 303 L 750 303 L 750 232" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="540" y="295" font-size="11" text-anchor="middle" fill="#b91c1c">skb->data_end</text>
  <rect x="350" y="260" width="440" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="570" y="280" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d4ed8">Вимога BPF Verifier: Перевірка меж (Bounds Check)</text>
  <text x="570" y="298" font-size="11" font-family="monospace" text-anchor="middle" fill="#1e40af">if ((void *)(hdr + 1) &gt; data_end) return TC_ACT_OK;</text>
</svg>