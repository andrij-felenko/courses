<svg viewBox="0 0 850 420" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="425" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1e293b">Шлях пакета в ядрі Linux: хуки XDP та TC clsact</text>
  <rect x="30" y="70" width="110" height="280" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="85" y="95" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">Мережева</text>
  <text x="85" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#0f172a">карта (NIC)</text>
  <rect x="42" y="145" width="86" height="45" rx="4" fill="#cbd5e1" stroke="#475569"/>
  <text x="85" y="172" font-size="12" text-anchor="middle" fill="#1e293b">RX Ring</text>
  <rect x="42" y="275" width="86" height="45" rx="4" fill="#cbd5e1" stroke="#475569"/>
  <text x="85" y="302" font-size="12" text-anchor="middle" fill="#1e293b">TX Ring</text>
  <rect x="175" y="70" width="120" height="130" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="235" y="95" font-size="14" font-weight="bold" text-anchor="middle" fill="#991b1b">Драйвер NIC</text>
  <rect x="187" y="115" width="96" height="65" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="235" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#991b1b">XDP Hook</text>
  <text x="235" y="162" font-size="11" text-anchor="middle" fill="#7f1d1d">(xdp_buff)</text>
  <line x1="315" y1="60" x2="315" y2="370" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="315" y="390" font-size="11" text-anchor="middle" fill="#64748b">Виділення sk_buff</text>
  <rect x="345" y="70" width="140" height="130" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="415" y="95" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">TC Ingress</text>
  <rect x="357" y="115" width="116" height="65" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="415" y="140" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e40af">clsact ingress</text>
  <text x="415" y="162" font-size="11" text-anchor="middle" fill="#1e3a8a">(struct __sk_buff)</text>
  <rect x="515" y="70" width="150" height="280" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="590" y="95" font-size="14" font-weight="bold" text-anchor="middle" fill="#166534">Стек L3/L4 Linux</text>
  <rect x="527" y="115" width="126" height="40" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="590" y="140" font-size="12" text-anchor="middle" fill="#14532d">Netfilter PRE_ROUTING</text>
  <rect x="527" y="170" width="126" height="40" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="590" y="195" font-size="12" text-anchor="middle" fill="#14532d">Маршрутизація (IP)</text>
  <rect x="527" y="225" width="126" height="40" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="590" y="250" font-size="12" text-anchor="middle" fill="#14532d">Сокет / cgroup</text>
  <rect x="527" y="280" width="126" height="45" rx="4" fill="#dcfce7" stroke="#16a34a"/>
  <text x="590" y="307" font-size="12" text-anchor="middle" fill="#14532d">Netfilter POST_ROUTING</text>
  <rect x="345" y="220" width="140" height="130" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
  <text x="415" y="245" font-size="14" font-weight="bold" text-anchor="middle" fill="#6b21a8">TC Egress</text>
  <rect x="357" y="265" width="116" height="65" rx="6" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="415" y="290" font-size="13" font-weight="bold" text-anchor="middle" fill="#6b21a8">clsact egress</text>
  <text x="415" y="312" font-size="11" text-anchor="middle" fill="#581c87">(struct __sk_buff)</text>
  <rect x="175" y="220" width="120" height="130" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="235" y="255" font-size="14" font-weight="bold" text-anchor="middle" fill="#334155">Драйвер TX</text>
  <text x="235" y="285" font-size="12" text-anchor="middle" fill="#475569">dev_hard_start_xmit</text>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#9333ea"/>
    </marker>
  </defs>
  <line x1="140" y1="145" x2="187" y2="145" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="283" y1="145" x2="357" y2="145" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="473" y1="145" x2="527" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="527" y1="302" x2="473" y2="302" stroke="#9333ea" stroke-width="2" marker-end="url(#arr-purple)"/>
  <line x1="357" y1="295" x2="295" y2="295" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="175" y1="295" x2="128" y2="295" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
</svg>