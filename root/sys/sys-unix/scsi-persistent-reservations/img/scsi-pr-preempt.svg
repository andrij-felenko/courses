<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400"><text x="400" y="30" font-size="20" text-anchor="middle" font-weight="bold">Огородження вводу-виводу (I/O fencing) через SCSI PR</text><rect x="300" y="250" width="200" height="100" rx="10" fill="#eeeeee" stroke="#333333" stroke-width="2" /><text x="400" y="280" font-size="16" text-anchor="middle" font-weight="bold">Спільний диск (LUN)</text><text x="400" y="305" font-size="14" text-anchor="middle" fill="#d32f2f">Резервація: Вузол Б</text><text x="400" y="325" font-size="12" text-anchor="middle">Зареєстровані ключі: Key_B</text><rect x="100" y="100" width="150" height="80" rx="5" fill="#ffebee" stroke="#d32f2f" stroke-width="2" /><text x="175" y="135" font-size="16" text-anchor="middle" font-weight="bold" fill="#d32f2f">Вузол А</text><text x="175" y="155" font-size="12" text-anchor="middle" fill="#d32f2f">(Key_A видалено)</text><rect x="550" y="100" width="150" height="80" rx="5" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" /><text x="625" y="135" font-size="16" text-anchor="middle" font-weight="bold" fill="#388e3c">Вузол Б</text><text x="625" y="155" font-size="12" text-anchor="middle" fill="#388e3c">(Key_B активний)</text><path d="M 350 140 L 375 160 L 360 170 L 385 190" stroke="#ff9800" stroke-width="3" fill="none" /><text x="375" y="120" font-size="14" text-anchor="middle" fill="#ff9800">Split Brain</text><line x1="175" y1="180" x2="295" y2="262" stroke="#d32f2f" stroke-width="3" stroke-dasharray="5,5" /><path d="M 295 262 l -17 -1 l 6 -14 Z" fill="#d32f2f" /><text x="155" y="215" font-size="12" text-anchor="middle" fill="#d32f2f">I/O (запис)</text><line x1="625" y1="180" x2="505" y2="252" stroke="#388e3c" stroke-width="3" /><path d="M 505 252 l 17 -2 l -5 -14 Z" fill="#388e3c" /><text x="690" y="203" font-size="12" text-anchor="middle" fill="#388e3c">PR OUT:</text><text x="690" y="219" font-size="12" text-anchor="middle" fill="#388e3c">Preempt and Abort</text><text x="690" y="235" font-size="12" text-anchor="middle" fill="#388e3c">Key_A</text><line x1="267" y1="237" x2="293" y2="263" stroke="#d32f2f" stroke-width="4" /><line x1="293" y1="237" x2="267" y2="263" stroke="#d32f2f" stroke-width="4" /><text x="245" y="300" font-size="12" text-anchor="middle" fill="#d32f2f" font-weight="bold">RESERVATION</text><text x="245" y="316" font-size="12" text-anchor="middle" fill="#d32f2f" font-weight="bold">CONFLICT</text></svg>