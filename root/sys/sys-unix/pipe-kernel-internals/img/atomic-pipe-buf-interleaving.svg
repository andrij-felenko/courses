<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Атомарність записів PIPE_BUF та чергування даних</text>
<rect x="40.0" y="15.0" width="920.0" height="45.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="40.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Атомарність записів у канал: межа PIPE_BUF (на Linux = 4096 байтів)</tspan><tspan x="500.0" dy="16.9">Кілька паралельних письменників ведуть запис в один канал чи FIFO</tspan></text>
<rect x="40.0" y="75.0" width="430.0" height="50.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="255.0" y="96.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">Випадок 1: Порція запису ≤ PIPE_BUF (наприклад, 1024 Б)</tspan><tspan x="255.0" dy="15.6">ГАРАНТІЯ POSIX: запис неподільний</tspan></text>
<rect x="40.0" y="135.0" width="430.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="158.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Письменник А: write(fd, msgA, 1024)</tspan><tspan x="255.0" dy="15.6">Письменник Б: write(fd, msgB, 1024)</tspan><tspan x="255.0" dy="15.6">Ядро захоплює pipe-&gt;mutex на весь обсяг запису</tspan></text>
<line x1="255.0" y1="205.0" x2="255.0" y2="235.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="235.0" width="430.0" height="95.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="255.0" y="271.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Буфер каналу (читач бачить чисті повідомлення):</tspan><tspan x="255.0" dy="15.6"></tspan><tspan x="255.0" dy="15.6">[  Повідомлення А (1024 Б)  ]  [  Повідомлення Б (1024 Б)  ]</tspan></text>
<rect x="40.0" y="345.0" width="430.0" height="110.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="255.0" y="389.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Результат: Повідомлення ніколи не змішуються.</tspan><tspan x="255.0" dy="14.3">Ідеально для логування від багатьох процесів у спільний FIFO:</tspan><tspan x="255.0" dy="14.3">кожен рядок або JSON-об'єкт до 4 КіБ записується як єдине ціле.</tspan></text>
<rect x="530.0" y="75.0" width="430.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="745.0" y="96.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">Випадок 2: Порція запису &gt; PIPE_BUF (наприклад, 8192 Б)</tspan><tspan x="745.0" dy="15.6">НЕМАЄ ГАРАНТІЇ АТОМАРНОСТІ: дані чергуються</tspan></text>
<rect x="530.0" y="135.0" width="430.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="745.0" y="158.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Письменник А: write(fd, dataA, 8192)</tspan><tspan x="745.0" dy="15.6">Письменник Б: write(fd, dataB, 8192)</tspan><tspan x="745.0" dy="15.6">Ядро розбиває запис на шматки, звільняючи м'ютекс між ними</tspan></text>
<line x1="745.0" y1="205.0" x2="745.0" y2="235.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="530.0" y="235.0" width="430.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="745.0" y="272.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Буфер каналу (фрагменти змішано!):</tspan><tspan x="745.0" dy="14.3"></tspan><tspan x="745.0" dy="14.3">[ А-частина 1 ] [ Б-частина 1 ] [ А-частина 2 ] [ Б-частина 2 ]</tspan></text>
<rect x="530.0" y="345.0" width="430.0" height="110.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="745.0" y="391.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Результат: Пошкодження структури протоколу.</tspan><tspan x="745.0" dy="11.7">Читач отримує перемішані байти від двох процесів.</tspan><tspan x="745.0" dy="11.7">Для передачі великих повідомлень потрібен зовнішній м'ютекс або окремі FIFO.</tspan></text>
</svg>