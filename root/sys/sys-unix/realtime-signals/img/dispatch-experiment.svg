<text x="580.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Бар'єр тримає приймач, доки відправник не наповнить чергу: без нього записи</tspan><tspan x="580.0" dy="15.6">забиралися б по одному, і черги — а отже, і порядку — просто не існувало б.</tspan><tspan x="580.0" dy="15.6">Менший номер обганяє більший; усередині одного номера — суворо порядок надсилання.</tspan></text>
