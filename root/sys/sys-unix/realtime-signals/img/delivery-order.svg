<text x="928.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ЯДРО ВІДДАЄ В ТАКОМУ ПОРЯДКУ</text>
<rect x="740.0" y="118.0" width="376.0" height="42.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="928.0" y="142.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="928.0" dy="0.0">1.  SIGTERM  —  звичайні мають перевагу</tspan></text>
<rect x="740.0" y="172.0" width="376.0" height="42.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="928.0" y="196.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="928.0" dy="0.0">2.  SIGCHLD  —  теж звичайний</tspan></text>
<rect x="740.0" y="226.0" width="376.0" height="42.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="928.0" y="250.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="928.0" dy="0.0">3.  SIGRTMIN+0 «стоп»  —  менший номер</tspan></text>
<rect x="740.0" y="280.0" width="376.0" height="42.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="928.0" y="304.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="928.0" dy="0.0">4.  SIGRTMIN+1 «#7»  —  хто перший ліг</tspan></text>
<rect x="740.0" y="334.0" width="376.0" height="42.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="928.0" y="358.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="928.0" dy="0.0">5.  SIGRTMIN+1 «#3»</tspan></text>
<rect x="740.0" y="388.0" width="376.0" height="42.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="928.0" y="412.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="928.0" dy="0.0">6.  SIGRTMIN+1 «#9»</tspan></text>
<rect x="740.0" y="442.0" width="376.0" height="42.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/><text x="928.0" y="466.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="928.0" dy="0.0">7.  SIGRTMIN+5 «лог», далі другий «лог»</tspan></text>
<text x="928.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="928.0" dy="0.0">Номер працює як пріоритет: черга меншого</tspan><tspan x="928.0" dy="15.6">номера спорожнюється повністю раніше,</tspan><tspan x="928.0" dy="15.6">ніж почнеться черга більшого.</tspan></text>
<text x="590.0" y="646.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">усередині номера — у порядку надсилання;  між номерами — менший перший;  між родинами — звичайні перші</text>
</svg>