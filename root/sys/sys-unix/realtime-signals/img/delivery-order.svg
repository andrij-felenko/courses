<rect x="368.0" y="150.0" width="122.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="429.0" y="168.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="429.0" dy="0.0">SIGHUP</tspan><tspan x="429.0" dy="14.3">0</tspan></text>
