<text x="360.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">скільки разів породжено — не видно</text>
<rect x="64.0" y="234.0" width="592.0" height="352.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
