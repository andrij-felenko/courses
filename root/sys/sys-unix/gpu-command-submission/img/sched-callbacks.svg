<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1193.5 776" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1193.5" height="776" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="140.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start">драйвер кличе планувальник — усе це в ioctl подання</text>
<rect x="140.0" y="58.0" width="620.0" height="62.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="450.0" y="93.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">drm_sched_job_init()  ·  завести завдання, прив'язати до сутності, оголосити кредит</tspan></text>
<rect x="140.0" y="136.0" width="620.0" height="62.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="450.0" y="171.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">drm_sched_job_add_dependency()  ·  віддати планувальникові вхідні огорожі</tspan></text>
<rect x="140.0" y="214.0" width="620.0" height="62.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="450.0" y="249.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">drm_sched_job_arm()  ·  народилася вихідна огорожа — відступати вже пізно</tspan></text>
<rect x="140.0" y="292.0" width="620.0" height="62.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="450.0" y="327.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">drm_sched_entity_push_job()  ·  завдання в черзі, ioctl повертається негайно</tspan></text>
<line x1="450.0" y1="120.0" x2="450.0" y2="134.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="450.0" y1="198.0" x2="450.0" y2="212.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="450.0" y1="276.0" x2="450.0" y2="290.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="450.0" y1="354.0" x2="450.0" y2="370.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="180.0" y="372.0" width="540.0" height="56.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="450.0" y="403.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">чекає: доки не впадуть усі вхідні огорожі, доки в кільці немає кредиту, доки сутність зайнята попереднім</tspan></text>
<line x1="450.0" y1="428.0" x2="450.0" y2="440.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="140.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start">планувальник кличе драйвер — у своєму потоці, у своєму темпі</text>
<rect x="140.0" y="480.0" width="620.0" height="62.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="515.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">prepare_job()  ·  останнє «ще чогось чекаємо?» — або NULL</tspan></text>
<rect x="140.0" y="558.0" width="620.0" height="62.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="593.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">run_job()  ·  покласти пакет у кільце, подзвонити, повернути апаратну огорожу</tspan></text>
<rect x="140.0" y="636.0" width="620.0" height="62.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="671.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">free_job()  ·  огорожа впала — звільнити завдання</tspan></text>
<line x1="450.0" y1="542.0" x2="450.0" y2="556.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="450.0" y1="620.0" x2="450.0" y2="634.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="790.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">строк</text>
<line x1="762.0" y1="589.0" x2="818.0" y2="589.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="820.0" y="558.0" width="320.0" height="90.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="980.0" y="606.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">timedout_job()  ·  спинити, скинути рушій або контекст, повернути DRM_GPU_SCHED_STAT_*</tspan></text>
<text x="140.0" y="730.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Між четвертим і п'ятим кроком лежить уся робота планувальника — драйвер про неї не знає нічого.</text>
</svg>