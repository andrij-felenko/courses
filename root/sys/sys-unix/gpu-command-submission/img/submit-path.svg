<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="170.0" width="230.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="212.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">програма</tspan><tspan x="155.0" dy="14.3">будує пакет, збирає список буферів</tspan></text>
<rect x="330.0" y="170.0" width="230.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="445.0" y="212.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="445.0" dy="0.0">ядро</tspan><tspan x="445.0" dy="14.3">перевіряє буфери, робить завдання</tspan></text>
<rect x="620.0" y="170.0" width="230.0" height="92.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="735.0" y="212.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">планувальник</tspan><tspan x="735.0" dy="15.6">тримає завдання, доки не час</tspan></text>
<rect x="910.0" y="170.0" width="230.0" height="92.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="1025.0" y="212.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1025.0" dy="0.0">апаратне кільце</tspan><tspan x="1025.0" dy="15.6">дзвінок і виконання</tspan></text>
<line x1="272.0" y1="216.0" x2="328.0" y2="216.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="562.0" y1="216.0" x2="618.0" y2="216.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="852.0" y1="216.0" x2="908.0" y2="216.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="155.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">простір користувача</text>
<text x="760.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ядро й залізо</text>
<text x="280.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">виклик повертається одразу — з вихідною огорожею замість результату</text>
<line x1="400.0" y1="166.0" x2="400.0" y2="110.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6,5"/>
<line x1="400.0" y1="110.0" x2="155.0" y2="110.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6,5"/>
<line x1="155.0" y1="110.0" x2="155.0" y2="166.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="600.0" y="310.0" width="300.0" height="62.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="750.0" y="337.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">вхідні огорожі ще не впали:</tspan><tspan x="750.0" dy="15.6">чужа робота не скінчилася</tspan></text>
<line x1="750.0" y1="306.0" x2="750.0" y2="266.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1025.0" y1="266.0" x2="1025.0" y2="306.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="930.0" y="310.0" width="250.0" height="62.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="1055.0" y="337.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1055.0" dy="0.0">переривання:</tspan><tspan x="1055.0" dy="15.6">робота скінчилася</tspan></text>
<line x1="1055.0" y1="374.0" x2="1055.0" y2="414.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="860.0" y="418.0" width="320.0" height="62.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="1020.0" y="445.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">вихідна огорожа падає —</tspan><tspan x="1020.0" dy="15.6">хто чекав, той прокидається</tspan></text>
<text x="40.0" y="508.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Між поданням і виконанням лежить час, і завдання переживає його в ядрі, а не в програмі.</text>
</svg>