<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Комірка буфера екрана й два перетворення на шляху до пікселів</text>
<rect x="60.0" y="36.0" width="400.0" height="54.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="59.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">поточні кольори емулятора:</tspan><tspan x="260.0" dy="16.9">текст, тло, яскравість, блимання</tspan></text>
<rect x="620.0" y="36.0" width="400.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="820.0" y="59.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">байти від програми: UTF-8 →</tspan><tspan x="820.0" dy="16.9">код символу Unicode, напр. U+0414</tspan></text>
<rect x="620.0" y="126.0" width="400.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="820.0" y="149.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">таблиця unimap:</tspan><tspan x="820.0" dy="16.9">код Unicode → номер гліфа</tspan></text>
<line x1="820.0" y1="96.0" x2="820.0" y2="120.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="260.0" y1="96.0" x2="260.0" y2="214.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="820.0" y1="186.0" x2="820.0" y2="214.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="540.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">комірка буфера екрана — 16 біт</text>
<rect x="60.0" y="220.0" width="400.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">старший байт: атрибут</tspan></text>
<rect x="620.0" y="220.0" width="400.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="820.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">молодший байт: номер гліфа</tspan></text>
<line x1="260.0" y1="286.0" x2="260.0" y2="334.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="820.0" y1="286.0" x2="820.0" y2="334.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="60.0" y="340.0" width="400.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="260.0" y="368.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">палітра: 8 кольорів, окремий біт</tspan><tspan x="260.0" dy="16.9">яскравості й окремий біт блимання</tspan></text>
<rect x="620.0" y="340.0" width="400.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="820.0" y="368.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">шрифт консолі: 256 матриць пікселів,</tspan><tspan x="820.0" dy="16.9">напр. 8 на 16 точок</tspan></text>
<line x1="260.0" y1="410.0" x2="470.0" y2="442.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="820.0" y1="410.0" x2="610.0" y2="442.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="300.0" y="448.0" width="480.0" height="54.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="540.0" y="471.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">fbcon розкладає матрицю в кадровий буфер:</tspan><tspan x="540.0" dy="16.9">одиничні біти — колір тексту, нульові — колір тла</tspan></text>
<rect x="60.0" y="516.0" width="960.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="540.0" y="537.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">vgacon не робить нічого з цього: та сама пара байтів і є вміст текстової пам'яті відеоплати</tspan></text>
</svg>