<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 756" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="756" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Простори імен входили в ядро поодинці, з 2002 по 2020 рік</text>
<rect x="40.0" y="24.0" width="200.0" height="38.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.4"/><text x="140.0" y="47.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">версія ядра</tspan></text>
<rect x="256.0" y="24.0" width="230.0" height="38.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.4"/><text x="371.0" y="47.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="371.0" dy="0.0">що ввійшло</tspan></text>
<rect x="502.0" y="24.0" width="518.0" height="38.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.4"/><text x="761.0" y="47.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="761.0" dy="0.0">хто і під яким тиском</tspan></text>
<rect x="40.0" y="74.0" width="200.0" height="62.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="140.0" y="101.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">2.4.19</tspan><tspan x="140.0" dy="15.6">серпень 2002</tspan></text>
<rect x="256.0" y="74.0" width="230.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="371.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="371.0" dy="0.0">монтування</tspan></text>
<rect x="502.0" y="74.0" width="518.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="761.0" y="108.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="761.0" dy="0.0">Alexander Viro — перенесення ідеї Plan 9; прапорець назвали просто CLONE_NEWNS</tspan></text>
<rect x="40.0" y="146.0" width="200.0" height="62.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="140.0" y="173.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">2.6.19</tspan><tspan x="140.0" dy="15.6">листопад 2006</tspan></text>
<rect x="256.0" y="146.0" width="230.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="371.0" y="181.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="371.0" dy="0.0">UTS · IPC</tspan></text>
<rect x="502.0" y="146.0" width="518.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="761.0" y="180.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="761.0" dy="0.0">Serge Hallyn, Cédric Le Goater (IBM) · Kirill Korotaev, Pavel Emelyanov (OpenVZ)</tspan></text>
<rect x="40.0" y="218.0" width="200.0" height="62.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="140.0" y="245.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">2.6.24</tspan><tspan x="140.0" dy="15.6">січень 2008</tspan></text>
<rect x="256.0" y="218.0" width="230.0" height="62.0" rx="6" fill="#ffffff" stroke="#7a4fb0" stroke-width="1.8"/><text x="371.0" y="253.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a4fb0" text-anchor="middle" font-weight="700"><tspan x="371.0" dy="0.0">номери процесів</tspan></text>
<rect x="502.0" y="218.0" width="518.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="761.0" y="252.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="761.0" dy="0.0">перший тип, де ім'я перекладається; звідси вся семантика процесу номер 1</tspan></text>
<rect x="40.0" y="290.0" width="200.0" height="62.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="140.0" y="317.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">2.6.29</tspan><tspan x="140.0" dy="15.6">березень 2009</tspan></text>
<rect x="256.0" y="290.0" width="230.0" height="62.0" rx="6" fill="#ffffff" stroke="#7a4fb0" stroke-width="1.8"/><text x="371.0" y="325.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a4fb0" text-anchor="middle" font-weight="700"><tspan x="371.0" dy="0.0">мережа (завершено)</tspan></text>
<rect x="502.0" y="290.0" width="518.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="761.0" y="324.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="761.0" dy="0.0">Eric Biederman, Daniel Lezcano, Pavel Emelyanov — переробка всього стека, шість випусків</tspan></text>
<rect x="40.0" y="362.0" width="200.0" height="62.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="140.0" y="389.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">3.0</tspan><tspan x="140.0" dy="15.6">липень 2011</tspan></text>
<rect x="256.0" y="362.0" width="230.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="371.0" y="397.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="371.0" dy="0.0">setns() і /proc/&lt;pid&gt;/ns</tspan></text>
<rect x="502.0" y="362.0" width="518.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="761.0" y="396.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="761.0" dy="0.0">простір дістав ручку: у нього стало можливо ввійти, а не лише народитися в ньому</tspan></text>
<rect x="40.0" y="434.0" width="200.0" height="62.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="140.0" y="461.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">3.8</tspan><tspan x="140.0" dy="15.6">лютий 2013</tspan></text>
<rect x="256.0" y="434.0" width="230.0" height="62.0" rx="6" fill="#ffffff" stroke="#7a4fb0" stroke-width="1.8"/><text x="371.0" y="469.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a4fb0" text-anchor="middle" font-weight="700"><tspan x="371.0" dy="0.0">користувачі</tspan></text>
<rect x="502.0" y="434.0" width="518.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="761.0" y="468.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="761.0" dy="0.0">Eric Biederman; шість років від порожньої заготовки — типи kuid_t/kgid_t по всьому дереву</tspan></text>
<rect x="40.0" y="506.0" width="200.0" height="62.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="140.0" y="533.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">4.6</tspan><tspan x="140.0" dy="15.6">травень 2016</tspan></text>
<rect x="256.0" y="506.0" width="230.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="371.0" y="541.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="371.0" dy="0.0">cgroup</tspan></text>
<rect x="502.0" y="506.0" width="518.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="761.0" y="540.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="761.0" dy="0.0">Aditya Kali (Google) — щоб контейнер не бачив, у якій точці ієрархії він насправді сидить</tspan></text>
<rect x="40.0" y="578.0" width="200.0" height="62.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="140.0" y="605.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">5.6</tspan><tspan x="140.0" dy="15.6">березень 2020</tspan></text>
<rect x="256.0" y="578.0" width="230.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="371.0" y="613.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="371.0" dy="0.0">час</tspan></text>
<rect x="502.0" y="578.0" width="518.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="761.0" y="612.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="761.0" dy="0.0">Andrei Vagin, Dmitry Safonov — не заради ізоляції, а заради перенесення живих процесів</tspan></text>
<rect x="40.0" y="658.0" width="980.0" height="46.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="530.0" y="685.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">об'єкта «контейнер» у ядрі так і не з'явилося — кожен розріз мусив бути корисним сам по собі</tspan></text>
<text x="530.0" y="732.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">вісімнадцять років між першим і останнім типом; спільного плану не було в жодну мить</text>
</svg>