<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1020 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1020" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="505.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що утримує простір імен живим</text>
<rect x="40.0" y="150.0" width="300.0" height="200.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/><text x="190.0" y="227.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">простір імен</tspan><tspan x="190.0" dy="18.2"></tspan><tspan x="190.0" dy="18.2">структура ядра</tspan><tspan x="190.0" dy="18.2">з лічильником посилань</tspan></text>
<rect x="452.0" y="64.0" width="518.0" height="56.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="711.0" y="96.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="711.0" dy="0.0">задачі, що зараз у ньому перебувають</tspan></text>
<line x1="438.0" y1="92.0" x2="392.0" y2="92.0" stroke="#2457d6" stroke-width="1.5"/>
<rect x="452.0" y="130.0" width="518.0" height="56.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="711.0" y="162.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="711.0" dy="0.0">відкритий дескриптор на /proc/&lt;pid&gt;/ns/&lt;тип&gt;</tspan></text>
<line x1="438.0" y1="158.0" x2="392.0" y2="158.0" stroke="#2457d6" stroke-width="1.5"/>
<rect x="452.0" y="196.0" width="518.0" height="56.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="711.0" y="228.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="711.0" dy="0.0">прив'язне монтування цього файлу — так робить ip netns</tspan></text>
<line x1="438.0" y1="224.0" x2="392.0" y2="224.0" stroke="#2457d6" stroke-width="1.5"/>
<rect x="452.0" y="262.0" width="518.0" height="56.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="711.0" y="294.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="711.0" dy="0.0">вкладений простір: для номерів і для користувачів</tspan></text>
<line x1="438.0" y1="290.0" x2="392.0" y2="290.0" stroke="#2457d6" stroke-width="1.5"/>
<rect x="452.0" y="328.0" width="518.0" height="56.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="711.0" y="360.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="711.0" dy="0.0">простір користувачів, що володіє цим простором</tspan></text>
<line x1="438.0" y1="356.0" x2="392.0" y2="356.0" stroke="#2457d6" stroke-width="1.5"/>
<line x1="392.0" y1="92.0" x2="392.0" y2="356.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="392.0" y1="250.0" x2="352.0" y2="250.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="406.0" width="930.0" height="60.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="505.0" y="440.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="505.0" dy="0.0">поки живе хоч одне посилання — простір цілий; коли впало останнє — ядро його прибирає</tspan></text>
<text x="505.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">простір без жодного процесу — нормальний робочий стан, а не витік</text>
<text x="505.0" y="526.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">порівняти два простори можна лише за номером вузла в readlink /proc/&lt;pid&gt;/ns/&lt;тип&gt;</text>
</svg>