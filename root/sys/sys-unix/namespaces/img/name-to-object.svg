<text x="510.0" y="586.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">змінюється не доступ до об'єктів, а таблиця, через яку до них дістаються</text>
