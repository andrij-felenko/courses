, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">(немає імені)</tspan></text><rect x="554.0" y="372.0" width="412.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="760.0" y="396.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">(немає імені)</tspan></text><rect x="540.0" y="424.0" width="440.0" height="46.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="760.0" y="443.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="760.0" dy="0.0">два об'єкти для нього не заборонені —</tspan><tspan x="760.0" dy="14.3">вони просто безіменні: kill дасть ESRCH</tspan></text>
