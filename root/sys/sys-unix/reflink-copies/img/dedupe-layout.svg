<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">запит FIDEDUPERANGE: один заголовок і масив призначень змінної довжини</text>
<rect x="70.0" y="66.0" width="400.0" height="30.0" rx="6" fill="#eceff3" stroke="#6b7280" stroke-width="1.6"/><text x="270.0" y="85.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">struct file_dedupe_range — заголовок, 24 Б</tspan></text>
<rect x="70.0" y="104.0" width="400.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="124.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">__u64 src_offset      8 Б</tspan></text>
<rect x="70.0" y="140.0" width="400.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="160.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">__u64 src_length      8 Б</tspan></text>
<rect x="70.0" y="176.0" width="400.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="196.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">__u16 dest_count      2 Б</tspan></text>
<rect x="70.0" y="212.0" width="400.0" height="32.0" rx="6" fill="#eceff3" stroke="#6b7280" stroke-width="1.5"/><text x="270.0" y="232.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">__u16 reserved1  +  __u32 reserved2      6 Б</tspan></text>
<rect x="70.0" y="262.0" width="400.0" height="30.0" rx="6" fill="#eceff3" stroke="#6b7280" stroke-width="1.6"/><text x="270.0" y="281.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">info[0] — struct file_dedupe_range_info, 32 Б</tspan></text>
<rect x="70.0" y="300.0" width="400.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="320.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">__s64 dest_fd         8 Б</tspan></text>
<rect x="70.0" y="336.0" width="400.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="356.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">__u64 dest_offset     8 Б</tspan></text>
<rect x="70.0" y="372.0" width="400.0" height="32.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="392.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">__u64 bytes_deduped   8 Б</tspan></text>
<rect x="70.0" y="408.0" width="400.0" height="32.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="428.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">__s32 status  +  __u32 reserved      8 Б</tspan></text>
<rect x="70.0" y="458.0" width="400.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="270.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="270.0" dy="0.0">info[1] … info[dest_count − 1]</tspan><tspan x="270.0" dy="16.2">той самий запис, по 32 Б</tspan></text>
<rect x="540.0" y="66.0" width="620.0" height="34.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="2.0"/><text x="850.0" y="87.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">виклик роблять на дескрипторі ДЖЕРЕЛА: ioctl(src_fd, FIDEDUPERANGE, &amp;arg)</tspan></text>
<rect x="540.0" y="118.0" width="620.0" height="118.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="850.0" y="155.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">стеля на кількість призначень — розмір сторінки:</tspan><tspan x="850.0" dy="17.6">24 + 32 · dest_count ≤ 4096</tspan><tspan x="850.0" dy="17.6">32 · dest_count ≤ 4072</tspan><tspan x="850.0" dy="17.6">dest_count ≤ 127</tspan></text>
<rect x="540.0" y="252.0" width="620.0" height="96.0" rx="6" fill="#eceff3" stroke="#6b7280" stroke-width="1.8"/><text x="850.0" y="287.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">src_length ядро мовчки обрізає:</tspan><tspan x="850.0" dy="17.6">типова стеля — 16 МіБ на один виклик,</tspan><tspan x="850.0" dy="17.6">більше просити можна, але скопійовано буде менше</tspan></text>
<rect x="540.0" y="364.0" width="620.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="850.0" y="407.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">ioctl повертає 0 (успіх) навіть тоді,</tspan><tspan x="850.0" dy="17.6">коли ЖОДНОГО байта не злито:</tspan><tspan x="850.0" dy="17.6">успіх виклику означає лише «ядро порівняло»,</tspan><tspan x="850.0" dy="17.6">результат кожного призначення — у власному status</tspan></text>
<rect x="540.0" y="510.0" width="620.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="850.0" y="554.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">status = FILE_DEDUPE_RANGE_SAME (0)      байти збіглися, блоки поділено</tspan><tspan x="850.0" dy="16.2">status = FILE_DEDUPE_RANGE_DIFFERS (1)   байти розійшлися, нічого не змінено</tspan></text>
<rect x="70.0" y="626.0" width="400.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="652.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">заповнює програма перед викликом</tspan></text>
<rect x="540.0" y="626.0" width="400.0" height="44.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="652.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">заповнює ядро на поверненні</tspan></text>
<rect x="980.0" y="626.0" width="180.0" height="44.0" rx="6" fill="#eceff3" stroke="#6b7280" stroke-width="1.5"/><text x="1070.0" y="652.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1070.0" dy="0.0">має бути нулем</tspan></text>
</svg>