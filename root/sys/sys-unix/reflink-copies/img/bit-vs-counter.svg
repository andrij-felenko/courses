<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">що станеться зі спільним блоком, коли один із двох файлів зітруть</text>
<rect x="40.0" y="52.0" width="1100.0" height="36.0" rx="6" fill="#eceff3" stroke="#6b7280" stroke-width="1.6"/><text x="590.0" y="74.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">облік вільного місця бітовою картою: на блок відведено один біт — зайнято або вільно</tspan></text>
<rect x="60.0" y="106.0" width="300.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="210.0" y="142.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">блок 1204: біт = 1</tspan><tspan x="210.0" dy="16.2">у карті двох файлів</tspan><tspan x="210.0" dy="16.2">стоїть той самий номер</tspan></text>
<text x="400.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">rm vm.img</text>
<line x1="366.0" y1="156.0" x2="434.0" y2="156.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="440.0" y="106.0" width="300.0" height="96.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="590.0" y="142.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">біт скидає той, хто стер</tspan><tspan x="590.0" dy="16.2">перший: біт = 0</tspan><tspan x="590.0" dy="16.2">запитати «а скільки ще?» нема в кого</tspan></text>
<line x1="746.0" y1="156.0" x2="814.0" y2="156.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="820.0" y="106.0" width="300.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="970.0" y="142.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">блок віддано новому файлу</tspan><tspan x="970.0" dy="16.2">backup.img читає чужі байти</tspan><tspan x="970.0" dy="16.2">це не хиба, а брак числа</tspan></text>
<rect x="60.0" y="218.0" width="1060.0" height="34.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="590.0" y="239.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">ext4, ext3, ext2 — тут поділу блоків не буде ніколи: місця під лічильник немає у форматі</tspan></text>
<rect x="40.0" y="296.0" width="1100.0" height="36.0" rx="6" fill="#eceff3" stroke="#6b7280" stroke-width="1.6"/><text x="590.0" y="318.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">облік деревом лічильників: на екстент відведено число — скільки файлів на нього посилається</tspan></text>
<rect x="60.0" y="350.0" width="300.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="210.0" y="386.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">екстент 1204+32768</tspan><tspan x="210.0" dy="16.2">власників: 2</tspan><tspan x="210.0" dy="16.2">число лежить в окремому дереві</tspan></text>
<text x="400.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">rm vm.img</text>
<line x1="366.0" y1="400.0" x2="434.0" y2="400.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="440.0" y="350.0" width="300.0" height="96.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="590.0" y="386.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">лічильник зменшується</tspan><tspan x="590.0" dy="16.2">власників: 1</tspan><tspan x="590.0" dy="16.2">жодного блока не звільнено</tspan></text>
<line x1="746.0" y1="400.0" x2="814.0" y2="400.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="820.0" y="350.0" width="300.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="970.0" y="386.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">місце повернеться тоді,</tspan><tspan x="970.0" dy="16.2">коли лічильник дійде нуля</tspan><tspan x="970.0" dy="16.2">backup.img читає своє</tspan></text>
<rect x="60.0" y="462.0" width="1060.0" height="34.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="590.0" y="483.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">XFS із reflink=1 (від ядра 4.9), Btrfs (від 2.6.29), OCFS2, bcachefs — лічильник у форматі є</tspan></text>
<rect x="40.0" y="520.0" width="1100.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="590.0" y="543.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">чи вміє файлова система ділити блоки — вирішує не набір викликів, а те,</tspan><tspan x="590.0" dy="18.9">чим у ній записано, що блок зайнято: бітом чи числом</tspan></text>
</svg>