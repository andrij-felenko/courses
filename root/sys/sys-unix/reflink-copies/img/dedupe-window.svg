<rect x="56.0" y="574.0" width="1228.0" height="130.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="2.0"/><text x="670.0" y="618.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">вікно вціліє, тільки якщо в ньому не змінилося НІЧОГО:   частка таких вікон = (1 − p) ^ (W / B)</tspan><tspan x="670.0" dy="16.9">p — частка переписаних блоків (тут 0.03), B — блок файлової системи 4 КіБ, W — вікно хешування</tspan><tspan x="670.0" dy="16.9">W = 40 ГіБ → 0.97^10485760 ≈ 0        W = 128 КіБ → 0.97³² = 0.377        W = 16 КіБ → 0.97⁴ = 0.885</tspan><tspan x="670.0" dy="16.9">дрібніше вікно знаходить більше — і коштує пам'яті: 24 Б на вікно, 60 МіБ проти 480 МіБ на дерево 320 ГіБ</tspan></text>
