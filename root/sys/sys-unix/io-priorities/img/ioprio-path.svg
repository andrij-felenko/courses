<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">куди їде число — і де воно зникає</text>
<rect x="40.0" y="66.0" width="290.0" height="60.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="100.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">потік із заданим ioprio</tspan></text>
<rect x="40.0" y="154.0" width="290.0" height="60.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="180.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">read(): запит подає</tspan><tspan x="185.0" dy="15.6">сам цей потік</tspan></text>
<rect x="40.0" y="242.0" width="290.0" height="60.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="268.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">bio несе клас і рівень</tspan><tspan x="185.0" dy="15.6">на собі</tspan></text>
<rect x="40.0" y="330.0" width="290.0" height="60.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="356.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">планувальник черги</tspan><tspan x="185.0" dy="15.6">упорядковує запити</tspan></text>
<rect x="40.0" y="418.0" width="290.0" height="60.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="452.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">пристрій</tspan></text>
<line x1="185.0" y1="126.0" x2="185.0" y2="154.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="185.0" y1="214.0" x2="185.0" y2="242.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="185.0" y1="302.0" x2="185.0" y2="330.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="185.0" y1="390.0" x2="185.0" y2="418.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="400.0" y="150.0" width="580.0" height="68.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="180.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">буферизований запис сюди не заходить: сторінки бруднить ваш потік,</tspan><tspan x="690.0" dy="15.6">а запит подає потік зворотного запису — зі своїм пріоритетом</tspan></text>
<line x1="396.0" y1="184.0" x2="336.0" y2="184.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="400.0" y="238.0" width="580.0" height="68.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="268.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">device-mapper, RAID, loop, мережеві ФС: запит перекладає потік ядра,</tspan><tspan x="690.0" dy="15.6">і початкове число далі не їде</tspan></text>
<line x1="396.0" y1="272.0" x2="336.0" y2="272.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="400.0" y="326.0" width="580.0" height="68.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="356.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">планувальник none просто передає запити далі —</tspan><tspan x="690.0" dy="15.6">число не читає ніхто (типово для NVMe)</tspan></text>
<line x1="396.0" y1="360.0" x2="336.0" y2="360.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="500.0" width="940.0" height="54.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="531.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">пріоритет діє лише там, де ВОДНОЧАС є затор у черзі і планувальник, який число читає</tspan></text>
</svg>