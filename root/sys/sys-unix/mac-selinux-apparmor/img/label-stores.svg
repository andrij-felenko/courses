<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де живе мітка і яка команда куди пише</text>
<rect x="60.0" y="70.0" width="330.0" height="88.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="225.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">semanage fcontext -a -t тип</tspan><tspan x="225.0" dy="19.5">«зразок шляху»</tspan></text>
<line x1="394.0" y1="114.0" x2="464.0" y2="114.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="470.0" y="56.0" width="400.0" height="116.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="670.0" y="99.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">база відповідностей</tspan><tspan x="670.0" dy="19.5">file_contexts і локальні додатки</tspan><tspan x="670.0" dy="19.5">зразок шляху → тип</tspan></text>
<line x1="670.0" y1="172.0" x2="670.0" y2="266.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="898.0" y="178.0" width="252.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1024.0" y="208.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1024.0" dy="0.0">restorecon -Rv</tspan><tspan x="1024.0" dy="18.2">читає базу</tspan><tspan x="1024.0" dy="18.2">й переписує мітку</tspan></text>
<rect x="470.0" y="268.0" width="400.0" height="116.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="670.0" y="311.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">мітка на самому inode</tspan><tspan x="670.0" dy="19.5">xattr security.selinux</tspan><tspan x="670.0" dy="19.5">це й читає ядро на перевірці</tspan></text>
<rect x="60.0" y="282.0" width="330.0" height="88.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="225.0" y="321.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">chcon -t тип файл</tspan><tspan x="225.0" dy="19.5">пише мітку напряму</tspan></text>
<line x1="394.0" y1="326.0" x2="464.0" y2="326.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="436.0" width="1060.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="479.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Переставляння міток (restorecon -R, fixfiles, /.autorelabel) бере тип із бази</tspan><tspan x="590.0" dy="19.5">і переписує ним xattr — тому мітка від chcon, не занесена в базу, зникає.</tspan></text>
</svg>