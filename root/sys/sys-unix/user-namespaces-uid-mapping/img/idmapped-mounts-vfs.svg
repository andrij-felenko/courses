<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Динамічне відображення інодів через ID-mapped mounts</text>
<text x="510.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">ID-mapped Mounts: Трансляція ідентифікаторів у VFS</text>
<text x="510.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Доступ до дискових файлів без модифікації chown та без перезапису інодів</text>
<rect x="94.2" y="182.6" width="211.5" height="114.8" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="208.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Дискова файлова система</tspan><tspan x="200.0" dy="18.2">(ext4 / xfs / btrfs)</tspan><tspan x="200.0" dy="18.2"></tspan><tspan x="200.0" dy="18.2">Inode owner: UID 1000</tspan><tspan x="200.0" dy="18.2">Фізичний вміст тома</tspan></text>
<rect x="396.2" y="182.6" width="227.5" height="114.8" rx="8" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="510.0" y="208.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Шар VFS (ID-mapped Mount)</tspan><tspan x="510.0" dy="18.2">mnt_userns відображення</tspan><tspan x="510.0" dy="18.2"></tspan><tspan x="510.0" dy="18.2">Трансляція на льоту:</tspan><tspan x="510.0" dy="18.2">UID 1000 &lt;-&gt; UID 0</tspan></text>
<rect x="702.3" y="182.6" width="235.5" height="114.8" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="208.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">User Namespace (Контейнер)</tspan><tspan x="820.0" dy="18.2">Процес із UID 0 (root)</tspan><tspan x="820.0" dy="18.2"></tspan><tspan x="820.0" dy="18.2">Бачить файл як owner UID 0</tspan><tspan x="820.0" dy="18.2">Повний доступ rwx</tspan></text>
<line x1="330.0" y1="240.0" x2="385.0" y2="240.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="635.0" y1="240.0" x2="690.0" y2="240.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="166.6" y="375.1" width="686.9" height="49.9" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="510.0" y="396.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Виклик mount_setattr(..., MOUNT_ATTR_IDMAP) прив'язує user namespace до точки монтування.</tspan><tspan x="510.0" dy="16.9">Різні контейнери можуть монтувати один том із різними відображеннями без повторного chown.</tspan></text>
</svg>