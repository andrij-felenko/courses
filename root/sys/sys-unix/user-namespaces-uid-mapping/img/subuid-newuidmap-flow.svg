<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність роботи newuidmap та subuid</text>
<text x="550.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність ініціалізації мапінгу через newuidmap</text>
<text x="550.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Авторизація subuid та запис у procfs непривілейованим користувачем</text>
<rect x="5.4" y="166.2" width="209.2" height="87.7" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="189.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">1. unshare(CLONE_NEWUSER)</tspan><tspan x="110.0" dy="16.9"></tspan><tspan x="110.0" dy="16.9">Процес створює user_ns.</tspan><tspan x="110.0" dy="16.9">Початковий UID = 65534</tspan></text>
<line x1="208.0" y1="210.0" x2="227.0" y2="210.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="220.4" y="166.2" width="209.2" height="87.7" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="325.0" y="189.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">2. Виклики newuidmap</tspan><tspan x="325.0" dy="16.9"></tspan><tspan x="325.0" dy="16.9">Запуск setuid-хелпера</tspan><tspan x="325.0" dy="16.9">newuidmap PID 0 1000 1...</tspan></text>
<line x1="423.0" y1="210.0" x2="442.0" y2="210.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="439.1" y="166.2" width="201.8" height="87.7" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="540.0" y="189.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">3. Перевірка /etc/subuid</tspan><tspan x="540.0" dy="16.9"></tspan><tspan x="540.0" dy="16.9">Утиліта звіряє право</tspan><tspan x="540.0" dy="16.9">користувача на діапазон</tspan></text>
<line x1="638.0" y1="210.0" x2="657.0" y2="210.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="654.1" y="166.2" width="201.8" height="87.7" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="755.0" y="189.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">4. Запис у uid_map</tspan><tspan x="755.0" dy="16.9"></tspan><tspan x="755.0" dy="16.9">Хелпер з root-правами</tspan><tspan x="755.0" dy="16.9">пише в /proc/PID/uid_map</tspan></text>
<line x1="853.0" y1="210.0" x2="872.0" y2="210.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="875.0" y="166.2" width="190.0" height="87.7" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="970.0" y="189.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">5. Готовий Namespace</tspan><tspan x="970.0" dy="16.9"></tspan><tspan x="970.0" dy="16.9">Процес отримує UID 0</tspan><tspan x="970.0" dy="16.9">та 65536 subuid</tspan></text>
<rect x="254.7" y="345.1" width="590.6" height="49.9" rx="6" fill="#f4f7fb" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="366.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Захисний механізм: непривілейований процес не може сам записати чужий subuid;</tspan><tspan x="550.0" dy="16.9">setuid-утиліта newuidmap виступає арбітром між користувачем та ядром</tspan></text>
</svg>