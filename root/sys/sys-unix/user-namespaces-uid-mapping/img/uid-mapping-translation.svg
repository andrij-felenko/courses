<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1060 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1060" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="525.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двонапрямне відображення UID між хостом та User Namespace</text>
<text x="525.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двонапрямне відображення UID/GID у ядрі Linux</text>
<text x="525.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ядро транслює ідентифікатори під час викликів VFS, getuid() та stat()</text>
<rect x="60.0" y="95.0" width="410.0" height="340.0" rx="10" fill="#f4f7fb" stroke="#2457d6" stroke-width="2.0"/>
<text x="265.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Хостовий простір імен (Host Namespace)</text>
<rect x="123.3" y="158.1" width="283.3" height="53.9" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="265.0" y="181.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Основний користувач (Host UID 1000)</tspan><tspan x="265.0" dy="16.9">виклики у ядро VFS / sys_open</tspan></text>
<rect x="145.6" y="278.1" width="238.9" height="53.9" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="265.0" y="301.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Діапазон SubUID (/etc/subuid)</tspan><tspan x="265.0" dy="16.9">Host UID 100000 .. 165535</tspan></text>
<rect x="103.1" y="373.2" width="323.8" height="43.6" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="265.0" y="391.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Невідображені UID хоста</tspan><tspan x="265.0" dy="15.6">поза 1000 та 100000..165535 -&gt; nobody (65534)</tspan></text>
<rect x="580.0" y="95.0" width="410.0" height="340.0" rx="10" fill="#f5fbf7" stroke="#27ae60" stroke-width="2.0"/>
<text x="785.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Новий User Namespace (Контейнер)</text>
<rect x="643.3" y="158.1" width="283.3" height="53.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="785.0" y="181.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Суперкористувач контейнера (UID 0)</tspan><tspan x="785.0" dy="16.9">CAP_SYS_ADMIN лише в межах цього ns</tspan></text>
<rect x="650.7" y="278.1" width="268.5" height="53.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="785.0" y="301.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Користувачі та сервіси контейнера</tspan><tspan x="785.0" dy="16.9">UID 1 .. 65536 (daemon, www-data)</tspan></text>
<rect x="667.6" y="373.2" width="234.9" height="43.6" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="785.0" y="391.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Спроба доступу до ресурсів хоста</tspan><tspan x="785.0" dy="15.6">Обмежено перевіркою ns_capable()</tspan></text>
<line x1="570.0" y1="185.0" x2="480.0" y2="185.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="525.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">0 -&gt; 1000</text>
<line x1="570.0" y1="305.0" x2="480.0" y2="305.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="525.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">1..65536</text>
</svg>