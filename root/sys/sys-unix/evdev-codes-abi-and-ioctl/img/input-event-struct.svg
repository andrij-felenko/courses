<rect x="30.0" y="175.0" width="390.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="225.0" y="215.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Поля структури struct input_event:</tspan><tspan x="225.0" dy="14.3">• time: позначка часу (input_event_sec / input_event_usec)</tspan><tspan x="225.0" dy="14.3">• type: тип події (EV_KEY=1, EV_REL=2, EV_ABS=3, EV_SYN=0)</tspan><tspan x="225.0" dy="14.3">• code: код органу (KEY_A=30, REL_X=0, ABS_X=0)</tspan><tspan x="225.0" dy="14.3">• value: значення (1=Down, 0=Up, 2=Repeat, delta/pos)</tspan></text>
<rect x="440.0" y="175.0" width="350.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="615.0" y="219.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Особливості сумісності та Y2038:</tspan><tspan x="615.0" dy="11.7">• З ядра Linux 4.16: поля input_event_sec / input_event_usec</tspan><tspan x="615.0" dy="11.7">• Читання read() повертає ціле число структур</tspan><tspan x="615.0" dy="11.7">• Часткове читання (наприклад, 10B) -&gt; повертає EINVAL</tspan><tspan x="615.0" dy="11.7">• 32-бітні програми на 64-бітному ядрі: шар CONFIG_COMPAT</tspan></text>
</svg>