<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння підходів стиснення: Fixed-Input (SquashFS) проти Fixed-Output (EROFS)</text>
<rect x="40.0" y="60.0" width="1100.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="90.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">SquashFS: Fixed-Input Compression (фіксований вхід)</tspan></text>
<rect x="60.0" y="130.0" width="260.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="161.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Вхідний блок даних</tspan><tspan x="190.0" dy="16.9">(128 КБ нестиснено)</tspan></text>
<line x1="320.0" y1="165.0" x2="360.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="360.0" y="130.0" width="240.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="161.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Алгоритм zlib/XZ</tspan><tspan x="480.0" dy="16.9">стискає 128 КБ в один блок</tspan></text>
<line x1="600.0" y1="165.0" x2="640.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="130.0" width="220.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Стиснений блок на диску</tspan><tspan x="750.0" dy="13.0">(невирівняний розмір, напр. 37 КБ)</tspan></text>
<line x1="860.0" y1="165.0" x2="900.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="900.0" y="130.0" width="220.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1010.0" y="161.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1010.0" dy="0.0">Читання 4 КБ потребує</tspan><tspan x="1010.0" dy="15.6">розпакування всього 128 КБ!</tspan></text>
<line x1="40.0" y1="235.0" x2="1140.0" y2="235.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 6"/>
<rect x="40.0" y="260.0" width="1100.0" height="50.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="290.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">EROFS: Fixed-Output Compression (фіксований вихід)</tspan></text>
<rect x="60.0" y="330.0" width="260.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="361.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Змінний логічний обсяг</tspan><tspan x="190.0" dy="16.9">(наприклад, 12 КБ = 3 сторінки)</tspan></text>
<line x1="320.0" y1="365.0" x2="360.0" y2="365.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="360.0" y="330.0" width="240.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="361.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Упаковка LZ4/Zstd у фіксований</tspan><tspan x="480.0" dy="16.9">фізичний блок диска</tspan></text>
<line x1="600.0" y1="365.0" x2="640.0" y2="365.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="330.0" width="220.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="361.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">Фізичний блок на диску</tspan><tspan x="750.0" dy="16.9">(строго 4 КБ / PAGE_SIZE)</tspan></text>
<line x1="860.0" y1="365.0" x2="900.0" y2="365.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="900.0" y="330.0" width="220.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1010.0" y="361.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1010.0" dy="0.0">In-place декомпресія</tspan><tspan x="1010.0" dy="14.3">прямо в сторінки Page Cache!</tspan></text>
<rect x="100.0" y="440.0" width="980.0" height="240.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="590.0" y="496.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Порівняльний підсумок ефективності:</tspan><tspan x="590.0" dy="16.9"></tspan><tspan x="590.0" dy="16.9">• Read Amplification (підвищення обсягу зчитування):</tspan><tspan x="590.0" dy="16.9">  SquashFS: розпаковує до 32× більше даних, ніж потрібно для однієї 4 КБ сторінки.</tspan><tspan x="590.0" dy="16.9">  EROFS: зчитує точно один або мінімальну кількість 4 КБ блоків (1x-2x amplification).</tspan><tspan x="590.0" dy="16.9"></tspan><tspan x="590.0" dy="16.9">• Тимчасові буфери оперативної пам'яті:</tspan><tspan x="590.0" dy="16.9">  SquashFS: вимагає проміжного буфера декомпресії в RAM.</tspan><tspan x="590.0" dy="16.9">  EROFS: декомпресія за місцем (In-place decompression) без додаткових виділень пам'яті.</tspan></text>
</svg>