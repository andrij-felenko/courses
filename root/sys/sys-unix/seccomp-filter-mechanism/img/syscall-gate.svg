<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 910" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="910" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фільтр стоїть на вході в ядро й бачить лише регістри</text>
<rect x="60.0" y="60.0" width="560.0" height="68.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="340.0" y="99.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">процес: код застосунку і libc</tspan></text>
<rect x="60.0" y="148.0" width="560.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="180.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">інструкція входу в ядро: номер виклику й шість аргументів</tspan><tspan x="340.0" dy="18.2">покладено в регістри</tspan></text>
<rect x="700.0" y="148.0" width="540.0" height="118.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="970.0" y="194.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">пам'ять процесу</tspan><tspan x="970.0" dy="16.9">за адресою з args[0] лежить рядок &quot;/tmp/ok&quot;,</tspan><tspan x="970.0" dy="16.9">але сусідній потік може переписати його будь-якої миті</tspan></text>
<line x1="60.0" y1="250.0" x2="1240.0" y2="250.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7,6"/>
<text x="150.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">простір користувача</text>
<text x="1140.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">ядро</text>
<line x1="340.0" y1="222.0" x2="340.0" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="300.0" width="560.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="336.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">точка входу в ядро</tspan></text>
<line x1="340.0" y1="362.0" x2="340.0" y2="400.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="400.0" width="560.0" height="250.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="340.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">перевірка seccomp: прогін програми фільтра</text>
<rect x="88.0" y="452.0" width="504.0" height="172.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="340.0" y="506.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">усе, що подано на вхід фільтрові:</tspan><tspan x="340.0" dy="18.2">nr — номер виклику</tspan><tspan x="340.0" dy="18.2">arch — у якій саме таблиці шукати цей номер</tspan><tspan x="340.0" dy="18.2">instruction_pointer — звідки зроблено виклик</tspan><tspan x="340.0" dy="18.2">args[0..5] — шість аргументів як голі числа</tspan></text>
<line x1="620.0" y1="500.0" x2="940.0" y2="500.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="8,6"/>
<line x1="760.0" y1="476.0" x2="800.0" y2="524.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="800.0" y1="476.0" x2="760.0" y2="524.0" stroke="#c0392b" stroke-width="3.0"/>
<rect x="700.0" y="552.0" width="540.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="970.0" y="587.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">читати цю пам'ять фільтрові заборонено:</tspan><tspan x="970.0" dy="16.9">перевірене значення можна підмінити між перевіркою</tspan><tspan x="970.0" dy="16.9">і вжитком, тож перевіряють лише числа</tspan></text>
<line x1="220.0" y1="650.0" x2="220.0" y2="706.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="706.0" width="320.0" height="118.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="752.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">вирок дозволяє</tspan><tspan x="220.0" dy="16.9">таблиця системних викликів → обробник →</tspan><tspan x="220.0" dy="16.9">звичайне повернення результату</tspan></text>
<line x1="470.0" y1="650.0" x2="470.0" y2="706.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="400.0" y="706.0" width="840.0" height="118.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="820.0" y="752.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">вирок не дозволяє</tspan><tspan x="820.0" dy="16.9">обробник не запускається взагалі: процес отримує помилку,</tspan><tspan x="820.0" dy="16.9">сигнал SIGSYS, передачу наглядачеві — або гине</tspan></text>
</svg>