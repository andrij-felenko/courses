<rect x="790.0" y="112.0" width="540.0" height="150.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="1060.0" y="157.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">jt і jf — не адреси, а зсуви:</tspan><tspan x="1060.0" dy="16.9">скільки інструкцій пропустити,</tspan><tspan x="1060.0" dy="16.9">рахуючи від НАСТУПНОЇ.</tspan><tspan x="1060.0" dy="16.9">тому jt=0 означає «перейти на наступну»,</tspan><tspan x="1060.0" dy="16.9">а не «нікуди не переходити»</tspan></text>
<rect x="790.0" y="290.0" width="540.0" height="180.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1060.0" y="333.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">звідси прийом «пара»:</tspan><tspan x="1060.0" dy="16.9">порівняння, а одразу за ним RET ALLOW.</tspan><tspan x="1060.0" dy="16.9"></tspan><tspan x="1060.0" dy="16.9">збіг (jt=0) — падаємо на RET ALLOW</tspan><tspan x="1060.0" dy="16.9">не збіг (jf=1) — перестрибуємо RET</tspan><tspan x="1060.0" dy="16.9">і йдемо на наступне порівняння.</tspan><tspan x="1060.0" dy="16.9">усі зсуви лишаються 0 і 1, рахувати нічого</tspan></text>
<rect x="790.0" y="498.0" width="540.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1060.0" y="552.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">ціна прийому: дві інструкції</tspan><tspan x="1060.0" dy="16.9">на кожен дозволений виклик.</tspan><tspan x="1060.0" dy="16.9">сто дозволених — двісті інструкцій поспіль,</tspan><tspan x="1060.0" dy="16.9">і останній у ланцюзі платить за всіх</tspan></text>
<rect x="790.0" y="676.0" width="540.0" height="122.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1060.0" y="716.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">arch перевіряють ПЕРШИМ: номер без таблиці</tspan><tspan x="1060.0" dy="16.9">не означає нічого. одразу за ним —</tspan><tspan x="1060.0" dy="16.9">відсів x32 за бітом 0x40000000,</tspan><tspan x="1060.0" dy="16.9">бо arch у нього той самий</tspan></text>
