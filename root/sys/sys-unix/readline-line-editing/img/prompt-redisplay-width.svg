<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розрахунок видимої ширини промпта</text>
<text x="540.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обчислення видимої ширини промпта та маркери невидимих escape-кодів</text>
<rect x="40.0" y="70.0" width="1000.0" height="160.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="540.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">ПРОБЛЕМА: Промпт із сирими ANSI-кодами кольору без маркерів екранування</tspan><tspan x="540.0" dy="15.6"></tspan><tspan x="540.0" dy="15.6">Рядок у PS1:  \033[32m user@host:~$ \033[0m   (довжина: 24 байти)</tspan><tspan x="540.0" dy="15.6">Видимий текст: user@host:~$                    (реальна ширина: 12 стовпчиків)</tspan><tspan x="540.0" dy="15.6"></tspan><tspan x="540.0" dy="15.6">Без маркерів Readline вважає довжину 24 стовпчиками: курсор на екрані стоїть на 13-й колонці,</tspan><tspan x="540.0" dy="15.6">а внутрішній лічильник думає, що на 25-й. Довгі команди ламають перенесення рядків і затирають промпт!</tspan></text>
<rect x="40.0" y="255.0" width="1000.0" height="165.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="540.0" y="294.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">РІШЕННЯ: Маркери нульової ширини \[ і \] (у Readline: \001 RL_PROMPT_START_IGNORE та \002 RL_PROMPT_END_IGNORE)</tspan><tspan x="540.0" dy="15.6"></tspan><tspan x="540.0" dy="15.6">Рядок у PS1:  \[\033[32m\] user@host:~$ \[\033[0m\]</tspan><tspan x="540.0" dy="15.6">Дисплейний рушій: байти між \001 та \002 передаються терміналу для забарвлення,</tspan><tspan x="540.0" dy="15.6">але їхня ширина прирівнюється до 0 під час обчислення позиції курсора через wcwidth().</tspan><tspan x="540.0" dy="15.6"></tspan><tspan x="540.0" dy="15.6">Результат: Readline знає точну ширину 12 стовпчиків, і перенесення рядка спрацьовує точно на краю вікна.</tspan></text>
<text x="540.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Функція rl_redisplay() використовує видиму ширину колонок для обчислення мінімальної різниці оновлення</text>
</svg>