<text x="560.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура GNU Readline</text>
<text x="560.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потік введення та перемальовування в архітектурі GNU Readline</text>
<rect x="40.0" y="70.0" width="210.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="98.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Емулятор термінала</tspan><tspan x="145.0" dy="16.2">або клавіатура</tspan><tspan x="145.0" dy="16.2">потік байтів у pty</tspan></text>
