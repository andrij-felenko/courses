<rect x="200.0" y="195.0" width="720.0" height="80.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="560.0" y="223.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Внутрішній стан бібліотеки:</tspan><tspan x="560.0" dy="15.6">Збережений термінальний стан termios · Кільце вирізання (Kill Ring) · Історія команд</tspan><tspan x="560.0" dy="15.6">Таблиці прив'язок клавіш ~/.inputrc · Хуки завершення слів (Completion)</tspan></text>
<rect x="900.0" y="320.0" width="180.0" height="80.0" rx="6" fill="#fff8e6" stroke="#6b7280" stroke-width="1.5"/><text x="990.0" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">Дисплейний рушій</tspan><tspan x="990.0" dy="15.6">rl_redisplay()</tspan><tspan x="990.0" dy="15.6">мінімальний VT100 diff</tspan></text>
