<line x1="145.0" y1="440.0" x2="145.0" y2="404.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="320.0" width="210.0" height="80.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="145.0" y="350.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Прикладна програма</tspan><tspan x="145.0" dy="13.0">(Bash, Python REPL, GDB)</tspan><tspan x="145.0" dy="13.0">отримує готовий char* після Enter</tspan></text>
<text x="560.0" y="478.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Readline бере відлуння й редагування на себе, повертаючи ядру оригінальний termios при виході</text>
