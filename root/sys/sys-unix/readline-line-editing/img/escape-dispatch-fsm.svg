<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Диспетчеризація послідовностей клавіш</text>
<text x="540.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дерево диспетчеризації вхідних байтів та таймаут keyseq-timeout</text>
<rect x="40.0" y="80.0" width="230.0" height="80.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="155.0" y="108.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Вхідний байт із read(0)</tspan><tspan x="155.0" dy="16.2">Звичайний друкований знак</tspan><tspan x="155.0" dy="16.2">або базовий Ctrl-код</tspan></text>
<rect x="40.0" y="210.0" width="230.0" height="80.0" rx="6" fill="#fff8e6" stroke="#6b7280" stroke-width="1.5"/><text x="155.0" y="238.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Префіксний байт 0x1B (ESC)</tspan><tspan x="155.0" dy="16.2">Початок керівної послідовності</tspan><tspan x="155.0" dy="16.2">або одиночна клавіша Esc</tspan></text>
<rect x="40.0" y="340.0" width="230.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="155.0" y="368.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Таймер keyseq-timeout</tspan><tspan x="155.0" dy="15.6">(типово 500 мс)</tspan><tspan x="155.0" dy="15.6">очікування наступного байта</tspan></text>
<line x1="155.0" y1="294.0" x2="155.0" y2="336.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="274.0" y1="380.0" x2="366.0" y2="380.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="370.0" y="340.0" width="320.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="369.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Таймаут вичерпано, більше байтів немає:</tspan><tspan x="530.0" dy="14.3">Подія: натиснуто одиночний «Escape»</tspan><tspan x="530.0" dy="14.3">Emacs: префікс Meta · Vi: перехід у Normal Mode</tspan></text>
<line x1="274.0" y1="250.0" x2="366.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="370.0" y="210.0" width="320.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="530.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Байт надійшов до вичерпання таймауту:</tspan><tspan x="530.0" dy="15.6">Пошук гілки в дереві Keymap:</tspan><tspan x="530.0" dy="15.6">«[» (CSI) або «O» (SS3) або символ для Meta-</tspan></text>
<line x1="694.0" y1="250.0" x2="756.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="760.0" y="90.0" width="280.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="117.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">ESC [ A  →  Стрілка вгору (previous-history)</tspan><tspan x="900.0" dy="13.7">ESC [ B  →  Стрілка вниз (next-history)</tspan><tspan x="900.0" dy="13.7">ESC [ C  →  Стрілка вправо (forward-char)</tspan></text>
<line x1="694.0" y1="250.0" x2="756.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="760.0" y="210.0" width="280.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">ESC [ 3 ~  →  Delete (delete-char)</tspan><tspan x="900.0" dy="13.7">ESC [ 1 ; 5 C  →  Ctrl+Right (forward-word)</tspan><tspan x="900.0" dy="13.7">ESC [ H / ESC [ F  →  Home / End</tspan></text>
<line x1="694.0" y1="250.0" x2="756.0" y2="360.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="760.0" y="330.0" width="280.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="356.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">ESC f  →  Alt+F (forward-word)</tspan><tspan x="900.0" dy="15.0">ESC b  →  Alt+B (backward-word)</tspan><tspan x="900.0" dy="15.0">ESC d  →  Alt+D (kill-word)</tspan></text>
<text x="540.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">База terminfo зіставляє послідовності емулятора (kcuu1, kdch1) з функціями Readline</text>
</svg>