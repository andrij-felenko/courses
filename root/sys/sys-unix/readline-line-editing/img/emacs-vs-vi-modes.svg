<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння режимів Emacs і Vi</text>
<text x="550.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два світи взаємодії: безмодальний Emacs проти модального автомата Vi</text>
<rect x="40.0" y="70.0" width="480.0" height="50.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="280.0" y="99.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">Режим Emacs (безмодальний, за замовчуванням)</tspan></text>
<rect x="40.0" y="135.0" width="480.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Єдиний стан введення:</tspan><tspan x="280.0" dy="13.0">• Звичайні символи відразу додаються в буфер</tspan><tspan x="280.0" dy="13.0">• Ctrl+ (символьні операції): Ctrl+A (початок), Ctrl+E (кінець), Ctrl+T (своп)</tspan><tspan x="280.0" dy="13.0">• Alt+ / Meta (операції над словами): Alt+F, Alt+B, Alt+U, Alt+L</tspan></text>
<rect x="40.0" y="250.0" width="480.0" height="115.0" rx="6" fill="#fff8e6" stroke="#6b7280" stroke-width="1.5"/><text x="280.0" y="289.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Кільцевий буфер вирізання (Kill Ring):</tspan><tspan x="280.0" dy="14.3">Ctrl+K (вбити до кінця), Ctrl+U (до початку), Ctrl+W (слово назад)</tspan><tspan x="280.0" dy="14.3">                      ↓ запис у kill_ring[ ]</tspan><tspan x="280.0" dy="14.3">Ctrl+Y (yank: вставити)  ⇄  Alt+Y (yank-pop: перебрати старіші записи)</tspan></text>
<rect x="40.0" y="380.0" width="480.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="406.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Пошук в історії:</tspan><tspan x="280.0" dy="15.6">Ctrl+R (зворотний інкрементний пошук) · Ctrl+S (прямий)</tspan></text>
<rect x="580.0" y="70.0" width="480.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="820.0" y="99.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">Режим Vi (модальний: set editing-mode vi)</tspan></text>
<rect x="580.0" y="135.0" width="220.0" height="85.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="158.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Insert Mode (вставка)</tspan><tspan x="690.0" dy="15.6">Введення тексту;</tspan><tspan x="690.0" dy="15.6">Enter виконує команду</tspan><tspan x="690.0" dy="15.6">Backspace видаляє знак</tspan></text>
<rect x="840.0" y="135.0" width="220.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="950.0" y="159.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">Normal / Command Mode</tspan><tspan x="950.0" dy="14.3">Клавіші = команди;</tspan><tspan x="950.0" dy="14.3">Навігація h, j, k, l, w, b, $, 0</tspan><tspan x="950.0" dy="14.3">Повтор «.», пошук «/», «?»</tspan></text>
<line x1="804.0" y1="160.0" x2="836.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="820.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ESC</text>
<line x1="836.0" y1="195.0" x2="804.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="820.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">i, a, I, A</text>
<rect x="580.0" y="250.0" width="480.0" height="115.0" rx="6" fill="#fff8e6" stroke="#6b7280" stroke-width="1.5"/><text x="820.0" y="280.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Граматика команд Normal Mode:</tspan><tspan x="820.0" dy="15.6">[лічильник] + оператор + [лічильник] + рух</tspan><tspan x="820.0" dy="15.6">• d + w  → видалити слово (dw)  ·  3 + d + w → видалити 3 слова</tspan><tspan x="820.0" dy="15.6">• c + $  → змінити до кінця рядка (перехід у Insert Mode)</tspan><tspan x="820.0" dy="15.6">• y + y  → скопіювати рядок у регістр · p / P → вставити з регістру</tspan></text>
<rect x="580.0" y="380.0" width="480.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="406.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Візуальна індикація режиму в терміналі:</tspan><tspan x="820.0" dy="14.3">show-mode-in-prompt або форма курсора (паличка в Insert, блок у Normal)</tspan></text>
</svg>