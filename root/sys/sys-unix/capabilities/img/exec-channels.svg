<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1380 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1380" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="685.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три канали, якими можливість переживає exec</text>
<rect x="30.0" y="93.0" width="240.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">P(успадковувані)</tspan></text>
<text x="305.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#6b7280" text-anchor="middle">∩</text>
<rect x="350.0" y="93.0" width="240.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">F(успадковувані)</tspan></text>
<text x="310.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">обидві сторони мусять погодитись</text>
<rect x="30.0" y="233.0" width="240.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">F(дозволені)</tspan></text>
<text x="305.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#6b7280" text-anchor="middle">∩</text>
<rect x="350.0" y="233.0" width="240.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">P(гранична стеля)</tspan></text>
<text x="310.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">файл дає, стеля не пускає вище</text>
<rect x="30.0" y="373.0" width="240.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="394.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">P′(навколишні)</tspan></text>
<rect x="350.0" y="373.5" width="240.0" height="33.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="394.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">нікого не питає</tspan></text>
<text x="310.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">з ядра 4.3: проходить без позначок на файлі</text>
<line x1="595.0" y1="110.0" x2="700.0" y2="228.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="595.0" y1="250.0" x2="700.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="595.0" y1="390.0" x2="700.0" y2="272.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="715.0" y="190.0" width="280.0" height="120.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="855.0" y="227.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">P′(дозволені)</tspan><tspan x="855.0" dy="18.2"></tspan><tspan x="855.0" dy="18.2">що новий образ</tspan><tspan x="855.0" dy="18.2">має право вмикати</tspan></text>
<line x1="1000.0" y1="250.0" x2="1085.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1100.0" y="190.0" width="250.0" height="120.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="1225.0" y="227.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1225.0" dy="0.0">P′(діючі)</tspan><tspan x="1225.0" dy="18.2"></tspan><tspan x="1225.0" dy="18.2">що ядро справді</tspan><tspan x="1225.0" dy="18.2">питає на перевірці</tspan></text>
<rect x="441.6" y="505.1" width="486.8" height="49.9" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="685.0" y="526.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">у діючі лягає все дозволене, якщо на файлі стоїть біт «діючий»;</tspan><tspan x="685.0" dy="16.9">інакше — лише навколишні, і програма вмикає решту сама</tspan></text>
</svg>