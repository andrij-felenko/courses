<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="960.0" height="380.0" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="500.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Організація користувацького простору XDG Base Directory</text>
<rect x="40.0" y="80.0" width="920.0" height="300.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="60.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">Домашній каталог користувача (~/ або /home/user)</text>
<line x1="55.0" y1="125.0" x2="945.0" y2="125.0" stroke="#2457d6" stroke-width="1.0"/>
<rect x="55.0" y="140.0" width="890.0" height="38.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/>
<text x="70.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">$XDG_CONFIG_HOME</text>
<text x="260.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">~/.config</text>
<text x="460.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Конфігурації додатків користувача (ini, json, yaml)</text>
<rect x="55.0" y="186.0" width="890.0" height="38.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/>
<text x="70.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">$XDG_DATA_HOME</text>
<text x="260.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">~/.local/share</text>
<text x="460.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Персональні дані, файли баз даних, ярлики .desktop</text>
<rect x="55.0" y="232.0" width="890.0" height="38.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/>
<text x="70.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">$XDG_CACHE_HOME</text>
<text x="260.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">~/.cache</text>
<text x="460.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Непринципові тимчасові кеші (браузери, мініатюри)</text>
<rect x="55.0" y="278.0" width="890.0" height="38.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/>
<text x="70.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">$XDG_STATE_HOME</text>
<text x="260.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">~/.local/state</text>
<text x="460.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Стан сесій, історія команд, логи додатків</text>
<rect x="55.0" y="324.0" width="890.0" height="38.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/>
<text x="70.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">$XDG_RUNTIME_DIR</text>
<text x="260.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">/run/user/$UID</text>
<text x="460.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Тимчасові сокети Wayland/PipeWire, tmpfs у RAM</text>
</svg>