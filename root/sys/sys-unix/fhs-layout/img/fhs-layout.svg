<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="1000.0" height="480.0" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="520.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікаційна матриця FHS 3.0 та основні каталоги</text>
<text x="280.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Shareable (Спільні для мережі)</text>
<text x="760.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Unshareable (Унікальні для хоста)</text>
<rect x="40.0" y="110.0" width="470.0" height="180.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="55.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">Static + Shareable</text>
<text x="55.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Не змінюються під час роботи; спільні для NFS</text>
<rect x="55.0" y="175.0" width="440.0" height="26.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/>
<text x="65.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">/usr/bin — Користувацькі утиліти</text>
<rect x="55.0" y="207.0" width="440.0" height="26.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/>
<text x="65.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">/usr/lib — Бібліотеки програм</text>
<rect x="55.0" y="239.0" width="440.0" height="26.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/>
<text x="65.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">/usr/share — Незалежні від арх. дані (doc, man)</text>
<rect x="530.0" y="110.0" width="470.0" height="180.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="545.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Static + Unshareable</text>
<text x="545.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Змінюються лише адміністратором; унікальні для хоста</text>
<rect x="545.0" y="175.0" width="440.0" height="26.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="555.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">/etc — Конфігураційні файли системи</text>
<rect x="545.0" y="207.0" width="440.0" height="26.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="555.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">/boot — Ядро vmlinuz, initramfs, GRUB</text>
<rect x="545.0" y="239.0" width="440.0" height="26.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/>
<text x="555.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">/etc/fstab, /etc/hosts — Специфіка хоста</text>
<rect x="40.0" y="305.0" width="470.0" height="180.0" rx="8" fill="#fff6e5" stroke="#d97706" stroke-width="1.5"/>
<text x="55.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b45309" text-anchor="start" font-weight="700">Variable + Shareable</text>
<text x="55.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Динамічно змінюються; можуть ділитися у мережі</text>
<rect x="55.0" y="370.0" width="440.0" height="26.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.0"/>
<text x="65.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">/var/mail — Поштові скриньки користувачів</text>
<rect x="55.0" y="402.0" width="440.0" height="26.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.0"/>
<text x="65.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">/var/spool/news — Черги новин та друку</text>
<rect x="55.0" y="434.0" width="440.0" height="26.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.0"/>
<text x="65.0" y="451.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">/srv — Дані веб-серверів та FTP (FHS 3.0)</text>
<rect x="530.0" y="305.0" width="470.0" height="180.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="545.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">Variable + Unshareable</text>
<text x="545.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Змінюються під час роботи; строго локальні для хоста</text>
<rect x="545.0" y="370.0" width="440.0" height="26.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="555.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">/var/log — Журнали системних подій</text>
<rect x="545.0" y="402.0" width="440.0" height="26.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="555.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">/var/run (/run) — PID-файли та сокети в RAM</text>
<rect x="545.0" y="434.0" width="440.0" height="26.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/>
<text x="555.0" y="451.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">/tmp, /var/tmp — Тимчасові файли</text>
</svg>