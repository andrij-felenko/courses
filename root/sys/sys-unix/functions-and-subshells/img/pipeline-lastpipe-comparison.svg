<text x="197.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">fork() ──► Subshell #1 (PID 2001)</text>
<text x="197.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">Виконує: echo &quot;data&quot;</text>
<line x1="197.0" y1="185.0" x2="197.0" y2="210.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="197.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">pipe [0] ◄── [1]</text>
<rect x="45.0" y="215.0" width="305.0" height="75.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.0"/>
<text x="197.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">fork() ──► Subshell #2 (PID 2002)</text>
<text x="197.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">Виконує: while read line; count=1</text>
<text x="197.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">Змінна count=1 живе лише в PID 2002</text>
<rect x="45.0" y="310.0" width="305.0" height="95.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.0"/>
<text x="197.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Батьківська оболонка (PID 2000)</text>
<text x="197.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Очікує завершення: waitpid()</text>
<text x="197.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">Результат: $count все ще 0 (Втрачено!)</text>
<text x="197.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Пам'ять Subshell #2 знищена ядром</text>
