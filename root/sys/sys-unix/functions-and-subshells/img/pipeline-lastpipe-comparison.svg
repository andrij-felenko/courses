<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр: стандартні підоболонки проти оптимізації shopt -s lastpipe</text>
<rect x="30.0" y="55.0" width="335.0" height="370.0" rx="6" fill="#f8fafc" stroke="#dc2626" stroke-width="1.5"/>
<text x="197.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">Стандартний конвеєр (POSIX / Bash)</text>
<text x="197.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">echo &quot;data&quot; | while read line; do count=1; done</text>
<line x1="45.0" y1="110.0" x2="350.0" y2="110.0" stroke="#fca5a5" stroke-width="1.0"/>
