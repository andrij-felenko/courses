<text x="562.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">Оптимізація shopt -s lastpipe</text>
<text x="562.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">(Ksh93, Zsh дефолт / Bash non-interactive)</text>
<line x1="410.0" y1="110.0" x2="715.0" y2="110.0" stroke="#86efac" stroke-width="1.0"/>
<rect x="410.0" y="125.0" width="305.0" height="60.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.0"/>
<text x="562.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">fork() ──► Subshell #1 (PID 2001)</text>
<text x="562.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">Виконує: echo &quot;data&quot;</text>
<line x1="562.0" y1="185.0" x2="562.0" y2="210.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="562.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">pipe [0] ◄── [1]</text>
<rect x="410.0" y="215.0" width="305.0" height="190.0" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="562.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#14532d" text-anchor="middle" font-weight="700">Батьківська оболонка (PID 2000)</text>
<text x="562.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">Виконує ОСТАННІЙ елемент in-process!</text>
<text x="425.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="start"><tspan x="425.0" dy="0.0">1. Читає зі stdin каналу без fork()</tspan><tspan x="425.0" dy="14.0">2. Виконує тіло while у власному просторі</tspan><tspan x="425.0" dy="14.0">3. Присвоєння count=1 змінює пам'ять батька</tspan><tspan x="425.0" dy="14.0">4. Після завершення циклу $count збережено!</tspan><tspan x="425.0" dy="14.0">5. Повна відсутність накладних витрат fork</tspan></text>
</svg>