<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1382 634" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1382" height="634" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="686.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Час життя структури mm, адресного простору й підписки не збігаються</text>
<rect x="28.0" y="40.0" width="286.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="171.0" y="83.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="171.0" dy="0.0">що коли живе</tspan></text>
<rect x="330.0" y="40.0" width="250.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="455.0" y="75.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="455.0" dy="0.0">ioctl ATTACH</tspan><tspan x="455.0" dy="16.2">на діапазон процесу</tspan></text>
<rect x="588.0" y="40.0" width="250.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="713.0" y="75.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="713.0" dy="0.0">робота:</tspan><tspan x="713.0" dy="16.2">збої пристрою</tspan></text>
<rect x="846.0" y="40.0" width="250.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="971.0" y="75.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="971.0" dy="0.0">процес завершився</tspan><tspan x="971.0" dy="16.2">(exit_mmap)</tspan></text>
<rect x="1104.0" y="40.0" width="250.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="1229.0" y="75.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="1229.0" dy="0.0">close(fd) →</tspan><tspan x="1229.0" dy="16.2">.release</tspan></text>
<rect x="28.0" y="132.0" width="286.0" height="86.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="171.0" y="171.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="171.0" dy="0.0">структура mm_struct</tspan><tspan x="171.0" dy="16.2">(mmgrab / mmdrop)</tspan></text>
<rect x="330.0" y="132.0" width="250.0" height="86.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="455.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">mmgrab() — беремо</tspan><tspan x="455.0" dy="15.6">довге посилання</tspan></text>
<rect x="588.0" y="132.0" width="250.0" height="86.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/><text x="713.0" y="179.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="713.0" dy="0.0">жива</tspan></text>
<rect x="846.0" y="132.0" width="250.0" height="86.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="971.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="971.0" dy="0.0">жива: тримаємо</tspan><tspan x="971.0" dy="15.6">її МИ</tspan></text>
<rect x="1104.0" y="132.0" width="250.0" height="86.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/><text x="1229.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1229.0" dy="0.0">mmdrop() —</tspan><tspan x="1229.0" dy="15.6">аж тепер звільнено</tspan></text>
<rect x="28.0" y="228.0" width="286.0" height="86.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="171.0" y="267.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="171.0" dy="0.0">адресний простір:</tspan><tspan x="171.0" dy="16.2">VMA й таблиці сторінок</tspan></text>
<rect x="330.0" y="228.0" width="250.0" height="86.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/><text x="455.0" y="275.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">живий</tspan></text>
<rect x="588.0" y="228.0" width="250.0" height="86.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="713.0" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="713.0" dy="0.0">mmget_not_zero()</tspan><tspan x="713.0" dy="15.6">вдається — читаємо</tspan><tspan x="713.0" dy="15.6">таблиці</tspan></text>
<rect x="846.0" y="228.0" width="250.0" height="86.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="971.0" y="259.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="971.0" dy="0.0">розібрано;</tspan><tspan x="971.0" dy="15.6">mmget_not_zero() → 0,</tspan><tspan x="971.0" dy="15.6">збій віддає -EFAULT</tspan></text>
<rect x="1104.0" y="228.0" width="250.0" height="86.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="1229.0" y="275.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1229.0" dy="0.0">—</tspan></text>
<rect x="28.0" y="324.0" width="286.0" height="86.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="171.0" y="363.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="171.0" dy="0.0">сповіщувач діапазону</tspan><tspan x="171.0" dy="16.2">(insert / remove)</tspan></text>
<rect x="330.0" y="324.0" width="250.0" height="86.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="455.0" y="363.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">insert() — вузол</tspan><tspan x="455.0" dy="15.6">в інтервальному дереві</tspan></text>
<rect x="588.0" y="324.0" width="250.0" height="86.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/><text x="713.0" y="363.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="713.0" dy="0.0">приходять</tspan><tspan x="713.0" dy="15.6">зворотні виклики</tspan></text>
<rect x="846.0" y="324.0" width="250.0" height="86.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="971.0" y="355.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="971.0" dy="0.0">ще в дереві, але</tspan><tspan x="971.0" dy="15.6">скасувань більше</tspan><tspan x="971.0" dy="15.6">не буде</tspan></text>
<rect x="1104.0" y="324.0" width="250.0" height="86.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="1229.0" y="355.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1229.0" dy="0.0">remove(): гарантія,</tspan><tspan x="1229.0" dy="15.6">що викликів немає</tspan><tspan x="1229.0" dy="15.6">й не буде</tspan></text>
<rect x="28.0" y="430.0" width="1326.0" height="76.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.7"/><text x="691.0" y="464.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="691.0" dy="0.0">mmgrab тримає СТРУКТУРУ mm_struct, mmget — сам АДРЕСНИЙ ПРОСТІР:</tspan><tspan x="691.0" dy="16.9">перше дешеве й на весь час підписки, друге — лише на час читання таблиць</tspan></text>
<rect x="28.0" y="518.0" width="1326.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="691.0" y="552.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="691.0" dy="0.0">смерть процесу не знімає підписку: зняти її мусить .release —</tspan><tspan x="691.0" dy="16.9">і саме тому структуру mm треба тримати живою аж до нього</tspan></text>
</svg>