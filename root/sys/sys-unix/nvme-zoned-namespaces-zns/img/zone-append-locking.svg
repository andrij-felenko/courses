<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Паралелізм NVMe: Стандартний Write vs Zone Append</text>
<rect x="20.0" y="55.0" width="410.0" height="400.0" rx="8" fill="#fafafa" stroke="#333333" stroke-width="1.5"/>
<text x="225.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Стандартний NVMe WRITE (Потрібні локи)</text>
<rect x="40.0" y="105.0" width="370.0" height="45.0" rx="6" fill="#e8f4f8" stroke="#2980b9" stroke-width="1.5"/><text x="225.0" y="131.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Потоки CPU 0..N (Багаточерговість blk-mq)</tspan></text>
<line x1="225.0" y1="150.0" x2="225.0" y2="185.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="185.0" width="330.0" height="55.0" rx="6" fill="#fdedec" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="201.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Глобальний Mutex / Spinlock зони</tspan><tspan x="225.0" dy="15.6">Хост мусить послідовно вибирати LBA</tspan><tspan x="225.0" dy="15.6">Серіалізація викликів у ПЗ</tspan></text>
<line x1="225.0" y1="240.0" x2="225.0" y2="275.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="275.0" width="370.0" height="55.0" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="225.0" y="291.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">NVMe Command: WRITE (LBA = X)</tspan><tspan x="225.0" dy="15.6">Якщо раптом гонка адресації -&gt;</tspan><tspan x="225.0" dy="15.6">Помилка Unaligned Write (0x0288)</tspan></text>
<line x1="225.0" y1="330.0" x2="225.0" y2="365.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="365.0" width="370.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="225.0" y="388.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Контролер SSD ZNS</tspan><tspan x="225.0" dy="15.6">Перевіряє: LBA == Write Pointer?</tspan><tspan x="225.0" dy="15.6">Приймає лише ідеально впорядковані I/O</tspan></text>
<rect x="470.0" y="55.0" width="410.0" height="400.0" rx="8" fill="#fafafa" stroke="#333333" stroke-width="1.5"/>
<text x="675.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Атомарна команда ZONE APPEND (Lock-free)</text>
<rect x="490.0" y="105.0" width="370.0" height="45.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="675.0" y="131.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Потоки CPU 0..N (Асинхронний io_uring)</tspan></text>
<line x1="675.0" y1="150.0" x2="675.0" y2="185.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="510.0" y="185.0" width="330.0" height="55.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="675.0" y="201.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">БЕЗ БЛОКУВАНЬ (Lock-free)</tspan><tspan x="675.0" dy="15.6">Хост передає лише ZSLBA (Початок зони)</tspan><tspan x="675.0" dy="15.6">Паралельне заповнення Submission Queues</tspan></text>
<line x1="675.0" y1="240.0" x2="675.0" y2="275.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="490.0" y="275.0" width="370.0" height="55.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="675.0" y="298.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">NVMe Command: ZONE APPEND (ZSLBA = ZoneStart)</tspan><tspan x="675.0" dy="15.6">Ніде немає явного вказання LBA</tspan></text>
<line x1="675.0" y1="330.0" x2="675.0" y2="365.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="490.0" y="365.0" width="370.0" height="70.0" rx="6" fill="#e8f4f8" stroke="#2980b9" stroke-width="1.5"/><text x="675.0" y="380.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Апаратна обробка в SSD ZNS</tspan><tspan x="675.0" dy="15.6">1. Атомарне виділення LBA = Write Pointer</tspan><tspan x="675.0" dy="15.6">2. Інкремент Write Pointer на розмір запису</tspan><tspan x="675.0" dy="15.6">3. Повернення виділеного LBA у CQE</tspan></text>
</svg>