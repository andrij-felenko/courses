<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Успадкування стану між fork() та execve()</text>
<rect x="30.0" y="50.0" width="315.0" height="360.0" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
<text x="187.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0369a1" text-anchor="middle" font-weight="700">Системний виклик fork()</text>
<line x1="45.0" y1="88.0" x2="330.0" y2="88.0" stroke="#0284c7" stroke-width="1.0"/>
<text x="45.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0c4a6e" text-anchor="start"><tspan x="45.0" dy="0.0">• Точне клонування адресного простору (COW)</tspan><tspan x="45.0" dy="19.8">• Збереження покажчиків argv та environ</tspan><tspan x="45.0" dy="19.8">• Збереження відкритих файлових дескрипторів</tspan><tspan x="45.0" dy="19.8">• Копіювання обробників сигналів</tspan><tspan x="45.0" dy="19.8">• Новий PID, але той самий PPID</tspan><tspan x="45.0" dy="19.8">• Збереження стану C-бібліотеки</tspan></text>
<rect x="375.0" y="50.0" width="315.0" height="360.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="532.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c2410c" text-anchor="middle" font-weight="700">Системний виклик execve()</text>
<line x1="390.0" y1="88.0" x2="675.0" y2="88.0" stroke="#ea580c" stroke-width="1.0"/>
<text x="390.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c2d12" text-anchor="start"><tspan x="390.0" dy="0.0">• Очищення старого адресного простору</tspan><tspan x="390.0" dy="19.8">• Новий стек з нуля: argc, argv, envp, auxv</tspan><tspan x="390.0" dy="19.8">• Дескриптори: зберігаються (якщо не O_CLOEXEC)</tspan><tspan x="390.0" dy="19.8">• Сигнали: скидаються до SIG_DFL</tspan><tspan x="390.0" dy="19.8">• Той самий PID, PPID, session/group ID</tspan><tspan x="390.0" dy="19.8">• Збереження umask, cwd, rlimits</tspan><tspan x="390.0" dy="19.8">• Credentials: UID/GID збережені</tspan></text>
</svg>