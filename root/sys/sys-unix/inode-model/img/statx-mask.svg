<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">statx: маска — це питання, stx_mask — чесна відповідь</text>
<text x="194.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">запит</text>
<rect x="44.0" y="86.0" width="300.0" height="170.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="194.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="194.0" dy="0.0">mask, який передали:</tspan><tspan x="194.0" dy="18.2">STATX_BASIC_STATS</tspan><tspan x="194.0" dy="18.2">| STATX_BTIME</tspan><tspan x="194.0" dy="18.2">| STATX_MNT_ID</tspan></text>
<text x="534.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">ядро</text>
<rect x="404.0" y="86.0" width="260.0" height="170.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="534.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="534.0" dy="0.0">питає драйвер ФС</tspan><tspan x="534.0" dy="18.2">і заповнює те, що той уміє;</tspan><tspan x="534.0" dy="18.2">зайве, що дісталося задарма,</tspan><tspan x="534.0" dy="18.2">теж кладе — і теж позначає</tspan></text>
<text x="900.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">відповідь</text>
<rect x="724.0" y="86.0" width="352.0" height="170.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="900.0" y="139.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">stx_mask, який повернули:</tspan><tspan x="900.0" dy="18.2">є: BASIC_STATS, MNT_ID</tspan><tspan x="900.0" dy="18.2">немає: BTIME —</tspan><tspan x="900.0" dy="18.2">ext4 зі 128-байтовим inode</tspan><tspan x="900.0" dy="18.2">її просто не зберігає</tspan></text>
<line x1="344.0" y1="171.0" x2="404.0" y2="171.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="664.0" y1="171.0" x2="724.0" y2="171.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="44.0" y="300.0" width="1032.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="560.0" y="334.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">поле, чийого біта немає в stx_mask, читати не можна:</tspan><tspan x="560.0" dy="18.2">там нуль, а нуль у stx_btime — це 1 січня 1970 року,</tspan><tspan x="560.0" dy="18.2">цілком правдоподібна дата, якої ніщо не позначить помилкою</tspan></text>
</svg>