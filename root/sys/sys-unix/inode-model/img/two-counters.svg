<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">лічильник імен &gt; 0</text>
<text x="450.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(є хоча б один запис у каталозі)</text>
<text x="780.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">лічильник імен = 0</text>
<text x="780.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(останнє ім'я знято)</text>
<text x="150.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">є відкриті</tspan><tspan x="150.0" dy="18.2">дескриптори</tspan></text>
<text x="150.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">відкритих</tspan><tspan x="150.0" dy="18.2">дескрипторів немає</tspan></text>
<rect x="300.0" y="150.0" width="300.0" height="160.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.9"/><text x="450.0" y="217.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">звичайний відкритий файл:</tspan><tspan x="450.0" dy="17.6">видно в каталозі,</tspan><tspan x="450.0" dy="17.6">хтось читає просто зараз</tspan></text>
<rect x="630.0" y="150.0" width="300.0" height="160.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.9"/><text x="780.0" y="217.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">вміст живий, але безіменний:</tspan><tspan x="780.0" dy="17.6">місце зайняте, і df його</tspan><tspan x="780.0" dy="17.6">не поверне до закриття</tspan></text>
<rect x="300.0" y="340.0" width="300.0" height="160.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.9"/><text x="450.0" y="407.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">файл просто лежить:</tspan><tspan x="450.0" dy="17.6">має ім'я, ніхто не тримає</tspan><tspan x="450.0" dy="17.6">його відкритим</tspan></text>
<rect x="630.0" y="340.0" width="300.0" height="160.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.9"/><text x="780.0" y="407.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">ніщо не тримає:</tspan><tspan x="780.0" dy="17.6">inode і блоки</tspan><tspan x="780.0" dy="17.6">звільнено</tspan></text>
<text x="470.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">вміст зникає лише в правому нижньому куті — коли обидва лічильники нульові</text>
</svg>