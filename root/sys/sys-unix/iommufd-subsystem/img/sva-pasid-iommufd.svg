<rect x="482.7" y="124.3" width="354.6" height="41.3" rx="6" fill="#ffffff" stroke="#f39c12" stroke-width="1.5"/><text x="660.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">PCIe Пристрій (Акселератор / GPU)</tspan><tspan x="660.0" dy="14.3">Генерує TLP з PASID 1 (Процес A) та PASID 2 (Процес B)</tspan></text>
