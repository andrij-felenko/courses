<text x="850.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">нова адреса буфера</text>
<line x1="316.0" y1="99.0" x2="366.0" y2="99.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
