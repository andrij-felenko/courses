<text x="510.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">смуги пам'яті не вистачає саме тут</text>
<text x="30.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Драйвер відмовляє посеред шляху — режим уже змінено, плоскість ні. Спитати наперед нема як.</text>
<text x="30.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Атомарно: увесь бажаний стан приїздить одним списком</text>
<rect x="30.0" y="344.0" width="400.0" height="84.0" rx="6" fill="#dceffe" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="390.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">DRM_IOCTL_MODE_ATOMIC</tspan></text>
<text x="230.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">пари «об'єкт · властивість · значення»</text>
<line x1="438.0" y1="372.0" x2="560.0" y2="372.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="566.0" y="350.0" width="420.0" height="44.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="776.0" y="376.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="776.0" dy="0.0">TEST_ONLY: так чи ні, нічого не змінено</tspan></text>
<line x1="438.0" y1="410.0" x2="560.0" y2="410.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="566.0" y="388.0" width="420.0" height="44.0" rx="6" fill="#dceffe" stroke="#2457d6" stroke-width="1.5"/><text x="776.0" y="414.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="776.0" dy="0.0">застосувати цілком, на найближчій паузі</tspan></text>
<text x="566.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Проміжного стану не існує: або новий кадр увесь, або старий увесь.</text>
