<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 910" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="910" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гарантія NFS прив'язана до пари подій, а не до часу</text>
<rect x="40.0" y="52.0" width="330.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="205.0" y="76.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">клієнт-письменник</tspan></text>
<rect x="505.0" y="52.0" width="210.0" height="40.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="610.0" y="76.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">сервер</tspan></text>
<rect x="850.0" y="52.0" width="330.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="1015.0" y="76.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1015.0" dy="0.0">клієнт-читач</tspan></text>
<line x1="610.0" y1="100.0" x2="610.0" y2="830.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="7 6"/>
<rect x="40.0" y="127.0" width="330.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="205.0" y="146.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">write() двічі —</tspan><tspan x="205.0" dy="16.2">дані лишаються в кеші письменника</tspan></text>
<text x="490.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="490.0" dy="0.0">на сервер не летить нічого</tspan></text>
<rect x="40.0" y="219.0" width="330.0" height="46.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="205.0" y="246.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">close()</tspan></text>
<line x1="378.0" y1="242.0" x2="602.0" y2="242.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="490.0" y="213.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="490.0" dy="0.0">усі накопичені сторінки</tspan><tspan x="490.0" dy="15.6">і COMMIT — дані на сервері</tspan></text>
<rect x="850.0" y="311.0" width="330.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="1015.0" y="338.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1015.0" dy="0.0">open() — уже після чужого close()</tspan></text>
<line x1="842.0" y1="334.0" x2="618.0" y2="334.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="730.0" y="305.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="730.0" dy="0.0">запит атрибутів:</tspan><tspan x="730.0" dy="15.6">чи змінився час зміни?</tspan></text>
<rect x="850.0" y="403.0" width="330.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="1015.0" y="430.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1015.0" dy="0.0">кеш даних цього файлу викинуто</tspan></text>
<line x1="618.0" y1="426.0" x2="842.0" y2="426.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="730.0" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="730.0" dy="0.0">новий час зміни й розмір</tspan></text>
<rect x="850.0" y="495.0" width="330.0" height="46.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="1015.0" y="522.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1015.0" dy="0.0">read() — свіжі дані</tspan></text>
<line x1="842.0" y1="518.0" x2="618.0" y2="518.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="730.0" y="505.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="730.0" dy="0.0">читання з сервера</tspan></text>
<rect x="140.0" y="570.0" width="940.0" height="48.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="610.0" y="598.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">письменник закрив раніше, ніж читач відкрив — це і є весь контракт</tspan></text>
<rect x="850.0" y="663.0" width="330.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="1015.0" y="682.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1015.0" dy="0.0">open() — читач відкрив ПЕРШИМ</tspan><tspan x="1015.0" dy="16.2">і тримає файл відкритим</tspan></text>
<rect x="40.0" y="751.0" width="330.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="205.0" y="778.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">write() — у кеші письменника</tspan></text>
<rect x="850.0" y="751.0" width="330.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="1015.0" y="778.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1015.0" dy="0.0">read() — зі свого кешу, старі дані</tspan></text>
<text x="490.0" y="769.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="490.0" dy="0.0">жодного обміну з жодного боку</tspan></text>
<rect x="140.0" y="826.0" width="940.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="610.0" y="854.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">поки обидва тримають файл відкритим, застарілість обмежена лише таймером — до 60 с</tspan></text>
</svg>