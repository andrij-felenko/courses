<rect x="686.0" y="684.0" width="500.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="936.0" y="705.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="936.0" dy="0.0">SMB2 у Windows Vista:</tspan><tspan x="936.0" dy="16.2">понад сотня команд → дев'ятнадцять</tspan></text>
