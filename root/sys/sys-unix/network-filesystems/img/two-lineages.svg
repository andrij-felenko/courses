<rect x="54.0" y="208.0" width="500.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="304.0" y="229.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="304.0" dy="0.0">доповідь на USENIX; специфікацію</tspan><tspan x="304.0" dy="16.2">протоколу опубліковано</tspan></text>
<line x1="554.0" y1="232.0" x2="590.0" y2="232.0" stroke="#2457d6" stroke-width="1.4"/>
<circle cx="620.0" cy="232.0" r="4.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
