<rect x="54.0" y="344.0" width="500.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="304.0" y="365.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="304.0" dy="0.0">RFC 1094 — NFSv2; протокол став</tspan><tspan x="304.0" dy="16.2">чужим документом, не власністю Sun</tspan></text>
