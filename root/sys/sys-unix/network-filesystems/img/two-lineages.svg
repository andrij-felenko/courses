<rect x="686.0" y="412.0" width="500.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="936.0" y="433.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="936.0" dy="0.0">Ендрю Тріджелл випускає Samba:</tspan><tspan x="936.0" dy="16.2">протокол відновлено з трафіку</tspan></text>
<line x1="650.0" y1="436.0" x2="686.0" y2="436.0" stroke="#c0392b" stroke-width="1.4"/>
