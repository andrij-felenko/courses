<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 864" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="864" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві незалежні лінії мережевого доступу до файлів, 1983-2006</text>
<text x="620.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">два родоводи, що ніколи не мали спільного предка</text>
<text x="320.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">лінія NFS  —  Unix, RPC, відкрита специфікація</text>
<text x="920.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">лінія SMB  —  DOS, NetBIOS, закритий продукт</text>
<line x1="620.0" y1="82.0" x2="620.0" y2="754.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="686.0" y="72.0" width="500.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="936.0" y="93.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="936.0" dy="0.0">IBM, Баррі Файґенбаум: віддалений доступ</tspan><tspan x="936.0" dy="16.2">для INT 21h у PC DOS; спершу «BAF»</tspan></text>
<line x1="650.0" y1="96.0" x2="686.0" y2="96.0" stroke="#c0392b" stroke-width="1.4"/>
<circle cx="620.0" cy="96.0" r="4.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
