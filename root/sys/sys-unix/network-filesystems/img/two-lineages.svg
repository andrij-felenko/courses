<text x="620.0" y="491.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">1995</text>
<rect x="686.0" y="548.0" width="500.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="936.0" y="569.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="936.0" dy="0.0">у відповідь на анонс WebNFS</tspan><tspan x="936.0" dy="16.2">Microsoft перейменовує SMB 1.0 на CIFS</tspan></text>
