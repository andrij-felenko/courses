<rect x="150.0" y="780.0" width="940.0" height="64.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="620.0" y="808.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Жодна подія лівої колонки не є відповіддю на подію правої, окрім однієї:</tspan><tspan x="620.0" dy="16.2">перейменування 1996 року, де маркетинг однієї лінії відреагував на анонс іншої.</tspan></text>
