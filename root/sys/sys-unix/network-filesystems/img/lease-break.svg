<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 840" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="840" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відкликання дозволу: правильність відновлюють до того, як другий отримає відповідь</text>
<rect x="40.0" y="52.0" width="330.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="205.0" y="76.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">клієнт A</tspan></text>
<rect x="505.0" y="52.0" width="210.0" height="40.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="610.0" y="76.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">сервер</tspan></text>
<rect x="850.0" y="52.0" width="330.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="1015.0" y="76.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1015.0" dy="0.0">клієнт B</tspan></text>
<line x1="610.0" y1="100.0" x2="610.0" y2="690.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="7 6"/>
<rect x="40.0" y="127.0" width="330.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="205.0" y="154.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">open()</tspan></text>
<line x1="378.0" y1="150.0" x2="602.0" y2="150.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="490.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="490.0" dy="0.0">створення дескриптора</tspan><tspan x="490.0" dy="15.6">і прохання про оренду</tspan></text>
<rect x="40.0" y="219.0" width="330.0" height="46.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="205.0" y="246.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">кешує читання, записи й дескриптор</tspan></text>
<line x1="602.0" y1="242.0" x2="378.0" y2="242.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="490.0" y="213.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="490.0" dy="0.0">більше ніхто файлу не тримає —</tspan><tspan x="490.0" dy="15.6">оренда видана</tspan></text>
<rect x="40.0" y="311.0" width="330.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="205.0" y="338.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">write() багато разів — усе в кеші</tspan></text>
<text x="490.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="490.0" dy="0.0">тиша: обмінів немає взагалі</tspan></text>
<rect x="850.0" y="403.0" width="330.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="1015.0" y="430.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1015.0" dy="0.0">open() того самого файлу</tspan></text>
<line x1="842.0" y1="426.0" x2="618.0" y2="426.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="730.0" y="397.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="730.0" dy="0.0">сервер бачить збіг</tspan><tspan x="730.0" dy="15.6">і затримує відповідь</tspan></text>
<rect x="40.0" y="495.0" width="330.0" height="46.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.6"/><text x="205.0" y="522.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">дописує накопичене й знижує рівень</tspan></text>
<line x1="602.0" y1="518.0" x2="378.0" y2="518.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="490.0" y="505.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="490.0" dy="0.0">відкликання оренди</tspan></text>
<rect x="850.0" y="587.0" width="330.0" height="46.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="1015.0" y="614.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1015.0" dy="0.0">бачить усе, що записав A</tspan></text>
<line x1="618.0" y1="610.0" x2="842.0" y2="610.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="730.0" y="597.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="730.0" dy="0.0">лише тепер — відповідь</tspan></text>
<rect x="90.0" y="664.0" width="1040.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="610.0" y="694.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">У NFSv3 стрілки відкликання не існує взагалі: сервер не пам'ятає, кому що віддав,</tspan><tspan x="610.0" dy="16.9">і не має зворотного шляху до клієнта. Замість неї там працює таймер на клієнті.</tspan></text>
</svg>