<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Реляційне з'єднання потоків утилітою join</text>
<rect x="30.0" y="50.0" width="200.0" height="190.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="130.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">Файл 1 (відсортований)</text>
