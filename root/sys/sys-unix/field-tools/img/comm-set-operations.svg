<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Операції над множинами за допомогою утиліти comm</text>
<circle cx="220.0" cy="125.0" r="80.0" fill="#fef3c7" stroke="#d97706" stroke-width="2.0"/>
<circle cx="320.0" cy="125.0" r="80.0" fill="#dbeafe" stroke="#2563eb" stroke-width="2.0"/>
<text x="173.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">Лише A (Кол 1)</text>
<text x="270.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Спільні A∩B
(Кол 3)</text>
<text x="367.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">Лише B (Кол 2)</text>
<rect x="450.0" y="48.0" width="280.0" height="155.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="590.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">Формат виводу comm fileA fileB</text>
<line x1="460.0" y1="78.0" x2="720.0" y2="78.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="465.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="start" font-weight="700">Колонка 1 (без відступу):</text>
<text x="475.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Елементи виключно з fileA</text>
<text x="465.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="start" font-weight="700">Колонка 2 (відступ \t):</text>
<text x="475.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Елементи виключно з fileB</text>
<text x="465.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="start" font-weight="700">Колонка 3 (відступ \t\t):</text>
<text x="475.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Спільні елементи для fileA та fileB</text>
<rect x="30.0" y="220.0" width="700.0" height="180.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="45.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700">Матриця селекції стовпців прапорцями придушення (-1, -2, -3):</text>
<rect x="45.0" y="258.0" width="210.0" height="60.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="150.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">Перетин: A ∩ B</text>
<text x="150.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">comm -12 fileA fileB</text>
<text x="150.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Придушено кол. 1 та 2</text>
<rect x="275.0" y="258.0" width="210.0" height="60.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="380.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">Різниця: A \ B (тільки в A)</text>
<text x="380.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">comm -23 fileA fileB</text>
<text x="380.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Придушено кол. 2 та 3</text>
<rect x="505.0" y="258.0" width="210.0" height="60.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="610.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">Різниця: B \ A (тільки в B)</text>
<text x="610.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle" font-weight="700">comm -13 fileA fileB</text>
<text x="610.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Придушено кол. 1 та 3</text>
<rect x="45.0" y="328.0" width="670.0" height="58.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="180.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#5b21b6" text-anchor="start" font-weight="700">Симетрична різниця: A △ B</text>
<text x="180.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="start" font-weight="700">comm -3 fileA fileB</text>
<text x="460.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Вимикає лише спільні елементи (-3).</text>
<text x="460.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Виводить 2 колонки: що зникло та що додалося.</text>
</svg>