<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="920.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="49.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Пайплайн телеметрії та реєстрації подій у Linux</tspan></text>
<rect x="40.0" y="85.0" width="260.0" height="110.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="170.0" y="120.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Ядро Linux (printk)</tspan><tspan x="170.0" dy="15.6"></tspan><tspan x="170.0" dy="15.6">Драйвери, пам'ять, OOM, паніки,</tspan><tspan x="170.0" dy="15.6">повідомлення апаратури</tspan></text>
<rect x="40.0" y="210.0" width="260.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="245.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Користувацькі сервіси</tspan><tspan x="170.0" dy="15.6"></tspan><tspan x="170.0" dy="15.6">stdout / stderr юнітів systemd,</tspan><tspan x="170.0" dy="15.6">помилки застосунків</tspan></text>
<rect x="40.0" y="335.0" width="260.0" height="110.0" rx="6" fill="#fff6e5" stroke="#d48806" stroke-width="1.5"/><text x="170.0" y="370.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Класичний syslog API</tspan><tspan x="170.0" dy="15.6"></tspan><tspan x="170.0" dy="15.6">Виклики syslog() через</tspan><tspan x="170.0" dy="15.6">сокети /dev/log</tspan></text>
<line x1="300.0" y1="140.0" x2="360.0" y2="180.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="300.0" y1="265.0" x2="360.0" y2="265.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="300.0" y1="390.0" x2="360.0" y2="350.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="370.0" y="85.0" width="260.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="113.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Кільцевий буфер ядра</tspan><tspan x="500.0" dy="15.6">struct printk_ringbuffer</tspan><tspan x="500.0" dy="15.6">доступ: /dev/kmsg, dmesg</tspan></text>
<line x1="500.0" y1="165.0" x2="500.0" y2="205.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="370.0" y="210.0" width="260.0" height="235.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="253.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">systemd-journald</tspan><tspan x="500.0" dy="15.6"></tspan><tspan x="500.0" dy="15.6">Приймає сокети:</tspan><tspan x="500.0" dy="15.6">• /run/systemd/journal/socket</tspan><tspan x="500.0" dy="15.6">• /run/systemd/journal/stdout</tspan><tspan x="500.0" dy="15.6">• читає /dev/kmsg</tspan><tspan x="500.0" dy="15.6"></tspan><tspan x="500.0" dy="15.6">Збагачує непідробними</tspan><tspan x="500.0" dy="15.6">метаданими ядра:</tspan><tspan x="500.0" dy="15.6">_PID, _UID, _SYSTEMD_UNIT,</tspan><tspan x="500.0" dy="15.6">_COMM, _EXE, _SELINUX_CONTEXT</tspan></text>
<line x1="630.0" y1="260.0" x2="690.0" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="630.0" y1="360.0" x2="690.0" y2="360.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.0" y="110.0" width="260.0" height="150.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="830.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Структурований журнал</tspan><tspan x="830.0" dy="15.6">/var/log/journal/&lt;machine-id&gt;/</tspan><tspan x="830.0" dy="15.6"></tspan><tspan x="830.0" dy="15.6">• Бінарний формат з індексами</tspan><tspan x="830.0" dy="15.6">• B-дерева для швидкого пошуку</tspan><tspan x="830.0" dy="15.6">• Захист цілісності FSP</tspan><tspan x="830.0" dy="15.6">• Читання: journalctl</tspan></text>
<rect x="700.0" y="290.0" width="260.0" height="155.0" rx="6" fill="#fff6e5" stroke="#d48806" stroke-width="1.5"/><text x="830.0" y="324.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Текстові логи (rsyslog)</tspan><tspan x="830.0" dy="15.6">/var/log/syslog, auth.log</tspan><tspan x="830.0" dy="15.6"></tspan><tspan x="830.0" dy="15.6">• Пересилання через /dev/log</tspan><tspan x="830.0" dy="15.6">• Текстові рядки без метаданих</tspan><tspan x="830.0" dy="15.6">• Ротація через logrotate</tspan><tspan x="830.0" dy="15.6">• Читання: grep, tail, less</tspan></text>
<rect x="40.0" y="480.0" width="920.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="508.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Ключова перевага journald: поля з префіксом «_» заповнюються самим ядром через SO_PEERCRED,</tspan><tspan x="500.0" dy="15.6">тому скомпрометований процес не може підробити власний PID, юніт чи шлях до бінарника.</tspan></text>
</svg>