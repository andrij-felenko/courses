<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="920.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="40.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Ієрархія та площини системного стану в Unix / Linux:</tspan><tspan x="500.0" dy="19.5">від статичного задуму постачальника до живого стану пам'яті та подій</tspan></text>
<rect x="40.0" y="85.0" width="920.0" height="85.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="115.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">1. Статичний канон дистрибутива</tspan><tspan x="500.0" dy="16.9">/usr/share/man, /usr/share/doc, /usr/lib/systemd, /usr/lib/sysctl.d</tspan><tspan x="500.0" dy="16.9">Тільки читання (immutable). Задум авторів та системні значення за замовчуванням.</tspan></text>
<rect x="40.0" y="185.0" width="920.0" height="85.0" rx="6" fill="#fff6e5" stroke="#d48806" stroke-width="1.5"/><text x="500.0" y="215.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">2. Декларативна конфігурація машини</tspan><tspan x="500.0" dy="16.9">/etc (хостова конфігурація: fstab, sysctl.d, systemd/system, nginx.conf)</tspan><tspan x="500.0" dy="16.9">Персистентний намір адміністратора на диску. Переживає перезавантаження ОС.</tspan></text>
<rect x="40.0" y="285.0" width="920.0" height="85.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="315.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">3. Летючий рантайм-стан сервісів</tspan><tspan x="500.0" dy="16.9">/run (/var/run): tmpfs в оперативній пам'яті (PID-файли, IPC-сокети, динамічні юніти)</tspan><tspan x="500.0" dy="16.9">Поточний стан активних процесів. Очищається при вимкненні живлення.</tspan></text>
<rect x="40.0" y="385.0" width="920.0" height="85.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="500.0" y="415.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">4. Живий стан ядра та пристроїв</tspan><tspan x="500.0" dy="16.9">/proc (процеси, пам'ять, планувальник) · /sys (kobjects, шини, драйвери) · debugfs</tspan><tspan x="500.0" dy="16.9">Синтетичні VFS: дані генеруються ядром на льоту безпосередньо з RAM.</tspan></text>
<rect x="40.0" y="485.0" width="920.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="515.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">5. Часовий потік подій та журналювання</tspan><tspan x="500.0" dy="16.9">journald (/var/log/journal) · rsyslog (/var/log/messages) · dmesg (/dev/kmsg)</tspan><tspan x="500.0" dy="16.9">Структуровані та текстові сліди дій, перепадів стану та апаратних збоїв.</tspan></text>
<rect x="40.0" y="580.0" width="920.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="599.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Правило розслідування: конфігурація у /etc — це лише намір; факт — у /proc, /sys та /run</tspan></text>
</svg>