<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="920.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="49.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Віртуальні проекції стану ядра: /proc проти /sys</tspan></text>
<rect x="40.0" y="80.0" width="445.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="262.5" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="262.5" dy="0.0">/proc (procfs) — процесний вимір</tspan></text>
<rect x="40.0" y="135.0" width="445.0" height="335.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="262.5" y="258.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="262.5" dy="0.0">Фокус: структури task_struct процесів та глобальний стан підсистем ядра</tspan><tspan x="262.5" dy="11.7"></tspan><tspan x="262.5" dy="11.7">Організація: /proc/&lt;PID&gt;/ (maps, status, fd, ns) та глобальні файли (meminfo, cpuinfo)</tspan><tspan x="262.5" dy="11.7"></tspan><tspan x="262.5" dy="11.7">sysctl: вузли /proc/sys/ проектуються на глобальні змінні ядра через sysctl_table</tspan><tspan x="262.5" dy="11.7"></tspan><tspan x="262.5" dy="11.7">Формат виводу: довільний неструктурований текст, багаторядкові таблиці (seq_file)</tspan><tspan x="262.5" dy="11.7"></tspan><tspan x="262.5" dy="11.7">Історія: виник у Plan 9 / UNIX 8th Ed для зневадження (gdb), розрісся в Linux без єдиної схеми</tspan></text>
<rect x="515.0" y="80.0" width="445.0" height="45.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="737.5" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="737.5" dy="0.0">/sys (sysfs) — об'єктний та пристроєвий вимір</tspan></text>
<rect x="515.0" y="135.0" width="445.0" height="335.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="737.5" y="234.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="737.5" dy="0.0">Фокус: єдина модель пристроїв ядра (kobject, kset, драйвери та шини)</tspan><tspan x="737.5" dy="13.0"></tspan><tspan x="737.5" dy="13.0">Організація:</tspan><tspan x="737.5" dy="13.0">• /sys/devices/ — фізична топологія шин</tspan><tspan x="737.5" dy="13.0">• /sys/bus/ — шини (pci, usb, i2c)</tspan><tspan x="737.5" dy="13.0">• /sys/class/ — функціональні класи (net, block, tty)</tspan><tspan x="737.5" dy="13.0"></tspan><tspan x="737.5" dy="13.0">Суворе правило: один атрибут — один файл (одне число чи слово в ASCII)</tspan><tspan x="737.5" dy="13.0"></tspan><tspan x="737.5" dy="13.0">Зв'язки: масивне використання символьних посилань для перехресних проєкцій</tspan><tspan x="737.5" dy="13.0"></tspan><tspan x="737.5" dy="13.0">Історія: спроектований у Linux 2.6 як структурована заміна хаосу /proc</tspan></text>
<rect x="40.0" y="485.0" width="920.0" height="55.0" rx="6" fill="#fff6e5" stroke="#d48806" stroke-width="1.5"/><text x="500.0" y="508.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">debugfs (/sys/kernel/debug): окрема VFS для розробників без стабільного ABI,</tspan><tspan x="500.0" dy="15.6">використовується для глибокого налагодження (ftrace, підсистеми DRM, Wi-Fi).</tspan></text>
</svg>