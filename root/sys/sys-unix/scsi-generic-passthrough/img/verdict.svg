<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">одна невдача — чотири різні винуватці</text>
<rect x="70.0" y="90.0" width="420.0" height="96.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="143.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">ioctl(...) &lt; 0</tspan></text>
<line x1="500.0" y1="138.0" x2="596.0" y2="138.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610.0" y="90.0" width="560.0" height="96.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="133.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">КАНАЛ: команда навіть не поїхала</tspan><tspan x="890.0" dy="18.2">ENOTTY, EINVAL, EFAULT — дивись errno</tspan></text>
<rect x="70.0" y="220.0" width="420.0" height="96.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="273.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">host_status ≠ 0</tspan></text>
<line x1="500.0" y1="268.0" x2="596.0" y2="268.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610.0" y="220.0" width="560.0" height="96.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="263.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">ДОРОГА: строк вийшов, шлях зник,</tspan><tspan x="890.0" dy="18.2">контролер скинув пристрій</tspan></text>
<rect x="70.0" y="350.0" width="420.0" height="96.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="403.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">status = 02h, sb_len_wr &gt; 0</tspan></text>
<line x1="500.0" y1="398.0" x2="596.0" y2="398.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610.0" y="350.0" width="560.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="393.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">ПРИСТРІЙ: він відповів, і відповідь —</tspan><tspan x="890.0" dy="18.2">відмова; причина в сенс-даних</tspan></text>
<rect x="70.0" y="480.0" width="420.0" height="96.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="533.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">ASC/ASCQ = 00h / 1Dh</tspan></text>
<line x1="500.0" y1="528.0" x2="596.0" y2="528.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610.0" y="480.0" width="560.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="890.0" y="523.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">ЦЕ НЕ ВІДМОВА: так повертаються</tspan><tspan x="890.0" dy="18.2">регістри ATA, коли виставлено CK_COND</tspan></text>
<text x="620.0" y="640.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">driver_status у сучасних ядрах несе лише DRIVER_SENSE —</text>
<text x="620.0" y="664.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">як вирок про дорогу його читати не можна</text>
</svg>