<rect x="40.0" y="330.0" width="340.0" height="40.0" rx="6" fill="#ffebee" stroke="#e53935" stroke-width="1.5"/><text x="210.0" y="353.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c62828" text-anchor="middle"><tspan x="210.0" dy="0.0">Недолік: CPU забруднює L1/L3 кеш копіюванням</tspan></text>
<rect x="420.0" y="50.0" width="380.0" height="340.0" rx="8" fill="#fdfefe" stroke="#b0bec5" stroke-width="1.5"/>
<text x="610.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2c3e50" text-anchor="middle" font-weight="700">io_uring SendZC / RecvZC</text>
<rect x="440.0" y="100.0" width="340.0" height="45.0" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/><text x="610.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Зареєстрований буфер (Fixed Buffer)</tspan></text>
