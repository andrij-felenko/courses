<line x1="140.0" y1="225.0" x2="140.0" y2="260.0" stroke="#2e7d32" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="150.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="left">DMA передача</text>
