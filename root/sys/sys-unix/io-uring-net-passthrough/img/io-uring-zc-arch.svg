<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура мережевого вводу-виводу: memcpy проти SendZC</text>
<rect x="20.0" y="50.0" width="380.0" height="340.0" rx="8" fill="#fdfefe" stroke="#b0bec5" stroke-width="1.5"/>
<text x="210.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2c3e50" text-anchor="middle" font-weight="700">Класичний ввід-вивід (send/recv)</text>
<rect x="40.0" y="100.0" width="340.0" height="45.0" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/><text x="210.0" y="127.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Userspace Buffer (Пам'ять програми)</tspan></text>
<line x1="140.0" y1="145.0" x2="140.0" y2="180.0" stroke="#d32f2f" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="150.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d32f2f" text-anchor="left" font-weight="700">memcpy() CPU</text>
