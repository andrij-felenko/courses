<rect x="440.0" y="260.0" width="340.0" height="45.0" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/><text x="610.0" y="287.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Мережевий контролер (NIC TX Ring)</tspan></text>
<rect x="440.0" y="330.0" width="340.0" height="40.0" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="610.0" y="353.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1b5e20" text-anchor="middle"><tspan x="610.0" dy="0.0">Перевага: 0 копіювань, сповіщення через CQE</tspan></text>
