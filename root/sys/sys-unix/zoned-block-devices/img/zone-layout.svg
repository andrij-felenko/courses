<rect x="442.5" y="275.2" width="153.9" height="33.5" rx="6" fill="#fff4e0" stroke="#c0392b" stroke-width="2.0"/><text x="519.5" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="519.5" dy="0.0">вказівник запису</tspan></text>
<text x="333.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">повна</text>
<text x="504.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">відкрита</text>
<text x="867.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">порожня</text>
<rect x="70.0" y="330.0" width="340.0" height="82.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="2.0"/><text x="240.0" y="366.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">новий запис лягає рівно у вказівник —</tspan><tspan x="240.0" dy="18.2">ні раніше, ні пізніше</tspan></text>
<rect x="442.0" y="330.0" width="340.0" height="82.0" rx="6" fill="#eef2f7" stroke="#c0392b" stroke-width="2.0"/><text x="612.0" y="366.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="612.0" dy="0.0">запис у вже заповнену частину зони</tspan><tspan x="612.0" dy="18.2">пристрій відхиляє помилкою</tspan></text>
<rect x="814.0" y="330.0" width="340.0" height="82.0" rx="6" fill="#eef2f7" stroke="#27ae60" stroke-width="2.0"/><text x="984.0" y="366.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="984.0" dy="0.0">скидання зони повертає вказівник</tspan><tspan x="984.0" dy="18.2">на початок і стирає вміст</tspan></text>
<rect x="70.0" y="452.0" width="1084.0" height="78.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.0"/><text x="612.0" y="486.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="612.0" dy="0.0">звичайна зона живе за старими правилами: у неї можна писати куди завгодно й скільки завгодно разів;</tspan><tspan x="612.0" dy="18.2">послідовна зона — це носій, який показав своє справжнє обмеження замість того, щоб його імітувати</tspan></text>
</svg>