<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Неблокуючий connect: перебіг і сусідні відповіді</text>
<text x="200.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">перебіг</text>
<text x="690.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">інші відповіді того самого connect</text>
<rect x="40.0" y="48.0" width="320.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="77.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">connect(fd, addr, len)</tspan></text>
<rect x="40.0" y="116.0" width="320.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="145.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">−1, errno = EINPROGRESS</tspan></text>
<rect x="40.0" y="184.0" width="320.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="209.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">epoll_wait → EPOLLOUT</tspan><tspan x="200.0" dy="15.6">(на невдачі ще й EPOLLERR)</tspan></text>
<rect x="40.0" y="264.0" width="320.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="289.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">getsockopt(fd, SOL_SOCKET,</tspan><tspan x="200.0" dy="15.6">SO_ERROR, &amp;err, &amp;len)</tspan></text>
<rect x="40.0" y="344.0" width="320.0" height="44.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="200.0" y="370.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">err == 0 → з'єднано</tspan></text>
<rect x="40.0" y="402.0" width="320.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="427.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">err != 0 → це і є причина;</tspan><tspan x="200.0" dy="15.6">сокет закрити, створити новий</tspan></text>
<line x1="200.0" y1="100.0" x2="200.0" y2="114.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="200.0" y1="168.0" x2="200.0" y2="182.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="200.0" y1="244.0" x2="200.0" y2="262.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="200.0" y1="324.0" x2="200.0" y2="342.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="200.0" y1="390.0" x2="200.0" y2="400.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="412.0" y="48.0" width="544.0" height="60.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="684.0" y="74.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="684.0" dy="0.0">0 — з'єднано одразу; звична відповідь</tspan><tspan x="684.0" dy="14.3">на сокеті домену Unix і на loopback</tspan></text>
<rect x="412.0" y="124.0" width="544.0" height="60.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="684.0" y="150.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="684.0" dy="0.0">EAGAIN «спробуй пізніше» — лише на сокеті домену Unix:</tspan><tspan x="684.0" dy="14.3">черга слухача повна; на інших родинах — маршрутний кеш</tspan></text>
<rect x="412.0" y="200.0" width="544.0" height="60.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="684.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="684.0" dy="0.0">EALREADY — попереднє рукостискання ще триває;</tspan><tspan x="684.0" dy="14.3">це не «спробуй ще», а «питаєш не тим викликом»</tspan></text>
<rect x="412.0" y="276.0" width="544.0" height="60.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="684.0" y="302.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="684.0" dy="0.0">EISCONN — з'єднання вже встановлено; саме так</tspan><tspan x="684.0" dy="14.3">виглядає успіх для коду, що повторює connect</tspan></text>
<rect x="412.0" y="352.0" width="544.0" height="60.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="684.0" y="378.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="684.0" dy="0.0">готовність до запису сама собою нічого не доводить:</tspan><tspan x="684.0" dy="14.3">невдале з'єднання теж робить сокет готовим</tspan></text>
</svg>