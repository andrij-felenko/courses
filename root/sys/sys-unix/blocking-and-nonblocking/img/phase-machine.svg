<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фази одного з'єднання в циклі подій</text>
<rect x="100.0" y="44.0" width="410.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="74.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">PH_HEADER</tspan><tspan x="305.0" dy="16.9">читаємо в hdr[4], поки hdr_got &lt; 4</tspan></text>
<rect x="100.0" y="158.0" width="410.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="188.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">PH_BODY</tspan><tspan x="305.0" dy="16.9">читаємо в body[], поки body_got &lt; body_len</tspan></text>
<rect x="100.0" y="272.0" width="410.0" height="68.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="293.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">повідомлення ціле</tspan><tspan x="305.0" dy="16.9">out_push(4 + body_len)</tspan><tspan x="305.0" dy="16.9">out_flush()</tspan></text>
<rect x="100.0" y="386.0" width="410.0" height="56.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="418.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">phase = PH_HEADER, hdr_got = 0</tspan></text>
<line x1="150.0" y1="112.0" x2="150.0" y2="158.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="340.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">hdr_got == 4 → body_len = ntohl(hdr)</text>
<line x1="150.0" y1="226.0" x2="150.0" y2="272.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="340.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">body_got == body_len — повідомлення ціле</text>
<line x1="150.0" y1="340.0" x2="150.0" y2="386.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="340.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">з'єднання готове до наступного повідомлення</text>
<line x1="100.0" y1="414.0" x2="60.0" y2="414.0" stroke="#333333" stroke-width="1.5"/>
<line x1="60.0" y1="414.0" x2="60.0" y2="78.0" stroke="#333333" stroke-width="1.5"/>
<line x1="60.0" y1="78.0" x2="100.0" y2="78.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="510.0" y1="78.0" x2="550.0" y2="78.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="550.0" y="44.0" width="350.0" height="68.0" rx="6" fill="#f7f3e8" stroke="#6b7280" stroke-width="1.5"/><text x="725.0" y="74.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">read() дав менше за 4 байти або EAGAIN:</tspan><tspan x="725.0" dy="15.6">лічильник росте, фаза лишається</tspan></text>
<line x1="510.0" y1="192.0" x2="550.0" y2="192.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="550.0" y="158.0" width="350.0" height="68.0" rx="6" fill="#f7f3e8" stroke="#6b7280" stroke-width="1.5"/><text x="725.0" y="188.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">read() дав менше, ніж лишалося, або EAGAIN:</tspan><tspan x="725.0" dy="15.6">росте body_got, фаза лишається</tspan></text>
<line x1="510.0" y1="306.0" x2="550.0" y2="306.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="550.0" y="272.0" width="350.0" height="68.0" rx="6" fill="#f7f3e8" stroke="#6b7280" stroke-width="1.5"/><text x="725.0" y="302.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">write узяв не все — лишився хвіст:</tspan><tspan x="725.0" dy="15.6">arm() вмикає EPOLLOUT</tspan></text>
<line x1="510.0" y1="414.0" x2="550.0" y2="414.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="550.0" y="386.0" width="350.0" height="56.0" rx="6" fill="#f7f3e8" stroke="#6b7280" stroke-width="1.5"/><text x="725.0" y="418.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">хвіст дописано — arm() вимикає EPOLLOUT</tspan></text>
</svg>