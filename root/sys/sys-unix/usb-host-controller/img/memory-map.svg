<rect x="60.0" y="336.0" width="560.0" height="90.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="340.0" y="376.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">кільце передач кінцевої точки</tspan><tspan x="340.0" dy="18.2">своє на кожну ввімкнену кінцеву точку</tspan></text>
<rect x="60.0" y="470.0" width="560.0" height="80.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="340.0" y="514.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">командне кільце: драйвер → контролер</tspan></text>
<rect x="60.0" y="590.0" width="560.0" height="90.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="340.0" y="630.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">кільце подій і таблиця ERST</tspan><tspan x="340.0" dy="18.2">контролер → драйвер</tspan></text>
<rect x="820.0" y="60.0" width="480.0" height="110.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="1060.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">Operational</tspan><tspan x="1060.0" dy="18.2">DCBAAP · CRCR · USBCMD · PORTSC</tspan></text>
<rect x="820.0" y="250.0" width="480.0" height="90.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="1060.0" y="290.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">Doorbell Array</tspan><tspan x="1060.0" dy="18.2">по регістру на кожен слот</tspan></text>
<rect x="820.0" y="560.0" width="480.0" height="110.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="1060.0" y="610.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">Runtime</tspan><tspan x="1060.0" dy="18.2">ERSTBA · ERDP · IMOD</tspan></text>
<text x="719.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">запис у дзвінок</text>
