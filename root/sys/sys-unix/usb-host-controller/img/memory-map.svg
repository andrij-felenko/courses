<text x="719.0" y="601.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">події через DMA</text>
<line x1="814.0" y1="620.0" x2="626.0" y2="620.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="720.0" width="1240.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="753.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Драйвер лише готує структури в пам'яті й один раз тисне дзвінок.</tspan><tspan x="680.0" dy="18.2">Далі контролер читає кільця сам через DMA, а назад пише події — процесор не бере участі в жодній окремій транзакції.</tspan></text>
