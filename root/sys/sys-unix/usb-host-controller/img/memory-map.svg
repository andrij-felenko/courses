<rect x="60.0" y="176.0" width="560.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="340.0" y="222.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Device Context слота</tspan><tspan x="340.0" dy="18.2">Slot Context: швидкість, маршрут через хаби, порт</tspan><tspan x="340.0" dy="18.2">Endpoint Context 1…31: тип, розмір пакета, інтервал</tspan></text>
