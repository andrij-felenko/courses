<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="60.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">BAR0 контролера — одна суцільна область MMIO; де починається кожен простір, каже сам контролер</text>
<rect x="60.0" y="90.0" width="420.0" height="300.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="270.0" y="244.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0"></tspan></text>
<text x="270.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Capability  (BAR0 + 0x00)</text>
<text x="80.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">0x00</text>
<text x="146.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">CAPLENGTH · HCIVERSION</text>
<text x="80.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">0x04</text>
<text x="146.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">HCSPARAMS1 — слоти, переривачі, порти</text>
<text x="80.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">0x08</text>
<text x="146.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">HCSPARAMS2 — ERST Max, scratchpad</text>
<text x="80.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">0x0C</text>
<text x="146.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">HCSPARAMS3 — затримки виходу U1/U2</text>
<text x="80.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">0x10</text>
<text x="146.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">HCCPARAMS1 — AC64, CSZ, xECP</text>
<text x="80.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">0x14</text>
<text x="146.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">DBOFF</text>
<text x="80.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">0x18</text>
<text x="146.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">RTSOFF</text>
<rect x="760.0" y="90.0" width="580.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1050.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">Operational  (BAR0 + CAPLENGTH)</tspan><tspan x="1050.0" dy="18.2">USBCMD · USBSTS · CRCR · DCBAAP · CONFIG</tspan><tspan x="1050.0" dy="18.2">PORTSC — від +0x400, по 16 байтів на порт</tspan></text>
<rect x="760.0" y="250.0" width="580.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1050.0" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">Runtime  (BAR0 + RTSOFF)</tspan><tspan x="1050.0" dy="18.2">MFINDEX за +0x00, набори переривачів від +0x20</tspan><tspan x="1050.0" dy="18.2">IMAN · IMOD · ERSTSZ · ERSTBA · ERDP, по 32 байти</tspan></text>
<rect x="760.0" y="410.0" width="580.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1050.0" y="456.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">Doorbell  (BAR0 + DBOFF)</tspan><tspan x="1050.0" dy="18.2">по 32-бітовому регістру на слот</tspan><tspan x="1050.0" dy="18.2">DB0 — командне кільце, DB1…DBn — пристрої</tspan></text>
<line x1="500.0" y1="150.0" x2="754.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="627.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">CAPLENGTH</text>
<line x1="500.0" y1="344.0" x2="620.0" y2="344.0" stroke="#333333" stroke-width="1.5"/>
<line x1="620.0" y1="344.0" x2="620.0" y2="310.0" stroke="#333333" stroke-width="1.5"/>
<line x1="620.0" y1="310.0" x2="754.0" y2="310.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="660.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">RTSOFF</text>
<line x1="500.0" y1="310.0" x2="560.0" y2="310.0" stroke="#333333" stroke-width="1.5"/>
<line x1="560.0" y1="310.0" x2="560.0" y2="470.0" stroke="#333333" stroke-width="1.5"/>
<line x1="560.0" y1="470.0" x2="754.0" y2="470.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="600.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">DBOFF</text>
<rect x="60.0" y="580.0" width="1280.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="613.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Жодне зміщення не зашите в драйвер: він читає CAPLENGTH, DBOFF і RTSOFF із Capability й лише тоді знає адреси решти.</tspan><tspan x="700.0" dy="18.2">Тому та сама реалізація однаково працює з контролером на PCIe і з блоком, вбудованим у систему на кристалі.</tspan></text>
</svg>