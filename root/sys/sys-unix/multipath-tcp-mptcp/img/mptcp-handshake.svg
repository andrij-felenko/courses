<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="840.0" height="540.0" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/>
<text x="430.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="700">Встановлення MPTCP-з'єднання (MP_CAPABLE) та приєднання підпотоку (MP_JOIN)</text>
<line x1="210.0" y1="70.0" x2="210.0" y2="500.0" stroke="#d0d7de" stroke-width="2.0" stroke-dasharray="4,4"/>
<line x1="650.0" y1="70.0" x2="650.0" y2="500.0" stroke="#d0d7de" stroke-width="2.0" stroke-dasharray="4,4"/>
<rect x="120.0" y="65.0" width="180.0" height="40.0" rx="6" fill="#eef6ff" stroke="#0969da" stroke-width="1.5"/><text x="210.0" y="74.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Клієнт (Host A)</tspan><tspan x="210.0" dy="15.6">eth0, wlan0</tspan></text>
<rect x="560.0" y="65.0" width="180.0" height="40.0" rx="6" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5"/><text x="650.0" y="74.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Сервер (Host B)</tspan><tspan x="650.0" dy="15.6">eth0 (Server IP)</tspan></text>
<rect x="40.0" y="120.0" width="780.0" height="165.0" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.0"/>
<text x="210.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0969da" text-anchor="start" font-weight="700">Фаза 1: Первинний підпотік (MP_CAPABLE)</text>
<text x="430.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0969da" text-anchor="middle" font-weight="700">1. SYN [MP_CAPABLE, KeyA]</text>
<line x1="210.0" y1="168.0" x2="650.0" y2="168.0" stroke="#0969da" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a7f37" text-anchor="middle" font-weight="700">2. SYN/ACK [MP_CAPABLE, KeyB]</text>
<line x1="650.0" y1="208.0" x2="210.0" y2="208.0" stroke="#1a7f37" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0969da" text-anchor="middle" font-weight="700">3. ACK [MP_CAPABLE, KeyA, KeyB]</text>
<line x1="210.0" y1="248.0" x2="650.0" y2="248.0" stroke="#0969da" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#57606a" text-anchor="middle" font-style="italic">Обчислено TokenA=H(KeyA), TokenB=H(KeyB), IDSNA, IDSNB</text>
<rect x="40.0" y="300.0" width="780.0" height="180.0" rx="4" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.0"/>
<text x="210.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9a6700" text-anchor="start" font-weight="700">Фаза 2: Додатковий підпотік через другий інтерфейс (MP_JOIN)</text>
<text x="430.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9a6700" text-anchor="middle" font-weight="700">4. SYN [MP_JOIN, TokenB, NonceA, AddressID=2]</text>
<line x1="210.0" y1="348.0" x2="650.0" y2="348.0" stroke="#9a6700" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a7f37" text-anchor="middle" font-weight="700">5. SYN/ACK [MP_JOIN, NonceB, HMAC-B, AddressID=1]</text>
<line x1="650.0" y1="388.0" x2="210.0" y2="388.0" stroke="#1a7f37" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9a6700" text-anchor="middle" font-weight="700">6. ACK [MP_JOIN, HMAC-A]</text>
<line x1="210.0" y1="428.0" x2="650.0" y2="428.0" stroke="#9a6700" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a7f37" text-anchor="middle" font-weight="700">Другий підпотік успішно приєднано до мета-сокета!</text>
</svg>