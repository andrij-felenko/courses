<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1290 950" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1290" height="950" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три бар'єри заморожування і скидання між ними</text>
<text x="50.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">Джерела змін вимикають зовні всередину — бо скидання на носій саме потребує роботи файлової системи</text>
<rect x="50.0" y="102.0" width="250.0" height="38.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.4"/><text x="175.0" y="125.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">стан суперблока</tspan></text>
<rect x="320.0" y="102.0" width="470.0" height="38.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.4"/><text x="555.0" y="125.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">хто ще здатен змінити том</tspan></text>
<rect x="810.0" y="102.0" width="420.0" height="38.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.4"/><text x="1020.0" y="125.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="1020.0" dy="0.0">що ядро робить, ставши сюди</tspan></text>
<rect x="50.0" y="150.0" width="250.0" height="118.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.8"/><text x="175.0" y="204.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">SB_UNFROZEN</tspan><tspan x="175.0" dy="18.2">звичайна робота</tspan></text>
<rect x="320.0" y="150.0" width="470.0" height="118.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="555.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">системні виклики запису</tspan><tspan x="555.0" dy="16.9">сторінкові збої запису в mmap</tspan><tspan x="555.0" dy="16.9">внутрішні потоки файлової системи</tspan></text>
<rect x="810.0" y="150.0" width="420.0" height="118.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><text x="1020.0" y="205.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">нічого — том живе</tspan><tspan x="1020.0" dy="16.9">своїм життям</tspan></text>
<line x1="175.0" y1="272.0" x2="175.0" y2="310.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="314.0" width="250.0" height="118.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="175.0" y="368.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">SB_FREEZE_WRITE</tspan><tspan x="175.0" dy="18.2">перекрито виклики</tspan></text>
<rect x="320.0" y="314.0" width="470.0" height="118.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="555.0" y="369.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">сторінкові збої запису в mmap</tspan><tspan x="555.0" dy="16.9">внутрішні потоки файлової системи</tspan></text>
<rect x="810.0" y="314.0" width="420.0" height="118.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="1020.0" y="360.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">чекати, поки вийдуть</tspan><tspan x="1020.0" dy="16.9">писарі, що вже</tspan><tspan x="1020.0" dy="16.9">всередині</tspan></text>
<line x1="175.0" y1="436.0" x2="175.0" y2="474.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="478.0" width="250.0" height="118.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="175.0" y="532.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">SB_FREEZE_PAGEFAULT</tspan><tspan x="175.0" dy="18.2">перекрито збої</tspan></text>
<rect x="320.0" y="478.0" width="470.0" height="118.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="555.0" y="524.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">внутрішні потоки файлової системи:</tspan><tspan x="555.0" dy="16.9">запис назад, фіксація журналу,</tspan><tspan x="555.0" dy="16.9">відкладене виділення блоків</tspan></text>
<rect x="810.0" y="478.0" width="420.0" height="118.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.6"/><text x="1020.0" y="524.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">sync_filesystem():</tspan><tspan x="1020.0" dy="16.9">ззовні писати вже нікому —</tspan><tspan x="1020.0" dy="16.9">вивозимо все на носій</tspan></text>
<line x1="175.0" y1="600.0" x2="175.0" y2="638.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="642.0" width="250.0" height="118.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="175.0" y="696.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">SB_FREEZE_FS</tspan><tspan x="175.0" dy="18.2">перекрито внутрішнє</tspan></text>
<rect x="320.0" y="642.0" width="470.0" height="118.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="555.0" y="705.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">ніхто</tspan></text>
<rect x="810.0" y="642.0" width="420.0" height="118.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="1020.0" y="688.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">-&gt;freeze_fs():</tspan><tspan x="1020.0" dy="16.9">дописати журнал,</tspan><tspan x="1020.0" dy="16.9">позначити суперблок чистим</tspan></text>
<rect x="50.0" y="812.0" width="1180.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="640.0" y="840.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">На кожній сходинці коло тих, хто ще може щось змінити, звужується; скидання на носій одне — між зовнішніми бар'єрами й внутрішнім.</tspan><tspan x="640.0" dy="18.2">Розморожування знімає бар'єри у зворотному порядку, і черга писарів рушає далі.</tspan></text>
</svg>