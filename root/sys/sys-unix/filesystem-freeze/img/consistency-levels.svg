<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три рівні узгодженості копії тому</text>
<text x="46.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="700">Заморожування піднімає копію на один рівень — і рівно на один</text>
<rect x="46.0" y="86.0" width="360.0" height="510.0" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<rect x="46.0" y="86.0" width="360.0" height="62.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="226.0" y="121.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="226.0" dy="0.0">знімок без заморожування</tspan></text>
<text x="226.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">що лишається на пристрої</text>
<rect x="64.0" y="190.0" width="324.0" height="108.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.4"/><text x="226.0" y="231.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="226.0" dy="0.0">у польоті:</tspan><tspan x="226.0" dy="16.9">сторінки в кеші, запити в черзі,</tspan><tspan x="226.0" dy="16.9">транзакція журналу відкрита</tspan></text>
<text x="226.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">що буде при відновленні</text>
<rect x="64.0" y="340.0" width="324.0" height="118.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="226.0" y="386.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="226.0" dy="0.0">монтування з відтворенням</tspan><tspan x="226.0" dy="16.9">журналу; частина щойно</tspan><tspan x="226.0" dy="16.9">записаних файлів порожня</tspan></text>
<rect x="64.0" y="492.0" width="324.0" height="76.0" rx="14" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="226.0" y="534.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="226.0" dy="0.0">рівносильно знеструмленню</tspan></text>
<rect x="450.0" y="86.0" width="360.0" height="510.0" rx="10" fill="#ffffff" stroke="#b8860b" stroke-width="1.8"/>
<rect x="450.0" y="86.0" width="360.0" height="62.0" rx="10" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="630.0" y="121.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">знімок у вікні заморожування</tspan></text>
<text x="630.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">що лишається на пристрої</text>
<rect x="468.0" y="190.0" width="324.0" height="108.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.4"/><text x="630.0" y="231.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">на носії:</tspan><tspan x="630.0" dy="16.9">жодного недописаного запису,</tspan><tspan x="630.0" dy="16.9">суперблок позначено чистим</tspan></text>
<text x="630.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">що буде при відновленні</text>
<rect x="468.0" y="340.0" width="324.0" height="118.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.6"/><text x="630.0" y="386.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">монтується без відтворення;</tspan><tspan x="630.0" dy="16.9">структура тому несуперечлива,</tspan><tspan x="630.0" dy="16.9">файли цілі як на момент вікна</tspan></text>
<rect x="468.0" y="492.0" width="324.0" height="76.0" rx="14" fill="#ffffff" stroke="#b8860b" stroke-width="2.0"/><text x="630.0" y="534.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">узгоджено на рівні файлової системи</tspan></text>
<rect x="854.0" y="86.0" width="360.0" height="510.0" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<rect x="854.0" y="86.0" width="360.0" height="62.0" rx="10" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="1034.0" y="121.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="1034.0" dy="0.0">заморожування + гачок застосунку</tspan></text>
<text x="1034.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">що лишається на пристрої</text>
<rect x="872.0" y="190.0" width="324.0" height="108.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.4"/><text x="1034.0" y="231.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1034.0" dy="0.0">перед бар'єрами застосунок</tspan><tspan x="1034.0" dy="16.9">довів свій стан до контрольної</tspan><tspan x="1034.0" dy="16.9">точки й скинув його у файли</tspan></text>
<text x="1034.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">що буде при відновленні</text>
<rect x="872.0" y="340.0" width="324.0" height="118.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="1034.0" y="386.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1034.0" dy="0.0">копія стартує без власного</tspan><tspan x="1034.0" dy="16.9">відновлення; інваріанти, розкладені</tspan><tspan x="1034.0" dy="16.9">по кількох файлах, сходяться</tspan></text>
<rect x="872.0" y="492.0" width="324.0" height="76.0" rx="14" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/><text x="1034.0" y="534.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="1034.0" dy="0.0">узгоджено на рівні застосунку</tspan></text>
<text x="46.0" y="650.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Файлова система не знає, які інваріанти застосунок розклав по своїх файлах, — тому останній крок вона зробити не може, лише дати для нього тиху мить.</text>
</svg>