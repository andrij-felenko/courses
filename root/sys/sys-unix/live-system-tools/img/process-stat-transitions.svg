<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Граф станів процесів у Linux (STAT) та їх відображення в утилітах ps/top</text>
<rect x="49.9" y="112.2" width="200.1" height="55.6" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="150.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">R: TASK_RUNNING</tspan><tspan x="150.0" dy="14.3">Виконується на CPU</tspan><tspan x="150.0" dy="14.3">або стоїть у черзі Runqueue</tspan></text>
<rect x="301.5" y="62.2" width="357.0" height="55.6" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="480.0" y="79.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">S: TASK_INTERRUPTIBLE</tspan><tspan x="480.0" dy="14.3">Переривний сон (очікування події, сокета, таймера)</tspan><tspan x="480.0" dy="14.3">Прокидається сигналом або подією</tspan></text>
<rect x="274.2" y="172.2" width="411.6" height="55.6" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="480.0" y="189.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">D: TASK_UNINTERRUPTIBLE</tspan><tspan x="480.0" dy="14.3">Безперервний сон на дисковому I/O або lock ядра</tspan><tspan x="480.0" dy="14.3">Імунний до сигналів (навіть kill -9), рахується в Load Avg</tspan></text>
<rect x="12.4" y="322.2" width="275.2" height="55.6" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="150.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">T / t: TASK_STOPPED / TRACED</tspan><tspan x="150.0" dy="14.3">Зупинено сигналом SIGSTOP / SIGTSTP</tspan><tspan x="150.0" dy="14.3">або зупинено під налагоджувачем ptrace</tspan></text>
<rect x="378.6" y="322.2" width="322.9" height="55.6" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/><text x="540.0" y="346.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">Z: EXIT_ZOMBIE</tspan><tspan x="540.0" dy="14.3">Завершено (do_exit), код виходу в task_struct</tspan><tspan x="540.0" dy="14.3">Чекає на виклик wait4() батьківського процесу</tspan></text>
<rect x="708.9" y="326.0" width="142.2" height="48.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="780.0" y="340.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">X: DEAD</tspan><tspan x="780.0" dy="13.0">Остаточне вивільнення</tspan><tspan x="780.0" dy="13.0">пам'яті task_struct</tspan></text>
<line x1="190.0" y1="115.0" x2="330.0" y2="95.0" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="250.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0284c7" text-anchor="middle">read(), epoll_wait()</text>
<line x1="330.0" y1="110.0" x2="210.0" y2="130.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="270.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#16a34a" text-anchor="middle">Подія / Сигнал</text>
<line x1="180.0" y1="165.0" x2="300.0" y2="195.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="230.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">Синхронний I/O, семафор</text>
<line x1="300.0" y1="210.0" x2="190.0" y2="180.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="250.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#16a34a" text-anchor="middle">Переривання I/O</text>
<line x1="130.0" y1="185.0" x2="130.0" y2="305.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="80.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle">SIGSTOP / Ctrl+Z</text>
<line x1="170.0" y1="305.0" x2="170.0" y2="185.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="205.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#16a34a" text-anchor="middle">SIGCONT</text>
<line x1="210.0" y1="170.0" x2="430.0" y2="325.0" stroke="#9333ea" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="350.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9333ea" text-anchor="middle">exit_group() / вихід</text>
<line x1="650.0" y1="350.0" x2="715.0" y2="350.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="685.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">wait4()</text>
<rect x="20.0" y="410.0" width="840.0" height="55.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="440.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Модифікатори STAT у ps: &lt; (високий пріоритет)  ·  N (низький пріоритет)  ·  L (сторінки заблоковано в RAM)</text>
<text x="440.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">s (лідер сесії)  ·  l (багатопотоковий процес / multi-threaded)  ·  + (процес у foreground групі термінала)</text>
</svg>