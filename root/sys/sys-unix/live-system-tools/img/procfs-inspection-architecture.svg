<line x1="390.0" y1="125.0" x2="440.0" y2="175.0" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="690.0" y1="125.0" x2="680.0" y2="175.0" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20.0" y="175.0" width="840.0" height="150.0" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="440.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">ШАР VFS — ВІРТУАЛЬНА ФАЙЛОВА СИСТЕМА PROCFS (/proc)</text>
<rect x="52.8" y="226.0" width="194.4" height="48.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="150.0" y="240.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">/proc/[pid]/stat, status</tspan><tspan x="150.0" dy="13.0">Лічильники тактів, пам'ять,</tspan><tspan x="150.0" dy="13.0">стан (R, S, D, Z, T), PPID, TGID</tspan></text>
<rect x="331.4" y="226.0" width="217.2" height="48.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="440.0" y="240.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">/proc/stat, /proc/loadavg</tspan><tspan x="440.0" dy="13.0">Сумарні jiffies (us, sy, id, wa...),</tspan><tspan x="440.0" dy="13.0">середнє навантаження за 1/5/15 хв</tspan></text>
<rect x="628.5" y="226.0" width="183.0" height="48.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="720.0" y="240.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">/proc/[pid]/fd/, /proc/net/*</tspan><tspan x="720.0" dy="13.0">Символічні посилання на inode,</tspan><tspan x="720.0" dy="13.0">сокети та анонімні пайпи</tspan></text>
<line x1="150.0" y1="290.0" x2="180.0" y2="365.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="440.0" y1="290.0" x2="440.0" y2="365.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="720.0" y1="290.0" x2="700.0" y2="365.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="20.0" y="365.0" width="840.0" height="130.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="440.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">ПРОСТІР ЯДРА — СТРУКТУРИ ТА ПІДСИСТЕМИ LINUX</text>
<rect x="60.0" y="416.0" width="240.0" height="48.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="180.0" y="430.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Керування процесами</tspan><tspan x="180.0" dy="13.0">struct task_struct (state, utime, stime)</tspan><tspan x="180.0" dy="13.0">struct mm_struct (rss, virt space)</tspan></text>
<rect x="334.2" y="416.0" width="211.5" height="48.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="440.0" y="430.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Планувальник &amp; Таймери</tspan><tspan x="440.0" dy="13.0">kernel_cpustat (сума тактів CPU),</tspan><tspan x="440.0" dy="13.0">calc_load() (експоненційне середнє)</tspan></text>
<rect x="565.8" y="416.0" width="268.5" height="48.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="700.0" y="430.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Підсистема VFS та Мережа</tspan><tspan x="700.0" dy="13.0">struct files_struct -&gt; fdtable -&gt; struct file</tspan><tspan x="700.0" dy="13.0">struct inode (i_nlink, i_size), struct sock</tspan></text>
</svg>