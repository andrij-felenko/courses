<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура діагностики: ядро Linux, простір procfs та утиліти спостереження</text>
<rect x="20.0" y="50.0" width="840.0" height="85.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="440.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-weight="700">ПРОСТІР КОРИСТУВАЧА — УТИЛІТИ ІНСПЕКЦІЇ ТА ДІАГНОСТИКИ</text>
<rect x="30.0" y="83.3" width="200.1" height="37.3" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="130.0" y="98.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">ps (POSIX / BSD)</tspan><tspan x="130.0" dy="14.3">Зріз процесів (STAT, PID, CPU)</tspan></text>
<rect x="264.9" y="83.3" width="250.3" height="37.3" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="390.0" y="98.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">top / htop</tspan><tspan x="390.0" dy="14.3">Реальний час (CPU ticks, RES/VIRT, LA)</tspan></text>
<rect x="574.3" y="83.3" width="231.4" height="37.3" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="690.0" y="98.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">lsof</tspan><tspan x="690.0" dy="14.3">Відкриті дескриптори, сокети, файли</tspan></text>
