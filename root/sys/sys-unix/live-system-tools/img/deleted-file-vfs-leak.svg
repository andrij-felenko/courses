<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механіка витоку дискового простору при unlink: чому показники df та du розходяться</text>
<rect x="20.0" y="60.0" width="260.0" height="390.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="150.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">ДЕРЕВО КАТАЛОГІВ (DENTRY)</text>
<rect x="90.7" y="116.3" width="118.6" height="37.3" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="150.0" y="131.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Каталог /var/log/</tspan><tspan x="150.0" dy="14.3">(dentry: log_dir)</tspan></text>
<rect x="58.5" y="201.0" width="183.0" height="48.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="150.0" y="215.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">app.log (dentry)</tspan><tspan x="150.0" dy="13.0">(ВИДАЛЕНО через unlink)</tspan><tspan x="150.0" dy="13.0">[ dentry вилучено з каталогу ]</tspan></text>
<rect x="52.8" y="329.5" width="194.4" height="61.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="150.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Утиліта du:</tspan><tspan x="150.0" dy="13.0">Обходить дерево каталогів</tspan><tspan x="150.0" dy="13.0">Не бачить app.log -&gt; показує 0 Б</tspan><tspan x="150.0" dy="13.0">Диск виглядає «порожнім»</tspan></text>
<line x1="150.0" y1="160.0" x2="150.0" y2="195.0" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="150.0" y1="260.0" x2="150.0" y2="310.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="60.0" width="280.0" height="390.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="440.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#14532d" text-anchor="middle" font-weight="700">ТАБЛИЦЯ ДЕСКРИПТОРІВ (VFS)</text>
<rect x="361.9" y="116.3" width="156.2" height="37.3" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="440.0" y="131.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Процес (PID 4821)</tspan><tspan x="440.0" dy="14.3">files_struct -&gt; fdtable</tspan></text>
<rect x="331.4" y="201.0" width="217.2" height="48.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="440.0" y="215.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Дескриптор fd=3</tspan><tspan x="440.0" dy="13.0">struct file (f_count = 1)</tspan><tspan x="440.0" dy="13.0">/proc/4821/fd/3 -&gt; app.log (deleted)</tspan></text>
<rect x="348.5" y="329.5" width="183.0" height="61.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="440.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Утиліта lsof /proc:</tspan><tspan x="440.0" dy="13.0">Знаходить відкритий дескриптор</tspan><tspan x="440.0" dy="13.0">із міткою (deleted)</tspan><tspan x="440.0" dy="13.0">Виявляє джерело витоку</tspan></text>
<line x1="440.0" y1="160.0" x2="440.0" y2="195.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="440.0" y1="260.0" x2="440.0" y2="310.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="600.0" y="60.0" width="260.0" height="390.0" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
<text x="730.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#713f12" text-anchor="middle" font-weight="700">ІНОДА ТА СУПЕРБЛОК ФС</text>
<rect x="630.0" y="131.0" width="200.1" height="48.0" rx="6" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5"/><text x="730.0" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">struct inode (ext4/xfs)</tspan><tspan x="730.0" dy="13.0">i_nlink = 0 (посилань у ФС немає)</tspan><tspan x="730.0" dy="13.0">АЛЕ f_count &gt; 0 (файл відкритий)</tspan></text>
<rect x="647.0" y="221.0" width="165.9" height="48.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="730.0" y="235.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Блоки даних на диску</tspan><tspan x="730.0" dy="13.0">(50 ГБ логів ЗАБЛОКОВАНО)</tspan><tspan x="730.0" dy="13.0">Блоки НЕ повертаються у пул</tspan></text>
<rect x="630.0" y="329.5" width="200.1" height="61.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="730.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Утиліта df (statvfs):</tspan><tspan x="730.0" dy="13.0">Опитує суперблок ФС</tspan><tspan x="730.0" dy="13.0">Бачить зайняті блоки -&gt; 100% full</tspan><tspan x="730.0" dy="13.0">Диск переповнений!</tspan></text>
<line x1="730.0" y1="190.0" x2="730.0" y2="215.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/>
