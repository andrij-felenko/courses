<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл стану термінала: вхід у сирий режим, TUI та гарантоване відновлення</text>
<rect x="30.0" y="60.0" width="230.0" height="340.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="145.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">1. Канонічний режим</text>
<text x="145.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Стан термінала в командній оболонці</text>
<rect x="45.0" y="125.0" width="200.0" height="100.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="145.0" y="152.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Параметри termios:</tspan><tspan x="145.0" dy="13.0">• ICANON: рядкова буферизація</tspan><tspan x="145.0" dy="13.0">• ECHO: показ натиснутих літер</tspan><tspan x="145.0" dy="13.0">• ISIG: обробка Ctrl+C ядром</tspan><tspan x="145.0" dy="13.0">• ONLCR: перетворення \n у \r\n</tspan></text>
<rect x="45.0" y="240.0" width="200.0" height="80.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="145.0" y="262.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Екранні режими:</tspan><tspan x="145.0" dy="14.3">• Основний буфер екрана</tspan><tspan x="145.0" dy="14.3">• Курсор видимий (\e[?25h)</tspan><tspan x="145.0" dy="14.3">• Прокрутка ввімкнена</tspan></text>
<rect x="45.0" y="335.0" width="200.0" height="50.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="145.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0369a1" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Дія на старті:</tspan><tspan x="145.0" dy="13.0">tcgetattr(fd, &amp;orig_termios)</tspan></text>
<rect x="315.0" y="60.0" width="230.0" height="340.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.0"/>
<text x="430.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="700">2. Сирий режим (Raw/TUI)</text>
<text x="430.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle">Повний контроль над клавішами й екраном</text>
<rect x="330.0" y="125.0" width="200.0" height="110.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="430.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Зміни termios:</tspan><tspan x="430.0" dy="13.0">• cfmakeraw(&amp;raw) або скидання:</tspan><tspan x="430.0" dy="13.0">  ~(ICANON | ECHO | ECHOE |</tspan><tspan x="430.0" dy="13.0">    ISIG | IEXTEN | IXON)</tspan><tspan x="430.0" dy="13.0">• c_cc[VMIN] = 1, VTIME = 0</tspan><tspan x="430.0" dy="13.0">• Застосування: TCSAFLUSH</tspan></text>
<rect x="330.0" y="250.0" width="200.0" height="80.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="430.0" y="275.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Екранні послідовності:</tspan><tspan x="430.0" dy="11.7">• Альтернативний екран: \e[?1049h</tspan><tspan x="430.0" dy="11.7">• Сховати курсор: \e[?25l</tspan><tspan x="430.0" dy="11.7">• Сигнал SIGWINCH підключено</tspan></text>
<rect x="330.0" y="345.0" width="200.0" height="40.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="430.0" y="368.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Головний цикл подій програми</tspan></text>
<rect x="600.0" y="60.0" width="230.0" height="340.0" rx="8" fill="#f8fafc" stroke="#22c55e" stroke-width="1.5"/>
<text x="715.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#15803d" text-anchor="middle" font-weight="700">3. Відновлення стану</text>
<text x="715.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">Вихід або обробка сигналів</text>
<rect x="615.0" y="125.0" width="200.0" height="95.0" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/><text x="715.0" y="147.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Очищення термінала:</tspan><tspan x="715.0" dy="14.3">1. \e[?25h (показати курсор)</tspan><tspan x="715.0" dy="14.3">2. \e[?1049l (основний екран)</tspan><tspan x="715.0" dy="14.3">3. \e[0m (скинути кольори)</tspan><tspan x="715.0" dy="14.3">4. fflush(stdout)</tspan></text>
<rect x="615.0" y="235.0" width="200.0" height="85.0" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/><text x="715.0" y="252.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Відновлення драйвера:</tspan><tspan x="715.0" dy="14.3">tcsetattr(fd, TCSAFLUSH,</tspan><tspan x="715.0" dy="14.3">          &amp;orig_termios);</tspan><tspan x="715.0" dy="14.3">Скидання залишків вводу</tspan><tspan x="715.0" dy="14.3">і повернення лінійних правил</tspan></text>
<rect x="615.0" y="335.0" width="200.0" height="50.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="715.0" y="356.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">Захист: atexit() +</tspan><tspan x="715.0" dy="14.3">обробники SIGINT, SIGTERM</tspan></text>
<line x1="260.0" y1="210.0" x2="315.0" y2="210.0" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="545.0" y1="210.0" x2="600.0" y2="210.0" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>