<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях зміни розміру термінала: від зміни вікна GUI до SIGWINCH і перемалювання TUI</text>
<rect x="20.0" y="50.0" width="240.0" height="400.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="140.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">Емулятор термінала (GUI)</text>
<text x="140.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Alacritty, xterm, WezTerm</text>
<rect x="35.0" y="120.0" width="210.0" height="65.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="140.0" y="134.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">1. Користувач тягне кут вікна</tspan><tspan x="140.0" dy="14.3">Пікселі = w_px × h_px</tspan><tspan x="140.0" dy="14.3">Стовпці = w_px / font_w</tspan><tspan x="140.0" dy="14.3">Рядки = h_px / font_h</tspan></text>
<rect x="35.0" y="230.0" width="210.0" height="60.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="140.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0369a1" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">2. Системний виклик ioctl</tspan><tspan x="140.0" dy="15.6">ioctl(ptmx_fd, TIOCSWINSZ,</tspan><tspan x="140.0" dy="15.6">      &amp;winsize)</tspan></text>
<rect x="290.0" y="50.0" width="280.0" height="400.0" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="430.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Ядро Linux: підсистема TTY</text>
<text x="430.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Драйвер PTY (struct tty_struct)</text>
<rect x="305.0" y="120.0" width="250.0" height="110.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="430.0" y="143.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">3. Оновлення стану лінії</tspan><tspan x="430.0" dy="14.3">struct winsize {</tspan><tspan x="430.0" dy="14.3">  ws_row, ws_col;</tspan><tspan x="430.0" dy="14.3">  ws_xpixel, ws_ypixel;</tspan><tspan x="430.0" dy="14.3">};</tspan><tspan x="430.0" dy="14.3">tty-&gt;winsize = new_ws;</tspan></text>
<rect x="305.0" y="270.0" width="250.0" height="70.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="430.0" y="285.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">4. Генерація сигналу</tspan><tspan x="430.0" dy="15.6">Якщо розмір змінився:</tspan><tspan x="430.0" dy="15.6">kill_pgrp(tty-&gt;pgrp,</tspan><tspan x="430.0" dy="15.6">          SIGWINCH, 1);</tspan></text>
<rect x="600.0" y="50.0" width="240.0" height="400.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="720.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">TUI-програма (фоновий/активний)</text>
<text x="720.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">vim, htop, less (/dev/pts/N)</text>
<rect x="615.0" y="120.0" width="210.0" height="65.0" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="720.0" y="134.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">5. Обробка SIGWINCH</tspan><tspan x="720.0" dy="14.3">Обробник сигналу або</tspan><tspan x="720.0" dy="14.3">читання через signalfd(2)</tspan><tspan x="720.0" dy="14.3">Встановлення прапорця</tspan></text>
<rect x="615.0" y="230.0" width="210.0" height="60.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="720.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0369a1" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">6. Запит нової геометрії</tspan><tspan x="720.0" dy="15.6">ioctl(STDIN_FILENO,</tspan><tspan x="720.0" dy="15.6">      TIOCGWINSZ, &amp;ws)</tspan></text>
<rect x="615.0" y="340.0" width="210.0" height="65.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="720.0" y="356.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">7. Адаптація сітки UI</tspan><tspan x="720.0" dy="13.0">Перевиділення матриці комірок</tspan><tspan x="720.0" dy="13.0">Перерахунок розкладки панелей</tspan><tspan x="720.0" dy="13.0">Повне перемалювання кадру</tspan></text>
<line x1="140.0" y1="185.0" x2="140.0" y2="225.0" stroke="#0284c7" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="245.0" y1="260.0" x2="305.0" y2="175.0" stroke="#0284c7" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="430.0" y1="230.0" x2="430.0" y2="265.0" stroke="#ef4444" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="555.0" y1="305.0" x2="615.0" y2="152.0" stroke="#ef4444" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="720.0" y1="185.0" x2="720.0" y2="225.0" stroke="#0284c7" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="615.0" y1="260.0" x2="560.0" y2="260.0" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="720.0" y1="290.0" x2="720.0" y2="335.0" stroke="#22c55e" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>