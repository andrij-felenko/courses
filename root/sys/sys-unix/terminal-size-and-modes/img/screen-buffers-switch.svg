<text x="200.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Основний екран (Primary Buffer)</text>
<text x="200.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Стандартний режим командного рядка</text>
<rect x="45.0" y="120.0" width="310.0" height="70.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="200.0" y="144.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Кільцевий буфер прокрутки (Scrollback)</tspan><tspan x="200.0" dy="14.3">Зберігає історію виводу: 10 000+ рядків</tspan><tspan x="200.0" dy="14.3">Доступний через коліщатко миші / Shift+PageUp</tspan></text>
<rect x="45.0" y="205.0" width="310.0" height="110.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="200.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle"><tspan x="200.0" dy="0.0">Видима сітка (ws_row × ws_col):</tspan><tspan x="200.0" dy="15.6">$ git status</tspan><tspan x="200.0" dy="15.6">$ cargo build</tspan><tspan x="200.0" dy="15.6">$ vim main.c █</tspan><tspan x="200.0" dy="15.6">(Курсор стоїть у позиції команди)</tspan></text>
<text x="200.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-style="italic">Вміст не втрачається під час роботи TUI</text>
<text x="200.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-style="italic">Шелл повертається до початкового стану</text>
