<text x="660.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Режим повноекранної програми</text>
<rect x="505.0" y="120.0" width="310.0" height="55.0" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="660.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle"><tspan x="660.0" dy="0.0">Немає буфера прокрутки (Scrollback: 0)</tspan><tspan x="660.0" dy="14.3">Кожна комірка адресована напряму</tspan><tspan x="660.0" dy="14.3">Команди прокрутки керуються самою програмою</tspan></text>
<rect x="505.0" y="190.0" width="310.0" height="135.0" rx="6" fill="#020617" stroke="#0284c7" stroke-width="1.5"/><text x="660.0" y="225.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle"><tspan x="660.0" dy="0.0">Матриця комірок (ws_row × ws_col):</tspan><tspan x="660.0" dy="14.3">┌── main.c ───────────────────┐</tspan><tspan x="660.0" dy="14.3">│ int main() {                 │</tspan><tspan x="660.0" dy="14.3">│     printf(&quot;Hello, TUI\n&quot;);  │</tspan><tspan x="660.0" dy="14.3">│ }                            │</tspan><tspan x="660.0" dy="14.3">└── NORMAL ── 1,1 ────────────┘</tspan></text>
<text x="660.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-style="italic">Чистий лист без змішування з шеллом</text>
<text x="660.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-style="italic">При виході матриця звільняється</text>
