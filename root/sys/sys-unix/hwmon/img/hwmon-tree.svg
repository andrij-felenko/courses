<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один пристрій — два шляхи до нього</text>
<text x="280.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">КЛАС: плаский список</text>
<rect x="60.0" y="115.0" width="460.0" height="210.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="290.0" y="172.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">/sys/class/hwmon/</tspan><tspan x="290.0" dy="17.6">    hwmon0  →  …</tspan><tspan x="290.0" dy="17.6">    hwmon1  →  …</tspan><tspan x="290.0" dy="17.6">    hwmon3  →  наш датчик</tspan><tspan x="290.0" dy="17.6"></tspan><tspan x="290.0" dy="17.6">номер = порядок реєстрації,</tspan><tspan x="290.0" dy="17.6">після перезавантаження інший</tspan></text>
<text x="1010.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">ДЕРЕВО: фізична адреса</text>
<rect x="700.0" y="115.0" width="640.0" height="210.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="1020.0" y="180.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">/sys/devices/platform/soc/i2c-1/</tspan><tspan x="1020.0" dy="17.6">    1-004c/            ← чип за адресою 0x4c</tspan><tspan x="1020.0" dy="17.6">        driver  →  lm75</tspan><tspan x="1020.0" dy="17.6">        hwmon/hwmon3/  ← справжнє місце</tspan><tspan x="1020.0" dy="17.6"></tspan><tspan x="1020.0" dy="17.6">шлях міняється лише разом із залізом</tspan></text>
<line x1="524.0" y1="195.0" x2="696.0" y2="195.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="610.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">символьне посилання</text>
<line x1="696.0" y1="250.0" x2="524.0" y2="250.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="610.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">файл device веде назад</text>
<rect x="60.0" y="370.0" width="1280.0" height="130.0" rx="6" fill="#eef0f3" stroke="#1a1a1a" stroke-width="2.0"/><text x="700.0" y="422.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">ЩО ЛЕЖИТЬ У КАТАЛОЗІ hwmon3</tspan><tspan x="700.0" dy="17.6">name  ← єдиний обов'язковий: «lm75», малими, без пробілів і дефісів</tspan><tspan x="700.0" dy="17.6">temp1_input  temp1_max  temp1_crit  temp1_label   fan1_input  fan1_fault   pwm1  pwm1_enable</tspan></text>
<rect x="60.0" y="530.0" width="1280.0" height="66.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="700.0" y="567.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">шукати датчик треба за вмістом name, а не за числом у hwmonN: число нічого не гарантує між завантаженнями</tspan></text>
</svg>