<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм комутації та маршрут кадру в Linux Bridge (RX Path)</text>
<rect x="306.4" y="12.3" width="327.2" height="45.3" rx="6" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/><text x="470.0" y="31.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Вхідний Ethernet-кадр (sk_buff)</tspan><tspan x="470.0" dy="14.3">[Драйвер NIC / netif_receive_skb() -&gt; rx_handler]</tspan></text>
<rect x="325.2" y="82.3" width="289.6" height="45.3" rx="6" fill="#fff3bf" stroke="#f59f00" stroke-width="1.5"/><text x="470.0" y="101.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Перевірка стану порту STP (br_handle_frame)</tspan><tspan x="470.0" dy="14.3">[Порт у стані DISABLED чи BLOCKING?]</tspan></text>
<rect x="76.1" y="82.3" width="107.8" height="45.3" rx="6" fill="#ffe3e3" stroke="#c0392b" stroke-width="1.5"/><text x="130.0" y="101.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Скидання кадру</tspan><tspan x="130.0" dy="14.3">(Drop skb)</tspan></text>
<rect x="280.5" y="152.9" width="379.1" height="44.1" rx="6" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="1.5"/><text x="470.0" y="171.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">MAC Learning: оновлення FDB (br_fdb_update)</tspan><tspan x="470.0" dy="13.7">[Запис {Src MAC, VID} -&gt; Вхідний порт, скидання Aging timer]</tspan></text>
<rect x="328.3" y="227.3" width="283.3" height="45.3" rx="6" fill="#f1f3f5" stroke="#343a40" stroke-width="1.5"/><text x="470.0" y="246.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Пошук адреси призначення (br_fdb_find_rcu)</tspan><tspan x="470.0" dy="14.3">[Аналіз Dst MAC та VLAN Filtering]</tspan></text>
<rect x="91.2" y="309.3" width="157.7" height="71.4" rx="6" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/><text x="170.0" y="328.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Гілка 1: Локальний стек</tspan><tspan x="170.0" dy="13.7">(Dst MAC = MAC моста)</tspan><tspan x="170.0" dy="13.7">[br_pass_frame_up()]</tspan><tspan x="170.0" dy="13.7">-&gt; L3 IP Stack хоста</tspan></text>
<rect x="367.2" y="309.3" width="205.5" height="71.4" rx="6" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="1.5"/><text x="470.0" y="328.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Гілка 2: Відомий Unicast</tspan><tspan x="470.0" dy="13.7">(Dst MAC знайдено в FDB)</tspan><tspan x="470.0" dy="13.7">[br_forward() -&gt; Вихідний порт]</tspan><tspan x="470.0" dy="13.7">-&gt; dev_queue_xmit()</tspan></text>
<rect x="640.3" y="309.3" width="259.4" height="71.4" rx="6" fill="#fff3bf" stroke="#d35400" stroke-width="1.5"/><text x="770.0" y="328.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Гілка 3: Flooding</tspan><tspan x="770.0" dy="13.7">(Broadcast / Невідомий Unicast)</tspan><tspan x="770.0" dy="13.7">[br_flood()]</tspan><tspan x="770.0" dy="13.7">-&gt; Реплікація на всі порти крім вхідного</tspan></text>
<rect x="240.6" y="444.5" width="458.9" height="31.0" rx="6" fill="#e9ecef" stroke="#495057" stroke-width="1.5"/><text x="470.0" y="463.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Вихідний інтерфейс призначення (Egress port queue / Switchdev offload)</tspan></text>
