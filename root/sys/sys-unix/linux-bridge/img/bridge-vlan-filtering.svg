<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Робота VLAN Filtering: обробка PVID, Tagged та Untagged портів</text>
<rect x="30.0" y="30.0" width="860.0" height="400.0" rx="8" fill="#f8f9fa" stroke="#495057" stroke-width="1.5"/>
<text x="460.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Комутація з фільтрацією VLAN (VLAN-Aware Linux Bridge)</text>
<rect x="94.2" y="101.1" width="151.7" height="57.8" rx="6" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.5"/><text x="170.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Access Порт 1 (eth1)</tspan><tspan x="170.0" dy="13.7">[PVID: 10, Untagged]</tspan><tspan x="170.0" dy="13.7">Вхід: Нетегований кадр</tspan></text>
<rect x="51.7" y="198.5" width="236.6" height="43.0" rx="6" fill="#d0ebff" stroke="#1971c2" stroke-width="1.5"/><text x="170.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Присвоєння внутрішнього VID:</tspan><tspan x="170.0" dy="13.0">Вхідний кадр класифікується як VLAN 10</tspan></text>
<rect x="343.4" y="175.9" width="233.2" height="88.2" rx="6" fill="#ffffff" stroke="#2b8a3e" stroke-width="1.5"/><text x="460.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Таблиця FDB моста (VLAN-Aware)</tspan><tspan x="460.0" dy="14.3">[MAC A, VID 10 -&gt; Port 1]</tspan><tspan x="460.0" dy="14.3">[MAC B, VID 10 -&gt; Port 2]</tspan><tspan x="460.0" dy="14.3">[MAC C, VID 20 -&gt; Port 3]</tspan><tspan x="460.0" dy="14.3">Ізоляція: VID 10 не бачить VID 20!</tspan></text>
<rect x="662.2" y="101.1" width="175.6" height="57.8" rx="6" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="1.5"/><text x="750.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Access Порт 2 (eth2)</tspan><tspan x="750.0" dy="13.7">[VID: 10, Egress Untagged]</tspan><tspan x="750.0" dy="13.7">Вихід: Зняття тегу 802.1Q</tspan></text>
<rect x="623.3" y="291.1" width="253.4" height="57.8" rx="6" fill="#fff3bf" stroke="#f59f00" stroke-width="1.5"/><text x="750.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Trunk Порт 3 (eth3)</tspan><tspan x="750.0" dy="13.7">[VID: 10, 20 Tagged]</tspan><tspan x="750.0" dy="13.7">Вихід: Кадр із заголовком 802.1Q VID=10</tspan></text>
<line x1="170.0" y1="165.0" x2="170.0" y2="195.0" stroke="#1971c2" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="275.0" y1="220.0" x2="335.0" y2="220.0" stroke="#1971c2" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="585.0" y1="200.0" x2="645.0" y2="150.0" stroke="#2b8a3e" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="585.0" y1="240.0" x2="645.0" y2="300.0" stroke="#f59f00" stroke-width="1.8" marker-end="url(#arrow)"/>
