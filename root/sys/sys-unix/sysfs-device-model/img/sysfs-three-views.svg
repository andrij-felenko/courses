<line x1="300.0" y1="592.0" x2="300.0" y2="618.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="620.0" width="440.0" height="58.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="2.0"/><text x="300.0" y="653.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">4:0:0:0  —  диск на цьому хості</tspan></text>
