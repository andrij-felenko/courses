<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1430 810" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1430" height="810" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="710.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне дерево, три входи: канонічний шлях і два набори посилань</text>
<text x="300.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">/sys/devices — фізичне під'єднання</text>
<rect x="80.0" y="104.0" width="440.0" height="58.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="2.0"/><text x="300.0" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">pci0000:00  —  корінь шини PCI</tspan></text>
<line x1="300.0" y1="162.0" x2="300.0" y2="188.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="190.0" width="440.0" height="58.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="2.0"/><text x="300.0" y="223.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">0000:00:14.0  —  контролер USB</tspan></text>
<line x1="300.0" y1="248.0" x2="300.0" y2="274.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="276.0" width="440.0" height="58.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="2.0"/><text x="300.0" y="309.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">usb1  —  кореневий концентратор</tspan></text>
<line x1="300.0" y1="334.0" x2="300.0" y2="360.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
