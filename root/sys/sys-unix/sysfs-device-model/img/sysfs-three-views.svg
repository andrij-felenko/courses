<rect x="800.0" y="580.0" width="560.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="1080.0" y="624.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">/sys/class/block/sdb</tspan><tspan x="1080.0" dy="17.6">згруповано за тим, ЩО пристрій робить</tspan></text>
<line x1="796.0" y1="316.0" x2="526.0" y2="391.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="796.0" y1="628.0" x2="526.0" y2="735.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="660.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">символьне</text>
<text x="660.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">посилання</text>
<text x="660.0" y="612.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">символьне</text>
<text x="660.0" y="630.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">посилання</text>
<rect x="800.0" y="400.0" width="560.0" height="130.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/><text x="1080.0" y="444.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1080.0" dy="0.0">той самий каталог має кілька шляхів</tspan><tspan x="1080.0" dy="16.9">і рівно один справжній — тому пристрої</tspan><tspan x="1080.0" dy="16.9">порівнюють за розкритим шляхом,</tspan><tspan x="1080.0" dy="16.9">а не за рядком, яким до нього прийшли</tspan></text>
</svg>