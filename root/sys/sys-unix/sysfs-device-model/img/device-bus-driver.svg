<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пристрій і драйвер не знають один про одного — знає шина</text>
<rect x="60.0" y="90.0" width="340.0" height="180.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="230.0" y="140.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">ПРИСТРІЙ  (struct device)</tspan><tspan x="230.0" dy="17.6"></tspan><tspan x="230.0" dy="17.6">ім'я й ознаки для впізнання</tspan><tspan x="230.0" dy="17.6">вказівник на батька в дереві</tspan><tspan x="230.0" dy="17.6">стан живлення</tspan><tspan x="230.0" dy="17.6">хто ним керує (поки ніхто)</tspan></text>
<rect x="480.0" y="90.0" width="340.0" height="180.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.0"/><text x="650.0" y="149.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">ШИНА  (struct bus_type)</tspan><tspan x="650.0" dy="17.6"></tspan><tspan x="650.0" dy="17.6">перелічити, що на ній є</tspan><tspan x="650.0" dy="17.6">порівняти ознаки з таблицями</tspan><tspan x="650.0" dy="17.6">покликати probe() у драйвера</tspan></text>
<rect x="900.0" y="90.0" width="340.0" height="180.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="1070.0" y="149.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1070.0" dy="0.0">ДРАЙВЕР  (device_driver)</tspan><tspan x="1070.0" dy="17.6"></tspan><tspan x="1070.0" dy="17.6">таблиця ознак: що вміє</tspan><tspan x="1070.0" dy="17.6">probe() — узяти пристрій</tspan><tspan x="1070.0" dy="17.6">remove() — віддати пристрій</tspan></text>
<line x1="400.0" y1="180.0" x2="476.0" y2="180.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="900.0" y1="180.0" x2="824.0" y2="180.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="438.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">реєстрація</text>
<text x="862.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">реєстрація</text>
<line x1="650.0" y1="274.0" x2="650.0" y2="340.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="330.0" y="340.0" width="640.0" height="110.0" rx="6" fill="#eef0f3" stroke="#1a1a1a" stroke-width="2.0"/><text x="650.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">збіг ознак → шина кличе probe() → пристрій прив'язано</tspan><tspan x="650.0" dy="17.6">probe відмовився → вузол лишається в дереві без драйвера</tspan></text>
<rect x="60.0" y="490.0" width="1180.0" height="110.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/><text x="650.0" y="532.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">слід прив'язки, видимий ззовні:</tspan><tspan x="650.0" dy="16.9">/sys/devices/…/1-2:1.0/driver  →  посилання на драйвер</tspan><tspan x="650.0" dy="16.9">/sys/bus/usb/drivers/usb-storage/1-2:1.0  →  посилання назад на пристрій</tspan></text>
</svg>