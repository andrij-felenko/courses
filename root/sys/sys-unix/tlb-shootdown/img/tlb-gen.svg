<text x="700.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">пропущене не губиться: борг записаний одним числом і сплачується тоді, коли за нього дешево платити</text>
