<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1450 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1450" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="720.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">чотири фази алгоритму Mach: бар'єр між правкою й скиданням</text>
<text x="422.5" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">Фаза 1</text>
<text x="697.5" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">Фаза 2</text>
<text x="972.5" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">Фаза 3</text>
<text x="1247.5" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">Фаза 4</text>
<line x1="555.0" y1="64.0" x2="555.0" y2="412.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,5"/>
<line x1="830.0" y1="64.0" x2="830.0" y2="412.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,5"/>
<line x1="1105.0" y1="64.0" x2="1105.0" y2="412.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,5"/>
<rect x="30.0" y="92.0" width="240.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="134.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">ініціатор</tspan></text>
<rect x="30.0" y="202.0" width="240.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="244.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">ціль, що лишилась</tspan></text>
<rect x="30.0" y="302.0" width="240.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="344.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">ціль, що пішла</tspan></text>
<rect x="290.0" y="92.0" width="265.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="422.5" y="117.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="422.5" dy="0.0">ставить прапорці всім,</tspan><tspan x="422.5" dy="16.9">хто тримає цей pmap,</tspan><tspan x="422.5" dy="16.9">і шле переривання</tspan></text>
<rect x="565.0" y="92.0" width="265.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="697.5" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="697.5" dy="0.0">чекає, поки кожна ціль</tspan><tspan x="697.5" dy="16.9">вийде з набору активних</tspan></text>
<rect x="840.0" y="92.0" width="265.0" height="76.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="972.5" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="972.5" dy="0.0">править pmap</tspan><tspan x="972.5" dy="16.9">і знімає з нього замок</tspan></text>
<rect x="1115.0" y="92.0" width="265.0" height="76.0" rx="6" fill="#eef0f2" stroke="#6b7280" stroke-width="1.5"/><text x="1247.5" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1247.5" dy="0.0">працює далі</tspan></text>
<rect x="290.0" y="202.0" width="265.0" height="76.0" rx="6" fill="#eef0f2" stroke="#6b7280" stroke-width="1.5"/><text x="422.5" y="244.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="422.5" dy="0.0">своя робота</tspan></text>
<rect x="565.0" y="202.0" width="265.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="697.5" y="227.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="697.5" dy="0.0">заходить в обробник</tspan><tspan x="697.5" dy="16.9">і виходить</tspan><tspan x="697.5" dy="16.9">з набору активних</tspan></text>
<rect x="840.0" y="202.0" width="265.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="972.5" y="236.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="972.5" dy="0.0">крутиться на місці:</tspan><tspan x="972.5" dy="16.9">не читає й не пише pmap</tspan></text>
<rect x="1115.0" y="202.0" width="265.0" height="76.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="1247.5" y="236.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1247.5" dy="0.0">скидає записи TLB,</tspan><tspan x="1247.5" dy="16.9">вертається в активні</tspan></text>
<rect x="290.0" y="302.0" width="265.0" height="76.0" rx="6" fill="#eef0f2" stroke="#6b7280" stroke-width="1.5"/><text x="422.5" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="422.5" dy="0.0">своя робота</tspan></text>
<rect x="565.0" y="302.0" width="815.0" height="76.0" rx="6" fill="#fff5e0" stroke="#c0392b" stroke-width="2.0"/><text x="972.5" y="344.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="972.5" dy="0.0">перемкнулося на інший адресний простір — ініціатор перестає його чекати</tspan></text>
<text x="720.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">цілі спиняються ДО правки, а скидають ПІСЛЯ: інакше апаратне дозавантаження встигне втягнути напівзмінений запис назад у TLB,</text>
<text x="720.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">а самі TLB тим часом дописують у таблицю біти звертання й змінення — і псують правку</text>
<text x="720.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ініціатор теж виходить із набору активних і глушить переривання — тому двоє, що стріляють один в одного, не зчіплюються намертво</text>
</svg>