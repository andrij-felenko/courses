<text x="570.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Зупиняються в обох випадках усі: третій аргумент не звужує зупинку,</tspan><tspan x="570.0" dy="20.2">а лише каже, хто саме всередині неї виконує роботу.</tspan></text>
