<line x1="270.0" y1="295.5" x2="270.0" y2="341.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="166.4" y="339.1" width="207.2" height="51.9" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="361.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">PAM, модуль pam_limits</tspan><tspan x="270.0" dy="16.9">/etc/security/limits.conf</tspan></text>
<line x1="270.0" y1="393.9" x2="270.0" y2="431.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
