<rect x="60.0" y="600.0" width="940.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="530.0" y="634.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">У правій гілці PAM немає взагалі: служба не «входить у сеанс».</tspan><tspan x="530.0" dy="17.6">Тому правка limits.conf не діє на служби, а Limit…= в юніті не діє на вхід у термінал.</tspan></text>
</svg>