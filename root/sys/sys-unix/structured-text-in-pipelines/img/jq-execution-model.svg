<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель виконання фільтрів jq</text>
<rect x="50.0" y="30.0" width="1100.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="63.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Функціональна модель jq: генератор потоку від одного входу до 0..N виходів</tspan></text>
<rect x="50.0" y="110.0" width="280.0" height="240.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Вхідний JSON (Input)</tspan><tspan x="190.0" dy="15.6"></tspan><tspan x="190.0" dy="15.6">{</tspan><tspan x="190.0" dy="15.6">  &quot;service&quot;: &quot;auth&quot;,</tspan><tspan x="190.0" dy="15.6">  &quot;events&quot;: [</tspan><tspan x="190.0" dy="15.6">    {&quot;id&quot;:1, &quot;ok&quot;:true},</tspan><tspan x="190.0" dy="15.6">    {&quot;id&quot;:2, &quot;ok&quot;:false},</tspan><tspan x="190.0" dy="15.6">    {&quot;id&quot;:3, &quot;ok&quot;:true}</tspan><tspan x="190.0" dy="15.6">  ]</tspan><tspan x="190.0" dy="15.6">}</tspan></text>
<line x1="340.0" y1="230.0" x2="420.0" y2="230.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="110.0" width="360.0" height="420.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="610.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Ланцюг трансформацій jq</tspan><tspan x="610.0" dy="15.6"></tspan><tspan x="610.0" dy="15.6">.events[]</tspan><tspan x="610.0" dy="15.6">↓ розгортання масиву в потік (3 об'єкти)</tspan><tspan x="610.0" dy="15.6"></tspan><tspan x="610.0" dy="15.6">select(.ok == false)</tspan><tspan x="610.0" dy="15.6">↓ фільтрація: відкидає ok:true (0..1 вихід)</tspan><tspan x="610.0" dy="15.6"></tspan><tspan x="610.0" dy="15.6">{ failed_id: .id }</tspan><tspan x="610.0" dy="15.6">↓ проєкція: створення нового об'єкта</tspan></text>
<line x1="800.0" y1="230.0" x2="880.0" y2="230.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="890.0" y="110.0" width="260.0" height="240.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1020.0" y="179.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">Вихідний потік (Output)</tspan><tspan x="1020.0" dy="15.6"></tspan><tspan x="1020.0" dy="15.6">{</tspan><tspan x="1020.0" dy="15.6">  &quot;failed_id&quot;: 2</tspan><tspan x="1020.0" dy="15.6">}</tspan><tspan x="1020.0" dy="15.6"></tspan><tspan x="1020.0" dy="15.6">Результат: рівно один</tspan><tspan x="1020.0" dy="15.6">відфільтрований запис</tspan></text>
<rect x="50.0" y="450.0" width="360.0" height="220.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="509.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Режим потоку: O(1) RAM</tspan><tspan x="230.0" dy="15.6"></tspan><tspan x="230.0" dy="15.6">jq '.[] | select(...)' stream.jsonl</tspan><tspan x="230.0" dy="15.6"></tspan><tspan x="230.0" dy="15.6">Кожен JSON-об'єкт читається,</tspan><tspan x="230.0" dy="15.6">трансформується й негайно записується</tspan><tspan x="230.0" dy="15.6">в stdout. Пам'ять стабільна</tspan><tspan x="230.0" dy="15.6">навіть для гігабайтних потоків.</tspan></text>
<rect x="430.0" y="550.0" width="360.0" height="120.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="610.0" y="590.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Пастка -s (--slurp): O(N) RAM</tspan><tspan x="610.0" dy="15.6"></tspan><tspan x="610.0" dy="15.6">Вичитує весь вхідний потік у спільний масив.</tspan><tspan x="610.0" dy="15.6">Ламає потоковість і вичерпує оперативну пам'ять.</tspan></text>
<rect x="810.0" y="450.0" width="340.0" height="220.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="980.0" y="517.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">Форматування виводу</tspan><tspan x="980.0" dy="15.6"></tspan><tspan x="980.0" dy="15.6">• -r (--raw-output): відкидає лапки</tspan><tspan x="980.0" dy="15.6">  для передачі утилітам POSIX;</tspan><tspan x="980.0" dy="15.6">• -c (--compact-output): генерує</tspan><tspan x="980.0" dy="15.6">  чистий ndjson по одному рядку;</tspan><tspan x="980.0" dy="15.6">• -n: стартує з null без stdin.</tspan></text>
</svg>