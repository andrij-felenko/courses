<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція конвеєра: від рядків до дерев</text>
<rect x="50.0" y="35.0" width="1100.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="68.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Еволюція конвеєра: байтовий потік символів проти структурованих дерев та ndjson</tspan></text>
<rect x="50.0" y="115.0" width="520.0" height="42.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="310.0" y="140.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">Класичний потік: роздільник 0x0A (LF), пласкі рядки</tspan></text>
<rect x="50.0" y="170.0" width="520.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="310.0" y="195.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">access.log  →  192.0.2.1 - GET /api/v1/user HTTP/1.1  200 142</tspan></text>
<rect x="50.0" y="220.0" width="520.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="310.0" y="245.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">grep /api   →  знаходить підрядок байтів без розуміння меж полів</tspan></text>
<rect x="50.0" y="270.0" width="520.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="310.0" y="295.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">cut -d' '   →  ламається, якщо поле містить пробіл або екранування</tspan></text>
<rect x="50.0" y="320.0" width="520.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="310.0" y="345.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">awk '{print}' → не бачить вкладених списків, об'єктів і переносів рядків</tspan></text>
<rect x="50.0" y="380.0" width="520.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="310.0" y="413.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Обмеження: модель не має типів, вимагає однозначного символьного роздільника й ламається на вкладених структурах</tspan></text>
<rect x="630.0" y="115.0" width="520.0" height="42.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="140.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">Сучасний потік: ndjson / типізовані дерева на каналі</tspan></text>
<rect x="630.0" y="170.0" width="520.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="890.0" y="195.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">{&quot;ip&quot;:&quot;192.0.2.1&quot;,&quot;req&quot;:{&quot;path&quot;:&quot;/api/v1&quot;},&quot;status&quot;:200,&quot;tags&quot;:[&quot;prod&quot;]}</tspan></text>
<rect x="630.0" y="220.0" width="520.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="890.0" y="245.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">jq '.req.path' → синтаксичний розбір дерева, збереження типів</tspan></text>
<rect x="630.0" y="270.0" width="520.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="890.0" y="295.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">yq -o=json      → трансляція YAML &lt;-&gt; JSON зі збереженням структури</tspan></text>
<rect x="630.0" y="320.0" width="520.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="890.0" y="345.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">xsv select 1,3  → розбір CSV за RFC 4180 з урахуванням лапок і ком</tspan></text>
<rect x="630.0" y="380.0" width="520.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="890.0" y="413.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">Перевага: кожен рядок є ізольованим синтаксичним деревом, зберігає вкладеність, типи даних та обробляється в O(1) пам'яті</tspan></text>
<rect x="50.0" y="470.0" width="1100.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="529.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Канал ядра (pipe) незмінний: це байтова труба без типів із буфером 64 КіБ (F_SETPIPE_SZ).</tspan><tspan x="600.0" dy="16.9">Змінюється контракт обробників: замість примітивного сканування до байта 0x0A утиліти запускають</tspan><tspan x="600.0" dy="16.9">потокові автомати (FSM), які розпізнають дужки, лапки, escape-послідовності та кодування UTF-8.</tspan><tspan x="600.0" dy="16.9">Формат ndjson повертає паралелізм: кожен рядок є валідним JSON, потік не накопичує DOM у пам'яті.</tspan></text>
</svg>