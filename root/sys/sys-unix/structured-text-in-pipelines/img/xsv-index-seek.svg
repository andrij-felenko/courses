<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Індексація та довільний доступ у xsv</text>
<rect x="50.0" y="35.0" width="1100.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="68.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Індексація великих CSV-файлів у xsv: від лінійного O(N) сканування до O(1) seek</tspan></text>
<rect x="50.0" y="120.0" width="480.0" height="280.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="290.0" y="209.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Файл даних: data.csv (10 Гб, 50 000 000 рядків)</tspan><tspan x="290.0" dy="15.6"></tspan><tspan x="290.0" dy="15.6">Byte 0       : id,timestamp,user,payload</tspan><tspan x="290.0" dy="15.6">Byte 1048    : 1,2026-08-25T10:00:00Z,hanna,&quot;ok&quot;</tspan><tspan x="290.0" dy="15.6">...</tspan><tspan x="290.0" dy="15.6">Byte 5242880 : 1000000,2026-08-25T12:00:00Z,dmytro,&quot;error&quot;</tspan><tspan x="290.0" dy="15.6">...</tspan><tspan x="290.0" dy="15.6">Byte 10737418240: кінець файлу</tspan></text>
<rect x="590.0" y="120.0" width="560.0" height="280.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="870.0" y="209.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">Індексний файл: data.csv.idx (бінарна таблиця зміщень)</tspan><tspan x="870.0" dy="15.6"></tspan><tspan x="870.0" dy="15.6">Header: сигнатура xsv + лічильник рядків (50M)</tspan><tspan x="870.0" dy="15.6">Row 0       → Offset: 0</tspan><tspan x="870.0" dy="15.6">Row 1 000 000 → Offset: 5242880</tspan><tspan x="870.0" dy="15.6">Row 2 000 000 → Offset: 10485760</tspan><tspan x="870.0" dy="15.6">...</tspan><tspan x="870.0" dy="15.6">Розмір індексу: ~400 Мб (сталі 8 байтів на запис)</tspan></text>
<line x1="535.0" y1="260.0" x2="585.0" y2="260.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="430.0" width="480.0" height="220.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="290.0" y="505.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Без індексу: xsv slice -i 1000000 -l 10</tspan><tspan x="290.0" dy="15.6"></tspan><tspan x="290.0" dy="15.6">1. Читає всі байти від 0 до 5 242 880;</tspan><tspan x="290.0" dy="15.6">2. Парсить 1 000 000 рядків послідовно;</tspan><tspan x="290.0" dy="15.6">3. Час виконання: ~15-30 секунд;</tspan><tspan x="290.0" dy="15.6">4. Високе навантаження на диск і CPU.</tspan></text>
<rect x="590.0" y="430.0" width="560.0" height="220.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="870.0" y="505.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0.0">З індексом (xsv index): миттєвий lseek(2)</tspan><tspan x="870.0" dy="15.6"></tspan><tspan x="870.0" dy="15.6">1. Зчитує зміщення для рядка 1 000 000 з .csv.idx;</tspan><tspan x="870.0" dy="15.6">2. Викликає lseek(fd, 5242880, SEEK_SET) і pread(2);</tspan><tspan x="870.0" dy="15.6">3. Читає лише потрібні 10 рядків (~1 КіБ даних);</tspan><tspan x="870.0" dy="15.6">4. Час виконання: &lt; 1 мілісекунди (O(1)).</tspan></text>
</svg>