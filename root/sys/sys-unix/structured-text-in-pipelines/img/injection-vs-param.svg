<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запобігання ін'єкціям у конвеєрах структурованих даних</text>
<rect x="50.0" y="35.0" width="1100.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="68.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Безпека в конвеєрах: руйнування AST при конкатенації рядків проти строгої параметризації</tspan></text>
<rect x="50.0" y="115.0" width="520.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="310.0" y="144.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">Небезпечно: інтерполяція змінних оболонки в jq-вираз</tspan></text>
<rect x="50.0" y="180.0" width="520.0" height="180.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="310.0" y="223.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Вхідні дані від користувача:</tspan><tspan x="310.0" dy="14.3">USER_INPUT='admin&quot;) | .secret // (&quot;'</tspan><tspan x="310.0" dy="14.3"></tspan><tspan x="310.0" dy="14.3">Команда зі склеюванням рядків:</tspan><tspan x="310.0" dy="14.3">jq &quot;.users[] | select(.name == \&quot;$USER_INPUT\&quot;)&quot;</tspan><tspan x="310.0" dy="14.3"></tspan><tspan x="310.0" dy="14.3">Сформований вираз після підстановки в bash:</tspan><tspan x="310.0" dy="14.3">jq '.users[] | select(.name == &quot;admin&quot;) | .secret // (&quot;&quot;)'</tspan></text>
<rect x="50.0" y="375.0" width="520.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="310.0" y="411.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Наслідок: синтаксичний розрив (AST Injection).</tspan><tspan x="310.0" dy="15.6">Рядковий літерал закривається передчасно, вставляється новий</tspan><tspan x="310.0" dy="15.6">фільтр .secret, який витікає паролі або обходить авторизацію.</tspan></text>
<rect x="630.0" y="115.0" width="520.0" height="50.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="144.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="890.0" dy="0.0">Безпечно: параметризовані аргументи --arg / --argjson</tspan></text>
<rect x="630.0" y="180.0" width="520.0" height="180.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="890.0" y="216.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">Вхідні дані від користувача:</tspan><tspan x="890.0" dy="14.3">USER_INPUT='admin&quot;) | .secret // (&quot;'</tspan><tspan x="890.0" dy="14.3"></tspan><tspan x="890.0" dy="14.3">Команда з параметризацією:</tspan><tspan x="890.0" dy="14.3">jq --arg name &quot;$USER_INPUT&quot; \</tspan><tspan x="890.0" dy="14.3">   '.users[] | select(.name == $name)'</tspan><tspan x="890.0" dy="14.3"></tspan><tspan x="890.0" dy="14.3">Синтаксичне дерево:</tspan><tspan x="890.0" dy="14.3">AST зафіксовано. $name передається як літеральне значення.</tspan></text>
<rect x="630.0" y="375.0" width="520.0" height="95.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="411.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">Результат: абсолютний захист від ін'єкцій.</tspan><tspan x="890.0" dy="15.6">Спеціальні символи (&quot;, |, //) інтерпретуються як звичайні</tspan><tspan x="890.0" dy="15.6">байти імені, синтаксична структура програми лишається непорушною.</tspan></text>
<rect x="50.0" y="490.0" width="1100.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="532.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Матриця безпечної передачі параметрів у конвеєрних утилітах:</tspan><tspan x="600.0" dy="16.9"></tspan><tspan x="600.0" dy="16.9">• jq --arg k &quot;$v&quot; : передає рядок; --argjson k &quot;$json&quot; : типізований JSON (число, bool, об'єкт);</tspan><tspan x="600.0" dy="16.9">• jq --rawfile k path : вичитує файл як строгий рядок без інтерполяції;</tspan><tspan x="600.0" dy="16.9">• xmlstarlet sel --var k=&quot;$v&quot; : передає значення у вираз XPath без конкатенації рядків;</tspan><tspan x="600.0" dy="16.9">• xsv search -s col &quot;$pattern&quot; : передає регулярний вираз як окремий аргумент argv.</tspan></text>
</svg>