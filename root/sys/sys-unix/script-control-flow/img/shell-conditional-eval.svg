<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оцінка умовних конструкцій в оболонці</text>
<text x="420.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм умовного розгалуження в оболонці (POSIX vs Bash)</text>
<rect x="20.0" y="50.0" width="180.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">1. Команда умов</tspan><tspan x="110.0" dy="13.0">if cmd / test / [</tspan><tspan x="110.0" dy="13.0">Розбиття слів та розкриття</tspan></text>
<line x1="200.0" y1="87.0" x2="260.0" y2="87.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="230.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">argv[]</text>
<rect x="260.0" y="50.0" width="180.0" height="75.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="350.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">2. Виконання процесу</tspan><tspan x="350.0" dy="14.3">Вбудована або /bin/cmd</tspan><tspan x="350.0" dy="14.3">Повертає код 0..255</tspan></text>
<line x1="440.0" y1="87.0" x2="500.0" y2="87.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="470.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">wstatus / $?</text>
<rect x="500.0" y="45.0" width="150.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="575.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="575.0" dy="0.0">3. Оцінка статусу</tspan><tspan x="575.0" dy="14.3">$? == 0 → Успіх</tspan><tspan x="575.0" dy="14.3">$? != 0 → Помилка</tspan></text>
<line x1="650.0" y1="68.0" x2="710.0" y2="68.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="710.0" y="45.0" width="110.0" height="42.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="765.0" y="69.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="765.0" dy="0.0">then гілка</tspan></text>
<line x1="650.0" y1="108.0" x2="710.0" y2="108.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="710.0" y="92.0" width="110.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="765.0" y="116.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="765.0" dy="0.0">else / fi</tspan></text>
<line x1="20.0" y1="155.0" x2="820.0" y2="155.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="20.0" y="175.0" width="180.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">1. Ключове слово [[</tspan><tspan x="110.0" dy="14.3">Спеціальний синтаксис</tspan><tspan x="110.0" dy="14.3">Без word splitting/glob</tspan></text>
<line x1="200.0" y1="217.0" x2="260.0" y2="217.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="230.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">AST токени</text>
<rect x="260.0" y="175.0" width="180.0" height="85.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="350.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">2. Внутрішній рушій</tspan><tspan x="350.0" dy="14.3">Парсинг =~ (regex),</tspan><tspan x="350.0" dy="14.3">== (glob), &amp;&amp;, ||</tspan></text>
<line x1="440.0" y1="217.0" x2="500.0" y2="217.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="470.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">логічний підсумок</text>
<rect x="500.0" y="175.0" width="150.0" height="85.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="575.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="575.0" dy="0.0">3. Результат у пам'яті</tspan><tspan x="575.0" dy="11.7">Пряме повернення 0/1</tspan><tspan x="575.0" dy="11.7">(без форку та exec)</tspan></text>
<line x1="650.0" y1="198.0" x2="710.0" y2="198.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="710.0" y="175.0" width="110.0" height="42.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="765.0" y="199.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="765.0" dy="0.0">then гілка</tspan></text>
<line x1="650.0" y1="238.0" x2="710.0" y2="238.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="710.0" y="222.0" width="110.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="765.0" y="246.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="765.0" dy="0.0">else / fi</tspan></text>
<text x="420.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Головний принцип: в оболонці 0 — це True (успіх), а ненульове число — False (помилка)</text>
</svg>