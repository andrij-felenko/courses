<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 290" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="290" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія потокового читання рядків</text>
<text x="420.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія безпечного читання потоку: while IFS= read -r line || [ -n &quot;$line&quot; ]</text>
<rect x="20.0" y="60.0" width="150.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="95.0" y="89.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="95.0" dy="0.0">Вхідний потік</tspan><tspan x="95.0" dy="14.3">Файл / Pipe</tspan><tspan x="95.0" dy="14.3">Побайтове читання</tspan><tspan x="95.0" dy="14.3">до \n або EOF</tspan></text>
<line x1="170.0" y1="107.0" x2="220.0" y2="107.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="220.0" y="60.0" width="160.0" height="95.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="91.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Прапорець -r</tspan><tspan x="300.0" dy="13.0">(Raw Mode)</tspan><tspan x="300.0" dy="13.0">Зворотні слеші \</tspan><tspan x="300.0" dy="13.0">не екранують \n і char</tspan></text>
<line x1="380.0" y1="107.0" x2="430.0" y2="107.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="60.0" width="170.0" height="95.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="515.0" y="89.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="515.0" dy="0.0">Префікс IFS=</tspan><tspan x="515.0" dy="14.3">(Internal Field Sep)</tspan><tspan x="515.0" dy="14.3">Вимкнено відтинання</tspan><tspan x="515.0" dy="14.3">пробілів і табуляцій</tspan></text>
<line x1="600.0" y1="107.0" x2="650.0" y2="107.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="650.0" y="60.0" width="170.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="735.0" y="89.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">Змінна $line</tspan><tspan x="735.0" dy="14.3">Отримує точний</tspan><tspan x="735.0" dy="14.3">оригінальний вміст</tspan><tspan x="735.0" dy="14.3">рядка без викривлень</tspan></text>
<line x1="20.0" y1="175.0" x2="820.0" y2="175.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="120.0" y="190.0" width="270.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="255.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">Останній рядок БЕЗ \n на кінці:</tspan><tspan x="255.0" dy="14.3">read повертає $? = 1 (EOF),</tspan><tspan x="255.0" dy="14.3">але в $line залишається текст!</tspan></text>
<line x1="390.0" y1="222.0" x2="450.0" y2="222.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="420.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">||</text>
<rect x="450.0" y="190.0" width="270.0" height="65.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="585.0" y="204.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="585.0" dy="0.0">Страхувальник [ -n &quot;$line&quot; ]:</tspan><tspan x="585.0" dy="14.3">Рятує останній рядок!</tspan><tspan x="585.0" dy="14.3">Цикл обробляє залишок рядка</tspan><tspan x="585.0" dy="14.3">і лише потім зупиняється</tspan></text>
</svg>