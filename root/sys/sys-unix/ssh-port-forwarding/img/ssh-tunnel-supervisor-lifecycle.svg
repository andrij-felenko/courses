<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл та відновлення фонового SSH-тунелю</text>
<rect x="55.4" y="80.2" width="129.1" height="59.6" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="120.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">1. Ініціалізація</tspan><tspan x="120.0" dy="14.3">ssh -N -f -L ...</tspan><tspan x="120.0" dy="14.3">Автентифікація</tspan></text>
<rect x="288.6" y="80.2" width="142.8" height="59.6" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="360.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">2. Активний тунель</tspan><tspan x="360.0" dy="14.3">Порт слухається</tspan><tspan x="360.0" dy="14.3">Трафік передається</tspan></text>
<rect x="535.0" y="80.2" width="170.0" height="59.6" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="620.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">3. Зондування живості</tspan><tspan x="620.0" dy="14.3">ServerAliveInterval 15</tspan><tspan x="620.0" dy="14.3">ServerAliveCountMax 3</tspan></text>
<rect x="695.2" y="210.2" width="149.6" height="59.6" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="770.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">4. Виявлення обриву</tspan><tspan x="770.0" dy="14.3">Таймаут відповіді</tspan><tspan x="770.0" dy="14.3">ssh завершує процес</tspan></text>
<rect x="261.3" y="280.2" width="197.3" height="59.6" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/><text x="360.0" y="299.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">5. Автоматичний перезапуск</tspan><tspan x="360.0" dy="14.3">systemd Restart=always або</tspan><tspan x="360.0" dy="14.3">autossh / супервізор</tspan></text>
<line x1="185.0" y1="110.0" x2="285.0" y2="110.0" stroke="#0284c7" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="235.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="middle">Успіх bind()</text>
<line x1="435.0" y1="110.0" x2="525.0" y2="110.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="480.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle">Кожні 15 с</text>
<line x1="715.0" y1="110.0" x2="770.0" y2="195.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="765.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">Немає ACK (45 с)</text>
<line x1="700.0" y1="260.0" x2="480.0" y2="310.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="595.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">SIGCHLD / Exit code != 0</text>
<line x1="260.0" y1="310.0" x2="120.0" y2="160.0" stroke="#9333ea" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="150.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9333ea" text-anchor="middle" font-weight="700">RestartSec=5s</text>
<rect x="38.8" y="182.0" width="162.5" height="56.0" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/><text x="120.0" y="200.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">ExitOnForwardFailure=yes</tspan><tspan x="120.0" dy="13.0">Якщо порт зайнятий —</tspan><tspan x="120.0" dy="13.0">миттєвий вихід (exit 255)</tspan></text>
<line x1="120.0" y1="150.0" x2="120.0" y2="175.0" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>