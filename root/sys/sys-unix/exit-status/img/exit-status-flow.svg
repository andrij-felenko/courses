<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 270" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="270" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях коду виходу: від exit() ядра до змінної $? оболонки</text>
<rect x="20.0" y="70.0" width="160.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="100.0" y="107.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">Дочірній процес</tspan><tspan x="100.0" dy="16.9">exit(code) або</tspan><tspan x="100.0" dy="16.9">сигнал (SIGSEGV)</tspan></text>
<line x1="180.0" y1="120.0" x2="240.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="210.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">sys_exit</text>
<rect x="240.0" y="70.0" width="170.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="325.0" y="109.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="325.0" dy="0.0">Ядро Linux</tspan><tspan x="325.0" dy="14.3">task_struct.exit_code</tspan><tspan x="325.0" dy="14.3">(упаковка status word)</tspan></text>
<line x1="410.0" y1="120.0" x2="470.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="440.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">waitpid()</text>
<rect x="470.0" y="60.0" width="170.0" height="120.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="555.0" y="105.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="555.0" dy="0.0">Батьківський процес</tspan><tspan x="555.0" dy="11.7">wstatus (16 біт)</tspan><tspan x="555.0" dy="11.7">- WIFEXITED → WEXITSTATUS</tspan><tspan x="555.0" dy="11.7">- WIFSIGNALED → WTERMSIG</tspan></text>
<line x1="640.0" y1="120.0" x2="700.0" y2="120.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.0" y="65.0" width="105.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="752.5" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="752.5" dy="0.0">Оболонка</tspan><tspan x="752.5" dy="16.9">Змінна $?</tspan><tspan x="752.5" dy="16.9">0..125 або</tspan><tspan x="752.5" dy="16.9">128 + N</tspan></text>
<text x="300.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Нормальний exit(N) → $? = N</text>
<text x="300.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">2. Вбито сигналом S → $? = 128 + S (напр. SIGKILL: 128+9 = 137)</text>
</svg>