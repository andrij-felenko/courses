<text x="60.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Одна команда LVM створює не один пристрій, а стек: видиме ім'я вгорі, шари й приховані томи під ним</text>
<rect x="60.0" y="92.0" width="580.0" height="46.0" rx="6" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.6"/><text x="350.0" y="120.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">lvcreate -s -n snap -L 5G vg0/base</tspan></text>
<text x="60.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">видимі імена в /dev/mapper</text>
