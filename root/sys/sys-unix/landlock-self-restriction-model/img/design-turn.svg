<rect x="524.0" y="416.0" width="796.0" height="96.0" rx="6" fill="#eeeeee" stroke="#6b7280" stroke-width="1.5"/><text x="922.0" y="459.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="922.0" dy="0.0">набір латок різко скорочують, щоб рецензентам</tspan><tspan x="922.0" dy="18.2">було що дочитати до кінця</tspan></text>
