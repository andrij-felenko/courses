<rect x="320.0" y="192.0" width="180.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="410.0" y="235.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">v2</tspan><tspan x="410.0" dy="19.5">серпень 2016</tspan></text>
<rect x="524.0" y="192.0" width="796.0" height="96.0" rx="6" fill="#eeeeee" stroke="#6b7280" stroke-width="1.5"/><text x="922.0" y="235.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="922.0" dy="0.0">додано прив'язку до cgroups: політика накривала</tspan><tspan x="922.0" dy="18.2">цілу групу процесів, а не лише того, хто просив</tspan></text>
