<rect x="524.0" y="640.0" width="796.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="922.0" y="683.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="922.0" dy="0.0">єдиний виклик-мультиплексор розбито</tspan><tspan x="922.0" dy="18.2">на три окремі системні виклики</tspan></text>
