<rect x="524.0" y="528.0" width="796.0" height="96.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="922.0" y="571.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="922.0" dy="0.0">ПОВОРОТ: eBPF прибрано зовсім; натомість набори правил</tspan><tspan x="922.0" dy="18.2">на дескрипторах і один власний системний виклик</tspan></text>
