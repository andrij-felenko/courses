<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1510 850" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1510" height="850" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="310.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#6b7280" text-anchor="middle" font-weight="700">що відкриває один execvp(&quot;cat&quot;, …)</text>
<rect x="60.0" y="106.0" width="430.0" height="84.0" rx="6" fill="#eeeeee" stroke="#6b7280" stroke-width="1.5"/><text x="275.0" y="143.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">оболонка знайшла cat по PATH</tspan><tspan x="275.0" dy="18.2">і покликала execvp</tspan></text>
<rect x="520.0" y="106.0" width="220.0" height="84.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="630.0" y="152.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">—</tspan></text>
<line x1="275.0" y1="190.0" x2="275.0" y2="228.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="228.0" width="430.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="275.0" y="274.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">ядро відкриває /usr/bin/cat</tspan></text>
<rect x="520.0" y="228.0" width="220.0" height="84.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="630.0" y="266.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">EXECUTE</tspan><tspan x="630.0" dy="16.9">+ READ_FILE</tspan></text>
<line x1="275.0" y1="312.0" x2="275.0" y2="350.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="350.0" width="430.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="275.0" y="387.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">у ELF записаний інтерпретатор —</tspan><tspan x="275.0" dy="18.2">ядро відкриває і /lib64/ld-linux…</tspan></text>
<rect x="520.0" y="350.0" width="220.0" height="84.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="630.0" y="388.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">EXECUTE</tspan><tspan x="630.0" dy="16.9">+ READ_FILE</tspan></text>
<line x1="275.0" y1="434.0" x2="275.0" y2="472.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="472.0" width="430.0" height="84.0" rx="6" fill="#eeeeee" stroke="#6b7280" stroke-width="1.5"/><text x="275.0" y="518.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">ld.so відкриває /etc/ld.so.cache</tspan></text>
<rect x="520.0" y="472.0" width="220.0" height="84.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="630.0" y="510.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">READ_FILE</tspan><tspan x="630.0" dy="16.9">(є запасний шлях)</tspan></text>
<line x1="275.0" y1="556.0" x2="275.0" y2="594.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="594.0" width="430.0" height="84.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="275.0" y="631.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">ld.so відкриває libc.so.6</tspan><tspan x="275.0" dy="18.2">у /usr/lib</tspan></text>
<rect x="520.0" y="594.0" width="220.0" height="84.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="640.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">READ_FILE</tspan></text>
<line x1="275.0" y1="678.0" x2="275.0" y2="716.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="716.0" width="430.0" height="84.0" rx="6" fill="#eeeeee" stroke="#6b7280" stroke-width="1.5"/><text x="275.0" y="762.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">аж тепер починається main()</tspan></text>
<rect x="520.0" y="716.0" width="220.0" height="84.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="630.0" y="762.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">—</tspan></text>
<text x="1120.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#6b7280" text-anchor="middle" font-weight="700">чим обертається забутий каталог</text>
<rect x="800.0" y="106.0" width="640.0" height="152.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1120.0" y="159.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1120.0" dy="0.0">нема правила на /lib64:</tspan><tspan x="1120.0" dy="18.2">execve падає ще ДО першого рядка програми —</tspan><tspan x="1120.0" dy="18.2">«cannot execute: Permission denied»,</tspan><tspan x="1120.0" dy="18.2">бо інтерпретатора не вдалося відкрити</tspan></text>
<rect x="800.0" y="290.0" width="640.0" height="152.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1120.0" y="343.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1120.0" dy="0.0">нема правила на /usr/lib:</tspan><tspan x="1120.0" dy="18.2">програма таки стартує й гине пізніше —</tspan><tspan x="1120.0" dy="18.2">«libc.so.6: cannot open shared object file:</tspan><tspan x="1120.0" dy="18.2">Permission denied», код виходу 127</tspan></text>
<rect x="800.0" y="474.0" width="640.0" height="170.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1120.0" y="527.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1120.0" dy="0.0">бібліотеки відкривають ЗВИЧАЙНИМ читанням,</tspan><tspan x="1120.0" dy="18.2">тож їм досить READ_FILE</tspan><tspan x="1120.0" dy="18.2"> </tspan><tspan x="1120.0" dy="18.2">EXECUTE потрібне лише там, звідки запускає</tspan><tspan x="1120.0" dy="18.2">саме ядро: програма та її інтерпретатор</tspan></text>
<rect x="800.0" y="676.0" width="640.0" height="128.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="1120.0" y="726.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1120.0" dy="0.0">діагностика:</tspan><tspan x="1120.0" dy="18.2">strace -f -e trace=openat ./sandbox …</tspan><tspan x="1120.0" dy="18.2">показує рівно те відкриття, що впало</tspan></text>
</svg>