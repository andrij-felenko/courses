<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1490 830" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1490" height="830" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#6b7280" text-anchor="middle" font-weight="700">три стани одного права доступу</text>
<rect x="60.0" y="110.0" width="400.0" height="150.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="180.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">оголошене в handled_access_fs,</tspan><tspan x="260.0" dy="18.2">і якесь правило його дає</tspan></text>
<line x1="470.0" y1="185.0" x2="530.0" y2="185.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540.0" y="110.0" width="380.0" height="150.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="180.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">дозволене там, куди дістає правило,</tspan><tspan x="730.0" dy="18.2">і заборонене всюди інде</tspan></text>
<rect x="60.0" y="300.0" width="400.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="370.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">оголошене в handled_access_fs,</tspan><tspan x="260.0" dy="18.2">але правил на нього нема</tspan></text>
<line x1="470.0" y1="375.0" x2="530.0" y2="375.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540.0" y="300.0" width="380.0" height="150.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="730.0" y="379.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">заборонене скрізь без винятку</tspan></text>
<rect x="60.0" y="490.0" width="400.0" height="150.0" rx="6" fill="#eeeeee" stroke="#6b7280" stroke-width="1.5"/><text x="260.0" y="569.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">не оголошене в handled_access_fs</tspan></text>
<line x1="470.0" y1="565.0" x2="530.0" y2="565.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="540.0" y="490.0" width="380.0" height="150.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="730.0" y="560.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Landlock його не судить узагалі —</tspan><tspan x="730.0" dy="18.2">лишаються самі класичні права</tspan></text>
<rect x="60.0" y="690.0" width="860.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="733.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">оголосити право — це взяти за нього відповідальність:</tspan><tspan x="490.0" dy="19.5">усе оголошене типово заборонене, і лише правила щось повертають</tspan></text>
<text x="1200.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#6b7280" text-anchor="middle" font-weight="700">узгодження з ядром, яке трапилося</text>
<rect x="990.0" y="110.0" width="420.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1200.0" y="155.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1200.0" dy="0.0">abi = landlock_create_ruleset(</tspan><tspan x="1200.0" dy="18.2">  NULL, 0, ...VERSION)</tspan></text>
<line x1="1200.0" y1="210.0" x2="1200.0" y2="254.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="990.0" y="254.0" width="150.0" height="80.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1065.0" y="298.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1065.0" dy="0.0">abi &lt; 1</tspan></text>
<rect x="1155.0" y="254.0" width="255.0" height="80.0" rx="6" fill="#eeeeee" stroke="#6b7280" stroke-width="1.5"/><text x="1282.5" y="298.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1282.5" dy="0.0">Landlock нема або вимкнено</tspan></text>
<rect x="990.0" y="354.0" width="150.0" height="80.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/><text x="1065.0" y="398.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1065.0" dy="0.0">abi &lt; 2</tspan></text>
<rect x="1155.0" y="354.0" width="255.0" height="80.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="1282.5" y="398.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1282.5" dy="0.0">прибрати REFER із набору</tspan></text>
<rect x="990.0" y="454.0" width="150.0" height="80.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/><text x="1065.0" y="498.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1065.0" dy="0.0">abi &lt; 3</tspan></text>
<rect x="1155.0" y="454.0" width="255.0" height="80.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="1282.5" y="498.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1282.5" dy="0.0">прибрати TRUNCATE</tspan></text>
<rect x="990.0" y="554.0" width="150.0" height="80.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/><text x="1065.0" y="598.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1065.0" dy="0.0">abi &lt; 5</tspan></text>
<rect x="1155.0" y="554.0" width="255.0" height="80.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="1282.5" y="598.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1282.5" dy="0.0">прибрати IOCTL_DEV</tspan></text>
<rect x="990.0" y="664.0" width="420.0" height="122.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1200.0" y="711.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1200.0" dy="0.0">без цих сходинок старе ядро</tspan><tspan x="1200.0" dy="18.2">поверне EINVAL на невідоме право —</tspan><tspan x="1200.0" dy="18.2">і пісочниці не буде взагалі жодної</tspan></text>
</svg>