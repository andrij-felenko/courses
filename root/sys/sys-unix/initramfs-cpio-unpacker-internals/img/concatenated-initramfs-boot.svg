<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Багатокомпонентний склеєний initramfs у пам'яті</text>
<rect x="40.0" y="100.0" width="480.0" height="110.0" rx="6" fill="#fff6e5" stroke="#c0392b" stroke-width="1.5"/><text x="280.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Сегмент 1: Ранній мікрокод CPU</tspan><tspan x="280.0" dy="16.9">Незжиманий cpio архів</tspan><tspan x="280.0" dy="16.9">Файл: kernel/x86/microcode/GenuineIntel.bin</tspan></text>
<rect x="520.0" y="100.0" width="100.0" height="110.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="570.0" y="151.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Падінг 512B</tspan><tspan x="570.0" dy="15.6">(нулі)</tspan></text>
<rect x="620.0" y="100.0" width="580.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="910.0" y="142.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">Сегмент 2: Основний initramfs</tspan><tspan x="910.0" dy="16.9">Стиснений cpio (zstd / gzip / xz)</tspan><tspan x="910.0" dy="16.9">Повний ранній простір користувача (/init, udev, drivers)</tspan></text>
<text x="620.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність розпакування ядром Linux (unpack_to_rootfs):</text>
<rect x="40.0" y="280.0" width="360.0" height="120.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="328.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">1. Сканування без декомпресора</tspan><tspan x="220.0" dy="15.6">Ядро зчитує мікрокод ДО</tspan><tspan x="220.0" dy="15.6">ініціалізації менеджерів пам'яті</tspan></text>
<line x1="410.0" y1="340.0" x2="440.0" y2="340.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="450.0" y="280.0" width="340.0" height="120.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="620.0" y="328.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">2. Виявлення TRAILER!!!</tspan><tspan x="620.0" dy="15.6">Завершення першого cpio,</tspan><tspan x="620.0" dy="15.6">пропуск вирівнювальних нулів</tspan></text>
<line x1="800.0" y1="340.0" x2="830.0" y2="340.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="840.0" y="280.0" width="360.0" height="120.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1020.0" y="328.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">3. Визначення сигнатури стиснення</tspan><tspan x="1020.0" dy="15.6">Автовиявлення (0x28B52FFD zstd)</tspan><tspan x="1020.0" dy="15.6">та розпакування в rootfs</tspan></text>
</svg>