<text x="570.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два порядки дій: у чому різниця між зависанням і зайвим обертом циклу</text>
<rect x="40.0" y="80.0" width="500.0" height="480.0" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="290.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Перевірити, потім стати в чергу</text><text x="170.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">той, хто чекає</text><text x="410.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">той, хто будить</text><rect x="60.0" y="172.0" width="220.0" height="56.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">перевірити умову:</tspan><tspan x="170.0" dy="14.3">даних немає</tspan></text><rect x="300.0" y="238.0" width="220.0" height="56.0" rx="6" fill="#fdf3e7" stroke="#6b7280" stroke-width="1.5"/><text x="410.0" y="262.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">покласти дані</tspan><tspan x="410.0" dy="14.3">в об'єкт</tspan></text><rect x="300.0" y="304.0" width="220.0" height="56.0" rx="6" fill="#fdf3e7" stroke="#c0392b" stroke-width="1.5"/><text x="410.0" y="328.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">wake_up():</tspan><tspan x="410.0" dy="14.3">у черзі порожньо</tspan></text><rect x="60.0" y="370.0" width="220.0" height="56.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="401.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">стати в чергу</tspan></text><rect x="60.0" y="436.0" width="220.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="467.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">schedule()</tspan></text><rect x="60.0" y="510.0" width="460.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="290.0" y="538.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="290.0" dy="0.0">дані є, а задача спить: побудку втрачено</tspan></text>
<rect x="600.0" y="80.0" width="500.0" height="480.0" rx="12" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/><text x="850.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Стати в чергу, потім перевірити</text><text x="730.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">той, хто чекає</text><text x="970.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">той, хто будить</text><rect x="620.0" y="172.0" width="220.0" height="56.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.5"/><text x="730.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">стати в чергу,</tspan><tspan x="730.0" dy="14.3">стан = TASK_INTERRUPTIBLE</tspan></text><rect x="860.0" y="238.0" width="220.0" height="56.0" rx="6" fill="#fdf3e7" stroke="#6b7280" stroke-width="1.5"/><text x="970.0" y="262.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">покласти дані</tspan><tspan x="970.0" dy="14.3">в об'єкт</tspan></text><rect x="860.0" y="304.0" width="220.0" height="56.0" rx="6" fill="#fdf3e7" stroke="#27ae60" stroke-width="1.5"/><text x="970.0" y="328.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">wake_up(): знайшов запис,</tspan><tspan x="970.0" dy="14.3">ставить стан = RUNNING</tspan></text><rect x="620.0" y="370.0" width="220.0" height="56.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.5"/><text x="730.0" y="394.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">перевірити умову:</tspan><tspan x="730.0" dy="14.3">дані є</tspan></text><rect x="620.0" y="436.0" width="220.0" height="56.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="467.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">вийти з циклу</tspan></text><rect x="620.0" y="510.0" width="460.0" height="48.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="850.0" y="538.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="850.0" dy="0.0">найгірше, що сталося: умову перевірено двічі</tspan></text>
