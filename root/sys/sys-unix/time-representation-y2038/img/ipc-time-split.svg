<text x="680.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="680.0" dy="0.0">так само</tspan><tspan x="680.0" dy="16.9">для sem_ctime</tspan></text>
<text x="470.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="470.0" dy="0.0">ядро віддає два окремі беззнакові слова —</tspan><tspan x="470.0" dy="16.9">зібрати з них одне число має сама програма</tspan></text>
