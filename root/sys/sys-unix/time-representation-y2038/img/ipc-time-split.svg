<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">64-бітна позначка IPC, розкладена на два 32-бітні слова</text>
<text x="470.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">структура не виросла — поля _high посіли місце колишньої набивки</text>
