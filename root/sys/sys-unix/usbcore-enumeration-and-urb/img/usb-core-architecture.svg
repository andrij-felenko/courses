<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="242.0" y="22.0" width="516.0" height="36.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="45.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Трирівнева архітектура підсистеми USB у ядрі Linux</tspan></text>
<rect x="103.1" y="85.0" width="793.8" height="49.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Простір користувача (Userspace)</tspan><tspan x="500.0" dy="16.9">Прикладні програми (lsusb, Wireshark, libusb) • sysfs (/sys/bus/usb/) • devtmpfs (/dev/bus/usb/)</tspan></text>
<rect x="110.0" y="196.2" width="279.9" height="47.6" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="216.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Класові драйвери пристроїв</tspan><tspan x="250.0" dy="15.6">usb-storage, uvcvideo, usbhid, cdc-acm</tspan></text>
<rect x="640.8" y="196.2" width="218.4" height="47.6" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="216.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">Драйвери простору користувача</tspan><tspan x="750.0" dy="15.6">usbfs ioctl / libusb claiming</tspan></text>
<rect x="151.5" y="318.1" width="697.0" height="83.7" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="339.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Ядро підсистеми USB (USB Core / usbcore)</tspan><tspan x="500.0" dy="16.9">• Менеджер нумерації (Enumeration, hub_event)  • Маршрутизатор запитів URB</tspan><tspan x="500.0" dy="16.9">• Управління живленням (Runtime PM &amp; Autosuspend) • Розбір та валідація дескрипторів</tspan><tspan x="500.0" dy="16.9">• Модель шини 'usb' та прив'язка struct usb_driver до struct usb_interface</tspan></text>
<rect x="219.5" y="475.1" width="560.9" height="49.9" rx="6" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="496.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Драйвери хост-контролерів (HCD)</tspan><tspan x="500.0" dy="16.9">xhci-hcd (USB 3.x/4) • ehci-hcd (USB 2.0) • ohci-hcd / uhci-hcd (USB 1.1)</tspan></text>
<rect x="226.9" y="585.0" width="546.1" height="49.9" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="606.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Апаратне забезпечення (Hardware)</tspan><tspan x="500.0" dy="16.9">PCIe / SoC USB Host Controller (xHCI) ↔ Root Hub ↔ Фізичні пристрої USB</tspan></text>
