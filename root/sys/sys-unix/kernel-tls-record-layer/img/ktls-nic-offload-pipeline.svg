<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70.75 -10 1041.5 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-70.75" y="-10" width="1041.5" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр апаратного розвантаження kTLS TX (NIC Inline Encryption Flow)</text>
<rect x="30.0" y="60.0" width="250.0" height="140.0" rx="6" fill="#ffffff" stroke="#4a5568" stroke-width="1.5"/>
<text x="155.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2b6cb0" text-anchor="middle" font-weight="700">1. Ядро (kTLS TX Driver)</text>
<line x1="30.0" y1="95.0" x2="280.0" y2="95.0" stroke="#cbd5e0" stroke-width="1.5"/>
<rect x="35.0" y="105.0" width="240.0" height="85.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="155.0" y="129.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Формування SKB:</tspan><tspan x="155.0" dy="14.3">- Заголовок TLS (5B)</tspan><tspan x="155.0" dy="14.3">- Відкритий текст (Payload)</tspan><tspan x="155.0" dy="14.3">- Позначка skb: 'tls_offload=1'</tspan></text>
<line x1="280.0" y1="130.0" x2="320.0" y2="130.0" stroke="#2b6cb0" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="320.0" y="60.0" width="260.0" height="140.0" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/>
<text x="450.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2b6cb0" text-anchor="middle" font-weight="700">2. Передача в PCIe Ring</text>
<line x1="320.0" y1="95.0" x2="580.0" y2="95.0" stroke="#cbd5e0" stroke-width="1.5"/>
<rect x="325.0" y="105.0" width="250.0" height="85.0" rx="6" fill="#ebf8ff" stroke="#ebf8ff" stroke-width="1.5"/><text x="450.0" y="129.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Передача дескриптора пакета</tspan><tspan x="450.0" dy="14.3">в чергу TX Ring адаптера.</tspan><tspan x="450.0" dy="14.3">Дані у буфері RAM</tspan><tspan x="450.0" dy="14.3">ЛИШАЮТЬСЯ ВІДКРИТИМИ!</tspan></text>
<line x1="580.0" y1="130.0" x2="620.0" y2="130.0" stroke="#3182ce" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="620.0" y="60.0" width="250.0" height="140.0" rx="6" fill="#f0fff4" stroke="#276749" stroke-width="2.0"/>
<text x="745.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#276749" text-anchor="middle" font-weight="700">3. SmartNIC Crypto Engine</text>
<line x1="620.0" y1="95.0" x2="870.0" y2="95.0" stroke="#cbd5e0" stroke-width="1.5"/>
<rect x="625.0" y="105.0" width="240.0" height="85.0" rx="6" fill="#f0fff4" stroke="#f0fff4" stroke-width="1.5"/><text x="745.0" y="129.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">Апаратне шифрування:</tspan><tspan x="745.0" dy="14.3">- Ключ із контексту NIC</tspan><tspan x="745.0" dy="14.3">- Обчислення AES-GCM tag</tspan><tspan x="745.0" dy="14.3">- Відправка зашифрованого TCP</tspan></text>
<rect x="30.0" y="220.0" width="840.0" height="110.0" rx="6" fill="#feebc8" stroke="#dd6b20" stroke-width="1.5"/>
<text x="450.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9c4221" text-anchor="middle" font-weight="700">🔑 Ключовий виграш продуктивності:</text>
<rect x="40.0" y="260.0" width="820.0" height="60.0" rx="6" fill="#feebc8" stroke="#feebc8" stroke-width="1.5"/><text x="450.0" y="293.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Шифрування виконується безпосередньо у кремнії мережевої карти під час проходження байтів крізь апаратний FIFO буфер. Процесор (CPU) серверу взагалі не виконує криптографічних обчислень, що вивільняє 100% CPU для бізнес-логіки.</tspan></text>
</svg>