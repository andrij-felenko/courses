<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 655" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="655" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири обсяги адресації і виклики, що в них цілять</text>
<rect x="400.0" y="40.0" width="690.0" height="470.0" rx="12" fill="#fbfcff" stroke="#6b7280" stroke-width="1.6"/>
<text x="745.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">СЕАНС — межа винятку для SIGCONT</text>
<rect x="430.0" y="100.0" width="630.0" height="380.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="745.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">ГРУПА ПРОЦЕСІВ (PGID)</text>
<rect x="460.0" y="175.0" width="570.0" height="270.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="745.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ПРОЦЕС = ГРУПА ПОТОКІВ (PID = TGID)</text>
<text x="745.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">спільна маска очікуваних</text>
<rect x="485.0" y="270.0" width="165.0" height="64.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="567.5" y="298.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="567.5" dy="0.0">потік</tspan><tspan x="567.5" dy="16.9">TID</tspan></text>
<rect x="665.0" y="270.0" width="165.0" height="64.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="747.5" y="298.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="747.5" dy="0.0">потік</tspan><tspan x="747.5" dy="16.9">TID</tspan></text>
<rect x="845.0" y="270.0" width="165.0" height="64.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="927.5" y="298.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="927.5" dy="0.0">потік</tspan><tspan x="927.5" dy="16.9">TID</tspan></text>
<text x="745.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">власна маска очікуваних у кожного потоку</text>
<rect x="30.0" y="95.0" width="345.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="202.5" y="120.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="202.5" dy="0.0">kill(pid &lt; -1, sig) -&gt; група з PGID = -pid</tspan><tspan x="202.5" dy="16.9">killpg(pgid, sig) = kill(-pgid, sig)</tspan><tspan x="202.5" dy="16.9">kill(0, sig) -&gt; своя група процесів</tspan></text>
<line x1="378.0" y1="133.0" x2="424.0" y2="133.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30.0" y="185.0" width="345.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="202.5" y="211.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="202.5" dy="0.0">kill(pid &gt; 0, sig) -&gt; si_code = SI_USER</tspan><tspan x="202.5" dy="15.6">sigqueue(pid, sig, val) -&gt; SI_QUEUE + значення</tspan><tspan x="202.5" dy="15.6">pidfd_send_signal(pidfd, sig, info, 0)</tspan></text>
<line x1="378.0" y1="223.0" x2="454.0" y2="223.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30.0" y="278.0" width="345.0" height="64.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="202.5" y="306.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="202.5" dy="0.0">tgkill(tgid, tid, sig) -&gt; si_code = SI_TKILL</tspan><tspan x="202.5" dy="16.9">pthread_kill(thread, sig) — обгортка над ним</tspan></text>
<line x1="378.0" y1="310.0" x2="479.0" y2="302.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30.0" y="360.0" width="345.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="202.5" y="388.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="202.5" dy="0.0">kill(pid, 0) — сигналу немає,</tspan><tspan x="202.5" dy="16.9">лишаються перевірки існування й прав</tspan></text>
<line x1="378.0" y1="392.0" x2="454.0" y2="392.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30.0" y="528.0" width="1060.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="560.0" y="554.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">kill(-1, sig) — усім процесам, яким дозволено надсилати, крім PID 1 (init)</tspan></text>
<rect x="30.0" y="584.0" width="1060.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="560.0" y="610.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">raise(sig) — собі: в однопотоковій = kill(getpid(), sig), у багатопотоковій = pthread_kill(pthread_self(), sig)</tspan></text>
</svg>