<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Породження, очікування, доправлення — три різні моменти</text>
<rect x="40.0" y="60.0" width="220.0" height="60.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/><text x="150.0" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">інший процес:</tspan><tspan x="150.0" dy="15.6">kill()</tspan></text>
<line x1="150.0" y1="122.0" x2="150.0" y2="158.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="284.0" y="60.0" width="220.0" height="60.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/><text x="394.0" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="394.0" dy="0.0">драйвер термінала:</tspan><tspan x="394.0" dy="15.6">Ctrl-C</tspan></text>
<line x1="394.0" y1="122.0" x2="394.0" y2="158.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="528.0" y="60.0" width="220.0" height="60.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/><text x="638.0" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="638.0" dy="0.0">таймер, що</tspan><tspan x="638.0" dy="15.6">доспів</tspan></text>
<line x1="638.0" y1="122.0" x2="638.0" y2="158.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="772.0" y="60.0" width="220.0" height="60.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/><text x="882.0" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="882.0" dy="0.0">пастка процесора:</tspan><tspan x="882.0" dy="15.6">ділення на нуль</tspan></text>
<line x1="882.0" y1="122.0" x2="882.0" y2="158.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="40.0" y="162.0" width="320.0" height="96.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="200.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ПОРОДЖЕННЯ</text>
<text x="200.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">ядро ставить один біт</tspan><tspan x="200.0" dy="15.6">у масці очікуваних</tspan></text>
<rect x="392.0" y="162.0" width="276.0" height="96.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/>
<text x="530.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">ОЧІКУВАННЯ</text>
<text x="530.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">біт лежить у структурі задачі;</tspan><tspan x="530.0" dy="15.6">програма про нього не знає</tspan></text>
<rect x="708.0" y="162.0" width="312.0" height="96.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="864.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">ДОПРАВЛЕННЯ</text>
<text x="864.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="864.0" dy="0.0">ядро дивиться маску й діє:</tspan><tspan x="864.0" dy="15.6">обробник або типова дія</tspan></text>
<line x1="360.0" y1="210.0" x2="388.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="668.0" y1="210.0" x2="704.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="40.0" y1="336.0" x2="1020.0" y2="336.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 6"/>
<text x="530.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">розрив у часі: між породженням і доправленням може минути будь-скільки</text>
<rect x="40.0" y="384.0" width="620.0" height="190.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="350.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Доправляють лише на межі повернення в простір користувача</text>
<text x="60.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">Саме тут ядро вже має повний користувацький контекст у відомому</tspan><tspan x="60.0" dy="15.6">місці, не тримає жодного замка й може безпечно підмінити адресу</tspan><tspan x="60.0" dy="15.6">повернення на адресу обробника. Посеред драйвера чи під замком</tspan><tspan x="60.0" dy="15.6">запустити чужу функцію простору користувача неможливо.</tspan></text>
<line x1="60.0" y1="520.0" x2="640.0" y2="520.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="4 4"/>
<text x="60.0" y="542.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">user  ← сюди повертаємось, і саме тут ядро перевіряє маску</text>
<text x="60.0" y="562.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">kernel  ← тут сигнал лише породжується й лежить</text>
<rect x="688.0" y="384.0" width="332.0" height="190.0" rx="8" fill="#fbfcff" stroke="#c0392b" stroke-width="1.8"/>
<text x="854.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Наслідки розриву</text>
<text x="706.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="706.0" dy="0.0">• немає процесора — немає доправлення;</tspan><tspan x="706.0" dy="15.6">• сон перериваний: задачу будять,</tspan><tspan x="706.0" dy="15.6">   виклик обривається кодом EINTR;</tspan><tspan x="706.0" dy="15.6">• сон неперериваний (стан D):</tspan><tspan x="706.0" dy="15.6">   не будять узагалі — навіть SIGKILL</tspan><tspan x="706.0" dy="15.6">   просто лежить очікуваним.</tspan></text>
</svg>