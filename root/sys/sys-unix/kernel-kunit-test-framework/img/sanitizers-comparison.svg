<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння механізмів відлагоджувачів: KASAN vs KFENCE vs KCSAN</text>
<rect x="20.0" y="50.0" width="245.0" height="410.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="142.5" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#991b1b" text-anchor="middle" font-weight="700">KASAN</text>
<text x="142.5" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Kernel Address Sanitizer</text>
<rect x="30.0" y="110.0" width="225.0" height="110.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><text x="142.5" y="142.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="142.5" dy="0.0">Принцип:</tspan><tspan x="142.5" dy="13.0">Shadow Memory (1B тіні на 8B RAM).</tspan><tspan x="142.5" dy="13.0">Покриває 100% виділень slab/page.</tspan><tspan x="142.5" dy="13.0"></tspan><tspan x="142.5" dy="13.0">Помилки: UAF, Out-of-Bounds.</tspan></text>
<rect x="30.0" y="230.0" width="225.0" height="100.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="142.5" y="267.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="142.5" dy="0.0">Накладні витрати:</tspan><tspan x="142.5" dy="16.9">- Пам'ять: +12.5% .. +100%</tspan><tspan x="142.5" dy="16.9">- CPU: 2x .. 3x уповільнення</tspan></text>
<rect x="30.0" y="345.0" width="225.0" height="100.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="142.5" y="363.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="142.5" dy="0.0">Цільове середовище:</tspan><tspan x="142.5" dy="18.2">- Тестові CI/CD стенди</tspan><tspan x="142.5" dy="18.2">- UML / QEMU запуск</tspan><tspan x="142.5" dy="18.2">- Локальне розробницьке</tspan><tspan x="142.5" dy="18.2">  відлагодження</tspan></text>
<rect x="280.0" y="50.0" width="245.0" height="410.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="402.5" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#166534" text-anchor="middle" font-weight="700">KFENCE</text>
<text x="402.5" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Kernel Electric-Fence</text>
<rect x="290.0" y="110.0" width="225.0" height="110.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="402.5" y="156.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="402.5" dy="0.0">Принцип:</tspan><tspan x="402.5" dy="11.7">Sampling Electric Guard Pages.</tspan><tspan x="402.5" dy="11.7">Захисні сторінки PROT_NONE навколо 1 з N виділень.</tspan></text>
<rect x="290.0" y="230.0" width="225.0" height="100.0" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/><text x="402.5" y="266.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="402.5" dy="0.0">Накладні витрати:</tspan><tspan x="402.5" dy="18.2">- Пам'ять: ~1-2 MB</tspan><tspan x="402.5" dy="18.2">- CPU: &lt; 1% уповільнення</tspan></text>
<rect x="290.0" y="345.0" width="225.0" height="100.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="402.5" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="402.5" dy="0.0">Цільове середовище:</tspan><tspan x="402.5" dy="13.0">- Production бойові ядра</tspan><tspan x="402.5" dy="13.0">- Довготривале стрес-тестування</tspan><tspan x="402.5" dy="13.0">- Неперервний моніторинг у продакшні</tspan></text>
<rect x="540.0" y="50.0" width="245.0" height="410.0" rx="8" fill="#fffbebe" stroke="#d97706" stroke-width="1.5"/>
<text x="662.5" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#92400e" text-anchor="middle" font-weight="700">KCSAN</text>
<text x="662.5" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Kernel Concurrency Sanitizer</text>
<rect x="550.0" y="110.0" width="225.0" height="110.0" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/><text x="662.5" y="156.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="662.5" dy="0.0">Принцип:</tspan><tspan x="662.5" dy="11.7">Компіляторна інструментація + Watchpoints та мікро-затримки.</tspan><tspan x="662.5" dy="11.7">Детектує конфлікти читання/запису.</tspan></text>
<rect x="550.0" y="230.0" width="225.0" height="100.0" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="662.5" y="267.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="662.5" dy="0.0">Накладні витрати:</tspan><tspan x="662.5" dy="16.9">- Пам'ять: мінімальні</tspan><tspan x="662.5" dy="16.9">- CPU: 2x .. 4x уповільнення</tspan></text>
<rect x="550.0" y="345.0" width="225.0" height="100.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="662.5" y="363.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="662.5" dy="0.0">Цільове середовище:</tspan><tspan x="662.5" dy="18.2">- Пошук Race Conditions</tspan><tspan x="662.5" dy="18.2">- Тестування паралельних</tspan><tspan x="662.5" dy="18.2">  структур даних у CI</tspan><tspan x="662.5" dy="18.2">- Стрес-тести SMP</tspan></text>
</svg>