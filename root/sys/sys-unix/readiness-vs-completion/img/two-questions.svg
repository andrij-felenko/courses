<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два різні запитання до ядра</text>
<text x="30.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">готовність</text>
<text x="30.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">«коли можна?»</text>
<rect x="210.0" y="30.0" width="176.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="298.0" y="57.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="298.0" dy="0.0">epoll_wait()</tspan><tspan x="298.0" dy="15.6">потік спить</tspan></text>
<rect x="402.0" y="30.0" width="176.0" height="62.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="57.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">подія:</tspan><tspan x="490.0" dy="15.6">fd 7 читабельний</tspan></text>
<rect x="594.0" y="30.0" width="190.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="689.0" y="57.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="689.0" dy="0.0">read(7, buf, 4096)</tspan><tspan x="689.0" dy="15.6">копіює цей виклик</tspan></text>
<rect x="800.0" y="30.0" width="172.0" height="62.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="886.0" y="57.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="886.0" dy="0.0">1300 байтів</tspan><tspan x="886.0" dy="15.6">уже в buf</tspan></text>
<line x1="386.0" y1="61.0" x2="402.0" y2="61.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="578.0" y1="61.0" x2="594.0" y2="61.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="784.0" y1="61.0" x2="800.0" y2="61.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="210.0" y="104.0" width="762.0" height="34.0" rx="6" fill="#f7f3e8" stroke="#6b7280" stroke-width="1.5"/><text x="591.0" y="125.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="591.0" dy="0.0">два входи в ядро на одну прочитану порцію: спитати про стан і забрати дані</tspan></text>
<text x="30.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">завершення</text>
<text x="30.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">«зроби і скажи»</text>
<rect x="210.0" y="200.0" width="176.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="298.0" y="227.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="298.0" dy="0.0">подання:</tspan><tspan x="298.0" dy="15.6">read(7, buf, #17)</tspan></text>
<rect x="402.0" y="200.0" width="176.0" height="62.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="227.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">програма зайнята</tspan><tspan x="490.0" dy="15.6">іншими справами</tspan></text>
<rect x="594.0" y="200.0" width="190.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="689.0" y="227.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="689.0" dy="0.0">ядро копіює само,</tspan><tspan x="689.0" dy="15.6">коли дані прийшли</tspan></text>
<rect x="800.0" y="200.0" width="172.0" height="62.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="886.0" y="227.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="886.0" dy="0.0">подія #17:</tspan><tspan x="886.0" dy="15.6">1300, дані в buf</tspan></text>
<line x1="386.0" y1="231.0" x2="402.0" y2="231.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="578.0" y1="231.0" x2="594.0" y2="231.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="784.0" y1="231.0" x2="800.0" y2="231.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="210.0" y="274.0" width="762.0" height="34.0" rx="6" fill="#f7f3e8" stroke="#6b7280" stroke-width="1.5"/><text x="591.0" y="295.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="591.0" dy="0.0">один вхід у ядро на подання, а результат забирають зі спільної пам'яті</tspan></text>
<rect x="30.0" y="336.0" width="942.0" height="66.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="501.0" y="365.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="501.0" dy="0.0">різниця не в тому, хто швидший, а в тому, ХТО ВИКОНУЄ ПЕРЕНЕСЕННЯ БАЙТІВ:</tspan><tspan x="501.0" dy="16.9">у першій моделі — сама програма, окремим викликом; у другій — ядро, у момент, який програма не обирає</tspan></text>
</svg>