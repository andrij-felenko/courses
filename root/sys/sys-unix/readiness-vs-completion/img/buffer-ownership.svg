<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кому належить буфер у кожен момент</text>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">час →</text>
<rect x="24.0" y="44.0" width="200.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="124.0" y="65.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="124.0" dy="0.0">готовність</tspan><tspan x="124.0" dy="15.6">буфер віддають</tspan><tspan x="124.0" dy="15.6">на мить виклику</tspan></text>
<rect x="250.0" y="44.0" width="300.0" height="66.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="73.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">буфер вільний:</tspan><tspan x="400.0" dy="15.6">можна звільнити, віддати іншому</tspan></text>
<rect x="560.0" y="44.0" width="110.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="615.0" y="81.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">read()</tspan></text>
<rect x="680.0" y="44.0" width="270.0" height="66.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="815.0" y="73.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">буфер знову вільний:</tspan><tspan x="815.0" dy="15.6">дані вже прочитані</tspan></text>
<text x="615.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="615.0" dy="0.0">ядро торкається буфера</tspan><tspan x="615.0" dy="14.3">лічені мікросекунди</tspan></text>
<rect x="24.0" y="200.0" width="200.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="124.0" y="221.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="124.0" dy="0.0">завершення</tspan><tspan x="124.0" dy="15.6">буфер позичають</tspan><tspan x="124.0" dy="15.6">на всю операцію</tspan></text>
<rect x="250.0" y="200.0" width="150.0" height="66.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="325.0" y="229.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">буфер</tspan><tspan x="325.0" dy="15.6">вільний</tspan></text>
<rect x="410.0" y="200.0" width="400.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="610.0" y="229.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">буфер належить ядру: не звільняти, не перезаписувати,</tspan><tspan x="610.0" dy="15.6">дескриптор не закривати</tspan></text>
<rect x="820.0" y="200.0" width="130.0" height="66.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="885.0" y="229.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">буфер</tspan><tspan x="885.0" dy="15.6">повернуто</tspan></text>
<text x="420.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">подання</text>
<text x="800.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">подія завершення</text>
<line x1="415.0" y1="190.0" x2="415.0" y2="198.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="805.0" y1="190.0" x2="805.0" y2="198.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="24.0" y="300.0" width="946.0" height="74.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="497.0" y="333.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="497.0" dy="0.0">звідси вся арифметика пам'яті: у першій моделі одного буфера вистачає на всі з'єднання потоку,</tspan><tspan x="497.0" dy="16.9">у другій потрібен окремий буфер на кожну операцію, що зараз у польоті</tspan></text>
</svg>