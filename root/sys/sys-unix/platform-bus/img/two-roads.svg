<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1290 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1290" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві дороги до пари «пристрій ↔ драйвер»</text>
<rect x="60.0" y="70.0" width="540.0" height="52.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="330.0" y="101.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">ШИНА, ЯКА ВМІЄ ПИТАТИ  —  PCI, USB</tspan></text>
<rect x="680.0" y="70.0" width="540.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="950.0" y="101.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="950.0" dy="0.0">ШИНА, У ЯКОЇ НЕМА КОГО ПИТАТИ  —  platform</tspan></text>
<rect x="60.0" y="140.0" width="540.0" height="84.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="177.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">залізо саме тримає свої ідентифікатори</tspan><tspan x="330.0" dy="18.2">у визначеному місці</tspan></text>
<rect x="680.0" y="140.0" width="540.0" height="84.0" rx="6" fill="#fff4e0" stroke="#333333" stroke-width="1.5"/><text x="950.0" y="177.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">залізо не має що відповісти:</tspan><tspan x="950.0" dy="18.2">є лише адреса й припаяні дроти</tspan></text>
<line x1="330.0" y1="224.0" x2="330.0" y2="248.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="950.0" y1="224.0" x2="950.0" y2="248.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="250.0" width="540.0" height="84.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="287.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">шина обходить позиції й читає їх:</tspan><tspan x="330.0" dy="18.2">виробник, продукт, клас</tspan></text>
<rect x="680.0" y="250.0" width="540.0" height="84.0" rx="6" fill="#fff4e0" stroke="#333333" stroke-width="1.5"/><text x="950.0" y="287.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">хтось ззовні створює ЗАПИС:</tspan><tspan x="950.0" dy="18.2">ім'я, адреси регістрів, номер лінії</tspan></text>
<line x1="330.0" y1="334.0" x2="330.0" y2="358.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="950.0" y1="334.0" x2="950.0" y2="358.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="360.0" width="540.0" height="84.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="397.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">збіг — порівняння прочитаних чисел</tspan><tspan x="330.0" dy="18.2">із таблицею драйвера</tspan></text>
<rect x="680.0" y="360.0" width="540.0" height="84.0" rx="6" fill="#fff4e0" stroke="#333333" stroke-width="1.5"/><text x="950.0" y="397.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">збіг — порівняння рядка із запису</tspan><tspan x="950.0" dy="18.2">із таблицею драйвера</tspan></text>
<rect x="330.0" y="500.0" width="620.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="640.0" y="537.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">далі — та сама дорога: probe(), sysfs, живлення, вивантаження</tspan></text>
<line x1="330.0" y1="444.0" x2="520.0" y2="498.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="950.0" y1="444.0" x2="760.0" y2="498.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>