<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1330 660" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1330" height="660" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поверхня дослідів: де в /sys видно кожен крок</text>
<rect x="60.0" y="70.0" width="470.0" height="50.0" rx="6" fill="#fff4e0" stroke="#c0392b" stroke-width="2.0"/><text x="295.0" y="100.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">ЗАПИС ПРО ПРИСТРІЙ</tspan></text>
<rect x="790.0" y="70.0" width="470.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="1025.0" y="100.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1025.0" dy="0.0">ДРАЙВЕР</tspan></text>
<rect x="60.0" y="128.0" width="470.0" height="44.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="295.0" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">/sys/bus/platform/devices/myuart.0/</tspan></text>
<rect x="790.0" y="128.0" width="470.0" height="44.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="1025.0" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1025.0" dy="0.0">/sys/bus/platform/drivers/myuart/</tspan></text>
<rect x="60.0" y="186.0" width="470.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="217.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">modalias — рядок, за яким udev шукає модуль</tspan></text>
<rect x="790.0" y="186.0" width="470.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1025.0" y="217.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1025.0" dy="0.0">unbind — вписати ім'я: зняти прив'язку</tspan></text>
<rect x="60.0" y="248.0" width="470.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="279.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">driver_override — «тільки цей драйвер»</tspan></text>
<rect x="790.0" y="248.0" width="470.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1025.0" y="279.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1025.0" dy="0.0">bind — вписати те саме ім'я: покликати probe()</tspan></text>
<rect x="60.0" y="310.0" width="470.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="341.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">driver → посилання на прив'язаний драйвер</tspan></text>
<rect x="790.0" y="310.0" width="470.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1025.0" y="341.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1025.0" dy="0.0">myuart.0 → посилання на прив'язаний пристрій</tspan></text>
<rect x="60.0" y="372.0" width="470.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="403.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">power/ — місце в порядку засинання</tspan></text>
<rect x="790.0" y="372.0" width="470.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1025.0" y="403.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1025.0" dy="0.0">uevent — перевидати подію для udev</tspan></text>
<text x="660.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">прив'язка —</tspan><tspan x="660.0" dy="18.2">пара посилань</tspan></text>
<line x1="540.0" y1="330.0" x2="780.0" y2="330.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="780.0" y1="366.0" x2="540.0" y2="366.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="452.0" width="1200.0" height="62.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="660.0" y="487.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">нема запису в devices/ → біда в описі  ·  запис є, посилань нема → не зійшовся compatible або ім'я</tspan></text>
<rect x="60.0" y="538.0" width="1200.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="660.0" y="572.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">/sys/kernel/debug/devices_deferred — сюди потрапляє той, чий probe() повернув -EPROBE_DEFER:</tspan><tspan x="660.0" dy="18.2">пристрій живий, драйвер знайдено, спробу відкладено до появи того, чого бракує</tspan></text>
</svg>