<text x="700.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура PCI Capabilities у Virtio 1.0+</text>
<text x="700.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">КОНФІГУРАЦІЙНИЙ ПРОСТІР PCI ТА VIRTIO CAPABILITIES</text>
