<rect x="770.0" y="430.0" width="370.0" height="85.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.5"/><text x="955.0" y="454.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="955.0" dy="0.0">virq 65 (Accelerometer INT)</tspan><tspan x="955.0" dy="14.3">irq_data -&gt; hwirq=1, chip=gpio_chip</tspan><tspan x="955.0" dy="14.3">handler = handle_edge_irq</tspan><tspan x="955.0" dy="14.3">action -&gt; mpu6050_isr()</tspan></text>
<rect x="770.0" y="530.0" width="370.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="955.0" y="567.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="955.0" dy="0.0">virq 128.. (NVMe MSI-X)</tspan><tspan x="955.0" dy="14.3">irq_data -&gt; hwirq=0x10, chip=pci_msi_chip</tspan><tspan x="955.0" dy="14.3">handler = handle_edge_irq</tspan><tspan x="955.0" dy="14.3">action -&gt; nvme_irq()</tspan></text>
