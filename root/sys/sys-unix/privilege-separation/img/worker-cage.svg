<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 706.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="706.1" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шари обмежень довкола непривілейованої частини</text>
<text x="600.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">робітник після скидання прав: що забирає кожен шар</text>
<rect x="60.0" y="92.0" width="1090.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="605.0" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">власний ідентифікатор, яким більше ніхто не користується  —  немає сусідніх процесів і файлів того ж користувача, до яких можна дістатися</tspan></text>
<rect x="60.0" y="192.0" width="1090.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="605.0" y="234.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">порожній корінь або власний простір монтувань  —  не лишається жодного імені, яке робітник міг би відкрити</tspan></text>
<rect x="60.0" y="292.0" width="1090.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="605.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">скинуті можливості разом з обмежувальним набором  —  підвищення неможливе навіть через запуск чужого файлу з бітом setuid</tspan></text>
<rect x="60.0" y="392.0" width="1090.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="605.0" y="434.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">фільтр seccomp  —  з усього переліку системних викликів лишаються читання, запис, вихід і повернення із сигналу</tspan></text>
<line x1="605.0" y1="468.0" x2="605.0" y2="518.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="165.0" y="557.0" width="880.0" height="34.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="605.0" y="578.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">лишається рівно одне вміння: читати й писати канал до монітора</tspan></text>
<rect x="165.0" y="633.9" width="880.0" height="52.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="605.0" y="655.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">тому межа можливостей нападника дорівнює не «правам робітника»,</tspan><tspan x="605.0" dy="18.2">а тому, на що монітор погоджується відповідати</tspan></text>
</svg>