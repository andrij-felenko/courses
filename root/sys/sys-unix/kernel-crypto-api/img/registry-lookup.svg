<rect x="162.1" y="281.5" width="75.9" height="37.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="304.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">fscrypt</tspan></text>
<rect x="121.3" y="396.5" width="157.4" height="37.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="419.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">AF_ALG із програми</tspan></text>
<rect x="468.2" y="267.9" width="153.5" height="64.2" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="545.0" y="295.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="545.0" dy="0.0">ім'я алгоритму</tspan><tspan x="545.0" dy="18.2">«xts(aes)»</tspan></text>
