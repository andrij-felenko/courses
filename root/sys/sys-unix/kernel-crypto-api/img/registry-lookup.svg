<rect x="760.0" y="157.1" width="280.0" height="55.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.4"/><text x="900.0" y="181.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">xts-aes-aesni</tspan><tspan x="900.0" dy="16.9">пріоритет 401</tspan></text>
<rect x="760.0" y="272.1" width="280.0" height="55.9" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.4"/><text x="900.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">xts-aes-ce (ARM)</tspan><tspan x="900.0" dy="16.9">модуля тут немає</tspan></text>
<rect x="760.0" y="387.1" width="280.0" height="55.9" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.4"/><text x="900.0" y="411.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">xts(ecb(aes-generic))</tspan><tspan x="900.0" dy="16.9">пріоритет 100</tspan></text>
<line x1="621.8" y1="300.0" x2="755.0" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1212.8" y="156.1" width="124.3" height="57.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1275.0" y="181.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1275.0" dy="0.0">обрано</tspan><tspan x="1275.0" dy="16.9">xts-aes-aesni</tspan></text>
<line x1="1040.0" y1="185.0" x2="1206.8" y2="185.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="710.0" y="545.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Споживач називає лише узагальнене ім'я. Під цим іменем у реєстрі стоїть кілька реалізацій —</text>
<text x="710.0" y="573.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">переносна на C, векторна на інструкціях процесора, апаратний рушій. Виграє найвищий пріоритет.</text>
<text x="710.0" y="615.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">Модуль не завантажився — вибір мовчки падає на наступну реалізацію, і це видно лише в /proc/crypto.</text>
</svg>