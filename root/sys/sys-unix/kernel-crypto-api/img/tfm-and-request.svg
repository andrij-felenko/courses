<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1430 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1430" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="710.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перетворення тримає ключ, запит несе дані</text>
<rect x="141.4" y="252.2" width="217.2" height="95.7" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="279.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">tfm — перетворення</tspan><tspan x="250.0" dy="16.9">алгоритм обрано за іменем</tspan><tspan x="250.0" dy="16.9">ключ розгорнуто (setkey)</tspan><tspan x="250.0" dy="16.9">живе довго, спільний</tspan></text>
<text x="250.0" y="232.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">дороге, робиться один раз</text>
<rect x="587.7" y="252.2" width="224.7" height="95.7" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="279.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">запит — одна операція</tspan><tspan x="700.0" dy="16.9">вхід і вихід (scatterlist)</tspan><tspan x="700.0" dy="16.9">початковий вектор</tspan><tspan x="700.0" dy="16.9">колбек</tspan></text>
<text x="700.0" y="232.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">дешеве, робиться щоразу</text>
<line x1="358.6" y1="300.0" x2="581.7" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1080.8" y="136.1" width="198.4" height="57.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1180.0" y="161.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1180.0" dy="0.0">повертає 0</tspan><tspan x="1180.0" dy="16.9">шифротекст уже на місці</tspan></text>
<text x="1180.0" y="114.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">переносна або векторна реалізація</text>
<rect x="1066.0" y="416.1" width="228.1" height="57.9" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="1180.0" y="441.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1180.0" dy="0.0">повертає −EINPROGRESS</tspan><tspan x="1180.0" dy="16.9">колбек прийде з переривання</tspan></text>
<text x="1180.0" y="499.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">рушій у залізі</text>
<line x1="812.3" y1="285.0" x2="1074.8" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="812.3" y1="315.0" x2="1060.0" y2="435.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="710.0" y="575.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Один tfm обслуговує тисячі запитів: ключ і вибір реалізації в нього вже вкладені.</text>
<text x="710.0" y="605.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle">Два можливі повернення — саме тому операція описана окремим об'єктом із колбеком.</text>
</svg>