<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 711.92" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="711.92" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кожне слово рядка перевіряють за списком правил, і перше влучання вирішує його долю</text>
<rect x="80.0" y="50.0" width="1140.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="650.0" y="82.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">root=UUID=6f1c… ro quiet console=ttyS0,115200 i915.enable_psr=0 systemd.unit=rescue.target -- verbose</tspan></text>
<rect x="500.0" y="150.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="650.0" y="171.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">ядро ріже рядок на слова</tspan><tspan x="650.0" dy="16.9">(лапки шануються)</tspan></text>
<line x1="650.0" y1="110.0" x2="650.0" y2="146.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="240.0" width="430.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="295.0" y="276.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">слово стоїть після «--»</tspan></text>
<rect x="620.0" y="240.0" width="560.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="900.0" y="268.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">потрапляє в argv першого процесу;</tspan><tspan x="900.0" dy="16.9">ядро його навіть не розглядає</tspan></text>
<line x1="514.0" y1="272.0" x2="616.0" y2="272.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="330.0" width="430.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="295.0" y="366.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">у ключі є крапка: modname.param=…</tspan></text>
<rect x="620.0" y="330.0" width="560.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="900.0" y="358.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">параметр модуля: вбудованому — одразу,</tspan><tspan x="900.0" dy="16.9">завантажному — коли той завантажиться</tspan></text>
<line x1="514.0" y1="362.0" x2="616.0" y2="362.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="420.0" width="430.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="295.0" y="456.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">ключ зареєстровано через early_param()</tspan></text>
<rect x="620.0" y="420.0" width="560.0" height="64.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="900.0" y="448.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">обробник працює ще до підняття пам'яті:</tspan><tspan x="900.0" dy="16.9">earlycon, memmap</tspan></text>
<line x1="514.0" y1="452.0" x2="616.0" y2="452.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="510.0" width="430.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="295.0" y="546.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">ключ зареєстровано через __setup()</tspan></text>
<rect x="620.0" y="510.0" width="560.0" height="64.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="900.0" y="538.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">звичайний обробник підсистеми:</tspan><tspan x="900.0" dy="16.9">root=, init=, quiet</tspan></text>
<line x1="514.0" y1="542.0" x2="616.0" y2="542.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="600.0" width="430.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="295.0" y="636.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">ключа не впізнав ніхто</tspan></text>
<rect x="620.0" y="600.0" width="560.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="900.0" y="628.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">є «=» — в оточення init;</tspan><tspan x="900.0" dy="16.9">немає «=» — у його argv</tspan></text>
<line x1="514.0" y1="632.0" x2="616.0" y2="632.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="650.0" y1="202.0" x2="300.0" y2="236.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="295.0" y1="306.0" x2="295.0" y2="326.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="295.0" y1="396.0" x2="295.0" y2="416.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="295.0" y1="486.0" x2="295.0" y2="506.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="295.0" y1="576.0" x2="295.0" y2="596.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="650.0" y="690.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">порядок перевірки саме такий — тому «--» вимикає всі правила, що нижче</text>
</svg>