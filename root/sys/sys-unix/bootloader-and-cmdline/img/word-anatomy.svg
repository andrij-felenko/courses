<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1370 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1370" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="680.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межі всередині слова: перший «=», крапка, лапки й самотнє «--»</text>
<rect x="70.0" y="92.0" width="63.2" height="52.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="101.6" y="123.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="101.6" dy="0.0">root</tspan></text>
<text x="101.6" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ключ</text>
<rect x="139.2" y="92.0" width="36.0" height="52.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="157.2" y="123.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="157.2" dy="0.0">=</tspan></text>
<text x="157.2" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">перший «=»</text>
<rect x="181.2" y="92.0" width="119.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="240.7" y="123.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.7" dy="0.0">UUID=6f1c…</tspan></text>
<text x="240.7" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">значення</text>
<rect x="430.0" y="87.0" width="860.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="860.0" y="114.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Ключ — усе до ПЕРШОГО «=». Другий «=» стоїть уже всередині значення</tspan><tspan x="860.0" dy="16.9">й нічого не ділить: тут ключ — root, значення — увесь рядок UUID=6f1c…</tspan></text>
<rect x="70.0" y="222.0" width="63.2" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="101.6" y="253.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="101.6" dy="0.0">i915</tspan></text>
<text x="101.6" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">модуль</text>
<rect x="139.2" y="222.0" width="36.0" height="52.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="157.2" y="253.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="157.2" dy="0.0">.</tspan></text>
<text x="157.2" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">крапка</text>
<rect x="181.2" y="222.0" width="119.0" height="52.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="240.7" y="253.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.7" dy="0.0">enable_psr</tspan></text>
<text x="240.7" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">параметр</text>
<rect x="306.2" y="222.0" width="36.0" height="52.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="324.2" y="253.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="324.2" dy="0.0">=</tspan></text>
<rect x="348.2" y="222.0" width="36.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="366.2" y="253.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="366.2" dy="0.0">0</tspan></text>
<text x="366.2" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">значення</text>
<rect x="430.0" y="217.0" width="860.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="860.0" y="244.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Крапка віддає слово модулю. В іменах «-» і «_» рівнозначні</tspan><tspan x="860.0" dy="16.9">(enable-psr — те саме), у значеннях — уже ні.</tspan></text>
<rect x="70.0" y="352.0" width="81.8" height="52.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="110.9" y="383.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.9" dy="0.0">dyndbg</tspan></text>
<text x="110.9" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ключ</text>
<rect x="157.8" y="352.0" width="36.0" height="52.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="175.8" y="383.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.8" dy="0.0">=</tspan></text>
<rect x="199.8" y="352.0" width="165.5" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="282.6" y="383.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="282.6" dy="0.0">&quot;file svc.c +p&quot;</tspan></text>
<text x="282.6" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">значення в лапках</text>
<rect x="430.0" y="347.0" width="860.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="860.0" y="374.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Усередині лапок пробіл слово не ріже. Крайні лапки знімають,</tspan><tspan x="860.0" dy="16.9">внутрішню лапку екранувати нічим — такої можливості просто немає.</tspan></text>
<rect x="70.0" y="482.0" width="44.6" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="92.3" y="513.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="92.3" dy="0.0">--</tspan></text>
<text x="92.3" y="556.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">не параметр</text>
<rect x="430.0" y="477.0" width="860.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="860.0" y="504.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Самотнє «--» обриває розбір: усе далі ядро не розглядає взагалі</tspan><tspan x="860.0" dy="16.9">й віддає першому процесу як його власні аргументи.</tspan></text>
<text x="680.0" y="580.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">роздільник слів — пробіл; усе інше вирішує вже обробник ключа</text>
</svg>