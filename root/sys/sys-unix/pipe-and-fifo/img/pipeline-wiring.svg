<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як оболонка зшиває ls | wc -l</text>
<rect x="30.0" y="26.0" width="920.0" height="46.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="490.0" y="45.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">pipe(fd) створює один об'єкт із двома кінцями; після двох fork на кожен кінець існує по три дескриптори —</tspan><tspan x="490.0" dy="16.9">по одному в оболонці та в кожній дитині</tspan></text>
<rect x="30.0" y="92.0" width="176.0" height="42.0" rx="6" fill="#f7f3e8" stroke="#333333" stroke-width="1.5"/><text x="118.0" y="117.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="118.0" dy="0.0">процес</tspan></text>
<rect x="218.0" y="92.0" width="340.0" height="42.0" rx="6" fill="#f7f3e8" stroke="#333333" stroke-width="1.5"/><text x="388.0" y="117.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="388.0" dy="0.0">що ставить на місце стандартного потоку</tspan></text>
<rect x="570.0" y="92.0" width="380.0" height="42.0" rx="6" fill="#f7f3e8" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="117.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">які копії закриває</tspan></text>
<rect x="30.0" y="146.0" width="176.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="118.0" y="178.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="118.0" dy="0.0">ls</tspan></text>
<rect x="218.0" y="146.0" width="340.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="388.0" y="170.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="388.0" dy="0.0">dup2(fd[1], 1)</tspan><tspan x="388.0" dy="15.6">вивід іде в канал</tspan></text>
<rect x="570.0" y="146.0" width="380.0" height="56.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="178.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">fd[0] і fd[1] — обидві успадковані копії</tspan></text>
<rect x="30.0" y="212.0" width="176.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="118.0" y="244.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="118.0" dy="0.0">wc -l</tspan></text>
<rect x="218.0" y="212.0" width="340.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="388.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="388.0" dy="0.0">dup2(fd[0], 0)</tspan><tspan x="388.0" dy="15.6">ввід іде з каналу</tspan></text>
<rect x="570.0" y="212.0" width="380.0" height="56.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">fd[0] і fd[1] — обидві успадковані копії</tspan></text>
<rect x="30.0" y="278.0" width="176.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="118.0" y="310.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="118.0" dy="0.0">оболонка</tspan></text>
<rect x="218.0" y="278.0" width="340.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="388.0" y="310.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="388.0" dy="0.0">нічого не читає й не пише</tspan></text>
<rect x="570.0" y="278.0" width="380.0" height="56.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="760.0" y="302.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">fd[0] і fd[1] — інакше кінців на запис</tspan><tspan x="760.0" dy="15.6">лишиться один назавжди</tspan></text>
<rect x="30.0" y="344.0" width="920.0" height="46.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="490.0" y="371.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">жодна з двох програм не змінена й не знає про канал: обидві просто працюють із дескрипторами 0 і 1</tspan></text>
</svg>