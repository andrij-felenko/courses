<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 770" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="770" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Новий образ: відображення з файлу й розкладений стек</text>
<text x="520.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що є в новому образі на момент першої інструкції</text>
<rect x="60.0" y="96.0" width="280.0" height="470.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="200.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">виконуваний файл ELF</text>
<rect x="76.0" y="146.0" width="248.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#c8ced6" stroke-width="1.2"/><text x="200.0" y="181.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">заголовки програми</tspan></text>
<rect x="76.0" y="220.0" width="248.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#c8ced6" stroke-width="1.2"/><text x="200.0" y="247.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">ім'я інтерпретатора</tspan><tspan x="200.0" dy="16.2">(сегмент PT_INTERP)</tspan></text>
<rect x="76.0" y="320.0" width="248.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#c8ced6" stroke-width="1.2"/><text x="200.0" y="355.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">сегмент коду</tspan></text>
<rect x="76.0" y="396.0" width="248.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#c8ced6" stroke-width="1.2"/><text x="200.0" y="431.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">сегмент даних</tspan></text>
<rect x="76.0" y="462.0" width="248.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#c8ced6" stroke-width="1.2"/><text x="200.0" y="489.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">розмір неініціалізованих</tspan><tspan x="200.0" dy="16.2">даних — самих даних немає</tspan></text>
<text x="810.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">адресний простір процесу</text>
<text x="810.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">вершина простору</text>
<rect x="640.0" y="120.0" width="340.0" height="84.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="810.0" y="150.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">стек:  рядки argv і envp,</tspan><tspan x="810.0" dy="16.2">масиви покажчиків,</tspan><tspan x="810.0" dy="16.2">допоміжний вектор</tspan></text>
<rect x="640.0" y="216.0" width="340.0" height="76.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="242.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">динамічний завантажувач —</tspan><tspan x="810.0" dy="16.2">відображено з файлу</tspan><tspan x="810.0" dy="16.2">інтерпретатора</tspan></text>
<rect x="640.0" y="304.0" width="340.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="810.0" y="329.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">спільні бібліотеки:</tspan><tspan x="810.0" dy="16.2">ще нічого не відображено</tspan></text>
<rect x="640.0" y="374.0" width="340.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="810.0" y="399.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">купа: brk на початку,</tspan><tspan x="810.0" dy="16.2">жодної сторінки</tspan></text>
<rect x="640.0" y="444.0" width="340.0" height="58.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="810.0" y="469.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">дані — відображено з файлу,</tspan><tspan x="810.0" dy="16.2">запис дозволено</tspan></text>
<rect x="640.0" y="514.0" width="340.0" height="58.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="810.0" y="539.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">код — відображено з файлу,</tspan><tspan x="810.0" dy="16.2">читання й виконання</tspan></text>
<text x="810.0" y="592.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">низ простору</text>
<line x1="350.0" y1="251.0" x2="630.0" y2="254.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="350.0" y1="351.0" x2="630.0" y2="543.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="350.0" y1="427.0" x2="630.0" y2="473.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="374.0" y="108.0" width="240.0" height="96.0" rx="6" fill="#ffffff" stroke="#c8ced6" stroke-width="1.2"/><text x="494.0" y="144.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="494.0" dy="0.0">стрілка = створено запис</tspan><tspan x="494.0" dy="16.2">«ці адреси відповідають</tspan><tspan x="494.0" dy="16.2">цьому шматкові файлу»</tspan></text>
<rect x="60.0" y="626.0" width="920.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="520.0" y="661.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">З диска на цю мить не прочитано ЖОДНОГО байта коду: створено лише відображення.</tspan><tspan x="520.0" dy="17.6">Перша інструкція нової програми викличе сторінковий збій, і аж він підніме одну сторінку.</tspan><tspan x="520.0" dy="17.6">Тому програма на сто мегабайтів стартує швидко — на старті читають одиниці сторінок.</tspan></text>
</svg>