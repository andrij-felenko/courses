<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правовий режим коду — і що з нього виростало</text>
<rect x="30.0" y="62.0" width="180.0" height="108.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="103.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">1969–1983</tspan><tspan x="120.0" dy="16.9">мирова угода</tspan><tspan x="120.0" dy="16.9">1956 року</tspan></text>
<rect x="232.0" y="62.0" width="352.0" height="108.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="408.0" y="103.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="408.0" dy="0.0">AT&amp;T не має права продавати Unix.</tspan><tspan x="408.0" dy="16.9">Ліцензія університетам — за вартість</tspan><tspan x="408.0" dy="16.9">стрічки, разом із вихідним кодом.</tspan></text>
<line x1="596.0" y1="116.0" x2="640.0" y2="116.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="652.0" y="62.0" width="258.0" height="108.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="781.0" y="103.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="781.0" dy="0.0">BSD, коментар Лайонса,</tspan><tspan x="781.0" dy="16.9">покоління, навчене</tspan><tspan x="781.0" dy="16.9">на справжньому коді</tspan></text>
<rect x="30.0" y="196.0" width="180.0" height="108.0" rx="6" fill="#fdf1ec" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="237.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">1984–1991</tspan><tspan x="120.0" dy="16.9">після розпаду</tspan><tspan x="120.0" dy="16.9">Bell System</tspan></text>
<rect x="232.0" y="196.0" width="352.0" height="108.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="408.0" y="237.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="408.0" dy="0.0">Код стає товаром: ліцензія System V</tspan><tspan x="408.0" dy="16.9">коштує тисячі доларів; вивчати код</tspan><tspan x="408.0" dy="16.9">на курсах заборонено ще з 1979-го.</tspan></text>
<line x1="596.0" y1="250.0" x2="640.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="652.0" y="196.0" width="258.0" height="108.0" rx="6" fill="#fdf1ec" stroke="#333333" stroke-width="1.5"/><text x="781.0" y="237.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="781.0" dy="0.0">Власні Unix виробників;</tspan><tspan x="781.0" dy="16.9">POSIX як опис поведінки</tspan><tspan x="781.0" dy="16.9">замість спільного коду</tspan></text>
<rect x="30.0" y="330.0" width="180.0" height="108.0" rx="6" fill="#eaf1ea" stroke="#333333" stroke-width="1.5"/><text x="120.0" y="371.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">1991–1994</tspan><tspan x="120.0" dy="16.9">нові вільні</tspan><tspan x="120.0" dy="16.9">режими</tspan></text>
<rect x="232.0" y="330.0" width="352.0" height="108.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="408.0" y="371.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="408.0" dy="0.0">Linux виходить під GPL (1992);</tspan><tspan x="408.0" dy="16.9">позов USL завершується мировою,</tspan><tspan x="408.0" dy="16.9">з'являється 4.4BSD-Lite (1994).</tspan></text>
<line x1="596.0" y1="384.0" x2="640.0" y2="384.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="652.0" y="330.0" width="258.0" height="108.0" rx="6" fill="#eaf1ea" stroke="#333333" stroke-width="1.5"/><text x="781.0" y="371.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="781.0" dy="0.0">Два вільні родоводи,</tspan><tspan x="781.0" dy="16.9">що ростуть далі</tspan><tspan x="781.0" dy="16.9">паралельно</tspan></text>
</svg>