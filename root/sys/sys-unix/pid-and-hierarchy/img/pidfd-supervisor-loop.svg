<text x="540.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">обробника сигналу немає взагалі: смерть дитини — така сама подія, як байти з сокета</text>
