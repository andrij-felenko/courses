<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наглядач на pidfd: усе в одному циклі подій</text>
<rect x="30.0" y="90.0" width="250.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="121.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">керівний сокет</tspan><tspan x="155.0" dy="18.2">AF_UNIX SOCK_DGRAM</tspan></text>
<rect x="30.0" y="210.0" width="250.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="241.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">pidfd дитини</tspan><tspan x="155.0" dy="18.2">CLONE_PIDFD</tspan></text>
<rect x="30.0" y="330.0" width="250.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="361.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">дедлайн зупинки</tspan><tspan x="155.0" dy="18.2">(timeout epoll_wait)</tspan></text>
<rect x="380.0" y="185.0" width="270.0" height="110.0" rx="6" fill="#e6edf7" stroke="#333333" stroke-width="1.5"/><text x="515.0" y="235.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="515.0" dy="0.0">epoll_wait()</tspan><tspan x="515.0" dy="19.5">одна черга на все</tspan></text>
<rect x="730.0" y="90.0" width="320.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="890.0" y="121.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">команда «stop»</tspan><tspan x="890.0" dy="18.2">pidfd_send_signal(SIGTERM)</tspan></text>
<rect x="730.0" y="210.0" width="320.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="890.0" y="241.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">EPOLLIN: дитина — зомбі</tspan><tspan x="890.0" dy="18.2">waitid(P_PIDFD) → код виходу</tspan></text>
<rect x="730.0" y="330.0" width="320.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="890.0" y="361.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">час вийшов</tspan><tspan x="890.0" dy="18.2">pidfd_send_signal(SIGKILL)</tspan></text>
