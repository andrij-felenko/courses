<text x="700.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">вийшла сама під час пільги: EPOLLIN → waitid(P_PIDFD)</text>
<text x="560.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">SIGKILL не можна проігнорувати — але дитина в стані D піде лише тоді, коли ядро її відпустить</text>
