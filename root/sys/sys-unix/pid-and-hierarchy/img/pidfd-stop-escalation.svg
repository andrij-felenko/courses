<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зупинка щаблями: два дедлайни й одна подія на вихід</text>
<rect x="82.6" y="163.0" width="54.7" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="184.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">ЖИВЕ</tspan></text>
<rect x="342.1" y="153.9" width="115.8" height="52.2" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/><text x="400.0" y="175.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">ЗУПИНЯЄМО</tspan><tspan x="400.0" dy="18.2">дедлайн +5 с</tspan></text>
<rect x="662.1" y="153.9" width="115.8" height="52.2" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="175.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">ДОБИВАЄМО</tspan><tspan x="720.0" dy="18.2">дедлайн +2 с</tspan></text>
<rect x="955.3" y="163.0" width="89.4" height="34.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="1000.0" y="184.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1000.0" dy="0.0">ПРИБРАНО</tspan></text>
