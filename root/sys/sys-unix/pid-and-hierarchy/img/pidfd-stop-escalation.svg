<text x="240.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">команда «stop»</tspan><tspan x="240.0" dy="15.6">pidfd_send_signal(SIGTERM)</tspan></text>
<text x="560.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">дедлайн вичерпано</tspan><tspan x="560.0" dy="15.6">pidfd_send_signal(SIGKILL)</tspan></text>
<text x="866.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="866.0" dy="0.0">EPOLLIN</tspan><tspan x="866.0" dy="15.6">waitid(P_PIDFD)</tspan></text>
<line x1="400.0" y1="205.0" x2="400.0" y2="290.0" stroke="#27ae60" stroke-width="1.6" stroke-dasharray="7 5"/>
