<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1280 750" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1280" height="750" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="635.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одне спрацювання, два способи дізнатися про нього</text>
<rect x="40.0" y="78.0" width="250.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="165.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">апаратний таймер</tspan><tspan x="165.0" dy="16.2">ядра процесора</tspan></text>
<rect x="330.0" y="78.0" width="280.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="470.0" y="111.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">черга hrtimer:</tspan><tspan x="470.0" dy="16.2">дедлайни, відсортовані</tspan><tspan x="470.0" dy="16.2">за абсолютним часом</tspan></text>
<rect x="650.0" y="78.0" width="250.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="775.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">переривання:</tspan><tspan x="775.0" dy="16.2">найближчий дедлайн настав</tspan></text>
<rect x="940.0" y="78.0" width="290.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="1085.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1085.0" dy="0.0">ядро знімає з черги все,</tspan><tspan x="1085.0" dy="16.2">чому час уже настав</tspan></text>
<line x1="290.0" y1="123.0" x2="330.0" y2="123.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="610.0" y1="123.0" x2="650.0" y2="123.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="900.0" y1="123.0" x2="940.0" y2="123.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1085.0" y1="168.0" x2="1085.0" y2="202.0" stroke="#6b7280" stroke-width="1.8"/>
<line x1="340.0" y1="202.0" x2="1085.0" y2="202.0" stroke="#6b7280" stroke-width="1.8"/>
<line x1="340.0" y1="202.0" x2="340.0" y2="244.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="930.0" y1="202.0" x2="930.0" y2="244.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="115.0" y="248.0" width="450.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="340.0" y="283.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">ШЛЯХ СИГНАЛУ</tspan><tspan x="340.0" dy="16.2">ядро породжує сигнал для процесу</tspan></text>
<rect x="705.0" y="248.0" width="450.0" height="78.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="930.0" y="283.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">ШЛЯХ ДЕСКРИПТОРА</tspan><tspan x="930.0" dy="16.2">лічильник спрацювань у timerfd += 1</tspan></text>
<line x1="340.0" y1="326.0" x2="340.0" y2="344.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="930.0" y1="326.0" x2="930.0" y2="344.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="115.0" y="344.0" width="450.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="340.0" y="379.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">біт лягає в набір очікуваних</tspan><tspan x="340.0" dy="16.2">(другий такий самий зіллється з ним)</tspan></text>
<rect x="705.0" y="344.0" width="450.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="930.0" y="387.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">дескриптор стає готовим на читання</tspan></text>
<line x1="340.0" y1="422.0" x2="340.0" y2="440.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="930.0" y1="422.0" x2="930.0" y2="440.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="115.0" y="440.0" width="450.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="340.0" y="475.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">доправлення — лише на межі</tspan><tspan x="340.0" dy="16.2">повернення в простір користувача</tspan></text>
<rect x="705.0" y="440.0" width="450.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="930.0" y="475.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">epoll будить той потік,</tspan><tspan x="930.0" dy="16.2">який сам ліг на нього спати</tspan></text>
<line x1="340.0" y1="518.0" x2="340.0" y2="536.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="930.0" y1="518.0" x2="930.0" y2="536.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="115.0" y="536.0" width="450.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="340.0" y="571.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">обробник у довільному потоці</tspan><tspan x="340.0" dy="16.2">посеред довільної інструкції</tspan></text>
<rect x="705.0" y="536.0" width="450.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="930.0" y="571.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">read() віддає число спрацювань</tspan><tspan x="930.0" dy="16.2">у звичайному місці коду</tspan></text>
<rect x="115.0" y="632.0" width="1040.0" height="76.0" rx="8" fill="#fbfcff" stroke="#6b7280" stroke-width="1.6"/>
<text x="635.0" y="660.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Між дедлайном і вашим кодом стоять ще планувальник, вихід ядра процесора з глибокого сну</tspan><tspan x="635.0" dy="16.2">й навмисне склеювання близьких спрацювань (timer slack). Тому таймер обіцяє «не раніше»,</tspan><tspan x="635.0" dy="16.2">а не «точно тоді»: запізнення нормоване, випередження неможливе.</tspan></text>
</svg>