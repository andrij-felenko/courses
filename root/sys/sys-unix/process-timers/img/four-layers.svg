<rect x="40.0" y="448.0" width="1250.0" height="62.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="665.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Три перші рядки сповіщають сигналом — з усіма його обмеженнями: одна новина без подробиць,</tspan><tspan x="665.0" dy="16.2">у довільному потоці, посеред довільної інструкції. Четвертий робить час звичайною подією дескриптора.</tspan></text>
