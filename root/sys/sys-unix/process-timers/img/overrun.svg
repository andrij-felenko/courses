<rect x="60.0" y="268.0" width="520.0" height="104.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="320.0" y="308.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">ШЛЯХ СИГНАЛУ</tspan><tspan x="320.0" dy="16.2">у черзі чекає один-єдиний сигнал;</tspan><tspan x="320.0" dy="16.2">що сталося ще тричі, скаже timer_getoverrun() → 3</tspan></text>
<rect x="620.0" y="268.0" width="520.0" height="104.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="880.0" y="308.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">ШЛЯХ ДЕСКРИПТОРА</tspan><tspan x="880.0" dy="16.2">read() віддає 4 — стільки спрацювань</tspan><tspan x="880.0" dy="16.2">набігло від минулого читання</tspan></text>
<rect x="60.0" y="400.0" width="1080.0" height="76.0" rx="8" fill="#fbfcff" stroke="#6b7280" stroke-width="1.6"/>
<text x="600.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Жоден зі шляхів не намагається надолужити пропущене чергою сповіщень: ви дістаєте одне</tspan><tspan x="600.0" dy="16.2">сповіщення й число. Що робити з тими трьома — надолужувати роботу чи свідомо пропустити —</tspan><tspan x="600.0" dy="16.2">вирішує програма, і ядро навмисне не вирішує це за неї.</tspan></text>
