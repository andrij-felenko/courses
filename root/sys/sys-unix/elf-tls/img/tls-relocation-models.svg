<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540" width="840" height="540">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333"/>
  </marker>
</defs>
<rect width="840" height="540" fill="#ffffff"/>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Моделі доступу до TLS та огляд релаксацій компонувальника (Linker Relaxations)</text>
<rect x="40.0" y="60.0" width="360.0" height="190.0" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
<text x="220.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#be123c" text-anchor="middle" font-weight="700">1. General Dynamic (GD)</text>
<text x="220.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9f1239" text-anchor="middle">Найуніверсальніша модель (для dlopen)</text>
<rect x="60.0" y="120.0" width="320.0" height="50.0" rx="4" fill="#ffffff" stroke="#fda4af" stroke-width="1.0"/>
<text x="220.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#881337" text-anchor="middle">lea rdi, [rip + x@tlsgd]</text>
<text x="220.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#be123c" text-anchor="middle" font-weight="700">call __tls_get_addr@PLT</text>
<text x="220.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#be123c" text-anchor="middle">Накладність: Виклик функції + 2 елементи GOT</text>
<text x="220.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#881337" text-anchor="middle" font-weight="700">Релокація: R_X86_64_TLSGD</text>
<rect x="440.0" y="60.0" width="360.0" height="190.0" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
<text x="620.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#a16207" text-anchor="middle" font-weight="700">2. Local Dynamic (LD)</text>
<text x="620.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#854d0e" text-anchor="middle">Декілька змінних в одній shared library</text>
<rect x="460.0" y="120.0" width="320.0" height="50.0" rx="4" fill="#ffffff" stroke="#fef08a" stroke-width="1.0"/>
<text x="620.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#a16207" text-anchor="middle" font-weight="700">call __tls_get_addr (1 раз для модуля)</text>
<text x="620.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#713f12" text-anchor="middle">mov eax, [rax + var@dtpoff]</text>
<text x="620.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#a16207" text-anchor="middle">Накладність: 1 виклик на модуль + розрахунок зміщення</text>
<text x="620.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#713f12" text-anchor="middle" font-weight="700">Релокація: R_X86_64_TLSLD / DTPOFF32</text>
<rect x="40.0" y="290.0" width="360.0" height="190.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="220.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700">3. Initial Exec (IE)</text>
<text x="220.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">Для змінних у бібліотеках завантажених при старті</text>
<rect x="60.0" y="350.0" width="320.0" height="50.0" rx="4" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="220.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle">mov rax, QWORD PTR fs:0</text>
<text x="220.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">add rax, QWORD PTR [rip + x@gottpoff]</text>
<text x="220.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle">Накладність: Без викликів функцій, 1 звернення до GOT</text>
<text x="220.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e3a8a" text-anchor="middle" font-weight="700">Релокація: R_X86_64_GOTTPOFF</text>
<rect x="440.0" y="290.0" width="360.0" height="190.0" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="620.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">4. Local Exec (LE)</text>
<text x="620.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle">Для змінних у головному бінарнику (Main)</text>
<rect x="460.0" y="350.0" width="320.0" height="50.0" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.0"/>
<text x="620.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">mov eax, DWORD PTR fs:-offset</text>
<text x="620.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">Накладність: Мінімальна (1 інструкція, 0 GOT, 0 call)</text>
<text x="620.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle" font-weight="700">Релокація: R_X86_64_TPOFF32</text>
<line x1="220.0" y1="250.0" x2="220.0" y2="260.0" stroke="#d97706" stroke-width="2.0"/>
<rect x="150.0" y="260.0" width="140.0" height="22.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.0"/>
<text x="220.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">Релаксація GD -&gt; IE</text>
<line x1="220.0" y1="282.0" x2="220.0" y2="290.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="360.0" y1="230.0" x2="450.0" y2="290.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="370.0" y="240.0" width="120.0" height="22.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.0"/>
<text x="430.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Релаксація GD -&gt; LE</text>
<line x1="620.0" y1="250.0" x2="620.0" y2="260.0" stroke="#16a34a" stroke-width="2.0"/>
<rect x="550.0" y="260.0" width="140.0" height="22.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.0"/>
<text x="620.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Релаксація LD -&gt; LE</text>
<line x1="620.0" y1="282.0" x2="620.0" y2="290.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="400.0" y1="385.0" x2="440.0" y2="385.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="420.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">IE -&gt; LE</text>
</svg>