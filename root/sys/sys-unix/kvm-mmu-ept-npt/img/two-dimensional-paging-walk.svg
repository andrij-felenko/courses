<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1160 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1160" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="575.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двовимірний обхід таблиць сторінок: 24 звернення до пам'яті</text>
<rect x="20.0" y="20.0" width="1110.0" height="640.0" rx="8" fill="#fafbfc" stroke="#6b7280" stroke-width="1.0"/>
<rect x="290.0" y="35.0" width="450.0" height="49.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="515.0" y="56.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">vCPU: Доступ до пам'яті за адресою GVA</tspan><tspan x="515.0" dy="16.9">CR3 гостя містить GPA таблиці PML4</tspan></text>
<rect x="40.0" y="130.4" width="200.0" height="59.2" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">1. PML4 гостя</tspan><tspan x="140.0" dy="15.6">Адреса: GPA</tspan><tspan x="140.0" dy="15.6">Повертає наступний GPA</tspan></text>
<line x1="140.0" y1="200.0" x2="140.0" y2="245.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="319.3" width="200.0" height="141.4" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="336.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">EPT трансляція GPA → HPA</tspan><tspan x="140.0" dy="14.3">4 звернення до DRAM:</tspan><tspan x="140.0" dy="14.3">• EPT PML4 (1)</tspan><tspan x="140.0" dy="14.3">• EPT PDPT (2)</tspan><tspan x="140.0" dy="14.3">• EPT PD   (3)</tspan><tspan x="140.0" dy="14.3">• EPT PT   (4)</tspan><tspan x="140.0" dy="14.3">─────────────────</tspan><tspan x="140.0" dy="14.3">+ 1 читання запису</tspan><tspan x="140.0" dy="14.3">= 5 звернень до DRAM</tspan></text>
<line x1="245.0" y1="160.0" x2="285.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="290.0" y="130.4" width="200.0" height="59.2" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">2. PDPT гостя</tspan><tspan x="390.0" dy="15.6">Адреса: GPA</tspan><tspan x="390.0" dy="15.6">Повертає наступний GPA</tspan></text>
