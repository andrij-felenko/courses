<line x1="995.0" y1="160.0" x2="1050.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="970.0" y="210.8" width="160.0" height="98.5" rx="6" fill="#f3e8fd" stroke="#333333" stroke-width="1.5"/><text x="1050.0" y="228.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">Фінальний GPA даних</tspan><tspan x="1050.0" dy="14.3">Трансляція через EPT:</tspan><tspan x="1050.0" dy="14.3">4 рівні EPT</tspan><tspan x="1050.0" dy="14.3">+ 1 доступ до байтів</tspan><tspan x="1050.0" dy="14.3">──────────────────</tspan><tspan x="1050.0" dy="14.3">= 4 звернення до EPT</tspan></text>
<rect x="100.0" y="554.6" width="950.0" height="70.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="575.0" y="577.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">Підсумок 2D Page Walk (4-рівневий гість + 4-рівневий EPT хоста):</tspan><tspan x="575.0" dy="16.9">Формула: N = (n + 1) · (m + 1) − 1 = (4 + 1) · (4 + 1) − 1 = 24 звернення до DRAM на один промах TLB!</tspan><tspan x="575.0" dy="16.9">4 кроки гостя × (4 рівні EPT + 1 читання) + 4 рівні EPT для фінальної сторінки = 4 × 5 + 4 = 24</tspan></text>
</svg>