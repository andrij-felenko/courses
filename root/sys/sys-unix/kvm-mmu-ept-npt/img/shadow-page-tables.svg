<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип роботи тіньових таблиць сторінок</text>
<rect x="30.0" y="30.0" width="1040.0" height="500.0" rx="8" fill="#fafbfc" stroke="#6b7280" stroke-width="1.0"/>
<rect x="50.0" y="55.0" width="470.0" height="450.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="285.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гостьова ОС (Емуляція / Read-Only)</text>
<rect x="560.0" y="55.0" width="490.0" height="450.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="805.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">KVM і фізичний MMU процесора</text>
<rect x="95.0" y="116.2" width="380.0" height="47.6" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="285.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Віртуальний CR3 гостя</tspan><tspan x="285.0" dy="15.6">Вказує на GPA таблиць гостя</tspan></text>
<rect x="95.0" y="228.4" width="380.0" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="285.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Гостьові таблиці сторінок (GPT)</tspan><tspan x="285.0" dy="15.6">GVA ───(відображає)───&gt; GPA</tspan><tspan x="285.0" dy="15.6">⚠️ Позначені KVM як Read-Only в SPT</tspan></text>
<line x1="285.0" y1="175.0" x2="285.0" y2="215.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="95.0" y="378.4" width="380.0" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="285.0" y="398.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Гостьовий потік пише в GPT</tspan><tspan x="285.0" dy="15.6">(наприклад, fork / mmap / alloc)</tspan><tspan x="285.0" dy="15.6">❌ Спроба запису викликає #PF / VM-exit</tspan></text>
<line x1="285.0" y1="315.0" x2="285.0" y2="360.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="605.0" y="116.2" width="400.0" height="47.6" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Фізичний регістр CR3 процесора</tspan><tspan x="805.0" dy="15.6">Вказує на HPA тіньової таблиці KVM</tspan></text>
<rect x="605.0" y="228.4" width="400.0" height="63.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Тіньова таблиця KVM (SPT)</tspan><tspan x="805.0" dy="15.6">GVA ───(пряме зшивання)───&gt; HPA</tspan><tspan x="805.0" dy="15.6">Завантажується напряму в апаратний MMU</tspan></text>
<line x1="805.0" y1="175.0" x2="805.0" y2="215.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="605.0" y="370.6" width="400.0" height="78.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="390.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Обробник перехоплення KVM (VM-exit)</tspan><tspan x="805.0" dy="15.6">1. Емулює інструкцію запису гостя</tspan><tspan x="805.0" dy="15.6">2. Синхронізує тіньовий запис SPT (GVA-&gt;HPA)</tspan><tspan x="805.0" dy="15.6">3. Повертає виконання у vCPU</tspan></text>
<line x1="485.0" y1="410.0" x2="595.0" y2="410.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="805.0" y1="350.0" x2="805.0" y2="315.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>