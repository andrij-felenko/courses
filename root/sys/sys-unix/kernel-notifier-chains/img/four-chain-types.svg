<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння чотирьох типів ланцюжків сповіщень ядра Linux</text>
<text x="620.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">ЧОТИРИ ТИПИ NOTIFIER CHAINS: МЕХАНІЗМИ СИНХРОНІЗАЦІЇ ТА ОБМЕЖЕННЯ</text>
<rect x="40.0" y="60.0" width="270.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="175.0" y="88.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">ATOMIC</tspan></text>
<rect x="40.0" y="114.0" width="270.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="175.0" y="135.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">atomic_notifier_head</tspan></text>
<rect x="40.0" y="156.0" width="270.0" height="350.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="175.0" y="304.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Замок: spinlock_t</tspan><tspan x="175.0" dy="11.7">Контекст: Атомарний (IRQ, softirq, переривання)</tspan><tspan x="175.0" dy="11.7">Сон / I/O: СУВОРО ЗАБОРОНЕНО</tspan><tspan x="175.0" dy="11.7">Алокація: Тільки GFP_ATOMIC</tspan><tspan x="175.0" dy="11.7">Ціна читача: Захоплення spinlock</tspan><tspan x="175.0" dy="11.7">Типові ланцюжки: panic_notifier_list, die_chain</tspan></text>
<rect x="330.0" y="60.0" width="270.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="465.0" y="88.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="465.0" dy="0.0">BLOCKING</tspan></text>
<rect x="330.0" y="114.0" width="270.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="465.0" y="135.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="465.0" dy="0.0">blocking_notifier_head</tspan></text>
<rect x="330.0" y="156.0" width="270.0" height="350.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="465.0" y="304.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="465.0" dy="0.0">Замок: struct rw_semaphore</tspan><tspan x="465.0" dy="11.7">Контекст: Процес (syscall, kthread, workqueue)</tspan><tspan x="465.0" dy="11.7">Сон / I/O: ДОЗВОЛЕНО (сон, м'ютекси, дисковий I/O)</tspan><tspan x="465.0" dy="11.7">Алокація: GFP_KERNEL</tspan><tspan x="465.0" dy="11.7">Ціна читача: down_read(rwsem)</tspan><tspan x="465.0" dy="11.7">Типові ланцюжки: reboot_notifier_list, pm_chain</tspan></text>
<rect x="620.0" y="60.0" width="270.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="755.0" y="88.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">RAW</tspan></text>
<rect x="620.0" y="114.0" width="270.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="755.0" y="135.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="755.0" dy="0.0">raw_notifier_head</tspan></text>
<rect x="620.0" y="156.0" width="270.0" height="350.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="755.0" y="304.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">Замок: ВІДСУТНІЙ (зовнішній замок)</tspan><tspan x="755.0" dy="11.7">Контекст: Визначається підсистемою-власником</tspan><tspan x="755.0" dy="11.7">Сон / I/O: Залежить від зовнішнього блокування</tspan><tspan x="755.0" dy="11.7">Алокація: Відповідно до контексту</tspan><tspan x="755.0" dy="11.7">Ціна читача: Нульова у ланцюжку</tspan><tspan x="755.0" dy="11.7">Типові ланцюжки: Рання ініціалізація CPU, пастки</tspan></text>
<rect x="910.0" y="60.0" width="270.0" height="48.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="1045.0" y="88.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1045.0" dy="0.0">SRCU</tspan></text>
<rect x="910.0" y="114.0" width="270.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1045.0" y="135.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1045.0" dy="0.0">srcu_notifier_head</tspan></text>
<rect x="910.0" y="156.0" width="270.0" height="350.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="1045.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="1045.0" dy="0.0">Замок: Sleepable RCU + mutex</tspan><tspan x="1045.0" dy="13.0">Контекст: Процес із паралельним читанням</tspan><tspan x="1045.0" dy="13.0">Сон / I/O: ДОЗВОЛЕНО всередині обробника</tspan><tspan x="1045.0" dy="13.0">Алокація: GFP_KERNEL</tspan><tspan x="1045.0" dy="13.0">Ціна читача: srcu_read_lock (без замків!)</tspan><tspan x="1045.0" dy="13.0">Типові ланцюжки: netdev_chain, cpu_chain</tspan></text>
<rect x="40.0" y="526.0" width="1160.0" height="64.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="620.0" y="561.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">ЗОЛОТЕ ПРАВИЛО ВИБОРУ: якщо викликач перебуває в перериванні — Atomic; якщо обробники мають спати й читаються рідко — Blocking; якщо читання надчасте й допускає сон — SRCU; якщо блокування повністю зовнішнє — Raw.</tspan></text>
</svg>