<rect x="75.0" y="356.6" width="850.0" height="66.8" rx="6" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="377.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Ядро підсистеми IIO (IIO Core Subsystem)</tspan><tspan x="500.0" dy="16.9">struct iio_dev  |  struct iio_info  |  struct iio_chan_spec</tspan><tspan x="500.0" dy="16.9">Менеджер буферів (kfifo/industrialio-buffer)  |  Тригери (IIO Triggers)  |  Подмиєвий каскад</tspan></text>
