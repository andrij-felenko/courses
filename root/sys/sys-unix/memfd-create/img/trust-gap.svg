<rect x="279.3" y="368.2" width="341.5" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="388.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">сторінки за межею файлу нема → ядро шле SIGBUS</tspan><tspan x="450.0" dy="15.6">типова дія сигналу — убити сервер, а не клієнта</tspan></text>
