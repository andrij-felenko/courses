<line x1="952.0" y1="143.0" x2="986.0" y2="143.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="300.0" width="300.0" height="72.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/><text x="220.0" y="332.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">read()</tspan><tspan x="220.0" dy="16.9">спить на черзі очікування</tspan></text>
<rect x="560.0" y="300.0" width="340.0" height="72.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/><text x="730.0" y="332.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">кільце на 64 вибірки й пакет</tspan><tspan x="730.0" dy="16.9">спін-замок</tspan></text>
<rect x="990.0" y="300.0" width="260.0" height="72.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/><text x="1120.0" y="332.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1120.0" dy="0.0">зведена статистика</tspan><tspan x="1120.0" dy="16.9">м'ютекс</tspan></text>
<line x1="800.0" y1="250.0" x2="780.0" y2="296.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1120.0" y1="250.0" x2="1120.0" y2="296.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
