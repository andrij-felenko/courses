<text x="465.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">одна вибірка на виклик</text>
<line x1="904.0" y1="336.0" x2="984.0" y2="336.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="944.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">пакет</text>
<line x1="1250.0" y1="450.0" x2="70.0" y2="450.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="660.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">розбирання — проти течії: free_irq → cancel(BH-робота) → cancel(статистика) → звільнення пам'яті</text>
