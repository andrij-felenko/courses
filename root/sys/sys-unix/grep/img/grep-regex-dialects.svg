<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="840.0" height="360.0" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="430.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#263238" text-anchor="middle" font-weight="700">Ієрархія діалектів регулярних виразів та рушіїв у grep</text>
<rect x="25.0" y="60.0" width="190.0" height="290.0" rx="6" fill="#e0f2f1" stroke="#00897b" stroke-width="1.5"/>
<text x="120.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#004d40" text-anchor="middle" font-weight="700">grep -F (Fixed)</text>
<text x="120.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Без регулярних виразів</text>
<rect x="35.0" y="120.0" width="170.0" height="55.0" rx="4" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/>
<text x="120.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#004d40" text-anchor="middle" font-weight="700">Boyer-Moore / Aho-Corasick</text>
<text x="120.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Час: O(N/M) сублінійний</text>
<rect x="35.0" y="185.0" width="170.0" height="45.0" rx="4" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/>
<text x="120.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ключовий синтаксис:</text>
<text x="120.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Точні рядки (літерали)</text>
<rect x="35.0" y="240.0" width="170.0" height="95.0" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="43.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Немає метасимволів</text>
<text x="43.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Спецсимволи як байти</text>
<text x="43.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Швидкий пошук слів</text>
<text x="43.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Низькі накладні витрати</text>
<rect x="230.0" y="60.0" width="190.0" height="290.0" rx="6" fill="#f9fbe7" stroke="#9e9d24" stroke-width="1.5"/>
<text x="325.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#827717" text-anchor="middle" font-weight="700">grep -G (BRE)</text>
<text x="325.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Базові вирази (POSIX)</text>
<rect x="240.0" y="120.0" width="170.0" height="55.0" rx="4" fill="#ffffff" stroke="#9e9d24" stroke-width="1.5"/>
<text x="325.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#827717" text-anchor="middle" font-weight="700">DFA / NFA автомат</text>
<text x="325.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Час: O(N) лінійний час</text>
<rect x="240.0" y="185.0" width="170.0" height="45.0" rx="4" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/>
<text x="325.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ключовий синтаксис:</text>
<text x="325.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">\( \)  \{m,n\}  \1  .</text>
<rect x="240.0" y="240.0" width="170.0" height="95.0" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="248.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Дужки экрануються</text>
<text x="248.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Квантифікатори з \</text>
<text x="248.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• + та ? є літералами</text>
<text x="248.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Історична сумісність</text>
<rect x="435.0" y="60.0" width="190.0" height="290.0" rx="6" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
<text x="530.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0d47a1" text-anchor="middle" font-weight="700">grep -E (ERE)</text>
<text x="530.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Розширені вирази (POSIX)</text>
<rect x="445.0" y="120.0" width="170.0" height="55.0" rx="4" fill="#ffffff" stroke="#1e88e5" stroke-width="1.5"/>
<text x="530.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0d47a1" text-anchor="middle" font-weight="700">DFA автомат (детерм.)</text>
<text x="530.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Час: O(N) гарантований</text>
<rect x="445.0" y="185.0" width="170.0" height="45.0" rx="4" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/>
<text x="530.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ключовий синтаксис:</text>
<text x="530.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">( )  {m,n}  +  ?  |</text>
<rect x="445.0" y="240.0" width="170.0" height="95.0" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="453.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Оператори без слешів</text>
<text x="453.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Альтернатива a|b</text>
<text x="453.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Один або більше +</text>
<text x="453.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Передбачуваний час</text>
<rect x="640.0" y="60.0" width="190.0" height="290.0" rx="6" fill="#fce4ec" stroke="#d81b60" stroke-width="1.5"/>
<text x="735.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#880e4f" text-anchor="middle" font-weight="700">grep -P (PCRE)</text>
<text x="735.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Perl-сумісні вирази</text>
<rect x="650.0" y="120.0" width="170.0" height="55.0" rx="4" fill="#ffffff" stroke="#d81b60" stroke-width="1.5"/>
<text x="735.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#880e4f" text-anchor="middle" font-weight="700">Backtracking VM</text>
<text x="735.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Час: O(2^N) найгірший час</text>
<rect x="650.0" y="185.0" width="170.0" height="45.0" rx="4" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/>
<text x="735.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ключовий синтаксис:</text>
<text x="735.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">(?=...)  (?&lt;=...)  \d  \s</text>
<rect x="650.0" y="240.0" width="170.0" height="95.0" rx="4" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="658.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Lookaround перевірки</text>
<text x="658.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Нежадібні квантифікатори</text>
<text x="658.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Зворотні посилання</text>
<text x="658.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Ризик ReDoS зависань</text>
</svg>