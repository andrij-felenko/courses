<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="840.0" height="320.0" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="430.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#263238" text-anchor="middle" font-weight="700">Архітектура потокового конвеєра grep: обробка блоків та фільтрація рядків</text>
<rect x="25.0" y="60.0" width="160.0" height="245.0" rx="6" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
<text x="105.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#4a148c" text-anchor="middle" font-weight="700">1. Вхідний потік</text>
<text x="105.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">stdin / файл / канал</text>
<rect x="35.0" y="125.0" width="140.0" height="165.0" rx="4" fill="#ffffff" stroke="#ce93d8" stroke-width="1.5"/>
<text x="105.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6a1b9a" text-anchor="middle" font-weight="700">read(fd, buf, 64KB)</text>
<text x="105.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Блоковий ввід</text>
<text x="105.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Неперервний потік</text>
<text x="105.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Безструктурні байти</text>
<text x="105.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Символ \n ділить</text>
<text x="105.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">потік на записи</text>
<line x1="190.0" y1="180.0" x2="225.0" y2="180.0" stroke="#8e24aa" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="230.0" y="60.0" width="200.0" height="245.0" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
<text x="330.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a237e" text-anchor="middle" font-weight="700">2. Зсувний буфер і SIMD</text>
<text x="330.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Пошук меж рядків</text>
<rect x="242.0" y="125.0" width="176.0" height="165.0" rx="4" fill="#ffffff" stroke="#9fa8da" stroke-width="1.5"/>
<text x="330.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#283593" text-anchor="middle" font-weight="700">memchr(buf, '\n', len)</text>
<text x="330.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#00695c" text-anchor="middle">AVX2 / SSE2 вектори</text>
<rect x="250.0" y="180.0" width="160.0" height="45.0" rx="3" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
<text x="330.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1b5e20" text-anchor="middle" font-weight="700">Рядок k (завершений)</text>
<text x="330.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Зсув залишку на початок</text>
<text x="330.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d84315" text-anchor="middle" font-weight="700">Zero-copy слайсинг</text>
<text x="330.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Вказівник + довжина</text>
<line x1="435.0" y1="180.0" x2="470.0" y2="180.0" stroke="#3949ab" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="475.0" y="60.0" width="180.0" height="245.0" rx="6" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
<text x="565.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e65100" text-anchor="middle" font-weight="700">3. Рушій зіставлення</text>
<text x="565.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Перевірка критерію</text>
<rect x="487.0" y="125.0" width="156.0" height="165.0" rx="4" fill="#ffffff" stroke="#ffcc80" stroke-width="1.5"/>
<text x="565.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#bf360c" text-anchor="middle" font-weight="700">Вибір алгоритму:</text>
<text x="565.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Boyer-Moore (-F)</text>
<text x="565.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• DFA автомат (-E)</text>
<text x="565.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• PCRE VM (-P)</text>
<rect x="495.0" y="225.0" width="140.0" height="55.0" rx="3" fill="#fbe9e7" stroke="#ffab91" stroke-width="1.5"/>
<text x="565.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c62828" text-anchor="middle" font-weight="700">Результат: Є ЗБІГ?</text>
<text x="565.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Так (0) / Ні (1)</text>
<line x1="660.0" y1="180.0" x2="695.0" y2="180.0" stroke="#fb8c00" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="700.0" y="60.0" width="140.0" height="245.0" rx="6" fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
<text x="770.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1b5e20" text-anchor="middle" font-weight="700">4. Вивід</text>
<text x="770.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">stdout / статус</text>
<rect x="710.0" y="125.0" width="120.0" height="165.0" rx="4" fill="#ffffff" stroke="#a5d6a7" stroke-width="1.5"/>
<text x="770.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2e7d32" text-anchor="middle" font-weight="700">Фільтрація:</text>
<text x="770.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Рядок цілком</text>
<text x="770.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Тільки збіг (-o)</text>
<text x="770.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Інверсія (-v)</text>
<text x="770.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Контекст (-C)</text>
<text x="770.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1b5e20" text-anchor="middle" font-weight="700">exit(0) / exit(1)</text>
<text x="770.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Код статусу</text>
</svg>