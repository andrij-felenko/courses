<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1370 652" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1370" height="652" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="680.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві шини: одна відповідає на запитання, друга мовчить</text>
<rect x="60.0" y="72.0" width="580.0" height="56.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="350.0" y="105.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">ШИНА ВМІЄ ВІДПОВІДАТИ  —  PCI, USB</tspan></text>
<rect x="720.0" y="72.0" width="580.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="1010.0" y="105.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1010.0" dy="0.0">СПИТАТИ НЕМА КОГО  —  I²C, SPI, регістри SoC</tspan></text>
<rect x="60.0" y="160.0" width="580.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="350.0" y="203.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">у кожного учасника є визначене місце,</tspan><tspan x="350.0" dy="18.9">де лежить його самоопис</tspan></text>
<rect x="720.0" y="160.0" width="580.0" height="96.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.6"/><text x="1010.0" y="203.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">на двох дротах є лише адреса;</tspan><tspan x="1010.0" dy="18.9">відповідь «є» не каже, ХТО там є</tspan></text>
<line x1="350.0" y1="256.0" x2="350.0" y2="288.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1010.0" y1="256.0" x2="1010.0" y2="288.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="288.0" width="580.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="350.0" y="331.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">ядро читає ідентифікатори виробника,</tspan><tspan x="350.0" dy="18.9">продукту й класу — і впізнає пристрій</tspan></text>
<rect x="720.0" y="288.0" width="580.0" height="96.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.6"/><text x="1010.0" y="331.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">звертання за адресою для багатьох</tspan><tspan x="1010.0" dy="18.9">мікросхем — команда, а не запитання</tspan></text>
<line x1="350.0" y1="384.0" x2="350.0" y2="416.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1010.0" y1="384.0" x2="1010.0" y2="416.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="416.0" width="580.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="350.0" y="459.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">запитання безпечне: коли за адресою</tspan><tspan x="350.0" dy="18.9">нікого нема, шина каже про це сама</tspan></text>
<rect x="720.0" y="416.0" width="580.0" height="96.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.6"/><text x="1010.0" y="459.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">припаяний до SoC контролер узагалі</tspan><tspan x="1010.0" dy="18.9">не на шині: просто регістри за адресою</tspan></text>
<line x1="1010.0" y1="544.0" x2="830.0" y2="574.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="300.0" y="576.0" width="760.0" height="56.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.0"/><text x="680.0" y="609.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">опис мусить прийти ЗЗОВНІ — окремими даними</tspan></text>
</svg>