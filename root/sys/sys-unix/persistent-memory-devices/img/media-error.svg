<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1330 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1330" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="340.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">звичайний накопичувач</text>
<text x="980.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">постійна пам'ять</text>
<rect x="60.0" y="84.0" width="560.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="340.0" y="130.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">програма кличе read()</tspan></text>
<line x1="340.0" y1="172.0" x2="340.0" y2="186.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="190.0" width="560.0" height="84.0" rx="6" fill="#f2f3f5" stroke="#6b7280" stroke-width="1.8"/><text x="340.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">контролер носія натрапляє на биту ділянку</tspan></text>
<line x1="340.0" y1="278.0" x2="340.0" y2="292.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="296.0" width="560.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="340.0" y="334.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">помилка їде назад тим самим шляхом,</tspan><tspan x="340.0" dy="16.2">яким ішов запит</tspan></text>
<line x1="340.0" y1="384.0" x2="340.0" y2="398.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="402.0" width="560.0" height="84.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="340.0" y="440.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">read() повертає EIO —</tspan><tspan x="340.0" dy="16.2">звичайна гілка коду, яку всі пишуть</tspan></text>
<rect x="700.0" y="84.0" width="560.0" height="84.0" rx="6" fill="#fdf3e7" stroke="#c0392b" stroke-width="1.8"/><text x="980.0" y="130.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">процесор виконує mov із відображення</tspan></text>
<line x1="980.0" y1="172.0" x2="980.0" y2="186.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="700.0" y="190.0" width="560.0" height="84.0" rx="6" fill="#f2f3f5" stroke="#6b7280" stroke-width="1.8"/><text x="980.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">контролер пам'яті натрапляє на биту комірку</tspan></text>
<line x1="980.0" y1="278.0" x2="980.0" y2="292.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="700.0" y="296.0" width="560.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="980.0" y="334.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">повертати код нікуди: інструкція завантаження</tspan><tspan x="980.0" dy="16.2">не має місця під помилку</tspan></text>
<line x1="980.0" y1="384.0" x2="980.0" y2="398.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="700.0" y="402.0" width="560.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="980.0" y="440.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">machine check → SIGBUS процесові,</tspan><tspan x="980.0" dy="16.2">а з контексту ядра — значно гірше</tspan></text>
<rect x="60.0" y="528.0" width="1200.0" height="104.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="660.0" y="568.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">єдиний захист — знати заздалегідь: команда прошивки обходить діапазон і повідомляє відомі збійні адреси,</tspan><tspan x="660.0" dy="16.2">ядро тримає їх у списку badblocks — і блоковий шар віддає EIO, а обробник помилки сторінки</tspan><tspan x="660.0" dy="16.2">відмовляє у відображенні ще до того, як процесор торкнеться комірки</tspan></text>
</svg>