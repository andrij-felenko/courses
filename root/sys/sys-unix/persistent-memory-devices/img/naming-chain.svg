<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1370 704" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1370" height="704" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="175.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">рівень</text>
<text x="590.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">що на ньому відомо</text>
<text x="1095.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">де це записано</text>
<rect x="50.0" y="92.0" width="250.0" height="86.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="175.0" y="139.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">таблиця NFIT</tspan></text>
<rect x="330.0" y="92.0" width="520.0" height="86.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="590.0" y="131.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">які діапазони фізичних адрес постійні</tspan><tspan x="590.0" dy="16.2">і з яких планок кожен складений</tspan></text>
<rect x="880.0" y="92.0" width="430.0" height="86.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.6"/><text x="1095.0" y="131.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1095.0" dy="0.0">прошивка платформи:</tspan><tspan x="1095.0" dy="15.6">складається наново при кожному вмиканні</tspan></text>
<line x1="175.0" y1="182.0" x2="175.0" y2="194.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="198.0" width="250.0" height="86.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="175.0" y="245.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">область</tspan></text>
<rect x="330.0" y="198.0" width="520.0" height="86.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="590.0" y="237.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">один набір чергування —</tspan><tspan x="590.0" dy="16.2">один суцільний діапазон адрес</tspan></text>
<rect x="880.0" y="198.0" width="430.0" height="86.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.6"/><text x="1095.0" y="237.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1095.0" dy="0.0">ядро будує з NFIT:</tspan><tspan x="1095.0" dy="15.6">живе лише в пам'яті ядра</tspan></text>
<line x1="175.0" y1="288.0" x2="175.0" y2="300.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="304.0" width="250.0" height="86.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="175.0" y="351.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">мітки в планках</tspan></text>
<rect x="330.0" y="304.0" width="520.0" height="86.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="590.0" y="343.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">кому належить кожен відрізок місткості</tspan><tspan x="590.0" dy="16.2">і в якому він режимі</tspan></text>
<rect x="880.0" y="304.0" width="430.0" height="86.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.6"/><text x="1095.0" y="343.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1095.0" dy="0.0">окрема пам'ять на самій планці:</tspan><tspan x="1095.0" dy="15.6">переживає навіть переїзд в іншу машину</tspan></text>
<line x1="175.0" y1="394.0" x2="175.0" y2="406.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="410.0" width="250.0" height="86.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="175.0" y="457.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">простір імен</tspan></text>
<rect x="330.0" y="410.0" width="520.0" height="86.0" rx="6" fill="#fdf3e7" stroke="#c0392b" stroke-width="1.8"/><text x="590.0" y="449.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">відрізок місткості з власним UUID,</tspan><tspan x="590.0" dy="16.2">режимом і геометрією</tspan></text>
<rect x="880.0" y="410.0" width="430.0" height="86.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.6"/><text x="1095.0" y="449.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1095.0" dy="0.0">ядро збирає з міток</tspan><tspan x="1095.0" dy="15.6">при кожному завантаженні</tspan></text>
<line x1="175.0" y1="500.0" x2="175.0" y2="512.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="516.0" width="250.0" height="86.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/><text x="175.0" y="563.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">файл пристрою</tspan></text>
<rect x="330.0" y="516.0" width="520.0" height="86.0" rx="6" fill="#f2f3f5" stroke="#6b7280" stroke-width="1.8"/><text x="590.0" y="555.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">/dev/pmem0 або /dev/dax0.0 —</tspan><tspan x="590.0" dy="16.2">те, що відкриває програма</tspan></text>
<rect x="880.0" y="516.0" width="430.0" height="86.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.6"/><text x="1095.0" y="555.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1095.0" dy="0.0">створює udev:</tspan><tspan x="1095.0" dy="15.6">зникає разом із вимкненням</tspan></text>
<text x="680.0" y="654.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="680.0" dy="0.0">лише один рядок цього ланцюга зберігається на самому залізі —</tspan><tspan x="680.0" dy="16.9">і саме тому поділ місткості переживає геть усе інше</tspan></text>
</svg>