<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24.5 -10 984.5 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-24.5" y="-10" width="984.5" height="440" fill="#ffffff"/>
