<rect x="40.0" y="305.0" width="880.0" height="105.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="480.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Криптографічні гарантії на кожному етапі:</text>
<text x="60.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start" font-weight="700">Захист від перебору:</text>
<text x="270.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="start">Argon2id вимагає 1 ГБ ОЗП на кожну спробу, нівелюючи перевагу паралельних ASIC/GPU-ферм</text>
<text x="60.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start" font-weight="700">Антикриміналістика (AFSplit):</text>
<text x="270.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="start">Пошкодження хоча б одного сектора шпарини безповоротно знищує Master Key</text>
<text x="60.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start" font-weight="700">Ізоляція в пам'яті:</text>
<text x="270.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="start">Master Key існує в просторі користувача частки секунди і стирається через crypt_safe_memzero()</text>
</svg>