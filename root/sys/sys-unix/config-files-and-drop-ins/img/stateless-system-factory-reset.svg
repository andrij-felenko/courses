<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="25.0" width="185.0" height="200.0" rx="8" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.8"/>
<text x="112.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2980b9" text-anchor="middle" font-weight="700">1. Заводський образ</text>
<text x="112.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle" font-weight="700">Незмінний /usr</text>
<line x1="35.0" y1="78.0" x2="190.0" y2="78.0" stroke="#2980b9" stroke-width="1.0"/>
<text x="35.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2c3e50" text-anchor="start">• /usr/bin, /usr/lib</text>
<text x="35.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2c3e50" text-anchor="start">• Дефолтні конфіги</text>
<text x="35.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2c3e50" text-anchor="start">• Монтування Read-Only</text>
<rect x="225.0" y="25.0" width="185.0" height="200.0" rx="8" fill="#fef5e7" stroke="#e67e22" stroke-width="1.8"/>
<text x="317.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e67e22" text-anchor="middle" font-weight="700">2. Чистий старт</text>
<text x="317.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle" font-weight="700">Порожній /etc та /var</text>
<line x1="240.0" y1="78.0" x2="395.0" y2="78.0" stroke="#e67e22" stroke-width="1.0"/>
<text x="240.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2c3e50" text-anchor="start">• /etc = 0 байтів</text>
<text x="240.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2c3e50" text-anchor="start">• /var не ініціалізовано</text>
<text x="240.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2c3e50" text-anchor="start">• Детекція першого старту</text>
<rect x="430.0" y="25.0" width="185.0" height="200.0" rx="8" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.8"/>
<text x="522.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="middle" font-weight="700">3. Авто-синтез</text>
<text x="522.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle" font-weight="700">Ініціалізація стану</text>
<line x1="445.0" y1="78.0" x2="600.0" y2="78.0" stroke="#8e44ad" stroke-width="1.0"/>
<text x="445.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2c3e50" text-anchor="start">• systemd-sysusers</text>
<text x="445.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2c3e50" text-anchor="start">• systemd-tmpfiles</text>
<text x="445.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2c3e50" text-anchor="start">• systemd-firstboot</text>
<rect x="635.0" y="25.0" width="185.0" height="200.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="727.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">4. Робочий вузол</text>
<text x="727.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2c3e50" text-anchor="middle" font-weight="700">Повний функціонал</text>
<line x1="650.0" y1="78.0" x2="805.0" y2="78.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="650.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2c3e50" text-anchor="start">• Локальна дельта в /etc</text>
<text x="650.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2c3e50" text-anchor="start">• systemd-delta аудит</text>
<text x="650.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2c3e50" text-anchor="start">• Скидання: rm -rf /etc/*</text>
<line x1="205.0" y1="125.0" x2="225.0" y2="125.0" stroke="#2c3e50" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="410.0" y1="125.0" x2="430.0" y2="125.0" stroke="#2c3e50" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="615.0" y1="125.0" x2="635.0" y2="125.0" stroke="#2c3e50" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="120.0" y="250.0" width="600.0" height="60.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/>
<text x="420.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#922b21" text-anchor="middle" font-weight="700">Factory Reset (Скидання до заводського стану)</text>
<text x="420.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78281f" text-anchor="middle">Видалення /etc та /var повертає систему на Крок 2 без перевстановлення образу ОС</text>
<line x1="725.0" y1="225.0" x2="725.0" y2="280.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="120.0" y1="280.0" x2="120.0" y2="225.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>