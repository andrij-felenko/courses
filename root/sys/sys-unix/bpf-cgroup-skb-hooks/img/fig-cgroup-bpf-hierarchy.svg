<rect x="164.4" y="186.2" width="191.1" height="47.6" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="260.0" y="206.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">cgroup: kubepods/</tspan><tspan x="260.0" dy="15.6">Prog 2 (Cluster Policy)</tspan></text>
<rect x="179.3" y="286.2" width="161.4" height="47.6" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="260.0" y="306.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">cgroup: pod-123/</tspan><tspan x="260.0" dy="15.6">Prog 3 (Pod Policy)</tspan></text>
