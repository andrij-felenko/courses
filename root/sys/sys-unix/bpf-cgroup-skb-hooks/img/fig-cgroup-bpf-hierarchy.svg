<text x="525.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="525.0" dy="0.0">1. Запуск Prog 3 (Pod)</tspan><tspan x="525.0" dy="14.3">2. Запуск Prog 2 (Cluster)</tspan><tspan x="525.0" dy="14.3">3. Запуск Prog 1 (Root)</tspan><tspan x="525.0" dy="14.3">• Якщо УСІ повертають 1 -&gt; OK</tspan><tspan x="525.0" dy="14.3">• Якщо ХОЧ Б ОДИН 0 -&gt; DROP</tspan></text>
