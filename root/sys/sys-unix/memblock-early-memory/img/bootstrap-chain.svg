<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому першому розподільникові не можна мати власних структур</text>
<rect x="250.3" y="59.9" width="299.3" height="60.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.6"/><text x="400.0" y="85.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Розподільник сторінок роздає кадри</tspan><tspan x="400.0" dy="18.2">і веде списки вільних блоків</tspan></text>
<rect x="266.3" y="209.9" width="267.4" height="60.2" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.6"/><text x="400.0" y="235.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Список тримають описувачі:</tspan><tspan x="400.0" dy="18.2">на кожен кадр — своя структура</tspan></text>
<rect x="238.4" y="359.9" width="323.3" height="60.2" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.6"/><text x="400.0" y="385.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">На 64 ГіБ описувачі важать ≈ 1 ГіБ —</tspan><tspan x="400.0" dy="18.2">їх треба розмістити ДО першої роздачі</tspan></text>
<rect x="226.4" y="509.9" width="347.2" height="60.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="400.0" y="535.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Отже, потрібен розподільник, чий власний</tspan><tspan x="400.0" dy="18.2">облік не потребує розподільника</tspan></text>
<rect x="258.3" y="634.9" width="283.4" height="60.2" rx="6" fill="#eafaf0" stroke="#2457d6" stroke-width="1.6"/><text x="400.0" y="660.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">memblock: два масиви діапазонів,</tspan><tspan x="400.0" dy="18.2">вкомпільовані в образ ядра</tspan></text>
<line x1="400.0" y1="124.1" x2="400.0" y2="203.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="700.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">щоб працювати, потребує</text>
<line x1="400.0" y1="274.1" x2="400.0" y2="353.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="700.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">які самі треба виділити</text>
<line x1="400.0" y1="424.1" x2="400.0" y2="503.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="700.0" y="469.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">а виділяти ще нічим</text>
<line x1="400.0" y1="574.1" x2="400.0" y2="628.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="700.0" y="606.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">розрив кола</text>
</svg>