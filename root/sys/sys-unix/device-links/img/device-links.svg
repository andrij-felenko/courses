<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d32f2f"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="300" y="30" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Дерево пристроїв і ребро Device Link</text>

  <!-- Root -->
  <rect x="250" y="60" width="100" height="40" rx="5" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
  <text x="300" y="85" font-family="sans-serif" font-size="14" text-anchor="middle">Root</text>

  <!-- Tree Edges -->
  <line x1="300" y1="100" x2="150" y2="160" stroke="#90a4ae" stroke-width="2"/>
  <line x1="300" y1="100" x2="450" y2="160" stroke="#90a4ae" stroke-width="2"/>

  <!-- Branches -->
  <rect x="90" y="160" width="120" height="40" rx="5" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
  <text x="150" y="185" font-family="sans-serif" font-size="14" text-anchor="middle">PCI Bus</text>

  <rect x="390" y="160" width="120" height="40" rx="5" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/>
  <text x="450" y="185" font-family="sans-serif" font-size="14" text-anchor="middle">Platform Bus</text>

  <!-- Second level Tree Edges -->
  <line x1="150" y1="200" x2="150" y2="260" stroke="#90a4ae" stroke-width="2"/>
  <line x1="450" y1="200" x2="450" y2="260" stroke="#90a4ae" stroke-width="2"/>

  <!-- Leaf nodes -->
  <rect x="70" y="260" width="160" height="40" rx="5" fill="#bbdefb" stroke="#1976d2" stroke-width="2"/>
  <text x="150" y="285" font-family="sans-serif" font-size="14" text-anchor="middle">GPU (Consumer)</text>

  <rect x="370" y="260" width="160" height="40" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="2"/>
  <text x="450" y="285" font-family="sans-serif" font-size="14" text-anchor="middle">IOMMU (Supplier)</text>

  <!-- Device Link (Graph edge) -->
  <path d="M 230 280 C 280 258, 320 258, 365 280" fill="none" stroke="#d32f2f" stroke-width="3" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="300" y="240" font-family="sans-serif" font-size="12" fill="#d32f2f" font-weight="bold" text-anchor="middle">Device Link</text>

</svg>
