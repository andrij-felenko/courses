<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 800" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="800" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="400.0" y="25.5" width="440.0" height="45.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="620.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Куди лягає нова версія блока?</tspan></text>
<rect x="130.0" y="157.5" width="300.0" height="35.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="280.0" y="180.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">на те саме місце</tspan></text>
<rect x="790.0" y="157.5" width="300.0" height="35.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="940.0" y="180.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="940.0" dy="0.0">поруч, на вільне місце</tspan></text>
<line x1="620.0" y1="70.5" x2="300.0" y2="151.5" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="620.0" y1="70.5" x2="920.0" y2="151.5" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="178.2" y="264.8" width="203.5" height="70.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">на носії є мить, коли</tspan><tspan x="280.0" dy="18.2">частина змін уже лягла,</tspan><tspan x="280.0" dy="18.2">а частина ще ні</tspan></text>
<line x1="280.0" y1="192.5" x2="280.0" y2="264.8" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="186.2" y="394.8" width="187.6" height="70.4" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="280.0" y="416.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">спершу записати намір</tspan><tspan x="280.0" dy="18.2">в окрему ділянку —</tspan><tspan x="280.0" dy="18.2">журнал</tspan></text>
<line x1="280.0" y1="335.2" x2="280.0" y2="394.8" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="150.0" y="529.0" width="260.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="280.0" y="556.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">ext4 · XFS</tspan></text>
<line x1="280.0" y1="465.2" x2="280.0" y2="529.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="280.0" y="625.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="280.0" dy="0.0">ціна — метадані потрапляють</tspan><tspan x="280.0" dy="16.9">на носій двічі</tspan></text>
<rect x="810.3" y="264.8" width="259.4" height="70.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="940.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">покажчик у батьківському вузлі</tspan><tspan x="940.0" dy="18.2">застарів — а його теж</tspan><tspan x="940.0" dy="18.2">не можна правити на місці</tspan></text>
<line x1="940.0" y1="192.5" x2="940.0" y2="264.8" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="822.3" y="394.8" width="235.5" height="70.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="940.0" y="416.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">хвиля оновлень піднімається</tspan><tspan x="940.0" dy="18.2">до самого кореня</tspan><tspan x="940.0" dy="18.2">(мандрівне дерево)</tspan></text>
<line x1="940.0" y1="335.2" x2="940.0" y2="394.8" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="649.6" y="526.6" width="160.8" height="66.8" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="547.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">копіювати весь шлях</tspan><tspan x="730.0" dy="16.9">і перемкнути корінь</tspan><tspan x="730.0" dy="16.9">одним записом</tspan></text>
<rect x="994.8" y="526.6" width="190.4" height="66.8" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1090.0" y="547.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1090.0" dy="0.0">вузли посилаються</tspan><tspan x="1090.0" dy="16.9">номерами, не адресами —</tspan><tspan x="1090.0" dy="16.9">хвиля обривається</tspan></text>
<line x1="880.0" y1="465.2" x2="760.0" y2="522.6" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1000.0" y1="465.2" x2="1070.0" y2="522.6" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="630.0" y="655.0" width="200.0" height="40.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="681.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Btrfs</tspan></text>
<rect x="990.0" y="655.0" width="200.0" height="40.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1090.0" y="681.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1090.0" dy="0.0">F2FS</tspan></text>
<line x1="730.0" y1="593.4" x2="730.0" y2="655.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1090.0" y1="593.4" x2="1090.0" y2="655.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="730.0" y="740.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="730.0" dy="0.0">ціна — посилений запис,</tspan><tspan x="730.0" dy="16.9">зиск — дешевий знімок</tspan></text>
<text x="1090.0" y="740.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="1090.0" dy="0.0">ціна — окрема таблиця,</tspan><tspan x="1090.0" dy="16.9">зиск — хвиля не йде вгору</tspan></text>
</svg>