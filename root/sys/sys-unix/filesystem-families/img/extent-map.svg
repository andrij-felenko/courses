<line x1="620.0" y1="540.0" x2="900.0" y2="594.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="50.0" y="690.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">глибина росте як логарифм від кількості записів; роздроблений файл — це багато записів, і карта знову дорожчає</text>
</svg>