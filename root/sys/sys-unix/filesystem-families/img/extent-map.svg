<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="50.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Список номерів блоків (ext2, ext3)</text>
<rect x="50.0" y="60.0" width="190.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="145.0" y="94.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">inode</tspan><tspan x="145.0" dy="18.2">12 прямих номерів</tspan><tspan x="145.0" dy="18.2">+ 3 непрямі</tspan></text>
<rect x="300.0" y="68.0" width="180.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="390.0" y="104.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">непрямий блок</tspan><tspan x="390.0" dy="16.9">1024 номери</tspan></text>
<rect x="500.0" y="68.0" width="180.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="104.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">подвійно непрямий</tspan><tspan x="590.0" dy="16.9">1024 блоки по 1024</tspan></text>
<rect x="700.0" y="68.0" width="180.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="104.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">тричі непрямий</tspan><tspan x="790.0" dy="16.9">ще на рівень глибше</tspan></text>
<line x1="240.0" y1="108.0" x2="300.0" y2="108.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="480.0" y1="108.0" x2="500.0" y2="108.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="680.0" y1="108.0" x2="700.0" y2="108.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="910.0" y="60.0" width="220.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1020.0" y="95.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">файл на 1 ГіБ:</tspan><tspan x="1020.0" dy="16.9">262144 покажчики</tspan><tspan x="1020.0" dy="16.9">≈ 1 МіБ самої карти</tspan></text>
<text x="50.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">щоб дістатися далекого блока, треба спершу прочитати покажчики — зайві звертання до носія</text>
<text x="50.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Екстенти (ext4, XFS)</text>
