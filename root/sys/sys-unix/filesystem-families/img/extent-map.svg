<rect x="290.0" y="270.0" width="220.0" height="90.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="400.0" y="302.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">зсув у файлі: 32768</tspan><tspan x="400.0" dy="16.9">блок: 835584</tspan><tspan x="400.0" dy="16.9">довжина: 32768</tspan></text>
<rect x="530.0" y="270.0" width="220.0" height="90.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="302.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">зсув у файлі: 65536</tspan><tspan x="640.0" dy="16.9">блок: 868352</tspan><tspan x="640.0" dy="16.9">довжина: 32768</tspan></text>
<rect x="790.0" y="270.0" width="340.0" height="90.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="960.0" y="302.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">12 байтів на запис · до 128 МіБ на запис</tspan><tspan x="960.0" dy="16.9">чотири записи вміщаються просто в inode</tspan><tspan x="960.0" dy="16.9">той самий файл — 96 байтів карти</tspan></text>
<text x="50.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">суцільна ділянка описується трьома числами замість переліку кожного блока</text>
<text x="50.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Дерево екстентів (коли записів забагато)</text>
<rect x="430.0" y="474.0" width="320.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="590.0" y="503.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">корінь у inode: 60 байтів</tspan><tspan x="590.0" dy="16.9">заголовок + до 4 записів</tspan></text>
<rect x="130.0" y="600.0" width="260.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="629.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">листок</tspan><tspan x="260.0" dy="16.9">екстенти 0…340</tspan></text>
<line x1="560.0" y1="540.0" x2="260.0" y2="594.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="450.0" y="600.0" width="260.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="580.0" y="629.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">листок</tspan><tspan x="580.0" dy="16.9">екстенти 341…680</tspan></text>
<line x1="590.0" y1="540.0" x2="580.0" y2="594.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
