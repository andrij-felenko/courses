<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="960.0" height="510.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="490.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">МЕХАНІЗМ ПІДПИСУ SSH-AGENT: ЧОМУ ЗАКРИТИЙ КЛЮЧ НЕ ЗАЛИШАЄ ПАМ'ЯТЬ ДЕМОНА</text>
<rect x="25.0" y="55.0" width="595.0" height="450.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="320.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">ЛОКАЛЬНА РОБОЧА СТАНЦІЯ (LOCAL HOST)</text>
<rect x="40.0" y="95.0" width="250.0" height="190.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="165.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Процес клієнта (ssh / git)</text>
<rect x="50.0" y="130.0" width="230.0" height="45.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="165.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">1. Зчитує $SSH_AUTH_SOCK</tspan><tspan x="165.0" dy="13.0">2. Отримує challenge від сервера</tspan><tspan x="165.0" dy="13.0">3. Формує запит на підпис</tspan></text>
<rect x="50.0" y="185.0" width="230.0" height="90.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="165.0" y="209.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e3a8a" text-anchor="middle"><tspan x="165.0" dy="0.0">Клієнт НЕ має доступу</tspan><tspan x="165.0" dy="11.7">до відкритого закритого ключа.</tspan><tspan x="165.0" dy="11.7">Він лише ретранслює</tspan><tspan x="165.0" dy="11.7">криптографічний виклик</tspan><tspan x="165.0" dy="11.7">та отримує готовий підпис.</tspan></text>
<rect x="345.0" y="95.0" width="260.0" height="395.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="475.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">Демон ssh-agent (PID)</text>
<rect x="355.0" y="130.0" width="240.0" height="60.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="475.0" y="145.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">Захищена оперативна пам'ять:</tspan><tspan x="475.0" dy="11.7">- Розшифровані ключі (Ed25519/RSA)</tspan><tspan x="475.0" dy="11.7">- Виклик mlock() (захист від swap)</tspan><tspan x="475.0" dy="11.7">- Захист від coredump</tspan></text>
<rect x="355.0" y="200.0" width="240.0" height="75.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="475.0" y="217.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">Контроль доступу та життя:</tspan><tspan x="475.0" dy="11.7">- Таймаут життя (ssh-add -t 1h)</tspan><tspan x="475.0" dy="11.7">- Підтвердження (ssh-add -c)</tspan><tspan x="475.0" dy="11.7">  -&gt; виклик SSH_ASKPASS</tspan><tspan x="475.0" dy="11.7">- Видалення з пам'яті (ssh-add -D)</tspan></text>
<rect x="355.0" y="285.0" width="240.0" height="85.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="475.0" y="307.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">Обробник криптографії:</tspan><tspan x="475.0" dy="11.7">1. Знаходить ключ за відкритим блобом</tspan><tspan x="475.0" dy="11.7">2. Перевіряє права/підтвердження</tspan><tspan x="475.0" dy="11.7">3. Обчислює цифровий підпис</tspan><tspan x="475.0" dy="11.7">   (Ed25519_sign / RSA_sign)</tspan></text>
<rect x="355.0" y="380.0" width="240.0" height="95.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="475.0" y="413.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="475.0" dy="0.0">Жоден байт закритого ключа</tspan><tspan x="475.0" dy="11.7">ніколи не передається через сокет</tspan><tspan x="475.0" dy="11.7">і не записується на диск.</tspan><tspan x="475.0" dy="11.7">Назовні виходить лише підпис.</tspan></text>
<rect x="40.0" y="305.0" width="250.0" height="185.0" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="165.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b21a8" text-anchor="middle" font-weight="700">UNIX-сокет $SSH_AUTH_SOCK</text>
<rect x="50.0" y="335.0" width="230.0" height="40.0" rx="6" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/><text x="165.0" y="352.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Шлях: /tmp/ssh-XXXXXX/agent.PID</tspan><tspan x="165.0" dy="11.7">Права каталогу: 0700 (тільки UID)</tspan></text>
<rect x="50.0" y="385.0" width="230.0" height="95.0" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/><text x="165.0" y="412.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#581c87" text-anchor="middle"><tspan x="165.0" dy="0.0">Протокол агента (Agent Wire Protocol):</tspan><tspan x="165.0" dy="11.7">-&gt; SSH_AGENTC_REQUEST_IDENTITIES</tspan><tspan x="165.0" dy="11.7">&lt;- SSH_AGENT_IDENTITIES_ANSWER</tspan><tspan x="165.0" dy="11.7">-&gt; SSH_AGENTC_SIGN_REQUEST (data)</tspan><tspan x="165.0" dy="11.7">&lt;- SSH_AGENT_SIGN_RESPONSE (sig)</tspan></text>
<line x1="165.0" y1="285.0" x2="165.0" y2="305.0" stroke="#7c3aed" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="290.0" y1="395.0" x2="345.0" y2="395.0" stroke="#7c3aed" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="635.0" y="55.0" width="330.0" height="450.0" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="800.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9a3412" text-anchor="middle" font-weight="700">ВІДДАЛЕНИЙ СЕРВЕР (SSHD)</text>
<rect x="645.0" y="95.0" width="310.0" height="65.0" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/><text x="800.0" y="111.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">1. Генерує випадковий виклик</tspan><tspan x="800.0" dy="13.0">   (Challenge / Session ID)</tspan><tspan x="800.0" dy="13.0">2. Надсилає виклик клієнту</tspan><tspan x="800.0" dy="13.0">   для підтвердження володіння ключем</tspan></text>
<rect x="645.0" y="170.0" width="310.0" height="85.0" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="800.0" y="196.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c2d12" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">3. Отримує готовий підпис від клієнта</tspan><tspan x="800.0" dy="13.0">4. Звіряє підпис із відкритим ключем</tspan><tspan x="800.0" dy="13.0">   у файлі ~/.ssh/authorized_keys</tspan><tspan x="800.0" dy="13.0">5. Успіх: відкриває сеанс користувача</tspan></text>
<rect x="645.0" y="265.0" width="310.0" height="225.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="800.0" y="316.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">ЧОМУ FORWARDAGENT НЕБЕЗПЕЧНИЙ:</tspan><tspan x="800.0" dy="11.7">Якщо на сервері ввімкнено ForwardAgent yes,</tspan><tspan x="800.0" dy="11.7">віддалений sshd створює проксі-сокет</tspan><tspan x="800.0" dy="11.7">до твого локального агента.</tspan><tspan x="800.0" dy="11.7"></tspan><tspan x="800.0" dy="11.7">Зловмисник із правами root на цьому сервері</tspan><tspan x="800.0" dy="11.7">може підключатися до прокинутого сокета</tspan><tspan x="800.0" dy="11.7">і підписувати будь-які запити до інших</tspan><tspan x="800.0" dy="11.7">твоїх машин від твого імені, доки відкритий сеанс!</tspan><tspan x="800.0" dy="11.7"></tspan><tspan x="800.0" dy="11.7">Для переходу через сервери замість цього</tspan><tspan x="800.0" dy="11.7">слід використовувати безпечний ProxyJump.</tspan></text>
</svg>