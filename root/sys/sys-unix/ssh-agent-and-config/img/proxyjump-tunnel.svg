<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="960.0" height="480.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="490.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">АРХІТЕКТУРА PROXYJUMP: НАСКРІЗНИЙ ЗАШИФРОВАНИЙ ТУНЕЛЬ ЧЕРЕЗ БАСТІОН</text>
<rect x="25.0" y="65.0" width="280.0" height="405.0" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="165.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">КЛІЄНТ (РОБОЧА СТАНЦІЯ)</text>
<rect x="35.0" y="105.0" width="260.0" height="65.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="165.0" y="123.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Команда запуску:</tspan><tspan x="165.0" dy="11.7">ssh -J bastion.corp target.internal</tspan><tspan x="165.0" dy="11.7">або директива у ~/.ssh/config:</tspan><tspan x="165.0" dy="11.7">ProxyJump bastion.corp</tspan></text>
<rect x="35.0" y="180.0" width="260.0" height="95.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="165.0" y="207.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e3a8a" text-anchor="middle"><tspan x="165.0" dy="0.0">Шар 1 (Зовнішній):</tspan><tspan x="165.0" dy="11.7">- З'єднання з bastion:22</tspan><tspan x="165.0" dy="11.7">- Автентифікація на бастіоні</tspan><tspan x="165.0" dy="11.7">- Запит каналу direct-tcpip</tspan><tspan x="165.0" dy="11.7">  (до target.internal:22)</tspan></text>
<rect x="35.0" y="285.0" width="260.0" height="105.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="165.0" y="317.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">Шар 2 (Наскрізний внутрішній):</tspan><tspan x="165.0" dy="11.7">- Ініціалізація SSH-сеансу до target</tspan><tspan x="165.0" dy="11.7">- Обмін ключами KEX безпосередньо з target</tspan><tspan x="165.0" dy="11.7">- Автентифікація власним ключем target</tspan><tspan x="165.0" dy="11.7">- Наскрізне симетричне шифрування</tspan></text>
<rect x="35.0" y="400.0" width="260.0" height="55.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="165.0" y="424.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">Бастіон НЕ має доступу</tspan><tspan x="165.0" dy="11.7">до ключів та сеансу target!</tspan></text>
<rect x="340.0" y="65.0" width="300.0" height="405.0" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="490.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b21a8" text-anchor="middle" font-weight="700">БАСТІОН / JUMP HOST (ПУБЛІЧНИЙ IP)</text>
<rect x="355.0" y="105.0" width="270.0" height="75.0" rx="6" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/><text x="490.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Мережевий інтерфейс:</tspan><tspan x="490.0" dy="11.7">- Зовнішній IP (доступний з Інтернету)</tspan><tspan x="490.0" dy="11.7">- Внутрішній IP (у приватній підмережі)</tspan><tspan x="490.0" dy="11.7">- Слухає sshd на порту 22</tspan></text>
<rect x="355.0" y="190.0" width="270.0" height="115.0" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/><text x="490.0" y="221.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#581c87" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Канал direct-tcpip в дії:</tspan><tspan x="490.0" dy="11.7">1. Приймає канальний запит від клієнта</tspan><tspan x="490.0" dy="11.7">2. Викликає connect() до 10.0.1.50:22</tspan><tspan x="490.0" dy="11.7">3. Здійснює прозоре пересилання байтів</tspan><tspan x="490.0" dy="11.7">   між каналом SSH та TCP-сокетом</tspan><tspan x="490.0" dy="11.7">4. Жодної дешифрації внутрішнього SSH!</tspan></text>
<rect x="355.0" y="315.0" width="270.0" height="140.0" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/><text x="490.0" y="358.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#581c87" text-anchor="middle"><tspan x="490.0" dy="0.0">ЧОМУ PROXYJUMP КРАЩИЙ ЗА PROXYCOMMAND NC:</tspan><tspan x="490.0" dy="11.7">- Не запускає окремий дочірній процес nc/ssh</tspan><tspan x="490.0" dy="11.7">- Використовує штатний мультиплексований</tspan><tspan x="490.0" dy="11.7">  канал direct-tcpip протоколу OpenSSH</tspan><tspan x="490.0" dy="11.7">- Менше накладних витрат на форки та пайпи</tspan><tspan x="490.0" dy="11.7">- Підтримує каскади: ProxyJump b1,b2,b3</tspan></text>
<rect x="675.0" y="65.0" width="280.0" height="405.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="815.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">ЦІЛЬОВИЙ СЕРВЕР (10.0.1.50)</text>
<rect x="685.0" y="105.0" width="260.0" height="75.0" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/><text x="815.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Ізольована внутрішня мережа:</tspan><tspan x="815.0" dy="11.7">- Приватна IP-адреса 10.0.1.50</tspan><tspan x="815.0" dy="11.7">- Відсутній прямий маршрут з Інтернету</tspan><tspan x="815.0" dy="11.7">- Приймає вхідний TCP-порт 22</tspan></text>
<rect x="685.0" y="190.0" width="260.0" height="115.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="815.0" y="221.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">Термінація SSH-сеансу:</tspan><tspan x="815.0" dy="11.7">- Бачить вхідне TCP-з'єднання з IP бастіону</tspan><tspan x="815.0" dy="11.7">- Але виконує криптографічне рукостискання</tspan><tspan x="815.0" dy="11.7">  безпосередньо з вихідним клієнтом</tspan><tspan x="815.0" dy="11.7">- Звіряє ключ клієнта в authorized_keys</tspan><tspan x="815.0" dy="11.7">- Відкриває захищену PTY/shell сесію</tspan></text>
<rect x="685.0" y="315.0" width="260.0" height="140.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="815.0" y="358.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle"><tspan x="815.0" dy="0.0">Безпека архітектури:</tspan><tspan x="815.0" dy="11.7">Навіть якщо бастіон скомпрометовано,</tspan><tspan x="815.0" dy="11.7">зловмисник бачить лише шифротекст</tspan><tspan x="815.0" dy="11.7">і не може підслухати або підробити</tspan><tspan x="815.0" dy="11.7">трафік між клієнтом і цільовим вузлом</tspan><tspan x="815.0" dy="11.7">(за умови валідації host key цілі).</tspan></text>
<line x1="305.0" y1="220.0" x2="340.0" y2="220.0" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="640.0" y1="220.0" x2="675.0" y2="220.0" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>