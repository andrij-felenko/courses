<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="960.0" height="480.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="490.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">МУЛЬТИПЛЕКСУВАННЯ OPENSSH (CONTROLMASTER): ОДНЕ TCP-З'ЄДНАННЯ НА ДЕСЯТКИ СЕАНСІВ</text>
<rect x="25.0" y="60.0" width="520.0" height="415.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="285.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">ЛОКАЛЬНА РОБОЧА СТАНЦІЯ (OPENSSH CLIENTS)</text>
<rect x="40.0" y="100.0" width="235.0" height="160.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="157.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">SSH Master Process</text>
<rect x="50.0" y="133.0" width="215.0" height="115.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="157.5" y="164.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="157.5" dy="0.0">Перший виклик (ControlMaster auto):</tspan><tspan x="157.5" dy="11.7">- Виконує повний TCP + SSH Handshake</tspan><tspan x="157.5" dy="11.7">- Створює керівний UNIX-сокет ControlPath</tspan><tspan x="157.5" dy="11.7">- ControlPersist 10m: залишається демоном</tspan><tspan x="157.5" dy="11.7">  у фоні після завершення першої сесії</tspan><tspan x="157.5" dy="11.7">- Тримає одне живе TCP-з'єднання</tspan></text>
<rect x="40.0" y="275.0" width="235.0" height="185.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="157.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">Slave Clients (Git / SCP / CLI)</text>
<rect x="50.0" y="310.0" width="215.0" height="140.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="157.5" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="middle" font-weight="700"><tspan x="157.5" dy="0.0">Наступні виклики ssh / scp / rsync:</tspan><tspan x="157.5" dy="11.7">- Перевіряють наявність ControlPath</tspan><tspan x="157.5" dy="11.7">- Підключаються до локального UNIX-сокета</tspan><tspan x="157.5" dy="11.7">- Запитують відкриття нового каналу</tspan><tspan x="157.5" dy="11.7">- Час старту: 2-5 мс замість 200-500 мс!</tspan><tspan x="157.5" dy="11.7">- Нульові витрати на повторну авторизацію</tspan><tspan x="157.5" dy="11.7">- Ідеально для Ansible та CI/CD</tspan></text>
<rect x="300.0" y="170.0" width="230.0" height="180.0" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="415.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b21a8" text-anchor="middle" font-weight="700">Сокет ControlPath</text>
<rect x="310.0" y="210.0" width="210.0" height="45.0" rx="6" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5"/><text x="415.0" y="229.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">~/.ssh/sockets/%r@%h:%p</tspan><tspan x="415.0" dy="11.7">(права 0600 на сокет)</tspan></text>
<rect x="310.0" y="265.0" width="210.0" height="75.0" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/><text x="415.0" y="282.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#581c87" text-anchor="middle"><tspan x="415.0" dy="0.0">Передає дескриптори та</tspan><tspan x="415.0" dy="11.7">керівні команди:</tspan><tspan x="415.0" dy="11.7">ssh -O check (статус)</tspan><tspan x="415.0" dy="11.7">ssh -O stop (м'яка зупинка)</tspan><tspan x="415.0" dy="11.7">ssh -O exit (негайний вихід)</tspan></text>
<line x1="275.0" y1="180.0" x2="300.0" y2="220.0" stroke="#3b82f6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="275.0" y1="340.0" x2="300.0" y2="280.0" stroke="#22c55e" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="570.0" y="60.0" width="385.0" height="415.0" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="762.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9a3412" text-anchor="middle" font-weight="700">ВІДДАЛЕНИЙ СЕРВЕР (SSHD)</text>
<rect x="585.0" y="100.0" width="355.0" height="90.0" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/><text x="762.5" y="122.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="762.5" dy="0.0">Єдине TCP-з'єднання (порт 22):</tspan><tspan x="762.5" dy="13.0">- Один TCP Handshake (SYN -&gt; SYN-ACK -&gt; ACK)</tspan><tspan x="762.5" dy="13.0">- Одне узгодження шифрів та KEX (Diffie-Hellman)</tspan><tspan x="762.5" dy="13.0">- Одна перевірка автентифікації користувача</tspan><tspan x="762.5" dy="13.0">- Сервер бачить лише один клієнтський процес</tspan></text>
<rect x="585.0" y="205.0" width="355.0" height="130.0" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="762.5" y="243.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7c2d12" text-anchor="middle" font-weight="700"><tspan x="762.5" dy="0.0">Мультиплексовані SSH-канали (SSH Channels):</tspan><tspan x="762.5" dy="11.7">[Канал 0]: Інтерактивна оболонка (Shell session)</tspan><tspan x="762.5" dy="11.7">[Канал 1]: Передавання файлу (SCP / SFTP subsystem)</tspan><tspan x="762.5" dy="11.7">[Канал 2]: Команда Git (git-receive-pack)</tspan><tspan x="762.5" dy="11.7">[Канал 3]: Виклик Ansible ad-hoc модуля</tspan><tspan x="762.5" dy="11.7">Всі канали працюють паралельно в одному потоці TCP.</tspan></text>
<rect x="585.0" y="350.0" width="355.0" height="110.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="762.5" y="378.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle"><tspan x="762.5" dy="0.0">Крайові випадки та обриви:</tspan><tspan x="762.5" dy="11.7">Якщо мережа розривається або падає Master,</tspan><tspan x="762.5" dy="11.7">усі активні канали обриваються одночасно.</tspan><tspan x="762.5" dy="11.7">Slave-клієнт при зникненні Master автоматично</tspan><tspan x="762.5" dy="11.7">створює новий Master (при ControlMaster auto)</tspan><tspan x="762.5" dy="11.7">після очищення мертвого сокета.</tspan></text>
</svg>