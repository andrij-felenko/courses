<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як ядро переграє системний виклик</text>
<text x="240.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">що бачить ядро на виході з виклику</text>
<text x="720.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">правка перед поверненням</text>
<rect x="40.0" y="52.0" width="400.0" height="48.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="80.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">orig_rax = 0 — номер __NR_read</tspan></text>
<rect x="520.0" y="52.0" width="400.0" height="48.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="80.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">rax ← orig_rax, тобто знову 0</tspan></text>
<rect x="40.0" y="110.0" width="400.0" height="48.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">rax = −512 — це −ERESTARTSYS</tspan></text>
<rect x="520.0" y="110.0" width="400.0" height="48.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">rip ← rip − 2, довжина syscall</tspan></text>
<rect x="40.0" y="168.0" width="400.0" height="48.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="196.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">rip — адреса після syscall</tspan></text>
<rect x="520.0" y="168.0" width="400.0" height="48.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="196.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">решта регістрів — незаймані</tspan></text>
<line x1="448.0" y1="128.0" x2="512.0" y2="128.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="236.0" width="880.0" height="62.0" rx="6" fill="#f7f3e8" stroke="#6b7280" stroke-width="1.5"/><text x="480.0" y="263.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">процесор виконує ту саму інструкцію syscall ще раз:</tspan><tspan x="480.0" dy="16.9">програма не бачить ні переривання, ні повторного входу в ядро</tspan></text>
</svg>