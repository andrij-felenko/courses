<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 890" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="890" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="60.0" y="50.0" width="430.0" height="84.0" rx="6" fill="#eceef1" stroke="#6b7280" stroke-width="1.8"/><text x="275.0" y="87.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Рядок покажчика:</tspan><tspan x="275.0" dy="18.2">UUID · handle_type · байти рукоятки · сума · шлях</tspan></text>
<line x1="275.0" y1="138.0" x2="275.0" y2="166.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="172.0" width="430.0" height="84.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="275.0" y="209.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">Знайти чинне монтування з цим UUID:</tspan><tspan x="275.0" dy="18.2">/proc/self/mountinfo + /dev/disk/by-uuid</tspan></text>
<line x1="275.0" y1="260.0" x2="275.0" y2="288.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="294.0" width="430.0" height="84.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="275.0" y="331.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">name_to_handle_at(збережений шлях):</tspan><tspan x="275.0" dy="18.2">чия рукоятка зараз під цим іменем?</tspan></text>
<line x1="275.0" y1="382.0" x2="275.0" y2="410.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="416.0" width="430.0" height="76.0" rx="6" fill="#fff6e5" stroke="#1a1a1a" stroke-width="1.8"/><text x="275.0" y="458.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">той самий handle_type і ті самі байти?</tspan></text>
<line x1="275.0" y1="496.0" x2="275.0" y2="554.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="560.0" width="430.0" height="92.0" rx="6" fill="#fff6e5" stroke="#1a1a1a" stroke-width="1.8"/><text x="275.0" y="601.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">ні, або шляху вже немає →</tspan><tspan x="275.0" dy="18.2">open_by_handle_at(mount_fd, рукоятка)</tspan></text>
<line x1="496.0" y1="454.0" x2="720.0" y2="444.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="730.0" y="396.0" width="470.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="965.0" y="439.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="965.0" dy="0.0">так → ФАЙЛ НА МІСЦІ</tspan><tspan x="965.0" dy="18.2">лишилося звірити контрольну суму</tspan></text>
<line x1="496.0" y1="590.0" x2="720.0" y2="568.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="730.0" y="520.0" width="470.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="965.0" y="554.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="965.0" dy="0.0">успіх → ФАЙЛ ПЕРЕЙМЕНОВАНО</tspan><tspan x="965.0" dy="18.2">новий шлях — readlink /proc/self/fd/N</tspan><tspan x="965.0" dy="18.2">(підказка, а не обіцянка)</tspan></text>
<line x1="496.0" y1="610.0" x2="720.0" y2="680.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="730.0" y="640.0" width="470.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="965.0" y="675.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="965.0" dy="0.0">ESTALE → ФАЙЛА БІЛЬШЕ НЕМАЄ</tspan><tspan x="965.0" dy="18.2">рядок можна виписати з покажчика</tspan></text>
<line x1="496.0" y1="630.0" x2="720.0" y2="792.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="730.0" y="744.0" width="470.0" height="96.0" rx="6" fill="#eceef1" stroke="#6b7280" stroke-width="1.8"/><text x="965.0" y="778.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="965.0" dy="0.0">EPERM → бракує CAP_DAC_READ_SEARCH</tspan><tspan x="965.0" dy="18.2">EOPNOTSUPP → ФС рукояток не вміє</tspan><tspan x="965.0" dy="18.2">обидва рази — відкіт на звичайний обхід</tspan></text>
</svg>