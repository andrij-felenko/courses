<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1220 576" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1220" height="576" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="70.0" y="34.0" width="1070.0" height="46.0" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.5"/><text x="605.0" y="61.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="605.0" dy="0.0">шина живлення кристала — під напругою, доки ввімкнено машину</tspan></text>
<rect x="255.0" y="118.0" width="200.0" height="50.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.5"/><text x="355.0" y="147.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="355.0" dy="0.0">вимикач живлення</tspan></text>
<rect x="835.0" y="118.0" width="200.0" height="50.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.5"/><text x="935.0" y="147.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="935.0" dy="0.0">вимикач живлення</tspan></text>
<line x1="355.0" y1="80.0" x2="355.0" y2="116.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="935.0" y1="80.0" x2="935.0" y2="116.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="645.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="645.0" dy="0.0">кожним керує окремий біт</tspan><tspan x="645.0" dy="15.6">у регістрі контролера живлення</tspan></text>
<rect x="90.0" y="202.0" width="560.0" height="246.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="110.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">регіон живлення «дисплей»</text>
<rect x="110.0" y="250.0" width="165.0" height="76.0" rx="6" fill="#e8eefb" stroke="#333333" stroke-width="1.5"/><text x="192.5" y="284.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="192.5" dy="0.0">контролер</tspan><tspan x="192.5" dy="16.9">дисплея</tspan></text>
<rect x="292.0" y="250.0" width="165.0" height="76.0" rx="6" fill="#e8eefb" stroke="#333333" stroke-width="1.5"/><text x="374.5" y="284.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="374.5" dy="0.0">передавач</tspan><tspan x="374.5" dy="16.9">MIPI DSI</tspan></text>
<rect x="474.0" y="250.0" width="165.0" height="76.0" rx="6" fill="#e8eefb" stroke="#333333" stroke-width="1.5"/><text x="556.5" y="284.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="556.5" dy="0.0">DMA</tspan><tspan x="556.5" dy="16.9">дисплея</tspan></text>
<text x="370.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">три окремі пристрої ядра — один спільний вимикач</text>
<text x="370.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">на межі регіону — комірки ізоляції:</text>
<text x="370.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">вони тримають виходи мертвого блока в певному рівні</text>
<line x1="355.0" y1="168.0" x2="355.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="692.0" y="202.0" width="438.0" height="246.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="712.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">регіон живлення «USB»</text>
<rect x="712.0" y="250.0" width="190.0" height="76.0" rx="6" fill="#e8eefb" stroke="#333333" stroke-width="1.5"/><text x="807.0" y="284.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="807.0" dy="0.0">USB-хост</tspan><tspan x="807.0" dy="16.9">(xHCI)</tspan></text>
<rect x="920.0" y="250.0" width="190.0" height="76.0" rx="6" fill="#e8eefb" stroke="#333333" stroke-width="1.5"/><text x="1015.0" y="292.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1015.0" dy="0.0">USB PHY</tspan></text>
<text x="911.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">тут вимикач живить лише два блоки</text>
<line x1="935.0" y1="168.0" x2="935.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="150.0" y="478.0" width="430.0" height="62.0" rx="6" fill="#e6f5ec" stroke="#333333" stroke-width="1.5"/><text x="365.0" y="505.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">вимкнути такт: стан збережено,</tspan><tspan x="365.0" dy="16.9">повернення — одиниці тактів</tspan></text>
<rect x="630.0" y="478.0" width="430.0" height="62.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="845.0" y="505.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">зняти живлення: стан утрачено,</tspan><tspan x="845.0" dy="16.9">повернення — сотні мікросекунд і більше</tspan></text>
</svg>