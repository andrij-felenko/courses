<rect x="267.9" y="107.6" width="204.1" height="54.8" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="131.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">таблиця дескрипторів</tspan><tspan x="370.0" dy="16.2">addr · len · flags · next</tspan></text>
<rect x="285.8" y="227.6" width="168.5" height="54.8" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="251.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">доступне кільце</tspan><tspan x="370.0" dy="16.2">flags · idx · ring[]</tspan></text>
<rect x="221.6" y="347.6" width="296.8" height="54.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="371.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">ужите кільце</tspan><tspan x="370.0" dy="16.2">flags · idx · ring[] з пар { id, len }</tspan></text>
<rect x="210.9" y="484.5" width="318.1" height="71.0" rx="6" fill="#fdecea" stroke="#6b7280" stroke-width="1.2"/><text x="370.0" y="508.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Щоб узяти один запит, споживач чіпає</tspan><tspan x="370.0" dy="16.2">три різні області — до трьох рядків кешу,</tspan><tspan x="370.0" dy="16.2">і всі три ходять між процесорами.</tspan></text>
<rect x="882.6" y="116.8" width="294.8" height="36.5" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.4"/><text x="1030.0" y="139.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">#0  addr · len · id = 6 · flags: AVAIL</tspan></text>
<rect x="882.6" y="196.8" width="294.8" height="36.5" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.4"/><text x="1030.0" y="219.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">#1  addr · len · id = 6 · flags: AVAIL</tspan></text>
<rect x="886.2" y="276.8" width="287.6" height="36.5" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.4"/><text x="1030.0" y="299.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">#2  addr · len · id = 4 · flags: USED</tspan></text>
<rect x="893.3" y="356.8" width="273.4" height="36.5" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.4"/><text x="1030.0" y="379.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">#3  addr · len · id = —  · flags: —</tspan></text>
<rect x="878.1" y="476.4" width="303.9" height="87.2" rx="6" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.2"/><text x="1030.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">Одна область, 16 байтів на дескриптор —</tspan><tspan x="1030.0" dy="16.2">чотири в рядок кешу. Чий зараз запис,</tspan><tspan x="1030.0" dy="16.2">кажуть два біти прапорців проти</tspan><tspan x="1030.0" dy="16.2">лічильника обороту кільця.</tspan></text>
<rect x="429.5" y="671.6" width="541.0" height="56.8" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="700.0" y="696.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Обидві розкладки описують той самий обмін — міняється лише те,</tspan><tspan x="700.0" dy="16.2">скільки пам'яті доводиться перегнати між ядрами процесора на один запит.</tspan></text>
</svg>