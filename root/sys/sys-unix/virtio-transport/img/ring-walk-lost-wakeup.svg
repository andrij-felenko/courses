<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1450 810" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1450" height="810" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="720.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому перед читанням позначки потрібен саме повний бар'єр</text>
<rect x="170.0" y="89.0" width="460.0" height="42.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.6"/><text x="400.0" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">ДРАЙВЕР  (виробник)</tspan></text>
<rect x="810.0" y="89.0" width="460.0" height="42.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.6"/><text x="1040.0" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1040.0" dy="0.0">ПРИСТРІЙ  (споживач)</tspan></text>
<rect x="170.0" y="220.1" width="460.0" height="59.9" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">1 · store  avail-&gt;idx = 5</tspan><tspan x="400.0" dy="16.9">додав роботу в чергу</tspan></text>
<rect x="810.0" y="220.1" width="460.0" height="59.9" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="1040.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">1 · store  used-&gt;avail_event = 5</tspan><tspan x="1040.0" dy="16.9">«розбуди мене, коли дійдеш до 5»</tspan></text>
<rect x="170.0" y="381.6" width="460.0" height="76.8" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="407.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">2 · load  used-&gt;avail_event</tspan><tspan x="400.0" dy="16.9">бачить старе 9  →  «ще не час»</tspan><tspan x="400.0" dy="16.9">кіку немає</tspan></text>
<rect x="810.0" y="381.6" width="460.0" height="76.8" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="1040.0" y="407.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">2 · load  avail-&gt;idx</tspan><tspan x="1040.0" dy="16.9">бачить старе 4  →  «порожньо»</tspan><tspan x="1040.0" dy="16.9">засинає на read(kickfd)</tspan></text>
<line x1="400.0" y1="305.0" x2="400.0" y2="358.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1040.0" y1="305.0" x2="1040.0" y2="358.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="720.0" y1="155.0" x2="720.0" y2="490.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="7 6"/>
<rect x="438.9" y="561.7" width="562.1" height="116.6" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="590.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Кожен читає стан, що передував чужому запису — і обидва сплять,</tspan><tspan x="720.0" dy="16.9">а запит лишається в черзі назавжди.</tspan><tspan x="720.0" dy="16.9">Рятує лише повний бар'єр «запис → читання» з ОБОХ боків:</tspan><tspan x="720.0" dy="16.9">atomic_thread_fence(memory_order_seq_cst) перед перевіркою позначки.</tspan><tspan x="720.0" dy="16.9">Бар'єра запису чи читання тут замало — вони цієї пари не впорядковують.</tspan></text>
</svg>