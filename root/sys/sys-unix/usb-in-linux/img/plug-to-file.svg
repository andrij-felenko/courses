<rect x="150.0" y="40.0" width="900.0" height="68.0" rx="6" fill="#eeeeee" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="79.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">контролер хоста помічає зміну напруги на порту</tspan></text>
<rect x="150.0" y="146.0" width="900.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="185.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">usbcore: скидання порту, адреса, читання дескрипторів</tspan></text>
<rect x="150.0" y="252.0" width="900.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="291.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">у sysfs з'являється 1-1 і кожен його інтерфейс 1-1:1.N</tspan></text>
<rect x="150.0" y="358.0" width="900.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="397.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">ядро надсилає uevent із рядком MODALIAS</tspan></text>
<rect x="150.0" y="464.0" width="900.0" height="68.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="600.0" y="503.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">udev віддає рядок kmod; потрібний модуль вантажиться</tspan></text>
<rect x="150.0" y="570.0" width="900.0" height="68.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="609.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">usbcore кличе probe() — окремо на КОЖЕН інтерфейс</tspan></text>
<rect x="150.0" y="676.0" width="900.0" height="68.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="715.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">драйвер реєструється у своїй підсистемі: input, V4L2, block, tty</tspan></text>
<rect x="150.0" y="782.0" width="900.0" height="68.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="821.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">підсистема створює символьний або блоковий вузол у /dev</tspan></text>
