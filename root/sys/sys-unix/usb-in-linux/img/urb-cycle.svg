<rect x="660.0" y="440.0" width="560.0" height="132.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="940.0" y="483.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">поле status готового запиту</tspan><tspan x="940.0" dy="18.2">0 — усе передано · −EPIPE — кінцева точка застрягла</tspan><tspan x="940.0" dy="18.2">−EOVERFLOW — пристрій дав більше, ніж просили</tspan><tspan x="940.0" dy="18.2">−ENOENT — скасовано · −ENODEV, −ESHUTDOWN — від'єднано</tspan></text>
