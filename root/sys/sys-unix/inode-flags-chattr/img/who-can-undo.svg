<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1350 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1350" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="670.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">гарантія варта стільки, скільки варта перешкода на шляху до зняття</text>
<rect x="60.0" y="90.0" width="600.0" height="470.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="360.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">Linux: усе вирішує можливість</text>
<rect x="90.0" y="150.0" width="540.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="360.0" y="188.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">процес root, можливість CAP_LINUX_IMMUTABLE на місці</tspan></text>
<line x1="360.0" y1="222.0" x2="360.0" y2="252.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="90.0" y="256.0" width="540.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="360.0" y="291.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">chattr -i проходить: прапорець знято однією командою</tspan></text>
<rect x="90.0" y="348.0" width="540.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="360.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">процес, у якого цю можливість прибрано</tspan><tspan x="360.0" dy="17.6">з обмежувальної множини</tspan></text>
<line x1="360.0" y1="420.0" x2="360.0" y2="450.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="90.0" y="454.0" width="540.0" height="82.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="360.0" y="491.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">chattr -i → EPERM; повернути можливість зсередини не можна —</tspan><tspan x="360.0" dy="17.6">лише запуск наново поза цим оточенням</tspan></text>
<rect x="720.0" y="90.0" width="600.0" height="470.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="2.0"/>
<text x="1020.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#b8860b" text-anchor="middle" font-weight="700">4.4BSD: усе вирішує рівень безпеки</text>
<rect x="750.0" y="150.0" width="540.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="1020.0" y="188.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">системний прапорець schg, рівень безпеки 0</tspan></text>
<line x1="1020.0" y1="222.0" x2="1020.0" y2="252.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="750.0" y="256.0" width="540.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="1020.0" y="291.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">chflags noschg проходить: прапорець знято</tspan></text>
<rect x="750.0" y="348.0" width="540.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="1020.0" y="386.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">та сама система, рівень безпеки піднято до 1 або вище</tspan></text>
<line x1="1020.0" y1="420.0" x2="1020.0" y2="450.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="750.0" y="454.0" width="540.0" height="82.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="1020.0" y="491.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">зняти не можна нікому, і знизити рівень теж не можна —</tspan><tspan x="1020.0" dy="17.6">шлях назад лише через перезавантаження</tspan></text>
<rect x="60.0" y="600.0" width="1220.0" height="62.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="670.0" y="636.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">сам біт скрізь однаковий: різниця не в забороні, а в тому, наскільки важко її погасити</tspan></text>
</svg>