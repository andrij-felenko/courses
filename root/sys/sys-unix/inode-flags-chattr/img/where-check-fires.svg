<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1430 960" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1430" height="960" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="710.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">незмінний файл: де операція впирається в заборону, а де проходить</text>
<rect x="60.0" y="110.0" width="620.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="370.0" y="142.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">упирається в EPERM</tspan></text>
<rect x="740.0" y="110.0" width="620.0" height="54.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/><text x="1050.0" y="142.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1050.0" dy="0.0">проходить безперешкодно</tspan></text>
<rect x="60.0" y="190.0" width="620.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="370.0" y="223.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">open(…, O_WRONLY) — відкрити на запис</tspan><tspan x="370.0" dy="17.6">перевірка права писати в inode</tspan></text>
<rect x="60.0" y="282.0" width="620.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="370.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">unlink / rename — прибрати або перейменувати</tspan><tspan x="370.0" dy="17.6">перевірка над жертвою: ловить і «i», і «a»</tspan></text>
<rect x="60.0" y="374.0" width="620.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="370.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">link — створити ще одне жорстке ім'я</tspan><tspan x="370.0" dy="17.6">нове ім'я міняє лічильник в самому inode</tspan></text>
<rect x="60.0" y="466.0" width="620.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="370.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">chmod / chown / utimes</tspan><tspan x="370.0" dy="17.6">спільний шлях зміни атрибутів inode</tspan></text>
<rect x="60.0" y="558.0" width="620.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="370.0" y="592.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">setxattr — записати розширений атрибут</tspan><tspan x="370.0" dy="17.6">запис атрибута — теж зміна об'єкта</tspan></text>
<rect x="60.0" y="650.0" width="620.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="370.0" y="684.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">write через уже відкритий дескриптор</tspan><tspan x="370.0" dy="17.6">перевірка в шляху запису: ext4 з 2019, f2fs з 2020</tspan></text>
<rect x="60.0" y="742.0" width="620.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="370.0" y="776.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">запис у відображену в пам'ять сторінку</tspan><tspan x="370.0" dy="17.6">не код помилки, а сигнал SIGBUS</tspan></text>
<rect x="740.0" y="190.0" width="620.0" height="76.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.3"/><text x="1050.0" y="223.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">read — прочитати вміст</tspan><tspan x="1050.0" dy="17.6">прапорець про незмінність, не про таємність</tspan></text>
<rect x="740.0" y="282.0" width="620.0" height="76.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.3"/><text x="1050.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">перейменувати батьківський каталог</tspan><tspan x="1050.0" dy="17.6">inode не чіпали — просто шлях став іншим</tspan></text>
<rect x="740.0" y="374.0" width="620.0" height="76.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.3"/><text x="1050.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">змонтувати іншу систему поверх каталогу</tspan><tspan x="1050.0" dy="17.6">за тим самим шляхом читається інший вміст</tspan></text>
<rect x="740.0" y="466.0" width="620.0" height="76.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.3"/><text x="1050.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">переформатувати носій</tspan><tspan x="1050.0" dy="17.6">разом із файловою системою зникає й inode</tspan></text>
<rect x="740.0" y="558.0" width="620.0" height="76.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.3"/><text x="1050.0" y="592.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">chattr -i з можливістю CAP_LINUX_IMMUTABLE</tspan><tspan x="1050.0" dy="17.6">хто має право поставити, той має право й зняти</tspan></text>
<rect x="60.0" y="850.0" width="1300.0" height="62.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="710.0" y="886.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">захищено об'єкт, а не шлях до нього: усе, що не чіпає сам inode, минає перевірку</tspan></text>
</svg>