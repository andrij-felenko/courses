<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">три різні відмови на той самий ioctl — і три різні висновки</text>
<text x="165.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">код помилки</text>
<text x="550.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">що це насправді означає</text>
<text x="1035.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">що з цим робити</text>
<rect x="60.0" y="120.0" width="210.0" height="110.0" rx="6" fill="#eceff3" stroke="#6b7280" stroke-width="2.0"/><text x="165.0" y="180.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">ENOTTY</tspan></text>
<rect x="300.0" y="120.0" width="500.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="550.0" y="162.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">у ядрі для цієї файлової системи</tspan><tspan x="550.0" dy="17.6">немає обробника прапорців узагалі,</tspan><tspan x="550.0" dy="17.6">і ioctl каже «недоречний виклик»</tspan></text>
<rect x="830.0" y="120.0" width="410.0" height="110.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="1035.0" y="170.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1035.0" dy="0.0">робити нічого: тут немає чого</tspan><tspan x="1035.0" dy="17.6">ані прочитати, ані поставити</tspan></text>
<rect x="60.0" y="280.0" width="210.0" height="110.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="2.0"/><text x="165.0" y="340.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">EOPNOTSUPP</tspan></text>
<rect x="300.0" y="280.0" width="500.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="550.0" y="322.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">поле є, але цього біта ФС не має —</tspan><tspan x="550.0" dy="17.6">або ви просите погасити біт,</tspan><tspan x="550.0" dy="17.6">який гасити не можна (ext4 і extents)</tspan></text>
<rect x="830.0" y="280.0" width="410.0" height="110.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.6"/><text x="1035.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1035.0" dy="0.0">звузити прохання: читати-міняти-писати</tspan><tspan x="1035.0" dy="17.6">замість запису всього поля одним числом</tspan></text>
<rect x="60.0" y="440.0" width="210.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="165.0" y="500.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">EPERM</tspan></text>
<rect x="300.0" y="440.0" width="500.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="550.0" y="482.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">поле є, біт є, бракує повноваження:</tspan><tspan x="550.0" dy="17.6">саме i та a вимагають</tspan><tspan x="550.0" dy="17.6">можливості CAP_LINUX_IMMUTABLE</tspan></text>
<rect x="830.0" y="440.0" width="410.0" height="110.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/><text x="1035.0" y="491.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1035.0" dy="0.0">дати процесові цю можливість —</tspan><tspan x="1035.0" dy="17.6">і не забувати, що вона ж дозволяє зняти</tspan></text>
<rect x="60.0" y="580.0" width="1180.0" height="64.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="650.0" y="617.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">«нема де», «є, та не це» і «є, та не тобі» — програма, що друкує лише «не вдалося», викидає весь діагноз</tspan></text>
</svg>