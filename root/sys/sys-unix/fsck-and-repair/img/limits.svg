<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межі аудиту st_nlink обходом піддерева</text>
<text x="650.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">три випадки, у яких обхід за іменами не має права судити</text>
<rect x="45.0" y="62.0" width="340.0" height="58.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="2.0"/><text x="215.0" y="86.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">жорстке посилання</tspan><tspan x="215.0" dy="19.5">за межами піддерева</tspan></text>
<line x1="215.0" y1="126.0" x2="215.0" y2="152.0" stroke="#b8860b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="45.0" y="156.0" width="340.0" height="120.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="215.0" y="202.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">inode 102 має два імені:</tspan><tspan x="215.0" dy="18.2">audit/docs/note.txt</tspan><tspan x="215.0" dy="18.2">і /backup/note.txt</tspan></text>
<line x1="215.0" y1="280.0" x2="215.0" y2="306.0" stroke="#b8860b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="45.0" y="310.0" width="340.0" height="110.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.6"/><text x="215.0" y="360.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">у піддереві audit</tspan><tspan x="215.0" dy="18.2">трапилося одне ім'я</tspan></text>
<line x1="215.0" y1="424.0" x2="215.0" y2="450.0" stroke="#b8860b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="45.0" y="454.0" width="340.0" height="150.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="215.0" y="506.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">полічили 1, у полі 2.</tspan><tspan x="215.0" dy="18.2">Поле праве — неповний обхід.</tspan><tspan x="215.0" dy="18.2">Аудит піддерева доводить</tspan><tspan x="215.0" dy="18.2">«щонайменше», а не «рівно»</tspan></text>
<rect x="480.0" y="62.0" width="340.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="650.0" y="96.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">межа монтування</tspan></text>
<line x1="650.0" y1="126.0" x2="650.0" y2="152.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="480.0" y="156.0" width="340.0" height="120.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="650.0" y="202.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">у блоці каталогу — номер</tspan><tspan x="650.0" dy="18.2">накритої теки, а stat дає</tspan><tspan x="650.0" dy="18.2">корінь змонтованої системи</tspan></text>
<line x1="650.0" y1="280.0" x2="650.0" y2="306.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="480.0" y="310.0" width="340.0" height="110.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.6"/><text x="650.0" y="360.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">d_ino і st_ino на одну назву</tspan><tspan x="650.0" dy="18.2">не збігаються → далі не йдемо</tspan></text>
<line x1="650.0" y1="424.0" x2="650.0" y2="450.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="480.0" y="454.0" width="340.0" height="150.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="650.0" y="515.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">два томи — дві нумерації.</tspan><tspan x="650.0" dy="18.2">Зшити їх нічим, тож такий</tspan><tspan x="650.0" dy="18.2">запис випадає зі звіту</tspan></text>
<rect x="915.0" y="62.0" width="340.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="1085.0" y="86.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="1085.0" dy="0.0">inode, на який</tspan><tspan x="1085.0" dy="19.5">не вказує ніхто</tspan></text>
<line x1="1085.0" y1="126.0" x2="1085.0" y2="152.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="915.0" y="156.0" width="340.0" height="120.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="1085.0" y="202.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1085.0" dy="0.0">inode 217: st_nlink 1,</tspan><tspan x="1085.0" dy="18.2">дані цілі, але жоден запис</tspan><tspan x="1085.0" dy="18.2">каталогу його не називає</tspan></text>
<line x1="1085.0" y1="280.0" x2="1085.0" y2="306.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="915.0" y="310.0" width="340.0" height="110.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.6"/><text x="1085.0" y="360.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1085.0" dy="0.0">нічого: ми ходимо іменами,</tspan><tspan x="1085.0" dy="18.2">а імені немає</tspan></text>
<line x1="1085.0" y1="424.0" x2="1085.0" y2="450.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="915.0" y="454.0" width="340.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="1085.0" y="506.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1085.0" dy="0.0">саме це четвертий прохід</tspan><tspan x="1085.0" dy="18.2">чіпляє до lost+found —</tspan><tspan x="1085.0" dy="18.2">і саме цього наш аудит</tspan><tspan x="1085.0" dy="18.2">не знайде ніколи</tspan></text>
<text x="650.0" y="640.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle"><tspan x="650.0" dy="0.0">дві перші межі програма розпізнає й мовчить;</tspan><tspan x="650.0" dy="18.2">третя — сліпа пляма, яка не подає жодного знаку</tspan></text>
</svg>