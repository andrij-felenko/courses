<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від завантаження до «Fix&lt;y&gt;?»: хто й чому запускає перевірку</text>
<rect x="500.0" y="62.0" width="400.0" height="62.0" rx="6" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.8"/><text x="700.0" y="98.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">рядок у fstab: номер проходу ≠ 0</tspan></text>
<line x1="700.0" y1="124.0" x2="700.0" y2="156.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="440.0" y="160.0" width="520.0" height="76.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="700.0" y="193.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">читаємо суперблок: чи розмонтовано чисто,</tspan><tspan x="700.0" dy="18.2">чи не стоїть позначка помилки</tspan></text>
<line x1="700.0" y1="240.0" x2="240.0" y2="296.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40.0" y="300.0" width="400.0" height="136.0" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<rect x="40.0" y="300.0" width="400.0" height="52.0" rx="10" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="240.0" y="330.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">чисто розмонтовано</tspan></text>
<rect x="60.0" y="364.0" width="360.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="240.0" y="389.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">повної перевірки не буде</tspan><tspan x="240.0" dy="16.9">взагалі — просто монтуємо</tspan></text>
<line x1="700.0" y1="240.0" x2="700.0" y2="296.0" stroke="#b8860b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="500.0" y="300.0" width="400.0" height="136.0" rx="10" fill="#ffffff" stroke="#b8860b" stroke-width="1.8"/>
<rect x="500.0" y="300.0" width="400.0" height="52.0" rx="10" fill="#fff6e5" stroke="#b8860b" stroke-width="1.8"/><text x="700.0" y="321.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">стоїть позначка помилки</tspan><tspan x="700.0" dy="18.2">або задано fsck.mode=force</tspan></text>
<rect x="520.0" y="364.0" width="360.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="700.0" y="389.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">повна перевірка тому</tspan><tspan x="700.0" dy="16.9">в режимі preen</tspan></text>
<line x1="700.0" y1="240.0" x2="1160.0" y2="296.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="960.0" y="300.0" width="400.0" height="136.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<rect x="960.0" y="300.0" width="400.0" height="52.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="1160.0" y="330.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="1160.0" dy="0.0">брудно, але журнал цілий</tspan></text>
<rect x="980.0" y="364.0" width="360.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1160.0" y="389.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1160.0" dy="0.0">ядро докочує журнал</tspan><tspan x="1160.0" dy="16.9">під час монтування — секунди</tspan></text>
<line x1="700.0" y1="440.0" x2="480.0" y2="552.0" stroke="#b8860b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="700.0" y1="440.0" x2="940.0" y2="552.0" stroke="#b8860b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="260.0" y="556.0" width="440.0" height="124.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="480.0" y="604.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">усе виправилося однозначно</tspan><tspan x="480.0" dy="18.2">код завершення 0 або 1</tspan><tspan x="480.0" dy="18.2">том монтується далі</tspan></text>
<rect x="720.0" y="556.0" width="440.0" height="124.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="940.0" y="604.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="940.0" dy="0.0">потрібне рішення людини</tspan><tspan x="940.0" dy="18.2">до коду домішано четвірку</tspan><tspan x="940.0" dy="18.2">аварійна оболонка, «Fix&lt;y&gt;?»</tspan></text>
<text x="700.0" y="730.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">повна перевірка — виняток, який вмикає сама файлова система або адміністратор</text>
</svg>