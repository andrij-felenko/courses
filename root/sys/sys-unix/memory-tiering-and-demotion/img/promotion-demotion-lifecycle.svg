<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл сторінки у системі з дворівневою пам'яттю</text>
<text x="60.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Життєвий цикл сторінки: Аллокація, Demotion, AutoNUMA та Promotion</text>
<rect x="50.0" y="80.0" width="240.0" height="100.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">1. Первинна аллокація</tspan><tspan x="170.0" dy="15.6">alloc_pages(GFP_HIGHUSER)</tspan><tspan x="170.0" dy="15.6">Виділення у швидкому</tspan><tspan x="170.0" dy="15.6">Top-tier DRAM (Вузол 0)</tspan></text>
<line x1="290.0" y1="130.0" x2="350.0" y2="130.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="350.0" y="80.0" width="240.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="470.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">2. Охолодження сторінки</tspan><tspan x="470.0" dy="15.6">Active LRU -&gt; Inactive LRU</tspan><tspan x="470.0" dy="15.6">Доступів немає,</tspan><tspan x="470.0" dy="15.6">біт Referenced скинуто</tspan></text>
<line x1="590.0" y1="130.0" x2="650.0" y2="130.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="650.0" y="80.0" width="240.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="770.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">3. Витіснення kswapd</tspan><tspan x="770.0" dy="15.6">Пам'ять DRAM &lt; WMARK_LOW</tspan><tspan x="770.0" dy="15.6">shrink_folio_list()</tspan><tspan x="770.0" dy="15.6">-&gt; demote_page_list()</tspan></text>
<line x1="890.0" y1="130.0" x2="950.0" y2="130.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="950.0" y="80.0" width="200.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1050.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">4. Запис у CXL RAM</tspan><tspan x="1050.0" dy="15.6">Копіювання RAM-to-RAM,</tspan><tspan x="1050.0" dy="15.6">оновлення PTE на Вузол 2,</tspan><tspan x="1050.0" dy="15.6">звільнення DRAM</tspan></text>
<line x1="1050.0" y1="180.0" x2="1050.0" y2="270.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="800.0" y="270.0" width="350.0" height="110.0" rx="6" fill="#fbfcff" stroke="#333333" stroke-width="1.5"/><text x="975.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">5. Періодичне сканування AutoNUMA</tspan><tspan x="975.0" dy="11.7">task_numa_work() знаходить сторінку в CXL</tspan><tspan x="975.0" dy="11.7">скидає PTE прапорець Present і ставить _PAGE_NUMA (PROT_NONE)</tspan></text>
<line x1="800.0" y1="325.0" x2="720.0" y2="325.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="410.0" y="270.0" width="310.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="565.0" y="305.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">6. Повторний доступ (Trap)</tspan><tspan x="565.0" dy="15.6">CPU звертається до сторінки -&gt;</tspan><tspan x="565.0" dy="15.6">Minor Fault -&gt; do_numa_page()</tspan><tspan x="565.0" dy="15.6">Реєстрація звернення з CPU0 до Node2</tspan></text>
<line x1="410.0" y1="325.0" x2="330.0" y2="325.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="270.0" width="280.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="190.0" y="305.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">7. Оцінка гарячості</tspan><tspan x="190.0" dy="15.6">should_numa_migrate_memory()</tspan><tspan x="190.0" dy="15.6">Перевірка лімітів швидкості</tspan><tspan x="190.0" dy="15.6">(rate_limit_mbps) та ярусу</tspan></text>
<line x1="190.0" y1="380.0" x2="190.0" y2="460.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="50.0" y="460.0" width="1100.0" height="200.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="600.0" y="522.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">8. Фінальне підвищення (Page Promotion): міграція назад у швидку DRAM</tspan><tspan x="600.0" dy="16.9"></tspan><tspan x="600.0" dy="16.9">• migrate_pages() виділяє нову сторінку на Node 0 (Top-tier DRAM)</tspan><tspan x="600.0" dy="16.9">• Вміст копіюється з CXL-пам'яті у локальну DRAM (copy_highpage)</tspan><tspan x="600.0" dy="16.9">• Таблиці сторінок (PTE) процесу атомарно перемикаються на новий PFN у DRAM</tspan><tspan x="600.0" dy="16.9">• Відновлюються права доступу (PTE Present), сторінка знову читається/пишеться на швидкості 60-80 ns</tspan></text>
</svg>