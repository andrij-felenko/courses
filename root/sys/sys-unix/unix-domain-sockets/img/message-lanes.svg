<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="295.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">повідомлення, віддане в sendmsg()</text>
<rect x="60.0" y="76.0" width="470.0" height="268.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="80.0" y="96.0" width="430.0" height="80.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="132.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">смуга даних — msg_iov</tspan><tspan x="295.0" dy="16.9">байти, які програма набрала сама</tspan></text>
<rect x="80.0" y="196.0" width="430.0" height="130.0" rx="6" fill="#f8f4ea" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="240.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">керівна смуга — msg_control</tspan><tspan x="295.0" dy="16.9">cmsg_level = SOL_SOCKET</tspan><tspan x="295.0" dy="16.9">cmsg_type = SCM_RIGHTS</tspan><tspan x="295.0" dy="16.9">дані: [ 7 ]</tspan></text>
<text x="765.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">що дістав отримувач</text>
<rect x="620.0" y="96.0" width="290.0" height="80.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="765.0" y="132.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">ті самі байти</tspan><tspan x="765.0" dy="16.9">в буфері recvmsg</tspan></text>
<rect x="620.0" y="196.0" width="290.0" height="130.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="765.0" y="248.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="765.0" dy="0.0">новий дескриптор 5:</tspan><tspan x="765.0" dy="16.9">число 7 ядро прочитало саме</tspan><tspan x="765.0" dy="16.9">й підмінило посиланням</tspan></text>
<line x1="534.0" y1="136.0" x2="616.0" y2="136.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="534.0" y1="261.0" x2="616.0" y2="261.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="470.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">дані ядро лише переносить; керівну смугу воно читає й виконує</text>
</svg>