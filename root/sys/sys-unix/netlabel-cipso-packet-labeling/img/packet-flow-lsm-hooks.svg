<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл пакета: точки виклику LSM гачків та NetLabel</text>
<rect x="15.0" y="45.0" width="870.0" height="520.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="30.0" y="60.0" width="410.0" height="410.0" rx="6" fill="#f0f6fc" stroke="#0969da" stroke-width="1.5"/>
<text x="235.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0969da" text-anchor="middle" font-weight="700">ВИХІДНИЙ ШЛЯХ (TX: ВІДПРАВКА ПАКЕТА)</text>
<rect x="50.0" y="105.0" width="370.0" height="48.0" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/><text x="235.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">1. Процес створює сокет socket()</tspan><tspan x="235.0" dy="13.0">LSM hook: security_socket_post_create()</tspan><tspan x="235.0" dy="13.0">Призначення MLS-контексту процесу сокету (s1:c2)</tspan></text>
<line x1="235.0" y1="153.0" x2="235.0" y2="172.0" stroke="#0969da" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="172.0" width="370.0" height="50.0" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/><text x="235.0" y="187.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">2. NetLabel формує опції IP для сокета</tspan><tspan x="235.0" dy="13.0">netlbl_sock_setattr() → cipso_v4_sock_setattr()</tspan><tspan x="235.0" dy="13.0">Генерація CIPSO опції в inet_sk(sk)-&gt;opt</tspan></text>
<line x1="235.0" y1="222.0" x2="235.0" y2="242.0" stroke="#0969da" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="242.0" width="370.0" height="50.0" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/><text x="235.0" y="257.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">3. Системний виклик sendmsg() / connect()</tspan><tspan x="235.0" dy="13.0">Побудова sk_buff, копіювання IP опцій</tspan><tspan x="235.0" dy="13.0">Створення пакета з CIPSO Option 134 у заголовку</tspan></text>
<line x1="235.0" y1="292.0" x2="235.0" y2="312.0" stroke="#0969da" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="312.0" width="370.0" height="50.0" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/><text x="235.0" y="327.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">4. Маршрутизація та фільтрація</tspan><tspan x="235.0" dy="13.0">LSM hook: selinux_ip_postroute(skb)</tspan><tspan x="235.0" dy="13.0">Перевірка дозволу відправки для мітки пакета</tspan></text>
<line x1="235.0" y1="362.0" x2="235.0" y2="382.0" stroke="#0969da" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="382.0" width="370.0" height="50.0" rx="6" fill="#e6ffed" stroke="#1a7f37" stroke-width="1.5"/><text x="235.0" y="397.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">5. Передача в драйвер мережевої карти (NIC TX)</tspan><tspan x="235.0" dy="13.0">Пакет виходить у мережу з явним CIPSO тегом</tspan><tspan x="235.0" dy="13.0">(без шифрування, прозорий для MLS маршрутизаторів)</tspan></text>
<rect x="460.0" y="60.0" width="410.0" height="410.0" rx="6" fill="#fdf8f6" stroke="#bc4c00" stroke-width="1.5"/>
<text x="665.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#bc4c00" text-anchor="middle" font-weight="700">ВХІДНИЙ ШЛЯХ (RX: ПРИЙОМ ТА ПЕРЕВІРКА)</text>
<rect x="480.0" y="105.0" width="370.0" height="48.0" rx="6" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/><text x="665.0" y="119.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">1. Прийом пакета з мережевої карти (NIC RX)</tspan><tspan x="665.0" dy="13.0">Мережевий стек: ip_rcv() → ip_options_compile()</tspan><tspan x="665.0" dy="13.0">Виявлення IP Option 134 (CIPSO) або Option 0x07</tspan></text>
<line x1="665.0" y1="153.0" x2="665.0" y2="172.0" stroke="#bc4c00" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="480.0" y="172.0" width="370.0" height="50.0" rx="6" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/><text x="665.0" y="187.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">2. Розбір мітки NetLabel в ядрі</tspan><tspan x="665.0" dy="13.0">cipso_v4_sock_getattr() або netlbl_cache_lookup()</tspan><tspan x="665.0" dy="13.0">Трансляція DOI + чутливість + теги → netlbl_lsm_secattr</tspan></text>
<line x1="665.0" y1="222.0" x2="665.0" y2="242.0" stroke="#bc4c00" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="480.0" y="242.0" width="370.0" height="50.0" rx="6" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/><text x="665.0" y="257.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">3. Трансляція атрибутів у LSM SECID</tspan><tspan x="665.0" dy="13.0">LSM hook: security_netlbl_secattr_to_sid()</tspan><tspan x="665.0" dy="13.0">Отримання SECID вхідного пакета (напр. s1:c2)</tspan></text>
<line x1="665.0" y1="292.0" x2="665.0" y2="312.0" stroke="#bc4c00" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="480.0" y="312.0" width="370.0" height="50.0" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="665.0" y="327.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">4. Перевірка доступу до сокета (LSM Hook)</tspan><tspan x="665.0" dy="13.0">security_sock_rcv_skb(sk, skb)</tspan><tspan x="665.0" dy="13.0">MLS dominance check: рівень сокета ≥ рівень пакета</tspan></text>
<line x1="665.0" y1="362.0" x2="665.0" y2="382.0" stroke="#bc4c00" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="480.0" y="382.0" width="370.0" height="50.0" rx="6" fill="#e6ffed" stroke="#1a7f37" stroke-width="1.5"/><text x="665.0" y="397.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">5. Доставка процесу &amp; SO_PEERSEC</tspan><tspan x="665.0" dy="13.0">recvmsg() отримує дані payload</tspan><tspan x="665.0" dy="13.0">getsockopt(SO_PEERSEC) повертає MLS-контекст відправника</tspan></text>
<line x1="235.0" y1="432.0" x2="235.0" y2="490.0" stroke="#1a7f37" stroke-width="2.0"/>
<line x1="235.0" y1="490.0" x2="665.0" y2="490.0" stroke="#1a7f37" stroke-width="2.0"/>
<line x1="665.0" y1="490.0" x2="665.0" y2="432.0" stroke="#1a7f37" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="340.0" y="475.0" width="220.0" height="30.0" rx="4" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
<text x="450.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a7f37" text-anchor="middle" font-weight="700">Фізична мережа / лінія зв'язку</text>
</svg>