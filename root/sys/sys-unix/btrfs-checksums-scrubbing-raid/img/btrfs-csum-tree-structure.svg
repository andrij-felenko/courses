<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Організація зберігання контрольних сум у Btrfs</text>
<text x="300.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол метаданих (Metadata Node / Leaf)</text>
<rect x="124.7" y="142.2" width="350.6" height="95.7" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="169.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">struct btrfs_header</tspan><tspan x="300.0" dy="16.9">csum: 0x8F3A21C0 (CRC32c / xxHash / SHA256)</tspan><tspan x="300.0" dy="16.9">fsid, bytenr, flags, nritems, level</tspan><tspan x="300.0" dy="16.9">--- Елементи B-дерева (Items &amp; Keys) ---</tspan></text>
<rect x="97.9" y="404.4" width="404.2" height="71.2" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="300.0" y="428.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Контрольна сума метаданих зберігається</tspan><tspan x="300.0" dy="15.6">безпосередньо в заголовку кожного вузла.</tspan><tspan x="300.0" dy="15.6">Перевіряється під час кожного зчитування вузла з диска.</tspan></text>
<text x="900.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Файлові дані (Data Extent) та CSUM Tree</text>
<rect x="684.9" y="110.0" width="430.1" height="59.9" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="900.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Data Extent (Блок файлу на диску)</tspan><tspan x="900.0" dy="16.9">Сектор 0 (4 КіБ) | Сектор 1 (4 КіБ) | Сектор 2 (4 КіБ)</tspan></text>
<rect x="702.5" y="273.7" width="395.1" height="112.6" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="300.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">CSUM Tree (BTRFS_CSUM_TREE_OBJECTID)</tspan><tspan x="900.0" dy="16.9">Key: [EXTENT_CSUM, offset = bytenr]</tspan><tspan x="900.0" dy="16.9">struct btrfs_csum_item {</tspan><tspan x="900.0" dy="16.9">  u8 csum[]: [0x12345678, 0x9ABCDEF0, 0x55AA3377]</tspan><tspan x="900.0" dy="16.9">}</tspan></text>
<line x1="900.0" y1="175.9" x2="900.0" y2="267.7" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="697.9" y="494.4" width="404.2" height="71.2" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="900.0" y="518.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Хеші для даних зберігаються окремо в CSUM Tree.</tspan><tspan x="900.0" dy="15.6">Кожен сектор (4096 байт) має свій 32-бітний запис хешу.</tspan><tspan x="900.0" dy="15.6">Відокремлення хешів захищає від фантомних записів.</tspan></text>
<line x1="600.0" y1="40.0" x2="600.0" y2="640.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 6"/>
</svg>