<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура автоматизації програми через PTY</text>
<rect x="30.0" y="60.0" width="310.0" height="420.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.4"/>
<text x="185.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Процес-керівник (Driver)</text>
<text x="185.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Expect / Python pexpect / C++ демон</text>
<rect x="50.0" y="130.0" width="270.0" height="70.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="185.0" y="153.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">Ведучий кінець (Master FD)</tspan><tspan x="185.0" dy="15.6">posix_openpt() / open('/dev/ptmx')</tspan><tspan x="185.0" dy="15.6">читання виводу та запис команд</tspan></text>
<rect x="50.0" y="220.0" width="270.0" height="100.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="185.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">Скінченний автомат:</tspan><tspan x="185.0" dy="15.6">1. Очікує підказку ('Password:')</tspan><tspan x="185.0" dy="15.6">2. Перевіряє регулярні вирази</tspan><tspan x="185.0" dy="15.6">3. Надсилає відповідь ('секрет\r')</tspan><tspan x="185.0" dy="15.6">4. Контролює таймаути</tspan></text>
<rect x="50.0" y="340.0" width="270.0" height="70.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="185.0" y="363.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">Обробка завершення:</tspan><tspan x="185.0" dy="15.6">read() повертає EIO на Linux</tspan><tspan x="185.0" dy="15.6">waitpid(child_pid, &amp;status, 0)</tspan></text>
<rect x="50.0" y="424.0" width="270.0" height="42.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="185.0" y="448.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">Повна ізоляція облікових даних</tspan></text>
<rect x="370.0" y="60.0" width="320.0" height="420.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.4"/>
<text x="530.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ядро Linux: підсистема PTY</text>
<rect x="390.0" y="120.0" width="280.0" height="80.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="142.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Лінійна дисципліна підлеглого кінця:</tspan><tspan x="530.0" dy="14.3">- Буферизація рядків (ICANON)</tspan><tspan x="530.0" dy="14.3">- Обробка відлуння (ECHO)</tspan><tspan x="530.0" dy="14.3">- Перетворення \r в \n (ICRNL)</tspan></text>
<rect x="390.0" y="220.0" width="280.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="251.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Клон-пристрій /dev/ptmx</tspan><tspan x="530.0" dy="15.6">та вузол /dev/pts/N у devpts</tspan></text>
<rect x="390.0" y="310.0" width="280.0" height="80.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Прив'язка сеансу (TIOCSCTTY):</tspan><tspan x="530.0" dy="14.3">/dev/pts/N стає керівним терміналом</tspan><tspan x="530.0" dy="14.3">для нового сеансу</tspan></text>
<rect x="390.0" y="410.0" width="280.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="434.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Сигнали та розрив:</tspan><tspan x="530.0" dy="14.3">Закриття master_fd → SIGHUP дитині</tspan></text>
<rect x="720.0" y="60.0" width="310.0" height="420.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.4"/>
<text x="875.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Цільова програма (Child)</text>
<text x="875.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">sudo / ssh / passwd / fdisk</text>
<rect x="740.0" y="130.0" width="270.0" height="70.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="875.0" y="153.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">Власний сеанс (setsid()):</tspan><tspan x="875.0" dy="15.6">/dev/pts/N як дескриптори 0, 1, 2</tspan><tspan x="875.0" dy="15.6">isatty(0) == 1 (справжній TTY)</tspan></text>
<rect x="740.0" y="220.0" width="270.0" height="80.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="875.0" y="248.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">Прямий доступ до /dev/tty:</tspan><tspan x="875.0" dy="15.6">open('/dev/tty') відкриває /dev/pts/N</tspan><tspan x="875.0" dy="15.6">Запит пароля йде в псевдотермінал</tspan></text>
<rect x="740.0" y="320.0" width="270.0" height="80.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="875.0" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">Режим termios без помилок:</tspan><tspan x="875.0" dy="15.6">tcgetattr / tcsetattr успішні,</tspan><tspan x="875.0" dy="15.6">програма вважає, що працює людина</tspan></text>
<rect x="740.0" y="420.0" width="270.0" height="46.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="875.0" y="446.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="875.0" dy="0.0">Звичайна взаємодія без падінь</tspan></text>
<line x1="322.0" y1="160.0" x2="388.0" y2="160.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="355.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">write</text>
<line x1="388.0" y1="250.0" x2="322.0" y2="250.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="355.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">read</text>
<line x1="672.0" y1="160.0" x2="738.0" y2="160.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="705.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">read</text>
<line x1="738.0" y1="250.0" x2="672.0" y2="250.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="705.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">write</text>
</svg>