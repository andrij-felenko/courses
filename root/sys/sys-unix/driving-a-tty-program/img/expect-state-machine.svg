<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат взаємодії Expect</text>
<rect x="40.0" y="70.0" width="200.0" height="70.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="140.0" y="93.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">1. SPAWN</tspan><tspan x="140.0" dy="15.6">Створення PTY і запуск</tspan><tspan x="140.0" dy="15.6">дочірньої програми</tspan></text>
<line x1="242.0" y1="105.0" x2="308.0" y2="105.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="310.0" y="60.0" width="240.0" height="90.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="85.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">2. READ_BUFFER</tspan><tspan x="430.0" dy="15.6">Зчитування байтів із PTY</tspan><tspan x="430.0" dy="15.6">у ковзний віконний буфер</tspan><tspan x="430.0" dy="15.6">(перевірка таймауту)</tspan></text>
<line x1="552.0" y1="105.0" x2="618.0" y2="105.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="620.0" y="50.0" width="250.0" height="110.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="745.0" y="85.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">3. PATTERN_MATCH</tspan><tspan x="745.0" dy="15.6">Зіставлення вмісту буфера</tspan><tspan x="745.0" dy="15.6">із переліком очікуваних</tspan><tspan x="745.0" dy="15.6">регулярних виразів</tspan></text>
<line x1="745.0" y1="162.0" x2="745.0" y2="238.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="755.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">пароль / підказка</text>
<rect x="620.0" y="240.0" width="250.0" height="80.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="745.0" y="260.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">4a. SEND RESPONSE</tspan><tspan x="745.0" dy="15.6">Надсилання рядка з '\r'</tspan><tspan x="745.0" dy="15.6">(send 'пароль\r')</tspan><tspan x="745.0" dy="15.6">Очищення знайденого префікса</tspan></text>
<line x1="620.0" y1="280.0" x2="430.0" y2="280.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="430.0" y1="280.0" x2="430.0" y2="152.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="520.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">наступний крок діалогу</text>
<line x1="872.0" y1="85.0" x2="948.0" y2="85.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="910.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">timeout</text>
<rect x="950.0" y="55.0" width="90.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="995.0" y="82.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="995.0" dy="0.0">TIMEOUT</tspan><tspan x="995.0" dy="11.7">Помилка / abort</tspan></text>
<line x1="872.0" y1="130.0" x2="948.0" y2="170.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="910.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">EOF / EIO</text>
<rect x="900.0" y="180.0" width="140.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="970.0" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">EOF</tspan><tspan x="970.0" dy="14.3">Успішне завершення</tspan><tspan x="970.0" dy="14.3">waitpid() статусу</tspan></text>
<rect x="620.0" y="360.0" width="250.0" height="60.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="745.0" y="378.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">4b. INTERACT</tspan><tspan x="745.0" dy="15.6">Перемикання нашого термінала</tspan><tspan x="745.0" dy="15.6">в сирий режим: оператор керує сам</tspan></text>
<line x1="745.0" y1="322.0" x2="745.0" y2="358.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="40.0" y="360.0" width="510.0" height="60.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="295.0" y="378.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">Інваріант безпеки:</tspan><tspan x="295.0" dy="15.6">Скінченний автомат надсилає введення лише ПІСЛЯ появи підказки,</tspan><tspan x="295.0" dy="15.6">що гарантує завершення відключення ECHO програмою.</tspan></text>
</svg>