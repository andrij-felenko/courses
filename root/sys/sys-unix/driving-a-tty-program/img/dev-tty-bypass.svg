<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обхід стандартних потоків через /dev/tty</text>
<text x="530.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Спроба конвеєрного введення: echo 'пароль' | sudo / passwd</text>
<rect x="40.0" y="70.0" width="310.0" height="360.0" rx="6" fill="#fdf6f5" stroke="#c0392b" stroke-width="1.4"/>
<text x="195.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Стандартні потоки (перенаправлені)</text>
<rect x="60.0" y="120.0" width="270.0" height="60.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="195.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">fd 0 (stdin)</tspan><tspan x="195.0" dy="15.6">труба від echo 'пароль'</tspan></text>
<rect x="60.0" y="200.0" width="270.0" height="60.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="195.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">fd 1 (stdout)</tspan><tspan x="195.0" dy="15.6">перенаправлено у файл або пайп</tspan></text>
<rect x="60.0" y="280.0" width="270.0" height="60.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="195.0" y="306.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">fd 2 (stderr)</tspan><tspan x="195.0" dy="15.6">перенаправлено або термінал</tspan></text>
<rect x="60.0" y="360.0" width="270.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="195.0" y="382.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">isatty(0) повертає 0 (хибно)</tspan><tspan x="195.0" dy="14.3">tcgetattr(0) дає помилку ENOTTY</tspan></text>
<rect x="400.0" y="70.0" width="260.0" height="360.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.4"/>
<text x="530.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтерактивний процес</text>
<text x="530.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">sudo / passwd / ssh</text>
<rect x="420.0" y="140.0" width="220.0" height="90.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="165.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Функція getpass(3):</tspan><tspan x="530.0" dy="15.6">1. open('/dev/tty', O_RDWR)</tspan><tspan x="530.0" dy="15.6">2. tcgetattr(&amp;termios)</tspan><tspan x="530.0" dy="15.6">3. вимикає прапорець ECHO</tspan></text>
<rect x="420.0" y="250.0" width="220.0" height="70.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="530.0" y="273.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Програма ігнорує fd 0</tspan><tspan x="530.0" dy="15.6">і запитує пароль прямо</tspan><tspan x="530.0" dy="15.6">через новий дескриптор tty</tspan></text>
<rect x="420.0" y="340.0" width="220.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="364.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Результат конвеєра:</tspan><tspan x="530.0" dy="14.3">пароль із труби не прочитано,</tspan><tspan x="530.0" dy="14.3">команда вимагає TTY або падає</tspan></text>
<rect x="710.0" y="70.0" width="310.0" height="360.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.4"/>
<text x="865.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Керівний термінал сеансу</text>
<text x="865.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">/dev/tty вказує на поточний TTY сеансу</text>
<rect x="730.0" y="140.0" width="270.0" height="70.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="865.0" y="163.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">Фізична клавіатура та екран</tspan><tspan x="865.0" dy="15.6">або зовнішній /dev/pts/N</tspan><tspan x="865.0" dy="15.6">(де сидить користувач)</tspan></text>
<rect x="730.0" y="230.0" width="270.0" height="80.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="865.0" y="258.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">Ядро надсилає запит:</tspan><tspan x="865.0" dy="15.6">[sudo] password for user:</tspan><tspan x="865.0" dy="15.6">прямо на екран оператора</tspan></text>
<rect x="730.0" y="330.0" width="270.0" height="80.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="865.0" y="359.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">Читання символів без відлуння:</tspan><tspan x="865.0" dy="14.3">користувач має ввести пароль вручну,</tspan><tspan x="865.0" dy="14.3">або open('/dev/tty') поверне ENXIO</tspan></text>
<line x1="332.0" y1="150.0" x2="398.0" y2="150.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="365.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">ігнор</text>
<line x1="642.0" y1="175.0" x2="728.0" y2="175.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="685.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">open()</text>
<line x1="728.0" y1="270.0" x2="642.0" y2="270.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="685.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">read()</text>
</svg>