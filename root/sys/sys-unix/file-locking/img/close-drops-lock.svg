<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому POSIX-замок зникає від чужого close</text>
<text x="241.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ваш код</text>
<text x="590.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">стороння бібліотека</text>
<text x="899.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">стан вашого замка</text>
<text x="36.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">час</text>
<line x1="36.0" y1="116.0" x2="36.0" y2="596.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="66.0" y="138.0" width="350.0" height="54.0" rx="6" fill="#eef3fb" stroke="#1a1a1a" stroke-width="1.4"/><text x="241.0" y="169.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="241.0" dy="0.0">open(&quot;db&quot;, O_RDWR) → fd 3</tspan></text>
<rect x="774.0" y="138.0" width="250.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="899.0" y="169.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="899.0" dy="0.0">вільно</tspan></text>
<rect x="66.0" y="218.0" width="350.0" height="54.0" rx="6" fill="#eef3fb" stroke="#1a1a1a" stroke-width="1.4"/><text x="241.0" y="249.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="241.0" dy="0.0">fcntl(fd 3, F_SETLK, WRITE)</tspan></text>
<rect x="774.0" y="218.0" width="250.0" height="54.0" rx="6" fill="#eaf7ee" stroke="#6b7280" stroke-width="1.2"/><text x="899.0" y="249.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="899.0" dy="0.0">тримаєте його ви</tspan></text>
<rect x="440.0" y="298.0" width="300.0" height="54.0" rx="6" fill="#f7f2ea" stroke="#6b7280" stroke-width="1.4"/><text x="590.0" y="329.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">open(&quot;db&quot;, O_RDONLY) → fd 7</tspan></text>
<rect x="774.0" y="298.0" width="250.0" height="54.0" rx="6" fill="#eaf7ee" stroke="#6b7280" stroke-width="1.2"/><text x="899.0" y="329.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="899.0" dy="0.0">тримаєте його ви</tspan></text>
<rect x="440.0" y="378.0" width="300.0" height="54.0" rx="6" fill="#f7f2ea" stroke="#6b7280" stroke-width="1.4"/><text x="590.0" y="409.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">fstat(fd 7, &amp;st)</tspan></text>
<rect x="774.0" y="378.0" width="250.0" height="54.0" rx="6" fill="#eaf7ee" stroke="#6b7280" stroke-width="1.2"/><text x="899.0" y="409.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="899.0" dy="0.0">тримаєте його ви</tspan></text>
<rect x="440.0" y="458.0" width="300.0" height="54.0" rx="6" fill="#f7f2ea" stroke="#6b7280" stroke-width="1.4"/><text x="590.0" y="489.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">close(fd 7)</tspan></text>
<rect x="774.0" y="458.0" width="250.0" height="54.0" rx="6" fill="#fdecea" stroke="#6b7280" stroke-width="1.2"/><text x="899.0" y="481.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="899.0" dy="0.0">ядро зняло ВСІ ваші</tspan><tspan x="899.0" dy="16.9">замки на цей файл</tspan></text>
<rect x="66.0" y="538.0" width="350.0" height="54.0" rx="6" fill="#eef3fb" stroke="#1a1a1a" stroke-width="1.4"/><text x="241.0" y="569.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="241.0" dy="0.0">write(fd 3, …) — без помилки</tspan></text>
<rect x="774.0" y="538.0" width="250.0" height="54.0" rx="6" fill="#fdecea" stroke="#6b7280" stroke-width="1.2"/><text x="899.0" y="569.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="899.0" dy="0.0">вільно, пише будь-хто</tspan></text>
<line x1="590.0" y1="512.0" x2="774.0" y2="485.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="5 4"/>
<text x="66.0" y="622.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start">fd 3 лишається відкритим і робочим — зникає тільки замок, і жоден виклик про це не повідомляє.</text>
<text x="66.0" y="652.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">З F_OFD_SETLK крок close(fd 7) нічого не змінює: замок належить опису, який створив ВАШ open.</text>
</svg>