<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура двійкового формату приватного ключа OpenSSH</text>
<rect x="50.0" y="45.0" width="1100.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="78.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Анатомія нового двійкового формату приватного ключа OpenSSH з захистом KDF bcrypt</tspan></text>
<rect x="50.0" y="115.0" width="1100.0" height="46.0" rx="6" fill="#e6f7ff" stroke="#0077b6" stroke-width="1.5"/><text x="600.0" y="142.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">-----BEGIN OPENSSH PRIVATE KEY----- (Base64 обгортка)  |  Магічний заголовок: 'openssh-key-v1\0'</tspan></text>
<rect x="50.0" y="175.0" width="345.0" height="160.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="222.5" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="222.5" dy="0.0">Відкритий заголовок метаданих:</tspan><tspan x="222.5" dy="15.6"></tspan><tspan x="222.5" dy="15.6">• cipher_name: 'aes256-ctr' / 'none'</tspan><tspan x="222.5" dy="15.6">• kdf_name: 'bcrypt' / 'none'</tspan><tspan x="222.5" dy="15.6">• kdf_options: salt (16 байт) + rounds (число)</tspan><tspan x="222.5" dy="15.6">• num_keys: кількість ключів у файлі (1)</tspan></text>
<rect x="410.0" y="175.0" width="345.0" height="160.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="582.5" y="212.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="582.5" dy="0.0">Відкритий публічний ключ:</tspan><tspan x="582.5" dy="15.6"></tspan><tspan x="582.5" dy="15.6">• string: 'ssh-ed25519'</tspan><tspan x="582.5" dy="15.6">• string: 32 байти публічного ключа</tspan><tspan x="582.5" dy="15.6"></tspan><tspan x="582.5" dy="15.6">(Зручно для ssh-agent без потреби</tspan><tspan x="582.5" dy="15.6">розшифровувати закрите тіло ключа)</tspan></text>
<rect x="770.0" y="175.0" width="380.0" height="160.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="960.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">Зашифроване тіло приватного ключа:</tspan><tspan x="960.0" dy="15.6"></tspan><tspan x="960.0" dy="15.6">• Шифрується шифром AES-256-CTR або ChaCha20</tspan><tspan x="960.0" dy="15.6">• Ключ шифрування генерується через KDF:</tspan><tspan x="960.0" dy="15.6">  key, iv = bcrypt_pbkdf(passphrase, salt, rounds)</tspan><tspan x="960.0" dy="15.6">• Параметр -a 100 задає 100 раундів KDF</tspan></text>
<rect x="50.0" y="350.0" width="1100.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="375.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Розшифрований вміст (Payload приватного ключа у пам'яті):</tspan></text>
<rect x="50.0" y="405.0" width="200.0" height="180.0" rx="6" fill="#e6f7ff" stroke="#0077b6" stroke-width="1.5"/><text x="150.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">checkint1 &amp; checkint2</tspan><tspan x="150.0" dy="14.3"></tspan><tspan x="150.0" dy="14.3">2 x uint32</tspan><tspan x="150.0" dy="14.3"></tspan><tspan x="150.0" dy="14.3">Якщо після дешифрування</tspan><tspan x="150.0" dy="14.3">checkint1 == checkint2,</tspan><tspan x="150.0" dy="14.3">парольна фраза вірна</tspan></text>
<rect x="270.0" y="405.0" width="210.0" height="180.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="375.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">key_type</tspan><tspan x="375.0" dy="14.3"></tspan><tspan x="375.0" dy="14.3">string</tspan><tspan x="375.0" dy="14.3"></tspan><tspan x="375.0" dy="14.3">'ssh-ed25519'</tspan><tspan x="375.0" dy="14.3">(мусить збігатися з</tspan><tspan x="375.0" dy="14.3">відкритим заголовком)</tspan></text>
<rect x="500.0" y="405.0" width="260.0" height="180.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">public_key &amp; private_key</tspan><tspan x="630.0" dy="14.3"></tspan><tspan x="630.0" dy="14.3">bytes</tspan><tspan x="630.0" dy="14.3"></tspan><tspan x="630.0" dy="14.3">Публічний ключ (32 байти)</tspan><tspan x="630.0" dy="14.3">та закритий ключ</tspan><tspan x="630.0" dy="14.3">(32 байти seed + 32 байти pub)</tspan></text>
<rect x="780.0" y="405.0" width="200.0" height="180.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="880.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">comment</tspan><tspan x="880.0" dy="14.3"></tspan><tspan x="880.0" dy="14.3">string</tspan><tspan x="880.0" dy="14.3"></tspan><tspan x="880.0" dy="14.3">Коментар користувача:</tspan><tspan x="880.0" dy="14.3">user@workstation або</tspan><tspan x="880.0" dy="14.3">опис призначення ключа</tspan></text>
<rect x="1000.0" y="405.0" width="150.0" height="180.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1075.0" y="459.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="1075.0" dy="0.0">padding</tspan><tspan x="1075.0" dy="13.0"></tspan><tspan x="1075.0" dy="13.0">1..8 байтів</tspan><tspan x="1075.0" dy="13.0"></tspan><tspan x="1075.0" dy="13.0">Вирівнювання</tspan><tspan x="1075.0" dy="13.0">розміру під блок шифру</tspan><tspan x="1075.0" dy="13.0">(байти 1, 2, 3...)</tspan></text>
<rect x="50.0" y="605.0" width="1100.0" height="75.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="638.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Захист від перебору: застарілий формат PEM/OpenSSL використовував швидкі хеші MD5/SHA1 (мільйони спроб/сек на GPU).</tspan><tspan x="600.0" dy="15.6">Новий KDF bcrypt із параметром -a 100 змушує виконувати мільйони ітерацій Blowfish, роблячи офлайн-брутфорс непідйомним.</tspan></text>
</svg>