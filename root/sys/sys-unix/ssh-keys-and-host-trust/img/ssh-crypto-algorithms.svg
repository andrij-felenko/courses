<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Криптографічні алгоритми ключів у SSH</text>
<rect x="50.0" y="45.0" width="1100.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="79.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Криптографічні алгоритми ключів SSH: математична основа, стійкість і ризики</tspan></text>
<rect x="50.0" y="120.0" width="340.0" height="44.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="146.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Ed25519 (Сучасний канон)</tspan></text>
<rect x="430.0" y="120.0" width="340.0" height="44.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="600.0" y="146.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ECDSA (NIST P-256 / P-384)</tspan></text>
<rect x="810.0" y="120.0" width="340.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="980.0" y="146.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="980.0" dy="0.0">RSA (3072–4096 біт)</tspan></text>
<rect x="50.0" y="175.0" width="340.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="207.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Основа:</tspan><tspan x="220.0" dy="11.7">Скручена крива Едвардса (Curve25519) над полем 2^255 - 19</tspan></text>
<rect x="50.0" y="253.0" width="340.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="284.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Розмір ключа:</tspan><tspan x="220.0" dy="14.3">Публічний: 32 байти · Підпис: 64 байти</tspan></text>
<rect x="50.0" y="331.0" width="340.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="363.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Підпис:</tspan><tspan x="220.0" dy="11.7">Детерміністичний: nonce обчислюється як SHA-512(k_priv || msg)</tspan></text>
<rect x="50.0" y="409.0" width="340.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="441.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Стійкість до атак:</tspan><tspan x="220.0" dy="11.7">Арифметика за сталий час (constant-time) — захист від timing</tspan></text>
<rect x="50.0" y="487.0" width="340.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="519.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Генератор чисел:</tspan><tspan x="220.0" dy="11.7">Не залежить від генератора випадкових чисел під час підпису</tspan></text>
<rect x="50.0" y="565.0" width="340.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="597.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Вердикт:</tspan><tspan x="220.0" dy="11.7">Рекомендований вибір за замовчуванням у сучасному OpenSSH</tspan></text>
<rect x="430.0" y="175.0" width="340.0" height="70.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="600.0" y="207.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Основа:</tspan><tspan x="600.0" dy="11.7">Криві Вейєрштрасса за стандартом NIST (P-256 / secp256r1)</tspan></text>
<rect x="430.0" y="253.0" width="340.0" height="70.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="600.0" y="284.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Розмір ключа:</tspan><tspan x="600.0" dy="14.3">Публічний: 64 байти · Підпис: 64 байти</tspan></text>
<rect x="430.0" y="331.0" width="340.0" height="70.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="600.0" y="363.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Підпис:</tspan><tspan x="600.0" dy="11.7">Недетерміністичний: вимагає унікального випадкового числа k</tspan></text>
<rect x="430.0" y="409.0" width="340.0" height="70.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="600.0" y="441.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Стійкість до атак:</tspan><tspan x="600.0" dy="13.0">Фатальна вразливість: повтор k розкриває закритий ключ</tspan></text>
<rect x="430.0" y="487.0" width="340.0" height="70.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="600.0" y="519.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Генератор чисел:</tspan><tspan x="600.0" dy="11.7">Недовіра до походження коефіцієнтів NIST (Dual_EC_DRBG слід)</tspan></text>
<rect x="430.0" y="565.0" width="340.0" height="70.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="600.0" y="597.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Вердикт:</tspan><tspan x="600.0" dy="11.7">Допустимий лише за вимогами регуляторів (FIPS), ризикований</tspan></text>
<rect x="810.0" y="175.0" width="340.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="980.0" y="207.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">Основа:</tspan><tspan x="980.0" dy="11.7">Факторизація добутку двох великих простих чисел (n = p * q)</tspan></text>
<rect x="810.0" y="253.0" width="340.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="980.0" y="285.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">Розмір ключа:</tspan><tspan x="980.0" dy="11.7">Публічний/підпис: 384–512 байтів (для ключів 3072–4096 біт)</tspan></text>
<rect x="810.0" y="331.0" width="340.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="980.0" y="363.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">Підпис:</tspan><tspan x="980.0" dy="11.7">PKCS#1 v1.5 або PSS; ssh-rsa (SHA-1) заблоковано в OpenSSH 8.8+</tspan></text>
<rect x="810.0" y="409.0" width="340.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="980.0" y="441.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">Стійкість до атак:</tspan><tspan x="980.0" dy="11.7">Вразливий до timing-атак без blinding; повільна генерація</tspan></text>
<rect x="810.0" y="487.0" width="340.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="980.0" y="518.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">Генератор чисел:</tspan><tspan x="980.0" dy="14.3">Потребує багато ентропії для пошуку простих чисел</tspan></text>
<rect x="810.0" y="565.0" width="340.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="980.0" y="597.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">Вердикт:</tspan><tspan x="980.0" dy="11.7">Legacy: безпечний лише з розміром &gt;= 3072 біт та rsa-sha2-512</tspan></text>
<rect x="50.0" y="650.0" width="1100.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="678.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Застарілий алгоритм DSA (1024-біт, SHA-1) повністю видалений з OpenSSH через слабку стійкість та вразливість до витоку k</tspan></text>
</svg>