<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механіка авторизації та обмежувальні опції authorized_keys</text>
<rect x="50.0" y="40.0" width="1100.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="73.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Механізм автентифікації клієнта за ключем та конвеєр обмежень в authorized_keys</tspan></text>
<rect x="50.0" y="115.0" width="280.0" height="480.0" rx="6" fill="#e6f7ff" stroke="#0077b6" stroke-width="1.5"/><text x="190.0" y="237.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Клієнт SSH (ssh user@host)</tspan><tspan x="190.0" dy="14.3"></tspan><tspan x="190.0" dy="14.3">1. Оголошення відкритого ключа:</tspan><tspan x="190.0" dy="14.3">SSH_MSG_USERAUTH_REQUEST</tspan><tspan x="190.0" dy="14.3">(publickey, id_ed25519.pub)</tspan><tspan x="190.0" dy="14.3"></tspan><tspan x="190.0" dy="14.3">2. Сервер надсилає Challenge</tspan><tspan x="190.0" dy="14.3">(Session ID + підписані дані)</tspan><tspan x="190.0" dy="14.3"></tspan><tspan x="190.0" dy="14.3">3. Клієнт підписує закритим ключем:</tspan><tspan x="190.0" dy="14.3">sig = Ed25519_Sign(priv_key, challenge)</tspan><tspan x="190.0" dy="14.3"></tspan><tspan x="190.0" dy="14.3">4. Відправка підпису серверу:</tspan><tspan x="190.0" dy="14.3">SSH_MSG_USERAUTH_REQUEST</tspan><tspan x="190.0" dy="14.3">(згенерований підпис sig)</tspan><tspan x="190.0" dy="14.3"></tspan><tspan x="190.0" dy="14.3">Клієнт НІКОЛИ не передає</tspan><tspan x="190.0" dy="14.3">закритий ключ мережею!</tspan></text>
<rect x="360.0" y="115.0" width="360.0" height="480.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="540.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Сервер SSH: Перевірка прав та ключів</tspan><tspan x="540.0" dy="15.6"></tspan><tspan x="540.0" dy="15.6">Крок 1: StrictModes (права у VFS):</tspan><tspan x="540.0" dy="15.6">• ~/.ssh має права 0700, власник UID</tspan><tspan x="540.0" dy="15.6">• authorized_keys має 0600, власник UID</tspan><tspan x="540.0" dy="15.6">• /home/user не має права w для group/other</tspan><tspan x="540.0" dy="15.6">Якщо права слабкі -&gt; відмова в доступі!</tspan><tspan x="540.0" dy="15.6"></tspan><tspan x="540.0" dy="15.6">Крок 2: Пошук ключа:</tspan><tspan x="540.0" dy="15.6">Читання рядків ~/.ssh/authorized_keys</tspan><tspan x="540.0" dy="15.6">Звірка публічного ключа з запитом</tspan><tspan x="540.0" dy="15.6"></tspan><tspan x="540.0" dy="15.6">Крок 3: Криптографічна перевірка:</tspan><tspan x="540.0" dy="15.6">Ed25519_Verify(pub_key, challenge, sig)</tspan><tspan x="540.0" dy="15.6">Підпис валідний -&gt; ключ підтверджено</tspan></text>
<rect x="750.0" y="115.0" width="400.0" height="480.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="950.0" y="242.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">Сервер: Застосування опцій authorized_keys</tspan><tspan x="950.0" dy="15.6"></tspan><tspan x="950.0" dy="15.6">Перевірка мережевих обмежень:</tspan><tspan x="950.0" dy="15.6">• from=&quot;192.168.1.0/24&quot; -&gt; звірка IP клієнта</tspan><tspan x="950.0" dy="15.6">  (якщо IP поза діапазоном -&gt; EPERM)</tspan><tspan x="950.0" dy="15.6"></tspan><tspan x="950.0" dy="15.6">Блокування небажаних каналів:</tspan><tspan x="950.0" dy="15.6">• no-port-forwarding -&gt; заборона TCP тунелів</tspan><tspan x="950.0" dy="15.6">• no-X11-forwarding -&gt; заборона X11 сесій</tspan><tspan x="950.0" dy="15.6">• no-agent-forwarding -&gt; заборона прокидання ssh-agent</tspan><tspan x="950.0" dy="15.6">• no-pty -&gt; заборона виділення псевдотермінала</tspan><tspan x="950.0" dy="15.6"></tspan><tspan x="950.0" dy="15.6">Примусова команда (Forced Command):</tspan><tspan x="950.0" dy="15.6">• command=&quot;/usr/local/bin/backup.sh&quot;</tspan><tspan x="950.0" dy="15.6">  Оригінальна команда клієнта зберігається</tspan><tspan x="950.0" dy="15.6">  у змінній SSH_ORIGINAL_COMMAND</tspan></text>
<rect x="50.0" y="615.0" width="1100.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="650.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Сучасний канон: використання опції 'restrict' вмикає повну ізоляцію за замовчуванням (вимикає pty, порти, агент, X11, user-rc), після чого дозволяються лише потрібні дії: restrict,command=&quot;/opt/app/sync.sh&quot;,from=&quot;10.0.0.0/8&quot;</tspan></text>
</svg>