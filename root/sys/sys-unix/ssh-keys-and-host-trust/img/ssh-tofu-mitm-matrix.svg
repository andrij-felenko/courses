<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель перевірки хоста за принципом TOFU та матриця станів</text>
<rect x="50.0" y="40.0" width="1100.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="73.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Модель довіри до сервера: TOFU (Trust On First Use) та розпізнавання атак MITM</tspan></text>
<rect x="50.0" y="115.0" width="320.0" height="100.0" rx="6" fill="#e6f7ff" stroke="#0077b6" stroke-width="1.5"/><text x="210.0" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Клієнт підключається до сервера</tspan><tspan x="210.0" dy="16.9"></tspan><tspan x="210.0" dy="16.9">Сервер надсилає свій Host Public Key</tspan><tspan x="210.0" dy="16.9">під час обміну ключами (KEX)</tspan></text>
<rect x="440.0" y="115.0" width="320.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="152.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Пошук хоста у файлі</tspan><tspan x="600.0" dy="16.9">~/.ssh/known_hosts</tspan><tspan x="600.0" dy="16.9">(порівняння hostname/IP або хешу)</tspan></text>
<line x1="370.0" y1="165.0" x2="440.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="215.0" x2="210.0" y2="280.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="280.0" width="320.0" height="220.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="352.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Сценарій 1: Ключ збігається</tspan><tspan x="210.0" dy="11.7">(Status: Known &amp; Valid)</tspan><tspan x="210.0" dy="11.7"></tspan><tspan x="210.0" dy="11.7">• Відбиток хоста знайдено в known_hosts</tspan><tspan x="210.0" dy="11.7">• Публічний ключ повністю ідентичний</tspan><tspan x="210.0" dy="11.7"></tspan><tspan x="210.0" dy="11.7">Результат: З'єднання дозволено автоматично без жодних запитів.</tspan><tspan x="210.0" dy="11.7">Сеанс безпечно зашифровано.</tspan></text>
<line x1="600.0" y1="215.0" x2="600.0" y2="280.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="440.0" y="280.0" width="320.0" height="220.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="600.0" y="346.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Сценарій 2: Перше підключення</tspan><tspan x="600.0" dy="11.7">(Status: Unknown Host - TOFU)</tspan><tspan x="600.0" dy="11.7"></tspan><tspan x="600.0" dy="11.7">• Запис про хост відсутній</tspan><tspan x="600.0" dy="11.7">• Інтерактивне попередження:</tspan><tspan x="600.0" dy="11.7">  'Are you sure you want to continue?'</tspan><tspan x="600.0" dy="11.7">• Користувач підтверджує (yes)</tspan><tspan x="600.0" dy="11.7"></tspan><tspan x="600.0" dy="11.7">Результат: Відбиток записується у ~/.ssh/known_hosts на майбутнє.</tspan></text>
<line x1="600.0" y1="215.0" x2="990.0" y2="280.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="830.0" y="280.0" width="320.0" height="220.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="990.0" y="352.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="990.0" dy="0.0">Сценарій 3: Ключ НЕ збігається!</tspan><tspan x="990.0" dy="11.7">(Status: Key Mismatch / MITM)</tspan><tspan x="990.0" dy="11.7"></tspan><tspan x="990.0" dy="11.7">• У known_hosts записано один ключ,</tspan><tspan x="990.0" dy="11.7">  а сервер надав інший!</tspan><tspan x="990.0" dy="11.7">• ТРИВОГА: 'REMOTE HOST IDENTIFICATION HAS CHANGED!'</tspan><tspan x="990.0" dy="11.7"></tspan><tspan x="990.0" dy="11.7">Результат: З'єднання МИТТЄВО БЛОКУЄТЬСЯ для захисту від Man-in-the-Middle.</tspan></text>
<rect x="50.0" y="525.0" width="540.0" height="140.0" rx="6" fill="#e6f7ff" stroke="#0077b6" stroke-width="1.5"/><text x="320.0" y="568.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Конфіденційність клієнта (HashKnownHosts):</tspan><tspan x="320.0" dy="15.6"></tspan><tspan x="320.0" dy="15.6">Опція 'HashKnownHosts yes' замінює відкриті імена серверів на HMAC-SHA1:</tspan><tspan x="320.0" dy="15.6">|1|base64_salt|base64_hash ssh-ed25519 AAAA...</tspan><tspan x="320.0" dy="15.6">При викраденні файлу зловмисник не бачить списку відвідуваних серверів.</tspan></text>
<rect x="610.0" y="525.0" width="540.0" height="140.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="880.0" y="568.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Ротація ключів сервера (UpdateHostKeys):</tspan><tspan x="880.0" dy="15.6"></tspan><tspan x="880.0" dy="15.6">Опція 'UpdateHostKeys yes' дозволяє серверу надсилати нові хост-ключі</tspan><tspan x="880.0" dy="15.6">під час вже встановленого та довіреного сеансу. Клієнт автоматично додає їх</tspan><tspan x="880.0" dy="15.6">у known_hosts, уникаючи ручних помилок інженерів при плановій зміні ключів.</tspan></text>
</svg>