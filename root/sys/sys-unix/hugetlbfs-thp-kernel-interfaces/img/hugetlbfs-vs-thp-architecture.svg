<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="20.0" width="390.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="44.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">Явні великі сторінки: hugetlbfs</tspan></text>
<rect x="460.0" y="20.0" width="390.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="655.0" y="44.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Прозорі великі сторінки: THP</tspan></text>
<rect x="40.0" y="80.0" width="370.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="225.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Статична резервація пам'яті</tspan><tspan x="225.0" dy="14.3">(/proc/sys/vm/nr_hugepages)</tspan><tspan x="225.0" dy="14.3">Виділення суцільних блоків при старті ядра</tspan></text>
<line x1="225.0" y1="150.0" x2="225.0" y2="180.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="180.0" width="370.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="225.0" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Спеціалізована ФС hugetlbfs</tspan><tspan x="225.0" dy="14.3">(mount -t hugetlbfs nodev /dev/hugepages)</tspan><tspan x="225.0" dy="14.3">Ізольований пул сторінок поза Buddy-алокатором</tspan></text>
<line x1="225.0" y1="250.0" x2="225.0" y2="280.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="280.0" width="370.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="225.0" y="304.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">Явний доступ з простору користувача</tspan><tspan x="225.0" dy="14.3">mmap(MAP_HUGETLB) / shmget(SHM_HUGETLB)</tspan><tspan x="225.0" dy="14.3">Гарантований доступ, без свопінгу</tspan></text>
<rect x="40.0" y="370.0" width="370.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="225.0" y="401.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Плюси: нульові затримки виділення, без розщеплень</tspan><tspan x="225.0" dy="14.3">Мінуси: негнучкість, неможливість свопінгу</tspan></text>
<rect x="470.0" y="80.0" width="370.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="655.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Динамічний Buddy Allocator (Order-9)</tspan><tspan x="655.0" dy="14.3">Виділення 2 МіБ сторінок «на ходу»</tspan><tspan x="655.0" dy="14.3">Політики: always / madvise / never</tspan></text>
<line x1="655.0" y1="150.0" x2="655.0" y2="180.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="470.0" y="180.0" width="370.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="655.0" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Фоновий демон khugepaged і дефрагментація</tspan><tspan x="655.0" dy="14.3">Сканування RAM, згортання 512×4K у 2 МіБ</tspan><tspan x="655.0" dy="14.3">Динамічне розщеплення при munmap/mprotect</tspan></text>
<line x1="655.0" y1="250.0" x2="655.0" y2="280.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="470.0" y="280.0" width="370.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="655.0" y="304.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Прозоре виділення для програм</tspan><tspan x="655.0" dy="14.3">Звичайний malloc / mmap + madvise(MADV_HUGEPAGE)</tspan><tspan x="655.0" dy="14.3">Автоматичне керування в ядрі</tspan></text>
<rect x="470.0" y="370.0" width="370.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="655.0" y="401.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Плюси: прозорість, універсальність, свопінг</tspan><tspan x="655.0" dy="14.3">Мінуси: затримки дефрагментації, роздування пам'яті</tspan></text>
</svg>