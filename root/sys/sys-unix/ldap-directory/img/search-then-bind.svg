<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пошук відповідає про особу, bind — про секрет</text>
<rect x="221.7" y="48.5" width="196.7" height="35.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="71.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">хто такий «andrij»?</tspan></text>
<rect x="821.6" y="48.5" width="196.7" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="920.0" y="71.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">чи знає він пароль?</tspan></text>
<rect x="198.9" y="156.6" width="242.3" height="66.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="177.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">SEARCH</tspan><tspan x="320.0" dy="16.9">base: ou=people,dc=firma,dc=ua</tspan><tspan x="320.0" dy="16.9">filter: (uid=andrij)</tspan></text>
<rect x="765.5" y="156.6" width="309.0" height="66.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="920.0" y="177.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">BIND</tspan><tspan x="920.0" dy="16.9">dn: uid=andrij,ou=people,dc=firma,dc=ua</tspan><tspan x="920.0" dy="16.9">password: те, що ввела людина</tspan></text>
<rect x="545.9" y="318.5" width="148.2" height="35.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="341.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">сервер каталогу</tspan></text>
<line x1="320.0" y1="236.0" x2="528.0" y2="318.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="920.0" y1="236.0" x2="712.0" y2="318.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="206.3" y="433.1" width="227.5" height="49.9" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="320.0" y="454.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">запис: uidNumber, gidNumber,</tspan><tspan x="320.0" dy="16.9">homeDirectory, loginShell</tspan></text>
<rect x="791.4" y="433.1" width="257.1" height="49.9" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="920.0" y="454.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">success або invalidCredentials —</tspan><tspan x="920.0" dy="16.9">і жодного хеша назад</tspan></text>
<line x1="528.0" y1="356.0" x2="340.0" y2="428.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="712.0" y1="356.0" x2="900.0" y2="428.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="540.0" width="1000.0" height="80.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="576.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">клієнт не забирає хеш і не звіряє його сам: він просить сервер спробувати ним увійти.</tspan><tspan x="620.0" dy="16.9">тому userPassword звичайно закритий для читання — а часом його там і немає зовсім</tspan></text>
</svg>