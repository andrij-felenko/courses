<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 710 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="710" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="680.0" height="320.0" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0"/>
<text x="350.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">Арбітраж термінала: Сигнали SIGTTIN та SIGTTOU</text>
<rect x="30.0" y="60.0" width="180.0" height="240.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.0"/>
<text x="120.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700">Драйвер TTY</text>
<text x="120.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">n_tty.c</text>
<rect x="45.0" y="120.0" width="150.0" height="60.0" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="120.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">Foreground PGID:</text>
<text x="120.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">2000</text>
<rect x="45.0" y="200.0" width="150.0" height="80.0" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="120.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">Прапорці termios:</text>
<text x="120.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#374151" text-anchor="middle">ISIG = 1</text>
<text x="120.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">TOSTOP = 1</text>
<rect x="260.0" y="60.0" width="390.0" height="90.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="455.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">Foreground Процес (PGID = 2000)</text>
<text x="455.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle" font-weight="700">read(0, buf, n) → Дозволено (отримує байти)</text>
<text x="455.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle" font-weight="700">write(1, buf, n) → Дозволено (виводить на екран)</text>
<line x1="210.0" y1="95.0" x2="260.0" y2="95.0" stroke="#059669" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="260.0" y="170.0" width="390.0" height="130.0" rx="6" fill="#fffbe6" stroke="#f59e0b" stroke-width="1.5"/>
<text x="455.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700">Background Процес (PGID = 1500)</text>
<text x="455.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Спроба read(0, buf, n)  →  Драйвер надсилає SIGTTIN</text>
<text x="455.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">Спроба write(1, buf, n) (TOSTOP=1) → SIGTTOU</text>
<text x="455.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">Результат: Стан TASK_STOPPED (Stopped (tty input/output))</text>
<line x1="210.0" y1="220.0" x2="260.0" y2="220.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="210.0" y1="250.0" x2="260.0" y2="250.0" stroke="#b45309" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>