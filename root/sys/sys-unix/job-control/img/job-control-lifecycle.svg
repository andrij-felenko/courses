<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 750 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="750" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="720.0" height="300.0" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0"/>
<text x="370.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">Життєвий цикл завдання та переходи між станами</text>
<rect x="30.0" y="70.0" width="190.0" height="100.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2.0"/>
<text x="125.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">Foreground Running</text>
<text x="125.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">Володіє TTY</text>
<text x="125.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">Отримує ввід</text>
<text x="125.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Оболонка чекає</text>
<rect x="280.0" y="70.0" width="190.0" height="100.0" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="2.0"/>
<text x="375.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="700">Stopped (TASK_STOPPED)</text>
<text x="375.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">Не отримує CPU</text>
<text x="375.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4b5563" text-anchor="middle">Записано в jobs</text>
<text x="375.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle">Оболонка володіє TTY</text>
<rect x="510.0" y="70.0" width="190.0" height="100.0" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2.0"/>
<text x="605.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#065f46" text-anchor="middle" font-weight="700">Background Running</text>
<text x="605.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#047857" text-anchor="middle">Виконується у фоні</text>
<text x="605.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">read() → SIGTTIN</text>
<text x="605.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#047857" text-anchor="middle">Оболонка вільна</text>
<line x1="220.0" y1="100.0" x2="280.0" y2="100.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="250.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">Ctrl+Z (SIGTSTP)</text>
<line x1="470.0" y1="100.0" x2="510.0" y2="100.0" stroke="#047857" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="490.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#047857" text-anchor="middle" font-weight="700">bg (SIGCONT)</text>
<line x1="550.0" y1="170.0" x2="420.0" y2="170.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="485.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">read() / write() → SIGTTIN / SIGTTOU</text>
<line x1="340.0" y1="170.0" x2="140.0" y2="170.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="240.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">fg (tcsetpgrp + SIGCONT)</text>
<line x1="370.0" y1="230.0" x2="605.0" y2="170.0" stroke="#047857" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="460.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#047857" text-anchor="middle">Запуск з '&amp;' (command &amp;)</text>
</svg>