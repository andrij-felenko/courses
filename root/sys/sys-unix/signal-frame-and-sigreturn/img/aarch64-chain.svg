<text x="268.0" y="693.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">magic = 0  ·  size = 0  —  кінець ланцюга</text>
