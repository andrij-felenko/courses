<text x="227.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">__reserved[4096] — ланцюг записів змінної довжини</text>
