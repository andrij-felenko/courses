<line x1="204.0" y1="374.0" x2="204.0" y2="404.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="172.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">+ size</text>
<line x1="204.0" y1="494.0" x2="204.0" y2="524.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="172.0" y="514.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">+ size</text>
<line x1="204.0" y1="614.0" x2="204.0" y2="644.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="172.0" y="634.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">+ size</text>
<line x1="500.0" y1="116.0" x2="500.0" y2="150.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="810.0" y="170.0" width="380.0" height="180.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="2.0"/><text x="1000.0" y="213.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">ЯК ЧИТАТИ</tspan><tspan x="1000.0" dy="16.9"></tspan><tspan x="1000.0" dy="16.9">1. стати на початок __reserved</tspan><tspan x="1000.0" dy="16.9">2. прочитати magic поточного запису</tspan><tspan x="1000.0" dy="16.9">3. не той, що шукаєте — додати size</tspan><tspan x="1000.0" dy="16.9">    до адреси й повторити</tspan><tspan x="1000.0" dy="16.9">4. magic == 0 — записів більше немає</tspan></text>
<rect x="810.0" y="380.0" width="380.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="1000.0" y="425.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">Порядку записів не гарантовано.</tspan><tspan x="1000.0" dy="16.9">Шукати треба за magic, а не за зсувом:</tspan><tspan x="1000.0" dy="16.9">набір записів залежить від того,</tspan><tspan x="1000.0" dy="16.9">які розширення має процесор</tspan><tspan x="1000.0" dy="16.9">і що саме сталося з програмою.</tspan></text>
<rect x="810.0" y="560.0" width="380.0" height="164.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="1000.0" y="612.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">extra_context — запобіжник:</tspan><tspan x="1000.0" dy="16.9">коли записи не влазять у 4096 байтів,</tspan><tspan x="1000.0" dy="16.9">ядро кладе його передостаннім,</tspan><tspan x="1000.0" dy="16.9">а поле datap показує на продовження</tspan><tspan x="1000.0" dy="16.9">ланцюга, виділене нижче на стеку.</tspan></text>
</svg>