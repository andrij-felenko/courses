<text x="268.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">fpsr, fpcr, 32 векторні регістри по 128 бітів</text>
