<text x="700.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">зелений — сталий розмір · синій — змінний, читається послідовно · сірий — те, що лишилося</text>
