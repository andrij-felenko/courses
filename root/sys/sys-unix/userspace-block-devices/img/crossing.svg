<text x="560.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">опис: операція, сектор, довжина</text>
<rect x="922.7" y="234.2" width="124.6" height="49.6" rx="6" fill="#eaf6ef" stroke="#6b7280" stroke-width="1.2"/><text x="985.0" y="255.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="985.0" dy="0.0">24 байти</tspan><tspan x="985.0" dy="15.6">сталого розміру</tspan></text>
<line x1="410.0" y1="375.0" x2="710.0" y2="375.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="710.0" y1="393.0" x2="410.0" y2="393.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="560.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">корисні дані запиту</text>
<rect x="926.1" y="354.2" width="117.8" height="49.6" rx="6" fill="#fdecea" stroke="#6b7280" stroke-width="1.2"/><text x="985.0" y="375.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="985.0" dy="0.0">від 512 байтів</tspan><tspan x="985.0" dy="15.6">до мегабайтів</tspan></text>
