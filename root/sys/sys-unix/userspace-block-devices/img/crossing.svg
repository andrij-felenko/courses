<text x="560.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">з'явився запит із тегом N</text>
<rect x="915.9" y="129.2" width="138.3" height="49.6" rx="6" fill="#eaf6ef" stroke="#6b7280" stroke-width="1.2"/><text x="985.0" y="150.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="985.0" dy="0.0">≈ 0 байтів</tspan><tspan x="985.0" dy="15.6">(саме число тега)</tspan></text>
