<text x="560.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">вердикт: код завершення</text>
<rect x="939.8" y="487.0" width="90.4" height="34.0" rx="6" fill="#eaf6ef" stroke="#6b7280" stroke-width="1.2"/><text x="985.0" y="508.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="985.0" dy="0.0">≈ 8 байтів</tspan></text>
<text x="560.0" y="600.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три з чотирьох — десятки байтів. Канал платить за четверте і за кількість переходів межі.</text>
