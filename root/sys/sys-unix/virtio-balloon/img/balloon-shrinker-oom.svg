<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 850" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="850" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запобігання аварійному вимкненню процесів гостя через механізм shrinker</text>
<text x="700.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЗАХИСТ ВІД OOM: ВЗАЄМОДІЯ VIRTIO-BALLOON ІЗ ПІДСИСТЕМОЮ MM ГОСТЯ</text>
<text x="700.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Реєстрація драйвера в системі shrinker дозволяє автоматично здувати балон під час дефіциту пам'яті</text>
<text x="260.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. ШТАТНИЙ СТАН</text>
<rect x="80.0" y="168.6" width="360.0" height="82.8" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Балон роздуто на 8 ГБ</tspan><tspan x="260.0" dy="15.6">Сторінки у списку vb-&gt;pages</tspan><tspan x="260.0" dy="15.6">Buddy allocator має запас RAM</tspan><tspan x="260.0" dy="15.6">Застосунки працюють стабільно</tspan></text>
<text x="700.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2. ДЕФІЦИТ RAM У ГОСТІ</text>
<rect x="510.0" y="168.6" width="380.0" height="82.8" rx="6" fill="#fff6e5" stroke="#c0392b" stroke-width="1.5"/><text x="700.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Сплеск пам'яті застосунків</tspan><tspan x="700.0" dy="15.6">Рівень вільної RAM падає нижче</tspan><tspan x="700.0" dy="15.6">водяного знака wmark_low</tspan><tspan x="700.0" dy="15.6">kswapd починає пряме вивільнення</tspan></text>
<text x="1140.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">3. ПОРЯТУНОК ЧЕРЕЗ SHRINKER</text>
<rect x="960.0" y="168.6" width="360.0" height="82.8" rx="6" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.5"/><text x="1140.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">Ядро викликає shrinker_scan()</tspan><tspan x="1140.0" dy="15.6">virtio_balloon_shrinker_scan()</tspan><tspan x="1140.0" dy="15.6">здуває балон на вимогу ядра MM,</tspan><tspan x="1140.0" dy="15.6">повертаючи сторінки алокатору</tspan></text>
<line x1="450.0" y1="210.0" x2="500.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="895.0" y1="210.0" x2="955.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="700.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">НАСЛІДКИ НАЯВНОСТІ / ВІДСУТНОСТІ ПРАПОРЦЯ VIRTIO_BALLOON_F_DEFLATE_ON_OOM</text>
<rect x="50.0" y="421.0" width="620.0" height="118.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="360.0" y="445.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">БЕЗ АВТОЗДУВАННЯ / БЕЗ SHRINKER:</tspan><tspan x="360.0" dy="15.6">1. Балон утримує 8 ГБ як звичайний процес.</tspan><tspan x="360.0" dy="15.6">2. Ядро гостя вичерпує сторінки кешу й анонімної пам'яті.</tspan><tspan x="360.0" dy="15.6">3. Викликається функція out_of_memory().</tspan><tspan x="360.0" dy="15.6">4. OOM Killer знищує базу даних або веб-сервер!</tspan><tspan x="360.0" dy="15.6">5. Результат: аварія сервісу за наявності гігабайтів у балоні.</tspan></text>
<rect x="730.0" y="421.0" width="620.0" height="118.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="1040.0" y="445.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">З УВІМКНЕНИМ SHRINKER ТА DEFLATE_ON_OOM:</tspan><tspan x="1040.0" dy="15.6">1. Ядро гостя сприймає балон як резервуар сторінок.</tspan><tspan x="1040.0" dy="15.6">2. При падінні free RAM балон автоматично стискається.</tspan><tspan x="1040.0" dy="15.6">3. Сторінки повертаються до buddy allocator без OOM.</tspan><tspan x="1040.0" dy="15.6">4. Клієнтські процеси отримують пам'ять без затримок.</tspan><tspan x="1040.0" dy="15.6">5. Результат: повна стабільність гостьової операційної системи.</tspan></text>
<rect x="50.0" y="643.5" width="1300.0" height="73.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="700.0" y="668.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">ПРАВИЛО БАЛАНСУ ПАМ'ЯТІ У ХМАРАХ:</tspan><tspan x="700.0" dy="16.2">Балонінг ефективний лише тоді, коли гість може віддати пам'ять без шкоди для власної роботи.</tspan><tspan x="700.0" dy="16.2">Агресивне надування балона без зворотного клапана (shrinker) перетворює overcommit на аварію гостя.</tspan></text>
</svg>