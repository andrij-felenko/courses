<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="80.0" width="260.0" height="90.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="113.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">1. Запит зміщення:</tspan><tspan x="170.0" dy="15.6">ioctl(fd, DRM_IOCTL_MODE_MAP_DUMB)</tspan><tspan x="170.0" dy="15.6">повертає fake_offset = 0x10000000</tspan></text>
<rect x="40.0" y="230.0" width="260.0" height="90.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="255.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">2. Відображення пам'яті:</tspan><tspan x="170.0" dy="15.6">mmap(NULL, size, PROT_READ|WRITE,</tspan><tspan x="170.0" dy="15.6">MAP_SHARED, fd, 0x10000000)</tspan><tspan x="170.0" dy="15.6">повертає ptr_cpu</tspan></text>
<rect x="40.0" y="380.0" width="260.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="415.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">3. Звернення до пам'яті:</tspan><tspan x="170.0" dy="13.0">ptr_cpu[0] = 0xFFFFFFFF</tspan><tspan x="170.0" dy="13.0">генерує Page Fault (якщо не завантажено)</tspan></text>
<rect x="350.0" y="40.0" width="360.0" height="440.0" rx="8" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.2"/>
<text x="530.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">drm_vma_offset_manager (Дерево RB)</text>
<rect x="370.0" y="95.0" width="320.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Вузол Буфера 1: [0x00000000 .. 0x00FFFFFF]</tspan><tspan x="530.0" dy="14.3">GEM Object #1 (Текстура 16 MiB)</tspan></text>
<rect x="370.0" y="195.0" width="320.0" height="85.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="530.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Вузол Буфера 2: [0x10000000 .. 0x107FFFFF]</tspan><tspan x="530.0" dy="14.3">GEM Object #2 (Фреймбуфер 8 MiB)</tspan><tspan x="530.0" dy="14.3">-&gt; Відповідає зміщенню 0x10000000!</tspan></text>
<rect x="370.0" y="305.0" width="320.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="339.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Вузол Буфера 3: [0x20000000 .. 0x20007FFF]</tspan><tspan x="530.0" dy="14.3">GEM Object #3 (Курсор 32 KiB)</tspan></text>
<text x="530.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Єдиний простір зміщень для /dev/dri/card0</text>
<text x="530.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ключ пошуку — номер початкової сторінки vma-&gt;vm_pgoff</text>
<rect x="760.0" y="40.0" width="280.0" height="440.0" rx="8" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.2"/>
<text x="900.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обробник сторінкових збоїв</text>
<rect x="780.0" y="110.0" width="240.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">vma-&gt;vm_ops = &amp;drm_gem_vm_ops</tspan><tspan x="900.0" dy="13.0">Диспетчер перехоплює mmap</tspan><tspan x="900.0" dy="13.0">через drm_vma_offset_lookup_locked()</tspan></text>
<rect x="780.0" y="240.0" width="240.0" height="110.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="900.0" y="270.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">vm_ops-&gt;fault() (наприклад,</tspan><tspan x="900.0" dy="14.3">drm_gem_shmem_fault):</tspan><tspan x="900.0" dy="14.3">1. Читає сторінку з shmem</tspan><tspan x="900.0" dy="14.3">2. Отримує struct page</tspan><tspan x="900.0" dy="14.3">3. Встановлює запис PTE процесу</tspan></text>
<rect x="780.0" y="385.0" width="240.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="900.0" y="412.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Пам'ять доступна процесору:</tspan><tspan x="900.0" dy="14.3">Прямий запис у кеш процесора</tspan><tspan x="900.0" dy="14.3">(Write-Combine або Uncached)</tspan></text>
