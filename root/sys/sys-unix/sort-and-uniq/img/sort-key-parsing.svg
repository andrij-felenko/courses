<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Синтаксис ключів sort -k: поля, зміщення та межі вибірки</text>
<rect x="40.0" y="50.0" width="760.0" height="75.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="420.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Синтаксис специфікатора ключа:  -k POS1[,POS2]</text>
<text x="420.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">POS = F[.C][OPTS]  де  F = номер поля (1-based),  C = символ у полі (1-based),  OPTS = n, r, b, V, h</text>
<text x="420.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">POS1 визначає початок ключа сортування; POS2 визначає кінець включно (якщо опущено — до кінця рядка)</text>
<rect x="40.0" y="140.0" width="760.0" height="85.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="120.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="700">Приклад рядка (роздільник -t ' '):</text>
<rect x="45.0" y="175.0" width="130.0" height="42.0" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
<text x="110.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">Поле 1</text>
<text x="110.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">2026-08-25</text>
<rect x="185.0" y="175.0" width="100.0" height="42.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="235.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700">Поле 2</text>
<text x="235.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">14:30:15</text>
<rect x="295.0" y="175.0" width="65.0" height="42.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="327.5" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Поле 3</text>
<text x="327.5" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">GET</text>
<rect x="370.0" y="175.0" width="185.0" height="42.0" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
<text x="462.5" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#075985" text-anchor="middle" font-weight="700">Поле 4</text>
<text x="462.5" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">/api/v2/items</text>
<rect x="565.0" y="175.0" width="65.0" height="42.0" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="597.5" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#5b21b6" text-anchor="middle" font-weight="700">Поле 5</text>
<text x="597.5" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">200</text>
<rect x="640.0" y="175.0" width="150.0" height="42.0" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.2"/>
<text x="715.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b21a8" text-anchor="middle" font-weight="700">Поле 6</text>
<text x="715.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">1420</text>
<rect x="40.0" y="240.0" width="760.0" height="185.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="420.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Порівняння поведінки специфікаторів на практиці</text>
<rect x="55.0" y="280.0" width="165.0" height="26.0" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="1.0"/>
<text x="137.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">sort -k2,2</text>
<text x="230.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="start">Обмежує ключ суворо Полем 2 ('14:30:15'). Інші поля не впливають на сортування цього ключа.</text>
<rect x="55.0" y="314.0" width="165.0" height="26.0" rx="3" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.0"/>
<text x="137.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">sort -k2</text>
<text x="230.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="start">ПАСТКА: починає з Поля 2 і бере ВЕСЬ залишок рядка до кінця ('14:30:15 GET /api/v2/items 200 1420').</text>
<rect x="55.0" y="348.0" width="165.0" height="26.0" rx="3" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.0"/>
<text x="137.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle" font-weight="700">sort -k1.6,1.7n</text>
<text x="230.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="start">Внутрішньопольовий діапазон: вибирає символи 6–7 поля 1 (місяць '08') і сортує як число.</text>
<rect x="55.0" y="382.0" width="165.0" height="26.0" rx="3" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.0"/>
<text x="137.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7e22ce" text-anchor="middle" font-weight="700">sort -k5,5n -k6,6nr</text>
<text x="230.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="start">Багатоключове сортування: спочатку за HTTP-кодом (поле 5, зростання), потім за розміром (поле 6, спадання).</text>
</svg>