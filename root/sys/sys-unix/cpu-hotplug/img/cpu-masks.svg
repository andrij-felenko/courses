<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1370 770" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1370" height="770" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="680.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири відповіді на питання «скільки в машині ядер процесора»</text>
<rect x="60.0" y="96.0" width="620.0" height="580.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="2.0"/>
<text x="370.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">cpu_possible_mask</text>
<rect x="100.0" y="158.0" width="540.0" height="486.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="370.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">cpu_present_mask</text>
<rect x="140.0" y="220.0" width="460.0" height="392.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/>
<text x="370.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">cpu_online_mask</text>
<rect x="180.0" y="282.0" width="380.0" height="298.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.0"/>
<text x="370.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b8860b" text-anchor="middle" font-weight="700">cpu_active_mask</text>
<text x="370.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">ядро процесора, яке зараз</tspan><tspan x="370.0" dy="20.2">і рахує, і приймає нові задачі</tspan></text>
<rect x="730.0" y="110.0" width="570.0" height="116.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="2.0"/><text x="1015.0" y="155.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1015.0" dy="0.0">possible — усі номери, які взагалі можуть</tspan><tspan x="1015.0" dy="16.9">з'явитися; список складають на завантаженні</tspan><tspan x="1015.0" dy="16.9">з таблиць прошивки й далі не міняють</tspan></text>
<rect x="730.0" y="270.0" width="570.0" height="116.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="1015.0" y="315.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1015.0" dy="0.0">present — ядра процесора, фізично наявні</tspan><tspan x="1015.0" dy="16.9">в машині зараз; міняється лише там, де</tspan><tspan x="1015.0" dy="16.9">залізо справді додають і виймають</tspan></text>
<rect x="730.0" y="430.0" width="570.0" height="116.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/><text x="1015.0" y="475.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1015.0" dy="0.0">online — ядро процесора виконує код,</tspan><tspan x="1015.0" dy="16.9">має чергу готових задач і приймає</tspan><tspan x="1015.0" dy="16.9">переривання</tspan></text>
<rect x="730.0" y="590.0" width="570.0" height="116.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="2.0"/><text x="1015.0" y="635.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1015.0" dy="0.0">active — планувальникові дозволено класти</tspan><tspan x="1015.0" dy="16.9">сюди нові задачі; знімають раніше за online,</tspan><tspan x="1015.0" dy="16.9">щоб черга встигла спорожніти</tspan></text>
<text x="680.0" y="720.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">пам'ять per-CPU виділяють за possible, роботу роздають за online, нові задачі кладуть за active</text>
</svg>