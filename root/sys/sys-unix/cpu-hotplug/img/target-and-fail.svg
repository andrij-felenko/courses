<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1450 750" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1450" height="750" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="720.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві ручки в sysfs, якими колбеки перевіряють, не вимикаючи жодного ядра процесора</text>
<text x="375.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ручка target: провести ядро процесора до заданого стану</text>
<rect x="200.0" y="128.0" width="420.0" height="60.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/><text x="410.0" y="162.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">233  online</tspan></text>
<rect x="200.0" y="202.0" width="420.0" height="60.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/><text x="410.0" y="236.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">232  sched:active</tspan></text>
<rect x="200.0" y="276.0" width="420.0" height="60.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/><text x="410.0" y="310.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">…  інші стани ONLINE-секції</tspan></text>
<rect x="200.0" y="350.0" width="420.0" height="60.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.8"/><text x="410.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">220  cpucache:online — наш</tspan></text>
<rect x="200.0" y="424.0" width="420.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="410.0" y="458.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">219  і все, що нижче</tspan></text>
<text x="1065.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ручка fail: зламати перехід і подивитися на відкат</text>
<rect x="890.0" y="128.0" width="420.0" height="60.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/><text x="1100.0" y="162.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1100.0" dy="0.0">233  online</tspan></text>
<rect x="890.0" y="202.0" width="420.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="1100.0" y="236.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1100.0" dy="0.0">232  sched:active — сюди озброїли fail</tspan></text>
<rect x="890.0" y="276.0" width="420.0" height="60.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.8"/><text x="1100.0" y="310.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1100.0" dy="0.0">…  інші стани ONLINE-секції</tspan></text>
<rect x="890.0" y="350.0" width="420.0" height="60.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.8"/><text x="1100.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1100.0" dy="0.0">220  cpucache:online — наш</tspan></text>
<rect x="890.0" y="424.0" width="420.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="1100.0" y="458.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1100.0" dy="0.0">219  звідси вирушаємо</tspan></text>
<text x="130.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">teardown</text>
<line x1="130.0" y1="132.0" x2="130.0" y2="404.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="820.0" y1="404.0" x2="820.0" y2="206.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="820.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">startup</text>
<line x1="1355.0" y1="206.0" x2="1355.0" y2="404.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="1355.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">відкат</text>
<rect x="70.0" y="528.0" width="580.0" height="150.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/><text x="360.0" y="583.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">echo 219 &gt; /sys/.../cpu3/hotplug/target</tspan><tspan x="360.0" dy="16.2">teardown біжить згори вниз до 220 включно,</tspan><tspan x="360.0" dy="16.2">на 219 машина стає — колбек самої цілі НЕ скасовують</tspan><tspan x="360.0" dy="16.2">у dmesg — рядок нашого teardown, у stats — count 0</tspan></text>
<rect x="760.0" y="528.0" width="580.0" height="150.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="1050.0" y="583.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">echo 232 &gt; fail; echo 233 &gt; target</tspan><tspan x="1050.0" dy="16.2">наш startup 220 відпрацював, на 232 підставлено -EAGAIN,</tspan><tspan x="1050.0" dy="16.2">машина відкочує все вгору зроблене — і кличе наш teardown</tspan><tspan x="1050.0" dy="16.2">запис у target повертає EAGAIN, ядро процесора лишається на 219</tspan></text>
<text x="720.0" y="712.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">номери станів залежать від версії й конфігурації ядра — їх щоразу беруть із файлу states, а не зашивають у скрипт</text>
</svg>