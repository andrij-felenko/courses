<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист від витоку: атомарні системні виклики та close_range()</text>
<rect x="40.0" y="60.0" width="370.0" height="350.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="225.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Атомарне створення: *_CLOEXEC</text>
<text x="225.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Вікно гонитви = 0 наносекунд</text>
<rect x="52.0" y="125.0" width="346.0" height="46.0" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1.0"/>
<text x="60.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">open(path, flags | O_CLOEXEC)</text>
<text x="60.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">файл створюється одразу з бітом у fdtable</text>
<rect x="52.0" y="179.0" width="346.0" height="46.0" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1.0"/>
<text x="60.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">socket(AF_INET, SOCK_STREAM | SOCK_CLOEXEC, 0)</text>
<text x="60.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">сокет захищено ще до повернення fd</text>
<rect x="52.0" y="233.0" width="346.0" height="46.0" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1.0"/>
<text x="60.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">pipe2(pipefd, O_CLOEXEC)</text>
<text x="60.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">обидва кінці каналу з прапорцем</text>
<rect x="52.0" y="287.0" width="346.0" height="46.0" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1.0"/>
<text x="60.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">accept4(listen_fd, ..., SOCK_CLOEXEC)</text>
<text x="60.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">клієнтський сокет не витече в дочірні процеси</text>
<rect x="52.0" y="341.0" width="346.0" height="46.0" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1.0"/>
<text x="60.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">epoll_create1(EPOLL_CLOEXEC)</text>
<text x="60.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">дескриптор epoll закрито при exec</text>
<rect x="450.0" y="60.0" width="370.0" height="350.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="635.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Масове очищення: close_range()</text>
<text x="635.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Один виклик на всі зайві дескриптори</text>
<rect x="462.0" y="125.0" width="346.0" height="76.0" rx="4" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.0"/>
<text x="470.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">close_range(3, ~0U, 0)</text>
<text x="470.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Закриває всі fd від 3 до нескінченності</text>
<text x="470.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">миттєве звільнення ресурсів перед exec</text>
<rect x="462.0" y="213.0" width="346.0" height="76.0" rx="4" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.0"/>
<text x="470.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">close_range(3, ~0U, CLOSE_RANGE_CLOEXEC)</text>
<text x="470.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Ставить FD_CLOEXEC на діапазон [3..max]</text>
<text x="470.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">дескриптори працюють до самого execve</text>
<rect x="462.0" y="301.0" width="346.0" height="76.0" rx="4" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1.0"/>
<text x="470.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">posix_spawn_file_actions_addclose()</text>
<text x="470.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Декларативне закриття у posix_spawn</text>
<text x="470.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">атомарний запуск без fork/exec гонитви</text>
</svg>