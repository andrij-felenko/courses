<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1060 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1060" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="222.1" y="17.5" width="605.9" height="35.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="525.0" y="40.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">Арбітраж USB-накопичувачів: UAS проти Bulk-Only Transport (BOT)</tspan></text>
<rect x="265.1" y="75.0" width="519.7" height="49.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="525.0" y="96.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">Під'єднано USB 3.0 / SATA міст (наприклад, JMS567 / ASM1051)</tspan><tspan x="525.0" dy="16.9">Дескриптор інтерфейсу заявляє протокол UAS (USB Attached SCSI)</tspan></text>
<rect x="322.3" y="185.1" width="405.3" height="49.9" rx="6" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/><text x="525.0" y="206.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">Спроба прив'язки високопродуктивного драйвера uas.ko</tspan><tspan x="525.0" dy="16.9">Перевірка чорного списку unusual_uas.h та uas.quirks</tspan></text>
<rect x="112.4" y="316.2" width="295.3" height="47.6" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="336.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">Чип підтримує UAS без критичних багів</tspan><tspan x="260.0" dy="15.6">Прапорець US_FL_IGNORE_UAS відсутній</tspan></text>
<rect x="120.0" y="440.6" width="279.9" height="78.8" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="460.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Робота через драйвер uas.ko</tspan><tspan x="260.0" dy="15.6">SCSI Command Queuing (NCQ / SAM-4)</tspan><tspan x="260.0" dy="15.6">Паралельні потоки USB 3.0 Streams</tspan><tspan x="260.0" dy="15.6">Мінімальні затримки введення-виведення</tspan></text>
<rect x="623.8" y="308.4" width="332.5" height="63.2" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="328.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Виявлено дефектний чип або зависання черги</tspan><tspan x="790.0" dy="15.6">Встановлено прапорець US_FL_IGNORE_UAS</tspan><tspan x="790.0" dy="15.6">uas_probe() повертає -ENODEV</tspan></text>
<rect x="626.1" y="440.6" width="327.8" height="78.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="460.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Відкат до драйвера usb-storage.ko</tspan><tspan x="790.0" dy="15.6">Класичний Bulk-Only Transport (BOT)</tspan><tspan x="790.0" dy="15.6">Суворо послідовна передача (одна команда)</tspan><tspan x="790.0" dy="15.6">Накладання прапорців US_FL_* з unusual_devs.h</tspan></text>
<rect x="184.5" y="603.5" width="680.9" height="33.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="525.0" y="624.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">Результат: пристрій не зависає на операціях запису й коректно функціонує в системі</tspan></text>
