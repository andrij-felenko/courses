<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="195.9" y="17.5" width="708.2" height="35.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="40.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">Архітектура підсистеми quirks: виявлення та модифікація поведінки USB Core</tspan></text>
<rect x="61.0" y="76.6" width="277.9" height="66.8" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="97.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Під'єднання пристрою USB</tspan><tspan x="200.0" dy="16.9">hub_port_init(): скидання порту</tspan><tspan x="200.0" dy="16.9">Зчитування дескриптора (VID:PID)</tspan></text>
<rect x="20.7" y="225.1" width="358.5" height="49.9" rx="6" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">usb_detect_quirks(struct usb_device *udev)</tspan><tspan x="200.0" dy="16.9">Пошук збігів за VID, PID та класом</tspan></text>
<rect x="476.6" y="168.4" width="286.8" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="188.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Статична таблиця ядра: usb_quirk_list[]</tspan><tspan x="620.0" dy="15.6">drivers/usb/core/quirks.c</tspan><tspan x="620.0" dy="15.6">Вбудована база дефектного заліза</tspan></text>
<rect x="483.5" y="268.4" width="273.1" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="288.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Динамічні прапорці відхилень</tspan><tspan x="620.0" dy="15.6">Параметр usbcore.quirks=VID:PID:flags</tspan><tspan x="620.0" dy="15.6">/sys/module/usbcore/parameters/quirks</tspan></text>
<rect x="4.6" y="356.6" width="390.8" height="66.8" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="377.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">Формування бітової маски</tspan><tspan x="200.0" dy="16.9">udev-&gt;quirks |= static_quirks | dynamic_quirks</tspan><tspan x="200.0" dy="16.9">Збереження маски в структурі пристрою</tspan></text>
<rect x="49.7" y="523.0" width="220.6" height="73.9" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="542.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">USB_QUIRK_NO_SET_INTF</tspan><tspan x="160.0" dy="14.3">usb_set_interface()</tspan><tspan x="160.0" dy="14.3">Пропуск SET_INTERFACE</tspan><tspan x="160.0" dy="14.3">запобігання зависанню контролера</tspan></text>
<rect x="354.8" y="523.0" width="170.5" height="73.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="542.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">USB_QUIRK_RESET_RESUME</tspan><tspan x="440.0" dy="14.3">usb_resume_both()</tspan><tspan x="440.0" dy="14.3">Примусове скидання шини</tspan><tspan x="440.0" dy="14.3">замість resume signaling</tspan></text>
<rect x="622.2" y="523.0" width="195.6" height="73.9" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="542.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">USB_QUIRK_NO_AUTOSUSPEND</tspan><tspan x="720.0" dy="14.3">usb_autosuspend_device()</tspan><tspan x="720.0" dy="14.3">Блокування runtime PM</tspan><tspan x="720.0" dy="14.3">заборона переходу в стан сну</tspan></text>
<rect x="881.6" y="523.0" width="176.8" height="73.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="542.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">USB_QUIRK_DELAY_INIT</tspan><tspan x="970.0" dy="14.3">hub_port_init()</tspan><tspan x="970.0" dy="14.3">Пауза після скидання</tspan><tspan x="970.0" dy="14.3">стабілізація повільної FW</tspan></text>
