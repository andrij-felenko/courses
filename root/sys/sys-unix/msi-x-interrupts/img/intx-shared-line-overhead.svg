<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спільна фізична лінія INTx: колізія пристроїв та оверхед опитування</text>
<rect x="64.8" y="75.0" width="190.4" height="49.9" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="96.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Мережева карта (eth0)</tspan><tspan x="160.0" dy="16.9">IRQ_NONE (не моя подія)</tspan></text>
<line x1="255.2" y1="100.0" x2="420.0" y2="100.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="64.8" y="175.1" width="190.4" height="49.9" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="196.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Контролер SATA (sda)</tspan><tspan x="160.0" dy="16.9">IRQ_NONE (не моя подія)</tspan></text>
<line x1="255.2" y1="200.0" x2="420.0" y2="200.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="46.3" y="275.1" width="227.5" height="49.9" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Звуковий чип (snd)</tspan><tspan x="160.0" dy="16.9">IRQ_HANDLED (виставив лінію)</tspan></text>
<line x1="273.7" y1="300.0" x2="420.0" y2="300.0" stroke="#c0392b" stroke-width="2.0"/>
<rect x="64.8" y="375.1" width="190.4" height="49.9" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="396.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">USB-контролер (xhci)</tspan><tspan x="160.0" dy="16.9">IRQ_NONE (не моя подія)</tspan></text>
<line x1="255.2" y1="400.0" x2="420.0" y2="400.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="420.0" y1="80.0" x2="420.0" y2="420.0" stroke="#c0392b" stroke-width="3.5"/>
<text x="420.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Спільний дріт INTA# (active-low)</text>
<line x1="420.0" y1="250.0" x2="520.0" y2="250.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="525.0" y="214.6" width="150.0" height="70.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="237.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">I/O APIC</tspan><tspan x="600.0" dy="16.9">Вхід GSI 16</tspan><tspan x="600.0" dy="16.9">(рівневий тригер)</tspan></text>
<line x1="675.0" y1="250.0" x2="720.0" y2="250.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="726.6" y="191.0" width="246.9" height="118.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="215.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">CPU (Ядро 0)</tspan><tspan x="850.0" dy="15.6">Виклик усього ланцюжка:</tspan><tspan x="850.0" dy="15.6">1. eth0_irq() → MMIO read → ні</tspan><tspan x="850.0" dy="15.6">2. sda_irq()  → MMIO read → ні</tspan><tspan x="850.0" dy="15.6">3. snd_irq()  → MMIO read → ТАК!</tspan><tspan x="850.0" dy="15.6">4. xhci_irq() → MMIO read → ні</tspan></text>
<rect x="113.8" y="476.2" width="772.4" height="47.6" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="496.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Оверхед INTx: 4 виклики драйверів поспіль + 4 повільні MMIO non-posted зчитування через шину (~1-2 мкс кожне),</tspan><tspan x="500.0" dy="15.6">хоча переривання згенерував лише один звуковий контролер.</tspan></text>
</svg>