<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 810" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="810" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обробка статусів конвеєра та прапорець pipefail</text>
<rect x="50.0" y="30.0" width="1100.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="63.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Обробка кодів завершення у конвеєрі: поведінка за замовчуванням проти set -o pipefail</tspan></text>
<rect x="60.0" y="115.0" width="320.0" height="105.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Процес 1: mysqldump</tspan><tspan x="220.0" dy="16.9">Помилка авторизації / збій СУБД</tspan><tspan x="220.0" dy="16.9">Потік даних: порожній (0 байтів)</tspan><tspan x="220.0" dy="16.9">Код виходу: exit 1</tspan></text>
<line x1="383.0" y1="167.0" x2="437.0" y2="167.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="385.0" y="138.0" width="52.0" height="22.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="411.0" y="152.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="411.0" dy="0.0">0 B</tspan></text>
<rect x="440.0" y="115.0" width="320.0" height="105.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Процес 2: gzip -c</tspan><tspan x="600.0" dy="16.9">Стискає вхідний потік 0 байтів</tspan><tspan x="600.0" dy="16.9">Генерує заголовок gzip (20 B)</tspan><tspan x="600.0" dy="16.9">Код виходу: exit 0</tspan></text>
<line x1="763.0" y1="167.0" x2="817.0" y2="167.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="765.0" y="138.0" width="52.0" height="22.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="791.0" y="152.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="791.0" dy="0.0">20 B</tspan></text>
<rect x="820.0" y="115.0" width="320.0" height="105.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="980.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="980.0" dy="0.0">Процес 3: s3_upload</tspan><tspan x="980.0" dy="16.9">Завантажує 20 байтів у сховище</tspan><tspan x="980.0" dy="16.9">Мережевий запит успішний</tspan><tspan x="980.0" dy="16.9">Код виходу: exit 0</tspan></text>
<rect x="60.0" y="245.0" width="1080.0" height="52.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="600.0" y="275.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Внутрішній масив оболонки: PIPESTATUS=( [0]=1  [1]=0  [2]=0 )</tspan></text>
<rect x="60.0" y="320.0" width="525.0" height="340.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="322.5" y="416.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="322.5" dy="0.0">Поведінка за замовчуванням (без pipefail)</tspan><tspan x="322.5" dy="15.6"></tspan><tspan x="322.5" dy="15.6">• Оболонка перевіряє код повернення виключно</tspan><tspan x="322.5" dy="15.6">  з останнього процесу (s3_upload).</tspan><tspan x="322.5" dy="15.6">• Останній процес завершився успішно: $? = 0.</tspan><tspan x="322.5" dy="15.6">• Збій першої команди mysqldump повністю ігнорується.</tspan><tspan x="322.5" dy="15.6"></tspan><tspan x="322.5" dy="15.6">НАСЛІДОК:</tspan><tspan x="322.5" dy="15.6">Пошкоджений бекап (20 байтів) завантажено у хмару,</tspan><tspan x="322.5" dy="15.6">скрипт вважає операцію успішною і продовжує роботу,</tspan><tspan x="322.5" dy="15.6">створюючи ілюзію надійного збереження даних.</tspan></text>
<rect x="615.0" y="320.0" width="525.0" height="340.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="877.5" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="877.5" dy="0.0">Режим із прапорцем set -o pipefail</tspan><tspan x="877.5" dy="15.6"></tspan><tspan x="877.5" dy="15.6">• Оболонка сканує масив PIPESTATUS справа наліво.</tspan><tspan x="877.5" dy="15.6">• Повертає код найправішої команди зі збоєм (exit != 0).</tspan><tspan x="877.5" dy="15.6">• Підсумковий статус конвеєра: $? = 1.</tspan><tspan x="877.5" dy="15.6"></tspan><tspan x="877.5" dy="15.6">НАСЛІДОК:</tspan><tspan x="877.5" dy="15.6">Оболонка фіксує аварійний статус конвеєра,</tspan><tspan x="877.5" dy="15.6">запобігає пошкодженню резервних копій та негайно</tspan><tspan x="877.5" dy="15.6">передає керування системному обробнику помилок.</tspan></text>
<rect x="50.0" y="685.0" width="1100.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="718.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Підсумок: без pipefail будь-який конвеєр із фільтром (grep, gzip, tee, awk) у хвості приховує аварійне падіння</tspan><tspan x="600.0" dy="16.9">основного джерела даних, маскуючи фатальні системні збої під успішний результат виконання.</tspan></text>
</svg>