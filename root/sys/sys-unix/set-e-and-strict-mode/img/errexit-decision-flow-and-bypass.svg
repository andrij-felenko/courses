<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 850" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="850" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дерево рішень та правила придушення set -e</text>
<rect x="50.0" y="30.0" width="1100.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="63.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Механіка спрацювання set -e (errexit): перевірка статусу та правила придушення</tspan></text>
<rect x="400.0" y="110.0" width="400.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="139.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Команда або конвеєр завершується зі статусом $?</tspan></text>
<line x1="600.0" y1="160.0" x2="600.0" y2="195.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="195.0" width="340.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="224.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Чи статус $? дорівнює 0?</tspan></text>
<line x1="770.0" y1="220.0" x2="930.0" y2="220.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="800.0" y="205.0" width="100.0" height="26.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="850.0" y="214.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">Так ($? = 0)</tspan></text>
<rect x="930.0" y="195.0" width="220.0" height="50.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1040.0" y="216.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">Продовжити виконання</tspan><tspan x="1040.0" dy="15.6">наступного рядка коду</tspan></text>
<line x1="600.0" y1="245.0" x2="600.0" y2="285.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610.0" y="252.0" width="90.0" height="24.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="655.0" y="267.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Ні ($? != 0)</tspan></text>
<rect x="430.0" y="285.0" width="340.0" height="50.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="600.0" y="314.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Чи активовано set -e (errexit)?</tspan></text>
<line x1="430.0" y1="310.0" x2="270.0" y2="310.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="298.0" width="90.0" height="24.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="345.0" y="306.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">Ні (вимкнено)</tspan></text>
<rect x="60.0" y="285.0" width="210.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="165.0" y="306.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Продовжити виконання</tspan><tspan x="165.0" dy="15.6">(режим за замовчуванням)</tspan></text>
<line x1="600.0" y1="335.0" x2="600.0" y2="375.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610.0" y="345.0" width="90.0" height="24.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="655.0" y="360.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Так (активно)</tspan></text>
<rect x="330.0" y="375.0" width="540.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="400.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Чи перебуває виклик у контексті перевірки умов?</tspan><tspan x="600.0" dy="18.2">(POSIX Suppression Rules)</tspan></text>
<line x1="330.0" y1="405.0" x2="180.0" y2="470.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="180.0" y="425.0" width="130.0" height="26.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="245.0" y="423.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Так (придушено)</tspan></text>
<rect x="60.0" y="475.0" width="480.0" height="185.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="517.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Контексти придушення errexit:</tspan><tspan x="300.0" dy="15.6"></tspan><tspan x="300.0" dy="15.6">1. Умова перевірки: if cmd; then, while cmd; do, until cmd</tspan><tspan x="300.0" dy="15.6">2. Ліва частина логічного ланцюжка: cmd1 || cmd2, cmd1 &amp;&amp; cmd2</tspan><tspan x="300.0" dy="15.6">3. Заперечення результату: ! cmd</tspan><tspan x="300.0" dy="15.6"></tspan><tspan x="300.0" dy="15.6">ДІЯ: Оболонка НЕ зупиняє скрипт і НЕ викликає trap ERR.</tspan><tspan x="300.0" dy="15.6">Код виходу передається керуючій конструкції.</tspan></text>
<line x1="870.0" y1="405.0" x2="1020.0" y2="470.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="890.0" y="425.0" width="130.0" height="26.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="955.0" y="423.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="955.0" dy="0.0">Ні (діє errexit)</tspan></text>
<rect x="660.0" y="475.0" width="480.0" height="185.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="900.0" y="517.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Аварійна зупинка (Fatal Abort):</tspan><tspan x="900.0" dy="15.6"></tspan><tspan x="900.0" dy="15.6">1. Спрацьовує пастка trap '...' ERR (якщо задано)</tspan><tspan x="900.0" dy="15.6">2. Спрацьовує фінальна пастка trap '...' EXIT</tspan><tspan x="900.0" dy="15.6">3. Процес негайно завершується з ненульовим кодом $?</tspan><tspan x="900.0" dy="15.6"></tspan><tspan x="900.0" dy="15.6">НАСЛІДОК: Помилка блокує виконання наступних рядків,</tspan><tspan x="900.0" dy="15.6">запобігаючи лавиноподібній деструкції системи.</tspan></text>
<rect x="50.0" y="690.0" width="1100.0" height="115.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="600.0" y="735.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Критична пастка функцій: якщо функція містить команди без захисту, але сама викликається</tspan><tspan x="600.0" dy="16.9">в умові if func; then або func || fallback, режим set -e ВІДМИКАЄТЬСЯ для ВСІХ внутрішніх команд функції.</tspan><tspan x="600.0" dy="16.9">Усі вкладені збої будуть мовчки проігноровані до повного виходу з функції.</tspan></text>
</svg>