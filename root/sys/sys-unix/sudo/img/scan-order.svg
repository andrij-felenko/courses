<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 770" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="770" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок розбору sudoers: включення на місці, перемагає останній збіг</text>
<text x="390.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">порядок, у якому парсер бачить рядки</text>
<text x="985.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">прохання: ivan → systemctl restart nginx</text>
<line x1="26.0" y1="92.0" x2="26.0" y2="640.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="93.0" width="680.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="390.0" y="114.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">/etc/sudoers, рядок 12</tspan><tspan x="390.0" dy="16.9">%wheel ALL = (ALL:ALL) ALL</tspan></text>
<rect x="775.0" y="101.5" width="420.0" height="33.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="985.0" y="122.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="985.0" dy="0.0">ivan не в wheel — не збіг</tspan></text>
<rect x="50.0" y="193.1" width="680.0" height="49.9" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="390.0" y="214.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">/etc/sudoers, рядок 20</tspan><tspan x="390.0" dy="16.9">@includedir /etc/sudoers.d</tspan></text>
<rect x="775.0" y="193.1" width="420.0" height="49.9" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="985.0" y="214.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle"><tspan x="985.0" dy="0.0">каталог розкривається ТУТ,</tspan><tspan x="985.0" dy="16.9">а не в кінці файлу</tspan></text>
<rect x="50.0" y="293.1" width="680.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="390.0" y="314.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">sudoers.d/10-deploy</tspan><tspan x="390.0" dy="16.9">ivan ALL = NOPASSWD: /usr/bin/systemctl restart nginx</tspan></text>
<rect x="775.0" y="301.5" width="420.0" height="33.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="985.0" y="322.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="985.0" dy="0.0">збіг ①: без пароля</tspan></text>
<rect x="50.0" y="393.1" width="680.0" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="390.0" y="414.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">sudoers.d/50-lock</tspan><tspan x="390.0" dy="16.9">ivan ALL = (ALL) ALL</tspan></text>
<rect x="775.0" y="401.5" width="420.0" height="33.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="985.0" y="422.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="985.0" dy="0.0">збіг ② — ВИГРАЄ: з паролем</tspan></text>
<rect x="50.0" y="493.1" width="680.0" height="49.9" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/><text x="390.0" y="514.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">sudoers.d/90-audit.bak</tspan><tspan x="390.0" dy="16.9">ivan ALL = NOPASSWD: ALL</tspan></text>
<rect x="775.0" y="493.1" width="420.0" height="49.9" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="985.0" y="514.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="985.0" dy="0.0">пропущено: крапка в імені —</tspan><tspan x="985.0" dy="16.9">інакше виграв би цей</tspan></text>
<rect x="50.0" y="593.0" width="680.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="390.0" y="614.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">/etc/sudoers, рядок 21</tspan><tspan x="390.0" dy="16.9">Defaults timestamp_timeout=0</tspan></text>
<rect x="775.0" y="601.5" width="420.0" height="33.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="985.0" y="622.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="985.0" dy="0.0">діє, хоч і стоїть після каталогу</tspan></text>
<rect x="120.0" y="675.0" width="940.0" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="696.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">усередині каталогу файли беруться в лексичному порядку імен — тому їх і нумерують;</tspan><tspan x="590.0" dy="16.9">виграє ОСТАННІЙ збіг, а не найточніший: рядок-виняток над загальним рядком не діє</tspan></text>
</svg>