<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мета, дозвіл і насправді досяжне</text>
<rect x="40.0" y="40.0" width="1100.0" height="490.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<rect x="110.0" y="150.0" width="960.0" height="350.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<rect x="190.0" y="270.0" width="800.0" height="210.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="590.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">насправді досяжне</text>
<text x="590.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">оболонка з !sh у переглядачі · find -exec · копія програми в обхід «!»</text>
<text x="590.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">тобто повний root</text>
<text x="590.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">що дозволив рядок правила</text>
<text x="590.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">усе, чого можна домогтися від цієї програми з правами root</text>
<text x="590.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">разом із усім, що вона запустить далі</text>
<text x="590.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">що мав на думці адміністратор</text>
<text x="590.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">перезапустити оцей вебсервер</text>
<text x="590.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">мета описується метою, а правило — засобом;</text>
<text x="590.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">проміжок між колами і є ціною цієї підміни</text>
</svg>