<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило sudoers і п'ять питань, на які воно відповідає</text>
<text x="590.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">alice   db-*.example.org = (postgres) NOPASSWD: /usr/bin/pg_dump</text>
<rect x="80.0" y="113.0" width="340.0" height="34.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="134.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">alice</tspan></text>
<line x1="424.0" y1="130.0" x2="456.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="113.0" width="680.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="134.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">кому: користувач, %група або +мережева група</tspan></text>
<rect x="80.0" y="205.0" width="340.0" height="34.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="226.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">db-*.example.org</tspan></text>
<line x1="424.0" y1="222.0" x2="456.0" y2="222.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="205.0" width="680.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="226.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">на яких машинах діє це правило</tspan></text>
<rect x="80.0" y="297.0" width="340.0" height="34.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="318.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">(postgres)</tspan></text>
<line x1="424.0" y1="314.0" x2="456.0" y2="314.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="297.0" width="680.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="318.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">від чийого імені виконати (типово root)</tspan></text>
<rect x="80.0" y="389.0" width="340.0" height="34.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="410.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">NOPASSWD:</tspan></text>
<line x1="424.0" y1="406.0" x2="456.0" y2="406.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="389.0" width="680.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="410.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">за якої умови: чи потрібен доказ присутності</tspan></text>
<rect x="80.0" y="481.0" width="340.0" height="34.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="502.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">/usr/bin/pg_dump</tspan></text>
<line x1="424.0" y1="498.0" x2="456.0" y2="498.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="460.0" y="481.0" width="680.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="502.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">що саме дозволено — повний шлях і аргументи</tspan></text>
<rect x="140.0" y="543.0" width="900.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="564.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">жодного з цих п'яти питань ядро не бачить: воно знає лише числа процесу й біти в inode</tspan></text>
</svg>