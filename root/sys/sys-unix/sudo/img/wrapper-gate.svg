<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузька обгортка: усе зовнішнє відсіюється до exec</text>
<text x="285.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">що надходить ззовні</text>
<text x="865.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">що з цим робить обгортка</text>
<rect x="75.0" y="111.5" width="420.0" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="285.0" y="132.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">порожній argv: argc == 0</tspan></text>
<line x1="505.0" y1="128.0" x2="573.0" y2="128.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="585.0" y="111.5" width="560.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="132.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">argc звіряється до першого звертання до argv</tspan></text>
<rect x="75.0" y="195.5" width="420.0" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="285.0" y="216.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">зайві слова після дії</tspan></text>
<line x1="505.0" y1="212.0" x2="573.0" y2="212.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="585.0" y="195.5" width="560.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="216.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">приймаємо рівно один аргумент, решта — відмова</tspan></text>
<rect x="75.0" y="279.5" width="420.0" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="285.0" y="300.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">слово, якого немає в таблиці</tspan></text>
<line x1="505.0" y1="296.0" x2="573.0" y2="296.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="585.0" y="279.5" width="560.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="300.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">словник закритий: збіг або відмова, третього нема</tspan></text>
<rect x="75.0" y="363.5" width="420.0" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="285.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">оточення прохача</tspan></text>
<line x1="505.0" y1="380.0" x2="573.0" y2="380.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="585.0" y="363.5" width="560.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">дитині складаємо власне, а не чистимо успадковане</tspan></text>
<rect x="75.0" y="447.5" width="420.0" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="285.0" y="468.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">дескриптори з номерами 3 і вище</tspan></text>
<line x1="505.0" y1="464.0" x2="573.0" y2="464.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="585.0" y="447.5" width="560.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="468.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">закриті; 0, 1 і 2 гарантовано відкриті</tspan></text>
<rect x="75.0" y="531.5" width="420.0" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="285.0" y="552.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">бажання підказати шлях</tspan></text>
<line x1="505.0" y1="548.0" x2="573.0" y2="548.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="585.0" y="531.5" width="560.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="865.0" y="552.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">шлях сталий і абсолютний, execve без оболонки</tspan></text>
<rect x="210.0" y="621.9" width="760.0" height="52.2" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="643.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">командний рядок дитини склали МИ:</tspan><tspan x="590.0" dy="18.2">жоден його байт не прийшов ззовні</tspan></text>
</svg>