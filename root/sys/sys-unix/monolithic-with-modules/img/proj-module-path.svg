<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 720" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="720" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях модуля: що додає кожен крок і чим кожен крок відмовляє</text>
<text x="165.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">крок</text>
<text x="525.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">що з'являється</text>
<text x="980.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">що може відмовити</text>
<rect x="40.0" y="96.0" width="250.0" height="96.0" rx="6" fill="#eef4fb" stroke="#6b7280" stroke-width="1.4"/><text x="165.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">hello.c</tspan></text>
<rect x="310.0" y="96.0" width="430.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="525.0" y="132.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">module_init / module_exit</tspan><tspan x="525.0" dy="15.6">MODULE_LICENSE, module_param</tspan><tspan x="525.0" dy="15.6">pr_info у кільцевий буфер ядра</tspan></text>
<rect x="760.0" y="96.0" width="440.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="980.0" y="140.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">немає MODULE_LICENSE →</tspan><tspan x="980.0" dy="15.6">modpost зупиняє збирання</tspan></text>
<line x1="165.0" y1="194.0" x2="165.0" y2="214.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="216.0" width="250.0" height="96.0" rx="6" fill="#eef4fb" stroke="#6b7280" stroke-width="1.4"/><text x="165.0" y="268.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">make (kbuild + modpost)</tspan></text>
<rect x="310.0" y="216.0" width="430.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="525.0" y="252.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">hello.ko: ELF з нерозв'язаними</tspan><tspan x="525.0" dy="15.6">символами плюс рядок vermagic;</tspan><tspan x="525.0" dy="15.6">Module.symvers з експортами</tspan></text>
<rect x="760.0" y="216.0" width="440.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="980.0" y="260.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">GPL-only символ у закритому</tspan><tspan x="980.0" dy="15.6">модулі → помилка modpost</tspan></text>
<line x1="165.0" y1="314.0" x2="165.0" y2="334.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="336.0" width="250.0" height="96.0" rx="6" fill="#eef4fb" stroke="#6b7280" stroke-width="1.4"/><text x="165.0" y="388.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">insmod hello.ko</tspan></text>
<rect x="310.0" y="336.0" width="430.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="525.0" y="372.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">ядро звіряє vermagic, розв'язує</tspan><tspan x="525.0" dy="15.6">символи, кладе код у свою пам'ять,</tspan><tspan x="525.0" dy="15.6">кличе init-функцію</tspan></text>
<rect x="760.0" y="336.0" width="440.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="980.0" y="380.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">інше ядро → ENOEXEC,</tspan><tspan x="980.0" dy="15.6">«Invalid module format»</tspan></text>
<line x1="165.0" y1="434.0" x2="165.0" y2="454.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="456.0" width="250.0" height="96.0" rx="6" fill="#eef4fb" stroke="#6b7280" stroke-width="1.4"/><text x="165.0" y="508.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">модуль живий</tspan></text>
<rect x="310.0" y="456.0" width="430.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="525.0" y="500.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">/proc/modules, /sys/module/hello/,</tspan><tspan x="525.0" dy="15.6">refcnt, holders, parameters, taint</tspan></text>
<rect x="760.0" y="456.0" width="440.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="980.0" y="500.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">несумісна ліцензія → taint «P»;</tspan><tspan x="980.0" dy="15.6">зібраний поза деревом → «O»</tspan></text>
<line x1="165.0" y1="554.0" x2="165.0" y2="574.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="576.0" width="250.0" height="96.0" rx="6" fill="#eef4fb" stroke="#6b7280" stroke-width="1.4"/><text x="165.0" y="628.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">rmmod hello</tspan></text>
<rect x="310.0" y="576.0" width="430.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="525.0" y="620.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">ядро кличе exit-функцію</tspan><tspan x="525.0" dy="15.6">й звільняє пам'ять модуля</tspan></text>
<rect x="760.0" y="576.0" width="440.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="980.0" y="620.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">refcnt &gt; 0 → EWOULDBLOCK,</tspan><tspan x="980.0" dy="15.6">«Module hello is in use»</tspan></text>
</svg>