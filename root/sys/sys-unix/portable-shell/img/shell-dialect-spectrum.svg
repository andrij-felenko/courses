<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="50.0" y="20.0" width="1000.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="49.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">Спектр оболонок Unix: співвідношення строгості POSIX, швидкості та розширень</tspan></text>
<rect x="55.0" y="85.0" width="230.0" height="38.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="108.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Канонічний стандарт</tspan></text>
<rect x="55.0" y="131.0" width="230.0" height="54.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="155.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">IEEE 1003.1 (POSIX sh)</tspan><tspan x="170.0" dy="11.7">Специфікація Shell Command Language</tspan></text>
<rect x="55.0" y="193.0" width="230.0" height="200.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="278.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Мінімальне спільне ядро всіх систем.</tspan><tspan x="170.0" dy="11.7">• Жодних масивів, [[ ]], local, зрізів</tspan><tspan x="170.0" dy="11.7">• Гарантія роботи на будь-якому Unix</tspan><tspan x="170.0" dy="11.7">• Мета: максимальна переносність</tspan></text>
<rect x="307.0" y="85.0" width="230.0" height="38.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="422.0" y="108.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="422.0" dy="0.0">Швидкісні системні sh</tspan></text>
<rect x="307.0" y="131.0" width="230.0" height="54.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="422.0" y="155.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="422.0" dy="0.0">Dash, BusyBox Ash, Almquist sh</tspan><tspan x="422.0" dy="11.7">Типовий /bin/sh у Debian/Ubuntu, Alpine</tspan></text>
<rect x="307.0" y="193.0" width="230.0" height="200.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="422.0" y="278.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="422.0" dy="0.0">Легковагі інтерпретатори для init/скриптів.</tspan><tspan x="422.0" dy="11.7">• В 3–4 рази швидший старт за Bash</tspan><tspan x="422.0" dy="11.7">• Суворе дотримання стандарту POSIX</tspan><tspan x="422.0" dy="11.7">• Миттєво ламаються на башизмах</tspan></text>
<rect x="559.0" y="85.0" width="230.0" height="38.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="674.0" y="108.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="674.0" dy="0.0">Системні BSD оболонки</tspan></text>
<rect x="559.0" y="131.0" width="230.0" height="54.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/><text x="674.0" y="155.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="674.0" dy="0.0">FreeBSD sh, OpenBSD pdksh, NetBSD sh</tspan><tspan x="674.0" dy="11.7">Базовий userland BSD систем</tspan></text>
<rect x="559.0" y="193.0" width="230.0" height="200.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="674.0" y="278.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="674.0" dy="0.0">Оболонки нащадків Almquist та KornShell.</tspan><tspan x="674.0" dy="11.7">• POSIX з локальними розширеннями</tspan><tspan x="674.0" dy="11.7">• Відсутні розширення GNU Coreutils</tspan><tspan x="674.0" dy="11.7">• /bin/sh не має багатьох фіч Bash</tspan></text>
<rect x="811.0" y="85.0" width="230.0" height="38.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="926.0" y="108.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="926.0" dy="0.0">Розширені командні</tspan></text>
<rect x="811.0" y="131.0" width="230.0" height="54.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="926.0" y="155.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="926.0" dy="0.0">GNU Bash 5.x, Zsh, Ksh93, macOS Bash 3.2</tspan><tspan x="926.0" dy="11.7">Інтерактивні оболонки розробника</tspan></text>
<rect x="811.0" y="193.0" width="230.0" height="200.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="926.0" y="278.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="926.0" dy="0.0">Багатий синтаксис та зручності для CLI.</tspan><tspan x="926.0" dy="11.7">• Масиви, regex =~, [[ ]], &lt;(proc)</tspan><tspan x="926.0" dy="11.7">• Повільніший запуск (overhead ~10ms)</tspan><tspan x="926.0" dy="11.7">• Непереносні поза власним бінарником</tspan></text>
<rect x="55.0" y="415.0" width="1000.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<rect x="65.0" y="423.0" width="480.0" height="58.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="305.0" y="449.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Лівий край: Максимальна переносність, миттєвий запуск (initramfs, CI, контейнери),</tspan><tspan x="305.0" dy="11.7">суворий POSIX синтаксис, виявлення помилок статичними лінтерами</tspan></text>
<rect x="565.0" y="423.0" width="480.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="805.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">Правий край: Інтерактивна зручність, розширені структури даних,</tspan><tspan x="805.0" dy="13.0">прив'язка до конкретної версії інтерпретатора (Shebang: #!/usr/bin/env bash)</tspan></text>
</svg>