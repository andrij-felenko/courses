<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="50.0" y="20.0" width="1000.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="48.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">Архітектурна заміна башизмів на переносні еквіваленти POSIX sh</tspan></text>
<rect x="55.0" y="78.0" width="300.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="205.0" y="98.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">Башизм (Bash-специфічний синтаксис)</tspan></text>
<rect x="375.0" y="78.0" width="400.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="575.0" y="98.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="575.0" dy="0.0">Переносний еквівалент POSIX sh</tspan></text>
<rect x="795.0" y="78.0" width="250.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="920.0" y="98.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">Чому це працює безпечно</tspan></text>
<rect x="55.0" y="120.0" width="300.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="155.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">[[ $a == $b &amp;&amp; $c =~ ^[0-9]+$ ]]</tspan><tspan x="205.0" dy="15.0">Розширений test, regex, оператор ==</tspan></text>
<rect x="375.0" y="120.0" width="400.0" height="78.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="575.0" y="148.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">[ &quot;$a&quot; = &quot;$b&quot; ] &amp;&amp; case &quot;$c&quot; in</tspan><tspan x="575.0" dy="15.0">    ''|*[!0-9]*) false ;; *) true ;; esac</tspan><tspan x="575.0" dy="15.0">Квотований [ ] та зіставлення case</tspan></text>
<rect x="795.0" y="120.0" width="250.0" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="920.0" y="155.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">[ — звичайна утиліта, потребує лапок;</tspan><tspan x="920.0" dy="13.7">case замінює regex без розширень</tspan></text>
<rect x="55.0" y="206.0" width="300.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="241.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">diff &lt;(cmd1) &lt;(cmd2)</tspan><tspan x="205.0" dy="15.0">Підстановка процесів через /dev/fd/N</tspan></text>
<rect x="375.0" y="206.0" width="400.0" height="78.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="575.0" y="234.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">mkfifo /tmp/p1 /tmp/p2</tspan><tspan x="575.0" dy="15.0">cmd1 &gt; /tmp/p1 &amp; cmd2 &gt; /tmp/p2 &amp;</tspan><tspan x="575.0" dy="15.0">diff /tmp/p1 /tmp/p2; rm /tmp/p1 /tmp/p2</tspan></text>
<rect x="795.0" y="206.0" width="250.0" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="920.0" y="241.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">Явний FIFO канал стандартизований</tspan><tspan x="920.0" dy="15.0">і працює без підтримки /dev/fd</tspan></text>
<rect x="55.0" y="292.0" width="300.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="327.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">local var=$(command)</tspan><tspan x="205.0" dy="15.0">Ключове слово local + присвоєння</tspan></text>
<rect x="375.0" y="292.0" width="400.0" height="78.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="575.0" y="320.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">var=$(command)</tspan><tspan x="575.0" dy="15.0">( subshell: var=$(command); do_work )</tspan><tspan x="575.0" dy="15.0">Роздільне присвоєння або субшел</tspan></text>
<rect x="795.0" y="292.0" width="250.0" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="920.0" y="327.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">local var=$(cmd) затирає $? команди;</tspan><tspan x="920.0" dy="13.7">subshell гарантує повну ізоляцію</tspan></text>
<rect x="55.0" y="378.0" width="300.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="413.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">arr=(&quot;a b&quot; &quot;c&quot;); echo &quot;${arr[0]}&quot;</tspan><tspan x="205.0" dy="15.0">Індексовані масиви</tspan></text>
<rect x="375.0" y="378.0" width="400.0" height="78.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="575.0" y="406.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">set -- &quot;a b&quot; &quot;c&quot;; echo &quot;$1&quot;</tspan><tspan x="575.0" dy="15.0">for item in &quot;$@&quot;; do ... done</tspan><tspan x="575.0" dy="15.0">Позиційні параметри як єдиний масив</tspan></text>
<rect x="795.0" y="378.0" width="250.0" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="920.0" y="413.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">&quot;$@&quot; зберігає елементи з пробілами</tspan><tspan x="920.0" dy="15.0">і є стандартом у кожному sh</tspan></text>
<rect x="55.0" y="464.0" width="300.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="499.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">${var:0:4} або ${var//foo/bar}</tspan><tspan x="205.0" dy="15.0">Зрізи підрядків та підстановка</tspan></text>
<rect x="375.0" y="464.0" width="400.0" height="78.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="575.0" y="492.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">echo &quot;$var&quot; | cut -c 1-4</tspan><tspan x="575.0" dy="15.0">echo &quot;$var&quot; | sed 's/foo/bar/g'</tspan><tspan x="575.0" dy="15.0">Стандартні фільтри тексту</tspan></text>
<rect x="795.0" y="464.0" width="250.0" height="78.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="920.0" y="499.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">${var#pre} та ${var%suf} у sh;</tspan><tspan x="920.0" dy="15.0">решта операцій — через sed/cut/awk</tspan></text>
</svg>