<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="50.0" y="20.0" width="1000.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="48.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">Розбіжності системних утиліт: GNU Coreutils проти BSD / macOS Userland</tspan></text>
<rect x="55.0" y="76.0" width="120.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="96.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">Утиліта</tspan></text>
<rect x="190.0" y="76.0" width="260.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="96.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">Діалект GNU (Linux)</tspan></text>
<rect x="465.0" y="76.0" width="260.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="595.0" y="96.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">Діалект BSD (macOS / FreeBSD)</tspan></text>
<rect x="740.0" y="76.0" width="305.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="892.5" y="96.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="892.5" dy="0.0">Гарантовано переносний патерн</tspan></text>
<rect x="55.0" y="118.0" width="120.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="149.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">sed -i</tspan><tspan x="115.0" dy="15.6">(In-place)</tspan></text>
<rect x="190.0" y="118.0" width="260.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="149.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">sed -i 's/a/b/g' file</tspan><tspan x="320.0" dy="15.0">Суфікс бекапу необов'язковий</tspan></text>
<rect x="465.0" y="118.0" width="260.0" height="70.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="595.0" y="149.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">sed -i '' 's/a/b/g' file</tspan><tspan x="595.0" dy="15.0">Вимагає явний суфікс (хоч '')</tspan></text>
<rect x="740.0" y="118.0" width="305.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="892.5" y="149.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="892.5" dy="0.0">sed 's/a/b/g' file &gt; f.tmp &amp;&amp; mv f.tmp file</tspan><tspan x="892.5" dy="13.7">або: sed -i.bak 's/a/b/g' file &amp;&amp; rm file.bak</tspan></text>
<rect x="55.0" y="196.0" width="120.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="227.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">date</tspan><tspan x="115.0" dy="15.6">(Timestamp)</tspan></text>
<rect x="190.0" y="196.0" width="260.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="227.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">date -d &quot;@1700000000&quot;</tspan><tspan x="320.0" dy="15.0">date -d &quot;+1 day&quot;</tspan></text>
<rect x="465.0" y="196.0" width="260.0" height="70.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="595.0" y="227.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">date -r 1700000000</tspan><tspan x="595.0" dy="15.0">date -v+1d -j -f &quot;%Y-%m-%d&quot;</tspan></text>
<rect x="740.0" y="196.0" width="305.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="892.5" y="227.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="892.5" dy="0.0">date +%s  (поточний Epoch)</tspan><tspan x="892.5" dy="15.0">Складні обчислення часу — через awk / C</tspan></text>
<rect x="55.0" y="274.0" width="120.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="305.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">grep</tspan><tspan x="115.0" dy="15.6">(Regex)</tspan></text>
<rect x="190.0" y="274.0" width="260.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="305.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">grep -P '\d+\s+\w+'</tspan><tspan x="320.0" dy="15.0">Perl-сумісні вирази (PCRE)</tspan></text>
<rect x="465.0" y="274.0" width="260.0" height="70.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="595.0" y="305.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">grep -E '[0-9]+[[:space:]]+[a-zA-Z_]+'</tspan><tspan x="595.0" dy="13.7">-P відсутній або ламає прапорці</tspan></text>
<rect x="740.0" y="274.0" width="305.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="892.5" y="305.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="892.5" dy="0.0">grep -E (Extended POSIX Regex)</tspan><tspan x="892.5" dy="15.0">Класи символів [[:space:]], [[:digit:]]</tspan></text>
<rect x="55.0" y="352.0" width="120.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="383.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">find</tspan><tspan x="115.0" dy="15.6">(Traversal)</tspan></text>
<rect x="190.0" y="352.0" width="260.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="383.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">find . -maxdepth 1 -delete</tspan><tspan x="320.0" dy="15.0">Розширення GNU</tspan></text>
<rect x="465.0" y="352.0" width="260.0" height="70.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="595.0" y="383.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">find . -depth 1 -delete</tspan><tspan x="595.0" dy="15.0">Прапорці різняться</tspan></text>
<rect x="740.0" y="352.0" width="305.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="892.5" y="383.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="892.5" dy="0.0">find . -name '*.tmp' -exec rm -f {} +</tspan><tspan x="892.5" dy="15.0">Обмеження глибини — через -prune</tspan></text>
<rect x="55.0" y="430.0" width="120.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="461.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">which vs</tspan><tspan x="115.0" dy="15.6">command</tspan></text>
<rect x="190.0" y="430.0" width="260.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="461.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">which tool  (зовнішня утиліта)</tspan><tspan x="320.0" dy="15.0">Різні коди помилок</tspan></text>
<rect x="465.0" y="430.0" width="260.0" height="70.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="595.0" y="461.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">which tool  (csh/sh скрипт)</tspan><tspan x="595.0" dy="15.0">Часто повертає 0 навіть при 404</tspan></text>
<rect x="740.0" y="430.0" width="305.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="892.5" y="461.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="892.5" dy="0.0">command -v tool &gt;/dev/null 2&gt;&amp;1</tspan><tspan x="892.5" dy="15.0">Вбудована перевірка POSIX у кожному sh</tspan></text>
</svg>