<line x1="762.0" y1="230.0" x2="728.0" y2="258.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="440.0" width="1060.0" height="72.0" rx="6" fill="#fbfcff" stroke="#1a1a1a" stroke-width="1.4"/><text x="570.0" y="463.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">порядок дій не переставляється: спершу відвести ядра розділом (парами SMT-сусідів),</tspan><tspan x="570.0" dy="16.9">потім перенести переривання, потім вимкнути тік і зворотні виклики RCU —</tspan><tspan x="570.0" dy="16.9">і аж наприкінці прив'язувати власні потоки масками</tspan></text>
<text x="570.0" y="552.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">зроблена лише остання дія дає прив'язку без ізоляції</text>
