<rect x="40.0" y="196.0" width="330.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="205.0" y="222.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">потоки ядра цього ядра</tspan></text>
<rect x="40.0" y="242.0" width="330.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.1"/><text x="205.0" y="263.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">перенести не можна;</tspan><tspan x="205.0" dy="15.6">RCU виносять через rcu_nocbs=</tspan></text>
<rect x="40.0" y="322.0" width="330.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="205.0" y="348.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">тік таймера</tspan></text>
<rect x="40.0" y="368.0" width="330.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.1"/><text x="205.0" y="397.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">nohz_full= (поки задача одна)</tspan></text>
<rect x="770.0" y="70.0" width="330.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="935.0" y="96.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="935.0" dy="0.0">міжпроцесорні виклики</tspan></text>
<rect x="770.0" y="116.0" width="330.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.1"/><text x="935.0" y="145.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">вимикача немає взагалі</tspan></text>
<rect x="770.0" y="196.0" width="330.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="935.0" y="222.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="935.0" dy="0.0">сусідня нитка SMT</tspan></text>
<rect x="770.0" y="242.0" width="330.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.1"/><text x="935.0" y="271.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="935.0" dy="0.0">брати в розділ ОБИДВІ нитки</tspan></text>
<rect x="420.0" y="176.0" width="300.0" height="128.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.4"/><text x="570.0" y="217.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">ізольоване ядро</tspan><tspan x="570.0" dy="18.2"></tspan><tspan x="570.0" dy="18.2">cpuset і маска керують</tspan><tspan x="570.0" dy="18.2">тут лише задачами</tspan></text>
