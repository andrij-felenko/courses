<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що потрапляє на ізольоване ядро попри cpuset</text>
<rect x="40.0" y="70.0" width="330.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="205.0" y="96.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">переривання пристроїв</tspan></text>
