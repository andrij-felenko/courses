<rect x="55.0" y="253.2" width="340.0" height="43.6" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.5"/><text x="225.0" y="271.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Вади: Неатомарність, повільний ASCII,</tspan><tspan x="225.0" dy="15.6">колізії номерів при гарячому підключенні</tspan></text>
