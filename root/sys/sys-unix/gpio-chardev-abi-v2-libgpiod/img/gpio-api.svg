<rect x="505.0" y="108.2" width="340.0" height="43.6" rx="6" fill="#ffffff" stroke="#9ae6b4" stroke-width="1.5"/><text x="675.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Userspace: /dev/gpiochipN (chardev v2)</tspan><tspan x="675.0" dy="15.6">libgpiod (C/C++), атомарні ioctl()</tspan></text>
<rect x="505.0" y="178.2" width="340.0" height="43.6" rx="6" fill="#ffffff" stroke="#9ae6b4" stroke-width="1.5"/><text x="675.0" y="196.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Kernel: struct gpio_desc*</tspan><tspan x="675.0" dy="15.6">Прив'язка до dev, Active-Low, sleep semantics</tspan></text>
