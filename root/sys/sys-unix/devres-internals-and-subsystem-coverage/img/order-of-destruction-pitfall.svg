<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок руйнування ресурсів: ризик Use-After-Free та коректне LIFO</text>
<rect x="20.0" y="50.0" width="410.0" height="345.0" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="225.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Небезпечно: Ручний kfree + devm переривання</text>
<rect x="35.0" y="105.0" width="380.0" height="44.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="45.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. devm_kzalloc()</text>
<text x="45.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Пам'ять стану priv під керуванням devm</text>
<rect x="35.0" y="159.0" width="380.0" height="44.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="45.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. devm_request_irq(..., priv)</text>
<text x="45.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">IRQ-обробник тримає вказівник на priv</text>
<rect x="35.0" y="213.0" width="380.0" height="44.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="45.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">3. remove(): ручний kfree(priv)</text>
<text x="45.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">ПАМ'ЯТЬ ЗВІЛЬНЕНО ДО ВІДВ'ЯЗКИ IRQ!</text>
<rect x="35.0" y="267.0" width="380.0" height="44.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="45.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">4. Асинхронне апаратне переривання</text>
<text x="45.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">ISR звертається до вже звільненого priv-&gt;regs</text>
<rect x="35.0" y="321.0" width="380.0" height="44.0" rx="4" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<text x="45.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">5. Результат: Kernel Oops / Panic</text>
<text x="45.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">Use-After-Free через порушення черговості</text>
<rect x="450.0" y="50.0" width="410.0" height="345.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="655.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Безпечно: Усі ресурси через devm (LIFO) або Action</text>
<rect x="465.0" y="105.0" width="380.0" height="44.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="475.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. devm_kzalloc()</text>
<text x="475.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Пам'ять виділено першою (звільниться останньою)</text>
<rect x="465.0" y="159.0" width="380.0" height="44.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="475.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. devm_request_irq(..., priv)</text>
<text x="475.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">IRQ зареєстровано другим (звільниться першим)</text>
<rect x="465.0" y="213.0" width="380.0" height="44.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="475.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">3. remove(): cancel_work_sync()</text>
<text x="475.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Зупинка асинхронних черг перед виходом</text>
<rect x="465.0" y="267.0" width="380.0" height="44.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="1.2"/>
<text x="475.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">4. devres_release_all() (LIFO)</text>
<text x="475.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Крок А: free_irq(dev, priv) вимикає обробник</text>
<rect x="465.0" y="321.0" width="380.0" height="44.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="1.2"/>
<text x="475.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">5. devres_release_all() (LIFO)</text>
<text x="475.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Крок Б: kfree(priv) безпечно чистить пам'ять</text>
</svg>