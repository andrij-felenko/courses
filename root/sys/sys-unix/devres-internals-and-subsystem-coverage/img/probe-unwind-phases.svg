<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фази реєстрації та автоматичного LIFO-очищення devres</text>
<rect x="20.0" y="45.0" width="840.0" height="175.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="35.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Успішне завантаження та вивантаження драйвера (probe → remove)</text>
<rect x="40.0" y="90.0" width="185.0" height="55.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="132.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">devm_kzalloc()</text>
<text x="132.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Стек: [Пам'ять]</text>
<line x1="225.0" y1="117.0" x2="235.0" y2="117.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="235.0" y="90.0" width="185.0" height="55.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="327.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">devm_ioremap_resource()</text>
<text x="327.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Стек: [Пам'ять, MMIO]</text>
<line x1="420.0" y1="117.0" x2="430.0" y2="117.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="430.0" y="90.0" width="185.0" height="55.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="522.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">devm_clk_get_enabled()</text>
<text x="522.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Стек: [Пам'ять, MMIO, Clk]</text>
<line x1="615.0" y1="117.0" x2="625.0" y2="117.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="625.0" y="90.0" width="185.0" height="55.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="717.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">devm_request_irq()</text>
<text x="717.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Стек: [Пам'ять, MMIO, Clk, IRQ]</text>
<rect x="40.0" y="155.0" width="800.0" height="50.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/>
<text x="440.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Фаза remove() або unbind: devres_release_all() автоматично вивільняє LIFO</text>
<text x="440.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Порядок звільнення: 1. free_irq  →  2. clk_disable_unprepare  →  3. iounmap  →  4. kfree</text>
<rect x="20.0" y="240.0" width="840.0" height="195.0" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="1.2"/>
<text x="35.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">2. Збій посеред probe(): автоматичне аварійне розмотування (Rollback)</text>
<rect x="40.0" y="285.0" width="185.0" height="55.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="132.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">devm_kzalloc()</text>
<text x="132.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">OK</text>
<line x1="225.0" y1="312.0" x2="235.0" y2="312.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="235.0" y="285.0" width="185.0" height="55.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="327.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">devm_ioremap_resource()</text>
<text x="327.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">OK</text>
<line x1="420.0" y1="312.0" x2="430.0" y2="312.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="430.0" y="285.0" width="185.0" height="55.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="522.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">devm_clk_get_enabled()</text>
<text x="522.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">OK</text>
<line x1="615.0" y1="312.0" x2="625.0" y2="312.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="625.0" y="285.0" width="185.0" height="55.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="717.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">devm_request_irq()</text>
<text x="717.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ПОМИЛКА (-EBUSY)</text>
<rect x="40.0" y="355.0" width="800.0" height="65.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="440.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Драйвер повертає -EBUSY; ядро викликає devres_release_all(dev)</text>
<text x="440.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Звільняються лише успішно зареєстровані ресурси: Clk → MMIO → Пам'ять</text>
<text x="440.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Жодних витоків ресурсів, відсутня потреба в заплутаних goto err_*</text>
</svg>