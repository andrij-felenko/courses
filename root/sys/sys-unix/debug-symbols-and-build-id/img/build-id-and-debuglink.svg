<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333"/>
  </marker>
</defs>
<rect width="860" height="480" fill="#ffffff"/>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізми пошуку символів налагоджувачем: .gnu_debuglink vs Build ID</text>
<rect x="240.0" y="55.0" width="380.0" height="80.0" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5"/>
<text x="430.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Виконуваний бінарник: /usr/bin/daemon</text>
<rect x="255.0" y="92.0" width="165.0" height="34.0" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/>
<text x="337.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle" font-weight="700">.gnu_debuglink</text>
<text x="337.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#854d0e" text-anchor="middle">daemon.debug + CRC32</text>
<rect x="435.0" y="92.0" width="170.0" height="34.0" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="520.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#3730a3" text-anchor="middle" font-weight="700">.note.gnu.build-id</text>
<text x="520.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#3730a3" text-anchor="middle">SHA-1: 7a9f1b2c4d8e...</text>
<line x1="337.0" y1="135.0" x2="200.0" y2="180.0" stroke="#ca8a04" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="180.0" width="360.0" height="270.0" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="210.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">Шлях А: Пошук за назвою (.gnu_debuglink)</text>
<rect x="45.0" y="220.0" width="330.0" height="36.0" rx="6" fill="#ffffff" stroke="#fbbf24" stroke-width="1.0"/>
<text x="210.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="middle" font-weight="700">1. Поруч із бінарником:</text>
<text x="210.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">/usr/bin/daemon.debug</text>
<rect x="45.0" y="264.0" width="330.0" height="36.0" rx="6" fill="#ffffff" stroke="#fbbf24" stroke-width="1.0"/>
<text x="210.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="middle" font-weight="700">2. У підкаталозі .debug/:</text>
<text x="210.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">/usr/bin/.debug/daemon.debug</text>
<rect x="45.0" y="308.0" width="330.0" height="36.0" rx="6" fill="#ffffff" stroke="#fbbf24" stroke-width="1.0"/>
<text x="210.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="middle" font-weight="700">3. У глобальному /usr/lib/debug/:</text>
<text x="210.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">/usr/lib/debug/usr/bin/daemon.debug</text>
<rect x="45.0" y="354.0" width="330.0" height="82.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.0"/>
<text x="210.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700">Перевірка цілісності: CRC32</text>
<text x="210.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#78350f" text-anchor="middle">• Обчислюється CRC-32 знайденого файлу</text>
<text x="210.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#78350f" text-anchor="middle">• Порівнюється зі значенням у секції</text>
<text x="210.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-style="italic">Недолік: чутливий до зміни шляхів і назв</text>
<line x1="520.0" y1="135.0" x2="660.0" y2="180.0" stroke="#4f46e5" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="470.0" y="180.0" width="360.0" height="270.0" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
<text x="650.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#3730a3" text-anchor="middle" font-weight="700">Шлях Б: Адресація за вмістом (Build ID)</text>
<rect x="485.0" y="220.0" width="330.0" height="44.0" rx="6" fill="#ffffff" stroke="#818cf8" stroke-width="1.0"/>
<text x="650.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#312e81" text-anchor="middle" font-weight="700">1. Читання 160-бітного SHA-1 хешу:</text>
<text x="650.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4338ca" text-anchor="middle">Build ID = 7a9f1b2c4d8e3f015a...</text>
<rect x="485.0" y="272.0" width="330.0" height="48.0" rx="6" fill="#ffffff" stroke="#818cf8" stroke-width="1.0"/>
<text x="650.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#312e81" text-anchor="middle" font-weight="700">2. Прямий канонічний шлях у сховищі:</text>
<text x="650.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Каталог перших 2 символів хешу:</text>
<text x="650.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e1b4b" text-anchor="middle" font-weight="700">/usr/lib/debug/.build-id/7a/9f1b2c4d8e....debug</text>
<rect x="485.0" y="330.0" width="330.0" height="106.0" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.0"/>
<text x="650.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#3730a3" text-anchor="middle" font-weight="700">Переваги Build-ID архітектури</text>
<text x="650.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#312e81" text-anchor="middle">• Детермінованість: 1 біт змін у коді = інший хеш</text>
<text x="650.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#312e81" text-anchor="middle">• Незалежність від шляхів, імен файлів та версій</text>
<text x="650.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#312e81" text-anchor="middle">• Нульовий ризик завантаження чужих символів</text>
<text x="650.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">• Прямий ключ для мережевого запиту в debuginfod</text>
</svg>