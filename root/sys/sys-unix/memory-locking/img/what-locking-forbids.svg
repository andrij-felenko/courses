<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 866" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="866" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що прибивання пам'яті забороняє, а чого не забороняє</text>
<rect x="40.0" y="52.0" width="300.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="190.0" y="79.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">подія</tspan></text>
<rect x="366.0" y="52.0" width="330.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="531.0" y="79.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="531.0" dy="0.0">що з прибитою сторінкою</tspan></text>
<rect x="722.0" y="52.0" width="638.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="1041.0" y="79.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="1041.0" dy="0.0">чому саме так</tspan></text>
<rect x="40.0" y="118.0" width="300.0" height="76.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="160.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Витіснення у своп</tspan></text>
<rect x="366.0" y="118.0" width="330.0" height="76.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="531.0" y="160.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="531.0" dy="0.0">ЗАБОРОНЕНО</tspan></text>
<rect x="722.0" y="118.0" width="638.0" height="76.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="1041.0" y="152.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1041.0" dy="0.0">сторінка лежить у списку, якого</tspan><tspan x="1041.0" dy="16.2">збирач не переглядає взагалі</tspan></text>
<rect x="40.0" y="208.0" width="300.0" height="76.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="242.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Викидання файлової</tspan><tspan x="190.0" dy="16.2">сторінки з кешу</tspan></text>
<rect x="366.0" y="208.0" width="330.0" height="76.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="531.0" y="250.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="531.0" dy="0.0">ЗАБОРОНЕНО</tspan></text>
<rect x="722.0" y="208.0" width="638.0" height="76.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="1041.0" y="242.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1041.0" dy="0.0">той самий список і та сама причина:</tspan><tspan x="1041.0" dy="16.2">забирати нема кому</tspan></text>
<rect x="40.0" y="298.0" width="300.0" height="76.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="340.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Ущільнення пам'яті</tspan></text>
<rect x="366.0" y="298.0" width="330.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="531.0" y="340.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="531.0" dy="0.0">ДОЗВОЛЕНО</tspan></text>
<rect x="722.0" y="298.0" width="638.0" height="76.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="1041.0" y="332.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1041.0" dy="0.0">вміст переносять в інший кадр;</tspan><tspan x="1041.0" dy="16.2">адреса чинна, але буде дрібний збій</tspan></text>
<rect x="40.0" y="388.0" width="300.0" height="76.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="422.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">munmap ділянки</tspan><tspan x="190.0" dy="16.2">або exec</tspan></text>
<rect x="366.0" y="388.0" width="330.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="531.0" y="430.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="531.0" dy="0.0">ПРИБИВАННЯ ЗНИКАЄ</tspan></text>
<rect x="722.0" y="388.0" width="638.0" height="76.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="1041.0" y="422.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1041.0" dy="0.0">воно живе на ділянці простору,</tspan><tspan x="1041.0" dy="16.2">а не на самій сторінці</tspan></text>
<rect x="40.0" y="478.0" width="300.0" height="76.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="520.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">fork</tspan></text>
<rect x="366.0" y="478.0" width="330.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="531.0" y="520.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="531.0" dy="0.0">ДИТИНА БЕЗ НЬОГО</tspan></text>
<rect x="722.0" y="478.0" width="638.0" height="76.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="1041.0" y="512.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1041.0" dy="0.0">нащадок дістає ті самі сторінки,</tspan><tspan x="1041.0" dy="16.2">але ділянку без ознаки прибиття</tspan></text>
<rect x="40.0" y="568.0" width="300.0" height="76.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="610.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Присипляння на диск</tspan></text>
<rect x="366.0" y="568.0" width="330.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="531.0" y="610.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="531.0" dy="0.0">НЕ ЗАВАДИТЬ</tspan></text>
<rect x="722.0" y="568.0" width="638.0" height="76.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="1041.0" y="602.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1041.0" dy="0.0">образ усієї пам'яті пише ядро,</tspan><tspan x="1041.0" dy="16.2">і жодні прапорці його не спиняють</tspan></text>
<rect x="40.0" y="658.0" width="300.0" height="76.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="190.0" y="692.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Аварійний дамп</tspan><tspan x="190.0" dy="16.2">і ptrace</tspan></text>
<rect x="366.0" y="658.0" width="330.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="531.0" y="700.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="531.0" dy="0.0">НЕ ЗАВАДИТЬ</tspan></text>
<rect x="722.0" y="658.0" width="638.0" height="76.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="1041.0" y="692.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1041.0" dy="0.0">вміст лягає у файл або в чужий буфер;</tspan><tspan x="1041.0" dy="16.2">від дампа рятує окремо MADV_DONTDUMP</tspan></text>
<rect x="40.0" y="762.0" width="1320.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="700.0" y="800.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">прибивання забирає в ядра рівно одну свободу — віддати кадр комусь іншому;</tspan><tspan x="700.0" dy="17.6">усе решта, що рухає сторінку або копіює її вміст назовні, лишається чинним</tspan></text>
</svg>