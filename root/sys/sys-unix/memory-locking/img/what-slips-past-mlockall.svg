<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1290 588" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1290" height="588" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири джерела сторінок, які приходять уже після mlockall</text>
<rect x="40.0" y="52.0" width="300.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="190.0" y="78.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">звідки візьметься сторінка</tspan></text>
<rect x="356.0" y="52.0" width="430.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="571.0" y="78.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="571.0" dy="0.0">чому mlockall її не покрив</tspan></text>
<rect x="802.0" y="52.0" width="430.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="1017.0" y="78.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="1017.0" dy="0.0">крок кістяка, що це закриває</tspan></text>
<rect x="40.0" y="116.0" width="300.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="190.0" y="166.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Стек нижче вершини</tspan></text>
<rect x="356.0" y="116.0" width="430.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="571.0" y="158.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="571.0" dy="0.0">цих сторінок ще немає у відображенні:</tspan><tspan x="571.0" dy="16.2">стек росте вниз лише за потребою</tspan></text>
<rect x="802.0" y="116.0" width="430.0" height="92.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="1017.0" y="158.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1017.0" dy="0.0">спуск у локальний масив</tspan><tspan x="1017.0" dy="16.2">із ЗАПИСОМ у кожну сторінку</tspan></text>
<rect x="40.0" y="220.0" width="300.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="190.0" y="270.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Купа після free()</tspan></text>
<rect x="356.0" y="220.0" width="430.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="571.0" y="262.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="571.0" dy="0.0">розподільник зсуває верх купи вниз,</tspan><tspan x="571.0" dy="16.2">а великі шматки й зовсім віддає</tspan></text>
<rect x="802.0" y="220.0" width="430.0" height="92.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="1017.0" y="262.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1017.0" dy="0.0">M_TRIM_THRESHOLD −1, M_MMAP_MAX 0</tspan><tspan x="1017.0" dy="16.2">плюс одноразовий обхід обсягу</tspan></text>
<rect x="40.0" y="324.0" width="300.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="190.0" y="374.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Стек нового потоку</tspan></text>
<rect x="356.0" y="324.0" width="430.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="571.0" y="366.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="571.0" dy="0.0">MCL_FUTURE прибиває його при створенні —</tspan><tspan x="571.0" dy="16.2">разом із цілими 8 МіБ межі</tspan></text>
<rect x="802.0" y="324.0" width="430.0" height="92.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="1017.0" y="366.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1017.0" dy="0.0">явний розмір стека потоку</tspan><tspan x="1017.0" dy="16.2">і піднята межа прибитої пам'яті</tspan></text>
<rect x="40.0" y="428.0" width="300.0" height="92.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="190.0" y="478.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Арена нового потоку</tspan></text>
<rect x="356.0" y="428.0" width="430.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="571.0" y="470.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="571.0" dy="0.0">glibc заводить потокові власну купу,</tspan><tspan x="571.0" dy="16.2">якої розігрів не торкався</tspan></text>
<rect x="802.0" y="428.0" width="430.0" height="92.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="1017.0" y="470.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1017.0" dy="0.0">M_ARENA_MAX 1, а розігрів стека</tspan><tspan x="1017.0" dy="16.2">повторити в кожному потоці</tspan></text>
</svg>