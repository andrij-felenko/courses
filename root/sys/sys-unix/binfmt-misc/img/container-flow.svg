<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 870" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="870" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запуск AArch64-образу на x86-64: де саме спрацьовує прапорець F</text>
<text x="60.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">один раз на хості — реєстрація</text>
<rect x="60.0" y="70.0" width="450.0" height="82.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="285.0" y="106.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">рядок реєстрації з прапорцем F</tspan><tspan x="285.0" dy="17.6">(docker … qemu-user-static --reset -p yes)</tspan></text>
<line x1="522.0" y1="111.0" x2="588.0" y2="111.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="600.0" y="70.0" width="520.0" height="82.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="860.0" y="106.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">ядро ВІДКРИВАЄ /usr/bin/qemu-aarch64-static</tspan><tspan x="860.0" dy="17.6">і тримає відкритий файл у себе в таблиці</tspan></text>
<line x1="60.0" y1="176.0" x2="1120.0" y2="176.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="8 6"/>
<text x="60.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">далі — при кожному запуску</text>
<rect x="60.0" y="232.0" width="130.0" height="44.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="125.0" y="258.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">контейнер</tspan></text>
<rect x="210.0" y="214.0" width="910.0" height="80.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="665.0" y="249.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">контейнер: execve(&quot;/bin/sh&quot;) — файл з образу AArch64,</tspan><tspan x="665.0" dy="17.6">емулятора в цьому корені немає й не буде</tspan></text>
<line x1="665.0" y1="296.0" x2="665.0" y2="320.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="340.0" width="130.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="125.0" y="366.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">ядро</tspan></text>
<rect x="210.0" y="322.0" width="910.0" height="80.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="665.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">binfmt_elf: підпис ELF на місці, але поле машини = 0x00b7</tspan><tspan x="665.0" dy="17.6">→ «не моє», пошук іде далі</tspan></text>
<line x1="665.0" y1="404.0" x2="665.0" y2="428.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="448.0" width="130.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="125.0" y="474.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">ядро</tspan></text>
<rect x="210.0" y="430.0" width="910.0" height="80.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/><text x="665.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">binfmt_misc: двадцять байтів збіглися під маскою</tspan><tspan x="665.0" dy="17.6">→ виконуваний файл підміняють</tspan></text>
<line x1="665.0" y1="512.0" x2="665.0" y2="536.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="556.0" width="130.0" height="44.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="125.0" y="582.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">ядро</tspan></text>
<rect x="210.0" y="538.0" width="910.0" height="80.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="665.0" y="574.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">інтерпретатором стає КЛОН уже відкритого файлу з таблиці —</tspan><tspan x="665.0" dy="17.6">шлях не розв'язують узагалі, тож корінь контейнера не важить</tspan></text>
<line x1="665.0" y1="620.0" x2="665.0" y2="644.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="664.0" width="130.0" height="44.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="125.0" y="690.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">контейнер</tspan></text>
<rect x="210.0" y="646.0" width="910.0" height="80.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="665.0" y="682.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">qemu-aarch64-static (зібраний статично) відкриває /bin/sh</tspan><tspan x="665.0" dy="17.6">у корені контейнера й виконує інструкції AArch64 на x86-64</tspan></text>
<rect x="60.0" y="754.0" width="1060.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="590.0" y="788.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Прапорець F переносить розв'язання шляху з моменту запуску в момент реєстрації.</tspan><tspan x="590.0" dy="17.6">Тому образ чужої архітектури лишається чистим: емулятор живе на хості, а користується ним контейнер.</tspan></text>
</svg>