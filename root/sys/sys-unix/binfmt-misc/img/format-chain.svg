<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 750" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="750" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кого ядро питає, що це за файл</text>
<rect x="60.0" y="54.0" width="1020.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="570.0" y="83.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">execve відкрив файл і прочитав перші 256 байтів — далі треба вгадати формат</tspan></text>
<line x1="290.0" y1="106.0" x2="290.0" y2="138.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="142.0" width="460.0" height="88.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="290.0" y="164.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">binfmt_elf</tspan><tspan x="290.0" dy="17.6">прикмета \x7fELF, а далі —</tspan><tspan x="290.0" dy="17.6">поле «цільова машина» мусить</tspan><tspan x="290.0" dy="17.6">збігтися з цим процесором</tspan></text>
<rect x="570.0" y="142.0" width="510.0" height="40.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="825.0" y="166.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">рідний ELF x86-64:  образ побудовано, кінець</tspan></text>
<rect x="570.0" y="190.0" width="510.0" height="40.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="825.0" y="214.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">ELF AArch64:  машина не та  →  «не моє»</tspan></text>
<line x1="290.0" y1="232.0" x2="290.0" y2="262.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="266.0" width="460.0" height="66.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="290.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">binfmt_script</tspan><tspan x="290.0" dy="17.6">прикмета «#!» на самому початку</tspan></text>
<rect x="570.0" y="278.0" width="510.0" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="825.0" y="303.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">перші два байти інші  →  «не моє»</tspan></text>
<line x1="290.0" y1="334.0" x2="290.0" y2="364.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="368.0" width="460.0" height="104.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="290.0" y="398.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">binfmt_misc</tspan><tspan x="290.0" dy="17.6">власного формату не знає:</tspan><tspan x="290.0" dy="17.6">перебирає рядки таблиці,</tspan><tspan x="290.0" dy="17.6">заповненої з простору користувача</tspan></text>
<rect x="570.0" y="380.0" width="510.0" height="80.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="825.0" y="407.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">двадцять байтів збіглися під маскою  →  підміна:</tspan><tspan x="825.0" dy="16.9">виконуваним файлом стає qemu-aarch64-static,</tspan><tspan x="825.0" dy="16.9">а початковий шлях переїжджає йому в аргументи</tspan></text>
<line x1="290.0" y1="474.0" x2="290.0" y2="504.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="508.0" width="460.0" height="78.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.6"/><text x="290.0" y="543.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">список вичерпано</tspan><tspan x="290.0" dy="17.6">жоден обробник не впізнав файл</tspan></text>
<rect x="570.0" y="520.0" width="510.0" height="54.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="825.0" y="543.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">execve повертає ENOEXEC —</tspan><tspan x="825.0" dy="16.9">оболонка перекладає це як «Exec format error»</tspan></text>
<rect x="60.0" y="610.0" width="1020.0" height="86.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="570.0" y="640.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">binfmt_misc додає себе в КІНЕЦЬ списку, і це несуча властивість.</tspan><tspan x="570.0" dy="17.6">Вбудовані обробники завжди мають першу відмову — рідну програму цієї машини перехопити не вийде.</tspan><tspan x="570.0" dy="17.6">І навпаки: відмова binfmt_elf на чужій архітектурі не є помилкою запуску, а перепусткою далі по ланцюгу.</tspan></text>
</svg>