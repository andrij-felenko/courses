<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура циклу обробки подій текстового редактора</text>
<text x="540.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цикл подій редактора: від байтів у stdin до оновлення буфера й екрана</text>
<rect x="60.0" y="80.0" width="280.0" height="95.0" rx="6" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.5"/>
<text x="200.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1. Зчитування stdin</text>
<text x="200.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">read(STDIN_FILENO, &amp;c, 1)</text>
<text x="200.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Таймаут або очікування події</text>
<text x="200.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Обробка помилок та EINTR</text>
<rect x="400.0" y="80.0" width="300.0" height="95.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/>
<text x="550.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d4ac0d" text-anchor="middle" font-weight="700">2. Декодер клавіш</text>
<text x="550.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Скінченний автомат:</text>
<text x="550.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">ASCII -&gt; дія, \x1b -&gt; перевірка CSI</text>
<text x="550.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Розпізнавання стрілок, PgUp, Del</text>
<rect x="760.0" y="80.0" width="260.0" height="95.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="890.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">3. Диспетчер команд</text>
<text x="890.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Вставка символу в текст</text>
<text x="890.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Рух курсора, прокрутка</text>
<text x="890.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Збереження, пошук, вихід</text>
<rect x="760.0" y="255.0" width="260.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="890.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Модифікація тексту</text>
<text x="890.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Оновлення структури даних:</text>
<text x="890.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Gap Buffer / Piece Table</text>
<text x="890.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Перерахунок рядків і довжин</text>
<rect x="400.0" y="255.0" width="300.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="550.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">5. Розрахунок Viewport</text>
<text x="550.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Відображення зміщення тексту</text>
<text x="550.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Обчислення row_offset, col_offset</text>
<text x="550.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Підготовка видимих рядків</text>
<rect x="60.0" y="255.0" width="280.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="200.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">6. Double-Buffered Render</text>
<text x="200.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Формування кадру в abuf (пам'ять)</text>
<text x="200.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Курсор, очищення рядків \x1b[K</text>
<text x="200.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Єдиний системний write(stdout)</text>
<line x1="340.0" y1="127.0" x2="395.0" y2="127.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="127.0" x2="755.0" y2="127.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="890.0" y1="175.0" x2="890.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="760.0" y1="302.0" x2="705.0" y2="302.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="302.0" x2="345.0" y2="302.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="200.0" y1="350.0" x2="200.0" y2="420.0" stroke="#333333" stroke-width="1.8"/>
<line x1="200.0" y1="420.0" x2="40.0" y2="420.0" stroke="#333333" stroke-width="1.8"/>
<line x1="40.0" y1="420.0" x2="40.0" y2="127.0" stroke="#333333" stroke-width="1.8"/>
<line x1="40.0" y1="127.0" x2="55.0" y2="127.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="120.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Очікування наступного введення</text>
<rect x="400.0" y="390.0" width="620.0" height="75.0" rx="6" fill="#fdf2e9" stroke="#e67e22" stroke-width="1.5"/>
<text x="710.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d35400" text-anchor="middle" font-weight="700">Асинхронна подія: Сигнал SIGWINCH (зміна розміру вікна)</text>
<text x="710.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Обробник виставляє resize_pending = 1 -&gt; ioctl(TIOCGWINSZ) -&gt; перерахунок Viewport</text>
<line x1="550.0" y1="390.0" x2="550.0" y2="355.0" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="495.0" width="980.0" height="42.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.0"/><text x="540.0" y="520.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Event Loop повністю розділяє обробку вводу, мутацію моделі тексту та пакетне малювання екрана</tspan></text>
</svg>