<rect x="410.0" y="184.0" width="770.0" height="88.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="795.0" y="224.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">постійна позначка FS_XFLAG_DAX (0x00008000)</tspan><tspan x="795.0" dy="16.2">ставлять: xfs_io -c 'chattr +x' · chattr +x · FS_IOC_FSSETXATTR</tspan></text>
<line x1="374.0" y1="228.0" x2="396.0" y2="228.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 5"/>
