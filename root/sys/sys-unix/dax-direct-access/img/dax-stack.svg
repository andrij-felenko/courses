<rect x="410.0" y="508.0" width="770.0" height="88.0" rx="6" fill="#f2f3f5" stroke="#6b7280" stroke-width="1.8"/><text x="795.0" y="548.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">/sys/bus/nd/devices: nmemN → regionN → namespaceN.M</tspan><tspan x="795.0" dy="16.2">те саме в машинному вигляді показує ndctl list -BDRN</tspan></text>
<line x1="374.0" y1="552.0" x2="396.0" y2="552.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 5"/>
<text x="620.0" y="636.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">пряме звертання виникає лише тоді, коли жоден із шарів не сказав «ні»;</tspan><tspan x="620.0" dy="16.2">будь-який один із них вимикає його для всіх, хто вище</tspan></text>
