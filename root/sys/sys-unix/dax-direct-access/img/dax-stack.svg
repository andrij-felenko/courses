<rect x="410.0" y="292.0" width="770.0" height="88.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="795.0" y="332.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">параметр монтування dax=always | dax=inode | dax=never</tspan><tspan x="795.0" dy="16.2">діючий стан S_DAX читають через statx: STATX_ATTR_DAX</tspan></text>
