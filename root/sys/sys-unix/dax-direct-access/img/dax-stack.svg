<rect x="410.0" y="400.0" width="770.0" height="88.0" rx="6" fill="#fdf3e7" stroke="#c0392b" stroke-width="1.8"/><text x="795.0" y="440.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">ndctl create-namespace -m fsdax|devdax --map=mem|dev</tspan><tspan x="795.0" dy="16.2">fsdax дає блоковий /dev/pmemN, devdax — символьний /dev/daxN.M</tspan></text>
