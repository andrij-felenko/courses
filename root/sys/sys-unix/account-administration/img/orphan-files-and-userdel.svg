<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Проблема повторного використання UID та осиротілих файлів</text>
<rect x="30.0" y="60.0" width="280.0" height="260.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="170.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1 · Користувач активний</text>
<line x1="40.0" y1="105.0" x2="300.0" y2="105.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="170.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Обліковий запис: andrij (UID 1005)</tspan><tspan x="170.0" dy="15.4"></tspan><tspan x="170.0" dy="15.4">• /home/andrij (inode: uid=1005)</tspan><tspan x="170.0" dy="15.4">• /var/mail/andrij (inode: uid=1005)</tspan><tspan x="170.0" dy="15.4">• /srv/shared/data.csv (inode: uid=1005)</tspan><tspan x="170.0" dy="15.4"></tspan><tspan x="170.0" dy="15.4">ls -l показує власником «andrij»</tspan></text>
<rect x="360.0" y="60.0" width="280.0" height="260.0" rx="8" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/>
<text x="500.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2 · Видалення userdel -r</text>
<line x1="370.0" y1="105.0" x2="630.0" y2="105.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="500.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Записи в /etc/passwd і shadow стерто</tspan><tspan x="500.0" dy="15.4"></tspan><tspan x="500.0" dy="15.4">✓ /home/andrij — видалено</tspan><tspan x="500.0" dy="15.4">✓ /var/mail/andrij — видалено</tspan><tspan x="500.0" dy="15.4">✗ /srv/shared/data.csv — ЗАЛИШИВСЯ</tspan><tspan x="500.0" dy="15.4"></tspan><tspan x="500.0" dy="15.4">ls -l показує «1005» (без імені)</tspan></text>
<rect x="690.0" y="60.0" width="280.0" height="260.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="830.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3 · Повторне використання UID</text>
<line x1="700.0" y1="105.0" x2="960.0" y2="105.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="830.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Створено новачка: bohdan (UID 1005)</tspan><tspan x="830.0" dy="15.4"></tspan><tspan x="830.0" dy="15.4">Ядро перевіряє тільки число 1005!</tspan><tspan x="830.0" dy="15.4">bohdan отримує повний доступ до</tspan><tspan x="830.0" dy="15.4">/srv/shared/data.csv попередника.</tspan><tspan x="830.0" dy="15.4"></tspan><tspan x="830.0" dy="15.4">Ризик витоку конфіденційних даних!</tspan></text>
<line x1="310.0" y1="190.0" x2="360.0" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="640.0" y1="190.0" x2="690.0" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="340.0" width="940.0" height="110.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="500.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Аудит та знешкодження осиротілих ресурсів перед видаленням UID</text>
<text x="500.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">1. Пошук файлів за числовим UID: find / -uid 1005 2&gt;/dev/null  (або загальний пошук безпритульних: find / -nouser)</tspan><tspan x="500.0" dy="14.9">2. Зміна власника або архівація: find / -uid 1005 -exec chown root:root {} +  або переміщення в архів безпеки.</tspan><tspan x="500.0" dy="14.9">3. Перевірка фонових завдань: crontab -u andrij -r, перевірка at-черги, завершення процесів: pkill -u 1005.</tspan></text>
</svg>