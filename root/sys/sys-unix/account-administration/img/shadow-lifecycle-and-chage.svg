<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл пароля та параметри терміну дії в /etc/shadow</text>
<rect x="30.0" y="55.0" width="940.0" height="75.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="500.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура рядка /etc/shadow (9 полів, розділених двокрапкою)</text>
<text x="500.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">user : $6$... : 19800 : 7 : 90 : 14 : 30 : 20200 : [res]</text>
<line x1="50.0" y1="240.0" x2="950.0" y2="240.0" stroke="#333333" stroke-width="2.5"/>
<line x1="930.0" y1="240.0" x2="960.0" y2="240.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="960.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">Час (дні)</text>
<circle cx="100.0" cy="240.0" r="6.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="100.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Зміна пароля</text>
<text x="100.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">sp_lstchg</text>
<rect x="100.0" y="232.0" width="120.0" height="16.0" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/>
<circle cx="220.0" cy="240.0" r="6.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="160.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Заборона зміни</text>
<text x="220.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">+ sp_min</text>
<rect x="220.0" y="232.0" width="300.0" height="16.0" rx="2" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.0"/>
<text x="370.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Нормальна дія пароля</text>
<rect x="520.0" y="232.0" width="140.0" height="16.0" rx="2" fill="#fff6e5" stroke="#6b7280" stroke-width="1.0"/>
<circle cx="520.0" cy="240.0" r="6.0" fill="#6b7280" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="660.0" cy="240.0" r="6.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="590.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Попередження</text>
<text x="520.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">max - warn</text>
<text x="660.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">+ sp_max</text>
<rect x="660.0" y="232.0" width="120.0" height="16.0" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.0"/>
<circle cx="780.0" cy="240.0" r="6.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="720.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Пароль прострочено</text>
<text x="780.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">+ sp_inact</text>
<circle cx="890.0" cy="240.0" r="7.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="890.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Блокування запису</text>
<text x="890.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">sp_expire</text>
<rect x="30.0" y="310.0" width="940.0" height="150.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="500.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Керування політикою старіння утилітою chage</text>
<text x="500.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">• chage -m &lt;дні&gt; (sp_min): мінімальний інтервал між змінами — захищає від швидкої ротації заради повернення старого пароля.</tspan><tspan x="500.0" dy="14.9">• chage -M &lt;дні&gt; (sp_max): максимальний термін чинності пароля; після цього вхід вимагає негайної заміни пароля.</tspan><tspan x="500.0" dy="14.9">• chage -W &lt;дні&gt; (sp_warn): кількість днів перед закінченням sp_max, коли login/PAM попереджає користувача.</tspan><tspan x="500.0" dy="14.9">• chage -I &lt;дні&gt; (sp_inact): пільговий період; після нього обліковий запис вимикається, навіть якщо користувач знає старий пароль.</tspan><tspan x="500.0" dy="14.9">• chage -E &lt;YYYY-MM-DD&gt; (sp_expire): абсолютна дата закінчення дії облікового запису (наприклад, термін контракту).</tspan></text>
</svg>