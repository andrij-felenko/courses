<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коли read() повертається: чотири комбінації VMIN і VTIME</text>
<rect x="190.0" y="56.0" width="380.0" height="36.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="380.0" y="78.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">VTIME = 0</tspan></text>
<rect x="590.0" y="56.0" width="380.0" height="36.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="780.0" y="78.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">VTIME &gt; 0</tspan></text>
<rect x="30.0" y="110.0" width="140.0" height="126.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="100.0" y="177.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">VMIN &gt; 0</tspan></text>
<rect x="30.0" y="250.0" width="140.0" height="126.0" rx="6" fill="#eef2f7" stroke="#6b7280" stroke-width="1.5"/><text x="100.0" y="317.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0.0">VMIN = 0</tspan></text>
<rect x="190.0" y="110.0" width="380.0" height="126.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="160.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">чекати, доки набереться VMIN байтів.</tspan><tspan x="380.0" dy="16.9">Таймауту немає зовсім: обірваний</tspan><tspan x="380.0" dy="16.9">потік вішає read() назавжди.</tspan></text>
<rect x="590.0" y="110.0" width="380.0" height="126.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="160.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">VTIME відлічують МІЖ байтами.</tspan><tspan x="780.0" dy="16.9">Тиша, довша за нього, завершує read():</tspan><tspan x="780.0" dy="16.9">так ловлять кадр змінної довжини.</tspan></text>
<rect x="190.0" y="250.0" width="380.0" height="126.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="380.0" y="300.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">віддати те, що є в буфері зараз,</tspan><tspan x="380.0" dy="16.9">і повернутися негайно — навіть</tspan><tspan x="380.0" dy="16.9">з нулем байтів. Чисте опитування.</tspan></text>
<rect x="590.0" y="250.0" width="380.0" height="126.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="780.0" y="300.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">чекати перший байт не довше VTIME.</tspan><tspan x="780.0" dy="16.9">Не дочекалися — read() поверне 0,</tspan><tspan x="780.0" dy="16.9">дочекалися — поверне все, що є.</tspan></text>
<rect x="30.0" y="392.0" width="940.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="411.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">VTIME міряють десятими частками секунди: найменший таймаут — 100 мс, а на 115200 бод</tspan><tspan x="500.0" dy="16.9">у ці 100 мс уміщається близько 1150 байтів</tspan></text>
</svg>