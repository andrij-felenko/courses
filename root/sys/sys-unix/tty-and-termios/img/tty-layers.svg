<text x="500.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шари термінальної підсистеми й прапорці termios</text>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">вхід</text>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">вихід</text>
<rect x="310.0" y="40.0" width="380.0" height="52.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="70.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">програма: read() і write()</tspan></text>
<rect x="310.0" y="160.0" width="380.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="190.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">ядро tty: черги, буфери, файл /dev/ttyUSB0</tspan></text>
<rect x="310.0" y="280.0" width="380.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="310.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">лінійна дисципліна (типово N_TTY)</tspan></text>
<rect x="310.0" y="400.0" width="380.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="430.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">драйвер: UART, USB-перехідник або pty</tspan></text>
<rect x="310.0" y="520.0" width="380.0" height="44.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="546.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">дріт і залізо</tspan></text>
<line x1="440.0" y1="156.0" x2="440.0" y2="96.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="560.0" y1="96.0" x2="560.0" y2="156.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="440.0" y1="276.0" x2="440.0" y2="216.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="560.0" y1="216.0" x2="560.0" y2="276.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="440.0" y1="396.0" x2="440.0" y2="336.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="560.0" y1="336.0" x2="560.0" y2="396.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="440.0" y1="516.0" x2="440.0" y2="456.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="560.0" y1="456.0" x2="560.0" y2="516.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="20.0" y="216.0" width="270.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="155.0" y="234.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">c_lflag: ICANON, ECHO, ISIG —</tspan><tspan x="155.0" dy="15.6">збирати рядок, друкувати назад,</tspan><tspan x="155.0" dy="15.6">робити з байта сигнал</tspan></text>
<rect x="20.0" y="340.0" width="270.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="155.0" y="362.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">c_iflag: ICRNL, IXON, IGNBRK —</tspan><tspan x="155.0" dy="15.6">що зробити з прийнятим байтом</tspan></text>
<rect x="20.0" y="458.0" width="270.0" height="56.0" rx="6" fill="#f7f3e8" stroke="#6b7280" stroke-width="1.5"/><text x="155.0" y="482.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">c_cflag: швидкість, 8N1, парність,</tspan><tspan x="155.0" dy="15.6">CRTSCTS, CLOCAL — це вже сам дріт</tspan></text>
<rect x="710.0" y="222.0" width="270.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="845.0" y="242.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">c_oflag: OPOST, ONLCR —</tspan><tspan x="845.0" dy="15.6">що дописати перед відправкою</tspan></text>
<rect x="30.0" y="584.0" width="940.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="606.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">лінійну дисципліну міняють викликом ioctl(TIOCSETD): N_PPP або N_SLIP роблять із того самого дроту</tspan><tspan x="500.0" dy="16.9">мережевий інтерфейс — дріт і файл ті самі, інша лише обробка дорогою</tspan></text>
</svg>