<text x="224.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Швидкість — не число, а номер рядка в таблиці: доступні лише ті 31 значення, які в ній є</text>
