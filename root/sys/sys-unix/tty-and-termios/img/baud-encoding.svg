<text x="224.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Значення BOTHER у полі означає «швидкість не тут»; потрібні struct termios2 і ioctl TCSETS2</text>
<rect x="20.0" y="348.0" width="168.0" height="64.0" rx="6" fill="#eef2f7" stroke="#2457d6" stroke-width="1.5"/><text x="104.0" y="376.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="104.0" dy="0.0">glibc 2.42</tspan><tspan x="104.0" dy="16.9">і новіші</tspan></text>
<rect x="224.0" y="363.5" width="183.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="315.5" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="315.5" dy="0.0">cfsetspeed(&amp;t, 250000)</tspan></text>
<line x1="415.0" y1="380.0" x2="441.0" y2="380.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="449.0" y="355.1" width="175.6" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="536.8" y="376.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="536.8" dy="0.0">speed_t — саме число:</tspan><tspan x="536.8" dy="16.9">B115200 == 115200</tspan></text>
<line x1="632.6" y1="380.0" x2="658.6" y2="380.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
