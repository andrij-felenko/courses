<line x1="140.0" y1="260.0" x2="140.0" y2="155.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="75.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">Return to QEMU
