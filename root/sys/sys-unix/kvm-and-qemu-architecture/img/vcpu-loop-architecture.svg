<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24.1 -10 788.2 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-24.1" y="-10" width="788.2" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="22.1" y="76.2" width="235.8" height="47.6" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="140.0" y="96.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">1. QEMU vCPU Thread</tspan><tspan x="140.0" dy="15.6">Calls ioctl(vcpu_fd, KVM_RUN)</tspan></text>
<rect x="314.2" y="68.4" width="211.5" height="63.2" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="420.0" y="88.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">2. KVM Kernel Driver</tspan><tspan x="420.0" dy="15.6">Loads VMCS Guest state,</tspan><tspan x="420.0" dy="15.6">executes VMLAUNCH / VMRESUME</tspan></text>
<rect x="525.8" y="188.4" width="228.3" height="63.2" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="640.0" y="208.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">3. Physical CPU (Guest Mode)</tspan><tspan x="640.0" dy="15.6">Executes instructions</tspan><tspan x="640.0" dy="15.6">at native speed until trap</tspan></text>
<rect x="279.8" y="288.4" width="280.4" height="63.2" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/><text x="420.0" y="308.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">4. VMExit to KVM Kernel</tspan><tspan x="420.0" dy="15.6">Reads exit_reason in struct kvm_run</tspan><tspan x="420.0" dy="15.6">(e.g., KVM_EXIT_IO, KVM_EXIT_MMIO)</tspan></text>
<rect x="0.0" y="288.4" width="279.9" height="63.2" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="140.0" y="308.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#92400e" text-anchor="middle"><tspan x="140.0" dy="0.0">5. Exit Handling Decision</tspan><tspan x="140.0" dy="15.6">• In-kernel (timer/vAPIC) → re-enter 2</tspan><tspan x="140.0" dy="15.6">• Userspace I/O → return to QEMU 1</tspan></text>
<line x1="245.0" y1="100.0" x2="315.0" y2="100.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
