<rect x="30.0" y="30.0" width="560.0" height="720.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<rect x="50.0" y="45.0" width="520.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="310.0" y="73.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0.0">1. Глобальна хеш-таблиця dentry_hashtable</tspan></text>
<rect x="50.0" y="100.0" width="520.0" height="60.0" rx="6" fill="#f1f3f5" stroke="#6b7280" stroke-width="1.0"/><text x="310.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Масив кошиків hlist_bl_head (bit-spinlocks у молодшому біті вказівника)</tspan><tspan x="310.0" dy="15.6">Ключ хешування: hash(d_parent, d_name) → O(1) пошук за ім'ям</tspan></text>
<rect x="50.0" y="175.0" width="140.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="120.0" y="196.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Bucket #1024</tspan><tspan x="120.0" dy="15.6">hlist_bl_head</tspan></text>
<line x1="195.0" y1="200.0" x2="225.0" y2="200.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="230.0" y="175.0" width="340.0" height="50.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="400.0" y="203.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">dentry(&quot;/usr&quot;, parent=/)</tspan></text>
<rect x="50.0" y="255.0" width="140.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="120.0" y="276.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Bucket #2048</tspan><tspan x="120.0" dy="15.6">hlist_bl_head</tspan></text>
<line x1="195.0" y1="280.0" x2="225.0" y2="280.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="230.0" y="255.0" width="340.0" height="70.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="400.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">dentry(&quot;bin&quot;, parent=/usr)</tspan><tspan x="400.0" dy="14.3">→ dentry(&quot;lib&quot;, parent=/usr)</tspan></text>
<rect x="50.0" y="355.0" width="140.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="120.0" y="376.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Bucket #4096</tspan><tspan x="120.0" dy="15.6">hlist_bl_head</tspan></text>
<line x1="195.0" y1="380.0" x2="225.0" y2="380.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="230.0" y="355.0" width="340.0" height="70.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="400.0" y="386.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">dentry(&quot;libc.so&quot;, parent=/usr/lib)</tspan><tspan x="400.0" dy="14.3">→ dentry(&quot;missing.so&quot;, parent=/usr/lib, NULL)</tspan></text>
<rect x="50.0" y="475.0" width="140.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/><text x="120.0" y="496.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Bucket #8192</tspan><tspan x="120.0" dy="15.6">hlist_bl_head</tspan></text>
<line x1="195.0" y1="500.0" x2="225.0" y2="500.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="230.0" y="475.0" width="340.0" height="50.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="400.0" y="503.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">dentry(&quot;bash&quot;, parent=/usr/bin)</tspan></text>
<rect x="50.0" y="580.0" width="520.0" height="150.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.4"/><text x="310.0" y="620.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Як працює lookup_fast():</tspan><tspan x="310.0" dy="15.6">1. Обчислюється hashlen = hash(parent, name).</tspan><tspan x="310.0" dy="15.6">2. Знаходиться bucket у dentry_hashtable.</tspan><tspan x="310.0" dy="15.6">3. У критичній секції RCU сканується ланцюжок без взяття блокувань.</tspan><tspan x="310.0" dy="15.6">4. Звіряються d_parent, довжина, хеш та ім'я рядка.</tspan><tspan x="310.0" dy="15.6">5. Чинність перевіряється через seqlock d_seq.</tspan></text>
<rect x="610.0" y="30.0" width="620.0" height="720.0" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<rect x="630.0" y="45.0" width="580.0" height="45.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="920.0" y="73.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">2. Ієрархічне дерево в пам'яті (d_parent / d_subdirs)</tspan></text>
<rect x="630.0" y="100.0" width="580.0" height="60.0" rx="6" fill="#f1f3f5" stroke="#6b7280" stroke-width="1.0"/><text x="920.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">Деревоподібний граф з коренем sb-&gt;s_root (/) у пам'яті</tspan><tspan x="920.0" dy="15.6">Зв'язки d_parent (вгору) та d_subdirs / d_child (вниз і вшир)</tspan></text>
