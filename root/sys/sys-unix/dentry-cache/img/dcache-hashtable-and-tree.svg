<rect x="805.0" y="480.0" width="175.0" height="45.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="892.5" y="499.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="892.5" dy="0.0">dentry: libc.so</tspan><tspan x="892.5" dy="14.3">inode: #9802</tspan></text>
<rect x="1000.0" y="480.0" width="200.0" height="45.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1100.0" y="499.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="1100.0" dy="0.0">dentry: missing.so</tspan><tspan x="1100.0" dy="14.3">inode: NULL (негативний)</tspan></text>
<rect x="630.0" y="580.0" width="580.0" height="150.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.4"/><text x="920.0" y="628.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">Навіщо потрібні обидві структури одночасно:</tspan><tspan x="920.0" dy="15.6">• Хеш-таблиця знаходить елемент за O(1) під час спуску вниз.</tspan><tspan x="920.0" dy="15.6">• Вказівники d_parent дозволяють миттєво піднятися до кореня (d_path),</tspan><tspan x="920.0" dy="15.6">  відтворюючи рядок поточного робочого каталогу (getcwd).</tspan><tspan x="920.0" dy="15.6">• d_subdirs дозволяє рекурсивно скидати або перейменовувати піддерева.</tspan></text>
</svg>