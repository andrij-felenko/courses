<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура системи програмованого доповнення Bash</text>
<rect x="30.0" y="60.0" width="240.0" height="200.0" rx="6" fill="#fdf4ff" stroke="#c084fc" stroke-width="1.5"/>
<text x="150.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7e22ce" text-anchor="middle" font-weight="700">Реєстрація та стан</text>
<text x="150.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#581c87" text-anchor="middle"><tspan x="150.0" dy="0.0">Таблиця complete (BASH hash table):</tspan><tspan x="150.0" dy="15.4">  cmd ──► func / flags / list</tspan><tspan x="150.0" dy="15.4">• complete -F _git git</tspan><tspan x="150.0" dy="15.4">• complete -f -X '*.o' gcc</tspan><tspan x="150.0" dy="15.4">• complete -W 'start stop' srv</tspan><tspan x="150.0" dy="15.4"></tspan><tspan x="150.0" dy="15.4">Динамічний завантажувач:</tspan><tspan x="150.0" dy="15.4">/usr/share/bash-completion/...</tspan></text>
<rect x="300.0" y="60.0" width="240.0" height="200.0" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="420.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#854d0e" text-anchor="middle" font-weight="700">Контекстні змінні</text>
<text x="420.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#713f12" text-anchor="middle"><tspan x="420.0" dy="0.0">COMP_LINE = 'git check '</tspan><tspan x="420.0" dy="15.4">COMP_POINT = 10</tspan><tspan x="420.0" dy="15.4">COMP_WORDS = ('git' 'check')</tspan><tspan x="420.0" dy="15.4">COMP_CWORD = 1</tspan><tspan x="420.0" dy="15.4">COMP_KEY = 9</tspan><tspan x="420.0" dy="15.4">COMP_TYPE = 9</tspan><tspan x="420.0" dy="15.4">COMP_WORDBREAKS = ' \t\n&quot;'&gt;&lt;=;|&amp;(:'</tspan></text>
<rect x="570.0" y="60.0" width="220.0" height="200.0" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="680.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#047857" text-anchor="middle" font-weight="700">Вбудований compgen</text>
<text x="680.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#064e3b" text-anchor="middle"><tspan x="680.0" dy="0.0">Фільтрація слів за префіксом:</tspan><tspan x="680.0" dy="15.4">compgen -W 'checkout commit' -- 'c'</tspan><tspan x="680.0" dy="15.4">  └──► 'checkout', 'commit'</tspan><tspan x="680.0" dy="15.4"></tspan><tspan x="680.0" dy="15.4">compgen -f -- 'sr'</tspan><tspan x="680.0" dy="15.4">compgen -v -- 'PA'</tspan><tspan x="680.0" dy="15.4">compgen -u -- 'ro'</tspan></text>
<line x1="270.0" y1="160.0" x2="300.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="420.0" y1="260.0" x2="420.0" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="680.0" y1="260.0" x2="540.0" y2="330.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="300.0" width="760.0" height="190.0" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
<text x="410.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0369a1" text-anchor="middle" font-weight="700">Виконання сценарію доповнення та повернення результату</text>
<text x="410.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#075985" text-anchor="middle"><tspan x="410.0" dy="0.0">_git() {</tspan><tspan x="410.0" dy="14.9">    local cur prev words cword</tspan><tspan x="410.0" dy="14.9">    _get_comp_words_by_ref -n &quot;:=&quot; cur prev words cword</tspan><tspan x="410.0" dy="14.9">    case &quot;${words[1]}&quot; in</tspan><tspan x="410.0" dy="14.9">        checkout) COMPREPLY=( $(compgen -W &quot;$(git branch --list)&quot; -- &quot;$cur&quot;) ) ;;</tspan><tspan x="410.0" dy="14.9">        *)        COMPREPLY=( $(compgen -W &quot;clone fetch checkout status&quot; -- &quot;$cur&quot;) ) ;;</tspan><tspan x="410.0" dy="14.9">    esac</tspan><tspan x="410.0" dy="14.9">}</tspan></text>
<text x="410.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0c4a6e" text-anchor="middle" font-weight="700">Повернення результату через глобальний масив COMPREPLY у Readline</text>
</svg>