<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння архітектури доповнення: Текстовий Bash проти Типізованого Zsh</text>
<rect x="30.0" y="60.0" width="365.0" height="390.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="212.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c2410c" text-anchor="middle" font-weight="700">Bash: Лінійно-рядкова модель</text>
<line x1="45.0" y1="98.0" x2="380.0" y2="98.0" stroke="#ea580c" stroke-width="1.0"/>
<text x="45.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c2d12" text-anchor="start"><tspan x="45.0" dy="0.0">• Модель даних: одновимірний масив рядків COMPREPLY.</tspan><tspan x="45.0" dy="18.1">• Розбиття на слова: фіксований COMP_WORDBREAKS.</tspan><tspan x="45.0" dy="18.1">  Проблема: символи ':', '=' ламають індексацію</tspan><tspan x="45.0" dy="18.1">  і вимагають обхідних викликів __ltrim_colon_completions.</tspan><tspan x="45.0" dy="18.1">• Відсутність метаданих: Readline бачить лише рядки,</tspan><tspan x="45.0" dy="18.1">  немає опису аргументів чи типу опції.</tspan><tspan x="45.0" dy="18.1">• Візуалізація: моноширинний плоский список варіантів,</tspan><tspan x="45.0" dy="18.1">  відсутність інтерактивного вибору стрілками.</tspan><tspan x="45.0" dy="18.1">• Продуктивність: запуск подоболонок $(...) та зовнішніх</tspan><tspan x="45.0" dy="18.1">  утиліт у bash-функціях на кожне натискання Tab.</tspan></text>
<rect x="425.0" y="60.0" width="365.0" height="390.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="607.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">Zsh: Контекстно-типізована модель (compsys)</text>
<line x1="440.0" y1="98.0" x2="775.0" y2="98.0" stroke="#16a34a" stroke-width="1.0"/>
<text x="440.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="start"><tspan x="440.0" dy="0.0">• Модель даних: типізовані теги, опис (descriptions), групи.</tspan><tspan x="440.0" dy="18.1">• Парсер _arguments: декларативний опис синтаксису:</tspan><tspan x="440.0" dy="18.1">  '(-v --verbose)'{-v,--verbose}'[Детальний вивід]'</tspan><tspan x="440.0" dy="18.1">  '1:команда:(start stop restart)' '2:сервіс:_services'</tspan><tspan x="440.0" dy="18.1">• Автоматична обробка роздільників та лапок без збоїв.</tspan><tspan x="440.0" dy="18.1">• Інтерактивне меню (menu-select) з навігацією стрілками,</tspan><tspan x="440.0" dy="18.1">  кольоровим групуванням та підказками призначень.</tspan><tspan x="440.0" dy="18.1">• Функції-хелпери: _describe, _values, _multi_parts,</tspan><tspan x="440.0" dy="18.1">  кешування важких обчислень через _cache_invalid.</tspan></text>
</svg>