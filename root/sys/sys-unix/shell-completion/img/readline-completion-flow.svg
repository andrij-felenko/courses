<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр обробки клавіші Tab у бібліотеці GNU Readline</text>
<rect x="30.0" y="60.0" width="220.0" height="110.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="140.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">1. Ввід термінала</text>
<text x="140.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle"><tspan x="140.0" dy="0.0">Користувач натискає &lt;Tab&gt;</tspan><tspan x="140.0" dy="15.4">ASCII 0x09 ('\t')</tspan><tspan x="140.0" dy="15.4">Функція rl_complete()</tspan><tspan x="140.0" dy="15.4">Перехоплення події вводу</tspan></text>
<line x1="250.0" y1="115.0" x2="290.0" y2="115.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="290.0" y="60.0" width="240.0" height="110.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="410.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">2. Перевірка хука оболонки</text>
<text x="410.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#78350f" text-anchor="middle"><tspan x="410.0" dy="0.0">rl_attempted_completion_function</tspan><tspan x="410.0" dy="15.4">Токенізація за word break chars</tspan><tspan x="410.0" dy="15.4">Визначення start та end слова</tspan></text>
<line x1="410.0" y1="170.0" x2="410.0" y2="230.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="465.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Хук встановлено</text>
<line x1="530.0" y1="115.0" x2="590.0" y2="115.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="560.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">NULL</text>
<rect x="590.0" y="60.0" width="200.0" height="110.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="690.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">Стандартний генератор</text>
<text x="690.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle"><tspan x="690.0" dy="0.0">rl_filename_completion_function</tspan><tspan x="690.0" dy="15.4">Сканування через opendir/readdir</tspan><tspan x="690.0" dy="15.4">Доповнення імен файлів</tspan></text>
<rect x="200.0" y="230.0" width="420.0" height="110.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="410.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0369a1" text-anchor="middle" font-weight="700">3. Програмоване доповнення (Bash / Zsh)</text>
<text x="410.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0c4a6e" text-anchor="middle"><tspan x="410.0" dy="0.0">Виклик генератора (complete -F / _arguments)</tspan><tspan x="410.0" dy="15.4">Ініціалізація COMP_WORDS, COMP_CWORD, COMP_LINE</tspan><tspan x="410.0" dy="15.4">Генерація варіантів та заповнення масиву COMPREPLY</tspan></text>
<line x1="410.0" y1="340.0" x2="410.0" y2="380.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="380.0" width="720.0" height="95.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="410.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">4. Формування результату в буфері редагування</text>
<text x="410.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle"><tspan x="410.0" dy="0.0">0 збігів: звуковий/візуальний сигнал (bell) | 1 збір: автопідстановка суфікса в рядок</tspan><tspan x="410.0" dy="15.4">Декілька збігів: підстановка найдовшого спільного префікса (LCP); при повторному Tab — пейджер варіантів</tspan></text>
<line x1="690.0" y1="170.0" x2="690.0" y2="360.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="690.0" y1="360.0" x2="690.0" y2="380.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>