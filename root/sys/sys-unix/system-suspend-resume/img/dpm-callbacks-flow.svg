<svg xmlns="http://www.w3.org/2000/svg" viewBox="-124.84 -10 1563.2 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-124.84" y="-10" width="1563.2" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність викликів dev_pm_ops: prepare, suspend, suspend_late, suspend_noirq</text>
<text x="660.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири фази зворотних викликів dev_pm_ops та контекст їх виконання</text>
<text x="60.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b8860b" text-anchor="start" font-weight="700">1. Фаза prepare() / complete()</text>
<rect x="150.0" y="121.0" width="580.0" height="49.9" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.6"/><text x="440.0" y="142.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Призначення:</tspan><tspan x="440.0" dy="16.9">Блокування реєстрації нових дочірніх пристроїв у системі</tspan></text>
<rect x="650.2" y="121.6" width="739.6" height="48.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="1020.0" y="142.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">Контекст і обмеження:</tspan><tspan x="1020.0" dy="16.2">Юзерспейс заморожено, ядерні потоки сплять, локальні IRQ увімкнені, контекст дозволяє сон (can sleep)</tspan></text>
<text x="60.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">2. Фаза suspend() / resume()</text>
<rect x="85.4" y="251.1" width="709.1" height="49.9" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.6"/><text x="422.0" y="272.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="422.0" dy="0.0">Призначення:</tspan><tspan x="422.0" dy="16.9">Головна фаза: зупинка DMA-кілець, скидання черг передачі, переведення чіпів у низьке живлення</tspan></text>
<rect x="660.9" y="251.6" width="718.2" height="48.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="1020.0" y="272.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">Контекст і обмеження:</tspan><tspan x="1020.0" dy="16.2">Локальні IRQ увімкнені, виклики можуть блокуватися (mutex, msleep), доступні всі шини та периферія</tspan></text>
<text x="60.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start" font-weight="700">3. Фаза suspend_late() / resume_early()</text>
<rect x="107.7" y="381.1" width="664.7" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="440.0" y="402.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Призначення:</tspan><tspan x="440.0" dy="16.9">Обробка низькорівневих шин, таймерів та системних доменів живлення (PM domains / genpd)</tspan></text>
<rect x="682.2" y="381.6" width="675.5" height="48.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="1020.0" y="402.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">Контекст і обмеження:</tspan><tspan x="1020.0" dy="16.2">Більшість пристроїв уже приспано, залежності між шинами суворо контролюються, IRQ ще активні</tspan></text>
<text x="60.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">4. Фаза suspend_noirq() / resume_noirq()</text>
<rect x="111.4" y="511.1" width="657.3" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="422.0" y="532.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="422.0" dy="0.0">Призначення:</tspan><tspan x="422.0" dy="16.9">Остаточне збереження конфігураційних регістрів, переведення контролерів у D3cold/D3hot</tspan></text>
<rect x="635.9" y="511.6" width="768.1" height="48.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="1020.0" y="532.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">Контекст і обмеження:</tspan><tspan x="1020.0" dy="16.2">Переривання пристроїв вимкнені (disable_device_irq), локальні IRQ ядра вимкнені — код НЕ МАЄ права спати!</tspan></text>
<line x1="28.0" y1="120.0" x2="28.0" y2="550.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="18.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">SUSPEND (знизу вгору по дереву пристроїв)</text>
<line x1="1292.0" y1="550.0" x2="1292.0" y2="120.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1302.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">RESUME (згори вниз по дереву пристроїв)</text>
<text x="660.0" y="680.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Помилка на будь-якому етапі suspend негайно запускає симетричний зворотний відкіт виконаних фаз</text>
</svg>