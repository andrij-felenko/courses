<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Атомарна синхронізація через /sys/power/wakeup_count та блокування перегонів</text>
<text x="650.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запобігання перегонам: як /sys/power/wakeup_count блокує втрачений сон</text>
<text x="340.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">БЕЗ лічильника: Подія зникає в момент засинання</text>
<rect x="60.0" y="105.0" width="560.0" height="450.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<rect x="90.0" y="115.0" width="500.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="340.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">1. Демон сну вирішує: система простоює</tspan><tspan x="340.0" dy="16.9">Запуск переходу в сон...</tspan></text>
<rect x="90.0" y="195.1" width="500.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="340.0" y="216.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">2. Користувач натискає клавішу!</tspan><tspan x="340.0" dy="16.9">Подія надходить у чергу переривань</tspan></text>
<rect x="90.0" y="275.1" width="500.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="340.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">3. Демон пише: echo mem &gt; /sys/power/state</tspan><tspan x="340.0" dy="16.9">Ядро починає процес призупинення</tspan></text>
<rect x="90.0" y="355.1" width="500.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="340.0" y="376.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">4. Freezer заморожує процеси</tspan><tspan x="340.0" dy="16.9">Подію клавіатури НЕ прочитано застосунком!</tspan></text>
<rect x="90.0" y="435.1" width="500.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="340.0" y="456.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">5. Система засинає в стан S3</tspan><tspan x="340.0" dy="16.9">Результат: ноутбук заснув, проігнорувавши дію!</tspan></text>
<text x="960.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">З wakeup_count: Атомарне скасування призупинення</text>
<rect x="680.0" y="105.0" width="560.0" height="450.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.5"/>
<rect x="710.0" y="115.0" width="500.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="960.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">1. Демон читає /sys/power/wakeup_count</tspan><tspan x="960.0" dy="16.9">Отримано поточне значення: count = 1420</tspan></text>
<rect x="710.0" y="195.1" width="500.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="960.0" y="216.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">2. Користувач натискає клавішу!</tspan><tspan x="960.0" dy="16.9">Драйвер викликає pm_wakeup_event() → count = 1421</tspan></text>
<rect x="710.0" y="275.1" width="500.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="960.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">3. Демон пише: echo 1420 &gt; wakeup_count</tspan><tspan x="960.0" dy="16.9">Ядро порівнює: 1420 ≠ 1421 (перевірка не пройшла!)</tspan></text>
<rect x="710.0" y="355.1" width="500.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="960.0" y="376.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">4. Запис завершується помилкою -EINVAL</tspan><tspan x="960.0" dy="16.9">Спроба призупинення негайно скасовується!</tspan></text>
<rect x="710.0" y="435.1" width="500.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="960.0" y="456.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">5. Юзерспейс обробляє подію клавіатури</tspan><tspan x="960.0" dy="16.9">Результат: подія не втрачена, система лишається активною</tspan></text>
<text x="650.0" y="585.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Атомарний інтерфейс wakeup_count гарантує відсутність вікна перегонів між простором користувача та ядром</text>
</svg>