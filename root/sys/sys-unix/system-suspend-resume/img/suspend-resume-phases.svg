<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1390 850" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1390" height="850" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="690.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повний конвеєр призупинення й пробудження системи в ядрі Linux</text>
<text x="360.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">Фаза 1–4: Перехід у сон (Suspend)</text>
<text x="1020.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">Фаза 5–8: Пробудження (Resume)</text>
<line x1="690.0" y1="25.0" x2="690.0" y2="780.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6,6"/>
<rect x="70.0" y="59.5" width="580.0" height="51.1" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.8"/><text x="360.0" y="80.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">1. Запит користувача</tspan><tspan x="360.0" dy="17.6">echo mem &gt; /sys/power/state (перевірка wakeup_count)</tspan></text>
<rect x="70.0" y="149.5" width="580.0" height="51.1" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.8"/><text x="360.0" y="170.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">2. Заморожування процесів (Freezer)</tspan><tspan x="360.0" dy="17.6">freeze_processes() [юзерспейс] → freeze_kernel_threads()</tspan></text>
<rect x="70.0" y="254.5" width="580.0" height="51.1" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="360.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">3. Каскад DPM (Драйвери пристроїв)</tspan><tspan x="360.0" dy="17.6">prepare() → suspend() → suspend_late() → suspend_noirq()</tspan></text>
<rect x="70.0" y="369.5" width="580.0" height="51.1" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.8"/><text x="360.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">4. Зупинка CPU та переривань</tspan><tspan x="360.0" dy="17.6">disable_nonboot_cpus() → syscore_suspend() → local_irq_disable()</tspan></text>
<rect x="70.0" y="484.5" width="580.0" height="51.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="360.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">5. Архітектурний сон (Arch sleep)</tspan><tspan x="360.0" dy="17.6">Збереження CR3/GDT/MSR → wbinvd (кеш) → DRAM Self-Refresh</tspan></text>
<rect x="70.0" y="599.5" width="580.0" height="51.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="360.0" y="621.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">6. Фізичний стан S3 (ACPI S3)</tspan><tspan x="360.0" dy="17.6">Запис PM1a/b_CNT.SLP_EN → знеструмлення платформи (лише 5VSB/RAM)</tspan></text>
<line x1="360.0" y1="113.0" x2="360.0" y2="147.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="360.0" y1="203.0" x2="360.0" y2="252.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="360.0" y1="308.0" x2="360.0" y2="367.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="360.0" y1="423.0" x2="360.0" y2="482.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="360.0" y1="538.0" x2="360.0" y2="597.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="380.0" y="703.9" width="620.0" height="52.2" rx="6" fill="#fff4e0" stroke="#c0392b" stroke-width="2.2"/><text x="690.0" y="725.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">ПОДІЯ ПРОБУДЖЕННЯ (Wakeup Event)</tspan><tspan x="690.0" dy="18.2">RTC alarm / Кнопка живлення / PCIe PME# / GPIO / Клавіатура</tspan></text>
<line x1="360.0" y1="660.0" x2="410.0" y2="730.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="970.0" y1="730.0" x2="1020.0" y2="660.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="730.0" y="59.5" width="580.0" height="51.1" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.8"/><text x="1020.0" y="80.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">12. Робота відновлена</tspan><tspan x="1020.0" dy="17.6">Всі процеси розморожено, планувальник активний, I/O розблоковано</tspan></text>
<rect x="730.0" y="149.5" width="580.0" height="51.1" rx="6" fill="#eef0f3" stroke="#333333" stroke-width="1.8"/><text x="1020.0" y="170.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">11. Розморожування задач (Thaw)</tspan><tspan x="1020.0" dy="17.6">thaw_processes() [ядерні потоки → юзерспейс]</tspan></text>
<rect x="730.0" y="254.5" width="580.0" height="51.1" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="1020.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">10. Каскад DPM (Драйвери пристроїв)</tspan><tspan x="1020.0" dy="17.6">resume_noirq() → resume_early() → resume() → complete()</tspan></text>
<rect x="730.0" y="369.5" width="580.0" height="51.1" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="1.8"/><text x="1020.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">9. Запуск вторинних CPU та IRQ</tspan><tspan x="1020.0" dy="17.6">local_irq_enable() → syscore_resume() → enable_nonboot_cpus()</tspan></text>
<rect x="730.0" y="484.5" width="580.0" height="51.1" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.8"/><text x="1020.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">8. Відновлення архітектурного стану</tspan><tspan x="1020.0" dy="17.6">CR3/GDT/IDT/MSR відновлено → повернення в ядро (Waking Vector)</tspan></text>
<rect x="730.0" y="599.5" width="580.0" height="51.1" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="1.8"/><text x="1020.0" y="621.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">7. Спрацьовування BIOS / Firmware</tspan><tspan x="1020.0" dy="17.6">Вмикання шин живлення → зняття DRAM Self-Refresh → FACS vector</tspan></text>
<line x1="1020.0" y1="597.0" x2="1020.0" y2="538.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="1020.0" y1="482.0" x2="1020.0" y2="423.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="1020.0" y1="367.0" x2="1020.0" y2="308.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="1020.0" y1="252.0" x2="1020.0" y2="203.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="1020.0" y1="147.0" x2="1020.0" y2="113.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="690.0" y="810.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Повний цикл: від запису в sysfs крізь апаратний сон S3 до відновлення робочого стану планувальника</text>
</svg>