<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="1160.0" height="560.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="40.0" y="40.0" width="1120.0" height="50.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="70.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ОРГАНІЗАЦІЯ ДОЧІРНІХ ВУЗЛІВ У ЧЕРВОНО-ЧОРНЕ ДЕРЕВО ТА ЛІНИВІ АТРИБУТИ</tspan></text>
<rect x="50.0" y="110.0" width="1100.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Батьківський каталог kernfs_node (KERNFS_DIR, наприклад /sys/devices/)</tspan><tspan x="600.0" dy="16.9">• kn-&gt;dir.children : корінь червоно-чорного дерева (struct rb_root)</tspan><tspan x="600.0" dy="16.9">• kn-&gt;name : ім'я каталогу   • kn-&gt;priv : вказівник на об'єкт підсистеми</tspan><tspan x="600.0" dy="16.9">• kn-&gt;ns : вказівник на простір імен (namespace tag, наприклад netns)</tspan></text>
<line x1="600.0" y1="220.0" x2="600.0" y2="260.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="260.0" width="340.0" height="150.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Дочірній вузол (rb_node)</tspan><tspan x="220.0" dy="15.6">kernfs_node (&quot;cpu0&quot;)</tspan><tspan x="220.0" dy="15.6">• type: KERNFS_DIR</tspan><tspan x="220.0" dy="15.6">• hash = kernfs_name_hash(&quot;cpu0&quot;)</tspan><tspan x="220.0" dy="15.6">• rb_left / rb_right</tspan></text>
<rect x="430.0" y="260.0" width="340.0" height="150.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Дочірній вузол (rb_node)</tspan><tspan x="600.0" dy="15.6">kernfs_node (&quot;uevent&quot;)</tspan><tspan x="600.0" dy="15.6">• type: KERNFS_FILE</tspan><tspan x="600.0" dy="15.6">• hash = kernfs_name_hash(&quot;uevent&quot;)</tspan><tspan x="600.0" dy="15.6">• attr: show/store ops</tspan></text>
<rect x="810.0" y="260.0" width="340.0" height="150.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="980.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">Дочірній вузол (rb_node)</tspan><tspan x="980.0" dy="15.6">kernfs_node (&quot;subsystem&quot;)</tspan><tspan x="980.0" dy="15.6">• type: KERNFS_LINK</tspan><tspan x="980.0" dy="15.6">• hash = kernfs_name_hash(&quot;subsystem&quot;)</tspan><tspan x="980.0" dy="15.6">• target_kn: вказівник</tspan></text>
<rect x="50.0" y="440.0" width="1100.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="475.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Оптимізація пам'яті: Ліниве виділення атрибутів struct kernfs_iattrs</tspan><tspan x="600.0" dy="15.6">• kn-&gt;iattr == NULL за замовчуванням: права mode (0644/0444), uid=0, gid=0 та часові мітки обчислюються на льоту!</tspan><tspan x="600.0" dy="15.6">• Динамічне виділення iattr відбувається ЛИШЕ при явному виклику chmod(), chown() або utimes()</tspan><tspan x="600.0" dy="15.6">• Економія: знімає понад сотню байтів додаткової пам'яті з 99,9 % стандартних віртуальних файлів ядра</tspan></text>
</svg>