<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема ініціалізації та керування процесами через ptrace</text>
<rect x="60.0" y="50.0" width="420.0" height="36.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="270.0" y="72.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Трасувальник (GDB / strace)</tspan></text>
<rect x="560.0" y="50.0" width="420.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="770.0" y="72.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Трасований процес (Target)</tspan></text>
<line x1="270.0" y1="86.0" x2="270.0" y2="440.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="770.0" y1="86.0" x2="770.0" y2="440.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="100.0" y="110.0" width="340.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="135.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">1. ptrace(PTRACE_ATTACH, pid)</tspan><tspan x="270.0" dy="14.3">або ptrace(PTRACE_TRACEME)</tspan></text>
<line x1="440.0" y1="132.0" x2="600.0" y2="132.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="490.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">сигнал SIGSTOP / SIGTRAP</text>
<rect x="600.0" y="160.0" width="340.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="179.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">2. Ядро призупиняє процес</tspan><tspan x="770.0" dy="14.3">Стан переходить у TASK_TRACED</tspan></text>
<rect x="100.0" y="210.0" width="340.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="222.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">3. waitpid(pid, &amp;status, 0)</tspan><tspan x="270.0" dy="14.3">Трасувальник розблоковується</tspan></text>
<line x1="600.0" y1="183.0" x2="440.0" y2="233.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="490.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">сповіщення waitpid</text>
<rect x="100.0" y="280.0" width="340.0" height="48.0" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/><text x="270.0" y="293.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">4. Інспекція та модифікація:</tspan><tspan x="270.0" dy="14.3">PEEKDATA / POKEDATA / SETREGS</tspan></text>
<line x1="440.0" y1="304.0" x2="600.0" y2="304.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="490.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">доступ лише руками ядра</text>
<rect x="100.0" y="350.0" width="340.0" height="44.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="375.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">5. ptrace(PTRACE_CONT, pid)</tspan><tspan x="270.0" dy="14.3">Продовження роботи</tspan></text>
<line x1="440.0" y1="372.0" x2="600.0" y2="372.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="600.0" y="390.0" width="340.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="770.0" y="408.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">6. Процес виконує інструкції далі</tspan><tspan x="770.0" dy="14.3">стан TASK_RUNNING</tspan></text>
<rect x="60.0" y="470.0" width="920.0" height="54.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="520.0" y="493.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Ключова ідея: трасований процес не робить жодної інструкції, поки трасувальник</tspan><tspan x="520.0" dy="14.3">перебуває у виклику waitpid() після зупинки у TASK_TRACED</tspan></text>
</svg>