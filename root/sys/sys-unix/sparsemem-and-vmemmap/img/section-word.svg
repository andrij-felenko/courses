<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1370 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1370" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="680.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два життя слова section_mem_map</text>
<text x="680.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запис каталогу: одне слово section_mem_map</text>
<text x="150.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">поки пам'ять лише оголошено</text>
<text x="1240.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">біт 0 — праворуч</text>
<rect x="150.0" y="132.0" width="750.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="525.0" y="160.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">номер вузла NUMA</tspan><tspan x="525.0" dy="19.5">nid &lt;&lt; SECTION_NID_SHIFT</tspan></text>
<rect x="900.0" y="132.0" width="340.0" height="66.0" rx="6" fill="#fff5e0" stroke="#c0392b" stroke-width="1.6"/><text x="1070.0" y="170.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1070.0" dy="0.0">прапорці стану</tspan></text>
<line x1="360.0" y1="214.0" x2="360.0" y2="298.0" stroke="#333333" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="396.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">заведення масиву затирає старші біти; прапорці лишаються</text>
<text x="150.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">після того, як секція дістала масив описувачів</text>
<rect x="150.0" y="348.0" width="750.0" height="66.0" rx="6" fill="#eafaf0" stroke="#2457d6" stroke-width="1.6"/><text x="525.0" y="376.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">адреса масиву описувачів,</tspan><tspan x="525.0" dy="19.5">зменшена на перший кадр секції</tspan></text>
<rect x="900.0" y="348.0" width="340.0" height="66.0" rx="6" fill="#fff5e0" stroke="#c0392b" stroke-width="1.6"/><text x="1070.0" y="386.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1070.0" dy="0.0">прапорці стану</tspan></text>
<text x="525.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">старші біти: SECTION_MAP_MASK</text>
<text x="1070.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">молодших SECTION_MAP_LAST_BIT</text>
<rect x="373.3" y="506.8" width="613.4" height="66.5" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="535.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">масив вирівняний, тож його молодші біти завжди нульові —</tspan><tspan x="680.0" dy="19.5">туди й ховають прапорці, а __section_mem_map_addr() зрізає їх маскою</tspan></text>
</svg>