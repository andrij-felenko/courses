<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 770" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="770" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна віртуальна адреса, два місця, де можуть лежати її байти</text>
<rect x="40.0" y="58.0" width="600.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="340.0" y="88.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">сторінка живе в системній пам'яті</tspan></text>
<rect x="760.0" y="58.0" width="600.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="1060.0" y="88.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="1060.0" dy="0.0">сторінка живе в пам'яті пристрою</tspan></text>
<rect x="40.0" y="132.0" width="250.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="165.0" y="177.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="165.0" dy="0.0">запис у таблиці процесу</tspan></text>
<rect x="304.0" y="132.0" width="336.0" height="82.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.3"/><text x="472.0" y="169.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="472.0" dy="0.0">звичайний, наявний:</tspan><tspan x="472.0" dy="16.2">номер системного кадру</tspan></text>
<rect x="760.0" y="132.0" width="250.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="885.0" y="177.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="885.0" dy="0.0">запис у таблиці процесу</tspan></text>
<rect x="1024.0" y="132.0" width="336.0" height="82.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.3"/><text x="1192.0" y="169.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1192.0" dy="0.0">особливий, відсутній:</tspan><tspan x="1192.0" dy="16.2">«сторінка в пристрої»</tspan></text>
<rect x="40.0" y="230.0" width="250.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="165.0" y="275.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="165.0" dy="0.0">таблиця пристрою</tspan></text>
<rect x="304.0" y="230.0" width="336.0" height="82.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.3"/><text x="472.0" y="267.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="472.0" dy="0.0">той самий кадр,</tspan><tspan x="472.0" dy="16.2">вписаний драйвером</tspan></text>
<rect x="760.0" y="230.0" width="250.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="885.0" y="275.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="885.0" dy="0.0">таблиця пристрою</tspan></text>
<rect x="1024.0" y="230.0" width="336.0" height="82.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.3"/><text x="1192.0" y="267.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1192.0" dy="0.0">кадр власної пам'яті</tspan><tspan x="1192.0" dy="16.2">прискорювача</tspan></text>
<rect x="40.0" y="328.0" width="250.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="165.0" y="373.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="165.0" dy="0.0">читає процесор</tspan></text>
<rect x="304.0" y="328.0" width="336.0" height="82.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.3"/><text x="472.0" y="373.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="472.0" dy="0.0">напряму, з пам'яті</tspan></text>
<rect x="760.0" y="328.0" width="250.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="885.0" y="373.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="885.0" dy="0.0">читає процесор</tspan></text>
<rect x="1024.0" y="328.0" width="336.0" height="82.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.3"/><text x="1192.0" y="373.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1192.0" dy="0.0">не може: дотик дає збій</tspan></text>
<rect x="40.0" y="426.0" width="250.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="165.0" y="471.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="165.0" dy="0.0">читає прискорювач</tspan></text>
<rect x="304.0" y="426.0" width="336.0" height="82.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.3"/><text x="472.0" y="471.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="472.0" dy="0.0">через шину, на кожне звертання</tspan></text>
<rect x="760.0" y="426.0" width="250.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="885.0" y="471.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="885.0" dy="0.0">читає прискорювач</tspan></text>
<rect x="1024.0" y="426.0" width="336.0" height="82.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.3"/><text x="1192.0" y="471.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1192.0" dy="0.0">з локальної пам'яті, на повній швидкості</tspan></text>
<line x1="660.0" y1="210.0" x2="742.0" y2="210.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="500.0" y="552.0" width="400.0" height="74.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="700.0" y="585.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">переселення: драйвер копіює вміст</tspan><tspan x="700.0" dy="16.2">своїм рушієм прямого доступу</tspan></text>
<line x1="742.0" y1="330.0" x2="660.0" y2="330.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="940.0" y="552.0" width="420.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="1150.0" y="585.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1150.0" dy="0.0">дотик процесора: збій кличе драйвера,</tspan><tspan x="1150.0" dy="16.2">і той повертає сторінку назад</tspan></text>
<rect x="40.0" y="552.0" width="420.0" height="74.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.4"/><text x="250.0" y="585.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">вказівник у програмі — той самий</tspan><tspan x="250.0" dy="16.2">в обох станах, програма не бачить різниці</tspan></text>
<rect x="40.0" y="654.0" width="1320.0" height="72.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.7"/><text x="700.0" y="686.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">описувач кадру існує й для пам'яті пристрою — інакше зворотне відображення,</tspan><tspan x="700.0" dy="16.9">лічильники посилань і переселення не мали б за що взятися</tspan></text>
</svg>