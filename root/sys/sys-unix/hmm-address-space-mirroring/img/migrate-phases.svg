<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1430 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1430" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="710.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переселення розбите на такти, бо копіювання довше за будь-який замок</text>
<rect x="40.0" y="58.0" width="190.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="135.0" y="86.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="135.0" dy="0.0">ядро</tspan></text>
<rect x="40.0" y="268.0" width="190.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="135.0" y="296.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="135.0" dy="0.0">драйвер</tspan></text>
<rect x="270.0" y="58.0" width="250.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="395.0" y="86.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">такт перший</tspan></text>
<rect x="270.0" y="126.0" width="250.0" height="118.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.3"/><text x="395.0" y="173.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">зібрати сторінки діапазону,</tspan><tspan x="395.0" dy="16.2">замкнути їх і вписати</tspan><tspan x="395.0" dy="16.2">в таблицю запис «переселяється»</tspan></text>
<line x1="526.0" y1="186.0" x2="554.0" y2="186.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560.0" y="58.0" width="250.0" height="48.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="685.0" y="86.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">робота драйвера</tspan></text>
<rect x="560.0" y="268.0" width="250.0" height="118.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.3"/><text x="685.0" y="315.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">виділити кадри у своїй пам'яті</tspan><tspan x="685.0" dy="16.2">й скопіювати вміст —</tspan><tspan x="685.0" dy="16.2">це довго й асинхронно</tspan></text>
<line x1="816.0" y1="186.0" x2="844.0" y2="186.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="850.0" y="58.0" width="250.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="975.0" y="86.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="975.0" dy="0.0">такт другий</tspan></text>
<rect x="850.0" y="126.0" width="250.0" height="118.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.3"/><text x="975.0" y="173.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">поставити нові кадри</tspan><tspan x="975.0" dy="16.2">в таблиці процесу</tspan><tspan x="975.0" dy="16.2">замість записів переселення</tspan></text>
<line x1="1106.0" y1="186.0" x2="1134.0" y2="186.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1140.0" y="58.0" width="250.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1265.0" y="86.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="1265.0" dy="0.0">такт третій</tspan></text>
<rect x="1140.0" y="126.0" width="250.0" height="118.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.3"/><text x="1265.0" y="173.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1265.0" dy="0.0">розімкнути сторінки,</tspan><tspan x="1265.0" dy="16.2">віддати посилання</tspan><tspan x="1265.0" dy="16.2">на старі кадри</tspan></text>
<line x1="395.0" y1="250.0" x2="685.0" y2="262.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="685.0" y1="392.0" x2="975.0" y2="250.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="270.0" y="430.0" width="1120.0" height="82.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.7"/><text x="830.0" y="467.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">поки триває копіювання, звертання до цих адрес натикається на запис переселення</tspan><tspan x="830.0" dy="16.9">й чекає — саме тому таких тактів три, а не один</tspan></text>
<rect x="270.0" y="530.0" width="1120.0" height="82.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="830.0" y="567.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">частина сторінок випадає з переселення ще на першому такті: закріплені,</tspan><tspan x="830.0" dy="16.9">прибиті до пам'яті, спільні з іншими — ядро гасить їм позначку, драйвер мусить це прийняти</tspan></text>
<rect x="270.0" y="630.0" width="1120.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="830.0" y="660.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="830.0" dy="0.0">такі сторінки лишаються віддзеркаленими, а не переселеними</tspan></text>
</svg>