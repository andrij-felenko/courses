<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="200.0" y="20.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">звичайний код програми</text>
<text x="800.0" y="20.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">обробник сигналу</text>
<rect x="40.0" y="34.0" width="320.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="60.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">код кличе malloc()</tspan></text>
<line x1="200.0" y1="78.0" x2="200.0" y2="98.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="100.0" width="320.0" height="58.0" rx="6" fill="#f7f3e8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="125.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">malloc бере замок арени</tspan><tspan x="200.0" dy="16.9">і перечіпляє список вільних блоків</tspan></text>
<line x1="200.0" y1="158.0" x2="200.0" y2="178.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="180.0" width="920.0" height="44.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="206.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">рівно в цю мить ядро доставляє сигнал</tspan></text>
<line x1="500.0" y1="224.0" x2="800.0" y2="248.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="250.0" width="320.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="275.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">ядро кладе кадр обробника</tspan><tspan x="800.0" dy="16.9">на той самий стек того ж потоку</tspan></text>
<line x1="800.0" y1="308.0" x2="800.0" y2="328.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="330.0" width="320.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="355.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">обробник кличе printf(),</tspan><tspan x="800.0" dy="16.9">а той усередині кличе malloc()</tspan></text>
<line x1="800.0" y1="388.0" x2="800.0" y2="408.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="410.0" width="320.0" height="58.0" rx="6" fill="#f7f3e8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="435.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">malloc бере ТОЙ САМИЙ замок —</tspan><tspan x="800.0" dy="16.9">а він уже зайнятий</tspan></text>
<line x1="800.0" y1="468.0" x2="800.0" y2="486.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="500.0" y="476.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">глухий кут</text>
<rect x="640.0" y="488.0" width="320.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="800.0" y="512.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">обробник стоїть</tspan><tspan x="800.0" dy="16.9">і чекає на звільнення замка</tspan></text>
<rect x="40.0" y="488.0" width="320.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="200.0" y="512.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">код відпустить замок лише</tspan><tspan x="200.0" dy="16.9">після повернення з обробника</tspan></text>
<line x1="368.0" y1="516.0" x2="632.0" y2="516.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="6,5"/>
</svg>