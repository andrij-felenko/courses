<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 1026" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="1026" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як слово режиму росло від шести бітів до дванадцяти</text>
<rect x="50.0" y="50.0" width="310.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="205.0" y="82.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">коли й де</tspan></text>
<rect x="382.0" y="50.0" width="440.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="602.0" y="82.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="602.0" dy="0.0">що стояло в слові режиму</tspan></text>
<rect x="844.0" y="50.0" width="406.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1047.0" y="82.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1047.0" dy="0.0">що це змінило</tspan></text>
<rect x="50.0" y="132.0" width="310.0" height="218.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="205.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">1-ше видання Unix</tspan><tspan x="205.0" dy="16.9">3.11.1971</tspan><tspan x="205.0" dy="16.9">той самий набір ще в 3-му,</tspan><tspan x="205.0" dy="16.9">лютий 1973</tspan></text>
<rect x="382.0" y="132.0" width="440.0" height="218.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="602.0" y="194.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="602.0" dy="0.0">шість бітів</tspan><tspan x="602.0" dy="16.9">01 запис не-власником</tspan><tspan x="602.0" dy="16.9">02 читання не-власником</tspan><tspan x="602.0" dy="16.9">04 запис власником</tspan><tspan x="602.0" dy="16.9">10 читання власником</tspan><tspan x="602.0" dy="16.9">20 «виконуваний»</tspan><tspan x="602.0" dy="16.9">40 set-UID</tspan></text>
<rect x="844.0" y="132.0" width="406.0" height="218.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1047.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1047.0" dy="0.0">класів два: власник і всі інші</tspan><tspan x="1047.0" dy="16.9">групи немає зовсім</tspan><tspan x="1047.0" dy="16.9">«виконуваний» — ознака файлу,</tspan><tspan x="1047.0" dy="16.9">а не право чийогось класу</tspan></text>
<rect x="50.0" y="380.0" width="310.0" height="182.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="205.0" y="458.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">4-те видання</tspan><tspan x="205.0" dy="16.9">сторінка man 20.08.1973</tspan><tspan x="205.0" dy="16.9">видання — листопад 1973</tspan></text>
<rect x="382.0" y="380.0" width="440.0" height="182.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="602.0" y="441.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="602.0" dy="0.0">одинадцять бітів</tspan><tspan x="602.0" dy="16.9">4000 set-UID · 2000 set-GID</tspan><tspan x="602.0" dy="16.9">0400 0200 0100 — власник</tspan><tspan x="602.0" dy="16.9">0070 — група</tspan><tspan x="602.0" dy="16.9">0007 — решта</tspan></text>
<rect x="844.0" y="380.0" width="406.0" height="182.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1047.0" y="450.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1047.0" dy="0.0">з'явився клас групи</tspan><tspan x="1047.0" dy="16.9">і окремий біт x на кожен клас</tspan><tspan x="1047.0" dy="16.9">шість бітів замінено дев'яткою</tspan><tspan x="1047.0" dy="16.9">разом із двома спеціальними</tspan></text>
<rect x="50.0" y="592.0" width="310.0" height="146.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="205.0" y="661.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">5-те видання</tspan><tspan x="205.0" dy="16.9">червень 1974</tspan></text>
<rect x="382.0" y="592.0" width="440.0" height="146.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/><text x="602.0" y="661.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="602.0" dy="0.0">додано 01000</tspan><tspan x="602.0" dy="16.9">ISVTX у заголовку inode.h</tspan></text>
<rect x="844.0" y="592.0" width="406.0" height="146.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1047.0" y="652.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1047.0" dy="0.0">образ програми лишається у свопі</tspan><tspan x="1047.0" dy="16.9">після виходу — повторний запуск</tspan><tspan x="1047.0" dy="16.9">не перечитує файл із диска</tspan></text>
<rect x="50.0" y="768.0" width="310.0" height="146.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="205.0" y="837.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">4.3BSD</tspan><tspan x="205.0" dy="16.9">sticky(8), 26.05.1986</tspan></text>
<rect x="382.0" y="768.0" width="440.0" height="146.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="602.0" y="837.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="602.0" dy="0.0">той самий 01000,</tspan><tspan x="602.0" dy="16.9">але поставлений на каталозі</tspan></text>
<rect x="844.0" y="768.0" width="406.0" height="146.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1047.0" y="828.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1047.0" dy="0.0">запис у спільній теці прибирає</tspan><tspan x="1047.0" dy="16.9">чи перейменовує лише власник файлу,</tspan><tspan x="1047.0" dy="16.9">власник теки або суперкористувач</tspan></text>
<rect x="50.0" y="944.0" width="1200.0" height="62.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="650.0" y="979.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">назва «sticky» лишилася від першої ролі, хоч від самої ролі в сучасних системах не зосталося нічого</tspan></text>
</svg>