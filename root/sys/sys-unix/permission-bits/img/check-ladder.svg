<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 950" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="950" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перевірка прав: перше «так» обирає клас</text>
<rect x="60.0" y="50.0" width="980.0" height="86.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="88.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">процес просить дію над об'єктом; хто просить — fsuid, fsgid і додаткові групи</tspan><tspan x="550.0" dy="18.2">питання йдуть згори вниз, і перше «так» обирає клас остаточно</tspan></text>
<rect x="60.0" y="176.0" width="440.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="216.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">fsuid збігається з власником файлу?</tspan></text>
<rect x="560.0" y="176.0" width="480.0" height="72.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="216.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">так → трійка власника, і тільки вона</tspan></text>
<line x1="506.0" y1="212.0" x2="552.0" y2="212.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="284.0" width="440.0" height="86.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="322.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">fsgid або одна з додаткових груп</tspan><tspan x="280.0" dy="18.2">збігається з групою файлу?</tspan></text>
<rect x="560.0" y="284.0" width="480.0" height="86.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="800.0" y="331.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">так → трійка групи, і тільки вона</tspan></text>
<line x1="506.0" y1="327.0" x2="552.0" y2="327.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="406.0" width="440.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="442.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">не збіглося нічого</tspan></text>
<rect x="560.0" y="406.0" width="480.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="442.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">трійка «решта»</tspan></text>
<line x1="506.0" y1="438.0" x2="552.0" y2="438.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="280.0" y1="248.0" x2="280.0" y2="280.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="280.0" y1="370.0" x2="280.0" y2="402.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="512.0" width="440.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="543.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">у вибраній трійці стоять усі</tspan><tspan x="280.0" dy="18.2">потрібні букви?</tspan></text>
<rect x="560.0" y="512.0" width="480.0" height="72.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="553.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">так → дозволено</tspan></text>
<line x1="506.0" y1="548.0" x2="552.0" y2="548.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="280.0" y1="470.0" x2="280.0" y2="508.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="626.0" width="440.0" height="86.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="665.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">ні → чи має процес</tspan><tspan x="280.0" dy="16.9">CAP_DAC_OVERRIDE або CAP_DAC_READ_SEARCH?</tspan></text>
<rect x="560.0" y="626.0" width="480.0" height="86.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="800.0" y="664.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">так → дозволено; виконання —</tspan><tspan x="800.0" dy="18.2">лише коли стоїть хоч один біт x</tspan></text>
<line x1="506.0" y1="669.0" x2="552.0" y2="669.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="280.0" y1="584.0" x2="280.0" y2="622.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="760.0" width="440.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="280.0" y="797.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">ні → EACCES</tspan></text>
<line x1="280.0" y1="712.0" x2="280.0" y2="756.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="560.0" y="744.0" width="480.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="800.0" y="789.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">----rw----   alice   devs   secret.txt</tspan><tspan x="800.0" dy="16.9">процес: fsuid=alice, групи alice і devs</tspan><tspan x="800.0" dy="16.9">перше «так» — власник</tspan><tspan x="800.0" dy="16.9">трійка власника порожня</tspan><tspan x="800.0" dy="16.9">права групи вже ніхто не питає  →  EACCES</tspan></text>
</svg>