<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Будова скомпільованого запису</text>
<text x="590.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">скомпільований запис бази: що лежить у файлі</text>
<rect x="60.0" y="92.0" width="178.0" height="96.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="149.0" y="129.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="149.0" dy="0.0">заголовок</tspan><tspan x="149.0" dy="15.0">6 двобайтових чисел:</tspan><tspan x="149.0" dy="15.0">мітка формату й розміри</tspan></text>
<rect x="248.0" y="92.0" width="196.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="346.0" y="136.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="346.0" dy="0.0">імена й псевдоніми</tspan><tspan x="346.0" dy="16.2">один рядок тексту</tspan></text>
<rect x="454.0" y="92.0" width="168.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="538.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="538.0" dy="0.0">булеві</tspan><tspan x="538.0" dy="16.2">по байту</tspan><tspan x="538.0" dy="16.2">на можливість</tspan></text>
<rect x="632.0" y="92.0" width="168.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="716.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="716.0" dy="0.0">числа</tspan><tspan x="716.0" dy="16.2">по 2 байти</tspan><tspan x="716.0" dy="16.2">на можливість</tspan></text>
<rect x="810.0" y="92.0" width="168.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="894.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="894.0" dy="0.0">зміщення рядків</tspan><tspan x="894.0" dy="16.2">по 2 байти</tspan><tspan x="894.0" dy="16.2">на можливість</tspan></text>
<rect x="988.0" y="92.0" width="132.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="1054.0" y="136.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1054.0" dy="0.0">таблиця</tspan><tspan x="1054.0" dy="16.2">рядків</tspan></text>
<rect x="454.0" y="214.0" width="700.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="804.0" y="243.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="804.0" dy="0.0">імен цих можливостей у файлі немає: «cup» — це просто ділянка з наперед відомим номером у таблиці зміщень</tspan></text>
<rect x="60.0" y="306.0" width="500.0" height="96.0" rx="6" fill="#fff8e6" stroke="#6b7280" stroke-width="1.5"/><text x="310.0" y="333.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Номер комірки — і є ім'я можливості.</tspan><tspan x="310.0" dy="16.9">Додати нову в стандартний набір означає зсунути</tspan><tspan x="310.0" dy="16.9">всі наступні номери й зробити нечитними</tspan><tspan x="310.0" dy="16.9">всі вже скомпільовані файли.</tspan></text>
<rect x="620.0" y="306.0" width="500.0" height="96.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="870.0" y="333.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">Тому нове дописують окремою частиною в кінці —</tspan><tspan x="870.0" dy="16.9">там поруч зі значеннями лежать і самі назви.</tspan><tspan x="870.0" dy="16.9">Саме так у базу потрапили «RGB», «Tc», «Smulx»</tspan><tspan x="870.0" dy="16.9">та інші домовленості останніх років.</tspan></text>
<line x1="560.0" y1="354.0" x2="616.0" y2="354.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="590.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">мітка формату розрізняє й самі формати: 0432 — числа по два байти, 01036 — по чотири</text>
</svg>