<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Черга відкладених проти зв'язків, побудованих з опису прошивки</text>
<rect x="30.0" y="60.0" width="520.0" height="430.0" rx="6" fill="#fdf1ea" stroke="#6b7280" stroke-width="1.2"/>
<text x="290.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">лише повторні спроби</text>
<rect x="60.0" y="124.0" width="460.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">модуль дисплея вантажиться першим</tspan></text>
<rect x="60.0" y="189.0" width="460.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="209.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">probe → −EPROBE_DEFER: регулятора немає</tspan></text>
<rect x="60.0" y="254.0" width="460.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="274.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">те саме після кожної чужої вдалої прив'язки</tspan></text>
<rect x="60.0" y="319.0" width="460.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="339.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">модуль регулятора нарешті завантажено</tspan></text>
<rect x="60.0" y="384.0" width="460.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="404.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">прохід по черзі → probe дисплея вдається</tspan></text>
<line x1="290.0" y1="160.0" x2="290.0" y2="185.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="290.0" y1="225.0" x2="290.0" y2="250.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="290.0" y1="290.0" x2="290.0" y2="315.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="290.0" y1="355.0" x2="290.0" y2="380.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="290.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">ядро не знає, чого чекає — просто пробує знову</text>
<rect x="590.0" y="60.0" width="520.0" height="430.0" rx="6" fill="#eff7ef" stroke="#6b7280" stroke-width="1.2"/>
<text x="850.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">граф, прочитаний з опису прошивки</text>
<rect x="620.0" y="124.0" width="460.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">у дереві пристроїв: дисплей посилається на регулятор</tspan></text>
<rect x="620.0" y="189.0" width="460.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="209.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">створено зв'язок постачальник → споживач</tspan></text>
<rect x="620.0" y="254.0" width="460.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="274.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">probe дисплея не кличуть, доки регулятор не прив'язано</tspan></text>
<rect x="620.0" y="319.0" width="460.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="339.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">регулятор прив'язано</tspan></text>
<rect x="620.0" y="384.0" width="460.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="404.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">probe дисплея — один раз, успішно</tspan></text>
<line x1="850.0" y1="160.0" x2="850.0" y2="185.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="850.0" y1="225.0" x2="850.0" y2="250.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="850.0" y1="290.0" x2="850.0" y2="315.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="850.0" y1="355.0" x2="850.0" y2="380.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="850.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">порядок відомий наперед; повторів майже немає</text>
</svg>