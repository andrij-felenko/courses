<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Юніт А і юніт Б: чотири можливі пари ребер між ними</text>
<rect x="330.0" y="108.0" width="452.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="556.0" y="141.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="556.0" dy="0.0">потреба задана</tspan><tspan x="556.0" dy="19.5">А: Requires=Б</tspan></text>
<rect x="806.0" y="108.0" width="452.0" height="76.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="1032.0" y="141.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1032.0" dy="0.0">потреби немає</tspan><tspan x="1032.0" dy="19.5">(Б у транзакцію не тягнеться)</tspan></text>
<rect x="40.0" y="210.0" width="268.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="174.0" y="243.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="174.0" dy="0.0">черга задана</tspan><tspan x="174.0" dy="19.5">А: After=Б</tspan></text>
<rect x="40.0" y="452.0" width="268.0" height="76.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="174.0" y="495.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="174.0" dy="0.0">черги немає</tspan></text>
<rect x="330.0" y="210.0" width="452.0" height="218.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="556.0" y="275.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="556.0" dy="0.0">Б підіймають першим, і лише</tspan><tspan x="556.0" dy="19.5">коли він піднявся — беруться за А.</tspan><tspan x="556.0" dy="19.5">Б не піднявся — А навіть</tspan><tspan x="556.0" dy="19.5">не пробує стартувати.</tspan><tspan x="556.0" dy="19.5">Це те, що зазвичай мають на увазі,</tspan><tspan x="556.0" dy="19.5">пишучи «залежність»</tspan></text>
<rect x="806.0" y="210.0" width="452.0" height="218.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1032.0" y="275.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1032.0" dy="0.0">«Якщо Б узагалі стартує сьогодні —</tspan><tspan x="1032.0" dy="19.5">то я після нього».</tspan><tspan x="1032.0" dy="19.5">Б через це не запускають:</tspan><tspan x="1032.0" dy="19.5">нема кому — ребро мовчить.</tspan><tspan x="1032.0" dy="19.5">Так пишуть After=network.target</tspan><tspan x="1032.0" dy="19.5">без жодного Wants=</tspan></text>
<rect x="330.0" y="452.0" width="452.0" height="218.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="556.0" y="517.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="556.0" dy="0.0">А і Б рушають одночасно.</tspan><tspan x="556.0" dy="19.5">Б упав через півсекунди —</tspan><tspan x="556.0" dy="19.5">А вже працює й ніколи</tspan><tspan x="556.0" dy="19.5">про це не дізнається.</tspan><tspan x="556.0" dy="19.5">Найчастіша помилка</tspan><tspan x="556.0" dy="19.5">в написаних руками юнітах</tspan></text>
<rect x="806.0" y="452.0" width="452.0" height="218.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="1032.0" y="527.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="1032.0" dy="0.0">Два незалежні юніти.</tspan><tspan x="1032.0" dy="19.5">Менеджер вільний пустити їх</tspan><tspan x="1032.0" dy="19.5">в одній хвилі — і саме</tspan><tspan x="1032.0" dy="19.5">з таких пар береться</tspan><tspan x="1032.0" dy="19.5">весь виграш у часі старту</tspan></text>
</svg>