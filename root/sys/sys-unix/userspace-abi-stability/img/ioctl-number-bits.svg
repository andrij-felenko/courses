<rect x="90.0" y="120.0" width="200.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="157.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">напрям</tspan><tspan x="190.0" dy="18.2">біти 31–30 · 2 біти</tspan></text>
<rect x="90.0" y="232.0" width="200.0" height="108.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="190.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">_IOC_NONE = 0</tspan><tspan x="190.0" dy="15.6">_IOC_WRITE = 1</tspan><tspan x="190.0" dy="15.6">_IOC_READ = 2</tspan></text>
<rect x="300.0" y="120.0" width="420.0" height="84.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="157.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">розмір структури</tspan><tspan x="510.0" dy="18.2">біти 29–16 · 14 бітів</tspan></text>
<rect x="300.0" y="232.0" width="420.0" height="108.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="510.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">sizeof того, що передають,</tspan><tspan x="510.0" dy="15.6">до 16383 байтів;</tspan><tspan x="510.0" dy="15.6">саме тут ховається пастка</tspan></text>
<rect x="730.0" y="120.0" width="300.0" height="84.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="157.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0.0">літера підсистеми</tspan><tspan x="880.0" dy="18.2">біти 15–8 · 8 бітів</tspan></text>
<rect x="730.0" y="232.0" width="300.0" height="108.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="880.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">'f' = 0x66 — файлові</tspan><tspan x="880.0" dy="15.6">системи; перелік літер —</tspan><tspan x="880.0" dy="15.6">ioctl-number.rst</tspan></text>
<rect x="1040.0" y="120.0" width="300.0" height="84.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="1190.0" y="157.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1190.0" dy="0.0">номер операції</tspan><tspan x="1190.0" dy="18.2">біти 7–0 · 8 бітів</tspan></text>
<rect x="1040.0" y="232.0" width="300.0" height="108.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1190.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1190.0" dy="0.0">1 — GETFLAGS,</tspan><tspan x="1190.0" dy="15.6">2 — SETFLAGS,</tspan><tspan x="1190.0" dy="15.6">11 — FIEMAP</tspan></text>
<text x="90.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">32-бітне число, яке програма передає другим аргументом ioctl</text>
<rect x="90.0" y="390.0" width="1220.0" height="66.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="700.0" y="428.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">_IOR('f', 1, long)  на 64-бітній машині:  sizeof(long) = 8  →  0x80086601</tspan></text>
<rect x="90.0" y="468.0" width="1220.0" height="66.0" rx="6" fill="#fff5e0" stroke="#c0392b" stroke-width="1.5"/><text x="700.0" y="506.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">_IOR('f', 1, int)   той самий запит для 32-бітної:  sizeof(int) = 4  →  0x80046601</tspan></text>
<rect x="90.0" y="556.0" width="1220.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="591.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">одна операція — два різні числа, тому в дереві ядра поруч стоять FS_IOC_GETFLAGS і FS_IOC32_GETFLAGS</tspan></text>
