<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1330 1010" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1330" height="1010" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність одного запуску su і джерело кожного рішення</text>
<text x="660.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">su - postgres</text>
<rect x="70.0" y="91.9" width="520.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">exec /bin/su, на файлі біт setuid:</tspan><tspan x="330.0" dy="18.2">euid стає 0, ruid лишається вашим</tspan></text>
<rect x="720.0" y="101.5" width="560.0" height="33.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="1000.0" y="122.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">ядро, за бітом на файлі</tspan></text>
<line x1="330.0" y1="150.1" x2="330.0" y2="201.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="217.0" width="520.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="238.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">пошук цілі: uid, gid, домівка, оболонка</tspan></text>
<rect x="720.0" y="209.1" width="560.0" height="49.9" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="1000.0" y="230.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">база облікових записів через getpwnam(),</tspan><tspan x="1000.0" dy="16.9">не ядро</tspan></text>
<line x1="330.0" y1="257.0" x2="330.0" y2="327.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="323.9" width="520.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="345.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">PAM питає пароль ЦІЛІ</tspan><tspan x="330.0" dy="18.2">(у root не питають — pam_rootok)</tspan></text>
<rect x="720.0" y="333.5" width="560.0" height="33.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="1000.0" y="354.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">стек /etc/pam.d/su, з тире — su-l</tspan></text>
<line x1="330.0" y1="382.1" x2="330.0" y2="433.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="449.0" width="520.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="330.0" y="470.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">fork(): далі йдуть два процеси</tspan></text>
<rect x="720.0" y="441.1" width="560.0" height="49.9" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="1000.0" y="462.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">батько лишається root — закрити сеанс PAM,</tspan><tspan x="1000.0" dy="16.9">дочекатися дитини, переслати сигнали</tspan></text>
<line x1="330.0" y1="489.0" x2="330.0" y2="559.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="555.9" width="520.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="577.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">setgid і додаткові групи цілі,</tspan><tspan x="330.0" dy="18.2">аж ПОТІМ setuid — усі три числа цільові</tspan></text>
<rect x="720.0" y="557.0" width="560.0" height="49.9" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="1000.0" y="578.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">після setuid прав на це вже немає:</tspan><tspan x="1000.0" dy="16.9">порядок незворотний</tspan></text>
<line x1="330.0" y1="614.1" x2="330.0" y2="665.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="681.0" width="520.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="702.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">перебудова оточення</tspan></text>
<rect x="720.0" y="681.5" width="560.0" height="33.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="1000.0" y="702.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">обсяг чистки задає тире в командному рядку</tspan></text>
<line x1="330.0" y1="721.0" x2="330.0" y2="791.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="797.0" width="520.0" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="818.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">exec оболонки цілі</tspan></text>
<rect x="720.0" y="797.5" width="560.0" height="33.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="1000.0" y="818.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">argv[0] = «-bash» робить її вхідною</tspan></text>
<rect x="220.0" y="933.9" width="880.0" height="52.2" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="660.0" y="955.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">процес той самий не став іншим — його просто немає:</tspan><tspan x="660.0" dy="18.2">оболонка цілі є ОКРЕМИМ процесом усередині вашого сеансу</tspan></text>
</svg>