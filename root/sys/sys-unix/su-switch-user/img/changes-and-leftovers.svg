<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 810" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="810" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що su міняє і що лишає від вашого сеансу</text>
<rect x="360.0" y="34.0" width="520.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="57.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">нова оболонка після su - postgres</tspan></text>
<line x1="620.0" y1="86.0" x2="320.0" y2="128.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="620.0" y1="86.0" x2="920.0" y2="128.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90.0" y="138.5" width="460.0" height="35.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="320.0" y="161.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">змінилося: те, що є числом</tspan></text>
<rect x="690.0" y="138.5" width="460.0" height="35.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="920.0" y="161.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">лишилося вашим: те, що є сеансом</tspan></text>
<rect x="85.0" y="223.5" width="470.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="244.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">реальний, діючий і збережений uid</tspan></text>
<rect x="85.0" y="309.5" width="470.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="330.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">gid і перелік додаткових груп</tspan></text>
<rect x="85.0" y="387.1" width="470.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="408.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">HOME і SHELL, а з тире —</tspan><tspan x="320.0" dy="16.9">ще PATH, USER, LOGNAME і поточна тека</tspan></text>
<rect x="85.0" y="473.1" width="470.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="320.0" y="494.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">усе, що ядро звіряє на доступ</tspan><tspan x="320.0" dy="16.9">до файлів і сигналів</tspan></text>
<rect x="685.0" y="223.5" width="470.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="920.0" y="244.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">керуючий термінал — той самий</tspan></text>
<rect x="685.0" y="309.5" width="470.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="920.0" y="330.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">сеанс входу — той самий</tspan></text>
<rect x="685.0" y="387.1" width="470.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="920.0" y="408.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">loginuid для аудиту: незмінний,</tspan><tspan x="920.0" dy="16.9">тож журнал і далі знає ваше ім'я</tspan></text>
<rect x="685.0" y="473.1" width="470.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="920.0" y="494.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">cgroup і сеанс logind — ваші,</tspan><tspan x="920.0" dy="16.9">разом з обліком ресурсів</tspan></text>
<rect x="685.0" y="567.5" width="470.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="920.0" y="588.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">дескриптори 0, 1, 2 — ваш термінал</tspan></text>
<rect x="685.0" y="653.5" width="470.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="920.0" y="674.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">батьківський su чекає на вихід</tspan></text>
<rect x="240.0" y="713.9" width="760.0" height="52.2" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="735.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">усі пастки теми живуть у правій колонці:</tspan><tspan x="620.0" dy="18.2">слово «стати» обіцяє її теж, а механізм її не чіпає</tspan></text>
</svg>