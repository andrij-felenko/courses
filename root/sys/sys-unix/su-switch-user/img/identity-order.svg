<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 910" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="910" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три виклики зміни ідентичності: правильний порядок і зворотний</text>
<rect x="100.0" y="32.8" width="1200.0" height="54.5" rx="6" fill="#fdf6e3" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="55.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">дитина одразу після fork(): ruid 1000 (andrij) · euid 0 · gid 1000 · додаткові групи {1000, 10 wheel}</tspan><tspan x="700.0" dy="19.5">exec із бітом setuid підняв лише uid — групи й gid лишилися вашими</tspan></text>
<line x1="700.0" y1="100.0" x2="370.0" y2="156.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="100.0" x2="1030.0" y2="156.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90.0" y="168.0" width="560.0" height="36.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="191.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">групи → gid → uid</tspan></text>
<rect x="750.0" y="168.0" width="560.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1030.0" y="191.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1030.0" dy="0.0">uid першим</tspan></text>
<rect x="90.0" y="273.9" width="560.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="295.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">initgroups(&quot;postgres&quot;, 999) → 0</tspan><tspan x="370.0" dy="18.2">додаткові групи стали {999}</tspan></text>
<rect x="750.0" y="273.9" width="560.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1030.0" y="295.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">setuid(999) → 0</tspan><tspan x="1030.0" dy="18.2">root зник просто зараз</tspan></text>
<line x1="370.0" y1="332.1" x2="370.0" y2="397.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1030.0" y1="332.1" x2="1030.0" y2="397.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90.0" y="403.9" width="560.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="425.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">setgid(999) → 0</tspan><tspan x="370.0" dy="18.2">усі три групові числа — 999</tspan></text>
<rect x="750.0" y="403.9" width="560.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1030.0" y="425.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">setgid(999) → -1, EPERM</tspan><tspan x="1030.0" dy="18.2">gid лишився 1000 — вашим</tspan></text>
<line x1="370.0" y1="462.1" x2="370.0" y2="527.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1030.0" y1="462.1" x2="1030.0" y2="527.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="90.0" y="533.9" width="560.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="555.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">setuid(999) → 0</tspan><tspan x="370.0" dy="18.2">усі три користувацькі — 999, root зник</tspan></text>
<rect x="750.0" y="533.9" width="560.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1030.0" y="555.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">initgroups(&quot;postgres&quot;, 999) → -1, EPERM</tspan><tspan x="1030.0" dy="18.2">додаткові групи лишилися {1000, 10}</tspan></text>
<rect x="90.0" y="693.9" width="560.0" height="52.2" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="715.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">postgres:postgres, груп більше немає —</tspan><tspan x="370.0" dy="18.2">рівно та ідентичність, яку дав би справжній вхід</tspan></text>
<rect x="750.0" y="693.9" width="560.0" height="52.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1030.0" y="715.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">uid postgres, gid andrij, wheel при собі —</tspan><tspan x="1030.0" dy="18.2">нові файли ваші, доступ по wheel відкритий</tspan></text>
<rect x="250.0" y="793.9" width="900.0" height="52.2" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="700.0" y="815.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">обидві помилки мовчазні: значення повертається, і програма,</tspan><tspan x="700.0" dy="18.2">яка на нього не подивилася, вважає, що все вдалося</tspan></text>
</svg>