<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вибір оболонки і вибір PATH у su: два порядки правил</text>
<rect x="70.0" y="34.0" width="520.0" height="36.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="330.0" y="57.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">яку оболонку запустить su</tspan></text>
<rect x="680.0" y="34.0" width="560.0" height="36.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="960.0" y="57.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="960.0" dy="0.0">який PATH дістане нова оболонка</tspan></text>
<text x="330.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">діє перше правило, що спрацювало</text>
<text x="960.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">діє перше правило, що спрацювало</text>
<rect x="60.0" y="136.6" width="540.0" height="66.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="157.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">--shell SH</tspan><tspan x="330.0" dy="16.9">(для не-root ігнорується, якщо оболонки цілі</tspan><tspan x="330.0" dy="16.9">немає в /etc/shells)</tspan></text>
<line x1="330.0" y1="209.4" x2="330.0" y2="248.6" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="263.1" width="540.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="284.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">$SHELL — тільки коли задано -m / -p</tspan><tspan x="330.0" dy="16.9">(та сама умова про /etc/shells)</tspan></text>
<line x1="330.0" y1="318.9" x2="330.0" y2="375.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="389.5" width="540.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="410.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">оболонка цілі з бази облікових записів</tspan></text>
<line x1="330.0" y1="428.5" x2="330.0" y2="501.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="507.5" width="540.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="528.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">/bin/sh</tspan></text>
<rect x="670.0" y="153.5" width="580.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="960.0" y="174.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">-m / -p → PATH лишається вашим</tspan></text>
<line x1="960.0" y1="192.5" x2="960.0" y2="265.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="670.0" y="271.5" width="580.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="960.0" y="292.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">- / -l → PATH складається з login.defs</tspan></text>
<line x1="960.0" y1="310.5" x2="960.0" y2="383.5" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="670.0" y="381.1" width="580.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="960.0" y="402.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">інакше: ALWAYS_SET_PATH=yes → з login.defs,</tspan><tspan x="960.0" dy="16.9">ні → лишається вашим</tspan></text>
<rect x="670.0" y="452.6" width="580.0" height="66.8" rx="6" fill="#f6f2ea" stroke="#6b7280" stroke-width="1.5"/><text x="960.0" y="473.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">«з login.defs» означає:</tspan><tspan x="960.0" dy="16.9">ціль root → ENV_SUPATH, а як порожній — ENV_ROOTPATH</tspan><tspan x="960.0" dy="16.9">будь-яка інша ціль → ENV_PATH</tspan></text>
<rect x="200.0" y="569.9" width="900.0" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="591.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">жодна з драбин не питає вашої згоди:</tspan><tspan x="650.0" dy="18.2">що саме спрацювало, показує тільки echo $PATH і echo $0 всередині</tspan></text>
</svg>