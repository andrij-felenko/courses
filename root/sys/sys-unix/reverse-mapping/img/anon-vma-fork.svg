<rect x="60.0" y="556.0" width="1180.0" height="96.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.4"/><text x="650.0" y="600.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">сторінка, доторкана ДО розгалуження, помічена об'єктом предка — і його дерево досі містить усіх нащадків,</tspan><tspan x="650.0" dy="16.9">тож жоден глядач не загубився; платою за розділення є ребра «ділянка ↔ об'єкт», по одному на предка</tspan></text>
