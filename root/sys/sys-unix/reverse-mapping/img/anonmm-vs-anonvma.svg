<rect x="380.0" y="324.0" width="200.0" height="58.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.3"/><text x="480.0" y="357.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">mm процесу B</tspan></text>
<line x1="330.0" y1="300.0" x2="180.0" y2="324.0" stroke="#2457d6" stroke-width="1.4"/>
<line x1="330.0" y1="300.0" x2="480.0" y2="324.0" stroke="#2457d6" stroke-width="1.4"/>
<rect x="80.0" y="404.0" width="500.0" height="76.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="330.0" y="438.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">адресу в просторі беремо з поля index самої сторінки:</tspan><tspan x="330.0" dy="16.2">вона однакова в усіх, хто цю сторінку успадкував</tspan></text>
<rect x="80.0" y="500.0" width="500.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="330.0" y="536.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">ЛАМАЄТЬСЯ на mremap: ділянку пересунули —</tspan><tspan x="330.0" dy="16.2">збережена адреса стала брехнею.</tspan><tspan x="330.0" dy="16.2">Лікування: скопіювати зачеплені сторінки</tspan></text>
<rect x="810.0" y="128.0" width="200.0" height="54.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/><text x="910.0" y="159.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">анонімна сторінка</tspan></text>
<line x1="910.0" y1="182.0" x2="910.0" y2="226.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="810.0" y="226.0" width="200.0" height="54.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="910.0" y="257.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">struct anon_vma</tspan></text>
<line x1="910.0" y1="280.0" x2="910.0" y2="324.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="660.0" y="324.0" width="200.0" height="58.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.3"/><text x="760.0" y="357.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">ділянка в A</tspan></text>
<rect x="960.0" y="324.0" width="200.0" height="58.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.3"/><text x="1060.0" y="357.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1060.0" dy="0.0">ділянка в B</tspan></text>
<line x1="910.0" y1="300.0" x2="760.0" y2="324.0" stroke="#27ae60" stroke-width="1.4"/>
<line x1="910.0" y1="300.0" x2="1060.0" y2="324.0" stroke="#27ae60" stroke-width="1.4"/>
<rect x="660.0" y="404.0" width="500.0" height="76.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="910.0" y="438.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">адресу рахуємо з полів самої ділянки:</tspan><tspan x="910.0" dy="16.2">де ділянка тепер, там і сторінка</tspan></text>
<rect x="660.0" y="500.0" width="500.0" height="96.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="910.0" y="536.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">mremap не страшний; обхід не мусить шукати ділянку</tspan><tspan x="910.0" dy="16.2">в дереві простору.</tspan><tspan x="910.0" dy="16.2">Ціна: більша структура ділянки й гірше злиття сусідніх</tspan></text>
<rect x="60.0" y="618.0" width="1120.0" height="62.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.3"/><text x="620.0" y="653.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="620.0" dy="0.0">виміри показали приблизно рівну швидкодію — вибирали не за нею</tspan></text>
</svg>