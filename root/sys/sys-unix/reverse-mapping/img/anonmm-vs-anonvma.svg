<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві конкурентні прив'язки анонімної сторінки</text>
<rect x="60.0" y="40.0" width="540.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="330.0" y="71.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">anonmm — прив'язка до адресного простору</tspan></text>
<rect x="640.0" y="40.0" width="540.0" height="52.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="910.0" y="71.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="910.0" dy="0.0">anon_vma — прив'язка до ділянок</tspan></text>
<rect x="230.0" y="128.0" width="200.0" height="54.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.4"/><text x="330.0" y="159.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">анонімна сторінка</tspan></text>
<line x1="330.0" y1="182.0" x2="330.0" y2="226.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="230.0" y="226.0" width="200.0" height="54.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="330.0" y="257.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">struct anonmm</tspan></text>
<line x1="330.0" y1="280.0" x2="330.0" y2="324.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
