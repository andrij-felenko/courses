<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -10 1250 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-30" y="-10" width="1250" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто вказує на цей кадр: три способи відповісти</text>
<rect x="80.0" y="62.0" width="300.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="230.0" y="90.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">Перебрати все</tspan></text>
<rect x="80.0" y="132.0" width="300.0" height="88.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="230.0" y="172.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">жодної службової</tspan><tspan x="230.0" dy="15.6">структури не треба</tspan></text>
<rect x="80.0" y="244.0" width="300.0" height="88.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.5"/><text x="230.0" y="276.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">переглянути записи</tspan><tspan x="230.0" dy="15.6">усіх таблиць усіх</tspan><tspan x="230.0" dy="15.6">процесів</tspan></text>
<rect x="80.0" y="356.0" width="300.0" height="84.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="230.0" y="402.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="230.0" dy="0.0">0</tspan></text>
<rect x="80.0" y="464.0" width="300.0" height="84.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.4"/><text x="230.0" y="494.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">десятки мільйонів</tspan><tspan x="230.0" dy="15.6">записів на одну</tspan><tspan x="230.0" dy="15.6">сторінку</tspan></text>
<rect x="460.0" y="62.0" width="300.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="610.0" y="90.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Список на кадрі</tspan></text>
<rect x="460.0" y="132.0" width="300.0" height="88.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="610.0" y="164.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">кожен кадр носить</tspan><tspan x="610.0" dy="15.6">список записів, які</tspan><tspan x="610.0" dy="15.6">на нього вказують</tspan></text>
<rect x="460.0" y="244.0" width="300.0" height="88.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.5"/><text x="610.0" y="284.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">пройти готовий</tspan><tspan x="610.0" dy="15.6">список</tspan></text>
<rect x="460.0" y="356.0" width="300.0" height="84.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="610.0" y="386.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="610.0" dy="0.0">структура на кожен</tspan><tspan x="610.0" dy="15.6">кадр системи + правка</tspan><tspan x="610.0" dy="15.6">на кожному відображенні</tspan></text>
<rect x="460.0" y="464.0" width="300.0" height="84.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.4"/><text x="610.0" y="494.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">довжина списку,</tspan><tspan x="610.0" dy="15.6">але суцільні</tspan><tspan x="610.0" dy="15.6">промахи кеша</tspan></text>
<rect x="840.0" y="62.0" width="300.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="990.0" y="90.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="990.0" dy="0.0">Шлях через об'єкт</tspan></text>
<rect x="840.0" y="132.0" width="300.0" height="88.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="990.0" y="164.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">сторінка знає свій</tspan><tspan x="990.0" dy="15.6">об'єкт, об'єкт знає</tspan><tspan x="990.0" dy="15.6">свої ділянки</tspan></text>
<rect x="840.0" y="244.0" width="300.0" height="88.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.5"/><text x="990.0" y="276.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">спитати об'єкт про</tspan><tspan x="990.0" dy="15.6">ділянки й порахувати</tspan><tspan x="990.0" dy="15.6">адресу для кожної</tspan></text>
<rect x="840.0" y="356.0" width="300.0" height="84.0" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.2"/><text x="990.0" y="386.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="990.0" dy="0.0">нуль на кадр: усе</tspan><tspan x="990.0" dy="15.6">потрібне вже є для</tspan><tspan x="990.0" dy="15.6">інших цілей</tspan></text>
<rect x="840.0" y="464.0" width="300.0" height="84.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.4"/><text x="990.0" y="494.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">кількість ділянок,</tspan><tspan x="990.0" dy="15.6">що справді накривають</tspan><tspan x="990.0" dy="15.6">це місце об'єкта</tspan></text>
<text x="70.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">що зберігаємо</text>
<text x="70.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">як відповідаємо</text>
<text x="70.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">плата пам'яттю</text>
<text x="70.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">плата часом</text>
</svg>