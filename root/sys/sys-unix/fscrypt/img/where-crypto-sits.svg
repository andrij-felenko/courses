<line x1="220.0" y1="348.0" x2="220.0" y2="370.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="20.0" y="370.0" width="400.0" height="58.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.3"/><text x="220.0" y="404.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">блоковий шар</tspan></text>
<line x1="220.0" y1="428.0" x2="220.0" y2="450.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="20.0" y="450.0" width="400.0" height="58.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.3"/><text x="220.0" y="484.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">носій</tspan></text>
<text x="220.0" y="564.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="220.0" dy="0.0">бачить файли, але не бачить,</tspan><tspan x="220.0" dy="17.6">як ФС розкладає їх по блоках;</tspan><tspan x="220.0" dy="17.6">той самий вміст лежить у пам'яті</tspan><tspan x="220.0" dy="17.6">двічі — відкритий і зашифрований</tspan></text>
<text x="680.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">усередині файлової системи</tspan></text>
<rect x="480.0" y="130.0" width="400.0" height="58.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.3"/><text x="680.0" y="164.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">програма</tspan></text>
<line x1="680.0" y1="188.0" x2="680.0" y2="210.0" stroke="#6b7280" stroke-width="1.2"/>
