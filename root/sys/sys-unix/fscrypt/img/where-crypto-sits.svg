<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1370 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1370" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="680.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">три місця в стосі, де можна зашифрувати ті самі дані</text>
<text x="220.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">стос поверх файлової системи</tspan></text>
<rect x="20.0" y="130.0" width="400.0" height="58.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.3"/><text x="220.0" y="164.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">програма</tspan></text>
<line x1="220.0" y1="188.0" x2="220.0" y2="210.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="20.0" y="210.0" width="400.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="220.0" y="244.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">шар шифрування поверх ФС</tspan></text>
<line x1="220.0" y1="268.0" x2="220.0" y2="290.0" stroke="#6b7280" stroke-width="1.2"/>
