<line x1="1140.0" y1="268.0" x2="1140.0" y2="290.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="940.0" y="290.0" width="400.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/><text x="1140.0" y="324.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">файлова система</tspan></text>
<line x1="1140.0" y1="348.0" x2="1140.0" y2="370.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="940.0" y="370.0" width="400.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="1140.0" y="404.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1140.0" dy="0.0">dm-crypt</tspan></text>
<line x1="1140.0" y1="428.0" x2="1140.0" y2="450.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="940.0" y="450.0" width="400.0" height="58.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.3"/><text x="1140.0" y="484.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">носій</tspan></text>
<text x="1140.0" y="564.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="1140.0" dy="0.0">бачить лише сектори розділу</tspan><tspan x="1140.0" dy="17.6">й не знає, чий це файл;</tspan><tspan x="1140.0" dy="17.6">ховає геть усе, разом із метаданими,</tspan><tspan x="1140.0" dy="17.6">але ключ один на весь розділ</tspan></text>
