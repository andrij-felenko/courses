<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1430 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1430" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="710.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">три стани ключа у файловій системі й переходи між ними</text>
<rect x="105.3" y="203.9" width="259.4" height="52.2" rx="6" fill="#eceff3" stroke="#333333" stroke-width="2.0"/><text x="235.0" y="225.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="235.0" dy="0.0">FSCRYPT_KEY_STATUS_ABSENT · 1</tspan><tspan x="235.0" dy="18.2">ключа у файловій системі немає</tspan></text>
<text x="235.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="235.0" dy="0.0">відкрити чи створити файл під цим ключем —</tspan><tspan x="235.0" dy="17.6">ENOKEY; ls, stat, rm працюють і без нього</tspan></text>
<rect x="566.3" y="203.9" width="267.4" height="52.2" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/><text x="700.0" y="225.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">FSCRYPT_KEY_STATUS_PRESENT · 2</tspan><tspan x="700.0" dy="18.2">ключ у пам'яті файлової системи</tspan></text>
<text x="700.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="700.0" dy="0.0">user_count — скільки користувачів його заявили;</tspan><tspan x="700.0" dy="17.6">REMOVE_KEY від одного з кількох знімає лише</tspan><tspan x="700.0" dy="17.6">його заявку: 0 з прапорцем OTHER_USERS,</tspan><tspan x="700.0" dy="17.6">стан лишається PRESENT</tspan></text>
<rect x="998.4" y="203.9" width="363.1" height="52.2" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="2.0"/><text x="1180.0" y="225.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1180.0" dy="0.0">FSCRYPT_KEY_STATUS_INCOMPLETELY_REMOVED · 3</tspan><tspan x="1180.0" dy="18.2">секрет затерто, частина файлів ще відкрита</tspan></text>
<text x="1180.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="1180.0" dy="0.0">нові відкриття вже дають ENOKEY,</tspan><tspan x="1180.0" dy="17.6">а ключі вже відкритих файлів ядро</tspan><tspan x="1180.0" dy="17.6">не забирає — вони дочитають своє</tspan></text>
<line x1="374.7" y1="230.0" x2="556.3" y2="230.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="465.5" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="465.5" dy="0.0">FS_IOC_ADD_ENCRYPTION_KEY</tspan><tspan x="465.5" dy="16.9">user_count: 0 → 1</tspan></text>
<line x1="843.7" y1="230.0" x2="988.4" y2="230.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="916.1" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="916.1" dy="0.0">REMOVE_KEY від останнього користувача,</tspan><tspan x="916.1" dy="16.9">коли якісь файли ще відкриті → FILES_BUSY</tspan></text>
<line x1="700.0" y1="256.1" x2="700.0" y2="350.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="700.0" y1="350.0" x2="235.0" y2="350.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="235.0" y1="350.0" x2="235.0" y2="262.1" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="467.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle"><tspan x="467.0" dy="0.0">REMOVE_KEY від останнього користувача, коли жоден файл не відкрито:</tspan><tspan x="467.0" dy="16.9">секрет затерто, кеші імен і сторінок скинуто, повернено 0 без прапорців</tspan></text>
<line x1="1180.0" y1="256.1" x2="1180.0" y2="424.0" stroke="#b8860b" stroke-width="2.0"/>
<line x1="1180.0" y1="424.0" x2="62.0" y2="424.0" stroke="#b8860b" stroke-width="2.0"/>
<line x1="62.0" y1="424.0" x2="62.0" y2="230.0" stroke="#b8860b" stroke-width="2.0"/>
<line x1="62.0" y1="230.0" x2="95.3" y2="230.0" stroke="#b8860b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="680.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle"><tspan x="680.0" dy="0.0">закрити ті файли й повторити REMOVE_KEY — саме воно не довершиться</tspan></text>
<line x1="70.0" y1="578.0" x2="1350.0" y2="578.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="710.0" y="614.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">FS_IOC_GET_ENCRYPTION_KEY_STATUS читає цей стан і не потребує жодних прав:</tspan><tspan x="710.0" dy="18.2">відсутній ключ він показує станом ABSENT, а не помилкою ENOKEY.</tspan></text>
</svg>