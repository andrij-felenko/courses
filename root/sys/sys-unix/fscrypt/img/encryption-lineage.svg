<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1510 1034" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1510" height="1034" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="750.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">родовід файлового шифрування в Linux: кожен крок — відповідь на ваду попереднього</text>
<text x="620.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">що з цього вийшло і що лишалося болючим</text>
<rect x="70.0" y="118.0" width="470.0" height="100.0" rx="6" fill="#eceff3" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="163.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">2006 · eCryptfs, ядро 2.6.19</tspan><tspan x="305.0" dy="19.5">шифр стосом ПОВЕРХ готової ФС</tspan></text>
<text x="620.0" y="155.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="620.0" dy="0.0">той самий вміст осідає в пам'яті двічі — відкритий зверху,</tspan><tspan x="620.0" dy="17.6">зашифрований знизу; у кожному файлі власний заголовок,</tspan><tspan x="620.0" dy="17.6">зашифроване ім'я довшає на третину</tspan></text>
<line x1="305.0" y1="224.0" x2="305.0" y2="264.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="70.0" y="270.0" width="470.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="315.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">2015 · шифрування ext4, ядро 4.1</tspan><tspan x="305.0" dy="19.5">шифр УСЕРЕДИНІ файлової системи</tspan></text>
<text x="620.0" y="307.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="620.0" dy="0.0">подвійного кешу більше немає: сторінку шифрують у тимчасовий</tspan><tspan x="620.0" dy="17.6">буфер дорогою на носій. Але код лежав у fs/ext4 і був лише її —</tspan><tspan x="620.0" dy="17.6">f2fs мусив би переписати те саме в себе</tspan></text>
<line x1="305.0" y1="376.0" x2="305.0" y2="416.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="70.0" y="422.0" width="470.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="467.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">2016 · fs/crypto, ядро 4.6</tspan><tspan x="305.0" dy="19.5">спільний код для ext4, f2fs і решти</tspan></text>
<text x="620.0" y="459.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="620.0" dy="0.0">одна підсистема на всі файлові системи. Ключі все ще v1:</tspan><tspan x="620.0" dy="17.6">головний ключ шукають у зв'язках процесу за описовим</tspan><tspan x="620.0" dy="17.6">дескриптором, ключ файлу виводять AES-128-ECB під nonce</tspan></text>
<line x1="305.0" y1="528.0" x2="305.0" y2="568.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="70.0" y="574.0" width="470.0" height="100.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="619.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">2016 · Android 7.0, FBE</tspan><tspan x="305.0" dy="19.5">сховища DE (до входу) і CE (після)</tspan></text>
<text x="620.0" y="611.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="620.0" dy="0.0">телефон завантажується до робочого стану, поки дані власника</tspan><tspan x="620.0" dy="17.6">ще замкнені, — того, чого один ключ на весь розділ дати не міг.</tspan><tspan x="620.0" dy="17.6">З Android 10 нові пристрої зобов'язані так робити</tspan></text>
<line x1="305.0" y1="680.0" x2="305.0" y2="720.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="70.0" y="726.0" width="470.0" height="100.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="771.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">2019 · Adiantum, ядро 5.0</tspan><tspan x="305.0" dy="19.5">режим для процесорів без AES</tspan></text>
<text x="620.0" y="763.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="620.0" dy="0.0">на дешевому ARM Cortex-A7 AES-256-XTS з'їдав надто багато:</tspan><tspan x="620.0" dy="17.6">Adiantum на блоках 4096 байтів шифрує вчетверо, а розшифровує</tspan><tspan x="620.0" dy="17.6">вп'ятеро швидше — шифрування перестало бути платною опцією</tspan></text>
<line x1="305.0" y1="832.0" x2="305.0" y2="872.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="70.0" y="878.0" width="470.0" height="100.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="305.0" y="923.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">2019 · політики v2, ядро 5.4</tspan><tspan x="305.0" dy="19.5">HKDF-SHA512 і зв'язка ключів ФС</tspan></text>
<text x="620.0" y="915.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="620.0" dy="0.0">ключ кладуть у зв'язку самої файлової системи й упізнають за</tspan><tspan x="620.0" dy="17.6">16-байтовим ідентифікатором, теж виведеним KDF: підсунути</tspan><tspan x="620.0" dy="17.6">чужий ключ уже не вийде, а прибрати свій — вийде напевно</tspan></text>
</svg>