<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1382.5 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1382.5" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конфлікт аліасингу типів пам'яті</text>
<text x="660.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конфлікт аліасингу: дві віртуальні адреси з різними типами пам'яті на один кадр</text>
<rect x="60.0" y="80.0" width="420.0" height="90.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="112.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Віртуальна адреса 1: Ядро (Direct Map)</tspan><tspan x="270.0" dy="16.9">Тип пам'яті: Write-Back (WB)</tspan><tspan x="270.0" dy="16.9">(кешоване читання й запис)</tspan></text>
<rect x="840.0" y="80.0" width="420.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1050.0" y="112.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1050.0" dy="0.0">Віртуальна адреса 2: Драйвер (ioremap)</tspan><tspan x="1050.0" dy="16.9">Тип пам'яті: Uncacheable (UC) / WC</tspan><tspan x="1050.0" dy="16.9">(прямий некешований доступ)</tspan></text>
<line x1="270.0" y1="170.0" x2="270.0" y2="240.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1050.0" y1="170.0" x2="1050.0" y2="420.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="100.0" y="240.0" width="340.0" height="110.0" rx="6" fill="#fff5e0" stroke="#c0392b" stroke-width="1.5"/><text x="270.0" y="283.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Кеш процесора L1/L2</tspan><tspan x="270.0" dy="15.6">Рядок кешу в стані Modified (брудний)</tspan><tspan x="270.0" dy="15.6">Дані змінено в кеші, але НЕ на шині!</tspan></text>
<line x1="270.0" y1="350.0" x2="270.0" y2="420.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="285.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Пізніше витіснення (Eviction)
скидає старі дані на шину!</text>
<rect x="200.0" y="430.0" width="920.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="660.0" y="480.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Фізичний кадр пам'яті (PCIe BAR / MMIO регістри контролера / Буфер DMA)</tspan><tspan x="660.0" dy="18.2">Фізична адреса: 0xFD000000</tspan></text>
<text x="660.0" y="570.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Апаратні катастрофи внаслідок неузгодженості типів пам'яті (Memory Type Mismatch):</text>
<rect x="60.0" y="595.0" width="380.0" height="140.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="250.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1. Перезапис регістрів пристрою</text>
<rect x="70.0" y="635.0" width="360.0" height="90.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="0.8"/><text x="250.0" y="671.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Скидання брудного рядка кешу з WB-відображення перезаписує регістри керування або пошкоджує вхідний пакет DMA.</tspan></text>
<rect x="470.0" y="595.0" width="380.0" height="140.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="660.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2. Втрата подій і переривань</text>
<rect x="480.0" y="635.0" width="360.0" height="90.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="0.8"/><text x="660.0" y="695.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Спекулятивне читання через WB-псевдонім зчитує регістр FIFO зі скиданням при читанні (clear-on-read). Апаратне переривання втрачається!</tspan></text>
<rect x="880.0" y="595.0" width="380.0" height="140.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/>
<text x="1070.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">3. Апаратний збій MCE / шини</text>
<rect x="890.0" y="635.0" width="360.0" height="90.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="0.8"/><text x="1070.0" y="683.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1070.0" dy="0.0">Одночасне перебування даних у кеші та некешовані транзакції на шині порушують протокол когерентності (PCIe Completion Error, MCE).</tspan></text>
</svg>