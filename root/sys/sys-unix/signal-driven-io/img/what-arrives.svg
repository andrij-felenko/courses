<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що дістає програма з сигналу про готовність</text>
<rect x="34.0" y="26.0" width="440.0" height="44.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="254.0" y="53.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="254.0" dy="0.0">SIGIO (типово)</tspan></text>
<rect x="526.0" y="26.0" width="440.0" height="44.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="746.0" y="53.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="746.0" dy="0.0">SIGRTMIN+n після F_SETSIG</tspan></text>
<rect x="34.0" y="96.0" width="440.0" height="96.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="254.0" y="131.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="254.0" dy="0.0">у програму приходить</tspan><tspan x="254.0" dy="16.9">номер сигналу — і все:</tspan><tspan x="254.0" dy="16.9">який дескриптор, читати чи писати — невідомо</tspan></text>
<rect x="526.0" y="96.0" width="440.0" height="96.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="746.0" y="123.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="746.0" dy="0.0">siginfo_t:</tspan><tspan x="746.0" dy="16.9">si_fd — дескриптор</tspan><tspan x="746.0" dy="16.9">si_band — те саме, що revents у poll</tspan><tspan x="746.0" dy="16.9">si_code — POLL_IN, POLL_OUT, POLL_ERR, POLL_HUP</tspan></text>
<rect x="34.0" y="216.0" width="440.0" height="92.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="254.0" y="249.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="254.0" dy="0.0">очікування — один біт:</tspan><tspan x="254.0" dy="16.9">десять подій, поки сигнал заблоковано,</tspan><tspan x="254.0" dy="16.9">дають одну доставку</tspan></text>
<rect x="526.0" y="216.0" width="440.0" height="92.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="746.0" y="249.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="746.0" dy="0.0">очікування — черга записів:</tspan><tspan x="746.0" dy="16.9">кожна подія зберігається окремо,</tspan><tspan x="746.0" dy="16.9">межа — RLIMIT_SIGPENDING</tspan></text>
<rect x="34.0" y="332.0" width="440.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="254.0" y="355.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="254.0" dy="0.0">робота пропорційна</tspan><tspan x="254.0" dy="16.9">кількості дескрипторів:</tspan><tspan x="254.0" dy="16.9">після сигналу — повний обхід</tspan></text>
<rect x="526.0" y="332.0" width="440.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="746.0" y="355.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="746.0" dy="0.0">робота пропорційна кількості подій —</tspan><tspan x="746.0" dy="16.9">доки черга не переповниться</tspan><tspan x="746.0" dy="16.9">й ядро не поверне звичайний SIGIO</tspan></text>
</svg>