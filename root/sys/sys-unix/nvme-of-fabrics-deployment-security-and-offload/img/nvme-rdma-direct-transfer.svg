<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 980 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="980" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="960.0" height="460.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="30.0" y="40.0" width="380.0" height="380.0" rx="8" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="220.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оперативна пам'ять Хоста (Host RAM)</text>
<rect x="50.0" y="100.0" width="340.0" height="100.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="220.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зареєстрований буфер даних (MR)</text>
<text x="220.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">Віртуальна адреса: 0x7fff8000</text>
<text x="220.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#880000" text-anchor="middle" font-weight="700">rkey (Remote Key): 0x0042a1b0</text>
<rect x="50.0" y="230.0" width="340.0" height="160.0" rx="4" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/>
<text x="220.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">RDMA Queue Pair (QP)</text>
<text x="220.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Send Queue (SQ) / Receive Queue (RQ)</text>
<text x="220.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle">Капсула команди містить Keyed SGL Descriptor:</text>
<text x="220.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">[Address: 0x7fff8000 | Length: 64KB | Key: 0x0042a1b0]</text>
<rect x="550.0" y="40.0" width="380.0" height="380.0" rx="8" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/>
<text x="740.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сервер Таргет (Target NVMe)</text>
<rect x="570.0" y="100.0" width="340.0" height="120.0" rx="4" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/>
<text x="740.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">RDMA NIC (RNIC / InfiniBand HCA)</text>
<text x="740.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Апаратний HW Engine прямого DMA</text>
<text x="740.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle">Автономна валідація rkey та прав</text>
<rect x="570.0" y="250.0" width="340.0" height="140.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="740.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Локальний NVMe Контролер</text>
<text x="740.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Прямий DMA у буфер RNIC</text>
<text x="740.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#26a269" text-anchor="middle" font-weight="700">Низькі затримки без виклику CPU</text>
<line x1="390.0" y1="300.0" x2="570.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="348.1" y="200.0" width="253.7" height="30.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="475.0" y="218.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">1. RDMA Send: Command Capsule + Keyed SGL</tspan></text>
<line x1="570.0" y1="180.0" x2="390.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="359.6" y="260.0" width="230.9" height="30.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="475.0" y="296.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">2. RDMA Read/Write: Пряме DMA по rkey</tspan></text>
<line x1="570.0" y1="200.0" x2="390.0" y2="340.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="362.4" y="320.0" width="225.2" height="30.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="475.0" y="338.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">3. RDMA Send: Response Capsule (CQE)</tspan></text>
</svg>