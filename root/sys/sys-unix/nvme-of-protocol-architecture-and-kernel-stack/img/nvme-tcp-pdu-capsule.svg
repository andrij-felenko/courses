<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія NVMe/TCP Command PDU (Капсула Команди)</text>
<rect x="20.0" y="50.0" width="920.0" height="280.0" rx="8" fill="#f5f7fa" stroke="#333333" stroke-width="1.5"/>
<rect x="40.0" y="90.0" width="180.0" height="200.0" rx="4" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/>
<text x="130.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">PDU Header (8 Б)</text>
<line x1="40.0" y1="130.0" x2="220.0" y2="130.0" stroke="#333333" stroke-width="1.0"/>
<text x="130.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">type = 0x04 (Cmd)</text>
<text x="130.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">flags (HDigest/DDigest)</text>
<text x="130.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">hlen = 72 (8+64 Б)</text>
<text x="130.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">pdo = Data Offset</text>
<text x="130.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">plen = Total Length</text>
<rect x="240.0" y="90.0" width="360.0" height="200.0" rx="4" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/>
<text x="420.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">NVMe Command Capsule (64 Б)</text>
<line x1="240.0" y1="130.0" x2="600.0" y2="130.0" stroke="#333333" stroke-width="1.0"/>
<text x="420.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">opcode (Read/Write/Flush)</text>
<text x="420.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">command_id (16-bit SQE ID)</text>
<text x="420.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">nsid (Namespace ID)</text>
<text x="420.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a5fb4" text-anchor="middle" font-weight="700">SGL Descriptor (Data Pointer)</text>
<text x="420.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">cdw10..15 (LBA start, count, flags)</text>
<rect x="620.0" y="90.0" width="200.0" height="200.0" rx="4" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/>
<text x="720.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">In-Capsule Data</text>
<text x="720.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#666666" text-anchor="middle">(до 4-8 КБ, опція)</text>
<line x1="620.0" y1="150.0" x2="820.0" y2="150.0" stroke="#333333" stroke-width="1.0"/>
<text x="720.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Дані Запису (Write)</text>
<text x="720.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Передаються разом</text>
<text x="720.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">із командою в одному</text>
<text x="720.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">мережевому пакунку</text>
<rect x="830.0" y="90.0" width="90.0" height="200.0" rx="4" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/>
<text x="875.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">CRC32C</text>
<text x="875.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Header &amp;</text>
<text x="875.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Data</text>
<text x="875.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Digest</text>
<text x="875.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#555555" text-anchor="middle">(4 Б + 4 Б)</text>
</svg>