<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий байт: перенести копію чи дати ім'я</text>
<rect x="30.0" y="46.0" width="500.0" height="524.0" rx="12" fill="#ffffff" stroke="#dfe3e8" stroke-width="1.2"/>
<rect x="50.0" y="60.0" width="460.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="280.0" y="84.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">read(): байт переносять до вас</tspan></text>
<rect x="50.0" y="124.0" width="460.0" height="72.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.6"/><text x="280.0" y="156.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">буфер програми</tspan><tspan x="280.0" dy="15.6">(сторінка у власній пам'яті процесу)</tspan></text>
<rect x="50.0" y="242.0" width="460.0" height="72.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.6"/><text x="280.0" y="274.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">сторінка кешу сторінок</tspan><tspan x="280.0" dy="15.6">(вміст файлу в пам'яті ядра)</tspan></text>
<rect x="50.0" y="360.0" width="460.0" height="72.0" rx="6" fill="#eceff2" stroke="#6b7280" stroke-width="1.6"/><text x="280.0" y="400.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">диск</tspan></text>
<line x1="100.0" y1="200.0" x2="100.0" y2="238.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="330.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="330.0" dy="0.0">копіювання з пам'яті в пам'ять,</tspan><tspan x="330.0" dy="12.5">один системний виклик на порцію</tspan></text>
<line x1="100.0" y1="318.0" x2="100.0" y2="356.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="330.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="330.0" dy="0.0">читання з диска — лише якщо</tspan><tspan x="330.0" dy="12.5">сторінки ще немає в кеші</tspan></text>
<rect x="50.0" y="458.0" width="460.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="280.0" y="485.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">у програми немає адреси, якою можна назвати сторінку кешу,</tspan><tspan x="280.0" dy="14.3">тому вміст їй переносять у власний буфер</tspan></text>
<rect x="550.0" y="46.0" width="500.0" height="524.0" rx="12" fill="#ffffff" stroke="#dfe3e8" stroke-width="1.2"/>
<rect x="570.0" y="60.0" width="460.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="800.0" y="84.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">mmap(): байт вам називають</tspan></text>
<rect x="570.0" y="124.0" width="460.0" height="72.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.6"/><text x="800.0" y="164.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">адреса в програмі</tspan></text>
<rect x="570.0" y="242.0" width="460.0" height="72.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.6"/><text x="800.0" y="274.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">сторінка кешу сторінок</tspan><tspan x="800.0" dy="15.6">(та сама фізична сторінка)</tspan></text>
<rect x="570.0" y="360.0" width="460.0" height="72.0" rx="6" fill="#eceff2" stroke="#6b7280" stroke-width="1.6"/><text x="800.0" y="400.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">диск</tspan></text>
<line x1="620.0" y1="200.0" x2="620.0" y2="238.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="850.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="850.0" dy="0.0">запис у таблиці сторінок</tspan><tspan x="850.0" dy="12.5">вказує просто на цю сторінку</tspan></text>
<line x1="620.0" y1="318.0" x2="620.0" y2="356.0" stroke="#27ae60" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="850.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="850.0" dy="0.0">читання з диска — лише при</tspan><tspan x="850.0" dy="12.5">першому доступі до сторінки</tspan></text>
<rect x="570.0" y="458.0" width="460.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="800.0" y="485.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">після першого сторінкового збою доступ — звичайна</tspan><tspan x="800.0" dy="14.3">інструкція процесора, ядро в ньому не бере участі</tspan></text>
<text x="540.0" y="586.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">фізична сторінка з вмістом файлу в обох випадках одна й та сама — різниця лише в тому, чи має до неї ім'я сам процес</text>
</svg>