<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура OpenSSH Privilege Separation</text>
<rect x="40.0" y="40.0" width="1000.0" height="540.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="540.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура розділення привілеїв OpenSSH (Privilege Separation)</text>
<rect x="70.0" y="110.0" width="420.0" height="210.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="280.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Головний монітор (sshd: [priv])</text>
<text x="280.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">UID 0 (root) · Повний доступ до системи</tspan><tspan x="280.0" dy="16.8">Читає /etc/ssh/ssh_host_*_key</tspan><tspan x="280.0" dy="16.8">Керує PAM, виділяє PTY, робить chroot</tspan><tspan x="280.0" dy="16.8">Створює сесійний процес і робить setuid()</tspan></text>
<rect x="590.0" y="110.0" width="420.0" height="210.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="800.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Мережевий процес (sshd: [net])</text>
<text x="800.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">UID sshd (непривілейований) · Без прав</tspan><tspan x="800.0" dy="16.8">chroot у порожній /var/empty</tspan><tspan x="800.0" dy="16.8">Обмежений Seccomp-фільтром BPF</tspan><tspan x="800.0" dy="16.8">Веде TCP-діалог, KEX, парсить пакети клієнта</tspan></text>
<line x1="490.0" y1="190.0" x2="590.0" y2="190.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="590.0" y1="230.0" x2="490.0" y2="230.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="490.1" y="191.3" width="99.8" height="37.3" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="540.0" y="206.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">IPC socketpair</tspan><tspan x="540.0" dy="14.3">(суворий RPC)</tspan></text>
<rect x="670.0" y="360.0" width="260.0" height="70.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="800.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">SSH-клієнт з мережі</text>
<text x="800.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">TCP port 22 / неперевірені дані</text>
<line x1="800.0" y1="360.0" x2="800.0" y2="320.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="70.0" y="370.0" width="420.0" height="170.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="280.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Сесійний процес (sshd: username)</text>
<text x="280.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">UID/GID користувача (після успішної автентифікації)</tspan><tspan x="280.0" dy="16.8">Відкрито PTY або підсистему sftp-server</tspan><tspan x="280.0" dy="16.8">Викликано pam_open_session() і initgroups()</tspan><tspan x="280.0" dy="16.8">Запуск оболонки: execve(/bin/bash)</tspan></text>
<line x1="280.0" y1="320.0" x2="280.0" y2="370.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="340.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">fork() + drop privileges</text>
</svg>