<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1450 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1450" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="720.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хронологічна послідовність завантаження ядра Linux</text>
<rect x="55.0" y="96.0" width="200.0" height="420.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="65.0" y="112.0" width="180.0" height="52.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="155.0" y="143.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">1. Reset Vector</tspan></text>
<rect x="65.0" y="174.0" width="180.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="155.0" y="196.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">0xFFFFFFF0 / RVBAR_EL3</tspan></text>
<rect x="67.0" y="222.0" width="176.0" height="274.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><text x="155.0" y="350.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Подача живлення POWER GOOD.</tspan><tspan x="155.0" dy="11.7">Процесор запускається у режимі</tspan><tspan x="155.0" dy="11.7">ініціалізації. Стрибок на BIOS/UEFI.</tspan></text>
<line x1="257.0" y1="306.0" x2="279.0" y2="306.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="281.0" y="96.0" width="200.0" height="420.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="291.0" y="112.0" width="180.0" height="52.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="381.0" y="143.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="381.0" dy="0.0">2. Прошивка</tspan></text>
<rect x="291.0" y="174.0" width="180.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="381.0" y="196.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="381.0" dy="0.0">BIOS / UEFI Firmware</tspan></text>
<rect x="293.0" y="222.0" width="176.0" height="274.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><text x="381.0" y="350.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="381.0" dy="0.0">Ініціалізація RAM, шин PCI/PCIe.</tspan><tspan x="381.0" dy="11.7">Вибір пристрою завантаження.</tspan><tspan x="381.0" dy="11.7">Передача коду завантажувача.</tspan></text>
<line x1="483.0" y1="306.0" x2="505.0" y2="306.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="507.0" y="96.0" width="200.0" height="420.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="517.0" y="112.0" width="180.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="607.0" y="143.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="607.0" dy="0.0">3. Завантажувач</tspan></text>
<rect x="517.0" y="174.0" width="180.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="607.0" y="196.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="607.0" dy="0.0">GRUB / EFI Stub</tspan></text>
<rect x="519.0" y="222.0" width="176.0" height="274.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><text x="607.0" y="350.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="607.0" dy="0.0">Зчитування vmlinuz та initrd.</tspan><tspan x="607.0" dy="11.7">Заповнення boot_params (Zero Page).</tspan><tspan x="607.0" dy="11.7">Стрибок у startup_32/64.</tspan></text>
<line x1="709.0" y1="306.0" x2="731.0" y2="306.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="733.0" y="96.0" width="200.0" height="420.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="743.0" y="112.0" width="180.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.2"/><text x="833.0" y="143.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="833.0" dy="0.0">4. Розпакувальник</tspan></text>
<rect x="743.0" y="174.0" width="180.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="833.0" y="196.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="833.0" dy="0.0">extract_kernel()</tspan></text>
<rect x="745.0" y="222.0" width="176.0" height="274.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><text x="833.0" y="350.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="833.0" dy="0.0">Визначення адреси (KASLR).</tspan><tspan x="833.0" dy="11.7">Розпакування стиснутого vmlinux.</tspan><tspan x="833.0" dy="11.7">Побудова тимчасового MMU.</tspan></text>
<line x1="935.0" y1="306.0" x2="957.0" y2="306.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="959.0" y="96.0" width="200.0" height="420.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="969.0" y="112.0" width="180.0" height="52.0" rx="6" fill="#eaf6ef" stroke="#6b7280" stroke-width="1.2"/><text x="1059.0" y="143.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1059.0" dy="0.0">5. Голова ядра</tspan></text>
<rect x="969.0" y="174.0" width="180.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="1059.0" y="196.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1059.0" dy="0.0">startup_64 (head_64.S)</tspan></text>
<rect x="971.0" y="222.0" width="176.0" height="274.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><text x="1059.0" y="350.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1059.0" dy="0.0">Налаштування CR3 (early_top_pgt).</tspan><tspan x="1059.0" dy="11.7">Стрибок у High Canonical Space</tspan><tspan x="1059.0" dy="11.7">(0xFFFFFFFF81000000).</tspan></text>
<line x1="1161.0" y1="306.0" x2="1183.0" y2="306.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1185.0" y="96.0" width="200.0" height="420.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="1195.0" y="112.0" width="180.0" height="52.0" rx="6" fill="#eaf6ef" stroke="#6b7280" stroke-width="1.2"/><text x="1285.0" y="143.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1285.0" dy="0.0">6. C-Вхід ядра</tspan></text>
<rect x="1195.0" y="174.0" width="180.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="1285.0" y="196.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1285.0" dy="0.0">start_kernel()</tspan></text>
<rect x="1197.0" y="222.0" width="176.0" height="274.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/><text x="1285.0" y="350.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1285.0" dy="0.0">Ініціалізація підсистем пам'яті,</tspan><tspan x="1285.0" dy="11.7">IDT, переривань, таймерів,</tspan><tspan x="1285.0" dy="11.7">initcalls та запуск PID 1.</tspan></text>
<rect x="55.0" y="546.0" width="1330.0" height="130.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="720.0" y="597.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Ключовий розрив середовища: завантажувач передає керування у фізичному (або ранньому 32/64-бітному) режимі,</tspan><tspan x="720.0" dy="18.2">тоді як start_kernel() вимагає повністю налаштованого 64-бітного віртуального простору High Canonical Memory.</tspan><tspan x="720.0" dy="18.2">Увесь ассемблерний код head_64.S існує лише для того, щоб побудувати цей міст без сторонньої допомоги.</tspan></text>
</svg>