<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1410 770" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1410" height="770" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="700.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подвійне відображення пам'яті під час переходу в High Canonical Space</text>
<rect x="60.0" y="86.0" width="580.0" height="480.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="80.0" y="102.0" width="540.0" height="44.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="350.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Фізичний простір RAM (Physical Memory)</tspan></text>
<rect x="90.0" y="166.0" width="520.0" height="60.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="350.0" y="192.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">0x0000000000000000 .. 0x00000000000FFFFF</tspan><tspan x="350.0" dy="16.9">Низька пам'ять (Real Mode Vector, BIOS Data Area)</tspan></text>
<rect x="90.0" y="246.0" width="520.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="350.0" y="276.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">0x0000000001000000</tspan><tspan x="350.0" dy="18.2">Розпакований образ vmlinux (Фізична адреса завантаження)</tspan></text>
<rect x="90.0" y="336.0" width="520.0" height="190.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="350.0" y="401.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">ранні таблиці сторінок (early_top_pgt):</tspan><tspan x="350.0" dy="16.9">• PML4[0] -&gt; Identity Mapping (0x01000000 -&gt; 0x01000000)</tspan><tspan x="350.0" dy="16.9">  Захист від Page Fault при зміні CR3</tspan><tspan x="350.0" dy="16.9">• PML4[511] -&gt; High Canonical Mapping</tspan><tspan x="350.0" dy="16.9">  (0xFFFFFFFF81000000 -&gt; 0x01000000)</tspan></text>
<rect x="760.0" y="86.0" width="580.0" height="480.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<rect x="780.0" y="102.0" width="540.0" height="44.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.2"/><text x="1050.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1050.0" dy="0.0">Віртуальний простір (64-bit Virtual Space)</tspan></text>
<rect x="790.0" y="166.0" width="520.0" height="90.0" rx="6" fill="#fdecea" stroke="#6b7280" stroke-width="1.0"/><text x="1050.0" y="198.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">Нижня віртуальна адреса (Identity Map / user space):</tspan><tspan x="1050.0" dy="16.9">0x0000000001000000</tspan><tspan x="1050.0" dy="16.9">(Тимчасово діє до розриву в secondary_startup_64)</tspan></text>
<rect x="790.0" y="286.0" width="520.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.4"/><text x="1050.0" y="327.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1050.0" dy="0.0">Верхній канонічний простір ядра (Kernel High Mapping):</tspan><tspan x="1050.0" dy="18.2">0xFFFFFFFF81000000</tspan><tspan x="1050.0" dy="18.2">Секції ядра: .text, .rodata, .data, .bss, .init.text</tspan></text>
<rect x="790.0" y="416.0" width="520.0" height="110.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="1050.0" y="467.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">Пряме відображення всієї фізичної пам'яті (page_offset_base):</tspan><tspan x="1050.0" dy="16.9">0xFFFF888000000000 .. direct mapping zone</tspan></text>
<line x1="650.0" y1="281.0" x2="750.0" y2="341.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="700.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">movabs + jmp</text>
<rect x="60.0" y="586.0" width="1280.0" height="130.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/><text x="700.0" y="628.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Перехід у старший канонічний простір відбувається за два кроки:</tspan><tspan x="700.0" dy="18.2">1. Завантаження CR3 новою таблицею early_top_pgt (поточна інструкція продовжує виконуватися через Identity Map).</tspan><tspan x="700.0" dy="18.2">2. Абсолютний непрямий стрибок (movabs $secondary_startup_64, %rax; jmp *%rax) переносить виконання на віртуальну адресу 0xFFFFFFFF81000000.</tspan><tspan x="700.0" dy="18.2">Після цього низькі таблиці Identity Map очищаються і стають недоступними.</tspan></text>
</svg>