<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Види UID/GID та переходи привілеїв у процесі</text>
<text x="500.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ідентифікатори процесу (UID / GID)</text>
<rect x="30.0" y="60.0" width="215.0" height="130.0" rx="6" fill="#eef3fd" stroke="#c0392b" stroke-width="1.5"/><text x="137.5" y="90.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="137.5" dy="0.0">Real UID (ruid)</tspan><tspan x="137.5" dy="15.6">Справжній власник</tspan><tspan x="137.5" dy="15.6"></tspan><tspan x="137.5" dy="15.6">Хто запустив процес;</tspan><tspan x="137.5" dy="15.6">визначає ліміти</tspan><tspan x="137.5" dy="15.6">і право на kill()</tspan></text>
<rect x="265.0" y="60.0" width="215.0" height="130.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="372.5" y="90.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="372.5" dy="0.0">Effective UID (euid)</tspan><tspan x="372.5" dy="15.6">Поточні привілеї</tspan><tspan x="372.5" dy="15.6"></tspan><tspan x="372.5" dy="15.6">Ядро дивиться сюди</tspan><tspan x="372.5" dy="15.6">при DAC перевірках</tspan><tspan x="372.5" dy="15.6">(файли, сокети)</tspan></text>
<rect x="500.0" y="60.0" width="215.0" height="130.0" rx="6" fill="#fff8e7" stroke="#d97706" stroke-width="1.5"/><text x="607.5" y="90.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="607.5" dy="0.0">Saved Set-UID (suid)</tspan><tspan x="607.5" dy="15.6">Збережений привілей</tspan><tspan x="607.5" dy="15.6"></tspan><tspan x="607.5" dy="15.6">Фіксує привілей при</tspan><tspan x="607.5" dy="15.6">execve SUID-файлу;</tspan><tspan x="607.5" dy="15.6">дозволяє повернення</tspan></text>
<rect x="735.0" y="60.0" width="215.0" height="130.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="842.5" y="90.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="842.5" dy="0.0">Filesystem UID (fsuid)</tspan><tspan x="842.5" dy="15.6">Файлові перевірки</tspan><tspan x="842.5" dy="15.6"></tspan><tspan x="842.5" dy="15.6">Використовується в</tspan><tspan x="842.5" dy="15.6">NFS/FS перевірках;</tspan><tspan x="842.5" dy="15.6">авто-слідує за euid</tspan></text>
<text x="500.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Переходи привілеїв у SUID-програмі (наприклад, passwd)</text>
<rect x="30.0" y="260.0" width="215.0" height="140.0" rx="6" fill="#fff8e7" stroke="#d97706" stroke-width="1.5"/><text x="137.5" y="305.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="137.5" dy="0.0">1. Запуск SUID-файлу</tspan><tspan x="137.5" dy="14.3"></tspan><tspan x="137.5" dy="14.3">ruid = 1000</tspan><tspan x="137.5" dy="14.3">euid = 0 (root)</tspan><tspan x="137.5" dy="14.3">suid = 0 (root)</tspan></text>
<line x1="247.0" y1="330.0" x2="263.0" y2="330.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="265.0" y="260.0" width="215.0" height="140.0" rx="6" fill="#eef3fd" stroke="#c0392b" stroke-width="1.5"/><text x="372.5" y="305.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="372.5" dy="0.0">2. Тимчасове скидання</tspan><tspan x="372.5" dy="14.3"></tspan><tspan x="372.5" dy="14.3">seteuid(1000)</tspan><tspan x="372.5" dy="14.3">ruid = 1000, euid = 1000</tspan><tspan x="372.5" dy="14.3">suid = 0 (збережено!)</tspan></text>
<line x1="482.0" y1="330.0" x2="498.0" y2="330.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="260.0" width="215.0" height="140.0" rx="6" fill="#fdecea" stroke="#2457d6" stroke-width="1.5"/><text x="607.5" y="305.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="607.5" dy="0.0">3. Відновлення привілеїв</tspan><tspan x="607.5" dy="14.3"></tspan><tspan x="607.5" dy="14.3">seteuid(0)</tspan><tspan x="607.5" dy="14.3">ruid = 1000, euid = 0</tspan><tspan x="607.5" dy="14.3">suid = 0</tspan></text>
<line x1="717.0" y1="330.0" x2="733.0" y2="330.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="735.0" y="260.0" width="215.0" height="140.0" rx="6" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><text x="842.5" y="305.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="842.5" dy="0.0">4. Остаточне скидання</tspan><tspan x="842.5" dy="14.3"></tspan><tspan x="842.5" dy="14.3">setresuid(1000, 1000, 1000)</tspan><tspan x="842.5" dy="14.3">ruid = 1000, euid = 1000</tspan><tspan x="842.5" dy="14.3">suid = 1000 (без повернення)</tspan></text>
<rect x="35.0" y="430.0" width="930.0" height="80.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="466.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Ключове правило: непривілейований процес може змінювати euid лише між ruid та suid.</tspan><tspan x="500.0" dy="15.6">Остаточне скидання setresuid(ruid, ruid, ruid) перезаписує suid, роблячи повернення привілеїв неможливим.</tspan></text>
</svg>