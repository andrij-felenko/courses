<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 716" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="716" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кожне покоління інтерфейсу має власний код «мене тут немає»</text>
<rect x="30.0" y="48.0" width="230.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="145.0" y="77.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Що саме питаємо</tspan></text>
<rect x="270.0" y="48.0" width="340.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="440.0" y="77.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Чим пробувати, не лишаючи слідів</tspan></text>
<rect x="620.0" y="48.0" width="200.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="720.0" y="77.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">«Немає» звучить як</tspan></text>
<rect x="830.0" y="48.0" width="320.0" height="48.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="990.0" y="77.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="990.0" dy="0.0">Легко сплутати з</tspan></text>
<rect x="30.0" y="112.0" width="230.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="145.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">чи є цей виклик</tspan><tspan x="145.0" dy="18.2">у ядрі взагалі</tspan></text>
<rect x="270.0" y="112.0" width="340.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="440.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">syscall(__NR_openat2, -1, &quot;&quot;, NULL, 0)</tspan><tspan x="440.0" dy="16.9">усі аргументи навмисно негодящі</tspan></text>
<rect x="620.0" y="112.0" width="200.0" height="76.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="154.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">ENOSYS</tspan></text>
<rect x="830.0" y="112.0" width="320.0" height="76.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="990.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">ENOSYS від seccomp-фільтра</tspan><tspan x="990.0" dy="16.9">у контейнері</tspan></text>
<rect x="30.0" y="200.0" width="230.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="233.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">чи знає ядро</tspan><tspan x="145.0" dy="18.2">цей біт прапорців</tspan></text>
<rect x="270.0" y="200.0" width="340.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="440.0" y="234.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">memfd_create(NULL,</tspan><tspan x="440.0" dy="16.9">MFD_CLOEXEC | MFD_HUGETLB)</tspan></text>
<rect x="620.0" y="200.0" width="200.0" height="76.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="242.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">EINVAL</tspan></text>
<rect x="830.0" y="200.0" width="320.0" height="76.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="990.0" y="234.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">EINVAL через будь-який</tspan><tspan x="990.0" dy="16.9">інший негодящий аргумент</tspan></text>
<rect x="30.0" y="288.0" width="230.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="321.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">чи знає ядро</tspan><tspan x="145.0" dy="18.2">це поле структури</tspan></text>
<rect x="270.0" y="288.0" width="340.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="440.0" y="322.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">передати свій sizeof і нулі</tspan><tspan x="440.0" dy="16.9">в усьому, крім потрібного поля</tspan></text>
<rect x="620.0" y="288.0" width="200.0" height="76.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="330.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">E2BIG</tspan></text>
<rect x="830.0" y="288.0" width="320.0" height="76.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="990.0" y="322.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">EFAULT на поганому</tspan><tspan x="990.0" dy="16.9">вказівнику структури</tspan></text>
<rect x="30.0" y="376.0" width="230.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="418.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">чи є ця підсистема</tspan></text>
<rect x="270.0" y="376.0" width="340.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="440.0" y="410.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">statfs(&quot;/sys/fs/cgroup&quot;)</tspan><tspan x="440.0" dy="16.9">або open() потрібного файлу</tspan></text>
<rect x="620.0" y="376.0" width="200.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="720.0" y="409.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">ENOENT,</tspan><tspan x="720.0" dy="18.2">інший f_type</tspan></text>
<rect x="830.0" y="376.0" width="320.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="990.0" y="410.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">/proc чи /sys узагалі</tspan><tspan x="990.0" dy="16.9">не змонтовано</tspan></text>
<rect x="30.0" y="464.0" width="230.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="497.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">чи вміє це саме</tspan><tspan x="145.0" dy="18.2">ця файлова система</tspan></text>
<rect x="270.0" y="464.0" width="340.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="440.0" y="498.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">тільки справжня дія</tspan><tspan x="440.0" dy="16.9">на справжніх дескрипторах</tspan></text>
<rect x="620.0" y="464.0" width="200.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="497.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">EOPNOTSUPP,</tspan><tspan x="720.0" dy="18.2">EXDEV</tspan></text>
<rect x="830.0" y="464.0" width="320.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="990.0" y="498.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">відповідь не глобальна:</tspan><tspan x="990.0" dy="16.9">кешувати її не можна</tspan></text>
<rect x="30.0" y="552.0" width="230.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="594.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">чи дозволено це мені</tspan></text>
<rect x="270.0" y="552.0" width="340.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="440.0" y="586.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">це питання не про можливість,</tspan><tspan x="440.0" dy="16.9">а про права</tspan></text>
<rect x="620.0" y="552.0" width="200.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="720.0" y="585.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">EPERM,</tspan><tspan x="720.0" dy="18.2">EACCES</tspan></text>
<rect x="830.0" y="552.0" width="320.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="990.0" y="586.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">«ядро старе» — насправді</tspan><tspan x="990.0" dy="16.9">«вам сюди не можна»</tspan></text>
<rect x="30.0" y="654.0" width="1120.0" height="38.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="590.0" y="677.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">висновок «є» всюди звучить однаково: прилетіло будь-що, крім свого коду «немає»</tspan></text>
</svg>