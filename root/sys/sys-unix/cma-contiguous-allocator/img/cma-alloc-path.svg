<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виділення з CMA: п'ять кроків і єдине місце зриву</text>
<rect x="130.0" y="70.0" width="340.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Знайти вільну смугу</tspan><tspan x="300.0" dy="16.9">у бітовій мапі області</tspan></text><rect x="130.0" y="150.1" width="340.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="171.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Ізолювати блоки</tspan><tspan x="300.0" dy="16.9">нові мешканці більше не в'їжджають</tspan></text><rect x="130.0" y="230.1" width="340.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="251.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Спорожнити кеші процесорів</tspan><tspan x="300.0" dy="16.9">вільні кадри стають видимими</tspan></text><rect x="130.0" y="315.1" width="340.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Виселити мешканців</tspan><tspan x="300.0" dy="16.9">перенос + скидання кешу адрес</tspan></text><rect x="130.0" y="400.1" width="340.0" height="49.9" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="421.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Забрати смугу цілком</tspan><tspan x="300.0" dy="16.9">віддати драйверові</tspan></text><line x1="300.0" y1="119.0" x2="300.0" y2="151.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="300.0" y1="199.0" x2="300.0" y2="231.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="300.0" y1="279.0" x2="300.0" y2="316.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="300.0" y1="364.0" x2="300.0" y2="401.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="612.2" y="315.1" width="175.6" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="700.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Сторінку закріплено —</tspan><tspan x="700.0" dy="16.9">перенести не можна</tspan></text><line x1="472.0" y1="340.0" x2="608.2" y2="340.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="700.0" y1="311.1" x2="700.0" y2="52.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="700.0" y1="52.0" x2="300.0" y2="52.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="300.0" y1="52.0" x2="300.0" y2="70.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="500.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">відкат ізоляції, наступна смуга</text>
