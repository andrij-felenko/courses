<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що тримає inode, на який не веде жодне ім'я</text>
<text x="300.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">тримає, поки процес живий</text>
<text x="790.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">тримає, поки система не прибрала</text>
<rect x="72.9" y="212.1" width="174.2" height="55.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="236.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">відкритий дескриптор</tspan><tspan x="160.0" dy="16.9">лише в пам'яті ядра</tspan></text>
<rect x="479.1" y="194.2" width="131.7" height="91.7" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="545.0" y="219.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">inode на носії</tspan><tspan x="545.0" dy="16.9">імен: 0</tspan><tspan x="545.0" dy="16.9">блоки виділено</tspan><tspan x="545.0" dy="16.9">дані на місці</tspan></text>
<rect x="842.9" y="212.1" width="174.2" height="55.9" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="930.0" y="236.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">запис у списку сиріт</tspan><tspan x="930.0" dy="16.9">на самому носії</tspan></text>
<line x1="255.1" y1="240.0" x2="471.1" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="834.9" y1="240.0" x2="618.9" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="173.1" y="417.1" width="203.8" height="55.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="441.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">процес закрив дескриптор</tspan><tspan x="275.0" dy="16.9">блоки звільнено одразу</tspan></text>
<rect x="705.7" y="408.6" width="218.7" height="72.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="815.0" y="432.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">раптове вимкнення живлення</tspan><tspan x="815.0" dy="16.9">монтування обходить список</tspan><tspan x="815.0" dy="16.9">і звільняє блоки</tspan></text>
