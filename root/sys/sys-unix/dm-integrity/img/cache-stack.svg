<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1630 1020" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1630" height="1020" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="810.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кеші між читанням файла і байтом у файлі-образі</text>
<text x="80.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">між командою «прочитати файл» і байтом у файлі-образі стоїть чотири схованки</text>
<text x="470.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">шар, який може віддати старі байти</text>
<text x="1240.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">чим його спорожнити</text>
<rect x="190.0" y="169.5" width="560.0" height="61.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.6"/><text x="470.0" y="195.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">сторінковий кеш файла</tspan><tspan x="470.0" dy="17.6">/mnt/int/probe.txt</tspan></text>
<rect x="980.0" y="171.1" width="520.0" height="57.9" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.3"/><text x="1240.0" y="196.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1240.0" dy="0.0">umount — або sync,</tspan><tspan x="1240.0" dy="16.9">а тоді drop_caches</tspan></text>
<rect x="190.0" y="324.5" width="560.0" height="61.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.6"/><text x="470.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">кеш блокового пристрою</tspan><tspan x="470.0" dy="17.6">/dev/mapper/int0</tspan></text>
<line x1="470.0" y1="236.5" x2="470.0" y2="318.5" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="980.0" y="326.1" width="520.0" height="57.9" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.3"/><text x="1240.0" y="351.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1240.0" dy="0.0">blockdev --flushbufs</tspan><tspan x="1240.0" dy="16.9">на самому /dev/mapper/int0</tspan></text>
<rect x="190.0" y="479.5" width="560.0" height="61.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.6"/><text x="470.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">журнал dm-integrity:</tspan><tspan x="470.0" dy="17.6">дані й теги ще не на місцях</tspan></text>
<line x1="470.0" y1="391.5" x2="470.0" y2="473.5" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="980.0" y="481.1" width="520.0" height="57.9" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.3"/><text x="1240.0" y="506.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1240.0" dy="0.0">integritysetup close —</tspan><tspan x="1240.0" dy="16.9">журнал догравається до кінця</tspan></text>
<rect x="190.0" y="634.5" width="560.0" height="61.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.6"/><text x="470.0" y="661.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">сторінковий кеш файла-образу</tspan><tspan x="470.0" dy="17.6">int0.img</tspan></text>
<line x1="470.0" y1="546.5" x2="470.0" y2="628.5" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="980.0" y="636.0" width="520.0" height="57.9" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.3"/><text x="1240.0" y="661.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1240.0" dy="0.0">нічого не треба: loop читає</tspan><tspan x="1240.0" dy="16.9">саме звідси, куди пише наш dd</tspan></text>
<rect x="190.0" y="799.5" width="560.0" height="61.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.6"/><text x="470.0" y="826.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">файл int0.img</tspan><tspan x="470.0" dy="17.6">на справжньому диску</tspan></text>
<line x1="470.0" y1="701.5" x2="470.0" y2="793.5" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="470.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">cat /mnt/int/probe.txt</text>
<rect x="980.0" y="791.6" width="520.0" height="76.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="1240.0" y="817.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1240.0" dy="0.0">losetup --direct-io=on прибирає четвертий шар —</tspan><tspan x="1240.0" dy="16.9">і тоді буферизований dd у файл стає для loop невидимим:</tspan><tspan x="1240.0" dy="16.9">або обидва через кеш, або обидва повз нього</tspan></text>
<text x="80.0" y="950.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start">drop_caches викидає лише чисті сторінки — брудні спершу треба записати, тому sync завжди йде першим</text>
</svg>