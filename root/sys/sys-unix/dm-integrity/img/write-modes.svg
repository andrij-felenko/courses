<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1710 950" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1710" height="950" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="850.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прямий запис, журнал і бітова мапа після обриву живлення</text>
<text x="70.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">запис одного сектора змінює два місця на носії — і кожен режим по-своєму зводить їх докупи</text>
<text x="1470.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">що лишається після обриву живлення</text>
<rect x="65.0" y="184.9" width="200.0" height="60.2" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.6"/><text x="165.0" y="210.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">прямий запис</tspan><tspan x="165.0" dy="18.2">(режим D)</tspan></text>
<rect x="400.0" y="195.5" width="260.0" height="39.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.4"/><text x="530.0" y="219.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">дані — на своє місце</tspan></text>
<rect x="700.0" y="195.5" width="260.0" height="39.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.4"/><text x="830.0" y="219.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">тег — на своє місце</tspan></text>
<line x1="668.0" y1="215.0" x2="692.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1305.0" y="177.6" width="330.0" height="74.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="1470.0" y="202.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1470.0" dy="0.0">сектор цілий, тег описує</tspan><tspan x="1470.0" dy="16.9">інший вміст — і не збіжиться</tspan><tspan x="1470.0" dy="16.9">вже назавжди</tspan></text>
<text x="380.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">аварія між двома записами лишає добрий сектор із чужим тегом</text>
<rect x="65.0" y="474.9" width="200.0" height="60.2" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.6"/><text x="165.0" y="500.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">журнал</tspan><tspan x="165.0" dy="18.2">(режим J)</tspan></text>
<rect x="400.0" y="485.5" width="260.0" height="39.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.4"/><text x="530.0" y="509.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">дані й тег — у журнал</tspan></text>
<rect x="700.0" y="485.5" width="260.0" height="39.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.4"/><text x="830.0" y="509.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">коміт секції</tspan></text>
<line x1="668.0" y1="505.0" x2="692.0" y2="505.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1000.0" y="485.5" width="260.0" height="39.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.4"/><text x="1130.0" y="509.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1130.0" dy="0.0">копіювання на місця</tspan></text>
<line x1="968.0" y1="505.0" x2="992.0" y2="505.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1305.0" y="467.6" width="330.0" height="74.8" rx="6" fill="#eaf6ef" stroke="#2457d6" stroke-width="1.8"/><text x="1470.0" y="492.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1470.0" dy="0.0">до коміту — старе й узгоджене,</tspan><tspan x="1470.0" dy="16.9">після коміту журнал програють</tspan><tspan x="1470.0" dy="16.9">наново; кожен байт іде двічі</tspan></text>
<text x="380.0" y="623.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">неподільність купують подвійним записом: спершу в журнал, потім на місце</text>
<rect x="65.0" y="759.9" width="200.0" height="60.2" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.6"/><text x="165.0" y="785.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">бітова мапа</tspan><tspan x="165.0" dy="18.2">(режим B)</tspan></text>
<rect x="400.0" y="770.5" width="260.0" height="39.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.4"/><text x="530.0" y="794.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">позначити ділянку в мапі</tspan></text>
<rect x="700.0" y="770.5" width="260.0" height="39.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.4"/><text x="830.0" y="794.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">дані й тег — прямо на місця</tspan></text>
<line x1="668.0" y1="790.0" x2="692.0" y2="790.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1305.0" y="752.6" width="330.0" height="74.8" rx="6" fill="#fff6e5" stroke="#c0392b" stroke-width="1.8"/><text x="1470.0" y="777.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1470.0" dy="0.0">позначені ділянки перерахують:</tspan><tspan x="1470.0" dy="16.9">який вміст там є, такий і</tspan><tspan x="1470.0" dy="16.9">засвідчать новим тегом</tspan></text>
<text x="380.0" y="908.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">запис один раз, зате псування саме в мить аварії буде освячене, а не викрите</text>
</svg>