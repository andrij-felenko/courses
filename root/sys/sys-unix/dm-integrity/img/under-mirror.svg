<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1470 890" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1470" height="890" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="730.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дзеркало без шару цілісності та з ним</text>
<line x1="730.0" y1="90.0" x2="730.0" y2="800.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="7 6"/>
<text x="380.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">дзеркало саме по собі</text>
<text x="1090.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">шар цілісності під кожною ногою</text>
<rect x="165.0" y="170.5" width="430.0" height="39.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="194.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">md raid1: читаю сектор 9000</tspan></text>
<rect x="100.0" y="313.1" width="230.0" height="53.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.4"/><text x="215.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">диск A</tspan><tspan x="215.0" dy="16.9">правильні байти</tspan></text>
<rect x="430.0" y="313.1" width="230.0" height="53.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="545.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">диск B</tspan><tspan x="545.0" dy="16.9">тихо зіпсований</tspan></text>
<line x1="320.0" y1="209.5" x2="215.0" y2="313.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="440.0" y1="209.5" x2="545.0" y2="313.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="165.0" y="492.1" width="430.0" height="55.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.4"/><text x="380.0" y="516.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">обидві ноги кажуть «прочитано успішно»,</tspan><tspan x="380.0" dy="16.9">а байти різні</tspan></text>
<rect x="165.0" y="642.6" width="430.0" height="74.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="380.0" y="667.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">вибрати правильну нема за чим:</tspan><tspan x="380.0" dy="16.9">перевірка масиву лише порахує</tspan><tspan x="380.0" dy="16.9">розбіжності, не вкаже винного</tspan></text>
<rect x="875.0" y="170.5" width="430.0" height="39.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="1090.0" y="194.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1090.0" dy="0.0">md raid1: читаю сектор 9000</tspan></text>
<rect x="810.0" y="313.1" width="230.0" height="53.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.4"/><text x="925.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="925.0" dy="0.0">integrity над A</tspan><tspan x="925.0" dy="16.9">тег збігся</tspan></text>
<rect x="1140.0" y="313.1" width="230.0" height="53.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="1255.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1255.0" dy="0.0">integrity над B</tspan><tspan x="1255.0" dy="16.9">тег не збігся</tspan></text>
<line x1="1030.0" y1="209.5" x2="925.0" y2="313.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1150.0" y1="209.5" x2="1255.0" y2="313.1" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="875.0" y="492.1" width="430.0" height="55.9" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.4"/><text x="1090.0" y="516.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1090.0" dy="0.0">нога B віддає не байти, а помилку EILSEQ —</tspan><tspan x="1090.0" dy="16.9">тихе псування стало явною відмовою</tspan></text>
<rect x="875.0" y="642.6" width="430.0" height="74.8" rx="6" fill="#eaf6ef" stroke="#2457d6" stroke-width="1.8"/><text x="1090.0" y="667.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1090.0" dy="0.0">з відмовою на читанні RAID працює здавна:</tspan><tspan x="1090.0" dy="16.9">віддає копію з A нагору</tspan><tspan x="1090.0" dy="16.9">й перезаписує нею зіпсоване місце на B</tspan></text>
<text x="730.0" y="830.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">порядок складання важить: шар цілісності стоїть під масивом, а не над ним</text>
</svg>