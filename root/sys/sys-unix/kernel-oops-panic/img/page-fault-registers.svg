<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключові регістри процесора під час аварії ядра (x86_64)</text>
<rect x="40.0" y="55.0" width="370.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="225.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">CR2 (Control Register 2)</text>
<text x="225.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">0x0000000000000008</text>
<text x="225.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Адреса лінійної пам'яті, що спричинила Page Fault</tspan><tspan x="225.0" dy="14.3">Близькість до 0 -&gt; NULL dereference зі зміщенням</tspan></text>
<rect x="450.0" y="55.0" width="370.0" height="130.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/>
<text x="635.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">RIP (Instruction Pointer)</text>
<text x="635.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">ffffffffc03b1022</text>
<text x="635.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Символ: bad_driver_func+0x22/0x50 [bad_module]</tspan><tspan x="635.0" dy="14.3">Конкретна інструкція MOV/CMP, де впало ядро</tspan></text>
<text x="430.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розшифровка апаратного коду помилки (Page Fault Error Code)</text>
<rect x="40.0" y="235.0" width="145.0" height="140.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="112.5" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Bit 0: P</text>
<line x1="50.0" y1="275.0" x2="175.0" y2="275.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="112.5" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="112.5" dy="0.0">0 = Page not present</tspan><tspan x="112.5" dy="13.7">1 = Protection violation</tspan></text>
<rect x="195.0" y="235.0" width="145.0" height="140.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="267.5" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Bit 1: W/R</text>
<line x1="205.0" y1="275.0" x2="330.0" y2="275.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="267.5" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="267.5" dy="0.0">0 = Read operation</tspan><tspan x="267.5" dy="13.7">1 = Write operation</tspan></text>
<rect x="350.0" y="235.0" width="145.0" height="140.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="422.5" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Bit 2: U/S</text>
<line x1="360.0" y1="275.0" x2="485.0" y2="275.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="422.5" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="422.5" dy="0.0">0 = Supervisor (Ring 0)</tspan><tspan x="422.5" dy="13.7">1 = User (Ring 3)</tspan></text>
<rect x="505.0" y="235.0" width="145.0" height="140.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="577.5" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Bit 3: RSVD</text>
<line x1="515.0" y1="275.0" x2="640.0" y2="275.0" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="577.5" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="577.5" dy="0.0">0 = Normal PTE</tspan><tspan x="577.5" dy="13.7">1 = Reserved bit set</tspan></text>
<rect x="660.0" y="235.0" width="145.0" height="140.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/>
<text x="732.5" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle" font-weight="700">Bit 4: I/D</text>
<line x1="670.0" y1="275.0" x2="795.0" y2="275.0" stroke="#333333" stroke-width="1.0"/>
<text x="732.5" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="732.5" dy="0.0">0 = Data fetch</tspan><tspan x="732.5" dy="13.7">1 = Instruction fetch</tspan></text>
<rect x="40.0" y="395.0" width="780.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="430.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Приклад логу Oops: error_code(0x0002) -&gt; [P=0 (Not Present), W/R=1 (Write), U/S=0 (Kernel)]</text>
<text x="430.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Тлумачення: Спроба ЗАПИСУ в незадокументовану сторінку пам'яті у режимі ядра</text>
</svg>