<rect x="610.0" y="315.0" width="260.0" height="65.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перевірка умов Panic</text><text x="740.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="740.0" dy="0.0">panic_on_oops=1 чи context_in_interrupt()</tspan><tspan x="740.0" dy="14.3">чи утримання spinlock/in_atomic()</tspan></text>
<line x1="610.0" y1="347.0" x2="450.0" y2="347.0" stroke="#333333" stroke-width="1.5"/>
<line x1="450.0" y1="347.0" x2="450.0" y2="410.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="520.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Ні (Ніжний Oops)</text>
<rect x="350.0" y="415.0" width="200.0" height="65.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">make_task_dead()</text><text x="450.0" y="453.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="450.0" dy="0.0">Вбито лише один потік;</tspan><tspan x="450.0" dy="14.3">Ядро помічено Tainted (D)</tspan></text>
<line x1="740.0" y1="380.0" x2="740.0" y2="410.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="765.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Так (Фатально)</text>
<rect x="630.0" y="415.0" width="220.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">panic() -&gt; crash_kexec()</text><text x="740.0" y="453.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="740.0" dy="0.0">Вимкнення IRQ, smp_send_stop()</tspan><tspan x="740.0" dy="14.3">Запуск Kdump чи HLT/Reboot</tspan></text>
<line x1="740.0" y1="480.0" x2="740.0" y2="508.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="620.0" y="508.0" width="240.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Збереження /proc/vmcore</text><text x="740.0" y="546.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="740.0" dy="0.0">Аналіз у виправленому Crash Kernel</tspan></text>
