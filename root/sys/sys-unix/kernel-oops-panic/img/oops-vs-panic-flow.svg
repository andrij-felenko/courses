<text x="660.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Kernel Mode (Ring 0)</text>
<rect x="630.0" y="215.0" width="220.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="740.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Виклик die() -&gt; Kernel Oops</text><text x="740.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="740.0" dy="0.0">oops_enter(), лог dmesg,</tspan><tspan x="740.0" dy="14.3">вивід CR2/RIP/Call Trace</tspan></text>
