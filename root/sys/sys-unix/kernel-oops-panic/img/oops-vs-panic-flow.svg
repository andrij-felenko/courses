<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях обробки апаратного винятку ядра Linux</text>
<rect x="330.0" y="50.0" width="240.0" height="50.0" rx="6" fill="#fff6e5" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Апаратне переривання</text><text x="450.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="450.0" dy="0.0">Page Fault / Exception (x86 IDT)</tspan></text>
<line x1="450.0" y1="100.0" x2="450.0" y2="130.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
