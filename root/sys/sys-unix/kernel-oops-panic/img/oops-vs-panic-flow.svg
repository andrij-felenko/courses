<text x="220.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">User Mode (Ring 3)</text>
<rect x="60.0" y="215.0" width="200.0" height="60.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Надсилання SIGSEGV</text><text x="160.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="160.0" dy="0.0">Процес користувача падає</tspan><tspan x="160.0" dy="14.3">Core dump (за наявності)</tspan></text>
<line x1="160.0" y1="275.0" x2="160.0" y2="310.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="315.0" width="200.0" height="50.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Система продовжує роботу</text><text x="160.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="160.0" dy="0.0">Інші процеси не постраждали</tspan></text>
<line x1="580.0" y1="162.0" x2="740.0" y2="162.0" stroke="#333333" stroke-width="1.5"/>
