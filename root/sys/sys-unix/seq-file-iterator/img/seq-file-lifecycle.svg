<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл seq_read: ітерація, виявлення переповнення та подвоєння буфера</text>
<rect x="380.0" y="30.0" width="440.0" height="60.0" rx="6" fill="#eef4fb" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="56.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Системний виклик: read(fd, user_buf, count)</tspan><tspan x="600.0" dy="16.9">VFS викликає seq_read_iter() / seq_read()</tspan></text>
<line x1="600.0" y1="90.0" x2="600.0" y2="115.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="410.0" y="115.0" width="380.0" height="45.0" rx="6" fill="#f3f0fa" stroke="#6b7280" stroke-width="1.5"/><text x="600.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">mutex_lock(&amp;m-&gt;lock) — блокування дескриптора файлу</tspan></text>
<line x1="600.0" y1="160.0" x2="600.0" y2="185.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="360.0" y="185.0" width="480.0" height="60.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="211.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">1. op-&gt;start(m, &amp;pos)</tspan><tspan x="600.0" dy="14.3">Захоплює замок підсистеми / RCU, знаходить елемент v за індексом pos</tspan></text>
<line x1="600.0" y1="245.0" x2="600.0" y2="275.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="450.0" y="275.0" width="300.0" height="50.0" rx="6" fill="#fef9e7" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Чи знайдено елемент?</tspan><tspan x="600.0" dy="15.6">(v != NULL та !IS_ERR(v))</tspan></text>
<line x1="750.0" y1="300.0" x2="980.0" y2="300.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="850.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">НІ (EOF)</text>
<line x1="980.0" y1="300.0" x2="980.0" y2="565.0" stroke="#6b7280" stroke-width="1.5"/>
<line x1="980.0" y1="565.0" x2="840.0" y2="565.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="600.0" y1="325.0" x2="600.0" y2="355.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="615.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">ТАК</text>
<rect x="360.0" y="355.0" width="480.0" height="60.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="381.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">2. op-&gt;show(m, v)</tspan><tspan x="600.0" dy="15.6">Форматує об'єкт у m-&gt;buf функціями seq_printf(), seq_puts()</tspan></text>
<line x1="600.0" y1="415.0" x2="600.0" y2="445.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="420.0" y="445.0" width="360.0" height="50.0" rx="6" fill="#fef9e7" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="466.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Перевірка: seq_has_overflowed(m)?</tspan><tspan x="600.0" dy="15.6">(Текст не вмістився у виділений розмір)</tspan></text>
<line x1="420.0" y1="470.0" x2="310.0" y2="470.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="365.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ТАК: переповнення</text>
<rect x="40.0" y="400.0" width="260.0" height="140.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="152.0" y="438.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="152.0" dy="0.0">Реакція на переповнення:</tspan><tspan x="152.0" dy="14.3">1. op-&gt;stop(m, v) — зняти замки</tspan><tspan x="152.0" dy="14.3">2. Скинути вміст буфера (count = 0)</tspan><tspan x="152.0" dy="14.3">3. Подвоїти розмір: size &lt;&lt;= 1</tspan><tspan x="152.0" dy="14.3">4. kvmalloc() новий більший буфер</tspan><tspan x="152.0" dy="14.3">5. Рестарт із op-&gt;start(m, &amp;pos)!</tspan></text>
<line x1="170.0" y1="400.0" x2="170.0" y2="215.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="4 4"/>
<line x1="170.0" y1="215.0" x2="360.0" y2="215.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="600.0" y1="495.0" x2="600.0" y2="525.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="615.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">НІ</text>
<rect x="360.0" y="525.0" width="480.0" height="55.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="549.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">3. op-&gt;next(m, v, &amp;pos)</tspan><tspan x="600.0" dy="14.3">Збільшує логічний індекс (*pos)++, повертає наступний елемент v</tspan></text>
<line x1="360.0" y1="552.0" x2="320.0" y2="552.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="320.0" y1="552.0" x2="320.0" y2="385.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="320.0" y1="385.0" x2="360.0" y2="385.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="300.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end">наступний</text>
<rect x="400.0" y="610.0" width="400.0" height="55.0" rx="6" fill="#f3f0fa" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="634.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">4. op-&gt;stop(m, v)</tspan><tspan x="600.0" dy="13.0">Завершення ітерації: звільнення замків / rcu_read_unlock()</tspan></text>
<line x1="600.0" y1="580.0" x2="600.0" y2="610.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="600.0" y1="665.0" x2="600.0" y2="695.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="350.0" y="695.0" width="500.0" height="60.0" rx="6" fill="#eef4fb" stroke="#333333" stroke-width="1.5"/><text x="600.0" y="721.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Копіювання даних: copy_to_user() з m-&gt;buf у буфер процесу</tspan><tspan x="600.0" dy="15.6">mutex_unlock(&amp;m-&gt;lock) -&gt; повернення кількості прочитаних байтів</tspan></text>
</svg>