<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура та потік даних інтерактивного SSH-сеансу з PTY</text>
<rect x="30.0" y="40.0" width="420.0" height="420.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="240.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Локальний хост (клієнт ssh)</text>
<rect x="45.0" y="80.0" width="390.0" height="80.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="240.0" y="100.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Емулятор термінала користувача</tspan><tspan x="240.0" dy="15.6">Термінал переведено в RAW-режим (cfmakeraw):</tspan><tspan x="240.0" dy="15.6">ICANON=0, ECHO=0, ISIG=0. Ctrl+C та Ctrl+Z</tspan><tspan x="240.0" dy="15.6">не генерують локальних сигналів</tspan></text>
<line x1="240.0" y1="160.0" x2="240.0" y2="185.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="150.0" y="165.0" width="180.0" height="20.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="240.0" y="190.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">сирі байти введення (stdin)</tspan></text>
<rect x="45.0" y="185.0" width="390.0" height="115.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="215.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Процес OpenSSH клієнта (ssh)</tspan><tspan x="240.0" dy="15.6">• Зчитує байти з дескриптора stdin</tspan><tspan x="240.0" dy="15.6">• Перевіряє ескейп-автомат на префікс ~</tspan><tspan x="240.0" dy="15.6">• Пакує в SSH_MSG_CHANNEL_DATA</tspan><tspan x="240.0" dy="15.6">• Ловить SIGWINCH і шле window-change</tspan></text>
<line x1="240.0" y1="300.0" x2="240.0" y2="330.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="45.0" y="330.0" width="390.0" height="95.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="240.0" y="358.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Шар шифрування та транспорту клієнта</tspan><tspan x="240.0" dy="15.6">• Шифрування AEAD (ChaCha20-Poly1305)</tspan><tspan x="240.0" dy="15.6">• Додавання MAC / тегу автентифікації</tspan><tspan x="240.0" dy="15.6">• Відправлення у TCP-сокет</tspan></text>
<rect x="590.0" y="40.0" width="420.0" height="420.0" rx="8" fill="#fdfbf7" stroke="#333333" stroke-width="1.5"/>
<text x="800.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Віддалений хост (сервер sshd)</text>
<rect x="605.0" y="80.0" width="390.0" height="95.0" rx="6" fill="#e8f8f0" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Демон OpenSSH сервера (sshd)</tspan><tspan x="800.0" dy="15.6">• Розшифровує SSH_MSG_CHANNEL_DATA</tspan><tspan x="800.0" dy="15.6">• Записує байти в майстер PTY (/dev/ptmx)</tspan><tspan x="800.0" dy="15.6">• За запитом window-change викликає</tspan><tspan x="800.0" dy="15.6">  ioctl(master_fd, TIOCSWINSZ, &amp;ws)</tspan></text>
<line x1="800.0" y1="175.0" x2="800.0" y2="205.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="700.0" y="180.0" width="200.0" height="20.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="800.0" y="211.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">write() у майстер-дескриптор</tspan></text>
<rect x="605.0" y="205.0" width="390.0" height="105.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="230.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Ядро Linux: Дисципліна ліній PTY (n_tty)</tspan><tspan x="800.0" dy="15.6">• Реалізує віддалений режим обробки termios</tspan><tspan x="800.0" dy="15.6">• Генерує ехо-символи назад у /dev/ptmx</tspan><tspan x="800.0" dy="15.6">• Перетворює 0x03 (Ctrl+C) на сигнал SIGINT</tspan><tspan x="800.0" dy="15.6">• Передає дані підлеглому /dev/pts/N</tspan></text>
<line x1="800.0" y1="310.0" x2="800.0" y2="340.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="720.0" y="315.0" width="160.0" height="20.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="800.0" y="346.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">читання з /dev/pts/N</tspan></text>
<rect x="605.0" y="340.0" width="390.0" height="90.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="800.0" y="365.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Дочірній процес (Shell / vim / htop)</tspan><tspan x="800.0" dy="15.6">• fd 0, 1, 2 підключені до /dev/pts/N</tspan><tspan x="800.0" dy="15.6">• Керівний термінал сесії (TIOCSCTTY)</tspan><tspan x="800.0" dy="15.6">• Отримує SIGWINCH при зміні розміру</tspan></text>
<rect x="465.0" y="210.0" width="110.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="229.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Зашифрований</tspan><tspan x="520.0" dy="14.3">канал SSH</tspan><tspan x="520.0" dy="14.3">(TCP 22)</tspan></text>
<line x1="435.0" y1="375.0" x2="465.0" y2="240.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="575.0" y1="240.0" x2="605.0" y2="125.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="485.0" width="880.0" height="35.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="506.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Зворотний потік: вивід програми з /dev/pts/N -&gt; n_tty -&gt; sshd -&gt; SSH-пакет -&gt; клієнт ssh -&gt; локальний stdout</tspan></text>
</svg>