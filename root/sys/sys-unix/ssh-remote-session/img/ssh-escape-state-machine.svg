<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат ескейп-послідовностей клієнта OpenSSH</text>
<rect x="40.0" y="80.0" width="260.0" height="120.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="170.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стан: NORMAL</text>
<rect x="55.0" y="120.0" width="230.0" height="68.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="170.0" y="142.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Символи одразу шлються</tspan><tspan x="170.0" dy="15.6">в канал SSH_MSG_CHANNEL_DATA.</tspan><tspan x="170.0" dy="15.6">Символ ~ тут не діє</tspan></text>
<rect x="370.0" y="80.0" width="260.0" height="120.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="500.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Стан: START_OF_LINE</text>
<rect x="385.0" y="120.0" width="230.0" height="68.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="143.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Щойно натиснуто Enter (\r або \n).</tspan><tspan x="500.0" dy="14.3">Клієнт очікує перший символ</tspan><tspan x="500.0" dy="14.3">нового рядка</tspan></text>
<rect x="700.0" y="80.0" width="260.0" height="120.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="830.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Стан: ESCAPE_PENDING</text>
<rect x="715.0" y="120.0" width="230.0" height="68.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="830.0" y="142.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Натиснуто ~ на початку рядка.</tspan><tspan x="830.0" dy="15.6">Символ буферизується локально</tspan><tspan x="830.0" dy="15.6">й у мережу не шлеться</tspan></text>
<line x1="300.0" y1="120.0" x2="370.0" y2="120.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="315.0" y="95.0" width="42.0" height="20.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="336.0" y="108.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="336.0" dy="0.0">Enter</tspan></text>
<line x1="630.0" y1="120.0" x2="700.0" y2="120.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="645.0" y="95.0" width="40.0" height="20.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="665.0" y="109.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">~</tspan></text>
<line x1="370.0" y1="160.0" x2="300.0" y2="160.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="305.0" y="165.0" width="60.0" height="18.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="335.0" y="177.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">інший знак</tspan></text>
<line x1="830.0" y1="80.0" x2="830.0" y2="42.0" stroke="#333333" stroke-width="1.5"/>
<line x1="830.0" y1="42.0" x2="170.0" y2="42.0" stroke="#333333" stroke-width="1.5"/>
<line x1="170.0" y1="42.0" x2="170.0" y2="80.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="380.0" y="32.0" width="240.0" height="22.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="39.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">~~ або інший символ -&gt; шле ~ у NORMAL</tspan></text>
<rect x="60.0" y="310.0" width="190.0" height="180.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="155.0" y="365.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">~. (крапка)</tspan><tspan x="155.0" dy="15.6">Миттєвий розрив</tspan><tspan x="155.0" dy="15.6"></tspan><tspan x="155.0" dy="15.6">Закриває TCP-сокет,</tspan><tspan x="155.0" dy="15.6">скидає термінал із raw,</tspan><tspan x="155.0" dy="15.6">повертає локальний shell</tspan></text>
<rect x="290.0" y="310.0" width="190.0" height="180.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="385.0" y="365.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">~^Z (Ctrl+Z)</tspan><tspan x="385.0" dy="15.6">Фонування клієнта</tspan><tspan x="385.0" dy="15.6"></tspan><tspan x="385.0" dy="15.6">Шле SIGTSTP процесу ssh,</tspan><tspan x="385.0" dy="15.6">повертає керування shell.</tspan><tspan x="385.0" dy="15.6">Відновлення: $ fg</tspan></text>
<rect x="520.0" y="310.0" width="190.0" height="180.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="615.0" y="368.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">~# (решітка)</tspan><tspan x="615.0" dy="14.3">Список прокидань</tspan><tspan x="615.0" dy="14.3"></tspan><tspan x="615.0" dy="14.3">Друкує в термінал</tspan><tspan x="615.0" dy="14.3">перелік активних</tspan><tspan x="615.0" dy="14.3">каналів і forwarded портів</tspan></text>
<rect x="750.0" y="310.0" width="190.0" height="180.0" rx="6" fill="#fef7e7" stroke="#d97706" stroke-width="1.5"/><text x="845.0" y="365.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">~C (велика C)</tspan><tspan x="845.0" dy="15.6">Командний рядок ssh&gt;</tspan><tspan x="845.0" dy="15.6"></tspan><tspan x="845.0" dy="15.6">Дозволяє на льоту додати</tspan><tspan x="845.0" dy="15.6">-L, -R або -D прокидання</tspan><tspan x="845.0" dy="15.6">без перезапуску сеансу</tspan></text>
<line x1="750.0" y1="200.0" x2="160.0" y2="310.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="780.0" y1="200.0" x2="380.0" y2="310.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="830.0" y1="200.0" x2="610.0" y2="310.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="880.0" y1="200.0" x2="840.0" y2="310.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>