<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трирівнева архітектура протоколу SSH-2</text>
<rect x="40.0" y="50.0" width="920.0" height="185.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="500.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Connection Layer (RFC 4254) — Мультиплексування логічних каналів</text>
<rect x="60.0" y="95.0" width="205.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="162.5" y="143.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="162.5" dy="0.0">Канал #0: session</tspan><tspan x="162.5" dy="15.6">(інтерактивна оболонка,</tspan><tspan x="162.5" dy="15.6">команда exec, sftp)</tspan></text>
<rect x="290.0" y="95.0" width="205.0" height="120.0" rx="6" fill="#e8f8f0" stroke="#27ae60" stroke-width="1.5"/><text x="392.5" y="143.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="392.5" dy="0.0">Канал #1: direct-tcpip</tspan><tspan x="392.5" dy="15.6">(локальне прокидання</tspan><tspan x="392.5" dy="15.6">-L 8080:db:5432)</tspan></text>
<rect x="520.0" y="95.0" width="205.0" height="120.0" rx="6" fill="#fef7e7" stroke="#d97706" stroke-width="1.5"/><text x="622.5" y="143.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="622.5" dy="0.0">Канал #2: forwarded-tcpip</tspan><tspan x="622.5" dy="15.6">(віддалене прокидання</tspan><tspan x="622.5" dy="15.6">-R 9000:localhost:3000)</tspan></text>
<rect x="750.0" y="95.0" width="190.0" height="120.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="845.0" y="143.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">Канал #3: x11 / agent</tspan><tspan x="845.0" dy="15.6">(графічні програми X11,</tspan><tspan x="845.0" dy="15.6">агент ssh-agent)</tspan></text>
<line x1="350.0" y1="235.0" x2="350.0" y2="270.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="650.0" y1="270.0" x2="650.0" y2="235.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="390.0" y="243.0" width="220.0" height="24.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="258.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">службовий запит ssh-connection</tspan></text>
<rect x="40.0" y="275.0" width="920.0" height="140.0" rx="8" fill="#fdfbf7" stroke="#333333" stroke-width="1.5"/>
<text x="500.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">User Authentication Layer (RFC 4252) — Автентифікація користувача</text>
<rect x="60.0" y="320.0" width="270.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="195.0" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">publickey (Ed25519, RSA)</tspan><tspan x="195.0" dy="15.6">підпис хешу сеансу клієнтом,</tspan><tspan x="195.0" dy="15.6">звірка з ~/.ssh/authorized_keys</tspan></text>
<rect x="360.0" y="320.0" width="270.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="495.0" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">password / keyboard-interactive</tspan><tspan x="495.0" dy="15.6">пароль або багатофакторний</tspan><tspan x="495.0" dy="15.6">виклик-відповідь через PAM</tspan></text>
<rect x="660.0" y="320.0" width="280.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">hostbased / gssapi</tspan><tspan x="800.0" dy="15.6">довіра до хоста або</tspan><tspan x="800.0" dy="15.6">квитки Kerberos / SSO</tspan></text>
<line x1="350.0" y1="415.0" x2="350.0" y2="450.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="650.0" y1="450.0" x2="650.0" y2="415.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="390.0" y="423.0" width="220.0" height="24.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="438.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">службовий запит ssh-userauth</tspan></text>
<rect x="40.0" y="455.0" width="920.0" height="140.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="500.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Transport Layer (RFC 4253) — Шифрування, цілісність, автентичність хоста</text>
<rect x="60.0" y="500.0" width="270.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="195.0" y="528.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">Узгодження ключів (KEX)</tspan><tspan x="195.0" dy="15.6">ECDH Curve25519 / DH group14</tspan><tspan x="195.0" dy="15.6">автентифікація хоста (known_hosts)</tspan></text>
<rect x="360.0" y="500.0" width="270.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="495.0" y="528.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">Симетричний шифр та AEAD</tspan><tspan x="495.0" dy="15.6">ChaCha20-Poly1305, AES-256-GCM</tspan><tspan x="495.0" dy="15.6">або AES-CTR + HMAC (EtM)</tspan></text>
<rect x="660.0" y="500.0" width="280.0" height="80.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="800.0" y="528.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Двійковий пакетний протокол (BPP)</tspan><tspan x="800.0" dy="15.6">доповнення, лічильник пакетів,</tspan><tspan x="800.0" dy="15.6">захист від підміни та replay</tspan></text>
<line x1="500.0" y1="595.0" x2="500.0" y2="625.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="330.0" y="630.0" width="340.0" height="28.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="647.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Єдине TCP-з'єднання (за замовчуванням порт 22/tcp)</tspan></text>
</svg>