<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виклик проходить через гачок ftrace до обробника, який обирає версію за станом задачі</text>
<rect x="40.0" y="250.0" width="250.0" height="90.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="165.0" y="290.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">хтось викликає</tspan><tspan x="165.0" dy="18.2">handle_request()</tspan></text>
<rect x="340.0" y="240.0" width="280.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="480.0" y="282.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">перші байти функції:</tspan><tspan x="480.0" dy="16.9">гачок ftrace,</tspan><tspan x="480.0" dy="16.9">вписаний у код на ходу</tspan></text>
<rect x="680.0" y="230.0" width="300.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="830.0" y="282.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">спільний обробник livepatch:</tspan><tspan x="830.0" dy="16.9">бере верхню латку зі стосу</tspan><tspan x="830.0" dy="16.9">й питає стан САМЕ ЦІЄЇ задачі</tspan></text>
<line x1="292.0" y1="295.0" x2="336.0" y2="295.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="622.0" y1="295.0" x2="676.0" y2="295.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="680.0" y="60.0" width="480.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="920.0" y="104.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">задача ще не перемкнена → стара версія</tspan><tspan x="920.0" dy="16.9">(тіло функції в самому ядрі, недоторкане)</tspan></text>
<rect x="680.0" y="460.0" width="480.0" height="96.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="920.0" y="504.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">задача вже перемкнена → нова версія</tspan><tspan x="920.0" dy="16.9">(тіло функції в модулі-латці)</tspan></text>
<line x1="900.0" y1="226.0" x2="900.0" y2="162.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="900.0" y1="364.0" x2="900.0" y2="456.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="440.0" width="250.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="165.0" y="484.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">хто вже всередині</tspan><tspan x="165.0" dy="16.9">старої функції —</tspan><tspan x="165.0" dy="16.9">доходить до кінця:</tspan><tspan x="165.0" dy="16.9">її ніхто не стирає</tspan></text>
</svg>