<rect x="50.0" y="148.0" width="190.0" height="198.0" rx="6" fill="#f4f6f8" stroke="none" stroke-width="1.5"/><text x="145.0" y="215.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Команда завершилась</tspan><tspan x="145.0" dy="14.3"></tspan><tspan x="145.0" dy="14.3">• Збереження $?</tspan><tspan x="145.0" dy="14.3">• Збереження $PIPESTATUS</tspan><tspan x="145.0" dy="14.3">• Фіксація часу виконання</tspan><tspan x="145.0" dy="14.3">• Повернення керування tty</tspan></text>
