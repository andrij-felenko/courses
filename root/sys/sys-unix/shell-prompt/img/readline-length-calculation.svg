<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розрахунок довжини промпту в Readline</text>
<text x="530.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розрахунок позиції курсора в Readline: з дужками \[ \] і без них</text>
<rect x="40.0" y="65.0" width="980.0" height="185.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="60.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">1. Без обгортки \[ \]: Readline рахує керівні байти як видимі символи</text>
<text x="60.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Рядок у пам'яті:</text>
<rect x="180.0" y="106.0" width="820.0" height="28.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="124.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">\033[32m  u  s  e  r  @  h  o  s  t  :  ~  $  \033[0m  _</tspan></text>
<text x="60.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Оцінка Readline:</text>
<rect x="180.0" y="146.0" width="380.0" height="30.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="370.0" y="164.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Довжина промпту = 26 символів (18 байт ANSI + 13 тексту)</tspan></text>
<text x="580.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Екран термінала:</text>
<rect x="700.0" y="146.0" width="300.0" height="30.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="850.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">Фактична ширина = 13 знакомісць</tspan></text>
<text x="60.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">Наслідок: зміщення на 13 знакомісць; курсор перескакує на новий рядок завчасно, історія затирає промпт</text>
<rect x="40.0" y="270.0" width="980.0" height="175.0" rx="8" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="60.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">2. З обгорткою \[ \]: керівні байти маркуються як нульова ширина</text>
<text x="60.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Рядок у пам'яті:</text>
<rect x="180.0" y="312.0" width="820.0" height="28.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="330.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">\[ \033[32m \]  u  s  e  r  @  h  o  s  t  :  ~  $  \[ \033[0m \]  _</tspan></text>
<text x="60.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Оцінка Readline:</text>
<rect x="180.0" y="352.0" width="380.0" height="30.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="370.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Ігнорує вміст між \[ і \] -&gt; Довжина = 13 символів</tspan></text>
<text x="580.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Екран термінала:</text>
<rect x="700.0" y="352.0" width="300.0" height="30.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="850.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">Фактична ширина = 13 знакомісць</tspan></text>
<text x="60.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">Наслідок: ідеальна синхронізація довжини рядка, коректне перенесення та чисте редагування</text>
</svg>