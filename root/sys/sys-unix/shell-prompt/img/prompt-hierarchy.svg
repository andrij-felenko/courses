<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія змінних запрошення оболонки</text>
<text x="530.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія змінних запрошення командної оболонки (PS1–PS4)</text>
<rect x="40.0" y="75.0" width="230.0" height="340.0" rx="8" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="155.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#27ae60" text-anchor="middle" font-weight="700">PS1</text>
<text x="155.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Первинне запрошення</text>
<line x1="56.0" y1="149.0" x2="254.0" y2="149.0" stroke="#27ae60" stroke-width="1.0"/>
<rect x="52.0" y="161.0" width="206.0" height="240.0" rx="6" fill="#eaf7ee" stroke="none" stroke-width="1.5"/><text x="155.0" y="245.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">Дефолт: \s-\v\$ або \u@\h:\w\$</tspan><tspan x="155.0" dy="13.0"></tspan><tspan x="155.0" dy="13.0">• Головний цикл REPL</tspan><tspan x="155.0" dy="13.0">• Відображається перед введенням</tspan><tspan x="155.0" dy="13.0">  нової команди</tspan><tspan x="155.0" dy="13.0">• Підтримує динамічні команди</tspan><tspan x="155.0" dy="13.0">  та коди кольорів</tspan></text>
<rect x="290.0" y="75.0" width="230.0" height="340.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="405.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#333333" text-anchor="middle" font-weight="700">PS2</text>
<text x="405.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Вторинне продовження</text>
<line x1="306.0" y1="149.0" x2="504.0" y2="149.0" stroke="#333333" stroke-width="1.0"/>
<rect x="302.0" y="161.0" width="206.0" height="240.0" rx="6" fill="#f4f6f8" stroke="none" stroke-width="1.5"/><text x="405.0" y="245.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="405.0" dy="0.0">Дефолт: &gt; </tspan><tspan x="405.0" dy="13.0"></tspan><tspan x="405.0" dy="13.0">• Незавершені синтаксичні блоки</tspan><tspan x="405.0" dy="13.0">• Непарні лапки (' або &quot;)</tspan><tspan x="405.0" dy="13.0">• Багаторядкові конструкції</tspan><tspan x="405.0" dy="13.0">  (while, if, for, heredoc)</tspan><tspan x="405.0" dy="13.0">• Екранований перенос (\)</tspan></text>
<rect x="540.0" y="75.0" width="230.0" height="340.0" rx="8" fill="#fff8e6" stroke="#6b7280" stroke-width="1.8"/>
<text x="655.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">PS3</text>
<text x="655.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Меню циклу select</text>
<line x1="556.0" y1="149.0" x2="754.0" y2="149.0" stroke="#6b7280" stroke-width="1.0"/>
<rect x="552.0" y="161.0" width="206.0" height="240.0" rx="6" fill="#fff8e6" stroke="none" stroke-width="1.5"/><text x="655.0" y="241.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Дефолт: #? </tspan><tspan x="655.0" dy="14.3"></tspan><tspan x="655.0" dy="14.3">• Інтерактивний вибір варіанта</tspan><tspan x="655.0" dy="14.3">• Використовується вбудованою</tspan><tspan x="655.0" dy="14.3">  конструкцією select ... in</tspan><tspan x="655.0" dy="14.3">• Відображається після списку</tspan><tspan x="655.0" dy="14.3">  нумерованих пунктів</tspan></text>
<rect x="790.0" y="75.0" width="230.0" height="340.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="905.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">PS4</text>
<text x="905.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Префікс трасування</text>
<line x1="806.0" y1="149.0" x2="1004.0" y2="149.0" stroke="#c0392b" stroke-width="1.0"/>
<rect x="802.0" y="161.0" width="206.0" height="240.0" rx="6" fill="#fdecea" stroke="none" stroke-width="1.5"/><text x="905.0" y="245.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="905.0" dy="0.0">Дефолт: + </tspan><tspan x="905.0" dy="13.0"></tspan><tspan x="905.0" dy="13.0">• Режим налагодження set -x</tspan><tspan x="905.0" dy="13.0">• Друкується перед кожною</tspan><tspan x="905.0" dy="13.0">  виконуваною інструкцією</tspan><tspan x="905.0" dy="13.0">• Перший символ множиться</tspan><tspan x="905.0" dy="13.0">  на глибину вкладеності ($SHLVL)</tspan></text>
<text x="530.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Кожна змінна активується на окремому етапі життєвого циклу інтерпретатора</text>
</svg>