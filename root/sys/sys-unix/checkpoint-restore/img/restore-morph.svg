<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три кроки відновлення: заготовка, блоб-острівець, готова задача</text>
<rect x="40.0" y="26.0" width="1040.0" height="38.0" rx="6" fill="#f7f8fa" stroke="#1a1a1a" stroke-width="1.8"/><text x="560.0" y="49.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Відновлювач сидить у ТОМУ САМОМУ адресному просторі, який має стерти</tspan></text>
<rect x="46.0" y="84.0" width="330.0" height="44.0" rx="6" fill="#eef2fd" stroke="#2457d6" stroke-width="1.8"/><text x="211.0" y="110.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="211.0" dy="0.0">Крок 1. Заготовка</tspan></text>
<rect x="60.0" y="146.0" width="302.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="211.0" y="173.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="211.0" dy="0.0">код і дані criu</tspan></text>
<rect x="60.0" y="204.0" width="302.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="211.0" y="231.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="211.0" dy="0.0">образи, прочитані з диска</tspan></text>
<rect x="60.0" y="262.0" width="302.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="211.0" y="291.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="211.0" dy="0.0">сторінки жертви — поки що</tspan><tspan x="211.0" dy="15.6">покладені НЕ на свої адреси</tspan></text>
<rect x="46.0" y="386.0" width="330.0" height="92.0" rx="6" fill="#f7f8fa" stroke="#2457d6" stroke-width="1.3"/><text x="211.0" y="421.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="211.0" dy="0.0">процес уже має правильний</tspan><tspan x="211.0" dy="14.3">PID, дескриптори й простори імен,</tspan><tspan x="211.0" dy="14.3">але чужий вміст пам'яті</tspan></text>
<line x1="381.0" y1="250.0" x2="397.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="402.0" y="84.0" width="330.0" height="44.0" rx="6" fill="#fdf2ee" stroke="#c0392b" stroke-width="1.8"/><text x="567.0" y="110.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="567.0" dy="0.0">Крок 2. Острівець</tspan></text>
<rect x="416.0" y="146.0" width="302.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="567.0" y="175.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="567.0" dy="0.0">блоб-відновлювач</tspan><tspan x="567.0" dy="15.6">на вільній адресі</tspan></text>
<rect x="416.0" y="224.0" width="302.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="567.0" y="251.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="567.0" dy="0.0">маленький стек блоба</tspan></text>
<rect x="416.0" y="282.0" width="302.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="567.0" y="311.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="567.0" dy="0.0">список того, що</tspan><tspan x="567.0" dy="15.6">треба перекласти</tspan></text>
<rect x="402.0" y="386.0" width="330.0" height="92.0" rx="6" fill="#f7f8fa" stroke="#c0392b" stroke-width="1.3"/><text x="567.0" y="421.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="567.0" dy="0.0">керування стрибає в блоб —</tspan><tspan x="567.0" dy="14.3">тепер можна розмаповувати</tspan><tspan x="567.0" dy="14.3">все інше, зокрема сам criu</tspan></text>
<line x1="737.0" y1="250.0" x2="753.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="758.0" y="84.0" width="330.0" height="44.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="923.0" y="110.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="923.0" dy="0.0">Крок 3. Жертва</tspan></text>
<rect x="772.0" y="146.0" width="302.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="923.0" y="173.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="923.0" dy="0.0">код програми на своїй адресі</tspan></text>
<rect x="772.0" y="204.0" width="302.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="923.0" y="233.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="923.0" dy="0.0">дані, купа, стеки —</tspan><tspan x="923.0" dy="15.6">на своїх адресах</tspan></text>
<rect x="772.0" y="282.0" width="302.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="923.0" y="309.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="923.0" dy="0.0">блоб знімає себе останнім</tspan></text>
<rect x="758.0" y="386.0" width="330.0" height="92.0" rx="6" fill="#f7f8fa" stroke="#27ae60" stroke-width="1.3"/><text x="923.0" y="421.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="923.0" dy="0.0">rt_sigreturn з підробленого фрейму</tspan><tspan x="923.0" dy="14.3">ставить регістри — задача продовжує</tspan><tspan x="923.0" dy="14.3">з тієї самої інструкції</tspan></text>
<rect x="46.0" y="508.0" width="1028.0" height="48.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><text x="560.0" y="536.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Порядок вимушений: розмапувати власний код можна тільки з коду, який лежить деінде</tspan></text>
<rect x="46.0" y="570.0" width="1028.0" height="44.0" rx="6" fill="#f7f8fa" stroke="#6b7280" stroke-width="1.2"/><text x="560.0" y="596.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Саме тому блоб пишуть позиційно-незалежним і без жодного звертання до бібліотек</tspan></text>
<text x="560.0" y="640.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">відновлення — не запуск програми, а заміщення одного процесу іншим зсередини</text>
</svg>