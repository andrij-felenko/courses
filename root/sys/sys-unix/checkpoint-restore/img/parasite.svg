<rect x="602.0" y="152.0" width="226.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="715.0" y="177.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">код програми</tspan></text>
<rect x="602.0" y="204.0" width="226.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="715.0" y="229.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">дані й купа</tspan></text>
<rect x="602.0" y="256.0" width="226.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="715.0" y="281.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">стеки потоків</tspan></text>
<rect x="602.0" y="314.0" width="226.0" height="44.0" rx="6" fill="#fdf2ee" stroke="#c0392b" stroke-width="1.8"/><text x="715.0" y="339.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">паразитна ділянка</tspan></text>
<rect x="590.0" y="372.0" width="250.0" height="130.0" rx="6" fill="#f7f8fa" stroke="#6b7280" stroke-width="1.2"/><text x="715.0" y="405.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">у виділену ділянку</tspan><tspan x="715.0" dy="14.3">залито PIE-блоб;</tspan><tspan x="715.0" dy="14.3">він виконує виклики</tspan><tspan x="715.0" dy="14.3">від імені задачі</tspan><tspan x="715.0" dy="14.3">й віддає результат</tspan><tspan x="715.0" dy="14.3">у сокет знімача</tspan></text>
<line x1="844.0" y1="250.0" x2="858.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="862.0" y="82.0" width="250.0" height="52.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="987.0" y="112.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="987.0" dy="0.0">4. Після команди FINI</tspan></text>
<rect x="874.0" y="152.0" width="226.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="987.0" y="177.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="987.0" dy="0.0">код програми</tspan></text>
<rect x="874.0" y="204.0" width="226.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="987.0" y="229.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="987.0" dy="0.0">дані й купа</tspan></text>
<rect x="874.0" y="256.0" width="226.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="987.0" y="281.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="987.0" dy="0.0">стеки потоків</tspan></text>
<rect x="874.0" y="314.0" width="226.0" height="44.0" rx="6" fill="#f7f8fa" stroke="#6b7280" stroke-width="1.2"/><text x="987.0" y="339.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="987.0" dy="0.0">(нічого зайвого)</tspan></text>
<rect x="862.0" y="372.0" width="250.0" height="130.0" rx="6" fill="#f7f8fa" stroke="#6b7280" stroke-width="1.2"/><text x="987.0" y="405.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="987.0" dy="0.0">паразит зробив</tspan><tspan x="987.0" dy="14.3">rt_sigreturn: регістри</tspan><tspan x="987.0" dy="14.3">взято з підробленого</tspan><tspan x="987.0" dy="14.3">сигнального фрейму,</tspan><tspan x="987.0" dy="14.3">ділянку розмаповано —</tspan><tspan x="987.0" dy="14.3">слідів не лишилося</tspan></text>
<rect x="46.0" y="526.0" width="1068.0" height="46.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="580.0" y="553.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Ззовні знімач дістає лише те, що ядро погодилося показати у /proc; решту доводиться питати зсередини</tspan></text>
<rect x="46.0" y="588.0" width="1068.0" height="46.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="580.0" y="615.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Зсередини можна: перебрати диспозиції сигналів, зняти таймери, вивантажити пам'ять через vmsplice у канал</tspan></text>
<text x="580.0" y="668.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">паразит нічого не змінює в задачі — він лише позичає її контекст і йде</text>
