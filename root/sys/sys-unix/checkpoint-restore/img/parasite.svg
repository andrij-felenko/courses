<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1170 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1170" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Паразитний код: як знімач виконує виклики від імені чужої задачі</text>
<rect x="40.0" y="26.0" width="1080.0" height="38.0" rx="6" fill="#f7f8fa" stroke="#1a1a1a" stroke-width="1.8"/><text x="580.0" y="49.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Щоб виконати системний виклик У КОНТЕКСТІ жертви, знімач тимчасово селиться в її пам'яті</tspan></text>
<rect x="46.0" y="82.0" width="250.0" height="52.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/><text x="171.0" y="112.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="171.0" dy="0.0">1. Задача біжить</tspan></text>
<rect x="58.0" y="152.0" width="226.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="171.0" y="177.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="171.0" dy="0.0">код програми</tspan></text>
<rect x="58.0" y="204.0" width="226.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="171.0" y="229.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="171.0" dy="0.0">дані й купа</tspan></text>
<rect x="58.0" y="256.0" width="226.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="171.0" y="281.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="171.0" dy="0.0">стеки потоків</tspan></text>
<rect x="58.0" y="314.0" width="226.0" height="44.0" rx="6" fill="#f7f8fa" stroke="#6b7280" stroke-width="1.2"/><text x="171.0" y="339.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="171.0" dy="0.0">(нічого зайвого)</tspan></text>
<rect x="46.0" y="372.0" width="250.0" height="130.0" rx="6" fill="#f7f8fa" stroke="#6b7280" stroke-width="1.2"/><text x="171.0" y="426.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="171.0" dy="0.0">звичайний адресний</tspan><tspan x="171.0" dy="14.3">простір: код, дані,</tspan><tspan x="171.0" dy="14.3">купа, стеки потоків</tspan></text>
<line x1="300.0" y1="250.0" x2="314.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
