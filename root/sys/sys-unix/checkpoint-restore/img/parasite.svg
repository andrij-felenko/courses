<rect x="330.0" y="204.0" width="226.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="443.0" y="229.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="443.0" dy="0.0">дані й купа</tspan></text>
<rect x="330.0" y="256.0" width="226.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="443.0" y="281.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="443.0" dy="0.0">стеки потоків</tspan></text>
<rect x="330.0" y="314.0" width="226.0" height="44.0" rx="6" fill="#eef2fd" stroke="#2457d6" stroke-width="1.6"/><text x="443.0" y="339.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="443.0" dy="0.0">тут: 2 байти → syscall</tspan></text>
<rect x="318.0" y="372.0" width="250.0" height="130.0" rx="6" fill="#f7f8fa" stroke="#6b7280" stroke-width="1.2"/><text x="443.0" y="412.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="443.0" dy="0.0">у точці, де стоїть</tspan><tspan x="443.0" dy="14.3">лічильник команд,</tspan><tspan x="443.0" dy="14.3">тимчасово лежить</tspan><tspan x="443.0" dy="14.3">інструкція syscall —</tspan><tspan x="443.0" dy="14.3">нею роблять mmap</tspan></text>
<line x1="572.0" y1="250.0" x2="586.0" y2="250.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
