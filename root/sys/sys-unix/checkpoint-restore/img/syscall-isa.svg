<text x="570.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">той самий алгоритм зберегти → підмінити → крок → повернути; різняться лише байти й імена регістрів</text>
