<rect x="40.0" y="26.0" width="1060.0" height="38.0" rx="6" fill="#f7f8fa" stroke="#1a1a1a" stroke-width="1.8"/><text x="570.0" y="49.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Прийом той самий, але інструкція, її довжина й регістри — архітектурні</tspan></text>
