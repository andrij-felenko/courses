<rect x="614.0" y="344.0" width="268.0" height="72.0" rx="6" fill="#f7f8fa" stroke="#27ae60" stroke-width="1.3"/><text x="748.0" y="376.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="748.0" dy="0.0">syscall виконано,</tspan><tspan x="748.0" dy="14.3">результат у rax</tspan></text>
<line x1="883.0" y1="206.0" x2="897.0" y2="206.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
