<rect x="910.0" y="240.0" width="244.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1032.0" y="264.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1032.0" dy="0.0">rip = 0x…4e5a</tspan></text>
<rect x="910.0" y="288.0" width="244.0" height="40.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="1032.0" y="312.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1032.0" dy="0.0">rax = (як було)</tspan></text>
<rect x="898.0" y="344.0" width="268.0" height="72.0" rx="6" fill="#f7f8fa" stroke="#6b7280" stroke-width="1.3"/><text x="1032.0" y="376.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1032.0" dy="0.0">байти й регістри —</tspan><tspan x="1032.0" dy="14.3">точно як до втручання</tspan></text>
<rect x="46.0" y="442.0" width="1108.0" height="44.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.7"/><text x="600.0" y="468.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Симетрія повна: кожній дії ліворуч відповідає рівно зворотна праворуч — стан 4 дорівнює стану 1</tspan></text>
<rect x="46.0" y="500.0" width="1108.0" height="44.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="600.0" y="526.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">getpid() повернув номер САМОЇ жертви (4711) — доказ, що виклик стався в її контексті, не в нашому</tspan></text>
<text x="600.0" y="578.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">жодного сліду: та сама інструкція, ті самі регістри, задача біжить далі</text>
</svg>