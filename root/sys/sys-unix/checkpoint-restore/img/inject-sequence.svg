<rect x="330.0" y="344.0" width="268.0" height="72.0" rx="6" fill="#f7f8fa" stroke="#c0392b" stroke-width="1.3"/><text x="464.0" y="376.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="464.0" dy="0.0">перші 2 байти —</tspan><tspan x="464.0" dy="14.3">інструкція syscall</tspan></text>
