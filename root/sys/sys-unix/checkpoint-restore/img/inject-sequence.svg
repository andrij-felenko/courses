<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ін'єкція одного syscall: зберегти → підмінити → крок → повернути</text>
<rect x="40.0" y="26.0" width="1120.0" height="38.0" rx="6" fill="#f7f8fa" stroke="#1a1a1a" stroke-width="1.8"/><text x="600.0" y="49.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Один системний виклик руками жертви — і точне повернення в початковий стан</tspan></text>
<rect x="46.0" y="84.0" width="268.0" height="44.0" rx="6" fill="#eef2fd" stroke="#2457d6" stroke-width="1.8"/><text x="180.0" y="110.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">1. Зберегли</tspan></text>
<rect x="58.0" y="146.0" width="244.0" height="34.0" rx="6" fill="#f7f8fa" stroke="#6b7280" stroke-width="1.1"/><text x="180.0" y="166.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="180.0" dy="0.0">слово за rip:</tspan></text>
<rect x="58.0" y="184.0" width="244.0" height="44.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="180.0" y="210.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">55 48 89 e5 …</tspan></text>
