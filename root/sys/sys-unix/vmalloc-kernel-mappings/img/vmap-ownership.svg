<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1450 910" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1450" height="910" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="60.0" y="34.0" width="1320.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="720.0" y="64.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">ТРИ КОНТРАКТИ: ХТО ВЗЯВ КАДРИ, ХТО ЇХ ПОВЕРНЕ</tspan></text>
<rect x="60.0" y="104.0" width="420.0" height="86.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="270.0" y="142.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">vmalloc(size)</tspan><tspan x="270.0" dy="18.2">→ vfree(p)</tspan></text>
<rect x="510.0" y="104.0" width="420.0" height="86.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="720.0" y="142.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">vmap(pages, n, 0, prot)</tspan><tspan x="720.0" dy="18.2">→ vunmap(p)</tspan></text>
<rect x="960.0" y="104.0" width="420.0" height="86.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="1170.0" y="133.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="1170.0" dy="0.0">vmap(pages, n,</tspan><tspan x="1170.0" dy="18.2">    VM_MAP_PUT_PAGES, prot)</tspan><tspan x="1170.0" dy="18.2">→ vfree(p)</tspan></text>
<text x="80.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">хто взяв кадри в розподільника:</text>
<rect x="60.0" y="250.0" width="420.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="270.0" y="285.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">ядро — усередині виклику</tspan></text>
<rect x="510.0" y="250.0" width="420.0" height="62.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="720.0" y="285.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">ВИ — заздалегідь, самі</tspan></text>
<rect x="960.0" y="250.0" width="420.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="1170.0" y="285.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1170.0" dy="0.0">ВИ — заздалегідь, самі</tspan></text>
<text x="80.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">що робить парний виклик:</text>
<rect x="60.0" y="376.0" width="420.0" height="108.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.6"/><text x="270.0" y="417.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">знімає записи таблиць,</tspan><tspan x="270.0" dy="16.9">повертає адреси</tspan><tspan x="270.0" dy="16.9">і ВІДДАЄ КАДРИ</tspan></text>
<rect x="510.0" y="376.0" width="420.0" height="108.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.6"/><text x="720.0" y="417.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">знімає записи таблиць</tspan><tspan x="720.0" dy="16.9">і повертає адреси —</tspan><tspan x="720.0" dy="16.9">і більше нічого</tspan></text>
<rect x="960.0" y="376.0" width="420.0" height="108.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.6"/><text x="1170.0" y="417.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1170.0" dy="0.0">знімає записи таблиць,</tspan><tspan x="1170.0" dy="16.9">знімає по посиланню з кожної</tspan><tspan x="1170.0" dy="16.9">сторінки, звільняє масив pages</tspan></text>
<line x1="270.0" y1="492.0" x2="270.0" y2="534.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="720.0" y1="492.0" x2="720.0" y2="534.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="1170.0" y1="492.0" x2="1170.0" y2="534.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="80.0" y="560.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">що лишається на ваших руках:</text>
<rect x="60.0" y="578.0" width="420.0" height="84.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/><text x="270.0" y="624.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">нічого — пам'ять повернуто</tspan></text>
<rect x="510.0" y="578.0" width="420.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="720.0" y="615.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">КАДРИ, і віддати їх</tspan><tspan x="720.0" dy="18.2">мусите ви самі</tspan></text>
<rect x="960.0" y="578.0" width="420.0" height="84.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="1170.0" y="624.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="1170.0" dy="0.0">нічого — пам'ять повернуто</tspan></text>
<rect x="60.0" y="696.0" width="1320.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="720.0" y="720.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">забутий крок у середньому стовпці — найтихіший витік у ядрі:</tspan><tspan x="720.0" dy="18.2">покажчик уже недійсний, ділянки в /proc/vmallocinfo уже немає,</tspan><tspan x="720.0" dy="18.2">а кадри лишаються зайнятими до перезавантаження</tspan></text>
<rect x="60.0" y="792.0" width="1320.0" height="76.0" rx="6" fill="#fbfcff" stroke="#1a1a1a" stroke-width="1.5"/><text x="720.0" y="825.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">умова правого стовпця: масив pages мусить бути з kmalloc або vmalloc —</tspan><tspan x="720.0" dy="18.2">його звільнить vfree; масив на стеку чи статичний дає пошкодження купи</tspan></text>
</svg>