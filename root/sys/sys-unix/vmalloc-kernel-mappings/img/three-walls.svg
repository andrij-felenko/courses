<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1430 910" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1430" height="910" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="60.0" y="34.0" width="1300.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="710.0" y="66.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">ЧОТИРИ ПОВОРОТИ В ІСТОРІЇ ОБЛАСТІ — І ЩОРАЗУ ІНША НЕСТАЧА</tspan></text>
<rect x="60.0" y="108.0" width="150.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="135.0" y="136.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">КОЛИ</tspan></text>
<rect x="226.0" y="108.0" width="300.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="376.0" y="136.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="376.0" dy="0.0">У ЩО ВПЕРЛОСЯ</tspan></text>
<rect x="542.0" y="108.0" width="420.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="752.0" y="136.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="752.0" dy="0.0">ЩО ЗРОБИЛИ</tspan></text>
<rect x="978.0" y="108.0" width="382.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="1169.0" y="136.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="1169.0" dy="0.0">ЧИМ ЗАПЛАТИЛИ</tspan></text>
<rect x="60.0" y="170.0" width="150.0" height="128.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="135.0" y="230.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">2008</tspan><tspan x="135.0" dy="16.9">ядро 2.6.28</tspan></text>
<rect x="226.0" y="170.0" width="300.0" height="128.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="376.0" y="214.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="376.0" dy="0.0">кожен vunmap — широкомовне</tspan><tspan x="376.0" dy="15.6">переривання на всі ядра,</tspan><tspan x="376.0" dy="15.6">і все це під одним глобальним</tspan><tspan x="376.0" dy="15.6">замком на запис</tspan></text>
<rect x="542.0" y="170.0" width="420.0" height="128.0" rx="6" fill="#fbfcff" stroke="#c0392b" stroke-width="1.5"/><text x="752.0" y="214.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="752.0" dy="0.0">дерево зайнятих ділянок,</tspan><tspan x="752.0" dy="15.6">відкладена спільна очистка,</tspan><tspan x="752.0" dy="15.6">запас адрес на кожному ядрі</tspan><tspan x="752.0" dy="15.6">для дрібних відображень</tspan></text>
<rect x="978.0" y="170.0" width="382.0" height="128.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="1169.0" y="230.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1169.0" dy="0.0">звільнена адреса</tspan><tspan x="1169.0" dy="15.6">повертається не одразу</tspan></text>
<rect x="60.0" y="314.0" width="150.0" height="128.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="135.0" y="374.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">2019</tspan><tspan x="135.0" dy="16.9">ядро 5.2</tspan></text>
<rect x="226.0" y="314.0" width="300.0" height="128.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="376.0" y="366.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="376.0" dy="0.0">пошук вільного місця —</tspan><tspan x="376.0" dy="15.6">прохід списком зайнятих</tspan><tspan x="376.0" dy="15.6">ділянок від початку області</tspan></text>
<rect x="542.0" y="314.0" width="420.0" height="128.0" rx="6" fill="#fbfcff" stroke="#27ae60" stroke-width="1.5"/><text x="752.0" y="358.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="752.0" dy="0.0">окреме дерево вільних</tspan><tspan x="752.0" dy="15.6">проміжків: у кожному вузлі</tspan><tspan x="752.0" dy="15.6">найбільший вільний розмір</tspan><tspan x="752.0" dy="15.6">у його піддереві</tspan></text>
<rect x="978.0" y="314.0" width="382.0" height="128.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="1169.0" y="374.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1169.0" dy="0.0">друга структура, яку треба</tspan><tspan x="1169.0" dy="15.6">тримати в злагоді з першою</tspan></text>
<rect x="60.0" y="458.0" width="150.0" height="128.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="135.0" y="518.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">2021</tspan><tspan x="135.0" dy="16.9">ядро 5.13</tspan></text>
<rect x="226.0" y="458.0" width="300.0" height="128.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="376.0" y="502.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="376.0" dy="0.0">виділення вже дешеве,</tspan><tspan x="376.0" dy="15.6">а кожне звернення платить:</tspan><tspan x="376.0" dy="15.6">одна сторінка — один запис</tspan><tspan x="376.0" dy="15.6">у TLB</tspan></text>
<rect x="542.0" y="458.0" width="420.0" height="128.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.5"/><text x="752.0" y="510.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="752.0" dy="0.0">виділення від розміру великої</tspan><tspan x="752.0" dy="15.6">сторінки пробує лягти нею</tspan><tspan x="752.0" dy="15.6">й відкочується на звичайні</tspan></text>
<rect x="978.0" y="458.0" width="382.0" height="128.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="1169.0" y="518.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1169.0" dy="0.0">там, де сторінкам потрібні</tspan><tspan x="1169.0" dy="15.6">різні права, вимкнено</tspan></text>
<rect x="60.0" y="602.0" width="150.0" height="128.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="135.0" y="662.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">32 біти</tspan><tspan x="135.0" dy="16.9">до кінця епохи</tspan></text>
<rect x="226.0" y="602.0" width="300.0" height="128.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="376.0" y="654.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="376.0" dy="0.0">адрес просто мало:</tspan><tspan x="376.0" dy="15.6">типово 128 МіБ на всю</tspan><tspan x="376.0" dy="15.6">область у цілій системі</tspan></text>
<rect x="542.0" y="602.0" width="420.0" height="128.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.5"/><text x="752.0" y="662.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="752.0" dy="0.0">параметр завантаження</tspan><tspan x="752.0" dy="15.6">vmalloc= розширює область</tspan></text>
<rect x="978.0" y="602.0" width="382.0" height="128.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.2"/><text x="1169.0" y="662.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1169.0" dy="0.0">рівно стільки ж віднімається</tspan><tspan x="1169.0" dy="15.6">в прямого відображення</tspan></text>
<rect x="60.0" y="752.0" width="1300.0" height="110.0" rx="6" fill="#fbfcff" stroke="#1a1a1a" stroke-width="1.5"/><text x="710.0" y="793.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">перші два переписування прибирали час, що з'їдало саме керування областю;</tspan><tspan x="710.0" dy="18.2">третє прибирало час, який область відбирала в усього іншого коду через TLB;</tspan><tspan x="710.0" dy="18.2">а четвертий рядок алгоритмічної відповіді не мав узагалі — адрес не додати кмітливістю</tspan></text>
</svg>