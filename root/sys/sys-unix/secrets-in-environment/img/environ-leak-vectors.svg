<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вектори витоків секретів зі змінних середовища (environ)</text>
<rect x="240.0" y="65.0" width="340.0" height="210.0" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="410.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#991b1b" text-anchor="middle" font-weight="700">Пам'ять процесу (UID = 1000)</text>
<line x1="255.0" y1="105.0" x2="565.0" y2="105.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="410.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle"><tspan x="410.0" dy="0.0">Стек: char **environ</tspan><tspan x="410.0" dy="15.9">• DB_PASSWORD=SecretPass123!</tspan><tspan x="410.0" dy="15.9">• AWS_SECRET_KEY=AKIA...XYZ</tspan><tspan x="410.0" dy="15.9">• JWT_SIGNING_KEY=d8f1e0...c4</tspan><tspan x="410.0" dy="15.9">Купа / .bss / .data: відкритий текст у RAM</tspan></text>
<rect x="25.0" y="65.0" width="185.0" height="120.0" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
<text x="117.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0369a1" text-anchor="middle" font-weight="700">1. Читання через procfs</text>
<text x="117.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0c4a6e" text-anchor="middle"><tspan x="117.0" dy="0.0">/proc/$PID/environ</tspan><tspan x="117.0" dy="13.5">Доступно будь-якому</tspan><tspan x="117.0" dy="13.5">процесу того самого UID</tspan><tspan x="117.0" dy="13.5">або root без ptrace</tspan></text>
<line x1="240.0" y1="125.0" x2="213.0" y2="125.0" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="610.0" y="65.0" width="185.0" height="120.0" rx="6" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.5"/>
<text x="702.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a21caf" text-anchor="middle" font-weight="700">2. Успадкування дочірніми</text>
<text x="702.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#701a75" text-anchor="middle"><tspan x="702.0" dy="0.0">fork() + execve()</tspan><tspan x="702.0" dy="13.5">Усі змінні копіюються</tspan><tspan x="702.0" dy="13.5">у ps, tar, curl, convert</tspan><tspan x="702.0" dy="13.5">та сторонні скрипти</tspan></text>
<line x1="580.0" y1="125.0" x2="607.0" y2="125.0" stroke="#c026d3" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="25.0" y="330.0" width="230.0" height="150.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="140.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c2410c" text-anchor="middle" font-weight="700">3. Coredump та файли крешів</text>
<text x="140.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c2d12" text-anchor="middle"><tspan x="140.0" dy="0.0">SIGSEGV / SIGABRT скидає</tspan><tspan x="140.0" dy="13.5">початковий стек на диск</tspan><tspan x="140.0" dy="13.5">(/var/lib/systemd/coredump)</tspan><tspan x="140.0" dy="13.5">Паролі потрапляють у нешифровані</tspan><tspan x="140.0" dy="13.5">дампи та системи аналізу</tspan></text>
<line x1="330.0" y1="275.0" x2="200.0" y2="327.0" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="565.0" y="330.0" width="230.0" height="150.0" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
<text x="680.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#854d0e" text-anchor="middle" font-weight="700">4. APM, логи та винятки</text>
<text x="680.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#713f12" text-anchor="middle"><tspan x="680.0" dy="0.0">Sentry, Datadog, Bugsnag</tspan><tspan x="680.0" dy="13.5">дамплять os.environ при помилках;</tspan><tspan x="680.0" dy="13.5">Діагностика CI/CD, set -x,</tspan><tspan x="680.0" dy="13.5">друк env у stdout/stderr</tspan><tspan x="680.0" dy="13.5">витікає в центральні логи</tspan></text>
<line x1="490.0" y1="275.0" x2="620.0" y2="327.0" stroke="#ca8a04" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="270.0" y="360.0" width="280.0" height="100.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="410.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">Чому середовище не захищене?</text>
<text x="410.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle"><tspan x="410.0" dy="0.0">• Немає розмежування прав за змінними</tspan><tspan x="410.0" dy="13.5">• Відкритий текст у віртуальній пам'яті</tspan><tspan x="410.0" dy="13.5">• Автоматичне успадкування всім деревом</tspan></text>
</svg>