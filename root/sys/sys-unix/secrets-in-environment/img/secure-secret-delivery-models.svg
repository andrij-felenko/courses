<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура безпечної передачі секретів у Linux</text>
<rect x="25.0" y="55.0" width="370.0" height="210.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="210.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">1. Анонімні пайпи та файлові дескриптори</text>
<line x1="40.0" y1="92.0" x2="380.0" y2="92.0" stroke="#16a34a" stroke-width="1.0"/>
<text x="40.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="start"><tspan x="40.0" dy="0.0">• pipe2(fd, O_CLOEXEC) створює односпрямований канал</tspan><tspan x="40.0" dy="15.8">• Батько записує секрет і передає fd=3 дочірньому процесу</tspan><tspan x="40.0" dy="15.8">• Секрет зчитується один раз і буфер занулюється</tspan><tspan x="40.0" dy="15.8">• Відсутній у /proc/$PID/environ та argv</tspan><tspan x="40.0" dy="15.8">• Інші дочірні процеси не отримують дескриптор</tspan></text>
<rect x="425.0" y="55.0" width="370.0" height="210.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="610.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">2. Захищений tmpfs та Secret Mounts</text>
<line x1="440.0" y1="92.0" x2="780.0" y2="92.0" stroke="#2563eb" stroke-width="1.0"/>
<text x="440.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e3a8a" text-anchor="start"><tspan x="440.0" dy="0.0">• Монтування RAM-диска (tmpfs) з правами 0700/0600</tspan><tspan x="440.0" dy="15.8">• Дані ніколи не скидаються на диск (no swap via mlock)</tspan><tspan x="440.0" dy="15.8">• systemd LoadCredential= та K8s Secret Volumes</tspan><tspan x="440.0" dy="15.8">• Додаток відкриває файл, читає й занулює пам'ять</tspan><tspan x="440.0" dy="15.8">• Ізоляція через Mount Namespaces та права доступу</tspan></text>
<rect x="25.0" y="285.0" width="370.0" height="210.0" rx="8" fill="#fdf4ff" stroke="#9333ea" stroke-width="1.5"/>
<text x="210.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7e22ce" text-anchor="middle" font-weight="700">3. Анонімні memfd_create з пломбуванням</text>
<line x1="40.0" y1="322.0" x2="380.0" y2="322.0" stroke="#9333ea" stroke-width="1.0"/>
<text x="40.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#581c87" text-anchor="start"><tspan x="40.0" dy="0.0">• memfd_create(&quot;sec&quot;, MFD_CLOEXEC | MFD_ALLOW_SEALING)</tspan><tspan x="40.0" dy="15.8">• Пломби F_SEAL_WRITE | F_SEAL_GROW захищають буфер</tspan><tspan x="40.0" dy="15.8">• Передача через Unix Domain Socket (SCM_RIGHTS)</tspan><tspan x="40.0" dy="15.8">• Не має шляху у файловій системі (анонімний алокатор)</tspan><tspan x="40.0" dy="15.8">• Читач гарантовано отримує незмінний зріз даних</tspan></text>
<rect x="425.0" y="285.0" width="370.0" height="210.0" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
<text x="610.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#be123c" text-anchor="middle" font-weight="700">4. Зв'язки ключів ядра (Kernel Keyrings)</text>
<line x1="440.0" y1="322.0" x2="780.0" y2="322.0" stroke="#e11d48" stroke-width="1.0"/>
<text x="440.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#881337" text-anchor="start"><tspan x="440.0" dy="0.0">• Секрети зберігаються всередині ядра (add_key / request_key)</tspan><tspan x="440.0" dy="15.8">• Ієрархія: Thread -&gt; Process -&gt; Session -&gt; User Keyring</tspan><tspan x="440.0" dy="15.8">• Захист від coredump (немає у віртуальній пам'яті процесу)</tspan><tspan x="440.0" dy="15.8">• Гранулярні POSIX-права (read, write, search, link)</tspan><tspan x="440.0" dy="15.8">• Автоматичне згасання секретів за таймаутом (TTL)</tspan></text>
</svg>