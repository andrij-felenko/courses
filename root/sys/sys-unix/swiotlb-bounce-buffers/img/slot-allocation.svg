<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішня структура пулу swiotlb: слоти, чанки та вирівнювання</text>
<text x="200.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура пулу io_tlb_mem</text>
<rect x="50.0" y="92.0" width="300.0" height="110.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="122.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">struct io_tlb_mem</tspan><tspan x="200.0" dy="14.3">• nslabs: загальна к-ть слотів (напр. 32768)</tspan><tspan x="200.0" dy="14.3">• areas: масив незалежних ділянок</tspan><tspan x="200.0" dy="14.3">• slots: дескриптори io_tlb_slot[]</tspan><tspan x="200.0" dy="14.3">• vaddr: віртуальна адреса пулу</tspan></text>
<text x="650.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Багатоділянкова структура (io_tlb_area)</text>
<rect x="400.0" y="92.0" width="180.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="118.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="490.0" dy="0.0">Ділянка 0 (CPU 0..3)</tspan><tspan x="490.0" dy="15.6">area-&gt;lock</tspan></text>
<rect x="600.0" y="92.0" width="180.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="690.0" y="118.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="690.0" dy="0.0">Ділянка 1 (CPU 4..7)</tspan><tspan x="690.0" dy="15.6">area-&gt;lock</tspan></text>
<rect x="800.0" y="92.0" width="180.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="890.0" y="118.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="890.0" dy="0.0">Ділянка N...</tspan><tspan x="890.0" dy="15.6">area-&gt;lock</tspan></text>
<text x="680.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Кожна ділянка має власний spinlock — зникає глобальна конкуренція ядер</text>
<text x="530.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Масив слотів неперервної фізичної пам'яті (IO_TLB_SIZE = 2048 байтів)</text>
<rect x="55.0" y="250.0" width="110.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="278.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Слот 0</tspan><tspan x="110.0" dy="15.6">[Вільний]</tspan></text>
<rect x="177.0" y="250.0" width="110.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="232.0" y="278.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="232.0" dy="0.0">Слот 1</tspan><tspan x="232.0" dy="15.6">[Зайнятий]</tspan></text>
<rect x="299.0" y="250.0" width="110.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="354.0" y="278.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="354.0" dy="0.0">Слот 2</tspan><tspan x="354.0" dy="15.6">[Зайнятий]</tspan></text>
<rect x="421.0" y="250.0" width="110.0" height="65.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="476.0" y="278.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="476.0" dy="0.0">Слот 3</tspan><tspan x="476.0" dy="15.6">[Зайнятий]</tspan></text>
<rect x="543.0" y="250.0" width="110.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="598.0" y="278.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="598.0" dy="0.0">Слот 4</tspan><tspan x="598.0" dy="15.6">[Вільний]</tspan></text>
<rect x="665.0" y="250.0" width="110.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="278.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Слот 5</tspan><tspan x="720.0" dy="15.6">[Вільний]</tspan></text>
<rect x="787.0" y="250.0" width="110.0" height="65.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="842.0" y="278.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="842.0" dy="0.0">Слот 6</tspan><tspan x="842.0" dy="15.6">[Зайнятий]</tspan></text>
<rect x="909.0" y="250.0" width="110.0" height="65.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="964.0" y="286.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="964.0" dy="0.0">Слот N...</tspan></text>
<rect x="173.0" y="246.0" width="362.0" height="73.0" rx="8" fill="none" stroke="#c0392b" stroke-width="2.0"/>
<text x="354.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Виділення на 6 КіБ (3 суміжні слоти підряд)</text>
<text x="280.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Збереження зміщення в сторінці (Alignment Mask)</text>
<rect x="50.0" y="400.0" width="460.0" height="80.0" rx="6" fill="#fdf2e9" stroke="#d35400" stroke-width="1.5"/><text x="280.0" y="420.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Оригінальний буфер: 0x2_4000_10A0 (зміщення 0x0A0)</tspan><tspan x="280.0" dy="15.6">Підмінний слот:     0x0_3800_20A0 (зміщення 0x0A0)</tspan><tspan x="280.0" dy="15.6">Зсув у межах сторінки зберігається через orig_addr &amp; align_mask,</tspan><tspan x="280.0" dy="15.6">щоб не порушити апаратне вирівнювання транзакцій пристрою</tspan></text>
<text x="780.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Метадані дескриптора io_tlb_slot</text>
<rect x="550.0" y="400.0" width="460.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="415.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">struct io_tlb_slot {</tspan><tspan x="780.0" dy="14.3">    phys_addr_t orig_addr;   /* початкова адреса */</tspan><tspan x="780.0" dy="14.3">    size_t alloc_size;       /* розмір виділення */</tspan><tspan x="780.0" dy="14.3">    unsigned int list;       /* довжина ланцюжка вільних слотів */</tspan><tspan x="780.0" dy="14.3">};</tspan></text>
<text x="530.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Дескриптори слотів відстежують вихідні адреси для точного зворотного копіювання при unmap</text>
</svg>