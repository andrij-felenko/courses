<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повний цикл відображення та синхронізації підмінного буфера</text>
<text x="280.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Передача: DMA_TO_DEVICE (CPU → Пристрій)</text>
<text x="780.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Прийом: DMA_FROM_DEVICE (Пристрій → CPU)</text>
<rect x="50.0" y="95.0" width="460.0" height="84.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="125.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">1. dma_map_single(dev, buf, len, TO_DEVICE)</tspan><tspan x="280.0" dy="15.6">Перевірка маски: буфер лежить у високій пам'яті.</tspan><tspan x="280.0" dy="15.6">Виділення N слотів у пулі swiotlb.</tspan></text>
<line x1="280.0" y1="179.0" x2="280.0" y2="205.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="205.0" width="460.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="280.0" y="235.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="280.0" dy="0.0">2. swiotlb_bounce() [memcpy]</tspan><tspan x="280.0" dy="15.6">Копіювання корисних даних із буфера buf</tspan><tspan x="280.0" dy="15.6">у виділені низькі слоти пулу swiotlb.</tspan></text>
<line x1="280.0" y1="289.0" x2="280.0" y2="315.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="315.0" width="460.0" height="84.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="280.0" y="345.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="280.0" dy="0.0">3. Пристрій виконує DMA-читання</tspan><tspan x="280.0" dy="15.6">Контролер зчитує байти з підмінного слота</tspan><tspan x="280.0" dy="15.6">через шину PCI/PCIe.</tspan></text>
<line x1="280.0" y1="399.0" x2="280.0" y2="425.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="425.0" width="460.0" height="84.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="455.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">4. dma_unmap_single(dev, dma_addr, ...)</tspan><tspan x="280.0" dy="15.6">Звільнення слотів у пулі swiotlb.</tspan><tspan x="280.0" dy="15.6">Дані в пам'яті процесора не змінюються.</tspan></text>
<rect x="550.0" y="95.0" width="460.0" height="84.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="125.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">1. dma_map_single(dev, buf, len, FROM_DEVICE)</tspan><tspan x="780.0" dy="15.6">Перевірка маски: буфер у високій пам'яті.</tspan><tspan x="780.0" dy="15.6">Виділення слотів у пулі (без початкового memcpy).</tspan></text>
<line x1="780.0" y1="179.0" x2="780.0" y2="205.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="205.0" width="460.0" height="84.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="235.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="780.0" dy="0.0">2. Пристрій виконує DMA-запис</tspan><tspan x="780.0" dy="15.6">Контролер записує прийнятий пакет чи блок</tspan><tspan x="780.0" dy="15.6">безпосередньо у низький слот swiotlb.</tspan></text>
<line x1="780.0" y1="289.0" x2="780.0" y2="315.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="315.0" width="460.0" height="84.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="345.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">3. dma_unmap_single(dev, dma_addr, ...)</tspan><tspan x="780.0" dy="15.6">Ядро виявляє операцію завершення DMA</tspan><tspan x="780.0" dy="15.6">та прапорець напрямку FROM_DEVICE.</tspan></text>
<line x1="780.0" y1="399.0" x2="780.0" y2="425.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="425.0" width="460.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="455.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="780.0" dy="0.0">4. swiotlb_bounce() [memcpy]</tspan><tspan x="780.0" dy="15.6">Копіювання прийнятих байтів зі слота swiotlb</tspan><tspan x="780.0" dy="15.6">назад в оригінальний буфер buf. Звільнення слотів.</tspan></text>
<text x="530.0" y="538.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">При передачі копіювання відбувається на стадії map, при прийомі — на стадії unmap</text>
</svg>