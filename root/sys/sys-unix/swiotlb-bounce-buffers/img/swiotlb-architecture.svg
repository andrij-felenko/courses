<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Адресація пам'яті та підмінний пул swiotlb</text>
<text x="270.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізична пам'ять (RAM 64-бітної системи)</text>
<rect x="60.0" y="95.0" width="420.0" height="155.0" rx="6" fill="#fdf2e9" stroke="#d35400" stroke-width="1.5"/>
<text x="270.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d35400" text-anchor="middle" font-weight="700">Висока пам'ять: адреси вище 4 ГБ (0x100000000+)</text>
<rect x="80.0" y="138.0" width="380.0" height="50.0" rx="6" fill="#ffffff" stroke="#d35400" stroke-width="1.5"/><text x="270.0" y="159.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Оригінальний буфер драйвера (skb / bio)</tspan><tspan x="270.0" dy="15.6">Фізична адреса: 0x2_4000_1000</tspan></text>
<text x="270.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">32-бітний контролер не може виставити біти [63:32]</text>
<line x1="50.0" y1="265.0" x2="490.0" y2="265.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="270.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Апаратна межа 32-бітної адресації (4 ГБ / 0xFFFFFFFF)</text>
<rect x="60.0" y="280.0" width="420.0" height="205.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="270.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Низька пам'ять: адреси до 4 ГБ (ZONE_DMA32)</text>
<rect x="80.0" y="320.0" width="380.0" height="72.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="270.0" dy="0.0">Пул SWIOTLB (виділено під час завантаження)</tspan><tspan x="270.0" dy="15.6">Діапазон адрес: 0x3800_0000 – 0x3C00_0000 (64 МіБ)</tspan><tspan x="270.0" dy="15.6">Слот підміни (bounce buffer): 0x3804_2000</tspan></text>
<rect x="80.0" y="404.0" width="380.0" height="64.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="270.0" y="432.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Пам'ять ядра, системні структури та стек</tspan><tspan x="270.0" dy="15.6">(0x0000_0000 – 0x37FF_FFFF)</tspan></text>
<text x="790.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний пристрій та ядро ОС</text>
<rect x="580.0" y="95.0" width="420.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="790.0" y="131.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">32-бітний пристрій (наприклад, PCI NIC / контролер)</tspan><tspan x="790.0" dy="15.6">DMA-маска: 0x00000000FFFFFFFF (32 біти)</tspan><tspan x="790.0" dy="15.6">Регістри адрес мають лише 32 розряди</tspan></text>
<rect x="580.0" y="350.0" width="420.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="790.0" y="392.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Ядро Linux: підсистема swiotlb</tspan><tspan x="790.0" dy="16.9">Виконує memcpy між високим буфером</tspan><tspan x="790.0" dy="16.9">та низьким підмінним слотом</tspan></text>
<line x1="580.0" y1="142.0" x2="465.0" y2="142.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4 4"/>
<rect x="485.0" y="120.0" width="85.0" height="24.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="527.5" y="135.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="527.5" dy="0.0">Блоковано</tspan></text>
<line x1="700.0" y1="190.0" x2="465.0" y2="340.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="550.0" y="240.0" width="160.0" height="36.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="254.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">DMA шиною</tspan><tspan x="630.0" dy="14.3">(адреса &lt; 4 ГБ)</tspan></text>
<line x1="720.0" y1="350.0" x2="465.0" y2="175.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="530.0" y="290.0" width="140.0" height="36.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">1. memcpy</tspan><tspan x="600.0" dy="13.0">(перед передачею)</tspan></text>
<line x1="465.0" y1="365.0" x2="580.0" y2="395.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="475.0" y="410.0" width="130.0" height="36.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="540.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">2. memcpy</tspan><tspan x="540.0" dy="13.0">(після прийому)</tspan></text>
<text x="530.0" y="518.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Пристрій здійснює DMA лише з низьким пулом; процесор переносить дані у високу пам'ять</text>
</svg>