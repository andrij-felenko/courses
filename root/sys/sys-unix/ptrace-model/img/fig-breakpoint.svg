<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм програмної точки зупину (Software Breakpoint)</text>
<rect x="68.5" y="33.0" width="263.0" height="34.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="200.0" y="54.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">1. Оригінальний стан пам'яті</tspan></text>
<rect x="40.0" y="80.0" width="320.0" height="160.0" rx="6" fill="#f8f9fa" stroke="#6b7280" stroke-width="1.5"/><text x="200.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Адреса      Опкоди       Інструкція</tspan><tspan x="200.0" dy="15.6">---------------------------------------</tspan><tspan x="200.0" dy="15.6">0x401120:   48 89 pt     mov %rdi, %rbp</tspan><tspan x="200.0" dy="15.6">0x401124:   e8 32 01     call exit_func</tspan><tspan x="200.0" dy="15.6">0x401127:   b8 00 00     mov $0x0, %eax</tspan></text>
<rect x="471.1" y="33.0" width="297.8" height="34.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="620.0" y="54.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">2. Встановлено Breakpoint (0xCC)</tspan></text>
<rect x="460.0" y="80.0" width="320.0" height="160.0" rx="6" fill="#fff3cd" stroke="#e67e22" stroke-width="1.5"/><text x="620.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Адреса      Опкоди       Інструкція</tspan><tspan x="620.0" dy="15.6">---------------------------------------</tspan><tspan x="620.0" dy="15.6">0x401120:   CC 89 pt     INT 3 (TRAP!)</tspan><tspan x="620.0" dy="15.6">0x401124:   e8 32 01     call exit_func</tspan><tspan x="620.0" dy="15.6">0x401127:   b8 00 00     mov $0x0, %eax</tspan></text>
<line x1="365.0" y1="160.0" x2="455.0" y2="160.0" stroke="#1b6ec2" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="410.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1b6ec2" text-anchor="middle" font-weight="700">PTRACE_POKEDATA</text>
<text x="410.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Заміна 0x48 на 0xCC</text>
<rect x="140.0" y="270.0" width="540.0" height="70.0" rx="6" fill="#e8f4f8" stroke="#1b6ec2" stroke-width="1.5"/><text x="410.0" y="302.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Покроковий відновлювальний алгоритм GDB:</tspan><tspan x="410.0" dy="11.7">1. Отримання SIGTRAP -&gt; 2. Відновлення 0x48 -&gt; 3. RIP = RIP - 1 -&gt; 4. PTRACE_SINGLESTEP -&gt; 5. Повтор 0xCC</tspan></text>
</svg>