<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трансляція sysctl ключів у файлові операції над /proc/sys</text>
<text x="620.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трансляція конфігураційного ключа sysctl у системний виклик VFS</text>
<rect x="40.0" y="75.0" width="360.0" height="400.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="220.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конфігураційний контент</text>
<rect x="60.0" y="140.0" width="320.0" height="110.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="220.0" y="172.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Файл: /etc/sysctl.d/99-custom.conf</tspan><tspan x="220.0" dy="18.2"></tspan><tspan x="220.0" dy="18.2">net.ipv4.ip_forward = 1</tspan><tspan x="220.0" dy="18.2">fs.file-max = 2097152</tspan></text>
<rect x="60.0" y="270.0" width="320.0" height="180.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="220.0" y="328.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Парсер systemd-sysctl:</tspan><tspan x="220.0" dy="18.2">1. Видаляє пробіли</tspan><tspan x="220.0" dy="18.2">2. Перетворює крапки на /</tspan><tspan x="220.0" dy="18.2">3. Додає префікс /proc/sys/</tspan><tspan x="220.0" dy="18.2">4. Обробляє маску '-'</tspan></text>
<line x1="400.0" y1="275.0" x2="470.0" y2="275.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="470.0" y="75.0" width="300.0" height="400.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="620.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Транслятор шляху</text>
<rect x="490.0" y="160.0" width="260.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="191.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Ключ: net.ipv4.ip_forward</tspan><tspan x="620.0" dy="18.2">↓</tspan><tspan x="620.0" dy="18.2">/proc/sys/net/ipv4/ip_forward</tspan></text>
<rect x="490.0" y="290.0" width="260.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="321.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Ключ: fs.file-max</tspan><tspan x="620.0" dy="18.2">↓</tspan><tspan x="620.0" dy="18.2">/proc/sys/fs/file-max</tspan></text>
<line x1="770.0" y1="275.0" x2="840.0" y2="275.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="840.0" y="75.0" width="360.0" height="400.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="1020.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Віртуальна ФС ядра (/proc)</text>
<rect x="860.0" y="160.0" width="320.0" height="90.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1020.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">open(&quot;/proc/sys/net/ipv4/ip_forward&quot;, O_WRONLY)</tspan><tspan x="1020.0" dy="14.3">write(fd, &quot;1\n&quot;, 2)</tspan></text>
<rect x="860.0" y="290.0" width="320.0" height="90.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="1020.0" y="331.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">open(&quot;/proc/sys/fs/file-max&quot;, O_WRONLY)</tspan><tspan x="1020.0" dy="16.9">write(fd, &quot;2097152\n&quot;, 8)</tspan></text>
<text x="620.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Зміна значень /proc/sys негайно змінює параметри працюючого ядра Linux</text>
</svg>