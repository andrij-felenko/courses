<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автоматична ініціалізація конфігурації при безстановому завантаженні</text>
<text x="600.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Безстанове завантаження (Stateless Boot) та ініціалізація порожнього /etc</text>
<rect x="40.0" y="75.0" width="340.0" height="380.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="210.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Початковий стан ФС</text>
<rect x="60.0" y="140.0" width="300.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="210.0" y="167.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">/usr (Read-Only)</tspan><tspan x="210.0" dy="18.2">Містить заводські шаблони:</tspan><tspan x="210.0" dy="18.2">/usr/lib/sysusers.d/*.conf</tspan><tspan x="210.0" dy="18.2">/usr/lib/sysctl.d/*.conf</tspan></text>
<rect x="60.0" y="260.0" width="300.0" height="170.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="322.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">/etc (Empty tmpfs або ext4)</tspan><tspan x="210.0" dy="18.2">Не містить /etc/passwd</tspan><tspan x="210.0" dy="18.2">Не містить /etc/group</tspan><tspan x="210.0" dy="18.2">Не містить /etc/sysctl.conf</tspan></text>
<line x1="380.0" y1="265.0" x2="440.0" y2="265.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="440.0" y="75.0" width="320.0" height="380.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="600.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ранні служби systemd</text>
<rect x="460.0" y="140.0" width="280.0" height="130.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="600.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">systemd-sysusers.service</tspan><tspan x="600.0" dy="13.0"></tspan><tspan x="600.0" dy="13.0">Зчитує /usr/lib/sysusers.d</tspan><tspan x="600.0" dy="13.0">Створює мінімальні /etc/passwd та /etc/group</tspan></text>
<rect x="460.0" y="290.0" width="280.0" height="140.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="600.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">systemd-sysctl.service</tspan><tspan x="600.0" dy="13.0"></tspan><tspan x="600.0" dy="13.0">Зчитує /usr/lib/sysctl.d</tspan><tspan x="600.0" dy="13.0">Застосовує налаштування ядра через /proc/sys</tspan></text>
<line x1="760.0" y1="265.0" x2="820.0" y2="265.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="820.0" y="75.0" width="340.0" height="380.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="990.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Готова система</text>
<rect x="840.0" y="140.0" width="300.0" height="130.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="990.0" y="182.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">Створено системні акаунти:</tspan><tspan x="990.0" dy="18.2">root:x:0:0:...</tspan><tspan x="990.0" dy="18.2">systemd-journal:x:999:...</tspan><tspan x="990.0" dy="18.2">/etc/passwd готовий до входу</tspan></text>
<rect x="840.0" y="290.0" width="300.0" height="140.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="990.0" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">Ядро налаштовано:</tspan><tspan x="990.0" dy="15.6">/proc/sys/net/... готовий</tspan><tspan x="990.0" dy="15.6">Безпечні ліміти пам'яті та ФС активовано</tspan></text>
<text x="600.0" y="485.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">Дозволяє розгортати ідентичні образи систем без збереження стану в /etc</text>
</svg>