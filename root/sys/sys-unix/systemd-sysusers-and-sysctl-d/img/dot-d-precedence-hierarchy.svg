<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1210 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1210" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія пріоритетів та затінення конфігураційних каталогів .d</text>
<text x="600.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія каталогів .d та правила перекриття (Override / Masking)</text>
<rect x="40.0" y="75.0" width="360.0" height="220.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="220.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">/etc/*.d/ (Адміністратор)</text>
<rect x="60.0" y="135.0" width="320.0" height="140.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="193.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Найвищий пріоритет.</tspan><tspan x="220.0" dy="15.6">Перекриває імені файли з /run та /usr/lib.</tspan><tspan x="220.0" dy="15.6">Симлінк на /dev/null блокує конфігурацію.</tspan></text>
<rect x="420.0" y="75.0" width="360.0" height="220.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="600.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">/run/*.d/ (Динамічний стан)</text>
<rect x="440.0" y="135.0" width="320.0" height="140.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="600.0" y="196.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Середній пріоритет.</tspan><tspan x="600.0" dy="11.7">Тимчасові конфігурації, створені під час роботи системи.</tspan><tspan x="600.0" dy="11.7">Зникає після перезавантаження.</tspan></text>
<rect x="800.0" y="75.0" width="360.0" height="220.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="980.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">/usr/lib/*.d/ (Провайдер/Пакунки)</text>
<rect x="820.0" y="135.0" width="320.0" height="140.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="980.0" y="196.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">Найнижчий пріоритет.</tspan><tspan x="980.0" dy="11.7">Заводські налаштування дистрибутива та встановлених пакетів.</tspan><tspan x="980.0" dy="11.7">Не редагується руками.</tspan></text>
<line x1="340.0" y1="315.0" x2="340.0" y2="365.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="600.0" y1="315.0" x2="600.0" y2="365.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="860.0" y1="315.0" x2="860.0" y2="365.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="370.0" width="1120.0" height="130.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="600.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм об'єднання: лексикографічне сортування за базовим ім'ям</text>
<rect x="60.0" y="420.0" width="1080.0" height="65.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="448.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">1. Збираються файли з усіх каталогів  2. Для файлів з однаковими іменами перемагає каталог із вищим пріоритетом</tspan><tspan x="600.0" dy="18.2">3. Порожній файл або посилання на /dev/null повністю маскує (блокує) параметр</tspan></text>
</svg>