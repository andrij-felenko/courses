<text x="390.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9333ea" text-anchor="middle" font-weight="700">Результат: read() повертає дані, додаток продовжує виконання</text>
