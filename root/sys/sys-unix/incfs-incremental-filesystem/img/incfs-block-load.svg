<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 787 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="787" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="60.0" width="135.0" height="200.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="87.5" y="135.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="87.5" dy="0.0">1. Читання</tspan><tspan x="87.5" dy="14.3"></tspan><tspan x="87.5" dy="14.3">Додаток викликає</tspan><tspan x="87.5" dy="14.3">read() або mmap()</tspan><tspan x="87.5" dy="14.3">на відсутній блок</tspan></text>
