<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дуальність інтерфейсу CLI: термінал користувача проти конвеєра</text>
<rect x="30.0" y="50.0" width="335.0" height="395.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="197.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">Людський вивід (Інтерактивний TTY)</text>
<line x1="45.0" y1="88.0" x2="350.0" y2="88.0" stroke="#16a34a" stroke-width="1.0"/>
<text x="45.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="start"><tspan x="45.0" dy="0.0">• Ціль: швидке сприйняття людиною</tspan><tspan x="45.0" dy="17.6">• isatty(STDOUT_FILENO) == 1 (true)</tspan><tspan x="45.0" dy="17.6">• Форматування: вирівняні стовпці, шапка</tspan><tspan x="45.0" dy="17.6">• Кольори: ANSI escape-коди (\033[32m)</tspan><tspan x="45.0" dy="17.6">• Одиниці: суфікси K/M/G (4.2G замість байтів)</tspan><tspan x="45.0" dy="17.6">• Інтерактивність: прогрес-бари (\r), пейджер</tspan><tspan x="45.0" dy="17.6">• Буферизація: рядкова (_IOLBF)</tspan></text>
<rect x="45.0" y="275.0" width="305.0" height="155.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="197.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">Приклад виводу для оператора:</text>
<text x="55.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="start"><tspan x="55.0" dy="0.0">NAME    SIZE  TYPE MOUNTPOINT</tspan><tspan x="55.0" dy="14.0">sda     1.8T  disk</tspan><tspan x="55.0" dy="14.0">├─sda1  512M  part /boot/efi</tspan><tspan x="55.0" dy="14.0">└─sda2  1.8T  part /</tspan><tspan x="55.0" dy="14.0">Зручно для очей, але ламає парсери</tspan></text>
<rect x="395.0" y="50.0" width="335.0" height="395.0" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
<text x="562.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0369a1" text-anchor="middle" font-weight="700">Машинний вивід (Конвеєр / Скрипт)</text>
<line x1="410.0" y1="88.0" x2="715.0" y2="88.0" stroke="#0284c7" stroke-width="1.0"/>
<text x="410.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0c4a6e" text-anchor="start"><tspan x="410.0" dy="0.0">• Ціль: стабільний автоматичний парсинг</tspan><tspan x="410.0" dy="17.6">• isatty(STDOUT_FILENO) == 0 (pipe/file)</tspan><tspan x="410.0" dy="17.6">• Форматування: JSON, TSV або NUL-розділювачі</tspan><tspan x="410.0" dy="17.6">• Чистота: без ANSI-кодів та пейджерів</tspan><tspan x="410.0" dy="17.6">• Точність: сирі цілі числа (1932735283200)</tspan><tspan x="410.0" dy="17.6">• Заголовки: відсутні (--no-heading)</tspan><tspan x="410.0" dy="17.6">• Буферизація: повна блокова (_IOFBF, 4KB)</tspan></text>
<rect x="410.0" y="275.0" width="305.0" height="155.0" rx="6" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.0"/>
<text x="562.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle" font-weight="700">Приклад виводу для скриптів (JSON / TSV):</text>
<text x="420.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="start"><tspan x="420.0" dy="0.0">{&quot;blockdevices&quot;: [</tspan><tspan x="420.0" dy="12.8">  {&quot;name&quot;: &quot;sda&quot;, &quot;size&quot;: 1932735283200},</tspan><tspan x="420.0" dy="12.8">  {&quot;name&quot;: &quot;sda1&quot;, &quot;size&quot;: 536870912},</tspan><tspan x="420.0" dy="12.8">  {&quot;name&quot;: &quot;sda2&quot;, &quot;size&quot;: 1932198412288}</tspan><tspan x="420.0" dy="12.8">]}</tspan><tspan x="420.0" dy="12.8">Детерміновано, типобезпечно, стабільно</tspan></text>
</svg>