<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм визначення типу пристрою: isatty() у просторі ядра та користувача</text>
<rect x="30.0" y="50.0" width="700.0" height="95.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="380.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="700">Простір користувача (libc / Програма)</text>
<rect x="50.0" y="85.0" width="310.0" height="45.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.0"/>
<text x="205.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">isatty(STDOUT_FILENO)</text>
<line x1="360.0" y1="107.0" x2="420.0" y2="107.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="420.0" y="85.0" width="290.0" height="45.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.0"/>
<text x="565.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">ioctl(1, TCGETS, &amp;termios)</text>
<line x1="30.0" y1="160.0" x2="730.0" y2="160.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="380.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-style="italic">Межа системного виклику (Trap / Syscall)</text>
<rect x="30.0" y="190.0" width="700.0" height="120.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="380.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#9a3412" text-anchor="middle" font-weight="700">Ядро Linux: VFS та драйвери пристроїв</text>
<rect x="50.0" y="230.0" width="310.0" height="65.0" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.0"/>
<text x="205.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9a3412" text-anchor="middle" font-weight="700">Файловий дескриптор fd=1</text>
<text x="205.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c2d12" text-anchor="middle">struct file -&gt; f_op-&gt;unlocked_ioctl()</text>
<rect x="420.0" y="230.0" width="290.0" height="65.0" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.0"/>
<text x="565.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9a3412" text-anchor="middle" font-weight="700">Перевірка обробника TCGETS</text>
<text x="565.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c2d12" text-anchor="middle">Чи підтримує файл операції термінала?</text>
<line x1="205.0" y1="295.0" x2="205.0" y2="345.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="565.0" y1="295.0" x2="565.0" y2="345.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="345.0" width="330.0" height="115.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="205.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">Пристрій: /dev/pts/* або /dev/tty*</text>
<text x="205.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle"><tspan x="205.0" dy="0.0">Результат ioctl: 0 (Успіх)</tspan><tspan x="205.0" dy="14.7">libc повертає isatty() == 1</tspan><tspan x="205.0" dy="14.7">Дія: вмикаємо ANSI кольори, таблиці, пейджер</tspan></text>
<rect x="390.0" y="345.0" width="330.0" height="115.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="555.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">Пристрій: pipe, socket, регулярний файл</text>
<text x="555.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle"><tspan x="555.0" dy="0.0">Результат ioctl: -1 (errno = ENOTTY)</tspan><tspan x="555.0" dy="14.7">libc повертає isatty() == 0</tspan><tspan x="555.0" dy="14.7">Дія: чистий потік даних, JSON/TSV, без ANSI</tspan></text>
</svg>