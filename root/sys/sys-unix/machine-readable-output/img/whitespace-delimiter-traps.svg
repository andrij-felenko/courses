<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастки розділювачів у конвеєрі Unix: пробіли, нові рядки та NUL-байт</text>
<rect x="30.0" y="50.0" width="700.0" height="175.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="380.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">1. Небезпечний конвеєр: поділ за пробілами та переносом рядка (IFS)</text>
<rect x="50.0" y="88.0" width="300.0" height="50.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.0"/>
<text x="200.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="700">Вхідні файли на диску:</text>
<text x="200.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle">&quot;report 2026.pdf&quot;  та  &quot;backup\nrm.sh&quot;</text>
<line x1="350.0" y1="113.0" x2="400.0" y2="113.0" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="400.0" y="88.0" width="310.0" height="50.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.0"/>
<text x="555.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="700">Команда: for f in $(ls); do ...</text>
<text x="555.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">Оболонка розбиває рядок за $IFS (пробіл, табуляція, \n)</text>
<rect x="50.0" y="150.0" width="660.0" height="60.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.0"/>
<text x="380.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">Результат: файл розрізано на 4 фальшивих аргументи: 'report', '2026.pdf', 'backup', 'rm.sh'</text>
<text x="380.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">Скрипт видаляє або перезаписує випадкові файли, виникає критична помилка автоматизації</text>
<rect x="30.0" y="245.0" width="700.0" height="185.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="380.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#15803d" text-anchor="middle" font-weight="700">2. Надійний машинний конвеєр: нульовий байт (NUL / \0) як атомарна межа</text>
<rect x="50.0" y="285.0" width="300.0" height="55.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="200.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle" font-weight="700">Потік виводу find / git -z:</text>
<text x="200.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle">report 2026.pdf\0backup\nrm.sh\0</text>
<line x1="350.0" y1="312.0" x2="400.0" y2="312.0" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="400.0" y="285.0" width="310.0" height="55.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="555.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle" font-weight="700">Обробка: xargs -0 / read -d ''</text>
<text x="555.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="middle">Байт \0 заборонений у шляхах POSIX (стабільна межа)</text>
<rect x="50.0" y="355.0" width="660.0" height="60.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.0"/>
<text x="380.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">Результат: рівно 2 непорушні елементи з оригінальними пробілами та переносами</text>
<text x="380.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Гарантія безпеки: жоден спецсимвол у назві об'єкта не ламає логіку обробки</text>
</svg>