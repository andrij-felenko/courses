<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1350 840" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1350" height="840" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="670.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Байти модуля на об'єкті ядра: як каркас ділить одне поле між усіма</text>
<text x="340.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">що кожен модуль просить на старті</text>
<rect x="70.0" y="92.0" width="200.0" height="86.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="140.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">selinux</tspan></text>
<rect x="278.0" y="92.0" width="190.0" height="86.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="373.0" y="139.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="373.0" dy="0.0">lbs_inode = 16</tspan></text>
<rect x="476.0" y="92.0" width="320.0" height="86.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="636.0" y="139.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="636.0" dy="0.0">мітка контексту</tspan></text>
<rect x="70.0" y="192.0" width="200.0" height="86.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="170.0" y="240.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">landlock</tspan></text>
<rect x="278.0" y="192.0" width="190.0" height="86.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="373.0" y="239.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="373.0" dy="0.0">lbs_inode = 8</tspan></text>
<rect x="476.0" y="192.0" width="320.0" height="86.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="636.0" y="239.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="636.0" dy="0.0">посилання на правило</tspan></text>
<rect x="70.0" y="292.0" width="200.0" height="86.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="170.0" y="340.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">apparmor</tspan></text>
<rect x="278.0" y="292.0" width="190.0" height="86.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="373.0" y="339.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="373.0" dy="0.0">lbs_inode = 0</tspan></text>
<rect x="476.0" y="292.0" width="320.0" height="86.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="636.0" y="339.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="636.0" dy="0.0">судить за шляхом, на inode не пише</tspan></text>
<line x1="430.0" y1="396.0" x2="430.0" y2="452.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="700.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">каркас додає докупи й роздає зсуви</text>
<rect x="70.0" y="452.0" width="726.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="433.0" y="494.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="433.0" dy="0.0">blob_sizes.lbs_inode = sizeof(rcu_head) + 16 + 8 = 40 байтів</tspan></text>
<rect x="70.0" y="578.0" width="300.0" height="100.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="623.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">struct inode</tspan><tspan x="220.0" dy="20.8">i_security</tspan></text>
<line x1="370.0" y1="628.0" x2="452.0" y2="628.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="880.0" y="566.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">одне виділення на весь об'єкт</text>
<rect x="452.0" y="588.0" width="190.0" height="90.0" rx="6" fill="#eeeeee" stroke="#6b7280" stroke-width="1.5"/><text x="547.0" y="628.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="547.0" dy="0.0">службовий</tspan><tspan x="547.0" dy="18.2">rcu_head</tspan></text>
<rect x="648.0" y="588.0" width="220.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="758.0" y="628.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="758.0" dy="0.0">selinux</tspan><tspan x="758.0" dy="18.2">зсув 16</tspan></text>
<rect x="874.0" y="588.0" width="230.0" height="90.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="989.0" y="628.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="989.0" dy="0.0">landlock</tspan><tspan x="989.0" dy="18.2">зсув 32</tspan></text>
<rect x="452.0" y="700.0" width="646.0" height="96.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="775.0" y="734.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">кожен модуль читає свої байти за власним зсувом,</tspan><tspan x="775.0" dy="18.2">порахованим один раз на завантаженні системи;</tspan><tspan x="775.0" dy="18.2">сусіда він не бачить і не заважає йому</tspan></text>
<rect x="880.0" y="92.0" width="420.0" height="190.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1090.0" y="140.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1090.0" dy="0.0">як було до цього</tspan><tspan x="1090.0" dy="16.9"></tspan><tspan x="1090.0" dy="16.9">поле i_security виділяв і володів ним</tspan><tspan x="1090.0" dy="16.9">сам модуль. другому модулеві</tspan><tspan x="1090.0" dy="16.9">покласти туди своє було нікуди —</tspan><tspan x="1090.0" dy="16.9">звідси й правило «один модуль</tspan><tspan x="1090.0" dy="16.9">на всю машину»</tspan></text>
<rect x="880.0" y="302.0" width="420.0" height="170.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1090.0" y="349.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1090.0" dy="0.0">полів таких кільканадцять:</tspan><tspan x="1090.0" dy="16.9">cred, file, inode, sock, task,</tspan><tspan x="1090.0" dy="16.9">superblock, key, msg_msg,</tspan><tspan x="1090.0" dy="16.9">perf_event, tun_dev, bdev —</tspan><tspan x="1090.0" dy="16.9">по одному на рід об'єкта,</tspan><tspan x="1090.0" dy="16.9">яким цікавляться модулі</tspan></text>
</svg>