<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1390 870" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1390" height="870" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="690.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від записів у образі до живого списку модулів</text>
<text x="300.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. записи, зібрані з образу ядра</text>
<rect x="70.0" y="84.0" width="460.0" height="176.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="140.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">секція .lsm_info.init</tspan><tspan x="300.0" dy="18.2">кожен DEFINE_LSM(...) поклав сюди</tspan><tspan x="300.0" dy="18.2">свій запис на етапі збірки:</tspan><tspan x="300.0" dy="18.2">ім'я, функція init, потрібні байти,</tspan><tspan x="300.0" dy="18.2">місце в черзі, прапорці</tspan></text>
<line x1="300.0" y1="260.0" x2="300.0" y2="314.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="300.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle" font-weight="700">2. порядок задає текстовий рядок</text>
<rect x="70.0" y="314.0" width="460.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="365.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">CONFIG_LSM з образу, а якщо в командному</tspan><tspan x="300.0" dy="18.2">рядку є lsm= — то він, і CONFIG_LSM</tspan><tspan x="300.0" dy="18.2">не діє взагалі</tspan></text>
<rect x="70.0" y="466.0" width="460.0" height="90.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="300.0" y="515.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">lsm=landlock,yama,integrity,apparmor,selinux,bpf</tspan></text>
<line x1="300.0" y1="556.0" x2="300.0" y2="610.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="70.0" y="610.0" width="460.0" height="160.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="300.0" y="667.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">два місця в черзі не обговорюються:</tspan><tspan x="300.0" dy="18.2"></tspan><tspan x="300.0" dy="18.2">capability — завжди перший</tspan><tspan x="300.0" dy="18.2">integrity — завжди останній</tspan></text>
<text x="950.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. що з цього справді увімкнеться</text>
<rect x="700.0" y="84.0" width="230.0" height="66.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="815.0" y="122.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">capability</tspan></text>
<rect x="938.0" y="84.0" width="370.0" height="66.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="1123.0" y="121.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1123.0" dy="0.0">перший за приписом</tspan></text>
<rect x="700.0" y="162.0" width="230.0" height="66.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="815.0" y="200.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">landlock</tspan></text>
<rect x="938.0" y="162.0" width="370.0" height="66.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="1123.0" y="199.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1123.0" dy="0.0">увімкнено</tspan></text>
<rect x="700.0" y="240.0" width="230.0" height="66.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="815.0" y="278.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">yama</tspan></text>
<rect x="938.0" y="240.0" width="370.0" height="66.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="1123.0" y="277.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1123.0" dy="0.0">увімкнено</tspan></text>
<rect x="700.0" y="318.0" width="230.0" height="66.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="815.0" y="356.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">apparmor</tspan></text>
<rect x="938.0" y="318.0" width="370.0" height="66.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="1123.0" y="355.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1123.0" dy="0.0">перший виключний → взято</tspan></text>
<rect x="700.0" y="396.0" width="230.0" height="66.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="815.0" y="434.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">selinux</tspan></text>
<rect x="938.0" y="396.0" width="370.0" height="66.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="1123.0" y="433.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1123.0" dy="0.0">виключний уже є → вимкнено</tspan></text>
<rect x="700.0" y="474.0" width="230.0" height="66.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="815.0" y="512.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">bpf</tspan></text>
<rect x="938.0" y="474.0" width="370.0" height="66.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="1123.0" y="511.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1123.0" dy="0.0">увімкнено</tspan></text>
<rect x="700.0" y="552.0" width="230.0" height="66.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="815.0" y="590.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">integrity</tspan></text>
<rect x="938.0" y="552.0" width="370.0" height="66.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="1123.0" y="589.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1123.0" dy="0.0">останній за приписом</tspan></text>
<rect x="700.0" y="640.0" width="608.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1004.0" y="675.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1004.0" dy="0.0">виключними оголошені selinux, apparmor і smack:</tspan><tspan x="1004.0" dy="16.9">усі троє претендують на ті самі поверхні назовні —</tspan><tspan x="1004.0" dy="16.9">/proc/self/attr, атрибути security.*, поля аудиту</tspan></text>
<rect x="700.0" y="756.0" width="608.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1004.0" y="793.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1004.0" dy="0.0">підсумок видно живим:</tspan><tspan x="1004.0" dy="18.2">cat /sys/kernel/security/lsm</tspan></text>
</svg>