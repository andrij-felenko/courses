<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1290 890" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1290" height="890" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Програма замінює тіло заглушки, а не гніздо в ланцюзі</text>
<rect x="60.0" y="40.0" width="560.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="340.0" y="75.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">security_socket_create(family, type, …)</tspan></text>
<line x1="340.0" y1="100.0" x2="340.0" y2="138.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="138.0" width="170.0" height="74.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="145.0" y="170.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">capability</tspan><tspan x="145.0" dy="18.2">0 → далі</tspan></text>
<line x1="230.0" y1="175.0" x2="258.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="258.0" y="138.0" width="170.0" height="74.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="343.0" y="170.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="343.0" dy="0.0">apparmor</tspan><tspan x="343.0" dy="18.2">0 → далі</tspan></text>
<line x1="428.0" y1="175.0" x2="456.0" y2="175.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="456.0" y="138.0" width="180.0" height="74.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="546.0" y="180.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="546.0" dy="0.0">гніздо bpf</tspan></text>
<rect x="700.0" y="130.0" width="520.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="960.0" y="171.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">у ланцюзі стоїть не програма, а модуль bpf —</tspan><tspan x="960.0" dy="16.9">завжди, на всіх 268 гачках</tspan></text>
<line x1="546.0" y1="212.0" x2="546.0" y2="258.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="258.0" width="480.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="299.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="540.0" dy="0.0">bpf_lsm_socket_create(…)</tspan><tspan x="540.0" dy="20.8">{ return 0; }</tspan></text>
<rect x="820.0" y="250.0" width="400.0" height="108.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1020.0" y="291.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1020.0" dy="0.0">таку заглушку ядро генерує</tspan><tspan x="1020.0" dy="16.9">на кожен гачок: noinline,</tspan><tspan x="1020.0" dy="16.9">повертає типове значення</tspan></text>
<line x1="430.0" y1="350.0" x2="300.0" y2="404.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="650.0" y1="350.0" x2="800.0" y2="404.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="404.0" width="440.0" height="116.0" rx="6" fill="#eeeeee" stroke="#6b7280" stroke-width="1.5"/><text x="280.0" y="448.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">нічого не причеплено</tspan><tspan x="280.0" dy="18.2">статичний ключ вимкнено: заглушка</tspan><tspan x="280.0" dy="18.2">коштує стільки ж, скільки «return 0»</tspan></text>
<rect x="640.0" y="404.0" width="580.0" height="116.0" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1.5"/><text x="930.0" y="448.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">програму причеплено</tspan><tspan x="930.0" dy="18.2">точку входу заглушки залатано трампліном —</tspan><tspan x="930.0" dy="18.2">тим самим, що обслуговує fentry/fexit</tspan></text>
<line x1="930.0" y1="520.0" x2="930.0" y2="570.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="570.0" width="580.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="930.0" y="610.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="930.0" dy="0.0">SEC(&quot;lsm/socket_create&quot;)</tspan><tspan x="930.0" dy="19.5">cgroup у мапі, family ≠ AF_UNIX</tspan><tspan x="930.0" dy="19.5">→ return -EPERM</tspan></text>
<line x1="930.0" y1="680.0" x2="930.0" y2="726.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="726.0" width="580.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="930.0" y="769.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">−EPERM стає значенням заглушки,</tspan><tspan x="930.0" dy="18.2">тобто відповіддю гнізда bpf і всього ланцюга</tspan></text>
<rect x="60.0" y="690.0" width="440.0" height="132.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="733.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">у програмі, що просила сокет:</tspan><tspan x="280.0" dy="18.2">socket(AF_INET, SOCK_STREAM, 0) = −1,</tspan><tspan x="280.0" dy="18.2">errno = EPERM.</tspan><tspan x="280.0" dy="18.2">AF_UNIX і файли — без змін</tspan></text>
</svg>