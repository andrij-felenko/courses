<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="210.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">заголовок — індекси</text>
<text x="610.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">тіло — самі байти</text>
<rect x="40.0" y="110.0" width="170.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="125.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">head</tspan><tspan x="125.0" dy="15.6">(куди пишуть)</tspan><tspan x="125.0" dy="15.6">64 байти</tspan></text>
<rect x="210.0" y="110.0" width="170.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="295.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">tail</tspan><tspan x="295.0" dy="15.6">(звідки читають)</tspan><tspan x="295.0" dy="15.6">64 байти</tspan></text>
<rect x="380.0" y="110.0" width="460.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">кільце даних (степінь двійки байтів)</tspan></text>
<rect x="101.1" y="213.4" width="197.8" height="63.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="233.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">кожен індекс — у власній</tspan><tspan x="200.0" dy="15.6">кеш-лінії, інакше два ядра</tspan><tspan x="200.0" dy="15.6">б'ються за одну лінію</tspan></text>
<rect x="513.7" y="213.4" width="252.6" height="63.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="233.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">усередині — лише зсуви від початку</tspan><tspan x="640.0" dy="15.6">відображення: чужий вказівник</tspan><tspan x="640.0" dy="15.6">тут не означає нічого</tspan></text>
</svg>