<rect x="546.0" y="74.0" width="300.0" height="34.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="696.0" y="95.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="696.0" dy="0.0">sp[0]</tspan></text>
<rect x="546.0" y="112.0" width="300.0" height="148.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="696.0" y="182.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="696.0" dy="0.0">argv = (char **)(sp + 1)</tspan><tspan x="696.0" dy="16.9">масив вказівників, кінець — NULL</tspan></text>
<rect x="546.0" y="264.0" width="300.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="696.0" y="315.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="696.0" dy="0.0">envp = argv + argc + 1</tspan><tspan x="696.0" dy="16.9">той самий формат, одразу за NULL</tspan></text>
<rect x="546.0" y="378.0" width="300.0" height="110.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/><text x="696.0" y="420.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="696.0" dy="0.0">auxv — пари від ядра:</tspan><tspan x="696.0" dy="16.9">адреса vDSO, розмір сторінки,</tspan><tspan x="696.0" dy="16.9">дійсні UID і GID</tspan></text>
<rect x="90.0" y="518.0" width="760.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="542.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Адреси повернення на стеку немає: ядро не викликало програму, а стрибнуло на точку входу.</tspan><tspan x="470.0" dy="16.9">Тому _start не може бути звичайною функцією C — компілятор поставив би їй пролог і ret,</tspan><tspan x="470.0" dy="16.9">а повертатися нікуди. Розібрати цей стек також нема кому: argv і envp тут просто числа.</tspan></text>
</svg>