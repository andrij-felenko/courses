<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="80.0" width="290.0" height="104.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="137.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">вузьке коло</tspan></text>
<line x1="344.0" y1="132.0" x2="366.0" y2="132.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="380.0" y="80.0" width="480.0" height="104.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="127.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">маска будується за правдою:</tspan><tspan x="620.0" dy="18.2">лише ті ядра, яких дія стосується</tspan></text>
<line x1="874.0" y1="132.0" x2="906.0" y2="132.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="920.0" y="80.0" width="340.0" height="104.0" rx="6" fill="#eef0f2" stroke="#333333" stroke-width="1.5"/><text x="1090.0" y="127.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1090.0" dy="0.0">з 64 ядер —</tspan><tspan x="1090.0" dy="18.2">три переривання</tspan></text>
<rect x="40.0" y="240.0" width="290.0" height="104.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="297.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">згруповані запити</tspan></text>
<line x1="344.0" y1="292.0" x2="366.0" y2="292.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="380.0" y="240.0" width="480.0" height="104.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="287.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">черга цілі не порожня, отже</tspan><tspan x="620.0" dy="18.2">дзвінок уже в дорозі</tspan></text>
<line x1="874.0" y1="292.0" x2="906.0" y2="292.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="920.0" y="240.0" width="340.0" height="104.0" rx="6" fill="#eef0f2" stroke="#333333" stroke-width="1.5"/><text x="1090.0" y="287.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1090.0" dy="0.0">другий запит їде</tspan><tspan x="1090.0" dy="18.2">тим самим перериванням</tspan></text>
<rect x="40.0" y="400.0" width="290.0" height="104.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="185.0" y="457.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">ціль слухає сама</tspan></text>
<line x1="344.0" y1="452.0" x2="366.0" y2="452.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="380.0" y="400.0" width="480.0" height="104.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="447.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">ядро простоює в циклі, що стежить</tspan><tspan x="620.0" dy="18.2">за прапорцем у пам'яті</tspan></text>
<line x1="874.0" y1="452.0" x2="906.0" y2="452.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="920.0" y="400.0" width="340.0" height="104.0" rx="6" fill="#eef0f2" stroke="#333333" stroke-width="1.5"/><text x="1090.0" y="447.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1090.0" dy="0.0">ставимо прапорець —</tspan><tspan x="1090.0" dy="18.2">переривань нуль</tspan></text>
<line x1="40.0" y1="566.0" x2="1260.0" y2="566.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="40.0" y="596.0" width="1220.0" height="76.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="639.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">зворотний бік: щоб розбудити задачу на чужому ядрі, одне переривання дешевше за похід по чужий замок</tspan></text>
</svg>