<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1330 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1330" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="80.0" width="250.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="133.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">перепланування</tspan></text>
<rect x="330.0" y="80.0" width="300.0" height="96.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="123.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">вектор 0xfd —</tspan><tspan x="480.0" dy="18.2">це все повідомлення</tspan></text>
<line x1="644.0" y1="128.0" x2="676.0" y2="128.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="690.0" y="80.0" width="300.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="840.0" y="123.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">що робити, ціль дізнається</tspan><tspan x="840.0" dy="18.2">зі своєї черги виконання</tspan></text>
<line x1="1004.0" y1="128.0" x2="1036.0" y2="128.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1050.0" y="80.0" width="230.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1165.0" y="124.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1165.0" dy="0.0">зміна задачі —</tspan><tspan x="1165.0" dy="16.9">на виході з переривання</tspan></text>
<text x="805.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">ані вставки в чергу, ані прапорця, ані очікування</text>
<rect x="40.0" y="300.0" width="250.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="353.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">виклик функції</tspan></text>
<rect x="330.0" y="300.0" width="300.0" height="96.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="343.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">вектор 0xfb —</tspan><tspan x="480.0" dy="18.2">«глянь у свою чергу»</tspan></text>
<line x1="644.0" y1="348.0" x2="676.0" y2="348.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="690.0" y="300.0" width="300.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="840.0" y="344.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">у пам'яті: вказівник на функцію,</tspan><tspan x="840.0" dy="16.9">аргумент, прапорець</tspan></text>
<line x1="1004.0" y1="348.0" x2="1036.0" y2="348.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="1050.0" y="300.0" width="230.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1165.0" y="344.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1165.0" dy="0.0">ціль вичерпує</tspan><tspan x="1165.0" dy="16.9">увесь список</tspan></text>
<text x="805.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">універсально — і рівно тому дорожче</text>
</svg>