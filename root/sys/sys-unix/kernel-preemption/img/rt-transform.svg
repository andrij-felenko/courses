<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="280.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">звичайне ядро (PREEMPT)</text>
<text x="790.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">PREEMPT_RT</text>
<rect x="40.0" y="100.0" width="480.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">spinlock_t: чекають, крутячись;</tspan><tspan x="280.0" dy="16.9">витіснення на цьому ядрі вимкнене</tspan></text>
<line x1="534.0" y1="132.0" x2="590.0" y2="132.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="600.0" y="100.0" width="390.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="795.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">сплячий замок: чекання — це сон,</tspan><tspan x="795.0" dy="16.9">з успадкуванням пріоритету</tspan></text>
<rect x="40.0" y="188.0" width="480.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="216.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">обробник переривання виконується</tspan><tspan x="280.0" dy="16.9">одразу, у контексті переривання</tspan></text>
<line x1="534.0" y1="220.0" x2="590.0" y2="220.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="600.0" y="188.0" width="390.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="795.0" y="216.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">обробник — потік ядра</tspan><tspan x="795.0" dy="16.9">зі своїм пріоритетом</tspan></text>
<rect x="40.0" y="276.0" width="480.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="304.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">softirq виконується на виході</tspan><tspan x="280.0" dy="16.9">з переривання, витіснити не можна</tspan></text>
<line x1="534.0" y1="308.0" x2="590.0" y2="308.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="600.0" y="276.0" width="390.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="795.0" y="304.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">softirq — у потоці,</tspan><tspan x="795.0" dy="16.9">витісняється як усе інше</tspan></text>
<rect x="40.0" y="364.0" width="480.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="280.0" y="400.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">raw_spinlock_t — рідкісний виняток</tspan></text>
<line x1="534.0" y1="396.0" x2="590.0" y2="396.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="600.0" y="364.0" width="390.0" height="64.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="795.0" y="392.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">raw_spinlock_t — без змін:</tspan><tspan x="795.0" dy="16.9">тут витіснення заборонене й далі</tspan></text>
<rect x="40.0" y="442.0" width="950.0" height="58.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/><text x="515.0" y="467.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">Незмінним лишається крихітне ядро заборони: NMI, вхід у переривання, сам планувальник, raw_spinlock.</tspan><tspan x="515.0" dy="15.6">Саме ці ділянки й задають нижню межу затримки, яку не подолати вже нічим.</tspan></text>
</svg>