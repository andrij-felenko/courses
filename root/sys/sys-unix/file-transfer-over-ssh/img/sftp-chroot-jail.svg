<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ізоляція користувача SFTP через ChrootDirectory та internal-sftp</text>
<text x="570.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ізоляція користувача SFTP за допомогою ChrootDirectory та internal-sftp</text>
<rect x="50.0" y="90.0" width="280.0" height="460.0" rx="6" fill="#f8faff" stroke="#2457d6" stroke-width="1.5"/>
<text x="190.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Зовнішній клієнт SFTP</text>
<rect x="70.0" y="155.0" width="240.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="177.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Автентифікація:</tspan><tspan x="190.0" dy="16.9">SSH-ключ або пароль</tspan><tspan x="190.0" dy="16.9">User: sftpuser</tspan></text>
<rect x="70.0" y="245.0" width="240.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="267.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Канал сеансу:</tspan><tspan x="190.0" dy="16.9">Запит підсистеми 'sftp'</tspan><tspan x="190.0" dy="16.9">без запиту PTY/оболонки</tspan></text>
<line x1="330.0" y1="280.0" x2="420.0" y2="280.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="375.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">SSH</text>
<rect x="420.0" y="90.0" width="670.0" height="460.0" rx="6" fill="#fafbfc" stroke="#333333" stroke-width="1.5"/>
<text x="755.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сервер sshd (хост)</text>
<rect x="450.0" y="155.0" width="610.0" height="75.0" rx="6" fill="#fdf0ed" stroke="#c0392b" stroke-width="1.5"/><text x="755.0" y="180.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="755.0" dy="0.0">Правило безпеки sshd:</tspan><tspan x="755.0" dy="16.9">Каталог ChrootDirectory і всі його батьківські каталоги</tspan><tspan x="755.0" dy="16.9">повинні належати root:root і мати права не більше ніж 0755</tspan></text>
<rect x="450.0" y="255.0" width="610.0" height="275.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
<text x="755.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Ізольоване дерево ChrootDirectory: /var/sftp/sftpuser (для процесу це «/»)</text>
<rect x="470.0" y="310.0" width="280.0" height="200.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="610.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Корінь jail: /</text>
<text x="610.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Власник: root:root</text>
<text x="610.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Права: drwxr-xr-x (0755)</text>
<rect x="485.0" y="415.0" width="250.0" height="75.0" rx="6" fill="#fdf2f0" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="441.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Запис заборонено!</tspan><tspan x="610.0" dy="15.6">Захист від підміни</tspan><tspan x="610.0" dy="15.6">динамічних бібліотек і конфігів</tspan></text>
<rect x="770.0" y="310.0" width="270.0" height="200.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="905.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Підкаталог: /uploads</text>
<text x="905.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Власник: sftpuser:sftpusers</text>
<text x="905.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Права: drwxr-xr-x (0755/0775)</text>
<rect x="785.0" y="415.0" width="240.0" height="75.0" rx="6" fill="#eef7f0" stroke="#333333" stroke-width="1.5"/><text x="905.0" y="441.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="905.0" dy="0.0">Запис дозволено:</tspan><tspan x="905.0" dy="15.6">Клієнт може завантажувати</tspan><tspan x="905.0" dy="15.6">і читати файли тут</tspan></text>
</svg>