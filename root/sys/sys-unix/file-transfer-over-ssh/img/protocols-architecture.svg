<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння архітектури передачі файлів через SSH: SCP, SFTP та Rsync</text>
<text x="590.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура транспорту та виконання процесів при передачі файлів через SSH</text>
<rect x="40.0" y="70.0" width="340.0" height="560.0" rx="6" fill="#fffaf9" stroke="#c0392b" stroke-width="1.5"/>
<text x="210.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Класичний SCP (RCP)</text>
<text x="210.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ssh remote &quot;scp -t /path&quot;</text>
<rect x="114.8" y="150.1" width="190.4" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="171.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Клієнт scp</tspan><tspan x="210.0" dy="16.9">(парсить аргументи CLI)</tspan></text>
<line x1="210.0" y1="205.0" x2="210.0" y2="245.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="96.3" y="250.1" width="227.5" height="49.9" rx="6" fill="#fdf0ed" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="271.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">SSH-канал сеансу</tspan><tspan x="210.0" dy="16.9">(віддалений запуск оболонки)</tspan></text>
<line x1="210.0" y1="305.0" x2="210.0" y2="345.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="100.0" y="350.1" width="220.1" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="371.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Віддалена оболонка</tspan><tspan x="210.0" dy="16.9">(/bin/sh -c &quot;scp -t /path&quot;)</tspan></text>
<line x1="210.0" y1="405.0" x2="210.0" y2="445.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="117.9" y="453.4" width="184.2" height="63.2" rx="6" fill="#fbebe8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="473.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Потоковий протокол RCP</tspan><tspan x="210.0" dy="15.6">C0644 &lt;size&gt; &lt;name&gt;\n</tspan><tspan x="210.0" dy="15.6">[сирі байти без фреймів]</tspan></text>
<rect x="60.0" y="550.0" width="300.0" height="60.0" rx="6" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="576.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Вразливості: розкриття масок оболонкою</tspan><tspan x="210.0" dy="15.6">і підміна файлів клієнта (CVE-2019-6111)</tspan></text>
<rect x="420.0" y="70.0" width="340.0" height="560.0" rx="6" fill="#f8faff" stroke="#2457d6" stroke-width="1.5"/>
<text x="590.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Підсистема SFTP (OpenSSH)</text>
<text x="590.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">SSH Subsystem sftp / internal-sftp</text>
<rect x="487.4" y="150.1" width="205.2" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="171.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Клієнт sftp / scp (v9.0+)</tspan><tspan x="590.0" dy="16.9">(структуровані запити)</tspan></text>
<line x1="590.0" y1="205.0" x2="590.0" y2="245.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="487.4" y="250.1" width="205.2" height="49.9" rx="6" fill="#edf3fd" stroke="#2457d6" stroke-width="1.5"/><text x="590.0" y="271.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">SSH-канал підсистеми</tspan><tspan x="590.0" dy="16.9">(SSH_MSG_CHANNEL_REQUEST)</tspan></text>
<line x1="590.0" y1="305.0" x2="590.0" y2="345.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="502.2" y="350.1" width="175.6" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="371.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">internal-sftp у sshd</tspan><tspan x="590.0" dy="16.9">(без запуску /bin/sh)</tspan></text>
<line x1="590.0" y1="405.0" x2="590.0" y2="445.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="494.5" y="453.4" width="191.0" height="63.2" rx="6" fill="#eaf0fa" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="473.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Бінарний протокол SFTP</tspan><tspan x="590.0" dy="15.6">[len][type][id][payload]</tspan><tspan x="590.0" dy="15.6">SSH_FXP_OPEN, READ, WRITE</tspan></text>
<rect x="440.0" y="550.0" width="300.0" height="60.0" rx="6" fill="#edf3fd" stroke="#2457d6" stroke-width="1.5"/><text x="590.0" y="576.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Безпека: довільний доступ за зміщенням,</tspan><tspan x="590.0" dy="15.6">ізоляція ChrootDirectory, без оболонки</tspan></text>
<rect x="800.0" y="70.0" width="340.0" height="560.0" rx="6" fill="#f7fbf8" stroke="#27ae60" stroke-width="1.5"/>
<text x="970.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Дельта-синхронізація Rsync</text>
<text x="970.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ssh remote &quot;rsync --server ...&quot;</text>
<rect x="856.3" y="150.1" width="227.5" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="171.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">Локальний rsync (Sender)</tspan><tspan x="970.0" dy="16.9">(ковзне вікно + хеш-таблиця)</tspan></text>
<line x1="970.0" y1="205.0" x2="970.0" y2="245.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="856.3" y="250.1" width="227.5" height="49.9" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="970.0" y="271.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">Двосторонній SSH-пайп</tspan><tspan x="970.0" dy="16.9">(захищений транспорт потоку)</tspan></text>
<line x1="970.0" y1="305.0" x2="970.0" y2="345.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="856.3" y="350.1" width="227.5" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="371.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">Віддалений rsync (Generator)</tspan><tspan x="970.0" dy="16.9">(сканування блоків цілі)</tspan></text>
<line x1="970.0" y1="405.0" x2="970.0" y2="445.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="847.1" y="453.4" width="245.7" height="63.2" rx="6" fill="#e8f5ec" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="473.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">Дельта-протокол rsync</tspan><tspan x="970.0" dy="15.6">[хеші блоків] &lt;-&gt; [токени дельти]</tspan><tspan x="970.0" dy="15.6">передача лише змінених байтів</tspan></text>
<rect x="820.0" y="550.0" width="300.0" height="60.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="970.0" y="576.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">Ефективність: передача лише різниць,</tspan><tspan x="970.0" dy="15.6">збереження метаданих, докачування</tspan></text>
</svg>