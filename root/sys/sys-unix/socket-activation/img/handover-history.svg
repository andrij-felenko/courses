<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1570 870" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1570" height="870" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">що робить менеджер</text>
<text x="887.5" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">що переходить межу</text>
<text x="1287.5" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">що дістає служба</text>
<rect x="40.0" y="120.0" width="250.0" height="110.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.3"/><text x="165.0" y="170.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">inetd</tspan><tspan x="165.0" dy="19.5">4.3BSD, 1986</tspan></text>
<rect x="320.0" y="100.0" width="400.0" height="150.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.4"/><text x="520.0" y="170.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">слухає всі порти одразу</tspan><tspan x="520.0" dy="18.2">і САМ викликає accept()</tspan></text>
<text x="887.5" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">прийняте з'єднання</text>
<text x="887.5" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">на місцях 0, 1, 2</text>
<line x1="745.0" y1="205.0" x2="1030.0" y2="205.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="1055.0" y="100.0" width="465.0" height="150.0" rx="6" fill="#fdecea" stroke="#6b7280" stroke-width="1.4"/><text x="1287.5" y="161.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1287.5" dy="0.0">фільтр, що читає вхід і пише вихід:</tspan><tspan x="1287.5" dy="18.2">про мережу не знає нічого,</tspan><tspan x="1287.5" dy="18.2">одне з'єднання — один процес</tspan></text>
<rect x="40.0" y="310.0" width="250.0" height="110.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.3"/><text x="165.0" y="370.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">xinetd</tspan></text>
<rect x="320.0" y="290.0" width="400.0" height="150.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.4"/><text x="520.0" y="360.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">те саме + доступ за адресою,</tspan><tspan x="520.0" dy="18.2">межі, частота, журнал</tspan></text>
<text x="887.5" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">прийняте з'єднання</text>
<text x="887.5" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">на місцях 0, 1, 2</text>
<line x1="745.0" y1="395.0" x2="1030.0" y2="395.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="1055.0" y="290.0" width="465.0" height="150.0" rx="6" fill="#fdecea" stroke="#6b7280" stroke-width="1.4"/><text x="1287.5" y="360.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1287.5" dy="0.0">без змін: процес на з'єднання,</tspan><tspan x="1287.5" dy="18.2">жодного стану між ними</tspan></text>
<rect x="40.0" y="500.0" width="250.0" height="110.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.3"/><text x="165.0" y="550.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">launchd</tspan><tspan x="165.0" dy="19.5">Mac OS X 10.4, 2005</tspan></text>
<rect x="320.0" y="480.0" width="400.0" height="150.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.4"/><text x="520.0" y="550.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">створює й ТРИМАЄ</tspan><tspan x="520.0" dy="18.2">слухаючі сокети наперед</tspan></text>
<text x="887.5" y="531.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">слухаючий сокет</text>
<text x="887.5" y="551.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">(accept() — у служби)</text>
<line x1="745.0" y1="585.0" x2="1030.0" y2="585.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="1055.0" y="480.0" width="465.0" height="150.0" rx="6" fill="#eaf6ef" stroke="#6b7280" stroke-width="1.4"/><text x="1287.5" y="541.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1287.5" dy="0.0">постійний демон: сам викликає accept(),</tspan><tspan x="1287.5" dy="18.2">тримає стан, засинає в простої,</tspan><tspan x="1287.5" dy="18.2">не потребує root для порту 80</tspan></text>
<rect x="40.0" y="690.0" width="250.0" height="110.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.3"/><text x="165.0" y="740.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">systemd</tspan><tspan x="165.0" dy="19.5">«Rethinking PID 1», 2010</tspan></text>
<rect x="320.0" y="670.0" width="400.0" height="150.0" rx="6" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.4"/><text x="520.0" y="740.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">усі оголошені сокети однією порцією</tspan><tspan x="520.0" dy="18.2">ще до першої служби</tspan></text>
<text x="887.5" y="721.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">слухаючі сокети</text>
<text x="887.5" y="741.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">з місця 3 і далі</text>
<line x1="745.0" y1="775.0" x2="1030.0" y2="775.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="1055.0" y="670.0" width="465.0" height="150.0" rx="6" fill="#eaf6ef" stroke="#6b7280" stroke-width="1.4"/><text x="1287.5" y="731.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1287.5" dy="0.0">те саме — плюс порядок старту</tspan><tspan x="1287.5" dy="18.2">перестає бути питанням:</tspan><tspan x="1287.5" dy="18.2">точка зустрічі є в усіх від початку</tspan></text>
<line x1="40.0" y1="460.0" x2="1520.0" y2="460.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="8 6"/>
</svg>