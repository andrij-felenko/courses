<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12.5 -10 1332.5 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-12.5" y="-10" width="1332.5" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="600.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура списків LRU та ротація сторінок в ядрі Linux</text>
<text x="60.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Структура списків LRU та алгоритм двократного дотику (Two-Touch)</text>
<rect x="50.0" y="80.0" width="520.0" height="560.0" rx="10" fill="none" stroke="#333333" stroke-width="1.6"/>
<text x="310.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">File LRU (Кеш файлів / Page Cache)</text>
<rect x="310.0" y="170.0" width="420.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="520.0" y="201.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Active File List</tspan><tspan x="520.0" dy="16.9">(Гарячі сторінки файлового кешу)</tspan></text>
<rect x="310.0" y="340.0" width="420.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="520.0" y="371.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Inactive File List</tspan><tspan x="520.0" dy="16.9">(Холодні сторінки, кандидати на витіснення)</tspan></text>
<line x1="200.0" y1="208.0" x2="200.0" y2="302.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="190.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">Demote (aging)
shrink_active_list()</text>
<line x1="420.0" y1="302.0" x2="420.0" y2="208.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">Promote (2-ий дотик)
mark_page_accessed()</text>
<rect x="310.0" y="520.0" width="420.0" height="80.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="520.0" y="541.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Звільнення kswapd:</tspan><tspan x="520.0" dy="15.6">Clean page -&gt; миттєвий drop</tspan><tspan x="520.0" dy="15.6">Dirty page -&gt; writeback на диск</tspan></text>
<line x1="310.0" y1="378.0" x2="310.0" y2="477.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="630.0" y="80.0" width="520.0" height="560.0" rx="10" fill="none" stroke="#333333" stroke-width="1.6"/>
<text x="890.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Anon LRU (Анонімна пам'ять процесів)</text>
<rect x="890.0" y="170.0" width="420.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="1100.0" y="201.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1100.0" dy="0.0">Active Anon List</tspan><tspan x="1100.0" dy="16.9">(Купа/стек процесів під активним доступом)</tspan></text>
<rect x="890.0" y="340.0" width="420.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="1100.0" y="371.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1100.0" dy="0.0">Inactive Anon List</tspan><tspan x="1100.0" dy="16.9">(Невикористовувані сторінки процесів)</tspan></text>
<line x1="780.0" y1="208.0" x2="780.0" y2="302.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="770.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">Demote (aging)</text>
<line x1="1000.0" y1="302.0" x2="1000.0" y2="208.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="1010.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">Promote (2-ий дотик)</text>
<rect x="890.0" y="520.0" width="420.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="1100.0" y="541.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1100.0" dy="0.0">Звільнення kswapd:</tspan><tspan x="1100.0" dy="15.6">Запис у Swap -&gt; звільнення RAM</tspan><tspan x="1100.0" dy="15.6">(регулюється vm.swappiness)</tspan></text>
<line x1="890.0" y1="378.0" x2="890.0" y2="477.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>