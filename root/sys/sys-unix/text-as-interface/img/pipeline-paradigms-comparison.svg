<text x="747.5" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">Обробка селекторами (jq, jc)</text>
<text x="640.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• jq -r '.Action == &quot;start&quot;'</text>
<text x="640.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="start">• Складні вкладені структури</text>
<text x="640.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="start">• Базові типи (bool, number, null)</text>
<rect x="630.0" y="300.0" width="235.0" height="125.0" rx="4" fill="#fefce8" stroke="#fde047" stroke-width="1.0"/>
<text x="747.5" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#854d0e" text-anchor="middle" font-weight="700">Сучасний компроміс</text>
<text x="640.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#713f12" text-anchor="start">+ Універсальний для всіх мов</text>
<text x="640.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#713f12" text-anchor="start">+ Зберігає потоковість (line by line)</text>
<text x="640.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#a16207" text-anchor="start">− Витрати CPU на JSON-парсинг</text>
<text x="640.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#a16207" text-anchor="start">− Текстова надмірність ключів</text>
