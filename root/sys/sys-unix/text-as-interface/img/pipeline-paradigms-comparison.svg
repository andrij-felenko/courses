<text x="172.5" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">ps aux | grep nginx</text>
<text x="172.5" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#3b82f6" text-anchor="middle">Байтовий потік (stream of bytes)</text>
<line x1="172.5" y1="160.0" x2="172.5" y2="185.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
