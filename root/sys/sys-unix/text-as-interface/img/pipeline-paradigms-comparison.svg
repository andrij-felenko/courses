<rect x="343.0" y="190.0" width="235.0" height="95.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="460.5" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">Типізовані властивості</text>
<text x="353.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• $proc.Id, $proc.WorkingSet64</text>
<text x="353.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="start">• Жодного парсингу рядків</text>
<text x="353.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="start">• Безпека типів (int, DateTime)</text>
<rect x="343.0" y="300.0" width="235.0" height="125.0" rx="4" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.0"/>
<text x="460.5" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9f1239" text-anchor="middle" font-weight="700">Накладні витрати та межі</text>
<text x="353.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#be123c" text-anchor="start">− Потребує важкого .NET CLR</text>
<text x="353.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#be123c" text-anchor="start">− Важко передати в C/Rust утиліти</text>
<text x="353.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#be123c" text-anchor="start">− Серіалізація при міжхостовому зв'язку</text>
<text x="353.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#be123c" text-anchor="start">− Високі витрати пам'яті на об'єкт</text>
