<text x="40.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e293b" text-anchor="start" font-weight="700">1. Поділ на записи: Record Separator (LF / 0x0A або NUL / 0x00)</text>
