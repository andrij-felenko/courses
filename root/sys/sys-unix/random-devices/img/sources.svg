<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 912" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="912" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джерела непередбачності та залік ентропії</text>
<rect x="40.0" y="50.0" width="300.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="190.0" y="78.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">подія, яку бачить ядро</tspan></text>
<rect x="360.0" y="50.0" width="580.0" height="48.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="650.0" y="78.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">що саме в ній не може відтворити стороння людина</tspan></text>
<rect x="960.0" y="50.0" width="300.0" height="48.0" rx="6" fill="#f6efff" stroke="#7a4fb0" stroke-width="1.8"/><text x="1110.0" y="78.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a4fb0" text-anchor="middle" font-weight="700"><tspan x="1110.0" dy="0.0">чи додає до лічильника ентропії</tspan></text>
<rect x="40.0" y="116.0" width="300.0" height="76.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.8"/><text x="190.0" y="158.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">апаратне переривання</tspan></text>
<line x1="348.0" y1="154.0" x2="352.0" y2="154.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="360.0" y="116.0" width="580.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="650.0" y="150.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">молодші розряди лічильника тактів у мить приходу</tspan><tspan x="650.0" dy="15.6">разом з номером лінії та адресою повернення</tspan></text>
<rect x="960.0" y="116.0" width="300.0" height="76.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="1110.0" y="158.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="1110.0" dy="0.0">так, дрібними порціями</tspan></text>
<rect x="40.0" y="204.0" width="300.0" height="76.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.8"/><text x="190.0" y="246.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">натиск клавіші, рух миші</tspan></text>
<line x1="348.0" y1="242.0" x2="352.0" y2="242.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="360.0" y="204.0" width="580.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="650.0" y="238.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">код клавіші плюс момент, коли людина її натиснула,</tspan><tspan x="650.0" dy="15.6">з точністю до наносекунд</tspan></text>
<rect x="960.0" y="204.0" width="300.0" height="76.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="1110.0" y="246.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="1110.0" dy="0.0">так</tspan></text>
<rect x="40.0" y="292.0" width="300.0" height="76.0" rx="6" fill="#fbfcff" stroke="#2457d6" stroke-width="1.8"/><text x="190.0" y="334.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">звіт диска про завершення</tspan></text>
<line x1="348.0" y1="330.0" x2="352.0" y2="330.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="360.0" y="292.0" width="580.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="650.0" y="326.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">коли саме контролер сказав «готово» —</tspan><tspan x="650.0" dy="15.6">механіка й черга дають розкид</tspan></text>
<rect x="960.0" y="292.0" width="300.0" height="76.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="1110.0" y="334.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="1110.0" dy="0.0">так</tspan></text>
<rect x="40.0" y="380.0" width="300.0" height="76.0" rx="6" fill="#fbfcff" stroke="#b8860b" stroke-width="1.8"/><text x="190.0" y="422.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">інструкція RDSEED / RDRAND</tspan></text>
<line x1="348.0" y1="418.0" x2="352.0" y2="418.0" stroke="#b8860b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="360.0" y="380.0" width="580.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="650.0" y="414.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">шум фізичного джерела всередині самого кристала —</tspan><tspan x="650.0" dy="15.6">готові біти, а не сировина</tspan></text>
<rect x="960.0" y="380.0" width="300.0" height="76.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/><text x="1110.0" y="414.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="1110.0" dy="0.0">лише якщо ввімкнено</tspan><tspan x="1110.0" dy="15.6">random.trust_cpu</tspan></text>
<rect x="40.0" y="468.0" width="300.0" height="76.0" rx="6" fill="#fbfcff" stroke="#b8860b" stroke-width="1.8"/><text x="190.0" y="510.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">прошивка й завантажувач</tspan></text>
<line x1="348.0" y1="506.0" x2="352.0" y2="506.0" stroke="#b8860b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="360.0" y="468.0" width="580.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="650.0" y="502.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">число, яке передали через протокол UEFI RNG</tspan><tspan x="650.0" dy="15.6">або запис rng-seed у дереві пристроїв</tspan></text>
<rect x="960.0" y="468.0" width="300.0" height="76.0" rx="6" fill="#ffffff" stroke="#b8860b" stroke-width="1.5"/><text x="1110.0" y="502.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8860b" text-anchor="middle" font-weight="700"><tspan x="1110.0" dy="0.0">лише якщо ввімкнено</tspan><tspan x="1110.0" dy="15.6">random.trust_bootloader</tspan></text>
<rect x="40.0" y="556.0" width="300.0" height="76.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.8"/><text x="190.0" y="598.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">насіння з минулого запуску</tspan></text>
<line x1="348.0" y1="594.0" x2="352.0" y2="594.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="360.0" y="556.0" width="580.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="650.0" y="590.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">стан генератора, збережений у файл перед вимкненням</tspan><tspan x="650.0" dy="15.6">— але образ диска можна скопіювати</tspan></text>
<rect x="960.0" y="556.0" width="300.0" height="76.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="1110.0" y="598.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="1110.0" dy="0.0">ні, лише домішують</tspan></text>
<rect x="40.0" y="644.0" width="300.0" height="76.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.8"/><text x="190.0" y="686.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">серійні номери, MAC-адреси</tspan></text>
<line x1="348.0" y1="682.0" x2="352.0" y2="682.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="360.0" y="644.0" width="580.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="650.0" y="678.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">унікальні для примірника заліза,</tspan><tspan x="650.0" dy="15.6">проте кожен охочий може їх прочитати</tspan></text>
<rect x="960.0" y="644.0" width="300.0" height="76.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="1110.0" y="686.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="1110.0" dy="0.0">ні, лише домішують</tspan></text>
<rect x="40.0" y="732.0" width="300.0" height="76.0" rx="6" fill="#fbfcff" stroke="#7a4fb0" stroke-width="1.8"/><text x="190.0" y="774.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a4fb0" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">власне тремтіння лічильника</tspan></text>
<line x1="348.0" y1="770.0" x2="352.0" y2="770.0" stroke="#7a4fb0" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="360.0" y="732.0" width="580.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="650.0" y="766.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">скільки тактів набігло на однаковому циклі —</tspan><tspan x="650.0" dy="15.6">ядро крутить його навмисне, коли бракує решти</tspan></text>
<rect x="960.0" y="732.0" width="300.0" height="76.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="1110.0" y="774.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="1110.0" dy="0.0">так, під час завантаження</tspan></text>
<rect x="40.0" y="834.0" width="1220.0" height="58.0" rx="6" fill="#eceff2" stroke="#1a1a1a" stroke-width="1.8"/><text x="650.0" y="867.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">жодна подія сама по собі не дає «випадкового байта» — кожна приносить кілька бітів невідомості, і лише сума має вагу</tspan></text>
</svg>