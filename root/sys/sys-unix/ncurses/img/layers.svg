<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шари між програмою й екраном термінала</text>
<text x="560.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">від наміру програми до точок на склі: що знає кожен шар</text>
<rect x="70.0" y="88.0" width="430.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="285.0" y="124.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">програма</tspan><tspan x="285.0" dy="18.2">малює у вікна в пам'яті</tspan></text>
<rect x="610.0" y="88.0" width="440.0" height="82.0" rx="6" fill="#fff8e6" stroke="#6b7280" stroke-width="1.0"/><text x="830.0" y="125.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="830.0" dy="0.0">не знає ні байтів,</tspan><tspan x="830.0" dy="16.9">ні моделі термінала</tspan></text>
<rect x="70.0" y="200.0" width="430.0" height="82.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="285.0" y="236.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">ncurses</tspan><tspan x="285.0" dy="18.2">дві копії екрана, вибір найдешевших дій</tspan></text>
<rect x="610.0" y="200.0" width="440.0" height="82.0" rx="6" fill="#fff8e6" stroke="#6b7280" stroke-width="1.0"/><text x="830.0" y="237.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="830.0" dy="0.0">не бачить скла:</tspan><tspan x="830.0" dy="16.9">вірить власній копії</tspan></text>
<rect x="70.0" y="312.0" width="430.0" height="82.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="285.0" y="348.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">terminfo</tspan><tspan x="285.0" dy="18.2">назва можливості → байти цього термінала</tspan></text>
<rect x="610.0" y="312.0" width="440.0" height="82.0" rx="6" fill="#fff8e6" stroke="#6b7280" stroke-width="1.0"/><text x="830.0" y="349.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="830.0" dy="0.0">не перевіряє,</tspan><tspan x="830.0" dy="16.9">чи ім'я TERM правдиве</tspan></text>
<rect x="70.0" y="424.0" width="430.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="285.0" y="460.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">tty / termios у ядрі</tspan><tspan x="285.0" dy="18.2">режим, відлуння, розмір вікна</tspan></text>
<rect x="610.0" y="424.0" width="440.0" height="82.0" rx="6" fill="#fff8e6" stroke="#6b7280" stroke-width="1.0"/><text x="830.0" y="461.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="830.0" dy="0.0">у вміст не дивиться:</tspan><tspan x="830.0" dy="16.9">переганяє байти далі</tspan></text>
<rect x="70.0" y="536.0" width="430.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="285.0" y="572.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">термінал</tspan><tspan x="285.0" dy="18.2">тлумачить байти й малює</tspan></text>
<rect x="610.0" y="536.0" width="440.0" height="82.0" rx="6" fill="#fff8e6" stroke="#6b7280" stroke-width="1.0"/><text x="830.0" y="573.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="830.0" dy="0.0">не має зворотного каналу:</tspan><tspan x="830.0" dy="16.9">намальоване не читається</tspan></text>
<line x1="180.0" y1="170.0" x2="180.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="200.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">малює комірки</text>
<line x1="180.0" y1="282.0" x2="180.0" y2="312.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="200.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">яка команда тут потрібна</text>
<line x1="180.0" y1="394.0" x2="180.0" y2="424.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="200.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">готові байти</text>
<line x1="180.0" y1="506.0" x2="180.0" y2="536.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="200.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">той самий потік</text>
</svg>