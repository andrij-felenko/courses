<rect x="624.8" y="80.2" width="190.5" height="59.6" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="720.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">3. Звернення за ptr</tspan><tspan x="720.0" dy="14.3">Інструкція читання/запису</tspan><tspan x="720.0" dy="14.3">перевіряє Shadow Memory</tspan></text>
