<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1357.92 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1357.92" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часова шкала реакції на обрив лінку Fibre Channel / iSCSI</text>
<text x="660.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часова шкала збою лінку: реакція черги, fast_io_fail_tmo та dev_loss_tmo</text>
<line x1="80.0" y1="170.0" x2="1240.0" y2="170.0" stroke="#333333" stroke-width="3.0"/>
<line x1="1230.0" y1="170.0" x2="1270.0" y2="170.0" stroke="#333333" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="1285.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Час (t)</text>
<line x1="140.0" y1="155.0" x2="140.0" y2="185.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="140.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">t = 0 c</text>
<text x="140.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Link Down</tspan><tspan x="140.0" dy="15.6">(обрив сигналу)</tspan></text>
<line x1="380.0" y1="155.0" x2="380.0" y2="185.0" stroke="#2457d6" stroke-width="2.5"/>
<text x="380.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">0 &lt; t &lt; 5 c</text>
<text x="380.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Вікно короткого збою</tspan><tspan x="380.0" dy="15.6">(flapping / re-login)</tspan></text>
<line x1="660.0" y1="155.0" x2="660.0" y2="185.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="660.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">t = 5 c</text>
<text x="660.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">fast_io_fail_tmo</tspan><tspan x="660.0" dy="15.6">(швидке відхилення I/O)</tspan></text>
<line x1="1040.0" y1="155.0" x2="1040.0" y2="185.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="1040.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">t = 30 c (або dev_loss_tmo)</text>
<text x="1040.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1040.0" dy="0.0">dev_loss_tmo</tspan><tspan x="1040.0" dy="15.6">(видалення пристрою rport)</tspan></text>
<rect x="140.0" y="260.0" width="520.0" height="150.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/>
<text x="400.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стан порту: Blocked (Queue Holding)</text>
<text x="400.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">• LLD викликає fc_remote_port_delete() / iscsi_session_failure()</tspan><tspan x="400.0" dy="16.2">• scsi_target_block(): черга блокується, нові I/O стають на паузу</tspan><tspan x="400.0" dy="16.2">• Якщо лінк підніметься тут — розблокування без жодної помилки I/O</tspan></text>
<rect x="660.0" y="260.0" width="380.0" height="150.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/>
<text x="850.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Стан порту: Fast Failover</text>
<text x="850.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">• Спливає fast_io_fail_tmo (напр. 5 с)</tspan><tspan x="850.0" dy="16.2">• Чергу розблоковано, I/O скидаються</tspan><tspan x="850.0" dy="16.2">  зі статусом DID_TRANSPORT_FAILFAST</tspan><tspan x="850.0" dy="16.2">• dm-multipath робить миттєвий failover</tspan></text>
<rect x="1040.0" y="260.0" width="220.0" height="150.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/>
<text x="1150.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Видалення rport</text>
<text x="1150.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1150.0" dy="0.0">• Спливає dev_loss_tmo</tspan><tspan x="1150.0" dy="16.2">• scsi_remove_target()</tspan><tspan x="1150.0" dy="16.2">• Видалення /dev/sdX</tspan><tspan x="1150.0" dy="16.2">• Знищення об'єкта</tspan></text>
<rect x="70.0" y="472.1" width="1180.0" height="95.7" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="499.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Ключова архітектурна різниця двох таймерів:</tspan><tspan x="660.0" dy="16.9">• fast_io_fail_tmo керує ДОЛЕЮ ЗАПИТІВ (I/O) — змушує ядро швидко відмовити в очікуванні, звільняючи multipath;</tspan><tspan x="660.0" dy="16.9">• dev_loss_tmo керує ЖИТТЄВИМ ЦИКЛОМ ПРИСТРОЮ (структур ядра) — не дає видалити /dev/sdX завчасно.</tspan><tspan x="660.0" dy="16.9">Правило коректності: fast_io_fail_tmo &lt; dev_loss_tmo (наприклад, 5 с проти 30 с або 300 с у SAN).</tspan></text>
</svg>