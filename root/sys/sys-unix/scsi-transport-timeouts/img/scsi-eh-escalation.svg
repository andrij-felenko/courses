<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1290 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1290" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ескалація SCSI Error Handling та транспортне відсікання</text>
<text x="640.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ескалація SCSI Error Handling (scsi_eh) та транспортне відсікання</text>
<rect x="100.0" y="90.6" width="520.0" height="78.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="110.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Сходинка 1: eh_abort_handler</tspan><tspan x="360.0" dy="15.6">Спроба скасування конкретної завислої команди</tspan><tspan x="360.0" dy="15.6">SCSI Task Management: ABORT TASK</tspan><tspan x="360.0" dy="15.6">Діє лише на одну команду CDB</tspan></text>
<line x1="360.0" y1="172.4" x2="360.0" y2="197.6" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="390.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">якщо не допомогло</text>
<rect x="100.0" y="200.6" width="520.0" height="78.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="220.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Сходинка 2: eh_device_reset_handler</tspan><tspan x="360.0" dy="15.6">Скидання конкретної логічної одиниці (LUN)</tspan><tspan x="360.0" dy="15.6">Task Management: LOGICAL UNIT RESET</tspan><tspan x="360.0" dy="15.6">Очищає стан черги LUN, скидає резервації</tspan></text>
<line x1="360.0" y1="282.4" x2="360.0" y2="307.6" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="390.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">якщо не допомогло</text>
<rect x="100.0" y="310.6" width="520.0" height="78.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="330.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Сходинка 3: eh_target_reset_handler</tspan><tspan x="360.0" dy="15.6">Скидання всього цільового порту/вузла</tspan><tspan x="360.0" dy="15.6">TARGET RESET / I_T Nexus Reset</tspan><tspan x="360.0" dy="15.6">Скидає всі LUN на даному цільовому контролері</tspan></text>
<line x1="360.0" y1="392.4" x2="360.0" y2="417.6" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="390.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">якщо не допомогло</text>
<rect x="100.0" y="420.6" width="520.0" height="78.8" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="440.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Сходинка 4: eh_host_reset_handler</tspan><tspan x="360.0" dy="15.6">Повне апаратне скидання HBA-адаптера</tspan><tspan x="360.0" dy="15.6">Host Adapter Hardware Reset</tspan><tspan x="360.0" dy="15.6">Найважча операція: зупиняє трафік усіх портів HBA</tspan></text>
<rect x="730.0" y="184.6" width="440.0" height="230.9" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="950.0" y="211.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">Транспортне відсікання (Short-Circuit)</tspan><tspan x="950.0" dy="16.9"></tspan><tspan x="950.0" dy="16.9">Якщо віддалений порт у стані Blocked</tspan><tspan x="950.0" dy="16.9">або fast_io_fail_tmo вже сплив:</tspan><tspan x="950.0" dy="16.9"></tspan><tspan x="950.0" dy="16.9">1. scsi_eh перевіряє стан транспорту</tspan><tspan x="950.0" dy="16.9">2. Спроби посилати ABORT/RESET у мертвий</tspan><tspan x="950.0" dy="16.9">   кабель блокуються</tspan><tspan x="950.0" dy="16.9">3. eh_abort_handler повертає FAST_IO_FAIL</tspan><tspan x="950.0" dy="16.9">4. Ескалація НЕ витрачає 4 × 30 секунд</tspan><tspan x="950.0" dy="16.9">5. Команда негайно завершується з помилкою</tspan><tspan x="950.0" dy="16.9">   DID_TRANSPORT_FAILFAST</tspan></text>
<line x1="625.0" y1="130.0" x2="725.0" y2="260.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="625.0" y1="240.0" x2="725.0" y2="300.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="625.0" y1="350.0" x2="725.0" y2="340.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="603.0" width="1160.0" height="53.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="626.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Без транспортних класів: scsi_eh витрачає до 120–180 секунд на марні спроби скидання мертвої фабрики.</tspan><tspan x="640.0" dy="16.9">З fast_io_fail_tmo: транспорт відсікає ескалацію scsi_eh за лічені мілісекунди після спливу таймера.</tspan></text>
</svg>