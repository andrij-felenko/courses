<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1330 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1330" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перемикання шляху в dm-multipath при спрацюванні fast_io_fail_tmo</text>
<text x="660.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема взаємодії ядра, dm-multipath та таймерів при перемиканні шляху</text>
<rect x="260.0" y="83.0" width="800.0" height="53.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Застосунок / СУБД (PostgreSQL, Oracle, QEMU)</tspan><tspan x="660.0" dy="16.9">Виконує write()/read() у віртуальний блоковий пристрій /dev/mapper/mpatha</tspan></text>
<line x1="660.0" y1="141.9" x2="660.0" y2="185.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="185.0" y="197.6" width="950.0" height="74.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="222.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">dm-multipath (Device Mapper Multipath Target)</tspan><tspan x="660.0" dy="16.9">Поточний активний шлях: Шлях 1 (/dev/sda) · Резервний шлях: Шлях 2 (/dev/sdb)</tspan><tspan x="660.0" dy="16.9">Черга біо утримується в dm_mq_queue · Політика вибору: service-time / round-robin</tspan></text>
<line x1="500.0" y1="277.4" x2="340.0" y2="365.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="820.0" y1="277.4" x2="980.0" y2="365.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="110.0" y="381.0" width="460.0" height="118.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="340.0" y="405.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Шлях 1: HBA 0 → Порт 1 (/dev/sda)</tspan><tspan x="340.0" dy="15.6">[ЗБІЙ ЛІНКУ: кабель висмикнуто]</tspan><tspan x="340.0" dy="15.6">1. rport переходить у Blocked</tspan><tspan x="340.0" dy="15.6">2. fast_io_fail_tmo (5 c) спливає</tspan><tspan x="340.0" dy="15.6">3. Драйвер повертає DID_TRANSPORT_FAILFAST</tspan><tspan x="340.0" dy="15.6">4. dm позначає шлях як 'faulty'</tspan></text>
<rect x="750.0" y="381.0" width="460.0" height="118.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="980.0" y="405.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="980.0" dy="0.0">Шлях 2: HBA 1 → Порт 2 (/dev/sdb)</tspan><tspan x="980.0" dy="15.6">[АКТИВНИЙ РЕЗЕРВНИЙ ШЛЯХ]</tspan><tspan x="980.0" dy="15.6">1. dm перенаправляє (requeue) запити</tspan><tspan x="980.0" dy="15.6">2. Відправка CDB через живий FC/iSCSI порт</tspan><tspan x="980.0" dy="15.6">3. Контролер масиву повертає GOOD статус</tspan><tspan x="980.0" dy="15.6">4. Застосунок отримує дані без I/O помилки</tspan></text>
<line x1="340.0" y1="525.0" x2="660.0" y2="580.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="660.0" y1="580.0" x2="980.0" y2="525.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="660.0" y="582.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Швидкий failover: повернення bio в dm (requeue) і відправка на Шлях 2 (&lt; 5.1 с)</text>
<rect x="120.0" y="640.0" width="1080.0" height="49.9" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="661.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">Дисковий масив / Сховище SAN (Dual Controller Storage Array)</tspan><tspan x="660.0" dy="16.9">LUN 0 доступний через обидва контролери (ALUA Active/Optimized або Active/Non-Optimized)</tspan></text>
<line x1="980.0" y1="589.0" x2="980.0" y2="630.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>