<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектурне порівняння: Stateful та Stateless відеодекодери</text>
<rect x="40.0" y="53.0" width="480.0" height="53.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">Stateful декодер (зі збереженням стану)</tspan><tspan x="280.0" dy="16.9">Samsung MFC, Hantro G1, Coda, Venus</tspan></text>
<rect x="40.0" y="151.4" width="480.0" height="67.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="173.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Userspace (FFmpeg / GStreamer)</tspan><tspan x="280.0" dy="15.6">Передає сирий потік бітів (Annex B / NAL)</tspan><tspan x="280.0" dy="15.6">Не розбирає SPS/PPS/заголовки слайсів</tspan></text>
<rect x="40.0" y="268.6" width="480.0" height="82.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="290.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Драйвер та V4L2 M2M черги</tspan><tspan x="280.0" dy="15.6">OUTPUT: пакети бітстріму</tspan><tspan x="280.0" dy="15.6">CAPTURE: готові неспрощені YUV кадри</tspan><tspan x="280.0" dy="15.6">DRC події: V4L2_EVENT_SOURCE_CHANGE</tspan></text>
<rect x="40.0" y="426.6" width="480.0" height="86.8" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="280.0" y="450.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Апаратура з мікроконтролером / прошивкою</tspan><tspan x="280.0" dy="15.6">• Вбудований парсер бітстріму</tspan><tspan x="280.0" dy="15.6">• Внутрішній менеджер буферів посилань (DPB)</tspan><tspan x="280.0" dy="15.6">• Автоматичне виділення та трекінг кадрів</tspan></text>
<line x1="280.0" y1="120.0" x2="280.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="280.0" y1="225.0" x2="280.0" y2="260.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="280.0" y1="360.0" x2="280.0" y2="410.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="580.0" y="53.0" width="480.0" height="53.9" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">Stateless декодер (без стану в ядрі)</tspan><tspan x="820.0" dy="16.9">Rockchip RKVDEC, Allwinner Cedrus, RPi HEVC</tspan></text>
<rect x="580.0" y="151.4" width="480.0" height="67.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="173.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Userspace (Парсер кодека)</tspan><tspan x="820.0" dy="15.6">Парсить SPS, PPS, матриці квантування,</tspan><tspan x="820.0" dy="15.6">параметри слайсів і таблиці посилань DPB</tspan></text>
<rect x="580.0" y="268.6" width="480.0" height="82.8" rx="6" fill="#f3e5f5" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="290.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">V4L2 Request API (/dev/mediaX)</tspan><tspan x="820.0" dy="15.6">Атомарний запит зв'язує разом:</tspan><tspan x="820.0" dy="15.6">1. V4L2 контроли (SPS/PPS/Slice metadata)</tspan><tspan x="820.0" dy="15.6">2. OUTPUT буфер (payload слайса) + CAPTURE буфер</tspan></text>
<rect x="580.0" y="426.6" width="480.0" height="86.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="450.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">Чистий обчислювальний прискорювач</tspan><tspan x="820.0" dy="15.6">• Не має прошивки та парсера</tspan><tspan x="820.0" dy="15.6">• Декодує рівно один слайс за параметрами ядра</tspan><tspan x="820.0" dy="15.6">• Тотальний контроль та детермінізм</tspan></text>
<line x1="820.0" y1="120.0" x2="820.0" y2="145.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="820.0" y1="225.0" x2="820.0" y2="260.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="820.0" y1="360.0" x2="820.0" y2="410.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="560.2" width="1020.0" height="49.6" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="550.0" y="581.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Stateful: простіший Userspace, складніша закрита прошивка чипа.</tspan><tspan x="550.0" dy="15.6">Stateless: відкритий стек, нуль бінарних блобів, керування кожним кадром через Request API.</tspan></text>
</svg>