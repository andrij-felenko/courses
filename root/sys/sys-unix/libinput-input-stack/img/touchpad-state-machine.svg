<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="40.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Життєвий цикл контакту на тачпаді: від дотику до жесту</text>
<text x="40.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Як libinput розрізняє випадковий дотик долонею, легкий тап, скрол двома пальцями та масштаб</text>
<rect x="40.0" y="95.0" width="230.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="155.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">Палець торкнувся поверхні</tspan><tspan x="155.0" dy="14.3">(TOUCH_DOWN / контакт у слоті)</tspan></text>
<rect x="320.0" y="95.0" width="260.0" height="60.0" rx="6" fill="#fdf3e7" stroke="#d35400" stroke-width="1.5"/><text x="450.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Перевірка Palm Detection:</tspan><tspan x="450.0" dy="15.6">Край тачпада / велика площа / DWT?</tspan></text>
<line x1="272.0" y1="125.0" x2="318.0" y2="125.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="95.0" width="460.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="870.0" y="121.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="870.0" dy="0.0">Ігнорування контакту (PALM_STATE)</tspan><tspan x="870.0" dy="15.6">Події руху блокуються, тап пригнічується</tspan></text>
<line x1="582.0" y1="125.0" x2="638.0" y2="125.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="610.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Так</text>
<text x="465.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Ні (валідний ввід)</text>
<line x1="450.0" y1="157.0" x2="450.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="320.0" y="197.0" width="260.0" height="50.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="218.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Оцінка кількості пальців</tspan><tspan x="450.0" dy="15.6">та векторів руху (Δt, Δx, Δy)</tspan></text>
<rect x="40.0" y="310.0" width="240.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="160.0" y="345.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">1 палець</tspan><tspan x="160.0" dy="14.3">Час &lt; 180мс, рух &lt; 3мм:</tspan><tspan x="160.0" dy="14.3">→ Tap-to-Click (LMB)</tspan><tspan x="160.0" dy="14.3">Рух триває:</tspan><tspan x="160.0" dy="14.3">→ Рух вказівника (Pointer Motion)</tspan></text>
<line x1="450.0" y1="249.0" x2="160.0" y2="308.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="310.0" y="310.0" width="240.0" height="120.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="345.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">2 пальці</tspan><tspan x="430.0" dy="14.3">Спільний вектор:</tspan><tspan x="430.0" dy="14.3">→ Прокрутка (Scroll 2-finger)</tspan><tspan x="430.0" dy="14.3">Протилежні вектори / кут:</tspan><tspan x="430.0" dy="14.3">→ Pinch / Rotate (масштаб/поворот)</tspan></text>
<line x1="450.0" y1="249.0" x2="430.0" y2="308.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="580.0" y="310.0" width="240.0" height="120.0" rx="6" fill="#fdf3e7" stroke="#d35400" stroke-width="1.5"/><text x="700.0" y="361.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">3 або 4 пальці</tspan><tspan x="700.0" dy="11.7">Синхронний рух:</tspan><tspan x="700.0" dy="11.7">→ Swipe-жест (перемикання робочих столів / огляд вікон)</tspan></text>
<line x1="450.0" y1="249.0" x2="700.0" y2="308.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="850.0" y="310.0" width="250.0" height="120.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="975.0" y="345.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="975.0" dy="0.0">Фізичний клік (Clickpad)</tspan><tspan x="975.0" dy="14.3">Перевірка зони кнопки:</tspan><tspan x="975.0" dy="14.3">• Нижня права = RMB</tspan><tspan x="975.0" dy="14.3">• Нижня середня = MMB</tspan><tspan x="975.0" dy="14.3">• Clickfinger: 1F=LMB, 2F=RMB, 3F=MMB</tspan></text>
<line x1="450.0" y1="249.0" x2="975.0" y2="308.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>