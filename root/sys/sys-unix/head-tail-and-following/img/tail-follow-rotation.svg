<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 750 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="750" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механіка стеження за логами: tail -f проти tail -F при ротації</text>
<rect x="25.0" y="50.0" width="335.0" height="345.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="192.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="700">tail -f (--follow=descriptor)</text>
<line x1="40.0" y1="88.0" x2="345.0" y2="88.0" stroke="#ef4444" stroke-width="1.0"/>
<rect x="45.0" y="100.0" width="295.0" height="55.0" rx="6" fill="#ffffff" stroke="#f87171" stroke-width="1.0"/>
<text x="192.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">1. Відкриття файлу app.log</text>
<text x="192.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Прив'язка fd ──► Inode #1042 (app.log)</text>
<line x1="192.0" y1="160.0" x2="192.0" y2="175.0" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45.0" y="180.0" width="295.0" height="85.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.0"/>
<text x="192.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">2. Відбувається ротація logrotate</text>
<text x="192.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">rename(&quot;app.log&quot;, &quot;app.log.1&quot;)</text>
<text x="192.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">Сервіс відкриває новий файл Inode #2099</text>
<text x="192.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">Inode #1042 перейменовано на app.log.1</text>
<line x1="192.0" y1="270.0" x2="192.0" y2="285.0" stroke="#ef4444" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45.0" y="290.0" width="295.0" height="90.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
<text x="192.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700">3. Наслідок: втрата потоку подій</text>
<text x="192.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle"><tspan x="192.0" dy="0.0">• tail -f утримує старий fd до Inode #1042</tspan><tspan x="192.0" dy="13.0">• Нові записи у свіжий app.log ігноруються</tspan><tspan x="192.0" dy="13.0">• Стеження зависає на заархівованому лозі</tspan></text>
<rect x="380.0" y="50.0" width="335.0" height="345.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="547.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">tail -F (--follow=name --retry)</text>
<line x1="395.0" y1="88.0" x2="700.0" y2="88.0" stroke="#22c55e" stroke-width="1.0"/>
<rect x="400.0" y="100.0" width="295.0" height="55.0" rx="6" fill="#ffffff" stroke="#4ade80" stroke-width="1.0"/>
<text x="547.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">1. Відкриття файлу app.log + inotify</text>
<text x="547.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Стеження за Inode #1042 та каталогом</text>
<line x1="547.0" y1="160.0" x2="547.0" y2="175.0" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="400.0" y="180.0" width="295.0" height="85.0" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.0"/>
<text x="547.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">2. Відбувається ротація logrotate</text>
<text x="547.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle">inotify ловить IN_MOVE_SELF / IN_CREATE</text>
<text x="547.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle">tail -F виявляє зміну Inode або видалення</text>
<text x="547.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Закриття старого fd, очікування за іменем</text>
<line x1="547.0" y1="270.0" x2="547.0" y2="285.0" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="400.0" y="290.0" width="295.0" height="90.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="547.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">3. Наслідок: безперервний моніторинг</text>
<text x="547.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle"><tspan x="547.0" dy="0.0">• Перевідкриття нового файлу Inode #2099</tspan><tspan x="547.0" dy="13.0">• Скидання зміщення на 0 байт</tspan><tspan x="547.0" dy="13.0">• Логування продовжується без зупинки</tspan></text>
</svg>