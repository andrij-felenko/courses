<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 750 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="750" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="370.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія tail: прямий реверсивний lseek проти кільцевого буфера в RAM</text>
<rect x="25.0" y="50.0" width="335.0" height="345.0" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
<text x="192.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0369a1" text-anchor="middle" font-weight="700">Регулярний файл (Seekable)</text>
<line x1="40.0" y1="88.0" x2="345.0" y2="88.0" stroke="#0284c7" stroke-width="1.0"/>
<rect x="50.0" y="105.0" width="285.0" height="70.0" rx="6" fill="#ffffff" stroke="#38bdf8" stroke-width="1.0"/>
<text x="192.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle" font-weight="700">Великий файл на диску (наприклад, 100 ГБ)</text>
<text x="192.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">[Початок ... 99.99 ГБ даних ... Кінець (EOF)]</text>
<text x="192.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="middle">lseek(fd, 0, SEEK_END) ──► дізнаємося розмір</text>
<line x1="192.0" y1="180.0" x2="192.0" y2="205.0" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="210.0" width="285.0" height="75.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
<text x="192.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#075985" text-anchor="middle" font-weight="700">Зсув назад: lseek(fd, -BUFSIZ, SEEK_CUR)</text>
<text x="192.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0c4a6e" text-anchor="middle">Сканування блоку 8 КіБ реверсивно на '\n'</text>
<text x="192.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0c4a6e" text-anchor="middle">Знайдено N рядків ──► зсув вперед на точний офсет</text>
<rect x="50.0" y="300.0" width="285.0" height="80.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
<text x="192.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">Результат: Час виконання O(K)</text>
<text x="192.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle"><tspan x="192.0" dy="0.0">• Читання лише останніх кількох кілобайтів</tspan><tspan x="192.0" dy="13.0">• Нуль навантаження на диск і RAM</tspan><tspan x="192.0" dy="13.0">• Миттєва відповідь незалежно від обсягу</tspan></text>
<rect x="380.0" y="50.0" width="335.0" height="345.0" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="547.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c2410c" text-anchor="middle" font-weight="700">Канал / сокет / stdin (Non-seekable)</text>
<line x1="395.0" y1="88.0" x2="700.0" y2="88.0" stroke="#ea580c" stroke-width="1.0"/>
<rect x="405.0" y="105.0" width="285.0" height="70.0" rx="6" fill="#ffffff" stroke="#fb923c" stroke-width="1.0"/>
<text x="547.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c2410c" text-anchor="middle" font-weight="700">Вхідний потік через pipe (безкінечний)</text>
<text x="547.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">lseek() повертає -1 (errno = ESPIPE)</text>
<text x="547.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Потік можна читати лише послідовно вперед</text>
<line x1="547.0" y1="180.0" x2="547.0" y2="205.0" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="405.0" y="210.0" width="285.0" height="75.0" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
<text x="547.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9a3412" text-anchor="middle" font-weight="700">Кільцевий буфер (Ring Buffer) у RAM</text>
<text x="547.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c2d12" text-anchor="middle">Збереження останніх N рядків у пам'яті</text>
<text x="547.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c2d12" text-anchor="middle">Новий рядок витісняє найстаріший у буфері</text>
<rect x="405.0" y="300.0" width="285.0" height="80.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="547.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">Результат: Час O(N), Пам'ять O(K)</text>
<text x="547.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle"><tspan x="547.0" dy="0.0">• Прокачування 100% обсягу вхідного потоку</tspan><tspan x="547.0" dy="13.0">• Споживання RAM обмежене розміром буфера</tspan><tspan x="547.0" dy="13.0">• Вивід на stdout лише після отримання EOF</tspan></text>
</svg>