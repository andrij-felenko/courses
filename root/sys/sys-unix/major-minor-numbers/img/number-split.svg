<text x="90.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">усередині ядра: одне 32-бітне слово, 12 + 20</text>
<rect x="90.0" y="84.0" width="337.5" height="58.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="258.8" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">старший — 12 бітів</text>
