<text x="990.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">біт 0</text>
<text x="540.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">MKDEV(ma, mi) = (ma &lt;&lt; 20) | mi     MAJOR(dev) = dev &gt;&gt; 20     MINOR(dev) = dev &amp; 0xFFFFF</text>
<text x="90.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">класичний Unix і Linux до 2.6: 16 бітів порівну</text>
<rect x="90.0" y="266.0" width="215.0" height="46.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="197.5" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle">старший — 8</text>
<rect x="305.0" y="266.0" width="215.0" height="46.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="412.5" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle">молодший — 8</text>
<text x="580.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="580.0" dy="0.0">256 драйверів і по 256 примірників на кожен —</tspan><tspan x="580.0" dy="16.9">цей простір вичерпали ще у 1990-х</tspan></text>
<text x="90.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">те саме число у програмі (glibc, 64 біти): частини переставлені</text>
