<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">чому опорою стало ім'я, а не число</text>
<rect x="60.0" y="78.0" width="740.0" height="58.0" rx="9" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="430.0" y="111.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">старших номерів усього 4096, а драйверів усе більшає</tspan></text>
<line x1="430.0" y1="136.0" x2="430.0" y2="160.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="162.0" width="740.0" height="58.0" rx="9" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="430.0" y="195.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">старший номер видає саме ядро — у мить, коли драйвер завантажився</tspan></text>
<line x1="430.0" y1="220.0" x2="430.0" y2="244.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="246.0" width="740.0" height="58.0" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="430.0" y="279.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">номер тепер залежить від порядку завантаження й може змінитися</tspan></text>
<line x1="430.0" y1="304.0" x2="430.0" y2="328.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="330.0" width="740.0" height="58.0" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><text x="430.0" y="363.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">тека /dev, зроблена наперед, починає вказувати не туди</tspan></text>
<line x1="430.0" y1="388.0" x2="430.0" y2="412.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="414.0" width="740.0" height="58.0" rx="9" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.7"/><text x="430.0" y="447.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">вузол мусить творити той, хто бачить появу пристрою, — devtmpfs</tspan></text>
<line x1="430.0" y1="472.0" x2="430.0" y2="496.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="498.0" width="740.0" height="58.0" rx="9" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.7"/><text x="430.0" y="531.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">стале ім'я й посилання на нього довішує udev</tspan></text>
<text x="430.0" y="604.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">число лишилося адресою всередині ядра; назовні його заступило ім'я</text>
</svg>