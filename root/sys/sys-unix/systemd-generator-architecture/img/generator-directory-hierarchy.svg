<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1360 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1360" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="675.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія каталогів пошуку генераторів та порядок пріоритету виводу ($1, $2, $3)</text>
<rect x="40.0" y="80.0" width="620.0" height="560.0" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="350.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Каталоги розташування виконуваних генераторів</text>
<rect x="60.0" y="145.0" width="580.0" height="95.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="188.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">1. /run/systemd/system-generators/</tspan><tspan x="350.0" dy="16.9">Динамічні генератори рантайму (найвищий пріоритет)</tspan></text>
<line x1="350.0" y1="240.0" x2="350.0" y2="260.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="260.0" width="580.0" height="95.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="303.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">2. /etc/systemd/system-generators/</tspan><tspan x="350.0" dy="16.9">Адміністративні кастомні генератори системи</tspan></text>
<line x1="350.0" y1="355.0" x2="350.0" y2="375.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="375.0" width="580.0" height="95.0" rx="6" fill="#f3e5f5" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="418.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">3. /usr/local/lib/systemd/system-generators/</tspan><tspan x="350.0" dy="16.9">Локально встановлені генератори розробника</tspan></text>
<line x1="350.0" y1="470.0" x2="350.0" y2="490.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="490.0" width="580.0" height="125.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="548.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">4. /lib/systemd/system-generators/ (або /usr/lib/...)</tspan><tspan x="350.0" dy="16.9">Системні генератори з пакетів дистрибутива (fstab, cryptsetup)</tspan></text>
<rect x="690.0" y="80.0" width="620.0" height="560.0" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="1000.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок завантаження юнітів у пам'ять PID 1</text>
<rect x="710.0" y="145.0" width="580.0" height="70.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="176.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1000.0" dy="0.0">1. /run/systemd/generator.early (Аргумент $2)</tspan><tspan x="1000.0" dy="16.9">Перекриває навіть стабільні конфіги у /etc/systemd/system!</tspan></text>
<rect x="710.0" y="225.0" width="580.0" height="65.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="253.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">2. /etc/systemd/system</tspan><tspan x="1000.0" dy="16.9">Статичні адміністративні юніти системи</tspan></text>
<rect x="710.0" y="300.0" width="580.0" height="65.0" rx="6" fill="#f3e5f5" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="328.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">3. /run/systemd/system</tspan><tspan x="1000.0" dy="16.9">Динамічні рантайм юніти</tspan></text>
<rect x="710.0" y="375.0" width="580.0" height="70.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="406.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1000.0" dy="0.0">4. /run/systemd/generator (Аргумент $1)</tspan><tspan x="1000.0" dy="16.9">Стандартний вивід генераторів (fstab, gpt-auto)</tspan></text>
<rect x="710.0" y="455.0" width="580.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="483.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">5. /usr/lib/systemd/system або /lib/systemd/system</tspan><tspan x="1000.0" dy="16.9">Пакетні дефолтні юніти дистрибутива</tspan></text>
<rect x="710.0" y="530.0" width="580.0" height="70.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="1000.0" y="561.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1000.0" dy="0.0">6. /run/systemd/generator.late (Аргумент $3)</tspan><tspan x="1000.0" dy="16.9">Фолбек-юніти (найнижчий пріоритет завантаження)</tspan></text>
</svg>