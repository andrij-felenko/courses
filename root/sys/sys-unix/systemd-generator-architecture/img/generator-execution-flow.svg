<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1360 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1360" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="675.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життєвий цикл та фази виконання генераторів у системному менеджері systemd</text>
<rect x="40.0" y="80.0" width="360.0" height="580.0" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="220.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Тригер виконання</text>
<rect x="60.0" y="145.0" width="320.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Ранній boot системи:</tspan><tspan x="220.0" dy="14.3">PID 1 старт у initramfs або після switch_root</tspan></text>
<rect x="60.0" y="275.0" width="320.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="326.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Команда адміністратора:</tspan><tspan x="220.0" dy="16.9">systemctl daemon-reload</tspan></text>
<rect x="60.0" y="405.0" width="320.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="456.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Перехід між цілями:</tspan><tspan x="220.0" dy="16.9">Зміна ранніх системних boot targets</tspan></text>
<rect x="60.0" y="535.0" width="320.0" height="100.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="582.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Очищення каталогу /run:</tspan><tspan x="220.0" dy="13.0">видалення старого виводу у /run/systemd/generator*</tspan></text>
<line x1="400.0" y1="350.0" x2="440.0" y2="350.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="450.0" y="80.0" width="450.0" height="580.0" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="675.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Паралельне виконання (PID 1)</text>
<rect x="470.0" y="145.0" width="410.0" height="80.0" rx="6" fill="#f3e5f5" stroke="#333333" stroke-width="1.5"/><text x="675.0" y="181.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Сканування каталогів генераторів:</tspan><tspan x="675.0" dy="16.9">/run, /etc, /usr/local/lib, /lib</tspan></text>
<line x1="675.0" y1="225.0" x2="675.0" y2="255.0" stroke="#333333" stroke-width="1.5"/>
<rect x="470.0" y="255.0" width="410.0" height="110.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="675.0" y="280.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="675.0" dy="0.0">Паралельний fork() + execve():</tspan><tspan x="675.0" dy="16.9">- systemd-fstab-generator</tspan><tspan x="675.0" dy="16.9">- systemd-gpt-auto-generator</tspan><tspan x="675.0" dy="16.9">- systemd-cryptsetup-generator</tspan><tspan x="675.0" dy="16.9">- custom-generators...</tspan></text>
<line x1="675.0" y1="365.0" x2="675.0" y2="395.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="470.0" y="395.0" width="410.0" height="120.0" rx="6" fill="#eceff1" stroke="#333333" stroke-width="1.5"/><text x="675.0" y="434.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Аргументи виклику:</tspan><tspan x="675.0" dy="16.9">$1 = /run/systemd/generator</tspan><tspan x="675.0" dy="16.9">$2 = /run/systemd/generator.early</tspan><tspan x="675.0" dy="16.9">$3 = /run/systemd/generator.late</tspan></text>
<line x1="675.0" y1="515.0" x2="675.0" y2="545.0" stroke="#333333" stroke-width="1.5"/>
<rect x="470.0" y="545.0" width="410.0" height="90.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="675.0" y="586.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Синхронне очікування:</tspan><tspan x="675.0" dy="16.9">PID 1 блокує boot до завершення усіх генераторів</tspan></text>
<line x1="900.0" y1="350.0" x2="940.0" y2="350.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="950.0" y="80.0" width="360.0" height="580.0" rx="6" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="1130.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Завантаження юнітів</text>
<rect x="970.0" y="145.0" width="320.0" height="140.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1130.0" y="202.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1130.0" dy="0.0">Зчитування згенерованих файлів:</tspan><tspan x="1130.0" dy="16.9">- *.mount, *.service, *.target</tspan><tspan x="1130.0" dy="16.9">- симлінки .wants/ та .requires/</tspan></text>
<line x1="1130.0" y1="285.0" x2="1130.0" y2="315.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="970.0" y="315.0" width="320.0" height="140.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1130.0" y="382.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="1130.0" dy="0.0">Злиття з юнітами диска:</tspan><tspan x="1130.0" dy="11.7">поєднання з /etc/systemd/system та /lib/systemd/system</tspan></text>
<line x1="1130.0" y1="455.0" x2="1130.0" y2="485.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="970.0" y="485.0" width="320.0" height="150.0" rx="6" fill="#eaf6ef" stroke="#333333" stroke-width="1.5"/><text x="1130.0" y="557.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1130.0" dy="0.0">Побудова DAG графа:</tspan><tspan x="1130.0" dy="11.7">активація транзакцій запусків та старт системних служб</tspan></text>
</svg>