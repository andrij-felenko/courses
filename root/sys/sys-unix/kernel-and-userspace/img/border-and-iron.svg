<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1370 738" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1370" height="738" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="680.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межа й залізо під нею: від PDP-7 до PDP-11/45</text>
<rect x="40.0" y="62.0" width="250.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">Машина й роки</tspan></text>
<rect x="306.0" y="62.0" width="330.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="471.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="471.0" dy="0.0">Що вміло залізо</tspan></text>
<rect x="652.0" y="62.0" width="342.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="823.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="823.0" dy="0.0">Чим була межа в Unix</tspan></text>
<rect x="1010.0" y="62.0" width="310.0" height="56.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="1165.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1165.0" dy="0.0">Що могло піти не так</tspan></text>
<rect x="40.0" y="132.0" width="250.0" height="112.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="183.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">PDP-7</tspan><tspan x="165.0" dy="18.2">1969–1970</tspan></text>
<rect x="306.0" y="132.0" width="330.0" height="112.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="471.0" y="176.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="471.0" dy="0.0">нічого:</tspan><tspan x="471.0" dy="15.6">ані режимів процесора,</tspan><tspan x="471.0" dy="15.6">ані захисту пам'яті</tspan></text>
<rect x="652.0" y="132.0" width="342.0" height="112.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="823.0" y="176.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="823.0" dy="0.0">домовленість:</tspan><tspan x="823.0" dy="15.6">CAL — виклик підпрограми</tspan><tspan x="823.0" dy="15.6">крізь комірку 020</tspan></text>
<rect x="1010.0" y="132.0" width="310.0" height="112.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1165.0" y="176.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1165.0" dy="0.0">програма могла вписатися</tspan><tspan x="1165.0" dy="15.6">просто в ядро —</tspan><tspan x="1165.0" dy="15.6">і ніхто б не помітив</tspan></text>
<rect x="40.0" y="256.0" width="250.0" height="112.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="307.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">PDP-11/20</tspan><tspan x="165.0" dy="18.2">1970–1971</tspan></text>
<rect x="306.0" y="256.0" width="330.0" height="112.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="471.0" y="300.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="471.0" dy="0.0">теж нічого:</tspan><tspan x="471.0" dy="15.6">«незахищена» —</tspan><tspan x="471.0" dy="15.6">слово самого Рітчі</tspan></text>
<rect x="652.0" y="256.0" width="342.0" height="112.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="823.0" y="300.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="823.0" dy="0.0">той самий список викликів,</tspan><tspan x="823.0" dy="15.6">уже з іменами шляхів</tspan><tspan x="823.0" dy="15.6">та справжнім exec</tspan></text>
<rect x="1010.0" y="256.0" width="310.0" height="112.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1165.0" y="300.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1165.0" dy="0.0">«кожна проба нової програми</tspan><tspan x="1165.0" dy="15.6">вимагала обережності</tspan><tspan x="1165.0" dy="15.6">й відваги»</tspan></text>
<rect x="40.0" y="380.0" width="250.0" height="112.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="431.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">PDP-11/20 + KS11</tspan><tspan x="165.0" dy="18.2">приблизно 1972</tspan></text>
<rect x="306.0" y="380.0" width="330.0" height="112.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="471.0" y="424.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="471.0" dy="0.0">окрема коробка на шині:</tspan><tspan x="471.0" dy="15.6">межі й зсув</tspan><tspan x="471.0" dy="15.6">для двох сегментів</tspan></text>
<rect x="652.0" y="380.0" width="342.0" height="112.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="823.0" y="424.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="823.0" dy="0.0">той самий список —</tspan><tspan x="823.0" dy="15.6">уперше є чим</tspan><tspan x="823.0" dy="15.6">підперти його знизу</tspan></text>
<rect x="1010.0" y="380.0" width="310.0" height="112.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1165.0" y="424.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1165.0" dy="0.0">ядро вціліє,</tspan><tspan x="1165.0" dy="15.6">а чи були режими —</tspan><tspan x="1165.0" dy="15.6">сказати вже нема з чого</tspan></text>
<rect x="40.0" y="504.0" width="250.0" height="112.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="165.0" y="555.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">PDP-11/45</tspan><tspan x="165.0" dy="18.2">1972–1973</tspan></text>
<rect x="306.0" y="504.0" width="330.0" height="112.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="471.0" y="548.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="471.0" dy="0.0">три режими в PSW</tspan><tspan x="471.0" dy="15.6">+ KT11-C: своя таблиця</tspan><tspan x="471.0" dy="15.6">сторінок на кожен режим</tspan></text>
<rect x="652.0" y="504.0" width="342.0" height="112.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="823.0" y="548.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="823.0" dy="0.0">той самий список —</tspan><tspan x="823.0" dy="15.6">тепер крізь</tspan><tspan x="823.0" dy="15.6">апаратну пастку</tspan></text>
<rect x="1010.0" y="504.0" width="310.0" height="112.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1165.0" y="548.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1165.0" dy="0.0">межу боронить апаратура,</tspan><tspan x="1165.0" dy="15.6">а не сумлінність</tspan><tspan x="1165.0" dy="15.6">того, хто пише код</tspan></text>
<rect x="40.0" y="640.0" width="1280.0" height="78.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="674.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Третій стовпчик за чотири роки не змінився жодного разу.</tspan><tspan x="680.0" dy="18.2">Змінювався лише другий — те, чим межу підпирають знизу.</tspan></text>
</svg>