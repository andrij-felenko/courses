<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1350 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1350" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="670.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три режими PDP-11/45: усередину — лише пасткою</text>
<rect x="350.0" y="72.0" width="570.0" height="92.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="635.0" y="114.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">User — біти 15,14 = 11</tspan><tspan x="635.0" dy="16.9">HALT заборонено, RESET і SPL машина ігнорує</tspan></text>
<rect x="350.0" y="184.0" width="570.0" height="92.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="635.0" y="226.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Supervisor — біти 15,14 = 01</tspan><tspan x="635.0" dy="16.9">у Unix у цьому режимі не виконується ніщо</tspan></text>
<rect x="350.0" y="296.0" width="570.0" height="92.0" rx="6" fill="#eafaf0" stroke="#333333" stroke-width="1.5"/><text x="635.0" y="338.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Kernel — біти 15,14 = 00</tspan><tspan x="635.0" dy="16.9">усі команди, усі вектори пасток лежать тут</tspan></text>
<line x1="292.0" y1="388.0" x2="292.0" y2="78.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="40.0" y="168.0" width="230.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="155.0" y="203.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">назовні — RTT</tspan><tspan x="155.0" dy="16.9">біти режиму</tspan><tspan x="155.0" dy="16.9">зовнішній код може</tspan><tspan x="155.0" dy="16.9">лише ВСТАНОВИТИ:</tspan><tspan x="155.0" dy="16.9">0 → 1</tspan></text>
<line x1="978.0" y1="78.0" x2="978.0" y2="388.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<rect x="1000.0" y="168.0" width="300.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="1150.0" y="203.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1150.0" dy="0.0">усередину — пастка</tspan><tspan x="1150.0" dy="16.9">або переривання</tspan><tspan x="1150.0" dy="16.9">зняти біти (1 → 0)</tspan><tspan x="1150.0" dy="16.9">здатна тільки апаратура,</tspan><tspan x="1150.0" dy="16.9">і лише за своїм вектором</tspan></text>
<rect x="350.0" y="420.0" width="570.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="635.0" y="453.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Кожен режим має власний R6</tspan><tspan x="635.0" dy="16.9">і власний набір регістрів сторінок.</tspan></text>
<rect x="40.0" y="522.0" width="1260.0" height="130.0" rx="6" fill="#fff5e0" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="566.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Unix узяв із трьох рівнів два. Порожній середній не пропав дарма:</tspan><tspan x="670.0" dy="16.9">його набір регістрів сторінок ядро вживає як пересувне вікно в чужу пам'ять —</tspan><tspan x="670.0" dy="16.9">ставить SISA0 на потрібну сторінку, оголошує режим Supervisor «попереднім»</tspan><tspan x="670.0" dy="16.9">і читає крізь нього командами MFPD/MTPD, не виконавши в ньому жодної інструкції.</tspan></text>
</svg>