<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1440 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1440" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="715.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна відсутня сторінка, три різні кінцівки</text>
<text x="180.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">що подали</text>
<text x="540.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">перевірка діапазону</text>
<text x="930.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">що сталося далі</text>
<text x="1270.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">чим скінчилося</text>
<rect x="40.0" y="95.0" width="280.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">адреса −4096</tspan><tspan x="180.0" dy="16.9">(бік ядра)</tspan></text>
<rect x="370.0" y="95.0" width="340.0" height="110.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">access_ok: адреса не з нашого боку</tspan><tspan x="540.0" dy="16.9">→ відмова одразу</tspan></text>
<rect x="760.0" y="95.0" width="340.0" height="110.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="930.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">копіювання не почалося,</tspan><tspan x="930.0" dy="16.9">/dev/null навіть не покликано</tspan></text>
<rect x="1150.0" y="95.0" width="240.0" height="110.0" rx="6" fill="#fff5e0" stroke="#27ae60" stroke-width="2.0"/><text x="1270.0" y="154.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1270.0" dy="0.0">EFAULT</tspan></text>
<line x1="328.0" y1="150.0" x2="362.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="718.0" y1="150.0" x2="752.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1108.0" y1="150.0" x2="1142.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="245.0" width="280.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="287.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">адреса 0x10</tspan><tspan x="180.0" dy="16.9">(бік користувача,</tspan><tspan x="180.0" dy="16.9">сторінки немає)</tspan></text>
<rect x="370.0" y="245.0" width="340.0" height="110.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">access_ok: діапазон свій —</tspan><tspan x="540.0" dy="16.9">пропущено далі</tspan></text>
<rect x="760.0" y="245.0" width="340.0" height="110.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="930.0" y="287.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">копіювання спіткнулося об збій;</tspan><tspan x="930.0" dy="16.9">для цих команд зареєстровано</tspan><tspan x="930.0" dy="16.9">адресу відкату</tspan></text>
<rect x="1150.0" y="245.0" width="240.0" height="110.0" rx="6" fill="#fff5e0" stroke="#27ae60" stroke-width="2.0"/><text x="1270.0" y="287.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1270.0" dy="0.0">EFAULT</tspan><tspan x="1270.0" dy="16.9">(до /dev/null — 16:</tspan><tspan x="1270.0" dy="16.9">копіювання не було)</tspan></text>
<line x1="328.0" y1="300.0" x2="362.0" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="718.0" y1="300.0" x2="752.0" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1108.0" y1="300.0" x2="1142.0" y2="300.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="395.0" width="280.0" height="110.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="446.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">*(volatile char*)0x10</tspan><tspan x="180.0" dy="16.9">у вашому коді</tspan></text>
<rect x="370.0" y="395.0" width="340.0" height="110.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="446.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">перевірок немає:</tspan><tspan x="540.0" dy="16.9">це не системний виклик</tspan></text>
<rect x="760.0" y="395.0" width="340.0" height="110.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="930.0" y="437.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">той самий збій сторінки,</tspan><tspan x="930.0" dy="16.9">але відкоту для вашої команди</tspan><tspan x="930.0" dy="16.9">ніхто не реєстрував</tspan></text>
<rect x="1150.0" y="395.0" width="240.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="1270.0" y="446.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1270.0" dy="0.0">SIGSEGV</tspan><tspan x="1270.0" dy="16.9">процес мертвий</tspan></text>
<line x1="328.0" y1="450.0" x2="362.0" y2="450.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="718.0" y1="450.0" x2="752.0" y2="450.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1108.0" y1="450.0" x2="1142.0" y2="450.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="530.0" width="1350.0" height="76.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="715.0" y="564.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Адреса та сама, апаратна подія та сама. Різниця в тому, по який бік межі виконувалася команда,</tspan><tspan x="715.0" dy="16.9">що спіткнулася: для команди ядра адресу відкату зареєстровано заздалегідь, для вашої — ні.</tspan></text>
