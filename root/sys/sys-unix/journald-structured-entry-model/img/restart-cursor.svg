<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відновлення позиції читача за курсором</text>
<text x="650.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">перезапуск читача: три випадки після збереженого курсора</text>
<rect x="390.0" y="74.0" width="520.0" height="62.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="650.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">sd_journal_seek_cursor(збережений)</tspan><tspan x="650.0" dy="19.5">+ sd_journal_next()</tspan></text>
<rect x="40.0" y="210.0" width="380.0" height="156.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="230.0" y="247.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">next() повернув 0</tspan><tspan x="230.0" dy="18.2"></tspan><tspan x="230.0" dy="18.2">ставати нема на що:</tspan><tspan x="230.0" dy="18.2">журнал порожній або</tspan><tspan x="230.0" dy="18.2">обрізаний до курсора</tspan><tspan x="230.0" dy="18.2">→ просто чекаємо</tspan></text>
<rect x="460.0" y="210.0" width="380.0" height="156.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="247.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">test_cursor() &gt; 0</tspan><tspan x="650.0" dy="18.2"></tspan><tspan x="650.0" dy="18.2">це той самий запис,</tspan><tspan x="650.0" dy="18.2">він уже оброблений</tspan><tspan x="650.0" dy="18.2">→ нічого не робимо,</tspan><tspan x="650.0" dy="18.2">наступний next() дасть новий</tspan></text>
<rect x="880.0" y="210.0" width="380.0" height="156.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1070.0" y="247.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1070.0" dy="0.0">test_cursor() == 0</tspan><tspan x="1070.0" dy="18.2"></tspan><tspan x="1070.0" dy="18.2">запис прибрано ротацією;</tspan><tspan x="1070.0" dy="18.2">стоїмо на найближчому за часом</tspan><tspan x="1070.0" dy="18.2">→ обробляємо його</tspan><tspan x="1070.0" dy="18.2">і кажемо про пропуск уголос</tspan></text>
<line x1="600.0" y1="142.0" x2="232.0" y2="204.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="650.0" y1="142.0" x2="650.0" y2="204.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="142.0" x2="1068.0" y2="204.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="412.0" width="1220.0" height="68.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="650.0" y="451.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">ні дубліката, ні тихого пропуску — тому курсор зберігають ПІСЛЯ обробки запису</tspan></text>
</svg>