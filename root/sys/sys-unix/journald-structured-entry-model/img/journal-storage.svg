<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де живе журнал</text>
<text x="650.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">де лежать записи від вмикання живлення й далі</text>
<rect x="40.0" y="96.0" width="290.0" height="230.0" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="185.0" y="179.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">кільцевий буфер ядра</tspan><tspan x="185.0" dy="18.2"></tspan><tspan x="185.0" dy="18.2">повідомлення ядра</tspan><tspan x="185.0" dy="18.2">чекають, поки демон</tspan><tspan x="185.0" dy="18.2">взагалі запуститься</tspan></text>
<rect x="350.0" y="96.0" width="290.0" height="230.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/><text x="495.0" y="179.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="495.0" dy="0.0">/run/log/journal</tspan><tspan x="495.0" dy="18.2"></tspan><tspan x="495.0" dy="18.2">це tmpfs, тобто пам'ять:</tspan><tspan x="495.0" dy="18.2">/var ще не змонтовано,</tspan><tspan x="495.0" dy="18.2">а писати треба вже</tspan></text>
<rect x="660.0" y="96.0" width="290.0" height="230.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/><text x="805.0" y="179.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">/var/log/journal</tspan><tspan x="805.0" dy="18.2"></tspan><tspan x="805.0" dy="18.2">з'явився /var — служба</tspan><tspan x="805.0" dy="18.2">перенесення переливає</tspan><tspan x="805.0" dy="18.2">накопичене й лишає там</tspan></text>
<rect x="970.0" y="96.0" width="290.0" height="230.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1115.0" y="179.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1115.0" dy="0.0">ротація й прибирання</tspan><tspan x="1115.0" dy="18.2"></tspan><tspan x="1115.0" dy="18.2">запис не редагують,</tspan><tspan x="1115.0" dy="18.2">тому звільняють місце</tspan><tspan x="1115.0" dy="18.2">лише цілими файлами</tspan></text>
<line x1="334.0" y1="211.0" x2="344.0" y2="211.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="644.0" y1="211.0" x2="654.0" y2="211.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="954.0" y1="211.0" x2="964.0" y2="211.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="650.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">перезавантаження переживе лише те, що встигли перенести в /var</text>
</svg>