<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1330 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1330" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="660.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де на шляху запису в /proc/sys народжується кожна помилка</text>
<rect x="40.0" y="70.0" width="200.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/><text x="140.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">open()</tspan><tspan x="140.0" dy="18.2">пошук імені</tspan></text>
<rect x="40.0" y="160.0" width="200.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="140.0" y="190.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">перевірка бітів прав</tspan><tspan x="140.0" dy="15.6">на знайденому записі</tspan></text>
<rect x="40.0" y="300.0" width="200.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="140.0" y="344.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">ENOENT — шляху немає</tspan><tspan x="140.0" dy="15.6">EACCES — біти не дають</tspan></text>
<line x1="248.0" y1="108.0" x2="292.0" y2="108.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="140.0" y1="228.0" x2="140.0" y2="296.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="300.0" y="70.0" width="200.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/><text x="400.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">write()</tspan><tspan x="400.0" dy="18.2">вхід у ядро</tspan></text>
<rect x="300.0" y="160.0" width="200.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="400.0" y="190.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">запис ще існує?</tspan><tspan x="400.0" dy="15.6">права ще ті самі?</tspan></text>
<rect x="300.0" y="300.0" width="200.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="400.0" y="336.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">ENOENT — запис зняли</tspan><tspan x="400.0" dy="15.6">EPERM — права змінились</tspan><tspan x="400.0" dy="15.6">ENOMEM — завеликий буфер</tspan></text>
<line x1="508.0" y1="108.0" x2="552.0" y2="108.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="400.0" y1="228.0" x2="400.0" y2="296.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="560.0" y="70.0" width="200.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/><text x="660.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">гачок eBPF</tspan><tspan x="660.0" dy="18.2">cgroup/sysctl</tspan></text>
<rect x="560.0" y="160.0" width="200.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="660.0" y="190.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">програма бачить ім'я</tspan><tspan x="660.0" dy="15.6">й нове значення</tspan></text>
<rect x="560.0" y="300.0" width="200.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="344.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">EPERM — програма</tspan><tspan x="660.0" dy="15.6">повернула 0</tspan></text>
<line x1="768.0" y1="108.0" x2="812.0" y2="108.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="660.0" y1="228.0" x2="660.0" y2="296.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="820.0" y="70.0" width="200.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/><text x="920.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="920.0" dy="0.0">обробник</tspan><tspan x="920.0" dy="18.2">proc_do*</tspan></text>
<rect x="820.0" y="160.0" width="200.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="920.0" y="190.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">розбір тексту</tspan><tspan x="920.0" dy="15.6">й звірка з межами</tspan></text>
<rect x="820.0" y="300.0" width="200.0" height="96.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="920.0" y="336.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">EINVAL — не число</tspan><tspan x="920.0" dy="15.6">EINVAL — поза межами</tspan><tspan x="920.0" dy="15.6">ERANGE — у *uint*_minmax</tspan></text>
<line x1="1028.0" y1="108.0" x2="1072.0" y2="108.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="920.0" y1="228.0" x2="920.0" y2="296.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="1080.0" y="70.0" width="200.0" height="76.0" rx="6" fill="#eaf7ef" stroke="#1a1a1a" stroke-width="1.5"/><text x="1180.0" y="112.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1180.0" dy="0.0">змінна ядра</tspan></text>
<rect x="1080.0" y="160.0" width="200.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="1180.0" y="190.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1180.0" dy="0.0">нове значення</tspan><tspan x="1180.0" dy="15.6">на місці</tspan></text>
<rect x="1080.0" y="300.0" width="200.0" height="96.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="1180.0" y="352.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="1180.0" dy="0.0">помилок уже немає</tspan></text>
<line x1="1180.0" y1="228.0" x2="1180.0" y2="296.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="660.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">шлях одного write() і помилки, які він може повернути</text>
<text x="660.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">нуль повернутих байтів або лічильник менший за поданий — теж відповідь: значення взяли не все</text>
<text x="660.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">запис не з нульової позиції у числовий параметр помилки не дає — його просто відкидають</text>
</svg>