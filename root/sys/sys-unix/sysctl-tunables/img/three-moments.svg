<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що ще можна змінити на кожному з трьох моментів життя ядра</text>
<line x1="60.0" y1="118.0" x2="1130.0" y2="118.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="220.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">збірка ядра</text>
<text x="570.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">завантаження</text>
<text x="950.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">робота машини</text>
<rect x="60.0" y="150.0" width="320.0" height="110.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="220.0" y="192.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">.config: y / n / m —</tspan><tspan x="220.0" dy="16.9">чи цей код узагалі</tspan><tspan x="220.0" dy="16.9">потрапить в образ</tspan></text>
<rect x="420.0" y="150.0" width="300.0" height="110.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="570.0" y="201.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">командний рядок ядра,</tspan><tspan x="570.0" dy="16.9">параметри модулів</tspan></text>
<rect x="760.0" y="150.0" width="380.0" height="110.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="950.0" y="201.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">/proc/sys — записом</tspan><tspan x="950.0" dy="16.9">у звичайний файл</tspan></text>
<rect x="60.0" y="285.0" width="320.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="317.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">змінити = перезібрати ядро</tspan></text>
<rect x="420.0" y="285.0" width="300.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="570.0" y="317.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">змінити = перезавантажити</tspan></text>
<rect x="760.0" y="285.0" width="380.0" height="56.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="950.0" y="317.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">змінити = один write(), негайно</tspan></text>
<line x1="950.0" y1="345.0" x2="950.0" y2="388.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="200.0" y="390.0" width="800.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="600.0" y="422.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">перезавантаження стирає все, що записали в /proc/sys:</tspan><tspan x="600.0" dy="16.9">при старті systemd-sysctl просто програє ті самі записи заново</tspan><tspan x="600.0" dy="16.9">з /etc/sysctl.d/*.conf — це не збережене значення, а повтор дії</tspan></text>
</svg>