<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1590 950" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1590" height="950" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="790.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стек взаємодії dm-multipath, scsi_dh_alua та драйверів у Linux</text>
<rect x="100.0" y="80.0" width="640.0" height="280.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="420.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Простір користувача (User Space)</text>
<rect x="238.4" y="136.6" width="363.2" height="86.8" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="160.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">multipathd (Демон багатошляховості)</tspan><tspan x="420.0" dy="15.6">• prio alua (визначає пріоритет через RTPG/sysfs)</tspan><tspan x="420.0" dy="15.6">• path_grouping_policy group_by_prio</tspan><tspan x="420.0" dy="15.6">• path_checker tur (періодичний огляд здоров'я)</tspan></text>
<rect x="276.6" y="271.2" width="286.8" height="47.6" rx="6" fill="#eceff1" stroke="#6b7280" stroke-width="1.5"/><text x="420.0" y="291.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">/etc/multipath.conf</tspan><tspan x="420.0" dy="15.6">hardware_handler &quot;1 alua&quot; · prio &quot;alua&quot;</tspan></text>
<rect x="840.0" y="80.0" width="640.0" height="280.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="1160.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Ядро: Device Mapper (dm-multipath)</text>
<rect x="934.0" y="166.6" width="452.1" height="86.8" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1160.0" y="190.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1160.0" dy="0.0">Віртуальний блоковий пристрій /dev/mapper/mpatha</tspan><tspan x="1160.0" dy="15.6">• Група 1 (Active/Optimized)  → prio 50 [sdb, sdd] (АКТИВНА)</tspan><tspan x="1160.0" dy="15.6">• Група 2 (Active/Non-Optimized) → prio 10 [sdc, sde] (РЕЗЕРВ)</tspan><tspan x="1160.0" dy="15.6">Перемикання групи: коли всі шляхи Групи 1 впали</tspan></text>
<line x1="601.6" y1="180.0" x2="840.0" y2="210.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="790.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ioctl DM_TABLE_LOAD</text>
<rect x="100.0" y="410.0" width="1380.0" height="260.0" rx="8" fill="#eaf0fd" stroke="#333333" stroke-width="2.0"/>
<text x="790.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Ядро: Обробник пристроїв SCSI (scsi_dh_alua)</text>
<rect x="234.7" y="497.6" width="210.7" height="84.8" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="520.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Ініціалізація та опитування</tspan><tspan x="340.0" dy="15.6">• Зчитування INQUIRY TPGS</tspan><tspan x="340.0" dy="15.6">• Періодичний виклик RTPG</tspan><tspan x="340.0" dy="15.6">• Заповнення sysfs alua_*</tspan></text>
<rect x="626.5" y="497.6" width="327.0" height="84.8" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="520.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Перехоплення помилок і Sense-кодів</tspan><tspan x="790.0" dy="15.6">• 06h / 2Ah / 06h → Асинхронний RTPG</tspan><tspan x="790.0" dy="15.6">• 02h / 04h / 0Ah → Затримка (Transitioning)</tspan><tspan x="790.0" dy="15.6">• 02h / 04h / 0Bh → Шлях непридатний</tspan></text>
<rect x="1107.3" y="497.6" width="265.4" height="84.8" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1240.0" y="520.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1240.0" dy="0.0">Активація та керування (STPG)</tspan><tspan x="1240.0" dy="15.6">• Надсилання SET TARGET PORT GROUPS</tspan><tspan x="1240.0" dy="15.6">• Переведення TPG у стан Active</tspan><tspan x="1240.0" dy="15.6">• Синхронізація з dm-multipath</tspan></text>
<rect x="100.0" y="720.0" width="1380.0" height="170.0" rx="8" fill="#eceff1" stroke="#333333" stroke-width="1.5"/>
<text x="790.0" y="755.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">SCSI Mid-layer, sysfs (/sys/class/scsi_disk/.../alua_access_state) та HBA Драйвери</text>
<rect x="174.8" y="804.0" width="170.5" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="260.0" y="824.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">/dev/sdb (Шлях 1 · AO)</tspan></text>
<rect x="524.8" y="804.0" width="170.5" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="824.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">/dev/sdd (Шлях 2 · AO)</tspan></text>
<rect x="881.3" y="804.0" width="177.3" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="970.0" y="824.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">/dev/sdc (Шлях 3 · ANO)</tspan></text>
<rect x="1231.3" y="804.0" width="177.3" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="1320.0" y="824.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1320.0" dy="0.0">/dev/sde (Шлях 4 · ANO)</tspan></text>
<line x1="1160.0" y1="253.4" x2="1160.0" y2="410.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
