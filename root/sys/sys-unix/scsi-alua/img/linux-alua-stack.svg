<line x1="790.0" y1="582.4" x2="790.0" y2="720.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1240.0" y1="582.4" x2="1240.0" y2="720.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
