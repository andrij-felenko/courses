<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія синтаксису crontab та логіка перевірки умов</text>
<rect x="30.0" y="60.0" width="175.0" height="110.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="117.5" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хвилини</text>
<line x1="45.0" y1="104.0" x2="190.0" y2="104.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="117.5" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="117.5" dy="0.0">0 – 59</tspan><tspan x="117.5" dy="16.2">*, */15, 1-30</tspan></text>
<rect x="220.0" y="60.0" width="175.0" height="110.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="307.5" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Години</text>
<line x1="235.0" y1="104.0" x2="380.0" y2="104.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="307.5" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="307.5" dy="0.0">0 – 23</tspan><tspan x="307.5" dy="16.2">*, 0-8, 12,18</tspan></text>
<rect x="410.0" y="60.0" width="175.0" height="110.0" rx="8" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/>
<text x="497.5" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">День місяця</text>
<line x1="425.0" y1="104.0" x2="570.0" y2="104.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="497.5" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="497.5" dy="0.0">1 – 31</tspan><tspan x="497.5" dy="16.2">*, 1,15, L</tspan></text>
<rect x="600.0" y="60.0" width="175.0" height="110.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="687.5" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Місяць</text>
<line x1="615.0" y1="104.0" x2="760.0" y2="104.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="687.5" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="687.5" dy="0.0">1 – 12</tspan><tspan x="687.5" dy="16.2">*, JAN-DEC</tspan></text>
<rect x="790.0" y="60.0" width="175.0" height="110.0" rx="8" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/>
<text x="877.5" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">День тижня</text>
<line x1="805.0" y1="104.0" x2="950.0" y2="104.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="877.5" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="877.5" dy="0.0">0 – 7 (0=7=Нд)</tspan><tspan x="877.5" dy="16.2">*, 1-5, MON-FRI</tspan></text>
<rect x="30.0" y="200.0" width="935.0" height="120.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="500.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило об'єднання умов: кон'юнкція проти диз'юнкції (POSIX / Vixie cron)</text>
<text x="500.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">• Хвилини, Години та Місяць завжди перевіряються через логічне «І» (AND).</tspan><tspan x="500.0" dy="14.9">• КРИТИЧНИЙ ВИНЯТОК: Якщо День Місяця (DOM) та День Тижня (DOW) обидва явно обмежені (жоден не є «*»),</tspan><tspan x="500.0" dy="14.9">  вони об'єднуються через логічне «АБО» (OR)! Завдання запускається, якщо виконується ХОЧ ОДНА з умов.</tspan><tspan x="500.0" dy="14.9">• Приклад: «0 2 13 * 5» запускається щоп'ятниці ТА 13-го числа кожного місяця, а не лише «у п'ятницю 13-го».</tspan></text>
<rect x="30.0" y="340.0" width="455.0" height="115.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="257.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Користувацький crontab (crontab -e)</text>
<line x1="45.0" y1="378.0" x2="470.0" y2="378.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="257.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="257.0" dy="0.0">5 полів часу + [команда]</tspan><tspan x="257.0" dy="14.9">Користувач визначається власником файлу</tspan><tspan x="257.0" dy="14.9">Файли в /var/spool/cron/crontabs/</tspan></text>
<rect x="510.0" y="340.0" width="455.0" height="115.0" rx="8" fill="#fff6e5" stroke="#c0392b" stroke-width="1.5"/>
<text x="737.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Системний crontab (/etc/crontab, /etc/cron.d/*)</text>
<line x1="525.0" y1="378.0" x2="950.0" y2="378.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="737.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="737.0" dy="0.0">5 полів часу + [КОРИСТУВАЧ] + [команда]</tspan><tspan x="737.0" dy="14.9">Шосте поле явно вказує UID виконання</tspan><tspan x="737.0" dy="14.9">Завантажується автоматично демоном</tspan></text>
</svg>