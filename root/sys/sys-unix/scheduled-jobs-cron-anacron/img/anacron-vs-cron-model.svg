<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння парадигм виконання: демон cron проти anacron</text>
<rect x="30.0" y="50.0" width="455.0" height="410.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="257.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Модель cron: неперервний сервер (24/7)</text>
<line x1="50.0" y1="95.0" x2="465.0" y2="95.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="257.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="257.0" dy="0.0">• Прив'язка до абсолютного астрономічного часу (година:хвилина).</tspan><tspan x="257.0" dy="16.8">• Демон спить і прокидається на початку кожної хвилини.</tspan><tspan x="257.0" dy="16.8">• Немає пам'яті минулого: якщо машина була вимкнена</tspan><tspan x="257.0" dy="16.8">  або спала в момент розкладу — ЗАВДАННЯ ВТРАЧАЄТЬСЯ.</tspan><tspan x="257.0" dy="16.8"></tspan><tspan x="257.0" dy="16.8">• Точність: дискретна, рівно 1 хвилина.</tspan><tspan x="257.0" dy="16.8">• Рівень: системний та окремий для кожного користувача.</tspan><tspan x="257.0" dy="16.8">• Ідеально для: постійно активних серверів та хмарних вузлів.</tspan></text>
<rect x="515.0" y="50.0" width="455.0" height="410.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="742.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Модель anacron: машини з перервами в роботі</text>
<line x1="535.0" y1="95.0" x2="950.0" y2="95.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="742.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="742.0" dy="0.0">• Прив'язка до періоду в днях (1 = щодня, 7 = щотижня, 30 = щомісяця).</tspan><tspan x="742.0" dy="16.8">• Зберігає позначки часу в /var/spool/anacron/&lt;job_id&gt; (YYYYMMDD).</tspan><tspan x="742.0" dy="16.8">• При старті системи виявляє пропущені дні та виконує завдання.</tspan><tspan x="742.0" dy="16.8">• Затримка старту (delay у хвилинах): запобігає піковому</tspan><tspan x="742.0" dy="16.8">  навантаженню на дискову підсистему відразу після ввімкнення.</tspan><tspan x="742.0" dy="16.8"></tspan><tspan x="742.0" dy="16.8">• Обмеження: мінімальний інтервал — 1 день (без годин і хвилин).</tspan><tspan x="742.0" dy="16.8">• Працює тільки від імені суперкористувача root.</tspan></text>
</svg>