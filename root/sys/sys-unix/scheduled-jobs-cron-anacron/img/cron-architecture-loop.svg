<text x="160.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">/var/spool/cron/crontabs/*</tspan><tspan x="160.0" dy="14.9">(користувацькі crontab -e)</tspan></text>
<rect x="45.0" y="345.0" width="230.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.2"/>
<text x="160.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Перевірка змін:</tspan><tspan x="160.0" dy="14.9">• stat() mtime каталогів</tspan><tspan x="160.0" dy="14.9">• inotify події модифікації</tspan><tspan x="160.0" dy="14.9">• перезапуск не потрібен</tspan></text>
<rect x="330.0" y="50.0" width="340.0" height="420.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="500.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Ядро демона crond</text>
<line x1="345.0" y1="92.0" x2="655.0" y2="92.0" stroke="#2457d6" stroke-width="1.0"/>
<rect x="350.0" y="105.0" width="300.0" height="60.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/>
<text x="500.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">1. Синхронізація з секундою 00</tspan><tspan x="500.0" dy="14.9">sleep(60 - now.tm_sec)</tspan></text>
<rect x="350.0" y="175.0" width="300.0" height="75.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="500.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">2. Перевірка розкладів</tspan><tspan x="500.0" dy="14.9">Парсинг 5 полів часу:</tspan><tspan x="500.0" dy="14.9">(хв, год, день, місяць, день_тижня)</tspan></text>
<rect x="350.0" y="260.0" width="300.0" height="70.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="500.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">3. Збіг з поточним часом?</tspan><tspan x="500.0" dy="14.9">Обчислення бітових масок</tspan><tspan x="500.0" dy="14.9">Особливе правило DOM || DOW</tspan></text>
<rect x="350.0" y="340.0" width="300.0" height="115.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.2"/>
<text x="500.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">4. Обробка завершення</tspan><tspan x="500.0" dy="14.9">• Сигнал SIGCHLD</tspan><tspan x="500.0" dy="14.9">• waitpid(WNOHANG) у циклі</tspan><tspan x="500.0" dy="14.9">• запобігання зомбі-процесам</tspan></text>
<rect x="710.0" y="50.0" width="260.0" height="420.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="840.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ізоляція та запуск</text>
<line x1="725.0" y1="92.0" x2="955.0" y2="92.0" stroke="#6b7280" stroke-width="1.0"/>
<rect x="725.0" y="105.0" width="230.0" height="65.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.2"/>
<text x="840.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">fork() нащадка</tspan><tspan x="840.0" dy="14.9">crond продовжує цикл</tspan></text>
<rect x="725.0" y="180.0" width="230.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="840.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">Зниження привілеїв</tspan><tspan x="840.0" dy="14.9">setgid(), initgroups(),</tspan><tspan x="840.0" dy="14.9">setuid(user), chdir($HOME)</tspan></text>
<rect x="725.0" y="270.0" width="230.0" height="85.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="840.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">Оточення й дескриптори</tspan><tspan x="840.0" dy="14.9">PATH=/usr/bin:/bin</tspan><tspan x="840.0" dy="14.9">stdin -&gt; /dev/null</tspan><tspan x="840.0" dy="14.9">stdout/err -&gt; pipe</tspan></text>
<rect x="725.0" y="365.0" width="230.0" height="90.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.2"/>
<text x="840.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">execve(/bin/sh, -c, cmd)</tspan><tspan x="840.0" dy="14.9">Перехоплення виводу</tspan><tspan x="840.0" dy="14.9">Відправка через sendmail</tspan><tspan x="840.0" dy="14.9">(якщо задано MAILTO)</tspan></text>
