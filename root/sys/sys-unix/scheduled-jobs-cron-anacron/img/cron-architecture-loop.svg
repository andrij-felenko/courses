<rect x="45.0" y="105.0" width="230.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="160.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">/etc/crontab</tspan><tspan x="160.0" dy="14.9">(системний, з полем user)</tspan></text>
<rect x="45.0" y="185.0" width="230.0" height="70.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="160.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">/etc/cron.d/*</tspan><tspan x="160.0" dy="14.9">(пакетні конфігурації)</tspan></text>
