<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура та інтеграція таймерів у підсистему systemd</text>
<rect x="30.0" y="45.0" width="450.0" height="175.0" rx="8" fill="#fff6e5" stroke="#c0392b" stroke-width="1.5"/>
<text x="255.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. Таймер-юніт (*.timer)</text>
<line x1="45.0" y1="85.0" x2="465.0" y2="85.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="255.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">[Timer]</tspan><tspan x="255.0" dy="14.9">OnCalendar=*-*-* 03:00:00        # Календарний розклад</tspan><tspan x="255.0" dy="14.9">OnBootSec=15min                 # Монотонний розклад</tspan><tspan x="255.0" dy="14.9">Persistent=true                 # Виконати пропущене (заміна anacron)</tspan><tspan x="255.0" dy="14.9">RandomizedDelaySec=10m          # Рандомізація пікового навантаження</tspan></text>
<rect x="520.0" y="45.0" width="450.0" height="175.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="745.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2. Сервіс-юніт (*.service)</text>
<line x1="535.0" y1="85.0" x2="955.0" y2="85.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="745.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">[Service]</tspan><tspan x="745.0" dy="14.9">Type=oneshot</tspan><tspan x="745.0" dy="14.9">ExecStart=/usr/local/bin/backup.sh</tspan><tspan x="745.0" dy="14.9">ProtectSystem=strict            # Пісочниця та ізоляція файлової системи</tspan><tspan x="745.0" dy="14.9">MemoryMax=1G                    # Обмеження ресурсів через cgroups v2</tspan></text>
<line x1="480.0" y1="130.0" x2="520.0" y2="130.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="240.0" width="940.0" height="230.0" rx="8" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="500.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Ключові архітектурні переваги systemd timers над cron / anacron</text>
<line x1="50.0" y1="282.0" x2="950.0" y2="282.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="500.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">• Єдине журналювання: stdout і stderr автоматично потрапляють у journald без потреби в локальному sendmail.</tspan><tspan x="500.0" dy="17.4">• Монотонні таймери: запуск відносно завантаження ядра (OnBootSec) або завершення попереднього запуску (OnUnitActiveSec).</tspan><tspan x="500.0" dy="17.4">• Керування залежностями: директиви After=network-online.target та Requires= гарантують готовність інфраструктури.</tspan><tspan x="500.0" dy="17.4">• Повна ізоляція: контроль ресурсів через cgroups, захист файлової системи (DynamicUser, ProtectHome, PrivateTmp).</tspan><tspan x="500.0" dy="17.4">• Прозорий моніторинг: утиліта «systemctl list-timers» відображає точний час наступного спрацьовування та час очікування.</tspan></text>
</svg>