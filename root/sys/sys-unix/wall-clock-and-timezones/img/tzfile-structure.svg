<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="920.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="47.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Внутрішня структура бінарного файлу часового поясу /usr/share/zoneinfo/ (tzfile)</tspan></text>
<rect x="40.0" y="80.0" width="210.0" height="420.0" rx="6" fill="#fdf6e3" stroke="#b58900" stroke-width="1.5"/><text x="145.0" y="228.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">1. Заголовок (44 байти)</tspan><tspan x="145.0" dy="11.7"></tspan><tspan x="145.0" dy="11.7">Магічні байти: &quot;TZif2&quot;</tspan><tspan x="145.0" dy="11.7">Версія формату (1, 2 або 3)</tspan><tspan x="145.0" dy="11.7"></tspan><tspan x="145.0" dy="11.7">Лічильники структури:</tspan><tspan x="145.0" dy="11.7">• tzh_timecnt (кількість переходів)</tspan><tspan x="145.0" dy="11.7">• tzh_typecnt (кількість типів ttinfo)</tspan><tspan x="145.0" dy="11.7">• tzh_charcnt (байти назв зон)</tspan><tspan x="145.0" dy="11.7">• tzh_leapcnt (високосні секунди)</tspan><tspan x="145.0" dy="11.7">• tzh_ttisstdcnt</tspan><tspan x="145.0" dy="11.7">• tzh_ttisgmtcnt</tspan></text>
<rect x="270.0" y="80.0" width="210.0" height="420.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="375.0" y="228.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">2. Таблиці переходів</tspan><tspan x="375.0" dy="13.0"></tspan><tspan x="375.0" dy="13.0">[Масив transition times]</tspan><tspan x="375.0" dy="13.0">timecnt значень 64-бітних цілих</tspan><tspan x="375.0" dy="13.0">(миті time_t за UTC, коли</tspan><tspan x="375.0" dy="13.0">змінювалося правило чи зміщення)</tspan><tspan x="375.0" dy="13.0"></tspan><tspan x="375.0" dy="13.0">[Масив transition types]</tspan><tspan x="375.0" dy="13.0">timecnt байтів-індексів:</tspan><tspan x="375.0" dy="13.0">кожен перехід вказує на</tspan><tspan x="375.0" dy="13.0">відповідний запис ttinfo</tspan></text>
<rect x="500.0" y="80.0" width="220.0" height="420.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="228.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">3. Записи типів (ttinfo)</tspan><tspan x="610.0" dy="13.0"></tspan><tspan x="610.0" dy="13.0">typecnt структур ttinfo:</tspan><tspan x="610.0" dy="13.0">• tt_utoff (зміщення від UTC у с,</tspan><tspan x="610.0" dy="13.0">  наприклад, +7200 або +10800)</tspan><tspan x="610.0" dy="13.0">• tt_isdst (0 — зимовий час,</tspan><tspan x="610.0" dy="13.0">  1 — літній час DST)</tspan><tspan x="610.0" dy="13.0">• tt_desigidx (індекс абревіатури</tspan><tspan x="610.0" dy="13.0">  в таблиці символів)</tspan><tspan x="610.0" dy="13.0"></tspan><tspan x="610.0" dy="13.0">Таблиця назв: &quot;EET\0EEST\0&quot;</tspan></text>
<rect x="740.0" y="80.0" width="220.0" height="420.0" rx="6" fill="#f4f6f8" stroke="#4b5563" stroke-width="1.5"/><text x="850.0" y="208.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">4. Хвіст: POSIX TZ рядок</tspan><tspan x="850.0" dy="15.6"></tspan><tspan x="850.0" dy="15.6">Текстове правило між '\n':</tspan><tspan x="850.0" dy="15.6"></tspan><tspan x="850.0" dy="15.6">&quot;EET-2EEST,M3.5.0/3,</tspan><tspan x="850.0" dy="15.6">M10.5.0/4&quot;</tspan><tspan x="850.0" dy="15.6"></tspan><tspan x="850.0" dy="15.6">Дозволяє бібліотеці</tspan><tspan x="850.0" dy="15.6">обчислювати всі майбутні</tspan><tspan x="850.0" dy="15.6">переходи без нескінченного</tspan><tspan x="850.0" dy="15.6">розширення масиву</tspan><tspan x="850.0" dy="15.6">історичних переходів.</tspan></text>
<line x1="250.0" y1="240.0" x2="270.0" y2="240.0" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="480.0" y1="240.0" x2="500.0" y2="240.0" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="720.0" y1="240.0" x2="740.0" y2="240.0" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>