<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="920.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="47.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Архітектура керування часом, часовими поясами та синхронізацією в systemd</tspan></text>
<rect x="40.0" y="80.0" width="440.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="260.0" y="123.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">Утиліта timedatectl (CLI)</tspan><tspan x="260.0" dy="15.6">Запити стану, зміна часового поясу, налаштування NTP та RTC.</tspan><tspan x="260.0" dy="15.6">Спілкується через системну шину D-Bus.</tspan></text>
<rect x="520.0" y="80.0" width="440.0" height="110.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Програми користувача (Applications)</tspan><tspan x="740.0" dy="14.3">Читають змінну $TZ або /etc/localtime через libc (localtime_r).</tspan><tspan x="740.0" dy="14.3">Викликають clock_gettime() для отримання шкал часу.</tspan></text>
<rect x="40.0" y="230.0" width="440.0" height="140.0" rx="6" fill="#fdf6e3" stroke="#b58900" stroke-width="1.5"/><text x="260.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0">systemd-timedated.service (D-Bus демон)</tspan><tspan x="260.0" dy="13.0">• Обслуговує інтерфейс org.freedesktop.timedate1</tspan><tspan x="260.0" dy="13.0">• Атомарно перезаписує лінк /etc/localtime -&gt; /usr/share/zoneinfo/...</tspan><tspan x="260.0" dy="13.0">• Керує режимом RTC (UTC проти Local) та вмикає службу NTP</tspan></text>
<rect x="520.0" y="230.0" width="440.0" height="140.0" rx="6" fill="#f4f6f8" stroke="#4b5563" stroke-width="1.5"/><text x="740.0" y="275.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">systemd-timesyncd.service (SNTP клієнт)</tspan><tspan x="740.0" dy="14.3">• Конфігурація: /etc/systemd/timesyncd.conf</tspan><tspan x="740.0" dy="14.3">• Синхронізує системний годинник з мережевими серверами NTP</tspan><tspan x="740.0" dy="14.3">• Стан: /var/lib/systemd/timesync/clock (фіксація монотонного часу</tspan><tspan x="740.0" dy="14.3">  для плат без RTC, захист від стрибка в 1970 рік)</tspan></text>
<rect x="40.0" y="410.0" width="920.0" height="100.0" rx="6" fill="#f9fafb" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="447.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Ядро Linux та Апаратний рівень</tspan><tspan x="500.0" dy="16.9">Системний час (CLOCK_REALTIME, CLOCK_MONOTONIC) ⇄ Системні виклики adjtimex / clock_settime</tspan><tspan x="500.0" dy="16.9">Апаратний годинник /dev/rtc0 ⇄ 11-хвилинний автозапис ядра (RTC_SYNC) та hwclock</tspan></text>
<line x1="260.0" y1="190.0" x2="260.0" y2="230.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="740.0" y1="190.0" x2="740.0" y2="230.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="260.0" y1="370.0" x2="260.0" y2="410.0" stroke="#b58900" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="740.0" y1="370.0" x2="740.0" y2="410.0" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>