<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="920.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="47.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Поведінка RTC під час осіннього переведення годинника (03:00 -&gt; 02:00)</tspan></text>
<rect x="40.0" y="80.0" width="920.0" height="180.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="123.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Золотий стандарт Unix: RTC зберігає UTC (безперервна лінійна вісь)</tspan><tspan x="500.0" dy="16.9"></tspan><tspan x="500.0" dy="16.9">00:00 UTC ───────────&gt; 00:30 UTC ───────────&gt; 01:00 UTC ───────────&gt; 01:30 UTC ───────────&gt; 02:00 UTC</tspan><tspan x="500.0" dy="16.9">(03:00 EEST)          (03:30 EEST)          (03:00 EET)           (03:30 EET)           (04:00 EET)</tspan><tspan x="500.0" dy="16.9"></tspan><tspan x="500.0" dy="16.9">✓ Час на апаратному лічильнику зростає суворо монотонно, без стрибків і петель.</tspan><tspan x="500.0" dy="16.9">✓ Зміна зміщення поясу обчислюється в просторі користувача бібліотекою за базою tzdata.</tspan></text>
<rect x="40.0" y="280.0" width="920.0" height="210.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="338.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Спадщина Windows: RTC зберігає місцевий час (Local Time)</tspan><tspan x="500.0" dy="16.9"></tspan><tspan x="500.0" dy="16.9">02:00 (літо) ───&gt; 02:59 (літо) ───[СТРИБОК НАЗАД]───&gt; 02:00 (зима) ───&gt; 03:00 (зима)</tspan><tspan x="500.0" dy="16.9"></tspan><tspan x="500.0" dy="16.9">✗ Петля часу: інтервал [02:00 .. 03:00] повторюється двічі з тими самими апаратними показниками.</tspan><tspan x="500.0" dy="16.9">✗ Пастка подвійного завантаження (Dual-boot): Linux і Windows можуть перевести RTC двічі (-2 год).</tspan><tspan x="500.0" dy="16.9">✗ fsck та раннє монтування: якщо пояс ще невідомий, ядро вважає час у RTC за UTC і ламає позначки.</tspan></text>
</svg>