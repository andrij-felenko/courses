<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="20.0" width="920.0" height="44.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="47.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Апаратний годинник реального часу (RTC) та програмні шкали ядра Linux</tspan></text>
<rect x="40.0" y="80.0" width="260.0" height="440.0" rx="6" fill="#fdf6e3" stroke="#b58900" stroke-width="1.5"/><text x="170.0" y="226.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Апаратний рівень (RTC / CMOS)</tspan><tspan x="170.0" dy="15.6"></tspan><tspan x="170.0" dy="15.6">• Кварцовий резонатор 32.768 кГц</tspan><tspan x="170.0" dy="15.6">• Живлення від батарейки CR2032</tspan><tspan x="170.0" dy="15.6">• Рахує секунди, хвилини, години</tspan><tspan x="170.0" dy="15.6">• Роздільність 1 Гц (цілі секунди)</tspan><tspan x="170.0" dy="15.6">• Температурний дрейф ~20 ppm</tspan><tspan x="170.0" dy="15.6">  (±1.7 с на добу без корекції)</tspan><tspan x="170.0" dy="15.6"></tspan><tspan x="170.0" dy="15.6">Драйвер ядра: /dev/rtc0</tspan><tspan x="170.0" dy="15.6">Інтерфейс ioctl(RTC_RD_TIME)</tspan></text>
<rect x="340.0" y="80.0" width="280.0" height="440.0" rx="6" fill="#f4f6f8" stroke="#4b5563" stroke-width="1.5"/><text x="480.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Міст синхронізації та лічильники</tspan><tspan x="480.0" dy="15.6"></tspan><tspan x="480.0" dy="15.6">[Старт системи: hctosys]</tspan><tspan x="480.0" dy="15.6">Ядро одноразово зчитує RTC</tspan><tspan x="480.0" dy="15.6">та ініціалізує час xtime</tspan><tspan x="480.0" dy="15.6"></tspan><tspan x="480.0" dy="15.6">[Швидкі лічильники (clocksource)]</tspan><tspan x="480.0" dy="15.6">• TSC (CPU Time Stamp Counter)</tspan><tspan x="480.0" dy="15.6">• HPET / ARM Generic Timer</tspan><tspan x="480.0" dy="15.6">Мільярди тактів на секунду</tspan><tspan x="480.0" dy="15.6"></tspan><tspan x="480.0" dy="15.6">[Зворотний запис утилітою або ядром]</tspan><tspan x="480.0" dy="15.6">• hwclock --systohc</tspan><tspan x="480.0" dy="15.6">• Режим 11-хвилинного оновлення</tspan><tspan x="480.0" dy="15.6">  ядра при активному NTP (RTC_SYNC)</tspan></text>
<rect x="660.0" y="80.0" width="300.0" height="440.0" rx="6" fill="#eef7ee" stroke="#27ae60" stroke-width="1.5"/><text x="810.0" y="203.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Шкали часу ядра Linux (POSIX Clocks)</tspan><tspan x="810.0" dy="14.3"></tspan><tspan x="810.0" dy="14.3">CLOCK_REALTIME</tspan><tspan x="810.0" dy="14.3">Настінний час від 1970-01-01 UTC.</tspan><tspan x="810.0" dy="14.3">Може стрибати (NTP step, clock_settime).</tspan><tspan x="810.0" dy="14.3"></tspan><tspan x="810.0" dy="14.3">CLOCK_MONOTONIC</tspan><tspan x="810.0" dy="14.3">Суворо неперервний від старту машини.</tspan><tspan x="810.0" dy="14.3">Не йде назад; зупиняється в сні (suspend).</tspan><tspan x="810.0" dy="14.3"></tspan><tspan x="810.0" dy="14.3">CLOCK_BOOTTIME</tspan><tspan x="810.0" dy="14.3">Монотонний + час сну машини.</tspan><tspan x="810.0" dy="14.3"></tspan><tspan x="810.0" dy="14.3">CLOCK_TAI</tspan><tspan x="810.0" dy="14.3">Атомний час без високосних стрибків.</tspan></text>
<line x1="300.0" y1="160.0" x2="340.0" y2="160.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="340.0" y1="420.0" x2="300.0" y2="420.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="620.0" y1="200.0" x2="660.0" y2="200.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>