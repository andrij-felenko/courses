<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">порядок байтів у відповіді залежить від того, скільки send у польоті</text>
<rect x="20.0" y="62.0" width="250.0" height="70.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="93.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">два recv підряд —</tspan><tspan x="145.0" dy="15.6">два send подано разом</tspan></text>
<line x1="276.0" y1="97.0" x2="314.0" y2="97.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="320.0" y="62.0" width="270.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="455.0" y="93.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">ядро виконує їх незалежно:</tspan><tspan x="455.0" dy="15.6">другий може випередити перший</tspan></text>
<line x1="596.0" y1="97.0" x2="634.0" y2="97.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="62.0" width="260.0" height="70.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="93.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">на дроті «CDAB» —</tspan><tspan x="770.0" dy="15.6">ехо зіпсовано</tspan></text>
<rect x="20.0" y="162.0" width="250.0" height="70.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="193.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">один recv, один send:</tspan><tspan x="145.0" dy="15.6">наступний — лише після CQE</tspan></text>
<line x1="276.0" y1="197.0" x2="314.0" y2="197.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="320.0" y="162.0" width="270.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="455.0" y="193.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="455.0" dy="0.0">у польоті завжди рівно</tspan><tspan x="455.0" dy="15.6">одна операція на з'єднання</tspan></text>
<line x1="596.0" y1="197.0" x2="634.0" y2="197.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="162.0" width="260.0" height="70.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="193.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">на дроті «ABCD» —</tspan><tspan x="770.0" dy="15.6">порядок збережено</tspan></text>
<rect x="20.0" y="250.0" width="880.0" height="40.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="274.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">паралельність кільця дає кількість з'єднань, а не кількість операцій на одному з'єднанні</tspan></text>
</svg>