<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">життя одного буфера з групи наданих</text>
<rect x="20.0" y="128.0" width="160.0" height="78.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="100.0" y="163.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="100.0" dy="0.0">у кільці наданих:</tspan><tspan x="100.0" dy="15.6">вільний</tspan></text>
<rect x="215.0" y="128.0" width="160.0" height="78.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="295.0" y="163.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">ядро само взяло</tspan><tspan x="295.0" dy="15.6">його під recv</tspan></text>
<rect x="410.0" y="128.0" width="160.0" height="78.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="163.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">CQE приніс дані</tspan><tspan x="490.0" dy="15.6">й номер flags &gt;&gt; 16</tspan></text>
<rect x="605.0" y="128.0" width="160.0" height="78.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="685.0" y="163.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">send читає з нього,</tspan><tspan x="685.0" dy="15.6">доки left &gt; 0</tspan></text>
<rect x="800.0" y="128.0" width="160.0" height="78.0" rx="6" fill="#eaf7ee" stroke="#333333" stroke-width="1.5"/><text x="880.0" y="163.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">buf_ring_add:</tspan><tspan x="880.0" dy="15.6">повернули в кільце</tspan></text>
<line x1="186.0" y1="167.0" x2="228.0" y2="167.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="381.0" y1="167.0" x2="423.0" y2="167.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="576.0" y1="167.0" x2="618.0" y2="167.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="771.0" y1="167.0" x2="813.0" y2="167.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="215.0" y1="108.0" x2="765.0" y2="108.0" stroke="#c0392b" stroke-width="1.6"/>
<text x="490.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">увесь цей час буфер належить ядру</text>
<rect x="20.0" y="236.0" width="940.0" height="44.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="262.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">повернути буфер раніше за CQE від send — це віддати ядру пам'ять, у яку воно ще пише</tspan></text>
<rect x="20.0" y="292.0" width="940.0" height="44.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="318.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">res = −ENOBUFS означає, що вільного буфера не було: recv не відбувся, з'єднання чекає на чужий повернений буфер</tspan></text>
</svg>