<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1310 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1310" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="650.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три рівні кеша SSSD</text>
<rect x="60.0" y="40.0" width="1180.0" height="54.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="650.0" y="72.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">програма питає ім'я: getpwnam(&quot;andrij&quot;)</tspan></text>
<rect x="60.0" y="150.0" width="560.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="187.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">1 · кеш у пам'яті, /var/lib/sss/mc</tspan><tspan x="340.0" dy="16.9">клієнтська бібліотека відображає файл у себе</tspan><tspan x="340.0" dy="16.9">й читає прямо з пам'яті процесу</tspan></text>
<rect x="680.0" y="150.0" width="560.0" height="100.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="960.0" y="187.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">влучили — відповідь без сокета</tspan><tspan x="960.0" dy="16.9">й без перемикання контексту;</tspan><tspan x="960.0" dy="16.9">демон навіть не дізнався про запит</tspan></text>
<line x1="624.0" y1="200.0" x2="676.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="272.0" width="560.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="309.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">2 · респондер sssd_nss через локальний сокет</tspan><tspan x="340.0" dy="16.9">дивиться кеш на диску та його терміни,</tspan><tspan x="340.0" dy="16.9">а також пам'ять про те, кого нема</tspan></text>
<rect x="680.0" y="272.0" width="560.0" height="100.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="960.0" y="309.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">запис чинний — віддає його;</tspan><tspan x="960.0" dy="16.9">у негативному кеші — відразу</tspan><tspan x="960.0" dy="16.9">чесне «такого користувача нема»</tspan></text>
<line x1="624.0" y1="322.0" x2="676.0" y2="322.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="394.0" width="560.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="431.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">3 · бекенд sssd_be питає каталог,</tspan><tspan x="340.0" dy="16.9">кладе відповідь у кеш</tspan><tspan x="340.0" dy="16.9">і повертає її респондерові</tspan></text>
<rect x="680.0" y="394.0" width="560.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="960.0" y="431.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="960.0" dy="0.0">каталог мовчить — домен іде в офлайн,</tspan><tspan x="960.0" dy="16.9">і відповідь усе одно беруть із кеша,</tspan><tspan x="960.0" dy="16.9">хай навіть застарілого</tspan></text>
<line x1="624.0" y1="444.0" x2="676.0" y2="444.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="340.0" y1="252.0" x2="340.0" y2="268.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="340.0" y1="374.0" x2="340.0" y2="390.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="340.0" y1="96.0" x2="340.0" y2="146.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="524.0" width="1180.0" height="90.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="650.0" y="556.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">кожен наступний рівень дорожчий приблизно на два порядки: пам'ять, локальний сокет, мережа.</tspan><tspan x="650.0" dy="16.9">перелічити всіх найдешевшим рівнем не можна за задумом — такий запит завжди йде до респондера,</tspan><tspan x="650.0" dy="16.9">тому «покажи всіх користувачів» коштує дорого навіть з теплим кешем</tspan></text>
</svg>