<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Онлайн і офлайн як стан домену</text>
<text x="330.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">домен онлайн</text>
<text x="910.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">домен офлайн</text>
<rect x="120.0" y="84.0" width="420.0" height="150.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="330.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">запити йдуть у каталог,</tspan><tspan x="330.0" dy="16.9">кеш поповнюється,</tspan><tspan x="330.0" dy="16.9">терміни записів продовжуються</tspan></text>
<rect x="700.0" y="84.0" width="420.0" height="150.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="910.0" y="146.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">у мережу не ходимо взагалі,</tspan><tspan x="910.0" dy="16.9">відповіді лише з кеша,</tspan><tspan x="910.0" dy="16.9">вхід — за збереженою перевіркою</tspan></text>
<text x="620.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">кілька операцій</tspan><tspan x="620.0" dy="16.2">зірвалося поспіль</tspan></text>
<line x1="545.0" y1="152.0" x2="695.0" y2="152.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="695.0" y1="196.0" x2="545.0" y2="196.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="620.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">чергова спроба</tspan><tspan x="620.0" dy="16.2">врешті вдалася</tspan></text>
<rect x="120.0" y="288.0" width="420.0" height="96.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="332.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">клієнт чекає стільки,</tspan><tspan x="330.0" dy="16.9">скільки триває запит у каталог</tspan></text>
<rect x="700.0" y="288.0" width="420.0" height="96.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="910.0" y="332.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">клієнт не чекає нічого:</tspan><tspan x="910.0" dy="16.9">таймаутів TCP уже ніхто не починає</tspan></text>
<rect x="120.0" y="430.0" width="1000.0" height="110.0" rx="6" fill="#fdf6e3" stroke="#b7791f" stroke-width="1.5"/><text x="620.0" y="472.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">стан домену береться не з окремої перевірки зв'язку, а з долі власних операцій бекенда.</tspan><tspan x="620.0" dy="16.9">тому «сервер не відповів» ніколи не перетворюється на «такого користувача нема» —</tspan><tspan x="620.0" dy="16.9">перше змінює стан демона, друге є відповіддю каталогу</tspan></text>
</svg>