<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1370 810" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1370" height="810" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="60.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Пул дивиться на адресу запису й бачить один із трьох станів — від нього залежить уся вартість операції</text>
<rect x="60.0" y="84.0" width="320.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="220.0" y="117.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">адреси немає у відображенні</tspan></text>
<rect x="60.0" y="168.0" width="320.0" height="84.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="220.0" y="214.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">взяти вільний блок пулу</tspan></text>
<rect x="60.0" y="272.0" width="320.0" height="84.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="220.0" y="310.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">занулити ту частину блока,</tspan><tspan x="220.0" dy="16.9">яку запит не накриває</tspan></text>
<rect x="60.0" y="376.0" width="320.0" height="84.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="220.0" y="422.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">покласти дані</tspan></text>
<rect x="60.0" y="480.0" width="320.0" height="84.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.4"/><text x="220.0" y="518.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">додати листок у дерево</tspan><tspan x="220.0" dy="16.9">відображень</tspan></text>
<rect x="60.0" y="600.0" width="320.0" height="84.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="220.0" y="638.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">дорого: виділення, занулення</tspan><tspan x="220.0" dy="16.9">і зміна метаданих</tspan></text>
<rect x="520.0" y="84.0" width="320.0" height="58.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.8"/><text x="680.0" y="117.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">адреса відображена, блок наш</tspan></text>
<rect x="520.0" y="168.0" width="320.0" height="84.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="680.0" y="214.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">знайти блок у дереві</tspan></text>
<rect x="520.0" y="272.0" width="320.0" height="84.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="680.0" y="318.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">покласти дані просто в нього</tspan></text>
<rect x="520.0" y="376.0" width="320.0" height="84.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="680.0" y="422.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">—</tspan></text>
<rect x="520.0" y="480.0" width="320.0" height="84.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="680.0" y="526.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">метадані не змінюються</tspan></text>
<rect x="520.0" y="600.0" width="320.0" height="84.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.6"/><text x="680.0" y="638.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">дешево: звичайний запис</tspan><tspan x="680.0" dy="16.9">плюс один пошук у дереві</tspan></text>
<rect x="980.0" y="84.0" width="320.0" height="58.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="1140.0" y="117.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1140.0" dy="0.0">адреса відображена, блок спільний</tspan></text>
<rect x="980.0" y="168.0" width="320.0" height="84.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="1140.0" y="214.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">взяти вільний блок пулу</tspan></text>
<rect x="980.0" y="272.0" width="320.0" height="84.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="1140.0" y="310.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">скопіювати ВЕСЬ старий блок</tspan><tspan x="1140.0" dy="16.9">у новий</tspan></text>
<rect x="980.0" y="376.0" width="320.0" height="84.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="1140.0" y="422.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">покласти поверх нові дані</tspan></text>
<rect x="980.0" y="480.0" width="320.0" height="84.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4"/><text x="1140.0" y="518.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">переставити листок нашого</tspan><tspan x="1140.0" dy="16.9">дерева на новий блок</tspan></text>
<rect x="980.0" y="600.0" width="320.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="1140.0" y="638.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1140.0" dy="0.0">найдорожче: 4 КіБ запису тягнуть</tspan><tspan x="1140.0" dy="16.9">копіювання цілого блока пулу</tspan></text>
<rect x="60.0" y="716.0" width="1240.0" height="60.0" rx="6" fill="#eef1f4" stroke="#6b7280" stroke-width="1.6"/><text x="680.0" y="750.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Спільний блок упізнають не за лічильником посилань, а за міткою часу в самому відображенні: якщо його зробили пізніше за останній знімок тому — він точно нічий, крім нашого</tspan></text>
</svg>