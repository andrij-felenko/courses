<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="390.0" y="26.0" width="200.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="55.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">лічильник</tspan><tspan x="490.0" dy="16.9">(значення ≥ 0)</tspan></text>
<text x="190.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">sem_wait — «дай одиницю»</text>
<rect x="30.0" y="152.0" width="320.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="187.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">значення більше нуля:</tspan><tspan x="190.0" dy="15.6">відняти одиницю й повернутися</tspan></text>
<rect x="30.0" y="252.0" width="320.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="287.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">значення нульове:</tspan><tspan x="190.0" dy="15.6">стати в чергу й заснути</tspan></text>
<text x="790.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">sem_post — «ось одиниця»</text>
<rect x="630.0" y="152.0" width="320.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">додати одиницю до значення</tspan></text>
<rect x="630.0" y="252.0" width="320.0" height="78.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="790.0" y="287.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">у черзі хтось стоїть:</tspan><tspan x="790.0" dy="15.6">розбудити одного з них</tspan></text>
<line x1="350.0" y1="191.0" x2="386.0" y2="92.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="630.0" y1="191.0" x2="594.0" y2="92.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="298.7" y="368.4" width="382.5" height="63.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="388.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">перевірка значення й засинання — одна неподільна дія:</tspan><tspan x="490.0" dy="15.6">якби між ними був проміжок, sem_post устиг би пройти</tspan><tspan x="490.0" dy="15.6">по порожній черзі, і будити не було б кого</tspan></text>
</svg>