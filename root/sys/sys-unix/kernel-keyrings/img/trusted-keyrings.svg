<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільця довіри самого ядра</text>
<rect x="30.0" y="76.0" width="340.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="107.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">.builtin_trusted_keys</tspan><tspan x="200.0" dy="16.9">вбудовані в образ ядра;</tspan><tspan x="200.0" dy="16.9">на ходу не додати нічого</tspan></text>
<rect x="420.0" y="76.0" width="340.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="590.0" y="107.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">.machine</tspan><tspan x="590.0" dy="16.9">ключі власника машини,</tspan><tspan x="590.0" dy="16.9">внесені через MOK (з ядра 5.18)</tspan></text>
<rect x="840.0" y="76.0" width="340.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1010.0" y="107.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">.platform</tspan><tspan x="1010.0" dy="16.9">ключі з бази UEFI та MOK;</tspan><tspan x="1010.0" dy="16.9">лише для образу при kexec</tspan></text>
<rect x="190.0" y="256.0" width="420.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="287.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">.secondary_trusted_keys</tspan><tspan x="400.0" dy="16.9">росте на ходу — але приймає лише те,</tspan><tspan x="400.0" dy="16.9">що підписане вже довіреним ключем</tspan></text>
<line x1="200.0" y1="168.0" x2="320.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="590.0" y1="168.0" x2="480.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="650.0" y="258.0" width="420.0" height="84.0" rx="6" fill="#f7f9fc" stroke="#333333" stroke-width="1.5"/><text x="860.0" y="280.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">обмеження висить на самому кільці,</tspan><tspan x="860.0" dy="15.6">а не на тому, хто просить:</tspan><tspan x="860.0" dy="15.6">питання не про права процесу,</tspan><tspan x="860.0" dy="15.6">а про ланцюг підпису</tspan></text>
<rect x="230.0" y="422.0" width="340.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="455.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">перевірка підпису</tspan><tspan x="400.0" dy="18.2">модуля ядра</tspan></text>
<rect x="840.0" y="422.0" width="340.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="1010.0" y="455.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="1010.0" dy="0.0">перевірка образу</tspan><tspan x="1010.0" dy="18.2">для kexec</tspan></text>
<line x1="400.0" y1="348.0" x2="400.0" y2="418.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1130.0" y1="168.0" x2="1130.0" y2="418.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="40.0" y1="540.0" x2="1180.0" y2="540.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="210.0" y="556.0" width="800.0" height="56.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="580.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">.blacklist — хеші й сертифікати, які відхиляють завжди,</tspan><tspan x="610.0" dy="16.9">навіть коли ланцюг підпису математично сходиться</tspan></text>
</svg>