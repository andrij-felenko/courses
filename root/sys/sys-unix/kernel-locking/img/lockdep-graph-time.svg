<text x="40.0" y="556.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Перевірка ставить одне питання: чи досяжний lock_a із lock_b по вже наявних ребрах. Час у це питання не входить.</text>
