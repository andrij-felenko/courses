<text x="24.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Кожен претендент б'є атомарною RMW-інструкцією по тому самому рядку — і поки замок вільний, і поки його тримають.</text>
