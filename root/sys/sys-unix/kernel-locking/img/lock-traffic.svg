<text x="24.0" y="598.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Один запис власника анулює всі спільні копії; далі кожен із n−1 претендентів перечитує рядок наново.</text>
