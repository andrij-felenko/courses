<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1290 884.08" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1290" height="884.08" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="30.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">одне слово preempt_count</text>
<rect x="400.0" y="74.0" width="120.0" height="62.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="460.0" y="101.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">біт 31</tspan><tspan x="460.0" dy="16.2">прапорець</tspan></text>
<rect x="520.0" y="74.0" width="180.0" height="62.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="610.0" y="101.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">NMI</tspan><tspan x="610.0" dy="16.2">біти 20–23</tspan></text>
<rect x="700.0" y="74.0" width="200.0" height="62.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="800.0" y="101.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">HARDIRQ</tspan><tspan x="800.0" dy="16.2">біти 16–19</tspan></text>
<rect x="900.0" y="74.0" width="180.0" height="62.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="990.0" y="101.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">SOFTIRQ</tspan><tspan x="990.0" dy="16.2">біти 8–15</tspan></text>
<rect x="1080.0" y="74.0" width="170.0" height="62.0" rx="6" fill="#eef0f3" stroke="#6b7280" stroke-width="1.5"/><text x="1165.0" y="101.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1165.0" dy="0.0">PREEMPT</tspan><tspan x="1165.0" dy="16.2">біти 0–7</tspan></text>
<text x="30.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">макрос</text>
<text x="400.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">які поля читає</text>
<line x1="24.0" y1="190.0" x2="1256.0" y2="190.0" stroke="#6b7280" stroke-width="1.0"/>
<rect x="24.0" y="218.0" width="360.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="204.0" y="245.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="204.0" dy="0.0">in_nmi()</tspan></text>
<rect x="520.0" y="218.0" width="180.0" height="46.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="610.0" y="245.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">≠ 0</tspan></text>
<rect x="24.0" y="278.0" width="360.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="204.0" y="305.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="204.0" dy="0.0">in_hardirq()</tspan></text>
<rect x="700.0" y="278.0" width="200.0" height="46.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="800.0" y="305.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">≠ 0</tspan></text>
<rect x="24.0" y="338.0" width="360.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="204.0" y="365.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="204.0" dy="0.0">in_serving_softirq()</tspan></text>
<rect x="900.0" y="338.0" width="180.0" height="46.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="990.0" y="365.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">лише найнижчий біт поля</tspan></text>
<rect x="24.0" y="398.0" width="360.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="204.0" y="425.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="204.0" dy="0.0">in_task()</tspan></text>
<rect x="520.0" y="398.0" width="560.0" height="46.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="800.0" y="425.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">усі три = 0  (у softirq — лише найнижчий біт)</tspan></text>
<rect x="24.0" y="458.0" width="360.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="204.0" y="485.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="204.0" dy="0.0">in_softirq()  застаріле</tspan></text>
<rect x="900.0" y="458.0" width="180.0" height="46.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.0"/><text x="990.0" y="484.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">усе поле: не розрізняє «я в softirq» і «BH заборонені»</tspan></text>
<rect x="24.0" y="518.0" width="360.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="204.0" y="545.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="204.0" dy="0.0">in_interrupt()  застаріле</tspan></text>
<rect x="520.0" y="518.0" width="560.0" height="46.0" rx="6" fill="#fff4e0" stroke="#b8860b" stroke-width="2.0"/><text x="800.0" y="545.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">змішує переривання із забороною нижніх половин</tspan></text>
<rect x="24.0" y="578.0" width="360.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="204.0" y="605.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="204.0" dy="0.0">in_atomic()  ненадійне</tspan></text>
<rect x="520.0" y="578.0" width="730.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="885.0" y="605.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">усе слово ≠ 0 — і цього замало</tspan></text>
<rect x="24.0" y="638.0" width="360.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="204.0" y="665.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="204.0" dy="0.0">preemptible()</tspan></text>
<rect x="520.0" y="638.0" width="730.0" height="46.0" rx="6" fill="#e6f5ec" stroke="#27ae60" stroke-width="2.0"/><text x="885.0" y="665.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="885.0" dy="0.0">усе слово = 0  І  переривання відкриті</tspan></text>
<rect x="400.0" y="728.0" width="500.0" height="58.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="650.0" y="761.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">регістр прапорців процесора: чи закриті переривання</tspan></text>
<rect x="940.0" y="728.0" width="310.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/><text x="1095.0" y="761.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1095.0" dy="0.0">irqs_disabled()</tspan></text>
<line x1="400.0" y1="757.0" x2="380.0" y2="757.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="24.0" y="762.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">поза лічильником</text>
<text x="24.0" y="838.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Червона смуга — головна пастка: in_atomic() дивиться лише в це слово, а закриті переривання живуть у регістрі прапорців і в нього не потрапляють.</text>
<text x="24.0" y="862.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">Плюс сам лічильник ведеться тільки з CONFIG_PREEMPT_COUNT — без нього взятий spin_lock() не додає туди нічого.</text>
</svg>