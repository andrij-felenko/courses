<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 730" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="730" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шість рядків каркаса: кожен стоїть на своєму місці не випадково</text>
<text x="300.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">порядок у тілі функції</text>
<text x="880.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">що ламається, якщо переставити</text>
<rect x="56.0" y="108.0" width="452.0" height="74.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="282.0" y="149.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="282.0" dy="0.0">CV_Assert(_src.type() == CV_8UC1);</tspan></text>
<rect x="552.0" y="108.0" width="572.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="838.0" y="141.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="838.0" dy="0.0">Питаємо проксі, а не дані: неправильний тип</tspan><tspan x="838.0" dy="15.6">видно ще до першого доступу до пікселів.</tspan></text>
<line x1="282.0" y1="184.0" x2="282.0" y2="204.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="56.0" y="206.0" width="452.0" height="74.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="282.0" y="247.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="282.0" dy="0.0">CVX_OCL_RUN(_dst.isUMat(), ocl_localRange(...));</tspan></text>
<rect x="552.0" y="206.0" width="572.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="838.0" y="239.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="838.0" dy="0.0">Після getMat пізно — кадр уже стягнуто на хост,</tspan><tspan x="838.0" dy="15.6">і гілка прискорювача втратила сенс.</tspan></text>
<line x1="282.0" y1="282.0" x2="282.0" y2="302.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="56.0" y="304.0" width="452.0" height="74.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="282.0" y="345.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="282.0" dy="0.0">cv::Mat src = _src.getMat();</tspan></text>
<rect x="552.0" y="304.0" width="572.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="838.0" y="337.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="838.0" dy="0.0">Заголовок бере лічильник на себе: старий буфер</tspan><tspan x="838.0" dy="15.6">доживе до кінця, навіть якщо приймач переїде.</tspan></text>
<line x1="282.0" y1="380.0" x2="282.0" y2="400.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="56.0" y="402.0" width="452.0" height="74.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="282.0" y="443.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="282.0" dy="0.0">_dst.create(src.size(), CV_8UC1);</tspan></text>
<rect x="552.0" y="402.0" width="572.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="838.0" y="435.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="838.0" dy="0.0">Саме тут вирішується, буде виділення чи ні —</tspan><tspan x="838.0" dy="15.6">і саме тут виріз може відв’язатися від полотна.</tspan></text>
<line x1="282.0" y1="478.0" x2="282.0" y2="498.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="56.0" y="500.0" width="452.0" height="74.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="282.0" y="541.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="282.0" dy="0.0">cv::Mat dst = _dst.getMat();</tspan></text>
<rect x="552.0" y="500.0" width="572.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="838.0" y="533.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="838.0" dy="0.0">Раніше — узяли б заголовок на буфер,</tspan><tspan x="838.0" dy="15.6">який create щойно замінив новим.</tspan></text>
<line x1="282.0" y1="576.0" x2="282.0" y2="596.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="56.0" y="598.0" width="452.0" height="74.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="282.0" y="639.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="282.0" dy="0.0">if (overlaps(src, dst)) → тимчасовий буфер</tspan></text>
<rect x="552.0" y="598.0" width="572.0" height="74.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="838.0" y="631.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="838.0" dy="0.0">Віконна операція читає сусідів: писати</tspan><tspan x="838.0" dy="15.6">в той самий буфер не можна.</tspan></text>
</svg>