<text x="470.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">queue приймає дані чужою ниткою, а віддає власною — межа ниток проходить саме тут</text>
