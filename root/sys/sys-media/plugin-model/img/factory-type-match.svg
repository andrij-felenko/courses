<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Маска типу перевіряється підрядком у рядку klass</text>
<rect x="60.0" y="66.0" width="380.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="103.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">маска запиту</tspan><tspan x="250.0" dy="16.9">GST_ELEMENT_FACTORY_TYPE_DECODER</tspan><tspan x="250.0" dy="16.9">| GST_ELEMENT_FACTORY_TYPE_MEDIA_VIDEO</tspan></text>
<rect x="560.0" y="66.0" width="380.0" height="100.0" rx="6" fill="#eef6ee" stroke="#333333" stroke-width="1.5"/><text x="750.0" y="103.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">фабрика avdec_h264</tspan><tspan x="750.0" dy="16.9">метадані klass:</tspan><tspan x="750.0" dy="16.9">«Codec/Decoder/Video»</tspan></text>
<line x1="250.0" y1="170.0" x2="410.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="750.0" y1="170.0" x2="590.0" y2="210.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="160.0" y="214.0" width="680.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="247.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">крок 1 — вид елемента: у масці стоїть біт DECODER,</tspan><tspan x="500.0" dy="19.5">тож у klass шукають підрядок «Decoder» → знайдено</tspan></text>
<line x1="500.0" y1="294.0" x2="500.0" y2="320.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="160.0" y="324.0" width="680.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="357.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">крок 2 — медіа: у масці є біт MEDIA_VIDEO,</tspan><tspan x="500.0" dy="19.5">тож у klass має бути ще й «Video» → знайдено</tspan></text>
<line x1="500.0" y1="404.0" x2="500.0" y2="430.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="280.0" y="434.0" width="440.0" height="52.0" rx="6" fill="#eef6ee" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="465.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">фабрика лишається в списку</tspan></text>
<rect x="60.0" y="506.0" width="880.0" height="86.0" rx="6" fill="#f7f4ee" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="544.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">порівнюють не числа, а текст: біт PARSER вимагає ОБОХ підрядків —</tspan><tspan x="500.0" dy="19.5">«Parser» і «Codec». Елемент із klass «Filter/Parser» під маску не підпаде.</tspan></text>
</svg>