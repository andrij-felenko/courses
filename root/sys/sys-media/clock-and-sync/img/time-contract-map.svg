<text x="500.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">мітка у шкалі медіа</text>
<line x1="330.0" y1="314.4" x2="330.0" y2="393.6" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="500.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start">running_time = (PTS − start) / |rate| + base</text>
<line x1="330.0" y1="474.4" x2="330.0" y2="553.6" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="500.0" y="519.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start">sync_time = running_time + base_time + latency</text>
