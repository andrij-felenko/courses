<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="800" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг чисел: від мітки буфера до рішення споживача</text>
<rect x="200.0" y="79.6" width="260.0" height="70.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="102.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">GstBuffer</tspan><tspan x="330.0" dy="16.9">PTS · DTS · DURATION</tspan><tspan x="330.0" dy="16.9">GST_BUFFER_PTS(buf)</tspan></text>
<rect x="200.0" y="239.6" width="260.0" height="70.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="262.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">GstSegment (подія SEGMENT)</tspan><tspan x="330.0" dy="16.9">start · offset · base · rate</tspan><tspan x="330.0" dy="16.9">gst_segment_to_running_time()</tspan></text>
<rect x="200.0" y="399.6" width="260.0" height="70.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="422.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">base_time елемента</tspan><tspan x="330.0" dy="16.9">gst_element_get_base_time()</tspan><tspan x="330.0" dy="16.9">плюс latency з події LATENCY</tspan></text>
<rect x="200.0" y="559.6" width="260.0" height="70.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="582.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">GstClock</tspan><tspan x="330.0" dy="16.9">gst_clock_get_time()</tspan><tspan x="330.0" dy="16.9">gst_clock_id_wait(id, &amp;jitter)</tspan></text>
<rect x="200.0" y="704.6" width="260.0" height="70.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="330.0" y="727.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="330.0" dy="0.0">GstBaseSink</tspan><tspan x="330.0" dy="16.9">sync · ts-offset · max-lateness</tspan><tspan x="330.0" dy="16.9">показ · скидання · подія QoS</tspan></text>
