<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна швидкість, два розклади: хто саме прискорює дані</text>
<rect x="66.9" y="104.6" width="246.3" height="70.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="190.0" y="127.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">сегмент А</tspan><tspan x="190.0" dy="16.9">rate = 2.0, applied_rate = 1.0</tspan><tspan x="190.0" dy="16.9">буфер несе PTS = 12.000 с</tspan></text>
<rect x="380.9" y="113.0" width="298.2" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">running_time = 12.000 / 2.0 = 6.000 с</tspan><tspan x="530.0" dy="16.9">stream_time = 12.000 · 1.0 = 12.000 с</tspan></text>
<rect x="55.7" y="256.6" width="268.5" height="70.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="190.0" y="279.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">сегмент Б</tspan><tspan x="190.0" dy="16.9">rate = 1.0, applied_rate = 2.0</tspan><tspan x="190.0" dy="16.9">той самий кадр несе PTS = 6.000 с</tspan></text>
<rect x="384.6" y="265.1" width="290.8" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="288.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">running_time = 6.000 / 1.0 = 6.000 с</tspan><tspan x="530.0" dy="16.9">stream_time = 6.000 · 2.0 = 12.000 с</tspan></text>
<rect x="741.0" y="180.6" width="98.1" height="70.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="790.0" y="203.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">однакові</tspan><tspan x="790.0" dy="16.9">6.000 с</tspan><tspan x="790.0" dy="16.9">і 12.000 с</tspan></text>
