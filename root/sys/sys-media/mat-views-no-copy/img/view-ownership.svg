<text x="265.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вид над cv::Mat</text>
<rect x="70.0" y="96.0" width="180.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="160.0" y="123.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">img</tspan><tspan x="160.0" dy="16.9">u = блок A</tspan></text>
<rect x="288.0" y="96.0" width="180.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="378.0" y="123.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="378.0" dy="0.0">roi</tspan><tspan x="378.0" dy="16.9">u = блок A</tspan></text>
<line x1="160.0" y1="158.0" x2="210.0" y2="236.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="378.0" y1="158.0" x2="330.0" y2="236.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="90.0" y="238.0" width="350.0" height="60.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.6"/><text x="265.0" y="272.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">блок A: пікселі + лічильник</tspan></text>
<rect x="90.0" y="322.0" width="350.0" height="46.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="265.0" y="349.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">refcount = 2</tspan></text>
<rect x="70.0" y="392.0" width="390.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="265.0" y="417.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Блок живий, поки живий хоч один заголовок.</tspan><tspan x="265.0" dy="16.9">Помер img — roi далі законно тримає пікселі.</tspan><tspan x="265.0" dy="16.9">Останній заголовок звільняє пам'ять сам.</tspan></text>
<text x="795.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Заголовок над чужим буфером</text>
<rect x="700.0" y="96.0" width="190.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="795.0" y="123.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">view</tspan><tspan x="795.0" dy="16.9">u = nullptr</tspan></text>
<line x1="795.0" y1="158.0" x2="795.0" y2="236.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="600.0" y="238.0" width="390.0" height="60.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.6"/><text x="795.0" y="272.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">буфер конвеєра: лише пікселі</tspan></text>
<rect x="600.0" y="322.0" width="390.0" height="46.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="795.0" y="349.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">лічильника немає</tspan></text>
<rect x="580.0" y="392.0" width="430.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="795.0" y="417.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Час життя цілком на власникові буфера.</tspan><tspan x="795.0" dy="16.9">Зняли відображення — заголовок висить у нікуди,</tspan><tspan x="795.0" dy="16.9">і Mat про це не дізнається й не попередить.</tspan></text>
