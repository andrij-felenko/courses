<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1100" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">NV12: один кадр, дві площини, два заголовки</text>
<rect x="70.0" y="110.0" width="340.0" height="150.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.4"/>
<rect x="70.0" y="110.0" width="280.0" height="150.0" rx="6" fill="#e3f6ea" stroke="#27ae60" stroke-width="1.8"/><text x="210.0" y="181.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">площина 0 — яскравість Y</tspan><tspan x="210.0" dy="16.9">h рядків по w байтів</tspan></text>
<rect x="70.0" y="290.0" width="340.0" height="90.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.4"/>
<rect x="70.0" y="290.0" width="280.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="210.0" y="331.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">площина 1 — U та V поруч</tspan><tspan x="210.0" dy="16.9">h/2 рядків по w байтів</tspan></text>
<line x1="414.0" y1="185.0" x2="616.0" y2="175.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="414.0" y1="335.0" x2="616.0" y2="345.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="620.0" y="130.0" width="430.0" height="90.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="835.0" y="171.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">cv::Mat y(h, w, CV_8UC1,</tspan><tspan x="835.0" dy="16.9">  PLANE_DATA(&amp;f, 0), PLANE_STRIDE(&amp;f, 0));</tspan></text>
<rect x="620.0" y="300.0" width="430.0" height="90.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="835.0" y="341.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="835.0" dy="0.0">cv::Mat uv(h/2, w/2, CV_8UC2,</tspan><tspan x="835.0" dy="16.9">  PLANE_DATA(&amp;f, 1), PLANE_STRIDE(&amp;f, 1));</tspan></text>
<rect x="70.0" y="424.0" width="980.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="560.0" y="451.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Сірим — запас до вирівнювання: він сидить у кроці й не входить у ширину.</tspan><tspan x="560.0" dy="16.9">У кожної площини свій крок, а часом і свій блок пам'яті — тому заголовків два.</tspan></text>
</svg>