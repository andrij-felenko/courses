<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1230 770" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1230" height="770" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="610.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири покоління автодобору в GStreamer і вади, які закривав кожен крок</text>
<text x="180.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">покоління</text>
<text x="560.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">що воно принесло</text>
<text x="970.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">вада, яка лишалася</text>
<rect x="40.0" y="80.0" width="280.0" height="140.0" rx="6" fill="#ececec" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="146.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">spider</tspan><tspan x="180.0" dy="16.9">гілка 0.8, до 2005</tspan></text>
<rect x="360.0" y="80.0" width="400.0" height="140.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">один елемент, який ставили</tspan><tspan x="560.0" dy="16.9">посеред конвеєра, і він сам</tspan><tspan x="560.0" dy="16.9">дотягував потік до потрібних caps</tspan></text>
<rect x="800.0" y="80.0" width="380.0" height="140.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="990.0" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">шукав шлях наосліп, окремим кодом</tspan><tspan x="990.0" dy="16.9">поза загальною моделлю;</tspan><tspan x="990.0" dy="16.9">не ріс разом із набором плагінів</tspan></text>
<line x1="180.0" y1="220.0" x2="180.0" y2="245.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="245.0" width="280.0" height="140.0" rx="6" fill="#eef4fb" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="311.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">decodebin</tspan><tspan x="180.0" dy="16.9">гілка 0.8 → 0.10</tspan></text>
<rect x="360.0" y="245.0" width="400.0" height="140.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="302.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">спершу тип потоку, далі рекурсія</tspan><tspan x="560.0" dy="16.9">за caps і рангами з реєстру;</tspan><tspan x="560.0" dy="16.9">мета — «дай сирі кадри»</tspan></text>
<rect x="800.0" y="245.0" width="380.0" height="140.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="990.0" y="302.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">усі гілки поділяли одну чергу:</tspan><tspan x="990.0" dy="16.9">довгий звук зупиняв відео,</tspan><tspan x="990.0" dy="16.9">а перебудова графа була крихкою</tspan></text>
<line x1="180.0" y1="385.0" x2="180.0" y2="410.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="410.0" width="280.0" height="140.0" rx="6" fill="#fdf3e6" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="476.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">decodebin2 → decodebin</tspan><tspan x="180.0" dy="16.9">0.10.11 (2006), ім'я з 1.0 (2012)</tspan></text>
<rect x="360.0" y="410.0" width="400.0" height="140.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="467.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">групи потоків, multiqueue між</tspan><tspan x="560.0" dy="16.9">гілками, відкат невдалої спроби,</tspan><tspan x="560.0" dy="16.9">сигнал autoplug-select</tspan></text>
<rect x="800.0" y="410.0" width="380.0" height="140.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="990.0" y="467.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">декодував усе, що є в контейнері:</tspan><tspan x="990.0" dy="16.9">п'ять звукових доріжок — п'ять</tspan><tspan x="990.0" dy="16.9">декодерів, з них грає один</tspan></text>
<line x1="180.0" y1="550.0" x2="180.0" y2="575.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="575.0" width="280.0" height="140.0" rx="6" fill="#eef6ee" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="641.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">decodebin3 + parsebin</tspan><tspan x="180.0" dy="15.6">1.10 (2016), стабільно з 1.22 (2023)</tspan></text>
<rect x="360.0" y="575.0" width="400.0" height="140.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="632.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">розбір окремо від декодування;</tspan><tspan x="560.0" dy="16.9">колекція потоків на шину,</tspan><tspan x="560.0" dy="16.9">вибір подією select-streams</tspan></text>
<rect x="800.0" y="575.0" width="380.0" height="140.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="990.0" y="632.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="990.0" dy="0.0">буферизацію мережі винесено вище,</tspan><tspan x="990.0" dy="16.9">а старий сигнальний код</tspan><tspan x="990.0" dy="16.9">не переїжджає механічно</tspan></text>
</svg>