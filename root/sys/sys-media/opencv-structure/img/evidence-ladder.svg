<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири різні відповіді на одне питання</text>
<text x="490.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-style="italic">питання: «чи прочитає ця збірка потік через FFmpeg?»</text>
<rect x="40.0" y="88.0" width="350.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="215.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">звіт конфігурації:</tspan><tspan x="215.0" dy="16.9">Video I/O → FFMPEG: YES</tspan></text>
<rect x="420.0" y="88.0" width="520.0" height="84.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="680.0" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">що знайшов CMake на машині складача.</tspan><tspan x="680.0" dy="16.9">Про машину, де програма працює, — нічого.</tspan></text>
<line x1="215.0" y1="176.0" x2="215.0" y2="194.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="198.0" width="350.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="215.0" y="236.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">getStreamBackends()</tspan><tspan x="215.0" dy="16.9">містить CAP_FFMPEG</tspan></text>
<rect x="420.0" y="198.0" width="520.0" height="84.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="680.0" y="236.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">бекенд оголошено в реєстрі й не вимкнено.</tspan><tspan x="680.0" dy="16.9">Чи є файл плагіна — ще ніхто не питав.</tspan></text>
<line x1="215.0" y1="286.0" x2="215.0" y2="304.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="308.0" width="350.0" height="84.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="346.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">hasBackend(CAP_FFMPEG)</tspan><tspan x="215.0" dy="16.9">== true</tspan></text>
<rect x="420.0" y="308.0" width="520.0" height="84.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="680.0" y="346.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">плагін відкрито, версія ABI зійшлася.</tspan><tspan x="680.0" dy="16.9">Що саме всередині нього — ще невідомо.</tspan></text>
<line x1="215.0" y1="396.0" x2="215.0" y2="414.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="418.0" width="350.0" height="84.0" rx="6" fill="#eaf4ec" stroke="#27ae60" stroke-width="1.5"/><text x="215.0" y="456.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">VideoCapture відкрила</tspan><tspan x="215.0" dy="16.9">справжнє джерело</tspan></text>
<rect x="420.0" y="418.0" width="520.0" height="84.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="680.0" y="456.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">є демультиплексор, кодек і доступ до джерела.</tspan><tspan x="680.0" dy="16.9">Єдина відповідь без «але».</tspan></text>
<text x="490.0" y="546.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="490.0" dy="0.0">Кожна сходинка доводить більше за попередню —</tspan><tspan x="490.0" dy="16.9">і жодна не доводить наступної.</tspan></text>
</svg>