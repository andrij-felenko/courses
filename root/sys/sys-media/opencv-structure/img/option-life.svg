<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шлях параметра WITH_FFMPEG від командного рядка до поведінки</text>
<rect x="40.0" y="150.0" width="240.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="183.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">cmake -DWITH_FFMPEG=ON</tspan></text>
<line x1="160.0" y1="212.0" x2="160.0" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="244.0" width="240.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="277.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">розвідка: pkg-config шукає</tspan><tspan x="160.0" dy="14.3">libavcodec, libavformat,</tspan><tspan x="160.0" dy="14.3">libavutil, libswscale</tspan></text>
<text x="160.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="160.0" dy="0.0">крок конфігурації минає</tspan><tspan x="160.0" dy="14.3">без помилки в обох гілках</tspan></text>
<line x1="288.0" y1="266.0" x2="342.0" y2="152.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="288.0" y1="302.0" x2="342.0" y2="342.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350.0" y="100.0" width="200.0" height="76.0" rx="6" fill="#eaf4ec" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">знайдено:</tspan><tspan x="450.0" dy="13.0">HAVE_FFMPEG в означеннях videoio</tspan></text>
<line x1="558.0" y1="138.0" x2="582.0" y2="138.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="590.0" y="100.0" width="200.0" height="76.0" rx="6" fill="#eaf4ec" stroke="#27ae60" stroke-width="1.5"/><text x="690.0" y="127.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">у звіті:</tspan><tspan x="690.0" dy="14.3">FFMPEG: YES</tspan><tspan x="690.0" dy="14.3">avcodec: YES (60.31.102)</tspan></text>
<line x1="798.0" y1="138.0" x2="822.0" y2="138.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="830.0" y="100.0" width="180.0" height="76.0" rx="6" fill="#eaf4ec" stroke="#27ae60" stroke-width="1.5"/><text x="920.0" y="134.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">CAP_FFMPEG у реєстрі,</tspan><tspan x="920.0" dy="14.3">cap.isOpened() == true</tspan></text>
<rect x="350.0" y="300.0" width="200.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="334.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">не знайдено:</tspan><tspan x="450.0" dy="14.3">HAVE_FFMPEG не з'явиться</tspan></text>
<line x1="558.0" y1="338.0" x2="582.0" y2="338.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="590.0" y="300.0" width="200.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="334.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">у звіті:</tspan><tspan x="690.0" dy="14.3">FFMPEG: NO</tspan></text>
<line x1="798.0" y1="338.0" x2="822.0" y2="338.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="830.0" y="300.0" width="180.0" height="76.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="920.0" y="334.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="920.0" dy="0.0">бекенда немає,</tspan><tspan x="920.0" dy="14.3">isOpened() == false</tspan></text>
<text x="560.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="560.0" dy="0.0">WITH_ — дозвіл шукати, HAVE_ — результат пошуку.</tspan><tspan x="560.0" dy="15.6">Різницю між гілками видно тільки у звіті конфігурації.</tspan></text>
</svg>