<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кадр 1920×1080 NV12: де саме витрачається пам'ять</text>
<rect x="70.0" y="76.0" width="400.0" height="74.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.8"/><text x="270.0" y="108.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Апаратний декодер пише кадр</tspan><tspan x="270.0" dy="18.2">у власний буфер (NV12)</tspan></text>
<rect x="550.0" y="76.0" width="560.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="830.0" y="117.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="830.0" dy="0.0">2.97 МіБ запису на кадр — неминуче</tspan></text>
<line x1="484.0" y1="113.0" x2="536.0" y2="113.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,4"/>
<line x1="270.0" y1="150.0" x2="270.0" y2="176.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70.0" y="176.0" width="400.0" height="74.0" rx="6" fill="#eef1f4" stroke="#333333" stroke-width="1.8"/><text x="270.0" y="208.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Буфер стає видимим процесору:</tspan><tspan x="270.0" dy="18.2">мапування або звантаження</tspan></text>
<rect x="550.0" y="176.0" width="560.0" height="74.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.4"/><text x="830.0" y="209.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="830.0" dy="0.0">0 або 2.97 МіБ — залежить від того,</tspan><tspan x="830.0" dy="16.9">чи пам'ять декодера спільна з процесором</tspan></text>
<line x1="484.0" y1="213.0" x2="536.0" y2="213.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,4"/>
<line x1="270.0" y1="250.0" x2="270.0" y2="276.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70.0" y="276.0" width="400.0" height="74.0" rx="6" fill="#e3f6ea" stroke="#27ae60" stroke-width="1.8"/><text x="270.0" y="308.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Площини перепаковують</tspan><tspan x="270.0" dy="18.2">в один суцільний блок</tspan></text>
<rect x="550.0" y="276.0" width="560.0" height="74.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="830.0" y="309.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="830.0" dy="0.0">2.97 МіБ читання + 2.97 запису</tspan><tspan x="830.0" dy="16.9">УСУВНО: два заголовки замість одного</tspan></text>
<line x1="484.0" y1="313.0" x2="536.0" y2="313.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,4"/>
<line x1="270.0" y1="350.0" x2="270.0" y2="376.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70.0" y="376.0" width="400.0" height="74.0" rx="6" fill="#e3f6ea" stroke="#27ae60" stroke-width="1.8"/><text x="270.0" y="417.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Перетворення NV12 → BGR</tspan></text>
<rect x="550.0" y="376.0" width="560.0" height="74.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/><text x="830.0" y="409.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="830.0" dy="0.0">2.97 МіБ читання + 5.93 запису</tspan><tspan x="830.0" dy="16.9">УСУВНО, якщо алгоритмові досить площини Y</tspan></text>
<line x1="484.0" y1="413.0" x2="536.0" y2="413.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,4"/>
<line x1="270.0" y1="450.0" x2="270.0" y2="476.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70.0" y="476.0" width="400.0" height="74.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="270.0" y="517.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Алгоритм зору</tspan></text>
<rect x="550.0" y="476.0" width="560.0" height="74.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/><text x="830.0" y="517.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">читає рівно стільки, скільки йому треба</tspan></text>
<line x1="484.0" y1="513.0" x2="536.0" y2="513.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,4"/>
<rect x="70.0" y="562.0" width="1040.0" height="30.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="590.0" y="581.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Зелене — копії, які прибирають без утрати змісту; сіре — плата за апаратне декодування.</tspan></text>
</svg>