<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Байти кадру не завжди у вашому адресному просторі</text>
<rect x="50.0" y="78.0" width="260.0" height="86.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="116.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Системна пам'ять</tspan><tspan x="180.0" dy="18.2">(звичайний алокатор)</tspan></text>
<line x1="180.0" y1="168.0" x2="180.0" y2="218.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="220.0" width="260.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="180.0" y="257.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">map віддає вказівник</tspan><tspan x="180.0" dy="16.9">і більше нічого не робить</tspan><tspan x="180.0" dy="16.9">— безкоштовно</tspan></text>
<rect x="350.0" y="78.0" width="260.0" height="86.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="116.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Пам'ять відеокарти</tspan><tspan x="480.0" dy="18.2">(текстура GL)</tspan></text>
<line x1="480.0" y1="168.0" x2="480.0" y2="218.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="350.0" y="220.0" width="260.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="257.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">map тягне вміст</tspan><tspan x="480.0" dy="16.9">через шину в процесор</tspan><tspan x="480.0" dy="16.9">— сотні мікросекунд</tspan></text>
<rect x="650.0" y="78.0" width="260.0" height="86.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="116.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Буфер драйвера</tspan><tspan x="780.0" dy="18.2">(dmabuf, V4L2)</tspan></text>
<line x1="780.0" y1="168.0" x2="780.0" y2="218.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="650.0" y="220.0" width="260.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="257.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">map відображає дескриптор</tspan><tspan x="780.0" dy="16.9">і узгоджує кеш</tspan><tspan x="780.0" dy="16.9">— системний виклик</tspan></text>
<rect x="50.0" y="356.0" width="860.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="382.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">gst_buffer_map — не «взяти вказівник», а «зробити цю пам'ять доступною мені».</tspan><tspan x="480.0" dy="18.2">Той самий рядок коду коштує від нуля до кількох мілісекунд на кадр.</tspan></text>
</svg>