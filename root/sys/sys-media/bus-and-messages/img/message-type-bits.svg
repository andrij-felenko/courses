<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="40.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Звичайні типи — окремий біт на тип</text>
<rect x="40.0" y="80.2" width="104.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="92.0" y="100.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="92.0" dy="0.0">1 &lt;&lt; 0</tspan><tspan x="92.0" dy="15.6">EOS</tspan></text>
<rect x="166.0" y="80.2" width="104.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="218.0" y="100.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="218.0" dy="0.0">1 &lt;&lt; 1</tspan><tspan x="218.0" dy="15.6">ERROR</tspan></text>
<rect x="292.0" y="80.2" width="104.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="344.0" y="100.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="344.0" dy="0.0">1 &lt;&lt; 5</tspan><tspan x="344.0" dy="15.6">BUFFERING</tspan></text>
<rect x="418.0" y="80.2" width="104.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="100.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">…</tspan><tspan x="470.0" dy="15.6">…</tspan></text>
<rect x="544.0" y="80.2" width="104.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="596.0" y="100.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="596.0" dy="0.0">1 &lt;&lt; 30</tspan><tspan x="596.0" dy="15.6">HAVE_CONTEXT</tspan></text>
<rect x="693.0" y="80.2" width="250.0" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="818.0" y="100.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="818.0" dy="0.0">маска — це АБО:</tspan><tspan x="818.0" dy="15.6">ERROR | EOS = 0x03</tspan></text>
<text x="40.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Розширені типи — номер за межею, а не біт</text>
<rect x="40.0" y="218.4" width="104.0" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="92.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="92.0" dy="0.0">1 &lt;&lt; 31</tspan><tspan x="92.0" dy="15.6">EXTENDED</tspan><tspan x="92.0" dy="15.6">0x80000000</tspan></text>
<rect x="166.0" y="218.4" width="104.0" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="218.0" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="218.0" dy="0.0">EXTENDED + 1</tspan><tspan x="218.0" dy="15.6">DEVICE_ADDED</tspan><tspan x="218.0" dy="15.6">0x80000001</tspan></text>
<rect x="292.0" y="218.4" width="115.8" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="349.9" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="349.9" dy="0.0">EXTENDED + 2</tspan><tspan x="349.9" dy="15.6">DEVICE_REMOVED</tspan><tspan x="349.9" dy="15.6">0x80000002</tspan></text>
<rect x="429.8" y="218.4" width="104.0" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="481.8" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="481.8" dy="0.0">EXTENDED + 6</tspan><tspan x="481.8" dy="15.6">REDIRECT</tspan><tspan x="481.8" dy="15.6">0x80000006</tspan></text>
<rect x="555.8" y="218.4" width="156.8" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="634.2" y="238.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="634.2" dy="0.0">EXTENDED + 8</tspan><tspan x="634.2" dy="15.6">INSTANT_RATE_REQUEST</tspan><tspan x="634.2" dy="15.6">0x80000008</tspan></text>
<text x="40.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Чому маскою їх не спіймати</text>
<rect x="334.4" y="366.6" width="331.2" height="66.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="387.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">GST_MESSAGE_DEVICE_ADDED &amp; GST_MESSAGE_EOS</tspan><tspan x="500.0" dy="16.9">0x80000001 &amp; 0x00000001 = 0x00000001 ≠ 0</tspan><tspan x="500.0" dy="16.9">фільтр «лише EOS» ловить DEVICE_ADDED</tspan></text>
</svg>