<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому перехід у PAUSED не завершується одразу</text>
<rect x="147.3" y="52.8" width="165.3" height="54.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">застосунок:</tspan><tspan x="230.0" dy="19.5">set_state(PAUSED)</tspan></text>
<rect x="638.9" y="52.8" width="242.3" height="54.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="760.0" y="75.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">одразу повертається ASYNC:</tspan><tspan x="760.0" dy="19.5">стану ще не досягнуто</tspan></text>
<line x1="326.7" y1="80.0" x2="624.9" y2="80.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="40.0" y1="140.0" x2="1000.0" y2="140.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6,6"/>
<rect x="70.0" y="187.5" width="180.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="210.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">джерело</tspan></text>
<rect x="410.0" y="187.5" width="180.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="210.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">декодер</tspan></text>
<rect x="770.0" y="187.5" width="180.0" height="35.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="860.0" y="210.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">приймач</tspan></text>
<line x1="262.0" y1="205.0" x2="398.0" y2="205.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="602.0" y1="205.0" x2="758.0" y2="205.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="330.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle">перший буфер</text>
<text x="680.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle">перший буфер</text>
<text x="860.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="860.0" dy="0.0">приймач приймає його,</tspan><tspan x="860.0" dy="16.9">тримає й далі блокує потік</tspan></text>
<line x1="40.0" y1="320.0" x2="1000.0" y2="320.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="6,6"/>
<rect x="172.2" y="358.9" width="155.7" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="250.0" y="380.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">шина: ASYNC_START</tspan><tspan x="250.0" dy="18.2">перехід почався</tspan></text>
<rect x="700.2" y="358.9" width="179.6" height="52.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="380.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">шина: ASYNC_DONE</tspan><tspan x="790.0" dy="18.2">наповнення завершено</tspan></text>
<line x1="341.8" y1="385.0" x2="686.2" y2="385.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="520.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">поки триває — стан ще не PAUSED</text>
<text x="520.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">лише після ASYNC_DONE конвеєр справді в PAUSED, і PLAYING настане миттєво</text>
</svg>