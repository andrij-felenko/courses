<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири стани — чотири шари готовності, що накопичуються</text>
<rect x="40.0" y="52.0" width="250.0" height="62.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="165.0" y="89.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">NULL</tspan></text>
<rect x="340.0" y="52.0" width="640.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="78.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">об'єкт елемента існує в пам'яті,</tspan><tspan x="660.0" dy="18.2">зовні не зайнято нічого</tspan></text>
<line x1="165.0" y1="132.0" x2="165.0" y2="186.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="340.0" y="126.0" width="640.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="660.0" y="154.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">відкрити пристрій, завантажити бібліотеку,</tspan><tspan x="660.0" dy="18.2">зайняти те, що дається лише одному</tspan></text>
<text x="151.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end">NULL → READY</text>
<rect x="40.0" y="204.0" width="250.0" height="62.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="165.0" y="241.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">READY</tspan></text>
<rect x="340.0" y="204.0" width="640.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="230.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">пристрій відкрито й тримається,</tspan><tspan x="660.0" dy="18.2">потоків немає, дані не рухаються</tspan></text>
<line x1="165.0" y1="284.0" x2="165.0" y2="338.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="340.0" y="278.0" width="640.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="660.0" y="306.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">активувати пади, запустити потоки,</tspan><tspan x="660.0" dy="18.2">наповнити конвеєр даними наперед</tspan></text>
<text x="151.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end">READY → PAUSED</text>
<rect x="40.0" y="356.0" width="250.0" height="62.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="165.0" y="393.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">PAUSED</tspan></text>
<rect x="340.0" y="356.0" width="640.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="382.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">перший кадр дійшов до приймача</tspan><tspan x="660.0" dy="18.2">й стоїть там; формат уже відомий</tspan></text>
<line x1="165.0" y1="436.0" x2="165.0" y2="490.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="340.0" y="430.0" width="640.0" height="66.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="660.0" y="458.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">роздати годинник і базовий час,</tspan><tspan x="660.0" dy="18.2">приймачі відпускають кадри</tspan></text>
<text x="151.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end">PAUSED → PLAYING</text>
<rect x="40.0" y="508.0" width="250.0" height="62.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="165.0" y="545.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">PLAYING</tspan></text>
<rect x="340.0" y="508.0" width="640.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="534.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">дані течуть і виводяться</tspan><tspan x="660.0" dy="18.2">за спільним годинником</tspan></text>
</svg>