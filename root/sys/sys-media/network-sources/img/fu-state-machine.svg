<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Збирання однієї NAL-одиниці: два стани й чотири виходи</text>
<rect x="90.0" y="150.0" width="300.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="185.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">поза фрагментом</tspan><tspan x="240.0" dy="18.2">in_fu = 0</tspan></text>
<rect x="690.0" y="150.0" width="300.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="840.0" y="185.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">збираю фрагмент</tspan><tspan x="840.0" dy="18.2">in_fu = 1</tspan></text>
<line x1="394.0" y1="172.0" x2="686.0" y2="172.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="86.0" width="220.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="109.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">FU-A з S=1</tspan><tspan x="540.0" dy="15.6">відкрити одиницю</tspan></text>
<line x1="686.0" y1="208.0" x2="394.0" y2="208.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="240.0" width="220.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="263.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">E=1</tspan><tspan x="540.0" dy="15.6">одиниця зібралася</tspan></text>
<line x1="240.0" y1="232.0" x2="240.0" y2="338.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="50.0" y="340.0" width="380.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="383.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">тип 1–23 — ціла одиниця, кладемо</tspan><tspan x="240.0" dy="15.6">тип 24 STAP-A — кілька дрібних поспіль</tspan><tspan x="240.0" dy="15.6">FU-A без S — хвіст чужої, викидаємо</tspan></text>
<line x1="840.0" y1="232.0" x2="840.0" y2="338.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="650.0" y="340.0" width="380.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="840.0" y="383.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">FU-A, S=0, E=0,</tspan><tspan x="840.0" dy="15.6">номер = попередній + 1 —</tspan><tspan x="840.0" dy="15.6">дописати шматок у кінець</tspan></text>
<line x1="840.0" y1="454.0" x2="840.0" y2="486.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="490.0" width="600.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="519.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">аварійний вихід: розрив номерів · новий S без E ·</tspan><tspan x="730.0" dy="15.6">інша мітка часу · переповнення накопичувача</tspan><tspan x="730.0" dy="15.6">len ← nal_start, кадр позначено як битий</tspan></text>
