<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від множини можливостей до одного формату</text>
<rect x="40.0" y="60.0" width="400.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="240.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">ДЖЕРЕЛО віддає (src)</tspan><tspan x="240.0" dy="19.5">video/x-raw, format={NV12, YUY2},</tspan><tspan x="240.0" dy="19.5">width=[320, 1920], height=[240, 1080],</tspan><tspan x="240.0" dy="19.5">framerate=[1/1, 60/1]</tspan></text>
<rect x="500.0" y="60.0" width="400.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">КОДЕР приймає (sink)</tspan><tspan x="700.0" dy="19.5">video/x-raw, format={I420, NV12},</tspan><tspan x="700.0" dy="19.5">width=[16, 4096], height=[16, 4096],</tspan><tspan x="700.0" dy="19.5">framerate=[0/1, 120/1]</tspan></text>
<line x1="240.0" y1="198.0" x2="470.0" y2="236.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700.0" y1="198.0" x2="470.0" y2="236.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="150.0" y="250.0" width="640.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="290.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">ПЕРЕТИН — що вміють обоє (ще множина)</tspan><tspan x="470.0" dy="19.5">video/x-raw, format=NV12,</tspan><tspan x="470.0" dy="19.5">width=[320, 1920], height=[240, 1080], framerate=[1/1, 60/1]</tspan></text>
<line x1="470.0" y1="370.0" x2="470.0" y2="416.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="500.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start">фіксація: з кожного поля беремо одне значення</text>
<rect x="150.0" y="430.0" width="640.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.2"/><text x="470.0" y="465.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">ЗАФІКСОВАНІ caps — рівно один формат</tspan><tspan x="470.0" dy="19.5">video/x-raw, format=NV12,</tspan><tspan x="470.0" dy="19.5">width=1920, height=1080, framerate=30/1</tspan></text>
<text x="470.0" y="572.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle">порожній перетин на цьому кроці = помилка not-negotiated</text>
</svg>