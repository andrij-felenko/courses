<rect x="60.0" y="428.0" width="1060.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="590.0" y="454.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Порядок подій, а не масштаб часу. Обидві гілки почалися з того самого коду;</tspan><tspan x="590.0" dy="18.2">розійшлися вони в одному питанні — хто вирішує, де лежать пікселі.</tspan></text>
