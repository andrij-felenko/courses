<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1030" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="515.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Незакопійований Mat в іншому потоці</text>
<text x="30.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">ваш цикл</text>
<rect x="30.0" y="88.0" width="200.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="112.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">map (): Mat дивиться</tspan><tspan x="130.0" dy="18.2">на пам'ять пулу</tspan></text>
<rect x="250.0" y="88.0" width="190.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="345.0" y="112.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="345.0" dy="0.0">Mat кладеться</tspan><tspan x="345.0" dy="18.2">в чергу</tspan></text>
<rect x="460.0" y="88.0" width="200.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="112.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">unref семпла:</tspan><tspan x="560.0" dy="18.2">пам'ять у пул</tspan></text>
<rect x="700.0" y="88.0" width="300.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="112.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">декодер бере той самий буфер</tspan><tspan x="850.0" dy="18.2">і пише в нього новий кадр</tspan></text>
<line x1="680.0" y1="70.0" x2="680.0" y2="300.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,5"/>
<text x="680.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">після цієї миті Mat недійсний</text>
<text x="30.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">потік обробки</text>
<rect x="700.0" y="225.0" width="300.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="850.0" y="249.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">читає Mat — і бачить</tspan><tspan x="850.0" dy="18.2">чужий, уже новий кадр</tspan></text>
<line x1="350.0" y1="153.0" x2="350.0" y2="246.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="350.0" y1="250.0" x2="696.0" y2="250.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="505.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Mat передано в інший потік</text>
<text x="505.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="505.0" dy="0.0">копія кадру коштує мілісекунди,</tspan><tspan x="505.0" dy="15.6">читання чужої пам'яті не коштує нічого — і псує все</tspan></text>
</svg>