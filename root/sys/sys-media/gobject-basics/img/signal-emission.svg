<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 808" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="808" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок виклику під час емісії сигналу</text>
<rect x="70.0" y="84.0" width="560.0" height="76.0" rx="6" fill="#f7f4ee" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="126.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">g_signal_emit_by_name (елемент, &quot;pad-added&quot;, pad)</tspan></text>
<rect x="70.0" y="190.0" width="560.0" height="76.0" rx="6" fill="#eef2f8" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="223.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">RUN_FIRST — метод класу,</tspan><tspan x="350.0" dy="18.2">якщо сигнал оголошено з цим прапорцем</tspan></text>
<line x1="350.0" y1="164.0" x2="350.0" y2="186.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="296.0" width="560.0" height="76.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="329.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">обробники g_signal_connect</tspan><tspan x="350.0" dy="18.2">у порядку підключення</tspan></text>
<line x1="350.0" y1="270.0" x2="350.0" y2="292.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="402.0" width="560.0" height="76.0" rx="6" fill="#eef2f8" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="435.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">RUN_LAST — метод класу</tspan><tspan x="350.0" dy="18.2">(звичний вибір у GStreamer)</tspan></text>
<line x1="350.0" y1="376.0" x2="350.0" y2="398.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="508.0" width="560.0" height="76.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="550.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">обробники g_signal_connect_after</tspan></text>
<line x1="350.0" y1="482.0" x2="350.0" y2="504.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="70.0" y="614.0" width="560.0" height="76.0" rx="6" fill="#eef2f8" stroke="#333333" stroke-width="1.5"/><text x="350.0" y="647.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">RUN_CLEANUP — метод класу,</tspan><tspan x="350.0" dy="18.2">коли сигнал оголошено ще й так</tspan></text>
<line x1="350.0" y1="588.0" x2="350.0" y2="610.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="700.0" y="184.0" width="400.0" height="88.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="215.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">деталь відсіює ще до першого виклику:</tspan><tspan x="900.0" dy="16.9">«notify::bitrate» будить лише тих,</tspan><tspan x="900.0" dy="16.9">хто підписався саме на цю деталь</tspan></text>
<line x1="640.0" y1="228.0" x2="690.0" y2="228.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="700.0" y="290.0" width="400.0" height="88.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="321.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">накопичувач бачить кожне повернене</tspan><tspan x="900.0" dy="16.9">значення й може обірвати ланцюг</tspan><tspan x="900.0" dy="16.9">(так робиться «перший, хто відповів»)</tspan></text>
<line x1="640.0" y1="334.0" x2="690.0" y2="334.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="700.0" y="502.0" width="400.0" height="88.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="542.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">g_signal_stop_emission_by_name</tspan><tspan x="900.0" dy="16.9">обриває решту з будь-якого місця</tspan></text>
<line x1="640.0" y1="546.0" x2="690.0" y2="546.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="70.0" y="730.0" width="1030.0" height="58.0" rx="6" fill="#f7f4ee" stroke="#333333" stroke-width="1.5"/><text x="585.0" y="763.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">усе це — один синхронний виклик у нитці, що випустила сигнал: поки ланцюг не добіг до кінця, ця нитка нічого іншого не робить</tspan></text>
</svg>