<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто тримає слоти пулу, поки живі заголовки</text>
<text x="500.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">пул буферів конвеєра — чотири слоти</text>
<rect x="120.0" y="76.0" width="170.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="205.0" y="98.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">слот 0</tspan><tspan x="205.0" dy="15.6">відданий</tspan></text>
<rect x="310.0" y="76.0" width="170.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="395.0" y="98.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">слот 1</tspan><tspan x="395.0" dy="15.6">відданий</tspan></text>
<rect x="500.0" y="76.0" width="170.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="585.0" y="98.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">слот 2</tspan><tspan x="585.0" dy="15.6">відданий</tspan></text>
<rect x="690.0" y="76.0" width="170.0" height="52.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="775.0" y="98.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">слот 3</tspan><tspan x="775.0" dy="15.6">вільний</tspan></text>
<line x1="205.0" y1="128.0" x2="205.0" y2="186.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="186.0" width="170.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="205.0" y="208.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">cv::Mat #1</tspan><tspan x="205.0" dy="15.6">у черзі детектора</tspan></text>
<line x1="395.0" y1="128.0" x2="395.0" y2="186.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="310.0" y="186.0" width="170.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="395.0" y="208.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">cv::Mat #2</tspan><tspan x="395.0" dy="15.6">у черзі детектора</tspan></text>
<line x1="585.0" y1="128.0" x2="585.0" y2="186.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="500.0" y="186.0" width="170.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="585.0" y="208.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">cv::Mat #3</tspan><tspan x="585.0" dy="15.6">виріз 32×32</tspan></text>
<text x="500.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">поки живий заголовок — слот не повертається в пул</text>
<line x1="60.0" y1="296.0" x2="940.0" y2="296.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="60.0" y="320.0" width="420.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="270.0" y="354.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">max-buffers=2, drop=false</tspan><tspan x="270.0" dy="16.9">appsink не бере наступний кадр,</tspan><tspan x="270.0" dy="16.9">джерело впирається в порожній пул</tspan><tspan x="270.0" dy="16.9">і стає — картинка «завмирає»</tspan></text>
<rect x="520.0" y="320.0" width="420.0" height="110.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="730.0" y="354.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">drop=true (з 1.28 — leaky-type)</tspan><tspan x="730.0" dy="16.9">старий кадр викидають мовчки,</tspan><tspan x="730.0" dy="16.9">конвеєр живий, але детектор</tspan><tspan x="730.0" dy="16.9">бачить не кожен кадр</tspan></text>
<text x="500.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">clone() повертає слот негайно — ціною копії всього кадру</text>
</svg>