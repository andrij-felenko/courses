<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг звільнення: від останнього Mat до gst_sample_unref</text>
<rect x="80.0" y="62.0" width="520.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="340.0" y="92.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">~Mat() → release()</tspan></text>
<text x="650.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="650.0" dy="0.0">поки живий бодай один заголовок,</tspan><tspan x="650.0" dy="15.6">лічильник до нуля не дійде</tspan></text>
<line x1="340.0" y1="114.0" x2="340.0" y2="132.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="132.0" width="520.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="340.0" y="162.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">CV_XADD(&amp;u-&gt;refcount, −1) вернув 1</tspan></text>
<text x="650.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="650.0" dy="0.0">старе значення 1 → нове 0:</tspan><tspan x="650.0" dy="15.6">цей заголовок був останнім</tspan></text>
<line x1="340.0" y1="184.0" x2="340.0" y2="202.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="202.0" width="520.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="340.0" y="232.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Mat::deallocate()</tspan></text>
<text x="650.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="650.0" dy="0.0">бере u-&gt;currAllocator —</tspan><tspan x="650.0" dy="15.6">поле Mat::allocator тут ні до чого</tspan></text>
<line x1="340.0" y1="254.0" x2="340.0" y2="272.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="272.0" width="520.0" height="52.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="340.0" y="302.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">MatAllocator::unmap(u) — БАЗОВА</tspan></text>
<text x="650.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="650.0" dy="0.0">звіряє urefcount == 0 і refcount == 0</tspan><tspan x="650.0" dy="15.6">і сама кличе deallocate(u)</tspan></text>
<line x1="340.0" y1="324.0" x2="340.0" y2="342.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="342.0" width="520.0" height="52.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="340.0" y="372.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">GstMatAllocator::deallocate(u) — НАША</tspan></text>
<text x="650.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="650.0" dy="0.0">прапорець USER_ALLOCATED стоїть →</tspan><tspan x="650.0" dy="15.6">fastFree(origdata) не викликається</tspan></text>
<line x1="340.0" y1="394.0" x2="340.0" y2="412.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="412.0" width="520.0" height="52.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="340.0" y="442.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">gst_buffer_unmap → gst_sample_unref</tspan></text>
<text x="650.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="650.0" dy="0.0">саме в цьому порядку;</tspan><tspan x="650.0" dy="15.6">слот повертається в пул конвеєра</tspan></text>
<text x="500.0" y="508.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">про GStreamer знає лише останній крок — той, який пишемо ми</text>
</svg>