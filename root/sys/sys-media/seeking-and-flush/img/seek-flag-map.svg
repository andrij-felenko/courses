<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">GstSeekFlags: групи прапорців і конфлікти між ними</text>
<text x="620.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">прапорці — біти однієї маски; групи незалежні, конфлікти бувають лише всередині групи</text>
<rect x="40.0" y="106.0" width="250.0" height="68.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="165.0" y="145.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">як виконувати</tspan></text>
<rect x="306.0" y="106.0" width="300.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="456.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="456.0" dy="0.0">FLUSH</tspan><tspan x="456.0" dy="16.9">1&lt;&lt;0   (1)</tspan></text>
<rect x="40.0" y="194.0" width="250.0" height="68.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="165.0" y="233.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">куди влучати</tspan></text>
<rect x="306.0" y="194.0" width="168.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="390.0" y="224.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">ACCURATE</tspan><tspan x="390.0" dy="16.9">1&lt;&lt;1   (2)</tspan></text>
<rect x="487.0" y="194.0" width="168.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="571.0" y="224.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="571.0" dy="0.0">KEY_UNIT</tspan><tspan x="571.0" dy="16.9">1&lt;&lt;2   (4)</tspan></text>
<rect x="668.0" y="194.0" width="168.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="752.0" y="224.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="752.0" dy="0.0">SNAP_BEFORE</tspan><tspan x="752.0" dy="16.9">1&lt;&lt;5   (32)</tspan></text>
<rect x="849.0" y="194.0" width="168.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="933.0" y="224.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="933.0" dy="0.0">SNAP_AFTER</tspan><tspan x="933.0" dy="16.9">1&lt;&lt;6   (64)</tspan></text>
<rect x="1030.0" y="194.0" width="168.0" height="68.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="1114.0" y="224.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="1114.0" dy="0.0">SNAP_NEAREST</tspan><tspan x="1114.0" dy="16.9">32|64   (96)</tspan></text>
<rect x="40.0" y="282.0" width="250.0" height="68.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="165.0" y="321.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">що робити в кінці</tspan></text>
<rect x="306.0" y="282.0" width="300.0" height="68.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="456.0" y="312.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="456.0" dy="0.0">SEGMENT</tspan><tspan x="456.0" dy="16.9">1&lt;&lt;3   (8)</tspan></text>
<rect x="40.0" y="370.0" width="250.0" height="68.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="165.0" y="409.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">пришвидшений хід</tspan></text>
<rect x="306.0" y="370.0" width="213.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="412.5" y="391.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="412.5" dy="0.0">TRICKMODE = SKIP</tspan><tspan x="412.5" dy="16.9">1&lt;&lt;4   (16)</tspan><tspan x="412.5" dy="16.9">від 1.6</tspan></text>
<rect x="532.0" y="370.0" width="213.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="638.5" y="391.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="638.5" dy="0.0">TRICKMODE_KEY_UNITS</tspan><tspan x="638.5" dy="16.9">1&lt;&lt;7   (128)</tspan><tspan x="638.5" dy="16.9">від 1.6</tspan></text>
<rect x="758.0" y="370.0" width="213.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="864.5" y="391.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="864.5" dy="0.0">TRICKMODE_NO_AUDIO</tspan><tspan x="864.5" dy="16.9">1&lt;&lt;8   (256)</tspan><tspan x="864.5" dy="16.9">від 1.6</tspan></text>
<rect x="984.0" y="370.0" width="213.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="1090.5" y="392.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1090.5" dy="0.0">TRICKMODE_FORWARD_PREDICTED</tspan><tspan x="1090.5" dy="15.6">1&lt;&lt;9   (512)</tspan><tspan x="1090.5" dy="15.6">від 1.18</tspan></text>
<rect x="40.0" y="458.0" width="250.0" height="68.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="165.0" y="497.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">швидкість без стрибка</tspan></text>
<rect x="306.0" y="458.0" width="300.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="456.0" y="479.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="456.0" dy="0.0">INSTANT_RATE_CHANGE</tspan><tspan x="456.0" dy="16.9">1&lt;&lt;10   (1024)</tspan><tspan x="456.0" dy="16.9">від 1.18</tspan></text>
<text x="620.0" y="578.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">ACCURATE і KEY_UNIT одне одного не виключають — визначені всі чотири поєднання</text>
<text x="620.0" y="606.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">SNAP_NEAREST — це SNAP_BEFORE | SNAP_AFTER, тож «без прив'язки» задає лише відсутність обох</text>
<text x="620.0" y="634.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">SKIP і TRICKMODE — той самий біт: перевірка на SKIP спрацює й на TRICKMODE</text>
<text x="620.0" y="662.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">INSTANT_RATE_CHANGE несумісний із FLUSH, зі зміною позиції та зі зміною знака швидкості</text>
</svg>