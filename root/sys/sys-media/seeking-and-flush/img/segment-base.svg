<text x="1090.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">час програвання</text>
<rect x="70.0" y="392.0" width="330.0" height="68.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="235.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">перший сегмент: 0.0 → 4.0</text>
<line x1="430.0" y1="364.0" x2="430.0" y2="466.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="6,4"/>
<text x="430.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">перемотування</text>
<rect x="630.0" y="392.0" width="460.0" height="68.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
