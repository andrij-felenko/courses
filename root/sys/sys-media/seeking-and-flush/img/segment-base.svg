<text x="860.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">відлік триває, бо нічого не викидали й показ не переривався</text>
<text x="580.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">мітки кадрів в обох випадках однакові — різниться лише те, на яку мить конвеєр їх переводить</text>
