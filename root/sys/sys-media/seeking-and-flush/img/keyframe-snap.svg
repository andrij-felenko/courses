<text x="590.0" y="578.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">вибір не про точність проти неточності, а про те, хто платить: око чи процесор</text>
