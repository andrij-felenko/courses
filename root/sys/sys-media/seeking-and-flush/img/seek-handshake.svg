<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1290 716" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1290" height="716" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="640.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що бачить застосунок між викликом seek і готовим кадром</text>
<rect x="40.0" y="68.0" width="176.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="128.0" y="104.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle"><tspan x="128.0" dy="0.0">застосунок</tspan></text>
<rect x="238.0" y="68.0" width="436.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="456.0" y="104.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="456.0" dy="0.0">вичищаємо з шини старі ASYNC_DONE</tspan></text>
<rect x="696.0" y="68.0" width="544.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="968.0" y="95.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="968.0" dy="0.0">інакше перший же pop віддасть чуже —</tspan><tspan x="968.0" dy="16.9">від наповнення при пуску конвеєра</tspan></text>
<line x1="456.0" y1="131.0" x2="456.0" y2="144.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="145.0" width="176.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="128.0" y="181.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle"><tspan x="128.0" dy="0.0">застосунок</tspan></text>
<rect x="238.0" y="145.0" width="436.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="456.0" y="181.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="456.0" dy="0.0">gst_element_seek(… FLUSH …) → TRUE</tspan></text>
<rect x="696.0" y="145.0" width="544.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="968.0" y="172.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="968.0" dy="0.0">повертається за мілісекунди;</tspan><tspan x="968.0" dy="16.9">TRUE означає «прохання прийняте», не «зроблено»</tspan></text>
<line x1="456.0" y1="208.0" x2="456.0" y2="221.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="222.0" width="176.0" height="62.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="128.0" y="258.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle"><tspan x="128.0" dy="0.0">конвеєр</tspan></text>
<rect x="238.0" y="222.0" width="436.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="456.0" y="258.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="456.0" dy="0.0">приймачі шлють ASYNC_START</tspan></text>
<rect x="696.0" y="222.0" width="544.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="968.0" y="249.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="968.0" dy="0.0">наповнення втрачено: ціль PLAYING,</tspan><tspan x="968.0" dy="16.9">а показувати ще нічого</tspan></text>
<line x1="456.0" y1="285.0" x2="456.0" y2="298.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="299.0" width="176.0" height="62.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="128.0" y="335.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle"><tspan x="128.0" dy="0.0">конвеєр</tspan></text>
<rect x="238.0" y="299.0" width="436.0" height="62.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="456.0" y="335.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="456.0" dy="0.0">флаш, зміна позиції, новий SEGMENT</tspan></text>
<rect x="696.0" y="299.0" width="544.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="968.0" y="326.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="968.0" dy="0.0">у цю мить query_position віддає СТАРУ позицію —</tspan><tspan x="968.0" dy="16.9">ту, з якої перемотували</tspan></text>
<line x1="456.0" y1="362.0" x2="456.0" y2="375.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="376.0" width="176.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="128.0" y="412.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle"><tspan x="128.0" dy="0.0">конвеєр</tspan></text>
<rect x="238.0" y="376.0" width="436.0" height="62.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="456.0" y="412.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="456.0" dy="0.0">кожен приймач шле свій ASYNC_DONE</tspan></text>
<rect x="696.0" y="376.0" width="544.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="968.0" y="403.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="968.0" dy="0.0">наповнилася одна гілка;</tspan><tspan x="968.0" dy="16.9">у відео зі звуком їх щонайменше дві</tspan></text>
<line x1="456.0" y1="439.0" x2="456.0" y2="452.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="453.0" width="176.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="128.0" y="489.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle"><tspan x="128.0" dy="0.0">шина</tspan></text>
<rect x="238.0" y="453.0" width="436.0" height="62.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="456.0" y="489.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="456.0" dy="0.0">ASYNC_DONE від САМОГО конвеєра</tspan></text>
<rect x="696.0" y="453.0" width="544.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="968.0" y="480.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="968.0" dy="0.0">бін звів звіти дітей — оце й є</tspan><tspan x="968.0" dy="16.9">справжній кінець перемотування</tspan></text>
<line x1="456.0" y1="516.0" x2="456.0" y2="529.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="530.0" width="176.0" height="62.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="128.0" y="566.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle"><tspan x="128.0" dy="0.0">застосунок</tspan></text>
<rect x="238.0" y="530.0" width="436.0" height="62.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="456.0" y="566.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="456.0" dy="0.0">query_position — аж тепер правда</tspan></text>
<rect x="696.0" y="530.0" width="544.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="968.0" y="557.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="968.0" dy="0.0">і саме тепер видно, куди насправді влучили:</tspan><tspan x="968.0" dy="16.9">прив'язка до ключового кадру могла зсунути</tspan></text>
<rect x="40.0" y="622.0" width="1200.0" height="62.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="640.0" y="648.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle"><tspan x="640.0" dy="0.0">без прапорця FLUSH асинхронного переходу не буде взагалі —</tspan><tspan x="640.0" dy="18.2">а отже, не буде й ASYNC_DONE: чекання на нього достоїть до таймауту</tspan></text>
</svg>