<text x="470.0" y="412.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">На цьому стоять давачі поля, безконтактні вимикачі та струмові кліщі (фізика для давачів Модуля 5).</text>
