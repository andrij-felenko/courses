<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пластичність STDP (Spike-Timing-Dependent Plasticity)</text>
<line x1="50.0" y1="220.0" x2="750.0" y2="220.0" stroke="#333333" stroke-width="1.5"/>
<line x1="750.0" y1="220.0" x2="770.0" y2="220.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="760.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-style="italic">Δt = t_post − t_pre (мс)</text>
<line x1="400.0" y1="370.0" x2="400.0" y2="50.0" stroke="#333333" stroke-width="1.5"/>
<line x1="400.0" y1="50.0" x2="400.0" y2="35.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="415.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-style="italic">Зміна ваги Δw (%)</text>
<path d="M 80 235 Q 260 245 380 350" fill="none" stroke="#2457d6" stroke-width="3"/>
<path d="M 420 90 Q 540 195 720 205" fill="none" stroke="#c0392b" stroke-width="3"/>
<line x1="380.0" y1="220.0" x2="380.0" y2="350.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<line x1="420.0" y1="90.0" x2="420.0" y2="220.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<rect x="80.0" y="70.0" width="280.0" height="110.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="220.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Довготривала депресія (LTD)</tspan><tspan x="220.0" dy="13.0">Δt &lt; 0 (Post спайк перед Pre)</tspan><tspan x="220.0" dy="13.0">Δw &lt; 0 → Зменшення провідності G</tspan><tspan x="220.0" dy="13.0">Фізика: зворотний дрейф іонів / розрив нитки</tspan></text>
<rect x="440.0" y="70.0" width="280.0" height="110.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="580.0" y="110.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Довготривала потенціація (LTP)</tspan><tspan x="580.0" dy="11.7">Δt &gt; 0 (Pre спайк перед Post)</tspan><tspan x="580.0" dy="11.7">Δw &gt; 0 → Збільшення провідності G</tspan><tspan x="580.0" dy="11.7">Фізика: дрейф кисневих вакансій / добудова нитки</tspan></text>
<rect x="150.0" y="310.0" width="500.0" height="75.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="400.0" y="344.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Рівняння пластичності: Δw = A₊ · exp(−Δt / τ₊) при Δt &gt; 0, та Δw = −A₋ · exp(Δt / τ₋) при Δt &lt; 0</tspan><tspan x="400.0" dy="11.7">Часове вікно пластичності τ₊, τ₋ визначається кінетикою міграції дефектів у диелектрику.</tspan></text>
</svg>