<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 860 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="860" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="840.0" height="410.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фонон-фононне розсіювання: N-процеси та U-процеси (Umklapp)</text>
<rect x="20.0" y="55.0" width="385.0" height="335.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="212.5" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">Нормальний процес (N-процес)</text>
<rect x="140.0" y="160.0" width="140.0" height="140.0" rx="0" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<text x="210.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Перша зона Бріллюена</text>
<line x1="210.0" y1="230.0" x2="255.0" y2="190.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="225.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700" font-style="italic">k₁</text>
<line x1="255.0" y1="190.0" x2="270.0" y2="255.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="270.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700" font-style="italic">k₂</text>
<line x1="210.0" y1="230.0" x2="270.0" y2="255.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="245.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="italic">k₃ = k₁ + k₂</text>
<rect x="58.3" y="325.2" width="308.4" height="59.6" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="212.5" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle"><tspan x="212.5" dy="0.0">k₁ + k₂ = k₃</tspan><tspan x="212.5" dy="14.3">Сумарний квазіімпульс зберігається.</tspan><tspan x="212.5" dy="14.3">Німа опірність: тепловий потік не гальмується.</tspan></text>
<rect x="430.0" y="55.0" width="390.0" height="335.0" rx="8" fill="#fff5f5" stroke="#fca5a5" stroke-width="1.5"/>
<text x="625.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#991b1b" text-anchor="middle" font-weight="700">Процес перекидання (U-процес / Umklapp)</text>
<rect x="485.0" y="165.0" width="130.0" height="130.0" rx="0" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
<rect x="615.0" y="165.0" width="130.0" height="130.0" rx="0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
<text x="550.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">1-ша зона Бріллюена</text>
<text x="680.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">2-га зона</text>
<line x1="550.0" y1="230.0" x2="605.0" y2="185.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="570.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700" font-style="italic">k₁</text>
<line x1="605.0" y1="185.0" x2="690.0" y2="215.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="645.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700" font-style="italic">k₂</text>
<line x1="690.0" y1="215.0" x2="560.0" y2="215.0" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="625.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7c3aed" text-anchor="middle" font-weight="700" font-style="italic">G</text>
<line x1="550.0" y1="230.0" x2="560.0" y2="215.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="515.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="italic">k₃'</text>
<rect x="473.9" y="325.2" width="302.1" height="59.6" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="625.0" y="344.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle"><tspan x="625.0" dy="0.0">k₁ + k₂ = k₃' + G</tspan><tspan x="625.0" dy="14.3">Результуючий квазіімпульс повертається назад!</tspan><tspan x="625.0" dy="14.3">Створює тепловий опір у чистому кристалі.</tspan></text>
</svg>