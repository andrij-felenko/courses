<text x="410.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Це джоулеве тепло; скільки саме (I²R) — порахуємо в Розділі 3.</text>
