rl(#arrow)"/><rect x="545.2" y="304.5" width="149.6" height="31.0" rx="6" fill="#d6eaf8" stroke="#2457d6" stroke-width="1.5"/><text x="620.0" y="323.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Cₕ = (4,4) Кріслова</tspan></text><rect x="423.9" y="37.9" width="392.2" height="84.2" rx="6" fill="#fcf3cf" stroke="#f1c40f" stroke-width="1.5"/><text x="620.0" y="55.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Класифікація нанотрубок за (n, m):</tspan><tspan x="620.0" dy="14.3">• n = m : кріслова (Armchair) — завжди метал</tspan><tspan x="620.0" dy="14.3">• m = 0 : зигзагоподібна (Zigzag) — напівпровідник або метал</tspan><tspan x="620.0" dy="14.3">• n ≠ m ≠ 0 : хіральна (Chiral) — спіральна симетрія</tspan><tspan x="620.0" dy="14.3">• Умова металічності: (n - m) mod 3 = 0</tspan></text></svg>