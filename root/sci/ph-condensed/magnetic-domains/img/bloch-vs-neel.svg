<text x="605.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">б) Стінка Нееля (тонка плівка d &lt; δ)</text>
