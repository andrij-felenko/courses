<text x="605.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Вектор M обертається в площині плівки</tspan><tspan x="605.0" dy="14.3">(мінімізує демагнетизацію товщини плівки)</tspan></text>
