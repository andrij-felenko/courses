<text x="215.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Товщина δ ≈ π√(A/K)</text>
<text x="215.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Вектор M обертається паралельно площині стінки</tspan><tspan x="215.0" dy="14.3">(відсутні поверхневі магнітні заряди)</tspan></text>
