<rect x="97.9" y="302.2" width="624.2" height="55.6" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="410.0" y="319.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Магнусівська сила й холівський ефект скирміонів (Skyrmion Hall Effect):</tspan><tspan x="410.0" dy="14.3">Топологічний заряд Q створює поперечне відхилення F_M = G × v, що штовхає скирміон до краю треку.</tspan><tspan x="410.0" dy="14.3">Для компенсації використовують антиферомагнітно звязані двошарові треки (SAF).</tspan></text>
<text x="410.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Наносекундні імпульси струму рухають ланцюжок скирміонів зі швидкістю понад 100 м/с при низькому енергоспоживанні</text>
