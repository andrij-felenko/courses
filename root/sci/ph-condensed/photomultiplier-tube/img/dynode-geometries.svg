<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Типи конфігурацій дінодних систем ФЕУ</text>
<rect x="30.0" y="60.0" width="340.0" height="130.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="115.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">а) Лінійно-фокусована (Linear focused)</tspan><tspan x="200.0" dy="13.0">Висока часова роздільна здатність, малий TTS (0.3-1 нс).</tspan><tspan x="200.0" dy="13.0">Оптимальна для швидкого таймінгу та рахунку фотонів.</tspan></text>
<rect x="410.0" y="60.0" width="340.0" height="130.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="580.0" y="115.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">б) Коробчаста з сіткою (Box-and-grid)</tspan><tspan x="580.0" dy="13.0">Велика ефективність збору фотоелектронів.</tspan><tspan x="580.0" dy="13.0">Ідеальна для спектрометрії та слабких світлових потоків.</tspan></text>
<rect x="30.0" y="210.0" width="340.0" height="130.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">в) Жалюзійна (Venetian blind)</tspan><tspan x="200.0" dy="11.7">Висока стабільність коефіцієнта підсилення, велика площа.</tspan><tspan x="200.0" dy="11.7">Стійкість до перевантажень струмом.</tspan></text>
<rect x="410.0" y="210.0" width="340.0" height="130.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="580.0" y="264.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">г) Мікроканальна пластина (MCP-PMT)</tspan><tspan x="580.0" dy="14.3">Ультрашвидкий відгук (TTS &lt; 100 пс), компактність.</tspan><tspan x="580.0" dy="14.3">Стійкість до зовнішніх магнітних полів.</tspan></text>
</svg>