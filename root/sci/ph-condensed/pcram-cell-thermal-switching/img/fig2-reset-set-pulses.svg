<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 851.5 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="851.5" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Електричні імпульси Reset / Set та часовий температурний відгук</text>
<text x="210.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Електричні імпульси струму</text>
<line x1="50.0" y1="340.0" x2="390.0" y2="340.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="60.0" y1="350.0" x2="60.0" y2="80.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="395.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">t (ns)</text>
<text x="55.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">V / I</text>
<path d="M 80 340 L 80 110 L 160 110 L 165 340" stroke="#c0392b" stroke-width="2.5" fill="rgba(231,76,60,0.15)"/>
<text x="120.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">RESET</text>
<text x="120.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#922b21" text-anchor="middle">Швидкий спад</text>
<text x="120.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#922b21" text-anchor="middle" font-style="italic">(t_f &lt; 2 ns)</text>
<path d="M 200 340 L 200 210 L 280 210 L 360 340" stroke="#2980b9" stroke-width="2.5" fill="rgba(52,152,219,0.15)"/>
<text x="250.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1b4f72" text-anchor="middle" font-weight="700">SET імпульс</text>
<text x="283.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2471a3" text-anchor="middle">Тривалий відпал</text>
<text x="290.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2471a3" text-anchor="middle" font-style="italic">(50 - 100 ns)</text>
<text x="630.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Температурний профіль T(t)</text>
<line x1="470.0" y1="340.0" x2="810.0" y2="340.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="480.0" y1="350.0" x2="480.0" y2="80.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="815.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">t (ns)</text>
<text x="475.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">T (°C)</text>
<line x1="480.0" y1="130.0" x2="800.0" y2="130.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="450.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">T_m (600°C)</text>
<line x1="480.0" y1="240.0" x2="800.0" y2="240.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="450.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">T_g (200°C)</text>
<path d="M 500 340 Q 520 100 540 100 L 550 100 Q 555 340 560 340" stroke="#e74c3c" stroke-width="2.5" fill="none"/>
<text x="540.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Плавлення T &gt; T_m</text>
<text x="575.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#922b21" text-anchor="middle" font-weight="700">Загартування (Quenching)</text>
<text x="575.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#922b21" text-anchor="middle" font-style="italic">dT/dt &gt; 10⁹ K/s</text>
<path d="M 610 340 Q 630 180 650 180 L 730 180 Q 770 340 790 340" stroke="#2980b9" stroke-width="2.5" fill="none"/>
<text x="690.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1b4f72" text-anchor="middle" font-weight="700">Вікно кристалізації (T_g &lt; T &lt; T_m)</text>
</svg>