<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340">
<rect width="820" height="340" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Падіння напруги на довгому дроті</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">сам дріт має опір; на довгому тонкому дроті частина напруги «губиться» (I·R)</text>
<line x1="110.0" y1="120.0" x2="110.0" y2="220.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="94.0" y1="160.0" x2="126.0" y2="160.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<line x1="101.0" y1="176.0" x2="119.0" y2="176.0" stroke="#1b1b1b" stroke-width="5" stroke-linecap="round"/>
<text x="90.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">12 В</text>
<line x1="110.0" y1="120.0" x2="250.0" y2="120.0" stroke="#cf8b5e" stroke-width="3" stroke-linecap="round"/>
<rect x="250.0" y="111.0" width="70.0" height="18.0" rx="3" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<text x="285.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">R_дроту</text>
<line x1="320.0" y1="120.0" x2="600.0" y2="120.0" stroke="#cf8b5e" stroke-width="3" stroke-linecap="round"/>
<line x1="110.0" y1="220.0" x2="600.0" y2="220.0" stroke="#cf8b5e" stroke-width="3" stroke-linecap="round"/>
<text x="420.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">довгий тонкий дріт</text>
<rect x="600.0" y="130.0" width="44.0" height="80.0" rx="6" fill="#fff7ef" stroke="#c89b5a" stroke-width="2.2"/>
<text x="622.0" y="175.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">при-</text>
<text x="622.0" y="190.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">лад</text>
<line x1="600.0" y1="120.0" x2="600.0" y2="130.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="600.0" y1="210.0" x2="600.0" y2="220.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<text x="680.0" y="165.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">дістає &lt; 12 В</text>
<line x1="160.0" y1="120.0" x2="200.0" y2="120.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<text x="180.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="italic">I</text>
<rect x="120.0" y="270.0" width="580.0" height="50.0" rx="10" fill="#fff3e8" stroke="#e08030" stroke-width="1.6"/>
<text x="410.0" y="292.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тонкий довгий дріт = великий R → велике падіння I·R → прилад «недоїдає», а дріт гріється.</text>
<text x="410.0" y="310.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому для довгих ліній і великих струмів беруть товстий дріт (малий R).</text>
</svg>
