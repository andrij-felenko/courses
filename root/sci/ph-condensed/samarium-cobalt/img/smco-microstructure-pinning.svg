<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коерцитивні механізми та осередкова мікроструктура сплаву Sm₂Co₁₇</text>
<rect x="20.0" y="50.0" width="360.0" height="320.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="200.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700">SmCo₅: Механізм зародкоутворення (Nucleation)</text>
<rect x="50.0" y="100.0" width="140.0" height="110.0" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="120.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="700">Однодоменне зерно</text>
<line x1="120.0" y1="190.0" x2="120.0" y2="135.0" stroke="#1d4ed8" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="210.0" y="100.0" width="140.0" height="110.0" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="280.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">Дефект на межі зерна</text>
<circle cx="280.0" cy="195.0" r="18.0" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
<line x1="280.0" y1="185.0" x2="280.0" y2="205.0" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="280.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">Зародок розмагн.</text>
<rect x="40.0" y="230.0" width="320.0" height="120.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="200.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Поведінка: Зерна дрібні (1-5 мкм).</tspan><tspan x="200.0" dy="13.0">Вручну зміщені стінки легко рухаються,</tspan><tspan x="200.0" dy="13.0">проте для зародження зворотного домену</tspan><tspan x="200.0" dy="13.0">потрібне величезне зовнішнє поле H_ci ≈ H_A.</tspan></text>
<rect x="400.0" y="50.0" width="360.0" height="320.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="580.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#065f46" text-anchor="middle" font-weight="700">Sm₂Co₁₇: Механізм пінінгу (Cellular Pinning)</text>
<rect x="490.0" y="115.0" width="180.0" height="100.0" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="2.0"/>
<text x="580.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#047857" text-anchor="middle" font-weight="700">Основна осередкова фаза 2:17</text>
<text x="580.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(Sm₂Co₁₇ rhombohedral, ~100 нм)</text>
<rect x="484.0" y="109.0" width="192.0" height="112.0" rx="6" fill="none" stroke="#d97706" stroke-width="3.0"/>
<text x="580.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">Межова фаза 1:5 (збагачена Cu)</text>
<line x1="470.0" y1="165.0" x2="690.0" y2="165.0" stroke="#7e22ce" stroke-width="2.5" stroke-dasharray="4,2"/>
<text x="580.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b21a8" text-anchor="middle" font-weight="700">Пластинчаста Z-фаза (Zr₂Co₁₁)</text>
<line x1="484.0" y1="125.0" x2="484.0" y2="205.0" stroke="#dc2626" stroke-width="3.5"/>
<text x="460.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle" font-weight="700">Закріплена стінка (Pinning)</text>
<rect x="420.0" y="230.0" width="320.0" height="120.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="580.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Поведінка: Градієнт енергії доменної стінки</tspan><tspan x="580.0" dy="13.0">Δγ_w між фазою 2:17 та межовою фазою 1:5 (Cu)</tspan><tspan x="580.0" dy="13.0">створює потужні пастки (пінінг).</tspan><tspan x="580.0" dy="13.0">Доменна стінка надійно застрягає на межах.</tspan></text>
</svg>