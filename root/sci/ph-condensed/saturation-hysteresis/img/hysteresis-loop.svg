<text x="450.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Широка петля (тверді матеріали) — добре для постійного магніту, погано для осердя: щоцикл втрачається</text>
<text x="450.0" y="168.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">енергія. Тому осердя трансформаторів роблять із «м'якого» заліза з тонкою петлею (зв'язок із §1.8.3).</text>
<text x="450.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="italic">⚠ Не плутати з гістерезисом тригера Шмітта (§2.8.8) — там пороги напруги, а не магнетизм.</text>
