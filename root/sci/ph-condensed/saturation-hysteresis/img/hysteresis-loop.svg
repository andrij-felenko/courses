<text x="450.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Гістерезис: осердя «пам'ятає» минуле поле</text>
<text x="450.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">знявши струм (H=0), осердя лишається трохи намагніченим (B_r); щоб обнулити — потрібне зустрічне поле H_c</text>
