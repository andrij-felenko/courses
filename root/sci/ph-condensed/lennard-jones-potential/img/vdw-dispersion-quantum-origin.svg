<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Квантово-механічна природа міжатомних сил</text>
<rect x="20.0" y="50.0" width="380.0" height="290.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="210.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0369a1" text-anchor="middle" font-weight="700">1. Дисперсійне притягання Лондона (∝ -1/r⁶)</text>
<circle cx="110.0" cy="160.0" r="42.0" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<circle cx="100.0" cy="160.0" r="7.0" fill="#ef4444" stroke="#b91c1c" stroke-width="1.0"/>
<circle cx="128.0" cy="165.0" r="5.0" fill="#0284c7" stroke="#0369a1" stroke-width="1.0"/>
<text x="110.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">Атом A: Миттєвий диполь</text>
<text x="110.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">μ₁ = q · δx(t)</text>
<line x1="158.0" y1="160.0" x2="252.0" y2="160.0" stroke="#0284c7" stroke-width="1.8"/>
<polygon points="252.0,160.0 244.0,156.0 244.0,164.0" fill="#0284c7" stroke="#333333" stroke-width="1.5"/>
<text x="205.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="middle" font-weight="700">Поле E ∝ μ₁/r³</text>
<circle cx="310.0" cy="160.0" r="42.0" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<circle cx="298.0" cy="160.0" r="7.0" fill="#ef4444" stroke="#b91c1c" stroke-width="1.0"/>
<circle cx="326.0" cy="155.0" r="5.0" fill="#0284c7" stroke="#0369a1" stroke-width="1.0"/>
<text x="310.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">Атом B: Наводнений диполь</text>
<text x="310.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">μ₂ = α · E ∝ α·μ₁/r³</text>
<rect x="40.0" y="255.0" width="340.0" height="68.0" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.0"/>
<text x="210.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Енергія зв'язку диполів:</text>
<text x="210.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle">V_att ∝ - (μ₁ · μ₂) / r³ ∝ - α · μ₁² / r⁶</text>
<rect x="420.0" y="50.0" width="380.0" height="290.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="610.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b21a8" text-anchor="middle" font-weight="700">2. Відштовхування Паулі (∝ +1/r¹²)</text>
<circle cx="550.0" cy="160.0" r="45.0" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<circle cx="670.0" cy="160.0" r="45.0" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
<circle cx="550.0" cy="160.0" r="7.0" fill="#6b21a8" stroke="#581c87" stroke-width="1.0"/>
<circle cx="670.0" cy="160.0" r="7.0" fill="#6b21a8" stroke="#581c87" stroke-width="1.0"/>
<ellipse cx="610.0" cy="160.0" rx="18.0" ry="32.0" fill="#e9d5ff" stroke="#c084fc" stroke-width="1.5"/>
<text x="610.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#581c87" text-anchor="middle" font-weight="700">Зона</text>
<text x="610.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#581c87" text-anchor="middle" font-weight="700">перекриття</text>
<text x="610.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">Перекриття електронних хмар при r &lt; σ</text>
<text x="610.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Принцип заборони Паулі забороняє однаковий стан</text>
<rect x="440.0" y="255.0" width="340.0" height="68.0" rx="4" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.0"/>
<text x="610.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b21a8" text-anchor="middle" font-weight="700">Ортогоналізація квантових станів:</text>
<text x="610.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7e22ce" text-anchor="middle">Різке зростання кінетичної енергії ∝ 1/r¹²</text>
</svg>