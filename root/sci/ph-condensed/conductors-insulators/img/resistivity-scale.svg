<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Питомий опір: найширший діапазон з усіх властивостей</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">від міді до кварцу — близько 24 порядків величини (Ом·м)</text>
<line x1="90.0" y1="180.0" x2="740.0" y2="180.0" stroke="#1b1b1b" stroke-width="2.5" stroke-linecap="round"/>
<line x1="90.0" y1="173.0" x2="90.0" y2="187.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<circle cx="90.0" cy="180.0" r="6.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
