<text x="740.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">10¹⁶</text>
<text x="90.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">ПРОВІДНИКИ</text>
<text x="415.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a52c0" text-anchor="middle" font-weight="bold" font-style="normal">напівпровідники</text>
<text x="740.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">ІЗОЛЯТОРИ</text>
<rect x="150.0" y="250.0" width="520.0" height="56.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="410.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Жодна інша звичайна властивість не змінюється так сильно між матеріалами.</text>
<text x="410.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Напівпровідники сидять посередині — і їхній опір можна зсувати керовано.</text>
</svg>
