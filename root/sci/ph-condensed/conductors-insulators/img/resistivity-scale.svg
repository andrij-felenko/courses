<text x="90.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">10⁻⁸</text>
<line x1="144.2" y1="173.0" x2="144.2" y2="187.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
