<text x="144.2" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ніхром</text>
<text x="144.2" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">10⁻⁶</text>
<line x1="387.9" y1="173.0" x2="387.9" y2="187.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
