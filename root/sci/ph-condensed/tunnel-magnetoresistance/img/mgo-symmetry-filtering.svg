<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фільтрація блохівських симетрій у кристалічному бар'єрі MgO(001)</text>
<rect x="30.0" y="50.0" width="740.0" height="350.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="50.0" y="90.0" width="180.0" height="250.0" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="140.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">Fe(001) Електрод 1</text>
<text x="140.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle">Блохівські стани при E_F</text>
<rect x="280.0" y="90.0" width="240.0" height="250.0" rx="4" fill="#fef3c7" stroke="#fde047" stroke-width="1.5"/>
<text x="400.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700">Кристалічний бар'єр MgO(001)</text>
<text x="400.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle">Згасаючі еванесцентні хвилі</text>
<rect x="570.0" y="90.0" width="180.0" height="250.0" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="660.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">Fe(001) Електрод 2</text>
<text x="660.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle">Приймальні стани</text>
<text x="140.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">Стан Δ₁ (s-p-d_z²)</text>
<path d="M 230 170 L 280 170 C 350 170, 450 180, 520 185 L 570 185" fill="none" stroke="#16a34a" stroke-width="3.5"/>
<line x1="520.0" y1="185.0" x2="570.0" y2="185.0" stroke="#16a34a" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="400.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">κ(Δ₁) = 0.85 Å⁻¹ (Мале згасання)</text>
<text x="660.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700">Високе T(Δ₁)</text>
<text x="140.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Стан Δ₅ (d_xz, d_yz)</text>
<path d="M 230 230 L 280 230 C 330 240, 410 265, 520 275 L 570 275" fill="none" stroke="#2563eb" stroke-width="2.0"/>
<line x1="520.0" y1="275.0" x2="570.0" y2="275.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="700">κ(Δ₅) = 1.05 Å⁻¹ (Середнє згасання)</text>
<text x="660.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="700">Пригнічене T(Δ₅)</text>
<text x="140.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6d28d9" text-anchor="middle" font-weight="700">Стан Δ₂' (d_xy)</text>
<path d="M 230 290 L 280 290 C 310 305, 350 330, 520 335 L 570 335" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="400.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6d28d9" text-anchor="middle" font-weight="700">κ(Δ₂') = 1.25 Å⁻¹ (Швидке згасання)</text>
<text x="660.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#5b21b6" text-anchor="middle" font-weight="700">Незриме T(Δ₂') ≈ 0</text>
<text x="400.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">При E_F стан Δ₁ у Fe є 100% спіново-поляризованим (тільки спін ↑), що піднімає TMR &gt; 600%</text>
<text x="400.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Когерентний добір симетрій у кристалічному MgO перетворює бар'єр на ефективний спіновий фільтр</text>
</svg>