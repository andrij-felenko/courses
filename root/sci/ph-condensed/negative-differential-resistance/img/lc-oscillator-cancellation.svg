<text x="400.0" y="63.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Повна активна опірність R_total = R_втрат - |r_d| ≤ 0 створює незатухаючі коливання</text>
