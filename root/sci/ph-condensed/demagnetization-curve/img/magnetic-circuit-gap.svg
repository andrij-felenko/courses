<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 800 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="800" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="780.0" height="440.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Магнітне коло з повітряним зазором та розмагнічувальне поле H_d</text>
<rect x="20.0" y="55.0" width="360.0" height="320.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="200.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Постійний магніт у відкритому просторі</text>
<rect x="100.0" y="140.0" width="200.0" height="70.0" rx="4" fill="#e2e8f0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="200.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Постійний магніт</text>
<text x="200.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle">Намагніченість J</text>
<text x="85.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">S (−σ_m)</text>
<text x="320.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">N (+σ_m)</text>
<line x1="140.0" y1="175.0" x2="260.0" y2="175.0" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="200.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">J</text>
<line x1="260.0" y1="235.0" x2="140.0" y2="235.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="200.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">H_d = −N_d · J / μ₀</text>
<path d="M 300 155 C 360 90, 40 90, 100 155" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4,3"/>
<path d="M 300 195 C 360 290, 40 290, 100 195" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="200.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle">Лінії індукції B</text>
<rect x="400.0" y="55.0" width="360.0" height="320.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="580.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Магнітопровід з повітряним зазором</text>
<rect x="440.0" y="120.0" width="280.0" height="170.0" rx="6" fill="#e2e8f0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="490.0" y="160.0" width="180.0" height="90.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="440.0" y="160.0" width="50.0" height="90.0" rx="0" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.0"/>
<text x="465.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">Магніт</text>
<text x="465.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">l_m</text>
<rect x="670.0" y="185.0" width="50.0" height="40.0" rx="0" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
<text x="695.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle" font-weight="700">Зазор</text>
<text x="695.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">l_g</text>
<text x="580.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">H_m·l_m + H_g·l_g = 0  ⇒  H_m = −H_g·(l_g / l_m)</text>
<text x="580.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">B_m·A_m = B_g·A_g  (збереження потоку)</text>
<rect x="40.0" y="380.0" width="700.0" height="45.0" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="390.0" y="399.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Розрив магнітного кола створює поверхневі магнітні полюси, які формують внутрішнє розмагнічувальне поле H_d.</tspan><tspan x="390.0" dy="14.3">Геометрія магніту та розмір зазору визначають нахил робочої лінії B/H.</tspan></text>
</svg>