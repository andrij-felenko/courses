<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 800 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="800" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="780.0" height="480.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Динамічна лінія повернення (recoil line) та точку згину кривої</text>
<line x1="540.0" y1="390.0" x2="70.0" y2="390.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="540.0" y1="390.0" x2="540.0" y2="50.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="60.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">H (кА/м)</text>
<text x="555.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">B (Тл)</text>
<path d="M 540 110 L 300 110 C 270 110, 260 140, 220 390" fill="none" stroke="#d97706" stroke-width="2.0" stroke-dasharray="4,4"/>
<path d="M 540 110 L 300 140 C 270 155, 250 330, 210 390" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
<circle cx="270.0" cy="160.0" r="5.0" fill="#dc2626" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="258.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="end" font-weight="700">Згин (knee point)</text>
<circle cx="420.0" cy="160.0" r="5.0" fill="#059669" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="430.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="start" font-weight="700">Q₀ (Початкова робоча точка)</text>
<line x1="420.0" y1="160.0" x2="200.0" y2="310.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="200.0" cy="310.0" r="5.0" fill="#dc2626" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="190.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="end" font-weight="700">Q₁ (Зовнішнє поле H_ext)</text>
<path d="M 200 310 L 420 245" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
<circle cx="420.0" cy="245.0" r="5.0" fill="#7c3aed" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="432.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c3aed" text-anchor="start" font-weight="700">Q₂ (Новий стан після розмагнічування)</text>
<text x="297.0" y="267.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">Лінія повернення (μ_rec)</text>
<line x1="450.0" y1="160.0" x2="450.0" y2="245.0" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
<line x1="450.0" y1="160.0" x2="450.0" y2="245.0" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="460.0" y="206.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">ΔB_irrev (Незворотна втрата)</text>
<rect x="40.0" y="415.0" width="700.0" height="45.0" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="390.0" y="434.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Якщо зовнішнє поле протитиску або підвищення температури зміщує робочу точку за точку згину (knee point),</tspan><tspan x="390.0" dy="13.0">магніт повертається вздовж лінії повернення з нахилом μ_rec, зазнаючи незворотної втрати намагніченості ΔB_irrev.</tspan></text>
</svg>