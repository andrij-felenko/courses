<text x="115.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start" font-weight="700">B(H) — Індукційна крива</text>
<rect x="40.0" y="415.0" width="700.0" height="45.0" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="390.0" y="441.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">B(H) = μ₀·H + J(H). Для висококоерцитивних матеріалів (NdFeB, SmCo) H_cj значно перевищує H_cb,</tspan><tspan x="390.0" dy="14.3">що забезпечує високу стійкість до розмагнічування у відкритому магнітному колі.</tspan></text>
