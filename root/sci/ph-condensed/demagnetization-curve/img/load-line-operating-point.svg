<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 800 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="800" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="780.0" height="480.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Робоча лінія (load line) та вплив коефіцієнта розмагнічування N</text>
<line x1="500.0" y1="390.0" x2="70.0" y2="390.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="500.0" y1="390.0" x2="500.0" y2="50.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="60.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">H (кА/м)</text>
<text x="515.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">B (Тл)</text>
<path d="M 500 110 C 380 130, 310 320, 260 390" fill="none" stroke="#1d4ed8" stroke-width="2.8"/>
<text x="510.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="start" font-weight="700">B_r</text>
<line x1="500.0" y1="390.0" x2="360.0" y2="80.0" stroke="#059669" stroke-width="2.0"/>
<circle cx="440.0" cy="140.0" r="5.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="430.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="end" font-weight="700">P₁ (Довгий стержень, P_c &gt; 10)</text>
<line x1="500.0" y1="390.0" x2="240.0" y2="125.0" stroke="#059669" stroke-width="2.0" stroke-dasharray="6,3"/>
<circle cx="360.0" cy="205.0" r="5.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="350.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="end" font-weight="700">P_opt (Оптимум (BH)_max, P_c ≈ 1.2)</text>
<line x1="500.0" y1="390.0" x2="160.0" y2="240.0" stroke="#059669" stroke-width="2.0"/>
<circle cx="280.0" cy="290.0" r="5.0" fill="#dc2626" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="270.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="end" font-weight="700">P₃ (Плоский диск, P_c &lt; 0.5)</text>
<rect x="540.0" y="100.0" width="225.0" height="170.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="652.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коефіцієнт провідності P_c</text>
<text x="555.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="start" font-weight="700">P_c = |B / H| = μ₀ · (1−N) / N</text>
<text x="555.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Для прямого зазору:</text>
<text x="555.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">P_c = μ₀ · (A_g · l_m) / (A_m · l_g)</text>
<line x1="555.0" y1="215.0" x2="750.0" y2="215.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="555.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• N → 0 : P_c → ∞ (стержень)</text>
<text x="555.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• N → 1 : P_c → 0 (пластина)</text>
<rect x="40.0" y="415.0" width="700.0" height="45.0" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="390.0" y="434.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Робоча точка P є перетином кривої розмагнічування B(H) та робочої лінії (load line).</tspan><tspan x="390.0" dy="13.0">Чим коротший магніт уздовж осі намагнічування, тим більший N, пологиша робоча лінія і нижча робоча індукція B_op.</tspan></text>
</svg>