<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e3a8a" text-anchor="middle" font-weight="700">Спонтанне та явне порушення конформної симетрії в SYK моделі</text>
<rect x="40.0" y="70.0" width="230.0" height="280.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="155.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle" font-weight="700">Ультрафіолет (УФ)</text>
<text x="155.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">J·τ ≪ 1 (короткі часи)</text>
<line x1="60.0" y1="140.0" x2="250.0" y2="140.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="155.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">Вільний пропагатор:</text>
<text x="155.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle">G₀(τ) = 1/2 sgn(τ)</text>
<text x="155.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Домінує кінетичний терм</text>
<text x="155.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">∂_τ у рівняннях</text>
<text x="155.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">Немає конформності</text>
<line x1="280.0" y1="210.0" x2="330.0" y2="210.0" stroke="#1e3a8a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="305.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="700">РГ-потік</text>
<text x="305.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">T ≪ J</text>
<rect x="340.0" y="70.0" width="230.0" height="280.0" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="455.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e3a8a" text-anchor="middle" font-weight="700">Конформний ІЧ режим</text>
<text x="455.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">J·τ ≫ 1 (довгі часи)</text>
<line x1="360.0" y1="140.0" x2="550.0" y2="140.0" stroke="#93c5fd" stroke-width="1.0"/>
<text x="455.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">Емерджентна симетрія:</text>
<text x="455.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="700">Diff(S¹) репараметризація</text>
<text x="455.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle">G_c(τ) ∝ sgn(τ)/|Jτ|^(1/2)</text>
<text x="455.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">Спонтанне порушення:</text>
<text x="455.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">Diff(S¹) → SL(2,ℝ)</text>
<line x1="580.0" y1="210.0" x2="630.0" y2="210.0" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="605.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Виправлення</text>
<text x="605.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">1/(J·β)</text>
<rect x="640.0" y="70.0" width="180.0" height="280.0" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="730.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700">Шварціаніка</text>
<text x="730.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Явне порушення</text>
<line x1="660.0" y1="140.0" x2="800.0" y2="140.0" stroke="#fdba74" stroke-width="1.0"/>
<text x="730.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">Голдстоунівська мода:</text>
<text x="730.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle">f(τ) ∈ Diff(S¹)/SL(2,ℝ)</text>
<text x="730.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">Ефективна дія:</text>
<text x="730.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">S_eff = - α_S N/J</text>
<text x="730.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">× ∫ {f(τ), τ} dτ</text>
<text x="430.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Похідна Шварца {f, τ} виникає як найнижчий оператор, що описує динаміку Голдстоунівських псевдонабутих мод.</text>
</svg>