<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<line x1="420.0" y1="20.0" x2="420.0" y2="415.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="210.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Температурна залежність опору R(T)</text>
<text x="210.0" y="53.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Стрибок опору на 4-6 порядків біля T_c</text>
<line x1="60.0" y1="360.0" x2="380.0" y2="360.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="370.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">T (°C)</text>
<line x1="60.0" y1="360.0" x2="60.0" y2="80.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="20.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">lg(R)</text>
<path d="M 60 280 Q 140 310 180 320 Q 220 325 240 280 Q 270 110 310 100 L 370 100" stroke="#2457d6" stroke-width="2.5" fill="none"/>
<line x1="225.0" y1="80.0" x2="225.0" y2="360.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="2 2"/>
<text x="225.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">T_c (Кюрі)</text>
<text x="120.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">NTC область (T &lt; T_c)</text>
<text x="285.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">PTC область</text>
<text x="285.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">ΔR ≈ 10⁴-10⁶</text>
<text x="630.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель Хейванга для BaTiO₃</text>
<text x="630.0" y="53.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Екранування бар'єру поляризацією P_s</text>
<rect x="460.0" y="80.0" width="330.0" height="140.0" rx="6" fill="#e8f8f5" stroke="#16a085" stroke-width="1.5"/>
<text x="625.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a085" text-anchor="middle" font-weight="700">Фаза T &lt; T_c (Сегнетоелектрик)</text>
<path d="M 480 180 Q 625 190 770 180" stroke="#16a085" stroke-width="2.0" fill="none"/>
<text x="625.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Низький бар'єр eΦ_b: P_s компенсує заряд ловушок</text>
<text x="625.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Висока діелектрична проникність ε_r</text>
<rect x="460.0" y="240.0" width="330.0" height="140.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/>
<text x="625.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Фаза T &gt; T_c (Параелектрик)</text>
<path d="M 480 300 Q 625 370 770 300" stroke="#c0392b" stroke-width="2.5" fill="none"/>
<text x="625.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Високий бар'єр eΦ_b ~ 1/ε_r</text>
<text x="625.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Зникнення P_s → Опір R зростає експоненціально</text>
</svg>