<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Швидкий хаос — і повільний дрейф поверх нього</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">теплова швидкість величезна, але безладна; поле додає крихітний напрямлений зсув</text>
<line x1="410.0" y1="78.0" x2="410.0" y2="370.0" stroke="#e4e4e4" stroke-width="1.5" stroke-linecap="round"/>
<text x="210.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">без поля: хаос, нуль зсуву</text>
<polyline points="130.0,230.0 166.0,198.0 202.0,246.0 256.0,230.0 220.0,278.0 274.0,310.0 256.0,262.0 310.0,230.0 274.0,198.0 328.0,230.0 274.0,246.0 310.0,198.0" fill="none" stroke="#1f47b5" stroke-width="1.8"/>
<circle cx="130.0" cy="230.0" r="5.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<circle cx="310.0" cy="198.0" r="5.0" fill="#fff" stroke="#1f47b5" stroke-width="2"/>
<text x="210.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">повернувся майже туди ж</text>
<text x="210.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(теплова швидкість ~10⁵–10⁶ м/с)</text>
<text x="610.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">з полем: хаос + ДРЕЙФ</text>
<line x1="470.0" y1="120.0" x2="760.0" y2="120.0" stroke="#1f8a3b" stroke-width="1.5" marker-end="url(#aGreen)"/>
<line x1="470.0" y1="320.0" x2="760.0" y2="320.0" stroke="#1f8a3b" stroke-width="1.5" marker-end="url(#aGreen)"/>
<text x="615.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">E →</text>
