<circle cx="236.0" cy="278.0" r="5.0" fill="#fff" stroke="#1f47b5" stroke-width="2"/>
<line x1="740.0" y1="300.0" x2="236.0" y2="300.0" stroke="#1f47b5" stroke-width="2.4" marker-end="url(#aBlue)"/>
<text x="610.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">повільно зсунувся ліворуч (проти E)</text>
<text x="610.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(дрейф ~0.1 мм/с)</text>
