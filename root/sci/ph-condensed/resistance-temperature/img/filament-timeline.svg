<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380">
<rect width="820" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Полювання на нитку: не «один геній», а ланцюг рук у різних країнах</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">практичну лампу зробили колективно — і вугільну, і вольфрамову нитку шукали роками</text>
<line x1="70.0" y1="156.0" x2="750.0" y2="156.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<text x="70.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">1870</text>
<text x="750.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="end" font-weight="normal" font-style="normal">1915</text>
<circle cx="100.2" cy="156.0" r="6.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="1.5"/>
<text x="100.2" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">1872</text>
<text x="100.2" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Лодигін · Росія</text>
<text x="100.2" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">рання лампа (вугільні</text>
<text x="100.2" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">стрижні; ще не практична)</text>
<circle cx="221.1" cy="156.0" r="6.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="221.1" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">1879–80</text>
<text x="221.1" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Едісон (США) + Свон (Брит.)</text>
<text x="221.1" y="131.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">практична ВУГІЛЬНА лампа</text>
<text x="221.1" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(бамбук / целюлоза), паралельно</text>
<circle cx="583.8" cy="156.0" r="6.0" fill="#7a52c0" stroke="#7a52c0" stroke-width="1.5"/>
<text x="583.8" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#7a52c0" text-anchor="middle" font-weight="bold" font-style="normal">1904</text>
<text x="583.8" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Юст і Ганаман · Австро-Уг.</text>
<text x="583.8" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">перша ВОЛЬФРАМОВА нитка</text>
<text x="583.8" y="224.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(але крихка)</text>
<circle cx="674.4" cy="156.0" r="6.0" fill="#c98a00" stroke="#c98a00" stroke-width="1.5"/>
<text x="674.4" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c98a00" text-anchor="middle" font-weight="bold" font-style="normal">1910</text>
<text x="674.4" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кулидж · GE, США</text>
<text x="674.4" y="131.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ПЛАСТИЧНИЙ вольфрам →</text>
<text x="674.4" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">сучасна лампа</text>
<rect x="60.0" y="334.0" width="700.0" height="32.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="410.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Едісонів геній — не сама нитка, а ціла СИСТЕМА під неї; вольфрам же став практичним аж у Кулиджа.</text>
</svg>
