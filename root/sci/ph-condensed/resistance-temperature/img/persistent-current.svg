<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430">
<rect width="820" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Вічний струм: коли R = 0, коло не потребує батареї</text>
<text x="410.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у надпровідному кільці пущений струм тече роками сам — гасити його нема чому</text>
<line x1="410.0" y1="84.0" x2="410.0" y2="366.0" stroke="#e4e4e4" stroke-width="1.4" stroke-dasharray="4,5" stroke-linecap="round"/>
<circle cx="235.0" cy="240.0" r="78.0" fill="none" stroke="#1b1b1b" stroke-width="5"/>
<path d="M 290.2 184.8 A 78.0 78.0 0 1 1 164.3 207.0" fill="none" stroke="#c0271e" stroke-width="3.2" marker-end="url(#aRed)"/>
<line x1="213.0" y1="160.0" x2="257.0" y2="160.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
<line x1="223.0" y1="170.0" x2="247.0" y2="170.0" stroke="#1b1b1b" stroke-width="4.2" stroke-linecap="round"/>
<line x1="321.0" y1="136.0" x2="261.0" y2="162.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<text x="327.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">потрібне джерело</text>
<path d="M 223.0,358 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#e08030" stroke-width="1.8"/>
<path d="M 235.0,358 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#e08030" stroke-width="1.8"/>
<path d="M 247.0,358 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#e08030" stroke-width="1.8"/>
<text x="235.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">тепло I²R — струм гасне</text>
<text x="235.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">R &gt; 0</text>
<text x="235.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Звичайне кільце: струм живе лише поки живить джерело;</text>
<text x="235.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">опір з’їдає енергію теплом.</text>
<circle cx="585.0" cy="240.0" r="78.0" fill="none" stroke="#1f8a3b" stroke-width="5"/>
<path d="M 640.2 184.8 A 78.0 78.0 0 1 1 540.3 176.1" fill="none" stroke="#1f8a3b" stroke-width="3.4" marker-end="url(#aGreen)"/>
<path d="M 529.8 295.2 A 78.0 78.0 0 1 1 655.7 273.0" fill="none" stroke="#1f8a3b" stroke-width="3.4" marker-end="url(#aGreen)"/>
<line x1="573.0" y1="162.0" x2="597.0" y2="162.0" stroke="#1f47b5" stroke-width="2" stroke-linecap="round"/>
<line x1="579.0" y1="151.6" x2="591.0" y2="172.4" stroke="#1f47b5" stroke-width="2" stroke-linecap="round"/>
<line x1="591.0" y1="151.6" x2="579.0" y2="172.4" stroke="#1f47b5" stroke-width="2" stroke-linecap="round"/>
<text x="585.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">≈ 4.2 К (рідкий гелій)</text>
<text x="585.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">R = 0</text>
<text x="585.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="italic">Надпровідне кільце: пущений струм тече роками сам —</text>
<text x="585.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="italic">немає опору, отже немає чому його гасити.</text>
</svg>
