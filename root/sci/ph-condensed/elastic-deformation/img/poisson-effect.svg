<rect x="144.3" y="307.2" width="511.3" height="55.6" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="400.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Коефіцієнт Пуассона ν = - ε_поперечна / ε_поздовжня</tspan><tspan x="400.0" dy="14.3">ε_поздовжня = ΔL / L₀ &gt; 0,   ε_поперечна = -Δd / d₀ &lt; 0</tspan><tspan x="400.0" dy="14.3">Для більшості металів: ν ≈ 0.25 ... 0.35 | Нестисливий матеріал (гума): ν = 0.5</tspan></text>
