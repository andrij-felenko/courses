<text x="350.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• довжини L — довше → більше зіткнень → R↑</text>
