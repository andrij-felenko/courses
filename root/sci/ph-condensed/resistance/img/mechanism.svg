<rect x="150.0" y="250.0" width="520.0" height="64.0" rx="10" fill="#eef7f0" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="410.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Повну формулу R = ρ·L/A складемо у §3.3.</text>
<text x="410.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тут головне: опір — це кількісна міра того механізму зіткнень, що ми бачили в §2.9.</text>
