<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360">
<rect width="820" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві цеглини Розділу 3: Ом і Джоуль</text>
<text x="410.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">закон струму (Ом) і закон тепла (Джоуль) разом дають потужність і нагрів кіл</text>
<rect x="60.0" y="110.0" width="280.0" height="110.0" rx="12" fill="#f4f7f4" stroke="#1b1b1b" stroke-width="2"/>
<text x="200.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ОМ (1827)</text>
<text x="200.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">I = V / R</text>
<text x="200.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">закон струму (відкинули — Гл.2)</text>
<rect x="480.0" y="110.0" width="280.0" height="110.0" rx="12" fill="#fff3e8" stroke="#e08030" stroke-width="2"/>
<text x="620.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">ДЖОУЛЬ (1841)</text>
<text x="620.0" y="172.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">тепло ∝ I²·R·t</text>
<text x="620.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">струм у опорі → тепло</text>
<line x1="340.0" y1="165.0" x2="478.0" y2="165.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="410.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">+</text>
<rect x="220.0" y="260.0" width="380.0" height="70.0" rx="12" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2"/>
<text x="410.0" y="288.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">= потужність P = V·I  і  джоулеве тепло</text>
<text x="410.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">усе, що рахуватимемо в Розділі 3</text>
<line x1="200.0" y1="222.0" x2="360.0" y2="258.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="620.0" y1="222.0" x2="460.0" y2="258.0" stroke="#e08030" stroke-width="2" marker-end="url(#aOrange)"/>
</svg>
