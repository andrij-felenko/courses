<text x="400.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Так народилося збереження енергії — і одиниця джоуль.</text>
