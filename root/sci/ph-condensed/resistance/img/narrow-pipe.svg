<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340">
<rect width="820" height="340" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Опір — як вузьке місце в трубі</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">вузька труба гальмує потік: щоб прогнати ту саму воду, потрібен більший тиск</text>
<line x1="410.0" y1="78.0" x2="410.0" y2="314.0" stroke="#e4e4e4" stroke-width="1.5" stroke-linecap="round"/>
<text x="205.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">широка (малий опір)</text>
<rect x="90.0" y="150.0" width="230.0" height="50.0" rx="4" fill="#dceaf2" stroke="#5b87a6" stroke-width="2"/>
<line x1="112.0" y1="175.0" x2="152.0" y2="175.0" stroke="#2b7" stroke-width="2.6" marker-end="url(#aInk)"/>
<line x1="182.0" y1="175.0" x2="222.0" y2="175.0" stroke="#2b7" stroke-width="2.6" marker-end="url(#aInk)"/>
<line x1="252.0" y1="175.0" x2="292.0" y2="175.0" stroke="#2b7" stroke-width="2.6" marker-end="url(#aInk)"/>
<text x="205.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">легкий потік (струм)</text>
<text x="615.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">вузька (великий опір)</text>
<rect x="500.0" y="150.0" width="80.0" height="50.0" rx="4" fill="#dceaf2" stroke="#5b87a6" stroke-width="2"/>
<path d="M 580,150 L 620,168 L 700,168 L 740,150" fill="none" stroke="#5b87a6" stroke-width="2.4"/>
<path d="M 580,200 L 620,182 L 700,182 L 740,200" fill="none" stroke="#5b87a6" stroke-width="2.4"/>
<line x1="540.0" y1="175.0" x2="575.0" y2="175.0" stroke="#2b7" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="645.0" y1="175.0" x2="670.0" y2="175.0" stroke="#2b7" stroke-width="1.6" marker-end="url(#aInk)"/>
<text x="615.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">той самий потік — лише з більшим тиском</text>
<rect x="150.0" y="270.0" width="520.0" height="44.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="410.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">тиск ↔ напруга · потік ↔ струм · вузькість ↔ опір</text>
<text x="410.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(чим вужче — тим більший опір — тим більше тиску треба на той самий потік)</text>
</svg>
