<line x1="260.0" y1="150.0" x2="310.0" y2="150.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<text x="200.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(або прямокутник)</text>
<text x="610.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">реальний резистор</text>
<line x1="470.0" y1="150.0" x2="520.0" y2="150.0" stroke="#999" stroke-width="3" stroke-linecap="round"/>
