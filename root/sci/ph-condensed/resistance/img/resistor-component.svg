<rect x="120.0" y="230.0" width="580.0" height="80.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="410.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Навіщо навмисний опір:</text>
<text x="410.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">• обмежити струм (резистор до світлодіода)   • задати напругу (дільник, далі)</text>
<text x="410.0" y="298.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">• перетворити струм на тепло (нагрівачі)   • «підтягнути» вхід (pull-up, далі)</text>
</svg>
