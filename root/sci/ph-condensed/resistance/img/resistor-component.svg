<rect x="565.0" y="132.0" width="8.0" height="36.0" rx="0" fill="#c0271e" stroke="none" stroke-width="0"/>
<rect x="585.0" y="132.0" width="8.0" height="36.0" rx="0" fill="#e08030" stroke="none" stroke-width="0"/>
<rect x="640.0" y="132.0" width="8.0" height="36.0" rx="0" fill="#caa23a" stroke="none" stroke-width="0"/>
