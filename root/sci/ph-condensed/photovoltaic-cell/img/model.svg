<rect x="70.0" y="336.0" width="760.0" height="32.0" rx="9" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Модель: джерело струму (тим більше, чим яскравіше світло й більша площа) паралельно з діодом (самим переходом).</text>
<text x="450.0" y="369.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Напруга одного кремнієвого елемента ~0.5–0.6 В і майже не залежить від розміру — її задає хімія переходу. Площа задає СТРУМ.</text>
