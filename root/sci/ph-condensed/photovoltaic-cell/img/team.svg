<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Кремнієвий елемент 1954: троє ролей — один винахід</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">приклад того, що складна техніка майже завжди народжується командою, а не «генієм-одинаком»</text>
<rect x="50.0" y="80.0" width="220.0" height="200.0" rx="12" fill="#ffffff" stroke="#1f47b5" stroke-width="2"/>
<text x="160.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Дерил Чапін</text>
<text x="160.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">інженер</text>
<line x1="70.0" y1="138.0" x2="250.0" y2="138.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="160.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ШУКАВ ЖИВЛЕННЯ для телефонії</text>
<text x="160.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">в глухих вологих місцях, де</text>
<text x="160.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">сідали сухі батареї → сонце</text>
<line x1="160.0" y1="280.0" x2="470.0" y2="320.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aInk)"/>
<rect x="360.0" y="80.0" width="220.0" height="200.0" rx="12" fill="#ffffff" stroke="#1f8a3b" stroke-width="2"/>
<text x="470.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Келвін Фуллер</text>
<text x="470.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">хімік</text>
<line x1="380.0" y1="138.0" x2="560.0" y2="138.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="470.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ЛЕГУВАВ КРЕМНІЙ</text>
<text x="470.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">дифузією — зробив сам p-n</text>
<text x="470.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">перехід, «серце» елемента</text>
<line x1="470.0" y1="280.0" x2="470.0" y2="320.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aInk)"/>
<rect x="670.0" y="80.0" width="220.0" height="200.0" rx="12" fill="#ffffff" stroke="#caa24a" stroke-width="2"/>
<text x="780.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#caa24a" text-anchor="middle" font-weight="bold" font-style="normal">Джеральд Пірсон</text>
<text x="780.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">фізик</text>
<line x1="690.0" y1="138.0" x2="870.0" y2="138.0" stroke="#e4e4e4" stroke-width="1" stroke-linecap="round"/>
<text x="780.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ФІЗИКА Й ВИМІРИ</text>
<text x="780.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">переходу, без яких годі було</text>
<text x="780.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">довести й виміряти ефект</text>
<line x1="780.0" y1="280.0" x2="470.0" y2="320.0" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#aInk)"/>
<rect x="330.0" y="320.0" width="280.0" height="50.0" rx="12" fill="#eef8ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="470.0" y="342.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">кремнієвий сонячний елемент</text>
<text x="470.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">~6% ККД — перший практичний (1954)</text>
</svg>
