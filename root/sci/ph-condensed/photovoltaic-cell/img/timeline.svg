<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700">
<rect width="940" height="700" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="40.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Сонячний елемент: довга колективна історія</text>
<text x="470.0" y="62.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ефект, прилад, теорія й практичний кремній — це різні люди, країни й століття</text>
<line x1="250.0" y1="96.0" x2="250.0" y2="630.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="250.0" cy="124.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.4"/>
<text x="228.0" y="129.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1839</text>
<text x="274.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Едмон Беккерель (Франція)</text>
<text x="274.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">відкрив фотовольтаїчний ефект: світло на електроді народжує струм</text>
<circle cx="250.0" cy="243.5" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.4"/>
<text x="228.0" y="248.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1883</text>
<text x="274.0" y="239.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Чарлз Фріттс (США)</text>
<text x="274.0" y="259.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">перший твердотільний фотоелемент (селен) — лише ~1% ККД, для живлення замало</text>
<circle cx="250.0" cy="363.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.4"/>
<text x="228.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1905</text>
<text x="274.0" y="359.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Альберт Айнштайн (Німеччина)</text>
<text x="274.0" y="379.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">пояснив фотоефект квантом світла — теоретичний фундамент усієї фотоелектрики</text>
<circle cx="250.0" cy="482.5" r="10.0" fill="#fff" stroke="#1f8a3b" stroke-width="3.2"/>
<circle cx="250.0" cy="482.5" r="4.5" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="228.0" y="487.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1954</text>
<text x="274.0" y="478.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Bell Labs (США): Чапін · Фуллер · Пірсон</text>
<text x="274.0" y="498.5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">кремнієвий елемент ~6% — перший ПРАКТИЧНИЙ; інженер + хімік + фізик разом</text>
<circle cx="250.0" cy="602.0" r="10.0" fill="#fff" stroke="#1f47b5" stroke-width="3.2"/>
<circle cx="250.0" cy="602.0" r="4.5" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="228.0" y="607.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1958</text>
<text x="274.0" y="598.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Vanguard I (США)</text>
<text x="274.0" y="618.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">перший супутник на сонячному живленні: сонячний передавач прожив 6+ років</text>
<text x="470.0" y="670.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Жодного «винахідника сонячної батареї»: ефект — Беккереля, перший прилад — Фріттса, теорія — Айнштайна,</text>
<text x="470.0" y="688.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="italic">а практичний кремнієвий елемент — спільна робота ТРЬОХ людей у Bell Labs, що стала на плечі всіх попередників.</text>
</svg>
