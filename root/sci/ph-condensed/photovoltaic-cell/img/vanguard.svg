<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Vanguard I (1958): чому сонце змінило космос</text>
<text x="470.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">перший супутник із сонячними елементами — і наочний урок про джерела живлення</text>
<circle cx="120.0" cy="150.0" r="26.0" fill="#fdf3d0" stroke="#caa24a" stroke-width="2"/>
<line x1="151.2" y1="150.0" x2="164.2" y2="150.0" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="142.1" y1="172.1" x2="151.3" y2="181.3" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="120.0" y1="181.2" x2="120.0" y2="194.2" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="97.9" y1="172.1" x2="88.7" y2="181.3" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="88.8" y1="150.0" x2="75.8" y2="150.0" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="97.9" y1="127.9" x2="88.7" y2="118.7" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="120.0" y1="118.8" x2="120.0" y2="105.8" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<line x1="142.1" y1="127.9" x2="151.3" y2="118.7" stroke="#caa24a" stroke-width="2" stroke-linecap="round"/>
<rect x="330.0" y="90.0" width="540.0" height="110.0" rx="12" fill="#fbe9e7" stroke="#c0271e" stroke-width="1.8"/>
<text x="360.0" y="116.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Батарейний передавач</text>
<text x="360.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">ртутна батарея → замовк за ДНІ (тижні)</text>
<text x="360.0" y="164.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">запас енергії скінченний — місія коротка</text>
<text x="360.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">✗ так живили перші супутники</text>
<rect x="330.0" y="220.0" width="540.0" height="120.0" rx="12" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="360.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Сонячний передавач</text>
<text x="360.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">6 кремнієвих елементів → працював 6+ РОКІВ</text>
<text x="360.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">сонце поповнює енергію — місія довга</text>
<text x="360.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">✓ відтоді сонце — штатне джерело супутників</text>
<line x1="150.0" y1="150.0" x2="326.0" y2="130.0" stroke="#caa24a" stroke-width="1.6" marker-end="url(#aInk)"/>
<line x1="150.0" y1="160.0" x2="326.0" y2="270.0" stroke="#caa24a" stroke-width="1.6" marker-end="url(#aInk)"/>
<rect x="70.0" y="360.0" width="800.0" height="28.0" rx="8" fill="#eef8ef" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="470.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Vanguard I був 4-м супутником (після двох «Супутників» і Explorer 1), але ПЕРШИМ на сонячному живленні. Він і досі —</text>
<text x="470.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">найстаріший рукотворний об'єкт на орбіті. Урок простий: батарея дає днів, сонце — роки; це й вирішило долю космічної енергетики.</text>
</svg>
