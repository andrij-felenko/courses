<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
<rect width="940" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="470.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому навіть ідеальний елемент не на 100%: заборонена зона</text>
<line x1="120.0" y1="240.0" x2="820.0" y2="240.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="124.0" y="258.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">поріг поглинання (заборонена зона Si ≈ 1.1 еВ)</text>
<text x="230.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ІЧ: мало енергії</text>
<circle cx="230.0" cy="134.0" r="16.0" fill="#fff" stroke="#1f47b5" stroke-width="2.2"/>
<text x="230.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">hν</text>
<line x1="230.0" y1="152.0" x2="230.0" y2="300.0" stroke="#1f47b5" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#aInk)"/>
<text x="230.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#1f47b5" text-anchor="middle" font-weight="normal" font-style="normal">наскрізь, не вловлено</text>
<text x="470.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">якраз над порогом</text>
<circle cx="470.0" cy="134.0" r="16.0" fill="#fff" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="470.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">hν</text>
<line x1="470.0" y1="152.0" x2="470.0" y2="236.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<text x="470.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">✓ уся — у струм</text>
<text x="710.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">синій / УФ: забагато</text>
<circle cx="710.0" cy="134.0" r="16.0" fill="#fff" stroke="#c0271e" stroke-width="2.2"/>
<text x="710.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">hν</text>
<line x1="710.0" y1="152.0" x2="710.0" y2="236.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<text x="710.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">частина → струм,</text>
<text x="710.0" y="314.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">надлишок → тепло</text>
<rect x="70.0" y="342.0" width="800.0" height="46.0" rx="9" fill="#fbf7ec" stroke="#caa24a" stroke-width="1.4"/>
<text x="470.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Кремній бере лише фотони ПОНАД свій поріг (~1.1 еВ). Менш енергійні (інфрачервоні) проходять наскрізь намарно, а в надто</text>
<text x="470.0" y="375.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">енергійних (синіх, УФ) надлишок енергії губиться теплом. Через цю невідповідність спектру навіть ідеальний кремній перетворює</text>
<text x="470.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.2" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">лише частину сонця — звідси і скромні ~6% піонерів, і «стеля» сучасних елементів далеко не в 100%.</text>
</svg>
