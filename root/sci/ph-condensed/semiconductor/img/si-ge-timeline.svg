  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Перегони матеріалів: германій стартував, кремній переміг</text>
<text x="94.0" y="78.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1947 · Bell Labs</text>
<rect x="16.0" y="86.0" width="156.0" height="110.0" rx="8" fill="#e9eefb" stroke="#c9d3dc" stroke-width="1.6"/>
<text x="94.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">перший транзистор</text>
<text x="94.0" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">— ГЕРМАНІЙ</text>
<text x="94.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(Бардін, Браттейн)</text>
<line x1="174.0" y1="141.0" x2="188.0" y2="141.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<text x="268.0" y="78.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">поч. 1950-х</text>
<rect x="190.0" y="86.0" width="156.0" height="110.0" rx="8" fill="#fbfbfb" stroke="#c9d3dc" stroke-width="1.6"/>
<text x="268.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">германій панує:</text>
<text x="268.0" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">легше очистити,</text>
<text x="268.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">але «тече» й гріється</text>
<line x1="348.0" y1="141.0" x2="362.0" y2="141.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<text x="442.0" y="78.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">січ. 1954 · Bell</text>
<rect x="364.0" y="86.0" width="156.0" height="110.0" rx="8" fill="#fbfbfb" stroke="#c9d3dc" stroke-width="1.6"/>
<text x="442.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Танненбаум:</text>
<text x="442.0" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Si у лабораторії —</text>
<text x="442.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">без продажу</text>
<line x1="522.0" y1="141.0" x2="536.0" y2="141.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<text x="616.0" y="78.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">трав. 1954 · TI</text>
<rect x="538.0" y="86.0" width="156.0" height="110.0" rx="8" fill="#eef6ef" stroke="#9bb0c2" stroke-width="1.6"/>
<text x="616.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Тіл: перший</text>
<text x="616.0" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">КОМЕРЦІЙНИЙ</text>
<text x="616.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">кремнієвий</text>
<line x1="696.0" y1="141.0" x2="710.0" y2="141.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#aGrey)"/>
<text x="790.0" y="78.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1959 · Fairchild</text>
<rect x="712.0" y="86.0" width="156.0" height="110.0" rx="8" fill="#eef6ef" stroke="#9bb0c2" stroke-width="1.6"/>
<text x="790.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">оксид SiO₂ +</text>
<text x="790.0" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">планарний процес</text>
<text x="790.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">→ кремній назавжди</text>
<text x="450.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Той самий PN-перехід — лише матеріал інший; саме матеріал і вирішив, на чому стоятиме вся електроніка.</text>
</svg>
