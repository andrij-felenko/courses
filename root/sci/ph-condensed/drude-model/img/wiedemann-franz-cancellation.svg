<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Випадковий успіх: подвійна компенсація помилок Друде</text>
<text x="420.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Чому класична модель Друде збіглася з експериментом у законі Відемана — Франца</text>
<rect x="81.7" y="83.0" width="256.6" height="114.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.8"/><text x="210.0" y="105.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Помилка №1: Теплоємність c_v</tspan><tspan x="210.0" dy="15.6"></tspan><tspan x="210.0" dy="15.6">Класичний газ (Максвелл-Больцман):</tspan><tspan x="210.0" dy="15.6">c_v = (3/2) · n · k_B</tspan><tspan x="210.0" dy="15.6"></tspan><tspan x="210.0" dy="15.6">ЗАВИЩЕНО у ~100 разів!</tspan></text>
<rect x="508.6" y="83.0" width="242.9" height="114.0" rx="6" fill="#d4e6f1" stroke="#2457d6" stroke-width="1.8"/><text x="630.0" y="105.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Помилка №2: Квадрат швидкості v²</tspan><tspan x="630.0" dy="15.6"></tspan><tspan x="630.0" dy="15.6">Класична теплова швидкість:</tspan><tspan x="630.0" dy="15.6">v_th² = 3 · k_B · T / m</tspan><tspan x="630.0" dy="15.6"></tspan><tspan x="630.0" dy="15.6">ЗАНИЖЕНО у ~100 разів!</tspan></text>
<line x1="340.0" y1="140.0" x2="410.0" y2="140.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="500.0" y1="140.0" x2="430.0" y2="140.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="208.5" y="207.6" width="422.9" height="74.8" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="2.0"/><text x="420.0" y="232.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Теплопровідність kappa = (1/3) · c_v · v² · tau</tspan><tspan x="420.0" dy="16.9"></tspan><tspan x="420.0" dy="16.9">Добуток: (100) × (1/100) = 1 (Повна компенсація!)</tspan></text>
<rect x="137.8" y="321.4" width="564.4" height="67.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="343.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Число Лоренца L = kappa / (sigma · T):</tspan><tspan x="420.0" dy="15.6">• Модель Друде: L = (3/2) · (k_B / e)² ≈ 2.23 × 10⁻⁸ Вт·Ом/К²</tspan><tspan x="420.0" dy="15.6">• Квантова модель Зоммерфельда: L = (pi²/3) · (k_B / e)² ≈ 2.44 × 10⁻⁸ Вт·Ом/К²</tspan></text>
</svg>