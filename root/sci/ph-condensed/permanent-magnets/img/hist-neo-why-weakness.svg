</defs>
<text x="460.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому неодим переміг — і де його слабке місце</text>
<text x="460.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Рекордна сила з дешевих елементів; розплата — найгірша теплова стійкість серед сильних магнітів</text>
<rect x="36.0" y="72.0" width="410.0" height="210.0" rx="12" fill="#f7f7f7" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="241.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Заміна рідкісного на рясне</text>
<text x="140.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">БУЛО: SmCo</text>
<circle cx="110.0" cy="158.0" r="22.0" fill="#fdecea" stroke="#c0271e" stroke-width="2"/>
<text x="110.0" y="163.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Sm</text>
<text x="110.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">самарій —</text>
<text x="110.0" y="209.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">рідкісний</text>
<circle cx="172.0" cy="158.0" r="22.0" fill="#fdecea" stroke="#c0271e" stroke-width="2"/>
<text x="172.0" y="163.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Co</text>
