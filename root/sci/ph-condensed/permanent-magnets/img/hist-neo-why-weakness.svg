<line x1="526.0" y1="250.0" x2="852.0" y2="250.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="679.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Nd-Fe-B тримає найбільше поля в найменшому об'ємі —</text>
<text x="679.0" y="301.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">звідси крихітні навушники, жорсткі диски й мотори дронів</text>
<rect x="36.0" y="312.0" width="848.0" height="188.0" rx="12" fill="#fdecea" stroke="#c0271e" stroke-width="1.6"/>
<text x="460.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Слабке місце: тепло. Найнижча температура Кюрі серед сильних магнітів</text>
<line x1="110.0" y1="404.0" x2="800.0" y2="404.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<line x1="800.0" y1="404.0" x2="812.0" y2="404.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
