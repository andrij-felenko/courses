<text x="312.0" y="209.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">доступніший</text>
<circle cx="374.0" cy="158.0" r="22.0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2"/>
<text x="374.0" y="163.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Fe</text>
<text x="374.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">залізо —</text>
<text x="374.0" y="209.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">найрясніше</text>
<circle cx="415.0" cy="134.0" r="13.0" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="415.0" y="139.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">B</text>
<text x="241.0" y="240.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">бор (B) — лише ~1% за масою,</text>
<text x="241.0" y="256.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">але без нього потрібна фаза не утворюється</text>
<text x="241.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">→ та сама сила за меншу ціну</text>
<rect x="474.0" y="72.0" width="410.0" height="210.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="679.0" y="96.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Запас енергії (BH)max — груба шкала</text>
