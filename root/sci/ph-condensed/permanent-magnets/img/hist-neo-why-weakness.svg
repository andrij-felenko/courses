<line x1="110.0" y1="399.0" x2="110.0" y2="409.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="110.0" y="424.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">0</text>
<line x1="272.4" y1="399.0" x2="272.4" y2="409.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="272.4" y="424.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">200</text>
<line x1="361.6" y1="399.0" x2="361.6" y2="409.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="361.6" y="424.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">310</text>
<line x1="434.7" y1="399.0" x2="434.7" y2="409.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="434.7" y="424.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">400</text>
<line x1="597.1" y1="399.0" x2="597.1" y2="409.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="597.1" y="424.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">600</text>
<line x1="759.4" y1="399.0" x2="759.4" y2="409.0" stroke="#1b1b1b" stroke-width="1.4" stroke-linecap="round"/>
<text x="759.4" y="424.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">800</text>
<line x1="361.6" y1="404.0" x2="361.6" y2="358.0" stroke="#c0271e" stroke-width="2" stroke-linecap="round"/>
<circle cx="361.6" cy="358.0" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="361.6" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Nd-Fe-B ≈ 310 °C</text>
<line x1="759.4" y1="404.0" x2="759.4" y2="334.0" stroke="#e08030" stroke-width="2" stroke-linecap="round"/>
<circle cx="759.4" cy="334.0" r="5.0" fill="#e08030" stroke="#e08030" stroke-width="1"/>
<text x="759.4" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">SmCo ≈ 800 °C</text>
<text x="460.0" y="468.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Вище точки Кюрі феромагнетизм зникає (з §1.8.2); та Nd-Fe-B помітно слабшає вже на сотні °C нижче.</text>
<text x="460.0" y="486.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Тому в гарячих моторах беруть або SmCo, або Nd-Fe-B із домішкою диспрозію (Dy) — про класи й межі див. §1.8.3.</text>
