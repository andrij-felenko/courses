<text x="360.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">СТАЛО: Nd-Fe-B</text>
