<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540">
<rect width="920" height="540" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3ea8"/></marker>
</defs>
<text x="460.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Одне відкриття, дві лабораторії, жодного списування</text>
<text x="460.0" y="51.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Японія і США незалежно дійшли до тієї самої сполуки Nd₂Fe₁₄B і зустрілися на конференції в Піттсбурзі, 1983</text>
<rect x="225.0" y="70.0" width="470.0" height="52.0" rx="10" fill="#fff7e6" stroke="#e08030" stroke-width="1.6"/>
<text x="460.0" y="90.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">СПІЛЬНА ПРОБЛЕМА (кінець 1970-х)</text>
<text x="460.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">найкращий магніт — самарій-кобальт (SmCo): сильний, але самарій і кобальт дорогі й дефіцитні</text>
<rect x="40.0" y="150.0" width="390.0" height="250.0" rx="12" fill="#eef2fb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="235.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ЯПОНІЯ · Sumitomo Special Metals</text>
<text x="235.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Масато Сагава (Masato Sagawa)</text>
<text x="235.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ідея: «замінити дорогі Sm і Co</text>
<text x="235.0" y="237.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">на дешеве й рясне залізо Fe»</text>
<text x="235.0" y="261.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ключ: додати трохи бору (B ≈ 1%)</text>
<text x="235.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">→ нова стабільна тверда фаза</text>
<rect x="70.0" y="296.0" width="330.0" height="56.0" rx="9" fill="#ffffff" stroke="#1f47b5" stroke-width="1.5"/>
<text x="235.0" y="315.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">МЕТОД: спікання (sintering)</text>
<text x="235.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">порошок → пресування → випал у вакуумі</text>
<text x="235.0" y="347.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(шлях від магнітів SmCo)</text>
<text x="235.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">дає щільні монолітні магніти —</text>
<text x="235.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">найсильніші у світі</text>
<rect x="490.0" y="150.0" width="390.0" height="250.0" rx="12" fill="#fdecea" stroke="#c0271e" stroke-width="1.8"/>
<text x="685.0" y="176.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">США · General Motors (дослідні лаб.)</text>
<text x="685.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Джон Кроут (John J. Croat)</text>
<text x="685.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">ідея: метастабільні фази зі</text>
<text x="685.0" y="237.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">швидко загартованих сплавів Nd–Fe</text>
<text x="685.0" y="261.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ключ: той самий бор (B)</text>
<text x="685.0" y="278.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">→ та сама фаза Nd₂Fe₁₄B</text>
<rect x="520.0" y="296.0" width="330.0" height="56.0" rx="9" fill="#ffffff" stroke="#c0271e" stroke-width="1.5"/>
<text x="685.0" y="315.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">МЕТОД: гартування з розплаву</text>
<text x="685.0" y="332.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">струмінь розплаву на швидкий диск</text>
<text x="685.0" y="347.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(melt spinning) → тонка стрічка</text>
<text x="685.0" y="374.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">дає порошок для зв'язаних</text>
<text x="685.0" y="390.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">(bonded) магнітів складної форми</text>
<line x1="370.0" y1="122.0" x2="305.0" y2="150.0" stroke="#e08030" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#aOrange)"/>
<line x1="550.0" y1="122.0" x2="615.0" y2="150.0" stroke="#e08030" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#aOrange)"/>
<line x1="235.0" y1="400.0" x2="390.0" y2="446.0" stroke="#1f47b5" stroke-width="2.4" marker-end="url(#aBlue)"/>
<line x1="685.0" y1="400.0" x2="530.0" y2="446.0" stroke="#c0271e" stroke-width="2.4" marker-end="url(#aRed)"/>
<rect x="260.0" y="446.0" width="400.0" height="70.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2.0"/>
<text x="460.0" y="470.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ОДНА Й ТА САМА СПОЛУКА:  Nd₂Fe₁₄B</text>
<text x="460.0" y="491.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тетрагональна кристалічна ґратка; структуру визначили обидві групи 1984 року</text>
<text x="460.0" y="508.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">оголошено разом на конференції MMM, Піттсбург, листопад 1983 — на подив одне одному</text>
</svg>
