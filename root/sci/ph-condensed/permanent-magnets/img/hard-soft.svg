<text x="460.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Постійний магніт — це «тверда» магнітна пам'ять речовини</text>
<text x="460.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тверді матеріали утримують вишикувані домени навіть без поля; м'які — відпускають їх одразу</text>
<line x1="110.0" y1="220.0" x2="370.0" y2="220.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aInk)"/>
<line x1="240.0" y1="315.0" x2="240.0" y2="125.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aInk)"/>
<text x="368.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="italic">H</text>
<text x="256.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="italic">M</text>
<path d="M 120 275 C 170 150, 254.0 142, 360 165 C 310 290, 226.0 298, 120 275 Z" fill="none" stroke="#1f8a3b" stroke-width="2.6"/>
<text x="240.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ТВЕРДИЙ (ферит, неодим)</text>
<text x="240.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">широка петля → лишається намагніченим</text>
<text x="240.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">годиться для постійного магніту</text>
<line x1="550.0" y1="220.0" x2="810.0" y2="220.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aInk)"/>
<line x1="680.0" y1="315.0" x2="680.0" y2="125.0" stroke="#8a8a8a" stroke-width="1.4" marker-end="url(#aInk)"/>
<text x="808.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="italic">H</text>
<text x="696.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="italic">M</text>
<path d="M 560 275 C 672 150, 681.6 142, 800 165 C 688 290, 678.4 298, 560 275 Z" fill="none" stroke="#1f47b5" stroke-width="2.6"/>
<text x="680.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">М'ЯКИЙ (трансформаторне залізо)</text>
<text x="680.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">вузька петля → магнетизм зникає з полем</text>
<text x="680.0" y="354.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">годиться для осердя електромагніту (§1.8.6)</text>
</svg>
