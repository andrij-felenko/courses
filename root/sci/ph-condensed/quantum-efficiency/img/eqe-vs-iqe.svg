<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 740 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="740" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="720.0" height="360.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зв'язок EQE та IQE у фотодетекторі</text>
<rect x="60.0" y="60.0" width="240.0" height="24.0" rx="6" fill="#e1f5fe" stroke="#333333" stroke-width="1.2"/>
<text x="180.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Поверхня / Антивідбивальний шар (R)</text>
<rect x="60.0" y="84.0" width="240.0" height="36.0" rx="6" fill="#ffe0b2" stroke="#333333" stroke-width="1.2"/>
<text x="180.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Пасивний шар (поглинання без збору)</text>
<rect x="60.0" y="120.0" width="240.0" height="120.0" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.8"/>
<text x="180.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Активна зона (генерація e⁻/h⁺)</text>
<text x="180.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Внутрішня ефективність IQE</text>
<rect x="60.0" y="240.0" width="240.0" height="60.0" rx="6" fill="#f5f5f5" stroke="#333333" stroke-width="1.2"/>
<text x="180.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Нижній контакт (збір носіїв)</text>
<line x1="120.0" y1="35.0" x2="120.0" y2="58.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="120.0" y="18.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Падаючі фотони N_γ (100%)</text>
<line x1="120.0" y1="60.0" x2="70.0" y2="35.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="65.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end">Відбиття R</text>
<line x1="240.0" y1="100.0" x2="290.0" y2="100.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="295.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Пасивні втрати (1−ζ)</text>
<line x1="240.0" y1="180.0" x2="290.0" y2="180.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="295.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">Рекомбінація (1−η_coll)</text>
<line x1="120.0" y1="300.0" x2="120.0" y2="335.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="120.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Зібраний струм N_e (EQE)</text>
<rect x="350.0" y="70.0" width="340.0" height="230.0" rx="8" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/>
<text x="520.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формули співвідношення</text>
<text x="370.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Зовнішня квантова ефективність (EQE):</text>
<text x="385.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">EQE = N_e / N_γ</text>
<text x="370.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Внутрішня квантова ефективність (IQE):</text>
<text x="385.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">IQE = N_e / N_abs</text>
<text x="370.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Повний розклад втрат:</text>
<text x="385.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">EQE = (1 − R) · ζ · IQE</text>
<text x="360.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">EQE враховує оптичні та рекомбінаційні втрати; IQE показує ефективність поглинутої частки світла</text>
</svg>