<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 690 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="690" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="340.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема адитивності швидкостей розсіяння електронів</text>
<rect x="40.0" y="70.0" width="270.0" height="160.0" rx="8" fill="#ebf5fb" stroke="#27ae60" stroke-width="2.0"/>
<text x="175.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">1. Статичні дефекти (домішки)</text>
<text x="55.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Точкові домішки, вакансії</text>
<text x="55.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Пружне розсіяння (без зміни Е)</text>
<text x="55.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Не залежить від температури</text>
<text x="175.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Швидкість розсіяння: 1 / τ_imp</text>
<rect x="370.0" y="70.0" width="270.0" height="160.0" rx="8" fill="#fef9e7" stroke="#c0392b" stroke-width="2.0"/>
<text x="505.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2. Динамічні коливання (фонони)</text>
<text x="385.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Теплові коливання ґратки</text>
<text x="385.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Непружне розсіяння носіїв</text>
<text x="385.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Температурна залежність τ_ph(T)</text>
<text x="505.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Швидкість розсіяння: 1 / τ_ph(T)</text>
<line x1="175.0" y1="230.0" x2="175.0" y2="265.0" stroke="#333333" stroke-width="2.0"/>
<line x1="505.0" y1="230.0" x2="505.0" y2="265.0" stroke="#333333" stroke-width="2.0"/>
<line x1="175.0" y1="265.0" x2="340.0" y2="265.0" stroke="#333333" stroke-width="2.0"/>
<line x1="505.0" y1="265.0" x2="340.0" y2="265.0" stroke="#333333" stroke-width="2.0"/>
<line x1="340.0" y1="265.0" x2="340.0" y2="285.0" stroke="#333333" stroke-width="2.0"/>
<rect x="100.0" y="290.0" width="480.0" height="115.0" rx="8" fill="#f4f6f7" stroke="#333333" stroke-width="2.0"/>
<text x="340.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило Матіссена (адитивність імовірностей)</text>
<text x="340.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">1 / τ = 1 / τ_imp + 1 / τ_ph(T)</text>
<text x="340.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">Питомий опір:  ρ(T) = (m* / n e²) · (1/τ) = ρ₀ + ρ_ph(T)</text>
</svg>