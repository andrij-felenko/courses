<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="400.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Логічний ланцюг трюку Чернова (Moment-Generating Function Method)</text>
<rect x="43.3" y="96.2" width="213.4" height="47.6" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="150.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1. Сума випадкових величин</tspan><tspan x="150.0" dy="15.6">X = ∑ Xᵢ (незалежні)</tspan></text>
<rect x="314.7" y="96.2" width="250.6" height="47.6" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="440.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">2. Монотонне перетворення t &gt; 0</tspan><tspan x="440.0" dy="15.6">Pr[X ≥ a] = Pr[eᵗˣ ≥ eᵗᵃ]</tspan></text>
<rect x="615.8" y="96.2" width="228.3" height="47.6" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="730.0" y="116.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">3. Межа Маркова для eᵗˣ</tspan><tspan x="730.0" dy="15.6">Pr[eᵗˣ ≥ eᵗᵃ] ≤ E[eᵗˣ] / eᵗᵃ</tspan></text>
<rect x="158.5" y="246.2" width="273.0" height="47.6" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="295.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="295.0" dy="0.0">4. Незалежність → добуток моментів</tspan><tspan x="295.0" dy="15.6">E[eᵗˣ] = ∏ E[eᵗˣⁱ] ≤ eᵐ⁽ᵉᵗ⁻¹⁾</tspan></text>
<rect x="478.5" y="246.2" width="273.0" height="47.6" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="615.0" y="266.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">5. Мінімізація за параметром t &gt; 0</tspan><tspan x="615.0" dy="15.6">t* = ln(1 + δ) → exp(-μδ²/3)</tspan></text>
<line x1="260.0" y1="120.0" x2="325.0" y2="120.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="555.0" y1="120.0" x2="620.0" y2="120.0" stroke="#7e22ce" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="730.0" y1="160.0" x2="420.0" y2="230.0" stroke="#e08a1e" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="435.0" y1="270.0" x2="480.0" y2="270.0" stroke="#0d9488" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="140.0" y="345.0" width="600.0" height="45.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="440.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">Результат: Експоненціально гостра межа концентрації навколо E[X]</text>
</svg>