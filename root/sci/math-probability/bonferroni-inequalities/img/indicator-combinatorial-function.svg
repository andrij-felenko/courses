<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Аналіз індикаторної функції f_k(m) = ∑_{r=1}^k (-1)^{r-1} C(m, r)</text>
<rect x="37.2" y="87.0" width="225.6" height="45.9" rx="6" fill="#f5f5f5" stroke="#6b7280" stroke-width="1.5"/><text x="150.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Випадок m = 0</tspan><tspan x="150.0" dy="16.9">(жодна подія не відбулася)</tspan></text>
<rect x="71.6" y="155.0" width="156.8" height="110.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="175.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">C(0, r) = 0  ∀r ≥ 1</tspan><tspan x="150.0" dy="15.6"></tspan><tspan x="150.0" dy="15.6">  f_k(0) = 0</tspan><tspan x="150.0" dy="15.6"></tspan><tspan x="150.0" dy="15.6">Точна рівність 0 = 0</tspan><tspan x="150.0" dy="15.6">(для будь-якого k)</tspan></text>
<rect x="337.2" y="87.0" width="225.6" height="45.9" rx="6" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Випадок m ≥ 1</tspan><tspan x="450.0" dy="16.9">(k = 1, 3, 5... - непарне)</tspan></text>
<rect x="347.7" y="155.0" width="204.7" height="110.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="175.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">f_k(m) = 1 + C(m-1, k)</tspan><tspan x="450.0" dy="15.6"></tspan><tspan x="450.0" dy="15.6">Оскільки C(m-1, k) ≥ 0:</tspan><tspan x="450.0" dy="15.6">  f_k(m) ≥ 1</tspan><tspan x="450.0" dy="15.6"></tspan><tspan x="450.0" dy="15.6">Верхня оцінка для I(⋃ Aᵢ)=1</tspan></text>
<rect x="605.3" y="87.0" width="209.4" height="45.9" rx="6" fill="#e8eaf6" stroke="#2457d6" stroke-width="1.5"/><text x="710.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Випадок m ≥ 1</tspan><tspan x="710.0" dy="16.9">(k = 2, 4, 6... - парне)</tspan></text>
<rect x="611.1" y="155.0" width="197.8" height="110.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="710.0" y="175.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">f_k(m) = 1 - C(m-1, k)</tspan><tspan x="710.0" dy="15.6"></tspan><tspan x="710.0" dy="15.6">Оскільки C(m-1, k) ≥ 0:</tspan><tspan x="710.0" dy="15.6">  f_k(m) ≤ 1</tspan><tspan x="710.0" dy="15.6"></tspan><tspan x="710.0" dy="15.6">Нижня оцінка для I(⋃ Aᵢ)=1</tspan></text>
<rect x="45.4" y="340.1" width="729.3" height="49.9" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="361.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Висновок: Математичне сподівання E[f_k(m)] дає P(⋃ Aᵢ) ≤ S₁ - S₂ + ... + S_k (непарні k)</tspan><tspan x="410.0" dy="16.9">та P(⋃ Aᵢ) ≥ S₁ - S₂ + ... - S_k (парні k) для довільних залежних подій.</tspan></text>
</svg>