<text x="440.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Геометрична інтуїція закону Літтла: площа під траєкторією системи</text>
<line x1="80.0" y1="290.0" x2="560.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="80.0" y1="290.0" x2="80.0" y2="50.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="575.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Час t</text>
<text x="80.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кількість N(t)</text>
<text x="80.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
<line x1="520.0" y1="287.0" x2="520.0" y2="293.0" stroke="#333333" stroke-width="1.5"/>
<text x="520.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">T</text>
<rect x="110.0" y="255.0" width="160.0" height="30.0" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="190.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">Заявка 1: W₁</text>
<rect x="160.0" y="220.0" width="200.0" height="30.0" rx="3" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="260.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4f46e5" text-anchor="middle" font-weight="700">Заявка 2: W₂</text>
<rect x="230.0" y="185.0" width="190.0" height="30.0" rx="3" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.2"/>
<text x="325.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7e22ce" text-anchor="middle" font-weight="700">Заявка 3: W₃</text>
<rect x="300.0" y="150.0" width="190.0" height="30.0" rx="3" fill="#fef3c7" stroke="#e08a1e" stroke-width="1.2"/>
<text x="395.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e08a1e" text-anchor="middle" font-weight="700">Заявка 4: W₄</text>
<rect x="380.0" y="115.0" width="130.0" height="30.0" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="445.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">Заявка 5: W₅</text>
<path d="M 80 290 L 110 290 L 110 255 L 160 255 L 160 220 L 230 220 L 230 185 L 270 185 L 270 220 L 300 220 L 300 185 L 360 185 L 360 220 L 380 220 L 380 185 L 420 185 L 420 220 L 490 220 L 490 255 L 510 255 L 510 290 L 520 290" fill="none" stroke="#1e293b" stroke-width="2.2"/>
<text x="300.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">Площа під графіком = Інтеграл ∫₀ᵀ N(t) dt = Сума смуг ∑ Wᵢ</text>
<rect x="67.1" y="365.2" width="245.7" height="59.6" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="190.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Вертикальний розріз (миттєвий стан):</tspan><tspan x="190.0" dy="14.3">Середня кількість заявок:</tspan><tspan x="190.0" dy="14.3">L = (1 / T) · ∫₀ᵀ N(t) dt</tspan></text>
<rect x="297.7" y="365.2" width="264.5" height="59.6" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="430.0" y="384.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Горизонтальний розріз (час заявок):</tspan><tspan x="430.0" dy="14.3">Середній час перебування однієї заявки:</tspan><tspan x="430.0" dy="14.3">W = (1 / A(T)) · ∑ᵢ Wᵢ</tspan></text>
<rect x="590.0" y="55.0" width="265.0" height="380.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="722.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">Алгебраїчна тотожність</text>
<rect x="596.0" y="132.2" width="252.0" height="245.5" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="722.0" y="151.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="722.0" dy="0.0">Загальна площа S(T):</tspan><tspan x="722.0" dy="14.3">S(T) = ∫₀ᵀ N(t) dt ≈ ∑ᵢ₌₁ᴬ⁽ᵀ⁾ Wᵢ</tspan><tspan x="722.0" dy="14.3"></tspan><tspan x="722.0" dy="14.3">Поділимо обидві частини на T:</tspan><tspan x="722.0" dy="14.3">S(T) / T = (1 / T) · ∑ᵢ₌₁ᴬ⁽ᵀ⁾ Wᵢ</tspan><tspan x="722.0" dy="14.3"></tspan><tspan x="722.0" dy="14.3">Помножимо й поділимо на A(T):</tspan><tspan x="722.0" dy="14.3">= [ A(T) / T ] · [ (1 / A(T)) ∑ᵢ Wᵢ ]</tspan><tspan x="722.0" dy="14.3"></tspan><tspan x="722.0" dy="14.3">При T → ∞ за ергодичності:</tspan><tspan x="722.0" dy="14.3">• S(T) / T → L  (середня черга)</tspan><tspan x="722.0" dy="14.3">• A(T) / T → λ  (інтенсивність)</tspan><tspan x="722.0" dy="14.3">• (1/A(T)) ∑ Wᵢ → W (сер. час)</tspan><tspan x="722.0" dy="14.3"></tspan><tspan x="722.0" dy="14.3">Отримуємо фундаментальний зв'язок:</tspan><tspan x="722.0" dy="14.3">            L = λ · W</tspan></text>
</svg>