<text x="330.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Довше вікно гладшає сильніше, та наздоганяє зміну пізніше — за одне платиш іншим.</text>
