<polygon points="645.0,158.0 653.0,162.0 645.0,166.0" fill="#333333" stroke="none" stroke-width="1.0"/>
<rect x="40.0" y="245.0" width="760.0" height="150.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<rect x="40.0" y="245.0" width="760.0" height="28.0" rx="8" fill="#ebfaf0" stroke="#1e824c" stroke-width="1.2"/>
<text x="420.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e824c" text-anchor="middle" font-weight="700">Прискорення Кобліца через τ-NAF (тау-адичний розклад автоморфізму Фробеніуса)</text>
<rect x="40.0" y="290.0" width="140.0" height="85.0" rx="6" fill="#eef4fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="110.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">τ-NAF розклад</text>
<text x="110.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">k = ∑ uᵢ·τⁱ, uᵢ ∈ {0, ±1}</tspan><tspan x="110.0" dy="10.8">Щільність ненульових: 1/3</tspan></text>
<rect x="240.0" y="290.0" width="140.0" height="85.0" rx="6" fill="#ebfaf0" stroke="#1e824c" stroke-width="1.2"/>
<text x="310.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e824c" text-anchor="middle" font-weight="700">Фробеніус τ(Q)</text>
<text x="310.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">τ(x, y) = (x², y²)</tspan><tspan x="310.0" dy="10.8">У норм. базисі: 0–1 такт CPU!</tspan></text>
<rect x="460.0" y="290.0" width="140.0" height="85.0" rx="6" fill="#fef5e7" stroke="#d35400" stroke-width="1.2"/>
<text x="530.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">Додавання / віднімання</text>
<text x="530.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Q = Q ± P (якщо uᵢ = ±1)</tspan><tspan x="530.0" dy="10.8">Усього m/3 операцій</tspan></text>
<rect x="650.0" y="290.0" width="140.0" height="85.0" rx="6" fill="#f5eeff" stroke="#7d3c98" stroke-width="1.2"/>
<text x="720.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d3c98" text-anchor="middle" font-weight="700">Результат k·P</text>
<text x="720.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">0 подвоєнь точок!</tspan><tspan x="720.0" dy="10.8">Прискорення у 3–5 разів</tspan></text>
