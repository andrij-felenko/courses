<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Мрія першокурсника» та зникнення проміжних біноміальних коефіцієнтів</text>
<text x="420.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">У характеристиці p = 5 усі коефіцієнти C(5, k) для 1 ≤ k ≤ 4 діляться на 5 і перетворюються на 0</text>
<rect x="40.0" y="75.0" width="360.0" height="315.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<rect x="40.0" y="75.0" width="360.0" height="32.0" rx="8" fill="#eef4fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="220.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Розклад у звичайній алгебрі (над ℤ або ℝ)</text>
<text x="60.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">(a + b)⁵ = C(5,0)·a⁵ + C(5,1)·a⁴b + C(5,2)·a³b²</text>
<text x="125.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">+ C(5,3)·a²b³ + C(5,4)·ab⁴ + C(5,5)·b⁵</text>
<rect x="55.0" y="181.0" width="95.0" height="22.0" rx="4" fill="#ebfaf0" stroke="#1e824c" stroke-width="1.0"/>
<text x="102.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e824c" text-anchor="middle" font-weight="700">C(5, 0) = 1</text>
<text x="160.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">крайовий член: a⁵</text>
<rect x="55.0" y="209.0" width="95.0" height="22.0" rx="4" fill="#fdeeed" stroke="#c0392b" stroke-width="1.0"/>
<text x="102.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">C(5, 1) = 5</text>
<text x="160.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">містить множник 5 (5 · a⁴b)</text>
<rect x="55.0" y="237.0" width="95.0" height="22.0" rx="4" fill="#fdeeed" stroke="#c0392b" stroke-width="1.0"/>
<text x="102.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">C(5, 2) = 10</text>
<text x="160.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">містить множник 5 (2 · 5 · a³b²)</text>
<rect x="55.0" y="265.0" width="95.0" height="22.0" rx="4" fill="#fdeeed" stroke="#c0392b" stroke-width="1.0"/>
<text x="102.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">C(5, 3) = 10</text>
<text x="160.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">містить множник 5 (2 · 5 · a²b³)</text>
<rect x="55.0" y="293.0" width="95.0" height="22.0" rx="4" fill="#fdeeed" stroke="#c0392b" stroke-width="1.0"/>
<text x="102.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">C(5, 4) = 5</text>
<text x="160.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">містить множник 5 (5 · ab⁴)</text>
<rect x="55.0" y="321.0" width="95.0" height="22.0" rx="4" fill="#ebfaf0" stroke="#1e824c" stroke-width="1.0"/>
<text x="102.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e824c" text-anchor="middle" font-weight="700">C(5, 5) = 1</text>
<text x="160.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">крайовий член: b⁵</text>
<text x="220.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Кожен внутрішній коефіцієнт: 5 | C(5, k)</text>
<line x1="415.0" y1="230.0" x2="445.0" y2="230.0" stroke="#333333" stroke-width="2.0"/>
<polygon points="445.0,224.0 457.0,230.0 445.0,236.0" fill="#333333" stroke="none" stroke-width="1.0"/>
<text x="435.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d3c98" text-anchor="middle" font-weight="700">mod 5</text>
<rect x="470.0" y="75.0" width="330.0" height="315.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<rect x="470.0" y="75.0" width="330.0" height="32.0" rx="8" fill="#ebfaf0" stroke="#1e824c" stroke-width="1.2"/>
<text x="635.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e824c" text-anchor="middle" font-weight="700">Дія у полі характеристики p = 5 (GF(5ⁿ))</text>
<text x="490.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">(a + b)⁵ ≡ 1·a⁵ + 0·a⁴b + 0·a³b²</text>
<text x="565.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">+ 0·a²b³ + 0·ab⁴ + 1·b⁵ (mod 5)</text>
<rect x="490.0" y="195.0" width="290.0" height="70.0" rx="6" fill="#f5eeff" stroke="#7d3c98" stroke-width="1.5"/>
<text x="635.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#7d3c98" text-anchor="middle" font-weight="700">(a + b)⁵ = a⁵ + b⁵</text>
<text x="635.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Піднесення до степеня p є адитивним!</text>
<text x="490.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Властивості автоморфізму Фробеніуса σ(x) = x⁵:</text>
<text x="495.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Зберігає додавання: σ(a + b) = σ(a) + σ(b)</text>
<text x="495.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Зберігає множення: σ(a · b) = σ(a) · σ(b)</text>
<text x="495.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e824c" text-anchor="start" font-weight="700">• Фіксує базове поле: ∀ c ∈ GF(5): σ(c) = c</text>
</svg>