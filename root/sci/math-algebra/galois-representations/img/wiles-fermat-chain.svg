<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="187.9" y="13.5" width="584.2" height="33.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="34.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Логічний ланцюг доведення Великої теореми Ферма через зображення Галуа</tspan></text>
<rect x="17.7" y="73.0" width="224.6" height="73.9" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.8"/><text x="130.0" y="92.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">1. Припущення від супротивного</tspan><tspan x="130.0" dy="14.3">aᵖ + bᵖ = cᵖ</tspan><tspan x="130.0" dy="14.3">для простих p ≥ 5</tspan><tspan x="130.0" dy="14.3">(a, b, c взаємно прості)</tspan></text>
<line x1="220.0" y1="110.0" x2="270.0" y2="110.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="247.7" y="73.0" width="224.6" height="73.9" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="360.0" y="92.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">2. Крива Фрея E_{A,B,C}</tspan><tspan x="360.0" dy="14.3">y² = x (x − aᵖ)(x + bᵖ)</tspan><tspan x="360.0" dy="14.3">Напівстабільна еліптична крива</tspan><tspan x="360.0" dy="14.3">Δ = (a · b · c)^{2p} / 2⁸</tspan></text>
<line x1="450.0" y1="110.0" x2="500.0" y2="110.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="504.8" y="73.0" width="190.5" height="73.9" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.8"/><text x="600.0" y="92.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">3. Резидуальне зображення</tspan><tspan x="600.0" dy="14.3">ρ̄_{E,p}: G_Q → GL₂(F_p)</tspan><tspan x="600.0" dy="14.3">Незвідне за Мазуром;</tspan><tspan x="600.0" dy="14.3">розгалужене лише в 2 і p</tspan></text>
<line x1="700.0" y1="110.0" x2="750.0" y2="110.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="754.8" y="73.0" width="190.5" height="73.9" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/><text x="850.0" y="92.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">4. Зниження рівня (Рібет)</tspan><tspan x="850.0" dy="14.3">Якщо E модулярна, то</tspan><tspan x="850.0" dy="14.3">ρ̄_{E,p} походить від</tspan><tspan x="850.0" dy="14.3">форми ваги 2 рівня N = 2</tspan></text>
<line x1="360.0" y1="175.0" x2="360.0" y2="240.0" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="435.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="middle" font-weight="700">Крива напівстабільна</text>
<rect x="162.4" y="265.9" width="395.1" height="88.2" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.0"/><text x="360.0" y="285.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">5. Теорема Вайлса та Тейлора–Вайлса (1995)</tspan><tspan x="360.0" dy="14.3"></tspan><tspan x="360.0" dy="14.3">Усі напівстабільні еліптичні криві над Q є МОДУЛЯРНИМИ!</tspan><tspan x="360.0" dy="14.3">Доведено через ізоморфізм кілець деформацій:</tspan><tspan x="360.0" dy="14.3">R ≅ T  (універсальне кільце деформацій = алгебра Гекке)</tspan></text>
<line x1="540.0" y1="310.0" x2="680.0" y2="310.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="610.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Крива Фрея модулярна!</text>
<rect x="677.2" y="251.6" width="265.5" height="116.8" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="2.2"/><text x="810.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">6. ФАТАЛЬНЕ ПРОТИРІЧЧЯ</tspan><tspan x="810.0" dy="14.3"></tspan><tspan x="810.0" dy="14.3">Простір модулярних форм рівня 2:</tspan><tspan x="810.0" dy="14.3">S₂(Γ₀(2)) = { 0 }  (порожній!)</tspan><tspan x="810.0" dy="14.3">Форми f рівня N = 2 не існує!</tspan><tspan x="810.0" dy="14.3"></tspan><tspan x="810.0" dy="14.3">==&gt; Розв'язку aᵖ + bᵖ = cᵖ НЕ ІСНУЄ!</tspan></text>
<line x1="850.0" y1="175.0" x2="850.0" y2="240.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
</svg>