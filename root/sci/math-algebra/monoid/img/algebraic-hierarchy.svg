<text x="440.0" y="421.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Асоціативність дозволяє довільне розставляння дужок і паралельне обчислення частин.</text>
<text x="440.0" y="443.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Нейтральний елемент e задає початковий стан акумулятора й обробку порожніх наборів.</text>
