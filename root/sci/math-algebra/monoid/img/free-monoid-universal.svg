<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Універсальна властивість вільного моноїда слів Σ*</text>
<rect x="61.2" y="75.0" width="237.6" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="96.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Алфавіт Σ</tspan><tspan x="180.0" dy="16.9">(довільна множина символів)</tspan></text>
<rect x="529.2" y="75.0" width="221.5" height="49.9" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="640.0" y="96.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Вільний моноїд (Σ*, ·, ε)</tspan><tspan x="640.0" dy="16.9">(слова над алфавітом Σ)</tspan></text>
<rect x="275.1" y="235.1" width="269.9" height="49.9" rx="6" fill="#fef9e7" stroke="#e67e22" stroke-width="1.5"/><text x="410.0" y="256.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Довільний моноїд (M, ⋆, e_M)</tspan><tspan x="410.0" dy="16.9">(цільова алгебраїчна структура)</tspan></text>
<line x1="290.0" y1="100.0" x2="520.0" y2="100.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="410.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">i : a ↦ (a)   [канонічне вкладення]</text>
<line x1="220.0" y1="125.0" x2="330.0" y2="235.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="250.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">f : Σ → M</text>
<text x="235.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(відображення символів)</text>
<line x1="600.0" y1="125.0" x2="490.0" y2="235.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="580.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">∃! f̄ : Σ* → M</text>
<text x="595.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">(єдиний гомоморфізм моноїдів)</text>
<text x="410.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">f̄ ∘ i = f   (трикутник комутативний)</text>
<text x="410.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">f̄(a₁ a₂ … aₖ) = f(a₁) ⋆ f(a₂) ⋆ … ⋆ f(aₖ)    та    f̄(ε) = e_M</text>
<rect x="60.0" y="350.0" width="720.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="420.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приклад: Σ = {0, 1},  M = (ℤ, +, 0),  f(0)=0, f(1)=1</text>
<text x="420.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Гомоморфізм f̄ рахує кількість одиниць:  f̄(&quot;1011&quot;) = 1 + 0 + 1 + 1 = 3,  f̄(ε) = 0</text>
</svg>