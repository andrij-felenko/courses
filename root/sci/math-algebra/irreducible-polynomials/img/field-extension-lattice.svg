<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440">
<rect width="100%" height="100%" fill="#ffffff" />
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Побудова поля Галуа GF(2³) за модулем непривідного p(x) = x³ + x + 1</text>
<rect x="104.7" y="48.2" width="590.6" height="43.6" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="400.0" y="66.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Корінь многочлена α задовольняє рівність: α³ + α + 1 = 0 ⇒ α³ = α + 1 (над F₂)</tspan><tspan x="400.0" dy="15.6">Кожен елемент — многочлен ступеня ≤ 2 від α або 3-бітове двійкове слово (b₂, b₁, b₀)</tspan></text>
<rect x="40.0" y="125.0" width="720.0" height="30.0" rx="4" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/>
<text x="110.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Степінь α</text>
<text x="290.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поліном (мод p)</text>
<text x="500.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Векторний базис (b₂, b₁, b₀)</text>
<text x="690.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Десятковий двійковий код</text>
