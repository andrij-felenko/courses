<text x="110.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">0</text>
<text x="290.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">0</text>
<text x="500.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">(0, 0, 0)</text>
<text x="690.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">000₂ (0)</text>
<rect x="40.0" y="187.0" width="720.0" height="32.0" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
