<rect x="40.0" y="379.0" width="720.0" height="32.0" rx="2" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="110.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">α⁶</text>
<text x="290.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">α² + 1</text>
<text x="500.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">(1, 0, 1)</text>
<text x="690.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">101₂ (5)</text>
<text x="400.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Множення: α⁴ · α⁵ = α⁹ = α² (оскільки α⁷ = 1 у мультиплікативній групі порядку 7)</text>
