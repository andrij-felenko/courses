<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 434" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="434" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гармонійний аналіз: двоїстість Фур'є між функціями на G та спектром на G^</text>
<rect x="40.0" y="60.0" width="320.0" height="320.0" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/>
<text x="200.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Часовий / просторовий домен</text>
<text x="200.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Простір L²(G, dμ)</text>
<rect x="60.0" y="150.0" width="280.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="176.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Сигнал f(g) на групі G</tspan><tspan x="200.0" dy="15.6">Енергія: ||f||² = ∫_G |f(g)|² dμ(g)</tspan></text>
<rect x="60.0" y="230.0" width="280.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="256.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Згортка сигналів:</tspan><tspan x="200.0" dy="15.6">(f * h)(g) = ∫_G f(y) h(g - y) dμ(y)</tspan></text>
<rect x="60.0" y="310.0" width="280.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="200.0" y="339.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Зсув сигналу: T_y f(g) = f(g - y)</tspan></text>
<rect x="460.0" y="60.0" width="320.0" height="320.0" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<text x="620.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Частотний / спектральний домен</text>
<text x="620.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Простір L²(G^, dν)</text>
<rect x="480.0" y="150.0" width="280.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="176.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Спектр f^(χ) на дуальній групі G^</tspan><tspan x="620.0" dy="14.3">Енергія: ||f^||² = ∫_{G^} |f^(χ)|² dν(χ)</tspan></text>
<rect x="480.0" y="230.0" width="280.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="256.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Поточковий добуток:</tspan><tspan x="620.0" dy="15.6">(f * h)^(χ) = f^(χ) · h^(χ)</tspan></text>
<rect x="480.0" y="310.0" width="280.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="338.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Модуляція фази: (T_y f)^(χ) = χ(y)⁻¹ · f^(χ)</tspan></text>
<line x1="370.0" y1="150.0" x2="450.0" y2="150.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="410.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">F (пряме)</text>
<text x="410.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">f^(χ) = ∫ f χ̄</text>
<line x1="450.0" y1="230.0" x2="370.0" y2="230.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="410.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">F⁻¹ (обернене)</text>
<text x="410.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">f(g) = ∫ f^ χ</text>
<rect x="40.0" y="388.0" width="740.0" height="26.0" rx="6" fill="#eef9f1" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="404.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Теорема Планшереля:  ||f||_{L²(G)} = ||f^||_{L²(G^)}  (ізометрія Гільбертових просторів)</tspan></text>
</svg>