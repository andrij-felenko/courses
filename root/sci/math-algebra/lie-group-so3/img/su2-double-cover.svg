<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подвійне покриття 2-до-1: SU(2) ≅ S³  →  SO(3) ≅ ℝP³</text>
<circle cx="190.0" cy="220.0" r="110.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<ellipse cx="190" cy="220" rx="110" ry="32" fill="none" stroke="#93c5fd" stroke-width="1.4"/>
<text x="190.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Група SU(2) (сфера S³)</text>
<text x="190.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Одиничні кватерніони |q| = 1</text>
<circle cx="190.0" cy="165.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="190.0" cy="275.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="204.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">+q  (+I у нулі)</text>
<text x="204.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">−q  (−I після 360°)</text>
<line x1="190.0" y1="171.0" x2="190.0" y2="269.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="610.0" cy="220.0" r="100.0" fill="#fdf2e9" stroke="#c0392b" stroke-width="2.0"/>
<ellipse cx="610" cy="220" rx="100" ry="28" fill="none" stroke="#fca5a5" stroke-width="1.4"/>
<text x="610.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Група поворотів SO(3)</text>
<text x="610.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Многовид орієнтацій ℝP³</text>
<circle cx="610.0" cy="220.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="610.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">R(q) ∈ SO(3)</text>
<path d="M 230,165 C 380,150 450,180 598,214" fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M 230,275 C 380,290 450,260 598,226" fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="400.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гомоморфізм Φ</text>
<text x="400.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">2-до-1 покриття</text>
<text x="400.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ker(Φ) = {+I, −I}</text>
<rect x="60.0" y="360.0" width="700.0" height="60.0" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
<text x="410.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трюк Дірака з ременем: поворот на 360° міняє знак стану (q ↦ −q),</text>
<text x="410.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">а повний поворот на 720° повертає кватерніон і топологічний стан до початкового (+q).</text>
</svg>