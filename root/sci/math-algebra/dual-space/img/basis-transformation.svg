<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790.5 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790.5" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="345.0" height="330.0" rx="8" fill="none" stroke="#6b7280" stroke-width="1.0"/>
<text x="192.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Початковий базис e₁, e₂</text>
<text x="192.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Координатна сітка одиничного масштабу</text>
<line x1="60.0" y1="240.0" x2="60.0" y2="100.0" stroke="#f0f2f5" stroke-width="1.0"/>
<line x1="110.0" y1="240.0" x2="110.0" y2="100.0" stroke="#f0f2f5" stroke-width="1.0"/>
<line x1="160.0" y1="240.0" x2="160.0" y2="100.0" stroke="#f0f2f5" stroke-width="1.0"/>
<line x1="210.0" y1="240.0" x2="210.0" y2="100.0" stroke="#f0f2f5" stroke-width="1.0"/>
<line x1="60.0" y1="240.0" x2="210.0" y2="240.0" stroke="#f0f2f5" stroke-width="1.0"/>
<line x1="60.0" y1="195.0" x2="210.0" y2="195.0" stroke="#f0f2f5" stroke-width="1.0"/>
<line x1="60.0" y1="150.0" x2="210.0" y2="150.0" stroke="#f0f2f5" stroke-width="1.0"/>
<line x1="60.0" y1="105.0" x2="210.0" y2="105.0" stroke="#f0f2f5" stroke-width="1.0"/>
<line x1="60.0" y1="240.0" x2="110.0" y2="240.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="85.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">e₁</text>
<line x1="60.0" y1="240.0" x2="60.0" y2="195.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="46.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">e₂</text>
<line x1="60.0" y1="240.0" x2="160.0" y2="195.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="165.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">v = 2e₁ + 1e₂</text>
<line x1="110.0" y1="250.0" x2="110.0" y2="90.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,2"/>
<text x="110.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">e¹* = 1</text>
<rect x="67.9" y="274.5" width="248.3" height="21.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="192.0" y="288.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="192.0" dy="0.0">Координата v¹ = 2, значення e¹*(v) = 2</tspan></text>
<text x="192.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Масштаб базису 1 → одиничний крок</text>
<rect x="395.0" y="20.0" width="345.0" height="330.0" rx="8" fill="none" stroke="#6b7280" stroke-width="1.0"/>
<text x="567.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Новий базис e₁′ = 2e₁, e₂′ = e₂</text>
<text x="567.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Базис розтягнуто вдвічі по осі x₁</text>
<line x1="435.0" y1="240.0" x2="435.0" y2="100.0" stroke="#f0f2f5" stroke-width="1.0"/>
<line x1="535.0" y1="240.0" x2="535.0" y2="100.0" stroke="#f0f2f5" stroke-width="1.0"/>
<line x1="635.0" y1="240.0" x2="635.0" y2="100.0" stroke="#f0f2f5" stroke-width="1.0"/>
<line x1="435.0" y1="240.0" x2="635.0" y2="240.0" stroke="#f0f2f5" stroke-width="1.0"/>
<line x1="435.0" y1="195.0" x2="635.0" y2="195.0" stroke="#f0f2f5" stroke-width="1.0"/>
<line x1="435.0" y1="150.0" x2="635.0" y2="150.0" stroke="#f0f2f5" stroke-width="1.0"/>
<line x1="435.0" y1="105.0" x2="635.0" y2="105.0" stroke="#f0f2f5" stroke-width="1.0"/>
<line x1="435.0" y1="240.0" x2="535.0" y2="240.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="485.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">e₁′ = 2e₁</text>
<line x1="435.0" y1="240.0" x2="435.0" y2="195.0" stroke="#333333" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="421.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">e₂′</text>
<line x1="435.0" y1="240.0" x2="535.0" y2="195.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="540.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">v = 1e₁′ + 1e₂′</text>
<line x1="535.0" y1="250.0" x2="535.0" y2="90.0" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,2"/>
<text x="535.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">e′¹* = 1 (при x₁=2)</text>
<rect x="363.4" y="274.8" width="407.1" height="20.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="567.0" y="288.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="567.0" dy="0.0">Контраваріантність: v¹′ = ½ v¹ | Коваріантність: e′¹* = ½ e¹*</tspan></text>
<text x="567.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Векторні координати і ковектори міняються навпаки</text>
</svg>