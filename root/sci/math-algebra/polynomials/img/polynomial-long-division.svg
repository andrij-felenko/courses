<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
<rect width="100%" height="100%" fill="#ffffff" />
<text x="400.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгебраїчна структура ділення з остачею: A(x) = Q(x) · B(x) + R(x)</text>
<rect x="40.0" y="70.0" width="200.0" height="110.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1d4ed8" text-anchor="middle" font-weight="700">Ділене A(x)</text>
<text x="140.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Степінь: deg A = n</text>
<text x="140.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">A(x) = 2x³ - 3x² + 4x - 5</text>
<text x="260.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="700">=</text>
<rect x="285.0" y="70.0" width="195.0" height="110.0" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
<text x="382.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#047857" text-anchor="middle" font-weight="700">Частка Q(x)</text>
<text x="382.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">deg Q = deg A - deg B</text>
<text x="382.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">Q(x) = 2x - 7</text>
<text x="500.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700">·</text>
<rect x="525.0" y="70.0" width="195.0" height="110.0" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="622.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b45309" text-anchor="middle" font-weight="700">Дільник B(x)</text>
<text x="622.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Степінь: deg B = m</text>
<text x="622.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">B(x) = x² + 2x - 1</text>
<text x="382.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#1a1a1a" text-anchor="middle" font-weight="700">+</text>
<rect x="220.0" y="235.0" width="360.0" height="95.0" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="400.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="700">Остача R(x)</text>
<text x="400.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">Ключова умова: deg R &lt; deg B (або R = 0)</text>
<text x="400.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">R(x) = 20x - 12   (deg R = 1 &lt; deg B = 2)</text>
</svg>