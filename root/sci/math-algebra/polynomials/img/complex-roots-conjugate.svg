<rect x="480.0" y="80.0" width="280.0" height="110.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="620.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">Добуток спряжених факторів:</text>
<text x="620.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">(x - z)(x - z̄) = x² - 2ax + (a² + b²)</text>
<text x="620.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Незвідний квадратний тричлен над ℝ</text>
<text x="620.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="middle" font-weight="700">Дискримінант Δ = -4b² &lt; 0</text>
<rect x="60.0" y="375.0" width="680.0" height="48.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="400.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Кожен многочлен P(x) ∈ ℝ[x] розкладається суто на лінійні (x - r) та незвідні квадратні фактори</text>
