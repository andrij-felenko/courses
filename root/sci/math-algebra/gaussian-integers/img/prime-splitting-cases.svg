<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація простих чисел у кільці ℤ[i]</text>
<rect x="35.0" y="65.0" width="240.0" height="330.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="155.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">РОЗГАЛУЖЕННЯ</text>
<text x="155.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">p = 2</text>
<line x1="50.0" y1="125.0" x2="260.0" y2="125.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="50.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="50.0" dy="0.0">• Розклад на множники:</tspan><tspan x="50.0" dy="16.2">  2 = -i · (1 + i)²</tspan><tspan x="50.0" dy="16.2"></tspan><tspan x="50.0" dy="16.2">• Дільник подвійної кратності:</tspan><tspan x="50.0" dy="16.2">  1 + i та 1 - i асоційовані</tspan><tspan x="50.0" dy="16.2">  1 - i = -i·(1 + i)</tspan><tspan x="50.0" dy="16.2"></tspan><tspan x="50.0" dy="16.2">• Норма дільника:</tspan><tspan x="50.0" dy="16.2">  N(1 + i) = 1² + 1² = 2</tspan><tspan x="50.0" dy="16.2"></tspan><tspan x="50.0" dy="16.2">• Дискримінант ділиться на 2</tspan></text>
<rect x="300.0" y="65.0" width="240.0" height="330.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="420.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">РОЗЩЕПЛЕННЯ</text>
<text x="420.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">p ≡ 1 (mod 4)</text>
<line x1="315.0" y1="125.0" x2="525.0" y2="125.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="315.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="315.0" dy="0.0">• Розклад на два прості:</tspan><tspan x="315.0" dy="16.2">  p = (a + bi)(a - bi)</tspan><tspan x="315.0" dy="16.2"></tspan><tspan x="315.0" dy="16.2">• Сума двох квадратів:</tspan><tspan x="315.0" dy="16.2">  p = a² + b² (теорема Ферма)</tspan><tspan x="315.0" dy="16.2"></tspan><tspan x="315.0" dy="16.2">• Множники неасоційовані:</tspan><tspan x="315.0" dy="16.2">  π = a + bi,  π̄ = a - bi</tspan><tspan x="315.0" dy="16.2">  N(π) = N(π̄) = p</tspan><tspan x="315.0" dy="16.2"></tspan><tspan x="315.0" dy="16.2">• Приклади: 5, 13, 17, 29, 37, 41</tspan></text>
<rect x="565.0" y="65.0" width="240.0" height="330.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="685.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">ІНЕРЦІЯ</text>
<text x="685.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">p ≡ 3 (mod 4)</text>
<line x1="580.0" y1="125.0" x2="790.0" y2="125.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="580.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start"><tspan x="580.0" dy="0.0">• Залишається простим:</tspan><tspan x="580.0" dy="16.2">  p не ділиться в ℤ[i]</tspan><tspan x="580.0" dy="16.2"></tspan><tspan x="580.0" dy="16.2">• Не є сумою двох квадратів:</tspan><tspan x="580.0" dy="16.2">  a² + b² ≢ 3 (mod 4)</tspan><tspan x="580.0" dy="16.2"></tspan><tspan x="580.0" dy="16.2">• Норма як елемента ℤ[i]:</tspan><tspan x="580.0" dy="16.2">  N(p) = p² + 0² = p²</tspan><tspan x="580.0" dy="16.2"></tspan><tspan x="580.0" dy="16.2">• Приклади: 3, 7, 11, 19, 23, 31</tspan></text>
</svg>