<rect x="565.0" y="70.0" width="255.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="692.5" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="692.5" dy="0.0">Розгалужене просте (N=2):</tspan><tspan x="692.5" dy="16.9">• 1 + i та його 3 асоційовані</tspan><tspan x="692.5" dy="16.9">• 2 = -i·(1 + i)²</tspan><tspan x="692.5" dy="16.9">• Єдине парне просте число</tspan></text>
<rect x="565.0" y="215.0" width="255.0" height="145.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="692.5" y="258.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="692.5" dy="0.0">Розщеплені прості (p ≡ 1 mod 4):</tspan><tspan x="692.5" dy="16.9">• p = a² + b² = (a+bi)(a-bi)</tspan><tspan x="692.5" dy="16.9">• Приклади: 5 = (2+i)(2-i)</tspan><tspan x="692.5" dy="16.9">  13 = (3+2i)(3-2i), 17, 29, 41</tspan><tspan x="692.5" dy="16.9">• 8 точок симетрії для кожного p</tspan></text>
<rect x="565.0" y="375.0" width="255.0" height="140.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="692.5" y="415.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="692.5" dy="0.0">Інертні прості (p ≡ 3 mod 4):</tspan><tspan x="692.5" dy="16.9">• Не розкладаються в ℤ[i]</tspan><tspan x="692.5" dy="16.9">• Лежать строго на осях Re та Im</tspan><tspan x="692.5" dy="16.9">• Приклади: 3, 7, 11, 19, 23, 31</tspan><tspan x="692.5" dy="16.9">• Норма в ℤ[i] дорівнює p²</tspan></text>
