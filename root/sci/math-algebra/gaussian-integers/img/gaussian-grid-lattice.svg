<rect x="560.0" y="365.0" width="250.0" height="155.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="685.0" y="413.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="685.0" dy="0.0">Властивості норми:</tspan><tspan x="685.0" dy="16.9">• N(a + bi) = a² + b²</tspan><tspan x="685.0" dy="16.9">• N(α·β) = N(α)·N(β)</tspan><tspan x="685.0" dy="16.9">• N(α) = 0 ⇔ α = 0</tspan><tspan x="685.0" dy="16.9">• N(α) = 1 ⇔ α — одиниця</tspan></text>
