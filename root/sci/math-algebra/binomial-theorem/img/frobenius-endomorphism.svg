<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ендоморфізм Фробеніуса у кільці характеристики p</text>
<text x="410.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Усі проміжні біноміальні коефіцієнти C(p, k) діляться на p, тому проміжні члени зникають mod p</text>
<rect x="60.0" y="90.0" width="700.0" height="65.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="410.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Розклад у звичайній алгебрі для p = 5:</text>
<text x="410.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">(a + b)⁵ = a⁵  +  5·a⁴b  +  10·a³b²  +  10·a²b³  +  5·ab⁴  +  b⁵</text>
<rect x="75.0" y="175.0" width="90.0" height="48.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="120.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">a⁵</text>
<text x="120.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Залишається</text>
<rect x="185.0" y="175.0" width="90.0" height="48.0" rx="6" fill="#fdf1e5" stroke="#c0392b" stroke-width="1.2"/>
<text x="230.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">5·a⁴b</text>
<text x="230.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">5 ≡ 0 (mod 5)</text>
<rect x="295.0" y="175.0" width="90.0" height="48.0" rx="6" fill="#fdf1e5" stroke="#c0392b" stroke-width="1.2"/>
<text x="340.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">10·a³b²</text>
<text x="340.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">10 ≡ 0 (mod 5)</text>
<rect x="405.0" y="175.0" width="90.0" height="48.0" rx="6" fill="#fdf1e5" stroke="#c0392b" stroke-width="1.2"/>
<text x="450.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">10·a²b³</text>
<text x="450.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">10 ≡ 0 (mod 5)</text>
<rect x="515.0" y="175.0" width="90.0" height="48.0" rx="6" fill="#fdf1e5" stroke="#c0392b" stroke-width="1.2"/>
<text x="560.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">5·ab⁴</text>
<text x="560.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">5 ≡ 0 (mod 5)</text>
<rect x="625.0" y="175.0" width="90.0" height="48.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="670.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">b⁵</text>
<text x="670.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Залишається</text>
<rect x="160.0" y="265.0" width="500.0" height="56.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="410.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Результат у кільці характеристики p (модулярна алгебра):</text>
<text x="410.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">(a + b)ᵖ  ≡  aᵖ + bᵖ  (mod p)</text>
</svg>