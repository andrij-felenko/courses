<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометричний зміст міри Малера M(f) = |aₙ| · ∏ max(1, |αᵢ|)</text>
<text x="400.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Корені всередині одиничного круга дають множник 1, ззовні — свій радіус |αᵢ|</text>
<line x1="50.0" y1="255.0" x2="410.0" y2="255.0" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="230.0" y1="95.0" x2="230.0" y2="415.0" stroke="#94a3b8" stroke-width="1.5"/>
<text x="405.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">Re(z)</text>
<text x="238.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Im(z)</text>
<circle cx="230" cy="255" r="115" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="330.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">1.0</text>
<text x="137.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end">-1.0</text>
<text x="238.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">i</text>
<text x="238.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">-i</text>
<text x="190.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Одиничне коло |z| = 1</text>
<circle cx="268.0" cy="207.0" r="6.0" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
<text x="278.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">α₁</text>
<circle cx="172.0" cy="217.0" r="6.0" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
<text x="182.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">α₂</text>
<circle cx="212.0" cy="323.0" r="6.0" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
<text x="222.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">α₃</text>
<line x1="230.0" y1="255.0" x2="355.0" y2="180.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
<circle cx="355.0" cy="180.0" r="6.0" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<text x="365.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">α₄</text>
<line x1="230.0" y1="255.0" x2="115.0" y2="340.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
<circle cx="115.0" cy="340.0" r="6.0" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
<text x="125.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">α₅</text>
<rect x="460.0" y="80.0" width="310.0" height="360.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="615.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключові властивості міри Малера</text>
<text x="475.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">1. Мультиплікативність:</text>
<text x="485.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">f(x) = g(x) · h(x)  ⇒</text>
<text x="485.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">M(f) = M(g) · M(h)</text>
<text x="475.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">2. Оцінка дільника g(x):</text>
<text x="485.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Оскільки M(h) ≥ 1 для h ∈ ℤ[x],</text>
<text x="485.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">M(g) ≤ M(f)</text>
<text x="485.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Дільник не може мати більшу міру!</text>
<text x="475.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">3. Нерівність Ландау (1905):</text>
<text x="485.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">M(f) ≤ ||f||₂ = √(∑ |aᵢ|²)</text>
<text x="485.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Міра коренів обмежена довжиною</text>
<text x="485.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">вектора коефіцієнтів у ℂⁿ⁺¹!</text>
<text x="475.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">4. Висновок для коефіцієнтів:</text>
<text x="485.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">|bⱼ| ≤ (deg g над j) · ||f||₂</text>
</svg>