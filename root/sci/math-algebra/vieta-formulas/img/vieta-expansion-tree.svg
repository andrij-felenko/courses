<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Комбінаторна структура формул Вієта для кубічного многочлена</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Розкриття (x − r₁)(x − r₂)(x − r₃): вибір x або −rᵢ на кожному кроці</text>
<rect x="25.0" y="75.0" width="170.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="110.0" y="95.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Лінійні множники</tspan></text>
<rect x="230.0" y="75.0" width="220.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="340.0" y="95.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">8 елементарних добутків</tspan></text>
<rect x="500.0" y="75.0" width="220.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="95.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Групування за степенем x</tspan></text>
<rect x="710.0" y="75.0" width="140.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="95.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Формули Вієта</tspan></text>
<rect x="35.0" y="140.0" width="150.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="159.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">1. (x − r₁)</tspan><tspan x="110.0" dy="14.3">вибір: x або −r₁</tspan></text>
<rect x="35.0" y="215.0" width="150.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="234.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">2. (x − r₂)</tspan><tspan x="110.0" dy="14.3">вибір: x або −r₂</tspan></text>
<rect x="35.0" y="290.0" width="150.0" height="45.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="110.0" y="309.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">3. (x − r₃)</tspan><tspan x="110.0" dy="14.3">вибір: x або −r₃</tspan></text>
<rect x="245.0" y="111.0" width="190.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="340.0" y="128.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">+ x · x · x = + x³</tspan></text>
<rect x="245.0" y="151.0" width="190.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="340.0" y="168.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">− r₁ · x · x = − r₁ x²</tspan></text>
<rect x="245.0" y="181.0" width="190.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="340.0" y="198.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">− r₂ · x · x = − r₂ x²</tspan></text>
<rect x="245.0" y="211.0" width="190.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="340.0" y="228.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">− r₃ · x · x = − r₃ x²</tspan></text>
<rect x="245.0" y="251.0" width="190.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="340.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">+ r₁ r₂ · x</tspan></text>
<rect x="245.0" y="281.0" width="190.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="340.0" y="298.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">+ r₁ r₃ · x</tspan></text>
<rect x="245.0" y="311.0" width="190.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="340.0" y="328.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">+ r₂ r₃ · x</tspan></text>
<rect x="245.0" y="356.0" width="190.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="340.0" y="373.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">− r₁ r₂ r₃</tspan></text>
<rect x="510.0" y="115.0" width="200.0" height="32.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="134.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">x³  (C(3,0) = 1 доданок)</tspan></text>
<rect x="510.0" y="175.0" width="200.0" height="65.0" rx="6" fill="#fdf1e5" stroke="#c0392b" stroke-width="1.5"/><text x="610.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">− (r₁ + r₂ + r₃) x²</tspan><tspan x="610.0" dy="14.3">(C(3,1) = 3 доданки)</tspan></text>
<rect x="510.0" y="275.0" width="200.0" height="65.0" rx="6" fill="#f3e8ff" stroke="#2457d6" stroke-width="1.5"/><text x="610.0" y="304.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">+ (r₁r₂ + r₁r₃ + r₂r₃) x</tspan><tspan x="610.0" dy="14.3">(C(3,2) = 3 доданки)</tspan></text>
<rect x="510.0" y="360.0" width="200.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="610.0" y="379.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">− (r₁ r₂ r₃)  (C(3,3) = 1)</tspan></text>
<rect x="715.0" y="115.0" width="130.0" height="32.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="780.0" y="135.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">e₀ = 1</tspan></text>
<rect x="715.0" y="185.0" width="130.0" height="45.0" rx="6" fill="#fdf1e5" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">a₂/a₃ = −e₁</tspan><tspan x="780.0" dy="14.3">e₁ = ∑ rᵢ</tspan></text>
<rect x="715.0" y="285.0" width="130.0" height="45.0" rx="6" fill="#f3e8ff" stroke="#2457d6" stroke-width="1.5"/><text x="780.0" y="304.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">a₁/a₃ = +e₂</tspan><tspan x="780.0" dy="14.3">e₂ = ∑ rᵢ rⱼ</tspan></text>
<rect x="715.0" y="360.0" width="130.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="780.0" y="380.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">a₀/a₃ = −e₃</tspan></text>
