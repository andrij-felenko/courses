<rect x="480.0" y="80.0" width="260.0" height="160.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Примітивні корені ζ₈ (НСД(k, 8) = 1):</tspan><tspan x="610.0" dy="14.3">• ζ₈, ζ₈³, ζ₈⁵, ζ₈⁷ (рівно φ(8) = 4)</tspan><tspan x="610.0" dy="14.3">• Кожен породжує ВСІ 8 коренів</tspan><tspan x="610.0" dy="14.3">• Їхній спільний мінімальний</tspan><tspan x="610.0" dy="14.3">  многочлен: Φ₈(x) = x⁴ + 1</tspan><tspan x="610.0" dy="14.3">• Розширення: [ℚ(ζ₈) : ℚ] = 4</tspan></text>
<rect x="480.0" y="260.0" width="260.0" height="175.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/><text x="610.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Непримітивні корені:</tspan><tspan x="610.0" dy="13.0">• 1 (порядок 1, корінь Φ₁(x) = x − 1)</tspan><tspan x="610.0" dy="13.0">• −1 (порядок 2, корінь Φ₂(x) = x + 1)</tspan><tspan x="610.0" dy="13.0">• ±i (порядок 4, корені Φ₄(x) = x² + 1)</tspan><tspan x="610.0" dy="13.0"></tspan><tspan x="610.0" dy="13.0">Повний розклад:</tspan><tspan x="610.0" dy="13.0">x⁸ − 1 = Φ₁(x) · Φ₂(x) · Φ₄(x) · Φ₈(x)</tspan></text>
