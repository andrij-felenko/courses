<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кругові кільця ℤ_q[x]/(xᴺ + 1) у решітковій криптографії (Kyber / Ring-LWE)</text>
<rect x="40.0" y="60.0" width="330.0" height="230.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/><text x="205.0" y="128.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Стандартний LWE (на загальних решітках):</tspan><tspan x="205.0" dy="14.3"></tspan><tspan x="205.0" dy="14.3">• Секрет s ∈ ℤ_qᴺ, матриця A ∈ ℤ_q^(M × N)</tspan><tspan x="205.0" dy="14.3">• Відкритий ключ: b = A·s + e (mod q)</tspan><tspan x="205.0" dy="14.3">• Розмір ключа: M × N елементів ℤ_q</tspan><tspan x="205.0" dy="14.3">  (сотні кілобайт пам'яті!)</tspan><tspan x="205.0" dy="14.3">• Множення матриці на вектор: O(N²)</tspan><tspan x="205.0" dy="14.3">• Надійний, але повільний для інтернету</tspan></text>
<rect x="430.0" y="60.0" width="330.0" height="230.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/><text x="595.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">Ring-LWE / Kyber (на кругових кільцях):</tspan><tspan x="595.0" dy="13.0"></tspan><tspan x="595.0" dy="13.0">• Кільце R_q = ℤ_q[x]/(xᴺ + 1)  [N = 256 = 2⁸]</tspan><tspan x="595.0" dy="13.0">• Замість матриці — ОДИН поліном a(x) ∈ R_q</tspan><tspan x="595.0" dy="13.0">• Відкритий ключ: b(x) = a(x)·s(x) + e(x)</tspan><tspan x="595.0" dy="13.0">• Розмір ключа скорочується у N разів (≈ 1 КБ!)</tspan><tspan x="595.0" dy="13.0">• Множення через ШПФ / NTT: O(N log N)</tspan><tspan x="595.0" dy="13.0">• Захищений стандарт NIST (ML-KEM / Kyber)</tspan></text>
<line x1="375.0" y1="175.0" x2="425.0" y2="175.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="400.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">xᴺ ≡ −1</text>
<rect x="40.0" y="310.0" width="720.0" height="130.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="400.0" y="343.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Чому це працює: алгебраїчна редукція xᴺ ≡ −1 у круговому кільці</tspan><tspan x="400.0" dy="14.3">Множення на поліном a(x) = a₀ + a₁x + ... + a_{N-1}x^{N-1} рівносильне дії негациркулянтної матриці:</tspan><tspan x="400.0" dy="14.3">  [  a₀   −a_{N-1}  ...  −a₁  ]</tspan><tspan x="400.0" dy="14.3">  [  a₁     a₀      ...  −a₂  ]   ← Кожен стовпчик є циклічним зсувом зі зміною знака на межі!</tspan><tspan x="400.0" dy="14.3">  [ ...    ...      ...  ...  ]</tspan><tspan x="400.0" dy="14.3">  [ a_{N-1} a_{N-2} ...   a₀  ]   ⟹ Корені Φ_{2N}(x) дають дискретне перетворення Фур'є над ℤ_q.</tspan></text>
</svg>