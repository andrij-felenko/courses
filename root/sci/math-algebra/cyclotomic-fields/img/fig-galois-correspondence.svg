<rect x="260.0" y="200.0" width="100.0" height="45.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.3"/><text x="310.0" y="219.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">ℚ(√−3)</tspan><tspan x="310.0" dy="13.0">[ℚ(√−3):ℚ] = 2</tspan></text>
<rect x="420.0" y="200.0" width="100.0" height="45.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.3"/><text x="470.0" y="219.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">H₁ = {1, 5}</tspan><tspan x="470.0" dy="11.7">(σ₅: i ↦ i, √3 ↦ −√3)</tspan></text>
<rect x="540.0" y="200.0" width="100.0" height="45.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.3"/><text x="590.0" y="219.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">H₂ = {1, 11}</tspan><tspan x="590.0" dy="11.7">(σ₁₁: спряження)</tspan></text>
<rect x="660.0" y="200.0" width="100.0" height="45.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.3"/><text x="710.0" y="219.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">H₃ = {1, 7}</tspan><tspan x="710.0" dy="11.7">(σ₇: i ↦ −i, √3 ↦ √3)</tspan></text>
<rect x="100.0" y="315.0" width="180.0" height="45.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="333.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">ℚ (базове поле)</tspan><tspan x="190.0" dy="15.6">ступінь 1</tspan></text>
<rect x="490.0" y="315.0" width="200.0" height="45.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="590.0" y="334.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">G = (ℤ/12ℤ)* = {1, 5, 7, 11}</tspan><tspan x="590.0" dy="13.0">ізоморфна ℤ/2ℤ × ℤ/2ℤ</tspan></text>
