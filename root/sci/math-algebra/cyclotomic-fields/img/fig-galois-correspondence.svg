<text x="590.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Решітка підгруп Галуа (включення ⊃)</text>
<rect x="100.0" y="85.0" width="180.0" height="45.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/><text x="190.0" y="103.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">ℚ(ζ₁₂) = ℚ(i, √3)</tspan><tspan x="190.0" dy="15.6">ступінь 4 над ℚ</tspan></text>
<rect x="500.0" y="85.0" width="180.0" height="45.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/><text x="590.0" y="103.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">H = {1}</tspan><tspan x="590.0" dy="15.6">фіксує все ℚ(ζ₁₂)</tspan></text>
<rect x="20.0" y="200.0" width="100.0" height="45.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.3"/><text x="70.0" y="219.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="70.0" dy="0.0">ℚ(i)</tspan><tspan x="70.0" dy="14.3">[ℚ(i):ℚ] = 2</tspan></text>
