<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація та алгебраїчна побудова скінченних полів GF(q)</text>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація та алгебраїчна побудова скінченних полів GF(q)</text>
<rect x="40.0" y="60.0" width="360.0" height="390.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="220.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прості поля: GF(p) ≅ ℤ/pℤ</text>
<line x1="50.0" y1="100.0" x2="390.0" y2="100.0" stroke="#333333" stroke-width="1.0"/>
<rect x="85.5" y="118.2" width="269.1" height="43.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/><text x="220.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Кількість елементів: q = p</tspan><tspan x="220.0" dy="15.6">(p — просте число: 2, 3, 5, 7, 11...)</tspan></text>
<rect x="75.2" y="182.6" width="289.6" height="74.8" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/><text x="220.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Арифметика за модулем p:</tspan><tspan x="220.0" dy="15.6">• Додавання: (a + b) mod p</tspan><tspan x="220.0" dy="15.6">• Множення: (a · b) mod p</tspan><tspan x="220.0" dy="15.6">• Обернення: розширений алгоритм Евкліда</tspan></text>
<rect x="102.6" y="288.2" width="234.9" height="43.6" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.2"/><text x="220.0" y="306.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Характеристика поля: char(F) = p</tspan><tspan x="220.0" dy="15.6">p · 1 = 1 + 1 + ... + 1 = 0</tspan></text>
<rect x="95.7" y="373.2" width="248.6" height="43.6" rx="6" fill="#fdf2f8" stroke="#c0392b" stroke-width="1.2"/><text x="220.0" y="391.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Мультиплікативна група:</tspan><tspan x="220.0" dy="15.6">(ℤ/pℤ)* ≅ C_{p-1} (циклічна група)</tspan></text>
<line x1="410.0" y1="255.0" x2="450.0" y2="255.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="430.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">F[x]/(P)</text>
<text x="430.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">степінь n</text>
<rect x="460.0" y="60.0" width="340.0" height="390.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="630.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поля розширення: GF(pⁿ) ≅ GF(p)[x]/(P(x))</text>
<line x1="470.0" y1="100.0" x2="790.0" y2="100.0" stroke="#333333" stroke-width="1.0"/>
<rect x="474.9" y="118.2" width="310.1" height="43.6" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.2"/><text x="630.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Кількість елементів: q = pⁿ</tspan><tspan x="630.0" dy="15.6">(векторний простір розмірності n над GF(p))</tspan></text>
<rect x="474.9" y="182.6" width="310.1" height="74.8" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/><text x="630.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Поліноміальна арифметика mod P(x):</tspan><tspan x="630.0" dy="15.6">• Елементи: a_{n-1}x^{n-1} + ... + a₁x + a₀</tspan><tspan x="630.0" dy="15.6">• P(x) — незвідний многочлен степеня n</tspan><tspan x="630.0" dy="15.6">• Множення: (a(x) · b(x)) mod P(x)</tspan></text>
<rect x="474.9" y="280.4" width="310.1" height="59.2" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.2"/><text x="630.0" y="298.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Двійкові поля GF(2ⁿ) (p = 2):</tspan><tspan x="630.0" dy="15.6">• Додавання/віднімання = XOR (без переносу)</tspan><tspan x="630.0" dy="15.6">• Ідеальні для цифрових мікропроцесорів</tspan></text>
<rect x="481.8" y="373.2" width="296.4" height="43.6" rx="6" fill="#fdf2f8" stroke="#c0392b" stroke-width="1.2"/><text x="630.0" y="391.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Мультиплікативна група:</tspan><tspan x="630.0" dy="15.6">GF(pⁿ)* ≅ C_{pⁿ-1} (циклічна порядку q-1)</tspan></text>
</svg>