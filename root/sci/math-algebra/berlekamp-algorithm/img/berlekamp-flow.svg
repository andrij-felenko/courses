<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр факторизації многочлена f(x) за алгоритмом Берлекампа</text>
<text x="420.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр факторизації многочлена f(x) над скінченним полем GF(q)</text>
<rect x="65.9" y="70.0" width="168.2" height="49.9" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Вхід: многочлен f(x)</tspan><tspan x="150.0" dy="16.9">степеня n над GF(q)</tspan></text>
<rect x="315.5" y="70.0" width="309.0" height="49.9" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">1. Перевірка на кратні множники</tspan><tspan x="470.0" dy="16.9">Обчислення похідної f'(x) та НСД(f, f')</tspan></text>
<line x1="260.0" y1="95.0" x2="330.0" y2="95.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="295.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">f(x)</text>
<rect x="311.8" y="195.1" width="316.4" height="49.9" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="216.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">2. Побудова матриці Q (n × n)</tspan><tspan x="470.0" dy="16.9">Рядок i: x^(i·q) mod f(x) для i = 0..n-1</tspan></text>
<line x1="470.0" y1="135.0" x2="470.0" y2="185.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="540.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">без квадратів</text>
<rect x="304.4" y="311.6" width="331.2" height="66.8" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/><text x="470.0" y="332.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">3. Розв'язання системи: v · (Q - I) = 0</tspan><tspan x="470.0" dy="16.9">Знаходження ядра ker(Q - I) методом Гаусса</tspan><tspan x="470.0" dy="16.9">Розмірність ядра k = dim ker(Q - I)</tspan></text>
<line x1="470.0" y1="255.0" x2="470.0" y2="305.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="535.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">матриця Q</text>
<rect x="30.3" y="420.1" width="279.3" height="49.9" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="441.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">k = 1: Ядро одновимірне (константи)</tspan><tspan x="170.0" dy="16.9">f(x) є незвідним многочленом</tspan></text>
<line x1="340.0" y1="370.0" x2="220.0" y2="415.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="250.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">k = 1</text>
<rect x="460.7" y="411.6" width="338.6" height="66.8" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="432.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">k &gt; 1: Взяти базисний v(x) ∉ GF(q)</tspan><tspan x="630.0" dy="16.9">Обчислити НСД(f(x), v(x) - s) для s ∈ GF(q)</tspan><tspan x="630.0" dy="16.9">Рекурсивно розщепити на k множників</tspan></text>
<line x1="580.0" y1="370.0" x2="630.0" y2="410.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="630.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">k &gt; 1</text>
</svg>