<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ізоморфізм Китайської теореми та структура підалгебри Берлекампа</text>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ізоморфізм Китайської теореми та підалгебра Берлекампа</text>
<rect x="40.0" y="60.0" width="340.0" height="360.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="210.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фактор-кільце R = GF(q)[x] / (f(x))</text>
<line x1="50.0" y1="102.0" x2="370.0" y2="102.0" stroke="#333333" stroke-width="1.0"/>
<text x="210.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Многочлен f(x) = f₁(x) · f₂(x) · ... · f_k(x)</text>
<text x="210.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Степінь многочлена n, розмірність R над GF(q) = n</text>
<rect x="65.0" y="185.0" width="290.0" height="210.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="210.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Підалгебра Берлекампа B ⊂ R</text>
<text x="210.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">{ v(x) ∈ R | v(x)^q ≡ v(x) mod f(x) }</text>
<line x1="80.0" y1="248.0" x2="340.0" y2="248.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="210.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Операція v ↦ v^q лінійна завдяки</text>
<text x="210.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">автоморфізму Фробеніуса: (a + b)^q = a^q + b^q</text>
<text x="210.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Векторне рівняння: v · (Q - I) = 0</text>
<text x="210.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Розмірність: dim(B) = k (кількість множників)</text>
<line x1="390.0" y1="240.0" x2="445.0" y2="240.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="418.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#27ae60" text-anchor="middle" font-weight="700">≅</text>
<text x="418.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">КТО</text>
<rect x="455.0" y="60.0" width="345.0" height="360.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="627.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прямий добуток фактор-полів</text>
<line x1="465.0" y1="102.0" x2="790.0" y2="102.0" stroke="#333333" stroke-width="1.0"/>
<text x="627.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">∏ (GF(q)[x] / (f_i(x))) для i = 1..k</text>
<text x="627.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Кожен множник f_i(x) породжує своє поле</text>
<rect x="480.0" y="185.0" width="295.0" height="210.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="627.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Образ підалгебри B в ізоморфізмі</text>
<text x="627.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">v(x) mod f_i(x) = s_i ∈ GF(q)</text>
<line x1="495.0" y1="248.0" x2="760.0" y2="248.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="627.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Рівняння s^q = s у кожному полі GF(q^deg(f_i))</text>
<text x="627.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">має рівно q розв'язків — константи базового GF(q)</text>
<text x="627.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Кортеж: (s₁, s₂, ..., s_k) ∈ GF(q)^k</text>
<text x="627.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">НСД(f, v - s_i) ділиться на f_i(x)!</text>
</svg>