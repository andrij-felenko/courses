<text x="610.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Шлях у радикалах перекрито</text>
<rect x="411.9" y="397.4" width="396.2" height="45.3" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/><text x="610.0" y="416.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Оскільки A₅ не містить нормальних підгруп, вежа обривається.</tspan><tspan x="610.0" dy="14.3">Формули в радикалах для n ≥ 5 у загальному вигляді не існує.</tspan></text>
