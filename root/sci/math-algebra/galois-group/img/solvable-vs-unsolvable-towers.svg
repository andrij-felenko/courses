<rect x="507.3" y="233.5" width="205.4" height="33.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="610.0" y="254.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">БАР'ЄР: ПРОСТА ГРУПА A₅</tspan></text>
<text x="610.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">A₅ — найменша неабелева проста група (пор. 60).</tspan><tspan x="610.0" dy="14.3">Вона НЕ має жодної нормальної підгрупи, крім {e} та A₅.</tspan><tspan x="610.0" dy="14.3">Неможливо розбити на простіші абелеві фактори!</tspan></text>
