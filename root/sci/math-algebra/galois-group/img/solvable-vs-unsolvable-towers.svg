<rect x="46.4" y="397.4" width="327.2" height="45.3" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="210.0" y="416.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Усі фактори Z₂, Z₃, Z₂ циклічні й абелеві.</tspan><tspan x="210.0" dy="14.3">Кожен крок відповідає приєднанню кореня: √ чи ³√.</tspan></text>
<rect x="386.4" y="5.0" width="447.2" height="49.9" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/><text x="610.0" y="26.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Загальне рівняння 5-го степеня: Gal(f) = S₅</tspan><tspan x="610.0" dy="16.9">(Не розв'язується у радикалах: теорема Абеля — Ґалуа)</tspan></text>
