<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="400.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Практичні застосування скінченних полів Галуа в комп'ютерних науках</text>
<rect x="44.0" y="75.9" width="252.0" height="88.2" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="170.0" y="95.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">1. Симетрична криптографія</tspan><tspan x="170.0" dy="14.3">AES (Advanced Encryption Standard)</tspan><tspan x="170.0" dy="14.3">S-Box: Обернення у GF(2⁸)</tspan><tspan x="170.0" dy="14.3">S(x) = Affine(x⁻¹) mod (x⁸+x⁴+x³+x+1)</tspan><tspan x="170.0" dy="14.3">Максимальна алгебраїчна нелінійність</tspan></text>
<rect x="320.3" y="75.9" width="239.4" height="88.2" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="440.0" y="95.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">2. Завадостійке кодування</tspan><tspan x="440.0" dy="14.3">Коди Ріда — Соломона (Reed-Solomon)</tspan><tspan x="440.0" dy="14.3">Оцінка многочленів над GF(2ᵐ)</tspan><tspan x="440.0" dy="14.3">RAID-6, QR-коди, CD/DVD, супутники</tspan><tspan x="440.0" dy="14.3">Виправлення t помилок за 2t паролів</tspan></text>
<rect x="590.3" y="75.9" width="239.4" height="88.2" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="710.0" y="95.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">3. Верифікація та ZK-Proof</tspan><tspan x="710.0" dy="14.3">Лема Шварца — Ціппеля, STARKs</tspan><tspan x="710.0" dy="14.3">Тестування еквівалентності P(x) ≡ 0</tspan><tspan x="710.0" dy="14.3">Оцінка у випадковій точці з GF(q)</tspan><tspan x="710.0" dy="14.3">Ймовірність помилки ≤ d / |GF(q)|</tspan></text>
<rect x="135.1" y="263.1" width="339.8" height="73.9" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="305.0" y="282.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">4. Асиметрична криптографія (ECC)</tspan><tspan x="305.0" dy="14.3">Еліптичні криві y² = x³ + ax + b над GF(p) / GF(2ᵐ)</tspan><tspan x="305.0" dy="14.3">ECDSA, Ed25519, криптографія на ґратках</tspan><tspan x="305.0" dy="14.3">Основа сучасного TLS/HTTPS та Bitcoin/Ethereum</tspan></text>
<rect x="449.0" y="255.9" width="252.0" height="88.2" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="575.0" y="275.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">5. Порогові схеми Шаміра</tspan><tspan x="575.0" dy="14.3">(k, n)-пороги розділення секрету</tspan><tspan x="575.0" dy="14.3">Інтерполяція Лагранжа над GF(p)</tspan><tspan x="575.0" dy="14.3">k частин відновлюють секрет P(0),</tspan><tspan x="575.0" dy="14.3">k-1 частин не дають жодної інформації</tspan></text>
<line x1="260.0" y1="175.0" x2="305.0" y2="230.0" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="440.0" y1="185.0" x2="575.0" y2="230.0" stroke="#94a3b8" stroke-width="1.2"/>
</svg>