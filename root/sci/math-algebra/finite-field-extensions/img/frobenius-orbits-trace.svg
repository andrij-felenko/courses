<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автоморфізм Фробеніуса σ: x ↦ x^2, орбіти спряження, слід і норма в GF(2^4)</text>
<text x="420.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Многочлен f(x) = x^4 + x + 1. Автоморфізм σ розбиває поле на неперетинні класи спряженості</text>
<rect x="40.0" y="75.0" width="760.0" height="320.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<rect x="40.0" y="75.0" width="760.0" height="32.0" rx="8" fill="#eef4fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="130.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Орбіта під дією σ(x) = x^2</text>
<text x="320.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Мінімальний многочлен над F_2</text>
<text x="510.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Розмір орбіти</text>
<text x="620.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Слід Tr(β)</text>
<text x="730.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Норма N(β)</text>
