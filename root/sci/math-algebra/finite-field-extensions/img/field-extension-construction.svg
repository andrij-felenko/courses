<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгебраїчна побудова скінченного поля F_p^n як фактор-кільця F_p[x] / (f(x))</text>
<text x="420.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Многочлени довільного степеня редукуються за модулем незвідного f(x) степеня n</text>
<rect x="40.0" y="75.0" width="230.0" height="320.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<rect x="40.0" y="75.0" width="230.0" height="32.0" rx="8" fill="#eef4fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="155.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Кільце поліномів F_p[x]</text>
<text x="155.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Нескінченна множина</text>
<text x="155.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">A(x) = c_m x^m + ... + c_0</text>
<rect x="55.0" y="185.0" width="200.0" height="26.0" rx="4" fill="#f8f9fa" stroke="#7f8c8d" stroke-width="1.0"/>
<text x="155.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">c_i ∈ F_p = {0, 1, ..., p-1}</text>
<rect x="55.0" y="221.0" width="200.0" height="26.0" rx="4" fill="#f8f9fa" stroke="#7f8c8d" stroke-width="1.0"/>
<text x="155.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Степінь deg(A) ≥ 0</text>
<rect x="55.0" y="257.0" width="200.0" height="26.0" rx="4" fill="#f8f9fa" stroke="#7f8c8d" stroke-width="1.0"/>
<text x="155.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Звичайне множення поліномів</text>
<rect x="55.0" y="293.0" width="200.0" height="26.0" rx="4" fill="#f8f9fa" stroke="#7f8c8d" stroke-width="1.0"/>
<text x="155.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">deg(A · B) = deg(A) + deg(B)</text>
<rect x="55.0" y="329.0" width="200.0" height="26.0" rx="4" fill="#f8f9fa" stroke="#7f8c8d" stroke-width="1.0"/>
<text x="155.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Ділення з остачею</text>
<line x1="280.0" y1="235.0" x2="345.0" y2="235.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="280.0" y="160.0" width="65.0" height="55.0" rx="6" fill="#fdeeed" stroke="#c0392b" stroke-width="1.2"/>
<text x="312.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">mod f(x)</text>
<text x="312.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">deg(f) = n</text>
<rect x="355.0" y="75.0" width="445.0" height="320.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<rect x="355.0" y="75.0" width="445.0" height="32.0" rx="8" fill="#ebfaf0" stroke="#1e824c" stroke-width="1.2"/>
<text x="577.5" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e824c" text-anchor="middle" font-weight="700">Скінченне поле розширення F_p^n ≅ F_p[x] / (f(x))</text>
<text x="577.5" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівно p^n канонічних елементів: поліноми степеня &lt; n</text>
<rect x="375.0" y="150.0" width="405.0" height="48.0" rx="6" fill="#fef5e7" stroke="#d35400" stroke-width="1.2"/>
<text x="577.5" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="middle" font-weight="700">r(x) = a_{n-1} x^{n-1} + a_{n-2} x^{n-2} + ... + a_1 x + a_0</text>
<text x="577.5" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Кожен коефіцієнт a_i має p варіантів ⇒ разом p · p · ... · p = p^n елементів</text>
<rect x="375.0" y="210.0" width="195.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="472.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Канонічний базис над F_p</text>
<text x="472.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">B = {1, α, α^2, ..., α^{n-1}}</text>
<text x="472.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">де α = x mod f(x), f(α) = 0</text>
<text x="472.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Векторний вигляд:</text>
<text x="472.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">(a_0, a_1, ..., a_{n-1}) ∈ F_p^n</text>
<text x="472.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">Додавання: покомпонентно</text>
<rect x="580.0" y="210.0" width="200.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="680.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7d3c98" text-anchor="middle" font-weight="700">Множення та обернення</text>
<text x="680.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">a(x) · b(x) = (a·b) mod f(x)</text>
<text x="680.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">Незвідність f(x) гарантує:</text>
<text x="680.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">НСД(a(x), f(x)) = 1 для a ≠ 0</text>
<text x="680.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розширений алгоритм Евкліда:</text>
<text x="680.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">u(x)a(x) + v(x)f(x) = 1</text>
<text x="680.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d3c98" text-anchor="middle" font-weight="700">⇒ a^{-1}(x) = u(x) mod f(x)</text>
</svg>