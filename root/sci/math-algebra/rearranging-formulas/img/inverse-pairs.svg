<rect x="538.0" y="101.0" width="420.0" height="53.9" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="2.0"/><text x="748.0" y="124.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="748.0" dy="0.0">U = I · R</tspan><tspan x="748.0" dy="16.9">⟹  R = U / I</tspan></text>
<rect x="75.0" y="182.5" width="190.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="204.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">ділення на c</tspan></text>
<line x1="280.0" y1="200.0" x2="320.0" y2="200.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="325.0" y="182.5" width="190.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="204.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">множення на c</tspan></text>
<rect x="538.0" y="173.1" width="420.0" height="53.9" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="2.0"/><text x="748.0" y="196.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="748.0" dy="0.0">ρ = m / V</tspan><tspan x="748.0" dy="16.9">⟹  m = ρ · V</tspan></text>
<rect x="75.0" y="254.5" width="190.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="276.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">додавання s₀</tspan></text>
