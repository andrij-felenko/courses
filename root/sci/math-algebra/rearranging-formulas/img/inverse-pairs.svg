<rect x="325.0" y="254.5" width="190.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="276.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">віднімання s₀</tspan></text>
<rect x="538.0" y="245.1" width="420.0" height="53.9" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="2.0"/><text x="748.0" y="268.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="748.0" dy="0.0">s = s₀ + v · t</tspan><tspan x="748.0" dy="16.9">⟹  s − s₀ = v · t</tspan></text>
<rect x="75.0" y="326.5" width="190.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">квадрат</tspan></text>
<line x1="280.0" y1="344.0" x2="320.0" y2="344.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="325.0" y="326.5" width="190.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="348.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">квадратний корінь</tspan></text>
<rect x="538.0" y="317.1" width="420.0" height="53.9" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="2.0"/><text x="748.0" y="340.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="748.0" dy="0.0">E = m · v² / 2</tspan><tspan x="748.0" dy="16.9">⟹  v = √(2E / m)</tspan></text>
<rect x="75.0" y="398.5" width="190.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="420.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">степінь основи e</tspan></text>
<line x1="280.0" y1="416.0" x2="320.0" y2="416.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="325.0" y="398.5" width="190.0" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="420.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">натуральний логарифм</tspan></text>
<rect x="538.0" y="389.1" width="420.0" height="53.9" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="2.0"/><text x="748.0" y="412.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="748.0" dy="0.0">u = U₀ · e^(−t / RC)</tspan><tspan x="748.0" dy="16.9">⟹  t = R · C · ln(U₀ / u)</tspan></text>
