<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шари знімають у зворотному порядку до того, як їх наклали</text>
<text x="250.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">s = s₀ + v · t</text>
<rect x="120.0" y="138.0" width="260.0" height="204.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="250.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">+ s₀   — зовнішній шар</text>
<rect x="160.0" y="180.0" width="180.0" height="124.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/>
<text x="250.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">· v   — внутрішній</text>
<rect x="200.0" y="224.0" width="100.0" height="44.0" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="2.2"/><text x="250.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">t</tspan></text>
<text x="250.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">шукане — у самій серцевині</text>
<line x1="470.0" y1="104.0" x2="470.0" y2="380.0" stroke="#c9ced6" stroke-width="1.2" stroke-dasharray="6 6"/>
<text x="742.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">знімати — зовнішній шар першим</text>
<rect x="542.0" y="138.9" width="400.0" height="58.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="742.0" y="163.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="742.0" dy="0.0">1.  − s₀  з обох боків</tspan><tspan x="742.0" dy="18.2">s − s₀ = v · t</tspan></text>
<line x1="742.0" y1="207.1" x2="742.0" y2="242.9" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="542.0" y="252.9" width="400.0" height="58.2" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="2.2"/><text x="742.0" y="277.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="742.0" dy="0.0">2.  ÷ v  з обох боків</tspan><tspan x="742.0" dy="18.2">(s − s₀) / v = t</tspan></text>
<text x="742.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">почати з ÷ v не можна — воно зачепить і s₀</text>
</svg>