<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підступ півота: на діагоналі не можна нуль — і небажано мале число</text>
<line x1="430.0" y1="70.0" x2="430.0" y2="336.0" stroke="#e4e4e4" stroke-width="1.5"/>
<text x="225.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Нуль на діагоналі → переставити рядки</text>
<rect x="150.0" y="116.0" width="128.0" height="78.0" rx="6" fill="#fff" stroke="#c7ccd1" stroke-width="1.4"/>
<text x="172.0" y="139.2" font-family="'DejaVu Sans Mono', 'Consolas', monospace" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text>
<text x="206.0" y="139.2" font-family="'DejaVu Sans Mono', 'Consolas', monospace" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text>
<text x="172.0" y="169.2" font-family="'DejaVu Sans Mono', 'Consolas', monospace" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">3</text>
<text x="206.0" y="169.2" font-family="'DejaVu Sans Mono', 'Consolas', monospace" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1</text>
<text x="214.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">на 0 не поділиш!</text>
<line x1="286.0" y1="155.0" x2="338.0" y2="155.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="312.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">swap</text>
<rect x="348.0" y="116.0" width="128.0" height="78.0" rx="6" fill="#fff" stroke="#c7ccd1" stroke-width="1.4"/>
<text x="370.0" y="139.2" font-family="'DejaVu Sans Mono', 'Consolas', monospace" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">3</text>
<text x="404.0" y="139.2" font-family="'DejaVu Sans Mono', 'Consolas', monospace" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">1</text>
<text x="370.0" y="169.2" font-family="'DejaVu Sans Mono', 'Consolas', monospace" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text>
<text x="404.0" y="169.2" font-family="'DejaVu Sans Mono', 'Consolas', monospace" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">2</text>
<text x="412.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">тепер півот = 3</text>
<text x="660.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому беруть НАЙБІЛЬШИЙ</text>
<rect x="498.0" y="116.0" width="338.0" height="200.0" rx="10" fill="#f7f8f9" stroke="#9aa0a6" stroke-width="1.5"/>
<text x="516.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Мале число теж зле: ділення на</text>
<text x="516.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">нього роздуває похибки округлення.</text>
<text x="516.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Тому беруть найбільший доступний</text>
<text x="516.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">півот — часткове впорядкування.</text>
<text x="516.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Складність прямого ходу — O(N³),</text>
<text x="516.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">і це головна ціна великих систем.</text>
</svg>