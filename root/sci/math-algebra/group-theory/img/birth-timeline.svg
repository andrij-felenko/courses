<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="800" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Народження поняття групи: понад століття від зерна до аксіом</text>
<line x1="215.0" y1="62.0" x2="215.0" y2="626.0" stroke="#333333" stroke-width="2.5"/>
<text x="192.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="end" font-weight="700">1770–71</text>
<text x="192.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end" font-weight="700">ЗЕРНО</text>
<circle cx="215.0" cy="96.0" r="8.0" fill="#6b7280" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="223.0" y1="96.0" x2="241.0" y2="96.0" stroke="#6b7280" stroke-width="1.5"/>
<rect x="243.0" y="63.0" width="537.0" height="66.0" rx="6" fill="#f7f8fa" stroke="#6b7280" stroke-width="2.0"/><text x="511.5" y="91.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="511.5" dy="0.0">Лагранж (Joseph-Louis Lagrange) · Турин → Париж</tspan><tspan x="511.5" dy="19.5">перестановки коренів: число значень ділить n!</tspan></text>
<text x="192.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="end" font-weight="700">1831</text>
<text x="192.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">СЛОВО</text>
<circle cx="215.0" cy="202.0" r="8.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="223.0" y1="202.0" x2="241.0" y2="202.0" stroke="#6b7280" stroke-width="1.5"/>
<rect x="243.0" y="169.0" width="537.0" height="66.0" rx="6" fill="#f7f8fa" stroke="#2457d6" stroke-width="2.0"/><text x="511.5" y="197.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="511.5" dy="0.0">Галуа (Évariste Galois) · Франція</tspan><tspan x="511.5" dy="19.5">слово «groupe»; структура групи вирішує розвʼязність</tspan></text>
<text x="192.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="end" font-weight="700">1844</text>
<text x="192.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">ОКРЕМИЙ ВИПАДОК</text>
<circle cx="215.0" cy="308.0" r="8.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="223.0" y1="308.0" x2="241.0" y2="308.0" stroke="#6b7280" stroke-width="1.5"/>
<rect x="243.0" y="275.0" width="537.0" height="66.0" rx="6" fill="#f7f8fa" stroke="#2457d6" stroke-width="2.0"/><text x="511.5" y="303.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="511.5" dy="0.0">Коші (Augustin-Louis Cauchy) · Франція</tspan><tspan x="511.5" dy="19.5">теорія перестановок; доведення для симетричної Sₙ</tspan></text>
<text x="192.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="end" font-weight="700">1854</text>
<text x="192.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">ПЕРША АБСТРАКЦІЯ</text>
<circle cx="215.0" cy="414.0" r="8.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="223.0" y1="414.0" x2="241.0" y2="414.0" stroke="#6b7280" stroke-width="1.5"/>
<rect x="243.0" y="381.0" width="537.0" height="66.0" rx="6" fill="#f7f8fa" stroke="#27ae60" stroke-width="2.0"/><text x="511.5" y="409.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="511.5" dy="0.0">Кейлі (Arthur Cayley) · Англія</tspan><tspan x="511.5" dy="19.5">група як абстрактні символи з асоціативним добутком</tspan></text>
<text x="192.0" y="515.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="end" font-weight="700">1861</text>
<text x="192.0" y="535.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">ЗАГАЛЬНЕ ДОВЕДЕННЯ</text>
<circle cx="215.0" cy="520.0" r="8.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="223.0" y1="520.0" x2="241.0" y2="520.0" stroke="#6b7280" stroke-width="1.5"/>
<rect x="243.0" y="487.0" width="537.0" height="66.0" rx="6" fill="#f7f8fa" stroke="#27ae60" stroke-width="2.0"/><text x="511.5" y="515.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="511.5" dy="0.0">Жордан (Camille Jordan) · Франція</tspan><tspan x="511.5" dy="19.5">загальне доведення для будь-якої групи перестановок</tspan></text>
<text x="192.0" y="621.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="end" font-weight="700">1882</text>
<text x="192.0" y="641.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">ЧОТИРИ АКСІОМИ</text>
<circle cx="215.0" cy="626.0" r="8.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="223.0" y1="626.0" x2="241.0" y2="626.0" stroke="#6b7280" stroke-width="1.5"/>
<rect x="243.0" y="593.0" width="537.0" height="66.0" rx="6" fill="#f7f8fa" stroke="#c0392b" stroke-width="2.0"/><text x="511.5" y="621.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="511.5" dy="0.0">фон Дік і Вебер (von Dyck, Weber) · Німеччина</tspan><tspan x="511.5" dy="19.5">чотири аксіоми набувають остаточної форми</tspan></text>
</svg>