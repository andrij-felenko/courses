<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 780 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="780" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="420.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="380.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структурний міст: Гаусс → Якобі → Точки на кривих uⁿ + vⁿ = 1</text>
<rect x="30.0" y="55.0" width="210.0" height="125.0" rx="6" fill="#dbeafe" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle"><tspan x="135.0" dy="0.0">1. Суми Гаусса g(χ, ψ)</tspan><tspan x="135.0" dy="13.0"></tspan><tspan x="135.0" dy="13.0">Характери: χ₁, χ₂ ∈ X(𝔽_q*)</tspan><tspan x="135.0" dy="13.0">Сума: g(χ, ψ) = ∑ χ(x)ψ(x)</tspan><tspan x="135.0" dy="13.0">Модуль: |g(χ, ψ)| = √q</tspan></text>
<line x1="240.0" y1="117.0" x2="270.0" y2="117.0" stroke="#333333" stroke-width="2.0"/>
<line x1="264.0" y1="112.0" x2="270.0" y2="117.0" stroke="#333333" stroke-width="2.0"/>
<line x1="264.0" y1="122.0" x2="270.0" y2="117.0" stroke="#333333" stroke-width="2.0"/>
<rect x="238.0" y="92.0" width="34.0" height="18.0" rx="6" fill="#eff6ff" stroke="#333333" stroke-width="1.5"/><text x="255.0" y="104.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">g₁g₂/g₁₂</tspan></text>
<rect x="270.0" y="55.0" width="220.0" height="125.0" rx="6" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="91.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b21a8" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">2. Суми Якобі J(χ₁, χ₂)</tspan><tspan x="380.0" dy="11.7"></tspan><tspan x="380.0" dy="11.7">Формула: J = ∑_{u+v=1} χ₁(u)χ₂(v)</tspan><tspan x="380.0" dy="11.7">Факторизація:</tspan><tspan x="380.0" dy="11.7">J(χ₁, χ₂) = g(χ₁)g(χ₂) / g(χ₁χ₂)</tspan><tspan x="380.0" dy="11.7">Модуль: |J| = √q</tspan></text>
<line x1="490.0" y1="117.0" x2="520.0" y2="117.0" stroke="#333333" stroke-width="2.0"/>
<line x1="514.0" y1="112.0" x2="520.0" y2="117.0" stroke="#333333" stroke-width="2.0"/>
<line x1="514.0" y1="122.0" x2="520.0" y2="117.0" stroke="#333333" stroke-width="2.0"/>
<rect x="488.0" y="92.0" width="34.0" height="18.0" rx="6" fill="#faf5ff" stroke="#333333" stroke-width="1.5"/><text x="505.0" y="104.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b21a8" text-anchor="middle" font-weight="700"><tspan x="505.0" dy="0.0">∑ J(χⁱ,χʲ)</tspan></text>
<rect x="520.0" y="55.0" width="210.0" height="125.0" rx="6" fill="#dcfce7" stroke="#333333" stroke-width="1.5"/><text x="625.0" y="91.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">3. Кількість точок N</tspan><tspan x="625.0" dy="11.7"></tspan><tspan x="625.0" dy="11.7">Рівняння: xⁿ + yⁿ = 1 в 𝔽_q</tspan><tspan x="625.0" dy="11.7">Формула розв'язків:</tspan><tspan x="625.0" dy="11.7">N = q + ∑_{i,j=1}^{n-1} J(χⁱ, χʲ)</tspan><tspan x="625.0" dy="11.7">Точна оцінка Вейля</tspan></text>
<rect x="30.0" y="200.0" width="700.0" height="200.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<rect x="50.0" y="212.0" width="660.0" height="28.0" rx="6" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="229.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Математичний зв'язок та оцінки відхилення від головного члена q</tspan></text>
<rect x="45.0" y="250.0" width="325.0" height="135.0" rx="6" fill="#fef2f2" stroke="#333333" stroke-width="1.5"/><text x="207.5" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle"><tspan x="207.5" dy="0.0">Головний член та залишок:</tspan><tspan x="207.5" dy="13.0">Головний внесок у N дають тривіальні</tspan><tspan x="207.5" dy="13.0">компоненти: q точок.</tspan><tspan x="207.5" dy="13.0">Залишковий член складається з (n-1)²</tspan><tspan x="207.5" dy="13.0">сум Якобі J(χⁱ, χʲ).</tspan></text>
<rect x="390.0" y="250.0" width="325.0" height="135.0" rx="6" fill="#f0fdf4" stroke="#333333" stroke-width="1.5"/><text x="552.5" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="552.5" dy="0.0">Точна оцінка Гіпотези Вейля:</tspan><tspan x="552.5" dy="13.0">Оскільки кожна ненульова сума має |J| = √q,</tspan><tspan x="552.5" dy="13.0">маємо точну межу відхилення:</tspan><tspan x="552.5" dy="13.0">|N - q| ≤ (n - 1)(n - 2) √q</tspan><tspan x="552.5" dy="13.0">для гладких кривих рода g = (n-1)(n-2)/2!</tspan></text>
</svg>