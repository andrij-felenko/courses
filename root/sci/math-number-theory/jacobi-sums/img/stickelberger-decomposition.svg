<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -10 790 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-25" y="-10" width="790" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="740.0" height="390.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="370.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розклад Штікельберга ідеалу (J(χᵃ, χᵇ)) у круговому полі ℤ[ζ_p]</text>
<rect x="40.0" y="55.0" width="660.0" height="60.0" rx="6" fill="#dbeafe" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="81.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Головний ідеал суми Якобі в кільці цілих кругового поля ℤ[ζ_p]:</tspan><tspan x="370.0" dy="14.3">(J(χᵃ, χᵇ)) = ∏_{t ∈ (ℤ/pℤ)*} (𝔭_t)^{γ(t)}</tspan></text>
<line x1="370.0" y1="115.0" x2="370.0" y2="125.0" stroke="#333333" stroke-width="2.0"/>
<line x1="370.0" y1="149.0" x2="370.0" y2="165.0" stroke="#333333" stroke-width="2.0"/>
<line x1="365.0" y1="158.0" x2="370.0" y2="165.0" stroke="#333333" stroke-width="2.0"/>
<line x1="375.0" y1="158.0" x2="370.0" y2="165.0" stroke="#333333" stroke-width="2.0"/>
<rect x="240.0" y="125.0" width="260.0" height="24.0" rx="6" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="140.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b21a8" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Показник γ(t) за теоремою Штікельбергера</tspan></text>
<rect x="40.0" y="175.0" width="205.0" height="115.0" rx="6" fill="#fef3c7" stroke="#333333" stroke-width="1.5"/><text x="130.5" y="218.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#92400e" text-anchor="middle"><tspan x="130.5" dy="0.0">1. Суми p-адичних цифр:</tspan><tspan x="130.5" dy="11.7">s_p(k)</tspan><tspan x="130.5" dy="11.7"></tspan><tspan x="130.5" dy="11.7">Сума цифр числа k у p-адичній системі числення</tspan></text>
<rect x="265.0" y="175.0" width="210.0" height="115.0" rx="6" fill="#dcfce7" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="218.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">2. Перенесення розрядів:</tspan><tspan x="370.0" dy="11.7">γ(t) = ⌊(⟨t·a⟩ + ⟨t·b⟩)/p⌋</tspan><tspan x="370.0" dy="11.7"></tspan><tspan x="370.0" dy="11.7">Число перенесень одиниці при додаванні t·a + t·b mod p</tspan></text>
<rect x="495.0" y="175.0" width="205.0" height="115.0" rx="6" fill="#e0e7ff" stroke="#333333" stroke-width="1.5"/><text x="597.5" y="218.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#3730a3" text-anchor="middle"><tspan x="597.5" dy="0.0">3. Норма ідеалу:</tspan><tspan x="597.5" dy="11.7">Norm((J)) = p^{s_p(a)+s_p(b)-s_p(a+b)}</tspan><tspan x="597.5" dy="11.7"></tspan><tspan x="597.5" dy="11.7">Точний p-адичний нормалізований модуль</tspan></text>
<rect x="40.0" y="305.0" width="660.0" height="65.0" rx="6" fill="#faf5ff" stroke="#c084fc" stroke-width="1.2"/>
<text x="370.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b21a8" text-anchor="middle" font-weight="700">Значення для законів взаємності та тесту простоти APR-CL:</text>
<text x="370.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Факторизація Штікельбергера визначає точні лишкові степіні у кругових полях ℚ(ζ_m),
що дозволяє будувати квазіполіноміальний детермінований тест простоти!</text>
</svg>