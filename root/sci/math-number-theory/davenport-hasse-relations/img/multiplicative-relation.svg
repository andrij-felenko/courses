<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 760 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="760" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="740.0" height="380.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="370.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мультиплікативне співвідношення Девенпорта–Хассе (m | q - 1)</text>
<rect x="40.0" y="55.0" width="660.0" height="60.0" rx="6" fill="#dbeafe" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="81.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Ліва частина: Добуток m сум Гаусса зі зсувом характерів на θᵃ (орбіта порядків m)</tspan><tspan x="370.0" dy="14.3">∏_{a=0}^{m-1} g(χ · θᵃ, ψ) = g(χ, ψ) · g(χ·θ, ψ) · ... · g(χ·θᵐ⁻¹, ψ)</tspan></text>
<line x1="370.0" y1="115.0" x2="370.0" y2="160.0" stroke="#333333" stroke-width="2.0"/>
<line x1="365.0" y1="153.0" x2="370.0" y2="160.0" stroke="#333333" stroke-width="2.0"/>
<line x1="375.0" y1="153.0" x2="370.0" y2="160.0" stroke="#333333" stroke-width="2.0"/>
<rect x="240.0" y="125.0" width="260.0" height="24.0" rx="6" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="158.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b21a8" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">Тотожність Девенпорта–Хассе</tspan></text>
<rect x="40.0" y="175.0" width="205.0" height="110.0" rx="6" fill="#fef3c7" stroke="#333333" stroke-width="1.5"/><text x="142.5" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle"><tspan x="142.5" dy="0.0">1. Зсув аргументу:</tspan><tspan x="142.5" dy="13.0">χ(m⁻ᵐ)</tspan><tspan x="142.5" dy="13.0"></tspan><tspan x="142.5" dy="13.0">Характер χ від скаляра m⁻ᵐ в 𝔽_q*</tspan></text>
<rect x="265.0" y="175.0" width="210.0" height="110.0" rx="6" fill="#dcfce7" stroke="#333333" stroke-width="1.5"/><text x="370.0" y="215.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">2. Згорнута сума:</tspan><tspan x="370.0" dy="11.7">g(χᵐ, ψ)</tspan><tspan x="370.0" dy="11.7"></tspan><tspan x="370.0" dy="11.7">Сума Гаусса від m-го степеня характеру χ</tspan></text>
<rect x="495.0" y="175.0" width="205.0" height="110.0" rx="6" fill="#e0e7ff" stroke="#333333" stroke-width="1.5"/><text x="597.5" y="215.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#3730a3" text-anchor="middle"><tspan x="597.5" dy="0.0">3. Нормувальний константний добуток:</tspan><tspan x="597.5" dy="11.7">∏_{a=1}^{m-1} g(θᵃ, ψ)</tspan><tspan x="597.5" dy="11.7"></tspan><tspan x="597.5" dy="11.7">Добуток нетривіальних m-сум</tspan></text>
<rect x="40.0" y="300.0" width="660.0" height="60.0" rx="6" fill="#faf5ff" stroke="#c084fc" stroke-width="1.2"/>
<text x="370.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b21a8" text-anchor="middle" font-weight="700">Аналогія з формулою множення Гаусса для Γ-функції Ейлера:</text>
<text x="370.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">∏_{k=0}^{m-1} Γ((x + k)/m) = (2π)^{(m-1)/2} · m^{1/2 - x} · Γ(x)   ↔   Суми Гаусса як p-адичні Γ-значення</text>
</svg>