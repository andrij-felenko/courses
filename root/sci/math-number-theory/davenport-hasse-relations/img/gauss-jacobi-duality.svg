<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 780 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="780" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="420.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="380.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трансляція: Суми Гаусса → Суми Якобі → Точки на алгебраїчних кривих</text>
<rect x="30.0" y="55.0" width="210.0" height="115.0" rx="6" fill="#dbeafe" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle"><tspan x="135.0" dy="0.0">1. Суми Гаусса g(χ, ψ)</tspan><tspan x="135.0" dy="13.0"></tspan><tspan x="135.0" dy="13.0">Об'єкти на 𝔽_qˢ.</tspan><tspan x="135.0" dy="13.0">Підйом через Девенпорт–Хассе:</tspan><tspan x="135.0" dy="13.0">g(χ', ψ') = (-1)ˢ⁻¹ g(χ, ψ)ˢ</tspan></text>
<line x1="240.0" y1="112.0" x2="270.0" y2="112.0" stroke="#333333" stroke-width="2.0"/>
<line x1="264.0" y1="107.0" x2="270.0" y2="112.0" stroke="#333333" stroke-width="2.0"/>
<line x1="264.0" y1="117.0" x2="270.0" y2="112.0" stroke="#333333" stroke-width="2.0"/>
<rect x="270.0" y="55.0" width="220.0" height="115.0" rx="6" fill="#f3e8ff" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="83.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b21a8" text-anchor="middle"><tspan x="380.0" dy="0.0">2. Суми Якобі J(χ₁, χ₂)</tspan><tspan x="380.0" dy="13.0"></tspan><tspan x="380.0" dy="13.0">Факторизація через Гаусса:</tspan><tspan x="380.0" dy="13.0">J = g(χ₁)g(χ₂) / g(χ₁χ₂)</tspan><tspan x="380.0" dy="13.0">Підйом:</tspan><tspan x="380.0" dy="13.0">J' = (-1)ˢ⁻¹ Jˢ</tspan></text>
<line x1="490.0" y1="112.0" x2="520.0" y2="112.0" stroke="#333333" stroke-width="2.0"/>
<line x1="514.0" y1="107.0" x2="520.0" y2="112.0" stroke="#333333" stroke-width="2.0"/>
<line x1="514.0" y1="117.0" x2="520.0" y2="112.0" stroke="#333333" stroke-width="2.0"/>
<rect x="520.0" y="55.0" width="210.0" height="115.0" rx="6" fill="#dcfce7" stroke="#333333" stroke-width="1.5"/><text x="625.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">3. Точки на кривих N_s</tspan><tspan x="625.0" dy="13.0"></tspan><tspan x="625.0" dy="13.0">Розв'язки xⁿ + yⁿ = 1 в 𝔽_qˢ:</tspan><tspan x="625.0" dy="13.0">N_s = qˢ + 1 + ∑ α_iˢ</tspan><tspan x="625.0" dy="13.0">α_i — власні значення</tspan></text>
<rect x="30.0" y="195.0" width="700.0" height="205.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<rect x="50.0" y="205.0" width="660.0" height="28.0" rx="6" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="222.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Наслідки для Діофантової геометрії та Дзета-функції Вейля Z(T)</tspan></text>
<rect x="45.0" y="245.0" width="325.0" height="140.0" rx="6" fill="#fef2f2" stroke="#333333" stroke-width="1.5"/><text x="207.5" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle"><tspan x="207.5" dy="0.0">Раціональність Дзета-функції:</tspan><tspan x="207.5" dy="13.0">Формула підйому гарантує,</tspan><tspan x="207.5" dy="13.0">що N_s є сумою s-х степенів</tspan><tspan x="207.5" dy="13.0">скінченного числа чисел α_i.</tspan><tspan x="207.5" dy="13.0">Звідси Z(T) = P(T) / ((1-T)(1-qT))</tspan><tspan x="207.5" dy="13.0">є раціональною функцією!</tspan></text>
<rect x="390.0" y="245.0" width="325.0" height="140.0" rx="6" fill="#f0fdf4" stroke="#333333" stroke-width="1.5"/><text x="552.5" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle"><tspan x="552.5" dy="0.0">Гіпотеза Рімана (Вейль):</tspan><tspan x="552.5" dy="13.0">Модуль суми Гаусса |g(χ, ψ)| = √q</tspan><tspan x="552.5" dy="13.0">задає величину власних значень:</tspan><tspan x="552.5" dy="13.0">|α_i| = q¹/²</tspan><tspan x="552.5" dy="13.0">Це доводить аналог Гіпотези</tspan><tspan x="552.5" dy="13.0">Рімана для кривих над 𝔽_q!</tspan></text>
</svg>