<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація модулів за існуванням первісного кореня</text>
<text x="480.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Теорема Ґаусса: які модулі n мають первісний корінь?</text>
<text x="480.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Група лишків (ℤ/nℤ)* є циклічною лише для чотирьох класів чисел</text>
<rect x="35.0" y="95.0" width="410.0" height="365.0" rx="10" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="240.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">Первісний корінь ІСНУЄ</text>
<text x="240.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Група (ℤ/nℤ)* є циклічною</text>
<rect x="50.0" y="170.0" width="380.0" height="54.0" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="63.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">n = 2</text>
<text x="63.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">φ(2) = 1, g = 1</text>
<text x="417.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">n = 2</text>
<rect x="50.0" y="234.0" width="380.0" height="54.0" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="63.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">n = 4</text>
<text x="63.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">φ(4) = 2, g = 3</text>
<text x="417.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">n = 4</text>
<rect x="50.0" y="298.0" width="380.0" height="54.0" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="63.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">n = pᵏ</text>
<text x="63.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">p — непарне просте, k ≥ 1</text>
<text x="417.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">n = 3, 5, 7, 9, 11, 13, 25...</text>
<rect x="50.0" y="362.0" width="380.0" height="54.0" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.2"/>
<text x="63.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">n = 2·pᵏ</text>
<text x="63.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">подвоєний степінь</text>
<text x="417.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">n = 6, 10, 14, 18, 22, 26, 50...</text>
<rect x="505.0" y="95.0" width="430.0" height="365.0" rx="10" fill="#fef2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="720.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">Первісного кореня НЕ ІСНУЄ</text>
<text x="720.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Група не циклічна, λ(n) &lt; φ(n)</text>
<rect x="520.0" y="170.0" width="400.0" height="74.0" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
<text x="533.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">n = 2ᵏ при k ≥ 3</text>
<text x="533.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">8, 16, 32, 64...</text>
<text x="533.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">4 корені з 1; λ(2ᵏ) = 2ᵏ⁻² = φ(2ᵏ)/2</text>
<rect x="520.0" y="256.0" width="400.0" height="74.0" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
<text x="533.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">n = pᵏ · qᵐ · ...</text>
<text x="533.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">15, 21, 33, 35...</text>
<text x="533.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Два непарних простих; λ(n) &lt; φ(n)</text>
<rect x="520.0" y="342.0" width="400.0" height="74.0" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
<text x="533.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">n = 2ᵐ · pᵏ · ... (m≥2)</text>
<text x="533.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">12, 20, 24, 40...</text>
<text x="533.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Парний модуль з непарним множником</text>
</svg>