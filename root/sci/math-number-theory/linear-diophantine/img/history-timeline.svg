<text x="305.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">Чжан Цюцзянь</text>
<text x="305.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="305.0" dy="0.0">≈ V ст., Китай</tspan><tspan x="305.0" dy="18.1">«сто птахів»:</tspan><tspan x="305.0" dy="18.1">7x + 4y = 100</tspan></text>
