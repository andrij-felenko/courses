<text x="815.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Баше де Мезіріак</text>
<text x="815.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="815.0" dy="0.0">1621 / 1624, Європа</tspan><tspan x="815.0" dy="18.1">переклав Діофанта;</tspan><tspan x="815.0" dy="18.1">метод ax − by = 1</tspan></text>
