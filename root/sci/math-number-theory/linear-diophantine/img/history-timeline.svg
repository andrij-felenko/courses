<text x="600.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="600.0" dy="0.0">628, Індія</tspan><tspan x="600.0" dy="18.1">розвинув</tspan><tspan x="600.0" dy="18.1">і узагальнив</tspan></text>
<circle cx="815.0" cy="300.0" r="8.0" fill="#c0392b" stroke="#ffffff" stroke-width="2.0"/>
