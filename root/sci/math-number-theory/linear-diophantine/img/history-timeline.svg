<text x="150.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Діофант</text>
<text x="150.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="150.0" dy="0.0">III ст. н.е.</tspan><tspan x="150.0" dy="18.1">Александрія:</tspan><tspan x="150.0" dy="18.1">приклади + символіка</tspan></text>
<circle cx="305.0" cy="300.0" r="8.0" fill="#6b7280" stroke="#ffffff" stroke-width="2.0"/>
