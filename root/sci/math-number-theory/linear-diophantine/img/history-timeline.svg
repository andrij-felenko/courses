<text x="460.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Аріабгата</text>
<text x="460.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="460.0" dy="0.0">499, Індія</tspan><tspan x="460.0" dy="18.1">перший загальний</tspan><tspan x="460.0" dy="18.1">метод «кут-така»</tspan></text>
