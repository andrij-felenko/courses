<text x="985.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">П'єр Ферма</text>
<text x="985.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="985.0" dy="0.0">≈ 1637</tspan><tspan x="985.0" dy="18.1">нотатки на полях</tspan><tspan x="985.0" dy="18.1">«Арифметики»</tspan></text>
<rect x="150.0" y="548.0" width="880.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="590.0" y="573.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Зелене — справжній загальний метод (Індія).   Синє — окремі приклади й символіка (Діофант).   Червоне — незалежне перевідкриття в Європі (Баше).</tspan></text>
