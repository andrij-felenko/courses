<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розв'язник  a·x + b·y = c:  від входу до переліку</text>
<rect x="60.0" y="62.0" width="380.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="250.0" y="88.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">вхід:  цілі  a, b, c</tspan></text>
<rect x="60.0" y="128.0" width="380.0" height="44.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="1.8"/><text x="250.0" y="154.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">a = 0  і  b = 0 ?</tspan></text>
<rect x="60.0" y="196.0" width="380.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="250.0" y="217.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">d = НСД(a, b),  розшир. Евклід:</tspan><tspan x="250.0" dy="17.6">x₀, y₀ :  a·x₀ + b·y₀ = d</tspan></text>
<rect x="60.0" y="284.0" width="380.0" height="44.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="1.8"/><text x="250.0" y="310.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">d  ділить  c ?</tspan></text>
<rect x="60.0" y="356.0" width="380.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="250.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">один розв'язок:</tspan><tspan x="250.0" dy="17.6">x₁ = x₀·(c/d),   y₁ = y₀·(c/d)</tspan></text>
<rect x="60.0" y="444.0" width="380.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="250.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">уся родина:</tspan><tspan x="250.0" dy="17.6">x = x₁ + (b/d)·t,   y = y₁ − (a/d)·t</tspan></text>
<rect x="60.0" y="530.0" width="380.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="250.0" y="556.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">зведення:   t  →  найменший  | x |</tspan></text>
<rect x="60.0" y="598.0" width="380.0" height="52.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="1.8"/><text x="250.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">вікно t:  x ≥ 0  і  y ≥ 0</tspan><tspan x="250.0" dy="17.6">→  перелік невід'ємних</tspan></text>
<rect x="530.0" y="124.0" width="330.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="695.0" y="146.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">так, c = 0  →  уся площина</tspan><tspan x="695.0" dy="16.2">так, c ≠ 0  →  немає розв'язку</tspan></text>
<rect x="530.0" y="284.0" width="330.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="695.0" y="310.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">ні   →   немає розв'язку</tspan></text>
<rect x="530.0" y="598.0" width="330.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/><text x="695.0" y="620.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">a чи b = 0, або різні знаки</tspan><tspan x="695.0" dy="16.2">→  нескінченно багато</tspan></text>
<line x1="250.0" y1="106.0" x2="250.0" y2="128.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="250.0" y1="172.0" x2="250.0" y2="196.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="250.0" y1="248.0" x2="250.0" y2="284.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="250.0" y1="328.0" x2="250.0" y2="356.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="250.0" y1="408.0" x2="250.0" y2="444.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="250.0" y1="496.0" x2="250.0" y2="530.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="250.0" y1="574.0" x2="250.0" y2="598.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="440.0" y1="150.0" x2="530.0" y2="150.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="485.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">так</text>
<line x1="440.0" y1="306.0" x2="530.0" y2="306.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="485.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">ні</text>
<line x1="440.0" y1="624.0" x2="530.0" y2="624.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="485.0" y="616.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">інакше</text>
</svg>