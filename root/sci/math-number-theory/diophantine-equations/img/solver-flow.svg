<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розв'язник  a·x + b·y = c:  від входу до переліку</text>
<rect x="60.0" y="40.0" width="380.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="250.0" y="66.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">вхід:  цілі  a, b, c</tspan></text>
<rect x="60.0" y="106.0" width="380.0" height="44.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="1.8"/>
<text x="250.0" y="132.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">a = 0  і  b = 0 ?</tspan></text>
<rect x="60.0" y="170.0" width="380.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="250.0" y="191.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">d = НСД(a, b),  розшир. Евклід:</tspan><tspan x="250.0" dy="17.6">x₀, y₀ :  a·x₀ + b·y₀ = d</tspan></text>
<rect x="60.0" y="262.0" width="380.0" height="44.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="1.8"/>
<text x="250.0" y="288.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">d  ділить  c ?</tspan></text>
<rect x="60.0" y="330.0" width="380.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="250.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">один розв'язок:</tspan><tspan x="250.0" dy="17.6">x₁ = x₀·(c/d),   y₁ = y₀·(c/d)</tspan></text>
<rect x="60.0" y="418.0" width="380.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="250.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">уся родина:</tspan><tspan x="250.0" dy="17.6">x = x₁ + (b/d)·t,   y = y₁ − (a/d)·t</tspan></text>
<rect x="60.0" y="508.0" width="380.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="250.0" y="534.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">зведення:   t  →  найменший  | x |</tspan></text>
<rect x="60.0" y="572.0" width="380.0" height="52.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="1.8"/>
<text x="250.0" y="594.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">вікно t:  x ≥ 0  і  y ≥ 0</tspan><tspan x="250.0" dy="17.6">→  перелік невід'ємних</tspan></text>
<rect x="530.0" y="98.0" width="330.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="695.0" y="120.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">так, c = 0  →  уся площина</tspan><tspan x="695.0" dy="16.2">так, c ≠ 0  →  немає розв'язку</tspan></text>
<rect x="530.0" y="262.0" width="330.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="695.0" y="288.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">ні   →   немає розв'язку</tspan></text>
<rect x="530.0" y="572.0" width="330.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="695.0" y="594.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">a чи b = 0, або різні знаки</tspan><tspan x="695.0" dy="16.2">→  нескінченно багато</tspan></text>
<line x1="250.0" y1="84.0" x2="250.0" y2="106.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="250.0" y1="150.0" x2="250.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="250.0" y1="222.0" x2="250.0" y2="262.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="250.0" y1="306.0" x2="250.0" y2="330.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="250.0" y1="382.0" x2="250.0" y2="418.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="250.0" y1="470.0" x2="250.0" y2="508.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="250.0" y1="552.0" x2="250.0" y2="572.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="440.0" y1="128.0" x2="530.0" y2="128.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="485.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">так</text>
<line x1="440.0" y1="284.0" x2="530.0" y2="284.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="485.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">ні</text>
<line x1="440.0" y1="598.0" x2="530.0" y2="598.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="485.0" y="590.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">інакше</text>
</svg>