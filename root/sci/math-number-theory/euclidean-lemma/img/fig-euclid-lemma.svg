<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 610 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="610" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="300.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лема Евкліда та її наслідок</text>
<rect x="190.2" y="53.9" width="219.5" height="52.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="300.0" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">p | a · b</tspan><tspan x="300.0" dy="18.2">(просте p ділить добуток)</tspan></text>
<rect x="118.3" y="163.0" width="63.4" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="184.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">p | a</tspan></text>
<rect x="418.3" y="163.0" width="63.4" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="184.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">p | b</tspan></text>
<text x="300.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">АБО</text>
<line x1="300.0" y1="110.0" x2="150.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="300.0" y1="110.0" x2="450.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Доведення (якщо p ∤ a):</text>
<text x="300.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">gcd(p, a) = 1  ⇒  p·x + a·y = 1</text>
<text x="300.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">множимо на b  ⇒  p·b·x + a·b·y = b</text>
<text x="300.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">p ділить ліву частину, отже p | b</text>
</svg>