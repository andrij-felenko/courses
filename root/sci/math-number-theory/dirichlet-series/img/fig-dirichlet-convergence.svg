<text x="350.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b45309" text-anchor="middle" font-weight="700">σ_c</text>
<text x="350.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle">абсциса збіжності</text>
<text x="550.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#047857" text-anchor="middle" font-weight="700">σ_a</text>
<text x="550.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle">абсциса абсол. збіжності</text>
