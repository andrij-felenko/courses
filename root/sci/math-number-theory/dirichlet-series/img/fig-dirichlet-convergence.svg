<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 838.18 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="838.18" height="470" fill="#ffffff"/>
