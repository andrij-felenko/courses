<rect x="549.4" y="113.4" width="191.1" height="63.2" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="645.0" y="133.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#065f46" text-anchor="middle" font-weight="700"><tspan x="645.0" dy="0.0">Абсолютна та рівномірна</tspan><tspan x="645.0" dy="15.6">збіжність ряду</tspan><tspan x="645.0" dy="15.6">Re(s) &gt; σ_a</tspan></text>
<rect x="376.8" y="113.4" width="146.5" height="63.2" rx="6" fill="#fef9c3" stroke="#d97706" stroke-width="1.5"/><text x="450.0" y="133.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Умовна збіжність</tspan><tspan x="450.0" dy="15.6">σ_c &lt; Re(s) ≤ σ_a</tspan><tspan x="450.0" dy="15.6">(коли σ_a ≠ σ_c)</tspan></text>
<rect x="170.6" y="105.6" width="168.8" height="78.8" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="255.0" y="125.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">Область розбіжності</tspan><tspan x="255.0" dy="15.6">Re(s) ≤ σ_c</tspan><tspan x="255.0" dy="15.6">(потрібне аналітичне</tspan><tspan x="255.0" dy="15.6">продовження)</tspan></text>
