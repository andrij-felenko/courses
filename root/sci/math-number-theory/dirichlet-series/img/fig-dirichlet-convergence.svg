<text x="400.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Області збіжності ряду Діріхле</text>
<rect x="0.0" y="0.0" width="800.0" height="450.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="400.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#0f172a" text-anchor="middle" font-weight="700">Області збіжності ряду Діріхле в комплексній площині s = σ + i·t</text>
