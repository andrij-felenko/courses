<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 295" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="295" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Карта аналітичних меж та результатів для рівняння Нагеля-Люнггрена</text>
<rect x="200.0" y="15.0" width="400.0" height="45.0" rx="6" fill="#f8f9fa" stroke="#343a40" stroke-width="1.5"/>
<text x="400.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#212529" text-anchor="middle" font-weight="700">Структура аналітичних та ефективних меж</text>
<rect x="30.0" y="80.0" width="230.0" height="120.0" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="145.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1864ab" text-anchor="middle" font-weight="700">Результат Люнггрена (1943)</text>
<text x="145.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1c7ed6" text-anchor="middle" font-weight="700">Випадок q = 2 (квадрати)</text>
<text x="145.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Повне розв'язання:</text>
<text x="145.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1864ab" text-anchor="middle" font-weight="700">лише (3, 5, 11) та (7, 4, 20)</text>
<text x="145.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">інших точних квадратів немає</text>
<rect x="285.0" y="80.0" width="230.0" height="120.0" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/>
<text x="400.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e67700" text-anchor="middle" font-weight="700">Метод Бейкера (1966+)</text>
<text x="400.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d9480f" text-anchor="middle" font-weight="700">Лінійні форми логарифмів</text>
<text x="400.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Верхні межі: q &lt; C₁(x), n &lt; C₂</text>
<text x="400.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d9480f" text-anchor="middle" font-weight="700">Скінченність кількості</text>
<text x="400.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">розв'язків для фіксованого x</text>
<rect x="540.0" y="80.0" width="230.0" height="120.0" rx="6" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="655.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2b8a3e" text-anchor="middle" font-weight="700">Бюжо, Міньотт, Анро (2001+)</text>
<text x="655.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2b8a3e" text-anchor="middle" font-weight="700">Модулярні методи та Галуа</text>
<text x="655.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Явні числові межі для q</text>
<text x="655.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2b8a3e" text-anchor="middle" font-weight="700">Доведення відсутності розв'язків</text>
<text x="655.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">при x ≡ 1 (mod q) та n ≡ 1</text>
<rect x="120.0" y="220.0" width="560.0" height="50.0" rx="6" fill="#f1f3f5" stroke="#adb5bd" stroke-width="1.2"/>
<text x="400.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#343a40" text-anchor="middle" font-weight="700">Сучасний статус: гіпотеза доведена для багатьох класів (q=2, фіксовані x, n),</text>
<text x="400.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle">але загальний випадок досі чекає повного аналітичного доведення</text>
</svg>