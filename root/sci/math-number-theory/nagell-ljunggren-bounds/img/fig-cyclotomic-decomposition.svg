<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розклад реп'юніта на кругові многочлени та примітивні прості дільники</text>
<rect x="230.0" y="15.0" width="340.0" height="50.0" rx="6" fill="#f3f0ff" stroke="#7950f2" stroke-width="1.8"/>
<text x="400.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#5f3dc4" text-anchor="middle" font-weight="700">Реп'юніт N_n(x) = (xⁿ - 1) / (x - 1)</text>
<text x="400.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7950f2" text-anchor="middle">Сума степеней: 1 + x + x² + ... + xⁿ⁻¹</text>
<line x1="320.0" y1="65.0" x2="180.0" y2="110.0" stroke="#7950f2" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="400.0" y1="65.0" x2="400.0" y2="110.0" stroke="#7950f2" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="480.0" y1="65.0" x2="620.0" y2="110.0" stroke="#7950f2" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="50.0" y="110.0" width="260.0" height="95.0" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="180.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1864ab" text-anchor="middle" font-weight="700">Кругові многочлени Φ_d(x)</text>
<text x="180.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1c7ed6" text-anchor="middle" font-weight="700">N_n(x) = ∏_{d|n, d&gt;1} Φ_d(x)</text>
<text x="180.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Розклад на взаємно прості або</text>
<text x="180.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">слабко пов'язані множники</text>
<rect x="330.0" y="110.0" width="140.0" height="95.0" rx="6" fill="#fff4e6" stroke="#fd7e14" stroke-width="1.5"/>
<text x="400.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d9480f" text-anchor="middle" font-weight="700">Теорема Зігмонді</text>
<text x="400.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e8590c" text-anchor="middle" font-weight="700">Примітивний дільник p</text>
<text x="400.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">p | (xⁿ - 1), p ∤ (xᵏ - 1)</text>
<text x="400.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d9480f" text-anchor="middle" font-weight="700">p ≡ 1 (mod n)</text>
<rect x="490.0" y="110.0" width="260.0" height="95.0" rx="6" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="620.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2b8a3e" text-anchor="middle" font-weight="700">Вимога точного степеня y^q</text>
<text x="620.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Кожен простий множник p | N_n(x)</text>
<text x="620.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2b8a3e" text-anchor="middle" font-weight="700">входить з показником, кратним q</text>
<text x="620.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">НСД(Φ_d, Φ_k) ділить n</text>
<rect x="80.0" y="225.0" width="640.0" height="50.0" rx="6" fill="#fff0f6" stroke="#e64980" stroke-width="1.5"/>
<text x="400.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c2255c" text-anchor="middle" font-weight="700">Жорстке арифметичне обмеження:</text>
<text x="400.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#a61e4d" text-anchor="middle">Множники Φ_d(x) повинні бути майже точними q-ми степенями, що неможливо при n ≥ 3</text>
</svg>