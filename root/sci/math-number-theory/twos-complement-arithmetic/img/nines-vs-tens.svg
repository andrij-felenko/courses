<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">547 − 218 двома доповненнями: куди подіти зайву одиницю</text>
<text x="510.0" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">обидва шляхи дають 329 — різниця лише в тому, що робити з переносом, який виліз за розрядну сітку</text>
<rect x="42.0" y="92.0" width="448.0" height="388.0" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="266.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">Доповнення до дев'ятки</text>
<text x="266.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">999 − 218 = 781   (кожна цифра — до 9, без позик)</text>
<text x="160.0" y="184.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">   547</text>
<text x="160.0" y="214.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700"> + 781</text>
<line x1="88.0" y1="228.0" x2="278.0" y2="228.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="160.0" y="256.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">  1328</text>
<text x="304.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">перенос виліз</text>
<line x1="300.0" y1="252.0" x2="170.0" y2="248.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="160.0" y="300.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">   328</text>
<text x="160.0" y="328.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700"> +   1</text>
<line x1="88.0" y1="342.0" x2="278.0" y2="342.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="160.0" y="370.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="20" fill="#27ae60" text-anchor="middle" font-weight="700">   329</text>
<text x="304.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">і повертається</text>
<text x="304.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">у молодший розряд</text>
<rect x="66.0" y="392.0" width="400.0" height="72.0" rx="6" fill="#fdf3e3" stroke="#333333" stroke-width="1.5"/><text x="266.0" y="416.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="266.0" dy="0.0">Кінцевий перенос: одиницю не викидають,</tspan><tspan x="266.0" dy="16.2">а доливають назад у молодший розряд —</tspan><tspan x="266.0" dy="16.2">це ще одне повне додавання.</tspan></text>
<rect x="530.0" y="92.0" width="448.0" height="388.0" rx="10" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="754.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">Доповнення до десятки</text>
<text x="754.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">1000 − 218 = 782   (та сама дев'ятка, вже з +1)</text>
<text x="648.0" y="184.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">   547</text>
<text x="648.0" y="214.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700"> + 782</text>
<line x1="576.0" y1="228.0" x2="766.0" y2="228.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="648.0" y="256.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">  1329</text>
<text x="792.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">перенос</text>
<text x="792.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">просто зникає</text>
<line x1="788.0" y1="252.0" x2="658.0" y2="248.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="648.0" y="328.0" font-family="'Consolas', 'DejaVu Sans Mono', 'Courier New', monospace" font-size="20" fill="#27ae60" text-anchor="middle" font-weight="700">   329</text>
<text x="792.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">відповідь</text>
<rect x="554.0" y="392.0" width="400.0" height="72.0" rx="6" fill="#eef7f0" stroke="#333333" stroke-width="1.5"/><text x="754.0" y="416.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="754.0" dy="0.0">Перенос за розрядну сітку нікого не обходить:</tspan><tspan x="754.0" dy="16.2">лічильник і так рахує за модулем 1000.</tspan><tspan x="754.0" dy="16.2">Другого додавання немає.</tspan></text>
<text x="510.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Саме ця різниця й вирішила суперечку в двійкових машинах:</text>
<text x="510.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">обернений код успадкував кінцевий перенос, а доповняльний — викидає перенос і економить цілий прохід суматора</text>
</svg>