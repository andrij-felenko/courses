<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 716" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="716" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди лягає те, що не влізло</text>
<text x="500.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Знакове: обидва доданки додатні (0 ≤ a, b ≤ +127)</text>
<rect x="90.0" y="92.0" width="400.0" height="30.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="290.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">0 … +127 — влізло</text>
<rect x="493.1" y="92.0" width="396.9" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="691.6" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">+128 … +254 — вискочило</text>
<line x1="90.0" y1="122.0" x2="890.0" y2="122.0" stroke="#333333" stroke-width="1.8"/>
<text x="90.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
<text x="491.6" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">+127 ┊ +128</text>
<text x="890.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">+254</text>
<text x="894.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">справжня сума</text>
<line x1="291.6" y1="152.0" x2="692.4" y2="246.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="691.6" y1="152.0" x2="287.6" y2="246.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="250.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">як є</text>
<text x="742.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">− 2⁸</text>
<line x1="90.0" y1="252.0" x2="890.0" y2="252.0" stroke="#333333" stroke-width="1.8"/>
<rect x="90.0" y="252.0" width="395.3" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="287.6" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">образ: −128 … −2   (знаковий біт 1)</text>
<rect x="491.6" y="252.0" width="398.4" height="30.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="690.8" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">образ: 0 … +127   (знаковий біт 0)</text>
<text x="894.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">у слові</text>
<rect x="40.0" y="300.0" width="920.0" height="46.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="327.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Образи НЕ перетинаються — їх розділяє рівно знаковий біт. Тому «+ і + дали −» означає переповнення без винятків.</tspan></text>
<text x="500.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Беззнакове: будь-які два доданки (0 ≤ A, B ≤ 255)</text>
<rect x="90.0" y="442.0" width="400.0" height="30.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="290.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">0 … 255 — влізло</text>
<rect x="491.6" y="442.0" width="398.4" height="30.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="690.8" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">256 … 510 — вискочило</text>
<line x1="90.0" y1="472.0" x2="890.0" y2="472.0" stroke="#333333" stroke-width="1.8"/>
<text x="90.0" y="491.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
<text x="490.8" y="491.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">255 ┊ 256</text>
<text x="890.0" y="491.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">510</text>
<text x="894.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">справжня сума</text>
<line x1="290.8" y1="502.0" x2="246.9" y2="596.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="690.8" y1="502.0" x2="341.0" y2="596.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="150.0" y="552.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">як є</text>
<text x="620.0" y="540.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">− 2⁸</text>
<line x1="90.0" y1="602.0" x2="490.0" y2="602.0" stroke="#333333" stroke-width="1.8"/>
<rect x="90.0" y="602.0" width="400.0" height="30.0" rx="6" fill="#f6eef8" stroke="#7d3c98" stroke-width="1.8"/>
<text x="290.0" y="622.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7d3c98" text-anchor="middle" font-weight="700">той самий відрізок 0 … 255</text>
<text x="500.0" y="622.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">у слові</text>
<rect x="40.0" y="650.0" width="920.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="676.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Образи ЗБІГАЮТЬСЯ — 44 однаково законний результат і для 20+24, і для 200+100. Жоден біт слова не виказує переповнення: потрібна сама цифра cₙ.</tspan></text>
</svg>