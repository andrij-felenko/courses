<rect x="200.0" y="100.0" width="200.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="300.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">8-bit Adder (Ones' Complement)</text>
