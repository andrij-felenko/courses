<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Моделі цілочислового ділення</text>
<rect x="20.0" y="12.0" width="720.0" height="32.0" rx="4" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.0"/>
<text x="380.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#212529" text-anchor="middle" font-weight="700">Порівняння трьох моделей ділення -7 ÷ 3</text>
<rect x="40.0" y="58.0" width="680.0" height="74.0" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="55.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1864ab" text-anchor="start" font-weight="700">Усічення (Truncated / C99 / C++)</text>
<text x="55.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="start">Округлення до НУЛЯ (trunc)</text>
<text x="55.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="start" font-style="italic">-2 × 3 + (-1) = -7</text>
<rect x="390.0" y="68.0" width="310.0" height="54.0" rx="4" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.0"/>
<text x="545.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1864ab" text-anchor="middle" font-weight="700">-7 / 3 = -2  (остача -1)</text>
<text x="545.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Остача має знак діленого</text>
<rect x="40.0" y="142.0" width="680.0" height="74.0" rx="6" fill="#e6fcf5" stroke="#0ca678" stroke-width="1.5"/>
<text x="55.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#099268" text-anchor="start" font-weight="700">Підлога (Floor / Python / Julia)</text>
<text x="55.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="start">Округлення до -∞ (floor)</text>
<text x="55.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="start" font-style="italic">-3 × 3 + (+2) = -7</text>
<rect x="390.0" y="152.0" width="310.0" height="54.0" rx="4" fill="#ffffff" stroke="#0ca678" stroke-width="1.0"/>
<text x="545.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#099268" text-anchor="middle" font-weight="700">-7 // 3 = -3  (остача +2)</text>
<text x="545.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Остача завжди невід'ємна</text>
<rect x="40.0" y="226.0" width="680.0" height="74.0" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/>
<text x="55.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e67700" text-anchor="start" font-weight="700">Евклідове ділення (Euclidean / Ada)</text>
<text x="55.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="start">Строго невід'ємна остача 0 ≤ r &lt; 3</text>
<text x="55.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6c757d" text-anchor="start" font-style="italic">-3 × 3 + (+2) = -7</text>
<rect x="390.0" y="236.0" width="310.0" height="54.0" rx="4" fill="#ffffff" stroke="#f59f00" stroke-width="1.0"/>
<text x="545.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e67700" text-anchor="middle" font-weight="700">-7 div 3 = -3  (остача +2)</text>
<text x="545.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Остача завжди невід'ємна</text>
</svg>