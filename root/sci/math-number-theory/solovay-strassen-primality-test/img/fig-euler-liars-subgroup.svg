<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підгрупа брехунів Ейлера</text>
<text x="400.0" y="47.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл брехунів та свідків Ейлера в групі (ℤ/nℤ)*</text>
<rect x="60.0" y="70.0" width="680.0" height="280.0" rx="12" fill="#f4f6f8" stroke="#4b5563" stroke-width="2.0"/>
<text x="80.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1f2937" text-anchor="start" font-weight="700">Мультиплікативна група (ℤ/nℤ)*  [розмір φ(n)]</text>
<rect x="90.0" y="115.0" width="300.0" height="210.0" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.0"/>
<text x="240.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="700">Підгрупа брехунів Ейлера Eₙ</text>
<text x="240.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle">Основи a, для яких:</text>
<text x="240.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="700">a^((n-1)/2) ≡ (a/n) (mod n)</text>
<text x="240.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">Розмір |Eₙ| ≤ φ(n) / 2</text>
<text x="240.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-style="italic">Ніколи не перевищує 50%</text>
<text x="240.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-style="italic">елементів групи для складеного n</text>
<rect x="410.0" y="115.0" width="310.0" height="210.0" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.0"/>
<text x="565.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="700">Множина свідків Ейлера Wₙ</text>
<text x="565.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#78350f" text-anchor="middle">Основи a, для яких:</text>
<text x="565.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">a^((n-1)/2) ≢ (a/n) (mod n)</text>
<text x="565.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700">Розмір |Wₙ| ≥ φ(n) / 2</text>
<text x="565.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-style="italic">Гарантовано принаймні 50%</text>
<text x="565.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-style="italic">основ є свідками складеності</text>
<rect x="123.2" y="363.4" width="553.5" height="63.2" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="400.0" y="383.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#065f46" text-anchor="middle"><tspan x="400.0" dy="0.0">Оскільки Eₙ є ВЛАСНОЮ підгрупою в (ℤ/nℤ)* для складеного n,</tspan><tspan x="400.0" dy="15.6">за теоремою Лагранжа її порядок ділить порядок групи: |Eₙ| ≤ φ(n)/2 ≤ (n-1)/2.</tspan><tspan x="400.0" dy="15.6">Ймовірність помилки за один раунд ≤ 1/2.</tspan></text>
</svg>