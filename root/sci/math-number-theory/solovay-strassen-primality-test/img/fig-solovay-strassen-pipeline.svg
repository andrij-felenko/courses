<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм Соловея–Штрассена</text>
<text x="420.0" y="47.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм перевірки простоти Соловея–Штрассена</text>
<rect x="248.8" y="68.5" width="342.4" height="33.0" rx="6" fill="#e8f4f8" stroke="#2b7b9c" stroke-width="2.0"/><text x="420.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Вхід: непарне n ≥ 3, кількість раундів k</tspan></text>
<line x1="420.0" y1="101.5" x2="420.0" y2="140.0" stroke="#2b7b9c" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="217.3" y="148.5" width="405.3" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="169.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Цикл від i = 1 до k: випадкова основа a ∈ [2, n - 1]</tspan></text>
<line x1="420.0" y1="181.5" x2="420.0" y2="220.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="313.3" y="225.1" width="213.4" height="49.9" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/><text x="420.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Обчислення g = НСД(a, n)</tspan><tspan x="420.0" dy="16.9">Чи g &gt; 1 ?</tspan></text>
<line x1="526.7" y1="250.0" x2="640.0" y2="250.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="575.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Так (НСД дільник)</text>
<rect x="645.6" y="226.2" width="168.8" height="47.6" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="2.0"/><text x="730.0" y="246.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Складене число</tspan><tspan x="730.0" dy="15.6">(знайдено дільник g)</tspan></text>
<line x1="420.0" y1="274.9" x2="420.0" y2="315.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="430.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Ні</text>
<rect x="284.0" y="325.1" width="271.9" height="49.9" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="346.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Обчислити: x = a^((n-1)/2) mod n</tspan><tspan x="420.0" dy="16.9">та символ Якобі: J = (a / n) mod n</tspan></text>
<line x1="420.0" y1="374.9" x2="420.0" y2="410.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="305.2" y="415.1" width="229.6" height="49.9" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/><text x="420.0" y="436.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Порівняння конгруентності:</tspan><tspan x="420.0" dy="16.9">Чи x ≡ J (mod n) ?</tspan></text>
<line x1="534.8" y1="440.0" x2="640.0" y2="440.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="575.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Ні (свідок Ейлера)</text>
<rect x="649.3" y="416.2" width="161.4" height="47.6" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="2.0"/><text x="730.0" y="436.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Складене число</tspan><tspan x="730.0" dy="15.6">(a — свідок Ейлера)</tspan></text>
<line x1="420.0" y1="464.9" x2="420.0" y2="505.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="430.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Так (брехун Ейлера)</text>
<rect x="260.9" y="510.1" width="318.2" height="49.9" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2.0"/><text x="420.0" y="531.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#059669" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Пройдено k раундів успішно:</tspan><tspan x="420.0" dy="16.9">Ймовірно просте число (помилка ≤ 2⁻ᵏ)</tspan></text>
</svg>