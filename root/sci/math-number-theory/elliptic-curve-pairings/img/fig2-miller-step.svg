<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340"><defs>  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">    <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333" />  </marker></defs><rect x="0.0" y="0.0" width="760.0" height="340.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометричний крок алгоритму Міллера (Double &amp; Add)</text><rect x="30.0" y="50.0" width="335.0" height="260.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="197.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Крок подвоєння (T ↦ [2]T)</text><rect x="72.7" y="113.2" width="248.6" height="43.6" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="197.0" y="131.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="197.0" dy="0.0">Обчислення дотичної прямої l_{T,T}</tspan><tspan x="197.0" dy="15.6">λ = (3·x_T² + a) / (2·y_T)</tspan></text><rect x="93.2" y="193.2" width="207.5" height="43.6" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="197.0" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="197.0" dy="0.0">Оцінка прямої в точці Q ∈ G2</tspan><tspan x="197.0" dy="15.6">l_{T,T}(Q) / v_{2T}(Q)</tspan></text><rect x="78.1" y="268.0" width="237.7" height="24.0" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="197.0" y="284.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="197.0" dy="0.0">Накопичення: f := f² · l_{T,T}(Q)</tspan></text><line x1="197.0" y1="160.0" x2="197.0" y2="185.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="197.0" y1="240.0" x2="197.0" y2="260.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="395.0" y="50.0" width="335.0" height="260.0" rx="8" fill="#fafaf9" stroke="#333333" stroke-width="1.5"/><text x="562.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Крок додавання (якщо біт = 1)</text><rect x="444.6" y="113.2" width="234.9" height="43.6" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="562.0" y="131.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="562.0" dy="0.0">Обчислення січної прямої l_{T,P}</tspan><tspan x="562.0" dy="15.6">λ = (y_P - y_T) / (x_P - x_T)</tspan></text><rect x="458.2" y="193.2" width="207.5" height="43.6" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="562.0" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="562.0" dy="0.0">Оцінка прямої в точці Q ∈ G2</tspan><tspan x="562.0" dy="15.6">l_{T,P}(Q) / v_{T+P}(Q)</tspan></text><rect x="446.6" y="268.0" width="230.9" height="24.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="562.0" y="284.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="562.0" dy="0.0">Накопичення: f := f · l_{T,P}(Q)</tspan></text><line x1="562.0" y1="160.0" x2="562.0" y2="185.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="562.0" y1="240.0" x2="562.0" y2="260.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/></svg>