<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320"><defs>  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">    <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333" />  </marker></defs><rect x="0.0" y="0.0" width="760.0" height="320.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема агрегації підписів BLS та верифікація спарюванням</text><rect x="38.2" y="61.3" width="143.7" height="37.3" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="110.0" y="76.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Валідатор 1</tspan><tspan x="110.0" dy="14.3">σ_1 = [sk_1]H(m) ∈ G1</tspan></text><rect x="38.2" y="141.3" width="143.7" height="37.3" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="110.0" y="156.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Валідатор 2</tspan><tspan x="110.0" dy="14.3">σ_2 = [sk_2]H(m) ∈ G1</tspan></text><rect x="38.2" y="221.3" width="143.7" height="37.3" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="110.0" y="236.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Валідатор N</tspan><tspan x="110.0" dy="14.3">σ_N = [sk_N]H(m) ∈ G1</tspan></text><line x1="210.0" y1="80.0" x2="260.0" y2="140.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="210.0" y1="160.0" x2="260.0" y2="160.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="210.0" y1="240.0" x2="260.0" y2="180.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="268.4" y="128.4" width="143.1" height="63.2" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="340.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Неінтерактивний</tspan><tspan x="340.0" dy="15.6">Агрегатор</tspan><tspan x="340.0" dy="15.6">σ_agg = ∑ σ_i ∈ G1</tspan></text><line x1="420.0" y1="160.0" x2="460.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="472.0" y="126.4" width="236.0" height="67.2" rx="6" fill="#e6f4ea" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="148.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Верифікатор спарювання</tspan><tspan x="590.0" dy="15.6">e(σ_agg, P2) == e(H(m), PK_agg)</tspan><tspan x="590.0" dy="15.6">2 операції спарювання!</tspan></text><text x="590.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">PK_agg = ∑ PK_i ∈ G2 обчислюється заздалегідь</text></svg>