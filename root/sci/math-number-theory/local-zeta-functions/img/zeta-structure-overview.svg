<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 780 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="780" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="420.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура та структура локальної Дзета-функції кривої C/𝔽_q</text>
<rect x="30.0" y="65.0" width="220.0" height="320.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="45.0" y="80.0" width="190.0" height="35.0" rx="6" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="101.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Кількість точок N_n</tspan></text>
<rect x="40.0" y="130.0" width="200.0" height="50.0" rx="6" fill="#dbeafe" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle"><tspan x="140.0" dy="0.0">Множина точок над 𝔽_qⁿ:</tspan><tspan x="140.0" dy="13.0">N_n = #C(𝔽_qⁿ)</tspan></text>
<rect x="40.0" y="195.0" width="200.0" height="65.0" rx="6" fill="#fef3c7" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="213.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#92400e" text-anchor="middle"><tspan x="140.0" dy="0.0">Підйом степеня:</tspan><tspan x="140.0" dy="11.7">N₁ → N₂ → N₃ → ...</tspan><tspan x="140.0" dy="11.7">Експоненційне зростання</tspan><tspan x="140.0" dy="11.7">поля розширення</tspan></text>
<rect x="40.0" y="275.0" width="200.0" height="95.0" rx="6" fill="#dcfce7" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="302.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Оцінка Хассе–Вейля:</tspan><tspan x="140.0" dy="11.7">|N_n - (qⁿ + 1)| ≤ 2g·q^{n/2}</tspan><tspan x="140.0" dy="11.7"></tspan><tspan x="140.0" dy="11.7">Рекурентне значення</tspan><tspan x="140.0" dy="11.7">через власні числа</tspan></text>
<rect x="270.0" y="65.0" width="220.0" height="320.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="285.0" y="80.0" width="190.0" height="35.0" rx="6" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="101.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Твірна Дзета-функція Z(t)</tspan></text>
<rect x="280.0" y="130.0" width="200.0" height="60.0" rx="6" fill="#e0e7ff" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="145.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#3730a3" text-anchor="middle"><tspan x="380.0" dy="0.0">Логарифмічний ряд:</tspan><tspan x="380.0" dy="11.7">Z(C, t) = exp( ∑ N_n · tⁿ/n )</tspan><tspan x="380.0" dy="11.7">Логарифмічна похідна:</tspan><tspan x="380.0" dy="11.7">t·d/dt[ln Z] = ∑ N_n·tⁿ</tspan></text>
<rect x="280.0" y="205.0" width="200.0" height="70.0" rx="6" fill="#fae8ff" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="219.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b21a8" text-anchor="middle"><tspan x="380.0" dy="0.0">Ейлерів добуток:</tspan><tspan x="380.0" dy="11.7">Z(C, t) = ∏_{x ∈ |C|} 1 / (1 - t^{deg(x)})</tspan><tspan x="380.0" dy="11.7"></tspan><tspan x="380.0" dy="11.7">Добуток по замкнених</tspan><tspan x="380.0" dy="11.7">орбітах Галуа x</tspan></text>
<rect x="280.0" y="290.0" width="200.0" height="80.0" rx="6" fill="#ffe4e6" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="309.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9f1239" text-anchor="middle"><tspan x="380.0" dy="0.0">Гомоморфізм Фробеніуса:</tspan><tspan x="380.0" dy="11.7">Frob_q: (x,y) ↦ (x^q, y^q)</tspan><tspan x="380.0" dy="11.7"></tspan><tspan x="380.0" dy="11.7">Дія на когомології</tspan><tspan x="380.0" dy="11.7">H¹(C, ℚ_ℓ)</tspan></text>
<rect x="510.0" y="65.0" width="220.0" height="320.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="525.0" y="80.0" width="190.0" height="35.0" rx="6" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="101.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Раціональна форма</tspan></text>
<rect x="520.0" y="130.0" width="200.0" height="65.0" rx="6" fill="#dcfce7" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="148.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Дріб Теореми Рімана–Роха:</tspan><tspan x="620.0" dy="11.7">Z(C, t) = P(t) / ((1-t)(1-qt))</tspan><tspan x="620.0" dy="11.7"></tspan><tspan x="620.0" dy="11.7">P(t) ∈ ℤ[t], deg P = 2g</tspan></text>
<rect x="520.0" y="210.0" width="200.0" height="65.0" rx="6" fill="#dbeafe" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="228.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle"><tspan x="620.0" dy="0.0">Факторизація чисельника:</tspan><tspan x="620.0" dy="11.7">P(t) = ∏_{i=1}^{2g} (1 - α_i·t)</tspan><tspan x="620.0" dy="11.7"></tspan><tspan x="620.0" dy="11.7">Власні значення α_i</tspan></text>
<rect x="520.0" y="290.0" width="200.0" height="80.0" rx="6" fill="#fef3c7" stroke="#333333" stroke-width="1.5"/><text x="620.0" y="309.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#92400e" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Аналог Гіпотези Рімана:</tspan><tspan x="620.0" dy="11.7">|α_i| = √q для всіх i</tspan><tspan x="620.0" dy="11.7"></tspan><tspan x="620.0" dy="11.7">Функціональне рівняння:</tspan><tspan x="620.0" dy="11.7">Z(1/(qt)) = (qt²)¹⁻ᵍ Z(t)</tspan></text>
<line x1="250.0" y1="155.0" x2="270.0" y2="155.0" stroke="#2563eb" stroke-width="2.0"/>
