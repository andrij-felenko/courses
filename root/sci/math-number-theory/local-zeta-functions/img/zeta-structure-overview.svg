<line x1="504.0" y1="155.0" x2="510.0" y2="160.0" stroke="#16a34a" stroke-width="2.0"/>
<line x1="504.0" y1="165.0" x2="510.0" y2="160.0" stroke="#16a34a" stroke-width="2.0"/>
<line x1="520.0" y1="340.0" x2="490.0" y2="340.0" stroke="#9f1239" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="270.0" y1="340.0" x2="250.0" y2="340.0" stroke="#9f1239" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="256.0" y1="335.0" x2="250.0" y2="340.0" stroke="#9f1239" stroke-width="1.5"/>
<line x1="256.0" y1="345.0" x2="250.0" y2="340.0" stroke="#9f1239" stroke-width="1.5"/>
</svg>