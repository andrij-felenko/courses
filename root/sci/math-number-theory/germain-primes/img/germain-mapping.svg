<rect x="60.0" y="350.0" width="360.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="240.0" y="375.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">p = 13</tspan></text>
<line x1="430.0" y1="371.0" x2="570.0" y2="371.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2p + 1</text>
<rect x="580.0" y="350.0" width="360.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="760.0" y="367.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">q = 2(13) + 1 = 27 = 3³</tspan><tspan x="760.0" dy="16.2">СКЛАДЕНЕ (не Жермен ✗)</tspan></text>
<rect x="60.0" y="397.0" width="360.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="240.0" y="422.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">p = 23</tspan></text>
<line x1="430.0" y1="418.0" x2="570.0" y2="418.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2p + 1</text>
<rect x="580.0" y="397.0" width="360.0" height="42.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="1.8"/><text x="760.0" y="414.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">q = 2(23) + 1 = 47</tspan><tspan x="760.0" dy="16.2">ПРОСТЕ (Жермен ✓)</tspan></text>
<rect x="60.0" y="450.0" width="880.0" height="50.0" rx="6" fill="#fffde6" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="478.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Операція 2p + 1 відсіює частину простих чисел. Ті, що витримують перевірку, стають криптографічними безпечними простими числами.</tspan></text>
