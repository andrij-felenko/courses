<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відображення простих чисел Софі Жермен у безпечні прості числа</text>
<text x="500.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відображення p ↦ q = 2p + 1 для початкових простих чисел</text>
<rect x="60.0" y="65.0" width="360.0" height="40.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/><text x="240.0" y="90.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Просте число p</tspan></text>
<rect x="580.0" y="65.0" width="360.0" height="40.0" rx="6" fill="#f3e8fa" stroke="#7e22ce" stroke-width="2.0"/><text x="760.0" y="88.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">Результат q = 2p + 1 (Безпечне просте чи складене)</tspan></text>
<rect x="60.0" y="115.0" width="360.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="240.0" y="140.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">p = 2</tspan></text>
<line x1="430.0" y1="136.0" x2="570.0" y2="136.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2p + 1</text>
<rect x="580.0" y="115.0" width="360.0" height="42.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="1.8"/><text x="760.0" y="132.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">q = 2(2) + 1 = 5</tspan><tspan x="760.0" dy="16.2">ПРОСТЕ (Жермен ✓)</tspan></text>
<rect x="60.0" y="162.0" width="360.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="240.0" y="187.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">p = 3</tspan></text>
<line x1="430.0" y1="183.0" x2="570.0" y2="183.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2p + 1</text>
<rect x="580.0" y="162.0" width="360.0" height="42.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="1.8"/><text x="760.0" y="179.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">q = 2(3) + 1 = 7</tspan><tspan x="760.0" dy="16.2">ПРОСТЕ (Жермен ✓)</tspan></text>
<rect x="60.0" y="209.0" width="360.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="240.0" y="234.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">p = 5</tspan></text>
<line x1="430.0" y1="230.0" x2="570.0" y2="230.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2p + 1</text>
<rect x="580.0" y="209.0" width="360.0" height="42.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="1.8"/><text x="760.0" y="226.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">q = 2(5) + 1 = 11</tspan><tspan x="760.0" dy="16.2">ПРОСТЕ (Жермен ✓)</tspan></text>
<rect x="60.0" y="256.0" width="360.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="240.0" y="281.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">p = 7</tspan></text>
<line x1="430.0" y1="277.0" x2="570.0" y2="277.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="500.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2p + 1</text>
<rect x="580.0" y="256.0" width="360.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="760.0" y="273.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">q = 2(7) + 1 = 15 = 3 · 5</tspan><tspan x="760.0" dy="16.2">СКЛАДЕНЕ (не Жермен ✗)</tspan></text>
<rect x="60.0" y="303.0" width="360.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="240.0" y="328.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">p = 11</tspan></text>
