<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння структур порядку групи для Diffie-Hellman</text>
<text x="500.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вплив будови порядку групи (Z/qZ)* на стійкість до алгоритму Поліга — Геллмана</text>
<rect x="50.0" y="65.0" width="420.0" height="340.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="260.0" y="239.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="260.0" dy="0.0"></tspan></text>
<text x="260.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Вразливий модуль: Звичайне просте q</text>
<text x="260.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Порядок групи: q − 1 = 2ᵃ · 3ᵇ · 5ᶜ · 7ᵈ ...</text>
<text x="260.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">(багато малих простих множників)</text>
<rect x="75.0" y="180.0" width="370.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="209.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="260.0" dy="0.0">Алгоритм Поліга — Геллмана:</tspan><tspan x="260.0" dy="15.0">1. Розв'язання ДЛП у малих підгрупах Z₃, Z₅, Z₇</tspan><tspan x="260.0" dy="15.0">2. Обчислення остач x mod pᵢ</tspan><tspan x="260.0" dy="15.0">3. Відновлення x через Китайську теорему про остачі</tspan><tspan x="260.0" dy="15.0">Складність: O(∑ eᵢ √pᵢ) — ШВИДКИЙ ЗЛАМ!</tspan></text>
<rect x="75.0" y="305.0" width="370.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="350.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">РЕЗУЛЬТАТ: Дискретне логорифмування обчислюється за кілька секунд на звичайному ПК.</tspan></text>
<rect x="530.0" y="65.0" width="420.0" height="340.0" rx="8" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="740.0" y="239.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0"></tspan></text>
<text x="740.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Захищений модуль: Безпечне просте q = 2p + 1</text>
<text x="740.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Порядок групи: q − 1 = 2 · p</text>
<text x="740.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">(лиш один гігантський простий множник p)</text>
<rect x="555.0" y="180.0" width="370.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="740.0" y="209.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle"><tspan x="740.0" dy="0.0">Стійкість до Поліга — Геллмана:</tspan><tspan x="740.0" dy="15.0">1. Єдиний великий підгруповий порядок p</tspan><tspan x="740.0" dy="15.0">2. Відсутність малих дільників для розщеплення</tspan><tspan x="740.0" dy="15.0">3. Зведення складності до загального ДЛП у підгрупі</tspan><tspan x="740.0" dy="15.0">Складність: O(√p) — НЕПРОНИКНИЙ БАР'ЄР!</tspan></text>
<rect x="555.0" y="305.0" width="370.0" height="85.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="1.8"/><text x="740.0" y="350.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">РЕЗУЛЬТАТ: Криптографічна стійкість відповідає повній довжині ключа.</tspan></text>
<rect x="50.0" y="415.0" width="900.0" height="35.0" rx="6" fill="#fffde6" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Використання безпечних простих чисел q = 2p + 1 блокує факторизацію порядку групи q − 1 та забезпечує максимальну стійкість протоколу Діффі — Геллмана.</tspan></text>
</svg>