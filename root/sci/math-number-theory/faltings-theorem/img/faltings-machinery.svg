<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 903 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="903" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="138.3" y="28.9" width="523.4" height="52.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/><text x="400.0" y="50.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Раціональні точки P ∈ C(K) на кривій роду g ≥ 2</tspan><tspan x="400.0" dy="18.2">(Припускаємо, що точки розглядаються над числовим полем K)</tspan></text>
<line x1="400.0" y1="95.0" x2="400.0" y2="140.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="415.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="left" font-style="italic">Конструкція Кодайри–Паршина (нерозгалужені накриття Cₚ → C)</text>
<rect x="134.6" y="153.9" width="530.7" height="52.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/><text x="400.0" y="175.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Абелеві многовиди A_P = Jac(Cₚ) фіксованого розміру g'</tspan><tspan x="400.0" dy="18.2">та обмеженого провідника N (розгалуження лише в заданих простих)</tspan></text>
<line x1="400.0" y1="220.0" x2="400.0" y2="265.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="415.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="left" font-style="italic">Доведення Фальтінгса: гіпотеза Тейта, висота Фальтінгса &amp; теорема про ізогенії</text>
<rect x="68.8" y="278.9" width="662.3" height="52.2" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="400.0" y="300.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Гіпотеза Шафаревича (доведена Фальтінгсом):</tspan><tspan x="400.0" dy="18.2">Класів ізоморфізму таких абелевих многовидів A_P лише СКІНЧЕННА кількість!</tspan></text>
<line x1="400.0" y1="345.0" x2="400.0" y2="390.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="415.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="left" font-style="italic">Теорема Тореллі (Cₚ відновлюється за Jac) + скінченність покриттів</text>
<rect x="136.9" y="410.8" width="526.2" height="58.5" rx="6" fill="#f2faf4" stroke="#27ae60" stroke-width="2.2"/><text x="400.0" y="435.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">ВИСНОВОК: Множина раціональних точок C(K) є СКІНЧЕННОЮ</tspan><tspan x="400.0" dy="19.5">|C(K)| &lt; ∞  (Теорема Фальтінгса / Гіпотеза Морделла)</tspan></text>
