<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="40.0" width="350.0" height="330.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="205.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрія в p-адичному Якобіані J(ℚₚ)</text>
<rect x="55.0" y="95.0" width="300.0" height="245.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="205.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Якобіан J(ℚₚ) (вимір g)</text>
<rect x="75.0" y="140.0" width="260.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="205.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Замикання раціональних точок J(ℚ)</text>
<text x="205.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">вимір r = rank(J(ℚ)) &lt; g</text>
<ellipse cx="205.0" cy="280.0" rx="110.0" ry="30.0" fill="#fdf4f3" stroke="#c0392b" stroke-width="1.5"/>
<text x="205.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Вкладена крива C(ℚₚ)</text>
<text x="205.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">(вимір 1)</text>
<circle cx="145.0" cy="270.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<circle cx="265.0" cy="270.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="145.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">P₁</text>
<text x="265.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">P₂</text>
<rect x="410.0" y="40.0" width="360.0" height="330.0" rx="6" fill="#f2faf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="590.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Механізм аналітичного вирахування</text>
<rect x="446.6" y="101.6" width="286.8" height="66.8" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="122.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">1. p-адичний інтеграл Коулмана:</tspan><tspan x="590.0" dy="16.9">∫_P₀^P ω_i = 0  для  i = 1, …, g − r</tspan><tspan x="590.0" dy="16.9">де ω_i — анулюючі диференціали</tspan></text>
<rect x="420.7" y="196.6" width="338.6" height="66.8" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="217.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">2. Локальні нулі p-адичних степенних рядів:</tspan><tspan x="590.0" dy="16.9">У кожній редукційній точці не більше</tspan><tspan x="590.0" dy="16.9">за 2g − 2 нулів аналітичних функцій</tspan></text>
<rect x="429.3" y="285.7" width="321.3" height="68.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="590.0" y="307.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">ОЦІНКА КОУЛМАНА:</tspan><tspan x="590.0" dy="17.6">|C(ℚ)| ≤ |C(𝔽ₚ)| + 2g − 2</tspan><tspan x="590.0" dy="17.6">(При p &gt; 2g та r &lt; g дає явну межу!)</tspan></text>
</svg>