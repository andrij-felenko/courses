<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Генератор дружніх пар Сабіта ibn Кюрри</text>
<text x="500.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Генератор дружніх пар Сабіта ibn Кюрри для n = 2</text>
<rect x="410.0" y="65.0" width="180.0" height="50.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="2.2"/><text x="500.0" y="95.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Вхід: n = 2</tspan></text>
<line x1="430.0" y1="115.0" x2="200.0" y2="160.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="500.0" y1="115.0" x2="500.0" y2="160.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="570.0" y1="115.0" x2="800.0" y2="160.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="165.0" width="280.0" height="80.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="1.8"/><text x="200.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">p = 3·2²⁻¹ − 1 = 5</tspan><tspan x="200.0" dy="18.2">(просте число ✓)</tspan></text>
<rect x="360.0" y="165.0" width="280.0" height="80.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="1.8"/><text x="500.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">q = 3·2² − 1 = 11</tspan><tspan x="500.0" dy="18.2">(просте число ✓)</tspan></text>
<rect x="660.0" y="165.0" width="280.0" height="80.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="1.8"/><text x="800.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">r = 9·2²⁺²⁻¹ − 1 = 71</tspan><tspan x="800.0" dy="18.2">(просте число ✓)</tspan></text>
<line x1="200.0" y1="245.0" x2="270.0" y2="310.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="500.0" y1="245.0" x2="270.0" y2="310.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="800.0" y1="245.0" x2="730.0" y2="310.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="120.0" y="315.0" width="300.0" height="75.0" rx="6" fill="#f3e8fa" stroke="#7e22ce" stroke-width="2.2"/><text x="270.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">a = 2² · p · q</tspan><tspan x="270.0" dy="19.5">= 4 · 5 · 11 = 220</tspan></text>
<rect x="580.0" y="315.0" width="300.0" height="75.0" rx="6" fill="#f3e8fa" stroke="#7e22ce" stroke-width="2.2"/><text x="730.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">b = 2² · r</tspan><tspan x="730.0" dy="19.5">= 4 · 71 = 284</tspan></text>
<line x1="425.0" y1="345.0" x2="575.0" y2="345.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="575.0" y1="360.0" x2="425.0" y2="360.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="500.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">s(220) = 284</text>
<text x="500.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">s(284) = 220</text>
<rect x="60.0" y="415.0" width="880.0" height="45.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="442.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Якщо p, q, r — прості, то числа a = 2ⁿ·p·q та b = 2ⁿ·r гарантовано утворюють дружню пару</tspan></text>
</svg>