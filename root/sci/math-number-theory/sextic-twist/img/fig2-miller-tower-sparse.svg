<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="380.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Вежа розширень полів 𝔽ₚ → 𝔽ₚ₂ → 𝔽ₚ₆ → 𝔽ₚ₁₂ та розріджені множення</text>
<rect x="40.0" y="65.0" width="360.0" height="305.0" rx="8" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/>
<text x="220.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">Вежа розширень полів (Tower Construction)</text>
<rect x="60.0" y="115.0" width="320.0" height="48.0" rx="5" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="220.0" y="135.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle"><tspan x="220.0" dy="0.0">𝔽ₚ₁₂ = 𝔽ₚ₆[w] / (w² - v)</tspan><tspan x="220.0" dy="14.3">Ступінь 12 | Цільова група Gₜ ⊂ 𝔽ₚ₁₂*</tspan></text>
<rect x="60.0" y="175.0" width="320.0" height="48.0" rx="5" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="220.0" y="195.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle"><tspan x="220.0" dy="0.0">𝔽ₚ₆ = 𝔽ₚ₂[v] / (v³ - ξ)</tspan><tspan x="220.0" dy="14.3">Ступінь 6 | Проміжне розширення</tspan></text>
<rect x="60.0" y="235.0" width="320.0" height="48.0" rx="5" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="220.0" y="255.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle"><tspan x="220.0" dy="0.0">𝔽ₚ₂ = 𝔽ₚ[u] / (u² - β)</tspan><tspan x="220.0" dy="14.3">Ступінь 2 | Поле точок твістованої кривої E'</tspan></text>
<rect x="60.0" y="295.0" width="320.0" height="48.0" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="220.0" y="315.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle"><tspan x="220.0" dy="0.0">𝔽ₚ (Базове поле)</tspan><tspan x="220.0" dy="14.3">Ступінь 1 | Поле точок кривої E та G₁</tspan></text>
<rect x="440.0" y="65.0" width="400.0" height="305.0" rx="8" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/>
<text x="640.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e08a1e" text-anchor="middle" font-weight="700">Розріджена функція прямої l_{P, Q'}(T) ∈ 𝔽ₚ₁₂</text>
<rect x="460.0" y="110.0" width="360.0" height="155.0" rx="5" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><text x="640.0" y="145.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="middle"><tspan x="640.0" dy="0.0">Обчислення прямої між P=(xₚ, yₚ) ∈ G₁ та Q'=(x', y') ∈ G₂':</tspan><tspan x="640.0" dy="13.0"></tspan><tspan x="640.0" dy="13.0">l_{P, Q'}(T) = c₀ + c₁ · w + c₃ · w³</tspan><tspan x="640.0" dy="13.0"></tspan><tspan x="640.0" dy="13.0">• c₀ ∈ 𝔽ₚ₂  (лінійний коефіцієнт)</tspan><tspan x="640.0" dy="13.0">• c₁ ∈ 𝔽ₚ₂  (компонента y' · w³ розтвістована)</tspan><tspan x="640.0" dy="13.0">• c₃ ∈ 𝔽ₚ₂  (компонента x' · w² розтвістована)</tspan><tspan x="640.0" dy="13.0">• c₂ = c₄ = c₅ = 0 (9 із 12 коефіцієнтів дорівнюють 0!)</tspan></text>
<rect x="460.0" y="275.0" width="360.0" height="80.0" rx="5" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="640.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle"><tspan x="640.0" dy="0.0">Результат розрідженості (Sparse Multiplication):</tspan><tspan x="640.0" dy="13.0">• Стандартне множення в 𝔽ₚ₁₂: 54 множення в 𝔽ₚ</tspan><tspan x="640.0" dy="13.0">• Розріджене множення l_{P,Q'} · f: лише 13–18 множень в 𝔽ₚ</tspan><tspan x="640.0" dy="13.0">• Прискорення крок за кроком в алгоритмі Міллера: &gt; 3×</tspan></text>
</svg>