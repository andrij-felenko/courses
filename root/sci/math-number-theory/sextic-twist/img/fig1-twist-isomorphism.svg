<rect x="55.0" y="135.0" width="340.0" height="80.0" rx="5" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><text x="225.0" y="157.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle"><tspan x="225.0" dy="0.0">Точка Q = (x, y) ∈ E(𝔽ₚ₁₂)</tspan><tspan x="225.0" dy="14.3">• Розмір координат: 12 елементів 𝔽ₚ (384 байти)</tspan><tspan x="225.0" dy="14.3">• Арифметика: множення над 𝔽ₚ₁₂</tspan><tspan x="225.0" dy="14.3">• Висока обчислювальна складність</tspan></text>
<rect x="470.0" y="70.0" width="370.0" height="160.0" rx="8" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/>
<text x="655.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">Твістована крива E' / 𝔽ₚ₂ (d = 6)</text>
<text x="655.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">Група G₂' ⊂ E'(𝔽ₚ₂)[r]</text>
<rect x="485.0" y="135.0" width="340.0" height="80.0" rx="5" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="655.0" y="157.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle"><tspan x="655.0" dy="0.0">Точка Q' = (x', y') ∈ E'(𝔽ₚ₂)</tspan><tspan x="655.0" dy="14.3">• Розмір координат: 2 елементи 𝔽ₚ (64 байти)</tspan><tspan x="655.0" dy="14.3">• D-type: y'² = x'³ + b/ξ | M-type: y'² = x'³ + b·ξ</tspan><tspan x="655.0" dy="14.3">• Арифметика: швидкі операції в 𝔽ₚ₂</tspan></text>
