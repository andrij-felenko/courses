<rect x="40.0" y="250.0" width="800.0" height="140.0" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
<text x="440.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7e22ce" text-anchor="middle" font-weight="700">Формули розтвістування ψ: E'(𝔽ₚ₂) → E(𝔽ₚ₁₂) через елемент ω⁶ = ξ ∈ 𝔽ₚ₂</text>
<rect x="60.0" y="295.0" width="360.0" height="75.0" rx="5" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/><text x="240.0" y="329.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#581c87" text-anchor="middle"><tspan x="240.0" dy="0.0">D-type твіст (y'² = x'³ + b/ξ):</tspan><tspan x="240.0" dy="14.3">(x, y) = ψ_D(x', y') = (x' · ω², y' · ω³)</tspan></text>
<rect x="460.0" y="295.0" width="360.0" height="75.0" rx="5" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/><text x="640.0" y="329.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#581c87" text-anchor="middle"><tspan x="640.0" dy="0.0">M-type твіст (y'² = x'³ + b·ξ):</tspan><tspan x="640.0" dy="14.3">(x, y) = ψ_M(x', y') = (x' / ω², y' / ω³)</tspan></text>
