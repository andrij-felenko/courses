<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 650 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="650" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="320.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Деструктивна інтерференція vs Підсилення сум Гаусса</text>
<rect x="30.0" y="75.0" width="580.0" height="95.0" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="160.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. Звичайна сума експонент (без ваг):</text>
<text x="160.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">∑_{a=1}^{p-1} e^(2πi·a/p) = -1</text>
<text x="440.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Рівномірний розподіл по колу:</text>
<text x="440.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">усі вектори взаємно знищуються,</text>
<text x="440.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">лишаючи лише -1 (без n=0).</text>
<rect x="30.0" y="215.0" width="580.0" height="105.0" rx="8" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/>
<text x="160.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">2. Зважена сума Гаусса (з характером χ):</text>
<text x="160.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">g(χ) = ∑_{a=1}^{p-1} χ(a) · e^(2πi·a/p)</text>
<text x="160.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Модуль: |g(χ)| = √p</text>
<text x="440.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Характер χ(a) = ±1 перевертає</text>
<text x="440.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">фази нелишків, перетворюючи</text>
<text x="440.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">гасіння на конструктивну спіраль!</text>
</svg>