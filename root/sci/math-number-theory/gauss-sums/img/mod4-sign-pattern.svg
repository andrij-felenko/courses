<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 650 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="650" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="320.0" y="21.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Закон знаку Гаусса: залежність g(1, p) від p mod 4</text>
<line x1="60.0" y1="220.0" x2="580.0" y2="220.0" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="320.0" y1="55.0" x2="320.0" y2="370.0" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="320.0" y1="220.0" x2="585.0" y2="220.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="320.0" y1="220.0" x2="320.0" y2="50.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="595.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Re</text>
<text x="320.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Im</text>
<rect x="365.0" y="80.0" width="210.0" height="120.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="97.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">p ≡ 1 (mod 4)</tspan><tspan x="470.0" dy="15.6"></tspan><tspan x="470.0" dy="15.6">g(1, p) = +√p</tspan><tspan x="470.0" dy="15.6">(чисто дійсне, додатне)</tspan><tspan x="470.0" dy="15.6"></tspan><tspan x="470.0" dy="15.6">Приклади: p = 5, 13, 17, 29</tspan><tspan x="470.0" dy="15.6">g(1, 5) = +√5 ≈ +2.236</tspan></text>
<line x1="330.0" y1="220.0" x2="400.0" y2="220.0" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<circle cx="400.0" cy="220.0" r="5.0" fill="#2457d6" stroke="#ffffff" stroke-width="1.0"/>
<rect x="65.0" y="80.0" width="210.0" height="120.0" rx="8" fill="#fff7ed" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="97.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">p ≡ 3 (mod 4)</tspan><tspan x="170.0" dy="15.6"></tspan><tspan x="170.0" dy="15.6">g(1, p) = +i·√p</tspan><tspan x="170.0" dy="15.6">(чисто уявне, додатне ім.)</tspan><tspan x="170.0" dy="15.6"></tspan><tspan x="170.0" dy="15.6">Приклади: p = 3, 7, 11, 19</tspan><tspan x="170.0" dy="15.6">g(1, 7) = +i·√7 ≈ +2.645i</tspan></text>
<line x1="320.0" y1="210.0" x2="320.0" y2="140.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<circle cx="320.0" cy="140.0" r="5.0" fill="#c0392b" stroke="#ffffff" stroke-width="1.0"/>
<rect x="70.0" y="360.0" width="500.0" height="45.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/><text x="320.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Гаусс доводив цей знак понад 4 роки (1801–1805): g(1, p)² = (-1)^((p-1)/2) · p</tspan></text>
