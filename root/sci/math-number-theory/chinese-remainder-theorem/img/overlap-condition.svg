<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спільний дільник — це спільна частина розповіді</text>
<circle cx="330.0" cy="190.0" r="125.0" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/>
<circle cx="470.0" cy="190.0" r="125.0" fill="none" stroke="#27ae60" stroke-width="2.0"/>
<text x="250.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2457d6" text-anchor="middle" font-weight="700">12</text>
<text x="550.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#27ae60" text-anchor="middle" font-weight="700">18</text>
<text x="270.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#2457d6" text-anchor="middle" font-weight="700">2</text>
<text x="400.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">2 · 3</text>
<text x="530.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#27ae60" text-anchor="middle" font-weight="700">3</text>
<text x="400.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">спільне</text>
<rect x="636.0" y="128.0" width="230.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="751.0" y="151.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="751.0" dy="0.0">НСД(12, 18) = 2·3 = 6</tspan><tspan x="751.0" dy="16.2">те, що бачать ОБИДВА</tspan></text>
<rect x="636.0" y="208.0" width="230.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="751.0" y="231.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="751.0" dy="0.0">НСК(12, 18) = 2·(2·3)·3 = 36</tspan><tspan x="751.0" dy="16.2">усе разом, без повторів</tspan></text>
<text x="450.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">на спільній шістці обидва модулі мусять розповідати одне й те саме</text>
<rect x="58.0" y="372.0" width="380.0" height="92.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="248.0" y="405.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="248.0" dy="0.0">x ≡ 5 (mod 12),   x ≡ 11 (mod 18)</tspan><tspan x="248.0" dy="16.9">5 mod 6 = 5    і    11 mod 6 = 5</tspan><tspan x="248.0" dy="16.9">історії збіглися  →  x ≡ 29 (mod 36)</tspan></text>
<rect x="462.0" y="372.0" width="380.0" height="92.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="652.0" y="405.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="652.0" dy="0.0">x ≡ 5 (mod 12),   x ≡ 10 (mod 18)</tspan><tspan x="652.0" dy="16.9">5 mod 6 = 5    але    10 mod 6 = 4</tspan><tspan x="652.0" dy="16.9">суперечність  →  розв'язку немає</tspan></text>
</svg>