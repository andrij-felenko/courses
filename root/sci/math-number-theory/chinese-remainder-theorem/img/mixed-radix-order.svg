<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Залишки порядку не знають — мішані основи знають</text>
<line x1="450.0" y1="60.0" x2="450.0" y2="396.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="50.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">СИРІ ЗАЛИШКИ</text>
<text x="50.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">8 → (2, 3)        9 → (0, 4)</text>
<text x="50.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">за модулями 3 і 5</text>
<rect x="50.0" y="158.0" width="360.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="230.0" y="184.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">почленно:  2 &gt; 0,  але  3 &lt; 4</tspan><tspan x="230.0" dy="16.9">суперечність — висновку немає</tspan></text>
<rect x="50.0" y="234.0" width="360.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="230.0" y="260.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">лексикографічно:  (2, 3) &gt; (0, 4)</tspan><tspan x="230.0" dy="16.9">тобто «8 &gt; 9» — а це неправда</tspan></text>
<text x="50.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">величина числа розмазана по всіх</text>
<text x="50.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">залишках одразу — в жодному її немає</text>
<text x="490.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">МІШАНО-ОСНОВНІ ЦИФРИ</text>
<text x="490.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">8 = 2 + 2·3   →   (2, 2)</text>
<text x="490.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start">9 = 0 + 3·3   →   (3, 0)</text>
<text x="490.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-style="italic">цифри виписано від старшої; основи 3 і 5</text>
<rect x="490.0" y="186.0" width="360.0" height="60.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="670.0" y="212.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">старша цифра:  2 &lt; 3</tspan><tspan x="670.0" dy="16.9">отже 8 &lt; 9  —  і це правда</tspan></text>
<text x="490.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">це позиційний запис, як десятковий:</text>
<text x="490.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">старша цифра важить більше за всі молодші</text>
<text x="490.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">разом узяті — тому порівняння працює</text>
<rect x="611.6" y="349.5" width="116.7" height="33.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="670.0" y="370.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">Гарнер, 1959</tspan></text>
<rect x="50.0" y="414.0" width="800.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="450.0" y="432.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Але задарма це не дається: переведення коштує ~k² модульних множень — стільки ж, скільки й уся збірка.</tspan><tspan x="450.0" dy="15.6">Порядок повертається не дешево, а лише без довгої арифметики: усі проміжні лишаються в межах модуля.</tspan></text>
</svg>