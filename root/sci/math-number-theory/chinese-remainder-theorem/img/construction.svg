<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відповідь складається з «чистих одиниць», як вектор із базису</text>
<line x1="420.0" y1="60.0" x2="420.0" y2="350.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="40.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Крок 1. Побудувати «чисті одиниці»</text>
<text x="40.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">e₁ ≡ 1 (mod 3),   e₁ ≡ 0 (mod 5)</text>
<text x="40.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">кратні 5:   5,  10,  15, …</text>
<text x="40.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">яке з них дає 1 за модулем 3?</text>
<rect x="115.3" y="182.0" width="89.4" height="36.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="160.0" y="205.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">e₁ = 10</tspan></text>
<text x="40.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">e₂ ≡ 0 (mod 3),   e₂ ≡ 1 (mod 5)</text>
<text x="40.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">кратні 3:   3,  6,  9, …</text>
<text x="40.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">яке з них дає 1 за модулем 5?</text>
<rect x="120.2" y="320.0" width="79.5" height="36.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="2.0"/><text x="160.0" y="343.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">e₂ = 6</tspan></text>
<text x="460.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Крок 2. Скласти потрібну пару</text>
<text x="460.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">потрібна пара (2, 3):</text>
<text x="460.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">x = 2·e₁ + 3·e₂</text>
<text x="460.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">    = 2·10 + 3·6 = 38</text>
<text x="460.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">    ≡ 38 − 2·15 = 8 (mod 15)</text>
<rect x="532.1" y="233.0" width="75.8" height="38.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/><text x="570.0" y="258.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">x = 8</tspan></text>
<text x="460.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">перевірка:</text>
<text x="460.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start">8 mod 3 = 2 ✓     8 mod 5 = 3 ✓</text>
<rect x="60.0" y="372.0" width="720.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="420.0" y="398.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">у загальному вигляді:   Nᵢ = N / nᵢ ,    eᵢ = Nᵢ · (Nᵢ⁻¹ mod nᵢ) ,    x = a₁·e₁ + … + aₖ·eₖ  (mod N)</tspan></text>
</svg>