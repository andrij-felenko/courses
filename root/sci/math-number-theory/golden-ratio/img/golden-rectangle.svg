<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрія золотого перетину: відрізок і прямокутник</text>
<text x="60.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">А. Поділ відрізка на частини a та b:</text>
<line x1="60.0" y1="90.0" x2="270.1" y2="90.0" stroke="#d98a1e" stroke-width="4.0"/>
<line x1="270.1" y1="90.0" x2="400.0" y2="90.0" stroke="#2457d6" stroke-width="4.0"/>
<line x1="60.0" y1="82.0" x2="60.0" y2="98.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="270.1" y1="82.0" x2="270.1" y2="98.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="400.0" y1="82.0" x2="400.0" y2="98.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="165.1" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d98a1e" text-anchor="middle" font-weight="700">більша частина a</text>
<text x="335.1" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">менша b</text>
<line x1="60.0" y1="70.0" x2="400.0" y2="70.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="60.0" y1="65.0" x2="60.0" y2="75.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="400.0" y1="65.0" x2="400.0" y2="75.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="230.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">ціле (a + b)</text>
<rect x="60.0" y="145.0" width="340.0" height="45.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="230.0" y="172.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">(a + b) / a  =  a / b  =  φ  ≈  1.618034</tspan></text>
<text x="470.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Б. Золотий прямокутник і квадрат:</text>
<rect x="470.0" y="45.0" width="290.0" height="179.2" rx="6" fill="#ffffff" stroke="#d98a1e" stroke-width="2.5"/>
<rect x="470.0" y="45.0" width="179.2" height="179.2" rx="6" fill="#fef3c7" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="559.6" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Квадрат
a × a</text>
<text x="697.6" y="134.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">Подібний
золотий
прямокутник</text>
