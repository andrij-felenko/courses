<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Логіка теореми Віферіха в доведенні ВТФ</text>
<text x="420.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Логічний ланцюжок Артура Віферіха (1909) для перший випадку ВТФ</text>
<rect x="61.3" y="78.4" width="177.3" height="63.2" rx="6" fill="#f8f9fa" stroke="#d0d5dd" stroke-width="1.5"/><text x="150.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Рівняння Ферма</tspan><tspan x="150.0" dy="15.6">x^p + y^p = z^p</tspan><tspan x="150.0" dy="15.6">Перший випадок: p ∤ xyz</tspan></text>
<line x1="260.0" y1="110.0" x2="310.0" y2="110.0" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="306.9" y="78.4" width="266.2" height="63.2" rx="6" fill="#f8f9fa" stroke="#d0d5dd" stroke-width="1.5"/><text x="440.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Розклад на множники</tspan><tspan x="440.0" dy="15.6">(x+y)(x^(p-1) - ... + y^(p-1)) = z^p</tspan><tspan x="440.0" dy="15.6">Арифметика кругових полів</tspan></text>
<line x1="570.0" y1="110.0" x2="620.0" y2="110.0" stroke="#667085" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="651.6" y="78.4" width="156.8" height="63.2" rx="6" fill="#eff8ff" stroke="#84caef" stroke-width="1.5"/><text x="730.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Критерій Віферіха</tspan><tspan x="730.0" dy="15.6">2^(p-1) ≡ 1 (mod p²)</tspan><tspan x="730.0" dy="15.6">Обов'язкова умова!</tspan></text>
<line x1="730.0" y1="170.0" x2="730.0" y2="230.0" stroke="#026aa2" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="150.1" y="245.5" width="579.8" height="69.0" rx="6" fill="#f0fdf4" stroke="#73e2a7" stroke-width="1.5"/><text x="440.0" y="268.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Перевірка простих чисел p &lt; 6.7 · 10¹⁸</tspan><tspan x="440.0" dy="16.2">1. Якщо 2^(p-1) not≡ 1 (mod p²) → Перший випадок ВТФ виконано!</tspan><tspan x="440.0" dy="16.2">2. Для p = 1093 та p = 3511: 3^(p-1) not≡ 1 (mod p²) (Теорема Міріманова 1910)</tspan></text>
<rect x="113.1" y="393.1" width="653.8" height="53.9" rx="6" fill="#ecfdf3" stroke="#12b76a" stroke-width="1.5"/><text x="440.0" y="416.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Висновок: Перший випадок Великої теореми Ферма повністю доведено</tspan><tspan x="440.0" dy="16.9">для всіх простих чисел p у дослідженому діапазоні (і згодом для всіх p Ендрю Уайлсом)</tspan></text>
<line x1="440.0" y1="345.0" x2="440.0" y2="375.0" stroke="#079455" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>