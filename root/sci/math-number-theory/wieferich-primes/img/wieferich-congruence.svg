<svg xmlns="http://www.w3.org/2000/svg" viewBox="-37.2 -10 857.2 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-37.2" y="-10" width="857.2" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння теореми Ферма та умови Віферіха</text>
<text x="410.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія остачі: Мала теорема Ферма проти умови Віферіха</text>
<rect x="40.0" y="75.0" width="350.0" height="370.0" rx="8" fill="#f8f9fa" stroke="#d0d5dd" stroke-width="1.5"/>
<text x="215.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1d2939" text-anchor="middle" font-weight="700">Мала теорема Ферма (mod p)</text>
<text x="215.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Виконується для ВСІХ непарних простих p</text>
<rect x="123.5" y="171.6" width="183.0" height="66.8" rx="6" fill="#ffffff" stroke="#eaecf0" stroke-width="1.5"/><text x="215.0" y="192.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">2^(p-1) ≡ 1 (mod p)</tspan><tspan x="215.0" dy="16.9">2^(p-1) - 1 = k · p</tspan><tspan x="215.0" dy="16.9">W(p) = k  (ціле число)</tspan></text>
<text x="70.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приклад p = 7:</text>
<text x="70.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">2⁶ - 1 = 63 = 9 · 7</text>
<text x="70.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Частка W(7) = 9</text>
<text x="70.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d92d20" text-anchor="middle" font-weight="700">Остача W(7) mod 7 = 2  (не 0!)</text>
<rect x="130.3" y="403.0" width="169.3" height="24.0" rx="6" fill="#fef3f2" stroke="#fda29b" stroke-width="1.5"/><text x="215.0" y="419.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Стандартне просте число</tspan></text>
<rect x="430.0" y="75.0" width="350.0" height="370.0" rx="8" fill="#f0f9ff" stroke="#b2ddff" stroke-width="1.5"/>
<text x="605.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#026aa2" text-anchor="middle" font-weight="700">Умова Віферіха (mod p²)</text>
<text x="605.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Виконується лише для РІДКІСНИХ простих p</text>
<rect x="506.1" y="171.6" width="197.8" height="66.8" rx="6" fill="#ffffff" stroke="#b2ddff" stroke-width="1.5"/><text x="605.0" y="192.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">2^(p-1) ≡ 1 (mod p²)</tspan><tspan x="605.0" dy="16.9">2^(p-1) - 1 = m · p²</tspan><tspan x="605.0" dy="16.9">W(p) = m · p ≡ 0 (mod p)</tspan></text>
<text x="460.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приклад p = 1093:</text>
<text x="460.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">2¹⁰⁹² - 1 = m · 1093²</text>
<text x="460.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">1093² = 1 194 649</text>
<text x="460.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#079455" text-anchor="middle" font-weight="700">Остача W(1093) mod 1093 = 0!</text>
<rect x="475.9" y="403.0" width="258.2" height="24.0" rx="6" fill="#ecfdf3" stroke="#6ce9a6" stroke-width="1.5"/><text x="605.0" y="419.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Просте число Віферіха (p=1093, 3511)</tspan></text>
<text x="410.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Частка Віферіха W(p) = (2^(p-1)-1)/p ділиться на p тоді й лише тоді, коли p — просте Віферіха</text>
</svg>