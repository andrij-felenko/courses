<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">λ бере НСК, φ множить — те саме число, різна збірка</text>
<text x="500.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">360 = 2³ · 3² · 5</text>
<text x="500.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">обидві функції розбирають число на ті самі прості степені</text>
<rect x="159.0" y="120.0" width="192.0" height="58.0" rx="6" fill="#fbfbfc" stroke="#333333" stroke-width="1.6"/><text x="255.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">p^k = 2³</tspan></text>
<text x="255.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="255.0" dy="0.0">аномалія двійки:</tspan><tspan x="255.0" dy="15.6">2^(3−2) = 2</tspan></text>
<text x="255.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">λ = 2</text>
<text x="255.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">φ = 4</text>
<rect x="404.0" y="120.0" width="192.0" height="58.0" rx="6" fill="#fbfbfc" stroke="#333333" stroke-width="1.6"/><text x="500.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">p^k = 3²</tspan></text>
<text x="500.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="500.0" dy="0.0">непарне просте:</tspan><tspan x="500.0" dy="15.6">λ = φ = 6</tspan></text>
<text x="500.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">λ = 6</text>
<text x="500.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">φ = 6</text>
<rect x="649.0" y="120.0" width="192.0" height="58.0" rx="6" fill="#fbfbfc" stroke="#333333" stroke-width="1.6"/><text x="745.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">p^k = 5</tspan></text>
<text x="745.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="745.0" dy="0.0">просте:</tspan><tspan x="745.0" dy="15.6">p − 1 = 4</tspan></text>
<text x="745.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">λ = 4</text>
<text x="745.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">φ = 4</text>
<line x1="255.0" y1="278.0" x2="330.0" y2="366.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="255.0" y1="278.0" x2="690.0" y2="366.0" stroke="#c7ccd3" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="500.0" y1="278.0" x2="330.0" y2="366.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="500.0" y1="278.0" x2="690.0" y2="366.0" stroke="#c7ccd3" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="745.0" y1="278.0" x2="330.0" y2="366.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="745.0" y1="278.0" x2="690.0" y2="366.0" stroke="#c7ccd3" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="256.5" y="357.2" width="147.0" height="85.6" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.4"/><text x="330.0" y="384.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">λ(360)</tspan><tspan x="330.0" dy="20.8">НСК(2, 6, 4)</tspan><tspan x="330.0" dy="20.8">= 12</tspan></text>
<rect x="631.4" y="357.2" width="117.3" height="85.6" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/><text x="690.0" y="384.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">φ(360)</tspan><tspan x="690.0" dy="20.8">4 · 6 · 4</tspan><tspan x="690.0" dy="20.8">= 96</tspan></text>
<text x="330.0" y="476.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">спільний період — вичікує збіг</text>
<text x="690.0" y="476.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">усе населення лишків — множить</text>
<rect x="128.8" y="504.0" width="742.4" height="36.0" rx="6" fill="#fbfbfc" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="526.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">НСК ніколи не більший за добуток  →  λ(n) ≤ φ(n);  тут 12 ділить 96 рівно у 8 разів</tspan></text>
</svg>