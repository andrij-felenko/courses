<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Міст Фрея</text>
<rect x="20.0" y="12.0" width="720.0" height="32.0" rx="4" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.0"/>
<text x="380.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#212529" text-anchor="middle" font-weight="700">Міст Фрея: зв'язок гіпотези Шпіро з гіпотезою ABC</text>
<rect x="40.0" y="60.0" width="290.0" height="85.0" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="185.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1864ab" text-anchor="middle" font-weight="700">Діофантове рівняння</text>
<text x="185.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#212529" text-anchor="middle" font-weight="700">a + b = c,   gcd(a, b) = 1</text>
<text x="185.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Радикал: rad(abc) = ∏ p</text>
<line x1="340.0" y1="102.0" x2="410.0" y2="102.0" stroke="#d9480f" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="375.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d9480f" text-anchor="middle" font-weight="700">Крива</text>
<text x="375.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d9480f" text-anchor="middle" font-weight="700">Фрея</text>
<rect x="420.0" y="60.0" width="300.0" height="85.0" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/>
<text x="570.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e67700" text-anchor="middle" font-weight="700">Еліптична крива E_(a,b)</text>
<text x="570.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#212529" text-anchor="middle" font-weight="700">y² = x(x - a)(x + b)</text>
<text x="570.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Δ_E = 16(abc)²,   N_E = rad(abc)</text>
<line x1="570.0" y1="150.0" x2="570.0" y2="172.0" stroke="#c92a2a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="175.0" width="680.0" height="80.0" rx="6" fill="#ffe3e3" stroke="#e03131" stroke-width="1.5"/>
<text x="380.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c92a2a" text-anchor="middle" font-weight="700">Застосування гіпотези Шпіро до кривої Фрея:</text>
<text x="380.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#212529" text-anchor="middle" font-weight="700">16 (abc)² ≤ C · (rad(abc))^(6+ε)  ⇒  c ≤ C' · (rad(abc))^(1+ε')</text>
<text x="380.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle" font-style="italic">Гіпотеза Шпіро геометрично породжує гіпотезу ABC для цілих чисел</text>
</svg>