<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм модулярних перешкод</text>
<text x="500.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм модулярних перешкод: відсіювання за малими простими модулями q</text>
<rect x="40.0" y="60.0" width="920.0" height="45.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/><text x="500.0" y="87.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Залежність остач pᵢ mod q від початкового значення p₁ mod q для ланцюжка 1-го роду (2p + 1)</tspan></text>
<rect x="40.0" y="120.0" width="290.0" height="32.0" rx="6" fill="#fffde6" stroke="#6b7280" stroke-width="1.5"/><text x="185.0" y="140.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">Модуль q = 3 (Період d = 1)</tspan></text>
<rect x="40.0" y="160.0" width="290.0" height="110.0" rx="6" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.0"/><text x="185.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="185.0" dy="0.0">p₁ ≡ 1 (mod 3) ⇒ p₂ ≡ 0 (mod 3)</tspan><tspan x="185.0" dy="15.6">(p₂ ділиться на 3 → складене!)</tspan><tspan x="185.0" dy="15.6"></tspan><tspan x="185.0" dy="15.6">p₁ ≡ 2 (mod 3) ⇒ pᵢ ≡ 2 (mod 3)</tspan><tspan x="185.0" dy="15.6">(Дозволений клас остачі!)</tspan></text>
<rect x="355.0" y="120.0" width="290.0" height="32.0" rx="6" fill="#fffde6" stroke="#6b7280" stroke-width="1.5"/><text x="500.0" y="140.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Модуль q = 5 (Період d = 4)</tspan></text>
<rect x="355.0" y="160.0" width="290.0" height="110.0" rx="6" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.0"/><text x="500.0" y="194.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">2⁴ ≡ 1 (mod 5)</tspan><tspan x="500.0" dy="11.7">Якщо p₁ ≢ 4 (mod 5), то кожний 4-й член буде ≡ 0 (mod 5).</tspan><tspan x="500.0" dy="11.7"></tspan><tspan x="500.0" dy="11.7">Максимальна довжина без p₁ ≡ 4:</tspan><tspan x="500.0" dy="11.7">k ≤ 4!</tspan></text>
<rect x="670.0" y="120.0" width="290.0" height="32.0" rx="6" fill="#fffde6" stroke="#6b7280" stroke-width="1.5"/><text x="815.0" y="140.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">Модуль q = 7 (Період d = 3)</tspan></text>
<rect x="670.0" y="160.0" width="290.0" height="110.0" rx="6" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.0"/><text x="815.0" y="194.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">2³ ≡ 1 (mod 7)</tspan><tspan x="815.0" dy="11.7">Якщо p₁ ≢ 6 (mod 7), то кожний 3-й член буде ≡ 0 (mod 7).</tspan><tspan x="815.0" dy="11.7"></tspan><tspan x="815.0" dy="11.7">Максимальна довжина без p₁ ≡ 6:</tspan><tspan x="815.0" dy="11.7">k ≤ 3!</tspan></text>
<rect x="40.0" y="295.0" width="920.0" height="195.0" rx="6" fill="#e6f7ee" stroke="#c0392b" stroke-width="2.0"/><text x="500.0" y="366.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">ГОЛОВНИЙ ВИСНОВОК ЩОДО ДОВГИХ ЛАНЦЮЖКІВ:</tspan><tspan x="500.0" dy="11.7"></tspan><tspan x="500.0" dy="11.7">• Для будь-якого простого модуля q, якщо p₁ + 1 ≢ 0 (mod q), ланцюжок 1-го роду обов'язково містить член, кратний q, не пізніше ніж через d кроків (де d — порядок двійки mod q).</tspan><tspan x="500.0" dy="11.7">• Щоб побудувати довгий ланцюжок (k ≥ 6), початковий член p₁ ПОВИНЕН задовольняти систему конгруенцій:</tspan><tspan x="500.0" dy="11.7">  p₁ ≡ -1 ≡ 2 (mod 3),  p₁ ≡ -1 ≡ 4 (mod 5),  p₁ ≡ -1 ≡ 6 (mod 7),  p₁ ≡ -1 ≡ 10 (mod 11)...</tspan><tspan x="500.0" dy="11.7">• За Китайською теоремою про остачі це означає: p₁ ≡ -1 (mod 3·5·7·11...) = -1 (mod 2310...).</tspan></text>
</svg>