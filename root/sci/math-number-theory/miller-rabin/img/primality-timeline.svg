<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1180" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві стежки до швидкого тесту простоти</text>
<rect x="26.0" y="144.0" width="158.0" height="76.0" rx="6" fill="#eef2fe" stroke="#2457d6" stroke-width="1.5"/><text x="105.0" y="170.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">детерміновані —</tspan><tspan x="105.0" dy="15.6">точні лише за</tspan><tspan x="105.0" dy="15.6">гіпотези Рімана</tspan></text>
<rect x="26.0" y="310.0" width="158.0" height="76.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="105.0" y="336.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">імовірнісні —</tspan><tspan x="105.0" dy="15.6">безумовні, з</tspan><tspan x="105.0" dy="15.6">керованою похибкою</tspan></text>
<text x="352.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Ґері Міллер · 1976</text>
<rect x="245.0" y="139.0" width="214.0" height="86.0" rx="6" fill="#eef2fe" stroke="#2457d6" stroke-width="2.0"/><text x="352.0" y="170.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="352.0" dy="0.0">детермінований,</tspan><tspan x="352.0" dy="16.2">поліноміальний —</tspan><tspan x="352.0" dy="16.2">за гіпотези Рімана</tspan></text>
<text x="1050.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">AKS · 2002</text>
<rect x="943.0" y="139.0" width="214.0" height="86.0" rx="6" fill="#eef2fe" stroke="#2457d6" stroke-width="2.0"/><text x="1050.0" y="170.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1050.0" dy="0.0">Аґравал, Каял, Саксена:</tspan><tspan x="1050.0" dy="16.2">безумовний,</tspan><tspan x="1050.0" dy="16.2">детермінований</tspan></text>
<text x="486.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Соловей–Штрассен · 1977</text>
<rect x="379.0" y="305.0" width="214.0" height="86.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/><text x="486.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="486.0" dy="0.0">перший практичний</tspan><tspan x="486.0" dy="16.2">імовірнісний тест,</tspan><tspan x="486.0" dy="16.2">похибка 2⁻ᵏ</tspan></text>
<text x="900.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Рабін · Моньє · 1980</text>
<rect x="793.0" y="305.0" width="214.0" height="86.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/><text x="900.0" y="336.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">безумовний</tspan><tspan x="900.0" dy="16.2">імовірнісний тест,</tspan><tspan x="900.0" dy="16.2">похибка 4⁻ᵏ</tspan></text>
<line x1="465.0" y1="182.0" x2="937.0" y2="182.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="701.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">той самий сон — уже без гіпотези (26 років)</text>
<line x1="599.0" y1="348.0" x2="787.0" y2="348.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="693.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="693.0" dy="0.0">та сама ідея,</tspan><tspan x="693.0" dy="12.6">вдвічі гостріша межа</tspan></text>
<line x1="352.0" y1="229.0" x2="886.0" y2="299.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="582.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="582.0" dy="0.0">критерій Міллера +</tspan><tspan x="582.0" dy="13.2">випадкові основи</tspan></text>
</svg>