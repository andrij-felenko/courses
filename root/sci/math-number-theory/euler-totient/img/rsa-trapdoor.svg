<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">RSA: φ(n) — це і є секрет</text>
<rect x="77.1" y="69.0" width="125.7" height="51.9" rx="6" fill="#fbfbfc" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">m = 7</tspan><tspan x="140.0" dy="16.9">(повідомлення)</tspan></text>
<rect x="424.5" y="69.0" width="110.9" height="51.9" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">c = 13</tspan><tspan x="480.0" dy="16.9">(шифротекст)</tspan></text>
<rect x="757.1" y="69.0" width="125.7" height="51.9" rx="6" fill="#fbfbfc" stroke="#333333" stroke-width="1.5"/><text x="820.0" y="91.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">m = 7</tspan><tspan x="820.0" dy="16.9">(розшифровано)</tspan></text>
<line x1="208.9" y1="95.0" x2="416.5" y2="95.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="313.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">c = m³ mod 55</text>
<line x1="541.5" y1="95.0" x2="749.1" y2="95.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="650.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">m = c²⁷ mod 55</text>
<rect x="294.9" y="164.1" width="370.3" height="51.9" rx="6" fill="#fbfbfc" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="186.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">e·d = 3·27 = 81 = 1 + 2·40 = 1 + 2·φ(n)</tspan><tspan x="480.0" dy="16.9">c^d = m^(1+2·φ(n)) = m · (m^φ(n))² ≡ m · 1² = m</tspan></text>
<rect x="60.0" y="250.0" width="390.0" height="145.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="255.0" y="281.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">ВІДКРИТО — бачать усі</tspan><tspan x="255.0" dy="18.2"></tspan><tspan x="255.0" dy="18.2">n = 55</tspan><tspan x="255.0" dy="18.2">e = 3</tspan><tspan x="255.0" dy="18.2"></tspan><tspan x="255.0" dy="18.2">цього досить, щоб зашифрувати</tspan></text>
<rect x="510.0" y="250.0" width="390.0" height="145.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="2.0"/><text x="705.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">ТАЄМНО — знає лише власник</tspan><tspan x="705.0" dy="18.2"></tspan><tspan x="705.0" dy="18.2">p = 5,  q = 11</tspan><tspan x="705.0" dy="18.2">φ(n) = (p−1)(q−1) = 40</tspan><tspan x="705.0" dy="18.2">d = 27,  бо 3·27 ≡ 1 (mod 40)</tspan></text>
<rect x="247.7" y="427.0" width="464.7" height="36.0" rx="6" fill="#fbfbfc" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="449.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">розклад n   ⇄   φ(n)   ⇄   d      —  одне дає решту</tspan></text>
<text x="480.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">для 2048-бітного n усі три однаково недосяжні</text>
</svg>