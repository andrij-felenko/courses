<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 545" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="545" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три доведення Ейлера: від бінома до перестановки</text>
<text x="510.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три доведення Ейлера: інструмент вирішує, доки видно</text>
<text x="154.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">праця</text>
<text x="478.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">інструмент</text>
<text x="832.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">доки дістає</text>
<rect x="46.0" y="102.0" width="216.0" height="104.0" rx="6" fill="#ffffff" stroke="#cfd4da" stroke-width="1.4"/><text x="154.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="154.0" dy="0.0">E54</tspan><tspan x="154.0" dy="16.9">читано 2.VIII.1736</tspan><tspan x="154.0" dy="16.9">друк 1741</tspan></text>
<rect x="292.0" y="102.0" width="372.0" height="104.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="2.0"/><text x="478.0" y="150.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="478.0" dy="0.0">індукція за a + біном (a+1)ᵖ</tspan><tspan x="478.0" dy="16.9">просте вбиває середні коефіцієнти</tspan></text>
<rect x="690.0" y="102.0" width="284.0" height="104.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/><text x="832.0" y="149.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="832.0" dy="0.0">aᵖ ≡ a (mod p)</tspan><tspan x="832.0" dy="17.6">тільки просте p</tspan></text>
<line x1="270.0" y1="154.0" x2="284.0" y2="154.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="672.0" y1="154.0" x2="682.0" y2="154.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="46.0" y="232.0" width="216.0" height="104.0" rx="6" fill="#ffffff" stroke="#cfd4da" stroke-width="1.4"/><text x="154.0" y="271.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="154.0" dy="0.0">E262</tspan><tspan x="154.0" dy="16.9">Берлін 13.II.1755</tspan><tspan x="154.0" dy="16.9">друк 1761</tspan></text>
<rect x="292.0" y="232.0" width="372.0" height="104.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="478.0" y="280.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="478.0" dy="0.0">множення на a переставляє лишки</tspan><tspan x="478.0" dy="16.9">ланцюг степенів мусить замкнутися</tspan></text>
<rect x="690.0" y="232.0" width="284.0" height="104.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/><text x="832.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="832.0" dy="0.0">порядок ділить p − 1</tspan><tspan x="832.0" dy="17.6">повне твердження Ферма</tspan></text>
<line x1="270.0" y1="284.0" x2="284.0" y2="284.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="672.0" y1="284.0" x2="682.0" y2="284.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="46.0" y="362.0" width="216.0" height="104.0" rx="6" fill="#ffffff" stroke="#cfd4da" stroke-width="1.4"/><text x="154.0" y="401.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="154.0" dy="0.0">E271</tspan><tspan x="154.0" dy="16.9">Берлін 8.VI.1758</tspan><tspan x="154.0" dy="16.9">друк 1763</tspan></text>
<rect x="292.0" y="362.0" width="372.0" height="104.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="478.0" y="410.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="478.0" dy="0.0">той самий хід, але переставляють</tspan><tspan x="478.0" dy="16.9">самі лише взаємно прості з n</tspan></text>
<rect x="690.0" y="362.0" width="284.0" height="104.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/><text x="832.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="832.0" dy="0.0">a^φ(n) ≡ 1 (mod n)</tspan><tspan x="832.0" dy="17.6">будь-яке n</tspan></text>
<line x1="270.0" y1="414.0" x2="284.0" y2="414.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="672.0" y1="414.0" x2="682.0" y2="414.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="46.0" y1="219.0" x2="974.0" y2="219.0" stroke="#e3e6ea" stroke-width="1.0"/>
<line x1="46.0" y1="349.0" x2="974.0" y2="349.0" stroke="#e3e6ea" stroke-width="1.0"/>
<text x="510.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Червоне не узагальнюється: біном працює рівно тому, що p просте. Зелене про простоту не питало ніколи.</text>
</svg>