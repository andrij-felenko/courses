<text x="490.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">2³⁷ − 1 = 223 · 616318177</text>
<text x="490.0" y="532.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Складене — досконалого числа з нього не вийде. Другий кандидат зі списку, а не сорок восьме просте поспіль.</text>
