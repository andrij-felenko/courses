<text x="490.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">62 штуки не доходячи й до 300 — а йти треба до √(2³⁷−1) = 370727. Усього 31 579 ділень.</text>
