<rect x="150.0" y="400.0" width="280.0" height="62.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="2.0"/><text x="290.0" y="427.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">149 = 74·2 + 1</tspan><tspan x="290.0" dy="17.6">2³⁷ mod 149 = 105 — мимо</tspan></text>
