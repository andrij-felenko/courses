<text x="490.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">2³⁷ − 1 = 137438953471.  Просте — чи ні?</text>
<text x="490.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">Щоб довести, що ні, треба пред'явити дільник. Усе питання — де його шукати.</text>
