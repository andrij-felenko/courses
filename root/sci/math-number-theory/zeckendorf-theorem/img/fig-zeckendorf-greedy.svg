<text x="390.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#212529" text-anchor="middle" font-weight="700">Запис у фібоначчієвій системі (1000010100_Fib): 89 + 8 + 3 (жодні два розряди не сусідять)</text>
