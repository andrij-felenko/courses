<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 370" width="840" height="370">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#1a1a1a" />
  </marker>
</defs>
<rect x="0.0" y="0.0" width="840.0" height="370.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр скалярного множення Q = [k]P на основі τ-NAF</text>
<rect x="40.0" y="63.4" width="180.0" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="83.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Скаляр k ∈ [1, r-1]</tspan><tspan x="130.0" dy="15.6">та точка P ∈ Eₐ(F₂ᵐ)</tspan><tspan x="130.0" dy="15.6">(довжина k: m бітів)</tspan></text>
<line x1="225.0" y1="95.0" x2="275.0" y2="95.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="280.0" y="63.4" width="240.0" height="63.2" rx="6" fill="#fdf8e6" stroke="#d4ac0d" stroke-width="1.5"/><text x="400.0" y="83.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Модулярна редукція Солінаса:</tspan><tspan x="400.0" dy="15.6">ρ = k mod δ  в кільці Z[τ]</tspan><tspan x="400.0" dy="15.6">ρ = r₀ + r₁τ, де N(ρ) &lt; 2ᵐ / h</tspan></text>
<line x1="525.0" y1="95.0" x2="575.0" y2="95.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="585.0" y="55.6" width="230.0" height="78.8" rx="6" fill="#fdf8e6" stroke="#d4ac0d" stroke-width="1.5"/><text x="700.0" y="75.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Генерація розкладу τ-NAF:</tspan><tspan x="700.0" dy="15.6">ρ = ∑ uᵢ τⁱ</tspan><tspan x="700.0" dy="15.6">uᵢ ∈ {0, ±1}, uᵢ·uᵢ₊₁ = 0</tspan><tspan x="700.0" dy="15.6">(довжина l ≤ m + a)</tspan></text>
<line x1="700.0" y1="155.0" x2="700.0" y2="195.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="80.0" y="201.6" width="680.0" height="116.8" rx="6" fill="#edfbf2" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="220.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Акумуляція за схемою Горнера (Frobenius-and-Add):</tspan><tspan x="420.0" dy="14.3">Q = O;</tspan><tspan x="420.0" dy="14.3">for i = l - 1 downto 0:</tspan><tspan x="420.0" dy="14.3">    Q = τ(Q);                // Фробеніус: (x², y²) замість [2]Q</tspan><tspan x="420.0" dy="14.3">    if uᵢ == +1: Q = Q + P;  // Звичайне додавання точки</tspan><tspan x="420.0" dy="14.3">    if uᵢ == -1: Q = Q - P;  // Додавання з від'ємним знаком: (x, x + y)</tspan><tspan x="420.0" dy="14.3">return Q;</tspan></text>
<line x1="420.0" y1="318.0" x2="420.0" y2="342.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="435.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Результат: Q = [k]P з нульовою кількістю подвоєнь точок!</text>
</svg>