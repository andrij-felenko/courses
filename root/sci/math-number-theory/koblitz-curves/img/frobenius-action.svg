<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#1a1a1a" />
  </marker>
  <marker id="arr-pos" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#c0392b" />
  </marker>
  <marker id="arr-field" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#27ae60" />
  </marker>
</defs>
<rect x="0.0" y="0.0" width="820.0" height="360.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння: Класичне подвоєння точки [2]P проти автоморфізму Фробеніуса τ(P)</text>
<rect x="70.0" y="60.0" width="280.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="81.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Вхідна точка P = (x, y)</tspan><tspan x="210.0" dy="16.9">на кривій E(F₂ᵐ)</tspan></text>
<line x1="210.0" y1="120.0" x2="210.0" y2="160.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="215.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Класичне подвоєння [2]P</text>
<rect x="40.0" y="195.9" width="340.0" height="88.2" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="215.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Геометричне подвоєння:</tspan><tspan x="210.0" dy="14.3">λ = x + y / x</tspan><tspan x="210.0" dy="14.3">x₃ = λ² + λ + a</tspan><tspan x="210.0" dy="14.3">y₃ = x² + (λ + 1)x₃</tspan><tspan x="210.0" dy="14.3">Ціна: 1 інверсія + 2 множення + 2 піднесення</tspan></text>
<rect x="470.0" y="60.0" width="280.0" height="49.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="81.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Вхідна точка P = (x, y)</tspan><tspan x="610.0" dy="16.9">на кривій Кобліца Eₐ(F₂ᵐ)</tspan></text>
<line x1="610.0" y1="120.0" x2="610.0" y2="160.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="615.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Ендоморфізм Фробеніуса τ(P)</text>
<rect x="440.0" y="195.9" width="340.0" height="88.2" rx="6" fill="#edfbf2" stroke="#27ae60" stroke-width="1.5"/><text x="610.0" y="215.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Покоординатний підйом:</tspan><tspan x="610.0" dy="14.3">τ(x, y) = (x², y²)</tspan><tspan x="610.0" dy="14.3">У нормальному базисі: циклічний зсув бітів на 1</tspan><tspan x="610.0" dy="14.3">У поліноміальному базисі: лінійне множення O(m)</tspan><tspan x="610.0" dy="14.3">Ціна: 0 множень та 0 інверсій кривої (~1 такт)</tspan></text>
<rect x="30.0" y="316.0" width="760.0" height="32.0" rx="6" fill="#eef3fc" stroke="#2457d6" stroke-width="1.5"/><text x="410.0" y="336.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Рівняння Кобліца: τ² - μτ + 2 = 0  ⇒  [2]P = μτ(P) - τ²(P) (подвоєння виключається з обчислень)</tspan></text>
</svg>