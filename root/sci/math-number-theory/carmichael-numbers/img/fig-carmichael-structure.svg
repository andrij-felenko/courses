<text x="400.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#d9822b" text-anchor="middle" font-weight="700">Чи ділять ці числа 561 - 1 = 560?</text>
<text x="400.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#d9822b" text-anchor="middle">560 = 2 · 280 = 10 · 56 = 16 · 35 (Так!)</text>
