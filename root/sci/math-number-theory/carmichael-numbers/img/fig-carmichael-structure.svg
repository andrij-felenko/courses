<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Теорема Корсельта та структура числа Кармайкла 561</text>
<text x="400.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="24" fill="#2b7b9c" text-anchor="middle" font-weight="700">561 = 3 · 11 · 17</text>
<rect x="200.0" y="150.0" width="100.0" height="50.0" rx="10" fill="#e8f4f8" stroke="#2b7b9c" stroke-width="2.0"/>
<text x="250.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2b7b9c" text-anchor="middle" font-weight="700">p₁ = 3</text>
<rect x="350.0" y="150.0" width="100.0" height="50.0" rx="10" fill="#e8f4f8" stroke="#2b7b9c" stroke-width="2.0"/>
<text x="400.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2b7b9c" text-anchor="middle" font-weight="700">p₂ = 11</text>
<rect x="500.0" y="150.0" width="100.0" height="50.0" rx="10" fill="#e8f4f8" stroke="#2b7b9c" stroke-width="2.0"/>
<text x="550.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2b7b9c" text-anchor="middle" font-weight="700">p₃ = 17</text>
<text x="250.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle">p₁ - 1 = 2</text>
<text x="400.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle">p₂ - 1 = 10</text>
<text x="550.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle">p₃ - 1 = 16</text>
