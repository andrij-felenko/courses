<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 812" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="812" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Життя теореми: справжня хронологія й пізніший міф</text>
<line x1="232.0" y1="94.0" x2="232.0" y2="762.0" stroke="#d7dbe0" stroke-width="2.4"/>
<circle cx="232.0" cy="128.0" r="10.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="202.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1640</text>
<line x1="244.0" y1="128.0" x2="266.0" y2="128.0" stroke="#c9ced4" stroke-width="1.4"/>
<text x="274.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="274.0" dy="0.0">Ферма формулює теорему в листі до Френікля де Бессі —</tspan><tspan x="274.0" dy="17.8">без доведення («боюся, воно надто довге»)</tspan></text>
<circle cx="232.0" cy="228.0" r="10.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="202.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">~1683</text>
<line x1="244.0" y1="228.0" x2="266.0" y2="228.0" stroke="#c9ced4" stroke-width="1.4"/>
<text x="274.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="274.0" dy="0.0">Ляйбніц доводить її по суті так само —</tspan><tspan x="274.0" dy="17.8">у рукописі, що лишився неопублікованим</tspan></text>
<circle cx="232.0" cy="328.0" r="10.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="202.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1736</text>
<line x1="244.0" y1="328.0" x2="266.0" y2="328.0" stroke="#c9ced4" stroke-width="1.4"/>
<text x="274.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="274.0" dy="0.0">Ейлер друкує першу доводку</tspan><tspan x="274.0" dy="17.8">в Петербурзькій академії наук</tspan></text>
<circle cx="232.0" cy="428.0" r="10.0" fill="#6b7280" stroke="#6b7280" stroke-width="2.0"/>
<text x="202.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="end" font-weight="700">1850-ті</text>
<line x1="244.0" y1="428.0" x2="266.0" y2="428.0" stroke="#c9ced4" stroke-width="1.4"/>
<text x="274.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="274.0" dy="0.0">Лі Шаньлань висуває свій (хибний) критерій;</tspan><tspan x="274.0" dy="17.8">його підхоплює західна синологія</tspan></text>
<circle cx="232.0" cy="528.0" r="10.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<text x="202.0" y="533.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="end" font-weight="700">1897–98</text>
<line x1="244.0" y1="528.0" x2="266.0" y2="528.0" stroke="#c9ced4" stroke-width="1.4"/>
<text x="274.0" y="522.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="274.0" dy="0.0">Джинс приписує критерій «часам Конфуція» —</tspan><tspan x="274.0" dy="17.8">так постає міф про стародавній Китай</tspan></text>
<circle cx="232.0" cy="628.0" r="10.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="202.0" y="633.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">1913</text>
<line x1="244.0" y1="628.0" x2="266.0" y2="628.0" stroke="#c9ced4" stroke-width="1.4"/>
<text x="274.0" y="622.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="274.0" dy="0.0">Гензель уводить у друк назву</tspan><tspan x="274.0" dy="17.8">«мала теорема Ферма» (kleiner Fermatscher Satz)</tspan></text>
<circle cx="232.0" cy="728.0" r="10.0" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<circle cx="232.0" cy="728.0" r="16.0" fill="none" stroke="#27ae60" stroke-width="2.0"/>
<text x="202.0" y="733.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="end" font-weight="700">1959</text>
<line x1="244.0" y1="728.0" x2="266.0" y2="728.0" stroke="#c9ced4" stroke-width="1.4"/>
<text x="274.0" y="722.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="274.0" dy="0.0">Нідем викриває вигадку</tspan><tspan x="274.0" dy="17.8">й повертає авторство XIX століттю</tspan></text>
<circle cx="150.0" cy="806.0" r="8.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="170.0" y="811.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">розвиток теореми</text>
<circle cx="360.6" cy="806.0" r="8.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<text x="380.6" y="811.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">міф про давнину</text>
<circle cx="563.7" cy="806.0" r="8.0" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<circle cx="563.7" cy="806.0" r="13.0" fill="none" stroke="#27ae60" stroke-width="1.6"/>
<text x="583.7" y="811.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">спростування</text>
</svg>