<text x="640.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розбиття прямокутника 3 × 5:</text>
<text x="640.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">● Точок нижче діагоналі (y &lt; 11/7 x):</text>
<text x="640.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">   Σ ⌊11x/7⌋ = 1 + 3 + 4 = 8 точок</text>
<text x="640.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">● Точок вище діагоналі (y &gt; 11/7 x):</text>
<text x="640.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">   Σ ⌊7y/11⌋ = 0 + 1 + 1 + 2 + 3 = 7 точок</text>
<text x="640.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усього: 8 + 7 = 15 = ((7-1)/2) · ((11-1)/2)</text>
<text x="640.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Символ (7/11)(11/7) = (-1)⁸⁺⁷ = (-1)¹⁵ = -1</text>
<text x="420.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Прямокутник розміру ((p-1)/2) × ((q-1)/2) розбивається діагоналлю на два підрахунки точок</text>
