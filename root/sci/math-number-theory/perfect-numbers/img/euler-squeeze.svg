<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оберт Ойлера: σ(m) = m + c затискає m у просте число</text>
<text x="500.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Рівняння досконалості лишає для σ(m) єдину можливість:   σ(m) = m + c,   c = m ∕ (2ᵏ⁺¹ − 1)</text>
<text x="460.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">σ(m) — сума ВСІХ дільників m</text>
<rect x="150.0" y="122.0" width="471.2" height="62.0" rx="5" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="385.6" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#27ae60" text-anchor="middle" font-weight="700">m</text>
<rect x="621.2" y="122.0" width="148.8" height="62.0" rx="5" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/>
<text x="695.6" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2457d6" text-anchor="middle" font-weight="700">c</text>
<text x="695.6" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">c = m ∕ (2ᵏ⁺¹ − 1)</text>
<line x1="770.0" y1="106.0" x2="770.0" y2="218.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5,4"/>
<rect x="784.0" y="122.0" width="92.0" height="62.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="830.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">d ?</text>
<text x="830.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">не влазить</text>
<text x="500.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">m і c — уже два дільники m, і їхня сума m + c ВЖЕ дорівнює σ(m).</tspan><tspan x="500.0" dy="21.0">Тож інших дільників m немає; а 1 завжди ділить m — отже 1 і є менший із двох, c = 1.</tspan></text>
<rect x="300.0" y="300.0" width="400.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="500.0" y="328.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">m має РІВНО два дільники  ⟹  m просте</tspan></text>
<line x1="500.0" y1="346.0" x2="500.0" y2="372.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="300.0" y="372.0" width="400.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="500.0" y="398.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">а два дільники простого — це 1 і m  ⟹  c = 1, m = 2ᵏ⁺¹ − 1</tspan></text>
<line x1="500.0" y1="418.0" x2="500.0" y2="444.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="215.0" y="444.0" width="570.0" height="56.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.6"/><text x="500.0" y="477.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">n = 2ᵏ · (2ᵏ⁺¹ − 1),  де 2ᵏ⁺¹ − 1 просте  —  форма Евкліда</tspan></text>
</svg>