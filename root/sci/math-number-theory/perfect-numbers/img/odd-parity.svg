<rect x="64.0" y="282.0" width="200.0" height="66.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.6"/><text x="164.0" y="302.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="164.0" dy="0.0">q^α</tspan><tspan x="164.0" dy="16.9">q ≡ 1 (mod 4)</tspan><tspan x="164.0" dy="16.9">α ≡ 1 (mod 4)</tspan></text>
