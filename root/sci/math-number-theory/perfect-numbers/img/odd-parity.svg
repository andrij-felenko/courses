<rect x="240.0" y="382.0" width="520.0" height="56.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="3.0"/><text x="500.0" y="415.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">N = q^α · m²,   q ≡ α ≡ 1 (mod 4),   q ∤ m</tspan></text>
