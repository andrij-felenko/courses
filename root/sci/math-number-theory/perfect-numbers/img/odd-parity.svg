<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Форма Ойлера випливає з одного підрахунку парності</text>
<rect x="150.0" y="60.0" width="700.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.2"/><text x="500.0" y="92.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">N непарне  ⟹  σ(N) = 2N ≡ 2 (mod 4):  v₂(σ(N)) = 1</tspan></text>
<text x="500.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">σ(N) — добуток цеглинок σ(pᵢ^aᵢ); рівно одна з них парна:</text>
