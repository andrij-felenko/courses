<rect x="84.0" y="138.0" width="622.0" height="54.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.2"/><text x="395.0" y="170.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">Ω(N) ≥ 101  простих множників (з кратністю)</tspan></text>
<rect x="726.0" y="138.0" width="200.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="826.0" y="169.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="826.0" dy="0.0">Ошем–Рао, 2012</tspan></text>
<rect x="84.0" y="204.0" width="622.0" height="54.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.2"/><text x="395.0" y="236.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">ω(N) ≥ 10  РІЗНИХ простих множників</tspan></text>
<rect x="726.0" y="204.0" width="200.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="826.0" y="235.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="826.0" dy="0.0">Нільсен, 2015</tspan></text>
<rect x="84.0" y="270.0" width="622.0" height="54.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.2"/><text x="395.0" y="302.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">найбільший простий дільник  &gt;  10⁸</tspan></text>
<rect x="726.0" y="270.0" width="200.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="826.0" y="301.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="826.0" dy="0.0">Ґото–Оно, 2008</tspan></text>
<rect x="84.0" y="336.0" width="622.0" height="54.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.2"/><text x="395.0" y="368.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">другий за величиною простий дільник  &gt;  10⁴</tspan></text>
<rect x="726.0" y="336.0" width="200.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="826.0" y="367.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="826.0" dy="0.0">Іаннуччі, 1999</tspan></text>
<rect x="84.0" y="402.0" width="622.0" height="54.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.2"/><text x="395.0" y="434.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="395.0" dy="0.0">форма Ойлера:  q^α · m²,  q ≡ α ≡ 1 (mod 4)</tspan></text>
<rect x="726.0" y="402.0" width="200.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="826.0" y="433.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="826.0" dy="0.0">Ойлер, XVIII ст.</tspan></text>
<rect x="84.0" y="476.0" width="832.0" height="56.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="500.0" y="508.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Усі умови — «якщо існує, то…»: вони відрізають малі числа, але стелі над 10¹⁵⁰⁰ немає. Кут вузький — та не порожній.</tspan></text>
