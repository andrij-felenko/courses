<text x="620.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">(2ᵖ−1)·2ᵖ / 2 = 2^(p−1)(2ᵖ−1)</text>
