<rect x="320.0" y="248.0" width="36.0" height="40.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="338.0" y="272.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">3</text><rect x="356.0" y="248.0" width="36.0" height="40.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="374.0" y="272.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">3</text>
<text x="122.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="end" font-weight="700">a = 21</text>
<text x="122.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="end" font-weight="700">b = 15</text>
<text x="122.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="end" font-weight="700">a − b = 6</text>
<line x1="320.0" y1="94.0" x2="320.0" y2="302.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5,4"/>
<line x1="392.0" y1="94.0" x2="392.0" y2="302.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="356.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">хвіст a понад b</text>
<text x="266.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="266.0" dy="0.0">мірка d = 3 вкладається ціло 7 разів у a і 5 разів у b —</tspan><tspan x="266.0" dy="19.5">отже вкладається ціло й у хвіст a − b (рівно 2 рази)</tspan></text>
<text x="560.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Крок не міняє спільних дільників</text>
<text x="568.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="start">d | a  і  d | b   ⟹   d | (a − b)</text>
<text x="568.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start">d | b  і  d | (a − b)   ⟹   d | a</text>
<text x="560.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="560.0" dy="0.0">Стрілки в обидва боки, тому пари (a, b) і (b, a − b)</tspan><tspan x="560.0" dy="20.2">мають ТУ САМУ множину спільних дільників —</tspan><tspan x="560.0" dy="20.2">а отже й той самий найбільший її елемент.</tspan></text>
<rect x="560.0" y="316.0" width="380.0" height="58.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.5"/><text x="750.0" y="352.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">НСД(a, b) = НСД(b, a − b)</tspan></text>
<text x="750.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Дільники шукати не треба — досить віднімати.</text>
</svg>