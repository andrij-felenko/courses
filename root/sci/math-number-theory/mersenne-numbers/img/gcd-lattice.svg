<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ізоморфізм ґраток НСД показників та чисел Мерсенна</text>
<text x="480.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Збереження НСД: НСД(2ᵃ − 1, 2ᵇ − 1) = 2^(НСД(a, b)) − 1</text>
<rect x="60.0" y="85.0" width="380.0" height="240.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/><text x="250.0" y="137.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Показники степеня:</tspan><tspan x="250.0" dy="18.2"></tspan><tspan x="250.0" dy="18.2">a = 12,  b = 18</tspan><tspan x="250.0" dy="18.2"></tspan><tspan x="250.0" dy="18.2">НСД(12, 18) = 6</tspan><tspan x="250.0" dy="18.2"></tspan><tspan x="250.0" dy="18.2">Алгоритм Евкліда:</tspan><tspan x="250.0" dy="18.2">18 = 1 · 12 + 6</tspan><tspan x="250.0" dy="18.2">12 = 2 · 6 + 0</tspan></text>
<line x1="450.0" y1="205.0" x2="510.0" y2="205.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="455.0" y="160.0" width="50.0" height="30.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="179.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Mₙ</tspan></text>
<rect x="520.0" y="85.0" width="380.0" height="240.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="710.0" y="146.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Числа Мерсенна:</tspan><tspan x="710.0" dy="18.2"></tspan><tspan x="710.0" dy="18.2">M₁₂ = 4095,  M₁₈ = 262143</tspan><tspan x="710.0" dy="18.2"></tspan><tspan x="710.0" dy="18.2">НСД(M₁₂, M₁₈) = M₆ = 63</tspan><tspan x="710.0" dy="18.2"></tspan><tspan x="710.0" dy="18.2">Алгоритм Евкліда на Mₙ:</tspan><tspan x="710.0" dy="18.2">M₁₈ = 2⁶ · M₁₂ + M₆</tspan></text>
<rect x="80.0" y="350.0" width="800.0" height="45.0" rx="6" fill="#fffde6" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="376.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Операція n ↦ 2ⁿ − 1 є ізоморфізмом адитивної ґратки НСД натуральних чисел у мультиплікативну ґратку чисел Мерсенна</tspan></text>
</svg>