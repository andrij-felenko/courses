<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура розкладу M6 через дільники показника</text>
<text x="480.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розклад числа Мерсенна M₆ = 2⁶ − 1 = 63 через дільники показника</text>
<rect x="280.0" y="70.0" width="400.0" height="55.0" rx="6" fill="#f3e8fa" stroke="#1a1a1a" stroke-width="2.0"/><text x="480.0" y="103.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">M₆ = 111111₂ = 63₁₀</tspan></text>
<line x1="380.0" y1="130.0" x2="240.0" y2="185.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="190.0" width="380.0" height="180.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/><text x="240.0" y="240.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Показник a = 2 (дві одиниці):</tspan><tspan x="240.0" dy="17.6">M₂ = 11₂ = 3₁₀</tspan><tspan x="240.0" dy="17.6"></tspan><tspan x="240.0" dy="17.6">111111₂ = 11₂ · (100010₂ + 1₂)</tspan><tspan x="240.0" dy="17.6">63 = 3 · 21</tspan><tspan x="240.0" dy="17.6">Блоки: [11][11][11]</tspan></text>
<line x1="580.0" y1="130.0" x2="720.0" y2="185.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="530.0" y="190.0" width="380.0" height="180.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="720.0" y="240.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Показник b = 3 (три одиниці):</tspan><tspan x="720.0" dy="17.6">M₃ = 111₂ = 7₁₀</tspan><tspan x="720.0" dy="17.6"></tspan><tspan x="720.0" dy="17.6">111111₂ = 111₂ · (1001₂)</tspan><tspan x="720.0" dy="17.6">63 = 7 · 9</tspan><tspan x="720.0" dy="17.6">Блоки: [111][111]</tspan></text>
<rect x="150.0" y="390.0" width="660.0" height="35.0" rx="6" fill="#fffde6" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="412.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Загальний принцип: Якщо a | b, то Ma | Mb</tspan></text>
</svg>