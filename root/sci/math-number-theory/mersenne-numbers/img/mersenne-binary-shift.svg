<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двійкова анатомія та циклічний зсув чисел Мерсенна</text>
<text x="480.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двійкова структура числа M₅ = 2⁵ − 1 = 31 та циклічний зсув</text>
<rect x="50.0" y="75.0" width="410.0" height="140.0" rx="6" fill="#e8eefc" stroke="#2457d6" stroke-width="2.0"/><text x="255.0" y="140.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Степінь двійки: 2⁵ = 32₁₀ = 100000₂</tspan><tspan x="255.0" dy="18.2">Одна одиниця у 5-му розряді</tspan></text>
<rect x="500.0" y="75.0" width="410.0" height="140.0" rx="6" fill="#e6f7ee" stroke="#27ae60" stroke-width="2.0"/><text x="705.0" y="140.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Число Мерсенна: M₅ = 2⁵ − 1 = 31₁₀ = 11111₂</tspan><tspan x="705.0" dy="18.2">Заповнена стрічка з 5 одиниць</tspan></text>
<line x1="465.0" y1="145.0" x2="495.0" y2="145.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="245.0" width="860.0" height="145.0" rx="6" fill="#fffde6" stroke="#333333" stroke-width="1.8"/><text x="480.0" y="304.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Особливість арифметики за модулем Mₙ = 2ⁿ − 1:</tspan><tspan x="480.0" dy="18.2">Множення на 2ᵏ еквівалентне циклічному зсуву бітів у n-бітовому регістрі</tspan><tspan x="480.0" dy="18.2">2ⁿ ≡ 1 (mod Mₙ) ⇒ Переповнення вищого розряду повертається у молодший біт</tspan></text>
</svg>