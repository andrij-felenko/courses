<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Редукційна драбина для рівняння x² - y³ = 1</text>
<rect x="10.0" y="10.0" width="780.0" height="40.0" rx="6" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
<text x="400.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#212529" text-anchor="middle" font-weight="700">Редукційна драбина розв'язання рівняння Ойлера x² - y³ = 1</text>
<rect x="200.0" y="65.0" width="400.0" height="45.0" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="400.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1864ab" text-anchor="middle" font-weight="700">Крок 1: x² - 1 = y³  ⇒  x — непарне (x = 2k + 1)</text>
<line x1="400.0" y1="110.0" x2="400.0" y2="130.0" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200.0" y="130.0" width="400.0" height="45.0" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="400.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1864ab" text-anchor="middle" font-weight="700">Крок 2: 4k(k + 1) = y³  ⇒  k(k + 1) = 2 · m³</text>
<line x1="400.0" y1="175.0" x2="400.0" y2="195.0" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="150.0" y="195.0" width="500.0" height="50.0" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/>
<text x="400.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle">Крок 3: Оскільки НСД(k, k + 1) = 1, маємо дві підсистеми:</text>
<text x="400.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d9480f" text-anchor="middle" font-weight="700">Варіант А: k = u³, k+1 = 2v³   або   Варіант Б: k = 2u³, k+1 = v³</text>
<line x1="400.0" y1="245.0" x2="400.0" y2="265.0" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="150.0" y="265.0" width="500.0" height="55.0" rx="6" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="1.5"/>
<text x="400.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2b8a3e" text-anchor="middle" font-weight="700">Крок 4: Аналіз варіанта Б: v³ - 2u³ = 1</text>
<text x="400.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2b8a3e" text-anchor="middle">Найменший розв'язок у натуральних числах: u = 1, v = 1 ⇒ k = 1, k + 1 = 2</text>
<line x1="400.0" y1="320.0" x2="400.0" y2="340.0" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="200.0" y="340.0" width="400.0" height="50.0" rx="6" fill="#ffe3e3" stroke="#e03131" stroke-width="2.0"/>
<text x="400.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c92a2a" text-anchor="middle" font-weight="700">Результат: k = 1  ⇒  x = 2(1) + 1 = 3,  y = 2</text>
<text x="400.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c92a2a" text-anchor="middle" font-weight="700">Єдиний розв'язок: 3² - 2³ = 9 - 8 = 1</text>
</svg>