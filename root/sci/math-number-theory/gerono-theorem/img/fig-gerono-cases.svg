<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація діофантового рівняння xᵃ - yᵇ = 1</text>
<rect x="10.0" y="10.0" width="780.0" height="40.0" rx="6" fill="#f8f9fa" stroke="#ced4da" stroke-width="1.5"/>
<text x="400.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#212529" text-anchor="middle" font-weight="700">Класифікація діофантового рівняння xᵃ - yᵇ = 1 та область теореми Жероно</text>
<rect x="20.0" y="65.0" width="760.0" height="275.0" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5"/>
<rect x="40.0" y="85.0" width="340.0" height="235.0" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
<text x="210.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1864ab" text-anchor="middle" font-weight="700">Область теореми Жероно (a = 2 або b = 2)</text>
<rect x="55.0" y="125.0" width="310.0" height="80.0" rx="5" fill="#ffffff" stroke="#74c0fc" stroke-width="1.2"/>
<text x="210.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1971c2" text-anchor="middle" font-weight="700">Випадок b = 2: xᵃ - y² = 1 (a ≥ 2)</text>
<text x="210.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle" font-weight="700">Теорема Лебега (1850)</text>
<text x="210.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e03131" text-anchor="middle" font-weight="700">Результат: ЖОДНОГО розв'язку в N (x,y ≥ 2)</text>
<rect x="55.0" y="225.0" width="310.0" height="80.0" rx="5" fill="#ffffff" stroke="#74c0fc" stroke-width="1.2"/>
<text x="210.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1971c2" text-anchor="middle" font-weight="700">Випадок a = 2: x² - yᵇ = 1 (b ≥ 2)</text>
<text x="210.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle" font-weight="700">Теорема Жероно (1870)</text>
<text x="210.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2b8a3e" text-anchor="middle" font-weight="700">Єдиний розв'язок: 3² - 2³ = 1 (x=3, y=2, b=3)</text>
<rect x="420.0" y="85.0" width="340.0" height="235.0" rx="6" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/>
<text x="590.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#f59f00" text-anchor="middle" font-weight="700">Загальна гіпотеза Каталана (a, b ≥ 3)</text>
<rect x="435.0" y="125.0" width="310.0" height="180.0" rx="5" fill="#ffffff" stroke="#ffe066" stroke-width="1.2"/>
<text x="590.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d9480f" text-anchor="middle" font-weight="700">Рівняння xᵖ - y𝑞 = 1 (p, q — непарні прості)</text>
<text x="590.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle">Доведено П. Міхайлеску (2002)</text>
<text x="590.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">Використано кругові поля,</text>
<text x="590.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#495057" text-anchor="middle">числа класів та модулярні межі</text>
<text x="590.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e03131" text-anchor="middle" font-weight="700">Результат: ЖОДНОГО розв'язку для p,q ≥ 3</text>
</svg>