<text x="415.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="start">Скалярний добуток ⟨χ_a, χ_b⟩ = ∑_{n (mod q)} χ_a(n) · χ̄_b(n)</text>
<rect x="62.4" y="289.4" width="355.1" height="91.3" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="240.0" y="309.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">1. Перше співвідношення ортогональності:</tspan><tspan x="240.0" dy="15.0">∑_{n (mod q)} χ_a(n) · χ̄_b(n) = φ(q) · δ_{a,b}</tspan><tspan x="240.0" dy="15.0"></tspan><tspan x="240.0" dy="15.0">Харатери утворюють ортонормований</tspan><tspan x="240.0" dy="15.0">базис у просторі функцій на (ℤ/qℤ)*</tspan></text>
<rect x="357.5" y="289.4" width="405.0" height="91.3" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="560.0" y="309.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#065f46" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">2. Проекційний фільтр арифметичної прогресії:</tspan><tspan x="560.0" dy="15.0">∑_{χ (mod q)} χ̄(a) · χ(n) = φ(q),  якщо n ≡ a (mod q)</tspan><tspan x="560.0" dy="15.0">∑_{χ (mod q)} χ̄(a) · χ(n) = 0,     якщо n ≢ a (mod q)</tspan><tspan x="560.0" dy="15.0"></tspan><tspan x="560.0" dy="15.0">Виділяє елементи потрібного класу a (mod q)!</tspan></text>
<rect x="-19.2" y="406.5" width="838.4" height="31.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="400.0" y="425.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Ключовий висновок: Ортогональність характерів перетворює суму за арифметичною прогресією на лінійну комбінацію L-функцій</tspan></text>
