<text x="700.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">-10 = (-2)·5</text>
<circle cx="580.0" cy="275.0" r="6.0" fill="#d9534f" stroke="#333333" stroke-width="1.5"/>
<text x="580.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d9534f" text-anchor="middle" font-weight="700">-13</text>
<path d="M 700 245 Q 640 230 585 250" stroke="#d9534f" fill="none" stroke-width="2"/>
<text x="640.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d9534f" text-anchor="middle" font-weight="700">остача r = -3</text>
</svg>