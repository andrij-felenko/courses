<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння ділення з остачею для -13 ÷ 5: Евклідове (math) vs Усічене (C/C++)</text>
<rect x="40.0" y="60.0" width="820.0" height="110.0" rx="6" fill="#f8f9fa" stroke="#27ae60" stroke-width="1.5"/>
<text x="60.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">1. Евклідове ділення (Математичний стандарт: остача 0 ≤ r &lt; 5):</text>
<text x="60.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2c3e50" text-anchor="start">Рівність: -13 = (-3) · 5 + 2   ⇒   частка q = -3, остача r = +2</text>
<line x1="450.0" y1="145.0" x2="830.0" y2="145.0" stroke="#7f8c8d" stroke-width="1.5"/>
<circle cx="500.0" cy="145.0" r="5.0" fill="#27ae60" stroke="#333333" stroke-width="1.5"/>
<text x="500.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">-15 = (-3)·5</text>
<circle cx="700.0" cy="145.0" r="5.0" fill="#2c3e50" stroke="#333333" stroke-width="1.5"/>
<text x="700.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle">-10 = (-2)·5</text>
<circle cx="580.0" cy="145.0" r="6.0" fill="#d9534f" stroke="#333333" stroke-width="1.5"/>
<text x="580.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d9534f" text-anchor="middle" font-weight="700">-13</text>
<path d="M 500 115 Q 540 100 575 120" stroke="#27ae60" fill="none" stroke-width="2"/>
<text x="540.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">остача r = +2</text>
<rect x="40.0" y="190.0" width="820.0" height="110.0" rx="6" fill="#fdf2f2" stroke="#d9534f" stroke-width="1.5"/>
<text x="60.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#d9534f" text-anchor="start" font-weight="700">2. Усічене ділення (Truncation division у C/C++/Java: остача бере знак діленого):</text>
<text x="60.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2c3e50" text-anchor="start">Рівність: -13 = (-2) · 5 + (-3)   ⇒   частка q = -2, остача r = -3</text>
