<rect x="470.0" y="55.0" width="305.0" height="400.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
<text x="622.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Фундаментальні тотожності</text>
<rect x="480.0" y="95.0" width="285.0" height="95.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="622.5" y="117.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="622.5" dy="0.0">Тотожність Якобі 4-х степенів:</tspan><tspan x="622.5" dy="14.3">θ₃(q)⁴ = θ₂(q)⁴ + θ₄(q)⁴</tspan><tspan x="622.5" dy="14.3"></tspan><tspan x="622.5" dy="14.3">Для будь-якого |q| &lt; 1 квадрат суми</tspan><tspan x="622.5" dy="14.3">θ₃⁴ дає суму квадратів θ₂⁴ та θ₄⁴.</tspan></text>
<rect x="480.0" y="200.0" width="285.0" height="110.0" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="622.5" y="234.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="622.5" dy="0.0">Гранична поведінка при q → 0:</tspan><tspan x="622.5" dy="11.7">● θ₃(q) = 1 + 2q + O(q⁴)</tspan><tspan x="622.5" dy="11.7">● θ₄(q) = 1 - 2q + O(q⁴)</tspan><tspan x="622.5" dy="11.7">● θ₂(q) = 2·q¹/⁴ · (1 + q² + O(q⁶))</tspan><tspan x="622.5" dy="11.7">При малик q ряд збігається експоненціально швидко!</tspan></text>
<rect x="480.0" y="320.0" width="285.0" height="120.0" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="622.5" y="355.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="622.5" dy="0.0">Модулярна двоїстість q → 1⁻:</tspan><tspan x="622.5" dy="14.3">При q = e^(-π t) та t → 0⁺:</tspan><tspan x="622.5" dy="14.3">● θ₃(e^(-π t)) ~ 1 / √t</tspan><tspan x="622.5" dy="14.3">● θ₂(e^(-π t)) ~ 1 / √t</tspan><tspan x="622.5" dy="14.3">● θ₄(e^(-π t)) ~ 2 · e^(-π/(4t)) / √t</tspan></text>
</svg>