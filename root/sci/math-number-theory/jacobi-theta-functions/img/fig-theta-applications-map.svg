<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Мережа застосувань тета-функцій Якобі в теорії чисел та аналізі</text>
<rect x="270.0" y="60.0" width="260.0" height="70.0" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2.0"/>
<text x="400.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">Тета-функції Якобі θᵢ(z, q)</text>
<text x="400.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">q = e^(iπτ),  Im(τ) &gt; 0</text>
<line x1="330.0" y1="130.0" x2="175.0" y2="175.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="25.0" y="175.0" width="290.0" height="125.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="170.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="700">Теорія чисел: Суми квадратів</text>
<rect x="35.0" y="210.0" width="270.0" height="80.0" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/><text x="170.0" y="225.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">● θ₃(q)ᵏ = ∑ rₖ(n) qⁿ</tspan><tspan x="170.0" dy="14.3">● r₂(n) = 4 (d₁(n) - d₃(n))</tspan><tspan x="170.0" dy="14.3">● r₄(n) = 8 ∑_{d|n, 4∤d} d (Лагранж)</tspan><tspan x="170.0" dy="14.3">● r₈(n) = 16 ∑_{d|n} (-1)ⁿ⁻ᵈ d³</tspan></text>
<line x1="470.0" y1="130.0" x2="625.0" y2="175.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="485.0" y="175.0" width="290.0" height="125.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="630.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7f1d1d" text-anchor="middle" font-weight="700">Фізика: Рівняння теплопровідності</text>
<rect x="495.0" y="210.0" width="270.0" height="80.0" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><text x="630.0" y="225.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">● Фундаментальний розв'язок на колі:</tspan><tspan x="630.0" dy="14.3">  ∂u/∂t = D · ∂²u/∂x²</tspan><tspan x="630.0" dy="14.3">● θ₃(z, τ) задовольняє диференціальне</tspan><tspan x="630.0" dy="14.3">  рівняння в частинних похідних.</tspan></text>
<line x1="310.0" y1="130.0" x2="175.0" y2="330.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="25.0" y="330.0" width="290.0" height="125.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="170.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#14532d" text-anchor="middle" font-weight="700">Аналітична теорія чисел: ζ(s)</text>
<rect x="35.0" y="365.0" width="270.0" height="80.0" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/><text x="170.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">● Перетворення Мелліна тета-константи:</tspan><tspan x="170.0" dy="13.0">  π⁻ˢ/² Γ(s/2) ζ(s) = ∫₀^∞ xˢ/²⁻¹ ψ(x) dx</tspan><tspan x="170.0" dy="13.0">● Функціональне рівняння ζ(s) випливає</tspan><tspan x="170.0" dy="13.0">  безпосередньо з θ₃(1/t) = √t · θ₃(t).</tspan></text>
<line x1="490.0" y1="130.0" x2="625.0" y2="330.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="485.0" y="330.0" width="290.0" height="125.0" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
<text x="630.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#78350f" text-anchor="middle" font-weight="700">Обчислення: Еліптичні інтеграли &amp; AGM</text>
<rect x="495.0" y="365.0" width="270.0" height="80.0" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/><text x="630.0" y="387.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">● Модуль k = (θ₂(q)/θ₃(q))²</tspan><tspan x="630.0" dy="14.3">● Повний інтеграл K(k) = (π/2) · θ₃(q)²</tspan><tspan x="630.0" dy="14.3">● Квадратично збіжне обчислення π та</tspan><tspan x="630.0" dy="14.3">  спеціальних функцій через AGM Ґаусса.</tspan></text>
</svg>