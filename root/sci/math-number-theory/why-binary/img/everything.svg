<text x="430.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Усе цифрове — це біти; а ось як саме з бітів робити ЧИСЛА</text>
<text x="430.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">число, текст, зображення, звук — усе кодують тими самими 0 і 1; різниця лише в домовленості тлумачення</text>
<rect x="360.0" y="150.0" width="160.0" height="60.0" rx="10" fill="#fff8e8" stroke="#caa24a" stroke-width="2"/>
<text x="440.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0 1 0 1 1 0 …</text>
<text x="440.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">біти</text>
<rect x="50.0" y="104.0" width="160.0" height="52.0" rx="8" fill="#eef4ff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="130.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ЧИСЛО</text>
<text x="130.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">233, −7, 3.14</text>
<line x1="360.0" y1="180.0" x2="210.0" y2="130.0" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#aInk)"/>
<rect x="50.0" y="214.0" width="160.0" height="52.0" rx="8" fill="#eef4ff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="130.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ТЕКСT</text>
<text x="130.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">'A' = 65</text>
<line x1="360.0" y1="180.0" x2="210.0" y2="240.0" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#aInk)"/>
<rect x="650.0" y="104.0" width="160.0" height="52.0" rx="8" fill="#eef4ff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="730.0" y="126.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ЗОБРАЖЕННЯ</text>
<text x="730.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">піксель = R,G,B</text>
<line x1="520.0" y1="180.0" x2="650.0" y2="130.0" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#aInk)"/>
<rect x="650.0" y="214.0" width="160.0" height="52.0" rx="8" fill="#eef4ff" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="730.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ЗВУК</text>
<text x="730.0" y="254.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">відлік амплітуди</text>
<line x1="520.0" y1="180.0" x2="650.0" y2="240.0" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#aInk)"/>
<text x="440.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Розділ 17 — про лівий верхній квадрат: ЧИСЛА з 0 і 1</text>
<text x="430.0" y="336.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Опанувавши числа, ви зрозумієте й решту: текст, колір, звук — це теж числа, лише інакше витлумачені.</text>
</svg>
