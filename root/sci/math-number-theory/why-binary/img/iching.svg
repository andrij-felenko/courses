<text x="440.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Лейбніц упізнав у тисячолітніх гексаграмах власну двійкову систему — і був вражений до глибини душі.</text>
<text x="440.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Усіх гексаграм (по 6 рисок) — 64, тобто рівно двійкові числа 0…63. Збіг не випадковий: це й є рахунок двома станами.</text>
<text x="440.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Одна й та сама ідея незалежно зринала в різних культурах — настільки вона глибока.</text>
