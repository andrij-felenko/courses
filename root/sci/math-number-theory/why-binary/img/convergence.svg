<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
<rect width="880" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Куди привів цей ланцюг: три потоки 0/1 сходяться в комп'ютері</text>
<text x="440.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">двійкова чекала ~200 років, аж поки фізика й логіка не дали їй тіло — і всі три злилися воєдино</text>
<rect x="70.0" y="110.0" width="280.0" height="52.0" rx="10" fill="#f3f5fd" stroke="#1f47b5" stroke-width="1.8"/>
<text x="210.0" y="132.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ДВА ФІЗИЧНІ СТАНИ</text>
<text x="210.0" y="151.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">напруга низько/високо  (Розділ 14)</text>
<line x1="350.0" y1="136.0" x2="470.0" y2="220.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="70.0" y="185.0" width="280.0" height="52.0" rx="10" fill="#eef7ee" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="210.0" y="207.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">БУЛЕВА ЛОГІКА</text>
<text x="210.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">і / або / не над 0,1  (Розділ 15)</text>
<line x1="350.0" y1="211.0" x2="470.0" y2="220.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="70.0" y="260.0" width="280.0" height="52.0" rx="10" fill="#fdf4f4" stroke="#c0271e" stroke-width="1.8"/>
<text x="210.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">ДВІЙКОВІ ЧИСЛА</text>
<text x="210.0" y="301.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">число з 0 і 1 (Лейбніц)  (Розділ 17)</text>
<line x1="350.0" y1="286.0" x2="470.0" y2="220.0" stroke="#1b1b1b" stroke-width="1.8" marker-end="url(#aInk)"/>
<rect x="470.0" y="160.0" width="340.0" height="120.0" rx="12" fill="#fff8e8" stroke="#caa24a" stroke-width="2"/>
<text x="640.0" y="195.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#9a7322" text-anchor="middle" font-weight="bold" font-style="normal">КОМП'ЮТЕР</text>
<text x="640.0" y="221.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">0 і 1 — це водночас</text>
<text x="640.0" y="243.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">і фізичний стан, і логіка,</text>
<text x="640.0" y="263.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">і ЧИСЛО</text>
<text x="440.0" y="355.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Третій потік — про те, як саме з 0 і 1 робити ЧИСЛА: додатні й від'ємні, дробові, великі.</text>
<text x="440.0" y="378.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Бо щойно «0 і 1» стають числом, біти в регістрах перетворюються на арифметику.</text>
</svg>
