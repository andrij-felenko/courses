<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Метод блокового ділення</text>
<text x="480.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оптимізація обчислення сум згортки Мьобіуса: метод блокового ділення</text>
<text x="480.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Групування однакових значень ⌊N/d⌋ у діапазони [L, R] зменшує кількість кроків від N до 2√N</text>
<text x="480.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розбиття інтервалу d ∈ [1, N] на плато константних значень ⌊N/d⌋</text>
<rect x="52.5" y="125.0" width="55.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/>
<text x="80.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">d=1</text>
<text x="80.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">⌊100/1⌋=100</text>
<rect x="122.5" y="125.0" width="55.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/>
<text x="150.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">d=2</text>
<text x="150.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">⌊100/2⌋=50</text>
<rect x="192.5" y="125.0" width="55.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/>
<text x="220.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">d=3</text>
<text x="220.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">⌊100/3⌋=33</text>
<rect x="262.5" y="125.0" width="55.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/>
<text x="290.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">d=4</text>
<text x="290.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">⌊100/4⌋=25</text>
<rect x="332.5" y="125.0" width="55.0" height="70.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/>
<text x="360.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">d=5</text>
<text x="360.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">⌊100/5⌋=20</text>
<rect x="400.0" y="125.0" width="100.0" height="70.0" rx="6" fill="#f8f9fa" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="450.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">d∈[6..10]</text>
<text x="450.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">⌊100/d⌋∈[10..16]</text>
<rect x="510.0" y="125.0" width="120.0" height="70.0" rx="6" fill="#f8f9fa" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="570.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">d∈[11..20]</text>
<text x="570.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">⌊100/d⌋∈[5..9]</text>
<rect x="645.0" y="125.0" width="130.0" height="70.0" rx="6" fill="#f8f9fa" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="710.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">d∈[21..50]</text>
<text x="710.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">⌊100/d⌋∈[2..4]</text>
<rect x="785.0" y="125.0" width="110.0" height="70.0" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.2"/>
<text x="840.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">d∈[51..100]</text>
<text x="840.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">⌊100/d⌋=1</text>
<rect x="60.0" y="245.0" width="840.0" height="125.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="480.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Сума на блоці [L, R]:   S(L, R) = k · [ M(R) - M(L - 1) ]</text>
<text x="480.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">де k = ⌊N/L⌋ є сталим для всіх d ∈ [L, R], а M(x) = ∑_{i=1}^x μ(i) — префіксна сума Мьобіуса</text>
<text x="480.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e53e3e" text-anchor="middle" font-weight="700">Підсумкова складність обчислення всієї суми: O(√N) замість O(N)</text>
</svg>