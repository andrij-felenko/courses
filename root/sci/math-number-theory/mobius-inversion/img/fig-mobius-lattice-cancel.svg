<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скасування коефіцієнтів Мьобіуса</text>
<text x="480.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм взаємного скасування коефіцієнтів Мьобіуса для n = 30</text>
<text x="480.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Розгортання f(30) = ∑_{d|30} μ(30/d) · g(d) через значення f(k)</text>
<rect x="60.0" y="85.0" width="840.0" height="28.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.0"/>
<text x="100.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">d = 30  ➔  g(30)</text>
<text x="340.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">μ(1) = +1</text>
<text x="480.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">+1 · [f(1)+f(2)+f(3)+f(5)+f(6)+f(10)+f(15)+f(30)]</text>
<rect x="60.0" y="119.0" width="840.0" height="28.0" rx="4" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.0"/>
<text x="100.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">d = 15  ➔  g(15)</text>
<text x="340.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e53e3e" text-anchor="start" font-weight="700">μ(2) = -1</text>
<text x="480.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">-1 · [f(1)+f(3)+f(5)+f(15)]</text>
<rect x="60.0" y="153.0" width="840.0" height="28.0" rx="4" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.0"/>
<text x="100.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">d = 10  ➔  g(10)</text>
<text x="340.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e53e3e" text-anchor="start" font-weight="700">μ(3) = -1</text>
<text x="480.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">-1 · [f(1)+f(2)+f(5)+f(10)]</text>
<rect x="60.0" y="187.0" width="840.0" height="28.0" rx="4" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.0"/>
<text x="100.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">d =  6  ➔  g(6)</text>
<text x="340.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e53e3e" text-anchor="start" font-weight="700">μ(5) = -1</text>
<text x="480.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">-1 · [f(1)+f(2)+f(3)+f(6)]</text>
<rect x="60.0" y="221.0" width="840.0" height="28.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.0"/>
<text x="100.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">d =  5  ➔  g(5)</text>
<text x="340.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">μ(6) = +1</text>
<text x="480.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">+1 · [f(1)+f(5)]</text>
<rect x="60.0" y="255.0" width="840.0" height="28.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.0"/>
<text x="100.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">d =  3  ➔  g(3)</text>
<text x="340.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">μ(10)= +1</text>
<text x="480.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">+1 · [f(1)+f(3)]</text>
<rect x="60.0" y="289.0" width="840.0" height="28.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.0"/>
<text x="100.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">d =  2  ➔  g(2)</text>
<text x="340.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">μ(15)= +1</text>
<text x="480.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">+1 · [f(1)+f(2)]</text>
<rect x="60.0" y="323.0" width="840.0" height="28.0" rx="4" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.0"/>
<text x="100.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">d =  1  ➔  g(1)</text>
<text x="340.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e53e3e" text-anchor="start" font-weight="700">μ(30)= -1</text>
<text x="480.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">-1 · [f(1)]</text>
<rect x="60.0" y="367.0" width="840.0" height="50.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="480.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Сума по кожному f(k) при k &lt; 30:  f(1)·(1-1-1-1+1+1+1-1) = 0,  f(2)·(1-1-1+1) = 0  ➔  залишається тільки 1 · f(30)</text>
</svg>