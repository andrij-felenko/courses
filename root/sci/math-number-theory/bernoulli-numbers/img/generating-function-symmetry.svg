<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Симетрія твірної функції чисел Бернуллі</text>
<text x="400.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Симетрія твірної функції та непарні числа Бернуллі</text>
<text x="400.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Функція g(x) = x/(eˣ − 1) + x/2 є парною: g(−x) = g(x)</text>
<rect x="60.0" y="110.0" width="320.0" height="280.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.3"/>
<text x="220.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Розклад у степеневий ряд</text>
<text x="80.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">x / (eˣ − 1) = ∑ Bₙ · xⁿ / n!</text>
<text x="80.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">= B₀ + B₁·x + B₂·x²/2! + B₃·x³/3! + …</text>
<text x="80.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Оскільки B₀ = 1 та B₁ = −½:</text>
<text x="80.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">x / (eˣ − 1) = 1 − x/2 + ∑ (n≥2) Bₙ·xⁿ/n!</text>
<rect x="420.0" y="110.0" width="320.0" height="280.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.3"/>
<text x="580.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Парність компенсованої функції</text>
<text x="440.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Додамо x/2 до обох частин:</text>
<text x="440.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">g(x) = x / (eˣ − 1) + x/2</text>
<text x="440.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">= 1 + ∑ (n≥2) Bₙ · xⁿ / n!</text>
<text x="440.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Перевірка парності: g(−x) = g(x)</text>
<text x="440.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">⇒ усі коефіцієнти при непарних xⁿ</text>
<text x="440.0" y="381.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">дорівнюють нулю: B₃ = B₅ = B₇ = … = 0</text>
<line x1="390.0" y1="250.0" x2="410.0" y2="250.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">+ x/2</text>
<rect x="95.3" y="413.1" width="609.4" height="53.9" rx="6" fill="#fffbe6" stroke="#ffe58f" stroke-width="1.5"/><text x="400.0" y="436.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Єдине ненульове непарне число Бернуллі — це B₁ = −½ (або +½ залежно від угоди).</tspan><tspan x="400.0" dy="16.9">Усі подальші непарні числа B₃, B₅, B₇, B₉, … тотожно дорівнюють нулю.</tspan></text>
</svg>