<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура сум степенів та числа Бернуллі</text>
<text x="410.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура сум степенів S_m(n) = 1ᵐ + 2ᵐ + … + (n−1)ᵐ</text>
<text x="410.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Коефіцієнти поліномів виражаються через числа Бернуллі Bₖ</text>
<rect x="50.0" y="90.0" width="110.0" height="28.0" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
<text x="105.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Степінь</text>
<rect x="175.0" y="90.0" width="410.0" height="28.0" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
<text x="380.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Формула суми S_m(n)</text>
<rect x="600.0" y="90.0" width="210.0" height="28.0" rx="6" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2"/>
<text x="705.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Нове число Бернуллі</text>
<rect x="50.0" y="120.0" width="110.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="105.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">m = 1</text>
<rect x="175.0" y="120.0" width="410.0" height="58.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="380.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">S₁(n) = ½·n² − ½·n</text>
<rect x="600.0" y="120.0" width="210.0" height="58.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="705.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">B₀ = 1, B₁ = −½</text>
<rect x="50.0" y="195.0" width="110.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="105.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">m = 2</text>
<rect x="175.0" y="195.0" width="410.0" height="58.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="380.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">S₂(n) = ⅓·n³ − ½·n² + ⅙·n</text>
<rect x="600.0" y="195.0" width="210.0" height="58.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="705.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">B₂ = ⅙</text>
<rect x="50.0" y="270.0" width="110.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="105.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">m = 3</text>
<rect x="175.0" y="270.0" width="410.0" height="58.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="380.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">S₃(n) = ¼·n⁴ − ½·n³ + ¼·n²</text>
<rect x="600.0" y="270.0" width="210.0" height="58.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="705.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">B₃ = 0</text>
<rect x="50.0" y="345.0" width="110.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="105.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">m = 4</text>
<rect x="175.0" y="345.0" width="410.0" height="58.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="380.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">S₄(n) = ⅕·n⁵ − ½·n⁴ + ⅓·n³ − ⅓₀·n</text>
<rect x="600.0" y="345.0" width="210.0" height="58.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.4"/>
<text x="705.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">B₄ = −⅓₀</text>
<rect x="94.2" y="418.1" width="631.6" height="53.9" rx="6" fill="#fbfbfc" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="441.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Загальна формула Фаульгабера: S_m(n) = (1 / (m+1)) · ∑ C(m+1, k) · B_k · n^(m+1-k)</tspan><tspan x="410.0" dy="16.9">Числа Бернуллі B_k задають універсальні коефіцієнти для будь-якого степеня m</tspan></text>
</svg>