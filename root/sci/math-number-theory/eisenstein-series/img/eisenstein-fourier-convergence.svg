<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Аналітична структура q-розкладу та арифметичні застосування рядів Ейзенштейна</text>
<rect x="30.0" y="60.0" width="355.0" height="215.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
<text x="207.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Нормалізація та числа Бернуллі B₂ₖ</text>
<rect x="45.0" y="98.0" width="325.0" height="162.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="207.5" y="147.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="207.5" dy="0.0">Від G₂ₖ(τ) до нормалізованого ряда E₂ₖ(τ)</tspan><tspan x="207.5" dy="11.7">● Нормалізація: E₂ₖ(τ) = G₂ₖ(τ) / (2·ζ(2k))</tspan><tspan x="207.5" dy="11.7">● Значення ζ-функції: ζ(2k) = (2π)²ₖ·(-1)ᵏ⁺¹·B₂ₖ / (2·(2k)!)</tspan><tspan x="207.5" dy="11.7">● Загальна формула q-розкладу (q = e^{2πiτ}):</tspan><tspan x="207.5" dy="11.7">  E₂ₖ(τ) = 1 - (4k / B₂ₖ) · ∑_{n=1}^∞ σ₂ₖ₋₁(n)·qⁿ</tspan><tspan x="207.5" dy="11.7">● Звідси коефіцієнти завжди є РАЦІОНАЛЬНИМИ</tspan><tspan x="207.5" dy="11.7">  і цілими для E₄, E₆, E₈, E₁₀, E₁₂, E₁₄!</tspan></text>
<rect x="415.0" y="60.0" width="355.0" height="215.0" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.0"/>
<text x="592.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0369a1" text-anchor="middle" font-weight="700">Мультиплікативна сума дільників σₖ(n)</text>
<rect x="430.0" y="98.0" width="325.0" height="162.0" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/><text x="592.5" y="135.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="592.5" dy="0.0">Значення σ₂ₖ₋₁(n) = ∑_{d|n} d²ₖ⁻¹</tspan><tspan x="592.5" dy="11.7">n  │ σ₁(n)   │ σ₃(n)   │ σ₅(n)    │ σ₇(n)</tspan><tspan x="592.5" dy="11.7">───┼─────────┼─────────┼──────────┼──────────</tspan><tspan x="592.5" dy="11.7">1  │ 1       │ 1       │ 1        │ 1</tspan><tspan x="592.5" dy="11.7">2  │ 3       │ 9       │ 33       │ 129</tspan><tspan x="592.5" dy="11.7">3  │ 4       │ 28      │ 244      │ 2188</tspan><tspan x="592.5" dy="11.7">4  │ 7       │ 73      │ 1057     │ 16513</tspan><tspan x="592.5" dy="11.7">5  │ 6       │ 126     │ 3126     │ 78126</tspan><tspan x="592.5" dy="11.7">● Мультиплікативність: σₖ(m·n) = σₖ(m)·σₖ(n) при gcd(m,n)=1</tspan></text>
<rect x="30.0" y="290.0" width="740.0" height="205.0" rx="6" fill="#fafaf9" stroke="#78716c" stroke-width="1.0"/>
<text x="400.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#292524" text-anchor="middle" font-weight="700">Представлення чисел сумами квадратів r₄(n) та r₈(n)</text>
<rect x="45.0" y="330.0" width="340.0" height="150.0" rx="6" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/><text x="215.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Суми 4 квадратів r₄(n) (Теорема Якобі)</tspan><tspan x="215.0" dy="13.0">● Тета-серія ϑ(τ)⁴ ∈ 𝕄₂(Γ₀(4)) виражається</tspan><tspan x="215.0" dy="13.0">  через ряд Ейзенштейна E₂(τ) зі зсувом:</tspan><tspan x="215.0" dy="13.0">● r₄(n) = 8·∑_{d|n, 4∤d} d = 8·σ₁(n) для непарних n.</tspan><tspan x="215.0" dy="13.0">● Точна комбінаторна формула без залишкових</tspan><tspan x="215.0" dy="13.0">  членів випливає з тотожностей Ейзенштейна!</tspan></text>
<rect x="415.0" y="330.0" width="340.0" height="150.0" rx="6" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/><text x="585.0" y="378.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Суми 8 квадратів r₈(n)</tspan><tspan x="585.0" dy="11.7">● ϑ(τ)⁸ ∈ 𝕄₄(Γ₀(2)) виражається через E₄(τ):</tspan><tspan x="585.0" dy="11.7">● r₈(n) = 16·∑_{d|n} (-1)^{n - d} · d³</tspan><tspan x="585.0" dy="11.7">● Тотожність для E₈ = E₄² дає арифметичний співвідношення:</tspan><tspan x="585.0" dy="11.7">  σ₇(n) = σ₃(n) + 120·∑_{m=1}^{n-1} σ₃(m)·σ₃(n-m).</tspan><tspan x="585.0" dy="11.7">● Глибокий зв'язь між мультиплікативністю та формами.</tspan></text>
</svg>