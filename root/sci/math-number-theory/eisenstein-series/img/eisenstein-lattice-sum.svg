<rect x="455.0" y="55.0" width="320.0" height="440.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
<text x="615.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Аналітичний збіг і вагові класи</text>
<rect x="465.0" y="95.0" width="300.0" height="100.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="615.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Формула ряду G₂ₖ(τ)</tspan><tspan x="615.0" dy="13.0">G₂ₖ(τ) = ∑' 1 / (m·τ + n)²ₖ</tspan><tspan x="615.0" dy="13.0">де ∑' — сумування по всім (m, n) ∈ ℤ² \ {(0,0)}.</tspan><tspan x="615.0" dy="13.0">Парна вага 2k забезпечує G₂ₖ ≠ 0.</tspan></text>
<rect x="465.0" y="205.0" width="300.0" height="130.0" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="615.0" y="243.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Абсолютна збіжність (2k ≥ 4)</tspan><tspan x="615.0" dy="11.7">● Оцінка ряду: ∑ 1 / |m·τ + n|²ₖ</tspan><tspan x="615.0" dy="11.7">● На сфері радіуса R: ~ R елементів, кожен ~ 1 / R²ₖ.</tspan><tspan x="615.0" dy="11.7">● Інтеграл: ∫ R / R²ₖ dR &lt; ∞ ⇔ 2k &gt; 2.</tspan><tspan x="615.0" dy="11.7">● Для k ≥ 2 ряд збігається абсолютно</tspan><tspan x="615.0" dy="11.7">  і рівномірно на компактних підмножинах ℍ.</tspan></text>
<rect x="465.0" y="345.0" width="300.0" height="140.0" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="615.0" y="379.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Умовна збіжність k = 1 (G₂)</tspan><tspan x="615.0" dy="13.0">● Для k = 1 (вага 2): ряд збігається лише УМОВНО!</tspan><tspan x="615.0" dy="13.0">● Порядок сумування має значення:</tspan><tspan x="615.0" dy="13.0">  lim_N ∑_{-N}^N (∑_{n} 1/(m·τ+n)²)</tspan><tspan x="615.0" dy="13.0">● Порушується інваріантність SL(2,ℤ):</tspan><tspan x="615.0" dy="13.0">  G₂(-1/τ) = τ²·G₂(τ) - 2π·i·τ.</tspan><tspan x="615.0" dy="13.0">● Утворює КВАЗІМОДУЛЯРНУ форму.</tspan></text>
</svg>