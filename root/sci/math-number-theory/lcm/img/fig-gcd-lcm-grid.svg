<text x="250.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#333" text-anchor="middle" font-weight="700">Зв'язок НСД та НСК для чисел 12 і 18</text>
