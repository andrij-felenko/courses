<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 510 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="510" height="310" fill="#ffffff"/>
