<text x="310.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Касп: τ → i∞  (j → ∞, q → 0)</text>
<text x="300.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Фундаментальна область 𝔽</text>
<text x="300.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">|τ| ≥ 1,  |Re(τ)| ≤ 1/2</text>
<rect x="583.5" y="164.4" width="183.0" height="131.1" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="675.0" y="183.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">Властивості j(τ):</tspan><tspan x="675.0" dy="14.3">● j(Sτ) = j(−1/τ) = j(τ)</tspan><tspan x="675.0" dy="14.3">● j(Tτ) = j(τ + 1) = j(τ)</tspan><tspan x="675.0" dy="14.3">● Голоморфна в ℍ, простий</tspan><tspan x="675.0" dy="14.3">  полюс у каспі q = 0</tspan><tspan x="675.0" dy="14.3">● Бієкція: ℍ / SL(2,ℤ) ≅ ℂ</tspan><tspan x="675.0" dy="14.3">● Кожен клас ізоморфізму</tspan><tspan x="675.0" dy="14.3">  має рівно одне j ∈ ℂ</tspan></text>
