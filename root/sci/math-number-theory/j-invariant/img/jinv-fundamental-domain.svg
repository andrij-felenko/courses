<text x="308.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">τ = i  (j = 1728)</text>
<circle cx="225.0" cy="241.0" r="5.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="215.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">τ = ρ  (j = 0)</text>
