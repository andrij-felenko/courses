<text x="400.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фундаментальна область 𝔽 модулярної групи SL(2, ℤ) та критичні значення j(τ)</text>
