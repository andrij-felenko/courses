<text x="275.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Im(τ)</text>
<text x="285.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">0</text>
<line x1="225.0" y1="366.0" x2="225.0" y2="374.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="375.0" y1="366.0" x2="375.0" y2="374.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="225.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">−1/2</text>
