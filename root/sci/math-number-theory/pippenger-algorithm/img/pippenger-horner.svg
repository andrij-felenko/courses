<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Агрегація вікон за Горнером: масштабування на 2ᶜ та накопичення</text>
<text x="410.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Міжвіконна схема Горнера: Q = 2ᶜ · ( ... (2ᶜ · S_{b−1} + S_{b−2}) ... ) + S₀</text>
<rect x="29.9" y="88.2" width="120.2" height="43.6" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="90.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">S_{b−1}</tspan><tspan x="90.0" dy="15.6">(старше вікно)</tspan></text>
<rect x="231.1" y="88.2" width="97.8" height="43.6" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="280.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">S_{b−2}</tspan><tspan x="280.0" dy="15.6">(вікно b−2)</tspan></text>
<rect x="468.5" y="88.2" width="83.0" height="43.6" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="510.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">S₁</tspan><tspan x="510.0" dy="15.6">(вікно 1)</tspan></text>
<rect x="646.2" y="88.2" width="127.6" height="43.6" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="710.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">S₀</tspan><tspan x="710.0" dy="15.6">(молодше вікно)</tspan></text>
<rect x="37.4" y="226.0" width="105.3" height="28.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="90.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">Q₁ = S_{b−1}</tspan></text>
<rect x="193.9" y="226.0" width="172.2" height="28.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="280.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">Q₂ = [2ᶜ]Q₁ + S_{b−2}</tspan></text>
<rect x="405.3" y="226.0" width="209.4" height="28.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="510.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Q_{b−1} = [2ᶜ]Q_{b−2} + S₁</tspan></text>
<rect x="627.6" y="226.0" width="164.8" height="28.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="710.0" y="244.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Q = [2ᶜ]Q_{b−1} + S₀</tspan></text>
<line x1="90.0" y1="140.0" x2="90.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="165.0" y1="240.0" x2="180.0" y2="240.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
