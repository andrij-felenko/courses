<rect x="106.4" y="303.0" width="607.2" height="24.0" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="319.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Загальна кількість операцій подвоєння для всіх b вікон: (b − 1) · c ≈ λ подвоєнь</tspan></text>
