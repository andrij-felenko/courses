<text x="390.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">...</text>
<line x1="510.0" y1="140.0" x2="510.0" y2="215.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="525.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">+</text>
<line x1="620.0" y1="240.0" x2="615.0" y2="240.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="610.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">× 2ᶜ (c подвоєнь)</text>
<line x1="710.0" y1="140.0" x2="710.0" y2="215.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
