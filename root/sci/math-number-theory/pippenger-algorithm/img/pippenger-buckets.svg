<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Віконний розподіл по кошиках та обчислення суми вікна Sⱼ</text>
<text x="430.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Розбиття 256-бітного скаляра kᵢ на b вікон шириною c бітів</text>
<rect x="70.0" y="75.0" width="90.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="115.0" y="89.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="115.0" dy="0.0">Вікно b−1</tspan><tspan x="115.0" dy="14.3">[255..240]</tspan></text>
<line x1="160.0" y1="93.0" x2="195.0" y2="93.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
<rect x="195.0" y="75.0" width="90.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="240.0" y="96.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">...</tspan></text>
<line x1="285.0" y1="93.0" x2="320.0" y2="93.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
<rect x="320.0" y="75.0" width="90.0" height="36.0" rx="6" fill="#e8f4fc" stroke="#2457d6" stroke-width="1.5"/><text x="365.0" y="90.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">Вікно j</tspan><tspan x="365.0" dy="11.7">[kᵢ,ⱼ ∈ 0..2ᶜ−1]</tspan></text>
<line x1="410.0" y1="93.0" x2="445.0" y2="93.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
<rect x="445.0" y="75.0" width="90.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="490.0" y="96.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">...</tspan></text>
<line x1="535.0" y1="93.0" x2="570.0" y2="93.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
<rect x="570.0" y="75.0" width="90.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="615.0" y="89.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Вікно 1</tspan><tspan x="615.0" dy="14.3">[31..16]</tspan></text>
<line x1="660.0" y1="93.0" x2="695.0" y2="93.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
<rect x="695.0" y="75.0" width="90.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="740.0" y="89.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Вікно 0</tspan><tspan x="740.0" dy="14.3">[15..0]</tspan></text>
<line x1="365.0" y1="116.0" x2="365.0" y2="160.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Розподіл n точок Pᵢ за значенням коефіцієнта u = kᵢ,ⱼ у 2ᶜ − 1 кошиків</text>
<rect x="50.0" y="175.0" width="110.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="105.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">Кошик B₁</tspan><tspan x="105.0" dy="13.0">∑ Pᵢ (kᵢ,ⱼ = 1)</tspan></text>
<rect x="182.0" y="175.0" width="110.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="237.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="237.0" dy="0.0">Кошик B₂</tspan><tspan x="237.0" dy="13.0">∑ Pᵢ (kᵢ,ⱼ = 2)</tspan></text>
<rect x="314.0" y="175.0" width="110.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="369.0" y="199.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="369.0" dy="0.0">...</tspan><tspan x="369.0" dy="14.3">...</tspan></text>
<rect x="446.0" y="175.0" width="110.0" height="55.0" rx="6" fill="#fef9e7" stroke="#d97706" stroke-width="1.5"/><text x="501.0" y="199.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="501.0" dy="0.0">Кошик Bᵤ</tspan><tspan x="501.0" dy="13.0">∑ Pᵢ (kᵢ,ⱼ = u)</tspan></text>
<rect x="578.0" y="175.0" width="110.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="633.0" y="199.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="633.0" dy="0.0">...</tspan><tspan x="633.0" dy="14.3">...</tspan></text>
<rect x="710.0" y="175.0" width="110.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="765.0" y="199.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="765.0" dy="0.0">Кошик B₂ᶜ₋₁</tspan><tspan x="765.0" dy="11.7">∑ Pᵢ (kᵢ,ⱼ = 2ᶜ−1)</tspan></text>
<text x="430.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Зворотне сумування (Running Sums): Tᵥ = Tᵥ₊₁ + Bᵥ без скалярних множень</text>
<rect x="613.6" y="300.0" width="112.7" height="28.0" rx="6" fill="#f3f4f6" stroke="#2457d6" stroke-width="1.5"/><text x="670.0" y="318.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">T₂ᶜ₋₁ = B₂ᶜ₋₁</tspan></text>
<rect x="379.9" y="300.0" width="120.2" height="28.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="440.0" y="318.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Tᵤ = Tᵤ₊₁ + Bᵤ</tspan></text>
<rect x="77.4" y="300.0" width="105.3" height="28.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="318.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">T₁ = T₂ + B₁</tspan></text>
<line x1="595.0" y1="314.0" x2="525.0" y2="314.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="555.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">+ Bᵤ₊₁...B₂ᶜ₋₂</text>
<line x1="365.0" y1="314.0" x2="215.0" y2="314.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="285.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">+ B₁...Bᵤ₋₁</text>
<rect x="214.5" y="390.1" width="431.1" height="49.9" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="411.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Результат вікна j:</tspan><tspan x="430.0" dy="16.9">Sⱼ = ∑ᵤ u·Bᵤ = ∑ᵥ Tᵥ  (потрібно лише 2ᶜ⁺¹ додавань)</tspan></text>
<line x1="130.0" y1="343.0" x2="310.0" y2="400.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="440.0" y1="343.0" x2="430.0" y2="395.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
