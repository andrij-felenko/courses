<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="22.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Термодинаміка звукового стиску: Ізотерма Ньютона проти Адіабати Лапласа</text>
<rect x="40.0" y="55.0" width="330.0" height="220.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="205.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Модель Ньютона (1687) — Ізотермічна</text>
<text x="205.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Припущення: тепло встигає розсіюватися (T = const)</text>
<rect x="70.0" y="120.0" width="270.0" height="45.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="205.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">dp / dρ = P / ρ  ⇒  c = √( P / ρ )</text>
<text x="205.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Для повітря (0°C): c = 280 м/с  (помилка −16%)</text>
<text x="205.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Причина похибки:</text>
<text x="205.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Частота звуку надто висока для теплопровідності.</text>
<text x="205.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Зони стиску не встигають охолонути,</text>
<text x="205.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">а зони розрідження — нагрітися.</text>
<rect x="410.0" y="55.0" width="330.0" height="220.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="575.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Модель Лапласа (1816) — Адіабатична</text>
<text x="575.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Реальність: теплообмін відсутній (dQ = 0, P·V^γ = const)</text>
<rect x="440.0" y="120.0" width="270.0" height="45.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="575.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">dp / dρ = γ·P / ρ  ⇒  c = √( γ·P / ρ )</text>
<text x="575.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Для повітря (0°C, γ=1.40): c = 331.3 м/с  (збіг 100%)</text>
<text x="575.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фізичний механізм:</text>
<text x="575.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Адіабатичний стиск підвищує температуру T,</text>
<text x="575.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">що створює ДОДАТКОВИЙ пружний тиск.</text>
<text x="575.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поправка Лапласа: √γ ≈ √1.40 ≈ 1.183 (+18%)</text>
<rect x="16.3" y="289.5" width="747.3" height="31.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/><text x="390.0" y="308.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Показник адіабати γ = Cp / Cv: для двоатомних газів (N₂, O₂) γ = 7/5 = 1.40, для одноатомних (He, Ar) γ = 5/3 = 1.67</tspan></text>
</svg>