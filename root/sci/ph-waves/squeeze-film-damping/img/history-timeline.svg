<text x="1040.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">час</text>
<rect x="83.0" y="104.0" width="214.0" height="92.0" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.8"/><text x="190.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Йозеф Стефан</tspan><tspan x="190.0" dy="16.9">«позірна адгезія»:</tspan><tspan x="190.0" dy="16.9">вичавлюваний прошарок,</tspan><tspan x="190.0" dy="16.9">F ∝ μR⁴v / h³</tspan></text>
