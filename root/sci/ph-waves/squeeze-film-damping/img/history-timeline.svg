<text x="272.2" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">1886</text>
<circle cx="272.2" cy="336.0" r="7.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="583.0" y="104.0" width="214.0" height="92.0" rx="6" fill="#f8fafc" stroke="#e08e0b" stroke-width="1.8"/><text x="690.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">В. Е. Ланглуа</tspan><tspan x="690.0" dy="16.9">стисливі плівки для</tspan><tspan x="690.0" dy="16.9">газових підшипників;</tspan><tspan x="690.0" dy="16.9">число стиснення</tspan></text>
