<circle cx="928.8" cy="336.0" r="7.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="398.3" y="267.6" width="262.2" height="48.8" rx="6" fill="#fdf2ef" stroke="#f0c9c0" stroke-width="1.5"/><text x="529.4" y="288.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a5a4a" text-anchor="middle"><tspan x="529.4" dy="0.0">≈ століття майже без уваги —</tspan><tspan x="529.4" dy="16.2">лише світ підшипників і змащування</tspan></text>
