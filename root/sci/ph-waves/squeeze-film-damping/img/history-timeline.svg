<circle cx="786.6" cy="336.0" r="7.0" fill="#e08e0b" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="811.0" y="440.0" width="214.0" height="92.0" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.8"/><text x="918.0" y="465.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="918.0" dy="0.0">Дж. Дж. Блех</tspan><tspan x="918.0" dy="16.9">ізотермічний аналіз:</tspan><tspan x="918.0" dy="16.9">демпфер + пружина —</tspan><tspan x="918.0" dy="16.9">канон MEMS донині</tspan></text>
