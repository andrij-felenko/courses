<text x="190.9" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">1874</text>
<circle cx="190.9" cy="336.0" r="7.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="193.0" y="440.0" width="214.0" height="92.0" rx="6" fill="#f8fafc" stroke="#2457d6" stroke-width="1.8"/><text x="300.0" y="465.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Осборн Рейнольдс</tspan><tspan x="300.0" dy="16.9">теорія змащування;</tspan><tspan x="300.0" dy="16.9">squeeze — один член</tspan><tspan x="300.0" dy="16.9">рівняння Рейнольдса</tspan></text>
