<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часоряд: та сама фізика, від «позірної адгезії» 1874 р. до ворога MEMS</text>
<rect x="874.6" y="316.0" width="101.5" height="40.0" rx="6" fill="#eef4ff" stroke="#c7d8f7" stroke-width="1.2"/>
