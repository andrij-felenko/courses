<rect x="40.0" y="340.0" width="660.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="370.0" y="359.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Принцип роботи:</tspan><tspan x="370.0" dy="14.3">1. BS₁ розщеплює промінь на дві незалежні вітки A та B.</tspan><tspan x="370.0" dy="14.3">2. Досліджуваний об'єкт змінює оптичний шлях n·L у плечі A, створюючи різницю фаз Δφ.</tspan><tspan x="370.0" dy="14.3">3. BS₂ зводить пучки: на виході виникає інтерференція (D₁ та D₂ працюють у протифазі).</tspan></text>
