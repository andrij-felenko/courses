<svg width="820" height="430" viewBox="0 0 820 430" xmlns="http://www.w3.org/2000/svg">
<rect width="820" height="430" fill="#ffffff"/>
<text x="410.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія та класифікація колірних просторів</text>
<rect x="56.2" y="68.2" width="207.5" height="43.6" rx="6" fill="#eef2ff" stroke="#3b82f6" stroke-width="1.5"/><text x="160.0" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Фізіологічний простір LMS</tspan><tspan x="160.0" dy="15.6">(Рецептори сітківки L, M, S)</tspan></text>
<rect x="382.0" y="68.2" width="275.9" height="43.6" rx="6" fill="#eef2ff" stroke="#3b82f6" stroke-width="1.5"/><text x="520.0" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Стандартний спостерігач CIE XYZ 1931</tspan><tspan x="520.0" dy="15.6">(Апаратно-незалежний метамерний базис)</tspan></text>
<line x1="265.8" y1="90.0" x2="380.0" y2="90.0" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="322.9" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Лінійна трансформація</text>
<rect x="114.8" y="202.2" width="210.4" height="55.6" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="220.0" y="219.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Апаратно-залежні простори</tspan><tspan x="220.0" dy="14.3">• RGB (sRGB, Adobe RGB, DCI-P3)</tspan><tspan x="220.0" dy="14.3">• CMYK (Субтрактивний друк)</tspan></text>
<rect x="514.8" y="202.2" width="210.4" height="55.6" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="620.0" y="219.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Рівномірно-перцептивні простори</tspan><tspan x="620.0" dy="14.3">• CIELAB (L*a*b* 1976)</tspan><tspan x="620.0" dy="14.3">• Oklab / Oklch (2020)</tspan></text>
<line x1="480.0" y1="125.0" x2="270.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="540.0" y1="125.0" x2="600.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="105.4" y="337.2" width="229.2" height="55.6" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="220.0" y="354.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Інтуїтивно-циліндричні простори</tspan><tspan x="220.0" dy="14.3">• HSV (Тон, Насиченість, Значення)</tspan><tspan x="220.0" dy="14.3">• HSL (Тон, Насиченість, Світлота)</tspan></text>
<line x1="220.0" y1="270.0" x2="220.0" y2="325.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="502.3" y="337.2" width="235.4" height="55.6" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="620.0" y="354.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Полярний перцептивний простір Oklch</tspan><tspan x="620.0" dy="14.3">• L (Перцептивна світлота)</tspan><tspan x="620.0" dy="14.3">• C (Хрома), h (Колірний тон)</tspan></text>
<line x1="620.0" y1="270.0" x2="620.0" y2="325.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>