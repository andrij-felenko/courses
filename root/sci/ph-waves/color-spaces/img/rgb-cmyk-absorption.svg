<svg width="760" height="350" viewBox="0 0 760 350" xmlns="http://www.w3.org/2000/svg">
<rect width="760" height="350" fill="#ffffff"/>
<rect x="20.0" y="20.0" width="350.0" height="305.0" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
<text x="195.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">Аддитивна модель RGB (Випромінювання)</text>
<rect x="105.5" y="112.2" width="179.0" height="55.6" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/><text x="195.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle"><tspan x="195.0" dy="0.0">Червоний + Зелений + Синій</tspan><tspan x="195.0" dy="14.3">Світлові промені додаються</tspan><tspan x="195.0" dy="14.3">(Сума всіх = Біле світло)</tspan></text>
<text x="195.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Темрява (0,0,0) + Світло променів</text>
<text x="195.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#38bdf8" text-anchor="middle">R + G + B = Всі довжини хвиль (Білий)</text>
<rect x="390.0" y="20.0" width="350.0" height="305.0" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<text x="565.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Субтрактивна модель CMYK (Поглинання)</text>
<rect x="456.7" y="112.2" width="216.6" height="55.6" rx="6" fill="#f8fafc" stroke="#ec4899" stroke-width="1.5"/><text x="565.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="565.0" dy="0.0">Блакитний + Пурпуровий + Жовтий</tspan><tspan x="565.0" dy="14.3">Пігменти поглинають спектр</tspan><tspan x="565.0" dy="14.3">(Сума C+M+Y = Брудний брунатний)</tspan></text>
<text x="565.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Біле світло − Спектральне поглинання пігменту</text>
<text x="565.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">C+M+Y поглинають неідеально → K (Чорний)</text>
<text x="565.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Закон Бугера — Ламберта — Бера</text>
</svg>