<text x="620.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">злам на осі — сімдесят сім років, за які з'явилася апаратура, здатна перевірити спірне</text>
</svg>