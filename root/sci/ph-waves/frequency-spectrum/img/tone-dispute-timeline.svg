<circle cx="847.0" cy="212.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.2"/>
<text x="847.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="847.0" dy="0.0">«Вчення про слухові</tspan><tspan x="847.0" dy="15.6">відчуття»: тембр —</tspan><tspan x="847.0" dy="15.6">це набір обертонів</tspan></text>
