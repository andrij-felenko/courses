<text x="1149.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1149.0" dy="0.0">Бекеші: біжуча</tspan><tspan x="1149.0" dy="15.6">хвиля в завитці;</tspan><tspan x="1149.0" dy="15.6">Кемп: вухо саме</tspan><tspan x="1149.0" dy="15.6">випромінює звук</tspan></text>
