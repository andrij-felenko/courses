<circle cx="92.0" cy="212.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.2"/>
<text x="92.0" y="128.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="92.0" dy="0.0">Зеєбек: сирена</tspan><tspan x="92.0" dy="15.6">з нерівними отворами</tspan><tspan x="92.0" dy="15.6">— тон без основної</tspan></text>
