<text x="92.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">1841</text>
<circle cx="243.0" cy="212.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.2"/>
<text x="243.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="243.0" dy="0.0">Ом: слух — це</tspan><tspan x="243.0" dy="15.6">розклад Фур'є,</tspan><tspan x="243.0" dy="15.6">висота = найнижчий тон</tspan></text>
