<circle cx="394.0" cy="212.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.2"/>
<text x="394.0" y="144.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="394.0" dy="0.0">остання відповідь;</tspan><tspan x="394.0" dy="15.6">Ом іде з акустики</tspan></text>
<line x1="394.0" y1="172.0" x2="394.0" y2="202.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,4"/>
