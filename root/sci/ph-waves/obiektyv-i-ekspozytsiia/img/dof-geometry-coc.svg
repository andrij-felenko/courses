<rect x="112.2" y="368.4" width="635.6" height="63.2" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="430.0" y="388.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Гіперфокальна відстань: H = f² / (N · c)</tspan><tspan x="430.0" dy="15.6">Ближня межа різкості: D_n = (s · H) / (H + s)    |    Дальня межа: D_f = (s · H) / (H - s)</tspan><tspan x="430.0" dy="15.6">При фокусуванні на H різким є весь простір від H / 2 до нескінченності (∞)</tspan></text>
