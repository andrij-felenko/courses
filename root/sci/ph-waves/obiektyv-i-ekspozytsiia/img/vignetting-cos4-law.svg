<line x1="620.0" y1="80.0" x2="620.0" y2="400.0" stroke="#333333" stroke-width="3.5"/>
<text x="620.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">Сенсор зображення</text>
<circle cx="620.0" cy="240.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="635.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Центр: E₀</text>
<circle cx="620.0" cy="110.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<text x="635.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Край: E(θ) = E₀ · cos⁴ θ</text>
<line x1="240.0" y1="240.0" x2="620.0" y2="110.0" stroke="#2457d6" stroke-width="2.0"/>
<path d="M 310,240 A 70 70 0 0 0 304,213" fill="none" stroke="#2457d6" stroke-width="1.8"/>
<text x="325.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">θ</text>
<rect x="187.4" y="352.8" width="485.1" height="94.4" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="430.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Чотири множники закону cos⁴ θ:</tspan><tspan x="430.0" dy="15.6">1. Проекція зіниці на похилий пучок: A(θ) = A₀ · cos θ</tspan><tspan x="430.0" dy="15.6">2. Збільшення відстані до краю: r(θ) = d / cos θ  →  1 / r² ∝ cos² θ</tspan><tspan x="430.0" dy="15.6">3. Закон Ламберта (кут падіння променів на сенсор): ∝ cos θ</tspan><tspan x="430.0" dy="15.6">Підсумок природного віньєтування: E(θ) = E₀ · cos⁴ θ</tspan></text>
<text x="430.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Профіль природного спадання освітленості E(θ)</text>
<line x1="240.0" y1="70.0" x2="620.0" y2="70.0" stroke="#6b7280" stroke-width="1.2"/>
<polyline points="240,110 335,80 430,70 525,80 620,110" fill="none" stroke="#c0392b" stroke-width="2.5"/>
