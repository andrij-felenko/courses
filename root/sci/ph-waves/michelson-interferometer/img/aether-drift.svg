<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 760 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="760" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="740.0" height="380.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ефірний вітер і тривалість прольоту в плечах інтерферометра</text>
<rect x="30.0" y="50.0" width="320.0" height="280.0" rx="6" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="190.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">а) Поздовжнє плече (паралельно v)</text>
<line x1="70.0" y1="95.0" x2="310.0" y2="95.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,3"/>
<line x1="250.0" y1="95.0" x2="110.0" y2="95.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="190.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Ефірний вітер (швидкість −v)</text>
<circle cx="80.0" cy="160.0" r="8.0" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="80.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">BS</text>
<rect x="290.0" y="140.0" width="6.0" height="40.0" rx="6" fill="#94a3b8" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="293.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">M₂</text>
<line x1="88.0" y1="155.0" x2="288.0" y2="155.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="175.0" y1="151.0" x2="185.0" y2="155.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="180.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">вперед: c − v</text>
<line x1="288.0" y1="165.0" x2="88.0" y2="165.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="185.0" y1="169.0" x2="175.0" y2="165.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="180.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">назад: c + v</text>
<rect x="42.1" y="237.3" width="295.9" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">t_поздовжнє = L/(c−v) + L/(c+v)</tspan><tspan x="190.0" dy="14.3">= (2 L c) / (c² − v²) ≈ (2L/c) · (1 + v²/c²)</tspan></text>
<rect x="380.0" y="50.0" width="320.0" height="280.0" rx="6" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="540.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">б) Поперечне плече (перпендикулярно v)</text>
<line x1="440.0" y1="200.0" x2="540.0" y2="120.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="540.0" y1="120.0" x2="640.0" y2="200.0" stroke="#2457d6" stroke-width="2.0"/>
<circle cx="440.0" cy="200.0" r="6.0" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="440.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">BS (t=0)</text>
<rect x="520.0" y="114.0" width="40.0" height="6.0" rx="6" fill="#94a3b8" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="540.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">M₁</text>
<circle cx="640.0" cy="200.0" r="6.0" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="640.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">BS (t=t₂)</text>
<text x="540.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">в ефективне c_eff = √(c² − v²)</text>
<rect x="429.7" y="237.3" width="220.6" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="540.0" y="256.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">t_поперечне = (2 L) / √(c² − v²)</tspan><tspan x="540.0" dy="14.3">≈ (2L/c) · (1 + v²/(2c²))</tspan></text>
<text x="370.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Різниця часу Δt ≈ L·v²/c³ викликає зсув смуг ΔN = 2L·v²/(λ·c²) при повороті установки на 90°.</text>
</svg>