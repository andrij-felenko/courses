<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 740 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="740" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="720.0" height="360.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Типи інтерференційних смуг в інтерферометрі Майкельсона</text>
<rect x="30.0" y="50.0" width="310.0" height="270.0" rx="6" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="185.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">а) Смуги рівного нахилу (M₁ ∥ M₂')</text>
<circle cx="185.0" cy="165.0" r="75.0" fill="#0f172a" stroke="#1a1a1a" stroke-width="1.0"/>
<circle cx="185.0" cy="165.0" r="70.0" fill="#38bdf8" stroke="none" stroke-width="0.0"/>
<circle cx="185.0" cy="165.0" r="58.0" fill="#0f172a" stroke="none" stroke-width="0.0"/>
<circle cx="185.0" cy="165.0" r="46.0" fill="#38bdf8" stroke="none" stroke-width="0.0"/>
<circle cx="185.0" cy="165.0" r="34.0" fill="#0f172a" stroke="none" stroke-width="0.0"/>
<circle cx="185.0" cy="165.0" r="22.0" fill="#38bdf8" stroke="none" stroke-width="0.0"/>
<circle cx="185.0" cy="165.0" r="10.0" fill="#0f172a" stroke="none" stroke-width="0.0"/>
<text x="185.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кільця Гайдінгера (Haidinger rings)</text>
<text x="185.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Строго паралельні дзеркала, Δs = 2d·cos θ</text>
<text x="185.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Центр кільця локалізований у нескінченності</text>
<rect x="380.0" y="50.0" width="310.0" height="270.0" rx="6" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="535.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">б) Смуги рівної товщини (клин α &gt; 0)</text>
<rect x="460.0" y="90.0" width="150.0" height="150.0" rx="4" fill="#0f172a" stroke="#1a1a1a" stroke-width="1.0"/>
<rect x="460.0" y="90.0" width="15.0" height="150.0" rx="6" fill="#38bdf8" stroke="none" stroke-width="0.0"/>
<rect x="490.0" y="90.0" width="15.0" height="150.0" rx="6" fill="#38bdf8" stroke="none" stroke-width="0.0"/>
<rect x="520.0" y="90.0" width="15.0" height="150.0" rx="6" fill="#38bdf8" stroke="none" stroke-width="0.0"/>
<rect x="550.0" y="90.0" width="15.0" height="150.0" rx="6" fill="#38bdf8" stroke="none" stroke-width="0.0"/>
<rect x="580.0" y="90.0" width="15.0" height="150.0" rx="6" fill="#38bdf8" stroke="none" stroke-width="0.0"/>
<text x="535.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Смуги Фізо (Fizeau fringes)</text>
<text x="535.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Невеликий кут клина α між M₁ та M₂'</text>
<text x="535.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Прямі смуги, локалізовані біля дзеркала</text>
<text x="360.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Зміна відстані d змінює радіус кілець, а зміна кута α змінює нахил і крок прямих смуг.</text>
</svg>