<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="15.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відбиття й проходження акустичної хвилі на межі середовищ</text>
<rect x="40.0" y="50.0" width="340.0" height="190.0" rx="6" fill="#eff6ff" stroke="none" stroke-width="1.5"/>
<rect x="380.0" y="50.0" width="340.0" height="190.0" rx="6" fill="#fef3c7" stroke="none" stroke-width="1.5"/>
<line x1="380.0" y1="40.0" x2="380.0" y2="250.0" stroke="#333333" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="380.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межа середовищ (x = 0)</text>
<rect x="121.6" y="55.0" width="116.7" height="49.9" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/><text x="180.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">Середовище 1</tspan><tspan x="180.0" dy="16.9">z₁ = ρ₁ · c₁</tspan></text>
<rect x="501.6" y="55.0" width="116.7" height="49.9" rx="6" fill="#fef08a" stroke="#d97706" stroke-width="1.5"/><text x="560.0" y="76.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">Середовище 2</tspan><tspan x="560.0" dy="16.9">z₂ = ρ₂ · c₂</tspan></text>
<line x1="80.0" y1="125.0" x2="365.0" y2="125.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="210.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Падна хвиля pᵢ (амплітуда Aᵢ)</text>
<line x1="365.0" y1="175.0" x2="80.0" y2="175.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="210.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Відбита хвиля pᵣ = R · pᵢ</text>
<line x1="395.0" y1="150.0" x2="660.0" y2="150.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="520.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Прохідна хвиля pₜ = T · pᵢ</text>
<rect x="97.4" y="251.2" width="225.2" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="271.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Коефіцієнт відбиття за тиском:</tspan><tspan x="210.0" dy="15.6">R = (z₂ − z₁) / (z₂ + z₁)</tspan></text>
<rect x="427.1" y="251.2" width="245.7" height="47.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="550.0" y="271.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Коефіцієнт проходження за тиском:</tspan><tspan x="550.0" dy="15.6">T = 2 · z₂ / (z₂ + z₁)</tspan></text>
</svg>