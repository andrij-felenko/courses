<text x="200.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ΔI₁ = 2 г</text>
<rect x="52.3" y="319.2" width="295.3" height="31.5" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="200.0" y="339.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Відношення: ΔI₁ / I₁ = 2 / 100 = 0.02 (2%)</tspan></text>
