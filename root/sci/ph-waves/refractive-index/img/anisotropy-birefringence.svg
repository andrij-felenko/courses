<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анізотропія та подвійне променезаломлення в одноосьовому кристалі</text>
<rect x="240.0" y="80.0" width="280.0" height="180.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2.0"/>
<text x="380.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="700">Одноосьовий кристал (наприклад, ісландський шпат)</text>
<line x1="260.0" y1="125.0" x2="500.0" y2="215.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="470.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-style="italic">Оптична вісь кристала</text>
<line x1="60.0" y1="170.0" x2="240.0" y2="170.0" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="150.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Неполяризований промінь</text>
<line x1="240.0" y1="170.0" x2="520.0" y2="150.0" stroke="#2563eb" stroke-width="2.0"/>
<line x1="520.0" y1="150.0" x2="700.0" y2="150.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="610.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">Ззвичайний промінь (o-промінь, nₒ)</text>
<line x1="240.0" y1="170.0" x2="520.0" y2="200.0" stroke="#dc2626" stroke-width="2.0"/>
<line x1="520.0" y1="200.0" x2="700.0" y2="200.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="610.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">Незвичайний промінь (e-промінь, nₑ)</text>
<circle cx="380.0" cy="160.0" r="4.0" fill="#2563eb" stroke="#2563eb" stroke-width="1.0"/>
<line x1="380.0" y1="178.0" x2="380.0" y2="194.0" stroke="#dc2626" stroke-width="2.0"/>
<rect x="100.0" y="280.0" width="560.0" height="42.0" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.0" y="304.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="middle"><tspan x="380.0" dy="0.0">Подвійне променезаломлення (Δn = nₑ - nₒ): розщеплення променя на дві ортогонально поляризовані складові</tspan></text>
</svg>