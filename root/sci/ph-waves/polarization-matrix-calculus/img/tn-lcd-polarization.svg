<line x1="193.0" y1="175.0" x2="217.0" y2="175.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="219.6" y1="171.3" x2="242.4" y2="178.7" stroke="#27ae60" stroke-width="2.5"/>
<line x1="247.3" y1="167.9" x2="266.7" y2="182.1" stroke="#27ae60" stroke-width="2.5"/>
<line x1="275.9" y1="165.3" x2="290.1" y2="184.7" stroke="#27ae60" stroke-width="2.5"/>
<line x1="305.3" y1="163.6" x2="312.7" y2="186.4" stroke="#27ae60" stroke-width="2.5"/>
<line x1="335.0" y1="163.0" x2="335.0" y2="187.0" stroke="#27ae60" stroke-width="2.5"/>
<text x="270.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Без напруги (V=0): повертає E на 90°</text>
<line x1="360.0" y1="175.0" x2="420.0" y2="175.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="390.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">J = (0, 1)ᵀ</text>
