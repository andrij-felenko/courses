<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема ЖК-комірки Twisted Nematic (TN) у матричному численні</text>
<line x1="30.0" y1="175.0" x2="90.0" y2="175.0" stroke="#6b7280" stroke-width="3.0" marker-end="url(#arrow)"/>
