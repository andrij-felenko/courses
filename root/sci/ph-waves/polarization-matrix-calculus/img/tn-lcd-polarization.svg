<text x="490.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Світло проходить!</text>
<text x="490.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Стан &quot;Ввімкнено&quot; (Яскравий)</text>
<rect x="545.0" y="80.0" width="165.0" height="230.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/><text x="627.5" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="627.5" dy="0.0">При поданні напруги V:</tspan><tspan x="627.5" dy="11.7"></tspan><tspan x="627.5" dy="11.7">• Молекули РК випрямляються</tspan><tspan x="627.5" dy="11.7">  вздовж поля</tspan><tspan x="627.5" dy="11.7"></tspan><tspan x="627.5" dy="11.7">• Скручування зникає (J_LC = I)</tspan><tspan x="627.5" dy="11.7"></tspan><tspan x="627.5" dy="11.7">• Поляризація залишається H (0°)</tspan><tspan x="627.5" dy="11.7"></tspan><tspan x="627.5" dy="11.7">• Аналізатор 90° блокує H-хвилю</tspan><tspan x="627.5" dy="11.7"></tspan><tspan x="627.5" dy="11.7">• Світло НЕ проходить</tspan><tspan x="627.5" dy="11.7">  (Темний піксель)</tspan></text>
</svg>