<text x="60.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">S_in = (I₀,0,0,0)ᵀ</text>
<rect x="95.0" y="115.0" width="20.0" height="120.0" rx="3" fill="#e0f2fe" stroke="#c0392b" stroke-width="1.5"/>
<line x1="105.0" y1="125.0" x2="105.0" y2="225.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="105.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Поляризатор 0°</text>
<text x="105.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">J = (1, 0)ᵀ</text>
