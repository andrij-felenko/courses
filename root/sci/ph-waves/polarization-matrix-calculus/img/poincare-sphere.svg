<rect x="495.0" y="65.0" width="210.0" height="330.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="600.0" y="129.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">Властивості сфери:</tspan><tspan x="600.0" dy="13.0"></tspan><tspan x="600.0" dy="13.0">• Радіус сфери R = S₀</tspan><tspan x="600.0" dy="13.0">• Поверхня (R=1): P = 1</tspan><tspan x="600.0" dy="13.0">  (повністю поляризоване)</tspan><tspan x="600.0" dy="13.0"></tspan><tspan x="600.0" dy="13.0">• Всередині (R&lt;1): P &lt; 1</tspan><tspan x="600.0" dy="13.0">  (частково поляризоване)</tspan><tspan x="600.0" dy="13.0"></tspan><tspan x="600.0" dy="13.0">• Екватор (S₃=0):</tspan><tspan x="600.0" dy="13.0">  лінійні поляризації</tspan><tspan x="600.0" dy="13.0"></tspan><tspan x="600.0" dy="13.0">• Кути в просторі Стокса:</tspan><tspan x="600.0" dy="13.0">  2ψ (азимут), 2χ (еліптичність)</tspan><tspan x="600.0" dy="13.0"></tspan><tspan x="600.0" dy="13.0">• Фазові платівки:</tspan><tspan x="600.0" dy="13.0">  повертають дугу на сфері</tspan></text>
