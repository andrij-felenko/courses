<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="740.0" height="320.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="370.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Основні фізичні механізми втрати фотонів в оптичному тракті</text>
<rect x="40.0" y="65.0" width="310.0" height="105.0" rx="5" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="52.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">1. Френелівське відбиття</text>
<text x="52.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Межа двох середовищ (n₁ ≠ n₂)</text>
<text x="52.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">R = ((n₁ - n₂)/(n₁ + n₂))²</text>
<text x="52.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Втрата ~4% на кожній незахищеній межі скло-повітря</text>
<rect x="390.0" y="65.0" width="310.0" height="105.0" rx="5" fill="#f0f4fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="402.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">2. Об'ємне поглинання</text>
<text x="402.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Перетворення фотонів у тепло</text>
<text x="402.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">I(x) = I₀ · e⁻ᵃˣ (Закон Бера)</text>
<text x="402.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Примішки OH⁻ у склі, молекулярне поглинання</text>
<rect x="40.0" y="185.0" width="310.0" height="105.0" rx="5" fill="#f0fbf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="52.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">3. Релеївське розсіяння</text>
<text x="52.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Флуктуації щільності (∝ 1/λ⁴)</text>
<text x="52.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">I_sc ∝ I₀ / λ⁴</text>
<text x="52.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Домінує на коротких хвилях, визначає поріг оптичного волокна</text>
<rect x="390.0" y="185.0" width="310.0" height="105.0" rx="5" fill="#f8fafc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="402.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">4. Геометричні та модові втрати</text>
<text x="402.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Виньєтування, обрізання апертури</text>
<text x="402.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">G = A · Ω, NA = n · sin θ</text>
<text x="402.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Нерозбіжність променя та апертурне обрізання лінзою</text>
</svg>