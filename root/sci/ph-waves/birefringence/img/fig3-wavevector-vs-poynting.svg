<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 738 336.76" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="738" height="336.76" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розходження векторів хвильової нормалі k та потоку енергії Пойнтінга S</text>
<line x1="100.0" y1="140.0" x2="420.0" y2="300.0" stroke="#94a3b8" stroke-width="2.0"/>
<text x="425.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-weight="700">Фронт хвилі (площина рівної фази)</text>
<line x1="260.0" y1="220.0" x2="320.0" y2="100.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="330.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">k (хвильовий вектор ⊥ фронту)</text>
<line x1="260.0" y1="220.0" x2="370.0" y2="275.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="380.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">E (вектор напруженості)</text>
<line x1="260.0" y1="220.0" x2="380.0" y2="280.0" stroke="#8e44ad" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="390.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="middle" font-weight="700">D (електрична індукція ⊥ k)</text>
<line x1="260.0" y1="220.0" x2="355.0" y2="75.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="365.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">S (вектор Пойнтінга / промінь)</text>
<text x="302.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">η</text>
<rect x="422.1" y="94.5" width="295.9" height="131.1" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="570.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Кут зносу (Walk-off angle η):</tspan><tspan x="570.0" dy="14.3"></tspan><tspan x="570.0" dy="14.3">• k ⊥ фронту фази</tspan><tspan x="570.0" dy="14.3">• S ∥ напрямку променя (енергії)</tspan><tspan x="570.0" dy="14.3">• D ⊥ k, але E ∦ D</tspan><tspan x="570.0" dy="14.3">• S = E × H ∦ k</tspan><tspan x="570.0" dy="14.3"></tspan><tspan x="570.0" dy="14.3">η = arctan[(nₒ²-nₑ²)tan θ / (nₒ²+nₑ²tan² θ)]</tspan></text>
</svg>