<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="760" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Суперечка про струну: хто, коли, що заявив</text>
<line x1="168.0" y1="92.0" x2="168.0" y2="712.0" stroke="#e6e9ee" stroke-width="2.4"/>
<circle cx="168.0" cy="120.0" r="7.5" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<text x="150.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1713</text>
<text x="190.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="start" font-weight="700">Brook Taylor — англієць</text>
<text x="190.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">форма струни — синусоїда; висота тону ∝ √(натяг / маса на довжину)</text>
<circle cx="168.0" cy="210.0" r="7.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="150.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1747</text>
<text x="190.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">Jean d'Alembert — француз</text>
<text x="190.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">хвильове рівняння та його загальний розв'язок — дві біжучі хвилі; але форма мусить бути «однією формулою»</text>
<circle cx="168.0" cy="300.0" r="7.5" fill="#8e44ad" stroke="#8e44ad" stroke-width="1.0"/>
<text x="150.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1748</text>
<text x="190.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#8e44ad" text-anchor="start" font-weight="700">Leonhard Euler — швейцарець</text>
<text x="190.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">початкова форма — будь-яка накреслена від руки крива, навіть зі зламом (защип)</text>
<circle cx="168.0" cy="390.0" r="7.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="150.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1753</text>
<text x="190.0" y="383.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">Daniel Bernoulli — швейцарець</text>
<text x="190.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">будь-яке коливання струни — сума основного тону й обертонів, тобто сума синусів</text>
<circle cx="168.0" cy="480.0" r="7.5" fill="#8e44ad" stroke="#8e44ad" stroke-width="1.0"/>
<text x="150.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1777</text>
<text x="190.0" y="473.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#8e44ad" text-anchor="start" font-weight="700">Euler — знову</text>
<text x="190.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">виводить формулу коефіцієнтів (раніше й Clairaut, 1754) — та не вірить, що ряд дає геть довільну форму</text>
<circle cx="168.0" cy="570.0" r="7.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="150.0" y="574.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1807 / 1822</text>
<text x="190.0" y="563.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Joseph Fourier — француз</text>
<text x="190.0" y="585.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">довільну функцію справді складає ряд синусів — і ось інтеграл, що знаходить кожен коефіцієнт</text>
<circle cx="168.0" cy="660.0" r="7.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="150.0" y="664.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">1829</text>
<text x="190.0" y="653.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">P. G. L. Dirichlet — німець</text>
<text x="190.0" y="675.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">строгі умови, за яких ряд Фур'є збігається саме до заданої функції</text>
<line x1="1050.0" y1="190.0" x2="1050.0" y2="410.0" stroke="#2457d6" stroke-width="3.0"/>
<text x="1040.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">с у п е р е ч к а</text>
<line x1="1050.0" y1="548.0" x2="1050.0" y2="682.0" stroke="#27ae60" stroke-width="3.0"/>
<text x="1040.0" y="615.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">р о з в ' я з к а</text>
</svg>