<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="740.0" height="320.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="370.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розділення кольорового сигналу RGB на яскравість Y' та колірність Cb, Cr</text>
<rect x="40.0" y="100.0" width="130.0" height="140.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.8"/>
<text x="105.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сигнал RGB</text>
<rect x="60.0" y="145.0" width="90.0" height="22.0" rx="3" fill="#ef4444" stroke="none" stroke-width="1.5"/>
<text x="105.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">R (Red)</text>
<rect x="60.0" y="175.0" width="90.0" height="22.0" rx="3" fill="#22c55e" stroke="none" stroke-width="1.5"/>
<text x="105.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">G (Green)</text>
<rect x="60.0" y="205.0" width="90.0" height="22.0" rx="3" fill="#3b82f6" stroke="none" stroke-width="1.5"/>
<text x="105.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">B (Blue)</text>
<line x1="170.0" y1="170.0" x2="230.0" y2="170.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="190.0" y="75.0" width="250.0" height="190.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="315.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Матричне перетворення</text>
<rect x="205.0" y="117.0" width="220.0" height="42.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="315.0" y="141.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">Y' = 0.299·R' + 0.587·G' + 0.114·B'</tspan></text>
<rect x="205.0" y="165.0" width="220.0" height="42.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="315.0" y="190.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">Cb = 0.564·(B' - Y')</tspan></text>
<rect x="205.0" y="213.0" width="220.0" height="42.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="315.0" y="238.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0.0">Cr = 0.713·(R' - Y')</tspan></text>
<line x1="440.0" y1="110.0" x2="480.0" y2="110.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="440.0" y1="170.0" x2="480.0" y2="170.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="440.0" y1="230.0" x2="480.0" y2="230.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="480.0" y="65.0" width="220.0" height="50.0" rx="6" fill="#e2e8f0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="495.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Y' (Яскравість)</text>
<text x="495.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Висока деталізація (100%)</text>
<rect x="480.0" y="125.0" width="220.0" height="50.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
<text x="495.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="start" font-weight="700">Cb (Різниця синього)</text>
<text x="495.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Низька детальність (субдискретизація)</text>
<rect x="480.0" y="185.0" width="220.0" height="50.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
<text x="495.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="start" font-weight="700">Cr (Різниця червоного)</text>
<text x="495.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Низька детальність (субдискретизація)</text>
<text x="370.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Яскравість Y' зберігає структуру картинки; колірність Cb/Cr передає відтінок</text>
</svg>