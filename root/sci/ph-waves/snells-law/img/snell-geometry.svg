<line x1="320.0" y1="190.0" x2="381.3" y2="293.2" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="320.0" y1="190.0" x2="411.9" y2="112.9" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="213.1" y="107.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">Падаючий промінь</text>
<text x="396.3" y="303.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Заломлений промінь</text>
<text x="421.9" y="107.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Частково відбитий промінь</text>
<text x="296.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">θ₁ = 50°</text>
<text x="364.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">θ₂ = 30.7°</text>
<text x="328.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Нормаль N</text>
<text x="40.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Середовище 1: n₁ (повітря, v₁ = c/n₁)</text>
<text x="40.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Середовище 2: n₂ &gt; n₁ (скло, v₂ = c/n₂ &lt; v₁)</text>
<text x="340.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Закон Снелла:  n₁ · sin(θ₁) = n₂ · sin(θ₂)</text>
