<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 700 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="700" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="680.0" height="380.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="340.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Векторне розкладання заломленого променя (3D Ray Tracing)</text>
<rect x="20.0" y="170.0" width="640.0" height="160.0" rx="0" fill="#eaf2fb" stroke="none" stroke-width="0.0"/>
<line x1="20.0" y1="170.0" x2="640.0" y2="170.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="320.0" y1="170.0" x2="320.0" y2="60.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="330.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Нормаль N</text>
<line x1="242.2" y1="92.2" x2="320.0" y2="170.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="232.2" y="87.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">Вектор падіння I</text>
<line x1="320.0" y1="170.0" x2="375.6" y2="170.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="347.8" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">η · (I + cos(θ₁)·N)</text>
<line x1="375.6" y1="170.0" x2="375.6" y2="264.9" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="383.6" y="217.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">-cos(θ₂)·N</text>
<line x1="320.0" y1="170.0" x2="375.6" y2="264.9" stroke="#27ae60" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="387.6" y="276.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Заломлений вектор T</text>
<text x="340.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">T = η·I + (η·cos(θ₁) - cos(θ₂))·N,   де η = n₁ / n₂</text>
</svg>