<rect x="470.0" y="230.0" width="230.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="585.0" y="265.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Принцип побудови огинаючої:</tspan><tspan x="585.0" dy="11.7">1. Кожна точка фронту S₁ випромінює вторинну сферичну хвилю.</tspan><tspan x="585.0" dy="11.7">2. Радіус вторинних хвиль r = v · Δt = (c / n) · Δt.</tspan><tspan x="585.0" dy="11.7">3. Огинаюча поверхня S₂ утворює новий фронт у момент t + Δt.</tspan></text>
