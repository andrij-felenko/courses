<rect x="450.0" y="240.0" width="260.0" height="80.0" rx="6" fill="#fdfefe" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="269.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Параметр нормованої частоти:</tspan><tspan x="580.0" dy="14.3">V = (2π · a / λ) · √(n₁² − n₂²)</tspan><tspan x="580.0" dy="14.3">Коли V &lt; 2.405 → волокно одномодове</tspan></text>
<text x="380.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">При зменшенні діаметра серцевини a чи різниці показників Δ число V спадає нижче 2.405, виключаючи вищі моди.</text>
