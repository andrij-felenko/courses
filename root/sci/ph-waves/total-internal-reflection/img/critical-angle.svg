<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 680 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="680" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="660.0" height="360.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="330.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Критичний кут: коли вихід «упирається» в 90°</text>
<rect x="70.0" y="210.0" width="360.0" height="136.0" rx="0" fill="#eaf2fb" stroke="none" stroke-width="0.0"/>
<line x1="70.0" y1="210.0" x2="430.0" y2="210.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="250.0" y1="100.0" x2="250.0" y2="320.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="258.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">нормаль</text>
<line x1="170.0" y1="299.4" x2="250.0" y2="210.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="164.0" y="303.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end">падаючий</text>
<line x1="250.0" y1="210.0" x2="418.0" y2="210.0" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="360.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">заломлений  90°</text>
<path d="M 223.3 239.8 A 40.0 40.0 0 0 1 250.0 250.0" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="220.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">θc</text>
<rect x="450.0" y="150.0" width="190.0" height="86.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="545.0" y="180.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">sin θc = n₂ / n₁</tspan><tspan x="545.0" dy="16.9">положе за θc →</tspan><tspan x="545.0" dy="16.9">виходу немає</tspan></text>
<text x="80.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">рідке  n₂  (менший)</text>
<text x="80.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">щільне  n₁  (більший)</text>
<text x="330.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Точно під θc вихід лягає вздовж межі; ще положе — заломленому променю місця немає, і світло повертається</text>
</svg>