<text x="420.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Теплопровідність (κ)</text>
<text x="420.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Знищення звуку в тепло</tspan><tspan x="420.0" dy="15.6">Коефіцієнт  α_cl ∝ f²</tspan><tspan x="420.0" dy="15.6">Панує на ультразвуку</tspan><tspan x="420.0" dy="15.6">(f &gt; 50 кГц)</tspan></text>
