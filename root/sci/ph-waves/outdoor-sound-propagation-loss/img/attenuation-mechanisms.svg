<text x="630.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">N₂</text>
<circle cx="730.0" cy="175.0" r="18.0" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="730.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">O₂</text>
<line x1="652.0" y1="175.0" x2="708.0" y2="175.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="680.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Затримка фази між тиском і густиною</tspan><tspan x="680.0" dy="15.6">Піки поглинання на  f_r,O  та  f_r,N</tspan><tspan x="680.0" dy="15.6">Вологість є каталізатором!</tspan></text>
</svg>