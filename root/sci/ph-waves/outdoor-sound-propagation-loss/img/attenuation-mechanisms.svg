<text x="160.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Геометричне розходження</text>
<text x="160.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Сферичний хвильовий фронт</text>
<circle cx="160.0" cy="175.0" r="8.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<circle cx="160.0" cy="175.0" r="25.0" fill="none" stroke="#2457d6" stroke-width="1.5"/>
<circle cx="160.0" cy="175.0" r="50" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
<circle cx="160.0" cy="175.0" r="75" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2,4"/>
<text x="160.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Інтенсивність  I ∝ 1/r²</tspan><tspan x="160.0" dy="15.6">Втрати: −6 дБ за кожне</tspan><tspan x="160.0" dy="15.6">подвоєння відстані</tspan><tspan x="160.0" dy="15.6">(без втрат енергії середовищем)</tspan></text>
