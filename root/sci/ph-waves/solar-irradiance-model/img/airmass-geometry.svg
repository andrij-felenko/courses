<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрія сонячного зенітного кута та атмосферного шляху (Air Mass)</text>
<rect x="40.0" y="140.0" width="740.0" height="240.0" rx="0" fill="#f0f9ff" stroke="#2563eb" stroke-width="1.5"/>
<line x1="40.0" y1="380.0" x2="780.0" y2="380.0" stroke="#0f172a" stroke-width="2.0"/>
<text x="50.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="start" font-weight="700">Верхня межа атмосфери (Extraterrestrial TOA, G_sc = 1361 Вт/м²)</text>
<text x="50.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700">Поверхня Землі (приймач випромінювання)</text>
<circle cx="300.0" cy="380.0" r="5.0" fill="#0f172a" stroke="none" stroke-width="1.5"/>
<line x1="300.0" y1="380.0" x2="300.0" y2="110.0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5"/>
<text x="300.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="700">Зеніт (θ_z = 0°)</text>
<line x1="300.0" y1="140.0" x2="300.0" y2="370.0" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="285.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="end" font-weight="700">h_atm (AM1.0)</text>
<line x1="586.0" y1="140.0" x2="306.0" y2="372.0" stroke="#d97706" stroke-width="3.0" marker-end="url(#arrow)"/>
<path d="M 300.0 305.0 A 75 75 0 0 1 357.5 331.8" fill="none" stroke="#dc2626" stroke-width="2"/>
<text x="335.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">θ_z</text>
<circle cx="586.0" cy="120.0" r="18.0" fill="#f59e0b" stroke="#d97706" stroke-width="2.0"/>
<line x1="607.0" y1="120.0" x2="613.0" y2="120.0" stroke="#f59e0b" stroke-width="2.0"/>
<line x1="600.9" y1="134.8" x2="605.1" y2="139.1" stroke="#f59e0b" stroke-width="2.0"/>
<line x1="586.0" y1="141.0" x2="586.0" y2="147.0" stroke="#f59e0b" stroke-width="2.0"/>
<line x1="571.2" y1="134.8" x2="566.9" y2="139.1" stroke="#f59e0b" stroke-width="2.0"/>
<line x1="565.0" y1="120.0" x2="559.0" y2="120.0" stroke="#f59e0b" stroke-width="2.0"/>
<line x1="571.2" y1="105.2" x2="566.9" y2="100.9" stroke="#f59e0b" stroke-width="2.0"/>
<line x1="586.0" y1="99.0" x2="586.0" y2="93.0" stroke="#f59e0b" stroke-width="2.0"/>
<line x1="600.9" y1="105.2" x2="605.1" y2="100.9" stroke="#f59e0b" stroke-width="2.0"/>
<rect x="566.0" y="203.1" width="208.1" height="73.9" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="670.0" y="222.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">Оптичний шлях S:</tspan><tspan x="670.0" dy="14.3">S = h_atm / cos(θ_z)</tspan><tspan x="670.0" dy="14.3">Маса повітря AM ≈ 1 / cos(θ_z)</tspan><tspan x="670.0" dy="14.3">Для θ_z = 50° → AM ≈ 1.55</tspan></text>
<rect x="61.5" y="263.1" width="226.9" height="73.9" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="175.0" y="282.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Атмосферні втрати (Бугер):</tspan><tspan x="175.0" dy="14.3">• Релеєвське розсіяння (молекули)</tspan><tspan x="175.0" dy="14.3">• Мі-розсіяння (аерозолі, пил)</tspan><tspan x="175.0" dy="14.3">• Поглинання H₂O, O₃, CO₂</tspan></text>
<text x="410.0" y="465.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-weight="700">Збільшення зенітного кута θ_z подовжує шлях світла крізь атмосферу та підсилює згасання</text>
</svg>