<text x="302.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">циклоїдні щоки</text>
<rect x="52.0" y="358.0" width="386.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="245.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">На широкій дузі нитка лягає на щоку й тим сама вкорочується,</tspan><tspan x="245.0" dy="13.7">тож тягарець іде вже не колом, а циклоїдою — і період</tspan><tspan x="245.0" dy="13.7">перестає залежати від розмаху. Пунктир — шлях без щік.</tspan></text>
<text x="695.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коло проти циклоїди</text>
