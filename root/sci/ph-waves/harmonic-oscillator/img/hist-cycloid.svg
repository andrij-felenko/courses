<rect x="500.0" y="358.0" width="400.0" height="80.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.3"/><text x="700.0" y="387.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Біля самого низу криві збігаються — саме тому малий</tspan><tspan x="700.0" dy="15.0">розмах і без щік майже ізохронний. Розходяться вони</tspan><tspan x="700.0" dy="15.0">на краях: циклоїда крутіша, і це вирівнює час спуску.</tspan></text>
