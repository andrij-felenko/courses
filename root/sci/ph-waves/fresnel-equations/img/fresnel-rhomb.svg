<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 700 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="700" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="680.0" height="320.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="340.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ромб Френеля: зсув фаз при повному внутрішньому відбитті</text>
<polygon points="100.0,200.0 250.0,100.0 550.0,100.0 400.0,200.0" fill="#eaf2fb" stroke="#1a1a1a" stroke-width="2"/>
<line x1="40.0" y1="150.0" x2="175.0" y2="150.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="100.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">лінійно поляризоване (45°)</text>
<line x1="175.0" y1="150.0" x2="250.0" y2="100.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="250.0" y1="100.0" x2="375.0" y2="200.0" stroke="#27ae60" stroke-width="2.2"/>
<line x1="375.0" y1="200.0" x2="630.0" y2="150.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="540.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">колово поляризоване світло</text>
<circle cx="250.0" cy="100.0" r="4.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.0"/>
<circle cx="375.0" cy="200.0" r="4.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="250.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">1-ше відбиття (зсув Δδ = 45°)</text>
<text x="375.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">2-ге відбиття (зсув Δδ = 45°)</text>
<rect x="200.0" y="240.0" width="280.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="340.0" y="264.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Сумарна різниця фаз між s- та p-компонентами:</tspan><tspan x="340.0" dy="11.7">Δδ_загальна = 45° + 45° = 90° (перетворення у колову поляризацію)</tspan></text>
</svg>