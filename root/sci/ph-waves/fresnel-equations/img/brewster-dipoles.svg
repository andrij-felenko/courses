<rect x="500.0" y="110.0" width="160.0" height="140.0" rx="6" fill="#fdfbf7" stroke="#333333" stroke-width="1.2"/><text x="580.0" y="148.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Чому Rₚ = 0?</tspan><tspan x="580.0" dy="11.7">Заломлена хвиля розгойдує</tspan><tspan x="580.0" dy="11.7">електричні диполі в склі.</tspan><tspan x="580.0" dy="11.7">Диполі коливаються ВЗДОВЖ</tspan><tspan x="580.0" dy="11.7">лінії потенційного відбитого</tspan><tspan x="580.0" dy="11.7">променя. Диполь НЕ випромінює</tspan><tspan x="580.0" dy="11.7">вздовж осі своїх коливань!</tspan></text>
