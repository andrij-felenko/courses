<line x1="200.0" y1="372.0" x2="200.0" y2="68.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="200.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">I / ω₀</text>
<path d="M 450.6 330.0 A 250.6 250.6 0 0 0 200.0 79.4" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="6,6"/>
