<text x="300.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="end">A — амплітуда</text>
<path d="M 252.0 330.0 A 52.0 52.0 0 0 0 245.7 305.1" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="268.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">φ</text>
<text x="480.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="480.0" dy="0.0">далі ця сама точка йде по колу радіуса A</tspan><tspan x="480.0" dy="15.6">рівномірно, з кутовою швидкістю ω₀</tspan></text>
<rect x="151.4" y="379.5" width="457.2" height="33.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="400.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">A = √( q(0)² + (I(0)/ω₀)² )         tg φ = I(0) / (ω₀·q(0))</tspan></text>
</svg>