<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пляма, якої не мало бути: заперечення Пуассона (1818) і перевірка Араго (1819)</text>
<line x1="572.0" y1="76.0" x2="572.0" y2="478.0" stroke="#e6e9ee" stroke-width="1.6"/>
<text x="286.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому хвиля мусить дати світлу цятку</text>
<circle cx="96.0" cy="268.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="96.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">джерело</text>
<circle cx="300.0" cy="268.0" r="74.0" fill="#3a3f4a" stroke="#3a3f4a" stroke-width="1.0"/>
<text x="300.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">круглий диск</text>
<rect x="486.0" y="150" width="11" height="240" fill="#7a8290"/>
<text x="470.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">екран</text>
<line x1="96.0" y1="268.0" x2="300.0" y2="194.0" stroke="#e8c46a" stroke-width="1.8"/>
<line x1="300.0" y1="194.0" x2="486.0" y2="268.0" stroke="#27ae60" stroke-width="2.4"/>
<line x1="96.0" y1="268.0" x2="300.0" y2="342.0" stroke="#e8c46a" stroke-width="1.8"/>
<line x1="300.0" y1="342.0" x2="486.0" y2="268.0" stroke="#27ae60" stroke-width="2.4"/>
<circle cx="486.0" cy="268.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="286.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="286.0" dy="0.0">усі точки краю диска однаково далекі</tspan><tspan x="286.0" dy="16.2">від осьової точки, тож у центр тіні</tspan><tspan x="286.0" dy="16.2">хвилі приходять у фазі</tspan></text>
<text x="286.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="286.0" dy="0.0">Теорія Френеля рахує це неминуче:</tspan><tspan x="286.0" dy="16.2">у самому центрі тіні — підсилення.</tspan></text>
<text x="856.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що показує екран</text>
<rect x="618.0" y="146" width="196" height="196" fill="#e9edf2" stroke="#9aa2ad" stroke-width="1.4"/>
<circle cx="716.0" cy="244.0" r="70.0" fill="#20242b" stroke="#20242b" stroke-width="1.0"/>
<text x="716.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">за теорією частинок</text>
<rect x="898.0" y="146" width="196" height="196" fill="#e9edf2" stroke="#9aa2ad" stroke-width="1.4"/>
<circle cx="996.0" cy="244.0" r="70.0" fill="#20242b" stroke="#20242b" stroke-width="1.0"/>
<circle cx="996.0" cy="244" r="28.0" fill="#ffffff" opacity="0.10"/>
<circle cx="996.0" cy="244" r="20.0" fill="#ffffff" opacity="0.16"/>
<circle cx="996.0" cy="244" r="13.0" fill="#ffffff" opacity="0.32"/>
<circle cx="996.0" cy="244.0" r="6.5" fill="#ffffff" stroke="#ffffff" stroke-width="1.0"/>
<text x="996.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">насправді (Араго, 1819)</text>
<text x="716.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">суцільна темрява</text>
<text x="996.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">світла цятка в центрі</text>
<rect x="299.2" y="493.5" width="541.6" height="57.1" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/><text x="570.0" y="518.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Пуассон навів цей висновок як безглуздя, що поховає теорію Френеля.</tspan><tspan x="570.0" dy="17.6">Араго поставив дослід — і цятка була на місці.</tspan></text>
</svg>