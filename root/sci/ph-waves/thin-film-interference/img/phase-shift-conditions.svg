<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 760 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="760" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="740.0" height="380.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="370.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стрибок фази на межах розділу та умови інтерференції</text>
<rect x="30.0" y="55.0" width="330.0" height="300.0" rx="6" fill="#fafafa" stroke="#6b7280" stroke-width="1.0"/>
<text x="195.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">А: Мильна плівка (n₁ &lt; n₂ &gt; n₃)</text>
<rect x="40.0" y="165.0" width="310.0" height="80.0" rx="6" fill="#fff9e6" stroke="none" stroke-width="0.0"/>
<line x1="40.0" y1="165.0" x2="350.0" y2="165.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="40.0" y1="245.0" x2="350.0" y2="245.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="50.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Повітря (n₁ = 1.00)</text>
<text x="50.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="start" font-weight="700">Вода/мило (n₂ = 1.33)</text>
<text x="50.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Повітря (n₃ = 1.00)</text>
<text x="340.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">Стрибок фази Δφ₁ = π</text>
<text x="340.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end" font-weight="700">Без стрибка Δφ₂ = 0</text>
<rect x="45.0" y="280.0" width="300.0" height="60.0" rx="6" fill="#fff0f0" stroke="#2457d6" stroke-width="1.5"/>
<text x="195.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сумарний зсув фаз = π</text>
<text x="195.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Максимум: 2·n₂·d·cos(θ₂) = (m + ½)·λ</text>
<text x="195.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Мінімум (d→0): 2·n₂·d·cos(θ₂) = m·λ (ЧОРНА)</text>
<rect x="380.0" y="55.0" width="330.0" height="300.0" rx="6" fill="#fafafa" stroke="#6b7280" stroke-width="1.0"/>
<text x="545.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Б: Просвітлювальне покриття (n₁ &lt; n₂ &lt; n₃)</text>
<rect x="390.0" y="165.0" width="310.0" height="80.0" rx="6" fill="#fff9e6" stroke="none" stroke-width="0.0"/>
<rect x="390.0" y="245.0" width="310.0" height="100.0" rx="6" fill="#e8f1f9" stroke="none" stroke-width="0.0"/>
<line x1="390.0" y1="165.0" x2="700.0" y2="165.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="390.0" y1="245.0" x2="700.0" y2="245.0" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="400.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Повітря (n₁ = 1.00)</text>
<text x="400.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="start" font-weight="700">Плівка MgF₂ (n₂ = 1.38)</text>
<text x="400.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Скло (n₃ = 1.52)</text>
<text x="690.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">Стрибок фази Δφ₁ = π</text>
<text x="690.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">Стрибок фази Δφ₂ = π</text>
<rect x="395.0" y="280.0" width="300.0" height="60.0" rx="6" fill="#f0fff0" stroke="#c0392b" stroke-width="1.5"/>
<text x="545.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сумарний зсув фаз = 2π ≡ 0</text>
<text x="545.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Мінімум відбиття: 2·n₂·d·cos(θ₂) = (m + ½)·λ</text>
<text x="545.0" y="329.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Оптимальна товщина d = λ / (4·n₂)</text>
</svg>