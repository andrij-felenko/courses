<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 546" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="546" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Область залежності: значення в (x, t) задають лише дані на відрізку [x−ct, x+ct]</text>
<path d="M 540.0 150.0 L 360.0 430.0 L 760.0 430.0" fill="#eef2f7" stroke="#e6e9ee" stroke-width="0.0"/>
<line x1="110.0" y1="430.0" x2="950.0" y2="430.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="110.0" y1="430.0" x2="110.0" y2="84.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="954.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700" font-style="italic">x</text>
<text x="104.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700" font-style="italic">t</text>
<line x1="540.0" y1="150.0" x2="360.0" y2="430.0" stroke="#2457d6" stroke-width="2.6"/>
<line x1="540.0" y1="150.0" x2="760.0" y2="430.0" stroke="#c0392b" stroke-width="2.6"/>
<text x="398.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">x − c·t = const</text>
<text x="690.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">x + c·t = const</text>
<text x="360.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end">(правобіжна f)</text>
<text x="724.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">(лівобіжна g)</text>
<line x1="360.0" y1="430.0" x2="760.0" y2="430.0" stroke="#27ae60" stroke-width="6.0"/>
<circle cx="360.0" cy="430.0" r="5.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<line x1="360.0" y1="430.0" x2="360.0" y2="430.0" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="360.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">x − c·t</text>
<circle cx="760.0" cy="430.0" r="5.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<line x1="760.0" y1="430.0" x2="760.0" y2="430.0" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="760.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">x + c·t</text>
<circle cx="540.0" cy="150.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="540.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">P = (x, t)</text>
<text x="560.0" y="476.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">початкова швидкість ψ інтегрується на відрізку:  (1/2c)·∫ ψ(s) ds</text>
<text x="560.0" y="498.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">початкова форма φ — лише в двох кінцях:  ½[ φ(x−ct) + φ(x+ct) ]</text>
<text x="520.0" y="526.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Поза цим відрізком початкові дані на P не впливають — сигнал біжить зі скінченною швидкістю c.</text>
</svg>