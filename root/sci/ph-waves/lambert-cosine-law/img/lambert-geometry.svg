<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48.16 -10 905.34 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-48.16" y="-10" width="905.34" height="460" fill="#ffffff"/>
