<text x="580.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">dA_proj = dA · cos θ</text>
<text x="360.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Яскравість L = I(θ) / dA_proj = (I₀ cos θ) / (dA cos θ) = I₀ / dA = const</text>
