<line x1="610.0" y1="170.0" x2="570.0" y2="210.0" stroke="#6b7280" stroke-width="3.0"/>
<path d="M 610.0,170.0 L 670.0,170.0 L 670.0,110.0 L 610.0,110.0 Z" fill="#eaf2fb" stroke="#6b7280" stroke-width="1.0"/>
