<line x1="320.0" y1="150.0" x2="380.0" y2="60.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="340.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">90°</text>
<text x="380.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Два відбиття розвертають</text>
<text x="380.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">промінь паралельно назад</text>
<line x1="520.0" y1="45.0" x2="520.0" y2="280.0" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="640.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">в) 3D тригранний куточок</text>
