<line x1="60.0" y1="80.0" x2="130.0" y2="180.0" stroke="#2563eb" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="130.0" y1="180.0" x2="210.0" y2="100.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="130.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Відхилення дзеркала θ</text>
<text x="130.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">змінює кут на 2θ</text>
<line x1="260.0" y1="45.0" x2="260.0" y2="280.0" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="3,3"/>
<text x="390.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">б) 2D кутовий відбивач (90°)</text>
<line x1="320.0" y1="200.0" x2="400.0" y2="200.0" stroke="#6b7280" stroke-width="4.0"/>
