<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 773.84 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="773.84" height="340" fill="#ffffff"/>
