<text x="540.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">«Зіпсований» куточок (δθ ≈ 1.5″):</text>
