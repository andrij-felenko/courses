<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двобічна N₀/2 vs однобічна N₀ — та сама потужність N₀·B</text>
<text x="370.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">двобічна щільність (0 у центрі, від −∞ до +∞)</text>
<rect x="230.0" y="104.0" width="280.0" height="56.0" rx="0" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/>
<line x1="90.0" y1="104.0" x2="650.0" y2="104.0" stroke="#2457d6" stroke-width="2.6"/>
<line x1="80.0" y1="160.0" x2="664.0" y2="160.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="656.0" y1="160.0" x2="672.0" y2="160.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="666.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-style="italic">f</text>
<text x="96.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">N₀/2</text>
<text x="230.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">−B</text>
<text x="370.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
<text x="510.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">+B</text>
<text x="370.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">площа = (N₀/2)·2B = N₀·B</text>
<text x="320.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">однобічна щільність (лише f ≥ 0)</text>
<rect x="90.0" y="288.0" width="280.0" height="112.0" rx="0" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/>
<line x1="90.0" y1="288.0" x2="650.0" y2="288.0" stroke="#2457d6" stroke-width="2.6"/>
<line x1="80.0" y1="400.0" x2="664.0" y2="400.0" stroke="#1a1a1a" stroke-width="1.6"/>
<line x1="656.0" y1="400.0" x2="672.0" y2="400.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="666.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-style="italic">f</text>
<text x="96.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">N₀</text>
<text x="90.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
<text x="370.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">B</text>
<text x="230.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">площа = N₀·B</text>
<rect x="70.0" y="462.0" width="620.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="478.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Та сама потужність N₀·B. Множник ½ двобічної точно гаситься,</tspan><tspan x="380.0" dy="14.3">коли від'ємні частоти згортають на додатні при переході до однобічної.</tspan></text>
</svg>