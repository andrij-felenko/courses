<path d="M 707.7 184.0 C 707.7 238.0, 143.9 238.0, 143.9 184.0" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="425.8" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">повторити N разів</text>
