<rect x="236.2" y="123.5" width="97.3" height="53.1" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/><text x="284.9" y="145.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="284.9" dy="0.0">кодер</tspan><tspan x="284.9" dy="17.6">повтор ×3</tspan></text>
