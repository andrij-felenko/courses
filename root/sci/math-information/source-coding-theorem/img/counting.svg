<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лічба: типових ≈ 2^{nH}, а всіх — 2^{n·log N}</text>
<line x1="90.0" y1="230.0" x2="90.0" y2="70.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="84.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">довжина коду, біт</text>
<line x1="90.0" y1="230.0" x2="640.0" y2="230.0" stroke="#1a1a1a" stroke-width="1.4"/>
<rect x="135.0" y="80.0" width="150.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/>
<text x="210.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">усі: n·log₂N біт</text>
<text x="210.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2^{n·log N} штук</text>
<rect x="385.0" y="134.0" width="150.0" height="96.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.4"/>
<text x="460.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">типові: ≈ n·H біт</text>
<text x="460.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">≈ 2^{nH} штук</text>
<line x1="295.0" y1="80.0" x2="295.0" y2="134.0" stroke="#c0392b" stroke-width="1.6"/>
<line x1="291.0" y1="80.0" x2="299.0" y2="80.0" stroke="#c0392b" stroke-width="1.6"/>
<line x1="291.0" y1="134.0" x2="299.0" y2="134.0" stroke="#c0392b" stroke-width="1.6"/>
<text x="305.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">економія</text>
<text x="305.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">n(log N − H)</text>
<text x="360.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">типових експоненційно менше за всі — нумеруємо лише їх, і код коштує ≈ H біт на символ</text>
</svg>