<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="790.0" height="450.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="410.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрична модель Шеннона: N-вимірний простір сигналів (N = 2·B·T)</text>
<circle cx="290.0" cy="255.0" r="175.0" fill="#eff6ff" stroke="#2457d6" stroke-width="2.0"/>
<line x1="290.0" y1="255.0" x2="390.4" y2="111.6" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="4,4"/>
<rect x="322.5" y="98.5" width="175.0" height="23.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="410.0" y="95.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">R_tot = √(N·(P + N_noise))</tspan></text>
<circle cx="290.0" cy="255.0" r="38.0" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<circle cx="290.0" cy="255.0" r="4.0" fill="#c0392b" stroke="#991b1b" stroke-width="1.0"/>
<text x="290.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">s_0</text>
<circle cx="195.0" cy="190.0" r="38.0" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<circle cx="195.0" cy="190.0" r="4.0" fill="#c0392b" stroke="#991b1b" stroke-width="1.0"/>
<text x="195.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">s_1</text>
<circle cx="380.0" cy="205.0" r="38.0" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<circle cx="380.0" cy="205.0" r="4.0" fill="#c0392b" stroke="#991b1b" stroke-width="1.0"/>
<text x="380.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">s_2</text>
<circle cx="205.0" cy="325.0" r="38.0" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<circle cx="205.0" cy="325.0" r="4.0" fill="#c0392b" stroke="#991b1b" stroke-width="1.0"/>
<text x="205.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">s_3</text>
<circle cx="365.0" cy="330.0" r="38.0" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<circle cx="365.0" cy="330.0" r="4.0" fill="#c0392b" stroke="#991b1b" stroke-width="1.0"/>
<text x="365.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">s_4</text>
<circle cx="180.0" cy="260.0" r="38.0" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/>
<circle cx="180.0" cy="260.0" r="4.0" fill="#c0392b" stroke="#991b1b" stroke-width="1.0"/>
<text x="180.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">s_5</text>
<line x1="365.0" y1="330.0" x2="397.9" y2="349.0" stroke="#c0392b" stroke-width="1.5"/>
<text x="412.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">r_шуму = √(N·N_noise)</text>
<rect x="475.0" y="85.0" width="220.1" height="49.9" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="585.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Об'єм у просторі N вимірів:</tspan><tspan x="585.0" dy="16.9">Vol(R) ∝ R^N</tspan></text>
<rect x="463.9" y="186.6" width="242.3" height="66.8" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="585.0" y="207.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Кількість куль без перекриття:</tspan><tspan x="585.0" dy="16.9">M = (R_tot / r_шуму)^N</tspan><tspan x="585.0" dy="16.9">M = (1 + P / N_noise)^(N/2)</tspan></text>
<rect x="455.3" y="297.8" width="259.4" height="94.4" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="585.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Кількість біт за час T (N = 2·B·T):</tspan><tspan x="585.0" dy="15.6">I = log₂(M) = B·T · log₂(1 + SNR)</tspan><tspan x="585.0" dy="15.6"></tspan><tspan x="585.0" dy="15.6">Ємність каналу (біт/с):</tspan><tspan x="585.0" dy="15.6">C = I / T = B · log₂(1 + SNR)</tspan></text>
<text x="410.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">При N → ∞ шумова енергія концентрується на тонкій сфері: помилка декодування зникає</text>
</svg>