<text x="441.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">B</text>
<rect x="489.6" y="130.0" width="32.4" height="40.0" rx="6" fill="#fdf6e3" stroke="#d98a00" stroke-width="1.0"/>
