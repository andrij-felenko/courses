<rect x="212.1" y="212.3" width="295.9" height="45.3" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.4"/><text x="360.0" y="231.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">обираємо символ «B»:  new_low = low + r·c(B)</tspan><tspan x="360.0" dy="14.3">нова ширина = r · p(B)  — частка від старої</tspan></text>
