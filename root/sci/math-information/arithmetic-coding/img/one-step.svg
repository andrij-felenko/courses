<text x="522.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">high</text>
<line x1="198.0" y1="170.0" x2="198.0" y2="188.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="522.0" y1="170.0" x2="522.0" y2="188.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="360.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ширина r = high − low</text>
<rect x="198.0" y="130.0" width="194.4" height="40.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.0"/>
<text x="295.2" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">A</text>
