<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="270" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна величина, дві назви — «швидкість передавання» і «взаємна інформація»</text>
<text x="215.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">1948 · Клод Шеннон</text>
<text x="665.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">1961 · Роберт Фано</text>
<rect x="90.0" y="100.0" width="250.0" height="54.0" rx="6" fill="#dbe4fb" stroke="#2457d6" stroke-width="1.5"/><text x="215.0" y="132.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">R = H(x) − H_y(x)</tspan></text>
<rect x="540.0" y="100.0" width="250.0" height="54.0" rx="6" fill="#e5f3ea" stroke="#27ae60" stroke-width="1.5"/><text x="665.0" y="132.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">I(X;Y) = I(Y;X)</tspan></text>
<line x1="345.0" y1="127.0" x2="535.0" y2="127.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="440.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">13 років</text>
<text x="440.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">та сама величина</text>
<text x="215.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">«швидкість передавання»</text>
<text x="215.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">потік крізь канал</text>
<text x="665.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">«взаємна інформація»</text>
<text x="665.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">зв'язок між двома величинами</text>
<text x="440.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крапка з комою в I(X;Y) виставляє напоказ симетрію, приховану у формулі Шеннона</text>
</svg>