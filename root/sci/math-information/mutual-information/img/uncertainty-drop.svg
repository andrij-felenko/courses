<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Взаємна інформація — скільки невизначеності про X збиває погляд на Y</text>
<rect x="176.0" y="118.0" width="96.0" height="232.0" rx="6" fill="#dbe4fb" stroke="#2457d6" stroke-width="1.9"/>
<text x="224.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">H(X)</text>
<text x="224.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">до Y</text>
<text x="224.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">уся невизначеність = 1 біт</text>
<line x1="288.0" y1="142.0" x2="452.0" y2="142.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="370.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">показали Y</text>
<rect x="468.0" y="118.0" width="96.0" height="123.2" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.9"/>
<rect x="468.0" y="241.2" width="96.0" height="108.8" rx="6" fill="#eef0f2" stroke="#6b7280" stroke-width="1.9"/>
<text x="516.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">після Y</text>
<line x1="564.0" y1="179.6" x2="600.0" y2="179.6" stroke="#27ae60" stroke-width="1.3"/>
<text x="608.0" y="173.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">I(X;Y) ≈ 0.53 біта</text>
<text x="608.0" y="191.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">це Y розповів про X</text>
<line x1="564.0" y1="295.6" x2="600.0" y2="295.6" stroke="#6b7280" stroke-width="1.3"/>
<text x="608.0" y="289.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">H(X|Y) ≈ 0.47 біта</text>
<text x="608.0" y="307.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">залишок непевності</text>
<text x="390.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">H(X)  =  I(X;Y)  +  H(X|Y)</text>
</svg>