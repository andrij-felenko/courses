<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Краща модель джерела → нижча ентропія → сильніший стиск</text>
<rect x="36.0" y="70.0" width="200.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="136.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="136.0" dy="0.0">символи</tspan><tspan x="136.0" dy="16.9">нарізно</tspan></text>
<text x="136.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">не знає зв'язків</text>
<line x1="56.0" y1="166.0" x2="216.0" y2="166.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="136.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">~4.7 біт/символ</text>
<line x1="238.0" y1="145.0" x2="258.0" y2="145.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="260.0" y="70.0" width="200.0" height="150.0" rx="6" fill="#fdf6e3" stroke="#d98a00" stroke-width="1.8"/>
<text x="360.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d98a00" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">частоти</tspan><tspan x="360.0" dy="16.9">символів</tspan></text>
<text x="360.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">е частіше за ж</text>
<line x1="280.0" y1="166.0" x2="440.0" y2="166.0" stroke="#d98a00" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="360.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d98a00" text-anchor="middle" font-weight="700">~4.0 біт/символ</text>
<line x1="462.0" y1="145.0" x2="482.0" y2="145.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="484.0" y="70.0" width="200.0" height="150.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="584.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="584.0" dy="0.0">контекст</tspan><tspan x="584.0" dy="16.9">(сусіди)</tspan></text>
<text x="584.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">q → майже завжди u</text>
<line x1="504.0" y1="166.0" x2="664.0" y2="166.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="4 3"/>
<text x="584.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">~1.5 біт/символ</text>
<text x="360.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">ентропія — не властивість тексту, а властивість моделі: краща модель бачить більше надлишку</text>
</svg>