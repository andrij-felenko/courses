<polygon points="85.0,60.0 90.0,48.0 95.0,60.0" fill="#1a1a1a"/>
<text x="730.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">Температура T</text>
<text x="75.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">Потенціал G</text>
<path d="M 120 120 Q 240 160 360 220 Q 480 280 600 350" stroke="#2980b9" stroke-width="3.0" fill="none"/>
<path d="M 140 70 Q 250 130 360 220 Q 470 310 580 400" stroke="#e67e22" stroke-width="3.0" fill="none"/>
<path d="M 360 220 Q 480 280 600 350" stroke="#2980b9" stroke-width="2.0" fill="none" stroke-dasharray="4 3"/>
