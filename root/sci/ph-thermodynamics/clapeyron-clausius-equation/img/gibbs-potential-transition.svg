<text x="390.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Термодинамічний потенціал Гіббса G(T) при фазовому переході I роду</text>
<line x1="90.0" y1="400.0" x2="720.0" y2="400.0" stroke="#1a1a1a" stroke-width="2.0"/>
