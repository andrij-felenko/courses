<path d="M 120 120 Q 240 160 360 220" stroke="#1b4f72" stroke-width="4.0" fill="none"/>
<path d="M 360 220 Q 470 310 580 400" stroke="#d35400" stroke-width="4.0" fill="none"/>
<line x1="360.0" y1="220.0" x2="360.0" y2="400.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<line x1="360.0" y1="220.0" x2="90.0" y2="220.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3 3"/>
<circle cx="360.0" cy="220.0" r="6.0" fill="#8e44ad" stroke="#ffffff" stroke-width="1.5"/>
<text x="360.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">T_c (Температура переходу)</text>
<text x="80.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">G_c</text>
<text x="110.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1b4f72" text-anchor="start" font-weight="700">Фаза 1: стійка при T &lt; T_c</text>
<text x="110.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2980b9" text-anchor="start">(∂G₁/∂T)_P = -S₁</text>
<text x="600.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="start" font-weight="700">Фаза 2: стійка при T &gt; T_c</text>
<text x="600.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e67e22" text-anchor="start">(∂G₂/∂T)_P = -S₂</text>
<rect x="430.0" y="65.0" width="330.0" height="120.0" rx="4" fill="#f8f9f9" stroke="#6b7280" stroke-width="1.0"/>
<text x="445.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Ознаки фазового переходу I роду:</text>
<text x="445.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Потенціал G(T,P) є неперервним: G₁ = G₂</text>
<text x="445.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Перші похідні мають стрибок:</text>
<text x="460.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">ΔS = S₂ - S₁ = L / T_c ≠ 0  (ентропія)</text>
<text x="460.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">ΔV = V₂ - V₁ ≠ 0            (об'єм)</text>
</svg>