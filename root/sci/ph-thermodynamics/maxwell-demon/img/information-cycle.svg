<text x="640.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b45309" text-anchor="middle" font-weight="700">Пам'ять Демона</text>
<text x="640.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle">Накопичення: I = 1 біт
Стирання: ΔS = -k_B ln 2</text>
<text x="640.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ΔS_пам'яті = 0 (за цикл)</text>
