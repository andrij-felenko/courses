<text x="400.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">Поглинає тепло Ландауера:
Q_стирання ≥ k_B T ln 2</text>
<line x1="260.0" y1="110.0" x2="540.0" y2="110.0" stroke="#b45309" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="330.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">1. Вимірювання (I = 1 біт)</text>
<line x1="330.0" y1="240.0" x2="160.0" y2="200.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="230.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">2. Q_поглинуте = k_B T ln 2</text>
<line x1="640.0" y1="200.0" x2="470.0" y2="240.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="510.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">3. Q_стирання ≥ k_B T ln 2</text>
<rect x="-52.7" y="369.0" width="905.4" height="32.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="389.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Нерівність Сагави-Уеди: ⟨W⟩ ≤ -ΔF + k_B T · I. Інформація перетворюється на роботу, але її стирання компенсує ентропію.</tspan></text>
