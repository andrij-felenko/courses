<svg xmlns="http://www.w3.org/2000/svg" viewBox="-62.7 -10 925.4 421" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-62.7" y="-10" width="925.4" height="421" fill="#ffffff"/>
