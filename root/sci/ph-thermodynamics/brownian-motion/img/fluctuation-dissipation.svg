<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 740 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="740" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="720.0" height="360.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Універсальний місток: Флуктуаційно-дисипативна теорема</text>
<text x="360.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Розсіяння енергії (дисипація) неминуче породжує спонтанні теплові флуктуації</text>
<rect x="30.0" y="75.0" width="320.0" height="250.0" rx="10" fill="#fcfdff" stroke="#27ae60" stroke-width="1.5"/>
<text x="190.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механічна система (Рідина)</text>
<rect x="65.7" y="129.5" width="248.7" height="21.0" rx="6" fill="#e8f0fe" stroke="#aecbfa" stroke-width="1.0"/><text x="190.0" y="143.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1557b0" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Дисипація: В'язке тертя γ = 6 π η a</tspan></text>
<line x1="190.0" y1="167.0" x2="190.0" y2="203.0" stroke="#1a73e8" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="65.7" y="212.3" width="248.7" height="35.3" rx="6" fill="#fce8e6" stroke="#f5c2c7" stroke-width="1.0"/><text x="190.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c5221f" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Флуктуація: Випадкова сила F_rnd(t)</tspan><tspan x="190.0" dy="14.3">&lt;F_rnd²&gt; = 2 γ k_B T</tspan></text>
<rect x="79.3" y="279.5" width="221.4" height="21.0" rx="6" fill="#e6f4ea" stroke="#ceead6" stroke-width="1.0"/><text x="190.0" y="293.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#137333" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Наслідок: Дифузія D = k_B T / γ</tspan></text>
<text x="360.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="36" fill="#f9ab00" text-anchor="middle" font-weight="700">≡</text>
<text x="360.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ізоморфізм</text>
<rect x="370.0" y="75.0" width="320.0" height="250.0" rx="10" fill="#fcfdff" stroke="#27ae60" stroke-width="1.5"/>
<text x="530.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Електрична система (Резистор)</text>
<rect x="419.3" y="129.5" width="221.4" height="21.0" rx="6" fill="#e8f0fe" stroke="#aecbfa" stroke-width="1.0"/><text x="530.0" y="143.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1557b0" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Дисипація: Опір R (гальмування)</tspan></text>
<line x1="530.0" y1="167.0" x2="530.0" y2="203.0" stroke="#1a73e8" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="419.3" y="212.3" width="221.4" height="35.3" rx="6" fill="#fce8e6" stroke="#f5c2c7" stroke-width="1.0"/><text x="530.0" y="226.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c5221f" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Флуктуація: Напруга шуму U_n(t)</tspan><tspan x="530.0" dy="14.3">&lt;U_n²&gt; = 4 R k_B T B</tspan></text>
<rect x="375.0" y="279.5" width="310.1" height="21.0" rx="6" fill="#e6f4ea" stroke="#ceead6" stroke-width="1.0"/><text x="530.0" y="293.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#137333" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Наслідок: Струмовий шум I_n² = 4 k_B T B / R</tspan></text>
</svg>