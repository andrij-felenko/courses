<line x1="516.0" y1="184.0" x2="516.0" y2="140.0" stroke="#8a949e" stroke-width="3" stroke-linecap="round"/>
<line x1="530.0" y1="184.0" x2="530.0" y2="140.0" stroke="#8a949e" stroke-width="3" stroke-linecap="round"/>
