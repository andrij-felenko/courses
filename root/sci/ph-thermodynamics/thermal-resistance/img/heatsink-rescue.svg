  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Радіатор рятує: той самий ват, а кристал — холодний</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">5 Вт, повітря 25 °C: без радіатора 125 °C (на межі), з радіатором — безпечно</text>
<rect x="40.0" y="90.0" width="360.0" height="270.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="220.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Без радіатора</text>
<rect x="110.0" y="184.0" width="80.0" height="52.0" rx="5" fill="#2b2b2b" stroke="#1b1b1b" stroke-width="2"/>
<text x="150.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">5 Вт</text>
<text x="220.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Rθ ≈ 20 °C/Вт</text>
<text x="220.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">T = 25 + 5×20 = 125 °C ✗</text>
<rect x="420.0" y="90.0" width="360.0" height="270.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="600.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">З радіатором</text>
<line x1="488.0" y1="184.0" x2="488.0" y2="140.0" stroke="#8a949e" stroke-width="3" stroke-linecap="round"/>
