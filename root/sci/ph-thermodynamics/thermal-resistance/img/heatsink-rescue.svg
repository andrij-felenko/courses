<line x1="558.0" y1="184.0" x2="558.0" y2="140.0" stroke="#8a949e" stroke-width="3" stroke-linecap="round"/>
<line x1="572.0" y1="184.0" x2="572.0" y2="140.0" stroke="#8a949e" stroke-width="3" stroke-linecap="round"/>
<line x1="486.0" y1="184.0" x2="574.0" y2="184.0" stroke="#8a949e" stroke-width="4" stroke-linecap="round"/>
<text x="530.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">ребра радіатора</text>
<rect x="490.0" y="184.0" width="80.0" height="52.0" rx="5" fill="#2b2b2b" stroke="#1b1b1b" stroke-width="2"/>
<text x="530.0" y="214.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">5 Вт</text>
<text x="600.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Rθ ≈ 8 °C/Вт</text>
<text x="600.0" y="302.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">T = 25 + 5×8 = 65 °C ✓</text>
<text x="410.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Радіатор не «холодить» магічно — він зменшує Rθ(радіатор→повітря), і той самий ват дає менший перепад.</text>
