<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380">
<rect width="820" height="380" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тепловий шлях — це опори послідовно: від кристала до повітря</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Rθ(j→a) = Rθ(j→корпус) + Rθ(корпус→радіатор) + Rθ(радіатор→повітря)</text>
<line x1="80.0" y1="190.0" x2="740.0" y2="190.0" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>
<circle cx="120.0" cy="190.0" r="6.0" fill="#c0271e" stroke="#c0271e" stroke-width="1.5"/>
<text x="120.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">кристал</text>
<text x="120.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">T_j (гарячий)</text>
<circle cx="320.0" cy="190.0" r="6.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="320.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">корпус</text>
<circle cx="520.0" cy="190.0" r="6.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="520.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">радіатор</text>
<circle cx="720.0" cy="190.0" r="6.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1.5"/>
<text x="720.0" y="174.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">повітря</text>
<text x="720.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">T_a</text>
<rect x="190.0" y="178.0" width="60.0" height="24.0" rx="3" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<text x="220.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Rθ j-c</text>
<text x="220.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">корпус</text>
<rect x="390.0" y="178.0" width="60.0" height="24.0" rx="3" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<text x="420.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Rθ c-s</text>
<text x="420.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">паста/прокладка</text>
<rect x="590.0" y="178.0" width="60.0" height="24.0" rx="3" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<text x="620.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Rθ s-a</text>
<text x="620.0" y="236.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">→ повітря</text>
<line x1="80.0" y1="138.0" x2="740.0" y2="138.0" stroke="#e0792a" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="410.0" y="128.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e0792a" text-anchor="middle" font-weight="bold" font-style="normal">потік тепла P (ват) — однаковий уздовж шляху</text>
<rect x="60.0" y="322.0" width="700.0" height="44.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="410.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">T_j = T_a + P·Rθ(j→a). Опори додаються — тож кожна ланка (надто погана паста!) додає градусів.</text>
<text x="410.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Хочеш холодніший кристал — зменшуй сумарний Rθ: краща паста, більший радіатор, обдув.</text>
</svg>
