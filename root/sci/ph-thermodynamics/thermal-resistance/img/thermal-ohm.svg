<line x1="498.0" y1="240.0" x2="548.0" y2="240.0" stroke="#e0792a" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="520.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#e0792a" text-anchor="middle" font-weight="bold" font-style="normal">P</text>
<text x="600.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ΔT — різниця температур (°C)</text>
<text x="410.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">↔</text>
