<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Тепловий опір — як електричний: ΔT = P·Rθ</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">перепад температур ↔ напруга; потік тепла (ват) ↔ струм; °C/Вт ↔ оми</text>
<rect x="50.0" y="90.0" width="340.0" height="210.0" rx="12" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="220.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Електричне</text>
<text x="220.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">V = I · R</text>
<text x="220.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">струм I тече крізь опір R,</text>
<text x="220.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">на ньому падає напруга V</text>
<rect x="170.0" y="226.0" width="100.0" height="28.0" rx="4" fill="none" stroke="#1b1b1b" stroke-width="2"/>
<line x1="118.0" y1="240.0" x2="168.0" y2="240.0" stroke="#1f47b5" stroke-width="2.4" marker-end="url(#aBlue)"/>
<text x="140.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">I</text>
<text x="220.0" y="276.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">V — різниця потенціалів</text>
<rect x="430.0" y="90.0" width="340.0" height="210.0" rx="12" fill="#fbece9" stroke="#c0271e" stroke-width="1.6"/>
<text x="600.0" y="114.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Теплове</text>
<text x="600.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ΔT = P · Rθ</text>
<text x="600.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">тепло P тече крізь опір Rθ,</text>
<text x="600.0" y="202.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">на ньому падає температура ΔT</text>
