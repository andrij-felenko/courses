<rect x="60.0" y="320.0" width="680.0" height="26.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="400.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Радіатор б'є саме по конвекції: ребра дають велику площу, а вентилятор підсилює відведення.</text>
