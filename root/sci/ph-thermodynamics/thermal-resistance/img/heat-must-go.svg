  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="400.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Куди подіти ват: тепло мусить кудись текти, інакше деталь згорить</text>
<text x="400.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">спожита потужність стає теплом (§1.3.6); воно гріє кристал, аж поки той не гине (~150 °C)</text>
<rect x="170.0" y="180.0" width="120.0" height="80.0" rx="6" fill="#2b2b2b" stroke="#1b1b1b" stroke-width="2"/>
<text x="230.0" y="225.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold" font-style="normal">кристал</text>
<line x1="100.0" y1="220.0" x2="168.0" y2="220.0" stroke="#c0271e" stroke-width="3" marker-end="url(#aRed)"/>
<text x="135.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">P (ват)</text>
<line x1="210.0" y1="178.0" x2="210.0" y2="154.0" stroke="#e0792a" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="230.0" y1="178.0" x2="230.0" y2="154.0" stroke="#e0792a" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="250.0" y1="178.0" x2="250.0" y2="154.0" stroke="#e0792a" stroke-width="2" marker-end="url(#aInk)"/>
<text x="230.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e0792a" text-anchor="middle" font-weight="bold" font-style="normal">тепло</text>
<rect x="528.0" y="120.0" width="24.0" height="190.0" rx="12" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<circle cx="540.0" cy="318.0" r="20.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<rect x="534.0" y="150.0" width="12.0" height="168.0" rx="0" fill="#c0271e" stroke="none" stroke-width="0"/>
<circle cx="540.0" cy="318.0" r="14.0" fill="#c0271e" stroke="none" stroke-width="0"/>
<line x1="510.0" y1="140.0" x2="528.0" y2="140.0" stroke="#c0271e" stroke-width="2" stroke-linecap="round"/>
<text x="504.0" y="144.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">150 °C — кристал гине</text>
<line x1="510.0" y1="280.0" x2="528.0" y2="280.0" stroke="#1f8a3b" stroke-width="2" stroke-linecap="round"/>
<text x="504.0" y="284.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="end" font-weight="normal" font-style="normal">робоча зона</text>
<text x="540.0" y="112.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">T росте</text>
<rect x="60.0" y="358.0" width="680.0" height="28.0" rx="10" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.6"/>
<text x="400.0" y="377.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Питання теми: наскільки нагріється деталь за даної потужності — і як це тепло відвести?</text>
</svg>
