<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 800 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="800" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="780.0" height="380.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм Метрополіса-Гастінгса та детальний баланс</text>
<text x="390.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Розбиття переходу на пропозицію q(i → j) та прийняття α(i → j)</text>
<rect x="25.0" y="68.0" width="730.0" height="285.0" rx="10" fill="#fcfdff" stroke="#27ae60" stroke-width="1.5"/>
<circle cx="115.0" cy="188.0" r="28.0" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2.2"/>
<text x="115.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1557b0" text-anchor="middle" font-weight="700">стан i</text>
<text x="115.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Енергія E_i</text>
<line x1="145.0" y1="188.0" x2="240.0" y2="188.0" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="147.9" y="150.3" width="74.2" height="31.3" rx="6" fill="#e8f0fe" stroke="#aecbfa" stroke-width="1.5"/><text x="185.0" y="162.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1557b0" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">Пропозиція</tspan><tspan x="185.0" dy="14.3">q(i → j)</tspan></text>
<circle cx="275.0" cy="188.0" r="28.0" fill="#fef7e0" stroke="#b06000" stroke-width="2.2"/>
<text x="275.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b06000" text-anchor="middle" font-weight="700">стан j</text>
<text x="275.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Енергія E_j</text>
<rect x="366.0" y="168.2" width="198.0" height="39.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="465.0" y="184.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="465.0" dy="0.0">Розрахунок ΔE = E_j - E_i</tspan><tspan x="465.0" dy="15.6">α = min(1, exp(-ΔE / kT))</tspan></text>
<line x1="305.0" y1="188.0" x2="375.0" y2="188.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="550.0" y1="173.0" x2="610.0" y2="143.0" stroke="#137333" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="610.1" y="115.2" width="89.8" height="35.6" rx="6" fill="#e6f4ea" stroke="#a8dab5" stroke-width="1.5"/><text x="655.0" y="129.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#137333" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">ПРИЙНЯТО</tspan><tspan x="655.0" dy="15.6">x_{n+1} = j</tspan></text>
<line x1="550.0" y1="203.0" x2="610.0" y2="233.0" stroke="#d93025" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="610.1" y="225.2" width="89.8" height="35.6" rx="6" fill="#fce8e6" stroke="#f5c2c7" stroke-width="1.5"/><text x="655.0" y="239.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b31412" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">ВІДХИЛЕНО</tspan><tspan x="655.0" dy="15.6">x_{n+1} = i</tspan></text>
<rect x="24.2" y="307.0" width="731.7" height="22.0" rx="6" fill="#e8f0fe" stroke="#aecbfa" stroke-width="1.5"/><text x="390.0" y="322.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1557b0" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">Результат: P(i) · W(i → j) = P(j) · W(j → i)   ⇒   ланцюг сходиться до больцманівського розподілу</tspan></text>
</svg>