<circle cx="620.0" cy="270.0" r="5.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="245.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">T₁ (Гаряча)</text>
<text x="635.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">T₂ (Холодна)</text>
<line x1="260.0" y1="120.0" x2="620.0" y2="270.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="440.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">dT / dx = (T₂ - T₁) / L &lt; 0</text>
<line x1="320.0" y1="230.0" x2="560.0" y2="230.0" stroke="#e67e22" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="440.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e67e22" text-anchor="middle" font-weight="700">Тепловий потік q = -k (dT/dx)</text>
<line x1="260.0" y1="355.0" x2="620.0" y2="355.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="620.0" y1="355.0" x2="260.0" y2="355.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="440.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Товщина стінки L</text>
<rect x="160.4" y="398.0" width="559.2" height="24.0" rx="6" fill="#fef9e7" stroke="#f1c40f" stroke-width="1.5"/><text x="440.0" y="414.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Знак мінус показує, що тепло завжди передається у напрямку ЗМЕНШЕННЯ температури</tspan></text>
