<text x="795.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">x</text>
<line x1="140.0" y1="350.0" x2="140.0" y2="80.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="140.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">T (°C)</text>
<rect x="260.0" y="90.0" width="360.0" height="230.0" rx="6" fill="#fafafa" stroke="#d5dbdb" stroke-width="1.2"/>
