<text x="110.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Температура T (°C)</text>
<line x1="110.0" y1="120.0" x2="780.0" y2="120.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4,4"/>
<text x="790.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">T_усталена</text>
<path d="M 110 340 Q 180 140 380 125 L 780 120" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<text x="280.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Високий α (Мідь): швидка хвиля нагріву</text>
<path d="M 110 340 Q 320 330 520 220 T 780 135" fill="none" stroke="#2457d6" stroke-width="2.5"/>
<text x="540.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Низький α (Ізолятор): повільне прогрівання</text>
<rect x="64.4" y="380.8" width="771.2" height="28.5" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="399.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Температуропровідність α = k / (ρ·c_p) визначає ШВИДКІСТЬ вирівнювання температури при перехідних процесах</tspan></text>
