ont-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Загальна ефективність η_o</text><text x="570.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повний потік тепла:</text><text x="570.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-style="italic">Q_tot = h·[ A_u + η_f·A_f_tot ]·θ_b</text><text x="570.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формула масиву:</text><text x="570.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">η_o = 1 - (A_f / A_tot)·(1 - η_f)</text><text x="570.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Де A_tot = A_u + A_f_tot</text><text x="570.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Якщо η_f = 1 (ідеальне),</text><text x="570.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">то й η_o = 100%</text><line x1="300.0" y1="370.0" x2="300.0" y2="325.0" stroke="#2457d6" stroke-width="4.0"/><path d="M 300.0 325.0 L 307.0 339.0 L 293.0 339.0 z" fill="#2457d6"/><text x="300.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Приплив тепла від деталі Q_in</text>
