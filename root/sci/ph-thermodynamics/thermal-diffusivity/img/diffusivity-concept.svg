<text x="605.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Стрімкий перенос T(x,t)</text>
<rect x="455.0" y="290.0" width="300.0" height="115.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="605.0" y="322.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Формула: a = λ / (ρ · c_p)</tspan><tspan x="605.0" dy="14.3">• Енергія швидко передається</tspan><tspan x="605.0" dy="14.3">  наступним мікроатомам</tspan><tspan x="605.0" dy="14.3">• Швидке вирівнювання T</tspan><tspan x="605.0" dy="14.3">• a ≈ 10⁻⁴ м²/с (алмаз 1.1·10⁻³)</tspan></text>
<rect x="40.0" y="438.0" width="740.0" height="32.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="458.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Висновок: λ визначає ПОТІК тепла (Вт), а a — ШВИДКІСТЬ ЗМІНИ температури (м²/с)</tspan></text>
