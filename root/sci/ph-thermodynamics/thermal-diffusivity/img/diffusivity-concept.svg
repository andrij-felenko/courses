<rect x="65.0" y="290.0" width="300.0" height="115.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="215.0" y="322.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Рівняння: ∂T/∂t = a · ∇²T</tspan><tspan x="215.0" dy="14.3">• Енергія витрачається на</tspan><tspan x="215.0" dy="14.3">  нагрівання проміжних шарів</tspan><tspan x="215.0" dy="14.3">• Поширення тепла запізнюється</tspan><tspan x="215.0" dy="14.3">• a ≈ 10⁻⁷ м²/с (теплова інерція)</tspan></text>
