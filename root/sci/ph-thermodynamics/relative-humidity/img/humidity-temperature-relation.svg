<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Падіння відносної вологості під час нагрівання повітря взимку</text>
<rect x="100.0" y="110.0" width="260.0" height="270.0" rx="10" fill="#e8f1fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="230.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Зовнішнє повітря (взимку)</text>
<text x="230.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Температура: T = 0°C</tspan><tspan x="230.0" dy="17.6">Парціальний тиск: e = 4.9 гПа</tspan><tspan x="230.0" dy="17.6">Тиск насичення: e_s = 6.1 гПа</tspan><tspan x="230.0" dy="17.6"></tspan><tspan x="230.0" dy="17.6">Відносна вологість:</tspan><tspan x="230.0" dy="17.6">RH = (4.9 / 6.1) · 100%</tspan><tspan x="230.0" dy="17.6">= 80% (Повітря вологе)</tspan></text>
<line x1="380.0" y1="245.0" x2="480.0" y2="245.0" stroke="#c0392b" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="430.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Нагрівання в батареї</text>
<text x="430.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">(вміст H₂O сталий)</text>
<rect x="500.0" y="110.0" width="260.0" height="270.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="630.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Повітря в кімнаті (після нагріву)</text>
<text x="630.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Температура: T = 22°C</tspan><tspan x="630.0" dy="17.6">Парціальний тиск: e = 4.9 гПа</tspan><tspan x="630.0" dy="17.6">Тиск насичення: e_s = 26.4 гПа!</tspan><tspan x="630.0" dy="17.6"></tspan><tspan x="630.0" dy="17.6">Відносна вологість:</tspan><tspan x="630.0" dy="17.6">RH = (4.9 / 26.4) · 100%</tspan><tspan x="630.0" dy="17.6">= 18.5% (Вкрай сухе)</tspan></text>
<rect x="75.4" y="405.1" width="709.1" height="49.9" rx="6" fill="#f9fafb" stroke="#1a1a1a" stroke-width="1.5"/><text x="430.0" y="426.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Висновок: При ізобаричному нагріванні абсолютна кількість вологи не змінюється (e = const),</tspan><tspan x="430.0" dy="16.9">але тиск насичення e_s(T) зростає експоненційно -&gt; Відносна вологість RH катастрофічно падає!</tspan></text>
</svg>