<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Термодинамічне порівняння ізохорної (C_V) та ізобарної (C_p) теплоємностей</text>
<rect x="30.0" y="55.0" width="350.0" height="290.0" rx="8" fill="none" stroke="#333333" stroke-width="1.5"/>
<text x="205.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Ізохорний процес: C_V (V = const)</text>
<line x1="45.0" y1="90.0" x2="365.0" y2="90.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="110.0" y="115.0" width="190.0" height="150.0" rx="4" fill="#f8fafc" stroke="#333333" stroke-width="2.0"/>
<rect x="114.0" y="145.0" width="182.0" height="16.0" rx="6" fill="#cbd5e1" stroke="#333333" stroke-width="1.5"/>
<polygon points="104.0,140.0 114.0,153.0 104.0,165.0" fill="#c0392b" stroke="#333333"/>
<polygon points="306.0,140.0 296.0,153.0 306.0,165.0" fill="#c0392b" stroke="#333333"/>
<text x="205.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Зафіксований поршень (dV = 0)</text>
<circle cx="150.0" cy="190.0" r="7.0" fill="#2457d6" stroke="#333333" stroke-width="1.0"/>
<circle cx="200.0" cy="225.0" r="7.0" fill="#2457d6" stroke="#333333" stroke-width="1.0"/>
<circle cx="250.0" cy="195.0" r="7.0" fill="#2457d6" stroke="#333333" stroke-width="1.0"/>
<circle cx="180.0" cy="245.0" r="7.0" fill="#2457d6" stroke="#333333" stroke-width="1.0"/>
<circle cx="260.0" cy="240.0" r="7.0" fill="#2457d6" stroke="#333333" stroke-width="1.0"/>
<line x1="205.0" y1="300.0" x2="205.0" y2="270.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="240.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Q_V = dU</text>
<rect x="41.1" y="268.4" width="327.8" height="63.2" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="205.0" y="300.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Робота розширення: dW = P · dV = 0</tspan><tspan x="205.0" dy="15.6">Усе тепло йде на внутрішню енергію: dU = δQ_V</tspan><tspan x="205.0" dy="15.6">C_V = (∂U / ∂T)_V</tspan></text>
<rect x="420.0" y="55.0" width="350.0" height="290.0" rx="8" fill="none" stroke="#333333" stroke-width="1.5"/>
<text x="595.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Ізобарний процес: C_p (P = const)</text>
<line x1="435.0" y1="90.0" x2="755.0" y2="90.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="500.0" y="115.0" width="190.0" height="150.0" rx="4" fill="#f8fafc" stroke="#333333" stroke-width="2.0"/>
<rect x="504.0" y="130.0" width="182.0" height="16.0" rx="6" fill="#cbd5e1" stroke="#333333" stroke-width="1.5"/>
<line x1="595.0" y1="130.0" x2="595.0" y2="105.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="595.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Розширення: dW = P · dV &gt; 0</text>
<circle cx="540.0" cy="180.0" r="7.0" fill="#c0392b" stroke="#333333" stroke-width="1.0"/>
<circle cx="590.0" cy="220.0" r="7.0" fill="#c0392b" stroke="#333333" stroke-width="1.0"/>
<circle cx="640.0" cy="190.0" r="7.0" fill="#c0392b" stroke="#333333" stroke-width="1.0"/>
<circle cx="565.0" cy="240.0" r="7.0" fill="#c0392b" stroke="#333333" stroke-width="1.0"/>
<circle cx="650.0" cy="235.0" r="7.0" fill="#c0392b" stroke="#333333" stroke-width="1.0"/>
<line x1="595.0" y1="300.0" x2="595.0" y2="270.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="640.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Q_p = dU + P dV</text>
<rect x="441.4" y="268.4" width="307.3" height="63.2" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="595.0" y="300.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Газ виконує роботу проти тиску: dW &gt; 0</tspan><tspan x="595.0" dy="15.6">Потрібно більше тепла для розігріву на 1 K</tspan><tspan x="595.0" dy="15.6">C_p = (∂H / ∂T)_p = C_V + P(∂V/∂T)_p</tspan></text>
<rect x="39.4" y="358.5" width="721.2" height="33.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="379.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Співвідношення Маєра для 1 моля ідеального газу:  C_p,m - C_V,m = R ≈ 8.314 Дж/(моль·К)</tspan></text>
</svg>