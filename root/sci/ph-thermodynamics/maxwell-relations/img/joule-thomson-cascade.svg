<text x="310.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">(∂S/∂P)ᵀ = −(∂V/∂T)ₚ</text>
<rect x="403.4" y="85.0" width="173.1" height="49.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="490.0" y="106.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Вимірювана величина</tspan><tspan x="490.0" dy="16.9">−(∂V/∂T)ₚ = −V·α</tspan></text>
