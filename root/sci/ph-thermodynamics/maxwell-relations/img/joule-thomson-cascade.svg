<rect x="53.4" y="243.1" width="193.3" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="150.0" y="266.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Різниця теплоємностей</tspan><tspan x="150.0" dy="16.9">Cₚ − Cᵥ = T·V·α² / κₜ</tspan></text>
<rect x="369.2" y="243.1" width="241.6" height="53.9" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="266.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Ефект Джоуля — Томсона</tspan><tspan x="490.0" dy="16.9">μ_JT = (V / Cₚ) · (T·α − 1)</tspan></text>
