<rect x="616.6" y="102.0" width="156.8" height="56.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="695.0" y="120.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Ізобарний (P = const):</tspan><tspan x="695.0" dy="13.0">Q = n C_p ΔT ,  W = P ΔV</tspan><tspan x="695.0" dy="13.0">ΔU = n C_v ΔT</tspan></text>
<rect x="613.8" y="172.0" width="162.5" height="56.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="695.0" y="190.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Ізотермічний (T = const):</tspan><tspan x="695.0" dy="13.0">ΔU = 0  ⇒  Q = W</tspan><tspan x="695.0" dy="13.0">W = n R T ln(V₂ / V₁)</tspan></text>
