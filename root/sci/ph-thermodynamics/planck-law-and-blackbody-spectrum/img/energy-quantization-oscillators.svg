<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дискретизація енергії осциляторів стінок та квантове виморожування</text>
<rect x="40.0" y="55.0" width="320.0" height="325.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="200.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Низька частота (h·ν &lt;&lt; k_B·T)</text>
<line x1="55.0" y1="90.0" x2="345.0" y2="90.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="80.0" y1="275.0" x2="260.0" y2="275.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="270.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">E_0 = 0 hν</text>
<line x1="80.0" y1="245.0" x2="260.0" y2="245.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="270.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">E_1 = 1 hν</text>
<line x1="80.0" y1="215.0" x2="260.0" y2="215.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="270.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">E_2 = 2 hν</text>
<line x1="80.0" y1="185.0" x2="260.0" y2="185.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="270.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">E_3 = 3 hν</text>
<line x1="80.0" y1="155.0" x2="260.0" y2="155.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="270.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">E_4 = 4 hν</text>
<line x1="80.0" y1="125.0" x2="260.0" y2="125.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="270.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">E_5 = 5 hν</text>
<rect x="58.3" y="300.2" width="283.3" height="59.6" rx="6" fill="#ecfdf5" stroke="#c0392b" stroke-width="1.2"/><text x="200.0" y="319.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Квант ΔE = h·ν малий у порівнянні з k_B·T.</tspan><tspan x="200.0" dy="14.3">Тепловий рух легко збуджує багато рівнів.</tspan><tspan x="200.0" dy="14.3">⟨E⟩ ≈ k_B·T (класична межа)</tspan></text>
<rect x="400.0" y="55.0" width="320.0" height="325.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="560.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Висока частота (h·ν &gt;&gt; k_B·T)</text>
<line x1="415.0" y1="90.0" x2="705.0" y2="90.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="3,3"/>
<line x1="440.0" y1="275.0" x2="620.0" y2="275.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="630.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">E_0 = 0 hν</text>
<line x1="440.0" y1="200.0" x2="620.0" y2="200.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="630.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">E_1 = 1 hν</text>
<line x1="440.0" y1="125.0" x2="620.0" y2="125.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="630.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">E_2 = 2 hν</text>
<rect x="427.7" y="300.2" width="264.5" height="59.6" rx="6" fill="#fef2f2" stroke="#2457d6" stroke-width="1.2"/><text x="560.0" y="319.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Квант ΔE = h·ν значно більший за k_B·T.</tspan><tspan x="560.0" dy="14.3">Імовірність P(E₁) ∝ exp(-hν/kT) → 0.</tspan><tspan x="560.0" dy="14.3">Мода виявилась вимороженою!</tspan></text>
</svg>