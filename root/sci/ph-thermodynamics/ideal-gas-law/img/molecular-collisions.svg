<rect x="464.5" y="335.0" width="321.0" height="110.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="625.0" y="355.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">Переданий імпульс стінці за 1 зіткнення:</tspan><tspan x="625.0" dy="15.6">Δp = p_x − p_x' = m·v_x − (−m·v_x) = 2·m·v_x</tspan><tspan x="625.0" dy="15.6"></tspan><tspan x="625.0" dy="15.6">Макроскопічний тиск P = F / A:</tspan><tspan x="625.0" dy="15.6">Усереднення по N молекулах у 3D просторі:</tspan><tspan x="625.0" dy="15.6">P = (1/3) · n · m · &lt;v²&gt; = (2/3) · n · &lt;E_k&gt;</tspan></text>
