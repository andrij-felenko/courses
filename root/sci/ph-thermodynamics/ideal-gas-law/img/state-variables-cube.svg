<rect x="399.4" y="83.2" width="481.1" height="43.6" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="640.0" y="101.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Тиск P (Па)</tspan><tspan x="640.0" dy="15.6">Скалярна міра нормальної сили ударів молекул на одиницю площі стінки</tspan></text>
<rect x="426.8" y="168.2" width="426.4" height="43.6" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="640.0" y="186.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Об'єм V (м³)</tspan><tspan x="640.0" dy="15.6">Простір, доступний для вільного хаотичного руху молекул газу</tspan></text>
<rect x="423.4" y="253.2" width="433.2" height="43.6" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="640.0" y="271.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Температура T (К)</tspan><tspan x="640.0" dy="15.6">Абсолютна термодинамічна температура: T ~ &lt;E_k&gt; = (3/2)·k_B·T</tspan></text>
<rect x="423.4" y="338.2" width="433.2" height="43.6" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/><text x="640.0" y="356.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Кількість речовини ν (моль)</tspan><tspan x="640.0" dy="15.6">Число молекул N у частках числа Авогадро: ν = N / N_A = m / M</tspan></text>
<rect x="189.7" y="422.1" width="460.6" height="45.9" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="420.0" y="441.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Зв'язок параметрів стану (Рівняння Клапейрона — Менделєєва):</tspan><tspan x="420.0" dy="16.9">P · V = (m / M) · R · T   або   P · V = N · k_B · T</tspan></text>
