<rect x="598.3" y="108.2" width="343.4" height="43.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="770.0" y="126.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Точний SVP (Експоненційний час 2^O(n))</tspan><tspan x="770.0" dy="15.6">Повний перебір у кулі Мінковського / Sieving</tspan></text>
<rect x="598.3" y="193.2" width="343.4" height="43.6" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.8"/><text x="770.0" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Блокова редукція BKZ (Субекспоненційний час)</tspan><tspan x="770.0" dy="15.6">Фактор наближення k^(n/2k) для блоку k</tspan></text>
<rect x="616.9" y="278.2" width="306.2" height="43.6" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/><text x="770.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Алгоритм LLL (Поліноміальний час O(n⁶))</tspan><tspan x="770.0" dy="15.6">Фактор наближення 2^((n-1)/2) від λ₁(L)</tspan></text>
<rect x="561.1" y="363.2" width="417.8" height="43.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="770.0" y="381.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Гарантія Мінковського: λ₁ ≤ √n · det(L)¹/ⁿ</tspan><tspan x="770.0" dy="15.6">Невіддільна основа криптографічної стійкості (LWE/SIS)</tspan></text>
