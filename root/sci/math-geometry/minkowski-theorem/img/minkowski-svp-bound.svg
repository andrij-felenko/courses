<text x="265.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Існування гарантоване: λ₁(L) ≤ 2·(det(L)/V_n)¹/ⁿ</text>
