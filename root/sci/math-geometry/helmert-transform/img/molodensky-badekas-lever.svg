<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усунення важеля обертання: класичний Гельмерт проти Молоденського — Бадекаса</text>
<rect x="20.0" y="55.0" width="385.0" height="425.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="212.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Класичний Гельмерт: центр у геоцентрі</text>
<circle cx="80.0" cy="240.0" r="6.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="85.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геоцентр (0, 0, 0)</text>
<line x1="80.0" y1="240.0" x2="280.0" y2="140.0" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5,4"/>
<text x="170.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Важіль R ≈ 6371 км</text>
<circle cx="290.0" cy="130.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<circle cx="325.0" cy="155.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<circle cx="335.0" cy="115.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<rect x="275.0" y="105.0" width="70.0" height="60.0" rx="6" fill="none" stroke="#27ae60" stroke-width="1.5"/>
<text x="310.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Мережа точок</text>
<line x1="335.0" y1="140.0" x2="370.0" y2="120.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="315.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ΔX = R · θ ≈ 30.9 м/1″</text>
<rect x="35.0" y="305.0" width="355.0" height="155.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="212.5" y="355.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Поворот навколо геоцентра (0,0,0)</tspan><tspan x="212.5" dy="15.6">створює плече довжиною 6371 км.</tspan><tspan x="212.5" dy="15.6"></tspan><tspan x="212.5" dy="15.6">Наслідок: екстремальна кореляція</tspan><tspan x="212.5" dy="15.6">між зсувами T та кутами R в МНК.</tspan></text>
<rect x="435.0" y="55.0" width="385.0" height="425.0" rx="8" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/>
<text x="627.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Молоденський — Бадекас: центр у X₀</text>
<circle cx="627.0" cy="160.0" r="7.0" fill="#27ae60" stroke="#1e8449" stroke-width="2.0"/>
<text x="627.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e8449" text-anchor="middle" font-weight="700">Центроїд мережі X₀</text>
<circle cx="567.0" cy="135.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<circle cx="682.0" cy="125.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<circle cx="582.0" cy="200.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<circle cx="677.0" cy="190.0" r="4.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<line x1="627.0" y1="160.0" x2="567.0" y2="135.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="627.0" y1="160.0" x2="682.0" y2="125.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="627.0" y1="160.0" x2="582.0" y2="200.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="627.0" y1="160.0" x2="677.0" y2="190.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="627.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Плече r ≤ 100...500 км (лише розмір мережі)</text>
<rect x="450.0" y="305.0" width="355.0" height="155.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="627.5" y="339.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="627.5" dy="0.0">Центр обертання перенесено в барицентр:</tspan><tspan x="627.5" dy="15.6">X₀ = (1/n) · ∑ X_i</tspan><tspan x="627.5" dy="15.6"></tspan><tspan x="627.5" dy="15.6">Формула (10 параметрів: 7 + X₀):</tspan><tspan x="627.5" dy="15.6">P_B = X₀ + T + (1 + s) · R · (P_A - X₀)</tspan><tspan x="627.5" dy="15.6"></tspan><tspan x="627.5" dy="15.6">Повне розчеплення T та R у матриці МНК!</tspan></text>
</svg>