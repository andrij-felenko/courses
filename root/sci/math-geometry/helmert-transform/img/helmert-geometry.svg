<rect x="480.0" y="365.0" width="340.0" height="135.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="650.0" y="393.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Сім параметрів зв'язку:</tspan><tspan x="650.0" dy="14.3">• 3 лінійні зсуви початку відліку: Tx, Ty, Tz</tspan><tspan x="650.0" dy="14.3">• 3 просторові кути обертання осей: Rx, Ry, Rz</tspan><tspan x="650.0" dy="14.3">• 1 масштабний коефіцієнт: s (або m = s · 10⁶ ppm)</tspan><tspan x="650.0" dy="14.3"></tspan><tspan x="650.0" dy="14.3">Формула просторової подібності:</tspan><tspan x="650.0" dy="14.3">P_B = T + (1 + s) · R · P_A</tspan></text>
</svg>