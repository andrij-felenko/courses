<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кінематичний ланцюг триосьового підвісу</text>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кінематичний ланцюг триосьового підвісу (Z-Y-X)</text>
<rect x="45.0" y="118.2" width="170.0" height="43.6" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.8"/><text x="130.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Базова рамка</tspan><tspan x="130.0" dy="15.6">(апарат)</tspan></text>
<text x="130.0" y="106.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Корпус F_b</text>
<rect x="285.0" y="118.2" width="170.0" height="43.6" rx="6" fill="#eef9e8" stroke="#27ae60" stroke-width="1.8"/><text x="370.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Обертання навколо Z_b</tspan><tspan x="370.0" dy="15.6">Кут ψ (Yaw)</tspan></text>
<text x="370.0" y="106.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Кільце рискання F_1</text>
<rect x="525.0" y="118.2" width="170.0" height="43.6" rx="6" fill="#fff8e7" stroke="#d35400" stroke-width="1.8"/><text x="610.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Обертання навколо Y_1</tspan><tspan x="610.0" dy="15.6">Кут θ (Pitch)</tspan></text>
<text x="610.0" y="106.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d35400" text-anchor="middle" font-weight="700">Кільце тангажу F_2</text>
<rect x="755.0" y="118.2" width="170.0" height="43.6" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="1.8"/><text x="840.0" y="136.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="840.0" dy="0.0">Обертання навколо X_2</tspan><tspan x="840.0" dy="15.6">Кут φ (Roll &amp; Камера)</tspan></text>
<text x="840.0" y="106.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Платформа крену F_3</text>
<line x1="225.0" y1="140.0" x2="275.0" y2="140.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="250.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">R_z(ψ)</text>
<line x1="465.0" y1="140.0" x2="515.0" y2="140.0" stroke="#d35400" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="490.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="middle" font-weight="700">R_y(θ)</text>
<line x1="705.0" y1="140.0" x2="745.0" y2="140.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="725.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">R_x(φ)</text>
<rect x="170.0" y="274.6" width="620.0" height="70.8" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="297.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Результуюча орієнтація корисного навантаження відносно корпусу:</tspan><tspan x="480.0" dy="16.9">R_g = R_z(ψ) · R_y(θ) · R_x(φ) ∈ SO(3)</tspan><tspan x="480.0" dy="16.9">Абсолютна орієнтація камери у світі:  R_cam = R_body · R_g</tspan></text>
<text x="480.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Вкладені шарніри реалізують послідовні внутрішні повороти (intrinsic): кожна вісь обертається разом із попереднім кільцем</text>
</svg>