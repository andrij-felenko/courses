<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотириосьовий підвіс для усунення карданового замка</text>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотириосьовий надлишковий підвіс (4-Axis Redundant Gimbal)</text>
<rect x="40.0" y="121.3" width="140.0" height="37.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="110.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">База літака</tspan><tspan x="110.0" dy="14.3">чи БПЛА</tspan></text>
<text x="110.0" y="111.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">Корпус</text>
<rect x="225.6" y="121.3" width="168.8" height="37.3" rx="6" fill="#e8f4fd" stroke="#2457d6" stroke-width="1.6"/><text x="310.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Грубе стеження</tspan><tspan x="310.0" dy="14.3">(відводить рамку від 90°)</tspan></text>
<text x="310.0" y="111.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Зовнішній Yaw</text>
<rect x="450.0" y="121.3" width="140.0" height="37.3" rx="6" fill="#eef9e8" stroke="#27ae60" stroke-width="1.6"/><text x="520.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Точна стабілізація</tspan><tspan x="520.0" dy="14.3">курсу</tspan></text>
<text x="520.0" y="111.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Внутрішній Yaw</text>
<rect x="635.6" y="121.3" width="168.8" height="37.3" rx="6" fill="#fff8e7" stroke="#d35400" stroke-width="1.6"/><text x="720.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Тангаж і крен</tspan><tspan x="720.0" dy="14.3">|θ| &lt; 60° (безпечна зона)</tspan></text>
<text x="720.0" y="111.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="middle" font-weight="700">Pitch &amp; Roll</text>
<rect x="810.0" y="121.3" width="140.0" height="37.3" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="1.6"/><text x="880.0" y="136.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Корисне</tspan><tspan x="880.0" dy="14.3">навантаження</tspan></text>
<text x="880.0" y="111.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Камера</text>
<line x1="185.0" y1="140.0" x2="235.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="385.0" y1="140.0" x2="445.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="595.0" y1="140.0" x2="645.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="795.0" y1="140.0" x2="830.0" y2="140.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="110.0" y="250.6" width="740.0" height="78.8" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="270.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Принцип уникнення сингулярності:</tspan><tspan x="480.0" dy="15.6">Коли тангаж наближається до небезпечної зони (|θ| &gt; 60°), зовнішня рамка рискання (Outer Yaw)</tspan><tspan x="480.0" dy="15.6">розвертає всю проміжну вісь підвісу, утримуючи кут внутрішнього тангажу в робочому безпечному діапазоні.</tspan><tspan x="480.0" dy="15.6">Результат: повна сферична свобода 360°×360° без втрати керованості у зеніті чи надирі.</tspan></text>
<text x="480.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Четверта надлишкова вісь дозволяє розімкнути геометричну сингулярність без переривання стабілізації</text>
</svg>