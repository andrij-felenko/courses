<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пряма та зворотна кінематика підвісу камери</text>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пряма та зворотна кінематика оптичного підвісу</text>
<text x="250.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Пряма кінематика (Forward)</text>
<rect x="96.4" y="88.8" width="307.3" height="172.4" rx="6" fill="#edf4fc" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Вхід:</tspan><tspan x="250.0" dy="15.6">• Орієнтація носія R_body</tspan><tspan x="250.0" dy="15.6">• Кути моторів підвісу (ψ, θ, φ)</tspan><tspan x="250.0" dy="15.6"></tspan><tspan x="250.0" dy="15.6">Обчислення:</tspan><tspan x="250.0" dy="15.6">R_g = R_z(ψ) · R_y(θ) · R_x(φ)</tspan><tspan x="250.0" dy="15.6">R_cam = R_body · R_g</tspan><tspan x="250.0" dy="15.6"></tspan><tspan x="250.0" dy="15.6">Вихід: Куди дивиться оптична вісь у світі:</tspan><tspan x="250.0" dy="15.6">v_cam = R_cam · [1, 0, 0]^T</tspan></text>
<text x="480.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="32" fill="#333333" text-anchor="middle">⇄</text>
<text x="473.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">R_g = R_body^T · R_target</text>
<text x="710.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Зворотна кінематика (Inverse / Targeting)</text>
<rect x="522.2" y="88.8" width="375.7" height="172.4" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/><text x="710.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Вхід:</tspan><tspan x="710.0" dy="15.6">• Бажаний вектор на ціль у світі v_target</tspan><tspan x="710.0" dy="15.6">• Поточна орієнтація носія R_body</tspan><tspan x="710.0" dy="15.6"></tspan><tspan x="710.0" dy="15.6">Обчислення:</tspan><tspan x="710.0" dy="15.6">Вектор цілі в рамці носія: v_b = R_body^T · v_target</tspan><tspan x="710.0" dy="15.6">Кут рискання: ψ = atan2(v_b.y, v_b.x)</tspan><tspan x="710.0" dy="15.6">Кут тангажу:  θ = atan2(-v_b.z, √(v_b.x² + v_b.y²))</tspan><tspan x="710.0" dy="15.6"></tspan><tspan x="710.0" dy="15.6">Вихід: Завдання моторам підвісу (ψ, θ, φ=0)</tspan></text>
<rect x="80.0" y="308.4" width="800.0" height="63.2" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/><text x="480.0" y="328.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Компенсація збурень носія в реальному часі (Attitude Stabilization):</tspan><tspan x="480.0" dy="15.6">Коли безпілотник виконує маневр (крен, рискання), контролер підвісу розраховує R_g = R_body^T · R_inertial,</tspan><tspan x="480.0" dy="15.6">миттєво відпрацьовуючи кути моторів так, щоб вектор візування оптичної осі лишався нерухомим у світі.</tspan></text>
<text x="480.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Зворотна кінематика перетворює бажаний світовий напрямок огляду на кутові уставки для моторів підвісу</text>
</svg>