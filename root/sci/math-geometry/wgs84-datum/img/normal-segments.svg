<rect x="665.0" y="205.0" width="270.0" height="220.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.6"/><text x="800.0" y="235.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">Трикутник P–C–Q прямокутний,</tspan><tspan x="800.0" dy="16.9">кут при P дорівнює φ.</tspan><tspan x="800.0" dy="16.9">Тому PQ = p / cos φ = a/W = N,</tspan><tspan x="800.0" dy="16.9">а PE = z / sin φ = N(1−e²).</tspan><tspan x="800.0" dy="16.9"></tspan><tspan x="800.0" dy="16.9">WGS-84, φ = 50°:</tspan><tspan x="800.0" dy="16.9">N = 6 390 702 м</tspan><tspan x="800.0" dy="16.9">N(1−e²) = 6 347 920 м</tspan><tspan x="800.0" dy="16.9">p = 4 107 864 м</tspan><tspan x="800.0" dy="16.9">вісь пробито на 32 773 м</tspan><tspan x="800.0" dy="16.9">нижче за центр мас.</tspan></text>
<text x="480.0" y="570.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">сплюснутість на рисунку перебільшена в десятки разів</text>
