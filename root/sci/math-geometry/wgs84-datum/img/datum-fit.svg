<rect x="630.0" y="190.0" width="196.0" height="176.0" rx="6" fill="#f7fbf8" stroke="#27ae60" stroke-width="1.6"/><text x="728.0" y="219.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="728.0" dy="0.0">Обидві криві —</tspan><tspan x="728.0" dy="15.6">законні еліпсоїди.</tspan><tspan x="728.0" dy="15.6">Різні в них не форми,</tspan><tspan x="728.0" dy="15.6">а прив'язки: центр</tspan><tspan x="728.0" dy="15.6">місцевого відсунуто</tspan><tspan x="728.0" dy="15.6">від центра мас на</tspan><tspan x="728.0" dy="15.6">сотні метрів.</tspan><tspan x="728.0" dy="15.6">Звідси й розбіжність</tspan><tspan x="728.0" dy="15.6">координат.</tspan></text>
