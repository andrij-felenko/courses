<rect x="600.0" y="60.0" width="260.0" height="150.0" rx="6" fill="#eef2fd" stroke="#2457d6" stroke-width="1.6"/><text x="730.0" y="105.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Сплюснута Земля:</tspan><tspan x="730.0" dy="16.9">біля полюса поверхня пряміша,</tspan><tspan x="730.0" dy="16.9">радіус кривини більший —</tspan><tspan x="730.0" dy="16.9">щоб нормаль повернулась на 1°,</tspan><tspan x="730.0" dy="16.9">треба пройти довший шлях.</tspan></text>
<rect x="600.0" y="246.0" width="260.0" height="210.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.6"/><text x="730.0" y="296.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Що виміряли:</tspan><tspan x="730.0" dy="16.9">Лапландія (1736–37)</tspan><tspan x="730.0" dy="16.9">1° ≈ 57 400 туазів</tspan><tspan x="730.0" dy="16.9">Франція, Париж</tspan><tspan x="730.0" dy="16.9">1° ≈ 57 060 туазів</tspan><tspan x="730.0" dy="16.9">Перу, екватор (1735–44)</tspan><tspan x="730.0" dy="16.9">1° ≈ 56 750 туазів</tspan><tspan x="730.0" dy="16.9">Довший градус — на півночі.</tspan></text>
<text x="600.0" y="486.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">сплюснутість на рисунку перебільшена в десятки разів</text>
