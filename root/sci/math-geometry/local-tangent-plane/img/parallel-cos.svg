<rect x="410.0" y="70.0" width="236.0" height="128.0" rx="6" fill="#f7fbf8" stroke="#27ae60" stroke-width="1.6"/><text x="528.0" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="528.0" dy="0.0">Рух на схід іде по паралелі —</tspan><tspan x="528.0" dy="15.6">колу радіусом R·cos φ, меншому</tspan><tspan x="528.0" dy="15.6">за екватор. Тому градус довготи</tspan><tspan x="528.0" dy="15.6">коротшає до полюсів як cos φ:</tspan><tspan x="528.0" dy="15.6">на екваторі — повний, на</tspan><tspan x="528.0" dy="15.6">полюсі — нуль.</tspan></text>
