<rect x="580.0" y="70.0" width="240.0" height="420.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="183.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Алгебра лінеаризації 2D:</tspan><tspan x="700.0" dy="14.3">1. Рівняння 3 кіл:</tspan><tspan x="700.0" dy="14.3">   (x − xᵢ)² + (y − yᵢ)² = rᵢ²</tspan><tspan x="700.0" dy="14.3"></tspan><tspan x="700.0" dy="14.3">2. Віднімання 1-го рівняння:</tspan><tspan x="700.0" dy="14.3">   Квадрати (x² + y²) взаємно</tspan><tspan x="700.0" dy="14.3">   знищуються.</tspan><tspan x="700.0" dy="14.3"></tspan><tspan x="700.0" dy="14.3">3. Система 2 лінійних прямих:</tspan><tspan x="700.0" dy="14.3">   2(x₂−x₁)x + 2(y₂−y₁)y = b₁</tspan><tspan x="700.0" dy="14.3">   2(x₃−x₁)x + 2(y₃−y₁)y = b₂</tspan><tspan x="700.0" dy="14.3"></tspan><tspan x="700.0" dy="14.3">4. Перетин радикальних осей:</tspan><tspan x="700.0" dy="14.3">   Єдиний розв'язок (x, y) через</tspan><tspan x="700.0" dy="14.3">   визначник Крамера 2×2.</tspan></text>
