<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тривимірна трилатерація: канонічний локальний базис та 4 опорні точки</text>
<line x1="130.0" y1="360.0" x2="450.0" y2="360.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="465.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">e_x (X')</text>
<line x1="130.0" y1="360.0" x2="217.3" y2="238.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="226.0" y="232.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">e_y (Y')</text>
<line x1="130.0" y1="360.0" x2="130.0" y2="190.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="130.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">e_z (Z')</text>
<circle cx="130.0" cy="360.0" r="6.0" fill="#2457d6" stroke="#1b3f9b" stroke-width="2.0"/>
<rect x="20.4" y="368.0" width="109.3" height="32.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="75.0" y="388.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="75.0" dy="0.0">P₁ (0, 0, 0)</tspan></text>
<circle cx="360.0" cy="360.0" r="6.0" fill="#2457d6" stroke="#1b3f9b" stroke-width="2.0"/>
<rect x="325.4" y="320.0" width="109.3" height="32.0" rx="6" fill="#eef3fd" stroke="#2457d6" stroke-width="1.5"/><text x="380.0" y="340.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">P₂ (d, 0, 0)</tspan></text>
<circle cx="230.0" cy="200.0" r="6.0" fill="#27ae60" stroke="#1e8449" stroke-width="2.0"/>
<rect x="130.4" y="164.0" width="109.3" height="32.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="185.0" y="184.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">P₃ (i, j, 0)</tspan></text>
<line x1="130.0" y1="360.0" x2="360.0" y2="360.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="130.0" y1="360.0" x2="230.0" y2="200.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="360.0" y1="360.0" x2="230.0" y2="200.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,4"/>
<circle cx="280.0" cy="195.0" r="7.0" fill="#27ae60" stroke="#1e8449" stroke-width="2.2"/>
<rect x="262.0" y="167.0" width="206.0" height="32.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="365.0" y="187.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e8449" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">Кандидат P⁺ (x', y', +z')</tspan></text>
<circle cx="280.0" cy="385.0" r="7.0" fill="#e74c3c" stroke="#c0392b" stroke-width="2.2"/>
<rect x="262.0" y="387.0" width="206.0" height="32.0" rx="6" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/><text x="365.0" y="407.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">Кандидат P⁻ (x', y', −z')</tspan></text>
<line x1="280.0" y1="195.0" x2="280.0" y2="385.0" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="4,4"/>
<circle cx="280.0" cy="290.0" r="4.0" fill="#6b7280" stroke="#333333" stroke-width="1.5"/>
<text x="225.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(x', y', 0)</text>
<circle cx="480.0" cy="110.0" r="6.0" fill="#8e44ad" stroke="#6c3483" stroke-width="2.0"/>
<rect x="449.4" y="79.0" width="191.1" height="32.0" rx="6" fill="#f5eef8" stroke="#8e44ad" stroke-width="1.5"/><text x="545.0" y="99.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6c3483" text-anchor="middle" font-weight="700"><tspan x="545.0" dy="0.0">Маяк P₄ (усуває знак z)</tspan></text>
<line x1="480.0" y1="110.0" x2="280.0" y2="195.0" stroke="#27ae60" stroke-width="1.8"/>
<text x="410.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e8449" text-anchor="middle" font-weight="700">d(P₄, P⁺) ≈ r₄ (ІСТИНА)</text>
<line x1="480.0" y1="110.0" x2="280.0" y2="385.0" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="415.0" y="257.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">d(P₄, P⁻) ≠ r₄ (ХИБА)</text>
<rect x="500.0" y="350.0" width="325.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="662.5" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="662.5" dy="0.0">Канонічний розв'язок 3D:</tspan><tspan x="662.5" dy="15.6">• x' = (r₁² − r₂² + d²) / (2d)</tspan><tspan x="662.5" dy="15.6">• y' = (r₁² − r₃² + i² + j² − 2ix') / (2j)</tspan><tspan x="662.5" dy="15.6">• z' = ± √(r₁² − x'² − y'²)</tspan><tspan x="662.5" dy="15.6">• 4-та точка P₄ обирає правильний знак z'.</tspan></text>
</svg>