<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 541" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="541" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="135.9" y="12.5" width="708.2" height="35.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="35.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Алгоритм безпечного витягання кутів Ейлера з кватерніона (Безпечний Z-Y-X)</tspan></text>
<rect x="254.3" y="63.5" width="471.4" height="33.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="84.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Вхід: нормований кватерніон q = (w, x, y, z), де |q| = 1</tspan></text>
<line x1="490.0" y1="100.0" x2="490.0" y2="130.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="363.1" y="130.1" width="253.7" height="49.9" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="151.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Обчислення параметра тангажу:</tspan><tspan x="490.0" dy="16.9">s = 2 · (w·y − x·z)</tspan></text>
<line x1="490.0" y1="180.0" x2="490.0" y2="210.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="287.6" y="218.8" width="404.7" height="32.5" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="490.0" y="239.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Захист від похибок float: s_safe = clamp(s, −1.0, 1.0)</tspan></text>
<line x1="490.0" y1="260.0" x2="490.0" y2="290.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="338.9" y="295.1" width="302.1" height="49.9" rx="6" fill="#fffbe6" stroke="#d48800" stroke-width="1.5"/><text x="490.0" y="316.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Умова сингулярності (Gimbal Lock):</tspan><tspan x="490.0" dy="16.9">|s_safe| ≥ 1.0 − ε   (де ε ≈ 10⁻⁶)?</tspan></text>
<line x1="635.0" y1="320.0" x2="770.0" y2="320.0" stroke="#c0392b" stroke-width="2.2"/>
<line x1="760.0" y1="320.0" x2="780.0" y2="320.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="700.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ТАК (Gimbal Lock)</text>
<line x1="345.0" y1="320.0" x2="210.0" y2="320.0" stroke="#27ae60" stroke-width="2.2"/>
<line x1="220.0" y1="320.0" x2="200.0" y2="320.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="280.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">НІ (Регулярно)</text>
<rect x="22.4" y="383.4" width="355.2" height="63.2" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="200.0" y="403.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Тангаж:  θ = asin(s_safe)</tspan><tspan x="200.0" dy="15.6">Крен:    φ = atan2(2(w·x + y·z), 1 − 2(x² + y²))</tspan><tspan x="200.0" dy="15.6">Рискання: ψ = atan2(2(w·z + x·y), 1 − 2(y² + z²))</tspan></text>
<rect x="602.6" y="383.4" width="354.8" height="63.2" rx="6" fill="#fff8f8" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="403.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">Тангаж:  θ = copysign(π / 2, s_safe)</tspan><tspan x="780.0" dy="15.6">Крен:    φ = 0.0  (фіксація свободи)</tspan><tspan x="780.0" dy="15.6">Рискання: ψ = −2 · sign(s_safe) · atan2(x, w)</tspan></text>
<line x1="200.0" y1="465.0" x2="200.0" y2="485.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="780.0" y1="465.0" x2="780.0" y2="485.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="200.0" y1="485.0" x2="780.0" y2="485.0" stroke="#333333" stroke-width="1.8"/>
<line x1="490.0" y1="485.0" x2="490.0" y2="505.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="234.5" y="489.0" width="511.0" height="32.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="509.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Результат: однозначні й неперервні кути (φ, θ, ψ) без падінь і NaN</tspan></text>
</svg>