<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="196.4" y="17.5" width="587.3" height="35.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="40.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Матриця повороту R_ZYX(ψ, θ, φ) та її виродження при θ = +90°</tspan></text>
<rect x="80.0" y="73.8" width="330.0" height="32.5" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.5"/><text x="245.0" y="94.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Загальний стан: R_z(ψ) · R_y(θ) · R_x(φ)</tspan></text>
<rect x="25.0" y="120.0" width="440.0" height="150.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="245.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">|  cψ·cθ    cψ·sθ·sφ − sψ·cφ    cψ·sθ·cφ + sψ·sφ  |</tspan><tspan x="245.0" dy="25.0">|  sψ·cθ    sψ·sθ·sφ + cψ·cφ    sψ·sθ·cφ − cψ·sφ  |</tspan><tspan x="245.0" dy="25.0">|   −sθ          cθ·sφ               cθ·cφ        |</tspan></text>
<rect x="81.0" y="301.8" width="328.1" height="46.5" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="245.0" y="321.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">9 елементів залежать від трьох кутів (ψ, θ, φ).</tspan><tspan x="245.0" dy="15.0">Всі три параметри визначаються однозначно.</tspan></text>
<line x1="475.0" y1="195.0" x2="505.0" y2="195.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="495.0" y1="195.0" x2="515.0" y2="195.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="495.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">θ = +π/2</text>
<text x="495.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">cos θ = 0</text>
<text x="495.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">sin θ = 1</text>
<rect x="573.9" y="73.8" width="322.2" height="32.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="735.0" y="94.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">Вироджений стан: θ = +90° (Gimbal Lock)</tspan></text>
<rect x="535.0" y="120.0" width="400.0" height="150.0" rx="6" fill="#fff8f8" stroke="#c0392b" stroke-width="1.5"/>
<text x="735.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">|   0    cos(ψ − φ)    sin(ψ − φ)  |</tspan><tspan x="735.0" dy="27.0">|   0    sin(ψ − φ)   −cos(ψ − φ)  |</tspan><tspan x="735.0" dy="27.0">|  −1        0             0       |</tspan></text>
<rect x="575.3" y="301.8" width="319.5" height="46.5" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="735.0" y="321.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">Матриця залежить ЛИШЕ від різниці (ψ − φ)!</tspan><tspan x="735.0" dy="15.0">Окремі значення ψ і φ визначити неможливо.</tspan></text>
<rect x="194.9" y="381.8" width="590.3" height="46.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="401.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Наслідок: нескінченна кількість пар (ψ, φ) дають абсолютно однакову просторову матрицю.</tspan><tspan x="490.0" dy="15.0">Спроба відновити окремі кути призводить до невизначеності й ділення на нуль.</tspan></text>
</svg>