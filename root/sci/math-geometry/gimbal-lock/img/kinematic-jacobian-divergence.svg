<rect x="372.4" y="59.8" width="215.3" height="30.5" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="78.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Асимптота θ = 90°: 1/cos θ → ∞</tspan></text>
<rect x="606.3" y="84.3" width="367.4" height="91.3" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="790.0" y="104.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Кінематичні рівняння Ейлера:</tspan><tspan x="790.0" dy="15.0"></tspan><tspan x="790.0" dy="15.0">[ dφ/dt ]     [ 1   sin φ·tg θ   cos φ·tg θ ] [ ω_x ]</tspan><tspan x="790.0" dy="15.0">[ dθ/dt ]  =  [ 0     cos φ       −sin φ    ] [ ω_y ]</tspan><tspan x="790.0" dy="15.0">[ dψ/dt ]     [ 0  sin φ/cos θ  cos φ/cos θ ] [ ω_z ]</tspan></text>
<rect x="632.7" y="233.8" width="314.7" height="102.5" rx="6" fill="#fff8f8" stroke="#c0392b" stroke-width="1.5"/><text x="790.0" y="253.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Фізичний парадокс:</tspan><tspan x="790.0" dy="14.3">• Апарат обертається з помірною швидкістю ω_z.</tspan><tspan x="790.0" dy="14.3">• Проте при θ → 90° знаменник cos θ → 0.</tspan><tspan x="790.0" dy="14.3">• Швидкість обертання рамок dψ/dt прямує до ∞!</tspan><tspan x="790.0" dy="14.3">• Контролер намагається крутити сервоприводи</tspan><tspan x="790.0" dy="14.3">  з нескінченною швидкістю → зрив стабілізації.</tspan></text>
<rect x="595.9" y="387.4" width="388.3" height="45.3" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="790.0" y="406.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">У цифрових системах це викликає NaN / Inf,</tspan><tspan x="790.0" dy="14.3">переповнення буферів інтегрування та втрату керування.</tspan></text>
</svg>