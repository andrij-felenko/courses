<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="139.9" y="12.5" width="680.3" height="35.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="35.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Топологічна природа сингулярності: 3D координати проти 4D гіперсфери S³</tspan></text>
<rect x="93.0" y="58.5" width="294.0" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="240.0" y="79.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Кути Ейлера (3 параметри: ψ, θ, φ)</tspan></text>
<rect x="80.0" y="110.0" width="320.0" height="180.0" rx="6" fill="#fff8f8" stroke="#c0392b" stroke-width="2.0"/>
<line x1="80.0" y1="110.0" x2="400.0" y2="110.0" stroke="#c0392b" stroke-width="3.5"/>
<text x="240.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Сингулярна межа: тангаж θ = +90° (Gimbal Lock)</text>
<line x1="80.0" y1="290.0" x2="400.0" y2="290.0" stroke="#c0392b" stroke-width="3.5"/>
<text x="240.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Сингулярна межа: тангаж θ = −90° (Gimbal Lock)</text>
<line x1="160.0" y1="110.0" x2="160.0" y2="290.0" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="240.0" y1="110.0" x2="240.0" y2="290.0" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="320.0" y1="110.0" x2="320.0" y2="290.0" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="80.0" y1="200.0" x2="400.0" y2="200.0" stroke="#27ae60" stroke-width="1.8"/>
<text x="325.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Екватор: θ = 0°</text>
<rect x="62.8" y="329.3" width="354.3" height="61.4" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="240.0" y="349.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">Теорема топології: простір обертань SO(3) ≅ RP³</tspan><tspan x="240.0" dy="15.0">неможливо покрити трьома глобальними координатами</tspan><tspan x="240.0" dy="15.0">без сингулярних точок або розривів (як і сферу S²).</tspan></text>
<line x1="480.0" y1="60.0" x2="480.0" y2="410.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="544.8" y="58.5" width="350.5" height="33.0" rx="6" fill="#eef6ff" stroke="#2457d6" stroke-width="1.5"/><text x="720.0" y="79.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Одиничні кватерніони (Гіперсфера S³ ⊂ ℝ⁴)</tspan></text>
<circle cx="720.0" cy="200.0" r="85.0" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.5"/>
<ellipse cx="720.0" cy="200.0" rx="85.0" ry="30.0" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="675.0" cy="175.0" r="6.0" fill="#2457d6"/>
<text x="665.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">+q</text>
<circle cx="765.0" cy="225.0" r="6.0" fill="#2457d6"/>
<text x="778.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">−q</text>
<line x1="680.0" y1="180.0" x2="760.0" y2="220.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="651.4" y="171.1" width="137.2" height="57.8" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="720.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Подвійне накриття:</tspan><tspan x="720.0" dy="13.7">+q та −q задають</tspan><tspan x="720.0" dy="13.7">той самий поворот</tspan></text>
<rect x="503.2" y="329.3" width="433.5" height="61.4" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="349.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Гіперсфера S³ є компактним гладким многовидом без меж.</tspan><tspan x="720.0" dy="15.0">Кінематика dq/dt = ½ q ⊗ ω є лінійною і строго регулярною:</tspan><tspan x="720.0" dy="15.0">ЖОДНИХ полюсів, кутів складання чи ділення на нуль!</tspan></text>
</svg>