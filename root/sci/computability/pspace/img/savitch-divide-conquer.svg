<text x="430.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Теорема Савича: Перевірка досяжності Reach(C₁, C₂, k)</text>
<rect x="27.0" y="115.0" width="146.0" height="49.9" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.0"/><text x="100.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="100.0" dy="0.0">Стартова</tspan><tspan x="100.0" dy="16.9">конфігурація C_in</tspan></text>
<rect x="353.3" y="115.0" width="153.4" height="49.9" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="2.0"/><text x="430.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Проміжна</tspan><tspan x="430.0" dy="16.9">конфігурація C_mid</tspan></text>
<rect x="683.3" y="115.0" width="153.4" height="49.9" rx="6" fill="#eef2ff" stroke="#3b82f6" stroke-width="2.0"/><text x="760.0" y="136.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Приймаюча</tspan><tspan x="760.0" dy="16.9">конфігурація C_acc</tspan></text>
<line x1="180.0" y1="140.0" x2="345.0" y2="140.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="262.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">Крок 1: Reach(C_in, C_mid, k-1)</text>
<text x="262.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Довжина шляху ≤ 2ᵏ⁻¹</text>
<line x1="515.0" y1="140.0" x2="680.0" y2="140.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="597.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle" font-weight="700">Крок 2: Reach(C_mid, C_acc, k-1)</text>
<text x="597.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Довжина шляху ≤ 2ᵏ⁻¹</text>
<rect x="60.0" y="220.0" width="740.0" height="160.0" rx="8" fill="#f8fafc" stroke="#7e22ce" stroke-width="1.8"/>
<text x="430.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7e22ce" text-anchor="middle" font-weight="700">Стек рекурсії для перебору всіх кандидатів C_mid:</text>
<text x="430.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">1. Глибина рекурсії: m = O(S(n)) рівнів (оскільки 2ᵐ ≥ кількість конфігурацій)</text>
<text x="430.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">2. Розмір одного фрейму: O(S(n)) бітів (збереження конфігурації C_mid та лічильника)</text>
<text x="430.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">3. Загальна пам'ять: S_детерм(n) = Depth × FrameSize = O(S(n)) × O(S(n)) = O(S(n)²)</text>
</svg>