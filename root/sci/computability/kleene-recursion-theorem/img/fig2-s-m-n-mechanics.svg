<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="40.0" width="240.0" height="180.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="140.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Програма φ[e]</text>
<text x="140.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Приймає 2 параметри: (x, y)</text>
<rect x="80.1" y="122.0" width="119.7" height="45.9" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="141.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Обчислення:</tspan><tspan x="140.0" dy="16.9">z = φ[e](x, y)</tspan></text>
<line x1="5.0" y1="130.0" x2="20.0" y2="130.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="12.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">x</text>
<line x1="5.0" y1="160.0" x2="20.0" y2="160.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="12.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">y</text>
<rect x="300.0" y="40.0" width="250.0" height="180.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="425.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">s-m-n конструктор s(e, x)</text>
<rect x="340.3" y="87.4" width="169.3" height="55.2" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="425.0" y="103.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="425.0" dy="0.0">Алгоритмічне «вшивання»</tspan><tspan x="425.0" dy="15.6">константи x у тіло</tspan><tspan x="425.0" dy="15.6">програми з номером e</tspan></text>
<rect x="322.3" y="168.0" width="205.4" height="24.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/><text x="425.0" y="184.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="425.0" dy="0.0">Новий індекс: e' = s(e, x)</tspan></text>
<line x1="260.0" y1="130.0" x2="300.0" y2="130.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="280.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">e, x</text>
<rect x="590.0" y="40.0" width="250.0" height="180.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="715.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Програма φ[e'] = φ[s(e, x)]</text>
<text x="715.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Приймає 1 параметр: y</text>
<rect x="644.0" y="122.0" width="142.0" height="45.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="715.0" y="141.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Обчислення:</tspan><tspan x="715.0" dy="16.9">z = φ[s(e, x)](y)</tspan></text>
<line x1="550.0" y1="130.0" x2="590.0" y2="130.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="570.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">e'</text>
<rect x="256.8" y="263.1" width="346.4" height="53.9" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="286.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Фундаментальна тотожність s-m-n теореми:</tspan><tspan x="430.0" dy="16.9">∀x ∀y ( φ[s(e, x)](y) ≡ φ[e](x, y) )</tspan></text>
</svg>