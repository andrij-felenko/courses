<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="30.0" width="390.0" height="140.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="215.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Припущення: семантична властивість P розв'язна</text>
<rect x="124.9" y="80.4" width="180.2" height="59.2" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Існує класифікатор D(e):</tspan><tspan x="215.0" dy="15.6">D(e) = 1, якщо φ[e] ∈ P</tspan><tspan x="215.0" dy="15.6">D(e) = 0, якщо φ[e] ∉ P</tspan></text>
<rect x="450.0" y="30.0" width="410.0" height="140.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="655.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Конструкція інвертора коду f(e)</text>
<rect x="489.7" y="80.4" width="330.6" height="59.2" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="655.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Нехай a ∈ P, b ∉ P (властивість нетривіальна).</tspan><tspan x="655.0" dy="15.6">f(e) = b, якщо D(e) = 1 (тобто φ[e] ∈ P)</tspan><tspan x="655.0" dy="15.6">f(e) = a, якщо D(e) = 0 (тобто φ[e] ∉ P)</tspan></text>
<line x1="410.0" y1="100.0" x2="450.0" y2="100.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="100.0" y="195.0" width="680.0" height="65.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="440.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">Застосування теореми рекурсії Кліні</text>
<text x="440.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Існує нерухома точка e*: програма e* та f(e*) обчислюють однакову функцію: φ[e*] ≡ φ[f(e*)]</text>
<line x1="655.0" y1="170.0" x2="540.0" y2="195.0" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="179.7" y="282.2" width="520.7" height="55.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="440.0" y="299.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Неминуче логічне протиріччя:</tspan><tspan x="440.0" dy="14.3">φ[e*] ∈ P ⇔ D(e*) = 1 ⇒ f(e*) = b ⇒ φ[f(e*)] ∉ P (але ж φ[e*] ≡ φ[f(e*)])!</tspan><tspan x="440.0" dy="14.3">Отже, алгоритмічного класифікатора D(e) не існує.</tspan></text>
</svg>