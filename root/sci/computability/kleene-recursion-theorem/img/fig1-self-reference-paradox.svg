<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="220.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Наївна спроба (нескінченний регрес)</text>
<text x="670.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Двокомпонентна схема (Кліні / Квайн)</text>
<rect x="20.0" y="50.0" width="400.0" height="340.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<rect x="58.1" y="68.2" width="323.8" height="43.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="86.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Програма P намагається містити власний текст:</tspan><tspan x="220.0" dy="15.6">P = &quot;print(\&quot;&quot; + P + &quot;\&quot;)&quot;</tspan></text>
<rect x="85.5" y="138.2" width="269.1" height="43.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="156.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Рядок всередині вимагає копії рядка:</tspan><tspan x="220.0" dy="15.6">P = &quot;print(\&quot;print(\&quot;&quot; + P + &quot;\&quot;)\&quot;)&quot;</tspan></text>
<rect x="71.8" y="208.2" width="296.4" height="43.6" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Нескінченне вкладення (довжина коду → ∞):</tspan><tspan x="220.0" dy="15.6">P = &quot;print(\&quot;print(\&quot;print(...\&quot;)\&quot;)\&quot;)&quot;</tspan></text>
<rect x="48.3" y="298.2" width="343.4" height="43.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Тупик: неможливо зберегти нескінченний текст</tspan><tspan x="220.0" dy="15.6">у скінченній пам'яті комп'ютера</tspan></text>
<rect x="450.0" y="50.0" width="430.0" height="340.0" rx="8" fill="#f4faf6" stroke="#27ae60" stroke-width="1.5"/>
<rect x="478.2" y="76.3" width="143.7" height="37.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="550.0" y="91.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Частина A: Дані (D)</tspan><tspan x="550.0" dy="14.3">(Закодований текст B)</tspan></text>
<rect x="666.8" y="76.3" width="206.4" height="37.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="770.0" y="91.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Частина B: Алгоритм-конструктор</tspan><tspan x="770.0" dy="14.3">(Форматує та дублює)</tspan></text>
<line x1="550.0" y1="130.0" x2="610.0" y2="175.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="770.0" y1="130.0" x2="710.0" y2="175.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="535.3" y="185.6" width="259.4" height="78.8" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="665.0" y="205.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">Виконання алгоритму B над даними D:</tspan><tspan x="665.0" dy="15.6">1. Друкує B як виконуваний код</tspan><tspan x="665.0" dy="15.6">2. Друкує D як закодовані дані</tspan><tspan x="665.0" dy="15.6">3. Відтворює повний вихідний код P</tspan></text>
<rect x="503.6" y="299.4" width="322.9" height="41.3" rx="6" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/><text x="665.0" y="316.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="665.0" dy="0.0">Результат: скінченний код відновлює сам себе</tspan><tspan x="665.0" dy="14.3">без регресу через подвійне використання даних</tspan></text>
</svg>