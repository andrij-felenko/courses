<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="35.0" width="240.0" height="135.0" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="140.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">1. Довільне перетворення f</text>
<rect x="43.1" y="89.2" width="193.8" height="51.6" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="140.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Обчислювана функція f : ℕ → ℕ</tspan><tspan x="140.0" dy="14.3">Перетворює код однієї</tspan><tspan x="140.0" dy="14.3">програми на код іншої</tspan></text>
<rect x="300.0" y="35.0" width="260.0" height="135.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="430.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2. Побудова u(v, x)</text>
<rect x="320.5" y="89.2" width="218.9" height="51.6" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="430.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">u(v, x) = φ[f(s(v, v))](x)</tspan><tspan x="430.0" dy="14.3">Обчислює s-m-n діагональ s(v, v),</tspan><tspan x="430.0" dy="14.3">застосовує f та виконує код</tspan></text>
<line x1="260.0" y1="102.0" x2="300.0" y2="102.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="600.0" y="35.0" width="240.0" height="135.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="720.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700">3. Фіксація індексу v₀</text>
<rect x="623.1" y="89.2" width="193.8" height="51.6" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/><text x="720.0" y="104.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Оскільки u(v, x) обчислювана,</tspan><tspan x="720.0" dy="14.3">вона має фіксований номер v₀:</tspan><tspan x="720.0" dy="14.3">φ[v₀](v, x) ≡ u(v, x)</tspan></text>
<line x1="560.0" y1="102.0" x2="600.0" y2="102.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="160.0" y="200.0" width="540.0" height="80.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="430.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">4. Діагональний крок: покладаємо e* = s(v₀, v₀)</text>
<text x="430.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Індекс e* спеціалізує функцію v₀ її власним номером v₀</text>
<line x1="720.0" y1="170.0" x2="560.0" y2="200.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="96.4" y="316.2" width="667.3" height="47.6" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="336.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Ланцюг тотожностей доведення:</tspan><tspan x="430.0" dy="15.6">φ[e*](x) ≡ φ[s(v₀, v₀)](x) ≡ φ[v₀](v₀, x) ≡ u(v₀, x) ≡ φ[f(s(v₀, v₀))](x) ≡ φ[f(e*)](x)</tspan></text>
</svg>