<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">П'ятиетапний конвеєр приведення КС-граматики до форми Чомскі (CNF)</text>
<text x="480.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Цільова форма правил:  A → BC  або  A → a  (плюс S₀ → ε, якщо ε ∈ L(G))</text>
<rect x="40.0" y="117.8" width="140.0" height="94.4" rx="6" fill="#edf2fd" stroke="#2457d6" stroke-width="1.6"/><text x="110.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">1. START</tspan><tspan x="110.0" dy="15.6"></tspan><tspan x="110.0" dy="15.6">Новий старт</tspan><tspan x="110.0" dy="15.6">S₀ → S</tspan><tspan x="110.0" dy="15.6">(S₀ не в RHS)</tspan></text>
<line x1="182.0" y1="165.0" x2="206.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="210.0" y="110.0" width="140.0" height="110.0" rx="6" fill="#edf2fd" stroke="#2457d6" stroke-width="1.6"/><text x="280.0" y="130.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">2. NULL</tspan><tspan x="280.0" dy="15.6"></tspan><tspan x="280.0" dy="15.6">Вилучення</tspan><tspan x="280.0" dy="15.6">ε-правил</tspan><tspan x="280.0" dy="15.6">A → ε</tspan><tspan x="280.0" dy="15.6">(nullable)</tspan></text>
<line x1="352.0" y1="165.0" x2="376.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="380.0" y="110.0" width="140.0" height="110.0" rx="6" fill="#edf2fd" stroke="#2457d6" stroke-width="1.6"/><text x="450.0" y="130.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">3. UNIT</tspan><tspan x="450.0" dy="15.6"></tspan><tspan x="450.0" dy="15.6">Вилучення</tspan><tspan x="450.0" dy="15.6">ланцюгових</tspan><tspan x="450.0" dy="15.6">A → B</tspan><tspan x="450.0" dy="15.6">(unit pairs)</tspan></text>
<line x1="522.0" y1="165.0" x2="546.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="550.0" y="110.0" width="140.0" height="110.0" rx="6" fill="#edf2fd" stroke="#2457d6" stroke-width="1.6"/><text x="620.0" y="130.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">4. TERM</tspan><tspan x="620.0" dy="15.6"></tspan><tspan x="620.0" dy="15.6">Ізоляція</tspan><tspan x="620.0" dy="15.6">терміналів</tspan><tspan x="620.0" dy="15.6">T_a → a</tspan><tspan x="620.0" dy="15.6">(в довгих RHS)</tspan></text>
<line x1="692.0" y1="165.0" x2="716.0" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="720.0" y="110.0" width="140.0" height="110.0" rx="6" fill="#edf2fd" stroke="#2457d6" stroke-width="1.6"/><text x="790.0" y="130.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">5. BIN</tspan><tspan x="790.0" dy="15.6"></tspan><tspan x="790.0" dy="15.6">Бінаризація</tspan><tspan x="790.0" dy="15.6">правил &gt; 2</tspan><tspan x="790.0" dy="15.6">A → B₁C₁</tspan><tspan x="790.0" dy="15.6">(каскади)</tspan></text>
<rect x="60.0" y="270.0" width="840.0" height="65.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="480.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Гарантії нормальної форми Чомскі:</text>
<text x="480.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• Дерево виводу строго двійкове  • Довжина виведення слова |w| = n рівно 2n − 1 кроків  • Алгоритм CYK розпізнає за O(n³)</text>
</svg>