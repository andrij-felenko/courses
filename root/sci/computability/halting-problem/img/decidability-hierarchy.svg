<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розв'язне — це перетин:  Δ₁ = Σ₁ ∩ Π₁</text>
<ellipse cx="350.0" cy="252.0" rx="250.0" ry="156.0" fill="#2457d6" fill-opacity="0.10" stroke="#2457d6" stroke-width="2.4"/>
<ellipse cx="560.0" cy="252.0" rx="250.0" ry="156.0" fill="#e08a1e" fill-opacity="0.10" stroke="#e08a1e" stroke-width="2.4"/>
<text x="210.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Σ₁ — напіврозв'язні</text>
<text x="700.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b9700f" text-anchor="middle" font-weight="700">Π₁ — ко-напіврозв'язні</text>
<rect x="135.5" y="244.2" width="139.0" height="47.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="205.0" y="264.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">HALT</tspan><tspan x="205.0" dy="15.6">⟨M,w⟩ спиняється</tspan></text>
<rect x="631.8" y="244.2" width="146.5" height="47.6" rx="6" fill="#fff6e6" stroke="#e08a1e" stroke-width="1.5"/><text x="705.0" y="264.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b9700f" text-anchor="middle" font-weight="700"><tspan x="705.0" dy="0.0">co-HALT</tspan><tspan x="705.0" dy="15.6">нескінченний цикл</tspan></text>
<rect x="366.9" y="228.2" width="176.2" height="47.6" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="455.0" y="248.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="455.0" dy="0.0">Δ₁ — розв'язні</tspan><tspan x="455.0" dy="15.6">сортування · простота</tspan></text>
<text x="450.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Мова розв'язна ⟺ і вона, і її доповнення напіврозв'язні. HALT має лише «спиниться» — тож у Σ₁, але поза Δ₁.</text>
