<text x="450.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Цей конвеєр розв'язав би A. Якщо A нерозв'язна — розв'язувача B, а отже й конвеєра, немає.</text>
