<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 476" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="476" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому Тюрінгова задача — не зовсім «проблема зупинки»</text>
<line x1="70.0" y1="406.0" x2="70.0" y2="96.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="70.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">складніша</text>
<rect x="276.0" y="105.0" width="440.0" height="53.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="496.0" y="128.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="496.0" dy="0.0">«Circle-free» — задача, яку насправді довів Тюрінг</tspan><tspan x="496.0" dy="16.9">Π₂-повна · зводиться до 0″ (подвійний стрибок)</tspan></text>
<rect x="276.0" y="239.1" width="440.0" height="53.9" rx="6" fill="#fff6e6" stroke="#b9700f" stroke-width="1.5"/><text x="496.0" y="262.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="496.0" dy="0.0">«Проблема зупинки» — формулювання Девіса</tspan><tspan x="496.0" dy="16.9">Σ₁-повна · зводиться до 0′ (перший стрибок)</tspan></text>
<rect x="276.0" y="357.1" width="440.0" height="53.9" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="496.0" y="380.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="496.0" dy="0.0">Розв'язне</tspan><tspan x="496.0" dy="16.9">суддя-алгоритм існує · рівень 0</tspan></text>
<line x1="496.0" y1="352.0" x2="496.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="526.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">строго вище</text>
<line x1="496.0" y1="232.0" x2="496.0" y2="166.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="526.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">строго складніша (не halting!)</text>
<text x="440.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Те, що довів Тюрінг (circle-free), сидить строго вище за «проблему зупинки» — інша, важча задача.</text>
</svg>