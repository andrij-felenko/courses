<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три бар'єри доведення P проти NP</text>
<text x="530.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три теоретичні бар'єри на шляху до доведення P ≠ NP</text>
<rect x="50.0" y="70.0" width="300.0" height="270.0" rx="10" fill="#eaf0fd" stroke="#2b6cb0" stroke-width="2.0"/>
<text x="200.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2b6cb0" text-anchor="middle" font-weight="700">1. Релятивізація</text>
<text x="200.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Baker, Gill, Solovay (1975)</text>
<line x1="65.0" y1="133.0" x2="335.0" y2="133.0" stroke="#2b6cb0" stroke-width="1.0"/>
<rect x="104.8" y="171.2" width="190.4" height="117.5" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/><text x="200.0" y="192.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Існують оракули A та B:</tspan><tspan x="200.0" dy="16.9">P^A = NP^A,  P^B ≠ NP^B</tspan><tspan x="200.0" dy="16.9"></tspan><tspan x="200.0" dy="16.9">Відсікає:</tspan><tspan x="200.0" dy="16.9">Діагоналізацію та</tspan><tspan x="200.0" dy="16.9">симуляцію машин Тюринга</tspan></text>
<rect x="380.0" y="70.0" width="300.0" height="270.0" rx="10" fill="#fff6e5" stroke="#e08a1e" stroke-width="2.0"/>
<text x="530.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#e08a1e" text-anchor="middle" font-weight="700">2. Натуральні доведення</text>
<text x="530.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Razborov, Rudich (1997)</text>
<line x1="395.0" y1="133.0" x2="665.0" y2="133.0" stroke="#e08a1e" stroke-width="1.0"/>
<rect x="397.7" y="171.2" width="264.5" height="117.5" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/><text x="530.0" y="192.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Конструктивність + Великість</tspan><tspan x="530.0" dy="16.9">властивостей схем ламає PRG</tspan><tspan x="530.0" dy="16.9"></tspan><tspan x="530.0" dy="16.9">Відсікає:</tspan><tspan x="530.0" dy="16.9">Нижні оцінки складності</tspan><tspan x="530.0" dy="16.9">булевих схем (Circuit Complexity)</tspan></text>
<rect x="710.0" y="70.0" width="300.0" height="270.0" rx="10" fill="#f3e8ff" stroke="#6b46c1" stroke-width="2.0"/>
<text x="860.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b46c1" text-anchor="middle" font-weight="700">3. Алгебраїзація</text>
<text x="860.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Aaronson, Wigderson (2008)</text>
<line x1="725.0" y1="133.0" x2="995.0" y2="133.0" stroke="#6b46c1" stroke-width="1.0"/>
<rect x="727.7" y="171.2" width="264.5" height="117.5" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/><text x="860.0" y="192.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">Алгебраїчні оракули не</tspan><tspan x="860.0" dy="16.9">розділяють P і NP</tspan><tspan x="860.0" dy="16.9"></tspan><tspan x="860.0" dy="16.9">Відсікає:</tspan><tspan x="860.0" dy="16.9">Методи арифметизації та</tspan><tspan x="860.0" dy="16.9">інтерактивних доказів (IP=PSPACE)</tspan></text>
<rect x="191.6" y="363.1" width="676.9" height="53.9" rx="6" fill="#e9f7ef" stroke="#276749" stroke-width="2.0"/><text x="530.0" y="386.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Вузька стежка вперед: Не-релятивізовані, не-натуральні, не-алгебраїзовані техніки</tspan><tspan x="530.0" dy="16.9">(наприклад, Геометрична теорія складності GCT / Алгебраїчна геометрія)</tspan></text>
</svg>