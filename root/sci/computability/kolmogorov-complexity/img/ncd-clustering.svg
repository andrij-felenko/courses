<line x1="490.0" y1="150.0" x2="560.0" y2="150.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="525.0" y1="150.0" x2="525.0" y2="100.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="525.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">NCD = 0.12</text>
<line x1="720.0" y1="100.0" x2="720.0" y2="190.0" stroke="#6b7280" stroke-width="1.5"/>
<text x="720.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Код C (C++)</text>
