<text x="215.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Спільний
контекст</text>
<rect x="82.2" y="217.3" width="265.5" height="45.3" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="215.0" y="236.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">NCD(x,y) = [C(xy) - min(C(x), C(y))]</tspan><tspan x="215.0" dy="14.3">/ max(C(x), C(y))</tspan></text>
