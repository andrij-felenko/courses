<text x="483.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Текст A (UA)</text>
<line x1="560.0" y1="100.0" x2="560.0" y2="190.0" stroke="#6b7280" stroke-width="1.5"/>
