<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння стиснюваного регулярного рядка та несжимаємого випадкового рядка</text>
<rect x="40.0" y="35.0" width="740.0" height="125.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="190.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Регулярний рядок A (N = 100 біт):</text>
<rect x="60.0" y="75.0" width="280.0" height="30.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="200.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">01010101010101...0101</text>
<line x1="345.0" y1="95.0" x2="450.0" y2="95.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="200.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">K(A) ≪ N  (висока стиснюваність, низька складність)</text>
<rect x="40.0" y="175.0" width="740.0" height="135.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="190.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Випадковий рядок B (N = 100 біт):</text>
<rect x="60.0" y="215.0" width="280.0" height="30.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="200.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">11010010110001...0110</text>
<line x1="345.0" y1="235.0" x2="430.0" y2="235.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="200.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">K(B) ≈ N  (нестиснюваний рядок, алгоритмічна випадковість)</text>
</svg>