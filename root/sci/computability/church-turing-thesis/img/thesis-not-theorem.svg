<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому це теза, а не теорема</text>
<rect x="66.0" y="116.0" width="336.0" height="196.0" rx="26" fill="#fbfcfe" stroke="#6b7280" stroke-width="2" stroke-dasharray="8,7"/>
<text x="234.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">ІНТУЇТИВНЕ поняття</text>
<text x="234.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">«ефективно обчислюване»</text>
<text x="234.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">алгоритм · механічна процедура</text>
<text x="234.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">рецепт зі скінченних кроків</text>
<text x="234.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">означення НЕМАЄ —</text>
<text x="234.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">це те, що ми й хочемо означити</text>
<rect x="598.0" y="116.0" width="336.0" height="196.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="2.2"/>
<text x="766.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">СТРОГИЙ об'єкт</text>
<text x="766.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">обчислюване машиною Тюринга</text>
<text x="766.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">задана сімкою ⟨Q, Σ, Γ, δ, …⟩</text>
<text x="766.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">можна доводити теореми</text>
<text x="766.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">межа точна —</text>
<text x="766.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">видно, що всередині, а що ні</text>
<line x1="410.0" y1="214.0" x2="590.0" y2="214.0" stroke="#1a1a1a" stroke-width="2.4" stroke-dasharray="7,6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="424.1" y="155.6" width="151.8" height="48.8" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="500.0" y="176.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">ТЕЗА:</tspan><tspan x="500.0" dy="16.2">це одне й те саме</tspan></text>
<text x="500.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рівність строгого з інтуїтивним НЕ доводять — ліворуч нема з чого будувати доведення.</text>
<text x="500.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">Спростувати легко — досить одного «рецепта», що виходить за машину Тюринга.</text>
<text x="500.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">За майже сто років такого не знайшли: теза недоказовна — але нездоланна.</text>
</svg>