<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири дороги до одного означення обчислення</text>
<rect x="283.0" y="51.2" width="474.0" height="33.5" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="520.0" y="72.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Гільбертове питання: що таке «механічна процедура» взагалі?</tspan></text>
<line x1="520.0" y1="84.8" x2="520.0" y2="120.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="140.0" y1="120.0" x2="900.0" y2="120.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="140.0" y1="120.0" x2="140.0" y2="150.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30.0" y="152.0" width="220.0" height="150.0" rx="9" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="140.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">λ-числення</text>
<text x="140.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Алонзо Черч</text>
<text x="140.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">самі функції та</text>
<text x="140.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">правило підставити</text>
<text x="140.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">одне в одне</text>
<line x1="140.0" y1="304.0" x2="140.0" y2="344.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="393.0" y1="120.0" x2="393.0" y2="150.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="283.0" y="152.0" width="220.0" height="150.0" rx="9" fill="#ffffff" stroke="#b9770e" stroke-width="1.8"/>
<text x="393.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b9770e" text-anchor="middle" font-weight="700">загальнорекурсивні</text>
<text x="393.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ербран · Гедель</text>
<text x="393.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">нуль і «+1», а з них —</text>
<text x="393.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">функції, означені</text>
<text x="393.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">через самих себе</text>
<line x1="393.0" y1="304.0" x2="393.0" y2="344.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="647.0" y1="120.0" x2="647.0" y2="150.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="537.0" y="152.0" width="220.0" height="150.0" rx="9" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="647.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">машина Тюринга</text>
<text x="647.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Алан Тюринг</text>
<text x="647.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">стрічка, голівка,</text>
<text x="647.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">скінченна таблиця</text>
<text x="647.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">правил</text>
<line x1="647.0" y1="304.0" x2="647.0" y2="344.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="900.0" y1="120.0" x2="900.0" y2="150.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="790.0" y="152.0" width="220.0" height="150.0" rx="9" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="900.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">робітник у коробках</text>
<text x="900.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Еміль Пост</text>
<text x="900.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">ставить і стирає</text>
<text x="900.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">позначки за</text>
<text x="900.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">списком інструкцій</text>
<line x1="900.0" y1="304.0" x2="900.0" y2="344.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="140.0" y1="344.0" x2="900.0" y2="344.0" stroke="#6b7280" stroke-width="1.6"/>
<line x1="520.0" y1="344.0" x2="520.0" y2="374.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="314.7" y="394.5" width="410.6" height="35.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="417.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">ОДИН І ТОЙ САМИЙ клас обчислюваних функцій</tspan></text>
<text x="520.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Чотири несхожі дороги — різні люди, різні мотиви, різні конструкції —</text>
<text x="520.0" y="494.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">збіглися в одній точці. Цей збіг і є доказовим хребтом тези.</text>
</svg>