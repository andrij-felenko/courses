<line x1="326.0" y1="470.0" x2="444.0" y2="290.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="450.0" y="220.0" width="240.0" height="140.0" rx="12" fill="#fbfcfd" stroke="#1a1a1a" stroke-width="2.4"/>
