<text x="570.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="570.0" dy="0.0">p ~ q  ⟺  жоден</tspan><tspan x="570.0" dy="16.8">дописаний хвіст w</tspan><tspan x="570.0" dy="16.8">не розрізняє</tspan><tspan x="570.0" dy="16.8">їхньої долі</tspan></text>
<rect x="780.0" y="150.0" width="300.0" height="120.0" rx="10" fill="#fdf1e0" stroke="#e08a1e" stroke-width="2.0"/><text x="930.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Януш Бжозовський · 1962</text><text x="930.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="930.0" dy="0.0">а якщо зовсім інакше?</tspan><tspan x="930.0" dy="16.2">подвійний реверс:</tspan><tspan x="930.0" dy="16.2">оберни · здетермінуй · двічі</tspan></text>
<rect x="780.0" y="370.0" width="300.0" height="120.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="930.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джон Гопкрофт · 1971</text><text x="930.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="930.0" dy="0.0">а якщо швидше?</tspan><tspan x="930.0" dy="16.2">O(n·log n) замість O(n²):</tspan><tspan x="930.0" dy="16.2">«обробляй меншу половину»</tspan></text>
