<rect x="30.0" y="60.0" width="290.0" height="100.0" rx="10" fill="#fdf1e0" stroke="#e08a1e" stroke-width="2.0"/><text x="175.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Девід Гаффман · 1954</text><text x="175.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="175.0" dy="0.0">інженер, асинхронні схеми:</tspan><tspan x="175.0" dy="16.2">злиття рядків таблиці потоків</tspan></text>
