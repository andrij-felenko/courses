<text x="500.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ціна — пробігти весь опис. Тому справжні машини тримають програму й дані за адресами, а не пліч-о-пліч.</text>
