<rect x="197.5" y="541.8" width="505.1" height="46.5" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="561.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Бо щоб СКЛАСТИ список, треба вміти відсіяти описи, які зациклюються, —</tspan><tspan x="450.0" dy="15.0">а це нерозв'язно. Діагональ не спростовує список — вона вказує на винного.</tspan></text>
