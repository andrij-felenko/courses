<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="430.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Конвеєр поповнення Кнута-Бендікса: Від рівнянь до канонічної системи</text>
<rect x="35.0" y="65.0" width="220.0" height="80.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="145.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Вхід: Рівняння E</text>
<text x="145.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Порядок редукції &gt;</text>
<text x="145.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">(LPO / KBO / MPO)</text>
<line x1="255.0" y1="105.0" x2="310.0" y2="105.0" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="310.0" y="65.0" width="260.0" height="80.0" rx="8" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/>
<text x="440.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">1. Нормалізація пари (s, t)</text>
<text x="440.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">s₀ = s↓_R ,  t₀ = t↓_R</text>
<text x="440.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Спрощення поточними правилами R</text>
<line x1="440.0" y1="145.0" x2="440.0" y2="185.0" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="330.0" y="185.0" width="220.0" height="60.0" rx="8" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/>
<text x="440.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0d9488" text-anchor="middle" font-weight="700">Чи s₀ ≡ t₀ ?</text>
<text x="440.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Так → Відкинути тотожність</text>
<line x1="440.0" y1="245.0" x2="440.0" y2="285.0" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="458.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Ні</text>
<rect x="300.0" y="285.0" width="280.0" height="85.0" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
<text x="440.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7e22ce" text-anchor="middle" font-weight="700">2. Орієнтація за порядком &gt;</text>
<text x="440.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">Якщо s₀ &gt; t₀  ⇒  R ← R ∪ {s₀ → t₀}</text>
<text x="440.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">Якщо неорієнтовне  ⇒  ПОМИЛКА / ПРОВАЛ</text>
<line x1="580.0" y1="327.0" x2="635.0" y2="327.0" stroke="#1e293b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="635.0" y="275.0" width="210.0" height="105.0" rx="8" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/>
<text x="740.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e08a1e" text-anchor="middle" font-weight="700">3. Критичні пари</text>
<text x="740.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">CP(R ∪ {нове}) → E</text>
<text x="740.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Взаємна редукція R</text>
<text x="740.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(inter-reduction)</text>
<line x1="740.0" y1="275.0" x2="740.0" y2="105.0" stroke="#e08a1e" stroke-width="1.8" stroke-dasharray="4,3"/>
<line x1="740.0" y1="105.0" x2="570.0" y2="105.0" stroke="#e08a1e" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="665.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e08a1e" text-anchor="middle" font-weight="700">Поповнення E</text>
<rect x="35.0" y="305.0" width="220.0" height="65.0" rx="8" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/>
<text x="145.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">Вихід: Канонічна R</text>
<text x="145.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Термінантна + Конфлюентна</text>
<line x1="310.0" y1="105.0" x2="145.0" y2="105.0" stroke="#16a34a" stroke-width="1.5"/>
<line x1="145.0" y1="105.0" x2="145.0" y2="305.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="75.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">E порожня</text>
</svg>