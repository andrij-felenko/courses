<defs><marker id="ar_c0392b" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><marker id="ar_2457d6" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker><marker id="ar_1a1a1a" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker><marker id="ar_27ae60" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker></defs>
<text x="440.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому 0ⁿ1ⁿ не під силу скінченному автомату</text>
<text x="440.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">станів скінченно (k), а нулів у 0ᵏ⁺¹ більше → якийсь стан мусить повторитися</text>
<line x1="86.0" y1="150.0" x2="116.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#ar_1a1a1a)"/><text x="82.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">старт</text>
<line x1="182.0" y1="150.0" x2="388.0" y2="150.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#ar_2457d6)"/>
<text x="285.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">x  (кілька 0)</text>
<line x1="452.0" y1="150.0" x2="668.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#ar_1a1a1a)"/>
<text x="560.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">z  (решта: 0…0 далі 1…1)</text>
<path d="M 409.0,120.0 C 396.0,66.0 444.0,66.0 431.0,120.0" fill="none" stroke="#2457d6" stroke-width="2.2" marker-end="url(#ar_2457d6)"/><text x="420.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">y  (цикл із самих 0)</text>
<circle cx="150.0" cy="150.0" r="30.0" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.3"/><text x="150.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">q₀</text>
<circle cx="420.0" cy="150.0" r="30.0" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.3"/><text x="420.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">S</text><text x="420.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">повтор</text>
<circle cx="700.0" cy="150.0" r="34.0" fill="#eafaf0" stroke="#27ae60" stroke-width="2.3"/><circle cx="700.0" cy="150.0" r="29.0" fill="none" stroke="#27ae60" stroke-width="2.0"/><text x="700.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">прийом</text>
<text x="440.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Цикл y можна пройти 0, 1, 2, … разів — машина щоразу приймає.</text>
<rect x="150.0" y="272.0" width="580.0" height="96.0" rx="6" fill="#fff8f7" stroke="#c0392b" stroke-width="1.5"/><text x="440.0" y="308.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Отже приймається не лише 0ⁿ1ⁿ, а й слова, де нулів більше чи менше за одиниці</tspan><tspan x="440.0" dy="15.6">(накачали або прибрали цикл). Але такі слова НЕ належать мові {0ⁿ1ⁿ}.</tspan><tspan x="440.0" dy="15.6">Суперечність → жоден скінченний автомат мови не розпізнає → вона не регулярна.</tspan></text>
</svg>