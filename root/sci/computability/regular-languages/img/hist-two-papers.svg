<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<defs><marker id="ar_1a1a1a" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker><marker id="ar_c0392b" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<text x="490.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві статті — дві різні драбини</text>
<text x="490.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">номерну ієрархію Тип 0–3 означено 1959 року, а не 1956-го</text>
<rect x="28.0" y="80.0" width="444.0" height="402.0" rx="12" fill="#fbfcfe" stroke="#2457d6" stroke-width="1.8"/>
<text x="250.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1956 · «Три моделі опису мови»</text>
<text x="250.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">IRE Trans. on Information Theory, IT-2(3), 113–124</text>
<rect x="48.0" y="146.0" width="404.0" height="72.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="178.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Модель 3 · Трансформаційна граматика</tspan><tspan x="250.0" dy="16.2">те, заради чого писалася стаття</tspan></text>
<rect x="48.0" y="232.0" width="404.0" height="72.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="264.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Модель 2 · Граматика структури складників</tspan><tspan x="250.0" dy="16.2">(phrase structure)</tspan></text>
<rect x="48.0" y="318.0" width="404.0" height="72.0" rx="6" fill="#fff3f2" stroke="#c0392b" stroke-width="1.5"/><text x="250.0" y="350.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Модель 1 · Скінченне джерело Маркова</tspan><tspan x="250.0" dy="16.2">мішень: показати, що ЦЕ не тягне англійську</tspan></text>
<text x="250.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">три моделі, а не чотири типи; номерів немає</text>
<text x="250.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">«ієрархії Чомського» тут ще немає</text>
<rect x="508.0" y="80.0" width="444.0" height="402.0" rx="12" fill="#fbfcfe" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="730.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1959 · «Про деякі формальні властивості граматик»</text>
<text x="730.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Information and Control, 2(2), 137–167</text>
<rect x="528.0" y="146.0" width="404.0" height="58.0" rx="6" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="1.5"/><text x="730.0" y="179.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Тип 0 · без обмежень   =   машина Тюринга</tspan></text>
<rect x="528.0" y="214.0" width="404.0" height="58.0" rx="6" fill="#eef2fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="730.0" y="247.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Тип 1 · Обмеження 1:   φ₁Aφ₂ → φ₁ωφ₂</tspan></text>
<rect x="528.0" y="282.0" width="404.0" height="58.0" rx="6" fill="#eaf1ff" stroke="#2457d6" stroke-width="1.5"/><text x="730.0" y="315.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Тип 2 · Обмеження 2:   A → ω</tspan></text>
<rect x="528.0" y="350.0" width="404.0" height="58.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="375.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Тип 3 · Обмеження 3:   A → aB   або   A → a</tspan><tspan x="730.0" dy="15.0">= скінченний автомат = «регулярні події» Кліні</tspan></text>
<text x="730.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">номер = скільки обмежень накладено</text>
<text x="730.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">тому більший номер = слабша граматика</text>
<rect x="28.0" y="500.0" width="924.0" height="80.0" rx="6" fill="#fffdf5" stroke="#b7791f" stroke-width="1.5"/><text x="490.0" y="536.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Трансформаційна граматика — головна модель 1956-го — у номерну ієрархію не потрапила зовсім.</tspan><tspan x="490.0" dy="16.2">Зате Тип 3, збудований як мішень, збігся з класом Кліні — і пережив усю суперечку про англійську.</tspan></text>
</svg>