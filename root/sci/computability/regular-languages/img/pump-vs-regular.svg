<defs><marker id="ar_1a1a1a" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker><marker id="ar_c0392b" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><marker id="ar_27ae60" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="ar_2457d6" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker></defs>
<text x="510.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Накачування — симптом, а не діагноз</text>
<text x="510.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">стрілка йде лише в один бік: регулярна ⇒ накачується</text>
<rect x="30.0" y="76.0" width="650.0" height="404.0" rx="14" fill="#f3f4f6" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="56.0" y="148.0" width="598.0" height="306.0" rx="12" fill="#fffdf5" stroke="#b7791f" stroke-width="1.8"/>
<rect x="82.0" y="226.0" width="546.0" height="200.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="46.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Усі мови над Σ*</text>
<text x="46.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">0ⁿ1ⁿ · збалансовані дужки · паліндроми · 0ⁿ при простому n</text>
<text x="46.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">накачування ПРОВАЛЮЄТЬСЯ → лема доводить нерегулярність</text>
<text x="72.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b7791f" text-anchor="start" font-weight="700">Мови, ЩО НАКАЧУЮТЬСЯ (проходять лему)</text>
<text x="72.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">F = { aⁱbʲcᵏ  :  якщо i = 1, то j = k }</text>
<text x="72.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b7791f" text-anchor="start">накачується з p = 2 — і все одно НЕ регулярна: тут лема сліпа</text>
<text x="355.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">РЕГУЛЯРНІ МОВИ</text>
<text x="355.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">пам'ять = скінченний стан</text>
<rect x="140.0" y="302.0" width="430.0" height="78.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.4"/>
<text x="355.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">парне число одиниць · a*b* · «містить 101»</text>
<text x="355.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">усе, що взагалі описує регулярний вираз</text>
<rect x="700.0" y="128.0" width="290.0" height="118.0" rx="10" fill="#fffdf5" stroke="#b7791f" stroke-width="1.6"/>
<text x="845.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b7791f" text-anchor="middle" font-weight="700">ЛЕМА РІЖЕ ТУТ</text>
<text x="845.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">провал накачування  ⇒  нерегулярна ✓</tspan><tspan x="845.0" dy="16.5">накачується  ⇒  не відомо НІЧОГО ✗</tspan><tspan x="845.0" dy="16.5">необхідна умова, не достатня</tspan></text>
<line x1="698.0" y1="187.0" x2="660.0" y2="187.0" stroke="#b7791f" stroke-width="2.0" marker-end="url(#ar_b7791f)"/>
<rect x="700.0" y="298.0" width="290.0" height="118.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="845.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">МАЙГІЛЛ — НЕРОУД РІЖЕ ТУТ</text>
<text x="845.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">індекс ≡ₗ скінченний  ⟺  регулярна</tspan><tspan x="845.0" dy="16.5">нескінченний  ⟺  нерегулярна</tspan><tspan x="845.0" dy="16.5">критерій, а не симптом</tspan></text>
<line x1="698.0" y1="357.0" x2="634.0" y2="357.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#ar_27ae60)"/>
<rect x="30.0" y="500.0" width="960.0" height="76.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="510.0" y="526.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Між двома межами лежить щілина: мови, що вміють накачуватися, не будучи регулярними.</tspan><tspan x="510.0" dy="16.2">Тому провал накачування — доказ, а успіх — не доказ нічого.</tspan><tspan x="510.0" dy="16.2">Точну межу проводить лише індекс відношення ≡ₗ.</tspan></text>
</svg>