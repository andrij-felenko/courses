<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="20.0" width="840.0" height="480.0" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.0"/>
<text x="450.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#475569" text-anchor="middle" font-weight="700">PSPACE — клас задач із поліномною пам'яттю</text>
<rect x="60.0" y="70.0" width="780.0" height="410.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2.0"/>
<text x="450.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#334155" text-anchor="middle" font-weight="700">PH — Поліноміальна ієрархія (Polynomial Hierarchy)</text>
<rect x="90.0" y="120.0" width="720.0" height="75.0" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.8"/>
<text x="450.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7e22ce" text-anchor="middle" font-weight="700">Рівень k:  Σₖᵖ  |  Πₖᵖ  |  Δₖᵖ = P^(Σₖ₋₁ᵖ)</text>
<text x="450.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Формули з k чергуваннями кванторів (∃ x₁ ∀ x₂ ... Qₖ xₖ R)</text>
<line x1="450.0" y1="200.0" x2="450.0" y2="222.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="90.0" y="225.0" width="720.0" height="80.0" rx="8" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.8"/>
<text x="450.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#e08a1e" text-anchor="middle" font-weight="700">Рівень 2:  Σ₂ᵖ = NP^(NP)   |   Π₂ᵖ = coNP^(NP)   |   Δ₂ᵖ = P^(NP)</text>
<text x="450.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Формули вигляду ∃x ∀y R(x,y)  (напр. мінімізація булевих схем)</text>
<line x1="450.0" y1="310.0" x2="450.0" y2="332.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="90.0" y="335.0" width="720.0" height="70.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<rect x="175.5" y="345.1" width="149.0" height="49.9" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="250.0" y="366.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">Σ₁ᵖ = NP</tspan><tspan x="250.0" dy="16.9">(існує свідок ∃)</tspan></text>
<rect x="559.4" y="345.1" width="181.2" height="49.9" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="650.0" y="366.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">Π₁ᵖ = coNP</tspan><tspan x="650.0" dy="16.9">(для всіх свідків ∀)</tspan></text>
<text x="450.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Δ₁ᵖ = P</text>
<line x1="450.0" y1="410.0" x2="450.0" y2="428.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="166.6" y="433.0" width="566.8" height="34.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.0"/><text x="450.0" y="454.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Рівень 0:  Δ₀ᵖ = Σ₀ᵖ = Π₀ᵖ = P  (детермінований поліномний час)</tspan></text>
</svg>