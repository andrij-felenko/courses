<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="62.8" y="130.8" width="314.4" height="78.4" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="220.0" y="156.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">Детермінована або недетермінована</tspan><tspan x="220.0" dy="18.2">поліномна машина M</tspan><tspan x="220.0" dy="18.2">(процесор / алгоритм)</tspan></text>
<rect x="484.5" y="130.8" width="271.0" height="78.4" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="2.2"/><text x="620.0" y="156.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">Оракул O для класу C</tspan><tspan x="620.0" dy="18.2">(наприклад, розв'язувач SAT)</tspan><tspan x="620.0" dy="18.2">Вердикт за O(1) кроків!</tspan></text>
<line x1="370.0" y1="130.0" x2="470.0" y2="130.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="420.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1. Запит записується на стрічку</text>
<text x="420.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">q ∈ SAT ?</text>
<line x1="470.0" y1="210.0" x2="370.0" y2="210.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="420.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2. Миттєва відповідь</text>
<text x="420.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">1 (Так) / 0 (Ні)</text>
<rect x="101.9" y="283.0" width="636.3" height="34.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="420.0" y="304.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Клас обчислюваності позначується як M^O (наприклад, P^(NP) або NP^(NP))</tspan></text>
