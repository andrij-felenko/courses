<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1150 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1150" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="570.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Визначник vs Перманент: порівняння алгебраїчних властивостей та складності</text>
<line x1="570.0" y1="60.0" x2="570.0" y2="340.0" stroke="#d5dbe2" stroke-width="2.0" stroke-dasharray="7 7"/>
<rect x="197.7" y="61.0" width="204.6" height="42.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.4"/><text x="300.0" y="87.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Визначник   det(A)</tspan></text>
<rect x="732.8" y="61.0" width="214.5" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/><text x="840.0" y="87.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">Перманент   perm(A)</tspan></text>
<rect x="128.9" y="137.5" width="342.2" height="41.0" rx="6" fill="#ffffff" stroke="#c7ced6" stroke-width="1.6"/><text x="300.0" y="163.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">det(A) = Σσ sgn(σ) · ∏ᵢ a[i, σ(i)]</tspan></text>
<rect x="706.1" y="137.5" width="267.8" height="41.0" rx="6" fill="#ffffff" stroke="#c7ced6" stroke-width="1.6"/><text x="840.0" y="163.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">perm(A) = Σσ ∏ᵢ a[i, σ(i)]</tspan></text>
<text x="300.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">знак sgn(σ) = ±1 занулює поправки</tspan><tspan x="300.0" dy="16.9">при додаванні однакових рядків</tspan></text>
<text x="840.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">відсутність знаку sgn(σ) унеможливлює</tspan><tspan x="840.0" dy="16.9">занулення поправок методом Гаусса</tspan></text>
<rect x="180.1" y="289.5" width="239.9" height="41.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.4"/><text x="300.0" y="315.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Метод Гаусса: O(n³) ∈ P</tspan></text>
<rect x="682.9" y="289.5" width="314.3" height="41.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/><text x="840.0" y="315.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="840.0" dy="0.0">#P-повна задача (Валіант, 1979)</tspan></text>
<rect x="30.9" y="394.0" width="1078.3" height="42.0" rx="6" fill="#f4f6f8" stroke="#b0bec5" stroke-width="1.8"/><text x="570.0" y="419.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Зникнення одного знаку sgn(σ) руйнує знакозмінну симетрію і перетворює поліноміальну задачу O(n³) на #P-повне обчислення.</tspan></text>
</svg>