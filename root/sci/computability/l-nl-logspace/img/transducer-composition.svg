<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="360.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="30.0" y="25.0" width="780.0" height="120.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="420.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">Прямий підхід (Помилковий): Збереження проміжного результату f(x)</text>
<rect x="60.0" y="65.0" width="160.0" height="45.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.0"/>
<text x="140.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Вхід x (n бітів)</text>
<line x1="220.0" y1="87.0" x2="280.0" y2="87.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="280.0" y="65.0" width="140.0" height="45.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<text x="350.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">Трансд'юсер f</text>
<line x1="420.0" y1="87.0" x2="480.0" y2="87.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="480.0" y="65.0" width="150.0" height="45.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2.0"/>
<text x="555.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">Стрічка f(x)</text>
<text x="555.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">O(n^k) бітів! ✖</text>
<line x1="630.0" y1="87.0" x2="680.0" y2="87.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="680.0" y="65.0" width="110.0" height="45.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.0"/>
<text x="735.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Трансд me g</text>
<text x="420.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-style="italic">Порушення обмеження O(log n): проміжний вихід не вміщується у пам'ять!</text>
<rect x="30.0" y="165.0" width="780.0" height="190.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.0"/>
<text x="420.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="700">Коректний підхід: Віртуальний запит біта за вимогою (On-Demand Bit Query)</text>
<rect x="60.0" y="210.0" width="220.0" height="120.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="170.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">Трансд'юсер g</text>
<text x="170.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Потребує i-й біт</text>
<text x="170.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">проміжного входу f(x)</text>
<text x="170.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">Зберігає лише індекс i ∈ O(log n)</text>
<line x1="280.0" y1="250.0" x2="440.0" y2="250.0" stroke="#3b82f6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="360.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#3b82f6" text-anchor="middle" font-weight="700">1. Запит: «Дай i-й біт!»</text>
<line x1="440.0" y1="290.0" x2="280.0" y2="290.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="360.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">2. Повернення: 0 або 1</text>
<rect x="440.0" y="210.0" width="340.0" height="120.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<text x="610.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">Симулятор f на вході x</text>
<text x="610.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Перезапускає f(x) від початку,</text>
<text x="610.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">відраховує i виведених бітів,</text>
<text x="610.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">повертає i-й біт і скидає стан</text>
<text x="610.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">Пам'ять: O(log n) для f + O(log n) для g</text>
</svg>