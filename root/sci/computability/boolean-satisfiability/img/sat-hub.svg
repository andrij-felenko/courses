<text x="450.0" y="477.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Тому один швидкий розв'язувач SAT розв'язав би їх усі одразу. Чи можливий він — це «P проти NP», задача тисячоліття (премія $1 000 000).</text>
