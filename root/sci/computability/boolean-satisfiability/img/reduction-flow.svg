<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зведення: легкість тече назад, складність — уперед</text>
<text x="450.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">A ≤ₚ B  —  «A не важча за B»</text>
<rect x="75.0" y="112.6" width="250.0" height="74.8" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="200.0" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Задача A</tspan><tspan x="200.0" dy="16.9">(розклад, розфарбування,</tspan><tspan x="200.0" dy="16.9">маршрут, головоломка…)</tspan></text>
<rect x="575.0" y="112.6" width="250.0" height="74.8" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="2.0"/><text x="700.0" y="137.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">SAT</tspan><tspan x="700.0" dy="16.9">здійсненність</tspan><tspan x="700.0" dy="16.9">CNF-формули φ</tspan></text>
<line x1="325.0" y1="150.0" x2="575.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="450.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">зведення  f   (поліномний час)</text>
<text x="450.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">A розв'язна  ⟺  φ здійсненна</text>
<rect x="70.0" y="250.0" width="760.0" height="42.0" rx="10" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="450.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">умієш швидко SAT  →  умієш швидко й A       (легкість тече проти стрілки)</text>
<rect x="70.0" y="306.0" width="760.0" height="42.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="450.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">A справді важка  →  SAT не легша за неї       (складність тече за стрілкою)</text>
</svg>