<text x="450.0" y="477.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Сірим — гілки, що відпадають рано: щойно частковий набір провалює умову, усе піддерево під ним не переглядають. Саме на цьому тримається швидкодія.</text>
