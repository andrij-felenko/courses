<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зведення проблеми зупинки до довільної семантичної властивості</text>
<rect x="293.0" y="35.0" width="294.0" height="49.9" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="440.0" y="56.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Вхід проблеми зупинки: пара ⟨M, w⟩</tspan><tspan x="440.0" dy="16.9">(програма M та її вхідні дані w)</tspan></text>
<line x1="440.0" y1="86.0" x2="440.0" y2="126.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="260.7" y="135.1" width="358.5" height="49.9" rx="6" fill="#fff6e6" stroke="#e08a1e" stroke-width="1.5"/><text x="440.0" y="156.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Алгоритмічний синтез коду (s-m-n теорема):</tspan><tspan x="440.0" dy="16.9">Створюємо нову програму Q_{M,w}(x)</tspan></text>
<line x1="440.0" y1="192.0" x2="440.0" y2="232.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="221.4" y="243.4" width="437.2" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="263.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Тіло програми Q_{M,w}(x):</tspan><tspan x="440.0" dy="15.6">1. Запустити M на вході w (ігноруючи x)</tspan><tspan x="440.0" dy="15.6">2. Якщо M(w) спинилась — обчислити й повернути g(x), де g ∈ P</tspan></text>
<line x1="380.0" y1="318.0" x2="280.0" y2="355.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="500.0" y1="318.0" x2="600.0" y2="355.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="113.0" y="346.8" width="233.9" height="76.4" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="366.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">M(w) СПИНЯЄТЬСЯ</tspan><tspan x="230.0" dy="15.0">Крок 1 завершується ⟹</tspan><tspan x="230.0" dy="15.0">Q_{M,w} обчислює функцію g ∈ P</tspan><tspan x="230.0" dy="15.0">⟹ Q_{M,w} ∈ I_P</tspan></text>
<rect x="554.4" y="346.8" width="191.1" height="76.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="650.0" y="366.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">M(w) ЗАЦИКЛЮЄТЬСЯ</tspan><tspan x="650.0" dy="15.0">Крок 1 крутиться вічно ⟹</tspan><tspan x="650.0" dy="15.0">Q_{M,w} обчислює f_∅ ∉ P</tspan><tspan x="650.0" dy="15.0">⟹ Q_{M,w} ∉ I_P</tspan></text>
<rect x="158.0" y="458.2" width="564.0" height="33.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="479.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">M(w) спиняється  ⟺  Q_{M,w} має властивість P  ⟹  I_P нерозв'язна</tspan></text>
<line x1="230.0" y1="424.0" x2="260.0" y2="460.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="650.0" y1="424.0" x2="620.0" y2="460.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
</svg>