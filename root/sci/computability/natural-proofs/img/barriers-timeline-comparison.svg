<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три мета-бар'єри доведення P ≠ NP та шляхи їх обходу</text>
<rect x="10.0" y="10.0" width="960.0" height="440.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<rect x="30.0" y="70.0" width="290.0" height="320.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="175.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1d4ed8" text-anchor="middle" font-weight="700">Релятивізація (BGS, 1975)</text>
<line x1="45.0" y1="112.0" x2="305.0" y2="112.0" stroke="#93c5fd" stroke-width="1.0"/>
<rect x="45.0" y="125.0" width="260.0" height="240.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">• Ідея: Діагоналізація та</tspan><tspan x="175.0" dy="15.6">  симуляція машин Тюринга.</tspan><tspan x="175.0" dy="15.6">• Суть бар'єру: Існують</tspan><tspan x="175.0" dy="15.6">  оракули A та B такі, що</tspan><tspan x="175.0" dy="15.6">  Pᴬ = NPᴬ, але P🅱 ≠ NP🅱.</tspan><tspan x="175.0" dy="15.6">• Що блокує: Будь-які докази,</tspan><tspan x="175.0" dy="15.6">  що зберігають чинність для</tspan><tspan x="175.0" dy="15.6">  чорних скриньок-оракулів.</tspan><tspan x="175.0" dy="15.6">• Обхід: Арифметизація,</tspan><tspan x="175.0" dy="15.6">  використання структури.</tspan></text>
<rect x="345.0" y="70.0" width="290.0" height="320.0" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
<text x="490.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#b91c1c" text-anchor="middle" font-weight="700">Натуральні доведення (1997)</text>
<line x1="360.0" y1="112.0" x2="620.0" y2="112.0" stroke="#fca5a5" stroke-width="1.0"/>
<rect x="360.0" y="125.0" width="260.0" height="240.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="490.0" y="186.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">• Ідея: Пошук конструктивних</tspan><tspan x="490.0" dy="15.6">  та великих властивостей Cₙ.</tspan><tspan x="490.0" dy="15.6">• Суть бар'єру: Натуральні</tspan><tspan x="490.0" dy="15.6">  властивості стають розрізнювачами</tspan><tspan x="490.0" dy="15.6">  для криптографічних PRG.</tspan><tspan x="490.0" dy="15.6">• Що блокує: Комбінаторні</tspan><tspan x="490.0" dy="15.6">  нижні оцінки схем P/poly.</tspan><tspan x="490.0" dy="15.6">• Обхід: Рідкісні властивості</tspan><tspan x="490.0" dy="15.6">  (GCT), програма Вільямса.</tspan></text>
<rect x="660.0" y="70.0" width="290.0" height="320.0" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="805.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">Алгебраїзація (AW, 2008)</text>
<line x1="675.0" y1="112.0" x2="935.0" y2="112.0" stroke="#86efac" stroke-width="1.0"/>
<rect x="675.0" y="125.0" width="260.0" height="240.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="186.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">• Ідея: Арифметизація та</tspan><tspan x="805.0" dy="15.6">  поліноміальні розширення.</tspan><tspan x="805.0" dy="15.6">• Суть бар'єру: Існують</tspan><tspan x="805.0" dy="15.6">  алгебраїчні оракули з</tspan><tspan x="805.0" dy="15.6">  колапсом та розділенням.</tspan><tspan x="805.0" dy="15.6">• Що блокує: Методи IP=PSPACE</tspan><tspan x="805.0" dy="15.6">  і PCP для розділення P/NP.</tspan><tspan x="805.0" dy="15.6">• Обхід: Не-алгебраїчні</tspan><tspan x="805.0" dy="15.6">  геометричні симетрії (GCT).</tspan></text>
<rect x="123.2" y="403.0" width="733.7" height="24.0" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="490.0" y="419.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">GCT та програма Вільямса оминають усі три бар'єри завдяки не-натуральності й не-релятивізованості</tspan></text>
</svg>