<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="800" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">П'ять кроків діагоналі: від нумерації рецептів до провалу власного виконавця</text>
<rect x="110.0" y="77.0" width="700.0" height="66.0" rx="9" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="460.0" y="105.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Крок 1 · рецепти пронумеровано</tspan><tspan x="460.0" dy="19.5">e₀, e₁, e₂, … → функції g₀, g₁, g₂, …</tspan></text>
<rect x="110.0" y="173.0" width="700.0" height="66.0" rx="9" fill="#eef2ff" stroke="#2457d6" stroke-width="1.6"/><text x="460.0" y="201.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Крок 2 · універсальний виконавець</tspan><tspan x="460.0" dy="19.5">U(n, x) = gₙ(x) — тотальна й обчислювана</tspan></text>
<rect x="110.0" y="269.0" width="700.0" height="66.0" rx="9" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="460.0" y="297.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Крок 3 · діагональ</tspan><tspan x="460.0" dy="19.5">d(n) = U(n, n) + 1 = gₙ(n) + 1</tspan></text>
<rect x="110.0" y="365.0" width="700.0" height="66.0" rx="9" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="460.0" y="393.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Крок 4 · припущення від супротивного</tspan><tspan x="460.0" dy="19.5">нехай d = gₖ — стоїть у списку під номером k</tspan></text>
<rect x="110.0" y="461.0" width="700.0" height="66.0" rx="9" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/><text x="460.0" y="489.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Крок 4 · суперечність</tspan><tspan x="460.0" dy="19.5">gₖ(k) = gₖ(k) + 1  ⟹  0 = 1  →  d не примітивно-рекурсивна</tspan></text>
<rect x="110.0" y="557.0" width="700.0" height="66.0" rx="9" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="460.0" y="585.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Крок 5 · d через U</tspan><tspan x="460.0" dy="19.5">d(n) = S( U( P¹₁(n), P¹₁(n) ) ) — якби U була ПР, то й d — суперечність</tspan></text>
<rect x="110.0" y="653.0" width="700.0" height="66.0" rx="9" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.4"/><text x="460.0" y="681.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">Висновок</tspan><tspan x="460.0" dy="19.5">сама U НЕ примітивно-рекурсивна — клас не тлумачить себе зсередини</tspan></text>
<line x1="460.0" y1="147.0" x2="460.0" y2="169.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="460.0" y1="243.0" x2="460.0" y2="265.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="460.0" y1="339.0" x2="460.0" y2="361.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="460.0" y1="435.0" x2="460.0" y2="457.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="460.0" y1="531.0" x2="460.0" y2="553.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="460.0" y1="627.0" x2="460.0" y2="649.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="450.0" y="759.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">кожен крок доведений до кінця в тексті; злам на кроці 4 тягне за собою висновок кроку 5</text>
</svg>