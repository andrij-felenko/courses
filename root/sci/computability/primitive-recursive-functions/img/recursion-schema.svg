<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Примітивна рекурсія: значення тримаються одне за одне й спускаються до нуля</text>
<rect x="600.0" y="63.0" width="400.0" height="66.0" rx="8" fill="#eef2ff" stroke="#2457d6" stroke-width="1.6"/><text x="800.0" y="91.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="800.0" dy="0.0">h(x, 0)     =  f(x)</tspan><tspan x="800.0" dy="19.5">h(x, y+1) =  g( x, y, h(x, y) )</tspan></text>
<rect x="80.0" y="188.0" width="150.0" height="52.0" rx="8" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.4"/><text x="155.0" y="219.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="155.0" dy="0.0">h(x, 0)</tspan></text>
<rect x="310.0" y="188.0" width="150.0" height="52.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="385.0" y="219.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="385.0" dy="0.0">h(x, 1)</tspan></text>
<rect x="540.0" y="188.0" width="150.0" height="52.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="615.0" y="219.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">h(x, 2)</tspan></text>
<rect x="770.0" y="188.0" width="150.0" height="52.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.6"/><text x="845.0" y="219.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="845.0" dy="0.0">h(x, 3)</tspan></text>
<line x1="304.0" y1="170.0" x2="236.0" y2="170.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="534.0" y1="170.0" x2="466.0" y2="170.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="764.0" y1="170.0" x2="696.0" y2="170.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="500.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">залежність: кожне значення потребує попереднього — спуск до бази</text>
<line x1="236.0" y1="258.0" x2="304.0" y2="258.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="466.0" y1="258.0" x2="534.0" y2="258.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<line x1="696.0" y1="258.0" x2="764.0" y2="258.0" stroke="#1a1a1a" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="500.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">обчислення: від бази рахуємо вправо через g( x, y, попереднє )</text>
<text x="155.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-style="italic">дно драбини — відповідь прямо</text>
<text x="950.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700">…</text>
<text x="954.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">будь-яке y</text>
</svg>