<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому завзятого бобра не обчислити ніколи</text>
<rect x="311.0" y="69.5" width="277.9" height="33.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="450.0" y="90.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">ПРИПУСТІМО: S(n) можна обчислити</tspan></text>
<line x1="450.0" y1="104.5" x2="450.0" y2="147.1" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="286.9" y="151.1" width="326.3" height="49.9" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="450.0" y="172.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Дано n-станову машину M.  Порахуй S(n)</tspan><tspan x="450.0" dy="16.9">і проганяй M рівно S(n) кроків</tspan></text>
<line x1="450.0" y1="202.9" x2="450.0" y2="248.6" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="274.8" y="252.6" width="350.5" height="66.8" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="450.0" y="273.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">спинилась за S(n) кроків → M зупиняється</tspan><tspan x="450.0" dy="16.9">не спинилась → не спиниться НІКОЛИ</tspan><tspan x="450.0" dy="16.9">(бо S(n) — стеля для всіх, що спиняються)</tspan></text>
<line x1="450.0" y1="321.4" x2="450.0" y2="369.1" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="303.0" y="373.1" width="294.0" height="49.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="394.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Отже, ми вирішили ПРОБЛЕМУ ЗУПИНКИ</tspan><tspan x="450.0" dy="16.9">для будь-якої машини</tspan></text>
<line x1="450.0" y1="424.9" x2="450.0" y2="459.5" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="298.9" y="463.5" width="302.1" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="484.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Але проблема зупинки НЕРОЗВ'ЯЗНА  ✗</tspan></text>
<text x="700.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#c0392b" text-anchor="middle" font-weight="700">⇅</text>
<line x1="450.0" y1="498.5" x2="450.0" y2="525.2" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="159.6" y="529.2" width="580.8" height="33.5" rx="6" fill="#fdf3e3" stroke="#b9770e" stroke-width="1.5"/><text x="450.0" y="550.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">СУПЕРЕЧНІСТЬ ⇒ S(n) і Σ(n) — необчислювані:  формули не буде ніколи</tspan></text>
</svg>