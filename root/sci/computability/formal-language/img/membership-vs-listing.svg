<text x="531.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">десь попереду — але де?</text>
<rect x="704.0" y="294.0" width="296.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="852.0" y="315.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="852.0" dy="0.0">належність лише НАПІВрозв'язна</tspan></text>
<rect x="40.0" y="372.0" width="960.0" height="148.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="409.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Стоп-правило вгорі працює ЛИШЕ завдяки порядку за довжиною. Унизу слово w може випірнути</tspan><tspan x="520.0" dy="16.2">будь-де попереду, тож поки не випірнуло — «ні» сказати не можна, і чекати можна вічно.</tspan><tspan x="520.0" dy="16.2"></tspan><tspan x="520.0" dy="16.2">Розв'язно ⟺ перелічити можна І саму мову, І її доповнення (критерій Поста, 1944). Але є мови —</tspan><tspan x="520.0" dy="16.2">як-от мова програм, що спиняються, — де доповнення не перелічити навіть у принципі: систематично</tspan><tspan x="520.0" dy="16.2">виписати всі програми, що НЕ спиняються, неможливо. Стоп-правила там немає — і взятися йому нізвідки.</tspan></text>
</svg>