<rect x="662.0" y="108.0" width="296.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="810.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">перейшли до слів довжини 3 →</tspan><tspan x="810.0" dy="13.7">якщо w не трапилось раніше,</tspan><tspan x="810.0" dy="13.7">впевнено кажемо «ні»</tspan></text>
<rect x="704.0" y="160.0" width="296.0" height="30.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="852.0" y="179.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="852.0" dy="0.0">належність РОЗВ'ЯЗНА</tspan></text>
<text x="60.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">ДОВІЛЬНИЙ ПОРЯДОК  —  мова просто перелічна</text>
