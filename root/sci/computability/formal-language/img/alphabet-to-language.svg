<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<defs><marker id="ar_1a1a1a" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/></marker><marker id="ar_27ae60" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27ae60"/></marker><marker id="ar_2457d6" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2457d6"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Від алфавіту до мови: чотири кроки</text>
<text x="500.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">кожен крок додає рівно одне поняття — і жодного натяку на зміст</text>
<rect x="30.0" y="76.0" width="280.0" height="112.0" rx="10" fill="#fbfcfe" stroke="#2457d6" stroke-width="1.8"/>
<text x="170.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1 · АЛФАВІТ  Σ</text>
<rect x="88.0" y="112.0" width="164.0" height="38.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.4"/>
<text x="170.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Σ = { a, b }</text>
<text x="170.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">скінченний набір значків</text>
<rect x="336.0" y="76.0" width="330.0" height="112.0" rx="10" fill="#fbfcfe" stroke="#2457d6" stroke-width="1.8"/>
<text x="501.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">2 · СЛОВО</text>
<rect x="431.0" y="112.0" width="32.0" height="34.0" rx="4" fill="#eef2fb" stroke="#2457d6" stroke-width="1.4"/><text x="447.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">a</text>
<rect x="467.0" y="112.0" width="32.0" height="34.0" rx="4" fill="#eef2fb" stroke="#2457d6" stroke-width="1.4"/><text x="483.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">b</text>
<rect x="503.0" y="112.0" width="32.0" height="34.0" rx="4" fill="#eef2fb" stroke="#2457d6" stroke-width="1.4"/><text x="519.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">b</text>
<rect x="539.0" y="112.0" width="32.0" height="34.0" rx="4" fill="#eef2fb" stroke="#2457d6" stroke-width="1.4"/><text x="555.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">a</text>
<text x="501.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">скінченний ланцюжок символів:  |abba| = 4</text>
<rect x="692.0" y="76.0" width="278.0" height="112.0" rx="10" fill="#fbfcfe" stroke="#2457d6" stroke-width="1.8"/>
<text x="831.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">3 · Σ*  —  УСІ слова</text>
<text x="831.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">нескінченно багато,</text>
<text x="831.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">зате їх можна перелічити</text>
<text x="831.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">коротші раніше, рівні — за абеткою</text>
<rect x="30.0" y="204.0" width="940.0" height="324.0" rx="12" fill="#fbfcfe" stroke="#27ae60" stroke-width="2.0"/>
<text x="500.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">4 · МОВА  L ⊆ Σ*  —  просто ВИБРАНА підмножина</text>
<text x="500.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">L = «слова, у яких стільки ж a, скільки b».   Зелене — належить L, біле — ні.</text>
<text x="194.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">|w| = 0  ·  1 слово</text>
<rect x="210.0" y="268.0" width="58.0" height="40.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="239.0" y="292.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ε</text>
<text x="194.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">|w| = 1  ·  2 слова</text>
<rect x="210.0" y="322.0" width="58.0" height="40.0" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/><text x="239.0" y="346.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">a</text>
<rect x="276.0" y="322.0" width="58.0" height="40.0" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/><text x="305.0" y="346.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">b</text>
<text x="194.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">|w| = 2  ·  4 слова</text>
<rect x="210.0" y="376.0" width="58.0" height="40.0" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/><text x="239.0" y="400.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">aa</text>
<rect x="276.0" y="376.0" width="58.0" height="40.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="305.0" y="400.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ab</text>
<rect x="342.0" y="376.0" width="58.0" height="40.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/><text x="371.0" y="400.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ba</text>
<rect x="408.0" y="376.0" width="58.0" height="40.0" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/><text x="437.0" y="400.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">bb</text>
<text x="194.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">|w| = 3  ·  8 слів</text>
<rect x="210.0" y="430.0" width="58.0" height="40.0" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/><text x="239.0" y="454.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">aaa</text>
<rect x="276.0" y="430.0" width="58.0" height="40.0" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/><text x="305.0" y="454.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">aab</text>
<rect x="342.0" y="430.0" width="58.0" height="40.0" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/><text x="371.0" y="454.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">aba</text>
<rect x="408.0" y="430.0" width="58.0" height="40.0" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/><text x="437.0" y="454.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">abb</text>
<rect x="474.0" y="430.0" width="58.0" height="40.0" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/><text x="503.0" y="454.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">baa</text>
<rect x="540.0" y="430.0" width="58.0" height="40.0" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/><text x="569.0" y="454.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">bab</text>
<rect x="606.0" y="430.0" width="58.0" height="40.0" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/><text x="635.0" y="454.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">bba</text>
<rect x="672.0" y="430.0" width="58.0" height="40.0" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1.2"/><text x="701.0" y="454.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">bbb</text>
<text x="210.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">…  далі 16 слів довжини 4 (шість із них у L), 32 слова довжини 5 — і так без кінця</text>
<rect x="752.0" y="268.0" width="208.0" height="202.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="856.0" y="298.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="856.0" dy="0.0">ЖОДНОЇ ЗАКОНОМІРНОСТІ</tspan><tspan x="856.0" dy="15.0">означення не вимагає.</tspan><tspan x="856.0" dy="15.0"></tspan><tspan x="856.0" dy="15.0">Мовою є БУДЬ-ЯКА</tspan><tspan x="856.0" dy="15.0">підмножина Σ* — хоч</tspan><tspan x="856.0" dy="15.0">задана правилом, хоч</tspan><tspan x="856.0" dy="15.0">вибрана навмання.</tspan><tspan x="856.0" dy="15.0"></tspan><tspan x="856.0" dy="15.0">Правило — рідкісна</tspan><tspan x="856.0" dy="15.0">розкіш, а не частина</tspan><tspan x="856.0" dy="15.0">означення.</tspan></text>
<rect x="30.0" y="542.0" width="940.0" height="66.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="571.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Ні алфавіт, ні слово, ні Σ*, ні L не знають, що таке «зміст». Мова — це відповідь</tspan><tspan x="500.0" dy="16.9">на єдине питання «чи це слово в ній?», і ні на яке більше. Уся сила — саме в цій бідності.</tspan></text>
</svg>