<rect x="30.0" y="316.0" width="1000.0" height="96.0" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.5"/><text x="530.0" y="352.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">У кожної множини — своя нитка, що не губить жодного елемента, тож усі вони одного розміру: ℵ₀ —</tspan><tspan x="530.0" dy="16.2">потужність будь-якої множини, яку можна вишикувати в список. Здається, що більшого й не буває.</tspan><tspan x="530.0" dy="16.2">Наступний крок — булеан 𝒫(Σ*), множина всіх мов, — показує, що буває: 2^ℵ₀ строго більше за ℵ₀.</tspan></text>
