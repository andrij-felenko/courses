<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160.04 -10 1000.04 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-160.04" y="-10" width="1000.04" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="340.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Перетворення префіксів: згортання однорідних кванторів через пару Кантора</text>
<text x="80.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">1. Початкова формула з повторюваними однаковими кванторами:</text>
<rect x="187.7" y="99.0" width="464.6" height="32.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="420.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">P(x)  ≡  ∃y₁  ∃y₂  ∀z₁  ∀z₂  ∀z₃  ∃w  R(x, y₁, y₂, z₁, z₂, z₃, w)</tspan></text>
<line x1="420.0" y1="138.0" x2="420.0" y2="162.0" stroke="#64748b" stroke-width="2.0"/>
<text x="80.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">2. Згортання сусідніх кванторів через функцію парування Кантора ⟨a, b⟩:</text>
<rect x="156.9" y="192.0" width="526.2" height="32.0" rx="6" fill="#fff6e5" stroke="#d97706" stroke-width="1.5"/><text x="420.0" y="212.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">∃y₁, y₂ ↦ ∃Y (Y = ⟨y₁, y₂⟩)    та    ∀z₁, z₂, z₃ ↦ ∀Z (Z = ⟨⟨z₁, z₂⟩, z₃⟩)</tspan></text>
<line x1="420.0" y1="230.0" x2="420.0" y2="255.0" stroke="#64748b" stroke-width="2.0"/>
<text x="80.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">3. Канонічна префіксна форма з n = 3 чергуваннями (Σ₃⁰):</text>
<rect x="172.2" y="283.5" width="495.5" height="33.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="420.0" y="304.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">P(x)  ≡  ∃Y  ∀Z  ∃w  R'(x, Y, Z, w)   ⇒   Формула класу Σ₃⁰</tspan></text>
</svg>