<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="191.2" y="16.5" width="557.5" height="37.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="470.0" y="41.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Місце класів MA та AM у ландшафті теорії складності</tspan></text>
<rect x="40.0" y="75.0" width="860.0" height="410.0" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2.0"/>
<text x="470.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle" font-weight="700">Класи IP = PSPACE (Інтерактивні доведення з поліномною кількістю раундів)</text>
<rect x="70.0" y="120.0" width="800.0" height="345.0" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
<text x="470.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Поліноміальна ієрархія (PH) та рівень Σ₂ᵖ ∩ Π₂ᵖ</text>
<rect x="100.0" y="165.0" width="740.0" height="280.0" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="470.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0369a1" text-anchor="middle" font-weight="700">Клас AM (Arthur-Merlin games, публічні монети, 2 раунди)</text>
<text x="470.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0284c7" text-anchor="middle" font-style="italic">Також AM = AM[k] = IP[k] для будь-якої сталої кількості раундів k ≥ 2</text>
<rect x="140.0" y="225.0" width="660.0" height="200.0" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="470.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700">Клас MA (Merlin-Arthur, приватні монети, 2 раунди)</text>
<rect x="180.0" y="275.0" width="270.0" height="135.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="315.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">Клас NP (Сертифікати)</text>
<text x="315.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle"><tspan x="315.0" dy="0.0">Детермінована перевірка</tspan><tspan x="315.0" dy="14.3">детермінованого свідка</tspan><tspan x="315.0" dy="14.3">NP ⊆ MA</tspan></text>
<rect x="490.0" y="275.0" width="270.0" height="135.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
<text x="625.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#065f46" text-anchor="middle" font-weight="700">Клас BPP (Імовірнісні P)</text>
<text x="625.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#065f46" text-anchor="middle"><tspan x="625.0" dy="0.0">Ймовірнісний верифікатор</tspan><tspan x="625.0" dy="14.3">без доводжувача</tspan><tspan x="625.0" dy="14.3">BPP ⊆ MA</tspan></text>
