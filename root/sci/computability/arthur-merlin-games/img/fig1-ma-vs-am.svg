<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="116.9" y="16.5" width="726.2" height="37.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/><text x="480.0" y="41.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Порівняння ігрових моделей Merlin-Arthur (MA) та Arthur-Merlin (AM)</tspan></text>
<rect x="30.0" y="75.0" width="435.0" height="400.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="247.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e3a8a" text-anchor="middle" font-weight="700">Модель MA (Приватні монети)</text>
<text x="247.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-style="italic">Мерлін відправляє сертифікат до випадкових монет</text>
<rect x="86.5" y="153.2" width="321.0" height="43.6" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="247.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="247.0" dy="0.0">1. Мерлін створює доказове повідомлення m</tspan><tspan x="247.0" dy="15.6">(спираючись лише на вхід x)</tspan></text>
<line x1="247.0" y1="215.0" x2="247.0" y2="245.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="108.8" y="263.2" width="276.4" height="43.6" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="247.0" y="281.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="247.0" dy="0.0">2. Артур підкидає ПРИВАТНІ монети r</tspan><tspan x="247.0" dy="15.6">(Мерлін не бачить результатів r)</tspan></text>
<line x1="247.0" y1="325.0" x2="247.0" y2="355.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.4" y="373.2" width="373.1" height="43.6" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="247.0" y="391.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="247.0" dy="0.0">3. Перевірка: V(x, m, r) ∈ {Прийняти, Відхилити}</tspan><tspan x="247.0" dy="15.6">(Помилка: Completeness ≥ 2/3, Soundness ≤ 1/3)</tspan></text>
<rect x="495.0" y="75.0" width="435.0" height="400.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="712.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#7c2d12" text-anchor="middle" font-weight="700">Модель AM (Публічні монети)</text>
<text x="712.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-style="italic">Артур відкриває монети r першим</text>
<rect x="573.8" y="153.2" width="276.4" height="43.6" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="712.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="712.0" dy="0.0">1. Артур підкидає ПУБЛІЧНІ монети r</tspan><tspan x="712.0" dy="15.6">та відкриває їх Мерліну</tspan></text>
<line x1="712.0" y1="215.0" x2="712.0" y2="245.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="558.9" y="263.2" width="306.2" height="43.6" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="712.0" y="281.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="712.0" dy="0.0">2. Мерлін підбирає повідомлення m(x, r)</tspan><tspan x="712.0" dy="15.6">знаючи конкретний виклик r</tspan></text>
<line x1="712.0" y1="325.0" x2="712.0" y2="355.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="525.4" y="373.2" width="373.1" height="43.6" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="712.0" y="391.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="712.0" dy="0.0">3. Перевірка: V(x, r, m) ∈ {Прийняти, Відхилити}</tspan><tspan x="712.0" dy="15.6">(Потужніша модель: MA ⊆ AM)</tspan></text>
</svg>