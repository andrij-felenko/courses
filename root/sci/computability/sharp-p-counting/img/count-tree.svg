<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1240" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лічильник #SAT: розгалузитися за змінною й скласти гілки</text>
<rect x="351.2" y="45.5" width="537.5" height="41.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/><text x="620.0" y="71.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">F = (x₁∨x₂∨¬x₃) · (¬x₁∨x₃) · (x₂∨x₃)      [x₄ — вільна]</tspan></text>
<rect x="519.6" y="102.5" width="200.7" height="39.0" rx="6" fill="#f0f3f8" stroke="#1a1a1a" stroke-width="2.2"/><text x="620.0" y="127.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">count(F) — 4 змінні</tspan></text>
<line x1="560.0" y1="140.0" x2="340.0" y2="214.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="690.0" y1="140.0" x2="900.0" y2="214.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="620.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">склади гілки:  4 + 4 = 8</text>
<rect x="291.1" y="217.5" width="77.8" height="37.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="330.0" y="241.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">x₁ = 1</tspan></text>
<rect x="763.1" y="218.0" width="273.7" height="36.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="900.0" y="240.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="900.0" dy="0.0">x₁ = 0  ⇒  (x₂∨¬x₃) · (x₂∨x₃)</tspan></text>
<line x1="330.0" y1="258.0" x2="330.0" y2="320.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="226.9" y="334.8" width="206.3" height="74.4" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.4"/><text x="330.0" y="358.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">одиничний (x₃) ⇒ x₃=1</tspan><tspan x="330.0" dy="18.2">усі клаузи зняті</tspan><tspan x="330.0" dy="18.2">2² = 4</tspan></text>
<text x="330.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">(x₂, x₄ — вільні)</text>
<text x="900.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">4 + 0 = 4</text>
<line x1="840.0" y1="258.0" x2="780.0" y2="336.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="960.0" y1="258.0" x2="1050.0" y2="336.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="731.1" y="341.5" width="77.8" height="37.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="770.0" y="365.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">x₂ = 1</tspan></text>
<rect x="1011.1" y="341.5" width="77.8" height="37.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="1050.0" y="365.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1050.0" dy="0.0">x₂ = 0</tspan></text>
<line x1="770.0" y1="382.0" x2="770.0" y2="452.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="688.6" y="471.9" width="162.9" height="56.2" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.4"/><text x="770.0" y="495.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">усі клаузи зняті</tspan><tspan x="770.0" dy="18.2">2² = 4</tspan></text>
<text x="770.0" y="556.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">(x₃, x₄ — вільні)</text>
<line x1="1050.0" y1="382.0" x2="1050.0" y2="452.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="985.9" y="467.9" width="128.2" height="56.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/><text x="1050.0" y="491.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1050.0" dy="0.0">(¬x₃) · (x₃)</tspan><tspan x="1050.0" dy="18.2">суперечність</tspan></text>
<line x1="1050.0" y1="540.0" x2="1050.0" y2="590.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="997.1" y="603.5" width="105.7" height="37.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.4"/><text x="1050.0" y="627.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="1050.0" dy="0.0">0 моделей</tspan></text>
<rect x="39.4" y="628.0" width="781.2" height="40.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="2.0"/><text x="430.0" y="652.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Не перебір 2⁴ = 16 наборів, а пошук: розгалузити за змінною й СКЛАСТИ числа обох гілок.</tspan></text>
</svg>