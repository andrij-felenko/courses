<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1160" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="580.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Незалежні компоненти множаться, повтори — з кешу</text>
<rect x="403.3" y="45.0" width="353.4" height="42.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/><text x="580.0" y="71.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">G = (x₁∨x₂) · (¬x₁∨¬x₂) · (x₃∨x₄)</tspan></text>
<text x="580.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">жодної спільної змінної</text>
<line x1="580.0" y1="146.0" x2="580.0" y2="300.0" stroke="#c7ced6" stroke-width="2.0" stroke-dasharray="6 6"/>
<rect x="161.1" y="171.8" width="277.7" height="76.4" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="300.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">Компонента A · {x₁, x₂}</tspan><tspan x="300.0" dy="18.2">(x₁∨x₂) · (¬x₁∨¬x₂)</tspan><tspan x="300.0" dy="18.2">рівно одне істинне → 2 моделі</tspan></text>
<rect x="747.2" y="171.8" width="225.6" height="76.4" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/><text x="860.0" y="196.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">Компонента B · {x₃, x₄}</tspan><tspan x="860.0" dy="18.2">(x₃∨x₄)</tspan><tspan x="860.0" dy="18.2">→ 3 моделі</tspan></text>
<line x1="300.0" y1="262.0" x2="505.0" y2="344.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="860.0" y1="262.0" x2="655.0" y2="344.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="476.4" y="343.5" width="207.2" height="45.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.6"/><text x="580.0" y="371.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">2 × 3 = 6 моделей</tspan></text>
<rect x="302.0" y="409.1" width="556.0" height="53.9" rx="6" fill="#fbfcfd" stroke="#8a93a0" stroke-width="1.8"/><text x="580.0" y="432.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">кеш: канонічна форма компоненти → її число моделей</tspan><tspan x="580.0" dy="16.9">та сама підформула в іншій гілці — готове число, без нового дерева</tspan></text>
<rect x="159.0" y="490.0" width="841.9" height="40.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="2.0"/><text x="580.0" y="514.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Незалежні компоненти МНОЖАТЬСЯ (не додаються); однакову підформулу лічимо раз і кладемо в кеш.</tspan></text>
</svg>