<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де сидить магазинний автомат: ієрархія Хомського</text>
<rect x="70.0" y="66.0" width="680.0" height="424.0" rx="10" fill="#ffffff" stroke="#b9c0c9" stroke-width="1.6"/>
<rect x="130.0" y="126.0" width="560.0" height="304.0" rx="10" fill="#fcfcfd" stroke="#aeb6c0" stroke-width="1.6"/>
<rect x="190.0" y="186.0" width="440.0" height="184.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="2.4"/>
<rect x="250.0" y="246.0" width="320.0" height="64.0" rx="10" fill="#f4f7fc" stroke="#8aa0c8" stroke-width="1.6"/>
<text x="410.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рекурсивно-перелічні</text>
<text x="410.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">машина Тюринга — «чи зупиниться програма»</text>
<text x="410.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контекстно-залежні</text>
<text x="410.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">лінійно-обмежений автомат — aⁿbⁿcⁿ</text>
<text x="410.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Контекстно-вільні — МАГАЗИННИЙ автомат</text>
<text x="410.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e7a45" text-anchor="middle">aⁿbⁿ · збалансовані дужки · арифметичні вирази</text>
<text x="410.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Регулярні</text>
<text x="410.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">скінченний автомат — (ab)*</text>
<text x="410.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Кожне кільце додає рівно ту пам'ять, що піднімає на сходинку:</text>
<text x="410.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">стек дає одну вкладеність — між скінченним автоматом і машиною Тюринга.</text>
</svg>