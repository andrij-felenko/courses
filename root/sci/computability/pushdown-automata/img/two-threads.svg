<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві нитки, що не знали одна про одну</text>
<text x="520.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">стек винайшли інженери для формул; клас мов описали мовознавці для речень</text>
<rect x="50.0" y="96.0" width="420.0" height="40.0" rx="6" fill="#fdf4dd" stroke="#8a6d1f" stroke-width="2.0"/><text x="260.0" y="120.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#8a6d1f" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">ІНЖЕНЕРИ: як порахувати формулу</tspan></text>
<rect x="570.0" y="96.0" width="420.0" height="40.0" rx="6" fill="#e9eefb" stroke="#2457d6" stroke-width="2.0"/><text x="780.0" y="120.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="780.0" dy="0.0">МОВОЗНАВЦІ: як розібрати речення</tspan></text>
<rect x="50.0" y="150.0" width="420.0" height="66.0" rx="6" fill="#ffffff" stroke="#8a6d1f" stroke-width="1.6"/>
<text x="64.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d1f" text-anchor="start" font-weight="700">1955  ·  Мюнхен</text>
<text x="64.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="64.0" dy="0.0">Бауер і Замельзон кладуть відкладені</tspan><tspan x="64.0" dy="15.5">дії «навпаки» — принцип «Keller» (льох)</tspan></text>
<rect x="50.0" y="232.0" width="420.0" height="66.0" rx="6" fill="#ffffff" stroke="#8a6d1f" stroke-width="1.6"/>
<text x="64.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d1f" text-anchor="start" font-weight="700">1957  ·  патент</text>
<text x="64.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="64.0" dy="0.0">заявка від 30 березня; стек як</tspan><tspan x="64.0" dy="15.5">механізм обчислення формул</tspan></text>
<rect x="50.0" y="314.0" width="420.0" height="66.0" rx="6" fill="#ffffff" stroke="#8a6d1f" stroke-width="1.6"/>
<text x="64.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d1f" text-anchor="start" font-weight="700">1960  ·  ALGOL 60</text>
<text x="64.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="64.0" dy="0.0">Дейкстра вживає слово «стек» —</tspan><tspan x="64.0" dy="15.5">і воно витісняє «pushdown store»</tspan></text>
<rect x="50.0" y="396.0" width="420.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="64.0" y="417.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Але</text>
<text x="64.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="64.0" dy="0.0">нікому не спадає питання:</tspan><tspan x="64.0" dy="15.5">ЯКИЙ КЛАС МОВ бере машина зі стеком?</tspan></text>
<rect x="570.0" y="150.0" width="420.0" height="66.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="584.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">1956  ·  Хомський</text>
<text x="584.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="584.0" dy="0.0">скінченні стани не описують мови;</tspan><tspan x="584.0" dy="15.5">потрібні сильніші граматики</tspan></text>
<rect x="570.0" y="232.0" width="420.0" height="66.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="584.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">1959  ·  Хомський</text>
<text x="584.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="584.0" dy="0.0">чотири типи граматик; для типу 2</tspan><tspan x="584.0" dy="15.5">МАШИНИ НЕМАЄ — сама лише граматика</tspan></text>
<rect x="570.0" y="314.0" width="420.0" height="66.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="584.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">1960/61  ·  Оттінґер</text>
<text x="584.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="584.0" dy="0.0">розбираючи російську, кладе</tspan><tspan x="584.0" dy="15.5">ВІДКЛАДЕНІ ПЕРЕДБАЧЕННЯ на «pushdown store»</tspan></text>
<rect x="570.0" y="396.0" width="420.0" height="66.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
<text x="584.0" y="417.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Але</text>
<text x="584.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="584.0" dy="0.0">це метод розбору, а не теорема:</tspan><tspan x="584.0" dy="15.5">що саме бере ця машина — не сказано</tspan></text>
<line x1="260.0" y1="466.0" x2="390.0" y2="508.0" stroke="#8a6d1f" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="780.0" y1="466.0" x2="650.0" y2="508.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="170.0" y="514.0" width="700.0" height="76.0" rx="6" fill="#e8f6ed" stroke="#27ae60" stroke-width="2.4"/>
<text x="520.0" y="540.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">1962  ·  Хомський:  граматика типу 2  ⇄  магазинна пам'ять</text>
<text x="520.0" y="566.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">1963 — те саме незалежно доводить Іві; того ж року Шютценберже бере детерміновану гілку</text>
<text x="520.0" y="583.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">нічого нового не збудовано — виявлено, що дві нитки тримали ОДИН предмет</text>
<rect x="170.0" y="606.0" width="700.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="520.0" y="626.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1966  ·  ALPAC: фінансування машинного перекладу згорнуто</text>
<text x="520.0" y="643.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">питання вмирає — машина, знайдена по дорозі, лишається назавжди</text>
<text x="520.0" y="676.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Стек був старий і чужий теорії; клас мов був описаний і безмашинний. Відкриттям стала не деталь, а рівність.</text>
</svg>