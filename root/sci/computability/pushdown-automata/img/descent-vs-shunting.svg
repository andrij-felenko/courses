<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1060" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна машина, дві подоби: явний стек і стек викликів</text>
<text x="530.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">той самий момент розбору  2 * ( 3 + ( 4 − 1 ) )  —  щойно прочитано 1</text>
<rect x="40.0" y="88.0" width="440.0" height="452.0" rx="10" fill="#fcfdfe" stroke="#dfe4ea" stroke-width="1.5"/>
<text x="260.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сортувальна станція</text>
<text x="260.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">стек операторів — наш власний масив</text>
<rect x="224.0" y="430.0" width="72.0" height="40.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="260.0" y="455.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">*</tspan></text><rect x="224.0" y="390.0" width="72.0" height="40.0" rx="3" fill="#fdf4dd" stroke="#8a6d1f" stroke-width="1.6"/><text x="260.0" y="415.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">(</tspan></text><rect x="224.0" y="350.0" width="72.0" height="40.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="260.0" y="375.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">+</tspan></text><rect x="224.0" y="310.0" width="72.0" height="40.0" rx="3" fill="#fdf4dd" stroke="#8a6d1f" stroke-width="1.6"/><text x="260.0" y="335.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">(</tspan></text><rect x="224.0" y="270.0" width="72.0" height="40.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="260.0" y="295.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">−</tspan></text>
<line x1="200.0" y1="470.0" x2="320.0" y2="470.0" stroke="#cfd4da" stroke-width="1.6"/>
<text x="260.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">глибина 5 — вкладеність видно очима</text>
<text x="260.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">вершина</text>
<rect x="580.0" y="88.0" width="440.0" height="452.0" rx="10" fill="#fcfdfe" stroke="#dfe4ea" stroke-width="1.5"/>
<text x="800.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Рекурсивний спуск</text>
<text x="800.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">стек кадрів — його веде сама мова</text>
<rect x="655.0" y="430.0" width="290.0" height="40.0" rx="3" fill="#e9eefb" stroke="#2457d6" stroke-width="1.6"/><text x="800.0" y="454.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">expr «2*(3+(4−1))»</tspan></text><rect x="655.0" y="390.0" width="290.0" height="40.0" rx="3" fill="#fdf4dd" stroke="#8a6d1f" stroke-width="1.6"/><text x="800.0" y="414.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">factor бачить (</tspan></text><rect x="655.0" y="350.0" width="290.0" height="40.0" rx="3" fill="#e9eefb" stroke="#2457d6" stroke-width="1.6"/><text x="800.0" y="374.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">expr «3+(4−1)»</tspan></text><rect x="655.0" y="310.0" width="290.0" height="40.0" rx="3" fill="#fdf4dd" stroke="#8a6d1f" stroke-width="1.6"/><text x="800.0" y="334.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">factor бачить (</tspan></text><rect x="655.0" y="270.0" width="290.0" height="40.0" rx="3" fill="#e9eefb" stroke="#2457d6" stroke-width="1.6"/><text x="800.0" y="294.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">expr «4−1»</tspan></text>
<line x1="640.0" y1="470.0" x2="960.0" y2="470.0" stroke="#cfd4da" stroke-width="1.6"/>
<text x="800.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">глибина 5 — та сама, лише не наша</text>
<text x="800.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">поточний виклик</text>
<text x="800.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(кадри term/factor між рівнями опущено)</text>
<line x1="360.0" y1="300.0" x2="630.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="500.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">та сама LIFO-дисципліна</text>
<text x="530.0" y="562.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Вкладеність не зникає, коли стек прибрати з коду, — вона просто переїжджає в стек викликів.</text>
</svg>