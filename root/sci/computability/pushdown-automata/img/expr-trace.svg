<rect x="138.0" y="92.0" width="460.0" height="34.0" rx="4" fill="#eef2f7" stroke="#c9d2dc" stroke-width="1.4"/>
<rect x="608.0" y="92.0" width="200.0" height="34.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<rect x="818.0" y="92.0" width="172.0" height="34.0" rx="4" fill="#e9eefb" stroke="#2457d6" stroke-width="1.4"/>
<text x="89.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">лексема</text>
<text x="368.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">що робить машина</text>
<text x="708.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">стек операторів</text>
