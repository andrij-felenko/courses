<text x="152.0" y="493.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">число</text>
<text x="708.0" y="493.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">−</text>
<text x="904.0" y="493.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">14 · 1</text>
<line x1="50.0" y1="507.0" x2="990.0" y2="507.0" stroke="#eceff3" stroke-width="1.0"/>
<rect x="50.0" y="510.0" width="940.0" height="36.0" rx="5" fill="#fbfcfe" stroke="#27ae60" stroke-width="1.6"/>
<text x="89.0" y="535.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">⊣</text>
<text x="152.0" y="535.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">вхід скінчився → доганяємо все: 14 − 1 = 13</text>
<text x="708.0" y="535.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">—</text>
<text x="904.0" y="535.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">13</text>
<text x="520.0" y="540.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Робота лягає на стек рівно тоді, коли її ще не можна зробити, і сходить рівно тоді, коли вже можна.</text>
</svg>