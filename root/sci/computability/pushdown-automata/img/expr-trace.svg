<text x="152.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">число</text>
<text x="708.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">* ( +</text>
<text x="904.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">2 · 3 · 4</text>
<line x1="50.0" y1="381.0" x2="990.0" y2="381.0" stroke="#eceff3" stroke-width="1.0"/>
<rect x="50.0" y="384.0" width="940.0" height="36.0" rx="5" fill="#fbfcfe" stroke="#8a6d1f" stroke-width="1.6"/>
<text x="89.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">)</text>
<text x="152.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">згортаємо до бар'єра: 3 + 4 = 7, бар'єр знімаємо</text>
<text x="708.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">*</text>
<text x="904.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">2 · 7</text>
<rect x="50.0" y="426.0" width="940.0" height="36.0" rx="5" fill="#fbfcfe" stroke="#c0392b" stroke-width="1.6"/>
<text x="89.0" y="451.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">−</text>
<text x="152.0" y="451.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">зверху * — сильніше → спрацьовує: 2 * 7 = 14</text>
<text x="708.0" y="451.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">−</text>
<text x="904.0" y="451.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">14</text>
