<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формування розрізнювача D з натуральної властивості Pₙ</text>
<rect x="10.0" y="10.0" width="920.0" height="400.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="470.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Парадокс природних доведень (Розрізнювач на основі властивості Pₙ)</text>
<rect x="40.0" y="70.0" width="400.0" height="280.0" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2.0"/>
<text x="240.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">Простір усіх функцій Fₙ (2²ⁿ функцій)</text>
<rect x="65.0" y="125.0" width="350.0" height="90.0" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="2.0"/>
<text x="240.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#059669" text-anchor="middle" font-weight="700">Множина виходів PRG G(s)</text>
<text x="240.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">Обчислюються МАЛИМИ схемами Size ≤ S(n)</text>
<text x="240.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">Не мають властивості Pₙ (Корисність Pₙ)</text>
<rect x="65.0" y="235.0" width="350.0" height="95.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2.0"/>
<text x="240.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">Натуральна властивість Pₙ</text>
<text x="240.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">1. Конструктивність: Pₙ(f) обчислювана за poly(2ⁿ)</text>
<text x="240.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">2. Великість: Pr_f[Pₙ(f) = 1] ≥ 1/poly(n)</text>
<line x1="455.0" y1="210.0" x2="515.0" y2="210.0" stroke="#dc2626" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="485.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">Перетворення</text>
<rect x="540.0" y="70.0" width="360.0" height="280.0" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2.0"/>
<text x="720.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">Ефективний розрізнювач D_Pₙ</text>
<rect x="560.0" y="120.0" width="320.0" height="210.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle"><tspan x="720.0" dy="0.0">Алгоритм D_Pₙ(w):</tspan><tspan x="720.0" dy="15.6">1. Інтерпретує рядок w довжини 2ⁿ</tspan><tspan x="720.0" dy="15.6">   як таблицю істинності функції f_w.</tspan><tspan x="720.0" dy="15.6">2. Обчислює знаменник Pₙ(f_w).</tspan><tspan x="720.0" dy="15.6">3. Якщо Pₙ(f_w) = 1, повертає 1 (Хаос).</tspan><tspan x="720.0" dy="15.6">4. Якщо Pₙ(f_w) = 0, повертає 0 (PRG).</tspan><tspan x="720.0" dy="15.6"></tspan><tspan x="720.0" dy="15.6">Результат: Розрізняє G(s) від r з</tspan><tspan x="720.0" dy="15.6">перевагою Adv ≥ 1/poly(n) - 0!</tspan><tspan x="720.0" dy="15.6">Це ЛАМАЄ стійкість PRG!</tspan></text>
<rect x="106.9" y="368.0" width="726.2" height="24.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="470.0" y="384.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Суперечність: Стійкий PRG існує  ⇒  Природне доведення P ≠ NP НЕ ІСНУЄ для загальних схем P/poly</tspan></text>
</svg>