<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 906 524" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="906" height="524" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="453.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вхід подвоївся — що робить робота?</text>
<rect x="30.0" y="70.0" width="180.0" height="54.0" rx="6" fill="#eef2f8" stroke="#c2cad4" stroke-width="1.3"/>
<text x="120.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">клас</text>
<rect x="218.0" y="70.0" width="348.0" height="54.0" rx="6" fill="#eef2f8" stroke="#c2cad4" stroke-width="1.3"/>
<text x="392.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">вхід подвоюється  →  робота</text>
<rect x="574.0" y="70.0" width="300.0" height="54.0" rx="6" fill="#eef2f8" stroke="#c2cad4" stroke-width="1.3"/>
<text x="724.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">практичний присуд</text>
<rect x="30.0" y="124.0" width="180.0" height="54.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.2"/>
<line x1="44.0" y1="151.0" x2="70.0" y2="151.0" stroke="#27ae60" stroke-width="3.4"/>
<text x="80.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">O(1)</text>
<rect x="218.0" y="124.0" width="348.0" height="54.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="392.0" y="155.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="392.0" dy="0.0">без змін  (×1)</tspan></text>
<rect x="574.0" y="124.0" width="300.0" height="54.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="724.0" y="155.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="724.0" dy="0.0">миттєво, байдуже до n</tspan></text>
<rect x="30.0" y="178.0" width="180.0" height="54.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.2"/>
<line x1="44.0" y1="205.0" x2="70.0" y2="205.0" stroke="#2457d6" stroke-width="3.4"/>
<text x="80.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">O(log n)</text>
<rect x="218.0" y="178.0" width="348.0" height="54.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="392.0" y="209.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="392.0" dy="0.0">+1 крок</tspan></text>
<rect x="574.0" y="178.0" width="300.0" height="54.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="724.0" y="209.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="724.0" dy="0.0">ідеально масштабується</tspan></text>
<rect x="30.0" y="232.0" width="180.0" height="54.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.2"/>
<line x1="44.0" y1="259.0" x2="70.0" y2="259.0" stroke="#0e9aa7" stroke-width="3.4"/>
<text x="80.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">O(n)</text>
<rect x="218.0" y="232.0" width="348.0" height="54.0" rx="6" fill="#eef2f8" stroke="#aab4c0" stroke-width="1.5"/><text x="392.0" y="263.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="392.0" dy="0.0">×2</tspan></text>
<rect x="574.0" y="232.0" width="300.0" height="54.0" rx="6" fill="#eef2f8" stroke="#aab4c0" stroke-width="1.5"/><text x="724.0" y="263.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="724.0" dy="0.0">чесно, лінійно</tspan></text>
<rect x="30.0" y="286.0" width="180.0" height="54.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.2"/>
<line x1="44.0" y1="313.0" x2="70.0" y2="313.0" stroke="#8e44ad" stroke-width="3.4"/>
<text x="80.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">O(n log n)</text>
<rect x="218.0" y="286.0" width="348.0" height="54.0" rx="6" fill="#eef2f8" stroke="#aab4c0" stroke-width="1.5"/><text x="392.0" y="317.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="392.0" dy="0.0">трохи більше за ×2</tspan></text>
<rect x="574.0" y="286.0" width="300.0" height="54.0" rx="6" fill="#eef2f8" stroke="#aab4c0" stroke-width="1.5"/><text x="724.0" y="317.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="724.0" dy="0.0">майже лінійно — дуже добре</tspan></text>
<rect x="30.0" y="340.0" width="180.0" height="54.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.2"/>
<line x1="44.0" y1="367.0" x2="70.0" y2="367.0" stroke="#e08a1e" stroke-width="3.4"/>
<text x="80.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">O(n²)</text>
<rect x="218.0" y="340.0" width="348.0" height="54.0" rx="6" fill="#fdf2e6" stroke="#e08a1e" stroke-width="1.5"/><text x="392.0" y="371.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="392.0" dy="0.0">×4</tspan></text>
<rect x="574.0" y="340.0" width="300.0" height="54.0" rx="6" fill="#fdf2e6" stroke="#e08a1e" stroke-width="1.5"/><text x="724.0" y="371.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="724.0" dy="0.0">боляче на великих n</tspan></text>
<rect x="30.0" y="394.0" width="180.0" height="54.0" rx="6" fill="#ffffff" stroke="#dfe4ea" stroke-width="1.2"/>
<line x1="44.0" y1="421.0" x2="70.0" y2="421.0" stroke="#c0392b" stroke-width="3.4"/>
<text x="80.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">O(2ⁿ)</text>
<rect x="218.0" y="394.0" width="348.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="392.0" y="425.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="392.0" dy="0.0">підноситься у квадрат  (T→T²)</tspan></text>
<rect x="574.0" y="394.0" width="300.0" height="54.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="724.0" y="425.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="724.0" dy="0.0">нежиттєздатно поза малими n</tspan></text>
<rect x="30.0" y="458.0" width="844.0" height="40.0" rx="6" fill="#fff6e6" stroke="#e08a1e" stroke-width="1.5"/><text x="452.0" y="482.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="452.0" dy="0.0">той самий клас — та сама реакція на будь-якому залізі: подвоєння входу не питає, який у тебе процесор</tspan></text>
</svg>