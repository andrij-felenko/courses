<line x1="90.0" y1="320.0" x2="700.0" y2="320.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="706.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">час</text>
<text x="84.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">потужність</text>
<rect x="130.0" y="276.0" width="250.0" height="44.0" rx="0" fill="#e7f0e0" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="255.0" y="266.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">накопичення: довго, мала потужність</text>
<rect x="470.0" y="100.0" width="24.0" height="220.0" rx="0" fill="#fdeded" stroke="#c0271e" stroke-width="1.8"/>
<text x="560.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">обрив: мить,</text>
<text x="560.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">величезна потужність</text>
<text x="482.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(та сама площа)</text>
<rect x="60.0" y="342.0" width="640.0" height="26.0" rx="8" fill="#fdeded" stroke="#c0271e" stroke-width="1.4"/>
<text x="380.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідси іскра на вимикачі й сплеск, що пробиває ключ — приборкання в §8.5.</text>
