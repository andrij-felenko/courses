<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ЕМ-хвиля летить крізь ПОРОЖНЕЧУ — середовище не потрібне</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">поля самі собі «середовище»; саме тому світло Сонця й радіо долають порожній космос</text>
