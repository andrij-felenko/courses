<text x="430.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">крізь порожній космос (вакуум)</text>
<circle cx="720.0" cy="180.0" r="34.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="720.0" y="184.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">Земля</text>
<rect x="60.0" y="250.0" width="780.0" height="80.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Це була найрадикальніша частина теорії: хвиля без жодного дроту чи речовини між точками.</text>
<text x="450.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Для радіо це означає: сигнал летить простором сам, а «повітря» лише трохи його послаблює.</text>
<text x="450.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(Звук так не вміє — у вакуумі його нема; ЕМ-хвиля вміє.)</text>
</svg>
