<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
<rect width="900" height="340" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому хвиля не згасає: E і B підхоплюють одне одного</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">змінне E творить B попереду, змінне B творить E ще далі — і так хвиля «крокує» сама</text>
<circle cx="130.0" cy="180.0" r="30.0" fill="#fbecec" stroke="#c0271e" stroke-width="2"/>
<text x="130.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">E</text>
<line x1="162.0" y1="180.0" x2="238.0" y2="180.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="200.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">творить</text>
<circle cx="270.0" cy="180.0" r="30.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="270.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">B</text>
<line x1="302.0" y1="180.0" x2="378.0" y2="180.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="340.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">творить</text>
<circle cx="410.0" cy="180.0" r="30.0" fill="#fbecec" stroke="#c0271e" stroke-width="2"/>
<text x="410.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">E</text>
<line x1="442.0" y1="180.0" x2="518.0" y2="180.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="480.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">творить</text>
<circle cx="550.0" cy="180.0" r="30.0" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="550.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">B</text>
<line x1="582.0" y1="180.0" x2="658.0" y2="180.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="620.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">творить</text>
<circle cx="690.0" cy="180.0" r="30.0" fill="#fbecec" stroke="#c0271e" stroke-width="2"/>
<text x="690.0" y="185.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">E</text>
<line x1="130.0" y1="240.0" x2="770.0" y2="240.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<text x="450.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">хвиля рухається вперед зі швидкістю світла</text>
<rect x="60.0" y="282.0" width="780.0" height="50.0" rx="10" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="450.0" y="307.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Жодного середовища не треба: поля самі себе несуть. Енергію передає сама хвиля.</text>
<text x="450.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(Це той самий механізм Максвелла, тепер як рушій руху хвилі.)</text>
</svg>
