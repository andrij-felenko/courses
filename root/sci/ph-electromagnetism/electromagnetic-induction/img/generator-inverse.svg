<text x="460.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Генератор — це «мотор навпаки»: те саме залізо, обернений потік енергії</text>
<rect x="40.0" y="80.0" width="380.0" height="220.0" rx="12" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2.0"/>
<text x="230.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">МОТОР</text>
<text x="230.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(сила Ампера, §1.8.7)</text>
<line x1="70.0" y1="200.0" x2="150.0" y2="200.0" stroke="#e08030" stroke-width="3" marker-end="url(#aOrange)"/>
