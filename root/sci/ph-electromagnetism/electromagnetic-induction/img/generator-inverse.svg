<text x="795.0" y="188.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">струм</text>
<text x="690.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">рух → електрика</text>
<text x="460.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">⇄</text>
<text x="460.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Та сама обмотка в полі: подаси струм — крутиться (мотор); крутиш — дає струм (генератор). Дві сторони однієї фізики.</text>
