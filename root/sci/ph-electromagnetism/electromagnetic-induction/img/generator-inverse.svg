<text x="230.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">електрика → рух</text>
<rect x="500.0" y="80.0" width="380.0" height="220.0" rx="12" fill="#eef2fb" stroke="#1f47b5" stroke-width="2.0"/>
<text x="690.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">ГЕНЕРАТОР</text>
<text x="690.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(індукція, §1.8.10)</text>
<line x1="570.0" y1="200.0" x2="530.0" y2="200.0" stroke="#7a3fb0" stroke-width="3" marker-end="url(#aPurple)"/>
