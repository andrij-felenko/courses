<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 840 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="840" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="820.0" height="480.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири фундаментальні рівняння Максвелла в диференціальній формі</text>
<rect x="30.0" y="55.0" width="365.0" height="185.0" rx="8" fill="#f0f4ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="45.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">1. Закон Гаусса для електричного поля</text>
<rect x="45.0" y="95.0" width="335.0" height="42.0" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="212.5" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">∇ · E = ρ / ε₀</text>
<rect x="45.0" y="147.0" width="335.0" height="85.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="212.5" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Джерелом електричного поля є електричний заряд.</tspan><tspan x="212.5" dy="14.3">Лінії полів починаються на позитивних</tspan><tspan x="212.5" dy="14.3">і закінчуються на негативних зарядах.</tspan></text>
<rect x="425.0" y="55.0" width="365.0" height="185.0" rx="8" fill="#fff5f5" stroke="#c0392b" stroke-width="1.8"/>
<text x="440.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">2. Закон Гаусса для магнітного поля</text>
<rect x="440.0" y="95.0" width="335.0" height="42.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="607.5" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">∇ · B = 0</text>
<rect x="440.0" y="147.0" width="335.0" height="85.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="607.5" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="607.5" dy="0.0">У природі відсутні магнітні монополі.</tspan><tspan x="607.5" dy="14.3">Лінії магнітної індукції завжди замкнені</tspan><tspan x="607.5" dy="14.3">й не мають джерел або стоків.</tspan></text>
<rect x="30.0" y="260.0" width="365.0" height="195.0" rx="8" fill="#fcf4ff" stroke="#8e44ad" stroke-width="1.8"/>
<text x="45.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="start" font-weight="700">3. Закон електромагнітної індукції Фарадея</text>
<rect x="45.0" y="300.0" width="335.0" height="42.0" rx="5" fill="#ffffff" stroke="#8e44ad" stroke-width="1.2"/>
<text x="212.5" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">∇ × E = -∂B / ∂t</text>
<rect x="45.0" y="352.0" width="335.0" height="95.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="212.5" y="389.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Зміна магнітного поля у часі породжує</tspan><tspan x="212.5" dy="14.3">вихрове електричне поле. Основа роботи</tspan><tspan x="212.5" dy="14.3">генераторів та трансформаторів.</tspan></text>
<rect x="425.0" y="260.0" width="365.0" height="195.0" rx="8" fill="#f0fff4" stroke="#27ae60" stroke-width="1.8"/>
<text x="440.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">4. Закон Ампера — Максвелла</text>
<rect x="440.0" y="300.0" width="335.0" height="42.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="607.5" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">∇ × H = J + ∂D / ∂t</text>
<rect x="440.0" y="352.0" width="335.0" height="95.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="607.5" y="389.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="607.5" dy="0.0">Вихрове магнітне поле створюється як струмом</tspan><tspan x="607.5" dy="14.3">провідності J, так і струмом зміщення ∂D/∂t</tspan><tspan x="607.5" dy="14.3">(зміною електричного поля).</tspan></text>
</svg>