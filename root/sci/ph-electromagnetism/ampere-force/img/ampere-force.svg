<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430">
<rect width="920" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
  <marker id="aPurple" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#7a3fb0"/></marker>
  <marker id="aCopper" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#cf8b5e"/></marker>
</defs>
<text x="460.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Поле штовхає провідник зі струмом: сила Ампера F = B·I·L</text>
<text x="460.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">дріт зі струмом — це його власні кільця поля; зовнішнє поле з одного боку додається, з іншого — гаситься, і дріт «здуває»</text>
<rect x="120.0" y="110.0" width="60.0" height="80.0" rx="4" fill="#fbe3e1" stroke="#c0271e" stroke-width="2.0"/>
<text x="150.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">N</text>
<rect x="120.0" y="290.0" width="60.0" height="80.0" rx="4" fill="#e2e9f7" stroke="#1f47b5" stroke-width="2.0"/>
<text x="150.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">S</text>
<line x1="220.0" y1="200.0" x2="220.0" y2="280.0" stroke="#1f8a3b" stroke-width="1.8" marker-end="url(#aGreen)"/>
<line x1="280.0" y1="200.0" x2="280.0" y2="280.0" stroke="#1f8a3b" stroke-width="1.8" marker-end="url(#aGreen)"/>
<line x1="340.0" y1="200.0" x2="340.0" y2="280.0" stroke="#1f8a3b" stroke-width="1.8" marker-end="url(#aGreen)"/>
<line x1="400.0" y1="200.0" x2="400.0" y2="280.0" stroke="#1f8a3b" stroke-width="1.8" marker-end="url(#aGreen)"/>
<line x1="460.0" y1="200.0" x2="460.0" y2="280.0" stroke="#1f8a3b" stroke-width="1.8" marker-end="url(#aGreen)"/>
<text x="490.0" y="244.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">B (униз)</text>
<circle cx="340.0" cy="240.0" r="14.0" fill="#ffffff" stroke="#e08030" stroke-width="3"/>
<circle cx="340.0" cy="240.0" r="2.4" fill="#e08030" stroke="#e08030" stroke-width="1"/>
<text x="340.0" y="215.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">I (на нас)</text>
<line x1="340.0" y1="240.0" x2="250.0" y2="240.0" stroke="#7a3fb0" stroke-width="4" marker-end="url(#aPurple)"/>
<text x="255.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#7a3fb0" text-anchor="middle" font-weight="bold" font-style="italic">F = B·I·L</text>
<rect x="620.0" y="110.0" width="280.0" height="240.0" rx="10" fill="#fafafa" stroke="#8a8a8a" stroke-width="1.4"/>
<text x="760.0" y="134.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">правило правої руки (взаємно перпендикулярні)</text>
<line x1="720.0" y1="230.0" x2="810.0" y2="230.0" stroke="#e08030" stroke-width="3" marker-end="url(#aOrange)"/>
<text x="816.0" y="234.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#e08030" text-anchor="start" font-weight="bold" font-style="normal">I (струм)</text>
<line x1="720.0" y1="230.0" x2="720.0" y2="310.0" stroke="#1f8a3b" stroke-width="3" marker-end="url(#aGreen)"/>
<text x="724.0" y="322.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">B (поле)</text>
<line x1="720.0" y1="230.0" x2="656.0" y2="174.0" stroke="#7a3fb0" stroke-width="3" marker-end="url(#aPurple)"/>
<text x="650.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#7a3fb0" text-anchor="end" font-weight="bold" font-style="normal">F (сила)</text>
<text x="760.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">F ⟂ і до I, і до B</text>
<text x="460.0" y="416.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Сила максимальна, коли струм перпендикулярний полю; уздовж поля (I ∥ B) сили немає зовсім.</text>
</svg>
