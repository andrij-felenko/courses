<line x1="145.0" y1="280.0" x2="775.0" y2="280.0" stroke="#1f8a3b" stroke-width="1.5" marker-end="url(#aGreen)"/>
<text x="460.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">B →</text>
<rect x="380.0" y="160.0" width="160.0" height="120.0" rx="0" fill="none" stroke="#e08030" stroke-width="3.0"/>
<line x1="380.0" y1="280.0" x2="380.0" y2="160.0" stroke="#e08030" stroke-width="3" marker-end="url(#aOrange)"/>
<line x1="540.0" y1="160.0" x2="540.0" y2="280.0" stroke="#e08030" stroke-width="3" marker-end="url(#aOrange)"/>
<text x="352.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">I↑</text>
<text x="564.0" y="220.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">I↓</text>
<line x1="380.0" y1="220.0" x2="380.0" y2="130.0" stroke="#7a3fb0" stroke-width="3.5" marker-end="url(#aPurple)"/>
<text x="380.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#7a3fb0" text-anchor="middle" font-weight="bold" font-style="italic">F</text>
<line x1="540.0" y1="220.0" x2="540.0" y2="310.0" stroke="#7a3fb0" stroke-width="3.5" marker-end="url(#aPurple)"/>
<text x="540.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#7a3fb0" text-anchor="middle" font-weight="bold" font-style="italic">F</text>
<path d="M 356.6 182.4 A 110.0 110.0 0 0 1 563.4 182.4" fill="none" stroke="#1b1b1b" stroke-width="2.0" marker-end="url(#aInk)"/>
<text x="460.0" y="360.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">пара сил → момент M = B·I·A·N (обертає рамку)</text>
<text x="460.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Додай багато витків і колектор, що перемикає струм, — і рамка крутитиметься безперервно (це вже Модуль про мотори).</text>
</svg>
