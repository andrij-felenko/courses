  <marker id="aCopper" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#cf8b5e"/></marker>
</defs>
<text x="460.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві сторони рамки — дві протилежні сили — обертальний момент</text>
<text x="460.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">у полі один бік рамки штовхає вгору, протилежний — вниз; пара сил крутить рамку — це фізична основа мотора</text>
<rect x="90.0" y="130.0" width="50.0" height="160.0" rx="4" fill="#fbe3e1" stroke="#c0271e" stroke-width="2.0"/>
<text x="115.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">N</text>
<rect x="780.0" y="130.0" width="50.0" height="160.0" rx="4" fill="#e2e9f7" stroke="#1f47b5" stroke-width="2.0"/>
<text x="805.0" y="218.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">S</text>
<line x1="145.0" y1="160.0" x2="775.0" y2="160.0" stroke="#1f8a3b" stroke-width="1.5" marker-end="url(#aGreen)"/>
<line x1="145.0" y1="200.0" x2="775.0" y2="200.0" stroke="#1f8a3b" stroke-width="1.5" marker-end="url(#aGreen)"/>
