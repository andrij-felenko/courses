<text x="220.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6B21A8" text-anchor="middle" font-weight="700">Додатна корона (+ на вістрі)</text>
<circle cx="220.0" cy="160.0" r="20.0" fill="#EF4444" stroke="#B91C1C" stroke-width="2.0"/>
<text x="220.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">+HV</text>
<circle cx="220" cy="160" r="50" fill="none" stroke="#A855F7" stroke-width="2.5" opacity="0.7"/>
<line x1="150.0" y1="160.0" x2="195.0" y2="160.0" stroke="#DC2626" stroke-width="2.0"/>
<line x1="290.0" y1="160.0" x2="245.0" y2="160.0" stroke="#DC2626" stroke-width="2.0"/>
<text x="140.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#DC2626" text-anchor="middle" font-weight="700">e⁻</text>
<text x="300.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#DC2626" text-anchor="middle" font-weight="700">e⁻</text>
<rect x="45.0" y="250.0" width="345.0" height="160.0" rx="6" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1.5"/><text x="217.5" y="307.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#4C1D95" text-anchor="middle"><tspan x="217.5" dy="0.0">• Електрони втягуються до анода</tspan><tspan x="217.5" dy="13.0">• Фотоіонізація газу створює нові носії</tspan><tspan x="217.5" dy="13.0">• Рівномірне м'яке фіолетове сяйво</tspan><tspan x="217.5" dy="13.0">• Дрейф додатних іонів (O₂⁺, N₂⁺) до землі</tspan><tspan x="217.5" dy="13.0">• Низький рівень високочастотних завад</tspan></text>
<rect x="435.0" y="60.0" width="375.0" height="370.0" rx="6" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
<text x="620.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1E40AF" text-anchor="middle" font-weight="700">Від'ємна корона (− на вістрі)</text>
<circle cx="620.0" cy="160.0" r="20.0" fill="#2563EB" stroke="#1D4ED8" stroke-width="2.0"/>
<text x="620.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700">−HV</text>
<circle cx="620" cy="160" r="50" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="645.0" y1="160.0" x2="690.0" y2="160.0" stroke="#2563EB" stroke-width="2.0"/>
<circle cx="695.0" cy="160.0" r="8.0" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.0"/>
<text x="695.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1E40AF" text-anchor="middle" font-weight="700">O₂⁻</text>
<rect x="450.0" y="250.0" width="345.0" height="160.0" rx="6" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/><text x="622.5" y="307.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1E3A8A" text-anchor="middle"><tspan x="622.5" dy="0.0">• Електрони вибиваються з катода і вилітають</tspan><tspan x="622.5" dy="13.0">• Приєднання: e⁻ + O₂ → O₂⁻ (від'ємні іони)</tspan><tspan x="622.5" dy="13.0">• Переривчасті імпульси Трічеля (100 кГц–1 МГц)</tspan><tspan x="622.5" dy="13.0">• Плямисте сяйво (коронні намистини)</tspan><tspan x="622.5" dy="13.0">• Більший вихід озону O₃ та радіозавад</tspan></text>
</svg>