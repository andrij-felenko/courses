<polyline points="826.0,192.0 828.2,214.4 829.4,236.8 815.6,258.6 824.7,281.2 818.9,303.3 825.3,325.9 820.0,348.0" fill="none" stroke="#ffd27a" stroke-width="2.0"/>
<line x1="860.0" y1="320.0" x2="844.0" y2="230.0" stroke="#c0271e" stroke-width="2.6" marker-end="url(#aRed)"/>
<text x="866.0" y="290.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">струм
угору</text>
<line x1="296.0" y1="230.0" x2="386.0" y2="230.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<line x1="616.0" y1="230.0" x2="706.0" y2="230.0" stroke="#1b1b1b" stroke-width="2.4" marker-end="url(#aInk)"/>
<text x="470.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Те, що ми бачимо як спалах, — це зворотний удар: розряд того самого «хмара ↔ земля» конденсатора з Рис. 1.10.4.1.</text>
<text x="470.0" y="426.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">Блискавка й іскра з пальця — одне явище: пробій повітря (§1.10.3). Різниця лише в запасеному заряді й енергії.</text>
</svg>
