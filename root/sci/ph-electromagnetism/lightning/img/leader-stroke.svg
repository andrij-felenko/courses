(тьмяний)</text>
<rect x="390.0" y="80.0" width="220.0" height="300.0" rx="12" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="500.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2. Зустрічний стример</text>
<text x="500.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">із землі (вістря, дерева)</text>
<text x="500.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">росте назустріч +канал</text>
