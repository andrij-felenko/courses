<line x1="172.0" y1="188.0" x2="182.0" y2="188.0" stroke="#1f47b5" stroke-width="2.6" stroke-linecap="round"/>
<rect x="80.0" y="348.0" width="200.0" height="16.0" rx="0" fill="#e9e2d4" stroke="#1b1b1b" stroke-width="1.6"/>
