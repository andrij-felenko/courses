<line x1="510.0" y1="333.0" x2="510.0" y2="343.0" stroke="#c0271e" stroke-width="2.6" stroke-linecap="round"/>
<text x="522.0" y="344.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">+ із землі</text>
<rect x="710.0" y="80.0" width="220.0" height="300.0" rx="12" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="820.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">3. Зворотний удар</text>
<text x="820.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">канал замкнувся — нагору б'є</text>
<text x="820.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">яскравий струм (десятки кА)</text>
<path d="M 740 168 q 20 -26 55 -14 q 28 -22 55 -2 q 26 -6 22 20 L 760 192 q -28 0 -20 -24 Z" fill="#eef2fb" stroke="#1f47b5" stroke-width="1.4"/>
