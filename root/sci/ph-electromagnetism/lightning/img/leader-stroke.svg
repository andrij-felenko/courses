<text x="470.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Стадії удару: ступінчастий лідер вниз — і яскравий зворотний удар угору</text>
<text x="470.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">слабкий канал намацує шлях сходинками; коли він торкається землі, нагору б'є головний струм</text>
<rect x="70.0" y="80.0" width="220.0" height="300.0" rx="12" fill="#fcfcfc" stroke="#e4e4e4" stroke-width="1.6"/>
<text x="180.0" y="104.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1. Ступінчастий лідер</text>
<text x="180.0" y="122.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">тьмяний канal намацує шлях</text>
<text x="180.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">сходинками вниз (≈50 м)</text>
<path d="M 100 168 q 20 -26 55 -14 q 28 -22 55 -2 q 26 -6 22 20 L 120 192 q -28 0 -20 -24 Z" fill="#eef2fb" stroke="#1f47b5" stroke-width="1.4"/>
