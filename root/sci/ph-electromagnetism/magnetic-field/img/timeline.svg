<text x="490.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Дві тисячі років компаса: довга тиша між каменем і струмом</text>
<text x="490.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">магнітний камінь знали тисячоліттями — але зв'язок із електрикою відкрився лише 1820 року</text>
<line x1="70.0" y1="250.0" x2="910.0" y2="250.0" stroke="#1b1b1b" stroke-width="2.2" stroke-linecap="round"/>
<polygon points="910.0,250.0 896.0,244.0 896.0,256.0" fill="#1b1b1b" stroke="none" stroke-width="0"/>
