<text x="107.8" y="171.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-style="normal">~600 до н.е.</text>
<text x="107.8" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Греція: Фалес</text>
<text x="107.8" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">магнітний камінь притягує</text>
<circle cx="208.6" cy="250.0" r="6.5" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
