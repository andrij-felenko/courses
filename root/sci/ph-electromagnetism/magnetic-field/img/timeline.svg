<circle cx="107.8" cy="250.0" r="6.5" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1"/>
<line x1="107.8" y1="244.0" x2="107.8" y2="210.0" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="4,3" stroke-linecap="round"/>
