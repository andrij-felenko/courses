<rect x="790.0" y="154.0" width="156.0" height="52.0" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="1.5"/>
<text x="868.0" y="171.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1820</text>
<text x="868.0" y="187.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ганс Ерстед</text>
<text x="868.0" y="201.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">СТРУМ хитає стрілку</text>
