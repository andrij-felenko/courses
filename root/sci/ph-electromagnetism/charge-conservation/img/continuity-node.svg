<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="640" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="640.0" height="320.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="320.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вузол: що втекло — те й витекло</text>
<circle cx="320.0" cy="166.0" r="9.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<line x1="70.0" y1="96.0" x2="311.0" y2="157.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="70.0" y1="236.0" x2="311.0" y2="175.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="329.0" y1="157.0" x2="570.0" y2="96.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="329.0" y1="175.0" x2="570.0" y2="236.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="90.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">I₁</text>
<text x="90.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700">I₂</text>
<text x="550.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="end" font-weight="700">I₃</text>
<text x="550.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="end" font-weight="700">I₄</text>
<text x="120.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">втікає</text>
<text x="520.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">витікає</text>
<rect x="231.9" y="277.5" width="176.1" height="33.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/><text x="320.0" y="299.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="320.0" dy="0.0">I₁ + I₂ = I₃ + I₄</tspan></text>
<text x="320.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">заряд у вузлі не накопичується й не зникає</text>
</svg>