<text x="185.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Потік Φ</text>
<rect x="373.2" y="90.9" width="333.5" height="88.2" rx="6" fill="#fffef0" stroke="#ffe066" stroke-width="1.4"/><text x="540.0" y="110.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">РОЗПОДІЛ МАГНІТНОГО ОПОРУ:</tspan><tspan x="540.0" dy="14.3">• Rm_core = l_core / (μ0 · μr · A)</tspan><tspan x="540.0" dy="14.3">• Rm_gap  = lg / (μ0 · A_eff)</tspan><tspan x="540.0" dy="14.3">Хоч lg ≈ 1 мм, а l_core ≈ 150 мм, через μr = 2000:</tspan><tspan x="540.0" dy="14.3">Rm_gap становить &gt; 93% загального опору!</tspan></text>
<rect x="385.8" y="215.9" width="308.4" height="88.2" rx="6" fill="#eafaf1" stroke="#a3e4d7" stroke-width="1.4"/><text x="540.0" y="235.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">ЕФЕКТ ВИПУЧУВАННЯ (Fringing):</tspan><tspan x="540.0" dy="14.3">Магнітні лінії розпираються вбік у зазорі.</tspan><tspan x="540.0" dy="14.3">Ефективна площа зазору більша за площу осердя:</tspan><tspan x="540.0" dy="14.3">A_eff = (a + lg) · (b + lg) &gt; A_core</tspan><tspan x="540.0" dy="14.3">Це трохи зменшує реальний опір зазору.</tspan></text>
<rect x="-13.3" y="341.5" width="786.7" height="27.0" rx="6" fill="#f4f6f8" stroke="#bdc3c7" stroke-width="1.2"/><text x="380.0" y="358.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">НАКОПИЧЕННЯ ЕНЕРГІЇ: Густина енергії w = B² / (2μ). Оскільки μ_gap &lt;&lt; μ_core, 95%+ енергії зберігається у зазорі!</tspan></text>
