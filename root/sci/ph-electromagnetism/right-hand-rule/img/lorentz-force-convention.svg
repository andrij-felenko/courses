<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Незалежність фізичної сили Лоренца від вибору конвенції руки</text>
<rect x="10.0" y="10.0" width="740.0" height="440.0" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.0"/>
<rect x="30.0" y="30.0" width="340.0" height="340.0" rx="6" fill="#f8fdf8" stroke="#27ae60" stroke-width="1.5"/>
<text x="200.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">1. Конвенція Правої руки</text>
<rect x="45.0" y="75.0" width="310.0" height="50.0" rx="6" fill="#e8f8f5" stroke="#11999e" stroke-width="1.5"/><text x="200.0" y="96.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="200.0" dy="0.0">Поле струму: B = + (μ₀ I / 2π r)</tspan><tspan x="200.0" dy="14.3">Сила Лоренца: F = q (v ×_right B)</tspan></text>
<line x1="200.0" y1="250.0" x2="290.0" y2="250.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="295.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">v (полярний)</text>
<line x1="200.0" y1="250.0" x2="200.0" y2="180.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="210.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">B_right (аксіальний)</text>
<line x1="200.0" y1="250.0" x2="135.0" y2="315.0" stroke="#1a1a1a" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="125.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">F_физ (полярний)</text>
<rect x="390.0" y="30.0" width="340.0" height="340.0" rx="6" fill="#fef8f8" stroke="#c0392b" stroke-width="1.5"/>
<text x="560.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2. Конвенція Лівої руки</text>
<rect x="405.0" y="75.0" width="310.0" height="50.0" rx="6" fill="#fadbd8" stroke="#e74c3c" stroke-width="1.5"/><text x="560.0" y="96.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Поле струму: B = − (μ₀ I / 2π r)</tspan><tspan x="560.0" dy="14.3">Сила Лоренца: F = q (v ×_left B)</tspan></text>
<line x1="560.0" y1="250.0" x2="650.0" y2="250.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="655.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">v (полярний)</text>
<line x1="560.0" y1="250.0" x2="560.0" y2="320.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="570.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">B_left = −B_right</text>
<line x1="560.0" y1="250.0" x2="495.0" y2="315.0" stroke="#1a1a1a" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="485.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">F_физ (НЕ ЗМІНИЛАСЯ!)</text>
<rect x="60.0" y="385.0" width="640.0" height="40.0" rx="6" fill="#fcf3cf" stroke="#f39c12" stroke-width="1.5"/><text x="380.0" y="409.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Фізичний результат однаковісінький: (−1) від поля × (−1) від добутку = +1</tspan></text>
</svg>