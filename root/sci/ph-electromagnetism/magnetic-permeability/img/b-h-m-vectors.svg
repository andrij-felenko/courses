<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 310" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="310" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="40.0" width="240.0" height="230.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.2"/><text x="140.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вакуум: відгук відсутній</text><line x1="30.0" y1="76.0" x2="250.0" y2="76.0" stroke="#cbd5e1" stroke-width="1.0"/><rect x="290.0" y="40.0" width="240.0" height="230.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.2"/><text x="410.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Парамагнетик: слабкий відгук</text><line x1="300.0" y1="76.0" x2="520.0" y2="76.0" stroke="#cbd5e1" stroke-width="1.0"/><rect x="560.0" y="40.0" width="240.0" height="230.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.2"/><text x="680.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Феромагнетик: доменне підсилення</text><line x1="570.0" y1="76.0" x2="790.0" y2="76.0" stroke="#cbd5e1" stroke-width="1.0"/><line x1="60.0" y1="115.0" x2="160.0" y2="115.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><text x="110.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">H (напруженість)</text><text x="140.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">M = 0  (речовини нема)</text><line x1="60.0" y1="210.0" x2="160.0" y2="210.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/><text x="110.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">B = μ₀ · H</text><text x="140.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">μᵣ = 1.0</text><line x1="330.0" y1="105.0" x2="430.0" y2="105.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><text x="380.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">H (зовнішнє)</text><line x1="330.0" y1="145.0" x2="365.0" y2="145.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/><text x="425.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">M (диполі за полем)</text><line x1="330.0" y1="210.0" x2="445.0" y2="210.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/><text x="390.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">B = μ₀ · (H + M)</text><text x="410.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">μᵣ = 1 + χ &gt; 1  (χ ≈ 10⁻⁵)</text><line x1="600.0" y1="95.0" x2="680.0" y2="95.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><text x="640.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">H (навіть мале)</text><line x1="600.0" y1="140.0" x2="750.0" y2="140.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/><text x="680.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">M (спільні домени)</text><line x1="600.0" y1="205.0" x2="770.0" y2="205.0" stroke="#27ae60" stroke-width="3.5" marker-end="url(#arrow)"/><text x="685.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">B ≈ μ₀ · M  (у 10³–10⁵ разів)</text><text x="680.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">μᵣ &gt;&gt; 1  (до 100 000+)</text>
</svg>