<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330">
<rect width="800" height="330" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="400.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Одиниця струму — ампер: 1 А = 1 кулон за секунду</text>
<text x="400.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">якщо переріз щосекунди перетинає 1 Кл заряду — це струм 1 ампер</text>
<text x="200.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1 Кл</text>
<rect x="160.0" y="130.0" width="80.0" height="40.0" rx="8" fill="#fdf4f4" stroke="#c0271e" stroke-width="2"/>
<circle cx="200.0" cy="150.0" r="9.0" fill="none" stroke="#c0271e" stroke-width="2.5"/>
<line x1="195.1" y1="150.0" x2="204.9" y2="150.0" stroke="#c0271e" stroke-width="2.5" stroke-linecap="round"/>
<line x1="200.0" y1="145.1" x2="200.0" y2="154.9" stroke="#c0271e" stroke-width="2.5" stroke-linecap="round"/>
<line x1="250.0" y1="150.0" x2="360.0" y2="150.0" stroke="#1b1b1b" stroke-width="2.6" marker-end="url(#aInk)"/>
<text x="305.0" y="136.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">за 1 с</text>
<line x1="380.0" y1="110.0" x2="380.0" y2="200.0" stroke="#1b1b1b" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
<text x="380.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">переріз</text>
<rect x="450.0" y="110.0" width="300.0" height="90.0" rx="12" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="600.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1 А = 1 Кл/с</text>
<text x="600.0" y="182.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одиниця названа на честь Ампера</text>
<text x="400.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Звідси й заряд: Q = I · t. Струм 2 А за 1 хв переносить 2 × 60 = 120 Кл.</text>
<text x="400.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">А «мА·год» на батареї (Розд.1) — це теж заряд: струм × час.</text>
</svg>
