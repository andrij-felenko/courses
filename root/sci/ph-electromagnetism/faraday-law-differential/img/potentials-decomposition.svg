<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%">
<rect x="10.0" y="10.0" width="820.0" height="440.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Розклад Гельмгольца: E = E_потенц + E_вихр = −∇φ − ∂A/∂t</text>
<rect x="30.0" y="70.0" width="370.0" height="310.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="230.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">1. Потенціальна складова (E_потенц = −∇φ)</text>
<circle cx="150.0" cy="180.0" r="18.0" fill="#fef2f2" stroke="#dc2626" stroke-width="2.0"/>
<text x="150.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">+q</text>
<circle cx="310.0" cy="180.0" r="18.0" fill="#eaf0fd" stroke="#2563eb" stroke-width="2.0"/>
<text x="310.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700">−q</text>
<line x1="170.0" y1="180.0" x2="290.0" y2="180.0" stroke="#dc2626" stroke-width="2.0"/>
<line x1="170.0" y1="170.0" x2="290.0" y2="140.0" stroke="#dc2626" stroke-width="1.5"/>
<line x1="170.0" y1="190.0" x2="290.0" y2="220.0" stroke="#dc2626" stroke-width="1.5"/>
<rect x="118.4" y="271.8" width="223.2" height="76.4" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="230.0" y="291.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">• Джерела: електричні заряди ρ</tspan><tspan x="230.0" dy="15.0">• ∇ × E_потенц = 0 (безвихрове)</tspan><tspan x="230.0" dy="15.0">• ∇ · E_потенц = ρ / ε₀</tspan><tspan x="230.0" dy="15.0">• ∮ E · dl = 0 (консервативне)</tspan></text>
<text x="420.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="28" fill="#1e293b" text-anchor="middle" font-weight="700">+</text>
<rect x="440.0" y="70.0" width="370.0" height="310.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="610.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">2. Вихрова складова (E_вихр = −∂A/∂t)</text>
<circle cx="610.0" cy="180.0" r="45.0" fill="none" stroke="#2563eb" stroke-width="2.5"/>
<line x1="565.0" y1="180.0" x2="565.0" y2="160.0" stroke="#2563eb" stroke-width="2.5"/>
<circle cx="610.0" cy="180.0" r="12.0" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/>
<text x="610.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0d9488" text-anchor="middle" font-weight="700">A(t)</text>
<rect x="482.0" y="271.8" width="256.0" height="76.4" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="610.0" y="291.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">• Джерела: зміна поля ∂B/∂t чи ∂A/∂t</tspan><tspan x="610.0" dy="15.0">• ∇ × E_вихр = − ∂B/∂t (вихрове)</tspan><tspan x="610.0" dy="15.0">• ∇ · E_вихр = 0 (безджерельне)</tspan><tspan x="610.0" dy="15.0">• ∮ E · dl ≠ 0 (неконсервативне)</tspan></text>
<text x="420.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle" font-style="italic">Повне електричне поле E у динаміці містить як кулонівську (джерельну), так і індукційну (вихрову) складові</text>
</svg>