<rect x="504.9" y="200.8" width="270.2" height="98.4" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="640.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Особливості вихрового поля E:</tspan><tspan x="640.0" dy="15.6">• Силові лінії замкнені самі на себе</tspan><tspan x="640.0" dy="15.6">• Не має джерел (зарядів): ∇ · E = 0</tspan><tspan x="640.0" dy="15.6">• Циркуляція ∮ E · dl ≠ 0</tspan><tspan x="640.0" dy="15.6">• Потенціал φ ввести неможливо</tspan></text>
