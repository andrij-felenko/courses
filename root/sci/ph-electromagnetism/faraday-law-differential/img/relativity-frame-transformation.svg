<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%">
<rect x="10.0" y="10.0" width="820.0" height="440.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Релятивістська еквівалентність: індуковане поле E проти сили Лоренца v × B</text>
<rect x="30.0" y="70.0" width="370.0" height="310.0" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
<text x="220.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7e22ce" text-anchor="middle" font-weight="700">Система K: Контур нерухомий, B(t) змінюється</text>
<rect x="150.0" y="140.0" width="140.0" height="90.0" rx="6" fill="#ffffff" stroke="#7e22ce" stroke-width="2.0"/>
<text x="220.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7e22ce" text-anchor="middle">Контур v = 0</text>
<text x="220.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0d9488" text-anchor="middle" font-weight="700">dB/dt ≠ 0</text>
<rect x="92.0" y="266.8" width="256.0" height="76.4" rx="6" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/><text x="220.0" y="286.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Пояснення у системі K:</tspan><tspan x="220.0" dy="15.0">Змінне магнітне поле створює вихрове</tspan><tspan x="220.0" dy="15.0">електричне поле: ∇ × E = − ∂B/∂t.</tspan><tspan x="220.0" dy="15.0">Сила на заряд: F = q · E</tspan></text>
<rect x="440.0" y="70.0" width="370.0" height="310.0" rx="10" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/>
<text x="620.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e08a1e" text-anchor="middle" font-weight="700">Система K': Контур рухається, B стаціонарне</text>
<rect x="550.0" y="140.0" width="140.0" height="90.0" rx="6" fill="#ffffff" stroke="#e08a1e" stroke-width="2.0"/>
<text x="610.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e08a1e" text-anchor="middle">Контур</text>
<line x1="640.0" y1="185.0" x2="680.0" y2="185.0" stroke="#dc2626" stroke-width="2.5"/>
<text x="660.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">v</text>
<text x="620.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0d9488" text-anchor="middle" font-weight="700">dB/dt = 0 (B стале)</text>
<rect x="498.6" y="266.8" width="242.9" height="76.4" rx="6" fill="#ffffff" stroke="#e08a1e" stroke-width="1.5"/><text x="620.0" y="286.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Пояснення у системі K':</tspan><tspan x="620.0" dy="15.0">Магнітне поле стале, але на рухомі</tspan><tspan x="620.0" dy="15.0">заряди діє магнітна сила Лоренца.</tspan><tspan x="620.0" dy="15.0">Сила на заряд: F' = q · (v × B)</tspan></text>
<rect x="41.9" y="403.8" width="756.2" height="32.5" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="420.0" y="424.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Перетворення Лоренца: E' = E + v × B   — обидва описи є двома гранями єдиного тензора поля F_μν</tspan></text>
</svg>