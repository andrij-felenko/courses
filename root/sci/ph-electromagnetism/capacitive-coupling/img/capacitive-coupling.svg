<text x="470.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ємнісний зв'язок: два провідники поряд — це маленький конденсатор</text>
<text x="470.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">змінне поле (§1.1.3) джерела наводить заряд на сусідній провід через паразитну ємність Cпар — і тим сильніше, чим вища частота</text>
