<text x="410.0" y="384.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Великий вхідний опір = слабка ланка: навіть пФ ємності</text>
<text x="410.0" y="403.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">пропускає помітний гул. Тому «рука біля щупа» дає 50 Гц на екрані,</text>
<text x="410.0" y="421.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">а низькоомний вузол майже не наводиться.</text>
