<rect x="416.5" y="70.0" width="317.0" height="69.9" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/><text x="575.0" y="87.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">1. Механізм класичної катастрофи</tspan><tspan x="575.0" dy="14.3">• Доцентрове прискорення: a = e² / (4πε₀ m_e r²)</tspan><tspan x="575.0" dy="14.3">• Випромінювана потужність: P ∝ a² ∝ 1/r⁴</tspan><tspan x="575.0" dy="14.3">• Повна енергія орбіти: E = −e² / (8πε₀ r)</tspan></text>
<rect x="404.0" y="180.1" width="342.0" height="69.9" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.4"/><text x="575.0" y="197.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">2. Темп стягування орбіти</tspan><tspan x="575.0" dy="14.3">• dE/dt = −P  ⇒  dr/dt = −e⁴ / (12π² ε₀² m_e² c³ r²)</tspan><tspan x="575.0" dy="14.3">• Час повного падіння від r₀ = 0.53 Å до r = 0:</tspan><tspan x="575.0" dy="14.3">  τ = (4π² ε₀² m_e² c³ r₀³) / e⁴ ≈ 1.56 · 10⁻¹¹ с</tspan></text>
<rect x="407.1" y="295.1" width="335.8" height="69.9" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><text x="575.0" y="312.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">3. Висновок: народження квантової фізики</tspan><tspan x="575.0" dy="14.3">• Класична речовина колапсувала б за 16 пікосекунд!</tspan><tspan x="575.0" dy="14.3">• Стійкість атомів довела непридатність класичної</tspan><tspan x="575.0" dy="14.3">  електродинаміки для мікросвіту (постулати Бора)</tspan></text>
