<rect x="441.6" y="75.0" width="266.8" height="69.9" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.2"/><text x="575.0" y="92.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">1. Геометрія розриву інформації</tspan><tspan x="575.0" dy="14.3">• Ззовні r &gt; ct: поле центроване у (t=0)</tspan><tspan x="575.0" dy="14.3">• Всередині r &lt; c(t-Δt): поле зміщене</tspan><tspan x="575.0" dy="14.3">• Шар товщиною Δr = c Δt несе злам ліній</tspan></text>
<rect x="429.1" y="190.1" width="291.9" height="69.9" rx="6" fill="#fef8f0" stroke="#d97706" stroke-width="1.4"/><text x="575.0" y="207.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">2. Співвідношення компонент поля</tspan><tspan x="575.0" dy="14.3">• E_⊥ / E_r = (a · t · sin θ) / (c Δt)</tspan><tspan x="575.0" dy="14.3">• Оскільки t = r/c, маємо E_⊥ / E_r ∝ a·r/c²</tspan><tspan x="575.0" dy="14.3">• E_r ∝ 1/r²  ⇒  E_⊥ ∝ a · sin θ / (c² · r)</tspan></text>
<rect x="429.1" y="310.1" width="291.9" height="69.9" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><text x="575.0" y="327.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">3. Відрив випромінюваної енергії</tspan><tspan x="575.0" dy="14.3">• Густина потоку Пойнтінга S ∝ E_⊥² ∝ 1/r²</tspan><tspan x="575.0" dy="14.3">• Повний потік через сферу: ∮ S · dA = const</tspan><tspan x="575.0" dy="14.3">• Енергія назавжди відривається від заряду!</tspan></text>
