<rect x="-16.9" y="372.0" width="793.8" height="26.0" rx="6" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1.2"/><text x="380.0" y="389.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Активна складова pa(t) передає незворотну енергію P. Реактивна pq(t) лише коливається навколо нуля з амплітудою Q.</tspan></text>
