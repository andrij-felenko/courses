<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 780 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="780" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="380.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трикутник потужностей: зв'язок між P, Q, S та коефіцієнтом потужності cos φ</text>
<line x1="100.0" y1="250.0" x2="360.0" y2="250.0" stroke="#8e44ad" stroke-width="3.0"/>
<text x="230.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="middle" font-weight="700">P = V·I·cos φ (Активна, Вт)</text>
<line x1="360.0" y1="250.0" x2="360.0" y2="100.0" stroke="#d35400" stroke-width="3.0"/>
<text x="375.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="start" font-weight="700">Q = V·I·sin φ (Реактивна, вар)</text>
<line x1="100.0" y1="250.0" x2="360.0" y2="100.0" stroke="#2457d6" stroke-width="3.0"/>
<text x="210.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">S = V·I (Повна, В·А)</text>
<path d="M 150,250 A 50 50 0 0 0 143,225" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="165.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">φ</text>
<line x1="345.0" y1="250.0" x2="345.0" y2="235.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="345.0" y1="235.0" x2="360.0" y2="235.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="450.0" y="50.0" width="270.0" height="210.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="585.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Основні формули</text>
<text x="470.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">S² = P² + Q²</text>
<text x="470.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">S = Vrms · Irms</text>
<text x="470.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="start">P = S · cos φ</text>
<text x="470.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="start">Q = S · sin φ</text>
<line x1="470.0" y1="218.0" x2="700.0" y2="218.0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="470.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="start" font-weight="700">PF = cos φ = P / S</text>
<rect x="95.0" y="321.4" width="570.0" height="37.3" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2"/><text x="380.0" y="336.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Коефіцієнт потужності PF = cos φ вимірює ефективність використання джерела.</tspan><tspan x="380.0" dy="14.3">Чим більша реактивна потужність Q, тим більший струм потрібен для передачі того самого P.</tspan></text>
</svg>