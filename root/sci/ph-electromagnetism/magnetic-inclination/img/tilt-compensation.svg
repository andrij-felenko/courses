<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 471.76" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="471.76" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вплив крену на вимірювання курсу та алгоритм компенсації</text>
<text x="180.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">1. Горизонтальний давач</text>
<rect x="110.0" y="130.0" width="140.0" height="100.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="2.0"/>
<text x="180.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Плата в горизонті</text>
<line x1="180.0" y1="180.0" x2="230.0" y2="180.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="235.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">B_x = H</text>
<line x1="180.0" y1="180.0" x2="180.0" y2="250.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="197.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">B_z = Z</text>
<text x="180.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Похибка курсу: 0°</text>
<text x="520.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">2. Нахилений давач (без компенсації)</text>
<line x1="460.0" y1="200.0" x2="580.0" y2="160.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="460.0" y1="200.0" x2="480.0" y2="140.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="580.0" y1="160.0" x2="600.0" y2="100.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="520.0" y1="180.0" x2="575.0" y2="162.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="580.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">X' (виміряно)</text>
<text x="520.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Z 'проливається' в X'!</text>
<text x="520.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Оскільки Z ≈ 2.3 · H,</text>
<text x="520.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">при θ = 10° похибка &gt; 40°!</text>
<line x1="40.0" y1="290.0" x2="680.0" y2="290.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="360.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схема алгоритму Tilt Compensation (3D Magnetometer + Accelerometer)</text>
<rect x="70.7" y="358.2" width="118.6" height="43.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="376.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Акселерометр</tspan><tspan x="130.0" dy="15.6">[a_x, a_y, a_z]</tspan></text>
<line x1="190.0" y1="380.0" x2="250.0" y2="380.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="247.0" y="358.2" width="146.0" height="43.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="320.0" y="376.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Обчислення кутів</tspan><tspan x="320.0" dy="15.6">θ (Pitch), φ (Roll)</tspan></text>
<line x1="390.0" y1="380.0" x2="450.0" y2="380.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="452.8" y="350.4" width="214.4" height="59.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="560.0" y="368.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Проекція на горизонт:</tspan><tspan x="560.0" dy="15.6">B_xH, B_yH</tspan><tspan x="560.0" dy="15.6">Азимут ψ = atan2(-B_yH, B_xH)</tspan></text>
<line x1="560.0" y1="440.0" x2="560.0" y2="418.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="560.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Магнітометр [B_x, B_y, B_z]</text>
</svg>