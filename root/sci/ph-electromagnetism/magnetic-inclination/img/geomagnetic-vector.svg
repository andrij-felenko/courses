<rect x="467.7" y="85.0" width="204.7" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="105.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Співвідношення величин:</tspan><tspan x="570.0" dy="15.6">H = B · cos(I)</tspan><tspan x="570.0" dy="15.6">Z = B · sin(I)</tspan><tspan x="570.0" dy="15.6">tan(I) = Z / H</tspan><tspan x="570.0" dy="15.6">tan(D) = Y / X</tspan><tspan x="570.0" dy="15.6">B² = H² + Z² = X² + Y² + Z²</tspan></text>
<rect x="-0.3" y="421.0" width="720.5" height="28.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="360.0" y="439.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">У середніх широтах (Україна) кут нахилу I ≈ 65°–69°, тому Z перевищує H більш ніж удвічі (Z ≈ 2.3 · H).</tspan></text>
