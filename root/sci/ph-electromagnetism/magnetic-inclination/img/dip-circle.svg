<rect x="400.6" y="131.6" width="238.9" height="156.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="520.0" y="151.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Принцип вимірювання:</tspan><tspan x="520.0" dy="15.6">1. Інклінатор вирівнюють у</tspan><tspan x="520.0" dy="15.6">   площині магнітного меридіана.</tspan><tspan x="520.0" dy="15.6">2. Голка вільно обертається</tspan><tspan x="520.0" dy="15.6">   на горизонтальній осі.</tspan><tspan x="520.0" dy="15.6">3. Магнітні сили повертають</tspan><tspan x="520.0" dy="15.6">   голку вздовж вектора B.</tspan><tspan x="520.0" dy="15.6">4. Відхилення від горизонталі</tspan><tspan x="520.0" dy="15.6">   показує кут нахилу I.</tspan></text>
