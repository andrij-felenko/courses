<rect x="570.0" y="120.0" width="155.0" height="25.0" rx="6" fill="#dc2626" stroke="none" stroke-width="1.5"/>
<text x="647.5" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Іонізуюче &amp; ядерне</text>
<text x="647.5" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">(E &gt; 100 eV)</text>
