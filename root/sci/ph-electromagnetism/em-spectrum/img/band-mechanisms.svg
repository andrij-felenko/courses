<rect x="230.0" y="90.0" width="155.0" height="55.0" rx="8" fill="#d97706" stroke="none" stroke-width="1.5"/>
<rect x="230.0" y="120.0" width="155.0" height="25.0" rx="6" fill="#d97706" stroke="none" stroke-width="1.5"/>
<text x="307.5" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Теплове й молекулярне</text>
<text x="307.5" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">(1 meV – 1.5 eV)</text>
