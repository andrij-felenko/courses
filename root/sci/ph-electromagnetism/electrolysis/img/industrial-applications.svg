<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три стовпи промислового електролізу</text>
<rect x="30.0" y="60.0" width="220.0" height="290.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="140.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">Отримання Al</text>
<text x="140.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Процес Голла-Еру</text>
<rect x="50.0" y="125.0" width="180.0" height="100.0" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.0"/>
<text x="140.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle"><tspan x="140.0" dy="0.0">Розплав Al₂O₃</tspan><tspan x="140.0" dy="14.3">у кріоліті Na₃AlF₆</tspan><tspan x="140.0" dy="14.3">T ≈ 950°C</tspan></text>
<rect x="60.0" y="190.0" width="160.0" height="25.0" rx="2" fill="#94a3b8" stroke="#334155" stroke-width="1.0"/>
<text x="140.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Рідкий Al (катод)</text>
<text x="140.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle"><tspan x="140.0" dy="0.0">Анод: вугільні блоки</tspan><tspan x="140.0" dy="14.3">C + 2O²⁻ → CO₂ + 4e⁻</tspan><tspan x="140.0" dy="14.3"></tspan><tspan x="140.0" dy="14.3">Катод: Al³⁺ + 3e⁻ → Al</tspan></text>
<rect x="270.0" y="60.0" width="220.0" height="290.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="380.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#15803d" text-anchor="middle" font-weight="700">Хлор та Луг</text>
<text x="380.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Мембранний процес</text>
<rect x="290.0" y="125.0" width="180.0" height="100.0" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.0"/>
<text x="380.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle"><tspan x="380.0" dy="0.0">Розчин NaCl (ропа)</tspan><tspan x="380.0" dy="14.3">Катіонообмінна</tspan><tspan x="380.0" dy="14.3">мембрана Na⁺</tspan></text>
<text x="380.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle"><tspan x="380.0" dy="0.0">Анод: 2Cl⁻ → Cl₂ ↑ + 2e⁻</tspan><tspan x="380.0" dy="14.3"></tspan><tspan x="380.0" dy="14.3">Катод: 2H₂O + 2e⁻ →</tspan><tspan x="380.0" dy="14.3">→ H₂ ↑ + 2OH⁻</tspan><tspan x="380.0" dy="14.3"></tspan><tspan x="380.0" dy="14.3">Продукт: NaOH + Cl₂ + H₂</tspan></text>
<rect x="510.0" y="60.0" width="220.0" height="290.0" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<text x="620.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c2410c" text-anchor="middle" font-weight="700">Рафінування міді</text>
<text x="620.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Гальваніка / Очищення</text>
<rect x="530.0" y="125.0" width="180.0" height="100.0" rx="4" fill="#ffedd5" stroke="#f97316" stroke-width="1.0"/>
<text x="620.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9a3412" text-anchor="middle"><tspan x="620.0" dy="0.0">Розчин CuSO₄</tspan><tspan x="620.0" dy="14.3">Чорнова Cu (анод)</tspan><tspan x="620.0" dy="14.3">Чиста Cu (катод)</tspan></text>
<text x="620.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c2d12" text-anchor="middle"><tspan x="620.0" dy="0.0">Анод (чорнова мідь):</tspan><tspan x="620.0" dy="14.3">Cu⁰ → Cu²⁺ + 2e⁻</tspan><tspan x="620.0" dy="14.3"></tspan><tspan x="620.0" dy="14.3">Катод (чиста мідь):</tspan><tspan x="620.0" dy="14.3">Cu²⁺ + 2e⁻ → Cu⁰ (99.99%)</tspan></text>
</svg>