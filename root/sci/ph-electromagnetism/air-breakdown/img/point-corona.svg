<text x="470.0" y="410.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Той самий механізм шкодить у роботі: гострі виводи й кромки концентрують поле — звідти й починається ESD-пробій.</text>
