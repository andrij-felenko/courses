<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430">
<rect width="820" height="430" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="410.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Скільки це — кулон? І чому речовина «майже» нейтральна</text>
<text x="410.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">звичайна матерія тримає гігантські + і −, що гасяться майже точно</text>
<rect x="150.0" y="120.0" width="70.0" height="210.0" rx="4" fill="#fbecec" stroke="#c0271e" stroke-width="2"/>
<rect x="260.0" y="122.0" width="70.0" height="208.0" rx="4" fill="#e9eefb" stroke="#1f47b5" stroke-width="2"/>
<text x="185.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">+Q</text>
<text x="295.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">−Q</text>
<text x="245.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">≈ 10⁷ Кл кожного</text>
<line x1="136.0" y1="330.0" x2="350.0" y2="330.0" stroke="#1b1b1b" stroke-width="1.6" stroke-linecap="round"/>
<text x="245.0" y="376.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">склянка води</text>
<text x="245.0" y="394.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">гасяться до ≈ 0</text>
<text x="245.0" y="422.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">Те, що ми звемо «зарядом», —</text>
<text x="245.0" y="440.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">крихітний дисбаланс цих гігантів.</text>
<text x="470.0" y="110.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Порядки величини заряду</text>
<circle cx="476.0" cy="145.0" r="4.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="1"/>
<text x="492.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1 електрон</text>
<text x="492.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1f47b5" text-anchor="start" font-weight="normal" font-style="normal">1.6 × 10⁻¹⁹ Кл</text>
<circle cx="476.0" cy="201.0" r="4.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="492.0" y="206.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">статична іскра (відчув)</text>
<text x="492.0" y="226.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">~ 10⁻⁶ Кл  (мкКл)</text>
<circle cx="476.0" cy="257.0" r="4.0" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="492.0" y="262.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">1 кулон</text>
<text x="492.0" y="282.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="start" font-weight="normal" font-style="normal">= 6.24 × 10¹⁸ електронів</text>
<circle cx="476.0" cy="313.0" r="4.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="1"/>
<text x="492.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">розряд блискавки</text>
<text x="492.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">~ 15 Кл</text>
<text x="470.0" y="380.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">1 Кл — велетенська порція: майже ніколи</text>
<text x="470.0" y="398.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">не зустрінеться як «вільний» статичний заряд.</text>
</svg>
