<text x="476.0" y="326.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">вільно їх не виділити. Тож для нас</text>
