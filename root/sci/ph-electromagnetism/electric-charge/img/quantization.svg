<text x="96.0" y="330.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">заряд електрона = −e, протона = +e</text>
