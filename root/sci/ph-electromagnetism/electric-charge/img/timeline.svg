<svg xmlns="http://www.w3.org/2000/svg" width="840" height="880" viewBox="0 0 840 880">
<rect width="840" height="880" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="420.0" y="38.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ланцюг питань: від бурштину до поля</text>
<text x="420.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">кожен крок — нове питання, що штовхало науку далі (сірим — теми з власною історією)</text>
<line x1="168.0" y1="100.0" x2="168.0" y2="852.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="168.0" cy="126.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="148.0" y="131.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">~600 до н.е.</text>
<text x="192.0" y="123.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Фалес / Thales</text>
<text x="192.0" y="142.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Чому потертий бурштин (ἤλεκτρον) притягує соломинку?</text>
<circle cx="168.0" cy="204.2" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="148.0" y="209.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1600</text>
<text x="192.0" y="201.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Гілберт / Gilbert</text>
<text x="192.0" y="220.2" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Це те саме, що магніт? — Ні: «electrica» — окремий клас тіл</text>
<circle cx="168.0" cy="282.4" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="148.0" y="287.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1663</text>
<text x="192.0" y="279.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">фон Геріке / von Guericke</text>
<text x="192.0" y="298.4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Чи можна цю силу робити машиною? — сірчана куля, перші іскри</text>
<circle cx="168.0" cy="360.7" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="148.0" y="365.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1729</text>
<text x="192.0" y="357.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Грей / Gray</text>
<text x="192.0" y="376.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Сила сидить у тілі чи може текти? — провідник проти ізолятора</text>
<circle cx="168.0" cy="438.9" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="148.0" y="443.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1733</text>
<text x="192.0" y="435.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">дю Фе / du Fay</text>
<text x="192.0" y="454.9" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Чому одне притягує, інше відштовхує? — ДВА роди електрики</text>
<circle cx="168.0" cy="517.1" r="7.0" fill="#fff" stroke="#8a8a8a" stroke-width="2.6"/>
<text x="148.0" y="522.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1745</text>
<text x="192.0" y="514.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Лейденська банка</text>
<text x="192.0" y="533.1" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Чи можна накопичити її в банку? — заряд і удар (→ Розділ 7)</text>
<circle cx="168.0" cy="595.3" r="10.0" fill="#c0271e" stroke="#c0271e" stroke-width="3"/>
<circle cx="168.0" cy="595.3" r="10.0" fill="none" stroke="#fff" stroke-width="0"/>
<circle cx="168.0" cy="595.3" r="9.5" fill="none" stroke="#c0271e" stroke-width="3"/>
<text x="148.0" y="600.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1752</text>
<text x="192.0" y="592.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Франклін / Franklin</text>
<text x="192.0" y="611.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Один флюїд: + і −; заряд зберігається; блискавка — теж він</text>
<circle cx="168.0" cy="673.6" r="7.0" fill="#fff" stroke="#8a8a8a" stroke-width="2.6"/>
<text x="148.0" y="678.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1785</text>
<text x="192.0" y="670.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Кулон / Coulomb</text>
<text x="192.0" y="689.6" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Скільки саме? — закон сили в числах (→ історія §1.2)</text>
<circle cx="168.0" cy="751.8" r="7.0" fill="#fff" stroke="#8a8a8a" stroke-width="2.6"/>
<text x="148.0" y="756.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1800</text>
<text x="192.0" y="748.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Вольта / Volta</text>
<text x="192.0" y="767.8" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Звідки СТАЛИЙ потік, а не іскра? — батарея, «вольт» (→ §1.5)</text>
<circle cx="168.0" cy="830.0" r="7.0" fill="#fff" stroke="#8a8a8a" stroke-width="2.6"/>
<text x="148.0" y="835.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1831</text>
<text x="192.0" y="827.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Фарадей / Faraday</text>
<text x="192.0" y="846.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Що тягнеться крізь порожнечу між тілами? — ПОЛЕ (→ §1.3)</text>
</svg>
