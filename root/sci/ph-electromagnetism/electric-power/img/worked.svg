<svg xmlns="http://www.w3.org/2000/svg" width="840" height="360" viewBox="0 0 840 360">
<rect width="840" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="420.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Один приклад, три формули — одна відповідь</text>
<text x="420.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">12 В на резисторі 100 Ω: рахуємо потужність трьома способами</text>
<line x1="110.0" y1="120.0" x2="110.0" y2="240.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="94.0" y1="168.0" x2="126.0" y2="168.0" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<line x1="101.0" y1="184.0" x2="119.0" y2="184.0" stroke="#1b1b1b" stroke-width="5" stroke-linecap="round"/>
<text x="88.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">12 В</text>
<line x1="110.0" y1="120.0" x2="250.0" y2="120.0" stroke="#cf8b5e" stroke-width="3" stroke-linecap="round"/>
<rect x="250.0" y="108.0" width="80.0" height="24.0" rx="3" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<text x="290.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="italic">R = 100 Ω</text>
<line x1="330.0" y1="120.0" x2="420.0" y2="120.0" stroke="#cf8b5e" stroke-width="3" stroke-linecap="round"/>
<line x1="420.0" y1="120.0" x2="420.0" y2="240.0" stroke="#1b1b1b" stroke-width="2.4" stroke-linecap="round"/>
<line x1="110.0" y1="240.0" x2="420.0" y2="240.0" stroke="#cf8b5e" stroke-width="3" stroke-linecap="round"/>
<line x1="150.0" y1="120.0" x2="196.0" y2="120.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<text x="173.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="italic">I</text>
<text x="265.0" y="178.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">I = V/R = 12/100 = 0.12 А</text>
<rect x="478.0" y="92.0" width="344.0" height="152.0" rx="12" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="500.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">P = V·I</text>
<text x="596.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">= 12 × 0.12</text>
<text x="786.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">= 1.44 Вт</text>
<text x="500.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">P = I²R</text>
<text x="596.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">= 0.12² × 100</text>
<text x="786.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">= 1.44 Вт</text>
<text x="500.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">P = V²/R</text>
<text x="596.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">= 12² / 100</text>
<text x="786.0" y="210.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">= 1.44 Вт</text>
<rect x="580.0" y="258.0" width="200.0" height="44.0" rx="12" fill="#eef7f0" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="680.0" y="286.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">P = 1.44 Вт  ✓</text>
<text x="420.0" y="338.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Різні формули — той самий результат: це лише три погляди на P = V·I.</text>
</svg>
