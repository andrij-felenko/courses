<rect x="329.3" y="89.2" width="341.4" height="41.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="500.0" y="106.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Потенціал у точці 4 від вже наявних зарядів:</tspan><tspan x="500.0" dy="15.6">φ₄ = φ₁₄ + φ₂₄ + φ₃₄</tspan></text>
<rect x="355.4" y="154.2" width="289.3" height="41.6" rx="6" fill="#fef9e7" stroke="#c0392b" stroke-width="1.4"/><text x="500.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Робота проти кулонівських сил:</tspan><tspan x="500.0" dy="15.6">W₄ = q₄ · φ₄ = ∑ (q₄ q_j / 4πε₀ r_j₄)</tspan></text>
<rect x="74.1" y="300.5" width="531.8" height="29.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/><text x="340.0" y="319.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">Повна енергія системи:  W = ½ ∑ᵢ qᵢ φᵢ = ∑ᵢ&lt;ⱼ (qᵢ qⱼ / 4πε₀ rᵢⱼ)</tspan></text>
