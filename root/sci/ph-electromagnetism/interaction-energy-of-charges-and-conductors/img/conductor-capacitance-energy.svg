<text x="150.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Провідник 1</text>
<text x="150.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">заряд Q₁
потенціал V₁</text>
<rect x="320.0" y="100.0" width="110.0" height="85.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="375.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Провідник 2</text>
<text x="375.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">заряд Q₂
потенціал V₂</text>
<ellipse cx="580" cy="140" rx="55" ry="55" fill="#fef9e7" stroke="#27ae60" stroke-width="2"/>
