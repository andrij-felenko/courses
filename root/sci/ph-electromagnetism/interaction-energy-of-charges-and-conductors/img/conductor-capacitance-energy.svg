<text x="580.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">заряд Q_N
потенціал V_N</text>
<line x1="215.0" y1="140.0" x2="320.0" y2="140.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="267.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle" font-weight="700">C₁₂</text>
<line x1="430.0" y1="140.0" x2="525.0" y2="140.0" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="477.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle" font-weight="700">C₂_N</text>
<rect x="87.9" y="214.2" width="304.2" height="41.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="240.0" y="231.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Зв'язок зарядів і потенціалів:</tspan><tspan x="240.0" dy="15.6">Qᵢ = ∑ₖ Cᵢₖ Vₖ    або    Vᵢ = ∑ₖ Pᵢₖ Qₖ</tspan></text>
<rect x="430.0" y="214.2" width="200.0" height="41.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="530.0" y="231.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Теорема взаємності Гріна:</tspan><tspan x="530.0" dy="15.6">Cᵢₖ = Cₖᵢ ,  Pᵢₖ = Pₖᵢ</tspan></text>
<rect x="58.0" y="290.5" width="564.1" height="29.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/><text x="340.0" y="309.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="340.0" dy="0.0">Енергія системи провідників:  W = ½ ∑ᵢ Qᵢ Vᵢ = ½ Vᵀ C V = ½ Qᵀ C⁻¹ Q</tspan></text>
