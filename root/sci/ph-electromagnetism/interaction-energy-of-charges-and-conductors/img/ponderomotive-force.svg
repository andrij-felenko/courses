<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 720 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="720" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="700.0" height="310.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="350.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Віртуальні переміщення та пондеромоторні сили електростатики</text>
<rect x="110.0" y="66.0" width="220.0" height="14.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="95.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">+Q, V₁</text>
<rect x="110.0" y="190.0" width="220.0" height="14.0" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="95.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">−Q, V₂</text>
<rect x="110.0" y="215.0" width="220.0" height="14.0" rx="3" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="3,3"/>
<line x1="160.0" y1="204.0" x2="160.0" y2="215.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="177.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">зміщення dx</text>
<line x1="220.0" y1="186.0" x2="220.0" y2="98.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="232.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">сила F_x</text>
<line x1="45.0" y1="80.0" x2="45.0" y2="190.0" stroke="#333333" stroke-width="1.4"/>
<line x1="38.0" y1="80.0" x2="52.0" y2="80.0" stroke="#333333" stroke-width="1.4"/>
<line x1="38.0" y1="190.0" x2="52.0" y2="190.0" stroke="#333333" stroke-width="1.4"/>
<text x="32.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">x</text>
<rect x="388.4" y="71.0" width="273.2" height="67.9" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/><text x="525.0" y="87.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">Режим Q = const (ізольовані пластини):</tspan><tspan x="525.0" dy="14.3">F_x = − (∂W / ∂x)_Q</tspan><tspan x="525.0" dy="14.3">Робота виконується за рахунок</tspan><tspan x="525.0" dy="14.3">зменшення енергії поля W</tspan></text>
<rect x="385.0" y="171.1" width="280.0" height="67.9" rx="6" fill="#fef9e7" stroke="#27ae60" stroke-width="1.4"/><text x="525.0" y="187.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="525.0" dy="0.0">Режим V = const (підключено джерело):</tspan><tspan x="525.0" dy="14.3">F_x = + (∂W / ∂x)_V</tspan><tspan x="525.0" dy="14.3">Джерело здійснює роботу dW_bat = 2 dW,</tspan><tspan x="525.0" dy="14.3">половина йде на механічну роботу F_x dx</tspan></text>
<rect x="26.8" y="272.0" width="646.4" height="26.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="350.0" y="289.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="350.0" dy="0.0">Пондеромоторні сили завжди прагнуть змінити конфігурацію так, щоб збільшити ємність C</tspan></text>
</svg>