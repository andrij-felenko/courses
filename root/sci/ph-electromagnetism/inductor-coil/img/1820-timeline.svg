<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580">
<rect width="800" height="580" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="400.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1820: рік, коли електрика й магнетизм стали одним</text>
<text x="400.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">від тремтіння стрілки на лекції — до нової науки за чотири місяці</text>
<line x1="175.0" y1="96.0" x2="175.0" y2="540.0" stroke="#8a8a8a" stroke-width="2" stroke-linecap="round"/>
<circle cx="175.0" cy="110.0" r="5.0" fill="#c0271e" stroke="#1b1b1b" stroke-width="0"/>
<text x="159.0" y="115.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">≈21 квітня</text>
<text x="193.0" y="108.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">лекція Ерстеда в Копенгагені: стрілка компаса</text>
<text x="193.0" y="125.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">здригається біля дроту зі струмом</text>
<circle cx="175.0" cy="162.0" r="5.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<text x="159.0" y="167.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">квітень–липень</text>
<text x="193.0" y="160.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">три місяці перевірок: товщі дроти, сильніші батареї,</text>
<text x="193.0" y="177.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">стрілка за склом і деревом — ефект справжній</text>
<circle cx="175.0" cy="214.0" r="5.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<text x="159.0" y="219.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">21 липня</text>
<text x="193.0" y="212.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">латинський памфлет на 4 сторінки летить</text>
<text x="193.0" y="229.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">поштою всім ученим Європи</text>
<circle cx="175.0" cy="266.0" r="5.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<text x="159.0" y="271.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">серпень</text>
<text x="193.0" y="264.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">дослід повторюють у Женеві;</text>
<text x="193.0" y="281.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">його бачить парижанин Араґо</text>
<circle cx="175.0" cy="318.0" r="5.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<text x="159.0" y="323.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">4 вересня</text>
<text x="193.0" y="316.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Араґо доповідає Паризькій академії —</text>
<text x="193.0" y="333.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Ампер чує і кидає все</text>
<circle cx="175.0" cy="370.0" r="5.0" fill="#c0271e" stroke="#1b1b1b" stroke-width="0"/>
<text x="159.0" y="375.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">18 вересня</text>
<text x="193.0" y="368.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ПЕРШИЙ мемуар Ампера: паралельні струми</text>
<text x="193.0" y="385.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">притягуються й відштовхуються</text>
<circle cx="175.0" cy="422.0" r="5.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<text x="159.0" y="427.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">25 вересня</text>
<text x="193.0" y="420.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">другий мемуар: котушка зі струмом —</text>
<text x="193.0" y="437.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">це магніт; народжується «соленоїд»</text>
<circle cx="175.0" cy="474.0" r="5.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<text x="159.0" y="479.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">осінь 1820</text>
<text x="193.0" y="472.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Швайггер: множник-гальванометр;</text>
<text x="193.0" y="489.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">Біо і Савар: закон сили поля</text>
<circle cx="175.0" cy="526.0" r="5.0" fill="#1b1b1b" stroke="#1b1b1b" stroke-width="0"/>
<text x="159.0" y="531.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="end" font-weight="bold" font-style="normal">1827</text>
<text x="193.0" y="524.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">підсумковий мемуар Ампера —</text>
<text x="193.0" y="541.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="normal">фундамент електродинаміки готовий</text>
</svg>
