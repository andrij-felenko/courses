<text x="350.0" y="312.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Виток зі струмом = крихітний магніт: один бік N, інший S. Це зародок котушки.</text>
