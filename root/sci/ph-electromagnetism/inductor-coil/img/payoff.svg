  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="380.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Одне відкриття — багато машин</text>
<text x="380.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">усе це — грані «зміна магнітного поля наводить струм»</text>
<rect x="40.0" y="90.0" width="340.0" height="115.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="60.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ГЕНЕРАТОР</text>
<text x="60.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">рух → струм</text>
<text x="60.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">обертаєш магніт повз котушки</text>
<rect x="410.0" y="90.0" width="340.0" height="115.0" rx="12" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.8"/>
<text x="430.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ДВИГУН</text>
<text x="430.0" y="152.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">струм → рух</text>
<text x="430.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">струм у котушці в полі — крутить</text>
<rect x="40.0" y="225.0" width="340.0" height="115.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="60.0" y="259.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">ТРАНСФОРМАТОР</text>
<text x="60.0" y="287.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">зм. струм → струм</text>
<text x="60.0" y="315.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">обмотка наводить обмотку</text>
<rect x="410.0" y="225.0" width="340.0" height="115.0" rx="12" fill="#fbecec" stroke="#c0271e" stroke-width="1.8"/>
<text x="430.0" y="259.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">САМОІНДУКЦІЯ</text>
<text x="430.0" y="287.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">зміна струму → напруга</text>
<text x="430.0" y="315.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">котушка опирається собі (§8.5)</text>
</svg>
