<text x="450.0" y="466.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«Північний полюс компаса» притягується до магнітного півдня Землі — бо різнойменні полюси тягнуться (§1.8.1).</text>
