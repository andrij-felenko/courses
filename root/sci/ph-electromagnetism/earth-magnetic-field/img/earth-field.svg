<text x="450.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Земля — велетенський магніт; його полюси й географічні переплутані</text>
<text x="450.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">стрілка компаса дивиться північним кінцем на географічну Пн — отже, ТАМ магнітний ПІВДЕННИЙ полюс Землі</text>
