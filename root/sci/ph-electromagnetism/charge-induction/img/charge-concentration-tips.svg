<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Концентрація наведеного заряду на вістрях провідника</text>
<path d="M 180,160 C 180,90 280,100 480,150 C 510,155 520,160 510,165 C 480,170 280,220 180,160 Z" fill="#f4f6f8" stroke="#333333" stroke-width="2"/>
<circle cx="210.0" cy="155.0" r="3.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<line x1="210.0" y1="155.0" x2="180.0" y2="155.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="225.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Великий радіус R₁</text>
<circle cx="500.0" cy="160.0" r="2.0" fill="#6b7280" stroke="#6b7280" stroke-width="1.0"/>
<line x1="500.0" y1="160.0" x2="515.0" y2="160.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="430.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Малий радіус R₂ (вістря)</text>
<circle cx="170.0" cy="130.0" r="6.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="170.0" y="132.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="170.0" cy="160.0" r="6.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="170.0" y="162.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="170.0" cy="190.0" r="6.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="170.0" y="192.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="470.0" cy="142.0" r="5.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="470.0" y="144.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="485.0" cy="148.0" r="5.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="485.0" y="150.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="498.0" cy="154.0" r="5.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="498.0" y="156.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="508.0" cy="160.0" r="5.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="508.0" y="169.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="498.0" cy="166.0" r="5.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="498.0" y="175.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="485.0" cy="172.0" r="5.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="485.0" y="167.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="470.0" cy="178.0" r="5.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="470.0" y="180.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<line x1="160.0" y1="160.0" x2="110.0" y2="160.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="125.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">E₁ (слабке)</text>
<line x1="515.0" y1="160.0" x2="620.0" y2="160.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="570.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">E₂ ∝ 1/R₂ (сильне!)</text>
<rect x="57.9" y="243.2" width="604.2" height="43.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="261.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Потенціал однаковий: V₁ = V₂  ⇒  q₁/R₁ = q₂/R₂  ⇒  σ₂/σ₁ = R₁/R₂</tspan><tspan x="360.0" dy="15.6">На гострих ділянках (малий R) густина заряду σ та напруженість E_n = σ/ε₀ максимальні!</tspan></text>
</svg>