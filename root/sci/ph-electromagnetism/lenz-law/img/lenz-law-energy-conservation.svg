<line x1="560.0" y1="166.0" x2="560.0" y2="190.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="410.0" y="190.0" width="300.0" height="36.0" rx="6" fill="#fdeea9" stroke="#d35400" stroke-width="1.5"/><text x="560.0" y="211.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">3. Самоприскорення магніту (v → ∞)</tspan></text>
<line x1="560.0" y1="226.0" x2="560.0" y2="250.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="410.0" y="250.0" width="300.0" height="42.0" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/><text x="560.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="560.0" dy="0.0">4. Генерація нескінченної енергії з нічого!</tspan><tspan x="560.0" dy="13.0">(ПОРУШЕННЯ ЗАКНУ ЗБЕРЕЖЕННЯ ЕНЕРГІЇ)</tspan></text>
</svg>