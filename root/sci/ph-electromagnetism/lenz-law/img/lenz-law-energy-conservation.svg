<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 780 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="780" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило Ленца гарантує збереження енергії</text>
<rect x="0.0" y="0.0" width="760.0" height="340.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<line x1="380.0" y1="40.0" x2="380.0" y2="320.0" stroke="#d6dde6" stroke-width="1.4" stroke-dasharray="5,5"/>
<rect x="20.0" y="20.0" width="340.0" height="28.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="190.0" y="38.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Реальний фізичний світ (E = -dΦ/dt)</tspan></text>
<rect x="30.0" y="70.0" width="300.0" height="36.0" rx="6" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.5"/><text x="180.0" y="91.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle"><tspan x="180.0" dy="0.0">1. Механічна робота зовні (F_рух · Δx)</tspan></text>
<line x1="180.0" y1="106.0" x2="180.0" y2="130.0" stroke="#2c3e50" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="130.0" width="300.0" height="36.0" rx="6" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.5"/><text x="180.0" y="151.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle"><tspan x="180.0" dy="0.0">2. Індукційна ЕРС та струм I_інд у витку</tspan></text>
<line x1="180.0" y1="166.0" x2="180.0" y2="190.0" stroke="#2c3e50" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="190.0" width="300.0" height="36.0" rx="6" fill="#fcedec" stroke="#c0392b" stroke-width="1.5"/><text x="180.0" y="211.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">3. Гальмівна сила Ампера (F_гальм проти v)</tspan></text>
<line x1="180.0" y1="226.0" x2="180.0" y2="250.0" stroke="#2c3e50" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="30.0" y="250.0" width="300.0" height="36.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="271.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">4. Джоулеве тепло Q = I²·R·t (дисипація)</tspan></text>
<rect x="400.0" y="20.0" width="340.0" height="28.0" rx="6" fill="#fcedec" stroke="#c0392b" stroke-width="1.5"/><text x="570.0" y="38.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Гіпотетична катастрофа (якби E = +dΦ/dt)</tspan></text>
<rect x="410.0" y="70.0" width="300.0" height="36.0" rx="6" fill="#ffffff" stroke="#bdc3c7" stroke-width="1.5"/><text x="560.0" y="91.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle"><tspan x="560.0" dy="0.0">1. Легкий поштовх магніту до витку</tspan></text>
<line x1="560.0" y1="106.0" x2="560.0" y2="130.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
