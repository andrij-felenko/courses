<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 650 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="650" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="620.0" height="340.0" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0"/>
<path d="M 120,180 C 140,110 320,110 360,180 C 380,250 200,270 120,180 Z" fill="#eaf0fd" stroke="#c0392b" stroke-width="2.5"/>
<text x="240.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Поверхня S</text>
<line x1="340.0" y1="220.0" x2="310.0" y2="240.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="340.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Контур C (напрям dl)</text>
<line x1="160.0" y1="130.0" x2="220.0" y2="120.0" stroke="#8e44ad" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="180.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="middle" font-weight="700">A (векторний потенціал)</text>
<line x1="200.0" y1="190.0" x2="210.0" y2="130.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="260.0" y1="180.0" x2="270.0" y2="120.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="230.0" y1="240.0" x2="240.0" y2="180.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="290.0" y1="220.0" x2="300.0" y2="160.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="295.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">B = ∇ × A</text>
<rect x="420.0" y="45.0" width="200.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#8e44ad" stroke-width="2.0"/><text x="520.0" y="61.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Теорема Стокса:</tspan><tspan x="520.0" dy="18.2"></tspan><tspan x="520.0" dy="18.2">Φ = ∬_S B · dA</tspan><tspan x="520.0" dy="18.2">  = ∬_S (∇ × A) · dA</tspan><tspan x="520.0" dy="18.2">  = ∮_C A · dl</tspan></text>
<rect x="420.0" y="160.0" width="200.0" height="165.0" rx="6" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/><text x="520.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Значення зв'язку B та A:</tspan><tspan x="520.0" dy="13.0"></tspan><tspan x="520.0" dy="13.0">• Потік — це циркуляція</tspan><tspan x="520.0" dy="13.0">  векторного потенціалу A</tspan><tspan x="520.0" dy="13.0">  вздовж замкненого контуру C.</tspan><tspan x="520.0" dy="13.0"></tspan><tspan x="520.0" dy="13.0">• Не залежить від формації</tspan><tspan x="520.0" dy="13.0">  поверхні S, натягнутої</tspan><tspan x="520.0" dy="13.0">  на контур C.</tspan></text>
</svg>