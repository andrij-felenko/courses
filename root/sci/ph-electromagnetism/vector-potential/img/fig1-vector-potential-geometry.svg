<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 780 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="780" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="420.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометричний зв'язок струму I, векторного потенціалу A та індукції B</text>
<path d="M 100 230 A 140 50 0 0 1 380 230" stroke="#c0392b" stroke-width="3.5" fill="none" stroke-dasharray="6,4"/>
<line x1="240.0" y1="320.0" x2="240.0" y2="100.0" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="240.0" y1="290.0" x2="240.0" y2="90.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="265.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">B = ∇ × A</text>
<path d="M 200 230 C 170 130, 70 130, 70 230 C 70 320, 170 320, 200 230" stroke="#27ae60" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
<line x1="70.0" y1="240.0" x2="70.0" y2="220.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 280 230 C 310 130, 410 130, 410 230 C 410 320, 310 320, 280 230" stroke="#27ae60" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
<line x1="410.0" y1="240.0" x2="410.0" y2="220.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 100 230 A 140 50 0 0 0 380 230" stroke="#c0392b" stroke-width="3.5" fill="none"/>
<line x1="210.0" y1="280.0" x2="270.0" y2="280.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="261.2" y="285.5" width="137.6" height="19.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/><text x="330.0" y="298.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">Струм I (густина J)</tspan></text>
<path d="M 65 230 A 175 68 0 1 0 415 230" stroke="#2457d6" stroke-width="2.0" fill="none" stroke-dasharray="5,3"/>
<path d="M 415 230 A 175 68 0 0 0 65 230" stroke="#2457d6" stroke-width="2.0" fill="none"/>
<line x1="200.0" y1="298.0" x2="280.0" y2="298.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="50.8" y="306.5" width="178.5" height="19.0" rx="6" fill="#f0f7ff" stroke="#2457d6" stroke-width="1.5"/><text x="140.0" y="319.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="140.0" dy="0.0">Векторний потенціал A ∥ J</tspan></text>
<rect x="410.0" y="50.0" width="335.0" height="320.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="580.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Теорема Стокса для потоку</text>
<rect x="448.8" y="102.3" width="262.3" height="35.3" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="580.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Магнітна індукція — ротор потенціалу:</tspan><tspan x="580.0" dy="14.3">B = ∇ × A   (бо ∇ · B = 0)</tspan></text>
<rect x="462.5" y="172.3" width="235.1" height="35.3" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="580.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Магнітний потік крізь поверхню S:</tspan><tspan x="580.0" dy="14.3">Φ = ∬_S B · dS = ∮_∂S A · dl</tspan></text>
<rect x="459.0" y="243.1" width="242.0" height="63.9" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="580.0" y="257.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">Геометричний принцип:</tspan><tspan x="580.0" dy="14.3">• Лінії A співнапрямлені зі струмом J</tspan><tspan x="580.0" dy="14.3">• Ротор A створює вихрове поле B</tspan><tspan x="580.0" dy="14.3">• Циркуляція A дає повний потік Φ</tspan></text>
<rect x="47.6" y="387.0" width="664.7" height="22.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="402.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Векторний потенціал A направлений вздовж струму-джерела, а його ротор утворює індукцію B</tspan></text>
</svg>