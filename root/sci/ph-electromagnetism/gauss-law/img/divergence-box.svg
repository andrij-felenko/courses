<rect x="479.2" y="96.0" width="211.5" height="188.0" rx="6" fill="#eafaf1" stroke="#a3e4d7" stroke-width="1.4"/><text x="585.0" y="116.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Різниця потоків по X:</tspan><tspan x="585.0" dy="15.6">ΔΦ_x = (∂Ex / ∂x) · dx dy dz</tspan><tspan x="585.0" dy="15.6"></tspan><tspan x="585.0" dy="15.6">Сумарний потік з кубика:</tspan><tspan x="585.0" dy="15.6">dΦ_E = (∇ · E) · dV</tspan><tspan x="585.0" dy="15.6"></tspan><tspan x="585.0" dy="15.6">Заряд у кубику:</tspan><tspan x="585.0" dy="15.6">dQ = ρ · dV</tspan><tspan x="585.0" dy="15.6"></tspan><tspan x="585.0" dy="15.6">Рівняння Максвелла I:</tspan><tspan x="585.0" dy="15.6">∇ · E = ρ / ε₀</tspan></text>
