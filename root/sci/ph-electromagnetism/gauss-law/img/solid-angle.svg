<rect x="459.0" y="111.6" width="232.0" height="156.8" rx="6" fill="#eef6ff" stroke="#99ccff" stroke-width="1.4"/><text x="575.0" y="131.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">Площа сферичного майданчика:</tspan><tspan x="575.0" dy="15.6">dA1 = r1² · dΩ</tspan><tspan x="575.0" dy="15.6"></tspan><tspan x="575.0" dy="15.6">Потік Кулонівського поля:</tspan><tspan x="575.0" dy="15.6">dΦ_E = (q / 4πε₀r1²) · dA1</tspan><tspan x="575.0" dy="15.6">     = (q / 4πε₀) · dΩ</tspan><tspan x="575.0" dy="15.6"></tspan><tspan x="575.0" dy="15.6">Потік однаковий через будь-який</tspan><tspan x="575.0" dy="15.6">переріз конуса!</tspan></text>
