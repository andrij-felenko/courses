<text x="410.0" y="352.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">DC у ті часи не вміли підвищувати в напрузі — тож він застрягав біля станції.</text>
<text x="410.0" y="370.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">AC + трансформатор пускали струм на далекі відстані. Це й вирішило все.</text>
