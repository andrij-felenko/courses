<text x="410.0" y="308.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">«230 В» у розетці — це RMS, а не пік. Мультиметр у режимі AC показує саме RMS.</text>
<text x="410.0" y="328.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Пік = RMS × √2 = 230 × 1.414 ≈ 325 В.</text>
