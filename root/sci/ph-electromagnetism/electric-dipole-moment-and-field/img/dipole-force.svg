<rect x="459.7" y="245.2" width="220.6" height="159.7" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="570.0" y="264.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Принцип діелектрофорезу:</tspan><tspan x="570.0" dy="14.3"></tspan><tspan x="570.0" dy="14.3">1. Однорідне поле: F_net = 0</tspan><tspan x="570.0" dy="14.3">2. Неоднорідне поле:</tspan><tspan x="570.0" dy="14.3">   |F₊| &gt; |F₋|, бо E(r₊) &gt; E(r₋)</tspan><tspan x="570.0" dy="14.3">3. Результуюча сила:</tspan><tspan x="570.0" dy="14.3">   F = (p · ∇) E</tspan><tspan x="570.0" dy="14.3"></tspan><tspan x="570.0" dy="14.3">Нейтральне полярне тіло</tspan><tspan x="570.0" dy="14.3">ВТЯГУЄТЬСЯ в сильне поле!</tspan></text>
