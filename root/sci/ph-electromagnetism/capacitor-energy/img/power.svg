<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
<rect width="760" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="380.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Та сама енергія, віддана швидко — це велика потужність</text>
<text x="380.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">конденсатор довго накопичує (мала потужність), а віддає ривком (велика)</text>
<line x1="90.0" y1="330.0" x2="90.0" y2="90.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<line x1="90.0" y1="330.0" x2="700.0" y2="330.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="706.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">час</text>
<text x="84.0" y="84.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">потужність</text>
<rect x="130.0" y="284.0" width="250.0" height="46.0" rx="0" fill="#e7f0e0" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="255.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">зарядка: довго, мала потужність</text>
<text x="255.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="italic">площа = енергія</text>
<rect x="470.0" y="100.0" width="24.0" height="230.0" rx="0" fill="#f3dede" stroke="#c0271e" stroke-width="1.8"/>
<text x="560.0" y="180.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">розряд: мить,</text>
<text x="560.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">велика потужність</text>
<text x="482.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(та сама площа)</text>
<rect x="60.0" y="360.0" width="640.0" height="28.0" rx="8" fill="#fdeded" stroke="#c0271e" stroke-width="1.4"/>
<text x="380.0" y="379.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Спалах і дефібрилятор: накопичити поволі від слабкого джерела — віддати кіловатним імпульсом.</text>
</svg>
