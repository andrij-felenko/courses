<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 780 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="780" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="380.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тепловий баланс та умова теплового вибуху в діелектрику</text>
<line x1="100.0" y1="320.0" x2="700.0" y2="320.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="700.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Температура T (°C)</text>
<line x1="100.0" y1="320.0" x2="100.0" y2="60.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="90.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Потужність Q (Вт)</text>
<line x1="150.0" y1="320.0" x2="150.0" y2="70.0" stroke="#bdc3c7" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="150.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">T0 (довкілля)</text>
<line x1="150.0" y1="320.0" x2="650.0" y2="90.0" stroke="#27ae60" stroke-width="2.2"/>
<text x="560.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Тепловідведення Q_loss = λ (T - T0)</text>
<path d="M 150.0 320.0 L 280.0 290.0 L 450.0 240.0 L 620.0 130.0" fill="none" stroke="#2457d6" stroke-width="2.0"/>
<text x="520.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Q_gen (слабке поле E1 &lt; E_cr)</text>
<circle cx="315.0" cy="278.0" r="6.0" fill="#27ae60" stroke="none" stroke-width="1.5"/>
<text x="315.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Точка стабільності A</text>
<path d="M 150.0 320.0 L 280.0 265.0 L 420.0 206.0 L 600.0 80.0" fill="none" stroke="#d35400" stroke-width="2.0" stroke-dasharray="5,5"/>
<circle cx="420.0" cy="206.0" r="6.0" fill="#d35400" stroke="none" stroke-width="1.5"/>
<text x="420.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d35400" text-anchor="middle" font-weight="700">Критична точка E_cr</text>
<path d="M 150.0 320.0 L 260.0 250.0 L 380.0 180.0 L 520.0 60.0" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<text x="220.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Q_gen (E3 &gt; E_cr): Тепловий вибух!</text>
<line x1="400.0" y1="170.0" x2="400.0" y2="110.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="410.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">Q_gen &gt; Q_loss (некерований нагрів)</text>
</svg>