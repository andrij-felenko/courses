<text x="180.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">U = V₁ - V₂</text>
<rect x="82.1" y="236.2" width="235.8" height="47.6" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="200.0" y="256.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="200.0" dy="0.0">R = ρ · L / A</tspan><tspan x="200.0" dy="15.6">I = U / R = (U · A) / (ρ · L)</tspan></text>
<line x1="383.0" y1="170.0" x2="407.0" y2="170.0" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
