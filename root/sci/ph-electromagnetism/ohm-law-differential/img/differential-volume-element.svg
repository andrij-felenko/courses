<text x="645.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">j(r)</text>
<text x="560.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">j = I / A,  E = U / L</text>
<rect x="466.2" y="230.1" width="237.6" height="49.9" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="585.0" y="251.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="585.0" dy="0.0">j = σ · E   або   E = ρ · j</tspan><tspan x="585.0" dy="16.9">σ = 1 / ρ  [См/м]</tspan></text>
</svg>