<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 800 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="800" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="780.0" height="330.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="390.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Температурна залежність питомого опору: метали проти напівпровідників</text>
<rect x="20.0" y="46.0" width="360.0" height="264.0" rx="8" fill="#fafbfc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="200.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Метали (ρ зростає з T)</text>
<line x1="60.0" y1="250.0" x2="350.0" y2="250.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">T [K]</text>
<line x1="60.0" y1="250.0" x2="60.0" y2="90.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="45.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ρ</text>
<line x1="60.0" y1="215.0" x2="120.0" y2="210.0" stroke="#dc2626" stroke-width="2.5"/>
<line x1="120.0" y1="210.0" x2="330.0" y2="110.0" stroke="#dc2626" stroke-width="2.5"/>
<circle cx="60.0" cy="215.0" r="3.5" fill="#dc2626" stroke="#991b1b" stroke-width="1.2"/>
<text x="75.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">ρ_залишк</text>
<text x="230.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">ρ(T) = ρ₀(1 + αΔT)</text>
<text x="200.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">n = const, розсіювання на фононах зростає</text>
<rect x="400.0" y="46.0" width="360.0" height="264.0" rx="8" fill="#fafbfc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="580.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Напівпровідники (ρ спадає з T)</text>
<line x1="440.0" y1="250.0" x2="730.0" y2="250.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="720.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">T [K]</text>
<line x1="440.0" y1="250.0" x2="440.0" y2="90.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="425.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">ρ</text>
<line x1="450.0" y1="105.0" x2="470.0" y2="125.0" stroke="#2563eb" stroke-width="2.5"/>
<line x1="470.0" y1="125.0" x2="500.0" y2="165.0" stroke="#2563eb" stroke-width="2.5"/>
<line x1="500.0" y1="165.0" x2="540.0" y2="205.0" stroke="#2563eb" stroke-width="2.5"/>
<line x1="540.0" y1="205.0" x2="600.0" y2="230.0" stroke="#2563eb" stroke-width="2.5"/>
<line x1="600.0" y1="230.0" x2="710.0" y2="242.0" stroke="#2563eb" stroke-width="2.5"/>
<text x="610.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">ρ(T) ∝ exp(E_g / 2kT)</text>
<text x="580.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">n(T) експоненційно зростає (термогенерація)</text>
</svg>