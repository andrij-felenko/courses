<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 800 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="800" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="780.0" height="320.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="390.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анізотропія закону Ома у магнітному полі: кут Холла та недіагональна провідність</text>
<rect x="20.0" y="46.0" width="360.0" height="254.0" rx="8" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="200.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Векторне відхилення j від E</text>
<line x1="90.0" y1="220.0" x2="310.0" y2="140.0" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="325.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">E</text>
<line x1="90.0" y1="220.0" x2="300.0" y2="220.0" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="315.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="700">j</text>
<text x="210.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">θ_H</text>
<circle cx="80.0" cy="95.0" r="12.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<circle cx="80.0" cy="95.0" r="3.0" fill="#2563eb" stroke="#2563eb" stroke-width="1.0"/>
<text x="105.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">B ⊙ (перпендикулярно)</text>
<text x="200.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Сила Лоренца F_L = q(v_d × B) розвертає j</text>
<rect x="400.0" y="46.0" width="360.0" height="254.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="580.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тензорний закон Ома: j_i = ∑ σ_ik E_k</text>
<rect x="432.4" y="108.4" width="295.3" height="63.2" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="580.0" y="128.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">┌ j_x ┐   ┌  σ_xx   σ_xy  0 ┐ ┌ E_x ┐</tspan><tspan x="580.0" dy="15.6">│ j_y │ = │ -σ_xy   σ_xx  0 │ │ E_y │</tspan><tspan x="580.0" dy="15.6">└ j_z ┘   └   0       0   σ ┘ └ E_z ┘</tspan></text>
<rect x="421.2" y="216.2" width="317.6" height="47.6" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="580.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">σ_xx = σ₀ / (1 + (ω_c · τ)²)</tspan><tspan x="580.0" dy="15.6">σ_xy = σ₀ · (ω_c · τ) / (1 + (ω_c · τ)²)</tspan></text>
</svg>