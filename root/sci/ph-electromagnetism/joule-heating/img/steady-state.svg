<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420">
<rect width="820" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Чому температура зупиняється: тепло-вхід = тепло-вихід</text>
<text x="410.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">тіло гріється, доки відведення тепла не зрівняється з виділенням I²R</text>
<line x1="110.0" y1="330.0" x2="730.0" y2="330.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="736.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">температура</text>
<line x1="110.0" y1="330.0" x2="110.0" y2="92.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="102.0" y="86.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1b1b1b" text-anchor="end" font-weight="normal" font-style="normal">потужність</text>
<line x1="110.0" y1="180.0" x2="700.0" y2="180.0" stroke="#c0271e" stroke-width="2.6" stroke-linecap="round"/>
<text x="698.0" y="170.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">виділення I²R (стале)</text>
<line x1="110.0" y1="330.0" x2="640.0" y2="100.0" stroke="#1f47b5" stroke-width="2.6" stroke-linecap="round"/>
<text x="556.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">відведення (саме повітря)</text>
<line x1="110.0" y1="330.0" x2="430.0" y2="100.0" stroke="#1f8a3b" stroke-width="2.6" stroke-linecap="round"/>
<text x="330.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">з радіатором</text>
<circle cx="456.0" cy="180.0" r="5.0" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<line x1="456.0" y1="180.0" x2="456.0" y2="330.0" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="456.0" y="349.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">T₁ — гаряче</text>
<circle cx="319.0" cy="180.0" r="5.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="1"/>
<line x1="319.0" y1="180.0" x2="319.0" y2="330.0" stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="3,3" stroke-linecap="round"/>
<text x="319.0" y="349.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">T₂ — прохолодніше</text>
<text x="410.0" y="402.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Краще відведення (радіатор, обдув, площа) — та сама потужність дає НИЖЧУ температуру.</text>
</svg>
