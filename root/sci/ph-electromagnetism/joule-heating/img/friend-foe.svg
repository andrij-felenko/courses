<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420">
<rect width="820" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="410.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Те саме тепло: коли друг, а коли ворог</text>
<text x="410.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">джоулеве тепло бажане в нагрівачі — і шкідливе в процесорі</text>
<line x1="410.0" y1="78.0" x2="410.0" y2="390.0" stroke="#e4e4e4" stroke-width="1.4" stroke-dasharray="4,5" stroke-linecap="round"/>
<text x="190.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Тепло — МЕТА</text>
<path d="M 60.0,146 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#1f8a3b" stroke-width="1.8"/>
<path d="M 72.0,146 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="92.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Чайник, нагрівач</text>
<text x="92.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">усю потужність — у тепло води/повітря</text>
<path d="M 60.0,202 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#1f8a3b" stroke-width="1.8"/>
<path d="M 72.0,202 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="92.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Лампа розжарення</text>
<text x="92.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">нитка світить, бо розжарена струмом</text>
<path d="M 60.0,258 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#1f8a3b" stroke-width="1.8"/>
<path d="M 72.0,258 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="92.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Запобіжник</text>
<text x="92.0" y="267.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">навмисно перегоряє від надструму (I²R·t)</text>
<path d="M 60.0,314 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#1f8a3b" stroke-width="1.8"/>
<path d="M 72.0,314 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="92.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Паяльник</text>
<text x="92.0" y="323.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">розжарене жало плавить припій</text>
<text x="580.0" y="102.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Тепло — ВОРОГ</text>
<path d="M 450.0,146 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#c0271e" stroke-width="1.8"/>
<path d="M 462.0,146 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#c0271e" stroke-width="1.8"/>
<text x="482.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Процесор</text>
<text x="482.0" y="155.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">нагрів обмежує швидкість, треба радіатор</text>
<path d="M 450.0,202 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#c0271e" stroke-width="1.8"/>
<path d="M 462.0,202 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#c0271e" stroke-width="1.8"/>
<text x="482.0" y="194.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Силовий дріт</text>
<text x="482.0" y="211.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">втрати I²R і пожежна небезпека</text>
<path d="M 450.0,258 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#c0271e" stroke-width="1.8"/>
<path d="M 462.0,258 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#c0271e" stroke-width="1.8"/>
<text x="482.0" y="250.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Акумулятор</text>
<text x="482.0" y="267.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">нагрів старить і веде до теплової втечі (§3.4)</text>
<path d="M 450.0,314 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#c0271e" stroke-width="1.8"/>
<path d="M 462.0,314 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#c0271e" stroke-width="1.8"/>
<text x="482.0" y="306.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Блок живлення</text>
<text x="482.0" y="323.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">тепло = змарнована енергія, нижчий ККД</text>
</svg>
