  <marker id="aOrange" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#e08030"/></marker>
</defs>
<text x="430.0" y="32.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Джоулеве тепло: у чистому опорі ВСЯ потужність стає теплом</text>
<text x="430.0" y="54.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">електрична енергія на опорі не «зникає» — вона цілком переходить у тепло</text>
<rect x="70.0" y="110.0" width="150.0" height="60.0" rx="10" fill="#eaf0fb" stroke="#1f47b5" stroke-width="2"/>
<text x="145.0" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">електрична</text>
<text x="145.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">P = I²R</text>
<line x1="222.0" y1="140.0" x2="300.0" y2="140.0" stroke="#1b1b1b" stroke-width="2.6" marker-end="url(#aInk)"/>
<rect x="305.0" y="125.0" width="90.0" height="30.0" rx="3" fill="#fff" stroke="#1b1b1b" stroke-width="2"/>
<text x="350.0" y="117.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="italic">R</text>
<path d="M 332.0,116 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#c0271e" stroke-width="1.8"/>
<path d="M 344.0,116 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#c0271e" stroke-width="1.8"/>
<path d="M 356.0,116 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#c0271e" stroke-width="1.8"/>
<path d="M 368.0,116 q 5,-8 0,-16 q -5,-8 0,-16" fill="none" stroke="#c0271e" stroke-width="1.8"/>
<line x1="402.0" y1="140.0" x2="480.0" y2="140.0" stroke="#c0271e" stroke-width="2.6" marker-end="url(#aRed)"/>
<rect x="480.0" y="110.0" width="170.0" height="60.0" rx="10" fill="#fbecea" stroke="#c0271e" stroke-width="2"/>
<text x="565.0" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">тепло</text>
<text x="565.0" y="156.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">усі 100 %</text>
<text x="360.0" y="196.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">жодна частка не йде «кудись іще» — чистий опір тільки гріє</text>
<line x1="70.0" y1="224.0" x2="790.0" y2="224.0" stroke="#e4e4e4" stroke-width="1.4" stroke-linecap="round"/>
<text x="430.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Для порівняння — де потужність ділиться між користю й теплом:</text>
<rect x="95.0" y="268.0" width="190.0" height="88.0" rx="10" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="190.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">резистор</text>
<text x="190.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">усе → тепло</text>
<text x="190.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">(тепло — це і є робота)</text>
<rect x="345.0" y="268.0" width="190.0" height="88.0" rx="10" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="440.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">мотор</text>
<text x="440.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">частина → рух</text>
<text x="440.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">+ тепло втрат</text>
<rect x="595.0" y="268.0" width="190.0" height="88.0" rx="10" fill="#f6f8fc" stroke="#1b1b1b" stroke-width="1.4"/>
<text x="690.0" y="294.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">світлодіод</text>
<text x="690.0" y="318.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#e08030" text-anchor="middle" font-weight="bold" font-style="normal">частина → світло</text>
<text x="690.0" y="340.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">+ тепло втрат</text>
</svg>
