<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480">
<rect width="880" height="480" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Що дають 100 пФ і 1.5 кОм у числах</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">однакові Cб і Rб; змінюється лише напруга, до якої заряджене тіло</text>
<rect x="70.0" y="92.0" width="740.0" height="40.0" rx="8" fill="#eef1f4" stroke="#8a8a8a" stroke-width="1.6"/>
<text x="200.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Напруга тіла V</text>
<text x="472.5" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Пік струму  Iпік = V/Rб</text>
<text x="732.5" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Енергія  E = ½·Cб·V²</text>
<rect x="70.0" y="132.0" width="740.0" height="78.0" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="200.0" y="166.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">2 кВ</text>
<text x="472.5" y="166.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">1.3 А</text>
<text x="732.5" y="166.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">0.2 мДж</text>
<text x="440.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ледь відчутно як іскра</text>
<rect x="70.0" y="210.0" width="740.0" height="78.0" rx="0" fill="#f7f9fb" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="200.0" y="244.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">4 кВ</text>
<text x="472.5" y="244.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">2.7 А</text>
<text x="732.5" y="244.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">0.8 мДж</text>
<text x="440.0" y="270.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">типовий «дотик» узимку</text>
<rect x="70.0" y="288.0" width="740.0" height="78.0" rx="0" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2"/>
<text x="200.0" y="322.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">8 кВ</text>
<text x="472.5" y="322.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">5.3 А</text>
<text x="732.5" y="322.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">3.2 мДж</text>
<text x="440.0" y="348.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">помітна іскра й тріск</text>
<rect x="70.0" y="382.0" width="740.0" height="78.0" rx="10" fill="#fbf7ec" stroke="#caa24a" stroke-width="2"/>
<text x="440.0" y="408.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Пік струму росте лінійно з напругою (I = V/Rб), а енергія — квадратично (E ~ V²).</text>
<text x="440.0" y="432.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#7a5a14" text-anchor="middle" font-weight="normal" font-style="normal">Заряду тут мізерно (нанокулони), але крізь тонкий ізолятор входу ці ампери б'ють руйнівно.</text>
<text x="440.0" y="452.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Поріг відчуття людиною (≈3 кВ) — у рази вищий за поріг загибелі мікросхеми.</text>
</svg>
