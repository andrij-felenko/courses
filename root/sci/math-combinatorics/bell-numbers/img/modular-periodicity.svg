<text x="410.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">B₅ ≡ B₃ + B₂ (mod 3)  ⇒  52 ≡ 5 + 2 ≡ 7 ≡ 1 (mod 3)</text>
<text x="410.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">B₆ ≡ B₄ + B₃ (mod 3)  ⇒  203 ≡ 15 + 5 ≡ 20 ≡ 2 (mod 3)</text>
<rect x="4.6" y="415.6" width="810.9" height="48.8" rx="6" fill="#fbfbfc" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="436.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Теорема Радемахера-Левіна: період послідовності (Bₙ mod p) завжди є дільником (pᵖ − 1)/(p − 1).</tspan><tspan x="410.0" dy="16.2">Для p = 2 період дорівнює 3 (1, 1, 0, 1, 1, 0...); для p = 3 період дорівнює 13; для p = 5 період дорівнює 781.</tspan></text>
