<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="420.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Складання ДНК-послідовностей (De Novo Assembly) через k-мери</text>
<rect x="24.7" y="56.2" width="250.6" height="47.6" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="150.0" y="76.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1. Сирі зчитування (Reads, k=4)</tspan><tspan x="150.0" dy="15.6">'ATGC', 'TGCC', 'GCCA'</tspan></text>
<line x1="270.0" y1="80.0" x2="330.0" y2="80.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="295.2" y="56.2" width="369.7" height="47.6" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="480.0" y="76.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">2. Вершини (3-мери): 'ATG', 'TGC', 'GCC', 'CCA'</tspan><tspan x="480.0" dy="15.6">Ребра (4-мери): перекриття довжиною k-1=3 білки</tspan></text>
<line x1="480.0" y1="125.0" x2="480.0" y2="160.0" stroke="#0d9488" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="170.0" width="800.0" height="160.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="440.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="700">3. Граф де Брейнена: Вершини (3-мери) та спрямовані ребра (4-мери)</text>
<rect x="97.0" y="223.0" width="46.0" height="34.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="120.0" y="244.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">ATG</tspan></text>
<rect x="307.0" y="223.0" width="46.0" height="34.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="330.0" y="244.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="330.0" dy="0.0">TGC</tspan></text>
<rect x="527.0" y="223.0" width="46.0" height="34.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="550.0" y="244.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">GCC</tspan></text>
<rect x="737.0" y="223.0" width="46.0" height="34.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="760.0" y="244.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">CCA</tspan></text>
<line x1="160.0" y1="240.0" x2="290.0" y2="240.0" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="201.4" y="204.5" width="47.3" height="31.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="225.0" y="223.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">ATGC</tspan></text>
<line x1="370.0" y1="240.0" x2="510.0" y2="240.0" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="416.4" y="204.5" width="47.3" height="31.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="440.0" y="223.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">TGCC</tspan></text>
<line x1="590.0" y1="240.0" x2="720.0" y2="240.0" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="631.4" y="204.5" width="47.3" height="31.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="655.0" y="223.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">GCCA</tspan></text>
<text x="440.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-style="italic">Ейлерів шлях: ATG → TGC → GCC → CCA (відвідує кожне ребро-4-мер рівно один раз)</text>
<line x1="440.0" y1="330.0" x2="440.0" y2="360.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="160.0" y="368.5" width="560.0" height="33.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="440.0" y="389.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">4. Відновлений геном (Контиг): 'ATGCCA' (довжина N = 6 нуклеотидів)</tspan></text>
</svg>