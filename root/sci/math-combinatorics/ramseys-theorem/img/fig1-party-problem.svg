<text x="700.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700">Аналіз принципом Діріхле</text>
<rect x="552.1" y="156.6" width="295.9" height="216.9" rx="6" fill="#f8fafc" stroke="#dc2626" stroke-width="1.5"/><text x="700.0" y="175.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">1. Беремо довільну вершину v₁.</tspan><tspan x="700.0" dy="14.3">   З неї виходить 5 ребер.</tspan><tspan x="700.0" dy="14.3"></tspan><tspan x="700.0" dy="14.3">2. За принципом Діріхле (Dirichlet):</tspan><tspan x="700.0" dy="14.3">   принаймні ⌈5/2⌉ = 3 ребра</tspan><tspan x="700.0" dy="14.3">   мають однаковий колір (напр. червоний).</tspan><tspan x="700.0" dy="14.3"></tspan><tspan x="700.0" dy="14.3">3. Нехай це ребра (v₁,v₃), (v₁,v₅), (v₁,v₆).</tspan><tspan x="700.0" dy="14.3"></tspan><tspan x="700.0" dy="14.3">4. Якщо між v₃, v₅, v₆ є хоч одне</tspan><tspan x="700.0" dy="14.3">   червоне ребро → маємо червоний K₃.</tspan><tspan x="700.0" dy="14.3">   Якщо всі ребра сині → маємо синій K₃.</tspan><tspan x="700.0" dy="14.3"></tspan><tspan x="700.0" dy="14.3">Висновок: R(3, 3) = 6.</tspan></text>
</svg>