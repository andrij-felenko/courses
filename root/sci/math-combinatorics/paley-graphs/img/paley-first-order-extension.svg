<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="400.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Аксіома розширення першого порядку A_{s, t} у графах Пейлі</text>
<rect x="30.0" y="60.0" width="470.0" height="330.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="265.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Пошук вузла розширення z для неперетинних U і W</text>
<rect x="50.0" y="110.0" width="160.0" height="160.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/>
<text x="130.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="middle" font-weight="700">Множина U (|U| = s)</text>
<text x="130.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-style="italic">всі мають бути суміжними</text>
<circle cx="90.0" cy="185.0" r="14.0" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
<text x="90.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">u1</text>
<circle cx="170.0" cy="185.0" r="14.0" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
<text x="170.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">u2</text>
<circle cx="130.0" cy="235.0" r="14.0" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
<text x="130.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">u3</text>
<rect x="50.0" y="290.0" width="160.0" height="85.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="130.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">Множина W (|W| = t)</text>
<text x="130.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-style="italic">всі мають бути несуміжними</text>
<circle cx="90.0" cy="350.0" r="14.0" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
<text x="90.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">w1</text>
<circle cx="170.0" cy="350.0" r="14.0" fill="#ffffff" stroke="#dc2626" stroke-width="1.8"/>
<text x="170.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">w2</text>
<circle cx="400.0" cy="220.0" r="22.0" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2.5"/>
<text x="400.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#7e22ce" text-anchor="middle" font-weight="700">z</text>
<text x="400.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7e22ce" text-anchor="middle" font-weight="700">Вузол свідка z</text>
<line x1="90.0" y1="185.0" x2="400.0" y2="220.0" stroke="#16a34a" stroke-width="2.0"/>
<line x1="170.0" y1="185.0" x2="400.0" y2="220.0" stroke="#16a34a" stroke-width="2.0"/>
<line x1="130.0" y1="235.0" x2="400.0" y2="220.0" stroke="#16a34a" stroke-width="2.0"/>
<line x1="90.0" y1="350.0" x2="400.0" y2="220.0" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="170.0" y1="350.0" x2="400.0" y2="220.0" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="515.0" y="60.0" width="335.0" height="330.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="682.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Оцінка через суми Вейля</text>
<rect x="534.1" y="119.4" width="295.9" height="231.2" rx="6" fill="#fff6e5" stroke="#d97706" stroke-width="1.5"/><text x="682.0" y="138.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="682.0" dy="0.0">Кількість свідків N(U, W):</tspan><tspan x="682.0" dy="14.3"></tspan><tspan x="682.0" dy="14.3">N(U, W) = ∑_{z ∉ U∪W} ∏_{u∈U} (1+χ(z-u))/2</tspan><tspan x="682.0" dy="14.3">                   · ∏_{w∈W} (1-χ(z-w))/2</tspan><tspan x="682.0" dy="14.3"></tspan><tspan x="682.0" dy="14.3">За оцінкою характерних сум Вейля:</tspan><tspan x="682.0" dy="14.3">| N(U,W) - q/2ˢ⁺ᵗ | ≤ 1/2 ( (s+t-2)√q + 1 )</tspan><tspan x="682.0" dy="14.3"></tspan><tspan x="682.0" dy="14.3">Умова існування свідка z:</tspan><tspan x="682.0" dy="14.3">Якщо q &gt; (s + t)² · 2²⁽ˢ⁺ᵗ⁾, то N(U, W) &gt; 0.</tspan><tspan x="682.0" dy="14.3"></tspan><tspan x="682.0" dy="14.3">Наслідок для теорії моделей:</tspan><tspan x="682.0" dy="14.3">Графи Пейлі є скінченними детермінованими</tspan><tspan x="682.0" dy="14.3">апроксимаціями універсального випадкового</tspan><tspan x="682.0" dy="14.3">графа Радо (Rado graph).</tspan></text>
</svg>