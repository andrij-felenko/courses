<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="380.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Спектр матриці суміжності A(P_q) та спектральна щілина</text>
<line x1="80.0" y1="200.0" x2="800.0" y2="200.0" stroke="#475569" stroke-width="2.0"/>
<line x1="440.0" y1="185.0" x2="440.0" y2="215.0" stroke="#94a3b8" stroke-width="1.5"/>
<text x="440.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">0</text>
<line x1="280.0" y1="160.0" x2="280.0" y2="240.0" stroke="#dc2626" stroke-width="3.0"/>
<text x="280.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">s = (-1 - √q)/2</text>
<text x="280.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">кратність (q-1)/2</text>
<line x1="560.0" y1="160.0" x2="560.0" y2="240.0" stroke="#16a34a" stroke-width="3.0"/>
<text x="560.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">r = (-1 + √q)/2</text>
<text x="560.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">кратність (q-1)/2</text>
<line x1="760.0" y1="150.0" x2="760.0" y2="250.0" stroke="#2563eb" stroke-width="3.5"/>
<text x="760.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700">k = (q - 1)/2</text>
<text x="760.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">кратність 1 (вектор 1)</text>
<rect x="560.0" y="100.0" width="200.0" height="32.0" rx="4" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
<text x="660.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7e22ce" text-anchor="middle" font-weight="700">Спектральна щілина γ = k - r = (q - √q)/2</text>
<rect x="97.7" y="278.1" width="684.6" height="73.9" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="440.0" y="297.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Властивості квазівипадковості та розширення:</tspan><tspan x="440.0" dy="14.3">• Друге за модулем власне значення: λ(P_q) = max(|r|, |s|) = (1 + √q)/2 ≈ √q / 2</tspan><tspan x="440.0" dy="14.3">• Нормоване розширення: λ(P_q) / k = (1 + √q)/(q - 1) = 1/(√q - 1) = O(1/√q) → 0 при q → ∞</tspan><tspan x="440.0" dy="14.3">• Expander Mixing Lemma: для будь-яких S, T ⊂ V виконується | e(S,T) - |S|·|T|/2 | ≤ (√q / 2) · √(|S|·|T|)</tspan></text>
</svg>