<rect x="496.4" y="144.4" width="327.2" height="231.2" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="660.0" y="163.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">• Вершини: V = {0, 1, 2, ..., 12} = F₁₃</tspan><tspan x="660.0" dy="14.3">• Квадратичні лишки Q: {1, 3, 4, 9, 10, 12}</tspan><tspan x="660.0" dy="14.3">  (1²=1, 2²=4, 3²=9, 4²=3, 5²=12, 6²=10)</tspan><tspan x="660.0" dy="14.3">• Нерегулярні нелишки N: {2, 5, 6, 7, 8, 11}</tspan><tspan x="660.0" dy="14.3"></tspan><tspan x="660.0" dy="14.3">• Регулярність: d = (13 - 1)/2 = 6 ребер на вузол</tspan><tspan x="660.0" dy="14.3">• Самодоповнюваність: P₁₃ ≅ P̄₁₃</tspan><tspan x="660.0" dy="14.3">  (множення на нелишок 2 переводить граф</tspan><tspan x="660.0" dy="14.3">   у його точне доповнення)</tspan><tspan x="660.0" dy="14.3"></tspan><tspan x="660.0" dy="14.3">• Виділена червоним кліка {0, 1, 4}:</tspan><tspan x="660.0" dy="14.3">  1 - 0 = 1 ∈ Q, 4 - 0 = 4 ∈ Q, 4 - 1 = 3 ∈ Q</tspan><tspan x="660.0" dy="14.3">• Число кліки: ω(P₁₃) = 3</tspan><tspan x="660.0" dy="14.3">• Число незалежності: α(P₁₃) = 3</tspan><tspan x="660.0" dy="14.3">  (оцінка Гофмана: ω, α ≤ ⌊√13⌋ = 3)</tspan></text>
