<text x="420.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Конструкція звідності 3SAT ≤ₚ Гамільтонів цикл (Karp, 1972)</text>
<rect x="30.0" y="60.0" width="480.0" height="370.0" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
<text x="270.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7e22ce" text-anchor="middle" font-weight="700">Гаджет змінної xᵢ (Двонаправлений ланцюг)</text>
