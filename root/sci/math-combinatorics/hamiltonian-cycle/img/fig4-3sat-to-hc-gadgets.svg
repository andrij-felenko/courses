<text x="270.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-style="italic">Вибір напрямку проходження фіксує значення булевої змінної</text>
<rect x="530.0" y="60.0" width="280.0" height="370.0" rx="8" fill="#fff6e5" stroke="#d97706" stroke-width="1.5"/>
<text x="670.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">Гаджет диз'юнкта Cⱼ</text>
<circle cx="670.0" cy="210.0" r="24.0" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
<text x="670.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700">Cⱼ</text>
<text x="670.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вершина диз'юнкта Cⱼ</text>
<text x="670.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">підключається до 3-х треків</text>
<line x1="480.0" y1="180.0" x2="646.0" y2="205.0" stroke="#d97706" stroke-width="2.0" stroke-dasharray="3,3"/>
