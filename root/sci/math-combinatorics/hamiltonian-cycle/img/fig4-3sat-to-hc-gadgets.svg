<circle cx="230.0" cy="250.0" r="8.0" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
<circle cx="310.0" cy="210.0" r="8.0" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
