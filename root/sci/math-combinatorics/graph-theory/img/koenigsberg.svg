<rect x="70.0" y="424.0" width="800.0" height="38.0" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.0"/><text x="470.0" y="439.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Прогулянку, що проходить кожен міст рівно раз, можна замкнути, лише коли непарних вершин нуль або дві.</tspan><tspan x="470.0" dy="16.2">Тут їх чотири — тому такого маршруту немає. Це й довів Ейлер.</tspan></text>
