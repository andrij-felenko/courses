<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="380.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Конструкція Зіг-Заг добутку G ∘ H (Reingold-Vadhan-Wigderson)</text>
<rect x="40.0" y="70.0" width="240.0" height="280.0" rx="8" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/>
<text x="160.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700">Великий граф G</text>
<text x="160.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">N вершин, степінь D</text>
<rect x="320.0" y="70.0" width="240.0" height="280.0" rx="8" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/>
<text x="440.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="700">Малий розширювач H</text>
<text x="440.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">D вершин, степінь d</text>
<circle cx="290.0" cy="210.0" r="18.0" fill="#ffffff" stroke="#475569" stroke-width="2.0"/>
<text x="290.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1e293b" text-anchor="middle" font-weight="700">∘</text>
<rect x="600.0" y="70.0" width="240.0" height="280.0" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2.0"/>
<text x="720.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7e22ce" text-anchor="middle" font-weight="700">Добуток G ∘ H</text>
<rect x="621.1" y="150.0" width="197.8" height="170.0" rx="6" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/><text x="720.0" y="167.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Властивості результату:</tspan><tspan x="720.0" dy="14.3">• Кількість вершин: N · D</tspan><tspan x="720.0" dy="14.3">• Степінь: d² (постійний!)</tspan><tspan x="720.0" dy="14.3">• Спектральна щілина:</tspan><tspan x="720.0" dy="14.3">  успадковує розширення H</tspan><tspan x="720.0" dy="14.3">  та графа G</tspan><tspan x="720.0" dy="14.3"></tspan><tspan x="720.0" dy="14.3">Крок Zig-Zag блукання:</tspan><tspan x="720.0" dy="14.3">1. Крок у копії H (степінь d)</tspan><tspan x="720.0" dy="14.3">2. Крок по ребу G (степінь D)</tspan><tspan x="720.0" dy="14.3">3. Крок у копії H (степінь d)</tspan></text>
</svg>