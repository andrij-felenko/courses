<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="380.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Лема про змішування розширювачів (Expander Mixing Lemma)</text>
<rect x="40.0" y="60.0" width="480.0" height="300.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="280.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#334155" text-anchor="middle" font-weight="700">Множина вершин графа V (|V| = n)</text>
<rect x="80.0" y="110.0" width="160.0" height="220.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="2.0"/>
<text x="160.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">Множина S</text>
<rect x="320.0" y="110.0" width="160.0" height="220.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="2.0"/>
<text x="400.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">Множина T</text>
<line x1="240.0" y1="160.0" x2="320.0" y2="160.0" stroke="#7e22ce" stroke-width="2.2"/>
<line x1="240.0" y1="190.0" x2="320.0" y2="210.0" stroke="#7e22ce" stroke-width="2.2"/>
<line x1="240.0" y1="220.0" x2="320.0" y2="170.0" stroke="#7e22ce" stroke-width="2.2"/>
<line x1="240.0" y1="250.0" x2="320.0" y2="260.0" stroke="#7e22ce" stroke-width="2.2"/>
<line x1="240.0" y1="280.0" x2="320.0" y2="290.0" stroke="#7e22ce" stroke-width="2.2"/>
<text x="280.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7e22ce" text-anchor="middle" font-weight="700">e(S, T)</text>
<rect x="540.1" y="63.9" width="299.9" height="192.3" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="690.0" y="85.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Expander Mixing Lemma:</tspan><tspan x="690.0" dy="14.3"></tspan><tspan x="690.0" dy="14.3">| e(S,T) - (d/n)·|S|·|T| | ≤ λ₂ · √(|S|·|T|)</tspan><tspan x="690.0" dy="14.3"></tspan><tspan x="690.0" dy="14.3">• (d/n)·|S|·|T| — очікувана кількість</tspan><tspan x="690.0" dy="14.3">  ребер у випадковому графі G(n, p=d/n)</tspan><tspan x="690.0" dy="14.3"></tspan><tspan x="690.0" dy="14.3">• λ₂ — друге за величиною власне значення</tspan><tspan x="690.0" dy="14.3">  матриці суміжності</tspan><tspan x="690.0" dy="14.3"></tspan><tspan x="690.0" dy="14.3">Висновок: чим менше λ₂, тим більше</tspan><tspan x="690.0" dy="14.3">структура ребер схожа на випадковий граф!</tspan></text>
</svg>