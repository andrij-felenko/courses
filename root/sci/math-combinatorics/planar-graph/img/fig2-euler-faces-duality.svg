<text x="750.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-style="italic">Алгоритмічна основа DCEL та комбінаторних карт</text>
