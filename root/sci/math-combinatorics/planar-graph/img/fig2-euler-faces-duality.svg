<text x="750.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">Ротація навколо v4:  (v5 → v1 → v3 → v2)</text>
