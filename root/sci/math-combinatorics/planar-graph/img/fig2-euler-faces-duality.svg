<text x="270.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">V = 5 вершин,  E = 8 ребер,  F = 5 граней (4 внутр. + 1 зовн.)</text>
