<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="440.0" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="420.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Динамічне програмування Хелда-Карпа: O(n² · 2ⁿ)</text>
<rect x="40.0" y="60.0" width="760.0" height="45.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="420.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">dp(S, v) = min { dp(S \ {v}, u) + w(u, v) | u ∈ S \ {v} }</text>
<text x="30.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="700">|S| = 1 (База)</text>
<rect x="342.3" y="129.5" width="115.5" height="31.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="400.0" y="148.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">dp({0}, 0) = 0</tspan></text>
<text x="30.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="700">|S| = 2</text>
<rect x="239.1" y="199.5" width="101.8" height="31.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="290.0" y="218.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="290.0" dy="0.0">dp({0,1}, 1)</tspan></text>
<rect x="349.1" y="199.5" width="101.8" height="31.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="400.0" y="218.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">dp({0,2}, 2)</tspan></text>
<rect x="459.1" y="199.5" width="101.8" height="31.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="510.0" y="218.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">dp({0,3}, 3)</tspan></text>
<text x="30.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="700">|S| = 3</text>
<rect x="210.3" y="279.5" width="115.5" height="31.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="268.0" y="298.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="268.0" dy="0.0">dp({0,1,2}, 1)</tspan></text>
<rect x="298.3" y="279.5" width="115.5" height="31.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="356.0" y="298.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="356.0" dy="0.0">dp({0,1,2}, 2)</tspan></text>
<rect x="386.3" y="279.5" width="115.5" height="31.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="444.0" y="298.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="444.0" dy="0.0">dp({0,1,3}, 3)</tspan></text>
<rect x="474.3" y="279.5" width="115.5" height="31.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="532.0" y="298.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="532.0" dy="0.0">dp({0,2,3}, 3)</tspan></text>
<text x="30.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="start" font-weight="700">|S| = 4 (Фінал)</text>
<rect x="274.1" y="364.5" width="251.9" height="31.0" rx="6" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/><text x="400.0" y="383.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">min { dp({0,1,2,3}, v) + w(v, 0) }</tspan></text>
<line x1="290.0" y1="230.0" x2="268.0" y2="280.0" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="290.0" y1="230.0" x2="356.0" y2="280.0" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="400.0" y1="230.0" x2="268.0" y2="280.0" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="400.0" y1="230.0" x2="444.0" y2="280.0" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="660.0" y="115.0" width="155.0" height="310.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="737.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Оцінки ресурсу</text>
<text x="672.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start" font-weight="700">Часова складність:</text>
<text x="672.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="start" font-weight="700">O(n² · 2ⁿ)</text>
<text x="672.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start" font-weight="700">Просторова пам'ять:</text>
<text x="672.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700">O(n · 2ⁿ)</text>
<text x="672.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start" font-weight="700">Межа застосування:</text>
<text x="672.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="start" font-weight="700">n ≤ 23..25</text>
<text x="672.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start" font-weight="700">Бітова маска S:</text>
<text x="672.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7e22ce" text-anchor="start" font-weight="700">1 &lt;&lt; v (uint32_t)</text>
</svg>