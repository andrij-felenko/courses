<text x="65.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Потенціальна енергія V(r)</text>
<line x1="155.0" y1="170.0" x2="305.0" y2="170.0" stroke="#c0392b" stroke-width="3.0"/>
<rect x="306.9" y="160.5" width="226.2" height="19.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="420.0" y="173.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">E₀(C-H) = ½·ħ·ω_H (вищий рівень)</tspan></text>
<line x1="165.0" y1="145.0" x2="295.0" y2="145.0" stroke="#2457d6" stroke-width="3.0"/>
<rect x="303.5" y="135.5" width="233.1" height="19.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/><text x="420.0" y="148.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">E₀(C-D) = ½·ħ·ω_D (нижчий рівень)</tspan></text>
<line x1="240.0" y1="170.0" x2="240.0" y2="145.0" stroke="#27ae60" stroke-width="2.0"/>
<rect x="252.7" y="149.5" width="24.6" height="16.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="265.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">ΔE₀</tspan></text>
<rect x="162.3" y="382.4" width="135.4" height="35.3" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="230.0" y="396.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Мінімум ями V_min</tspan><tspan x="230.0" dy="14.3">(класична рівновага)</tspan></text>
<rect x="549.1" y="64.8" width="241.7" height="90.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="670.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">ЗВЕДЕНА МАСА (μ)</tspan><tspan x="670.0" dy="15.6">μ = (m₁ · m₂) / (m₁ + m₂)</tspan><tspan x="670.0" dy="15.6">Для зв'язку C-H: μ ≈ 0.923 а.о.м.</tspan><tspan x="670.0" dy="15.6">Для зв'язку C-D: μ ≈ 1.714 а.о.м.</tspan><tspan x="670.0" dy="15.6">Важчий дейтерій збільшує μ!</tspan></text>
<rect x="559.4" y="214.8" width="221.2" height="90.4" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/><text x="670.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">ЧАСТОТА КОЛИВАНЬ (ω)</tspan><tspan x="670.0" dy="15.6">ω = √(k / μ)</tspan><tspan x="670.0" dy="15.6">Вища маса μ дає меншу частоту</tspan><tspan x="670.0" dy="15.6">нульових коливань ω_D &lt; ω_H.</tspan><tspan x="670.0" dy="15.6">Енергія E₀(C-D) лежить глибше!</tspan></text>
<rect x="533.5" y="367.9" width="273.1" height="84.2" rx="6" fill="#fcedec" stroke="#c0392b" stroke-width="1.5"/><text x="670.0" y="385.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="670.0" dy="0.0">КІНЕТИЧНИЙ ІЗОТОПНИЙ ЕФЕКТ</tspan><tspan x="670.0" dy="14.3">Енергія активації розриву зв'язку:</tspan><tspan x="670.0" dy="14.3">E_a(C-D) &gt; E_a(C-H)</tspan><tspan x="670.0" dy="14.3">Зв'язок C-D міцніший на ~5 кДж/моль.</tspan><tspan x="670.0" dy="14.3">Реакції C-D ідуть у 2–7 разів повільніше!</tspan></text>
</svg>