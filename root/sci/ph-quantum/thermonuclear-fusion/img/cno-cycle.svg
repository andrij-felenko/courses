<text x="190.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="700">¹⁵N</text>
<rect x="690.0" y="80.0" width="200.0" height="100.0" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="790.0" y="112.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">1. Протонні захоплення</tspan><tspan x="790.0" dy="14.3">¹²C, ¹³C, ¹⁴N захоплюють</tspan><tspan x="790.0" dy="14.3">протони p з випромінюванням</tspan><tspan x="790.0" dy="14.3">гамма-квантів γ.</tspan></text>
<rect x="690.0" y="195.0" width="200.0" height="100.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="790.0" y="227.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">2. Радіоактивні розпади</tspan><tspan x="790.0" dy="14.3">¹³N та ¹⁵O позитронно</tspan><tspan x="790.0" dy="14.3">розпадаються (β⁺), випускаючи</tspan><tspan x="790.0" dy="14.3">нейтрино νₑ та позитрони e⁺.</tspan></text>
<rect x="690.0" y="310.0" width="200.0" height="105.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="790.0" y="348.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">3. Вузьке місце циклу</tspan><tspan x="790.0" dy="11.7">Реакція ¹⁴N(p,γ)¹⁵O — найповільніша.</tspan><tspan x="790.0" dy="11.7">Уся швидкість CNO залежить від неї;</tspan><tspan x="790.0" dy="11.7">¹⁴N накопичується в ядрі.</tspan></text>
<rect x="690.0" y="430.0" width="200.0" height="95.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="459.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">4. Замикання циклу</tspan><tspan x="790.0" dy="14.3">¹⁵N(p,α)¹²C випускає ⁴He</tspan><tspan x="790.0" dy="14.3">і відновлює ядро ¹²C.</tspan><tspan x="790.0" dy="14.3">Результат: 4p → ⁴He!</tspan></text>
