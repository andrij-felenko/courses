<circle cx="190.0" cy="380.0" r="32.0" fill="#fef08a" stroke="#854d0e" stroke-width="2.5"/>
<text x="190.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#854d0e" text-anchor="middle" font-weight="700">¹⁵O</text>
