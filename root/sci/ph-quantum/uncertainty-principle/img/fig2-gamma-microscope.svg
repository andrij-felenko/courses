<rect x="645.4" y="110.2" width="139.1" height="59.6" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="715.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Оптичне розділення:</tspan><tspan x="715.0" dy="14.3">Δx ≈ λ / (2 sin θ)</tspan><tspan x="715.0" dy="14.3">(Дифракційна межа)</tspan></text>
