<rect x="619.8" y="297.4" width="190.5" height="45.3" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="715.0" y="316.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">Добуток невизначеностей:</tspan><tspan x="715.0" dy="14.3">Δx · Δp_x ≈ h / 2 ≥ ℏ / 2</tspan></text>
