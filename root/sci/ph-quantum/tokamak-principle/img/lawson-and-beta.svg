<text x="50.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="50.0" dy="0.0">n·T·τ_E</tspan><tspan x="50.0" dy="14.3">(м⁻³·кеВ·с)</tspan></text>
<path d="M 85 170 Q 205 280, 265 265 Q 325 200, 375 150" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5,3"/>
