<rect x="430.0" y="70.0" width="320.0" height="80.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="590.0" y="100.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Потрійний критерій Лоусона:</tspan><tspan x="590.0" dy="13.0">n · T · τ_E ≥ 3·10²¹ м⁻³·кеВ·с</tspan><tspan x="590.0" dy="13.0">Умова самопідтримуваної термоядерної реакції D-T.</tspan></text>
<rect x="430.0" y="175.0" width="320.0" height="95.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="590.0" y="204.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Межа Трояна для бета-параметра:</tspan><tspan x="590.0" dy="14.3">β_max = β_N · (I_p / a·B_φ)</tspan><tspan x="590.0" dy="14.3">Обмежує максимальний тиск плазми</tspan><tspan x="590.0" dy="14.3">відносно тиску магнітного поля.</tspan></text>
<rect x="430.0" y="295.0" width="320.0" height="95.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="324.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Межа Крускала — Шафранова:</tspan><tspan x="590.0" dy="14.3">q(a) &gt; 2 (абсолютна межа q(a) &gt; 1)</tspan><tspan x="590.0" dy="14.3">Запобігає розвитку катастрофічної</tspan><tspan x="590.0" dy="14.3">гвинтової нестійкості (kink mode).</tspan></text>
