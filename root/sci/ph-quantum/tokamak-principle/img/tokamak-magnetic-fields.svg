<rect x="710.0" y="80.0" width="210.0" height="90.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="815.0" y="107.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">1. Тороїдальне поле B_φ</tspan><tspan x="815.0" dy="14.3">Створюється зовнішніми</tspan><tspan x="815.0" dy="14.3">котушками (TF coils).</tspan><tspan x="815.0" dy="14.3">Забезпечує первинне утримання.</tspan></text>
<rect x="710.0" y="185.0" width="210.0" height="90.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="815.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">2. Полоїдальне поле B_θ</tspan><tspan x="815.0" dy="13.0">Створюється струмом плазми I_p,</tspan><tspan x="815.0" dy="13.0">індукованим соленоїдом.</tspan><tspan x="815.0" dy="13.0">Закручує силові лінії.</tspan></text>
<rect x="710.0" y="290.0" width="210.0" height="90.0" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/><text x="815.0" y="317.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">3. Гвинтові поверхні</tspan><tspan x="815.0" dy="14.3">Силові лінії намотуються</tspan><tspan x="815.0" dy="14.3">на вкладені тороїдальні</tspan><tspan x="815.0" dy="14.3">магнітні поверхні.</tspan></text>
<rect x="710.0" y="395.0" width="210.0" height="75.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="815.0" y="422.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">Коефіцієнт запасу q(r):</tspan><tspan x="815.0" dy="14.3">q = (r · B_φ) / (R · B_θ)</tspan><tspan x="815.0" dy="14.3">Показник МГД-стійкості</tspan></text>
