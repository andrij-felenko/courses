<rect x="440.8" y="103.0" width="308.4" height="174.0" rx="6" fill="#eafaf1" stroke="#a3e4d7" stroke-width="1.4"/><text x="595.0" y="122.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Ньютонівська механіка (1/r²):</tspan><tspan x="595.0" dy="14.3">Орбіта строго замкнена (еліпс).</tspan><tspan x="595.0" dy="14.3"></tspan><tspan x="595.0" dy="14.3">Загальна теорія відносності:</tspan><tspan x="595.0" dy="14.3">Потенціал має поправку ~ 1/r³.</tspan><tspan x="595.0" dy="14.3"></tspan><tspan x="595.0" dy="14.3">Наслідок — прецесія перигелію:</tspan><tspan x="595.0" dy="14.3">Δφ = 6πGM / [c² a (1 − e²)]</tspan><tspan x="595.0" dy="14.3"></tspan><tspan x="595.0" dy="14.3">Для Меркурія: 43.03 кубових</tspan><tspan x="595.0" dy="14.3">секунд на століття (збіг із спостереженнями!).</tspan></text>
</svg>