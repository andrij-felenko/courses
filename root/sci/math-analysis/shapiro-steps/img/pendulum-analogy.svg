<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="850" height="440" style="background-color: #1e1e2e; font-family: system-ui, -apple-system, sans-serif;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#a6adc8" />
  </marker>
  <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#89dceb" />
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#f38ba8" />
  </marker>
</defs>
<rect x="15" y="15" width="820" height="410" rx="12" fill="#181825" stroke="#313244" stroke-width="2" />
<text x="425" y="45" fill="#cdd6f4" font-size="20" font-weight="bold" text-anchor="middle">Механічна аналогія: обертальний маятник із в&apos;язким тертям і змінним моментом</text>
<circle cx="260" cy="210" r="8" fill="#f9e2af" stroke="#fab387" stroke-width="3" />
<line x1="260" y1="80" x2="260" y2="340" stroke="#585b70" stroke-width="2" stroke-dasharray="6,6" />
<line x1="260" y1="210" x2="337.1345131623847" y2="301.92533317427734" stroke="#89b4fa" stroke-width="5" />
<circle cx="337.1345131623847" cy="301.92533317427734" r="22" fill="#f38ba8" stroke="#f5e0dc" stroke-width="3" />
<text x="337.1345131623847" y="306.92533317427734" fill="#11111b" font-size="14" font-weight="bold" text-anchor="middle">m</text>
<path d="M 260 270 A 60 60 0 0 0 300 255" stroke="#f9e2af" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
<text x="305" y="280" fill="#f9e2af" font-size="16" font-weight="bold">φ (кут)</text>
<path d="M 190 170 Q 170 210 190 250" stroke="#a6e3a1" stroke-width="3" fill="none" stroke-dasharray="4,4" />
<text x="50" y="215" fill="#a6e3a1" font-size="14" font-weight="bold">В&apos;язке тертя γ (1/R)</text>
<line x1="337.1345131623847" y1="301.92533317427734" x2="337.1345131623847" y2="346.92533317427734" stroke="#f38ba8" stroke-width="2.5" marker-end="url(#arrow-red)" />
<text x="347.1345131623847" y="341.92533317427734" fill="#f38ba8" font-size="13">m·g·sin(φ)</text>
<rect x="500" y="110" width="310" height="220" rx="10" fill="#313244" stroke="#45475a" stroke-width="2" />
<text x="655" y="140" fill="#89dceb" font-size="16" font-weight="bold" text-anchor="middle">Зовнішні крутильні моменти</text>
<text x="520" y="180" fill="#cdd6f4" font-size="14">1. Постійний момент (DC):</text>
<text x="540" y="205" fill="#f9e2af" font-size="15" font-family="monospace">T_dc ↔ I_dc</text>
<text x="540" y="225" fill="#a6adc8" font-size="12">(змушує маятник обертатися)</text>
<text x="520" y="260" fill="#cdd6f4" font-size="14">2. Змінний момент (AC/ВЧ):</text>
<text x="540" y="285" fill="#89b4fa" font-size="14" font-family="monospace">T_ac·sin(Ω·t) ↔ I_ac·sin(ω_rf·t)</text>
<text x="540" y="305" fill="#a6adc8" font-size="12">(періодичне "струшування" осі)</text>
<rect x="60" y="365" width="730" height="40" rx="8" fill="#181825" stroke="#f9e2af" stroke-width="1.5" />
<text x="425" y="390" fill="#f9e2af" font-size="14" font-weight="bold" text-anchor="middle">Фазове захоплення: середня швидкість обертання ⟨dφ/dt⟩ строго "залипає" на n·Ω</text>
</svg>