<rect x="516.1" y="179.2" width="287.9" height="51.6" rx="6" fill="#FFFFFF" stroke="#d0d7de" stroke-width="1.5"/><text x="660.0" y="194.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="660.0" dy="0.0">2. Інваріантність:</tspan><tspan x="660.0" dy="14.3">Фазовий потік не залишає W^c:</tspan><tspan x="660.0" dy="14.3">якщо (x(0),y(0)) ∈ W^c, то (x(t),y(t)) ∈ W^c</tspan></text>
