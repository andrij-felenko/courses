<text x="730.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle"><tspan x="730.0" dy="0.0">• Норма Rᵢᵢ = ||yᵢ'||</tspan><tspan x="730.0" dy="14.9">• Сумування: ∑ ln(Rᵢᵢ)</tspan><tspan x="730.0" dy="14.9">• λᵢ = (1/T) ∑ ln(Rᵢᵢ)</tspan><tspan x="730.0" dy="14.9">• Новий орт-базис готовий</tspan></text>
