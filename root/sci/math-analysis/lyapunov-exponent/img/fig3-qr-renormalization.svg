<text x="440.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle"><tspan x="440.0" dy="0.0">• y₁ неконтрольовано зростає</tspan><tspan x="440.0" dy="14.9">• y₂ нахиляється до напрямку y₁</tspan><tspan x="440.0" dy="14.9">• Загроза переповнення та</tspan><tspan x="440.0" dy="14.9">  втрати базісного кута</tspan></text>
