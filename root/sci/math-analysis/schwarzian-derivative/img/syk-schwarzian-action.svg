<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шварціан у конформній теорії поля (CFT) та квантовій гравітації</text>
<rect x="50.0" y="70.0" width="360.0" height="270.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="230.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гільбертів простір та межа AdS₂</text>
<circle cx="230.0" cy="200.0" r="75.0" fill="#eff6ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="230.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">AdS₂ bulk</text>
<path d="M 155 200 A 75 75 0 0 1 305 200" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<text x="230.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Перепараметризація часу τ → f(τ)</text>
<rect x="450.0" y="70.0" width="360.0" height="270.0" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="630.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b21a8" text-anchor="middle" font-weight="700">Поле / Квантова дія Шварціана</text>
<rect x="500.3" y="126.2" width="259.4" height="47.6" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/><text x="630.0" y="146.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">CFT тензор енергії-імпульсу:</tspan><tspan x="630.0" dy="15.6">T'(z) = (f')² T(f) + (c/12) S(f)(z)</tspan></text>
<rect x="503.7" y="206.2" width="252.6" height="47.6" rx="6" fill="#ffffff" stroke="#c084fc" stroke-width="1.5"/><text x="630.0" y="226.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Ефективна дія SYK / JT-гравітації:</tspan><tspan x="630.0" dy="15.6">S_eff = -C ∫ {f(τ), τ} dτ</tspan></text>
<rect x="479.8" y="288.5" width="300.4" height="23.0" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/><text x="630.0" y="303.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">{f, τ} ≡ S(f)(τ) — Шварціан порушення симетрії</tspan></text>
<text x="430.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Оператор Шварца описує квантові аномалії та термальні флуктуації часу</text>
</svg>