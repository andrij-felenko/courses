<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 920 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="920" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="900.0" height="600.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="450.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сходинки одного поняття: від правила Кеплера до назви</text>
<rect x="241.5" y="82.0" width="437.0" height="51.9" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.6"/><text x="460.0" y="104.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">1609 · Кеплер (нім.)</tspan><tspan x="460.0" dy="16.9">рівні площі — збережене число ще без назви й без причини</tspan></text>
<line x1="460.0" y1="139.0" x2="460.0" y2="165.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="271.2" y="170.1" width="377.7" height="51.9" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/><text x="460.0" y="192.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">1687 · Ньютон (англ.)</tspan><tspan x="460.0" dy="16.9">причина: сила в центр не має плеча → площі рівні</tspan></text>
<line x1="460.0" y1="227.0" x2="460.0" y2="253.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="223.0" y="258.1" width="474.0" height="51.9" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="460.0" y="280.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">1744–1746 · Бернуллі, Ойлер, д'Арсі</tspan><tspan x="460.0" dy="16.9">«момент обертального руху», «принцип площ» — для цілих систем</tspan></text>
<line x1="460.0" y1="315.0" x2="460.0" y2="341.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="248.9" y="346.1" width="422.1" height="51.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="460.0" y="368.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">1799–1803 · Лаплас, Пуансо</tspan><tspan x="460.0" dy="16.9">напрямлений відрізок уздовж осі — момент стає вектором</tspan></text>
<line x1="460.0" y1="403.0" x2="460.0" y2="429.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="267.5" y="434.1" width="385.1" height="51.9" rx="6" fill="#f2ecf7" stroke="#7d3c98" stroke-width="1.6"/><text x="460.0" y="456.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">1858 · Ренкін (шотл.)</tspan><tspan x="460.0" dy="16.9">сучасне означення й сама назва «angular momentum»</tspan></text>
<rect x="92.4" y="548.5" width="715.2" height="35.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.3"/><text x="450.0" y="570.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">закон збереження (площі) помітили на ~150 років раніше, ніж поняттю дали ім'я й вектор</tspan></text>
</svg>