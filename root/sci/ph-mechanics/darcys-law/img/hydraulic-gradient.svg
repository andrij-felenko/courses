<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1080 465" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1080" height="465" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Градієнт тиску, гравітація та вектор швидкості фільтрації</text>
<path d="M 120,160 L 640,320 L 640,400 L 120,240 Z" fill="#f9ebea" stroke="#d35400" stroke-width="2.0"/>
<text x="240.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d35400" text-anchor="middle" font-weight="700">пористий пласт (проникність k)</text>
<circle cx="120.0" cy="200.0" r="6.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="80.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">тиск p₁</text>
<text x="80.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">висота z₁</text>
<circle cx="640.0" cy="360.0" r="6.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="685.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">тиск p₂</text>
<text x="685.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">висота z₂</text>
<line x1="180.0" y1="200.0" x2="580.0" y2="360.0" stroke="#27ae60" stroke-width="3.5" marker-end="url(#arrow)"/>
<text x="460.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">вектор швидкості фільтрації vⲇ</text>
<line x1="340.0" y1="240.0" x2="420.0" y2="267.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">−∇p</text>
<line x1="340.0" y1="240.0" x2="340.0" y2="310.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="340.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ρ g (гравітація)</text>
<rect x="400.0" y="395.0" width="660.0" height="50.0" rx="6" fill="#f4f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="416.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">Повна форма закону Дарсі для стисливого/нестисливого флюїду під дією гравітації:</tspan><tspan x="730.0" dy="16.2">vⲇ = − (k / μ) · (∇p − ρ g)</tspan></text>
</svg>