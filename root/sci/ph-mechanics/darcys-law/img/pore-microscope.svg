<circle cx="180.0" cy="130.0" r="40.0" fill="#d5dbdb" stroke="#7f8c8d" stroke-width="1.5"/>
<circle cx="280.0" cy="150.0" r="42.0" fill="#d5dbdb" stroke="#7f8c8d" stroke-width="1.5"/>
<circle cx="80.0" cy="230.0" r="38.0" fill="#d5dbdb" stroke="#7f8c8d" stroke-width="1.5"/>
<circle cx="170.0" cy="240.0" r="45.0" fill="#d5dbdb" stroke="#7f8c8d" stroke-width="1.5"/>
<circle cx="270.0" cy="230.0" r="36.0" fill="#d5dbdb" stroke="#7f8c8d" stroke-width="1.5"/>
<circle cx="110.0" cy="320.0" r="40.0" fill="#d5dbdb" stroke="#7f8c8d" stroke-width="1.5"/>
<circle cx="200.0" cy="330.0" r="38.0" fill="#d5dbdb" stroke="#7f8c8d" stroke-width="1.5"/>
<circle cx="300.0" cy="310.0" r="44.0" fill="#d5dbdb" stroke="#7f8c8d" stroke-width="1.5"/>
