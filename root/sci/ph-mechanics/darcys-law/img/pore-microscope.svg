<text x="190.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="middle" font-weight="700">порова швидкість vₚ = vⲇ / ϕ</text>
<line x1="60.0" y1="380.0" x2="340.0" y2="380.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="200.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">фіктивна швидкість Дарсі vⲇ = Q / A</text>
<line x1="415.0" y1="240.0" x2="465.0" y2="240.0" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="440.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">усереднення</text>
<text x="440.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">по REV</text>
<rect x="480.0" y="60.0" width="320.0" height="360.0" rx="8" fill="#fbeee6" stroke="#d35400" stroke-width="1.5"/>
<text x="640.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d35400" text-anchor="middle" font-weight="700">Макрорівень: суцільне середовище</text>
<rect x="640.0" y="150.0" width="260.0" height="50.0" rx="6" fill="none" stroke="none" stroke-width="1.5"/><text x="770.0" y="171.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Пористість: ϕ = Vₚₒᵣₑ / Vₜⲱₜⲱₗ</tspan><tspan x="770.0" dy="15.6">Проникність: k (м² або Дарсі)</tspan></text>
<rect x="505.0" y="220.0" width="15.0" height="120.0" rx="6" fill="#2457d6" stroke="none" stroke-width="1.5"/>
<text x="512.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">площа A</text>
<line x1="535.0" y1="280.0" x2="740.0" y2="280.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="640.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">потік vⲇ = − (k / μ) ∇p</text>
<rect x="420.0" y="445.0" width="680.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="760.0" y="459.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">REV (Representative Elementary Volume) — найменший об'єм,</tspan><tspan x="760.0" dy="15.0">у якому мікроскопічна хаотичність пор згладжується</tspan><tspan x="760.0" dy="15.0">у стабільні макроскопічні характеристики k та ϕ.</tspan></text>
</svg>