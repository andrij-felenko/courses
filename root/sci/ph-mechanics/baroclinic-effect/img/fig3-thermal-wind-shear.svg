<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 805 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="805" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="740.0" height="380.0" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0.0"/>
<text x="370.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="700">Термічний зсув геострофічного вітру (Thermal Wind Shear)</text>
<rect x="40.0" y="60.0" width="360.0" height="280.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="220.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Переріз атмосфери (Екватор → Полюс)</text>
<line x1="70.0" y1="310.0" x2="370.0" y2="310.0" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="75.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start">Теплі тропіки (висока T)</text>
<text x="365.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="end">Холодний полюс (низька T)</text>
<line x1="70.0" y1="310.0" x2="70.0" y2="90.0" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="60.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="end">z (висота)</text>
<line x1="80.0" y1="270.0" x2="360.0" y2="280.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="365.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="start">p₃ (1000 hPa)</text>
<line x1="80.0" y1="190.0" x2="360.0" y2="220.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="365.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="start">p₂ (500 hPa)</text>
<line x1="80.0" y1="110.0" x2="360.0" y2="160.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="365.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="start">p₁ (250 hPa)</text>
<line x1="320.0" y1="290.0" x2="120.0" y2="290.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="220.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">∇T (до тропіків)</text>
<rect x="420.0" y="60.0" width="280.0" height="280.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="560.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Профіль західного вітру vg(z)</text>
<line x1="450.0" y1="300.0" x2="450.0" y2="100.0" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="440.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="end" font-weight="700">z</text>
<line x1="450.0" y1="270.0" x2="490.0" y2="270.0" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="500.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="start">vg (поверхня) ~ 5 м/с</text>
<line x1="450.0" y1="210.0" x2="550.0" y2="210.0" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="560.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="start">vg (середня тропосфера) ~ 20 м/с</text>
<line x1="450.0" y1="150.0" x2="630.0" y2="150.0" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="640.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="start">vg (струминна течія) ~ 50 м/с</text>
<rect x="100.7" y="343.0" width="538.7" height="24.0" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/><text x="370.0" y="359.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e3a8a" text-anchor="middle"><tspan x="370.0" dy="0.0">∂vg / ∂z = (g / f·T) · (k × ∇T)   ⇒   Термічний вітер генерує струминні течії</tspan></text>
</svg>