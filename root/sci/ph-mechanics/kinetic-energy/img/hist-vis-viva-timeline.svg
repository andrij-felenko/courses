<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 742" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="742" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="940.0" height="742.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Народження поняття: майже двісті років від «живої сили» до «кінетичної енергії»</text>
<line x1="190.0" y1="76.0" x2="190.0" y2="712.0" stroke="#cfd6df" stroke-width="2.6"/>
<rect x="214.0" y="70.0" width="702.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.1"/>
<rect x="217.0" y="74.0" width="4.0" height="64.0" rx="2" fill="#c0392b" stroke="none" stroke-width="0.0"/>
<text x="232.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Ляйбніц — «Коротка демонстрація помилки Декарта»</text>
<text x="232.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="232.0" dy="0.0">Сила руху тіла йде як mv², а не як «кількість руху» mv.</tspan><tspan x="232.0" dy="17.0">Спалах майже столітньої суперечки з картезіанцями.</tspan></text>
<circle cx="190.0" cy="106.0" r="7.5" fill="#ffffff" stroke="#c0392b" stroke-width="2.6"/>
<circle cx="190.0" cy="106.0" r="2.8" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="170.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">1686</text>
<rect x="214.0" y="166.0" width="702.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.1"/>
<rect x="217.0" y="170.0" width="4.0" height="64.0" rx="2" fill="#c0392b" stroke="none" stroke-width="0.0"/>
<text x="232.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Ляйбніц — «Зразок динаміки»</text>
<text x="232.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="232.0" dy="0.0">Величина mv² дістає ім'я vis viva — «жива сила»,</tspan><tspan x="232.0" dy="17.0">на противагу «мертвій силі» спокою.</tspan></text>
<circle cx="190.0" cy="202.0" r="7.5" fill="#ffffff" stroke="#c0392b" stroke-width="2.6"/>
<circle cx="190.0" cy="202.0" r="2.8" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="170.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="end" font-weight="700">1695</text>
<rect x="214.0" y="262.0" width="702.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.1"/>
<rect x="217.0" y="266.0" width="4.0" height="64.0" rx="2" fill="#2457d6" stroke="none" stroke-width="0.0"/>
<text x="232.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">'с Гравезанде — кульки в глину (Лейден)</text>
<text x="232.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="232.0" dy="0.0">Глибина сліду росте як v²: удвічі швидша куля —</tspan><tspan x="232.0" dy="17.0">вчетверо глибший слід. Дослід стає на бік mv².</tspan></text>
<circle cx="190.0" cy="298.0" r="7.5" fill="#ffffff" stroke="#2457d6" stroke-width="2.6"/>
<circle cx="190.0" cy="298.0" r="2.8" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="170.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="end" font-weight="700">1722</text>
<rect x="214.0" y="358.0" width="702.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.1"/>
<rect x="217.0" y="362.0" width="4.0" height="64.0" rx="2" fill="#27ae60" stroke="none" stroke-width="0.0"/>
<text x="232.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Емілі дю Шатле — «Начала фізики»</text>
<text x="232.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="232.0" dy="0.0">Синтез Ляйбніца й Ньютона; енергію («живу силу»)</tspan><tspan x="232.0" dy="17.0">вперше чітко відділено від імпульсу («кількості руху»).</tspan></text>
<circle cx="190.0" cy="394.0" r="7.5" fill="#ffffff" stroke="#27ae60" stroke-width="2.6"/>
<circle cx="190.0" cy="394.0" r="2.8" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="170.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="end" font-weight="700">1740</text>
<rect x="214.0" y="454.0" width="702.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.1"/>
<rect x="217.0" y="458.0" width="4.0" height="64.0" rx="2" fill="#1a1a1a" stroke="none" stroke-width="0.0"/>
<text x="232.0" y="476.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Коріоліс — «Про обчислення дії машин»</text>
<text x="232.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="232.0" dy="0.0">Додає множник ½ і слово travail — «робота».</tspan><tspan x="232.0" dy="17.0">Виходить сучасне ½mv².</tspan></text>
<circle cx="190.0" cy="490.0" r="7.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<circle cx="190.0" cy="490.0" r="2.8" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="170.0" y="495.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1829</text>
<rect x="214.0" y="550.0" width="702.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.1"/>
<rect x="217.0" y="554.0" width="4.0" height="64.0" rx="2" fill="#1a1a1a" stroke="none" stroke-width="0.0"/>
<text x="232.0" y="572.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Вільям Томсон (лорд Кельвін)</text>
<text x="232.0" y="591.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="232.0" dy="0.0">Дає англійську назву kinetic energy —</tspan><tspan x="232.0" dy="17.0">«кінетична енергія».</tspan></text>
<circle cx="190.0" cy="586.0" r="7.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<circle cx="190.0" cy="586.0" r="2.8" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="170.0" y="591.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1849–51</text>
<rect x="214.0" y="646.0" width="702.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.1"/>
<rect x="217.0" y="650.0" width="4.0" height="64.0" rx="2" fill="#1a1a1a" stroke="none" stroke-width="0.0"/>
<text x="232.0" y="668.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Вільям Ренкін</text>
<text x="232.0" y="687.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start"><tspan x="232.0" dy="0.0">Парна назва potential energy —</tspan><tspan x="232.0" dy="17.0">«потенціальна енергія».</tspan></text>
<circle cx="190.0" cy="682.0" r="7.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.6"/>
<circle cx="190.0" cy="682.0" r="2.8" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="170.0" y="687.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1853</text>
</svg>