<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обертальна ½Iω² — це сума ½mᵢvᵢ² усіх частинок, де vᵢ = ω·rᵢ</text>
