<text x="445.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700" font-style="italic">ω</text>
<line x1="250.0" y1="285.0" x2="296.0" y2="285.0" stroke="#cfd6df" stroke-width="1.0"/>
