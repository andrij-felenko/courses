<line x1="382.0" y1="285.0" x2="382.0" y2="216.4" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="392.0" y="222.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">vᵢ = ω·rᵢ</text>
<text x="316.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">rᵢ</text>
<text x="292.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">mᵢ</text>
<rect x="511.1" y="192.6" width="357.8" height="114.8" rx="6" fill="#f7f9fc" stroke="#2457d6" stroke-width="1.5"/><text x="690.0" y="218.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">E = Σ ½ mᵢ vᵢ²</tspan><tspan x="690.0" dy="18.2">vᵢ = ω·rᵢ   (кутова швидкість × плече)</tspan><tspan x="690.0" dy="18.2">= Σ ½ mᵢ (ω rᵢ)²</tspan><tspan x="690.0" dy="18.2">= ½ (Σ mᵢ rᵢ²) ω²</tspan><tspan x="690.0" dy="18.2">= ½ I ω²</tspan></text>
<text x="690.0" y="331.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">I = Σ mᵢ rᵢ² — момент інерції;  ω спільна для всіх (тверде тіло) — виноситься</text>
<rect x="-2.0" y="448.0" width="963.9" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="480.0" y="468.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Та сама будова, що й ½mv²: половина · «інертність» · квадрат «швидкості» — тільки інертність тепер обертальна (I), а швидкість кутова (ω).</tspan></text>
</svg>