<rect x="134.6" y="549.2" width="630.8" height="49.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="450.0" y="570.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Рух центра мас (6 Дж) заморожено збереженням імпульсу — його не спалити нічим.</tspan><tspan x="450.0" dy="15.6">Спалити можна лише відносний рух (3 Дж); e = 0 палить його весь — це й є максимум утрати.</tspan></text>
