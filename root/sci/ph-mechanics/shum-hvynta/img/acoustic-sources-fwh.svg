<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три типи акустичних джерел обертової лопаті (FW-H)</text><rect x="20.0" y="50.0" width="226.0" height="245.0" rx="6" fill="#fdf8f6" stroke="#ea580c" stroke-width="1.5"/><text x="133.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#ea580c" text-anchor="middle" font-weight="700">1. Монополь (Товщина)</text><text x="133.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Thickness Noise (розсування об'єму)</text><circle cx="133.0" cy="155.0" r="20.0" fill="none" stroke="#ea580c" stroke-width="1" stroke-dasharray="3,3"/><circle cx="133.0" cy="155.0" r="36.0" fill="none" stroke="#ea580c" stroke-width="1" stroke-dasharray="3,3"/><circle cx="133.0" cy="155.0" r="52.0" fill="none" stroke="#ea580c" stroke-width="1" stroke-dasharray="3,3"/><rect x="108.0" y="147.0" width="50.0" height="16.0" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/><text x="133.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лопать</text><line x1="133.0" y1="143.0" x2="133.0" y2="123.0" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="133.0" y1="167.0" x2="133.0" y2="187.0" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow)"/><text x="133.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джерело: витіснення маси q</text><text x="133.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Акустичний тиск: p ~ ρ · ů</text><text x="133.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Акустична потужність: W ~ M⁴</text><text x="133.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ea580c" text-anchor="middle" font-weight="700">Домінує в площині обертання</text><rect x="264.0" y="50.0" width="226.0" height="245.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="377.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">2. Диполь (Навантаження)</text><text x="377.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Loading Noise (сили тяги й опору)</text><circle cx="377.0" cy="133.0" r="26" fill="none" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,3"/><circle cx="377.0" cy="177.0" r="26" fill="none" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="3,3"/><rect x="352.0" y="149.0" width="50.0" height="12.0" rx="4" fill="#fecaca" stroke="#c0392b" stroke-width="1.5"/><line x1="377.0" y1="147.0" x2="377.0" y2="117.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/><text x="397.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">+F (тяга)</text><text x="377.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джерело: коливання сили F</text><text x="377.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Акустичний тиск: p ~ Ḟ / c₀</text><text x="377.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Акустична потужність: W ~ M⁶</text><text x="377.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Головний шум для дронів (M &lt; 0.6)</text><rect x="508.0" y="50.0" width="226.0" height="245.0" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/><text x="621.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#475569" text-anchor="middle" font-weight="700">3. Квадруполь (Стисливість)</text><text x="621.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Quadrupole Noise (напруження Tij)</text><circle cx="605.0" cy="139.0" r="14.0" fill="#e2e8f0" stroke="#64748b" stroke-width="1.0"/><circle cx="637.0" cy="139.0" r="14.0" fill="#cbd5e1" stroke="#64748b" stroke-width="1.0"/><circle cx="605.0" cy="171.0" r="14.0" fill="#cbd5e1" stroke="#64748b" stroke-width="1.0"/><circle cx="637.0" cy="171.0" r="14.0" fill="#e2e8f0" stroke="#64748b" stroke-width="1.0"/><text x="621.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Tij</text><text x="621.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джерело: вихори й напруження</text><text x="621.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Акустичний тиск: p ~ ∂²Tij / c₀²</text><text x="621.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Акустична потужність: W ~ M⁸</text><text x="621.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="middle" font-weight="700">Важливий лише при M &gt; 0.8</text>
</svg>