<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -25 770 355" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-25" width="770" height="355" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конструктивні методи зниження шуму гвинта</text><rect x="20.0" y="50.0" width="168.0" height="255.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="104.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Менша швидкість</text><text x="104.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">M_tip &lt; 0.5 (нижчі RPM)</text><circle cx="104.0" cy="140.0" r="32.0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.0"/><line x1="104.0" y1="140.0" x2="132.0" y2="140.0" stroke="#475569" stroke-width="2.0"/><line x1="104.0" y1="140.0" x2="104.0" y2="168.0" stroke="#475569" stroke-width="2.0"/><line x1="104.0" y1="140.0" x2="76.0" y2="140.0" stroke="#475569" stroke-width="2.0"/><line x1="104.0" y1="140.0" x2="104.0" y2="112.0" stroke="#475569" stroke-width="2.0"/><circle cx="104.0" cy="140.0" r="5.0" fill="#334155" stroke="#ffffff" stroke-width="1.0"/><text x="104.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Багатолопатева схема</text><text x="104.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тяга та сама:</text><text x="104.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">більше лопатей B</text><text x="104.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">менші оберти n</text><text x="104.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Шум навантаження ~ n⁶</text><text x="104.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Ефект: −4...−8 дБ</text><rect x="202.0" y="50.0" width="168.0" height="255.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="286.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2. Тороїдальна петля</text><text x="286.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Toroidal Propeller</text><ellipse cx="272.0" cy="140.0" rx="14.0" ry="28.0" fill="none" stroke="#2457d6" stroke-width="2.2"/><ellipse cx="300.0" cy="140.0" rx="14.0" ry="28.0" fill="none" stroke="#2457d6" stroke-width="2.2"/><circle cx="286.0" cy="140.0" r="5.0" fill="#2457d6" stroke="#ffffff" stroke-width="1.0"/><text x="286.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Замкнений контур кінця</text><text x="286.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Немає відкритого торця:</text><text x="286.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">вихідний вихор ділиться</text><text x="286.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">спектр зміщується вгору</text><text x="286.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Швидке згасання в повітрі</text><text x="286.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Ефект: −3...−6 dBA</text><rect x="384.0" y="50.0" width="168.0" height="255.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="468.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. Пилкоподібний край</text><text x="468.0" y="99.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Serrations (шеврони)</text><rect x="440.0" y="120.0" width="26.0" height="40.0" rx="3" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><path d="M 466.0 120.0 L 480.0 -15.0 L 466.0 -10.0 L 480.0 -5.0 L 466.0 0.0 L 480.0 5.0 L 466.0 10.0 L 480.0 15.0 L 466.0 20.0 L 480.0 25.0 L 466.0 30.0" fill="none" stroke="#27ae60" stroke-width="2"/><text x="468.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Зубчаста задня кромка</text><text x="468.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Руйнування когерентності:</text><text x="468.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">деструктивна інтерференція</text><text x="468.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">вихорів сходу шару</text><text x="468.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Зниження дифракції хвилі</text><text x="468.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Ефект: −2...−4 дБ</text><rect x="566.0" y="50.0" width="168.0" height="255.0" rx="6" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/><text x="650.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#a855f7" text-anchor="middle" font-weight="700">4. Стрілоподібність</text><text x="650.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Swept Tip (шаблеподібність)</text><path d="M 635 165 C 640 140 645 125 672 112 C 660 128 652 140 655 165 Z" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.8"/><text x="650.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#a855f7" text-anchor="middle" font-weight="700">Скошений кінець лопаті</text><text x="650.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Зниження місцевого Mach:</text><text x="650.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">M_eff = M · cos(Λ)</text><text x="650.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">розмазування BPF фази</text><text x="650.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#a855f7" text-anchor="middle" font-weight="700">Менший градієнт тиску</text><text x="650.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Ефект: −2...−5 дБ</text>
</svg>