<rect x="540.0" y="388.0" width="406.0" height="128.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="743.0" y="439.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="743.0" dy="0.0">куля:   R₁ = R₂ = R   →   Δp = 2σ/R</tspan><tspan x="743.0" dy="17.6">довгий циліндр:   R₂ → ∞   →   Δp = σ/R</tspan><tspan x="743.0" dy="17.6">мильна бульбашка (дві поверхні):   Δp = 4σ/R</tspan></text>
