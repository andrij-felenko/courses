<text x="470.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">пара / повітря</text>
<path d="M 330 330 Q 470 170 610 330 Z" fill="#cfe8f5" stroke="#6aa9cf" stroke-width="2.0"/>
