<rect x="654.8" y="131.0" width="210.5" height="38.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="760.0" y="155.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="760.0" dy="0.0">σsᴠ = σsʟ + σ·cos θ</tspan></text>
<text x="760.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">cos θ = (σsᴠ − σsʟ) / σ</text>
<text x="760.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">знак різниці → змочує чи ні</text>
