<text x="410.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механічні реологічні моделі (пружини та демпфери)</text><rect x="30.0" y="50.0" width="235.0" height="300.0" rx="6" fill="#fafafa" stroke="#cccccc" stroke-width="1.5"/><text x="147.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель Максвелла</text><text x="147.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(послідовне з'єднання)</text><line x1="50.0" y1="160.0" x2="70.0" y2="160.0" stroke="#333333" stroke-width="2.0"/><path d="M 70 160 L 77.0 160 L 79.8 152.0 L 85.4 168.0 L 91.0 152.0 L 96.6 168.0 L 102.2 152.0 L 107.8 168.0 L 113.4 152.0 L 119.0 168.0 L 124.6 152.0 L 130.2 168.0 L 133.0 160 L 140 160" fill="none" stroke="#2457d6" stroke-width="2" stroke-linejoin="round"/><line x1="140.0" y1="160.0" x2="154.0" y2="160.0" stroke="#c0392b" stroke-width="2.0"/><line x1="154.0" y1="150.0" x2="189.0" y2="150.0" stroke="#c0392b" stroke-width="2.0"/><line x1="154.0" y1="170.0" x2="189.0" y2="170.0" stroke="#c0392b" stroke-width="2.0"/><line x1="154.0" y1="150.0" x2="154.0" y2="170.0" stroke="#c0392b" stroke-width="2.0"/><line x1="171.5" y1="152.0" x2="171.5" y2="168.0" stroke="#c0392b" stroke-width="2.5"/><line x1="171.5" y1="160.0" x2="210.0" y2="160.0" stroke="#c0392b" stroke-width="2.0"/><line x1="210.0" y1="160.0" x2="230.0" y2="160.0" stroke="#333333" stroke-width="2.0"/><text x="105.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">E</text><text x="175.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">η</text><rect x="58.6" y="203.1" width="176.8" height="73.9" rx="6" fill="#ffffff" stroke="#dddddd" stroke-width="1.5"/><text x="147.0" y="222.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="147.0" dy="0.0">dε/dt = (1/E) dσ/dt + σ/η</tspan><tspan x="147.0" dy="14.3"></tspan><tspan x="147.0" dy="14.3">• Чудова релаксація σ(t)</tspan><tspan x="147.0" dy="14.3">• Повзучість не обмежена</tspan></text><rect x="292.0" y="50.0" width="235.0" height="300.0" rx="6" fill="#fafafa" stroke="#cccccc" stroke-width="1.5"/><text x="410.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модель Кельвіна-Фойгта</text><text x="410.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(паралельне з'єднання)</text><line x1="312.0" y1="160.0" x2="332.0" y2="160.0" stroke="#333333" stroke-width="2.0"/><line x1="332.0" y1="125.0" x2="332.0" y2="195.0" stroke="#333333" stroke-width="2.0"/><path d="M 332 125 L 347.5 125 L 353.7 117.0 L 366.1 133.0 L 378.5 117.0 L 390.9 133.0 L 403.3 117.0 L 415.7 133.0 L 428.1 117.0 L 440.5 133.0 L 452.9 117.0 L 465.3 133.0 L 471.5 125 L 487 125" fill="none" stroke="#2457d6" stroke-width="2" stroke-linejoin="round"/><line x1="332.0" y1="195.0" x2="363.0" y2="195.0" stroke="#c0392b" stroke-width="2.0"/><line x1="363.0" y1="185.0" x2="440.5" y2="185.0" stroke="#c0392b" stroke-width="2.0"/><line x1="363.0" y1="205.0" x2="440.5" y2="205.0" stroke="#c0392b" stroke-width="2.0"/><line x1="363.0" y1="185.0" x2="363.0" y2="205.0" stroke="#c0392b" stroke-width="2.0"/><line x1="401.8" y1="187.0" x2="401.8" y2="203.0" stroke="#c0392b" stroke-width="2.5"/><line x1="401.8" y1="195.0" x2="487.0" y2="195.0" stroke="#c0392b" stroke-width="2.0"/><line x1="487.0" y1="125.0" x2="487.0" y2="195.0" stroke="#333333" stroke-width="2.0"/><line x1="487.0" y1="160.0" x2="507.0" y2="160.0" stroke="#333333" stroke-width="2.0"/><text x="410.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">E</text><text x="410.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">η</text><rect x="321.6" y="218.1" width="176.8" height="73.9" rx="6" fill="#ffffff" stroke="#dddddd" stroke-width="1.5"/><text x="410.0" y="237.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">σ = E·ε + η·(dε/dt)</tspan><tspan x="410.0" dy="14.3"></tspan><tspan x="410.0" dy="14.3">• Чудова повзучість ε(t)</tspan><tspan x="410.0" dy="14.3">• Немає миттєвого стрибка</tspan></text><rect x="555.0" y="50.0" width="235.0" height="300.0" rx="6" fill="#fafafa" stroke="#cccccc" stroke-width="1.5"/><text x="672.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стандартне лінійне тіло</text><text x="672.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(Модель Зенера)</text><line x1="575.0" y1="160.0" x2="590.0" y2="160.0" stroke="#333333" stroke-width="2.0"/><line x1="590.0" y1="125.0" x2="590.0" y2="195.0" stroke="#333333" stroke-width="2.0"/><path d="M 590 125 L 605.5 125 L 611.7 117.0 L 624.1 133.0 L 636.5 117.0 L 648.9 133.0 L 661.3 117.0 L 673.7 133.0 L 686.1 117.0 L 698.5 133.0 L 710.9 117.0 L 723.3 133.0 L 729.5 125 L 745 125" fill="none" stroke="#27ae60" stroke-width="2" stroke-linejoin="round"/><path d="M 590 195 L 597.5 195 L 600.5 187.0 L 606.5 203.0 L 612.5 187.0 L 618.5 203.0 L 624.5 187.0 L 630.5 203.0 L 636.5 187.0 L 642.5 203.0 L 648.5 187.0 L 654.5 203.0 L 657.5 195 L 665 195" fill="none" stroke="#2457d6" stroke-width="2" stroke-linejoin="round"/><line x1="665.0" y1="195.0" x2="681.0" y2="195.0" stroke="#c0392b" stroke-width="2.0"/><line x1="681.0" y1="185.0" x2="721.0" y2="185.0" stroke="#c0392b" stroke-width="2.0"/><line x1="681.0" y1="205.0" x2="721.0" y2="205.0" stroke="#c0392b" stroke-width="2.0"/><line x1="681.0" y1="185.0" x2="681.0" y2="205.0" stroke="#c0392b" stroke-width="2.0"/><line x1="701.0" y1="187.0" x2="701.0" y2="203.0" stroke="#c0392b" stroke-width="2.5"/><line x1="701.0" y1="195.0" x2="745.0" y2="195.0" stroke="#c0392b" stroke-width="2.0"/><line x1="745.0" y1="125.0" x2="745.0" y2="195.0" stroke="#333333" stroke-width="2.0"/><line x1="745.0" y1="160.0" x2="760.0" y2="160.0" stroke="#333333" stroke-width="2.0"/><text x="667.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">E₀ (тривала)</text><text x="627.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">E₁</text><text x="705.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">η₁</text><rect x="557.3" y="224.3" width="229.5" height="71.4" rx="6" fill="#ffffff" stroke="#dddddd" stroke-width="1.5"/><text x="672.0" y="243.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="672.0" dy="0.0">σ + τ_σ(dσ/dt) = E_R(ε + τ_ε dε/dt)</tspan><tspan x="672.0" dy="13.7"></tspan><tspan x="672.0" dy="13.7">• Описує і релаксацію, і повзучість</tspan><tspan x="672.0" dy="13.7">• Обмежена пружність E₀ + E₁</tspan></text>
</svg>
