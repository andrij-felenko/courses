<svg xmlns="http://www.w3.org/2000/svg" viewBox="-132.8 -10 1225.6 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-132.8" y="-10" width="1225.6" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Критерій Чебишова-Грюблера-Куцбаха для плоских і просторових механізмів</text>
<rect x="0.0" y="0.0" width="960.0" height="520.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Критерій Чебишова-Грюблера-Куцбаха для плоских і просторових механізмів</text>
<rect x="25.0" y="65.0" width="290.0" height="380.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/>
<text x="170.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Плоскі механізми (λ = 3)</text>
<text x="170.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">M = 3·(N − 1 − j) + ∑ fᵢ</text>
<rect x="60.0" y="140.0" width="220.0" height="110.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<line x1="85.0" y1="225.0" x2="255.0" y2="225.0" stroke="#1a1a1a" stroke-width="3.0"/>
<line x1="85.0" y1="225.0" x2="120.0" y2="165.0" stroke="#27ae60" stroke-width="2.8"/>
<line x1="120.0" y1="165.0" x2="220.0" y2="155.0" stroke="#27ae60" stroke-width="2.8"/>
<line x1="220.0" y1="155.0" x2="255.0" y2="225.0" stroke="#27ae60" stroke-width="2.8"/>
<circle cx="85.0" cy="225.0" r="5.0" fill="#eafaf0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="120.0" cy="165.0" r="5.0" fill="#eafaf0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="220.0" cy="155.0" r="5.0" fill="#eafaf0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="255.0" cy="225.0" r="5.0" fill="#eafaf0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="170.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотириланковик 4R:</text>
<text x="170.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">• N = 4 ланки (з базою)</text>
<text x="170.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">• j = 4 шарніри R (fᵢ = 1)</text>
<text x="170.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">M = 3·(4 − 1 − 4) + 4·1 = 1</text>
<text x="170.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">1 вхідний двигун повністю</text>
<text x="170.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">визначає рух усієї системи</text>
<rect x="330.0" y="65.0" width="300.0" height="380.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.4"/>
<text x="480.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Просторові механізми (λ = 6)</text>
<text x="480.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">M = 6·(N − 1 − j) + ∑ fᵢ</text>
<text x="480.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кінематичні пари за класами:</text>
<text x="348.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">V клас (f=1):</text>
<text x="445.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">R (оберт), P (зсув), H (гвинт)</text>
<text x="348.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">IV клас (f=2):</text>
<text x="445.0" y="221.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">C (циліндр), U (кардан)</text>
<text x="341.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">III клас (f=3):</text>
<text x="445.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">S (сфера), E (площина)</text>
<line x1="350.0" y1="300.0" x2="610.0" y2="300.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="480.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Платформа Стюарта (6-UPS):</text>
<text x="480.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">• N = 14 тіл, 6 пар S, 6 P, 6 U</text>
<text x="480.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">M = 6·(14−1) − ∑(6−fᵢ) = 6</text>
<text x="480.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Повнопривідна 6-DoF система</text>
<rect x="645.0" y="65.0" width="290.0" height="380.0" rx="8" fill="#fffaf5" stroke="#c0392b" stroke-width="1.4"/>
<text x="790.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Парадокси та надлишковість</text>
<text x="790.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">rank(G(q)) &lt; ∑ (λ − fᵢ)</text>
<text x="790.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коли формула Куцбаха хибить:</text>
<text x="790.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Збіг геометрії осей робить</text>
<text x="790.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">градієнти в'язей лінійно залежними</text>
<rect x="660.0" y="220.0" width="260.0" height="95.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="790.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм Саррюса (6R):</text>
<text x="790.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">Куцбах: M = 6·(6−1−6) + 6 = 0</text>
<text x="790.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Реальна рухливість: M = 1</text>
<rect x="660.0" y="325.0" width="260.0" height="95.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="790.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм Беннета (4R):</text>
<text x="790.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">Куцбах: M = 6·(4−1−4) + 4 = −2</text>
<text x="790.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Реальна рухливість: M = 1</text>
<text x="790.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Ранг Якобіана в'язей виявляє</text>
<text x="790.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">справжній простір рухливості</text>
<rect x="-122.8" y="463.5" width="1205.6" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="480.0" y="484.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Формула Чебишова-Грюблера-Куцбаха пов'язує рухливість механізму з кількістю тіл та класами пар; особливі конфігурації вимагають рангового аналізу матриці Якобі.</tspan></text>
</svg>