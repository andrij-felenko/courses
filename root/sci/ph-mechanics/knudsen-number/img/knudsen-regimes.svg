<rect x="60.0" y="105.0" width="160.0" height="240.0" rx="6" fill="#eef1fb" stroke="#2457d6" stroke-width="1.8"/><text x="140.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Суцільний</tspan><tspan x="140.0" dy="15.6">Kn &lt; 0.01</tspan><tspan x="140.0" dy="15.6"></tspan><tspan x="140.0" dy="15.6">Модель:</tspan><tspan x="140.0" dy="15.6">Нав'є-Стовкс з умовою</tspan><tspan x="140.0" dy="15.6">прилипання (v_slip=0)</tspan><tspan x="140.0" dy="15.6"></tspan><tspan x="140.0" dy="15.6">Приклади:</tspan><tspan x="140.0" dy="15.6">Літак біля землі,</tspan><tspan x="140.0" dy="15.6">трубопроводи</tspan></text>
<rect x="240.0" y="105.0" width="160.0" height="240.0" rx="6" fill="#eef8f2" stroke="#27ae60" stroke-width="1.8"/><text x="320.0" y="164.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">З ковзанням</tspan><tspan x="320.0" dy="14.3">0.01 ≤ Kn &lt; 0.1</tspan><tspan x="320.0" dy="14.3"></tspan><tspan x="320.0" dy="14.3">Модель:</tspan><tspan x="320.0" dy="14.3">Нав'є-Стовкс з умовою</tspan><tspan x="320.0" dy="14.3">Максвелла (v_slip ≠ 0)</tspan><tspan x="320.0" dy="14.3">та стрибком T_jump</tspan><tspan x="320.0" dy="14.3"></tspan><tspan x="320.0" dy="14.3">Приклади:</tspan><tspan x="320.0" dy="14.3">Мікроканали, МЕМС</tspan></text>
<rect x="420.0" y="105.0" width="160.0" height="240.0" rx="6" fill="#fff8eb" stroke="#e67e22" stroke-width="1.8"/><text x="500.0" y="151.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Перехідний</tspan><tspan x="500.0" dy="15.6">0.1 ≤ Kn &lt; 10</tspan><tspan x="500.0" dy="15.6"></tspan><tspan x="500.0" dy="15.6">Модель:</tspan><tspan x="500.0" dy="15.6">Рівняння Больцмана,</tspan><tspan x="500.0" dy="15.6">метод DSMC</tspan><tspan x="500.0" dy="15.6">(Монте-Карло)</tspan><tspan x="500.0" dy="15.6"></tspan><tspan x="500.0" dy="15.6">Приклади:</tspan><tspan x="500.0" dy="15.6">Головка HDD (10 нм),</tspan><tspan x="500.0" dy="15.6">вакуумний опір</tspan></text>
