<rect x="60.0" y="365.0" width="700.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="395.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Фізичний зміст переходу:</tspan><tspan x="410.0" dy="13.0">Із зростанням Kn тонка пристінкова область (шар Кнудсена товщиною ~λ) розростається й заповнює весь переріз.</tspan><tspan x="410.0" dy="13.0">Класична гідродинаміка втрачає силу, і опис переходить від суцільних полів v, P до кінетичної теорії молекул.</tspan></text>
