<line x1="170.0" y1="156.0" x2="170.0" y2="126.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="143.0,214.0 165.0,202.0 176.0,220.0 197.0,208.0" fill="none" stroke="#c0392b" stroke-width="2.4"/>
<text x="170.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">«рветься»</text>
<rect x="280.0" y="296.0" width="194.0" height="104.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="377.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="377.0" dy="0.0">причина, за Ґалілеєм:</tspan><tspan x="377.0" dy="13.0">порожнеча вгорі «тягне»</tspan><tspan x="377.0" dy="13.0">й тримає стовп, доки той</tspan><tspan x="377.0" dy="13.0">не порветься від власної ваги</tspan></text>
<text x="170.0" y="508.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">повітря на чашу — поза увагою</text>
<rect x="750.9" y="49.2" width="158.3" height="29.5" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="830.0" y="68.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">Торрічеллі · 1643</tspan></text>
<text x="830.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-style="italic">повітря штовхає знизу</text>
<rect x="738.0" y="452.0" width="184.0" height="32.0" rx="4" fill="#b8bcc4" stroke="#8b9099" stroke-width="1.5"/><rect x="732.0" y="480.0" width="196.0" height="12.0" rx="3" fill="#e5e7eb" stroke="#8b9099" stroke-width="1.4"/><rect x="810.0" y="114.0" width="40.0" height="338.0" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><rect x="812.0" y="158.0" width="36.0" height="312.0" rx="6" fill="#b8bcc4" stroke="none" stroke-width="0.0"/>
<text x="830.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">порожнеча</text>
<text x="830.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(вакуум)</text>
<line x1="742.0" y1="422.0" x2="742.0" y2="448.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="768.0" y1="422.0" x2="768.0" y2="448.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="892.0" y1="422.0" x2="892.0" y2="448.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="918.0" y1="422.0" x2="918.0" y2="448.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="830.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">атмосфера тисне на чашу</text>
<rect x="526.0" y="296.0" width="194.0" height="104.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="623.0" y="328.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="623.0" dy="0.0">причина, за Торрічеллі:</tspan><tspan x="623.0" dy="15.6">вага всієї атмосфери</tspan><tspan x="623.0" dy="15.6">тисне на відкриту чашу</tspan><tspan x="623.0" dy="15.6">й підпирає стовп знизу</tspan></text>
<rect x="90.0" y="512.0" width="820.0" height="60.0" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="538.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Той самий стовп, та сама гранична висота — але протилежна причина. Ґалілей дивився ВГОРУ трубки</tspan><tspan x="500.0" dy="16.9">(що тримає), Торрічеллі — ВНИЗ, на чашу (що штовхає). Правильним виявилося друге.</tspan></text>
</svg>