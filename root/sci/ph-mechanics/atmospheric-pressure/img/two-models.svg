<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві відповіді на ту саму загадку висоти ≈ 10 м</text>
<line x1="500.0" y1="74.0" x2="500.0" y2="486.0" stroke="#dfe4ea" stroke-width="1.4" stroke-dasharray="4 6"/>
<rect x="103.4" y="49.2" width="133.2" height="29.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="170.0" y="68.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Ґалілей · 1638</tspan></text>
<text x="170.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">стовп рветься сам</text>
<rect x="78.0" y="452.0" width="184.0" height="32.0" rx="4" fill="#bfe0f2" stroke="#7cc0e0" stroke-width="1.5"/><rect x="72.0" y="480.0" width="196.0" height="12.0" rx="3" fill="#e5e7eb" stroke="#7cc0e0" stroke-width="1.4"/><rect x="150.0" y="114.0" width="40.0" height="338.0" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/><rect x="152.0" y="158.0" width="36.0" height="312.0" rx="6" fill="#bfe0f2" stroke="none" stroke-width="0.0"/>
