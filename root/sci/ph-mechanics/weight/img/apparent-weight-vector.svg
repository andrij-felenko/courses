<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1360" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="1360.0" height="640.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="680.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Уявна вага як вектор: W = m·(g − a), g_eff = g − a</text>
<line x1="430.0" y1="78.0" x2="430.0" y2="574.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 7"/>
<line x1="850.0" y1="78.0" x2="850.0" y2="574.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 7"/>
<text x="230.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">У спокої (a = 0)</text>
<circle cx="230.0" cy="130.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<line x1="230.0" y1="130.0" x2="230.0" y2="280.0" stroke="#27ae60" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="246.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">g_eff = g</text>
<line x1="230.0" y1="280.0" x2="230.0" y2="330.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 5"/>
<text x="230.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">виска висить прямо вниз</text>
<rect x="155.0" y="536.2" width="150.0" height="47.6" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.4"/><text x="230.0" y="556.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="230.0" dy="0.0">«низ» вертикальний,</tspan><tspan x="230.0" dy="15.6">модуль не змінений</tspan></text>
<text x="640.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розгін угору (a &gt; 0)</text>
<circle cx="614.0" cy="130.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<line x1="614.0" y1="130.0" x2="614.0" y2="270.0" stroke="#1a1a1a" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="600.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">g</text>
<line x1="614.0" y1="270.0" x2="614.0" y2="310.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="600.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">−a</text>
<line x1="682.0" y1="130.0" x2="682.0" y2="310.0" stroke="#27ae60" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="698.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">g_eff</text>
<rect x="541.1" y="536.2" width="197.8" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="640.0" y="556.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="640.0" dy="0.0">g_eff подовжується,</tspan><tspan x="640.0" dy="15.6">напрям той самий — важчаєш</tspan></text>
<text x="1080.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Боковий поштовх (гальмо/віраж)</text>
<circle cx="1080.0" cy="130.0" r="4.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<line x1="1080.0" y1="130.0" x2="1080.0" y2="270.0" stroke="#1a1a1a" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="1066.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">g</text>
<line x1="1080.0" y1="270.0" x2="1160.0" y2="270.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="1120.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">−a</text>
<line x1="1080.0" y1="130.0" x2="1160.0" y2="270.0" stroke="#27ae60" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="1176.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">g_eff</text>
<text x="1098.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">θ</text>
<rect x="933.2" y="536.2" width="293.6" height="47.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="1080.0" y="556.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="1080.0" dy="0.0">g_eff хилиться на кут θ:</tspan><tspan x="1080.0" dy="15.6">tan θ = a / g — народжується новий «низ»</tspan></text>
<rect x="287.4" y="596.5" width="785.2" height="35.0" rx="6" fill="#eef2fb" stroke="#1a1a1a" stroke-width="1.4"/><text x="680.0" y="618.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">від точки підвісу відкладаємо g донизу, від його вістря — вектор −a; стрілка до кінця й є g_eff = g − a</tspan></text>
</svg>