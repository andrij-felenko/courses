<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="1040.0" height="640.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="520.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Похилий віраж: полотно нахилене так, що g_eff тисне перпендикулярно в дорогу</text>
<line x1="640.0" y1="78.0" x2="640.0" y2="574.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 7"/>
<line x1="180.0" y1="380.0" x2="540.0" y2="380.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="5 5"/>
<line x1="360.0" y1="300.0" x2="360.0" y2="470.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 5"/>
<line x1="205.9" y1="451.9" x2="514.1" y2="308.1" stroke="#1a1a1a" stroke-width="5.0"/>
<circle cx="360.0" cy="380.0" r="7.0" fill="#dfe7f5" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="360.0" y1="380.0" x2="360.0" y2="470.0" stroke="#1a1a1a" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="346.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">g</text>
<line x1="360.0" y1="380.0" x2="270.0" y2="380.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="250.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end" font-weight="700">a → до центру</text>
<line x1="360.0" y1="380.0" x2="450.0" y2="380.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="470.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">−a (назовні)</text>
<line x1="360.0" y1="380.0" x2="398.0" y2="461.6" stroke="#27ae60" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="414.0" y="455.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">g_eff</text>
<text x="376.0" y="458.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">θ</text>
<text x="200.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Похилий поворот у розрізі</text>
<text x="830.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Умова ідеального нахилу</text>
<rect x="728.7" y="130.0" width="202.6" height="40.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.6"/><text x="830.0" y="155.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0.0">tan θ = v² / (r·g)</tspan></text>
<rect x="670.0" y="190.0" width="320.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="830.0" y="215.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">якщо нахилити полотно рівно на θ,</tspan><tspan x="830.0" dy="15.6">g_eff дивиться перпендикулярно в дорогу —</tspan><tspan x="830.0" dy="15.6">бокової складової тертя вже не треба</tspan></text>
<rect x="670.0" y="309.0" width="20.0" height="20.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="700.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">g — тяжіння (вниз)</text>
<rect x="670.0" y="351.0" width="20.0" height="20.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="700.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start">a — доцентрове (до центру)</text>
<rect x="670.0" y="393.0" width="20.0" height="20.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="700.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start">−a — назовні (від центру)</text>
<rect x="670.0" y="435.0" width="20.0" height="20.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="700.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start">g_eff = g − a — уявний низ, ⟂ дорозі</text>
<rect x="120.0" y="596.5" width="800.0" height="35.0" rx="6" fill="#eef2fb" stroke="#1a1a1a" stroke-width="1.4"/><text x="520.0" y="618.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">залізнична колія, автомагістральний віраж і трек велодрому нахилені саме так — під розрахункову швидкість</tspan></text>
</svg>