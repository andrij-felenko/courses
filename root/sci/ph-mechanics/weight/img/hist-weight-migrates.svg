<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1200" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="1200.0" height="640.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="600.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Домівка ваги переселяється: тіло → стосунок → дотик</text>
<line x1="410.0" y1="80.0" x2="410.0" y2="570.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 7"/>
<line x1="805.0" y1="80.0" x2="805.0" y2="570.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 7"/>
<text x="205.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Арістотель</text>
<text x="205.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">вага — вдача тіла</text>
<circle cx="205.0" cy="315.0" r="88.0" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<circle cx="205.0" cy="272.4" r="22.4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/><line x1="205.0" y1="294.8" x2="205.0" y2="342.4" stroke="#1a1a1a" stroke-width="2.6"/><line x1="205.0" y1="300.8" x2="178.4" y2="328.4" stroke="#1a1a1a" stroke-width="2.6"/><line x1="205.0" y1="300.8" x2="231.6" y2="328.4" stroke="#1a1a1a" stroke-width="2.6"/><line x1="205.0" y1="342.4" x2="184.0" y2="390.0" stroke="#1a1a1a" stroke-width="2.6"/><line x1="205.0" y1="342.4" x2="226.0" y2="390.0" stroke="#1a1a1a" stroke-width="2.6"/>
<rect x="78.7" y="446.2" width="252.6" height="47.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="205.0" y="466.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="205.0" dy="0.0">вага живе всередині тіла —</tspan><tspan x="205.0" dy="15.6">вроджений нахил, як колір чи форма</tspan></text>
<text x="610.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Ньютон</text>
<text x="610.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">вага — стосунок двох тіл</text>
<circle cx="610.0" cy="260.0" r="12.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<circle cx="610.0" cy="400.0" r="46.0" fill="#dfe7f5" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="610.0" y1="275.0" x2="610.0" y2="348.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<line x1="610.0" y1="348.0" x2="610.0" y2="354.0" stroke="#c0392b" stroke-width="3.0"/>
<text x="632.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">P = m·g</text>
<text x="588.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">через</text>
<text x="588.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">порожнечу</text>
<rect x="490.6" y="446.2" width="238.9" height="47.6" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.4"/><text x="610.0" y="466.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="610.0" dy="0.0">вага — сила між двома тілами;</tspan><tspan x="610.0" dy="15.6">без другого тіла її просто немає</tspan></text>
<text x="1000.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Сьогодні (операційно)</text>
<text x="1000.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">вага — на дотику з опорою</text>
<circle cx="1000.0" cy="272.4" r="22.4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.2"/><line x1="1000.0" y1="294.8" x2="1000.0" y2="342.4" stroke="#1a1a1a" stroke-width="2.6"/><line x1="1000.0" y1="300.8" x2="973.4" y2="328.4" stroke="#1a1a1a" stroke-width="2.6"/><line x1="1000.0" y1="300.8" x2="1026.6" y2="328.4" stroke="#1a1a1a" stroke-width="2.6"/><line x1="1000.0" y1="342.4" x2="979.0" y2="390.0" stroke="#1a1a1a" stroke-width="2.6"/><line x1="1000.0" y1="342.4" x2="1021.0" y2="390.0" stroke="#1a1a1a" stroke-width="2.6"/>
<rect x="925.0" y="390.0" width="150.0" height="26.0" rx="6" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.0"/><rect x="973.0" y="394.0" width="54.0" height="18.0" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.3"/><text x="1000.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">N</text>
<line x1="1095.0" y1="388.0" x2="1095.0" y2="322.0" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="1107.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">N</text>
<rect x="901.1" y="446.2" width="197.8" height="47.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="1000.0" y="466.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle"><tspan x="1000.0" dy="0.0">N — сила реакції опори,</tspan><tspan x="1000.0" dy="15.6">яку насправді читає прилад</tspan></text>
<rect x="240.7" y="596.5" width="718.5" height="35.0" rx="6" fill="#eef2fb" stroke="#1a1a1a" stroke-width="1.4"/><text x="600.0" y="618.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">одне слово, три різні домівки: вроджена вдача → стосунок двох тіл на відстані → дотик з опорою</tspan></text>
</svg>