<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="920" height="460" style="background-color:#ffffff;">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333"/>
</marker>
</defs>
<rect x="0.0" y="0.0" width="920.0" height="460.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="460.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння точкового (сфера) та лінійного (циліндр) герцівського контакту</text>
<line x1="460.0" y1="60.0" x2="460.0" y2="420.0" stroke="#d5dbdb" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="230.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Точковий контакт (Сфера на площині)</text>
<circle cx="230.0" cy="180.0" r="70.0" fill="rgba(36, 87, 214, 0.1)" stroke="#2457d6" stroke-width="2.0"/>
<text x="230.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кругова пляма</text>
<text x="230.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle">радіуса a</text>
<rect x="114.0" y="292.8" width="232.0" height="94.4" rx="6" fill="#ebf5fb" stroke="#2457d6" stroke-width="1.5"/><text x="230.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Площа контакту: A = π · a²</tspan><tspan x="230.0" dy="15.6">Залежність радіуса: a ∝ F¹/³</tspan><tspan x="230.0" dy="15.6">Максимальний тиск: p₀ ∝ F¹/³</tspan><tspan x="230.0" dy="15.6">Застосування: шарикопідшипники,</tspan><tspan x="230.0" dy="15.6">індентування, конформні сфери</tspan></text>
<text x="690.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Лінійний контакт (Циліндр на площині)</text>
<rect x="657.5" y="110.0" width="65.0" height="140.0" rx="4" fill="rgba(192, 57, 43, 0.1)" stroke="#c0392b" stroke-width="2.0"/>
<text x="690.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Прямокутник</text>
<text x="690.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">2b × L</text>
<rect x="567.1" y="292.8" width="245.7" height="94.4" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="690.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Площа контакту: A = 2b · L</tspan><tspan x="690.0" dy="15.6">Залежність півширини: b ∝ F¹/²</tspan><tspan x="690.0" dy="15.6">Максимальний тиск: p₀ ∝ F¹/²</tspan><tspan x="690.0" dy="15.6">Застосування: роликопідшипники,</tspan><tspan x="690.0" dy="15.6">зубчасті колеса (шестерні), рейки</tspan></text>
</svg>