<text x="200.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="200.0" dy="0.0">М'яч без сили береже свою швидкість —</tspan><tspan x="200.0" dy="16.9">автобус гальмує з-під нього.</tspan></text>
<text x="585.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Погляд із автобуса</text>
