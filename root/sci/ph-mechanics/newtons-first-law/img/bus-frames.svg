<text x="585.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="585.0" dy="0.0">Ривок м'яча пояснюють силою,</tspan><tspan x="585.0" dy="16.9">якої ніхто не прикладав.</tspan></text>
