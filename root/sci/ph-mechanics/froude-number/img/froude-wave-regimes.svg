<rect x="50.0" y="310.0" width="740.0" height="165.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="420.0" y="377.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Фізичне значення числа Фруда (Fr = v / √(g·h)) у відкритих каналах:</tspan><tspan x="420.0" dy="12.3">• Fr &lt; 1 (докритичний): швидкість поширення хвилі c перевищує швидкість потоку v; збурення поширюються вгору проти течії.</tspan><tspan x="420.0" dy="12.3">• Fr = 1 (критичний): швидкість потоку дорівнює швидкості гравітаційних хвиль; утворюється стоячий фронт.</tspan><tspan x="420.0" dy="12.3">• Fr &gt; 1 (надкритичний): потік швидший за хвилі; збурення утворюють клиноподібний фронт і зносяться виключно вниз за течією.</tspan></text>
