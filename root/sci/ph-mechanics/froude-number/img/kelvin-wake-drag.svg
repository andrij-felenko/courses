<rect x="50.0" y="320.0" width="740.0" height="160.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="420.0" y="384.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Хвильовий опір суден та межа швидкості корпусу:</tspan><tspan x="420.0" dy="12.3">• Хвильова картина Кельвіна утворює універсальний кут клина 2θ ≈ 38.94° (θ ≈ 19.47°), незалежно від швидкості.</tspan><tspan x="420.0" dy="12.3">• При Fr ≈ 0.4 довжина згенерованої поверхневої хвилі дорівнює довжині корпусу судна (λ ≈ L_w).</tspan><tspan x="420.0" dy="12.3">• Подолання числа Фруда Fr &gt; 0.4 вимагає виходу з водотоннажного режиму на гідродінамічне підтримання (глісування, підводні крила).</tspan></text>
