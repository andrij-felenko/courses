<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 880 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="880" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="860.0" height="400.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому наївний крок відходить від зорі — і чим його лагодить перестановка рядків</text>
<rect x="30.0" y="50.0" width="400.0" height="324.0" rx="6" fill="#fcfcfd" stroke="#333333" stroke-width="1.2"/>
<text x="230.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">крок по прямій промахується назовні</text>
<circle cx="214.0" cy="222.0" r="132.0" fill="none" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="5,5"/>
<text x="214.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">справжня орбіта (коло)</text>
<circle cx="214.0" cy="222.0" r="7.0" fill="#fff3d0" stroke="#e0a800" stroke-width="2.0"/>
<text x="228.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">зоря</text>
<circle cx="82.0" cy="222.0" r="4.5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="74.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">P</text>
<line x1="82.0" y1="224.0" x2="82.0" y2="310.0" stroke="#c0392b" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="74.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end">крок</text>
<text x="74.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="end">v·Δt</text>
<line x1="214.0" y1="222.0" x2="82.0" y2="310.0" stroke="#6b7280" stroke-width="1.1" stroke-dasharray="3,4"/>
<circle cx="104.2" cy="295.2" r="3.2" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<line x1="104.2" y1="295.2" x2="82.0" y2="310.0" stroke="#c0392b" stroke-width="3.2"/>
<circle cx="82.0" cy="310.0" r="4.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="92.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">опинивсь далі — на Δr назовні</text>
<rect x="39.3" y="344.6" width="381.4" height="22.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="230.0" y="359.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">крива загинається до зорі — пряма ні → щокроку трохи назовні</tspan></text>
<rect x="452.0" y="50.0" width="378.0" height="324.0" rx="6" fill="#fcfcfd" stroke="#333333" stroke-width="1.2"/>
<text x="641.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">порядок двох рядків вирішує все</text>
<rect x="474.0" y="92.0" width="334.0" height="84.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="641.0" y="123.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="641.0" dy="0.0">Ейлер:  посунь x старою v, тоді онови v</tspan><tspan x="641.0" dy="15.0">     x ← x + v·Δt      (стара v)</tspan><tspan x="641.0" dy="15.0">     v ← v + a(x)·Δt</tspan></text>
<text x="641.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">площа у фазовому просторі росте  ×(1 + (ωΔt)²)  →  розкрут</text>
<rect x="474.0" y="216.0" width="334.0" height="84.0" rx="6" fill="#eaf2ff" stroke="#2457d6" stroke-width="1.5"/><text x="641.0" y="247.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="641.0" dy="0.0">Кромер:  спершу онови v, тоді посунь x новою v</tspan><tspan x="641.0" dy="15.0">     v ← v + a(x)·Δt</tspan><tspan x="641.0" dy="15.0">     x ← x + v·Δt      (нова v)</tspan></text>
<text x="641.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">площа зберігається  ×1 (det = 1)  →  симплектичність, орбіта в пастці</text>
</svg>