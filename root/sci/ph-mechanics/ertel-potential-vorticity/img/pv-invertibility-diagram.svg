<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 800 420" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="800" height="420" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="780.0" height="400.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Принцип оберненості: від поля PV до повної динаміки атмосфери</text>
<rect x="80.0" y="130.0" width="170.0" height="80.0" rx="6" fill="#eef1fb" stroke="#27ae60" stroke-width="1.6"/><text x="165.0" y="158.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0.0">1. Поле PV q(x,y,z)</tspan><tspan x="165.0" dy="15.6">+ граничні умови θ</tspan><tspan x="165.0" dy="15.6">(динамічне ДНК)</tspan></text>
<rect x="305.0" y="130.0" width="170.0" height="80.0" rx="6" fill="#eef6ef" stroke="#c0392b" stroke-width="1.6"/><text x="390.0" y="159.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">2. Обернення (PDE):</tspan><tspan x="390.0" dy="14.3">∇²ψ + (f²/N²)ψ_zz = q′</tspan><tspan x="390.0" dy="14.3">(геострофічний баланс)</tspan></text>
<rect x="530.0" y="130.0" width="170.0" height="80.0" rx="6" fill="#fdf4f2" stroke="#2457d6" stroke-width="1.6"/><text x="615.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">3. Функція току ψ(x,y,z)</tspan><tspan x="615.0" dy="13.0">та геопотенціал Φ</tspan></text>
<rect x="230.0" y="270.0" width="320.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="390.0" y="288.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">4. Відновлені поля:</tspan><tspan x="390.0" dy="15.6">• Вітер: u = −∂ψ/∂y,  v = ∂ψ/∂x</tspan><tspan x="390.0" dy="15.6">• Температура: T ∝ ∂ψ/∂z</tspan><tspan x="390.0" dy="15.6">• Поле тиску: p = ρ₀ f ψ</tspan></text>
<line x1="250.0" y1="170.0" x2="305.0" y2="170.0" stroke="#333333" stroke-width="2.5"/><path d="M 305.0 170.0 L 295.0 175.0 L 295.0 165.0 z" fill="#333333"/>
<line x1="475.0" y1="170.0" x2="530.0" y2="170.0" stroke="#333333" stroke-width="2.5"/><path d="M 530.0 170.0 L 520.0 175.0 L 520.0 165.0 z" fill="#333333"/>
<line x1="615.0" y1="210.0" x2="470.0" y2="270.0" stroke="#333333" stroke-width="2.5"/><path d="M 470.0 270.0 L 477.3 261.6 L 481.2 270.8 z" fill="#333333"/>
<polyline points="230.0,307.0 165.0,307.0 165.0,210.0" fill="none" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="5 4"/>
<path d="M 165.0 210.0 L 169.5 219.0 L 160.5 219.0 z" fill="#6b7280"/>
<text x="150.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="700">Адвекція PV: Dq/Dt = 0</text>
<rect x="88.1" y="371.0" width="603.8" height="28.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="390.0" y="389.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">Знаючи q(x,y,z), можна повністю реконструювати поле вітру, тиску та температури</tspan></text>
</svg>