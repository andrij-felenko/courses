<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Діаграма Хейга: границі витривалості за різного середнього напруження</text>
<rect x="40.0" y="40.0" width="760.0" height="400.0" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.0"/>
<line x1="60.0" y1="380.0" x2="770.0" y2="380.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="760.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">Середнє напруження σ_m</text>
<line x1="280.0" y1="410.0" x2="280.0" y2="50.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="265.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700">Амплітуда σ_a</text>
<polygon points="280,380 280,160 700,380" fill="#f0fdf4" stroke="none"/>
<line x1="280.0" y1="160.0" x2="580.0" y2="380.0" stroke="#d97706" stroke-width="2.2" stroke-dasharray="5,4"/>
<text x="370.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="start" font-weight="700">Зедерберг (консервативна, по σ_y)</text>
<line x1="280.0" y1="160.0" x2="700.0" y2="380.0" stroke="#c0392b" stroke-width="2.5"/>
<text x="500.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Гудман (лінійна, по σ_u)</text>
<path d="M 280.0,160.0 L 301.0,160.5 L 322.0,162.2 L 343.0,164.9 L 364.0,168.8 L 385.0,173.8 L 406.0,179.8 L 427.0,186.9 L 448.0,195.2 L 469.0,204.6 L 490.0,215.0 L 511.0,226.6 L 532.0,239.2 L 553.0,253.0 L 574.0,267.8 L 595.0,283.8 L 616.0,300.8 L 637.0,318.9 L 658.0,338.2 L 679.0,358.6 L 700.0,380.0" fill="none" stroke="#2457d6" stroke-width="2.2" stroke-dasharray="6,3"/>
<text x="540.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Гербер (параболічна, пластичні сталі)</text>
<line x1="280.0" y1="80.0" x2="580.0" y2="380.0" stroke="#4b5563" stroke-width="2.0" stroke-dasharray="3,3"/>
<text x="405.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4b5563" text-anchor="start" font-style="italic">Границя статичної плинності (σ_a + σ_m = σ_y)</text>
<circle cx="280.0" cy="160.0" r="4.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="270.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">σ_e (R = −1)</text>
<circle cx="280.0" cy="80.0" r="3.5" fill="#4b5563" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="270.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4b5563" text-anchor="end" font-weight="700">σ_y</text>
<circle cx="580.0" cy="380.0" r="4.0" fill="#4b5563" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="580.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#4b5563" text-anchor="middle" font-weight="700">σ_y</text>
<circle cx="700.0" cy="380.0" r="4.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="700.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">σ_u</text>
<text x="190.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Стиск (σ_m &lt; 0)
підвищує витривалість</text>
<line x1="120.0" y1="160.0" x2="280.0" y2="160.0" stroke="#27ae60" stroke-width="2.0" stroke-dasharray="4,4"/>
<rect x="320.0" y="310.0" width="130.0" height="40.0" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
<text x="385.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">Безпечна зона
