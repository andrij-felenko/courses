<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 840 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="840" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="820.0" height="390.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві маси, дві ролі — а у вільному падінні вони скорочуються</text>
<line x1="410.0" y1="56.0" x2="410.0" y2="250.0" stroke="#dfe4ea" stroke-width="1.2" stroke-dasharray="4,6"/>
<text x="205.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Інертна маса  mᵢ</text>
<line x1="110.0" y1="172.0" x2="275.0" y2="172.0" stroke="#333333" stroke-width="2.0"/><line x1="110.0" y1="172.0" x2="102.0" y2="181.0" stroke="#6b7280" stroke-width="1.2"/><line x1="128.3" y1="172.0" x2="120.3" y2="181.0" stroke="#6b7280" stroke-width="1.2"/><line x1="146.7" y1="172.0" x2="138.7" y2="181.0" stroke="#6b7280" stroke-width="1.2"/><line x1="165.0" y1="172.0" x2="157.0" y2="181.0" stroke="#6b7280" stroke-width="1.2"/><line x1="183.3" y1="172.0" x2="175.3" y2="181.0" stroke="#6b7280" stroke-width="1.2"/><line x1="201.7" y1="172.0" x2="193.7" y2="181.0" stroke="#6b7280" stroke-width="1.2"/><line x1="220.0" y1="172.0" x2="212.0" y2="181.0" stroke="#6b7280" stroke-width="1.2"/><line x1="238.3" y1="172.0" x2="230.3" y2="181.0" stroke="#6b7280" stroke-width="1.2"/><line x1="256.7" y1="172.0" x2="248.7" y2="181.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="179.0" y="119.0" width="52.0" height="52.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.7"/>
<line x1="113.0" y1="145.0" x2="175.0" y2="145.0" stroke="#c0392b" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="130.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">F</text>
<line x1="235.0" y1="145.0" x2="283.0" y2="145.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="275.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">a</text>
<text x="205.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">штовхнув силою F  →  a = F / mᵢ</text>
<text x="205.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">mᵢ — опір зміні руху</text>
<text x="615.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Гравітаційна маса  m_g</text>
<rect x="589.0" y="102.0" width="52.0" height="52.0" rx="6" fill="#e8edf3" stroke="#333333" stroke-width="1.7"/>
<line x1="615.0" y1="156.0" x2="615.0" y2="216.0" stroke="#2457d6" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="661.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">F = m_g · g</text>
<text x="615.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">m_g — «заряд» тяжіння, як заряд для електрики</text>
<rect x="132.2" y="302.1" width="555.5" height="51.9" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.6"/><text x="410.0" y="324.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">У вільному падінні:   mᵢ · a = m_g · g   ⟹   a = (m_g / mᵢ) · g</tspan><tspan x="410.0" dy="16.9">Дослід: m_g = mᵢ для всіх тіл   ⟹   a = g  незалежно від маси й речовини</tspan></text>
</svg>