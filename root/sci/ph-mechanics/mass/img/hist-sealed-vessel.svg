<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="1080.0" height="580.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="540.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Збереження маси: уся різниця — ЩО поклали на терези</text>
<line x1="540.0" y1="70.0" x2="540.0" y2="460.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 7"/>
<rect x="85.0" y="66.0" width="400.0" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="285.0" y="87.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="285.0" dy="0.0">Бойл (1670-ті): важить ПІСЛЯ відкриття колби</tspan></text>
<circle cx="285.0" cy="208.0" r="36.0" fill="#f7f9fc" stroke="#1a1a1a" stroke-width="2.0"/><rect x="276.0" y="130.0" width="18.0" height="46.0" rx="3" fill="#f7f9fc" stroke="#1a1a1a" stroke-width="2.0"/><rect x="269.0" y="228.0" width="32.0" height="11.0" rx="2" fill="#e7ecf7" stroke="#1a1a1a" stroke-width="1.6"/><text x="285.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">метал</text><polyline points="273.00,248.00 281.00,234.00 285.00,244.00 289.00,232.00 297.00,248.00" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<path d="M363.0 118.0 Q359.0 96.0 299.0 132.0" fill="none" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="371.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start"><tspan x="371.0" dy="0.0">колбу</tspan><tspan x="371.0" dy="15.6">відкрито —</tspan><tspan x="371.0" dy="15.6">повітря</tspan><tspan x="371.0" dy="15.6">влітає</tspan></text>
<rect x="175.0" y="300.0" width="220.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="285.0" y="324.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="285.0" dy="0.0">терези: стало важче</tspan></text>
<rect x="110.0" y="360.0" width="350.0" height="66.0" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.4"/><text x="285.0" y="389.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle"><tspan x="285.0" dy="0.0">висновок Бойла: крізь скло влетіли</tspan><tspan x="285.0" dy="16.9">«вогняні частинки»  (хибно)</tspan></text>
<rect x="590.0" y="66.0" width="410.0" height="34.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.6"/><text x="795.0" y="87.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">Лавуазьє (1770-ті): важить ЗАПАЯНУ посудину</tspan></text>
<circle cx="795.0" cy="208.0" r="36.0" fill="#f7f9fc" stroke="#1a1a1a" stroke-width="2.0"/><rect x="786.0" y="130.0" width="18.0" height="46.0" rx="3" fill="#f7f9fc" stroke="#1a1a1a" stroke-width="2.0"/><rect x="779.0" y="228.0" width="32.0" height="11.0" rx="2" fill="#e7ecf7" stroke="#1a1a1a" stroke-width="1.6"/><text x="795.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">метал</text><line x1="786.0" y1="130.0" x2="804.0" y2="130.0" stroke="#1a1a1a" stroke-width="3.4"/><polyline points="783.00,248.00 791.00,234.00 795.00,244.00 799.00,232.00 807.00,248.00" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<text x="855.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-style="italic">запаяно</text>
<rect x="675.0" y="300.0" width="240.0" height="40.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="795.0" y="324.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">терези: маса та сама</tspan></text>
<rect x="610.0" y="360.0" width="370.0" height="66.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.4"/><text x="795.0" y="389.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle"><tspan x="795.0" dy="0.0">висновок: повітря сполучилося з металом;</tspan><tspan x="795.0" dy="16.9">повна маса стала — приросту нема</tspan></text>
<rect x="179.7" y="499.1" width="720.5" height="53.9" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.4"/><text x="540.0" y="522.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Бойл важив уже після того, як у колбу вдерлось повітря; Лавуазьє важив усю запаяну систему.</tspan><tspan x="540.0" dy="16.9">Маса зберігається; приріст при відкритті = маса поглинутого повітря, а не «вогняних частинок».</tspan></text>
</svg>