<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="960.0" height="580.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="480.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Транзитивність: три досліди відкоту сходяться в одне число маси</text>
<line x1="480.0" y1="150.0" x2="250.0" y2="425.0" stroke="#2457d6" stroke-width="2.4"/>
<line x1="480.0" y1="150.0" x2="710.0" y2="425.0" stroke="#27ae60" stroke-width="2.4"/>
<line x1="250.0" y1="425.0" x2="710.0" y2="425.0" stroke="#c0392b" stroke-width="2.4"/>
<rect x="247.6" y="226.1" width="114.7" height="47.9" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="305.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="305.0" dy="0.0">дослід S↔A</tspan><tspan x="305.0" dy="16.9">m_A = 2.5 кг</tspan></text>
<rect x="597.6" y="226.1" width="114.7" height="47.9" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="655.0" y="246.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">дослід S↔B</tspan><tspan x="655.0" dy="16.9">m_B = 4.0 кг</tspan></text>
<rect x="402.5" y="454.1" width="155.0" height="47.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="480.0" y="474.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">прямий дослід A↔B</tspan><tspan x="480.0" dy="16.9">m_A / m_B = 0.625</tspan></text>
<circle cx="480.0" cy="150.0" r="33.0" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="480.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">S</text>
<circle cx="250.0" cy="425.0" r="33.0" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="250.0" y="431.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">A</text>
<circle cx="710.0" cy="425.0" r="33.0" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="710.0" y="431.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">B</text>
<text x="480.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">еталон  1 кг</text>
<text x="250.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">2.5 кг</text>
<text x="710.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">4.0 кг</text>
<rect x="395.9" y="311.6" width="168.2" height="66.8" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.6"/><text x="480.0" y="332.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">через еталон:</tspan><tspan x="480.0" dy="16.9">2.5 ⁄ 4.0 = 0.625  ✓</tspan><tspan x="480.0" dy="16.9">коло замикається</tspan></text>
<rect x="124.4" y="534.5" width="711.1" height="35.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="480.0" y="556.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">збіг не був зобов'язаний статися — а стається; тому масу кожного тіла ловить одне-єдине число</tspan></text>
</svg>