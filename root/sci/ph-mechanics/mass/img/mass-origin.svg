<text x="664.4" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">≈ 99 %</text>
<line x1="444.4" y1="214.0" x2="480.0" y2="250.0" stroke="#c0392b" stroke-width="1.2"/>
<rect x="480.0" y="250.0" width="400.0" height="46.0" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.3"/><text x="680.0" y="276.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle"><tspan x="680.0" dy="0.0">≈ 1 % — маса кварків та електронів від поля Гіггса (u+d &lt; 10 МеВ)</tspan></text>
<rect x="440.0" y="310.0" width="440.0" height="46.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.3"/><text x="660.0" y="337.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle"><tspan x="660.0" dy="0.0">≈ 99 % — енергія глюонних полів і руху кварків усередині</tspan></text>
<rect x="165.3" y="433.1" width="609.4" height="53.9" rx="6" fill="#eef2fb" stroke="#2457d6" stroke-width="1.4"/><text x="470.0" y="456.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">майже вся маса тіла — це зв'язана всередині ЕНЕРГІЯ, а не «кількість речовини»:</tspan><tspan x="470.0" dy="16.9">E = m·c²   ⇒   енергія полів і руху важить. Гіггсів механізм дає лише крихту.</tspan></text>
