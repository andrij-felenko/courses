<circle cx="210.0" cy="155.0" r="17.0" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="210.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">d</text>
<text x="210.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">3 кварки + глюонні поля</text>
<text x="440.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">із чого ця маса:</text>
