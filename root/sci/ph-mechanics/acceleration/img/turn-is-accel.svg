<rect x="0.0" y="0.0" width="900.0" height="470.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="450.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поворот при сталій швидкості: різниця Δv показує до центра</text>
<line x1="470.0" y1="66.0" x2="470.0" y2="392.0" stroke="#dfe4ea" stroke-width="1.2" stroke-dasharray="4,6"/>
