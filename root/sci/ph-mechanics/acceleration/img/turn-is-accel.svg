<text x="252.6" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="start" font-weight="700" font-style="italic">v₁</text>
<circle cx="300.4" cy="187.6" r="8.0" fill="#fef6e7" stroke="#c0392b" stroke-width="2.0"/>
