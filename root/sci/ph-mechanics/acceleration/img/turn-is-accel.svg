<text x="690.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">віднімаємо: Δv = v₂ − v₁</text>
<circle cx="600.0" cy="190.0" r="3.4" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
