<circle cx="230.0" cy="320.0" r="150.0" fill="none" stroke="#d7dde5" stroke-width="1.6"/>
<line x1="230.0" y1="320.0" x2="159.6" y2="187.6" stroke="#e2e7ee" stroke-width="1.2" stroke-dasharray="3,5"/>
<line x1="230.0" y1="320.0" x2="300.4" y2="187.6" stroke="#e2e7ee" stroke-width="1.2" stroke-dasharray="3,5"/>
