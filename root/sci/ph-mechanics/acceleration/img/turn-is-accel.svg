<line x1="600.0" y1="190.0" x2="687.0" y2="149.4" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="695.0" y="147.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700" font-style="italic">v₁</text>
<line x1="600.0" y1="190.0" x2="687.0" y2="230.6" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="695.0" y="236.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700" font-style="italic">v₂</text>
<line x1="687.0" y1="149.4" x2="687.0" y2="230.6" stroke="#8e44ad" stroke-width="3.6" marker-end="url(#arrow)"/>
<text x="701.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#8e44ad" text-anchor="start" font-weight="700" font-style="italic">Δv</text>
<text x="701.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="start">(до центра)</text>
<text x="690.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="middle" font-weight="700">a = Δv / Δt  →  теж до центра</text>
<rect x="171.8" y="414.6" width="556.4" height="50.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="450.0" y="436.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Обидві швидкості однакові завдовжки, та різні за напрямом.</tspan><tspan x="450.0" dy="16.2">Їхня різниця дивиться всередину — тому прискорення в повороті центрострімке</tspan></text>
</svg>