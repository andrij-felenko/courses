<text x="560.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">t</text>
<text x="330.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">v₀·t</text>
<text x="428.7" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">½ g·t²</text>
<rect x="19.3" y="436.2" width="721.4" height="31.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="380.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Прямокутник дає v₀·t, трикутник — ½g·t². Трикутник удвічі менший за g·t·t, бо приріст g·t набігав поступово</tspan></text>
