<line x1="100.0" y1="392.0" x2="100.0" y2="80.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="660.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end">час  t</text>
<text x="108.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">швидкість  v</text>
<line x1="100.0" y1="296.0" x2="560.0" y2="146.0" stroke="#1a1a1a" stroke-width="2.8"/>
<text x="568.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">v = v₀ + g·t</text>
<line x1="100.0" y1="296.0" x2="560.0" y2="296.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,5"/>
<line x1="560.0" y1="392.0" x2="560.0" y2="146.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,5"/>
<line x1="95.0" y1="296.0" x2="105.0" y2="296.0" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="88.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">v₀</text>
<text x="568.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">g·t</text>
