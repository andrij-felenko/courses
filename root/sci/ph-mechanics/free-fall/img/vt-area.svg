<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Площа під графіком швидкості — це пройдений шлях</text>
<rect x="100.0" y="296.0" width="460.0" height="96.0" rx="0" fill="#eaf0fd" stroke="none" stroke-width="0.0"/>
