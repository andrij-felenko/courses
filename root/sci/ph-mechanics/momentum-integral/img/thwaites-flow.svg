<line x1="505.0" y1="190.0" x2="505.0" y2="235.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="398.7" y="236.3" width="212.6" height="37.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="505.0" y="251.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">Фіксація координати x_sep</tspan><tspan x="505.0" dy="14.3">і зупинка ламінарного розрахунку</tspan></text>
