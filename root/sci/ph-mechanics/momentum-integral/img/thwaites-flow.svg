<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 760 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="760" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="375.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм чисельного розв'язання за методом Твейтса</text>
<rect x="7.5" y="100.0" width="125.0" height="90.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="70.0" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="70.0" dy="0.0">1. Вхідні дані</tspan><tspan x="70.0" dy="14.3">Розподіл U_e(x)</tspan><tspan x="70.0" dy="14.3">і в'язкість ν</tspan></text>
<rect x="152.5" y="100.0" width="125.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="215.0" y="136.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">2. Квадратура</tspan><tspan x="215.0" dy="11.7">θ²(x) = (0.45ν/U_e⁶)</tspan><tspan x="215.0" dy="11.7">· ∫₀ˣ U_e⁵ dξ</tspan></text>
<rect x="297.5" y="100.0" width="125.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="360.0" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">3. Градієнт</tspan><tspan x="360.0" dy="14.3">λ_T(x) = </tspan><tspan x="360.0" dy="14.3">(θ²/ν)·(dU_e/dx)</tspan></text>
<rect x="442.5" y="100.0" width="125.0" height="90.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="505.0" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">4. Перевірка</tspan><tspan x="505.0" dy="14.3">Якщо λ_T ≤ -0.09</tspan><tspan x="505.0" dy="14.3">→ ВІДРИВ!</tspan></text>
<rect x="587.5" y="100.0" width="125.0" height="90.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="650.0" y="134.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">5. Вихідні дані</tspan><tspan x="650.0" dy="14.3">Товщини θ, δ*</tspan><tspan x="650.0" dy="14.3">і тертя C_f(x)</tspan></text>
<line x1="134.5" y1="145.0" x2="150.5" y2="145.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="279.5" y1="145.0" x2="295.5" y2="145.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
