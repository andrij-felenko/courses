<rect x="290.0" y="120.0" width="218.0" height="150.0" rx="6" fill="#eef1f4" stroke="#c2c8cf" stroke-width="1.5"/><text x="399.0" y="173.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="399.0" dy="0.0">CL_md → макс L/D</tspan><tspan x="399.0" dy="17.6">CL_mp → мін потужн.</tspan><tspan x="399.0" dy="17.6">CL_jr → дальн. струменя</tspan><tspan x="399.0" dy="17.6">+ швидкість кожної</tspan></text>
