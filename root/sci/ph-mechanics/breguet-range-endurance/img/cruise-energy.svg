<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="830" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="415.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки береться дальність: енергія ділиться на опір</text>
<line x1="123.0" y1="220.0" x2="273.0" y2="220.0" stroke="#1a1a1a" stroke-width="7.0"/>
<line x1="273.0" y1="220.0" x2="295.0" y2="220.0" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="133.0" y1="220.0" x2="133.0" y2="196.0" stroke="#1a1a1a" stroke-width="5.0"/>
<line x1="189.0" y1="215.0" x2="189.0" y2="225.0" stroke="#1a1a1a" stroke-width="9.0"/>
<line x1="195.0" y1="214.0" x2="195.0" y2="124.0" stroke="#27ae60" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="195.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Підйом L</text>
<line x1="195.0" y1="226.0" x2="195.0" y2="316.0" stroke="#c0392b" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="195.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Вага W</text>
<line x1="209.0" y1="202.0" x2="315.0" y2="202.0" stroke="#2457d6" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="353.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Тяга T</text>
<line x1="181.0" y1="238.0" x2="75.0" y2="238.0" stroke="#1a1a1a" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="39.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Опір D</text>
<text x="195.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">L = W        T = D</text>
<line x1="400.0" y1="70.0" x2="400.0" y2="380.0" stroke="#d0d5db" stroke-width="1.5" stroke-dasharray="4 5"/>
<text x="605.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Пройти R — це робота проти опору,</text>
<text x="605.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">яку оплачує вся енергія на борту:</text>
<rect x="535.0" y="137.5" width="139.9" height="41.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="605.0" y="163.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="605.0" dy="0.0">R  =  E / D</tspan></text>
<text x="605.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">опір виражаємо через вагу і якість:</text>
<rect x="514.0" y="229.5" width="182.1" height="41.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="605.0" y="255.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="605.0" dy="0.0">D  =  W / (L/D)</tspan></text>
<line x1="605.0" y1="278.0" x2="605.0" y2="306.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="491.9" y="322.5" width="226.3" height="43.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="605.0" y="349.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="605.0" dy="0.0">R  =  E · (L/D) / W</tspan></text>
</svg>