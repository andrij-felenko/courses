<rect x="102.6" y="406.2" width="714.8" height="51.6" rx="6" fill="#eef3fb" stroke="#27ae60" stroke-width="1.5"/><text x="460.0" y="428.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Крапля падає прямовисно в чашку, риба плаває на всі боки однаково — у стоячому й у рухомому однаково.</tspan><tspan x="460.0" dy="15.6">Поки хід рівний, усередині немає жодної прикмети руху: рівномірний рух не можна відчути зсередини.</tspan></text>
