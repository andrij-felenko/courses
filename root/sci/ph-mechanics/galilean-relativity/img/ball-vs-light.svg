<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="920.0" height="480.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="460.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Межа принципу: механічні швидкості додаються, а швидкість світла — ні</text>
<text x="150.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">М'яч, кинутий уперед із потяга</text>
<rect x="155.0" y="123.0" width="150.0" height="54.0" rx="11" fill="#eef2f7" stroke="#333333" stroke-width="1.9"/><rect x="169.0" y="133.0" width="26.0" height="22.0" rx="3" fill="#dbe6f5" stroke="#333333" stroke-width="1.1"/><rect x="205.0" y="133.0" width="26.0" height="22.0" rx="3" fill="#dbe6f5" stroke="#333333" stroke-width="1.1"/><circle cx="189.0" cy="186.0" r="11.0" fill="#d8dee6" stroke="#333333" stroke-width="1.5"/><circle cx="271.0" cy="186.0" r="11.0" fill="#d8dee6" stroke="#333333" stroke-width="1.5"/>
<line x1="150.0" y1="202.0" x2="250.0" y2="202.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="200.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">V = 30 м/с (потяг)</text>
<circle cx="330.0" cy="144.0" r="8.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<line x1="342.0" y1="144.0" x2="430.0" y2="144.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="386.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">u′ = 10 м/с</text>
<rect x="556.2" y="123.6" width="287.6" height="52.8" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/><text x="700.0" y="146.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">відносно землі:  30 + 10 = 40 м/с</tspan><tspan x="700.0" dy="16.2">швидкості додаються — принцип Ґалілея</tspan></text>
<line x1="70.0" y1="268.0" x2="850.0" y2="268.0" stroke="#e3e8ee" stroke-width="1.4" stroke-dasharray="5,6"/>
<text x="150.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Спалах світла з того самого потяга</text>
<rect x="155.0" y="345.0" width="150.0" height="54.0" rx="11" fill="#eef2f7" stroke="#333333" stroke-width="1.9"/><rect x="169.0" y="355.0" width="26.0" height="22.0" rx="3" fill="#dbe6f5" stroke="#333333" stroke-width="1.1"/><rect x="205.0" y="355.0" width="26.0" height="22.0" rx="3" fill="#dbe6f5" stroke="#333333" stroke-width="1.1"/><circle cx="189.0" cy="408.0" r="11.0" fill="#d8dee6" stroke="#333333" stroke-width="1.5"/><circle cx="271.0" cy="408.0" r="11.0" fill="#d8dee6" stroke="#333333" stroke-width="1.5"/>
<line x1="150.0" y1="424.0" x2="250.0" y2="424.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="200.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">V = 30 м/с (потяг)</text>
<path d="M 322.0 366.0 q 8 -8 16 0 q 8 8 16 0 q 8 -8 16 0 q 8 8 16 0 q 8 -8 16 0 q 8 8 16 0 q 8 -8 16 0 q 8 8 16 0 q 8 -8 16 0 q 8 8 16 0 q 8 -8 16 0 q 8 8 16 0 q 8 -8 16 0 q 8 8 16 0 " fill="none" stroke="#e8a400" stroke-width="3"/>
<line x1="532.0" y1="366.0" x2="544.0" y2="366.0" stroke="#e8a400" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="418.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c98a00" text-anchor="middle" font-weight="700" font-style="italic">c</text>
<rect x="545.5" y="345.6" width="309.0" height="52.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="700.0" y="368.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">відносно землі:  усе одно c, а не c + 30</tspan><tspan x="700.0" dy="16.2">світло не підкоряється додаванню</tspan></text>
<rect x="66.0" y="427.2" width="788.1" height="49.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="460.0" y="448.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Уся механіка кориться Ґалілеєві; світло — ні. Тому перетворення Ґалілея — лише границя малих швидкостей (v ≪ c),</tspan><tspan x="460.0" dy="15.6">а при швидкостях, близьких до c, його заступає перетворення Лоренца (Ейнштейн).</tspan></text>
</svg>