<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 492" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="492" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="940.0" height="492.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що перехід робить із простором-часом: Ґалілей зсуває, Лоренц повертає</text>
<line x1="470.0" y1="58.0" x2="470.0" y2="344.0" stroke="#dfe4ea" stroke-width="1.3" stroke-dasharray="4,6"/>
<text x="275.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ґалілей: t′ = t (час абсолютний)</text>
<line x1="150.0" y1="312.0" x2="400.0" y2="312.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">x</text>
<line x1="150.0" y1="312.0" x2="150.0" y2="104.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="135.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">t</text>
<line x1="150.0" y1="312.0" x2="246.0" y2="104.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="258.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700" font-style="italic">t′</text>
<line x1="150.0" y1="208.0" x2="400.0" y2="208.0" stroke="#27ae60" stroke-width="2.0" stroke-dasharray="7,5"/>
<text x="400.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end">однаковий час — горизонталь</text>
<text x="300.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">x′ ∥ x</text>
<text x="686.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Лоренц: помітне V/c</text>
<line x1="560.0" y1="312.0" x2="810.0" y2="312.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="810.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">x</text>
<line x1="560.0" y1="312.0" x2="560.0" y2="104.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="540.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">ct</text>
<line x1="560.0" y1="312.0" x2="768.0" y2="104.0" stroke="#e8a400" stroke-width="2.0" stroke-dasharray="7,5"/>
<text x="710.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c98a00" text-anchor="start">світло (45°)</text>
<line x1="560.0" y1="312.0" x2="656.0" y2="104.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="668.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700" font-style="italic">ct′</text>
<line x1="560.0" y1="312.0" x2="800.0" y2="192.0" stroke="#2457d6" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="812.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700" font-style="italic">x′</text>
<text x="710.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start">однаковий час — похило</text>
<rect x="150.2" y="384.8" width="639.6" height="98.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="470.0" y="407.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Ґалілей зсуває лише вісь часу — лінії однакового часу лишаються</tspan><tspan x="470.0" dy="15.6">горизонтальними: час у всіх системах спільний, t′ = t.</tspan><tspan x="470.0" dy="15.6">Лоренц повертає обидві осі до світлової лінії (45°) — і одночасність</tspan><tspan x="470.0" dy="15.6">стає похилою, залежною від системи.</tspan><tspan x="470.0" dy="15.6">Нахил x′-осі має порядок V/c: при V ≪ c він зникає (γ → 1) — Лоренц зливається з Ґалілеєм.</tspan></text>
</svg>