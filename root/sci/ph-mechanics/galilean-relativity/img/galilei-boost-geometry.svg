<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="920.0" height="430.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="460.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрія переходу: чому x′ = x − Vt і чому час спільний t′ = t</text>
<line x1="90.0" y1="236.0" x2="800.0" y2="236.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="796.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="end">простір</text>
<circle cx="150.0" cy="236.0" r="5.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="150.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">O</text>
<text x="150.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">початок S</text>
<circle cx="360.0" cy="236.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="360.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">O′</text>
<text x="360.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">початок S′ (пливе на V)</text>
<circle cx="690.0" cy="236.0" r="6.0" fill="#fef6e7" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="690.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">P</text>
<line x1="150.0" y1="244.0" x2="150.0" y2="314.0" stroke="#cdd6df" stroke-width="1.0" stroke-dasharray="3,4"/>
<line x1="360.0" y1="244.0" x2="360.0" y2="314.0" stroke="#cdd6df" stroke-width="1.0" stroke-dasharray="3,4"/>
<line x1="690.0" y1="244.0" x2="690.0" y2="314.0" stroke="#cdd6df" stroke-width="1.0" stroke-dasharray="3,4"/>
<line x1="150.0" y1="292.0" x2="360.0" y2="292.0" stroke="#27ae60" stroke-width="2.6"/>
<text x="255.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Vt</text>
<line x1="360.0" y1="292.0" x2="690.0" y2="292.0" stroke="#2457d6" stroke-width="2.6"/>
<text x="525.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">x′  (координата P у S′)</text>
<line x1="150.0" y1="324.0" x2="690.0" y2="324.0" stroke="#1a1a1a" stroke-width="2.6"/>
<text x="420.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">x  (координата P у S)  =  x′ + Vt</text>
<line x1="150.0" y1="287.0" x2="150.0" y2="297.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="360.0" y1="287.0" x2="360.0" y2="297.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="360.0" y1="287.0" x2="360.0" y2="297.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="690.0" y1="287.0" x2="690.0" y2="297.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="150.0" y1="319.0" x2="150.0" y2="329.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="690.0" y1="319.0" x2="690.0" y2="329.0" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="812.0" cy="112.0" r="24.0" fill="#f6f8fb" stroke="#333333" stroke-width="1.8"/>
<line x1="812.0" y1="112.0" x2="812.0" y2="97.0" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="812.0" y1="112.0" x2="823.0" y2="118.0" stroke="#1a1a1a" stroke-width="2.2"/>
<circle cx="812.0" cy="112.0" r="2.6" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="812.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">t′ = t</text>
<text x="812.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">спільний час</text>
<rect x="71.8" y="362.2" width="776.4" height="51.6" rx="6" fill="#eef3fb" stroke="#27ae60" stroke-width="1.4"/><text x="460.0" y="384.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Початок S′ за час t відплив на Vt, тож координата тієї самої точки в S′ менша рівно на цей дрейф: x′ = x − Vt.</tspan><tspan x="460.0" dy="15.6">Різниця двох координат від системи не залежить: (x₂ − x₁) = (x₂′ − x₁′) — спільний дрейф Vt скорочується.</tspan></text>
</svg>