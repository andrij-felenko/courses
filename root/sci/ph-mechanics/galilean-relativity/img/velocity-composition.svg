<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="900.0" height="470.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="450.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Швидкості систем додаються векторно: та сама швидкість — різна в різних системах</text>
<rect x="70.0" y="150.0" width="400.0" height="206.0" rx="0" fill="#eaf3ff" stroke="none" stroke-width="0.0"/>
<line x1="70.0" y1="150.0" x2="470.0" y2="150.0" stroke="#8fb4dd" stroke-width="2.0"/>
<line x1="70.0" y1="356.0" x2="470.0" y2="356.0" stroke="#8fb4dd" stroke-width="2.0"/>
<text x="76.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">берег</text>
<text x="76.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">берег</text>
<line x1="100.0" y1="188.0" x2="166.0" y2="188.0" stroke="#bcd3ee" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="100.0" y1="240.0" x2="166.0" y2="240.0" stroke="#bcd3ee" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="100.0" y1="292.0" x2="166.0" y2="292.0" stroke="#bcd3ee" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="100.0" y1="330.0" x2="166.0" y2="330.0" stroke="#bcd3ee" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="462.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end">течія →</text>
<ellipse cx="210.0" cy="320.0" rx="15" ry="7" fill="#fdf1d8" stroke="#333333" stroke-width="1.8"/>
<line x1="210.0" y1="320.0" x2="210.0" y2="230.0" stroke="#2457d6" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="198.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">u′ = 3 м/с</text>
<text x="198.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end">(відносно води)</text>
<line x1="210.0" y1="320.0" x2="330.0" y2="320.0" stroke="#27ae60" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="270.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">V = 4 м/с (течія)</text>
<line x1="210.0" y1="230.0" x2="330.0" y2="230.0" stroke="#c7d0da" stroke-width="1.4" stroke-dasharray="4,5"/>
<line x1="330.0" y1="320.0" x2="330.0" y2="230.0" stroke="#c7d0da" stroke-width="1.4" stroke-dasharray="4,5"/>
<line x1="210.0" y1="320.0" x2="330.0" y2="230.0" stroke="#1a1a1a" stroke-width="3.4" marker-end="url(#arrow)"/>
<circle cx="330.0" cy="230.0" r="4.5" fill="#fef6e7" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="344.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">u = 5 м/с</text>
<text x="344.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">(відносно берега)</text>
<rect x="629.0" y="126.0" width="142.0" height="48.0" rx="6" fill="#eef3fb" stroke="#27ae60" stroke-width="1.6"/><text x="700.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">u = u′ + V</tspan></text>
<rect x="555.2" y="202.1" width="289.6" height="119.8" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="700.0" y="225.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Швидкість човна залежить від системи:</tspan><tspan x="700.0" dy="16.2">• 3 м/с — відносно води;</tspan><tspan x="700.0" dy="16.2">• 5 м/с — відносно берега.</tspan><tspan x="700.0" dy="16.2">Обидва числа правильні. Швидкість</tspan><tspan x="700.0" dy="16.2">самої системи (течія V) просто</tspan><tspan x="700.0" dy="16.2">додається векторно.</tspan></text>
<rect x="544.4" y="358.4" width="311.3" height="67.2" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/><text x="700.0" y="380.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Стала V зсуває швидкість, але не її</tspan><tspan x="700.0" dy="15.6">зміну → прискорення однакове →</tspan><tspan x="700.0" dy="15.6">F = m·a виглядає в обох системах однаково.</tspan></text>
</svg>