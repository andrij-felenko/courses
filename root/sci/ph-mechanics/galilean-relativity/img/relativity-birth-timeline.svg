<rect x="74.0" y="173.0" width="156.0" height="30.0" rx="15" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="152.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="152.0" dy="0.0">ІДЕЯ</tspan></text>
<text x="250.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">1584 — Джордано Бруно · «Вечеря на попіл»</text>
<text x="250.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">камінь зі щогли рухомого корабля не відстає — довід за Коперника</text>
<rect x="48.0" y="236.0" width="904.0" height="68.0" rx="10" fill="#fbfcfd" stroke="#e6eaef" stroke-width="1.3"/>
<rect x="52.0" y="240.0" width="6.0" height="60.0" rx="3" fill="#5b3fb0" stroke="none" stroke-width="0.0"/>
<line x1="90.0" y1="304.0" x2="90.0" y2="318.0" stroke="#dfe4ea" stroke-width="1.6"/>
<rect x="74.0" y="255.0" width="156.0" height="30.0" rx="15" fill="#efeafb" stroke="#5b3fb0" stroke-width="1.5"/><text x="152.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#5b3fb0" text-anchor="middle" font-weight="700"><tspan x="152.0" dy="0.0">ФОРМУЛЮВАННЯ</tspan></text>
<text x="250.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">1632 — Ґалілео Ґалілей · «Діалог» (вустами Сальвіаті)</text>
<text x="250.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">ціла закрита каюта: жоден дослід усередині не викаже рівного ходу</text>
<rect x="48.0" y="318.0" width="904.0" height="68.0" rx="10" fill="#fbfcfd" stroke="#e6eaef" stroke-width="1.3"/>
<rect x="52.0" y="322.0" width="6.0" height="60.0" rx="3" fill="#27ae60" stroke="none" stroke-width="0.0"/>
<line x1="90.0" y1="386.0" x2="90.0" y2="400.0" stroke="#dfe4ea" stroke-width="1.6"/>
<rect x="74.0" y="337.0" width="156.0" height="30.0" rx="15" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="152.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="152.0" dy="0.0">ДОСЛІД</tspan></text>
<text x="250.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">1640 — П'єр Ґассенді · галера в Марселі</text>
<text x="250.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">справжній камінь падає до підніжжя щогли — уявний дослід став фактом</text>
<rect x="48.0" y="400.0" width="904.0" height="68.0" rx="10" fill="#fbfcfd" stroke="#e6eaef" stroke-width="1.3"/>
<rect x="52.0" y="404.0" width="6.0" height="60.0" rx="3" fill="#1a1a1a" stroke="none" stroke-width="0.0"/>
<line x1="90.0" y1="468.0" x2="90.0" y2="482.0" stroke="#dfe4ea" stroke-width="1.6"/>
<rect x="74.0" y="419.0" width="156.0" height="30.0" rx="15" fill="#eceff3" stroke="#1a1a1a" stroke-width="1.5"/><text x="152.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="152.0" dy="0.0">ЗАКОН</tspan></text>
<text x="250.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">1687 — Ісаак Ньютон · «Начала», Короларій V</text>
<text x="250.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">відносність як наслідок законів руху: F = m·a однакове в усіх системах</text>
<rect x="48.0" y="482.0" width="904.0" height="68.0" rx="10" fill="#fbfcfd" stroke="#e6eaef" stroke-width="1.3"/>
<rect x="52.0" y="486.0" width="6.0" height="60.0" rx="3" fill="#e08a00" stroke="none" stroke-width="0.0"/>
<line x1="90.0" y1="550.0" x2="90.0" y2="564.0" stroke="#dfe4ea" stroke-width="1.6"/>
<rect x="74.0" y="501.0" width="156.0" height="30.0" rx="15" fill="#fdf3e0" stroke="#e08a00" stroke-width="1.5"/><text x="152.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e08a00" text-anchor="middle" font-weight="700"><tspan x="152.0" dy="0.0">НАЗВА</tspan></text>
<text x="250.0" y="510.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">1904 · 1905 — Анрі Пуанкаре · Альберт Айнштайн</text>
<text x="250.0" y="531.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">з'являється ім'я «принцип відносності»; піднесено в постулат</text>
<rect x="48.0" y="564.0" width="904.0" height="68.0" rx="10" fill="#fbfcfd" stroke="#e6eaef" stroke-width="1.3"/>
<rect x="52.0" y="568.0" width="6.0" height="60.0" rx="3" fill="#c0392b" stroke="none" stroke-width="0.0"/>
<rect x="74.0" y="583.0" width="156.0" height="30.0" rx="15" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="152.0" y="602.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="152.0" dy="0.0">РЕТРОНІМ</tspan></text>
<text x="250.0" y="592.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">~1911 — релятивістська література (Франк, Роте)</text>
<text x="250.0" y="613.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">«перетворення Ґалілея» — ретроспективний ярлик, пара до Лоренца</text>
</svg>