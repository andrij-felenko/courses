<text x="250.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">~499 — Аріабгата · «Аріабгатія»</text>
<text x="250.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">човен пояснює видиме обертання неба — відносність спостереження</text>
<rect x="48.0" y="154.0" width="904.0" height="68.0" rx="10" fill="#fbfcfd" stroke="#e6eaef" stroke-width="1.3"/>
<rect x="52.0" y="158.0" width="6.0" height="60.0" rx="3" fill="#2457d6" stroke="none" stroke-width="0.0"/>
