<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 920 568" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="920" height="568" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="900.0" height="548.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">У 3D сила — мінус градієнт: F = −∇U</text>
<text x="450.0" y="51.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">градієнт перпендикулярний до ліній рівного U і дивиться туди, де U росте найшвидше</text>
<circle cx="340.0" cy="300.0" r="55.0" fill="none" stroke="#27ae60" stroke-width="1.8"/>
<circle cx="340.0" cy="300.0" r="105.0" fill="none" stroke="#27ae60" stroke-width="1.8"/>
<circle cx="340.0" cy="300.0" r="155.0" fill="none" stroke="#27ae60" stroke-width="1.8"/>
<circle cx="340.0" cy="300.0" r="205.0" fill="none" stroke="#27ae60" stroke-width="1.8"/>
<circle cx="340.0" cy="300.0" r="3.5" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<line x1="332.0" y1="300.0" x2="248.0" y2="300.0" stroke="#cfd6df" stroke-width="1.0"/>
<text x="244.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">мінімум U</text>
<text x="150.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">внутрішні кільця — нижче U, зовнішні — вище</text>
<line x1="471.4" y1="217.9" x2="522.3" y2="186.1" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="560.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700" font-style="italic">∇U</text>
<text x="560.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">до крутішого U</text>
<line x1="471.4" y1="217.9" x2="420.5" y2="249.7" stroke="#c0392b" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="392.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="italic">F = −∇U</text>
<line x1="440.7" y1="168.7" x2="502.1" y2="267.1" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="516.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">дотична (U = const)</text>
<circle cx="471.4" cy="217.9" r="4.5" fill="#fdecea" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="154.3" y1="228.3" x2="192.4" y2="246.1" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="150.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700" font-style="italic">F</text>
<rect x="11.5" y="475.2" width="877.0" height="49.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="450.0" y="496.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Уздовж лінії рівного U зміна dU = ∇U·dr = 0 → ∇U перпендикулярний до еквіпотенціалей і вказує напрям найшвидшого зростання U.</tspan><tspan x="450.0" dy="15.6">Сила F = −∇U тягне поперек цих ліній, до нижчого U; її величина дорівнює крутості найшвидшого спуску краєвиду.</tspan></text>
</svg>