<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 920 522" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="920" height="522" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="900.0" height="502.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Робота консервативної сили залежить лише від кінців — не від шляху</text>
<text x="450.0" y="51.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">тому по будь-якому замкненому контурі циркуляція нульова, а локально rot F = 0</text>
<path d="M215,205 Q430,120 600,300" fill="none" stroke="#27ae60" stroke-width="3"/>
<path d="M215,205 Q415,378 600,300" fill="none" stroke="#2457d6" stroke-width="3"/>
<line x1="391.6" y1="179.5" x2="446.9" y2="193.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="384.0" y1="307.0" x2="439.4" y2="320.5" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<circle cx="215.0" cy="205.0" r="8.0" fill="#fdecea" stroke="#1a1a1a" stroke-width="2.0"/>
<circle cx="600.0" cy="300.0" r="8.0" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="201.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">A · U вище</text>
<text x="614.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">B · U нижче</text>
<text x="330.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">шлях 1</text>
<text x="322.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">шлях 2</text>
<text x="470.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">W₁ = W₂ = U(A) − U(B)</text>
<circle cx="742.0" cy="200.0" r="30.0" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<line x1="726.0" y1="170.0" x2="760.0" y2="170.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="742.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">замкнений контур</text>
<text x="742.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">∮ F·dr = 0</text>
<rect x="8.1" y="445.2" width="883.8" height="49.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="450.0" y="466.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Замкни контур (туди шляхом 1, назад шляхом 2) — повна робота W₁ − W₂ = 0: саме тому кожній точці можна приписати ОДНЕ число U.</tspan><tspan x="450.0" dy="15.6">Це і є умова консервативності; у диференціальній формі — rot F = 0, тобто нульова циркуляція по нескінченно малому контурі.</tspan></text>
</svg>