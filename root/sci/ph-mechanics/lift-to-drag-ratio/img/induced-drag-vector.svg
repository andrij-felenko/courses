<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="880" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скіс потоку нахиляє підйом — і народжує індуктивний опір</text>
<ellipse cx="300" cy="250" rx="34" ry="9" transform="rotate(-8 300 250)" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="300.0" y1="250.0" x2="300.0" y2="84.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 4"/>
<line x1="300.0" y1="250.0" x2="505.0" y2="250.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="470.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="start" font-weight="700" font-style="italic">V∞</text>
<text x="470.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">(вільний потік)</text>
<line x1="300.0" y1="250.0" x2="462.3" y2="315.6" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="468.3" y="321.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">місцевий потік Vloc</text>
<text x="468.3" y="338.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">(нахилений скосом на α_i)</text>
<line x1="462.3" y1="250.0" x2="462.3" y2="315.6" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="470.3" y="286.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">скіс w</text>
<line x1="300.0" y1="250.0" x2="373.0" y2="69.2" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="383.0" y="55.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Підйом L</text>
<line x1="300.0" y1="250.0" x2="300.0" y2="69.2" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="4 4"/>
<line x1="300.0" y1="69.2" x2="373.0" y2="69.2" stroke="#c0392b" stroke-width="4.0"/>
<text x="381.0" y="73.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">D_i = L·sin α_i</text>
<text x="290.0" y="159.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end">корисний</text>
<text x="290.0" y="175.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end">підйом ≈ L</text>
<polyline points="300.0,178.0 302.8,178.1 305.5,178.2 308.3,178.5 311.0,178.8 313.7,179.3 316.4,179.9 319.1,180.6 321.8,181.4 324.4,182.3 327.0,183.2" fill="none" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="320.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">α_i</text>
<text x="720.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому CD_i ∝ CL²</text>
<rect x="585.0" y="138.0" width="278.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="724.0" y="192.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="724.0" dy="0.0">α_i = CL / (π·Λ)</tspan><tspan x="724.0" dy="16.9">D_i = L·sin α_i ≈ L·α_i</tspan><tspan x="724.0" dy="16.9">CD_i = CL·α_i = CL² / (π·Λ)</tspan><tspan x="724.0" dy="16.9">з поправкою e:  CD_i = CL²/(π·e·Λ)</tspan></text>
</svg>