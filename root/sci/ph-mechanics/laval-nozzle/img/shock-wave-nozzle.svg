<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 940 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="940" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="920.0" height="460.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура прямого скачка ущільнення у дифузорі сопла</text>
<path d="M 100,160 L 820,60" fill="none" stroke="#34495e" stroke-width="3.5"/>
<path d="M 100,240 L 820,340" fill="none" stroke="#34495e" stroke-width="3.5"/>
<polygon points="100.0,160.0 460.0,110.0 460.0,290.0 100.0,240.0" fill="#fdf2e9" stroke="none" stroke-width="0"/>
<polygon points="460.0,110.0 820.0,60.0 820.0,340.0 460.0,290.0" fill="#ebf5fb" stroke="none" stroke-width="0"/>
<line x1="460.0" y1="100.0" x2="460.0" y2="300.0" stroke="#8e44ad" stroke-width="4.5"/>
<text x="460.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="middle" font-weight="700">Скачок ущільнення</text>
<line x1="150.0" y1="200.0" x2="350.0" y2="200.0" stroke="#c0392b" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="250.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">M₁ &gt; 1 (Надзвуковий)</text>
<text x="250.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Тиск P₁, Температура T₁</text>
<line x1="530.0" y1="200.0" x2="700.0" y2="200.0" stroke="#2980b9" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="615.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2980b9" text-anchor="middle" font-weight="700">M₂ &lt; 1 (Дозвуковий)</text>
<text x="615.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Тиск P₂ &gt; P₁, Температура T₂ &gt; T₁</text>
<rect x="218.4" y="347.5" width="483.1" height="65.0" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="1.5"/><text x="460.0" y="368.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Стрибок параметрів на скачку (Ренкін — Гюгоньо):</tspan><tspan x="460.0" dy="16.2">• Число Маха падає: M₂ &lt; 1   • Статичний тиск стрибає: P₂ &gt; P₁</tspan><tspan x="460.0" dy="16.2">• Повний тиск втрачається: P₀₂ &lt; P₀₁   • Ентропія зростає: ΔS &gt; 0</tspan></text>
</svg>