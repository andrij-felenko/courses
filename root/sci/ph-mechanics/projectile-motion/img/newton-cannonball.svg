<rect x="58.6" y="591.8" width="642.7" height="46.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="380.0" y="611.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Стріляй горизонтально дедалі швидше — парабола падіння витягується, аж поки Земля</tspan><tspan x="380.0" dy="15.0">не тікає з-під ядра рівно так само швидко, як воно падає. Тоді ядро не сягає землі — це орбіта.</tspan></text>
