<rect x="642.0" y="142.1" width="296.0" height="51.9" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.5"/><text x="790.0" y="164.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">P₂ = ρ·g·h₂   (нижня грань глибша)</tspan><tspan x="790.0" dy="16.9">P₁ = ρ·g·h₁   (верхня грань вища)</tspan></text>
<rect x="654.1" y="296.1" width="271.9" height="51.9" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="318.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">F = (P₂ − P₁)·A = ρ·g·(h₂−h₁)·A</tspan><tspan x="790.0" dy="16.9">= ρ·g·h·A = ρ_рідини · g · V</tspan></text>
<rect x="150.0" y="548.0" width="800.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="550.0" y="570.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">Тиск росте вглиб, тож знизу давить дужче, ніж згори. Непогашена різниця й штовхає тіло вгору —</tspan><tspan x="550.0" dy="16.2">і дорівнює ρ·g·V, у ній немає ні ваги тіла, ні його матеріалу, лише об'єм і густина рідини.</tspan></text>
