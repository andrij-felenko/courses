<rect x="120.0" y="592.0" width="920.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="580.0" y="611.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="580.0" dy="0.0">Кривизна поверхні зникає під час згортання: непогашений поштовх народжує не сам тиск, а його</tspan><tspan x="580.0" dy="16.2">градієнт, а той живе в об'ємі. Тому ρ·g·V справджується для тіла будь-якої форми.</tspan></text>
