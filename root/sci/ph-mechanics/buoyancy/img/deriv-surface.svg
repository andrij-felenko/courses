<rect x="729.2" y="112.5" width="241.6" height="55.1" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.5"/><text x="850.0" y="135.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">F = −∮ P·n dA</tspan><tspan x="850.0" dy="17.6">(точно, поверхня будь-яка)</tspan></text>
