<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1130 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1130" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Виштовхування проти ефективної гравітації: кулька в авто хилиться вперед</text>
<line x1="90.0" y1="396.0" x2="720.0" y2="396.0" stroke="#8b9099" stroke-width="3.0"/>
<rect x="150.0" y="214.0" width="490.0" height="158.0" rx="16" fill="#eef2f6" stroke="#8b9099" stroke-width="2.0"/>
<circle cx="250.0" cy="396.0" r="26.0" fill="#c4c9d2" stroke="#8b9099" stroke-width="2.2"/>
<circle cx="540.0" cy="396.0" r="26.0" fill="#c4c9d2" stroke="#8b9099" stroke-width="2.2"/>
<line x1="300.0" y1="178.0" x2="470.0" y2="178.0" stroke="#1a1a1a" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="500.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">a (розгін уперед)</text>
<line x1="300.0" y1="238.0" x2="266.0" y2="330.0" stroke="#6b7280" stroke-width="2.2"/>
<circle cx="266.0" cy="338.0" r="9.0" fill="#8b9099" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="260.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">виска — назад</text>
<line x1="490.0" y1="356.0" x2="520.0" y2="272.0" stroke="#c9a860" stroke-width="1.8"/>
<circle cx="520.0" cy="252.0" r="22.0" fill="#f4b9c4" stroke="#c0392b" stroke-width="1.8"/>
<text x="520.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">He</text>
<text x="550.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">кулька — вперед</text>
<rect x="740.0" y="150.0" width="350.0" height="300.0" rx="8" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.4"/>
<text x="915.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">у системі салону</text>
<circle cx="890.0" cy="252.0" r="3.5" fill="#1a1a1a" stroke="none" stroke-width="0.0"/>
<line x1="890.0" y1="252.0" x2="890.0" y2="344.0" stroke="#2457d6" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="880.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700" font-style="italic">g</text>
<line x1="890.0" y1="252.0" x2="806.0" y2="252.0" stroke="#2457d6" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="834.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700" font-style="italic">−a</text>
<line x1="890.0" y1="252.0" x2="806.0" y2="344.0" stroke="#1a1a1a" stroke-width="3.2" marker-end="url(#arrow)"/>
<text x="794.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="700" font-style="italic">g_еф</text>
<line x1="890.0" y1="252.0" x2="974.0" y2="160.0" stroke="#27ae60" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="982.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">поштовх</text>
<rect x="150.0" y="470.0" width="900.0" height="66.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="491.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">У салоні діє ефективна гравітація g_еф = g − a (вниз-і-назад). Важче за повітря тіло — пасажир,</tspan><tspan x="600.0" dy="16.2">виска — хилиться назад по цьому полю; легша гелієва кулька виштовхується ПРОТИ g_еф — угору-і-вперед.</tspan><tspan x="600.0" dy="16.2">∇P = ρ·g_еф  ⟹  F = −ρ·V·g_еф, тобто поштовх завжди проти ефективної гравітації.</tspan></text>
</svg>