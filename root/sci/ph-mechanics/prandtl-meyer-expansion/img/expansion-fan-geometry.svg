<rect x="40.0" y="430.0" width="740.0" height="70.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="410.0" y="446.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Ключові властивості течії Прандтля — Майєра:</tspan><tspan x="410.0" dy="15.0">• Течія повертає у бік опуклого кута без утворення скачка ущільнення.</tspan><tspan x="410.0" dy="15.0">• Розширення є гладким, ізоентропійним (Δs = 0) та супроводжується розгоном потоку (M₂ &gt; M₁).</tspan><tspan x="410.0" dy="15.0">• Повний тиск не змінюється: p₀₂ = p₀₁.</tspan></text>
