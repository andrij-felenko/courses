<rect x="50.0" y="335.0" width="740.0" height="110.0" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="420.0" y="378.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Критичне значення M = 1 ділить газодинаміку на два фундаментально різні світи:</tspan><tspan x="420.0" dy="16.2">• Дозвуковий потік розширюється у розширюваних каналах і прискорюється у звужуваних.</tspan><tspan x="420.0" dy="16.2">• Надзвуковий потік прискорюється у розширюваних каналах (сопло Лаваля) і створює скачки ущільнення.</tspan></text>
