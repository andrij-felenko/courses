<rect x="40.0" y="135.0" width="140.0" height="175.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="110.0" y="195.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Нестислий</tspan><tspan x="110.0" dy="15.6">M &lt; 0.3</tspan><tspan x="110.0" dy="15.6"></tspan><tspan x="110.0" dy="15.6">Зміна густини &lt; 5%</tspan><tspan x="110.0" dy="15.6">Рівняння Бернуллі</tspan></text>
