<text x="882.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">C: 64 → 96</text>
<rect x="96.0" y="322.0" width="808.0" height="62.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="349.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">коло і пластини — точні; квадрат/прямокутник — числові (Шах–Лондон); кільце — точна формула витрати.</tspan><tspan x="500.0" dy="16.2">наївне C = 64 з D_h завищує Δp для квадрата на ~12 %, бо насправді C ≈ 56.9.</tspan></text>
