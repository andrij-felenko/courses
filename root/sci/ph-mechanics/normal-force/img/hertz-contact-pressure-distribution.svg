<rect x="127.6" y="470.5" width="804.9" height="51.1" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.4"/><text x="530.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Контакт Герца створює напівсфероїдальний купол тиску p₀ = 1.5·p_mean;</tspan><tspan x="530.0" dy="17.6">критичні зсувні напруження концентруються під поверхнею (z ≈ 0.48 a), що веде до втомного викришування</tspan></text>
