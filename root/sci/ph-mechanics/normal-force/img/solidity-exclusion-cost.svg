<rect x="69.2" y="510.5" width="881.6" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="510.0" y="532.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Нової сили не з'явилося — просто половина станів стала недосяжною, і за спільний простір платять кінетичною енергією</tspan></text>
