<rect x="40.0" y="416.0" width="450.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="265.0" y="450.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">Далеко один від одного кожен електрон сидить</tspan><tspan x="265.0" dy="16.9">у найнижчому стані свого атома — вигин найменший</tspan></text>
