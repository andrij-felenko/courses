<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один кадр: рушій не знає mg — він гасить рух, який тіло встигло зробити в опору</text>
