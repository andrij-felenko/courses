<text x="923.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">4 · сила</text>
<line x1="52.0" y1="186.0" x2="246.0" y2="186.0" stroke="#1a1a1a" stroke-width="2.6"/>
