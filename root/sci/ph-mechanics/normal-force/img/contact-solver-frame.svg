<text x="149.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">перекриття d</text>
<text x="149.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="149.0" dy="0.0">v ← v − g·Δt</tspan><tspan x="149.0" dy="19.5">v*ₙ = −0.163 м/с</tspan><tspan x="149.0" dy="19.5">тіло рухається в опору</tspan></text>
<text x="407.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="407.0" dy="0.0">vₙ′ ≥ 0</tspan><tspan x="407.0" dy="28.9">λ ≥ 0</tspan><tspan x="407.0" dy="28.9">λ · vₙ′ = 0</tspan></text>
<text x="407.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle"><tspan x="407.0" dy="0.0">не рухатися в опору,</tspan><tspan x="407.0" dy="19.5">опора лише штовхає,</tspan><tspan x="407.0" dy="19.5">або дотик, або нуль</tspan></text>
<line x1="568.0" y1="186.0" x2="762.0" y2="186.0" stroke="#1a1a1a" stroke-width="2.6"/>
<rect x="624.0" y="142.0" width="82.0" height="44.0" rx="6" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.8"/>
<line x1="665.0" y1="186.0" x2="665.0" y2="118.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="696.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="start" font-weight="700">λ</text>
<text x="665.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">λ = max(0, −mₑ·v*ₙ)</tspan><tspan x="665.0" dy="19.5">= 6 · 0.163</tspan><tspan x="665.0" dy="19.5">= 0.98 Н·с</tspan></text>
