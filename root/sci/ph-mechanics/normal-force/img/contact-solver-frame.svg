<text x="149.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">1 · вільний крок</text>
<rect x="288.0" y="58.0" width="238.0" height="250.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
