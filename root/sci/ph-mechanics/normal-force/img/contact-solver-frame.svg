<text x="878.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">N</text>
<line x1="942.0" y1="142.0" x2="942.0" y2="176.0" stroke="#27ae60" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="968.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="start" font-weight="700">mg</text>
<text x="923.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="923.0" dy="0.0">N = λ/Δt</tspan><tspan x="923.0" dy="19.5">= 0.98 · 60</tspan><tspan x="923.0" dy="19.5">= 58.8 Н = mg</tspan></text>
<line x1="270.0" y1="183.0" x2="286.0" y2="183.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="528.0" y1="183.0" x2="544.0" y2="183.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="786.0" y1="183.0" x2="802.0" y2="183.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="20.0" y="344.0" width="330.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="185.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">рівна підлога</text>
<text x="185.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">v*ₙ = −g·Δt</text>
<text x="185.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">N = 58.8 Н = mg</text>
<rect x="375.0" y="344.0" width="330.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="540.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">схил 30°</text>
<text x="540.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">v*ₙ = −g·Δt·cos30°</text>
<text x="540.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">N = 50.9 Н = mg·cos30°</text>
<rect x="730.0" y="344.0" width="330.0" height="96.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="895.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">підлога ліфта, a = 2 м/с²</text>
<text x="895.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">v*ₙ = −(g+a)·Δt</text>
<text x="895.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">N = 70.8 Н = m(g+a)</text>
<rect x="235.6" y="458.5" width="608.8" height="55.1" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="540.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">У коді немає ні cos θ, ні (g + a): косинус дає проєкція на нахилену нормаль,</tspan><tspan x="540.0" dy="17.6">а (g + a) — те, що підлога ліфта за той самий крок теж набирає швидкості</tspan></text>
</svg>