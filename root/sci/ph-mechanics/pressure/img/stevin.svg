<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крижана хитрість Стевіна: чому дно відчуває лише висоту</text>
<polygon points="244.0,158.0 244.0,468.0 140.0,158.0" fill="#e6f3fb" stroke="none" stroke-width="0.0"/>
<polygon points="336.0,158.0 336.0,468.0 440.0,158.0" fill="#e6f3fb" stroke="none" stroke-width="0.0"/>
<rect x="244.0" y="158.0" width="92.0" height="310.0" rx="0" fill="#bfe0f2" stroke="none" stroke-width="1.5"/>
<line x1="244.0" y1="468.0" x2="140.0" y2="158.0" stroke="#1a1a1a" stroke-width="2.6"/>
<line x1="336.0" y1="468.0" x2="440.0" y2="158.0" stroke="#1a1a1a" stroke-width="2.6"/>
<line x1="140.0" y1="158.0" x2="440.0" y2="158.0" stroke="#7cc0e0" stroke-width="2.2"/>
<line x1="244.0" y1="468.0" x2="336.0" y2="468.0" stroke="#1a1a1a" stroke-width="3.6"/>
<line x1="244.0" y1="158.0" x2="244.0" y2="468.0" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="5 5"/>
<line x1="336.0" y1="158.0" x2="336.0" y2="468.0" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="5 5"/>
<text x="290.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">стовп над дном</text>
<text x="290.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">вода</text>
<text x="194.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700" font-style="italic">лід</text>
<text x="386.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700" font-style="italic">лід</text>
<line x1="196.0" y1="312.0" x2="238.0" y2="298.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="384.0" y1="312.0" x2="342.0" y2="298.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="150.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">стінки тримають лід</text>
<line x1="290.0" y1="432.0" x2="290.0" y2="464.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<rect x="185.1" y="485.6" width="209.8" height="44.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="290.0" y="504.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="290.0" dy="0.0">на дно — лише вага стовпа</tspan><tspan x="290.0" dy="16.2">P = ρ·g·h</tspan></text>
<text x="720.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Уявний дослід Стевіна (1586)</text>
<text x="548.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start"><tspan x="548.0" dy="0.0">1.  Заморозь усю воду, крім прямого</tspan><tspan x="548.0" dy="18.5">     стовпа просто над дном. Вага й</tspan><tspan x="548.0" dy="18.5">     обрис ті самі — отже, і рівновага.</tspan><tspan x="548.0" dy="18.5"></tspan><tspan x="548.0" dy="18.5">2.  Лід нікуди не зрушив: його тримають</tspan><tspan x="548.0" dy="18.5">     похилі стінки, а не дно.</tspan><tspan x="548.0" dy="18.5"></tspan><tspan x="548.0" dy="18.5">3.  На дно тисне лише стовп над ним —</tspan><tspan x="548.0" dy="18.5">     тож форма й обсяг посудини не</tspan><tspan x="548.0" dy="18.5">     важать, важить сама висота h.</tspan></text>
<rect x="80.0" y="542.0" width="840.0" height="44.0" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="568.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Стевін довів гідростатичний парадокс без жодного вимірювання — самим міркуванням: уявним «замерзанням» води.</tspan></text>
</svg>