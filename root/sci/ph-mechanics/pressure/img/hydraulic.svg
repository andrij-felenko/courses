<rect x="326.9" y="123.5" width="206.1" height="53.1" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="430.0" y="145.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">F₂ = F₁ · (A₂ / A₁)</tspan><tspan x="430.0" dy="17.6">= 100 · 100 = 10 000 Н</tspan></text>
<rect x="80.0" y="496.0" width="820.0" height="54.0" rx="6" fill="#eef4fb" stroke="#2457d6" stroke-width="1.5"/><text x="490.0" y="519.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Принцип Паскаля: доданий тиск однаковий у всій замкненій рідині. Площа більша в 100 разів —</tspan><tspan x="490.0" dy="16.2">сила більша в 100 разів. Виграш у силі оплачено довшим ходом: енергія зберігається.</tspan></text>
