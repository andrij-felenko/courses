<rect x="80.3" y="468.8" width="839.4" height="32.5" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/><text x="500.0" y="489.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Знак дотичного напруження τ_w = μ·(∂u/∂y)₀ визначає поведінку шару: при нульовому нахилі потік сходить із поверхні.</tspan></text>
