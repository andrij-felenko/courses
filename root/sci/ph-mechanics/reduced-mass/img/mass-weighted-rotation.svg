<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="900.0" height="560.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="450.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розклад кінетичної енергії — Піфагор у мас-зважених осях</text>
<line x1="250.0" y1="300.0" x2="830.0" y2="300.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="300.0" y1="300.0" x2="300.0" y2="82.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="824.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="end">u₁ = √m₁ · v₁</text>
<text x="300.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">u₂ = √m₂ · v₂</text>
<line x1="300.0" y1="300.0" x2="458.1" y2="106.4" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="300.0" y1="300.0" x2="493.6" y2="458.1" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="472.1" y="100.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700"><tspan x="472.1" dy="0.0">вісь центра мас</tspan><tspan x="472.1" dy="16.9">проєкція = √M · V</tspan></text>
<text x="507.6" y="454.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700"><tspan x="507.6" dy="0.0">вісь відстані</tspan><tspan x="507.6" dy="16.9">проєкція = √μ · v</tspan></text>
<polyline points="321.5,273.7 347.8,295.2 326.3,321.5" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="503.6" y1="258.4" x2="401.8" y2="175.3" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<line x1="503.6" y1="258.4" x2="401.8" y2="383.1" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/>
<line x1="300.0" y1="300.0" x2="503.6" y2="258.4" stroke="#1a1a1a" stroke-width="2.6"/>
<circle cx="401.8" cy="175.3" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<circle cx="401.8" cy="383.1" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<circle cx="503.6" cy="258.4" r="7.0" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="517.6" y="246.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">u = (√m₁·v₁ , √m₂·v₂)</text>
<rect x="140.4" y="500.5" width="619.2" height="39.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="450.0" y="525.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">|u|² = (u·e₁)² + (u·e₂)² = M·V² + μ·v²   ⇒   T = ½·M·V² + ½·μ·v²</tspan></text>
</svg>