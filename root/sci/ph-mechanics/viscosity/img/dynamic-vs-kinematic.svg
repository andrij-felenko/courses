<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві в'язкості: поділивши μ на густину, вода й повітря міняються місцями</text>
<line x1="105.0" y1="380.0" x2="405.0" y2="380.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="255.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">динамічна  μ</text>
<text x="255.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(Па·с — «липкість» на дотик)</text>
<rect x="132.0" y="164.2" width="78.0" height="215.8" rx="3" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.3"/>
<rect x="300.0" y="333.7" width="78.0" height="46.3" rx="3" fill="#8fc7e6" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="171.0" y="154.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1.0 мПа·с</text>
<text x="339.0" y="323.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2a6f97" text-anchor="middle" font-weight="700">0.018 мПа·с</text>
<text x="171.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">вода</text>
<text x="339.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">повітря</text>
<text x="255.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="italic">вода ~55× «густіша»</text>
<line x1="540.0" y1="380.0" x2="840.0" y2="380.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="690.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">кінематична  ν = μ/ρ</text>
<text x="690.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">(мм²/с — як розповзається рух)</text>
<rect x="567.0" y="319.0" width="78.0" height="61.0" rx="3" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.3"/>
<rect x="735.0" y="168.7" width="78.0" height="211.3" rx="3" fill="#8fc7e6" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="606.0" y="309.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1.0 мм²/с</text>
<text x="774.0" y="158.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2a6f97" text-anchor="middle" font-weight="700">15 мм²/с</text>
<text x="606.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">вода</text>
<text x="774.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">повітря</text>
<text x="690.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700" font-style="italic">повітря ~15× «швидше»</text>
<text x="472.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">але</text>
<line x1="430.0" y1="220.0" x2="512.0" y2="220.0" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="472.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ролі</text>
<text x="472.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">місцями</text>
<rect x="120.0" y="430.0" width="700.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="454.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">повітря на дотик у 55 разів «рідше» за воду (мала μ),</tspan><tspan x="470.0" dy="16.9">але вділивши на його крихітну густину — рух розповзається в ньому в 15 разів ШВИДШЕ</tspan></text>
</svg>