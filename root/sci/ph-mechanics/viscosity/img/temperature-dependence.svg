<rect x="648.0" y="330.0" width="292.0" height="120.0" rx="6" fill="#fdf2ef" stroke="#e08e0b" stroke-width="1.5"/><text x="794.0" y="361.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="794.0" dy="0.0">РІДИНА — молекули зчеплені.</tspan><tspan x="794.0" dy="16.2">Тертя = розрив зчеплень при</tspan><tspan x="794.0" dy="16.2">ковзанні шарів.</tspan><tspan x="794.0" dy="16.2">Гарячіше → зчеплення слабшають</tspan><tspan x="794.0" dy="16.2">→ тертя падає.</tspan></text>
<rect x="108.0" y="488.0" width="532.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="374.0" y="504.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="374.0" dy="0.0">мед у теплі тече, застигши — ні; а от повітря гарячим тече «густіше»,</tspan><tspan x="374.0" dy="15.6">ніж холодним — бо в газі за в'язкість відповідає геть інший механізм</tspan></text>
