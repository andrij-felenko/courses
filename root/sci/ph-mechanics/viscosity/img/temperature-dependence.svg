<rect x="648.0" y="84.0" width="292.0" height="150.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="794.0" y="122.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="794.0" dy="0.0">ГАЗ — молекули вільно літають.</tspan><tspan x="794.0" dy="16.2">Тертя = обмін імпульсом:</tspan><tspan x="794.0" dy="16.2">молекула з швидшого шару</tspan><tspan x="794.0" dy="16.2">перескакує в повільніший.</tspan><tspan x="794.0" dy="16.2">Гарячіше → жвавіший обмін</tspan><tspan x="794.0" dy="16.2">→ тертя росте.</tspan></text>
