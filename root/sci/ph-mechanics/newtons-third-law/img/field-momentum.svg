<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 512" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="512" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="960.0" height="512.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві рухомі заряджені частинки: третій закон дає збій, поле тримає баланс</text>
<line x1="140.0" y1="250.0" x2="280.0" y2="250.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 6"/>
<line x1="320.0" y1="250.0" x2="580.0" y2="250.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 6"/>
<line x1="620.0" y1="250.0" x2="740.0" y2="250.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 6"/>
<text x="732.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">пряма, що з'єднує заряди</text>
<circle cx="300.0" cy="250.0" r="16.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="300.0" y="257.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="28" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="300.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">q₁</text>
<line x1="320.0" y1="250.0" x2="392.0" y2="250.0" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="356.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">v₁ (уздовж прямої)</text>
<circle cx="246.0" cy="210.0" r="11.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><circle cx="246.0" cy="210.0" r="2.6" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="246.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">B від q₂</text>
<line x1="300.0" y1="272.0" x2="300.0" y2="346.0" stroke="#2457d6" stroke-width="3.6" marker-end="url(#arrow)"/>
<text x="312.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">сила на q₁ ≠ 0</text>
<circle cx="600.0" cy="250.0" r="16.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="600.0" y="257.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="28" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="570.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="end" font-weight="700">q₂</text>
<line x1="600.0" y1="230.0" x2="600.0" y2="158.0" stroke="#1a1a1a" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="612.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">v₂ (упоперек)</text>
<text x="600.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">сила на q₂ = 0</text>
<text x="600.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(q₁ не дає поля вздовж прямої)</text>
<line x1="790.0" y1="300.0" x2="790.0" y2="210.0" stroke="#27ae60" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="802.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">p_поле</text>
<text x="802.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">росте вгору</text>
<rect x="244.3" y="389.0" width="471.4" height="34.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="480.0" y="410.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Сили не рівні-протилежні: на q₁ сила є, на q₂ — нема</tspan></text>
<rect x="160.9" y="450.0" width="638.3" height="36.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/><text x="480.0" y="472.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Долучи поле — і баланс сходиться:  P_мех + P_поле = стала,  g = ε₀(E×B)</tspan></text>
</svg>