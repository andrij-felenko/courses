<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="940.0" height="500.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хиба Декарта: величина руху без напряму</text>
<rect x="636.0" y="78.0" width="22.0" height="168.0" rx="3" fill="#e5e7eb" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="636.0" y1="88.0" x2="658.0" y2="74.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="636.0" y1="108.0" x2="658.0" y2="94.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="636.0" y1="128.0" x2="658.0" y2="114.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="636.0" y1="148.0" x2="658.0" y2="134.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="636.0" y1="168.0" x2="658.0" y2="154.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="636.0" y1="188.0" x2="658.0" y2="174.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="636.0" y1="208.0" x2="658.0" y2="194.0" stroke="#6b7280" stroke-width="1.0"/>
<line x1="636.0" y1="228.0" x2="658.0" y2="214.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="647.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">стіна</text>
<text x="48.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">до удару</text>
<circle cx="400.0" cy="128.0" r="18.0" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="422.0" y1="128.0" x2="600.0" y2="128.0" stroke="#c0392b" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="500.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">+v (управо)</text>
<text x="48.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">після удару</text>
<circle cx="400.0" cy="208.0" r="18.0" fill="#eef2fb" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="378.0" y1="208.0" x2="200.0" y2="208.0" stroke="#2457d6" stroke-width="3.4" marker-end="url(#arrow)"/>
<text x="300.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">−v (уліво)</text>
<text x="470.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Та сама швидкість, протилежний бік — насправді геть інший стан руху.</text>
<line x1="40.0" y1="304.0" x2="900.0" y2="304.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 6"/>
<rect x="40.0" y="322.0" width="418.0" height="154.0" rx="8" fill="#fdf2f0" stroke="#c0392b" stroke-width="1.6"/>
<text x="60.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="start" font-weight="700">Рахунок Декарта — лише |m·v|</text>
<text x="60.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">до удару:     m·v</text>
<text x="60.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">після удару:  m·v   (та сама величина)</text>
<text x="60.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">⇒ «зміни немає» — а зміна ж очевидна</text>
<rect x="482.0" y="322.0" width="418.0" height="154.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="502.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">Векторний рахунок — m·v із напрямом</text>
<text x="502.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">до удару:     + m·v</text>
<text x="502.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start">після удару:  − m·v</text>
<text x="502.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">⇒ зміна = 2·m·v — стіна дала поштовх</text>
</svg>