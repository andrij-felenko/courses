<rect x="35.6" y="42.4" width="148.8" height="55.2" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="110.0" y="58.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Переріз 0 (вхід)</tspan><tspan x="110.0" dy="15.6">v₀ = 0 (висіння)</tspan><tspan x="110.0" dy="15.6">p = p₀ (атмосферний)</tspan></text>
<rect x="270.0" y="244.0" width="280.0" height="12.0" rx="3" fill="#fed7aa" stroke="#c0392b" stroke-width="2.2"/>
<text x="410.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Актуаторний диск (площа A = π R²)</text>
<line x1="410.0" y1="242.0" x2="410.0" y2="182.0" stroke="#c0392b" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="422.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Тяга T (вгору)</text>
<rect x="3.7" y="209.9" width="212.6" height="80.2" rx="6" fill="#fff7ed" stroke="#c0392b" stroke-width="1.5"/><text x="110.0" y="225.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Площина диска (z = 0)</tspan><tspan x="110.0" dy="14.3">Швидкість: v_i</tspan><tspan x="110.0" dy="14.3">Зверху: p⁻ = p₀ − ½ρ v_i²</tspan><tspan x="110.0" dy="14.3">Знизу: p⁺ = p₀ + ½ρ w² − ½ρ v_i²</tspan><tspan x="110.0" dy="14.3">Стрибок: Δp = p⁺ − p⁻ = 2ρ v_i²</tspan></text>
<line x1="260.0" y1="440.0" x2="560.0" y2="440.0" stroke="#333333" stroke-width="1.2" stroke-dasharray="5,3"/>
<rect x="38.2" y="407.1" width="143.7" height="65.9" rx="6" fill="#ecfdf5" stroke="#27ae60" stroke-width="1.5"/><text x="110.0" y="422.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="110.0" dy="0.0">Далекий слід (z → +∞)</tspan><tspan x="110.0" dy="14.3">Швидкість: w = 2·v_i</tspan><tspan x="110.0" dy="14.3">Тиск: p = p₀</tspan><tspan x="110.0" dy="14.3">Площа: A_w = A / 2</tspan></text>
<rect x="660.0" y="160.0" width="150.0" height="200.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="735.0" y="228.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">Ключові рівності:</tspan><tspan x="735.0" dy="11.7">• ṁ = ρ·A·v_i</tspan><tspan x="735.0" dy="11.7">• T = ṁ·w = 2·ρ·A·v_i²</tspan><tspan x="735.0" dy="11.7">• w = 2·v_i</tspan><tspan x="735.0" dy="11.7">• Δp = ½·ρ·w² = 2·ρ·v_i²</tspan><tspan x="735.0" dy="11.7">• A_w = A / 2</tspan><tspan x="735.0" dy="11.7">• P_i = T·v_i</tspan></text>
</svg>