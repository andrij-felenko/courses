<path d="M 190,70 C 210,130 245,190 270,250 C 290,300 305,360 311,440 L 509,440 C 515,360 530,300 550,250 C 575,190 610,130 630,70 Z" fill="#edf4fd" stroke="none" opacity="0.6"/>
