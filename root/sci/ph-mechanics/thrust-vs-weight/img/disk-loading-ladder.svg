<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="780.0" height="430.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Навантаження на диск і швидкість відкиду в зависі</text>
<text x="60.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">маленький дрон (24 см гвинти)</text>
<rect x="340.0" y="62.0" width="54.5" height="22.0" rx="4" fill="#27ae60" stroke="none" stroke-width="0.0"/>
<text x="402.5" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">T/A ≈ 65 Н/м²   v_i ≈ 5 м/с</text>
<text x="60.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Robinson R22 (легкий вертоліт)</text>
<rect x="340.0" y="122.0" width="79.2" height="22.0" rx="4" fill="#27ae60" stroke="none" stroke-width="0.0"/>
<text x="427.2" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">T/A ≈ 137 Н/м²   v_i ≈ 7 м/с</text>
<text x="60.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Chinook CH-47 (важкий вертоліт)</text>
<rect x="340.0" y="182.0" width="138.7" height="22.0" rx="4" fill="#e08e0b" stroke="none" stroke-width="0.0"/>
<text x="486.7" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">T/A ≈ 422 Н/м²   v_i ≈ 13 м/с</text>
<text x="60.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">V-22 Osprey (тилтротор)</text>
<rect x="340.0" y="242.0" width="241.2" height="22.0" rx="4" fill="#e08e0b" stroke="none" stroke-width="0.0"/>
<text x="589.2" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">T/A ≈ 1275 Н/м²   v_i ≈ 23 м/с</text>
<text x="60.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">реактивний підйом (Harrier-подібний)</text>
<rect x="340.0" y="302.0" width="370.0" height="22.0" rx="4" fill="#c0392b" stroke="none" stroke-width="0.0"/>
<text x="718.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">T/A ≈ 3000 Н/м²   v_i ≈ 35 м/с</text>
<text x="340.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">довжина смуги ∝ √(T/A)  (∝ швидкості відкиду v_i)</text>
<rect x="99.3" y="382.0" width="581.4" height="28.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/><text x="390.0" y="400.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">v_i = √( (T/A) / (2·ρ) )  →  дешевий завис вимагає МАЛОГО T/A (широкий диск)</tspan></text>
</svg>