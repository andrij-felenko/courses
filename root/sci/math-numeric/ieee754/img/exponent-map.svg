<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поле порядку — перемикач: ті самі 8 бітів задають чотири режими</text>
<rect x="60.0" y="84.0" width="154.8" height="40.0" rx="6" fill="#f1e9f7" stroke="#7a3fb0" stroke-width="1.8"/>
<text x="137.4" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a3fb0" text-anchor="middle" font-weight="700">порядок = 0</text>
<text x="137.4" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(біти 00000000)</text>
<line x1="137.4" y1="124.0" x2="137.4" y2="152.0" stroke="#7a3fb0" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="214.8" y="84.0" width="550.4" height="40.0" rx="6" fill="#eaf6ec" stroke="#27ae60" stroke-width="1.8"/>
<text x="490.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">порядок = 1 … 254</text>
<text x="490.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(звичайний діапазон)</text>
<line x1="490.0" y1="124.0" x2="490.0" y2="152.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="765.2" y="84.0" width="154.8" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="842.6" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">порядок = 255</text>
<text x="842.6" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(біти 11111111)</text>
<line x1="842.6" y1="124.0" x2="842.6" y2="152.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="12.4" y="154.0" width="250.0" height="92.0" rx="8" fill="#ffffff" stroke="#7a3fb0" stroke-width="1.6"/>
<text x="137.4" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a3fb0" text-anchor="middle" font-weight="700">мантиса = 0  →  ±0</text>
<text x="137.4" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">рівно нуль</text>
<text x="137.4" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">(є і +0, і −0)</text>
<rect x="12.4" y="260.0" width="250.0" height="92.0" rx="8" fill="#ffffff" stroke="#7a3fb0" stroke-width="1.6"/>
<text x="137.4" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a3fb0" text-anchor="middle" font-weight="700">мантиса ≠ 0  →  денормаль</text>
<text x="137.4" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0.мантиса × 2⁻¹²⁶</text>
<text x="137.4" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">(приховано 0, не 1)</text>
<rect x="365.0" y="154.0" width="250.0" height="92.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="490.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">будь-яка мантиса</text>
<text x="490.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">1.мантиса × 2^(e−127)</text>
<text x="490.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">приховано провідну 1</text>
<rect x="365.0" y="260.0" width="250.0" height="92.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="490.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">майже всі числа формату</text>
<text x="490.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">звичайна арифметика</text>
<text x="490.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">(широка середина)</text>
<rect x="717.6" y="154.0" width="250.0" height="92.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="842.6" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">мантиса = 0  →  ±∞</text>
<text x="842.6" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">переповнення,</text>
<text x="842.6" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">ділення на 0</text>
<rect x="717.6" y="260.0" width="250.0" height="92.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="842.6" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">мантиса ≠ 0  →  NaN</text>
<text x="842.6" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0/0, √(−1);</text>
<text x="842.6" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">заразний</text>
<text x="490.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Числова вісь біля нуля: денормалі рівним кроком «дотягують» до 0</text>
