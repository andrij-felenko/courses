<line x1="910.0" y1="416.0" x2="932.0" y2="416.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="60.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text>
<line x1="60.0" y1="409.0" x2="60.0" y2="423.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="98.2" y1="410.0" x2="98.2" y2="422.0" stroke="#7a3fb0" stroke-width="1.6"/>
<line x1="136.4" y1="410.0" x2="136.4" y2="422.0" stroke="#7a3fb0" stroke-width="1.6"/>
<line x1="174.7" y1="410.0" x2="174.7" y2="422.0" stroke="#7a3fb0" stroke-width="1.6"/>
<line x1="212.9" y1="410.0" x2="212.9" y2="422.0" stroke="#7a3fb0" stroke-width="1.6"/>
<line x1="251.1" y1="410.0" x2="251.1" y2="422.0" stroke="#7a3fb0" stroke-width="1.6"/>
<line x1="289.3" y1="410.0" x2="289.3" y2="422.0" stroke="#7a3fb0" stroke-width="1.6"/>
<line x1="327.6" y1="410.0" x2="327.6" y2="422.0" stroke="#7a3fb0" stroke-width="1.6"/>
<line x1="365.8" y1="410.0" x2="365.8" y2="422.0" stroke="#7a3fb0" stroke-width="1.6"/>
<line x1="404.0" y1="410.0" x2="404.0" y2="422.0" stroke="#7a3fb0" stroke-width="1.6"/>
<text x="257.8" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7a3fb0" text-anchor="middle" font-weight="700">денормалі: рівний крок 2⁻¹⁴⁹</text>
<text x="257.8" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7a3fb0" text-anchor="middle">плавне згасання до нуля</text>
<text x="120.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7a3fb0" text-anchor="middle">2⁻¹⁴⁹ (найменше)</text>
<line x1="404.0" y1="408.0" x2="404.0" y2="424.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="455.6" y1="408.0" x2="455.6" y2="424.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="530.4" y1="408.0" x2="530.4" y2="424.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="638.9" y1="408.0" x2="638.9" y2="424.0" stroke="#27ae60" stroke-width="1.8"/>
<line x1="796.2" y1="408.0" x2="796.2" y2="424.0" stroke="#27ae60" stroke-width="1.8"/>
<text x="662.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">нормальні: крок подвоюється щопорядку</text>
<line x1="404.0" y1="390.0" x2="404.0" y2="430.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="404.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">2⁻¹²⁶ (найменше нормальне)</text>
<rect x="60.0" y="520.0" width="860.0" height="36.0" rx="8" fill="#fdf6e6" stroke="#b07d1f" stroke-width="1.4"/>
<text x="490.0" y="543.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Без денормалей усе між 0 і 2⁻¹²⁶ різко падало б у нуль — «діра», де віднімання близьких чисел брехало б.</text>
