<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470">
<rect width="880" height="470" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="36.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Множення «в голові»: окремо числа, окремо префікси</text>
<text x="440.0" y="58.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">беремо мікро (10⁻⁶) і кіло (10³) — показники додаються до 10⁻³, тобто «мілі»</text>
<text x="440.0" y="110.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">1 мкА  ×  10 кОм  =  ?</text>
<rect x="70.0" y="168.0" width="360.0" height="150.0" rx="10" fill="#eef1f4" stroke="#8a8a8a" stroke-width="2"/>
<rect x="450.0" y="168.0" width="360.0" height="150.0" rx="10" fill="#e7f5ec" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="250.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ЧИСЛА (мантиси)</text>
<text x="250.0" y="238.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">1  ×  10  =  10</text>
<text x="250.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">просте множення</text>
<text x="630.0" y="198.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ПРЕФІКСИ (степені 10)</text>
<text x="630.0" y="238.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#1f8a3b" text-anchor="middle" font-weight="normal" font-style="normal">10⁻⁶ · 10³ = 10⁻³</text>
<text x="630.0" y="280.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#2a7d46" text-anchor="middle" font-weight="normal" font-style="italic">−6 + 3 = −3  →  «мілі»</text>
<line x1="250.0" y1="322.0" x2="370.0" y2="372.0" stroke="#8a8a8a" stroke-width="2.2" marker-end="url(#aGrey)"/>
<line x1="630.0" y1="322.0" x2="510.0" y2="372.0" stroke="#1f8a3b" stroke-width="2.2" marker-end="url(#aGreen)"/>
<rect x="260.0" y="378.0" width="360.0" height="58.0" rx="12" fill="#fbf7ec" stroke="#caa24a" stroke-width="2.4"/>
<text x="440.0" y="416.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">= 10 × 10⁻³ В = 10 мВ</text>
<text x="440.0" y="472.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">одиниця (А·Ом = В) і множник зійшлися самі — калькулятор не потрібен</text>
</svg>
