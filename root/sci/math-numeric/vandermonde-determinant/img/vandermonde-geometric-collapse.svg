<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометричне виродження визначника Вандермонда</text>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометричний зміст визначника: виродження об'єму при збігу вузлів</text>
<rect x="40.0" y="60.0" width="380.0" height="350.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="230.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Випадок 1: Усі вузли різні (x₀ ≠ x₁ ≠ x₂)</text>
<line x1="55.0" y1="102.0" x2="405.0" y2="102.0" stroke="#27ae60" stroke-width="1.0"/>
<line x1="70.0" y1="160.0" x2="390.0" y2="160.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="370.0" y1="160.0" x2="395.0" y2="160.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="395.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">x</text>
<circle cx="120.0" cy="160.0" r="5.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="120.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">x₀</text>
<circle cx="230.0" cy="160.0" r="5.0" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="230.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">x₁</text>
<circle cx="340.0" cy="160.0" r="5.0" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="340.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">x₂</text>
<line x1="125.0" y1="135.0" x2="225.0" y2="135.0" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="175.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">Δ₁₀ = x₁ - x₀ &gt; 0</text>
<line x1="235.0" y1="135.0" x2="335.0" y2="135.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="285.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Δ₂₁ = x₂ - x₁ &gt; 0</text>
<rect x="90.0" y="220.0" width="280.0" height="90.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="230.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Орієнтований гіпероб'єм:</text>
<text x="230.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">det(V₃) = (x₁ - x₀)(x₂ - x₀)(x₂ - x₁) ≠ 0</text>
<text x="230.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Базисні вектори лінійно незалежні</text>
<text x="230.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">✓ Система має єдиний розв'язок</text>
<text x="230.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">✓ Інтерполяційний поліном існує і єдиний</text>
<rect x="460.0" y="60.0" width="380.0" height="350.0" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="650.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Випадок 2: Збіг вузлів (x₂ → x₁)</text>
<line x1="475.0" y1="102.0" x2="825.0" y2="102.0" stroke="#c0392b" stroke-width="1.0"/>
<line x1="490.0" y1="160.0" x2="810.0" y2="160.0" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="790.0" y1="160.0" x2="815.0" y2="160.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="815.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">x</text>
<circle cx="540.0" cy="160.0" r="5.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="540.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">x₀</text>
<circle cx="710.0" cy="160.0" r="6.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="710.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">x₁ = x₂</text>
<text x="710.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Δ₂₁ = x₂ - x₁ = 0</text>
<rect x="510.0" y="220.0" width="280.0" height="90.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="650.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Колапс гіпероб'єму:</text>
<text x="650.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">det(V₃) = (x₁ - x₀)(x₂ - x₀) · 0 = 0</text>
<text x="650.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Два однакові рядки в матриці!</text>
<text x="650.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">✗ Матриця неортогональна / вироджена</text>
<text x="650.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">✗ Неможливо відновити коефіцієнти</text>
</svg>