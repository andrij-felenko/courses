<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 906 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="906" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр алгоритму Бйорка — Перейри</text>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр швидкого розв'язання систем Вандермонда (Бйорк — Перейра)</text>
<rect x="17.1" y="78.4" width="245.7" height="63.2" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="140.0" y="98.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Вхідні дані:</tspan><tspan x="140.0" dy="15.6">Вузли: x = (x₀, x₁, ..., xₙ₋₁)</tspan><tspan x="140.0" dy="15.6">Значення: y = (y₀, y₁, ..., yₙ₋₁)</tspan></text>
<rect x="343.7" y="70.6" width="252.6" height="78.8" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="90.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Етап 1: Прямий хід (Базис Ньютона)</tspan><tspan x="470.0" dy="15.6">Обчислення розділених різниць</tspan><tspan x="470.0" dy="15.6">через розклад біодіагоналей L_k(x)</tspan><tspan x="470.0" dy="15.6">Складність: n(n - 1) / 2 операцій</tspan></text>
<line x1="265.0" y1="110.0" x2="325.0" y2="110.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="282.2" y="208.4" width="375.7" height="63.2" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/><text x="470.0" y="228.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Проміжний результат:</tspan><tspan x="470.0" dy="15.6">Коефіцієнти полінома Ньютона d = (d₀, d₁, ..., dₙ₋₁)</tspan><tspan x="470.0" dy="15.6">N(x) = ∑ d_k · ∏_{j=0}^{k-1} (x - x_j)</tspan></text>
<line x1="470.0" y1="160.0" x2="470.0" y2="195.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="302.7" y="330.6" width="334.6" height="78.8" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="350.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Етап 2: Зворотний хід (Базис мономів)</tspan><tspan x="470.0" dy="15.6">Перетворення у форму c₀ + c₁x + ... + cₙ₋₁xⁿ⁻¹</tspan><tspan x="470.0" dy="15.6">через зворотні множники U_k(x)</tspan><tspan x="470.0" dy="15.6">Складність: n(n - 1) / 2 операцій</tspan></text>
<line x1="470.0" y1="285.0" x2="470.0" y2="320.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="654.0" y="338.4" width="232.0" height="63.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="358.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Вихід:</tspan><tspan x="770.0" dy="15.6">Коефіцієнти c = (c₀, ..., cₙ₋₁)</tspan><tspan x="770.0" dy="15.6">Поліном P(x) = ∑ c_j · xʲ</tspan></text>
<line x1="625.0" y1="370.0" x2="680.0" y2="370.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="66.0" y="231.6" width="208.1" height="116.8" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/><text x="170.0" y="250.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Порівняння складності:</tspan><tspan x="170.0" dy="14.3"></tspan><tspan x="170.0" dy="14.3">Метод Гаусса:</tspan><tspan x="170.0" dy="14.3">Час: O(n³), Пам'ять: O(n²)</tspan><tspan x="170.0" dy="14.3"></tspan><tspan x="170.0" dy="14.3">Бйорк — Перейра:</tspan><tspan x="170.0" dy="14.3">Час: 2n² + O(n), Пам'ять: O(n)</tspan></text>
</svg>