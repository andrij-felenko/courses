<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" height="100%">
<rect x="0.0" y="0.0" width="760.0" height="320.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<rect x="57.5" y="8.0" width="645.0" height="34.0" rx="6" fill="#eef2f7" stroke="#4a5568" stroke-width="1.5"/><text x="380.0" y="29.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Два шляхи побудови полінома: Метод коефіцієнтів vs Суперпозиція Лагранжа</tspan></text>
<rect x="34.9" y="48.5" width="310.2" height="33.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="69.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">1. Прямий метод коефіцієнтів (О(n³))</tspan></text>
<rect x="25.0" y="95.0" width="330.0" height="115.0" rx="6" fill="#fff5f5" stroke="#fca5a5" stroke-width="1.2"/>
<text x="190.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle"><tspan x="190.0" dy="0.0">[ 1  x₀  x₀²  …  x₀ⁿ ]   [ c₀ ]   [ y₀ ]</tspan><tspan x="190.0" dy="15.6">[ 1  x₁  x₁²  …  x₁ⁿ ] · [ c₁ ] = [ y₁ ]</tspan><tspan x="190.0" dy="15.6">[ …  …   …    …  …   ]   [ …  ]   [ …  ]</tspan><tspan x="190.0" dy="15.6">[ 1  x╙  x╙²  …  x╙ⁿ ]   [ c╙ ]   [ y╙ ]</tspan></text>
<text x="190.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">• Потребує розв'язання СЛАР (О(n³))</tspan><tspan x="190.0" dy="14.3">• Число обумовленості cond(V) зростає як eⁿ</tspan><tspan x="190.0" dy="14.3">• Катастрофічна чисельна нестабільність</tspan></text>
<line x1="380.0" y1="50.0" x2="380.0" y2="300.0" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,4"/>
<rect x="410.9" y="48.5" width="318.2" height="33.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="570.0" y="69.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">2. Явна суперпозиція Лагранжа (О(n²))</tspan></text>
<rect x="405.0" y="95.0" width="330.0" height="115.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
<text x="570.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">P(x) = y₀·L₀(x) + y₁·L₁(x) + … + y╙·L╙(x)</tspan><tspan x="570.0" dy="15.6"></tspan><tspan x="570.0" dy="15.6">де  L╖(x) = ∏ (x - xⱼ) / (x╖ - xⱼ)  (j ≠ k)</tspan></text>
<text x="570.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">• Не потребує обернення матриць</tspan><tspan x="570.0" dy="14.3">• Дискретний аналог імпульсного відгуку</tspan><tspan x="570.0" dy="14.3">• Легко трансформується у барицентричну форму</tspan></text>
</svg>