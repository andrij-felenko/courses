<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420">
<rect width="820" height="420" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="410.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Аналіз розмірностей: одиниці скорочуються, як числа</text>
<text x="410.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">формулу можна перевірити, не підставивши жодного числа — лише її одиниці</text>
<rect x="60.0" y="96.0" width="700.0" height="86.0" rx="12" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="82.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">W = q · V</text>
<text x="82.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">[Дж]  =  [Кл] · [Дж/Кл]  =  Дж</text>
<text x="732.0" y="146.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="30" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">✓</text>
<text x="704.0" y="130.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">сходиться</text>
<rect x="60.0" y="198.0" width="700.0" height="86.0" rx="12" fill="#fdf1f0" stroke="#c0271e" stroke-width="1.8"/>
<text x="82.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">W = q / V   (помилка!)</text>
<text x="82.0" y="260.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">[Кл] / [Дж/Кл]  =  Кл²/Дж   ≠  Дж</text>
<text x="732.0" y="248.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="30" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">✗</text>
<text x="704.0" y="232.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#c0271e" text-anchor="end" font-weight="bold" font-style="normal">не сходиться</text>
<rect x="60.0" y="300.0" width="700.0" height="86.0" rx="12" fill="#f4f7f4" stroke="#1f8a3b" stroke-width="1.8"/>
<text x="82.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">перевірка сталої k:</text>
<text x="82.0" y="362.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">(Н·м²/Кл²) · Кл²/м²  =  Н</text>
<text x="732.0" y="350.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="30" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">✓</text>
<text x="704.0" y="334.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1f8a3b" text-anchor="end" font-weight="bold" font-style="normal">сходиться</text>
</svg>
