<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 452" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="452" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">П'ять форм доведення — різні ключі до різних замків</text>
<text x="540.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">три перші доводять «P ⟹ Q» по-різному; індукція — про всі n; контрприклад лише СПРОСТОВУЄ</text>
<rect x="30.0" y="78.0" width="330.0" height="156.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="195.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">ПРЯМЕ</text>
<line x1="50.0" y1="120.0" x2="340.0" y2="120.0" stroke="#d7dbe0" stroke-width="1.2"/>
<text x="195.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">припусти P,</tspan><tspan x="195.0" dy="17.2">чинними кроками</tspan><tspan x="195.0" dy="17.2">дійди до Q</tspan></text>
<rect x="380.0" y="78.0" width="330.0" height="156.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="545.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">КОНТРАПОЗИЦІЯ</text>
<line x1="400.0" y1="120.0" x2="690.0" y2="120.0" stroke="#d7dbe0" stroke-width="1.2"/>
<text x="545.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">P ⟹ Q   рівносильне</tspan><tspan x="545.0" dy="17.2">¬Q ⟹ ¬P</tspan><tspan x="545.0" dy="17.2">— доводь зручніший бік</tspan></text>
<rect x="730.0" y="78.0" width="330.0" height="156.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="895.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ВІД СУПРОТИВНОГО</text>
<line x1="750.0" y1="120.0" x2="1040.0" y2="120.0" stroke="#d7dbe0" stroke-width="1.2"/>
<text x="895.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">припусти, що теза ХИБНА</tspan><tspan x="895.0" dy="17.2">виведи безглуздя</tspan><tspan x="895.0" dy="17.2">отже теза правдива</tspan></text>
<rect x="30.0" y="250.0" width="330.0" height="156.0" rx="10" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="195.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ІНДУКЦІЯ</text>
<line x1="50.0" y1="292.0" x2="340.0" y2="292.0" stroke="#d7dbe0" stroke-width="1.2"/>
<text x="195.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">база P(1)  +</tspan><tspan x="195.0" dy="17.2">крок P(k) ⟹ P(k+1)</tspan><tspan x="195.0" dy="17.2">⟹ усі натуральні n</tspan></text>
<rect x="380.0" y="250.0" width="330.0" height="156.0" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="545.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">КОНТРПРИКЛАД</text>
<line x1="400.0" y1="292.0" x2="690.0" y2="292.0" stroke="#d7dbe0" stroke-width="1.2"/>
<text x="545.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">щоб СПРОСТУВАТИ</tspan><tspan x="545.0" dy="17.2">«для всіх n» —</tspan><tspan x="545.0" dy="17.2">досить ОДНОГО винятку</tspan></text>
<rect x="730.0" y="250.0" width="330.0" height="156.0" rx="10" fill="#f9fafb" stroke="#6b7280" stroke-width="1.4"/>
<text x="895.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">ГОЛОВНА НЕСИМЕТРІЯ</text>
<line x1="750.0" y1="292.0" x2="1040.0" y2="292.0" stroke="#d7dbe0" stroke-width="1.2"/>
<text x="895.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">«для всіх» важко</tspan><tspan x="895.0" dy="17.2">довести, але легко</tspan><tspan x="895.0" dy="17.2">повалити — єдиний</tspan><tspan x="895.0" dy="17.2">виняток убиває все</tspan></text>
</svg>