<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 566" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="566" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">√2 не є дробом — доведення від супротивного</text>
<text x="380.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">припущення чесно веде до прямої суперечності з самим собою</text>
<rect x="110.0" y="80.0" width="540.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.9"/><text x="380.0" y="107.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Припустимо:  √2 = p/q,  дріб НЕСКОРОТНИЙ</tspan></text>
<rect x="110.0" y="156.0" width="540.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="380.0" y="183.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">2 = p²/q²   ⟹   p² = 2q²   ⟹   p² парне</tspan></text>
<rect x="110.0" y="232.0" width="540.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="380.0" y="259.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">p² парне  ⟹  p парне  ⟹  p = 2m</tspan></text>
<rect x="110.0" y="308.0" width="540.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="380.0" y="335.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">4m² = 2q²   ⟹   q² = 2m²   ⟹   q парне</tspan></text>
<rect x="110.0" y="384.0" width="540.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.4"/><text x="380.0" y="411.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">отже p і q ОБИДВА парні → спільний дільник 2</tspan></text>
<line x1="380.0" y1="130.0" x2="380.0" y2="152.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="380.0" y1="206.0" x2="380.0" y2="228.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="380.0" y1="282.0" x2="380.0" y2="304.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="380.0" y1="358.0" x2="380.0" y2="380.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="380.0" y1="436.0" x2="380.0" y2="468.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="100.0" y="470.0" width="560.0" height="70.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="380.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">СУПЕРЕЧНІСТЬ: дріб і нескоротний, і скоротний</text>
<text x="380.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-style="italic">⟹ припущення хибне  ⟹  √2 нераціональне</text>
</svg>