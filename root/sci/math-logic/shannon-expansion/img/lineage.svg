<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід формули: хто написав, хто передав, хто дав ім'я</text>
<line x1="275.0" y1="144.0" x2="275.0" y2="178.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="275.0" y1="264.0" x2="275.0" y2="298.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="275.0" y1="384.0" x2="275.0" y2="418.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="64.0" width="430.0" height="80.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="99.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">1847 · Буль, «Математичний аналіз логіки»</tspan><tspan x="275.0" dy="18.2">φ(x) = φ(1)·x + φ(0)·(1−x)</tspan></text>
<text x="540.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="540.0" dy="0.0">вивід — через степеневий ряд:</tspan><tspan x="540.0" dy="16.9">Маклорен, а тоді xⁿ = x</tspan></text>
<rect x="60.0" y="184.0" width="430.0" height="80.0" rx="6" fill="#eef4ff" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="219.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">1854 · Буль, «Закони думки», Твердження II</tspan><tspan x="275.0" dy="18.2">«розвинути функцію від логічних символів»</tspan></text>
<text x="540.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="540.0" dy="0.0">та сама тотожність; далі — «складники»</tspan><tspan x="540.0" dy="16.9">й розвиток до 2ⁿ доданків</tspan></text>
<rect x="60.0" y="304.0" width="430.0" height="80.0" rx="6" fill="#eef1f5" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="339.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">1905 · Кутюра, «Алгебра логіки», §24</tspan><tspan x="275.0" dy="18.2">«Закон розвитку»: f(x) = f(1)·x + f(0)·x′</tspan></text>
<text x="540.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="540.0" dy="0.0">сучасний запис: x′ замість (1−x);</tspan><tspan x="540.0" dy="16.9">саме цю книжку цитуватиме Шеннон</tspan></text>
<rect x="60.0" y="424.0" width="430.0" height="80.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="459.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">1949 · Шеннон, «Синтез двополюсних схем», с. 62</tspan><tspan x="275.0" dy="18.2">f(X₁,…) = X₁·f(1,…) + X₁′·f(0,…)</tspan></text>
<text x="540.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start"><tspan x="540.0" dy="0.0">подає як відому загальну теорему;</tspan><tspan x="540.0" dy="16.9">джерело [2] — Кутюра, Буля названо в тексті</tspan></text>
<line x1="210.0" y1="536.0" x2="210.0" y2="508.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="536.0" width="300.0" height="56.0" rx="6" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="568.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">1950-ті → «розкладання Шеннона»</tspan></text>
<text x="380.0" y="556.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">ім'я чіпляється сюди —</text>
<text x="380.0" y="578.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start">через 95 років після «Законів думки»</text>
</svg>