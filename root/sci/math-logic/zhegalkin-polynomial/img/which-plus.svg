<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Яку дію взяти за «плюс»?</text>
<text x="175.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">Буль · «+»</text>
<rect x="49.0" y="124.0" width="252.0" height="176.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="173.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">x + x = ?</tspan><tspan x="175.0" dy="22.1"></tspan><tspan x="175.0" dy="22.1">не визначено —</tspan><tspan x="175.0" dy="22.1">лише роз'єднані</tspan><tspan x="175.0" dy="22.1">класи</tspan></text>
<text x="480.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">Джевонс, Пірс · «∨»</text>
<rect x="354.0" y="124.0" width="252.0" height="176.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="173.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">x ∨ x = x</tspan><tspan x="480.0" dy="22.1"></tspan><tspan x="480.0" dy="22.1">ідемпотентно:</tspan><tspan x="480.0" dy="22.1">це вже НЕ</tspan><tspan x="480.0" dy="22.1">арифметика</tspan></text>
<text x="785.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="700">Жегалкін · «⊕»</text>
<rect x="659.0" y="124.0" width="252.0" height="176.0" rx="6" fill="#f3eefb" stroke="#7c3aed" stroke-width="1.5"/><text x="785.0" y="173.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">x ⊕ x = 0</tspan><tspan x="785.0" dy="22.1"></tspan><tspan x="785.0" dy="22.1">додавання мод 2 —</tspan><tspan x="785.0" dy="22.1">справжня</tspan><tspan x="785.0" dy="22.1">арифметика</tspan></text>
<text x="480.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Лише ⊕ підкоряється арифметиці (1 ⊕ 1 = 0) — тому з нього виходить єдиний канонічний многочлен.</text>
</svg>