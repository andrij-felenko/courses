<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві незалежні дороги до однієї форми</text>
<text x="285.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">гілка логіки: Європа → Москва</text>
<text x="720.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">гілка кодування: США</text>
<rect x="80.0" y="94.0" width="410.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="285.0" y="129.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Джордж Буль · 1854</tspan><tspan x="285.0" dy="19.5">«+» лише для роз'єднаних класів</tspan></text>
<rect x="80.0" y="206.0" width="410.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="285.0" y="241.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Джевонс (1864), Пірс (1867)</tspan><tspan x="285.0" dy="18.2">«або» інклюзивне: x ∨ x = x — арифметику втрачено</tspan></text>
<rect x="80.0" y="318.0" width="410.0" height="80.0" rx="6" fill="#f3eefb" stroke="#7c3aed" stroke-width="1.5"/><text x="285.0" y="353.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">Іван Жегалкін · 1927–28</tspan><tspan x="285.0" dy="19.5">⊕ як «+»: x ⊕ x = 0 · логіка = арифметика в ℤ₂</tspan></text>
<line x1="285.0" y1="176.0" x2="285.0" y2="204.0" stroke="#b9a7e6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="285.0" y1="288.0" x2="285.0" y2="316.0" stroke="#b9a7e6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="525.0" y="152.0" width="390.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="187.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Девід Маллер · 1954</tspan><tspan x="720.0" dy="19.5">булева алгебра для схем + виявлення похибок</tspan></text>
<rect x="525.0" y="272.0" width="390.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="307.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">Ірвінг Рід · 1954</tspan><tspan x="720.0" dy="19.5">схема декодування → коди Ріда–Маллера</tspan></text>
<line x1="720.0" y1="234.0" x2="720.0" y2="270.0" stroke="#b9a7e6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="500.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-style="italic">незалежно, ≈ чверть століття потому</text>
<line x1="285.0" y1="400.0" x2="405.0" y2="488.0" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="720.0" y1="354.0" x2="605.0" y2="488.0" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="95.0" y="486.0" width="810.0" height="76.0" rx="6" fill="#f3eefb" stroke="#7c3aed" stroke-width="1.5"/><text x="500.0" y="520.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">та сама форма, три імені:</tspan><tspan x="500.0" dy="16.9">поліном Жегалкіна  =  ANF (алгебрична нормальна форма)  =  PPRM (додатно-полярне Рід–Маллер)</tspan></text>
</svg>