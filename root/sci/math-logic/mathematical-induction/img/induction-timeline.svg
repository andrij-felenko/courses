<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 896" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="896" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Не один винахід, а п'ять різних здобутків</text>
<text x="540.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">«хто винайшов індукцію» — питання, що склеїло докупи кілька окремих досягнень; ось вони нарізно</text>
<line x1="250.0" y1="714.0" x2="250.0" y2="828.0" stroke="#27ae60" stroke-width="1.6"/>
<line x1="250.0" y1="500.0" x2="250.0" y2="656.0" stroke="#b06a12" stroke-width="1.6"/>
<line x1="250.0" y1="286.0" x2="250.0" y2="442.0" stroke="#2457d6" stroke-width="1.6"/>
<line x1="250.0" y1="114.0" x2="250.0" y2="228.0" stroke="#6b7280" stroke-width="1.6"/>
<rect x="30.0" y="78.0" width="1020.0" height="30.0" rx="7" fill="#eef2f7" stroke="#6b7280" stroke-width="1.4"/>
<text x="46.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">КОРИСТУЮТЬСЯ — НЕ НАЗИВАЮЧИ</text>
<text x="46.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">бл. 300 до н.е.</text>
<circle cx="250.0" cy="129.0" r="5.5" fill="#eef2f7" stroke="#6b7280" stroke-width="2.2"/>
<text x="272.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Евклід</text>
<text x="560.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">нескінченність обходить словами: «простих більше за будь-яку кількість»</text>
<text x="46.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">бл. 1000</text>
<circle cx="250.0" cy="171.0" r="5.5" fill="#eef2f7" stroke="#6b7280" stroke-width="2.2"/>
<text x="272.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">аль-Караджі, Багдад</text>
<text x="560.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">перший відомий доказ із базою й переходом — але сходами ВНИЗ від 10</text>
<text x="46.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">бл. 1150</text>
<circle cx="250.0" cy="213.0" r="5.5" fill="#eef2f7" stroke="#6b7280" stroke-width="2.2"/>
<text x="272.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">аль-Самавʼаль</text>
<text x="560.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">переписує аль-Караджі: єдине джерело, що вціліло — оригінал утрачено</text>
<rect x="30.0" y="250.0" width="1020.0" height="30.0" rx="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/>
<text x="46.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">УСВІДОМЛЮЮТЬ І ФОРМУЛЮЮТЬ</text>
<text x="46.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">1321</text>
<circle cx="250.0" cy="301.0" r="5.5" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/>
<text x="272.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Леві бен Ґершон, Прованс</text>
<text x="560.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">дає прийомові ім'я: «підіймання сходинка за сходинкою», іврит</text>
<text x="46.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">бл. 1557, друк 1575</text>
<circle cx="250.0" cy="343.0" r="5.5" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/>
<text x="272.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Франческо Мауроліко, Мессіна</text>
<text x="560.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">сума непарних = n² у європейському друці — першість оскаржена</text>
<text x="46.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">1654, друк 1665</text>
<circle cx="250.0" cy="385.0" r="5.5" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/>
<text x="272.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Блез Паскаль, Париж</text>
<text x="560.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">СХЕМУ вголос: дві леми, «…і так до нескінченності»</text>
<text x="46.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">1659</text>
<circle cx="250.0" cy="427.0" r="5.5" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/>
<text x="272.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">П'єр Ферма</text>
<text x="560.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">те саме доміно, тільки вниз: «нескінченний спуск»</text>
<rect x="30.0" y="464.0" width="1020.0" height="30.0" rx="7" fill="#fdf3e7" stroke="#b06a12" stroke-width="1.4"/>
<text x="46.0" y="484.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b06a12" text-anchor="start" font-weight="700">СПЕРЕЧАЮТЬСЯ ЗА ІМ'Я</text>
<text x="46.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">1656</text>
<circle cx="250.0" cy="515.0" r="5.5" fill="#fdf3e7" stroke="#b06a12" stroke-width="2.2"/>
<text x="272.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Джон Волліс</text>
<text x="560.0" y="520.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">пускає в обіг слово «індукція» — але для геть іншого прийому: того, що вгадує</text>
<text x="46.0" y="562.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">1686</text>
<circle cx="250.0" cy="557.0" r="5.5" fill="#fdf3e7" stroke="#b06a12" stroke-width="2.2"/>
<text x="272.0" y="562.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Якоб Бернуллі</text>
<text x="560.0" y="562.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">показує, що Воллісове міркування не доводить, і ставить перехід n → n+1</text>
<text x="46.0" y="604.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">1830</text>
<circle cx="250.0" cy="599.0" r="5.5" fill="#fdf3e7" stroke="#b06a12" stroke-width="2.2"/>
<text x="272.0" y="604.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Джордж Пікок</text>
<text x="560.0" y="604.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">«демонстративна індукція» — назва, що не прижилася</text>
<text x="46.0" y="646.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">1838</text>
<circle cx="250.0" cy="641.0" r="5.5" fill="#fdf3e7" stroke="#b06a12" stroke-width="2.2"/>
<text x="272.0" y="646.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Оґастес Де Морґан</text>
<text x="560.0" y="646.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">«математична індукція» — мимохідь, у кінці статті популярної енциклопедії</text>
<rect x="30.0" y="678.0" width="1020.0" height="30.0" rx="7" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.4"/>
<text x="46.0" y="698.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">ПИТАЮТЬ: А ЧОМУ ЦЕ ВЗАГАЛІ ЗАКОННО?</text>
<text x="46.0" y="734.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">1888</text>
<circle cx="250.0" cy="729.0" r="5.5" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.2"/>
<text x="272.0" y="734.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Ріхард Дедекінд</text>
<text x="560.0" y="734.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">ДОВОДИТЬ індукцію — з означення того, чим є натуральні числа</text>
<text x="46.0" y="776.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">1889</text>
<circle cx="250.0" cy="771.0" r="5.5" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.2"/>
<text x="272.0" y="776.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Джузеппе Пеано</text>
<text x="560.0" y="776.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">БЕРЕ індукцію за аксіому — і саме його ім'я лишається на списку</text>
<text x="46.0" y="818.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">1894</text>
<circle cx="250.0" cy="813.0" r="5.5" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.2"/>
<text x="272.0" y="818.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Анрі Пуанкаре</text>
<text x="560.0" y="818.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">а може, це і є математичне мислення, яке нізвідки не виводиться?</text>
<rect x="30.0" y="846.0" width="1020.0" height="40.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.2"/><text x="540.0" y="869.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="8" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Між першим ужитком і першим формулюванням — вісімсот років. Не через тупість: бракувало алгебри, щоб записати твердження про безіменне n, і згоди, що скінченний доказ дає нескінченний висновок.</tspan></text>
</svg>