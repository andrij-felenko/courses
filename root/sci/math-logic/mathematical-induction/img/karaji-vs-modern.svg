<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чого бракувало доказові аль-Караджі</text>
<text x="500.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">обидві частини — база й перехід — уже на місці; немає ЗАГАЛЬНОСТІ: теорема сказана про число 10, а не про n</text>
<rect x="40.0" y="80.0" width="430.0" height="344.0" rx="10" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.5"/>
<rect x="530.0" y="80.0" width="430.0" height="344.0" rx="10" fill="#fbfcfd" stroke="#27ae60" stroke-width="1.5"/>
<text x="255.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle" font-weight="700">бл. 1000 — сходами ВНИЗ від десятки</text>
<text x="745.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">сучасна схема — одна обіцянка про безіменне k</text>
<text x="255.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-style="italic">позначмо  S(n) = 1 + 2 + … + n</text>
<rect x="114.0" y="156.0" width="322.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.2"/>
<text x="275.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">S(10)²  =  S(9)²  +  10³</text>
<rect x="114.0" y="196.0" width="322.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.2"/>
<text x="275.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">S(9)²   =  S(8)²  +  9³</text>
<rect x="114.0" y="236.0" width="322.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.2"/>
<text x="275.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">S(8)²   =  S(7)²  +  8³</text>
<rect x="114.0" y="276.0" width="322.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#d7dbe0" stroke-width="1.2"/>
<text x="275.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">⋮</text>
<rect x="114.0" y="316.0" width="322.0" height="32.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="275.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">S(1)²   =  1³      ✓</text>
<line x1="88.0" y1="162.0" x2="88.0" y2="342.0" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="70" y="246" font-size="11.5" fill="#6b7280" font-style="italic" text-anchor="middle" transform="rotate(-90 70 246)">спуск від 10 до 1</text>
<rect x="554.0" y="156.0" width="382.0" height="32.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="570.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">База</text>
<text x="660.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">P(1)  —  правда</text>
<rect x="554.0" y="196.0" width="382.0" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="570.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Крок</text>
<text x="660.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">P(k)  ⟹  P(k+1)   для БУДЬ-ЯКОГО k</text>
<line x1="745.0" y1="240.0" x2="745.0" y2="264.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="554.0" y="276.0" width="382.0" height="32.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="570.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Висновок</text>
<text x="660.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">P(n)  для всіх n  одразу</text>
<rect x="40.0" y="438.0" width="430.0" height="56.0" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-width="1.2"/><text x="255.0" y="462.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">База й перехід є. Але теорема сказана про 10:</tspan><tspan x="255.0" dy="16.2">для 11 усе доводиться наново.</tspan></text>
<rect x="530.0" y="438.0" width="430.0" height="56.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.2"/><text x="745.0" y="462.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="745.0" dy="0.0">k не має номера — тому одне міркування</tspan><tspan x="745.0" dy="16.2">накриває всю нескінченну шкалу відразу.</tspan></text>
<text x="500.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Різниця не в кмітливості, а в мові: щоб сказати «для будь-якого k», потрібна алгебра, якої в Багдаді ще не було.</text>
</svg>