<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="820.0" height="360.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="420.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Теорема Тенненбаума: Необчислюваність нестандартної арифметики</text>
<rect x="71.8" y="94.0" width="276.5" height="82.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="210.0" y="112.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Рекурсивно невідокремлювані множини</tspan><tspan x="210.0" dy="13.0"></tspan><tspan x="210.0" dy="13.0">A, B ⊂ ℕ — рекурсивно перелічувані, A ∩ B = ∅</tspan><tspan x="210.0" dy="13.0">Не існує обчислювальної множини C,</tspan><tspan x="210.0" dy="13.0">такої що A ⊆ C та B ∩ C = ∅</tspan></text>
<rect x="511.7" y="94.0" width="236.6" height="82.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="630.0" y="112.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">Кодування в нестандартне число H</tspan><tspan x="630.0" dy="13.0"></tspan><tspan x="630.0" dy="13.0">Кодувальний елемент H ∈ M \ ℕ:</tspan><tspan x="630.0" dy="13.0">∀i ∈ ℕ: (p_i | H ⟺ i ∈ A)</tspan><tspan x="630.0" dy="13.0">Кодує нескінченну інформацію множини A</tspan></text>
<line x1="380.0" y1="135.0" x2="460.0" y2="135.0" stroke="#64748b" stroke-width="2.0"/>
<rect x="137.2" y="239.0" width="565.6" height="82.0" rx="6" fill="#fff6e5" stroke="#d97706" stroke-width="1.5"/><text x="420.0" y="257.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Неможливість обчислюваності операцій +_M та ·_M</tspan><tspan x="420.0" dy="13.0"></tspan><tspan x="420.0" dy="13.0">Якби операції +_M або ·_M були обчислюваними над стандартними кодами,</tspan><tspan x="420.0" dy="13.0">то висловлювання (p_i | H) було б алгоритмічно розв'язним для кожного i ∈ ℕ.</tspan><tspan x="420.0" dy="13.0">Це дало б обчислювальний сепаратор C для A і B, що СУПЕРЕЧИТЬ їхній невідокремлюваності!</tspan></text>
</svg>