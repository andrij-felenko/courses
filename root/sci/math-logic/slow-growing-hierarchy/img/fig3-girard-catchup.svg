<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="420.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Теорема збігу Жірара: колапс незліченних ординалів та стрибок росту G_α</text>
<rect x="30.0" y="60.0" width="380.0" height="150.0" rx="8" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/>
<text x="220.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">Швидка ієрархія F_α на малих ординалах</text>
<text x="220.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">• F₀(n) = n + 1 (інкремент)</text>
<text x="220.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">• F₁(n) = 2n, F₂(n) = n·2ⁿ</text>
<text x="220.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7e22ce" text-anchor="middle" font-weight="700">• F_ω(n) — рівень Аккермана; F_{ε₀}(n) — межа PA</text>
<text x="220.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Агресивна ітерація F_{α+1}(n) = F_αⁿ(n)</text>
<rect x="470.0" y="60.0" width="380.0" height="150.0" rx="8" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/>
<text x="660.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e08a1e" text-anchor="middle" font-weight="700">Повільна ієрархія G_α на малих ординалах</text>
<text x="660.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">• G_k(n) = k (константа)</text>
<text x="660.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">• G_{ω^k}(n) = n^k (поліноми)</text>
<text x="660.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">• G_{ε₀}(n) = n ↑↑ n (лише рівень F₃!)</text>
<text x="660.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Мінімальний крок G_{α+1}(n) = G_α(n) + 1</text>
<rect x="150.0" y="240.0" width="580.0" height="170.0" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
<text x="440.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7e22ce" text-anchor="middle" font-weight="700">Міст колапсу Жірара (Bachmann-Howard / Buchholz ψ)</text>
<text x="440.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Колапсна функція перетворює незліченний кардинал Ω у зліченний ординал ψ(Ω)</text>
<text x="440.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">Фундаментальна послідовність: ψ(Ω)[n] = ψ(n) породжує рекурсивну діагоналізацію</text>
<line x1="220.0" y1="215.0" x2="300.0" y2="238.0" stroke="#2563eb" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="660.0" y1="215.0" x2="580.0" y2="238.0" stroke="#e08a1e" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="288.6" y="349.0" width="302.7" height="32.0" rx="6" fill="#ffffff" stroke="#7e22ce" stroke-width="1.5"/><text x="440.0" y="369.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Точка збігу: G_{ψ(Ω^ω)}(n) ≈ F_{ε₀}(n)</tspan></text>
</svg>