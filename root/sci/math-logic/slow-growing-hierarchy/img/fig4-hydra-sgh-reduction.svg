<text x="470.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start">• Кожен крок битви зменшує ординал дерева: α ↦ α[n]</text>
<text x="470.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start">• Приріст копій обмежений фактором реплікації n</text>
<text x="470.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start">• G_α(n) точно вимірює максимальну довжину гри:</text>
<text x="470.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start">    Steps(T_α, n) ≤ G_α(n + c)</text>
<text x="470.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start">• Для звичайних гідр Кірбі-Паріса: довжина ~ F_{ε₀}(n)</text>
<text x="470.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start">• Для гідр Бухгольца з колапсом: довжина ~ G_{ψ(Ω^ω)}(n)</text>
