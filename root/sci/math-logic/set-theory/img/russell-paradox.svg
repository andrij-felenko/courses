<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Парадокс Рассела: правило, що вбиває себе</text>
<text x="470.0" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">R = { x : x ∉ x } — множина всіх множин, які не містять себе</text>
<rect x="282.1" y="83.0" width="375.9" height="34.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="104.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">R = усі множини, що НЕ містять себе самих</tspan></text>
<rect x="78.0" y="158.0" width="360.0" height="148.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="1.7"/><rect x="78.0" y="158.0" width="360.0" height="34.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><rect x="78.0" y="180.0" width="360.0" height="12.0" rx="6" fill="#eaf0fd" stroke="none" stroke-width="0.0"/><text x="258.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Припустимо   R ∈ R</text><text x="258.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">R містить себе,</text><text x="258.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">отже R не «звичайна»,</text><text x="258.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">а R бере лише звичайні —</text><text x="258.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">тож  R ∉ R</text>
<rect x="502.0" y="158.0" width="360.0" height="148.0" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.7"/><rect x="502.0" y="158.0" width="360.0" height="34.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/><rect x="502.0" y="180.0" width="360.0" height="12.0" rx="6" fill="#fdecea" stroke="none" stroke-width="0.0"/><text x="682.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Припустимо   R ∉ R</text><text x="682.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">R не містить себе,</text><text x="682.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">отже R «звичайна»,</text><text x="682.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">а всі звичайні беруть у R —</text><text x="682.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">тож  R ∈ R</text>
<line x1="380.0" y1="118.0" x2="318.0" y2="156.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="560.0" y1="118.0" x2="622.0" y2="156.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="440.0" y1="232.0" x2="500.0" y2="232.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="500.0" y1="246.0" x2="440.0" y2="246.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="470.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#c0392b" text-anchor="middle" font-weight="700">⟺</text>
<rect x="242.4" y="346.5" width="455.2" height="51.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="470.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">R ∈ R  ⟺  R ∉ R  — суперечність: множини R не існує.</tspan><tspan x="470.0" dy="17.6">Отже не будь-яка властивість задає множину.</tspan></text>
</svg>