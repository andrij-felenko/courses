<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1020 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1020" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="505.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Числа з порожнечі: ординали фон Неймана</text>
<text x="505.0" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">0 = ∅,  а далі кожне число — множина всіх попередніх:  n+1 = n ∪ {n}</text>
<rect x="66.0" y="112.0" width="566.0" height="46.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="100.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#2457d6" text-anchor="middle" font-weight="700">0</text>
<text x="140.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start">= ∅</text>
<text x="616.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-style="italic">нуль елементів</text>
<rect x="66.0" y="172.0" width="566.0" height="46.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="100.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<text x="140.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start">= {0} = {∅}</text>
<text x="616.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-style="italic">один елемент</text>
<rect x="66.0" y="232.0" width="566.0" height="46.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="100.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#2457d6" text-anchor="middle" font-weight="700">2</text>
<text x="140.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start">= {0, 1} = {∅, {∅}}</text>
<text x="616.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-style="italic">два елементи</text>
<rect x="66.0" y="292.0" width="566.0" height="46.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="100.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="21" fill="#2457d6" text-anchor="middle" font-weight="700">3</text>
<text x="140.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start">= {0, 1, 2}</text>
<text x="616.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-style="italic">три елементи</text>
<rect x="675.0" y="123.3" width="250.0" height="53.4" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.7"/><text x="800.0" y="145.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">n має рівно</tspan><tspan x="800.0" dy="18.9">n елементів</tspan></text>
<text x="800.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">число саме собі — лічба</text>
<rect x="675.0" y="250.5" width="250.0" height="35.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.7"/><text x="800.0" y="273.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="800.0" dy="0.0">m &lt; n   ⇔   m ∈ n</tspan></text>
<text x="800.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">порядок — це належність</text>
<rect x="145.0" y="403.2" width="720.0" height="33.5" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="505.0" y="424.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="505.0" dy="0.0">0 ∈ 1 ∈ 2 ∈ 3 ∈ …   —   уся драбина «менше» вкладена в знак ∈</tspan></text>
</svg>