<text x="770.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два записи — одна множина</text>
<rect x="645.0" y="132.0" width="250.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="770.0" y="155.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">{ 2, 3, 5, 7 }</tspan></text>
