<rect x="644.6" y="206.5" width="250.8" height="35.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="770.0" y="229.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">{ x : x — просте,  x &lt; 10 }</tspan></text>
