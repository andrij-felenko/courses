<text x="210.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">3 ∈ A  —  трійка належить A</text>
<circle cx="372.0" cy="150.0" r="17.0" fill="#ffffff" stroke="#6b7280" stroke-width="1.8"/><text x="372.0" y="155.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="700">4</text>
