<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нуль чи одиниця — дві традиції, не дві істини</text>
<text x="450.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">структура чисел та сама; різниться лише те, як назвати перше</text>
<rect x="40.0" y="84.0" width="390.0" height="210.0" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<rect x="40.0" y="84.0" width="390.0" height="42.0" rx="10" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/>
<rect x="40.0" y="114.0" width="390.0" height="12.0" rx="6" fill="#eaf7ef" stroke="none" stroke-width="0.0"/>
<text x="235.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Починають з 0</text>
<text x="60.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">· логіка, теорія множин, інформатика</text>
<text x="60.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">· фон Нейман: 0 = ∅ (порожня множина)</text>
<text x="60.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">· Бурбакі й стандарт ISO 80000-2</text>
<text x="60.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">· індекси масивів, залишки, зміщення</text>
<rect x="470.0" y="84.0" width="390.0" height="210.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<rect x="470.0" y="84.0" width="390.0" height="42.0" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<rect x="470.0" y="114.0" width="390.0" height="12.0" rx="6" fill="#eaf0fd" stroke="none" stroke-width="0.0"/>
<text x="665.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Починають з 1</text>
<text x="490.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">· теорія чисел, шкільна традиція</text>
<text x="490.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">· лічба «один, два, три…»</text>
<text x="490.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">· Пеано, «Arithmetices principia» (1889)</text>
<text x="490.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">· натуральне = «додатне ціле»</text>
<rect x="118.8" y="325.0" width="662.3" height="34.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="450.0" y="346.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Це не суперечка про істину, а вибір відправної точки — структура однакова.</tspan></text>
</svg>