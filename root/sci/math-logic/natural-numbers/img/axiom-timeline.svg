<line x1="158.0" y1="402.0" x2="205.0" y2="402.0" stroke="#cfd4da" stroke-width="1.6"/>
<rect x="205.0" y="364.0" width="690.0" height="76.0" rx="9" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="227.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Джузеппе Пеано · Італія</text>
<text x="227.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">«Arithmetices principia»: чіткий список і логічна нотація; почав з 1, визнав борг Дедекінду</text>
<text x="92.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#6b7280" text-anchor="middle" font-weight="700">1898</text>
<circle cx="150.0" cy="496.0" r="8.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.2"/>
<line x1="158.0" y1="496.0" x2="205.0" y2="496.0" stroke="#cfd4da" stroke-width="1.6"/>
<rect x="205.0" y="458.0" width="690.0" height="76.0" rx="9" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/>
<text x="227.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Пеано · «Formulaire»</text>
<text x="227.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">перше число тепер 0 — звідси й досі розкол «нуль чи одиниця»</text>
