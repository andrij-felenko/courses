<line x1="158.0" y1="120.0" x2="205.0" y2="120.0" stroke="#cfd4da" stroke-width="1.6"/>
<rect x="205.0" y="82.0" width="690.0" height="76.0" rx="9" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/>
<text x="227.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Герман Ґрассман · Німеччина</text>
<text x="227.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">«Lehrbuch der Arithmetik»: + і × рекурсивно через наступника, закони — індукцією</text>
<text x="92.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#6b7280" text-anchor="middle" font-weight="700">1881</text>
<circle cx="150.0" cy="214.0" r="8.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.2"/>
<line x1="158.0" y1="214.0" x2="205.0" y2="214.0" stroke="#cfd4da" stroke-width="1.6"/>
<rect x="205.0" y="176.0" width="690.0" height="76.0" rx="9" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/>
<text x="227.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Чарлз Сандерс Пірс · США</text>
<text x="227.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">«On the Logic of Number»: перша повна система аксіом — і роками нею ніхто не переймався</text>
<text x="92.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2457d6" text-anchor="middle" font-weight="700">1888</text>
<circle cx="150.0" cy="308.0" r="8.0" fill="#2457d6" stroke="#2457d6" stroke-width="2.2"/>
<line x1="158.0" y1="308.0" x2="205.0" y2="308.0" stroke="#cfd4da" stroke-width="1.6"/>
<rect x="205.0" y="270.0" width="690.0" height="76.0" rx="9" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="227.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Ріхард Дедекінд · Німеччина</text>
<text x="227.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">«Was sind und was sollen die Zahlen?»: ланцюг і категоричність — усі моделі однакові</text>
<text x="92.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2457d6" text-anchor="middle" font-weight="700">1889</text>
