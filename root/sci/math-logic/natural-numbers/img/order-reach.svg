<text x="490.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">c = 4 кроки</text>
<line x1="300.0" y1="137.0" x2="300.0" y2="161.0" stroke="#27ae60" stroke-width="1.3" stroke-dasharray="3,3"/>
<line x1="680.0" y1="137.0" x2="680.0" y2="161.0" stroke="#27ae60" stroke-width="1.3" stroke-dasharray="3,3"/>
<rect x="267.9" y="250.5" width="364.1" height="35.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="273.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">a + c = b   :   2 + 4 = 6   →   a ≤ b</tspan></text>
<line x1="70.0" y1="312.0" x2="830.0" y2="312.0" stroke="#dcdfe4" stroke-width="1.2"/>
<text x="450.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">І будь-яка пара чисел порівнянна — порядок лінійний</text>
<rect x="249.3" y="362.5" width="401.3" height="35.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="450.0" y="385.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">для будь-яких a, b:   a ≤ b   або   b ≤ a</tspan></text>
<text x="450.0" y="411.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">(жодної непорівнянної пари; доводиться індукцією за b)</text>
</svg>