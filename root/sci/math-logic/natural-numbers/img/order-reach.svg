<circle cx="300.0" cy="185.0" r="23.0" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/><text x="300.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#27ae60" text-anchor="middle" font-weight="700">2</text>
