<circle cx="490.0" cy="185.0" r="21.0" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="490.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">4</text>
<circle cx="585.0" cy="185.0" r="21.0" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="585.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">5</text>
<circle cx="680.0" cy="185.0" r="23.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="680.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#2457d6" text-anchor="middle" font-weight="700">6</text>
<circle cx="775.0" cy="185.0" r="21.0" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="775.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">7</text>
<text x="300.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">a</text>
<text x="680.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">b</text>
