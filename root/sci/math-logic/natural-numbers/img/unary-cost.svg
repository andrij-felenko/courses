<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="384" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ціна унарного запису: ланцюг комірок проти жмені бітів</text>
<text x="450.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">число n у типі Пеано — це n вкладених Succ; те саме число двійкою — лише ⌈log₂n⌉ бітів</text>
<text x="450.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Унарно (тип Пеано): щоб записати 5, потрібно 5 комірок Succ</text>
<rect x="253.0" y="111.0" width="58.0" height="34.0" rx="7" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="282.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">S</text>
<line x1="315.0" y1="128.0" x2="333.0" y2="128.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="337.0" y="111.0" width="58.0" height="34.0" rx="7" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="366.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">S</text>
<line x1="399.0" y1="128.0" x2="417.0" y2="128.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="421.0" y="111.0" width="58.0" height="34.0" rx="7" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="450.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">S</text>
<line x1="483.0" y1="128.0" x2="501.0" y2="128.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="505.0" y="111.0" width="58.0" height="34.0" rx="7" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="534.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="700">S</text>
<line x1="567.0" y1="128.0" x2="585.0" y2="128.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="589.0" y="111.0" width="58.0" height="34.0" rx="7" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="618.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700">Z</text>
<text x="450.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">S(S(S(S(S(Z)))))  =  5     ·     n комірок у купі на число n     ·     O(n) пам'яті</text>
<line x1="70.0" y1="200.0" x2="830.0" y2="200.0" stroke="#dcdfe4" stroke-width="1.2"/>
<text x="450.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двійково (позиційний запис): те саме 5 — це три біти</text>
<rect x="369.0" y="251.0" width="46.0" height="34.0" rx="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="392.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<text x="392.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">×4</text>
<rect x="427.0" y="251.0" width="46.0" height="34.0" rx="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="450.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">0</text>
<text x="450.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">×2</text>
<rect x="485.0" y="251.0" width="46.0" height="34.0" rx="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="508.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#2457d6" text-anchor="middle" font-weight="700">1</text>
<text x="508.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">×1</text>
<text x="450.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">101₂ = 5     ·     ⌈log₂n⌉ біт на число n     ·     O(log n) пам'яті</text>
<rect x="182.1" y="343.5" width="535.8" height="33.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="364.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Зберегти 1 000 000: унарно — мільйон комірок; двійково — 20 біт.</tspan></text>
</svg>