<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дворівнева ієрархічна структура ДНФ та КНФ</text>
<rect x="25.0" y="45.0" width="380.0" height="295.0" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
<text x="215.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0369a1" text-anchor="middle" font-weight="700">Диз'юнктивна нормальна форма (ДНФ)</text>
<text x="215.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-style="italic">Або кон'юнктів (OR of ANDs): F = C₁ ∨ C₂ ∨ C₃</text>
<rect x="95.4" y="116.0" width="239.2" height="28.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="215.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">Верхній рівень: Диз'юнкція (∨)</tspan></text>
<rect x="50.8" y="198.5" width="78.4" height="33.0" rx="6" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.0"/><text x="90.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="90.0" dy="0.0">C₁ = A ∧ B</tspan><tspan x="90.0" dy="13.0">(Кон'юнкт 1)</tspan></text>
<rect x="175.8" y="198.5" width="78.4" height="33.0" rx="6" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.0"/><text x="215.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">C₂ = ¬A ∧ C</tspan><tspan x="215.0" dy="13.0">(Кон'юнкт 2)</tspan></text>
<rect x="300.8" y="198.5" width="78.4" height="33.0" rx="6" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.0"/><text x="340.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">C₃ = B ∧ ¬C</tspan><tspan x="340.0" dy="13.0">(Кон'юнкт 3)</tspan></text>
<line x1="175.0" y1="145.0" x2="90.0" y2="195.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="215.0" y1="145.0" x2="215.0" y2="195.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="255.0" y1="145.0" x2="340.0" y2="195.0" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="215.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle" font-weight="700">Перевірка виконуваності (SAT): O(N)</text>
<text x="215.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Достатньо хоча б одного несуперечливого кон'юнкта</text>
<rect x="435.0" y="45.0" width="380.0" height="295.0" rx="8" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.5"/>
<text x="625.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#86198f" text-anchor="middle" font-weight="700">Кон'юнктивна нормальна форма (КНФ)</text>
<text x="625.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-style="italic">І диз'юнктів (AND of ORs): F = D₁ ∧ D₂ ∧ D₃</text>
<rect x="505.4" y="116.0" width="239.2" height="28.0" rx="6" fill="#fae8ff" stroke="#c026d3" stroke-width="1.2"/><text x="625.0" y="134.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">Верхній рівень: Кон'юнкція (∧)</tspan></text>
<rect x="460.8" y="198.5" width="78.4" height="33.0" rx="6" fill="#ffffff" stroke="#f0abfc" stroke-width="1.0"/><text x="500.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">D₁ = A ∨ B</tspan><tspan x="500.0" dy="13.0">(Диз'юнкт 1)</tspan></text>
<rect x="585.8" y="198.5" width="78.4" height="33.0" rx="6" fill="#ffffff" stroke="#f0abfc" stroke-width="1.0"/><text x="625.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="625.0" dy="0.0">D₂ = ¬A ∨ C</tspan><tspan x="625.0" dy="13.0">(Диз'юнкт 2)</tspan></text>
<rect x="710.8" y="198.5" width="78.4" height="33.0" rx="6" fill="#ffffff" stroke="#f0abfc" stroke-width="1.0"/><text x="750.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="750.0" dy="0.0">D₃ = B ∨ ¬C</tspan><tspan x="750.0" dy="13.0">(Диз'юнкт 3)</tspan></text>
<line x1="585.0" y1="145.0" x2="500.0" y2="195.0" stroke="#c026d3" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="625.0" y1="145.0" x2="625.0" y2="195.0" stroke="#c026d3" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="665.0" y1="145.0" x2="750.0" y2="195.0" stroke="#c026d3" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="625.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">Перевірка загальнозначущості (Tautology): O(N)</text>
<text x="625.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Кожен диз'юнкт має містити пару літералів (x ∨ ¬x)</text>
</svg>