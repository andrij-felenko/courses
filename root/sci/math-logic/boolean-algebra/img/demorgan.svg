<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Закон Де Моргана як теорема: ‾(a+b) = ā·b̄</text>
<text x="440.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">доповнення ЄДИНЕ — отже досить показати, що x = ā·b̄ грає роль доповнення до (a+b)</text>
<rect x="60.0" y="72.0" width="760.0" height="40.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<text x="440.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ключ: якщо для якогось x водночас  (a+b)+x = 1  і  (a+b)·x = 0,  то цей x — і є ‾(a+b).</text>
<text x="250.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Перевірка « = 1 »</text>
<text x="630.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Перевірка « = 0 »</text>
<line x1="440.0" y1="130.0" x2="440.0" y2="392.0" stroke="#e4e4e4" stroke-width="1.4"/>
<text x="250.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">(a+b) + ā·b̄</text>
<text x="630.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">(a+b) · ā·b̄</text>
<text x="250.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">= (a+b+ā)·(a+b+b̄)</text>
<text x="630.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">= a·ā·b̄ + b·ā·b̄</text>
<text x="250.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">    [дистрибутивність]</text>
<text x="630.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">    [дистрибутивність]</text>
<text x="250.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">= (1+b)·(a+1)</text>
<text x="630.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">= 0·b̄ + 0·ā</text>
<text x="250.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">    [a+ā=1, b+b̄=1]</text>
<text x="630.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">    [a·ā=0, b·b̄=0]</text>
<text x="250.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">= 1 · 1  =  1  ✓</text>
<text x="630.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">= 0 + 0  =  0  ✓</text>
<rect x="60.0" y="408.0" width="760.0" height="46.0" rx="10" fill="#f1f8f3" stroke="#27ae60" stroke-width="1.6"/>
<text x="440.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обидві рівності справдились → ā·b̄ і є ‾(a+b). Другий закон ‾(a·b)=ā+b̄ — задарма, двійником.</text>
</svg>