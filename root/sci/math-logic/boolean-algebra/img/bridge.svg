<text x="430.0" y="404.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">Папір Буля (1854) → кремній (сьогодні). Розділ 15 — це Буль, що ожив у залізі.</text>
