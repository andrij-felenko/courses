<svg xmlns="http://www.w3.org/2000/svg" width="880" height="770" viewBox="0 0 880 770">
<rect width="880" height="770" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
</defs>
<text x="440.0" y="38.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="21" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ланцюг питань: чи можна РАХУВАТИ міркування?</text>
<text x="440.0" y="60.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">від силогізмів до кремнієвого вентиля; сірим — постаті з власною історією деінде в курсі</text>
<line x1="250.0" y1="100.0" x2="250.0" y2="740.0" stroke="#8a8a8a" stroke-width="3" stroke-linecap="round"/>
<circle cx="250.0" cy="130.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="135.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">~350 до н.е.</text>
<text x="276.0" y="127.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Аристотель / Aristotle</text>
<text x="276.0" y="147.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Чи можна впорядкувати ПРАВИЛЬНЕ міркування? — силогізми</text>
<circle cx="250.0" cy="226.7" r="7.0" fill="#fff" stroke="#8a8a8a" stroke-width="2.6"/>
<text x="228.0" y="231.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">~1680</text>
<text x="276.0" y="223.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Лейбніц / Leibniz</text>
<text x="276.0" y="243.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">А чи можна його ОБЧИСЛИТИ, як числа? — мрія «calculus ratiocinator» (→ Розділ 17)</text>
<circle cx="250.0" cy="323.3" r="11.0" fill="#fff" stroke="#c0271e" stroke-width="0"/>
<circle cx="250.0" cy="323.3" r="10.0" fill="none" stroke="#c0271e" stroke-width="3.2"/>
<circle cx="250.0" cy="323.3" r="4.5" fill="#c0271e" stroke="#c0271e" stroke-width="1"/>
<text x="228.0" y="328.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1847·1854</text>
<text x="276.0" y="320.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#c0271e" text-anchor="start" font-weight="bold" font-style="normal">Буль / Boole</text>
<text x="276.0" y="340.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Логіка — це АЛГЕБРА з 0 і 1! — «Закони думки»</text>
<circle cx="250.0" cy="420.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="425.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1847</text>
<text x="276.0" y="417.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">Де Морган / De Morgan</text>
<text x="276.0" y="437.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Двоїстість: НЕ(і) = (не)АБО(не) — закони Де Моргана</text>
<circle cx="250.0" cy="516.7" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="521.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1850–1930</text>
<text x="276.0" y="513.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">«лише курйоз»</text>
<text x="276.0" y="533.7" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">Алгебра логіки — гарна, та без жодного застосування</text>
<circle cx="250.0" cy="613.3" r="7.0" fill="#fff" stroke="#8a8a8a" stroke-width="2.6"/>
<text x="228.0" y="618.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">1937</text>
<text x="276.0" y="610.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#8a8a8a" text-anchor="start" font-weight="bold" font-style="normal">Шеннон / Shannon</text>
<text x="276.0" y="630.3" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-style="italic">Реле — це і Є булева алгебра! — застосування знайдено (→ Розділ 14)</text>
<circle cx="250.0" cy="710.0" r="7.0" fill="#fff" stroke="#1b1b1b" stroke-width="2.6"/>
<text x="228.0" y="715.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="end" font-weight="bold" font-style="normal">тепер</text>
<text x="276.0" y="707.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" fill="#1b1b1b" text-anchor="start" font-weight="bold" font-style="normal">вентилі / logic gates</text>
<text x="276.0" y="727.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="italic">булеві операції, відлиті в кремній — цей розділ</text>
</svg>
