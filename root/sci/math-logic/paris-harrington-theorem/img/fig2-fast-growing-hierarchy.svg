<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="420.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Швидкозростаюча ієрархія F_α(x) та бар'єр довідності арифметики Пеано (ε₀)</text>
<rect x="30.0" y="70.0" width="400.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.2"/>
<text x="120.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">F₀(x) = x + 1</text>
<text x="290.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Примітивна інкрементація</text>
<rect x="30.0" y="130.0" width="400.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.2"/>
<text x="120.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">F₁(x) = 2x</text>
<text x="290.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Лінійне зростання</text>
<rect x="30.0" y="190.0" width="400.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.2"/>
<text x="120.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="700">F₂(x) = x · 2ⁿ</text>
<text x="290.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Поліноміальне/експоненціальне</text>
<rect x="30.0" y="250.0" width="400.0" height="46.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.2"/>
<text x="120.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e08a1e" text-anchor="middle" font-weight="700">F₃(x) = 2↑↑x</text>
<text x="290.0" y="277.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Вежа експонент (суперекспонента)</text>
<rect x="30.0" y="310.0" width="400.0" height="46.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.2"/>
<text x="120.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7e22ce" text-anchor="middle" font-weight="700">F_ω(x)</text>
<text x="290.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Функція Аккермана (поріг примітивної рекурсії)</text>
<line x1="460.0" y1="60.0" x2="460.0" y2="410.0" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4"/>
<text x="460.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#dc2626" text-anchor="middle" font-weight="700">Бар'єр довідності PA: F_α(x), α &lt; ε₀</text>
<rect x="490.0" y="140.0" width="360.0" height="110.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
<text x="670.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">Рівень ε₀ (Епсилон-нуль)</text>
<rect x="550.9" y="185.2" width="238.2" height="59.6" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="670.0" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">F_{ε₀}(x) = F_{ω^ω^...}(x)</tspan><tspan x="670.0" dy="14.3">Зростає швидше за БУДЬ-ЯКУ</tspan><tspan x="670.0" dy="14.3">довідно-рекурсивну функцію в PA!</tspan></text>
<rect x="490.0" y="280.0" width="360.0" height="110.0" rx="8" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.8"/>
<text x="670.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e08a1e" text-anchor="middle" font-weight="700">Функція Паріса — Гаррінгтона PH(n)</text>
<rect x="527.0" y="315.1" width="286.0" height="73.9" rx="6" fill="#ffffff" stroke="#e08a1e" stroke-width="1.5"/><text x="670.0" y="334.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">f(n) = PH(n, n, n)</tspan><tspan x="670.0" dy="14.3">Скорость зростання відповідає F_{ε₀}(n)</tspan><tspan x="670.0" dy="14.3">Наслідок: Твердження PH неможливо</tspan><tspan x="670.0" dy="14.3">довести в арифметиці Пеано!</tspan></text>
</svg>