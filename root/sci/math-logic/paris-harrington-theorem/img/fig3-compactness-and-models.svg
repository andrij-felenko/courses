<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="400.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Чому PH істинна в ℕ, але невиводжувана у формальній теорії PA</text>
<rect x="30.0" y="60.0" width="390.0" height="330.0" rx="8" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/>
<text x="225.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="700">Стандартна модель ℕ = {0, 1, 2, ...}</text>
<rect x="117.8" y="105.2" width="214.4" height="59.6" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="225.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Нескінченна теорема Рамсея:</tspan><tspan x="225.0" dy="14.3">Для будь-якого забарвлення [ℕ]ⁿ</tspan><tspan x="225.0" dy="14.3">існує НЕСКІНЧЕННА однорідна H_∞</tspan></text>
<rect x="77.1" y="185.2" width="295.9" height="59.6" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="225.0" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Зрізання нескінченної множини:</tspan><tspan x="225.0" dy="14.3">Взявши a = min(H_∞) та перші max(m, a)</tspan><tspan x="225.0" dy="14.3">елементів, отримуємо велику монохроматичну H</tspan></text>
<rect x="92.2" y="268.1" width="265.5" height="73.9" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="225.0" y="287.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">Лема Кеніга / Компактність:</tspan><tspan x="225.0" dy="14.3">Перехід від нескінченного випадку до</tspan><tspan x="225.0" dy="14.3">скінченного порогу N = PH(n, m, c)</tspan><tspan x="225.0" dy="14.3">⇒ PH ІСТИННА в ℕ!</tspan></text>
<rect x="460.0" y="60.0" width="390.0" height="330.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="655.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">Нестандартні моделі M ⊨ PA</text>
<rect x="525.9" y="105.2" width="258.3" height="59.6" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="655.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Нестандартні елементи:</tspan><tspan x="655.0" dy="14.3">Модель M містить нескінченно великі</tspan><tspan x="655.0" dy="14.3">числа M &gt; n для всіх стандартних n ∈ ℕ</tspan></text>
<rect x="529.0" y="185.2" width="252.0" height="59.6" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/><text x="655.0" y="204.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">Конструкція контрприкладу в M:</tspan><tspan x="655.0" dy="14.3">Існує внутрішнє забарвлення K в M без</tspan><tspan x="655.0" dy="14.3">великих монохроматичних підмножин</tspan></text>
<rect x="522.2" y="268.1" width="265.5" height="73.9" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="655.0" y="287.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Еквівалентність 1-консистентності:</tspan><tspan x="655.0" dy="14.3">PA ⊢ PH ⇔ PA ⊢ 1-Con(PA)</tspan><tspan x="655.0" dy="14.3">За ІІ теоремою Геделя PA ⊬ 1-Con(PA)</tspan><tspan x="655.0" dy="14.3">⇒ PH НЕВИВОДЖУВАНА у PA!</tspan></text>
</svg>