<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок спуску: із квадратної площі народжується менший трикутник</text>
<text x="530.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">чотири взаємно прості множники площі мусять бути квадратами — з них і складається новий трикутник</text>
<path d="M 70.0 154.0 L 166.0 154.0 L 70.0 92.0 Z" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="118.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">трикутник із площею-□</text>
<path d="M 922.0 148.0 L 980.0 148.0 L 922.0 108.0 Z" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="951.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">менший — теж площа-□</text>
<rect x="40.0" y="196.0" width="284.0" height="176.0" rx="6" fill="#fbfcfd" stroke="#27ae60" stroke-width="1.7"/><text x="182.0" y="243.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="182.0" dy="0.0">1 · ПЛОЩА — КВАДРАТ</tspan><tspan x="182.0" dy="18.2"></tspan><tspan x="182.0" dy="18.2">примітивний трикутник</tspan><tspan x="182.0" dy="18.2">(m²−n², 2mn, m²+n²)</tspan><tspan x="182.0" dy="18.2"></tspan><tspan x="182.0" dy="18.2">площа = mn(m−n)(m+n) = □</tspan></text>
<rect x="388.0" y="196.0" width="284.0" height="176.0" rx="6" fill="#fbfcfd" stroke="#2457d6" stroke-width="1.7"/><text x="530.0" y="234.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">2 · ЧОТИРИ КВАДРАТИ</tspan><tspan x="530.0" dy="18.2"></tspan><tspan x="530.0" dy="18.2">m, n, m−n, m+n —</tspan><tspan x="530.0" dy="18.2">попарно взаємно прості,</tspan><tspan x="530.0" dy="18.2">а добуток їхній — квадрат</tspan><tspan x="530.0" dy="18.2"></tspan><tspan x="530.0" dy="18.2">⇒  m=p², n=q², m+n=r², m−n=s²</tspan></text>
<rect x="736.0" y="196.0" width="284.0" height="176.0" rx="6" fill="#fbfcfd" stroke="#c0392b" stroke-width="1.7"/><text x="878.0" y="234.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="878.0" dy="0.0">3 · МЕНШИЙ ТРИКУТНИК</tspan><tspan x="878.0" dy="18.2"></tspan><tspan x="878.0" dy="18.2">катети (r+s)/2 та (r−s)/2,</tspan><tspan x="878.0" dy="18.2">гіпотенуза p</tspan><tspan x="878.0" dy="18.2"></tspan><tspan x="878.0" dy="18.2">U² + V² = m = p²</tspan><tspan x="878.0" dy="18.2">площа = n/4 = (q/2)² = □</tspan></text>
<line x1="328.0" y1="284.0" x2="384.0" y2="284.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="676.0" y1="284.0" x2="732.0" y2="284.0" stroke="#1a1a1a" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="40.0" y="420.0" width="980.0" height="58.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="530.0" y="445.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">Гіпотенуза впала:  p = √m  &lt;  m² + n² = c.  Новий трикутник знову має площу-квадрат — годуй його тим самим кроком.</tspan><tspan x="530.0" dy="15.6">Гіпотенузи дають спадний ланцюг натуральних чисел c₁ &gt; c₂ &gt; c₃ &gt; … — а такого не буває. Отже жодного трикутника з площею-квадратом нема.</tspan></text>
</svg>