<text x="500.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ℵ₀ = ℶ₀ (завжди тотожні)</text>
<line x1="335.0" y1="280.0" x2="665.0" y2="280.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5,5"/>
