<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сходи нескінченностей: Алеф-ієрархія та Бет-ієрархія</text>
<text x="500.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Алефи рахують усі можливі початкові ординали; Бети виникають через послідовне взяття булеана (2^κ)</text>
<rect x="170.0" y="72.5" width="220.0" height="35.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="280.0" y="95.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">Алеф-ієрархія (ℵ)</tspan></text>
<rect x="610.0" y="72.5" width="220.0" height="35.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="95.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Бет-ієрархія (ℶ)</tspan></text>
