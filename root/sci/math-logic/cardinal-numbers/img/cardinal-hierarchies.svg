<text x="500.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Гіпотеза континууму: чи ℵ₁ = ℶ₁?</text>
<rect x="80.0" y="450.0" width="840.0" height="36.0" rx="6" fill="#fef9e7" stroke="#b7950b" stroke-width="1.2"/>
<text x="500.0" y="473.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7d6608" text-anchor="middle" font-weight="700">У системі ZFC рівність ℵ₁ = ℶ₁ неможливо ані довести, ані спростувати (вона незалежна від аксіом).</text>
