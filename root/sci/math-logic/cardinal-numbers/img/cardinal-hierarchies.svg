<text x="500.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Зліченна множина: ℕ, ℤ, ℚ, прості числа, коди програм</text>
