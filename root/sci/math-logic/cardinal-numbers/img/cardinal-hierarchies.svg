<rect x="100.0" y="306.0" width="800.0" height="28.0" rx="4" fill="#f4f6f8" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="500.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Континуум c = 2^ℵ₀: ℝ, ℂ, відрізок [0, 1], точки площини ℝ²</text>
<rect x="235.0" y="161.0" width="90.0" height="38.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="280.0" y="186.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="280.0" dy="0.0">ℵ₂</tspan></text>
<rect x="675.0" y="161.0" width="90.0" height="38.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="720.0" y="186.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">ℶ₂</tspan></text>
