<rect x="520.0" y="85.0" width="360.0" height="240.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="700.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Множина всіх задач розпізнавання</text>
<text x="700.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Усі можливі предикати f: ℕ → {0, 1}</text>
