<line x1="445.0" y1="205.0" x2="515.0" y2="205.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="480.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Ін'єкція</text>
<text x="480.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ℵ₀ &lt; 2^ℵ₀</text>
<rect x="60.0" y="345.0" width="840.0" height="52.0" rx="6" fill="#fef9e7" stroke="#b7950b" stroke-width="1.2"/>
<text x="480.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7d6608" text-anchor="middle" font-weight="700">Кардинальний наслідок: програм незрівнянно менше, ніж задач.</text>
<text x="480.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7d6608" text-anchor="middle">Майже будь-яка математична задача розпізнавання є алгоритмічно нерозв'язною.</text>
