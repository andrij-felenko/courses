<text x="110.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">3: def sort_array(arr): ...</text>
<rect x="100.0" y="238.0" width="320.0" height="22.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="110.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">4: int main() { return 0; }</text>
<rect x="100.0" y="264.0" width="320.0" height="22.0" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.0"/>
