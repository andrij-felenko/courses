<rect x="500.0" y="90.0" width="350.0" height="340.0" rx="8" fill="#fbfcfd" stroke="#333333" stroke-width="1.4"/>
<text x="675.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кроки доведення за Діріхле:</text>
<text x="515.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="left"><tspan x="515.0" dy="0.0">1. Фіксуємо вершину A. В неї входить</tspan><tspan x="515.0" dy="13.8">   5 ребер до решти вершин.</tspan></text>
<text x="515.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="left"><tspan x="515.0" dy="0.0">2. 5 ребер фарбуємо в 2 кольори</tspan><tspan x="515.0" dy="13.8">   (червоний / синій).</tspan></text>
<text x="515.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="left"><tspan x="515.0" dy="0.0">3. За принципом Діріхле ⌈5/2⌉ = 3:</tspan><tspan x="515.0" dy="13.8">   принаймні 3 ребра від A мають</tspan><tspan x="515.0" dy="13.8">   однаковий колір (наприклад, червоний</tspan><tspan x="515.0" dy="13.8">   до B, C, D).</tspan></text>
<text x="515.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="left"><tspan x="515.0" dy="0.0">4. Якщо між B, C, D є хоч одне</tspan><tspan x="515.0" dy="13.8">   червоне ребро (напр. B-C) — маємо</tspan><tspan x="515.0" dy="13.8">   червоний трикутник A-B-C!</tspan></text>
<text x="515.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="left"><tspan x="515.0" dy="0.0">5. Якщо всі ребра між B,C,D сині —</tspan><tspan x="515.0" dy="13.8">   маємо синій трикутник B-C-D!</tspan></text>
</svg>