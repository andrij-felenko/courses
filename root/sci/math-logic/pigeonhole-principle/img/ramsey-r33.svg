<text x="440.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">У будь-якому повній графі з 6 вершин з 2-розфарбуванням ребер є одноколірний трикутник</text>
