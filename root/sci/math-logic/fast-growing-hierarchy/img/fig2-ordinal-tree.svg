<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="860.0" height="400.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Редукція граматичного дерева ординала λ[n] для обчислення F_λ(n)</text>
<rect x="30.0" y="60.0" width="390.0" height="330.0" rx="8" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/>
<text x="225.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2563eb" text-anchor="middle" font-weight="700">Канонічне дерево Кантора: α = ω^(ω + 1) + 2</text>
<rect x="185.2" y="109.0" width="79.5" height="32.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/><text x="225.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">Сума (+)</tspan></text>
<rect x="62.0" y="179.5" width="135.9" height="31.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="130.0" y="198.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Доданок ω^(ω + 1)</tspan></text>
<rect x="241.0" y="179.5" width="157.9" height="31.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="320.0" y="198.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">Скінченна константа: 2</tspan></text>
<line x1="200.0" y1="140.0" x2="150.0" y2="180.0" stroke="#2563eb" stroke-width="1.5"/>
<line x1="250.0" y1="140.0" x2="300.0" y2="180.0" stroke="#2563eb" stroke-width="1.5"/>
<rect x="73.0" y="249.5" width="114.0" height="31.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="130.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Показник: ω + 1</tspan></text>
<line x1="130.0" y1="212.0" x2="130.0" y2="250.0" stroke="#7e22ce" stroke-width="1.5"/>
<rect x="38.7" y="320.0" width="82.7" height="30.0" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="80.0" y="338.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="80.0" dy="0.0">Граничний ω</tspan></text>
<rect x="138.7" y="320.0" width="82.7" height="30.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="180.0" y="338.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Константа 1</tspan></text>
<line x1="115.0" y1="280.0" x2="90.0" y2="320.0" stroke="#e08a1e" stroke-width="1.5"/>
<line x1="145.0" y1="280.0" x2="170.0" y2="320.0" stroke="#e08a1e" stroke-width="1.5"/>
<rect x="450.0" y="60.0" width="400.0" height="330.0" rx="8" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/>
<text x="650.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">Кроки підстановки фундаментальної послідовності</text>
<rect x="530.3" y="109.5" width="239.4" height="31.0" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="650.0" y="128.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">1. Вхід: F_{ω^(ω + 1)}(n) при n = 3</tspan></text>
<rect x="533.4" y="149.5" width="233.2" height="31.0" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="650.0" y="168.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">2. Правило: (ω^(α+1))[n] = ω^α · n</tspan></text>
<rect x="533.4" y="189.5" width="233.2" height="31.0" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="650.0" y="208.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">3. Показник: (ω + 1)[3] = ω, тому:</tspan></text>
<rect x="498.9" y="229.5" width="302.1" height="31.0" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="650.0" y="248.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">4. (ω^(ω + 1))[3] = ω^ω · 3 = ω^ω + ω^ω + ω^ω</tspan></text>
<rect x="533.4" y="269.5" width="233.2" height="31.0" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="650.0" y="288.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">5. Далі підстановка: (ω^ω)[3] = ω³</tspan></text>
<rect x="536.5" y="309.5" width="226.9" height="31.0" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text x="650.0" y="328.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">6. Результат: F_{ω³ + ω³ + ω³}(3)</tspan></text>
</svg>