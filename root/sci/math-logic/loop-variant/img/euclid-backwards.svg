<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="990" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="495.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Назад від дна Евклід сам виписує Фібоначчі</text>
<rect x="236.0" y="50.6" width="518.0" height="50.8" rx="6" fill="#eef2f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="495.0" y="72.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="495.0" dy="0.0">найдешевший крок — частка 1:  a mod b = a − b</tspan><tspan x="495.0" dy="16.2">(будь-яка більша частка обвалює b швидше — а нам треба ПОВІЛЬНО)</tspan></text>
<rect x="74.6" y="234.0" width="78.8" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="114.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="114.0" dy="0.0">(13, 8)</tspan></text>
<text x="114.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">b = F₆</text>
<rect x="207.0" y="234.0" width="70.1" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="242.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="242.0" dy="0.0">(8, 5)</tspan></text>
<text x="242.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">b = F₅</text>
<rect x="335.0" y="234.0" width="70.1" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="370.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">(5, 3)</tspan></text>
<text x="370.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">b = F₄</text>
<rect x="463.0" y="234.0" width="70.1" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="498.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="498.0" dy="0.0">(3, 2)</tspan></text>
<text x="498.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">b = F₃</text>
<rect x="591.0" y="234.0" width="70.1" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="626.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="626.0" dy="0.0">(2, 1)</tspan></text>
<text x="626.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">b = F₂</text>
<rect x="719.0" y="234.0" width="70.1" height="32.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="754.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="754.0" dy="0.0">(1, 1)</tspan></text>
<text x="754.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">b = F₁</text>
<rect x="847.0" y="234.0" width="70.1" height="32.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="882.0" y="254.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="882.0" dy="0.0">(1, 0)</tspan></text>
<text x="882.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">b = F₀</text>
<line x1="150.0" y1="312.0" x2="206.0" y2="312.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="278.0" y1="312.0" x2="334.0" y2="312.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="406.0" y1="312.0" x2="462.0" y2="312.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="534.0" y1="312.0" x2="590.0" y2="312.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="662.0" y1="312.0" x2="718.0" y2="312.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="790.0" y1="312.0" x2="846.0" y2="312.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="495.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">прямо: крок Евкліда  (a, b) → (b, a mod b)</text>
<line x1="206.0" y1="206.0" x2="150.0" y2="206.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="334.0" y1="206.0" x2="278.0" y2="206.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="462.0" y1="206.0" x2="406.0" y2="206.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="590.0" y1="206.0" x2="534.0" y2="206.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="718.0" y1="206.0" x2="662.0" y2="206.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="846.0" y1="206.0" x2="790.0" y2="206.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="495.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">назад: pred(a, b) = (a + b, a)   —   а це РІВНО Fₖ₊₂ = Fₖ₊₁ + Fₖ</text>
<text x="882.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">старт назад</text>
<rect x="60.0" y="380.0" width="870.0" height="34.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="495.0" y="401.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="495.0" dy="0.0">тож k кроків вимагають b ≥ Fₖ₊₁ — а мінімальна пара для k кроків це рівно (Fₖ₊₂, Fₖ₊₁)</tspan></text>
<text x="495.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Фібоначчі тут не збіг: це найповільніший спуск, виписаний навпаки</text>
</svg>