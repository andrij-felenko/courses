<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="620" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драбина ординалів: де живе який варіант</text>
<line x1="62.0" y1="580.0" x2="62.0" y2="84.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text transform="translate(46.0,330.0) rotate(-90)" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">сила варіанта зростає</text>
<rect x="96.0" y="89.0" width="232.0" height="42.0" rx="6" fill="#f3ecfb" stroke="#7c4dbe" stroke-width="1.5"/><text x="212.0" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#7c4dbe" text-anchor="middle" font-weight="700"><tspan x="212.0" dy="0.0">ε₀ = ω^ω^ω^···</tspan></text>
<line x1="328.0" y1="110.0" x2="340.0" y2="110.0" stroke="#dfe4ea" stroke-width="1.2"/>
<text x="352.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">Ґудштейн, гідра Кірбі-Періса:</text>
<text x="352.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">варіант існує, але PA його не доводить</text>
<rect x="96.0" y="201.0" width="232.0" height="42.0" rx="6" fill="#eef2f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="212.0" y="227.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="212.0" dy="0.0">ω^ω</tspan></text>
<line x1="328.0" y1="222.0" x2="340.0" y2="222.0" stroke="#dfe4ea" stroke-width="1.2"/>
<text x="352.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">кортежі змінної довжини, мультимножини</text>
<text x="352.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">(порядок Дершовіца-Манни, 1979)</text>
<rect x="96.0" y="313.0" width="232.0" height="42.0" rx="6" fill="#eef2f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="212.0" y="339.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="212.0" dy="0.0">ω·ω = ω²</tspan></text>
<line x1="328.0" y1="334.0" x2="340.0" y2="334.0" stroke="#dfe4ea" stroke-width="1.2"/>
<text x="352.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">пара (x, y) за словниковим порядком;</text>
<text x="352.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">функція Аккермана — (m, n) вниз</text>
<rect x="96.0" y="425.0" width="232.0" height="42.0" rx="6" fill="#eef2f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="212.0" y="451.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="212.0" dy="0.0">ω</tspan></text>
<line x1="328.0" y1="446.0" x2="340.0" y2="446.0" stroke="#dfe4ea" stroke-width="1.2"/>
<text x="352.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">необмежений недетермінізм: кроків</text>
<text x="352.0" y="459.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">скінченно, але межі в ℕ немає</text>
<rect x="96.0" y="525.0" width="232.0" height="42.0" rx="6" fill="#eef2f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="212.0" y="551.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="212.0" dy="0.0">0, 1, 2, 3, …   (ℕ)</tspan></text>
<line x1="328.0" y1="546.0" x2="340.0" y2="546.0" stroke="#dfe4ea" stroke-width="1.2"/>
<text x="352.0" y="540.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">звичайний лічильник: b в Евкліда,</text>
<text x="352.0" y="559.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">hi − lo у двійковому пошуку</text>
<line x1="50.0" y1="166.0" x2="156.9" y2="166.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="8 5"/>
<line x1="863.1" y1="166.0" x2="916.0" y2="166.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="8 5"/>
<rect x="166.9" y="152.2" width="686.2" height="27.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="510.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">межа Peano-арифметики: доводить фундованість КОЖНОГО α &lt; ε₀ (Ґентцен, 1943) — але не самого ε₀</tspan></text>
<rect x="24.0" y="578.0" width="892.0" height="32.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="598.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">кожна цілком упорядкована множина ізоморфна рівно одному ординалу — тож ординал і є нормальна форма варіанта</tspan></text>
</svg>