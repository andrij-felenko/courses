<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="760" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Нитка доведень завершення: метод знайшли двічі</text>
<line x1="150.0" y1="74.0" x2="150.0" y2="213.0" stroke="#333333" stroke-width="2.0"/>
<line x1="150.0" y1="213.0" x2="150.0" y2="334.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="7,6"/>
<line x1="150.0" y1="334.0" x2="150.0" y2="726.0" stroke="#333333" stroke-width="2.0"/>
<rect x="190.0" y="67.0" width="760.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="95.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Ґолдстайн і фон Нойман: серед чотирьох видів коробок</tspan><tspan x="570.0" dy="18.2">блок-схеми є «коробка-твердження» — місце, де твердять відношення</tspan></text><circle cx="150.0" cy="100.0" r="7.0" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="138.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1947</text>
<rect x="190.0" y="136.0" width="760.0" height="88.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/><text x="570.0" y="166.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">ТЮРІНГ: «величина, що спадає й зникає, коли машина спиняється»</tspan><tspan x="570.0" dy="18.2">ординал (n − r)·ω² + (r − s)·ω + k — обидва цикли однією величиною</tspan><tspan x="570.0" dy="18.2">і вже тут: та сама величина обмежує ЧАС до зупинки</tspan></text><circle cx="150.0" cy="180.0" r="7.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="138.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1949</text>
<line x1="139.0" y1="262.0" x2="161.0" y2="284.0" stroke="#c0392b" stroke-width="3.0"/>
<line x1="161.0" y1="262.0" x2="139.0" y2="284.0" stroke="#c0392b" stroke-width="3.0"/>
<rect x="190.0" y="237.0" width="760.0" height="66.0" rx="6" fill="#fff6e6" stroke="#e08a1e" stroke-width="1.5"/><text x="570.0" y="257.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">слід обривається: впливу Тюрінгових трьох сторінок</tspan><tspan x="570.0" dy="17.6">на пізніших авторів не простежено — Флойд його не цитує.</tspan><tspan x="570.0" dy="17.6">Текст знайдуть і виправлять аж 1984-го (Морріс і Джонс)</tspan></text>
<rect x="190.0" y="327.0" width="760.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="355.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Наур: «загальні знімки» — інваріанти, але без правил виводу;</tspan><tspan x="570.0" dy="18.2">зазначає, що Флойд дійшов того самого незалежно</tspan></text><circle cx="150.0" cy="360.0" r="7.0" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="138.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1966</text>
<rect x="190.0" y="401.0" width="760.0" height="88.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="2.2"/><text x="570.0" y="431.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">ФЛОЙД: W-функція зі значеннями в цілком упорядкованій множині;</tspan><tspan x="570.0" dy="18.2">глобальна властивість — зупинка — доводиться ЛОКАЛЬНИМИ перевірками.</tspan><tspan x="570.0" dy="18.2">Сам приписує ідею Перлісу і Ґорну, оригінальності не заявляє</tspan></text><circle cx="150.0" cy="445.0" r="7.0" fill="#eef7f0" stroke="#27ae60" stroke-width="2.0"/><text x="138.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1967</text>
<rect x="190.0" y="486.0" width="760.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="516.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Гоар: P{Q}R — формальна система, збудована на Флойдові.</tspan><tspan x="570.0" dy="18.2">Обіцяє лише «якщо Q завершиться, то R» — часткова коректність;</tspan><tspan x="570.0" dy="18.2">термінування свідомо лишено ПОЗА системою</tspan></text><circle cx="150.0" cy="530.0" r="7.0" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="138.0" y="535.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1969</text>
<rect x="190.0" y="582.0" width="760.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="610.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Дейкстра: wp вимагає зупинки за самим означенням;</tspan><tspan x="570.0" dy="18.2">обмежувальна функція для do-od дістає ім'я</tspan></text><circle cx="150.0" cy="615.0" r="7.0" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="138.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1976</text>
<rect x="190.0" y="667.0" width="760.0" height="66.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="695.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Eiffel (Меєр): variant стає ключовим словом мови —</tspan><tspan x="570.0" dy="18.2">назва, під якою прийом знають програмісти, прийшла не зі статті</tspan></text><circle cx="150.0" cy="700.0" r="7.0" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="138.0" y="705.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="end" font-weight="700">1985</text>
</svg>