<rect x="10.0" y="10.0" width="860.0" height="500.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Драбина похідних функцій Веблена φ_α(β) та їхні нерухомі точки</text>
<line x1="60.0" y1="95.0" x2="60.0" y2="130.0" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="90.0" y="112.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-style="italic">похідна (фікс-точки)</text>
<rect x="139.1" y="54.0" width="101.8" height="32.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="190.0" y="74.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">φ₀(β) = ω^β</tspan></text>
<rect x="302.3" y="54.5" width="115.5" height="31.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="360.0" y="73.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Базова функція</tspan></text>
<rect x="443.2" y="54.5" width="383.7" height="31.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="635.0" y="73.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Експоненціювання з основою ω (φ₀(0)=1, φ₀(1)=ω, φ₀(ω)=ω^ω)</tspan></text>
<line x1="60.0" y1="160.0" x2="60.0" y2="195.0" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#arrow)"/>
