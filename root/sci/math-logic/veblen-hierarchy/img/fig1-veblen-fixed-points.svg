<rect x="139.1" y="119.0" width="101.8" height="32.0" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="190.0" y="139.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">φ₁(β) = ε_β</tspan></text>
<rect x="292.0" y="119.5" width="135.9" height="31.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="360.0" y="138.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Нерухомі точки φ₀</tspan></text>
<rect x="443.2" y="119.5" width="383.7" height="31.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="635.0" y="138.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Розв'язки рівняння ω^γ = γ (φ₁(0)=ε₀, φ₁(1)=ε₁, φ₁(ω)=ε_ω)</tspan></text>
<line x1="60.0" y1="225.0" x2="60.0" y2="260.0" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="90.0" y="242.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-style="italic">похідна (фікс-точки)</text>
<rect x="139.1" y="184.0" width="101.8" height="32.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="190.0" y="204.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">φ₂(β) = ζ_β</tspan></text>
<rect x="292.0" y="184.5" width="135.9" height="31.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="360.0" y="203.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Нерухомі точки φ₁</tspan></text>
<rect x="458.8" y="184.5" width="352.3" height="31.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="635.0" y="203.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Розв'язки рівняння ε_γ = γ (φ₂(0)=ζ₀, де ε_{ζ₀} = ζ₀)</tspan></text>
<line x1="60.0" y1="290.0" x2="60.0" y2="325.0" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="90.0" y="307.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-style="italic">похідна (фікс-точки)</text>
<rect x="139.1" y="249.0" width="101.8" height="32.0" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="190.0" y="269.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">φ₃(β) = η_β</tspan></text>
<rect x="292.0" y="249.5" width="135.9" height="31.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="360.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Нерухомі точки φ₂</tspan></text>
<rect x="458.8" y="249.5" width="352.3" height="31.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="635.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Розв'язки рівняння ζ_γ = γ (φ₃(0)=η₀, де ζ_{η₀} = η₀)</tspan></text>
<line x1="60.0" y1="355.0" x2="60.0" y2="390.0" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="90.0" y="372.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="middle" font-style="italic">похідна (фікс-точки)</text>
<rect x="157.7" y="314.0" width="64.6" height="32.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="190.0" y="334.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">φ_ω(0)</tspan></text>
<rect x="292.0" y="314.5" width="135.9" height="31.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="360.0" y="333.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Граничний ординал</tspan></text>
<rect x="402.4" y="314.5" width="465.2" height="31.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="635.0" y="333.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Супремум послідовності φ₁(0), φ₂(0), φ₃(0), ... = sup {ε₀, ζ₀, η₀, ...}</tspan></text>
<rect x="142.8" y="379.0" width="94.4" height="32.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="190.0" y="399.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">φ_{ω+1}(0)</tspan></text>
<rect x="288.6" y="379.5" width="142.8" height="31.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="360.0" y="398.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Нерухомі точки φ_ω</tspan></text>
<rect x="446.3" y="379.5" width="377.4" height="31.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="635.0" y="398.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="635.0" dy="0.0">Перша спільна нерухома точка для всіх функцій φ_n (n &lt; ω)</tspan></text>
<line x1="25.0" y1="445.0" x2="855.0" y2="445.0" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="440.0" y="463.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Межа бінарної функції φ(α, β): перша нерухома точка діагоналі φ(α, 0) = α дає ординал Γ₀</text>
</svg>