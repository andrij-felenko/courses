<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одна машина — різні знамениті результати</text>
<text x="500.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">той самий прийом нерухомої точки, різна начинка P</text>
<rect x="381.8" y="87.9" width="236.3" height="60.2" rx="6" fill="#f2f3f5" stroke="#1a1a1a" stroke-width="1.5"/><text x="500.0" y="113.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Будівник нерухомої точки</tspan><tspan x="500.0" dy="18.2">X   ⟺   P(⌜X⌝)</tspan></text>
<line x1="500.0" y1="156.0" x2="500.0" y2="196.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="300.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">вкладаєш  P</text>
<text x="515.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">будівник</text>
<text x="730.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">дістаєш  X</text>
<rect x="205.9" y="232.0" width="188.2" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="300.0" y="254.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">P = «надрукуй цей текст»</tspan></text>
<line x1="400.1" y1="250.0" x2="692.6" y2="250.0" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="698.6" y="231.8" width="62.8" height="36.5" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="730.0" y="254.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Квайн</tspan></text>
<rect x="202.5" y="312.0" width="195.0" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="300.0" y="334.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">P = «X не доводиться у F»</tspan></text>
<line x1="403.5" y1="330.0" x2="650.0" y2="330.0" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="656.0" y="311.8" width="148.0" height="36.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="730.0" y="334.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Речення G Ґеделя</tspan></text>
<rect x="212.8" y="392.0" width="174.5" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="300.0" y="414.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">P = «X не зупиняється»</tspan></text>
<line x1="393.2" y1="410.0" x2="650.0" y2="410.0" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="656.0" y="391.8" width="148.0" height="36.5" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="730.0" y="414.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Проблема зупинки</tspan></text>
<rect x="243.5" y="474.0" width="112.9" height="36.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="300.0" y="496.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">P = «X хибне»</tspan></text>
<line x1="362.5" y1="492.0" x2="626.8" y2="492.0" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="632.8" y="473.8" width="194.5" height="36.5" rx="6" fill="#f2f3f5" stroke="#b9770e" stroke-width="1.5"/><text x="730.0" y="496.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Брехун — не збирається</tspan></text>
<text x="730.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b9770e" text-anchor="middle">(предиката «істинне» в арифметиці немає)</text>
<text x="500.0" y="572.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Речення G — це квайн із начинкою «мене не можна довести».</text>
</svg>