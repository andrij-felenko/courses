<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 616" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="616" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">β-функція: послідовність — у пару чисел, без жодного степеня</text>
<text x="510.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">член дістається самою остачею — тому це під силу навіть найслабшій арифметиці</text>
<text x="60.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Крок 1 — ось послідовність (це коди «0 = 0»)</text>
<rect x="318.0" y="108.0" width="104.0" height="42.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="370.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">a₀ = 1</text>
<rect x="438.0" y="108.0" width="104.0" height="42.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="490.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">a₁ = 3</text>
<rect x="558.0" y="108.0" width="104.0" height="42.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="610.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">a₂ = 1</text>
<text x="60.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Крок 2 — беремо d = 4! = 24 і будуємо модулі  mᵢ = 1 + (i+1)·d</text>
<rect x="318.0" y="206.0" width="104.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/>
<text x="370.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">m₀ = 25</text>
<rect x="438.0" y="206.0" width="104.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/>
<text x="490.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">m₁ = 49</text>
<rect x="558.0" y="206.0" width="104.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/>
<text x="610.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">m₂ = 73</text>
<rect x="780.1" y="194.3" width="115.8" height="65.4" rx="6" fill="#f2f3f5" stroke="#6b7280" stroke-width="1.5"/><text x="838.0" y="216.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="838.0" dy="0.0">попарно</tspan><tspan x="838.0" dy="15.0">взаємно прості</tspan><tspan x="838.0" dy="15.0">(d кратне 4!)</tspan></text>
<line x1="490.0" y1="250.0" x2="490.0" y2="300.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="60.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Крок 3 — китайська теорема про остачі дає одне узгоджене число c</text>
<rect x="275.1" y="313.5" width="429.9" height="45.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="490.0" y="341.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">c = 74826    (разом із d = 24 — уся трійка)</tspan></text>
<line x1="490.0" y1="366.0" x2="490.0" y2="412.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="60.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Крок 4 — витягаємо кожен член:  β(c, d, i) = остача c за модулем mᵢ</text>
<rect x="170.0" y="424.0" width="200.0" height="58.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.7"/>
<text x="270.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">74826 mod 25</text>
<text x="270.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">= 1 = a₀</text>
<rect x="410.0" y="424.0" width="200.0" height="58.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.7"/>
<text x="510.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">74826 mod 49</text>
<text x="510.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">= 3 = a₁</text>
<rect x="650.0" y="424.0" width="200.0" height="58.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.7"/>
<text x="750.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">74826 mod 73</text>
<text x="750.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">= 1 = a₂</text>
<rect x="167.6" y="520.6" width="684.8" height="54.8" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="510.0" y="544.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Жодного піднесення до степеня — лише +, ·, остача. Тому «i-й член послідовності» —</tspan><tspan x="510.0" dy="16.2">арифметична формула навіть у слабкій системі; саме на цьому тримається представність.</tspan></text>
</svg>