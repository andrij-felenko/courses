<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1030 600" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1030" height="600" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Діагональна лема: як речення тримає власний код</text>
<text x="510.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">самопокликання без зачарованого кола — той самий код ужито двічі</text>
<rect x="306.4" y="93.0" width="387.1" height="46.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="500.0" y="121.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">θ(x)  :=  ∃r ( Sub(x, x, r) ∧ ψ(r) )</tspan></text>
<text x="500.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">«візьми формулу з кодом x, підстав у неї її ж код x, і застосуй ψ до результату»</text>
<line x1="500.0" y1="178.0" x2="500.0" y2="252.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="720.5" y="181.4" width="143.0" height="67.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="792.0" y="203.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="792.0" dy="0.0">годуємо θ</tspan><tspan x="792.0" dy="15.6">її власним кодом</tspan><tspan x="792.0" dy="15.6">m = ⌜θ⌝</tspan></text>
<rect x="422.8" y="265.5" width="154.5" height="45.0" rx="6" fill="#f2f3f5" stroke="#1a1a1a" stroke-width="1.5"/><text x="500.0" y="293.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">D  :=  θ(m̄)</tspan></text>
<rect x="132.4" y="254.4" width="147.1" height="67.2" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="206.0" y="276.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="206.0" dy="0.0">підстановка коду θ</tspan><tspan x="206.0" dy="15.6">у саму θ будує</tspan><tspan x="206.0" dy="15.6">рівно D</tspan></text>
<line x1="306.0" y1="288.0" x2="456.0" y2="288.0" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<line x1="500.0" y1="312.0" x2="500.0" y2="352.0" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="262.3" y="359.5" width="475.4" height="37.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="382.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">тому  sub(m, m) = ⌜D⌝  — код результату і є код самого D</tspan></text>
<line x1="500.0" y1="402.0" x2="500.0" y2="444.0" stroke="#6b7280" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="372.4" y="455.0" width="255.2" height="50.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="486.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">F ⊢   D   ⟺   ψ(⌜D⌝)</tspan></text>
<text x="500.0" y="524.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">D рівносильне (у самій F) твердженню «ψ справджується для мого власного коду»</text>
<text x="500.0" y="550.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">підстав ψ = ¬Bew — і дістанеш G, що каже «мене не доводять»</text>
</svg>