<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія складності задач здійснюваності (SAT)</text>
<rect x="25.0" y="50.0" width="250.0" height="275.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="150.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#15803d" text-anchor="middle" font-weight="700">2-SAT</text>
<text x="150.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-style="italic">Диз'юнкти довжини 2</text>
<rect x="61.9" y="117.4" width="176.2" height="55.2" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/><text x="150.0" y="133.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Складність: Лінійна O(N)</tspan><tspan x="150.0" dy="15.6">Клас: NL-повна</tspan><tspan x="150.0" dy="15.6">(Паралелізується в NC²)</tspan></text>
<rect x="53.1" y="187.1" width="193.8" height="65.9" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.0"/><text x="150.0" y="202.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Структура:</tspan><tspan x="150.0" dy="14.3">Граф імплікацій (2-SCC)</tspan><tspan x="150.0" dy="14.3">(a ∨ b) ≡ (¬a → b) ∧ (¬b → a)</tspan><tspan x="150.0" dy="14.3">Симетричне дуальне виведення</tspan></text>
<text x="150.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Симметричні альтернативи</text>
<rect x="295.0" y="50.0" width="250.0" height="275.0" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
<text x="420.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#0369a1" text-anchor="middle" font-weight="700">Horn-SAT</text>
<text x="420.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-style="italic">≤1 позитивного літерала</text>
<rect x="321.7" y="117.4" width="196.7" height="55.2" rx="6" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.0"/><text x="420.0" y="133.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Складність: Лінійна O(N)</tspan><tspan x="420.0" dy="15.6">Клас: P-повна</tspan><tspan x="420.0" dy="15.6">(Послідовна за своєю суттю)</tspan></text>
<rect x="335.6" y="179.9" width="168.8" height="80.2" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.0"/><text x="420.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Структура:</tspan><tspan x="420.0" dy="14.3">Гіперграф дедукції</tspan><tspan x="420.0" dy="14.3">(p₁ ∧ ... ∧ pₖ) → q</tspan><tspan x="420.0" dy="14.3">Замкненість щодо перетину</tspan><tspan x="420.0" dy="14.3">Монтонний каскад одиниць</tspan></text>
<text x="420.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">Межа детермінованого P</text>
<rect x="565.0" y="50.0" width="250.0" height="275.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="690.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#b91c1c" text-anchor="middle" font-weight="700">3-SAT / Загальний SAT</text>
<text x="690.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-style="italic">≥3 літералів у диз'юнкті</text>
<rect x="578.0" y="117.4" width="224.0" height="55.2" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.0"/><text x="690.0" y="133.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Складність: Експоненційна O(2ⁿ)</tspan><tspan x="690.0" dy="15.6">Клас: NP-повна</tspan><tspan x="690.0" dy="15.6">(Теорема Кука — Левіна)</tspan></text>
<rect x="583.7" y="179.9" width="212.6" height="80.2" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.0"/><text x="690.0" y="195.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Структура:</tspan><tspan x="690.0" dy="14.3">Довільні комбінації ∨, ∧, ¬</tspan><tspan x="690.0" dy="14.3">Втрата замкненості перетину</tspan><tspan x="690.0" dy="14.3">Потреба повернень (backtracking)</tspan><tspan x="690.0" dy="14.3">та деревоподібного пошуку</tspan></text>
<text x="690.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">По той бік межі P vs NP</text>
</svg>