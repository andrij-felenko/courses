<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="25.0" y="20.0" width="250.0" height="310.0" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
<text x="150.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#0369a1" text-anchor="middle" font-weight="700">Стверджувальне правило</text>
<text x="150.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-style="italic">(Definite Clause)</text>
<rect x="65.6" y="101.3" width="168.8" height="37.3" rx="6" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.0"/><text x="150.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">¬p₁ ∨ ¬p₂ ∨ ... ∨ ¬pₖ ∨ q</tspan><tspan x="150.0" dy="14.3">(Один позитивний літерал)</tspan></text>
<rect x="65.6" y="171.3" width="168.9" height="37.3" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/><text x="150.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">(p₁ ∧ ... ∧ pₖ) → q</tspan><tspan x="150.0" dy="14.3">«Якщо всі pᵢ=1, то q=1»</tspan></text>
<text x="150.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Застосування:</text>
<text x="150.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Правила виведення у Prolog / Datalog</text>
<text x="150.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">та каскадна дедукція</text>
<rect x="295.0" y="20.0" width="250.0" height="310.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="420.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#15803d" text-anchor="middle" font-weight="700">Факт / Атом</text>
<text x="420.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-style="italic">(Fact / Unit Positive)</text>
<rect x="345.0" y="101.3" width="149.9" height="37.3" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/><text x="420.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">q</tspan><tspan x="420.0" dy="14.3">(Одиничний позитивний)</tspan></text>
<rect x="315.1" y="171.3" width="209.8" height="37.3" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="420.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">⊤ → q</tspan><tspan x="420.0" dy="14.3">«Атом q є безумовно істинним»</tspan></text>
<text x="420.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Застосування:</text>
<text x="420.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Базові факти системи, початкові</text>
<text x="420.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">тригери каскаду поширення</text>
<rect x="565.0" y="20.0" width="250.0" height="310.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="690.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#b91c1c" text-anchor="middle" font-weight="700">Диз'юнкт-мета / Обмеження</text>
<text x="690.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle" font-style="italic">(Goal / Negative Clause)</text>
<rect x="618.2" y="101.3" width="143.7" height="37.3" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.0"/><text x="690.0" y="116.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">¬p₁ ∨ ¬p₂ ∨ ... ∨ ¬pₘ</tspan><tspan x="690.0" dy="14.3">(Жодного позитивного)</tspan></text>
<rect x="591.9" y="171.3" width="196.1" height="37.3" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="690.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">(p₁ ∧ ... ∧ pₘ) → ⊥</tspan><tspan x="690.0" dy="14.3">«Умови неістинні одночасно»</tspan></text>
<text x="690.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Застосування:</text>
<text x="690.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Перевірка суперечностей (UNSAT)</text>
<text x="690.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">та запити цілісності (integrity constraint)</text>
</svg>