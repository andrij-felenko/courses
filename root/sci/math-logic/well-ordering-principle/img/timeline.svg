<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хронологія теореми про повне впорядкування</text>
<text x="590.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-style="italic">як Канторів «закон мислення» став аксіомою, що розколола математику</text>
<line x1="70.0" y1="315.0" x2="1120.0" y2="315.0" stroke="#1a1a1a" stroke-width="2.2"/>
<line x1="1095.0" y1="315.0" x2="1135.0" y2="315.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="150.0" y1="265.0" x2="150.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="46.0" y="115.0" width="208.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="150.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">Кантор</tspan><tspan x="150.0" dy="16.2">«Grundlagen»</tspan><tspan x="150.0" dy="16.2">всяку множину —</tspan><tspan x="150.0" dy="16.2">цілком упорядкувати:</tspan><tspan x="150.0" dy="16.2">«закон мислення»</tspan><tspan x="150.0" dy="16.2">без доведення</tspan></text>
<rect x="116.0" y="297.5" width="68.0" height="35.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="150.0" y="320.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1883</tspan></text>
<line x1="370.0" y1="330.0" x2="370.0" y2="350.0" stroke="#1a1a1a" stroke-width="1.6"/>
<rect x="266.0" y="350.0" width="208.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.6"/><text x="370.0" y="388.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Гільберт</tspan><tspan x="370.0" dy="16.2">Париж, 1-ша проблема</tspan><tspan x="370.0" dy="16.2">поряд із гіпотезою</tspan><tspan x="370.0" dy="16.2">континууму:</tspan><tspan x="370.0" dy="16.2">чи можна впорядкувати</tspan><tspan x="370.0" dy="16.2">весь континуум?</tspan></text>
<rect x="336.0" y="297.5" width="68.0" height="35.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="370.0" y="320.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="370.0" dy="0.0">1900</tspan></text>
<line x1="590.0" y1="265.0" x2="590.0" y2="300.0" stroke="#27ae60" stroke-width="1.6"/>
<rect x="486.0" y="115.0" width="208.0" height="150.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.6"/><text x="590.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Цермело</tspan><tspan x="590.0" dy="16.2">лист Гільбертові,</tspan><tspan x="590.0" dy="16.2">три сторінки —</tspan><tspan x="590.0" dy="16.2">доведення теореми</tspan><tspan x="590.0" dy="16.2">й виокремлена</tspan><tspan x="590.0" dy="16.2">аксіома вибору</tspan></text>
<rect x="556.0" y="297.5" width="68.0" height="35.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="590.0" y="320.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">1904</tspan></text>
<line x1="810.0" y1="330.0" x2="810.0" y2="350.0" stroke="#c0392b" stroke-width="1.6"/>
<rect x="706.0" y="350.0" width="208.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="810.0" y="388.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Розкол: «П'ять листів»</tspan><tspan x="810.0" dy="16.2">Борель, Бер, Лебеґ —</tspan><tspan x="810.0" dy="16.2">проти (вибір без</tspan><tspan x="810.0" dy="16.2">правила); Адамар —</tspan><tspan x="810.0" dy="16.2">за. Пеано, Пуанкаре</tspan><tspan x="810.0" dy="16.2">теж критикують</tspan></text>
<rect x="776.0" y="297.5" width="68.0" height="35.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="810.0" y="320.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="810.0" dy="0.0">1905</tspan></text>
<line x1="1030.0" y1="265.0" x2="1030.0" y2="300.0" stroke="#2457d6" stroke-width="1.6"/>
<rect x="926.0" y="115.0" width="208.0" height="150.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="1030.0" y="153.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1030.0" dy="0.0">Цермело: друге</tspan><tspan x="1030.0" dy="16.2">доведення + сім</tspan><tspan x="1030.0" dy="16.2">аксіом теорії множин</tspan><tspan x="1030.0" dy="16.2">(предок ZF).</tspan><tspan x="1030.0" dy="16.2">Теорема рівносильна</tspan><tspan x="1030.0" dy="16.2">аксіомі вибору</tspan></text>
<rect x="996.0" y="297.5" width="68.0" height="35.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="1030.0" y="320.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="1030.0" dy="0.0">1908</tspan></text>
