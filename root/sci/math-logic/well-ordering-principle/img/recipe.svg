<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як побудувати спадну міру</text>
<text x="500.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">п'ять питань поспіль: пройшов усі — зупинку доведено; спіткнувся — бачиш, де саме</text>
<rect x="110.0" y="92.0" width="410.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="315.0" y="123.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">1. Стан: які величини міняє прохід або виклик?</tspan></text>
<line x1="315.0" y1="146.0" x2="315.0" y2="190.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="110.0" y="190.0" width="410.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="315.0" y="213.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">2. Кандидат-міра: що спадає до умови виходу —</tspan><tspan x="315.0" dy="16.9">відстань, яку цикл закриває?</tspan></text>
<line x1="315.0" y1="244.0" x2="315.0" y2="288.0" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="110.0" y="288.0" width="410.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="315.0" y="314.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">3. Спадає СТРОГО щоразу — на кожній гілці</tspan><tspan x="315.0" dy="16.9">й у кожному виклику?</tspan></text>
<rect x="110.0" y="400.0" width="410.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="315.0" y="434.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">4. Живе в ℕ — є дно, крок не менший за одиницю?</tspan></text>
<rect x="110.0" y="512.0" width="410.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="315.0" y="546.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">5. Одного числа досить?</tspan></text>
<line x1="315.0" y1="348.0" x2="315.0" y2="400.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="333.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">так</text>
<line x1="315.0" y1="460.0" x2="315.0" y2="512.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="333.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">так</text>
<line x1="315.0" y1="572.0" x2="315.0" y2="636.0" stroke="#27ae60" stroke-width="1.9" marker-end="url(#arrow)"/>
<text x="333.0" y="608.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">так</text>
<line x1="520.0" y1="318.0" x2="620.0" y2="318.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="570.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ні</text>
<rect x="620.0" y="288.0" width="350.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="795.0" y="314.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Ні — якась гілка лишає міру тією самою.</tspan><tspan x="795.0" dy="15.6">Ланцюг спаду рветься: зупинка НЕ доведена.</tspan></text>
<line x1="520.0" y1="430.0" x2="620.0" y2="430.0" stroke="#c0392b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="570.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ні</text>
<rect x="620.0" y="400.0" width="350.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="795.0" y="426.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Ні — у ℝ чи в ℤ без дна спуск нескінченний:</tspan><tspan x="795.0" dy="15.6">1 &gt; ½ &gt; ¼ &gt; …   або   −1, −3, −5, …</tspan></text>
<line x1="520.0" y1="532.0" x2="620.0" y2="532.0" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="570.0" y="524.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">ні</text>
<rect x="620.0" y="500.0" width="350.0" height="64.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="795.0" y="521.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="795.0" dy="0.0">Ні — піднеси до кортежу за словниковим</tspan><tspan x="795.0" dy="15.0">порядком (ℕ×ℕ) або до структури за</tspan><tspan x="795.0" dy="15.0">підтермами. Обидва фундовані.</tspan></text>
<path d="M 795.0 564 L 795.0 662 L 640.0 662" fill="none" stroke="#2457d6" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="150.0" y="636.0" width="700.0" height="76.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="500.0" y="669.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">V: Стан → ℕ  (чи інша фундована множина),  строго спадна щокроку</tspan><tspan x="500.0" dy="18.2">⟹  нескінченного спуску немає  ⟹  зупинку доведено</tspan></text>
</svg>