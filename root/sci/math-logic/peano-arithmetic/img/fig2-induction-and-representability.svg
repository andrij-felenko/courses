<text x="227.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">Крок індукції: ∀x (φ(x) → φ(S(x)))</text>
