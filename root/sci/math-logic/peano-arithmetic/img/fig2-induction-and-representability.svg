<rect x="10.0" y="10.0" width="860.0" height="400.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Схема індукції та кодування обчислень через β-функцію Ґеделя</text>
<rect x="30.0" y="60.0" width="395.0" height="320.0" rx="8" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/>
<text x="227.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2563eb" text-anchor="middle" font-weight="700">Синтаксис схеми індукції у PA</text>
<rect x="60.0" y="115.0" width="335.0" height="36.0" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.0"/>
<text x="227.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">База індукції: φ(0)</text>
