<rect x="455.0" y="60.0" width="395.0" height="320.0" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
<text x="652.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7e22ce" text-anchor="middle" font-weight="700">β-функція Ґеделя (Кодування послідовностей)</text>
<text x="652.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">β(a, b, i) = a mod (1 + (i + 1) · b)</text>
