<text x="652.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">Забезпечує Σ₁-виражуваність рекурсивних функцій у PA</text>
