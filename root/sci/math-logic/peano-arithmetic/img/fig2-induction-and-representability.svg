<text x="652.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7e22ce" text-anchor="middle">Послідовність чисел: a₀, a₁, a₂, ..., aₖ</text>
<rect x="485.0" y="235.0" width="335.0" height="48.0" rx="5" fill="#e6fffa" stroke="#0d9488" stroke-width="1.0"/>
<text x="652.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0d9488" text-anchor="middle">Кодується парою натуральних чисел (a, b)</text>
<text x="652.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0d9488" text-anchor="middle">через Китайську теорему про залишки</text>
