<rect x="10.0" y="10.0" width="860.0" height="410.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="440.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Ландшафт довідності у PA та недоведені математичні істини</text>
<rect x="30.0" y="60.0" width="820.0" height="340.0" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="440.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#334155" text-anchor="middle" font-weight="700">Множина всіх істинних арифметичних тверджень Th(ℕ) (Семантична істина)</text>
<rect x="50.0" y="110.0" width="400.0" height="270.0" rx="8" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/>
<text x="250.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#16a34a" text-anchor="middle" font-weight="700">Довідні твердження у PA (PA ⊢ φ)</text>
<text x="250.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">· Основна теорема арифметики</text>
<text x="250.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">· Нескінченність простих чисел</text>
<text x="250.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">· Алгоритм Евкліда</text>
<text x="250.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">· Комутативність додавання й множення</text>
<text x="250.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">· Скінченна арифметика й поліноми</text>
<rect x="470.0" y="110.0" width="360.0" height="270.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="650.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="700">Недоведені істини (Th(ℕ) \ PA)</text>
<text x="650.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">· Речення Ґеделя G_PA (Самореферентність)</text>
<text x="650.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">· Несуперечливість PA (Consis(PA))</text>
<text x="650.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">· Теорема Ґудстейна (Goodstein Theorem)</text>
<text x="650.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">· Теорема Парижа — Гаррінгтона (Ramsey)</text>
<text x="650.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">· Теорема Кірбі — Паріса (Hydra Game)</text>
