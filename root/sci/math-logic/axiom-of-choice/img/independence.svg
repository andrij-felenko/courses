<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Аксіома вибору незалежна від теорії множин</text>
<text x="500.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">ZF не може її ні довести, ні спростувати — обидві добудови несуперечливі</text>
<line x1="440.0" y1="186.3" x2="330.0" y2="298.6" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="560.0" y1="186.3" x2="670.0" y2="298.6" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="318.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="end" font-weight="700">додаємо вибір</text>
<text x="682.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">додаємо заперечення</text>
<rect x="350.0" y="115.7" width="300.0" height="68.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="137.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">ZF</tspan><tspan x="500.0" dy="17.6">звичайна теорія множин</tspan><tspan x="500.0" dy="17.6">без аксіоми вибору</tspan></text>
<rect x="107.0" y="302.6" width="306.0" height="66.8" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="260.0" y="323.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">+ аксіома вибору  =  ZFC</tspan><tspan x="260.0" dy="16.9">Гедель (1938):</tspan><tspan x="260.0" dy="16.9">суперечності не вносить</tspan></text>
<rect x="587.0" y="302.6" width="306.0" height="66.8" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="740.0" y="323.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">+ заперечення вибору</tspan><tspan x="740.0" dy="16.9">Коен (1963):</tspan><tspan x="740.0" dy="16.9">теж несуперечливо</tspan></text>
<rect x="150.0" y="410.0" width="700.0" height="40.0" rx="6" fill="#ffffff" stroke="#ffffff" stroke-width="1.5"/><text x="500.0" y="434.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Обидві несуперечливі  ⇒  вибір НЕЗАЛЕЖНИЙ від ZF — як п'ятий постулат Евкліда від інших чотирьох.</tspan></text>
