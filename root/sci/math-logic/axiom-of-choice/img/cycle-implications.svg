<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1040" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Коло імплікацій: три твердження — одне</text>
<text x="520.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">по стрілках з будь-якого дійдеш до кожного — отже, вони рівносильні</text>
<line x1="410.0" y1="210.3" x2="252.0" y2="373.7" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="402.0" y1="412.0" x2="638.0" y2="412.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="788.0" y1="373.7" x2="630.0" y2="210.3" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="300.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="end" font-weight="700">бери найменший</text>
<text x="520.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">трансфінітне сходження</text>
<text x="726.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700"><tspan x="726.0" dy="0.0">порядок на</tspan><tspan x="726.0" dy="16.2">початкових</tspan><tspan x="726.0" dy="16.2">відрізках</tspan></text>
<rect x="370.0" y="137.7" width="300.0" height="68.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="520.0" y="159.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Повне впорядкування</tspan><tspan x="520.0" dy="17.6">кожну множину шикуємо</tspan><tspan x="520.0" dy="17.6">з найменшим у кожній частині</tspan></text>
<rect x="110.0" y="377.7" width="284.0" height="68.6" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="252.0" y="399.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="252.0" dy="0.0">Аксіома вибору</tspan><tspan x="252.0" dy="17.6">по представнику</tspan><tspan x="252.0" dy="17.6">з кожної множини</tspan></text>
<rect x="646.0" y="377.7" width="284.0" height="68.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="788.0" y="399.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="788.0" dy="0.0">Лема Цорна</tspan><tspan x="788.0" dy="17.6">ланцюги мають межу</tspan><tspan x="788.0" dy="17.6">⟹ є максимум</tspan></text>
</svg>