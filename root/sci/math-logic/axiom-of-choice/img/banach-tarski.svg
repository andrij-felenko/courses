<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1120" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="560.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подвоєння: з будови вільної групи обертань — до кулі</text>
<text x="560.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">чотири шматки групи, два крутнуті обертаннями, дають дві повні копії — і так само куля</text>
<line x1="596.0" y1="82.0" x2="596.0" y2="548.0" stroke="#d7dbe0" stroke-width="1.5" stroke-dasharray="5,6"/>
<text x="300.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вільна група F₂ розбита за першою літерою</text>
<line x1="300.0" y1="250.0" x2="300.0" y2="168.0" stroke="#c7ccd2" stroke-width="1.6"/>
<line x1="300.0" y1="250.0" x2="300.0" y2="332.0" stroke="#c7ccd2" stroke-width="1.6"/>
<line x1="300.0" y1="250.0" x2="452.0" y2="250.0" stroke="#c7ccd2" stroke-width="1.6"/>
<line x1="300.0" y1="250.0" x2="148.0" y2="250.0" stroke="#c7ccd2" stroke-width="1.6"/>
<rect x="252.0" y="151.5" width="96.0" height="33.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="172.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">S(b)</tspan></text>
<rect x="252.0" y="315.5" width="96.0" height="33.0" rx="6" fill="#f3eafd" stroke="#7b4fbf" stroke-width="1.5"/><text x="300.0" y="336.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="300.0" dy="0.0">S(b⁻¹)</tspan></text>
<rect x="404.0" y="233.5" width="96.0" height="33.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="452.0" y="254.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="452.0" dy="0.0">S(a)</tspan></text>
<rect x="100.0" y="233.5" width="96.0" height="33.0" rx="6" fill="#fdf0e6" stroke="#c77a1f" stroke-width="1.5"/><text x="148.0" y="254.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="148.0" dy="0.0">S(a⁻¹)</tspan></text>
<circle cx="300.0" cy="250.0" r="22.0" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="300.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700" font-style="italic">e</text>
<rect x="64.0" y="410.0" width="480.0" height="122.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="304.0" y="458.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="304.0" dy="0.0">a · S(a⁻¹)  =  усе, крім S(a)   (початкова a⁻¹ гаситься)</tspan><tspan x="304.0" dy="16.9">S(a) ∪ a·S(a⁻¹) = F₂ ;   S(b) ∪ b·S(b⁻¹) = F₂</tspan><tspan x="304.0" dy="16.9">чотири шматки → дві копії групи, самі обертання</tspan></text>
<text x="858.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Та сама самоподібність на кулі</text>
<circle cx="858.0" cy="214.0" r="66.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.2"/>
<text x="858.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">куля</text>
<text x="858.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">об'єм 1</text>
<line x1="858.0" y1="288.0" x2="858.0" y2="356.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="1016.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">5 невимірних</text>
<text x="1016.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">шматків</text>
<circle cx="790.0" cy="440.0" r="46.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="790.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">куля</text>
<circle cx="926.0" cy="440.0" r="46.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="926.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">куля</text>
<text x="858.0" y="446.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">+</text>
<rect x="648.0" y="506.0" width="420.0" height="46.0" rx="6" fill="#fbfcfd" stroke="#333333" stroke-width="1.5"/><text x="858.0" y="533.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="858.0" dy="0.0">шматки невимірні → об'єм не визначений, зберігати нема чого</tspan></text>
</svg>