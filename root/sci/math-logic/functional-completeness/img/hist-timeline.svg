<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Одну й ту саму річ відкрили чотири рази — і кожен раз по-своєму загубили</text>
<text x="500.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">рік · хто · що зробив · що з того вийшло</text>
<text x="80.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">рік</text>
<text x="140.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">хто</text>
<text x="365.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">що зробив</text>
<text x="845.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">доля знахідки</text>
<line x1="40.0" y1="100.0" x2="960.0" y2="100.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="80.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1880</text>
<text x="140.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Ч. С. Пірс</text>
<text x="365.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">знайшов: NAND і NOR повні поодинці</text>
<rect x="720.0" y="118.0" width="250.0" height="32.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="845.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="845.0" dy="0.0">написав — і поховав</tspan></text>
<rect x="40.0" y="160.0" width="920.0" height="52.0" rx="0" fill="#f4f6f8" stroke="none" stroke-width="0.0"/>
<text x="80.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1911</text>
<text x="140.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Е. Б. Стамм</text>
<text x="365.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">перший НАДРУКУВАВ доведення повноти</text>
<rect x="720.0" y="170.0" width="250.0" height="32.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="845.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="845.0" dy="0.0">надруковано — не почуто</tspan></text>
<text x="80.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1913</text>
<text x="140.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Г. М. Шеффер</text>
<text x="365.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">штрих = «ні p, ні q», тобто NOR</text>
<rect x="720.0" y="222.0" width="250.0" height="32.0" rx="8" fill="#eef0f2" stroke="#6b7280" stroke-width="1.4"/><text x="845.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="845.0" dy="0.0">прославлено не за те</tspan></text>
<rect x="40.0" y="264.0" width="920.0" height="52.0" rx="0" fill="#f4f6f8" stroke="none" stroke-width="0.0"/>
<text x="80.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1917</text>
<text x="140.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Ж. Нікод</text>
<text x="365.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">перечитав штрих як NAND; одна аксіома</text>
<rect x="720.0" y="274.0" width="250.0" height="32.0" rx="8" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.4"/><text x="845.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="845.0" dy="0.0">дав робочу нотацію</tspan></text>
<text x="80.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1925</text>
<text x="140.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Б. Расселл</text>
<text x="365.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">штрих у 2-му виданні Principia</text>
<rect x="720.0" y="326.0" width="250.0" height="32.0" rx="8" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.4"/><text x="845.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="845.0" dy="0.0">увімкнув мережу слави</tspan></text>
<rect x="40.0" y="368.0" width="920.0" height="52.0" rx="0" fill="#f4f6f8" stroke="none" stroke-width="0.0"/>
<text x="80.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1926</text>
<text x="140.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Гарвард</text>
<text x="365.0" y="399.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">MS 378 Пірса з биркою «на викид»</text>
<rect x="720.0" y="378.0" width="250.0" height="32.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="845.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="845.0" dy="0.0">врятовано випадково</tspan></text>
<text x="80.0" y="451.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1933</text>
<text x="140.0" y="451.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Collected Papers</text>
<text x="365.0" y="451.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">рукопис Пірса нарешті надруковано</text>
<rect x="720.0" y="430.0" width="250.0" height="32.0" rx="8" fill="#eef0f2" stroke="#6b7280" stroke-width="1.4"/><text x="845.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="845.0" dy="0.0">запізно на 53 роки</tspan></text>
<rect x="40.0" y="472.0" width="920.0" height="52.0" rx="0" fill="#f4f6f8" stroke="none" stroke-width="0.0"/>
<text x="80.0" y="503.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1941</text>
<text x="140.0" y="503.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Е. Л. Пост</text>
<text x="365.0" y="503.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">класифікував УСІ замкнені класи</text>
<rect x="720.0" y="482.0" width="250.0" height="32.0" rx="8" fill="#eef0f2" stroke="#6b7280" stroke-width="1.4"/><text x="845.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="845.0" dy="0.0">видано — нечитабельно</tspan></text>
<text x="80.0" y="555.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">1990</text>
<text x="140.0" y="555.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Мартін і Пеллетьє</text>
<text x="365.0" y="555.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">переписали доведення сучасно</text>
<rect x="720.0" y="534.0" width="250.0" height="32.0" rx="8" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.4"/><text x="845.0" y="554.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="845.0" dy="0.0">прочитано через 49 років</tspan></text>
<rect x="40.0" y="584.0" width="920.0" height="26.0" rx="8" fill="#f1f8f3" stroke="#27ae60" stroke-width="1.4"/>
<text x="500.0" y="602.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Знахідку робить надбанням не першість, а те, чи є їй кому передатися.</text>
</svg>