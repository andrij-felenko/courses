<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Штрих Шеффера» — не те, що означив Шеффер</text>
<text x="470.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">ліворуч — головний текст його статті 1913 року; праворуч — те, що ми звемо його іменем</text>
<rect x="30.0" y="80.0" width="420.0" height="344.0" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><rect x="42.0" y="92.0" width="396.0" height="34.0" rx="7" fill="#f4f6f8" stroke="none" stroke-width="0.0"/><text x="240.0" y="113.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Що Шеффер СПРАВДІ означив (§2 статті)</tspan></text><rect x="42.0" y="140.0" width="396.0" height="58.0" rx="8" fill="#f4f6f8" stroke="#d5dbe0" stroke-width="1.2"/><text x="240.0" y="165.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="240.0" dy="0.0">«p | q можна тлумачити як</tspan><tspan x="240.0" dy="16.2">судження ні p, ні q»</tspan></text><line x1="240.0" y1="206.0" x2="240.0" y2="242.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="42.0" y="250.0" width="396.0" height="48.0" rx="8" fill="#eef3fb" stroke="#1a1a1a" stroke-width="1.6"/><text x="240.0" y="279.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">¬(a ∨ b)   —   це NOR</tspan></text><line x1="240.0" y1="304.0" x2="240.0" y2="340.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="42.0" y="348.0" width="396.0" height="62.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="240.0" y="375.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">сьогодні цю дію звуть</tspan><tspan x="240.0" dy="16.9">СТРІЛКА ПІРСА   ↓</tspan></text>
<rect x="490.0" y="80.0" width="420.0" height="344.0" rx="12" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><rect x="502.0" y="92.0" width="396.0" height="34.0" rx="7" fill="#f4f6f8" stroke="none" stroke-width="0.0"/><text x="700.0" y="113.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Що вжив Нікод (1917), читаючи зноску</tspan></text><rect x="502.0" y="140.0" width="396.0" height="58.0" rx="8" fill="#f4f6f8" stroke="#d5dbe0" stroke-width="1.2"/><text x="700.0" y="165.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">«не обидва» — дія, на яку</tspan><tspan x="700.0" dy="16.2">Шеффер лише натякнув у зносці</tspan></text><line x1="700.0" y1="206.0" x2="700.0" y2="242.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502.0" y="250.0" width="396.0" height="48.0" rx="8" fill="#eef3fb" stroke="#1a1a1a" stroke-width="1.6"/><text x="700.0" y="279.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">¬(a ∧ b)   —   це NAND</tspan></text><line x1="700.0" y1="304.0" x2="700.0" y2="340.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="502.0" y="348.0" width="396.0" height="62.0" rx="8" fill="#e7f6ec" stroke="#27ae60" stroke-width="1.6"/><text x="700.0" y="375.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">сьогодні цю дію звуть</tspan><tspan x="700.0" dy="16.9">ШТРИХ ШЕФФЕРА   |</tspan></text>
<rect x="30.0" y="444.0" width="880.0" height="66.0" rx="10" fill="#f1f8f3" stroke="#27ae60" stroke-width="1.6"/>
<text x="470.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Те, що Шеффер означив, носить ім'я Пірса. Те, що зветься його штрихом, вжив Нікод.</text>
<text x="470.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">А обидві дії знайшов Пірс іще 1880-го (мовчки), і першим надрукував Стамм 1911-го (непочутим).</text>
</svg>