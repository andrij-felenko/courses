<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 452" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="452" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Додавання ординалів: склей шеренги — і дивись на форму</text>
<text x="510.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">точка спереду всмоктується (1+ω = ω); точка ззаду додає новий останній елемент (ω+1 &gt; ω)</text>
<text x="78.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start" font-weight="700">1 + ω   —   одна точка ПЕРЕД усією ω</text>
<line x1="150.0" y1="162.0" x2="705.0" y2="162.0" stroke="#1a1a1a" stroke-width="1.7"/>
<circle cx="150.0" cy="162.0" r="10.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.6"/>
<text x="150.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1</text>
<circle cx="232.0" cy="162.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="232.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">0</text>
<circle cx="302.0" cy="162.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="302.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">1</text>
<circle cx="372.0" cy="162.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="372.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">2</text>
<circle cx="442.0" cy="162.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="442.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">3</text>
<circle cx="512.0" cy="162.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="512.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">4</text>
<text x="578.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">…</text>
<text x="150.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">всмоктується —</tspan><tspan x="150.0" dy="14.3">стає «новим 0»</tspan></text>
<line x1="720.0" y1="162.0" x2="838.0" y2="162.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="870.0" y="143.0" width="96.0" height="38.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="918.0" y="168.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="918.0" dy="0.0">= ω</tspan></text>
<text x="78.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="start" font-weight="700">ω + 1   —   одна точка ПІСЛЯ усієї ω</text>
<line x1="120.0" y1="340.0" x2="700.0" y2="340.0" stroke="#1a1a1a" stroke-width="1.7"/>
<circle cx="160.0" cy="340.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="160.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">0</text>
<circle cx="230.0" cy="340.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="230.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">1</text>
<circle cx="300.0" cy="340.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="300.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">2</text>
<circle cx="370.0" cy="340.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="370.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">3</text>
<circle cx="440.0" cy="340.0" r="7.0" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="440.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">4</text>
<text x="508.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#6b7280" text-anchor="middle" font-weight="700">…</text>
<circle cx="662.0" cy="340.0" r="10.0" fill="#eaf7ef" stroke="#27ae60" stroke-width="2.6"/>
<text x="662.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">остання</text>
<text x="662.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="662.0" dy="0.0">новий найбільший —</tspan><tspan x="662.0" dy="14.3">у ω його не було</tspan></text>
<line x1="760.0" y1="310.0" x2="838.0" y2="332.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="863.4" y="322.0" width="109.3" height="36.0" rx="6" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/><text x="918.0" y="345.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="918.0" dy="0.0">= ω+1 &gt; ω</tspan></text>
</svg>