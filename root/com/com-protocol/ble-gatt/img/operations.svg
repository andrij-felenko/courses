<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 710 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="710" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три операції над характеристикою: read, write, notify</text>
<text x="150.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Центральний</text>
<text x="550.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Характеристика</text>
<line x1="150.0" y1="64.0" x2="150.0" y2="290.0" stroke="#dddddd" stroke-width="1.2" stroke-dasharray="3 4"/>
<line x1="550.0" y1="64.0" x2="550.0" y2="290.0" stroke="#dddddd" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="80.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">READ</text>
<line x1="162.0" y1="90.0" x2="538.0" y2="90.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="538.0" y1="104.0" x2="162.0" y2="104.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="350.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">центральний тягне значення, коли захоче</text>
<text x="80.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">WRITE</text>
<line x1="162.0" y1="170.0" x2="538.0" y2="170.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="350.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">центральний штовхає значення (поріг, команда)</text>
<text x="80.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">NOTIFY</text>
<line x1="538.0" y1="250.0" x2="162.0" y2="250.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="350.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">периферія САМА штовхає нове значення, без запиту</text>
<text x="350.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700" font-style="italic">notify економить енергію: радіо прокидається лише тоді, коли значення змінилось</text>
</svg>