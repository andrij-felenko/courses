<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="20.0" width="940.0" height="80.0" rx="8" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.2"/>
<text x="500.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія ресурсного запису DNS NAPTR (RFC 3403 / RFC 6116)</text>
<text x="500.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">7.6.5.4.3.2.1.4.4.0.8.3.e164.arpa.  IN  NAPTR  100  10  &quot;u&quot;  &quot;E2U+sip&quot;  &quot;!^\+38044(.*)$!sip:\\1@tel.example.ua!i&quot;  .</text>
<rect x="74.8" y="145.1" width="60.3" height="49.9" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="105.0" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">ORDER</tspan><tspan x="105.0" dy="16.9">100</tspan></text>
<rect x="184.7" y="145.1" width="100.6" height="49.9" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="235.0" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">PREFERENCE</tspan><tspan x="235.0" dy="16.9">10</tspan></text>
<rect x="334.9" y="145.1" width="60.3" height="49.9" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="365.0" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">FLAGS</tspan><tspan x="365.0" dy="16.9">&quot;u&quot;</tspan></text>
<rect x="468.7" y="145.1" width="92.5" height="49.9" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="515.0" y="166.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="515.0" dy="0.0">SERVICES</tspan><tspan x="515.0" dy="16.9">&quot;E2U+sip&quot;</tspan></text>
<rect x="598.6" y="147.3" width="292.8" height="45.3" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="745.0" y="166.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">REGEXP</tspan><tspan x="745.0" dy="14.3">&quot;!^\+38044(.*)$!sip:\1@tel.example.ua!i&quot;</tspan></text>
<rect x="879.1" y="146.2" width="101.8" height="47.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="930.0" y="166.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="930.0" dy="0.0">REPLACEMENT</tspan><tspan x="930.0" dy="15.6">&quot;.&quot;</tspan></text>
<rect x="62.8" y="273.1" width="214.4" height="73.9" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Порядок обробки (16 біт):</tspan><tspan x="170.0" dy="14.3">Менше число виконується першим.</tspan><tspan x="170.0" dy="14.3">Різні order обробляються суворо</tspan><tspan x="170.0" dy="14.3">по черзі, без паралелізму.</tspan></text>
<rect x="44.0" y="403.1" width="252.0" height="73.9" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/><text x="170.0" y="422.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Пріоритет (16 біт):</tspan><tspan x="170.0" dy="14.3">Вага серед записів з однаковим order.</tspan><tspan x="170.0" dy="14.3">Дозволяє балансувати вибір</tspan><tspan x="170.0" dy="14.3">між кількома сервісами.</tspan></text>
<rect x="281.5" y="265.9" width="277.1" height="88.2" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="285.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Прапорець переходу:</tspan><tspan x="420.0" dy="14.3">&quot;u&quot; — термінальне правило (кінцевий URI);</tspan><tspan x="420.0" dy="14.3">&quot;s&quot; — далі шукати SRV-запис;</tspan><tspan x="420.0" dy="14.3">&quot;a&quot; — шукати A/AAAA запис;</tspan><tspan x="420.0" dy="14.3">&quot;&quot; (порожній) — наступний NAPTR.</tspan></text>
<rect x="297.1" y="403.1" width="245.7" height="73.9" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="422.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Специфікація послуги:</tspan><tspan x="420.0" dy="14.3">Префікс E2U (E.164 to URI) +</tspan><tspan x="420.0" dy="14.3">ідентифікатор протоколу (sip, email,</tspan><tspan x="420.0" dy="14.3">voice:sip, h323, tel, pres).</tspan></text>
<rect x="650.9" y="273.1" width="258.3" height="73.9" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="292.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Регулярний вираз підстановки:</tspan><tspan x="780.0" dy="14.3">Формат Sed: !шаблон!заміна!прапорці.</tspan><tspan x="780.0" dy="14.3">Вирізає вхідний номер E.164 і вставляє</tspan><tspan x="780.0" dy="14.3">його в цільовий URI протоколу.</tspan></text>
<rect x="650.9" y="403.1" width="258.3" height="73.9" rx="6" fill="#f8f9fa" stroke="#333333" stroke-width="1.5"/><text x="780.0" y="422.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Поле заміни (FQDN):</tspan><tspan x="780.0" dy="14.3">Для прапорця &quot;u&quot; завжди містить &quot;.&quot;</tspan><tspan x="780.0" dy="14.3">Якщо прапорець не термінальний,</tspan><tspan x="780.0" dy="14.3">вказує наступне доменне ім'я для DDDS.</tspan></text>
