<line x1="930.0" y1="380.0" x2="780.0" y2="380.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="780.0" y1="380.0" x2="780.0" y2="395.0" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
