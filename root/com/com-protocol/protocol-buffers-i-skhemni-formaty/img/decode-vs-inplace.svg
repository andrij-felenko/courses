<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві парадигми: декодування у структури проти прямого доступу</text>
<text x="450.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">NanoPB / Protobuf (Parse &amp; Copy) проти FlatBuffers / Cap'n Proto (Zero-Copy In-Place)</text>
<text x="230.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">NanoPB / Protobuf (Parse &amp; Copy)</text>
<rect x="40.0" y="105.0" width="380.0" height="40.0" rx="4" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/>
<text x="230.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Вхідний байтовий буфер (RX DMA / UART)</text>
<line x1="230.0" y1="145.0" x2="230.0" y2="185.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="120.0" y="185.0" width="220.0" height="36.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="230.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Парсер: varint-цикл + копіювання</text>
<line x1="230.0" y1="221.0" x2="230.0" y2="255.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="255.0" width="380.0" height="80.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="230.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Окрема C-структура в RAM (sizeof = 24 Б)</text>
<text x="55.0" y="300.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">uint32_t ts; float temp; uint8_t status;</text>
<text x="230.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Вимагає подвійної пам'яті (буфер + структура) і такти CPU</text>
<text x="670.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">FlatBuffers / Cap'n Proto (Zero-Copy)</text>
<rect x="480.0" y="105.0" width="380.0" height="40.0" rx="4" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/>
<text x="670.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Вхідний байтовий буфер (RX DMA / Flash)</text>
<line x1="670.0" y1="145.0" x2="670.0" y2="255.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="750.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Зсув за vtable: O(1)</text>
<text x="750.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0 тактів розбору</text>
<rect x="480.0" y="255.0" width="380.0" height="80.0" rx="4" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/>
<text x="670.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Прямий доступ: msg-&gt;temperature()</text>
<text x="495.0" y="300.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#1a1a1a" text-anchor="start">const float *p = (const float*)(buf + off);</text>
<text x="670.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">0 байтів додаткової RAM, читання прямо з буфера</text>
<rect x="40.0" y="360.0" width="820.0" height="130.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="393.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Критерій порівняння              | NanoPB (Protobuf)               | FlatBuffers (Zero-Copy)</tspan><tspan x="450.0" dy="14.3">---------------------------------|---------------------------------|---------------------------------</tspan><tspan x="450.0" dy="14.3">Додаткова RAM для читання        | Розмір C-структури (20..200 Б)  | 0 байтів (читання на місці)</tspan><tspan x="450.0" dy="14.3">Час доступу до 1 поля            | Повний розбір усього пакета     | O(1) за індексом у vtable</tspan><tspan x="450.0" dy="14.3">Розмір на дроті (Wire size)      | Мінімальний (varint-пакування)  | На 20..50% більший (вирівнювання)</tspan><tspan x="450.0" dy="14.3">Придатність для Flash/ROM прямо  | Ні (потрібна десеріалізація)    | Так (читання прямо з адрес Flash)</tspan></text>
</svg>