<text x="450.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Відображення знакових чисел на беззнакові цілі: (n &lt;&lt; 1) ^ (n &gt;&gt; 31)</text>
