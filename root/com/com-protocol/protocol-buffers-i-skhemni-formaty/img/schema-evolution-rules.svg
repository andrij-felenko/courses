<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схемна еволюція: пряма і зворотна сумісність у часі</text>
<text x="450.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Як старі та нові вузли обмінюються даними без збоїв і без втрати пам'яті</text>
<rect x="50.0" y="75.0" width="380.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/>
<text x="240.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Пряма сумісність (Forward Compatibility)</text>
<text x="240.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Старий читач (v1) ← Новий відправник (v2)</text>
<text x="70.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Новий вузол надсилає додаткове поле (тег 3).</text>
<text x="70.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Старий вузол бачить незнайомий тег 3 і wire type.</text>
<text x="70.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Читач пропускає поле за правилами wire type.</text>
<text x="70.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">• Поля 1 і 2 прочитано успішно; збою немає.</text>
<rect x="470.0" y="75.0" width="380.0" height="160.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/>
<text x="660.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Зворотна сумісність (Backward Compatibility)</text>
<text x="660.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Новий читач (v2) ← Старий відправник (v1)</text>
<text x="490.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Старий вузол надсилає лише поля 1 і 2.</text>
<text x="490.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• У схемі v2 є поле 3, але в потоці воно відсутнє.</text>
<text x="490.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Читач підставляє значення за замовчуванням (0/empty).</text>
<text x="490.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">• Відсутність 'required' у proto3 рятує парсер.</text>
<text x="40.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Критичні порушення: що ламає сумісність назавжди</text>
<rect x="50.0" y="271.0" width="210.0" height="28.0" rx="4" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="288.9" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Зміна номера поля</text>
<text x="275.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Поле перейменовано з тега 2 на тег 4 → старі вузли не побачать значення взагалі.</text>
<rect x="50.0" y="307.0" width="210.0" height="28.0" rx="4" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="324.9" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Повторне використання тега</text>
<text x="275.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Видалили поле 3 (int32) і призначили тег 3 для string url → старі вузли розберуть байти як сміття.</text>
<rect x="50.0" y="343.0" width="210.0" height="28.0" rx="4" fill="#fdecea" stroke="#333333" stroke-width="1.5"/><text x="155.0" y="360.9" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Зміна wire type</text>
<text x="275.0" y="361.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Перехід з int32 (wire 0) на fixed32 (wire 5) або string (wire 2) призводить до синтаксичної помилки розбору.</text>
<rect x="40.0" y="405.0" width="820.0" height="85.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/><text x="450.0" y="429.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Захист від повторного використання: директива reserved у .proto-файлі</tspan><tspan x="450.0" dy="14.3">reserved 3, 7 to 10;          // забороняє компілятору призначати ці номери новим полям</tspan><tspan x="450.0" dy="14.3">reserved &quot;old_humidity&quot;;       // забороняє використання старого імені поля у JSON-відображеннях</tspan><tspan x="450.0" dy="14.3">Правило: видалене поле назавжди резервується і ніколи не передається іншим типам даних.</tspan></text>
</svg>