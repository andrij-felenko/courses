<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 960 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="960" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Внутрішня будова FlatBuffers: зв'язок vtable і Table</text>
<text x="450.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Зворотне зміщення до vtable, карта полів та зміщення непрямого доступу</text>
<text x="220.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">vtable (Таблиця віртуальних зсувів)</text>
<rect x="60.0" y="103.0" width="260.0" height="30.0" rx="3" fill="#eaf6ee" stroke="#333333" stroke-width="1.2"/>
<text x="190.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">vtable_size = 8</text>
<text x="350.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">2 Б</text>
<rect x="60.0" y="137.0" width="260.0" height="30.0" rx="3" fill="#eaf6ee" stroke="#333333" stroke-width="1.2"/>
<text x="190.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">object_size = 12</text>
<text x="350.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">2 Б</text>
<rect x="60.0" y="171.0" width="260.0" height="30.0" rx="3" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/>
<text x="190.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">offset(поле 0: id) = 4</text>
<text x="350.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">2 Б</text>
<rect x="60.0" y="205.0" width="260.0" height="30.0" rx="3" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/>
<text x="190.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">offset(поле 1: temp) = 8</text>
<text x="350.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">2 Б</text>
<text x="640.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Table Data (Тіло об'єкта в буфері)</text>
<rect x="480.0" y="103.0" width="280.0" height="34.0" rx="3" fill="#fdecea" stroke="#333333" stroke-width="1.2"/>
<text x="620.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">vtable_offset = -20</text>
<text x="790.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">4 Б (відносний зсув назад)</text>
<rect x="480.0" y="143.0" width="280.0" height="34.0" rx="3" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/>
<text x="620.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">id = 42</text>
<text x="790.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">4 Б (uint32_t за зміщенням +4)</text>
<rect x="480.0" y="183.0" width="280.0" height="34.0" rx="3" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/>
<text x="620.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">temp = 23.5</text>
<text x="790.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">4 Б (float за зміщенням +8)</text>
<line x1="480.0" y1="120.0" x2="320.0" y2="120.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">зсув назад до vtable (-20 байтів)</text>
<line x1="320.0" y1="205.0" x2="480.0" y2="200.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="400.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">vtable каже: temp лежить за зсувом +8</text>
<rect x="50.0" y="270.0" width="800.0" height="100.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/><text x="450.0" y="295.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Як обробляються поля за замовчуванням і нові поля:</tspan><tspan x="450.0" dy="14.3">1. Якщо поле дорівнює значенню за замовчуванням, FlatBufferBuilder записує offset = 0 у vtable.</tspan><tspan x="450.0" dy="14.3">2. Поле НЕ займає жодного байта в Table Data (економія пам'яті).</tspan><tspan x="450.0" dy="14.3">3. Якщо читач звертається до нового поля, якого немає у старій vtable (номер &gt; vtable_size),</tspan><tspan x="450.0" dy="14.3">   генерований код миттєво повертає дефолтне значення без звернення до пам'яті.</tspan></text>
<rect x="50.0" y="395.0" width="800.0" height="95.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="424.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Розкладка буфера FlatBuffers у пам'яті (будується з кінця до початку):</tspan><tspan x="450.0" dy="14.3">[Зсув до кореня: 4 Б] → [Вектори / Рядки] → [vtable: 8 Б] → [Table Data: 12 Б (Корінь)]</tspan><tspan x="450.0" dy="14.3">Перші 4 байти буфера завжди містять uoffset_t (зсув до головного кореневого об'єкта).</tspan><tspan x="450.0" dy="14.3">Перевірка цілісності виконується класом flatbuffers::Verifier (захист від зациклень і виходу за межі).</tspan></text>
</svg>