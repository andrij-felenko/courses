<rect x="40.0" y="445.0" width="820.0" height="52.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.5"/><text x="450.0" y="467.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Поля з номерами 1..15 укладають тег у 1 байт ((15 &lt;&lt; 3) | 7 = 127). Номери 16..2047 потребують 2 байти.</tspan><tspan x="450.0" dy="14.3">Правило: найчастіші поля телеметрії отримують номери 1..15 для максимальної щільності потоку.</tspan></text>
