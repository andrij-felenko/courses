<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Керуєш по застарілій картинці: апарат уже далі, ніж на екрані</text>
<line x1="60.0" y1="150.0" x2="660.0" y2="150.0" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 5"/>
<line x1="620.0" y1="150.0" x2="670.0" y2="150.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="670.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">курс</text>
<circle cx="250.0" cy="150.0" r="16.0" fill="#e9ecef" stroke="#6b7280" stroke-width="2.0"/>
<text x="250.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">на екрані</text>
<text x="250.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">(де БУВ)</text>
<circle cx="470.0" cy="150.0" r="16.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.4"/>
<text x="470.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">насправді</text>
<text x="470.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">(де Є)</text>
<line x1="250.0" y1="98.0" x2="250.0" y2="106.0" stroke="#1a1a1a" stroke-width="1.0"/>
<line x1="470.0" y1="98.0" x2="470.0" y2="106.0" stroke="#1a1a1a" stroke-width="1.0"/>
<line x1="250.0" y1="102.0" x2="470.0" y2="102.0" stroke="#c0392b" stroke-width="1.6"/>
<text x="360.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">за 100 мс @ 20 м/с ≈ 2 м наосліп</text>
<text x="360.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">пілот виправляє застаріле → апарат проскакує → розгойдування</text>
</svg>