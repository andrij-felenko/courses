<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стояти й чекати проти кроку на наявний байт</text>
<text x="60.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Блокуючий: while(!available());</text>
<rect x="60.0" y="78.0" width="432.0" height="40.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="276.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">цикл очікування байта — процесор зайнятий ТІЛЬКИ цим</text>
<rect x="504.0" y="78.0" width="80.0" height="40.0" rx="6" fill="#f0f0f0" stroke="#6b7280" stroke-width="1.3"/><text x="544.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="544.0" dy="0.0">ПІД</tspan><tspan x="544.0" dy="13.0">(стоїть)</tspan></text>
<rect x="596.0" y="78.0" width="80.0" height="40.0" rx="6" fill="#f0f0f0" stroke="#6b7280" stroke-width="1.3"/><text x="636.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="636.0" dy="0.0">дисплей</tspan><tspan x="636.0" dy="13.0">(стоїть)</tspan></text>
<text x="60.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">поки байт не прийде — усі інші задачі заморожені</text>
<text x="60.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Неблокуючий: if(available()) feed(read());</text>
<rect x="60.0" y="210.0" width="140.0" height="40.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="130.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle"><tspan x="130.0" dy="0.0">feed</tspan><tspan x="130.0" dy="13.0">байта</tspan></text>
<rect x="210.0" y="210.0" width="140.0" height="40.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="280.0" y="233.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">ПІД</tspan></text>
<line x1="191.0" y1="230.0" x2="209.0" y2="230.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="360.0" y="210.0" width="140.0" height="40.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="430.0" y="233.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">дисплей</tspan></text>
<line x1="341.0" y1="230.0" x2="359.0" y2="230.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="510.0" y="210.0" width="140.0" height="40.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="580.0" y="233.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">телеметрія</tspan></text>
<line x1="491.0" y1="230.0" x2="509.0" y2="230.0" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="60.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">обробляє той байт, що вже є, і одразу віддає керування циклу</text>
</svg>