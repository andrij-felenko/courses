<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формат бітів Opcode та компонування кадрів ATT PDU</text>
<text x="60.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Структура байта Opcode (Command &amp; Auth прапорці):</text>
<rect x="60.0" y="52.0" width="150.0" height="38.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="135.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Біт 7: Command Flag</text>
<text x="135.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0 = Request/Rsp, 1 = Cmd</text>
<rect x="218.0" y="52.0" width="170.0" height="38.0" rx="4" fill="#fff4e6" stroke="#d97706" stroke-width="1.5"/>
<text x="303.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">Біт 6: Auth Signature</text>
<text x="303.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1 = підписано 12-байт MAC</text>
<rect x="396.0" y="52.0" width="384.0" height="38.0" rx="4" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="588.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Біти 5..0: ATT Method (Номер операції)</text>
<text x="588.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0x02 = Exchange MTU, 0x0A = Read, 0x12 = Write...</text>
<text x="60.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Приклад кадру Write Request у буфері каналу L2CAP (CID 0x0004):</text>
<rect x="60.0" y="155.0" width="155.0" height="48.0" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="137.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">L2CAP Header (4 B)</text>
<text x="137.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Len (2 B) + CID 0x0004</text>
<rect x="222.0" y="155.0" width="115.0" height="48.0" rx="4" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="279.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Opcode (1 B)</text>
<text x="279.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle">0x12 (Write Req)</text>
<rect x="344.0" y="155.0" width="145.0" height="48.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="416.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Handle (2 B)</text>
<text x="416.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">0x0003 (Little-Endian)</text>
<rect x="496.0" y="155.0" width="284.0" height="48.0" rx="4" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="638.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9333ea" text-anchor="middle" font-weight="700">Attribute Value (0 .. MTU − 3 B)</text>
<text x="638.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Корисне навантаження запису</text>
<line x1="222.0" y1="213.0" x2="780.0" y2="213.0" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="222.0" y1="209.0" x2="222.0" y2="217.0" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="780.0" y1="209.0" x2="780.0" y2="217.0" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="501.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повний ATT PDU = макс. ATT_MTU (за замовчуванням 23 байти)</text>
</svg>