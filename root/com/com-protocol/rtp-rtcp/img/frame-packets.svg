<text x="50.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">усі пакети одного кадру несуть ту саму мітку часу — це один момент показу</text>
