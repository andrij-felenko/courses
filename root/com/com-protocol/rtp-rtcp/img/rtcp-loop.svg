<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="40.0" y="92.0" width="190.0" height="268.0" rx="6" fill="#eaf6ee" stroke="#333333" stroke-width="1.5"/><text x="135.0" y="221.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">джерело</tspan><tspan x="135.0" dy="18.2">(відправник)</tspan></text>
<rect x="650.0" y="92.0" width="190.0" height="268.0" rx="6" fill="#eaf6ee" stroke="#333333" stroke-width="1.5"/><text x="745.0" y="230.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">приймач</tspan></text>
<text x="440.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">RTP: пакети медіа — seq, timestamp, PT, SSRC</text>
<line x1="246.0" y1="158.0" x2="634.0" y2="158.0" stroke="#27ae60" stroke-width="2.6" marker-end="url(#arrow)"/>
<line x1="634.0" y1="236.0" x2="246.0" y2="236.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="440.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">RTCP RR: частка втрат, джитер, LSR і DLSR</text>
<line x1="246.0" y1="316.0" x2="634.0" y2="316.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="440.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">RTCP SR: скільки надіслано + пара «час NTP ↔ мітка RTP»</text>
<text x="40.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">RR каже відправникові те, чого той не бачить сам: скільки пакетів дійшло,</text>
<text x="40.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">наскільки нерівно вони приходили і скільки триває оберт туди-назад.</text>
<text x="40.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">SR дає приймачеві єдиний місток між годинником медіа й справжнім часом.</text>
</svg>