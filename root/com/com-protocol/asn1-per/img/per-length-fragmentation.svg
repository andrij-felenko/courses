<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Детермінанти довжини та фрагментація великих полів у PER</text>
<rect x="20.0" y="20.0" width="1020.0" height="600.0" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="40.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Кодування довжини та механізм фрагментації у PER (ITU-T X.691)</text>
<text x="40.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">Три діапазони довжини: короткий (0..127), середній (128..16K-1) та фрагментований блоками (16K..64K)</text>
<rect x="40.0" y="100.0" width="980.0" height="120.0" rx="8" fill="#eef3fb" stroke="#c8d6ea" stroke-width="1.2"/>
<text x="55.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e50a2" text-anchor="start" font-weight="700">1. Коротка форма (довжина n ∈ [0 .. 127]): 1 октет</text>
<rect x="55.0" y="145.0" width="140.0" height="55.0" rx="6" fill="#ffffff" stroke="#1e50a2" stroke-width="1.5"/><text x="125.0" y="169.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">Біт 7 = 0</tspan><tspan x="125.0" dy="14.3">(ознака короткої)</tspan></text>
<rect x="205.0" y="145.0" width="260.0" height="55.0" rx="6" fill="#ffffff" stroke="#1e50a2" stroke-width="1.5"/><text x="335.0" y="169.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">Біти 6..0 = n (7 бітів значення довжини)</tspan><tspan x="335.0" dy="13.0">Діапазон: 0 .. 127 елементів</tspan></text>
<rect x="475.0" y="145.0" width="525.0" height="55.0" rx="6" fill="#eefaf1" stroke="#1b813e" stroke-width="1.5"/><text x="737.5" y="176.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="737.5" dy="0.0">Корисні дані: n елементів (символи, октети або елементи списку)</tspan></text>
<rect x="40.0" y="235.0" width="980.0" height="120.0" rx="8" fill="#fdf3e6" stroke="#f0c38c" stroke-width="1.2"/>
<text x="55.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="start" font-weight="700">2. Середня форма (довжина n ∈ [128 .. 16383]): 2 октети (14 бітів)</text>
<rect x="55.0" y="280.0" width="140.0" height="55.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="125.0" y="304.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">Біти 15..14 = 10₂</tspan><tspan x="125.0" dy="14.3">(ознака 2 октетів)</tspan></text>
<rect x="205.0" y="280.0" width="260.0" height="55.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="335.0" y="304.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">Біти 13..0 = n (14 бітів значення)</tspan><tspan x="335.0" dy="14.3">Діапазон: 128 .. 16 383 елементів</tspan></text>
<rect x="475.0" y="280.0" width="525.0" height="55.0" rx="6" fill="#eefaf1" stroke="#1b813e" stroke-width="1.5"/><text x="737.5" y="311.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="737.5" dy="0.0">Корисні дані: n елементів безпосередньо за заголовком</tspan></text>
<rect x="40.0" y="370.0" width="980.0" height="230.0" rx="8" fill="#f8f9fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="55.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c53030" text-anchor="start" font-weight="700">3. Фрагментована форма (довжина n ≥ 16384): блоками по 16K, 32K, 48K або 64K елементів</text>
<text x="55.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Префікс 11₂ + 6 бітів множника m ∈ {1, 2, 3, 4} задають блок розміром m × 16384 (16K..64K). Процес повторюється до залишку &lt; 16K.</text>
<rect x="55.0" y="445.0" width="150.0" height="55.0" rx="6" fill="#ffffff" stroke="#c53030" stroke-width="1.5"/><text x="130.0" y="469.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Префікс 11000100₂</tspan><tspan x="130.0" dy="13.0">(4 × 16K = 64K)</tspan></text>
<rect x="215.0" y="445.0" width="250.0" height="55.0" rx="6" fill="#eefaf1" stroke="#1b813e" stroke-width="1.5"/><text x="340.0" y="469.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Фрагмент 1: 65 536 елементів</tspan><tspan x="340.0" dy="13.0">(перший великий шматок)</tspan></text>
<line x1="475.0" y1="472.0" x2="505.0" y2="472.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="515.0" y="445.0" width="150.0" height="55.0" rx="6" fill="#ffffff" stroke="#c53030" stroke-width="1.5"/><text x="590.0" y="469.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="590.0" dy="0.0">Префікс 11000001₂</tspan><tspan x="590.0" dy="13.0">(1 × 16K = 16K)</tspan></text>
<rect x="675.0" y="445.0" width="220.0" height="55.0" rx="6" fill="#eefaf1" stroke="#1b813e" stroke-width="1.5"/><text x="785.0" y="469.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Фрагмент 2: 16 384 елементів</tspan><tspan x="785.0" dy="13.0">(другий шматок)</tspan></text>
<line x1="905.0" y1="472.0" x2="935.0" y2="472.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="55.0" y="520.0" width="150.0" height="55.0" rx="6" fill="#ffffff" stroke="#1e50a2" stroke-width="1.5"/><text x="130.0" y="544.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Залишок &lt; 16K</tspan><tspan x="130.0" dy="11.7">(наприклад, 0x1F = 31)</tspan></text>
<rect x="215.0" y="520.0" width="250.0" height="55.0" rx="6" fill="#eefaf1" stroke="#1b813e" stroke-width="1.5"/><text x="340.0" y="544.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Фрагмент 3: 31 елемент</tspan><tspan x="340.0" dy="13.0">(коротка форма 0..127)</tspan></text>
<rect x="475.0" y="520.0" width="525.0" height="55.0" rx="6" fill="#eef3fb" stroke="#1e50a2" stroke-width="1.5"/><text x="737.5" y="550.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="737.5" dy="0.0">Кінець потоку: декодер зшиває фрагменти 64K + 16K + 31 = 81 951 елемент без виділення невідомого обсягу пам'яті наперед</tspan></text>
</svg>