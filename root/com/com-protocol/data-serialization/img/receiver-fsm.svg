<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат приймача: збираємо кадр із UART побайтово</text>
<circle cx="140.0" cy="170.0" r="50.0" fill="#eaf0fd" stroke="#333333" stroke-width="2.0"/><text x="140.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">WAIT</text>
<circle cx="400.0" cy="170.0" r="50.0" fill="#eaf6ee" stroke="#333333" stroke-width="2.0"/><text x="400.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">DATA</text>
<circle cx="660.0" cy="170.0" r="50.0" fill="#fdf6e3" stroke="#333333" stroke-width="2.0"/><text x="660.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8860b" text-anchor="middle" font-weight="700">ESC</text>
<line x1="190.0" y1="158.0" x2="350.0" y2="158.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="270.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0x7E → почати кадр</text>
<line x1="450.0" y1="158.0" x2="610.0" y2="158.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="530.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle">0x7D → чекати наступний</text>
<line x1="610.0" y1="186.0" x2="450.0" y2="186.0" stroke="#b8860b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="530.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle">байт XOR 0x20 → у буфер</text>
<line x1="382.0" y1="220.0" x2="418.0" y2="220.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="400.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">звич. байт → у буфер</text>
<line x1="400.0" y1="120.0" x2="400.0" y2="70.0" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="400.0" y1="70.0" x2="140.0" y2="70.0" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="140.0" y1="70.0" x2="140.0" y2="120.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="270.0" y="62.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0x7E → кадр закрито: звірити CRC, віддати</text>
<line x1="400.0" y1="220.0" x2="400.0" y2="286.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="400.0" y1="286.0" x2="140.0" y2="286.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="140.0" y1="286.0" x2="122.0" y2="220.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="270.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">буфер повний → скинути кадр, назад у WAIT</text>
<rect x="80.0" y="410.0" width="740.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="431.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Три стани ловлять усі пастки: WAIT відкидає сміття до першого 0x7E (ресинхронізація);</tspan><tspan x="450.0" dy="14.3">ESC пам'ятає розірваний байт екранування; переповнення скидає кадр, а не псує сусідню пам'ять.</tspan></text>
</svg>