<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Безпека транспорту (TLS) проти безпеки повідомлення (WS-Security)</text>
<rect x="40.0" y="55.0" width="780.0" height="115.0" rx="7" fill="#fffaf9" stroke="#c0392b" stroke-width="1.4"/>
<text x="55.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Рівень транспорту (TLS/HTTPS) — захист від вузла до вузла (Hop-by-Hop)</text>
<rect x="80.0" y="93.0" width="110.0" height="48.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="135.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Клієнт</text>
<rect x="370.0" y="93.0" width="130.0" height="48.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="435.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Шлюз / ESB</text>
<text x="435.0" y="129.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Розшифровує дані</text>
<rect x="670.0" y="93.0" width="110.0" height="48.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="725.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бекенд</text>
<line x1="190.0" y1="117.0" x2="370.0" y2="117.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="280.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">TLS плече 1</text>
<line x1="500.0" y1="117.0" x2="670.0" y2="117.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="585.0" y="109.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">TLS плече 2</text>
<text x="430.0" y="157.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">⚠ Посередник (ESB, проксі, черга MQ) бачить незашифровані банківські реквізити та паролі у відкритому вигляді</text>
<rect x="40.0" y="190.0" width="780.0" height="130.0" rx="7" fill="#f6fbf7" stroke="#27ae60" stroke-width="1.4"/>
<text x="55.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Рівень повідомлення (WS-Security) — наскрізний захист (End-to-End)</text>
<rect x="80.0" y="228.0" width="110.0" height="48.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="135.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Клієнт</text>
<text x="135.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Шифрує / Підписує</text>
<rect x="370.0" y="228.0" width="130.0" height="48.0" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="435.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Шлюз / ESB</text>
<text x="435.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Маршрутизує шифр</text>
<rect x="670.0" y="228.0" width="110.0" height="48.0" rx="5" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="725.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Бекенд</text>
<text x="725.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Перевіряє підпис</text>
<line x1="190.0" y1="252.0" x2="370.0" y2="252.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="500.0" y1="252.0" x2="670.0" y2="252.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="135.0" y1="280.0" x2="725.0" y2="280.0" stroke="#27ae60" stroke-width="1.8" stroke-dasharray="4,4"/>
<text x="430.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Цифровий підпис (XML-Signature) і шифрування (XML-Encryption) зберігаються через черги та шлюзи</text>
<text x="430.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">WS-Security забезпечує неподільність і конфіденційність транзакцій незалежно від кількості проміжних брокерів</text>
</svg>