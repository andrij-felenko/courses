<rect x="34.0" y="185.0" width="235.0" height="140.0" rx="6" fill="#f4f6f8" stroke="#8e44ad" stroke-width="1.2"/><text x="151.5" y="224.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="151.5" dy="0.0">Ідентифікатор джерела (Talker ID):</tspan><tspan x="151.5" dy="13.7">• GP — GPS (США)</tspan><tspan x="151.5" dy="13.7">• GL — ГЛОНАСС</tspan><tspan x="151.5" dy="13.7">• GA — Galileo (ЄС)</tspan><tspan x="151.5" dy="13.7">• GB / BD — BeiDou (КНР)</tspan><tspan x="151.5" dy="13.7">• GN — Комбінований GNSS</tspan></text>
<rect x="285.0" y="185.0" width="245.0" height="140.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.2"/><text x="407.5" y="224.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="407.5" dy="0.0">Формат речення (Formatter):</tspan><tspan x="407.5" dy="13.7">• GGA — координати, фікс, висота</tspan><tspan x="407.5" dy="13.7">• RMC — рекомендований мінімум</tspan><tspan x="407.5" dy="13.7">• GSA — активні супутники, DOP</tspan><tspan x="407.5" dy="13.7">• GSV — видимі супутники, SNR</tspan><tspan x="407.5" dy="13.7">• VTG — швидкість і курс</tspan></text>
<rect x="545.0" y="185.0" width="241.0" height="140.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/><text x="665.5" y="224.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="665.5" dy="0.0">Обмеження стандарту NMEA:</tspan><tspan x="665.5" dy="13.7">• Макс. довжина: 82 символи</tspan><tspan x="665.5" dy="13.7">• Порожні поля: дві коми ,, поспіль</tspan><tspan x="665.5" dy="13.7">• Кодування: 7-бітний ASCII (8-N-1)</tspan><tspan x="665.5" dy="13.7">• Контрольна сума: 2 hex-цифри</tspan><tspan x="665.5" dy="13.7">• Термінатор: 0x0D 0x0A (CR LF)</tspan></text>
