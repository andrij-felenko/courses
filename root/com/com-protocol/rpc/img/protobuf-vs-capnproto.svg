<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння обробки: класичний парсинг (Protobuf) проти Zero-Copy (Cap'n Proto)</text>
<rect x="40.0" y="55.0" width="435.0" height="440.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="257.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Protocol Buffers (Традиційний парсинг)</text>
<rect x="60.0" y="110.0" width="395.0" height="55.0" rx="6" fill="#e4e7ea" stroke="#94a3b8" stroke-width="1.2"/><text x="257.5" y="133.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="257.5" dy="0.0">Мережевий буфер (Wire Bytes)</tspan><tspan x="257.5" dy="15.6">Потік стиснених тегів TLV і Varint</tspan></text>
<line x1="257.0" y1="168.0" x2="257.0" y2="208.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="212.0" width="395.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="257.5" y="240.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="257.5" dy="0.0">Динамічне виділення пам'яті (Heap Allocations)</tspan><tspan x="257.5" dy="15.6">malloc() під кожне вкладене повідомлення,</tspan><tspan x="257.5" dy="15.6">копіювання байтів рядків у std::string/масиви</tspan></text>
<line x1="257.0" y1="295.0" x2="257.0" y2="330.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="334.0" width="395.0" height="75.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/><text x="257.5" y="360.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="257.5" dy="0.0">Дерево C++ / Go об'єктів у купі</tspan><tspan x="257.5" dy="15.6">Звернення до полів через покажчики,</tspan><tspan x="257.5" dy="15.6">кеш-промахи (Cache Misses) під час обходу</tspan></text>
<rect x="60.0" y="425.0" width="395.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="257.5" y="449.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle"><tspan x="257.5" dy="0.0">Ціна: витрати CPU на розкодування Varint,</tspan><tspan x="257.5" dy="14.3">фрагментація купи та затримка виділення</tspan></text>
<rect x="525.0" y="55.0" width="435.0" height="440.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="742.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Cap'n Proto / FlatBuffers (Zero-Copy)</text>
<rect x="545.0" y="110.0" width="395.0" height="55.0" rx="6" fill="#e4e7ea" stroke="#94a3b8" stroke-width="1.2"/><text x="742.5" y="126.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="742.5" dy="0.0">Мережевий буфер (Wire Bytes)</tspan><tspan x="742.5" dy="15.6">Дані вкладені з вирівнюванням слів (64-bit words),</tspan><tspan x="742.5" dy="15.6">покажчики кодують відносні зміщення</tspan></text>
<line x1="742.0" y1="168.0" x2="742.0" y2="186.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="742.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Нуль тактів декодування (0 CPU cycles)</text>
<line x1="742.0" y1="216.0" x2="742.0" y2="238.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="545.0" y="242.0" width="395.0" height="70.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="742.5" y="265.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="742.5" dy="0.0">Безпосереднє читання з буфера (In-place Access)</tspan><tspan x="742.5" dy="15.6">Пряма арифметика покажчиків: base_ptr + offset</tspan><tspan x="742.5" dy="15.6">Жодного виділення пам'яті в купі (0 mallocs)</tspan></text>
<line x1="742.0" y1="314.0" x2="742.0" y2="350.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="545.0" y="354.0" width="395.0" height="60.0" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.2"/><text x="742.5" y="372.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="742.5" dy="0.0">O(1) прямий доступ до будь-якого поля</tspan><tspan x="742.5" dy="15.6">Ідеальна локальність процесорного кешу L1/L2,</tspan><tspan x="742.5" dy="15.6">читання лише тих полів, які дійсно потрібні</tspan></text>
<rect x="545.0" y="425.0" width="395.0" height="55.0" rx="6" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.2"/><text x="742.5" y="449.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="742.5" dy="0.0">Компроміс: трохи більший розмір у дроті</tspan><tspan x="742.5" dy="14.3">через вирівнювання (без стиснення Varint)</tspan></text>
</svg>