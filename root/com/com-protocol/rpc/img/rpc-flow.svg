<rect x="560.0" y="305.0" width="195.0" height="80.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="657.5" y="327.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="657.5" dy="0.0">4. Серверний</tspan><tspan x="657.5" dy="14.3">транспорт</tspan><tspan x="657.5" dy="14.3">Прийом кадру з мережі,</tspan><tspan x="657.5" dy="14.3">перевірка дедлайну</tspan></text>
