<rect x="45.0" y="185.0" width="195.0" height="80.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="142.5" y="207.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="142.5" dy="0.0">2. Клієнтський стаб</tspan><tspan x="142.5" dy="14.3">(Client Stub)</tspan><tspan x="142.5" dy="14.3">Маршалінг у байти,</tspan><tspan x="142.5" dy="14.3">призначення Call-ID</tspan></text>
<rect x="45.0" y="305.0" width="195.0" height="80.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/><text x="142.5" y="327.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="142.5" dy="0.0">3. Клієнтський</tspan><tspan x="142.5" dy="14.3">транспорт</tspan><tspan x="142.5" dy="14.3">Кадрування повідомлення,</tspan><tspan x="142.5" dy="14.3">відправка в сокет</tspan></text>
