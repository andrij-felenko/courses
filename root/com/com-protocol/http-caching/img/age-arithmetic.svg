<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 452" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="452" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звідки береться current_age: дві оцінки, беремо більшу</text>
<line x1="60.0" y1="178.0" x2="890.0" y2="178.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="90.0" y1="170.0" x2="90.0" y2="186.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="90.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="90.0" dy="0.0">Date: 09:00:00</tspan><tspan x="90.0" dy="15.0">відповідь створив origin</tspan></text>
<line x1="545.0" y1="170.0" x2="545.0" y2="186.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="545.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="545.0" dy="0.0">upstream відправив,</tspan><tspan x="545.0" dy="15.0">Age: 240</tspan></text>
<line x1="855.0" y1="170.0" x2="855.0" y2="186.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="855.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="855.0" dy="0.0">now</tspan><tspan x="855.0" dy="15.0">resident_time = 60 c</tspan></text>
<line x1="400.0" y1="170.0" x2="400.0" y2="186.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="400.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">request_time</tspan><tspan x="400.0" dy="15.0">ми надіслали запит</tspan></text>
<line x1="665.0" y1="170.0" x2="665.0" y2="186.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="665.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="665.0" dy="0.0">response_time</tspan><tspan x="665.0" dy="15.0">відповідь у нас, 09:04:07</tspan></text>
<line x1="400.0" y1="254.0" x2="665.0" y2="254.0" stroke="#b08900" stroke-width="1.8"/>
<line x1="400.0" y1="248.0" x2="400.0" y2="260.0" stroke="#b08900" stroke-width="1.8"/>
<line x1="665.0" y1="248.0" x2="665.0" y2="260.0" stroke="#b08900" stroke-width="1.8"/>
<text x="532.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle">response_delay = 5 c</text>
<rect x="20.0" y="306.0" width="900.0" height="128.0" rx="10" fill="#fbfbfb" stroke="#2457d6" stroke-width="1.6"/>
<text x="44.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">apparent_age = 09:04:07 − 09:00:00 = 247 c        (наш годинник спішить на 2 c)</text>
<text x="44.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">corrected_age_value = Age + response_delay = 240 + 5 = 245 c</text>
<text x="44.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">corrected_initial_age = max(247, 245) = 247 c     ← беремо БІЛЬШУ оцінку</text>
<text x="44.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">current_age = 247 + 60 = 307 c                    → при max-age=300 прострочено на 7 c</text>
</svg>