<rect x="685.0" y="96.0" width="150.0" height="243.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="695.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">JSON (Відповідь)</text>
