<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння отримання даних: каскад REST проти одного запиту GraphQL</text>
<rect x="30.0" y="52.0" width="395.0" height="345.0" rx="8" fill="#fdfdfd" stroke="#333333" stroke-width="1.2"/>
<text x="227.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">REST: три послідовні виклики та зайві поля</text>
<rect x="45.0" y="96.0" width="365.0" height="75.0" rx="6" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.2"/>
<text x="55.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">1. GET /users/42</text>
<text x="55.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Потрібно: name</text>
<text x="55.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Отримано: { id, name, email, address, phone, regDate, ... } (28 полів!)</text>
<rect x="45.0" y="180.0" width="365.0" height="75.0" rx="6" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.2"/>
<text x="55.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">2. GET /users/42/posts</text>
<text x="55.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Потрібно: id, title</text>
<text x="55.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Отримано: [{ id, title, body, slug, tags, views, ... }, ...] (надлишок)</text>
<rect x="45.0" y="264.0" width="365.0" height="75.0" rx="6" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.2"/>
<text x="55.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">3. GET /posts/101/commentsCount</text>
<text x="55.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Потрібно: кількість коментарів</text>
<text x="55.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Немає окремого лічильника: качаємо всі коментарі (under-fetching)</text>
<text x="227.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Підсумок: 3 мережеві затримки (RTT) + 85% зайвого трафіку</text>
<rect x="455.0" y="52.0" width="395.0" height="345.0" rx="8" fill="#fdfdfd" stroke="#333333" stroke-width="1.2"/>
<text x="652.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">GraphQL: єдиний запит за точною структурою</text>
<rect x="470.0" y="96.0" width="180.0" height="243.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
<text x="480.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">POST /graphql (Запит)</text>
<text x="480.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">query {</text>
<text x="480.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">  user(id: 42) {</text>
