<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двійкове кодування LwM2M TLV: структура байта Type та полів</text>
<text x="97.5" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Bit 7</text>
<text x="192.5" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Bit 6</text>
<text x="287.5" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Bit 5</text>
<text x="382.5" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Bit 4</text>
<text x="477.5" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Bit 3</text>
<text x="572.5" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Bit 2</text>
<text x="667.5" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Bit 1</text>
<text x="762.5" y="57.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Bit 0</text>
<rect x="50.0" y="65.0" width="190.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="145.0" y="87.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Тип ідентифікатора</tspan><tspan x="145.0" dy="14.3">(Bits 7-6, 2 біти)</tspan></text>
<rect x="240.0" y="65.0" width="95.0" height="52.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="287.5" y="87.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="287.5" dy="0.0">ID Len</tspan><tspan x="287.5" dy="14.3">(Bit 5)</tspan></text>
<rect x="335.0" y="65.0" width="190.0" height="52.0" rx="6" fill="#fbeee6" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="87.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Тип довжини</tspan><tspan x="430.0" dy="14.3">(Bits 4-3, 2 біти)</tspan></text>
<rect x="525.0" y="65.0" width="285.0" height="52.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="667.5" y="87.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="667.5" dy="0.0">Довжина значення (Bits 2-0, 3 біти)</tspan><tspan x="667.5" dy="13.7">(0..7 байтів, якщо Bits 4-3 = 00)</tspan></text>
<rect x="50.0" y="135.0" width="180.0" height="95.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="140.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Bits 7-6 (Тип):</tspan><tspan x="140.0" dy="13.0">00 = Object Instance</tspan><tspan x="140.0" dy="13.0">01 = Resource Instance</tspan><tspan x="140.0" dy="13.0">10 = Multiple Resource</tspan><tspan x="140.0" dy="13.0">11 = Resource with Value</tspan></text>
<rect x="243.0" y="135.0" width="180.0" height="95.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="333.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="333.0" dy="0.0">Bit 5 (Довжина ID):</tspan><tspan x="333.0" dy="13.0">0 = 8-бітний ID (1 байт)</tspan><tspan x="333.0" dy="13.0">1 = 16-бітний ID (2 байти)</tspan></text>
<rect x="436.0" y="135.0" width="180.0" height="95.0" rx="6" fill="#fbeee6" stroke="#c0392b" stroke-width="1.5"/><text x="526.0" y="161.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="526.0" dy="0.0">Bits 4-3 (Тип Length):</tspan><tspan x="526.0" dy="12.3">00 = довжина у Bits 2-0</tspan><tspan x="526.0" dy="12.3">01 = поле Length 8 бітів</tspan><tspan x="526.0" dy="12.3">10 = поле Length 16 бітів</tspan><tspan x="526.0" dy="12.3">11 = поле Length 24 біти</tspan></text>
<rect x="629.0" y="135.0" width="180.0" height="95.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="719.0" y="161.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="719.0" dy="0.0">Bits 2-0 (Значення):</tspan><tspan x="719.0" dy="12.3">Якщо Bits 4-3 == 00,</tspan><tspan x="719.0" dy="12.3">задає довжину Value</tspan><tspan x="719.0" dy="12.3">від 0 до 7 байтів прямо</tspan><tspan x="719.0" dy="12.3">у байті заголовка Type</tspan></text>
<text x="430.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність полів у бінарному потоці TLV</text>
<rect x="50.0" y="265.0" width="136.8" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="118.4" y="288.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="118.4" dy="0.0">Type (1 байт)</tspan><tspan x="118.4" dy="11.7">Бітова маска прапорців</tspan></text>
<rect x="186.8" y="265.0" width="167.2" height="52.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="270.4" y="288.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.4" dy="0.0">Identifier (1 або 2 байти)</tspan><tspan x="270.4" dy="11.7">Resource ID або Instance ID</tspan></text>
<rect x="354.0" y="265.0" width="167.2" height="52.0" rx="6" fill="#fbeee6" stroke="#c0392b" stroke-width="1.5"/><text x="437.6" y="288.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="437.6" dy="0.0">Length (0, 1, 2 або 3 байти)</tspan><tspan x="437.6" dy="11.7">Відсутнє, якщо довжина &lt;= 7</tspan></text>
<rect x="521.2" y="265.0" width="288.8" height="52.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="665.6" y="288.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="665.6" dy="0.0">Value (L байтів)</tspan><tspan x="665.6" dy="12.3">Ціле, Float, String, Boolean або вкладений TLV</tspan></text>
<rect x="84.6" y="324.5" width="690.9" height="31.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="430.0" y="343.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Компактність: для числових ресурсів із ID &lt; 256 та довжиною &lt;= 7 заголовок займає лише 2 байти (Type + ID).</tspan></text>
</svg>