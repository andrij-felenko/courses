<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="80.0" width="210.0" height="280.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="135.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">1. Клієнтський код</text>
<line x1="45.0" y1="125.0" x2="225.0" y2="125.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="135.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">CoCreateInstance(</text>
<text x="135.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">  CLSID_Calculator,</text>
<text x="135.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">  CLSCTX_INPROC,</text>
<text x="135.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">  IID_ICalculator,</text>
<text x="135.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">  (void**)&amp;pCalc);</text>
<text x="135.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">Отримує готовий</text>
<text x="135.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">вказівник pCalc</text>
<rect x="280.0" y="40.0" width="240.0" height="160.0" rx="8" fill="#fbf4db" stroke="#333333" stroke-width="1.8"/>
<text x="400.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Реєстр Windows (COM SCM)</text>
<line x1="295.0" y1="78.0" x2="505.0" y2="78.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="400.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">HKCR\CLSID\{...}</text>
<text x="400.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">InprocServer32 = calc.dll</text>
<text x="400.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ThreadingModel = Apartment</text>
<text x="400.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Локалізація DLL за GUID</text>
<rect x="280.0" y="240.0" width="240.0" height="160.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="400.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Динамічна бібліотека</text>
<line x1="295.0" y1="278.0" x2="505.0" y2="278.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="400.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">LoadLibrary(&quot;calc.dll&quot;)</text>
<text x="400.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">GetProcAddress(</text>
<text x="400.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">  &quot;DllGetClassObject&quot;)</text>
<text x="400.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Отримання фабрики</text>
<rect x="560.0" y="120.0" width="220.0" height="220.0" rx="8" fill="#fbf4db" stroke="#27ae60" stroke-width="2.0"/>
<text x="670.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">4. IClassFactory</text>
<line x1="575.0" y1="165.0" x2="765.0" y2="165.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="670.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">CreateInstance(</text>
<text x="670.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">  pUnkOuter, IID, ppv)</text>
<text x="670.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Створює екземпляр через</text>
<text x="670.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">оператор new у пам'яті DLL</text>
<text x="670.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">LockServer(BOOL fLock)</text>
<rect x="820.0" y="120.0" width="190.0" height="220.0" rx="8" fill="#e8f6ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="915.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">5. Екземпляр CCalc</text>
<line x1="835.0" y1="165.0" x2="995.0" y2="165.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="915.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">vptr -&gt; vtable</text>
<text x="915.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">m_refCount = 1</text>
<text x="915.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">QueryInterface(</text>
<text x="915.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">  IID_ICalculator)</text>
<text x="915.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Повернення клієнту</text>
<line x1="240.0" y1="140.0" x2="280.0" y2="120.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="400.0" y1="200.0" x2="400.0" y2="240.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="520.0" y1="320.0" x2="560.0" y2="260.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="780.0" y1="230.0" x2="820.0" y2="230.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="820.0" y1="300.0" x2="240.0" y2="300.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="30.0" y="430.0" width="980.0" height="95.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="520.0" y="466.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Повний життєвий цикл активації:</tspan><tspan x="520.0" dy="15.6">1. Клієнт звертається за CLSID → 2. SCM знаходить шлях до DLL у реєстрі → 3. SCM вантажить DLL та викликає DllGetClassObject →</tspan><tspan x="520.0" dy="15.6">4. Фабрика IClassFactory виділяє пам'ять об'єкта → 5. Інтерфейсний вказівник повертається клієнту, а фабрика звільняється.</tspan></text>
</svg>