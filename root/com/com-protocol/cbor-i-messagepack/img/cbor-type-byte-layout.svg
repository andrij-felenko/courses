<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="960.0" height="520.0" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="40.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700">Анатомія початкового байта CBOR (RFC 8949)</text>
<text x="40.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start">8 бітів заголовка: 3 біти старшого типу (Major Type) + 5 бітів додаткової інформації (Additional Info)</text>
<rect x="40.0" y="100.0" width="320.0" height="70.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="200.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e40af" text-anchor="middle" font-weight="700">Major Type (3 біти)</text>
<text x="200.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle">Біти 7 .. 5: значення 0 .. 7</text>
<rect x="370.0" y="100.0" width="590.0" height="70.0" rx="6" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="665.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b21a8" text-anchor="middle" font-weight="700">Additional Information (5 бітів)</text>
<text x="665.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b21a8" text-anchor="middle">Біти 4 .. 0: пряме значення (0..23), формат розширення (24..27) або маркер (31)</text>
<rect x="40.0" y="190.0" width="420.0" height="330.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="60.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">8 головних типів даних (Major Types 0..7)</text>
<rect x="55.0" y="236.0" width="160.0" height="26.0" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
<text x="135.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">0: Unsigned Integer</text>
<text x="225.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">uint: 0 .. 2^64 - 1</text>
<rect x="55.0" y="270.0" width="160.0" height="26.0" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
<text x="135.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0284c7" text-anchor="middle" font-weight="700">1: Negative Integer</text>
<text x="225.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">int: -1 - n (-1 .. -2^64)</text>
<rect x="55.0" y="304.0" width="160.0" height="26.0" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
<text x="135.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#059669" text-anchor="middle" font-weight="700">2: Byte String</text>
<text x="225.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">bstr: сирий масив байтів (довжина L)</text>
<rect x="55.0" y="338.0" width="160.0" height="26.0" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="135.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">3: Text String</text>
<text x="225.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">tstr: валідний UTF-8 рядок (довжина L)</text>
<rect x="55.0" y="372.0" width="160.0" height="26.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="135.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">4: Array of items</text>
<text x="225.0" y="389.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">list: масив довільних елементів</text>
<rect x="55.0" y="406.0" width="160.0" height="26.0" rx="4" fill="#ffffff" stroke="#ea580c" stroke-width="1.2"/>
<text x="135.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ea580c" text-anchor="middle" font-weight="700">5: Map of pairs</text>
<text x="225.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">dict: пари ключ-значення (2L елементів)</text>
<rect x="55.0" y="440.0" width="160.0" height="26.0" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="135.0" y="457.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">6: Semantic Tag</text>
<text x="225.0" y="457.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">tag: розширення (дати, UUID, bignum)</text>
<rect x="55.0" y="474.0" width="160.0" height="26.0" rx="4" fill="#ffffff" stroke="#db2777" stroke-width="1.2"/>
<text x="135.0" y="491.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#db2777" text-anchor="middle" font-weight="700">7: Simple / Floats</text>
<text x="225.0" y="491.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">bool, null, float16/32/64, Break</text>
<rect x="480.0" y="190.0" width="480.0" height="330.0" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.2"/>
<text x="500.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b21a8" text-anchor="start" font-weight="700">Шкала розширення довжини (Additional Info)</text>
<rect x="495.0" y="236.0" width="95.0" height="28.0" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="542.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">0 .. 23</text>
<text x="600.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Пряме значення</text>
<text x="600.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Значення 0..23 зберігається в самому заголовку (1 байт разом)</text>
<rect x="495.0" y="274.0" width="95.0" height="28.0" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
<text x="542.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0284c7" text-anchor="middle" font-weight="700">24 (0x18)</text>
<text x="600.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">+1 байт uint8</text>
<text x="600.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Наступний 1 байт несе значення 24 .. 255</text>
<rect x="495.0" y="312.0" width="95.0" height="28.0" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
<text x="542.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">25 (0x19)</text>
<text x="600.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">+2 байти uint16</text>
<text x="600.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Наступні 2 байти несе значення 256 .. 65 535 (Big-Endian)</text>
<rect x="495.0" y="350.0" width="95.0" height="28.0" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="542.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">26 (0x1A)</text>
<text x="600.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">+4 байти uint32</text>
<text x="600.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Наступні 4 байти несе значення до 4 294 967 295 (Big-Endian)</text>
<rect x="495.0" y="388.0" width="95.0" height="28.0" rx="4" fill="#ffffff" stroke="#9333ea" stroke-width="1.2"/>
<text x="542.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9333ea" text-anchor="middle" font-weight="700">27 (0x1B)</text>
<text x="600.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">+8 байтів uint64</text>
<text x="600.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Наступні 8 байтів несе значення до 2^64 - 1 (Big-Endian)</text>
<rect x="495.0" y="426.0" width="95.0" height="28.0" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
<text x="542.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="700">28 .. 30</text>
<text x="600.0" y="439.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Зарезервовано</text>
<text x="600.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Не використовується у стандарті RFC 8949</text>
<rect x="495.0" y="464.0" width="95.0" height="28.0" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
<text x="542.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">31 (0x1F)</text>
<text x="600.0" y="477.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Indefinite length</text>
<text x="600.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Потоковий режим без фіксованої довжини; кінець — маркер 0xFF</text>
</svg>