<text x="675.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#854d0e" text-anchor="start" font-weight="700">Властивості Zero-Copy на MCU</text>
<text x="675.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• 0 викликів malloc() і free()</text>
<text x="675.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Немає фрагментації купи</text>
<text x="675.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• O(1) додаткова пам'ять</text>
<text x="675.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Час розбору лінійний від розміру</text>
<text x="675.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">• Валідація довжини на межах буфера</text>
<rect x="40.0" y="425.0" width="920.0" height="75.0" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="55.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Інваріант безпеки:</text>
<text x="55.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Вказівники ptr валідні рівно стільки, скільки живе вхідний rx_buf. Якщо буфер перезаписується новим пакетом DMA,</text>
<text x="55.0" y="488.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">програма зобов'язана або обробити зріз синхронно у перериванні/задачі, або скопіювати лише потрібне поле.</text>
