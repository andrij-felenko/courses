<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий кадр: двома записами й одним</text>
<text x="150.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">заголовок і тіло двома викликами запису</text>
<line x1="150.0" y1="118.0" x2="900.0" y2="118.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="150.0" y1="196.0" x2="900.0" y2="196.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="138.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">відправник</text>
<text x="138.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">приймач</text>
<line x1="180.0" y1="118.0" x2="320.0" y2="196.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="190.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">заголовок 4 Б</text>
<text x="410.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">тіло притримано: є непідтверджені дані</text>
<text x="180.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">прийшло пів кадру — відповідати нічим</text>
<rect x="340.0" y="134.0" width="330.0" height="44.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="505.0" y="160.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="505.0" dy="0.0">пауза ≈40 мс: підтвердження відкладено</tspan></text>
<line x1="690.0" y1="196.0" x2="770.0" y2="118.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="650.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">підтвердження нарешті пішло</text>
<line x1="790.0" y1="118.0" x2="860.0" y2="196.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="770.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">тіло 900 Б</text>
<text x="870.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">кадр цілий</text>
<text x="150.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">заголовок і тіло одним викликом запису</text>
<line x1="150.0" y1="340.0" x2="900.0" y2="340.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="150.0" y1="418.0" x2="900.0" y2="418.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="138.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">відправник</text>
<text x="138.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end">приймач</text>
<line x1="180.0" y1="340.0" x2="320.0" y2="418.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="190.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">кадр цілком, 904 Б</text>
<line x1="380.0" y1="418.0" x2="520.0" y2="340.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="340.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">кадр цілий одразу — є що відповісти</text>
<rect x="570.0" y="356.0" width="300.0" height="44.0" rx="6" fill="#e8f6ed" stroke="#27ae60" stroke-width="1.4"/><text x="720.0" y="382.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">жодного очікування таймера</tspan></text>
</svg>