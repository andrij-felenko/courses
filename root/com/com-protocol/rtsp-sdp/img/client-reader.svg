<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 522" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="522" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">одна одиниця з керувального сокета: дві гілки, обидві — за довжиною</text>
<rect x="320.0" y="48.0" width="300.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="68.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">зазирнути в один байт</tspan><tspan x="470.0" dy="15.6">(recv із MSG_PEEK)</tspan></text>
<rect x="40.0" y="136.0" width="380.0" height="76.0" rx="6" fill="#fdf6e3" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="162.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">байт «$» → двійковий блок</tspan><tspan x="230.0" dy="15.6">ще три байти обгортки: номер каналу</tspan><tspan x="230.0" dy="15.6">і довжина (16 біт, старший байт перший)</tspan></text>
<rect x="40.0" y="236.0" width="380.0" height="60.0" rx="6" fill="#fdf6e3" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="262.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">прочитати РІВНО «довжина» байтів —</tspan><tspan x="230.0" dy="15.6">це пакет RTP або RTCP</tspan></text>
<rect x="520.0" y="136.0" width="380.0" height="76.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="710.0" y="162.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">будь-який інший байт → текстова відповідь</tspan><tspan x="710.0" dy="15.6">читати рядки, доки не трапиться порожній:</tspan><tspan x="710.0" dy="15.6">це рядок стану й заголовки</tspan></text>
<rect x="520.0" y="236.0" width="380.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="710.0" y="262.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">узяти Content-Length: N</tspan><tspan x="710.0" dy="15.6">(заголовка немає → тіла немає)</tspan></text>
<rect x="520.0" y="320.0" width="380.0" height="60.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.5"/><text x="710.0" y="346.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">прочитати РІВНО N байтів тіла —</tspan><tspan x="710.0" dy="15.6">це SDP</tspan></text>
<line x1="420.0" y1="96.0" x2="240.0" y2="130.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="520.0" y1="96.0" x2="700.0" y2="130.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="230.0" y1="212.0" x2="230.0" y2="232.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="710.0" y1="212.0" x2="710.0" y2="232.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="710.0" y1="296.0" x2="710.0" y2="316.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="408.0" width="860.0" height="88.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="440.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Обидві гілки відлічують стільки байтів, скільки обіцяно, і жодним більше.</tspan><tspan x="470.0" dy="15.6">Зайвий прочитаний байт з'їдає початок наступної одиниці, недочитаний лишається в сокеті</tspan><tspan x="470.0" dy="15.6">й зсуває все подальше — а роздільник шукати нема за чим: «$» вільно трапляється в стисненому відео.</tspan></text>
</svg>