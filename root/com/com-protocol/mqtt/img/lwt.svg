<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 710 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="710" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Last Will &amp; Testament: брокер оголосить, що пристрій помер</text>
<rect x="65.0" y="94.0" width="110.0" height="32.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="120.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">Давач</tspan></text>
<rect x="295.0" y="93.5" width="130.0" height="33.0" rx="6" fill="#f3eafd" stroke="#7c3aed" stroke-width="2.0"/><text x="360.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">Брокер</tspan></text>
<line x1="181.0" y1="98.0" x2="289.0" y2="98.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="240.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">CONNECT + воля:</text>
<text x="240.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">«status = offline»</text>
<rect x="285.0" y="136.5" width="150.0" height="28.0" rx="6" fill="#f4f4f4" stroke="#6b7280" stroke-width="1.3"/><text x="360.0" y="153.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="360.0" dy="0.0">воля напоготові (мовчить)</tspan></text>
<line x1="181.0" y1="124.0" x2="289.0" y2="124.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="6 5"/>
<text x="240.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">✗ зв'язок обірвано раптово</text>
<rect x="535.0" y="87.9" width="130.0" height="44.1" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.7"/><text x="600.0" y="106.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Панель</tspan><tspan x="600.0" dy="13.7">диспетчера</tspan></text>
<line x1="431.0" y1="110.0" x2="529.0" y2="110.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="480.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">PUBLISH «offline»</text>
<text x="480.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">(брокер — від імені давача)</text>
<text x="350.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">ввічливе прощання заповіт скасовує; оголошують лише раптову смерть</text>
