<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія таблиць PSI в MPEG-TS</text>
<text x="40.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Ієрархія та демультиплексування службових таблиць PSI (Program Specific Information)</text>
<rect x="40.0" y="80.0" width="200.0" height="75.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.8"/>
<text x="140.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">PAT (PID 0x0000)</text>
<text x="140.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Program Association Table</text>
<text x="140.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Стартовий якір для всього потоку</text>
<line x1="242.0" y1="105.0" x2="340.0" y2="70.0" stroke="#ef4444" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="242.0" y1="130.0" x2="340.0" y2="180.0" stroke="#ef4444" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="345.0" y="45.0" width="190.0" height="70.0" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="440.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">PMT (Програма 1)</text>
<text x="440.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">PID = 0x0100</text>
<text x="440.0" y="101.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">PCR PID = 0x0101</text>
<rect x="345.0" y="150.0" width="190.0" height="70.0" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text x="440.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b45309" text-anchor="middle" font-weight="700">PMT (Програма 2)</text>
<text x="440.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">PID = 0x0200</text>
<text x="440.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">PCR PID = 0x0201</text>
<line x1="537.0" y1="55.0" x2="620.0" y2="40.0" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="537.0" y1="75.0" x2="620.0" y2="85.0" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="537.0" y1="95.0" x2="620.0" y2="130.0" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="625.0" y="20.0" width="180.0" height="38.0" rx="4" fill="#dbeafe" stroke="#2457d6" stroke-width="1.3"/>
<text x="715.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Відео (H.264) — PID 0x0101</text>
<text x="715.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Stream Type 0x1B</text>
<rect x="625.0" y="65.0" width="180.0" height="38.0" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.3"/>
<text x="715.0" y="81.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#854d0e" text-anchor="middle" font-weight="700">Аудіо (AAC) — PID 0x0102</text>
<text x="715.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Stream Type 0x0F</text>
<rect x="625.0" y="110.0" width="180.0" height="38.0" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.3"/>
<text x="715.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7e22ce" text-anchor="middle" font-weight="700">KLV Телеметрія — PID 0x0103</text>
<text x="715.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Stream Type 0x06 (Data)</text>
<line x1="537.0" y1="175.0" x2="620.0" y2="180.0" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="537.0" y1="195.0" x2="620.0" y2="225.0" stroke="#d97706" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="625.0" y="165.0" width="180.0" height="38.0" rx="4" fill="#dbeafe" stroke="#2457d6" stroke-width="1.3"/>
<text x="715.0" y="181.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Відео Thermal — PID 0x0201</text>
<text x="715.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Stream Type 0x24 (HEVC)</text>
<rect x="625.0" y="210.0" width="180.0" height="38.0" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.3"/>
<text x="715.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7e22ce" text-anchor="middle" font-weight="700">Метадані цілей — PID 0x0202</text>
<text x="715.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Stream Type 0x06 (Data)</text>
<rect x="40.0" y="270.0" width="765.0" height="105.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="55.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Алгоритм пошуку медіапотоків у невідомому TS-потоці:</text>
<text x="55.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">1. Приймач слухає пакети з фіксованим PID 0x0000 і читає таблицю PAT.</text>
<text x="55.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">2. З PAT вибирається номер потрібної програми та дізнається PID відповідної таблиці PMT (наприклад, 0x0100).</text>
<text x="55.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">3. З PMT зчитуються типи дескрипторів та PID елементарних потоків (відео, аудіо, телеметрія) і опорний PCR PID.</text>
<text x="55.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">4. Демодулятор/демультиплексор налаштовує апаратні PID-фільтри на виділені потоки.</text>
</svg>