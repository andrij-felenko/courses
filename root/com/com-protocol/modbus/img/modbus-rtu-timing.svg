<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часові інтервали Modbus RTU: t3.5 (розділювач кадрів) та t1.5 (межа між байтами)</text>
<line x1="60.0" y1="160.0" x2="760.0" y2="160.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="770.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">час</text>
<rect x="80.0" y="110.0" width="200.0" height="45.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="180.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Кадр Modbus RTU №1</text>
<rect x="280.0" y="110.0" width="180.0" height="45.0" rx="4" fill="#fff3cd" stroke="#856404" stroke-width="1.5"/>
<text x="370.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#856404" text-anchor="middle" font-weight="700">Тиша ≥ 3.5 символи (t3.5)</text>
<text x="370.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Маркер межі кадру</text>
<rect x="460.0" y="110.0" width="90.0" height="45.0" rx="4" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="505.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Байт 1..K</text>
<rect x="550.0" y="110.0" width="50.0" height="45.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="575.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">t1.5</text>
<text x="575.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">&lt; 1.5</text>
<rect x="600.0" y="110.0" width="120.0" height="45.0" rx="4" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="660.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Байт K+1..N</text>
<line x1="370.0" y1="160.0" x2="370.0" y2="200.0" stroke="#856404" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="370.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#856404" text-anchor="middle" font-weight="700">t3.5 = 3.5 × (11 біт / бод)</text>
<text x="370.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">На 9600 бод ≈ 4.01 мс; при &gt; 19200 бод зафіксовано 1.75 мс</text>
<line x1="575.0" y1="160.0" x2="575.0" y2="200.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="575.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Пауза &gt; t1.5 всередині кадру — помилка!</text>
<rect x="30.0" y="299.2" width="760.0" height="31.5" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/><text x="410.0" y="319.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Маркування кадрів у Modbus RTU здійснюється часовими інтервалами тиші (без стартового/стопового байта).</tspan></text>
</svg>