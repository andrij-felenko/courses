<line x1="170.0" y1="250.0" x2="465.0" y2="250.0" stroke="#b08900" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="465.0" y1="250.0" x2="760.0" y2="250.0" stroke="#b08900" stroke-width="1.4" stroke-dasharray="3 3"/>
<text x="495.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b08900" text-anchor="middle">GET (сервер тримає відкритим до появи події)</text>
<line x1="760.0" y1="266.0" x2="170.0" y2="266.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="495.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">200 OK + дані -&gt; з'єднання закривається -&gt; новий GET</text>
<rect x="20.0" y="306.0" width="960.0" height="114.0" rx="8" fill="#fbfbfb" stroke="#2457d6" stroke-width="1.8"/>
<text x="36.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">SERVER-SENT EVENTS (SSE)</text>
<text x="36.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Одне відкрите HTTP-з'єднання від сервера до клієнта. Текстовий потік, автоматичне перепідключення, Last-Event-ID.</text>
<rect x="40.0" y="362.0" width="100.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="90.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="90.0" dy="0.0">клієнт</tspan></text>
<rect x="850.0" y="362.0" width="100.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="900.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">сервер</tspan></text>
