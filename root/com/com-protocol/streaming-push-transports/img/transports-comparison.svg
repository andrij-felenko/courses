<text x="722.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">GET (є дані!)</text>
<rect x="20.0" y="180.0" width="960.0" height="114.0" rx="8" fill="#fbfbfb" stroke="#b08900" stroke-width="1.8"/>
<text x="36.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b08900" text-anchor="start" font-weight="700">ДОВГЕ ОПИТУВАННЯ (Long Polling)</text>
<text x="36.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Сервер тримає з'єднання до появи події або таймауту. Затримка низька, але на кожну подію — нове TCP/HTTP з'єднання.</text>
