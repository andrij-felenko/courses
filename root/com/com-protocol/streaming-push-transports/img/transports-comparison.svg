<text x="492.5" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">GET (пусто)</text>
<line x1="620.0" y1="124.0" x2="825.0" y2="124.0" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)"/>
