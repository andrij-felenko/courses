<text x="818.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Таймаут (наприклад, 30 с) без подій</text>
<line x1="800.0" y1="354.0" x2="140.0" y2="366.0" stroke="#9aa0a6" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="470.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">4. 204 No Content (сервер скидає таймаут -&gt; клієнт знову перезапитує)</text>
</svg>