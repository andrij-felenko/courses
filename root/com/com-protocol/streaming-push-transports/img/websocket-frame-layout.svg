<text x="66.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Мінімальний розмір заголовка — лише 2 байти (сервер -&gt; клієнт, довжина &lt; 126 байтів).</text>
<text x="66.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">• Клієнт зобов'язаний маскувати кадри (MASK=1); сервер зобов'язаний відхиляти немасковані кадри клієнта з кодом 1002.</text>
