<rect x="575.0" y="142.0" width="205.0" height="88.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.2"/><text x="677.5" y="173.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="677.5" dy="0.0">Ядро</tspan><tspan x="677.5" dy="16.9">лише поточна версія</tspan><tspan x="677.5" dy="16.9">не знає про старі</tspan></text>
