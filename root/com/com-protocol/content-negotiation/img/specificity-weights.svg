<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 471" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="471" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія специфічності та якісні коефіцієнти (q-value)</text>
<rect x="40.0" y="60.0" width="540.0" height="80.0" rx="6" fill="#f4fcf6" stroke="#27ae60" stroke-width="1.5"/>
<text x="60.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Рівень 4: Повний MIME-тип з параметрами</text>
<text x="60.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Приклад: application/json; version=2; charset=utf-8</text>
<rect x="590.0" y="60.0" width="140.0" height="80.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="660.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Специфічність: 3</tspan></text>
<rect x="740.0" y="60.0" width="160.0" height="80.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="820.0" y="103.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">q = 1.0 (найвищий)</tspan></text>
<rect x="40.0" y="148.0" width="540.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="60.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Рівень 3: Конкретний точний підтип</text>
<text x="60.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Приклад: application/json  або  text/html</text>
<rect x="590.0" y="148.0" width="140.0" height="80.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="660.0" y="191.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Специфічність: 2</tspan></text>
<rect x="740.0" y="148.0" width="160.0" height="80.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="820.0" y="191.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">q = 0.9 (або дефолт 1.0)</tspan></text>
<rect x="40.0" y="236.0" width="540.0" height="80.0" rx="6" fill="#fef9e7" stroke="#b08900" stroke-width="1.5"/>
<text x="60.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b08900" text-anchor="start" font-weight="700">Рівень 2: Діапазон типу з підстановочним знаком</text>
<text x="60.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Приклад: text/*  або  image/*</text>
<rect x="590.0" y="236.0" width="140.0" height="80.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.5"/><text x="660.0" y="279.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b08900" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Специфічність: 1</tspan></text>
<rect x="740.0" y="236.0" width="160.0" height="80.0" rx="6" fill="#ffffff" stroke="#b08900" stroke-width="1.5"/><text x="820.0" y="279.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b08900" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">q = 0.5 (будь-який text/)</tspan></text>
<rect x="40.0" y="324.0" width="540.0" height="80.0" rx="6" fill="#f5f5f5" stroke="#9aa0a6" stroke-width="1.5"/>
<text x="60.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" font-weight="700">Рівень 1: Універсальний підстановочний знак</text>
<text x="60.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Приклад: */*</text>
<rect x="590.0" y="324.0" width="140.0" height="80.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5"/><text x="660.0" y="367.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Специфічність: 0</tspan></text>
<rect x="740.0" y="324.0" width="160.0" height="80.0" rx="6" fill="#ffffff" stroke="#9aa0a6" stroke-width="1.5"/><text x="820.0" y="367.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#9aa0a6" text-anchor="middle" font-weight="700"><tspan x="820.0" dy="0.0">q = 0.1 (запасний для всього)</tspan></text>
<rect x="40.0" y="415.0" width="860.0" height="36.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="470.0" y="437.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Правило RFC 9110: Спершу порівнюється q-коефіцієнт; при однакових q перемагає вища специфічність.</text>
</svg>