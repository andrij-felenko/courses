<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гонітва застарілого з'єднання: перетин клієнтського запиту й серверного FIN</text>
<text x="220.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Клієнт (Пул з'єднань)</text>
<text x="720.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Сервер (Бекенд)</text>
<line x1="220.0" y1="80.0" x2="220.0" y2="340.0" stroke="#333333" stroke-width="1.5"/>
<line x1="720.0" y1="80.0" x2="720.0" y2="340.0" stroke="#333333" stroke-width="1.5"/>
<text x="732.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">1. Спрацював idle-таймаут (30 с)</text>
<text x="732.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">   Сервер надсилає TCP FIN</text>
<text x="208.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end">2. Потік орендує сокет із пулу</text>
<text x="208.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end">   Клієнт викликає send(HTTP_REQ)</text>
<line x1="720.0" y1="135.0" x2="220.0" y2="225.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="480.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">TCP FIN (закриття сервера)</text>
<line x1="220.0" y1="155.0" x2="720.0" y2="245.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="480.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">HTTP POST /api/data (запит клієнта)</text>
<circle cx="470.0" cy="190.0" r="8.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="470.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">!</text>
<text x="732.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">3. Дані на закритому сокеті!</text>
<text x="732.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">   Сервер надсилає TCP RST</text>
<line x1="720.0" y1="275.0" x2="220.0" y2="315.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="480.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">TCP RST (ECONNRESET)</text>
<text x="208.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end">4. Пул бачить помилку на старому сокеті,</text>
<text x="208.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">   прозоро відкриває новий і повторює</text>
</svg>