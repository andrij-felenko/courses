<line x1="816.0" y1="146.0" x2="816.0" y2="153.0" stroke="#c7ccd1" stroke-width="1.0"/>
<line x1="844.0" y1="113.0" x2="844.0" y2="120.0" stroke="#c7ccd1" stroke-width="1.0"/>
