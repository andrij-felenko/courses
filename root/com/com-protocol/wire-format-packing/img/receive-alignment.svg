<rect x="455.0" y="116.0" width="330.0" height="34.0" rx="6" fill="none" stroke="none" stroke-width="0.0"/><text x="620.0" y="137.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="620.0" dy="0.0">заголовок IP: версія, довжина, TTL…</tspan></text>
<text x="454.0" y="101.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6b7280" text-anchor="start">14</text>
