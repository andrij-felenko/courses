<text x="790.0" y="101.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6b7280" text-anchor="start">26</text>
<text x="902.0" y="101.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="11" fill="#6b7280" text-anchor="start">30</text>
<line x1="788.0" y1="158.0" x2="788.0" y2="190.0" stroke="#c0392b" stroke-width="2.0" stroke-dasharray="4 3"/>
<text x="794.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">зсув 26 у буфері</text>
<text x="794.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">26 = 4·6 + 2 → адреса НЕ кратна 4</text>
<rect x="50.0" y="252.0" width="440.0" height="176.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="270.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">✗ приведення покажчика</text>
<text x="70.0" y="306.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1a1a1a" text-anchor="start">const struct ip *h =</text>
<text x="70.0" y="326.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1a1a1a" text-anchor="start">    (const struct ip *)(buf + 14);</text>
<text x="70.0" y="346.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1a1a1a" text-anchor="start">uint32_t s = h-&gt;src;</text>
<text x="70.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">• Cortex-M0/M0+, SPARC → HardFault / SIGBUS</text>
<text x="70.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">• x86 і Cortex-M4 змовчать — і баг доживе до продукту</text>
<text x="70.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">• плюс порядок байтів і падінг усе одно не збігаються</text>
<rect x="510.0" y="252.0" width="440.0" height="176.0" rx="12" fill="#eaf6ee" stroke="#27ae60" stroke-width="2.0"/>
<text x="730.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">✓ читання байтами</text>
<text x="530.0" y="306.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1a1a1a" text-anchor="start">const uint8_t *p = buf + 26;</text>
<text x="530.0" y="326.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1a1a1a" text-anchor="start">uint32_t s = ((uint32_t)p[0] &lt;&lt; 24) |</text>
<text x="530.0" y="346.0" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1a1a1a" text-anchor="start">   (p[1]&lt;&lt;16) | (p[2]&lt;&lt;8) | p[3];</text>
<text x="530.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">• жодного вирівнювання не потрібно</text>
<text x="530.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">• порядок байтів заданий явно, а не успадкований</text>
<text x="530.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start">• компілятор із -O2 згортає це в одну команду завантаження</text>
<rect x="50.0" y="448.0" width="900.0" height="66.0" rx="12" fill="#fdf6e3" stroke="#b8860b" stroke-width="1.7"/>
<text x="500.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ядро Linux обходить цю саму пастку зсувом буфера на 2 байти (NET_IP_ALIGN),</text>
<text x="500.0" y="496.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">щоб заголовок IP почався з адреси, кратної 4, — латка для драйверів, а не дозвіл кастити в прикладному коді.</text>
</svg>