<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура кадру Wire Format та порівняння розміру</text>
<rect x="15.0" y="15.0" width="930.0" height="330.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="480.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура 5-байтового кадру (Wire Format) для бінарної серіалізації</text>
<rect x="70.0" y="80.0" width="120.0" height="90.0" rx="4" fill="#fff3cd" stroke="#d39e00" stroke-width="1.5"/>
<text x="130.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#856404" text-anchor="middle" font-weight="700">Байт 0 (Magic)</text>
<text x="130.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">0x00</text>
<text x="130.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Маркер формату</text>
<rect x="200.0" y="80.0" width="240.0" height="90.0" rx="4" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="320.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Байти 1–4 (Schema ID)</text>
<text x="320.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">0x00 0x00 0x01 0x2A  (= 298)</text>
<text x="320.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">32-бітний Big-Endian ID у реєстрі</text>
<rect x="450.0" y="80.0" width="440.0" height="90.0" rx="4" fill="#d4edda" stroke="#27ae60" stroke-width="1.5"/>
<text x="670.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Байти 5...N (Бінарне корисне навантаження)</text>
<text x="670.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">0x12 0x7F 0x00 0x8C 0xA4 0x02 0x3E ...</text>
<text x="670.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Чисті двійкові дані Avro / Protobuf (без метаданих та імен полів)</text>
<line x1="70.0" y1="180.0" x2="440.0" y2="180.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="70.0" y1="175.0" x2="70.0" y2="185.0" stroke="#6b7280" stroke-width="1.2"/>
<line x1="440.0" y1="175.0" x2="440.0" y2="185.0" stroke="#6b7280" stroke-width="1.2"/>
<text x="255.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Службовий заголовок: рівно 5 байтів оверхеду</text>
<rect x="40.0" y="225.0" width="420.0" height="100.0" rx="6" fill="#fafbfc" stroke="#6b7280" stroke-width="1.0"/>
<text x="250.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Текстовий JSON (Самоописний формат)</text>
<text x="250.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">{&quot;order_id&quot;: 98124, &quot;customer_id&quot;: &quot;usr_42&quot;, &quot;amount&quot;: 4990, ...}</text>
<text x="250.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Розмір: ~350–800 байтів / повідомлення (75% — повтор імен полів)</text>
<rect x="500.0" y="225.0" width="420.0" height="100.0" rx="6" fill="#fafbfc" stroke="#6b7280" stroke-width="1.0"/>
<text x="710.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Wire Format + Avro Binary (Схема в реєстрі)</text>
<text x="710.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">5 байтів заголовка + 24 байти двійкового тіла = 29 байтів</text>
<text x="710.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Розмір: ~25–45 байтів / повідомлення (економія трафіку 85–95%)</text>
</svg>