<text x="307.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Антипатерн: «Одна універсальна схема для всієї корпорації»</text>
