<line x1="515.0" y1="287.0" x2="307.0" y2="263.0" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="50.0" y="355.0" width="515.0" height="155.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.1"/><text x="307.5" y="411.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="307.5" dy="0.0">НАСЛІДКИ МОНОЛІТНОЇ CDM:</tspan><tspan x="307.5" dy="12.3">1. Організаційне блокування: будь-яка зміна узгоджується місяцями всіма відділами.</tspan><tspan x="307.5" dy="12.3">2. Семантичний розрив: сутність «Клієнт» означає діаметрально різні речі в CRM і WMS.</tspan><tspan x="307.5" dy="12.3">3. Найменший спільний знаменник або монстр: 90% полів схеми є порожніми (null).</tspan><tspan x="307.5" dy="12.3">4. Крихкість: зміна версії ламає десятки інтегрованих систем одночасно.</tspan></text>
<rect x="615.0" y="95.0" width="550.0" height="430.0" rx="8" fill="#f8fafc" stroke="#27ae60" stroke-width="1.3"/>
<text x="890.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Федеративна CDM (DDD Bounded Contexts)</text>
<text x="890.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Сучасний підхід: Published Language на межах контекстів</text>
<rect x="635.0" y="165.0" width="170.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.4"/>
