<text x="720.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Shipping Context</text>
<text x="720.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Canonical Waybill / Cargo</text>
<rect x="935.0" y="255.0" width="170.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.4"/>
<text x="1020.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Analytics Context</text>
<text x="1020.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">Canonical Fact Event</text>
<line x1="720.0" y1="216.0" x2="720.0" y2="255.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="1020.0" y1="216.0" x2="1020.0" y2="255.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="805.0" y1="190.0" x2="935.0" y2="190.0" stroke="#27ae60" stroke-width="1.5"/>
<line x1="805.0" y1="280.0" x2="935.0" y2="280.0" stroke="#27ae60" stroke-width="1.5"/>
<rect x="820.0" y="222.0" width="100.0" height="28.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="870.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ACL / OHS</text>
<rect x="630.0" y="355.0" width="520.0" height="155.0" rx="6" fill="#e8f6ee" stroke="#27ae60" stroke-width="1.1"/><text x="890.0" y="408.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="890.0" dy="0.0">ПЕРЕВАГИ ФЕДЕРАТИВНОЇ CDM:</tspan><tspan x="890.0" dy="13.7">1. Автономність команд: кожен Bounded Context володіє власною моделлю та схемою.</tspan><tspan x="890.0" dy="13.7">2. Точна семантика: чиста єдина мова (Ubiquitous Language) всередині контексту.</tspan><tspan x="890.0" dy="13.7">3. Антикорупційний шар (ACL): захищає ядро домену від брудних зовнішніх контрактів.</tspan><tspan x="890.0" dy="13.7">4. Published Language: публічний канонічний API/події для взаємодії між доменами.</tspan></text>
</svg>