<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повний конвеєр алгоритму LAMBDA у структурі RTK-приймача</text>
<rect x="20.0" y="60.0" width="160.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="100.0" y="97.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="100.0" dy="0.0">1. Плаваючий розв'язок</tspan><tspan x="100.0" dy="14.3">â (дійсний вектор)</tspan><tspan x="100.0" dy="14.3">Q_â (коваріація)</tspan><tspan x="100.0" dy="14.3">з EKF або МНК</tspan></text>
<line x1="180.0" y1="115.0" x2="210.0" y2="115.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="210.0" y="60.0" width="170.0" height="110.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="295.0" y="95.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="295.0" dy="0.0">2. Z-перетворення</tspan><tspan x="295.0" dy="15.6">Q_â = L·D·Lᵀ</tspan><tspan x="295.0" dy="15.6">Гауссові зсуви + swap</tspan><tspan x="295.0" dy="15.6">матриця Z (det = ±1)</tspan></text>
