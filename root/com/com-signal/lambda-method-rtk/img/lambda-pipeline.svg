<rect x="540.0" y="210.0" width="200.0" height="75.0" rx="6" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/><text x="640.0" y="236.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="640.0" dy="0.0">Валідація: Ratio-Test</tspan><tspan x="640.0" dy="15.6">R = F(ǎ₂) / F(ǎ₁) ≥ μ</tspan><tspan x="640.0" dy="15.6">(зазвичай μ = 2.0...3.0)</tspan></text>
