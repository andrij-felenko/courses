<text x="246" y="110" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">8×8 коефіцієнти + зигзаг</text>
<text x="178" y="410" font-size="9.5" fill="#1f4ed8" text-anchor="middle" font-weight="normal" font-style="normal">низькі (суть)</text>
<text x="314" y="410" font-size="9.5" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">→ високі (нулі)</text>
<text x="620" y="152" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="bold" font-style="normal">вийде послідовність:</text>
<rect x="610" y="166" width="300" height="38" rx="6" fill="#f8fafc" fill-opacity="1.0" stroke="#e5e7eb" stroke-width="1"/>
<text x="760" y="190" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">120, −69, 40, 8, −3, 0,0,…,0</text>
<text x="610" y="236" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ довгий хвіст нулів пакують</text>
<text x="610" y="255" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  «кодом довжин серій» (RLE)</text>
<text x="610" y="274" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">→ а тоді — кодом Гаффмана</text>
<text x="610" y="293" font-size="10.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  (оптимально, без утрат)</text>
<rect x="610" y="322" width="300" height="30" rx="8" fill="#eafaef" fill-opacity="1.0" stroke="#0a8f3c" stroke-width="1.4"/>
<text x="760" y="342" font-size="11" fill="#15803d" text-anchor="middle" font-weight="bold" font-style="normal">64 числа → кілька байтів</text>
<text x="480.0" y="436" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">Зигзаг недарма: він жене нулі в один хвіст, який пакується майже задарма. Звідси й величезний стиск.</text>
</svg>
