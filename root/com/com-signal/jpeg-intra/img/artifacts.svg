<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460"
     viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/></marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cc0000"/></marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1f4ed8"/></marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0a8f3c"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
<text x="480.0" y="30" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Ручка якості й артефакти JPEG</text>
<text x="480.0" y="50" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">сильніше стиснення — менший файл, та видно блоки 8×8 і «дзвін» біля різких меж</text>
<text x="210" y="110" font-size="12" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">ВИСОКА якість</text>
<rect x="120" y="124" width="180" height="150" rx="4" fill="#0f172a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="210" cy="199" r="50" fill="#93c5fd" fill-opacity="1.0" stroke="none" stroke-width="1.6"/>
<text x="210" y="292" font-size="11" fill="#0a8f3c" text-anchor="middle" font-weight="bold" font-style="normal">великий файл, гладко</text>
<text x="510" y="110" font-size="12" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">НИЗЬКА якість</text>
<rect x="420" y="124" width="180" height="150" rx="4" fill="#0f172a" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<rect x="485" y="157" width="24" height="22" rx="8" fill="rgb(142,182,255)" fill-opacity="1.0" stroke="#1e293b" stroke-width="0.5"/>
<rect x="510" y="157" width="24" height="22" rx="8" fill="rgb(152,192,255)" fill-opacity="1.0" stroke="#1e293b" stroke-width="0.5"/>
<rect x="535" y="157" width="24" height="22" rx="8" fill="rgb(142,182,255)" fill-opacity="1.0" stroke="#1e293b" stroke-width="0.5"/>
<rect x="460" y="180" width="24" height="22" rx="8" fill="rgb(136,176,255)" fill-opacity="1.0" stroke="#1e293b" stroke-width="0.5"/>
<rect x="485" y="180" width="24" height="22" rx="8" fill="rgb(167,207,255)" fill-opacity="1.0" stroke="#1e293b" stroke-width="0.5"/>
<rect x="510" y="180" width="24" height="22" rx="8" fill="rgb(184,224,255)" fill-opacity="1.0" stroke="#1e293b" stroke-width="0.5"/>
<rect x="535" y="180" width="24" height="22" rx="8" fill="rgb(167,207,255)" fill-opacity="1.0" stroke="#1e293b" stroke-width="0.5"/>
<rect x="560" y="180" width="24" height="22" rx="8" fill="rgb(136,176,255)" fill-opacity="1.0" stroke="#1e293b" stroke-width="0.5"/>
<rect x="460" y="203" width="24" height="22" rx="8" fill="rgb(140,180,255)" fill-opacity="1.0" stroke="#1e293b" stroke-width="0.5"/>
<rect x="485" y="203" width="24" height="22" rx="8" fill="rgb(175,215,255)" fill-opacity="1.0" stroke="#1e293b" stroke-width="0.5"/>
<rect x="510" y="203" width="24" height="22" rx="8" fill="rgb(205,245,255)" fill-opacity="1.0" stroke="#1e293b" stroke-width="0.5"/>
<rect x="535" y="203" width="24" height="22" rx="8" fill="rgb(175,215,255)" fill-opacity="1.0" stroke="#1e293b" stroke-width="0.5"/>
<rect x="560" y="203" width="24" height="22" rx="8" fill="rgb(140,180,255)" fill-opacity="1.0" stroke="#1e293b" stroke-width="0.5"/>
<rect x="485" y="226" width="24" height="22" rx="8" fill="rgb(159,199,255)" fill-opacity="1.0" stroke="#1e293b" stroke-width="0.5"/>
<rect x="510" y="226" width="24" height="22" rx="8" fill="rgb(173,213,255)" fill-opacity="1.0" stroke="#1e293b" stroke-width="0.5"/>
<rect x="535" y="226" width="24" height="22" rx="8" fill="rgb(159,199,255)" fill-opacity="1.0" stroke="#1e293b" stroke-width="0.5"/>
<rect x="485" y="249" width="24" height="22" rx="8" fill="rgb(132,172,255)" fill-opacity="1.0" stroke="#1e293b" stroke-width="0.5"/>
<rect x="510" y="249" width="24" height="22" rx="8" fill="rgb(140,180,255)" fill-opacity="1.0" stroke="#1e293b" stroke-width="0.5"/>
<rect x="535" y="249" width="24" height="22" rx="8" fill="rgb(132,172,255)" fill-opacity="1.0" stroke="#1e293b" stroke-width="0.5"/>
<text x="510" y="292" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">малий файл, видно БЛОКИ 8×8</text>
<rect x="660" y="124" width="230" height="150" rx="11" fill="#fde2e2" fill-opacity="1.0" stroke="#cc0000" stroke-width="1.5"/>
<text x="775" y="150" font-size="11" fill="#cc0000" text-anchor="middle" font-weight="bold" font-style="normal">артефакти стиснення</text>
<text x="676" y="174" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• «блочність»: межі 8×8</text>
<text x="676" y="191" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  квадратиків стають видні</text>
<text x="676" y="208" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• «дзвін» (ringing): хвильки</text>
<text x="676" y="225" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  біля різких контурів</text>
<text x="676" y="242" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">• колір ще й «розмазаний»</text>
<text x="676" y="259" font-size="9.5" fill="#1a1a1a" text-anchor="start" font-weight="normal" font-style="normal">  (chroma subsampling)</text>
<rect x="120" y="320" width="720" height="56" rx="10" fill="#f4f4f5" fill-opacity="1.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="480" y="344" font-size="10.5" fill="#1a1a1a" text-anchor="middle" font-weight="bold" font-style="normal">Для машинного бачення (49) артефакти небезпечні: блочність і дзвін творять фальшиві «краї» й кольори,</text>
<text x="480" y="363" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="normal">яких у сцені нема. Тому для зору не тиснуть надміру — або беруть менш стиснений потік.</text>
<text x="480.0" y="446" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal" font-style="italic">«Якість» JPEG — це грубість квантування: ти сам вирішуєш, скільки блочності стерпіти заради меншого файлу.</text>
</svg>
