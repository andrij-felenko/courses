<line x1="300.0" y1="210.0" x2="330.0" y2="315.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="650.0" y="160.0" width="140.0" height="100.0" rx="6" fill="#1e293b" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="720.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Арифметичний</text>
<text x="720.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">кодер (Range Coder)</text>
<text x="720.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">+ Вбудований FEC</text>
<text x="720.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#cbd5e1" text-anchor="middle">+ Детектор тиші DTX</text>
<line x1="610.0" y1="105.0" x2="650.0" y2="190.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="610.0" y1="210.0" x2="650.0" y2="210.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="610.0" y1="315.0" x2="650.0" y2="230.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="720.0" y1="260.0" x2="720.0" y2="370.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="640.0" y="375.0" width="160.0" height="35.0" rx="4" fill="#dcfce7" stroke="#c0392b" stroke-width="1.5"/>
<text x="720.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пакет Opus (6-510 кбіт/с)</text>
