<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 840 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="840" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="820.0" height="420.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="410.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Гібридна архітектура кодека Opus (IETF RFC 6716)</text>
<rect x="30.0" y="180.0" width="130.0" height="60.0" rx="6" fill="#e0f2fe" stroke="#c0392b" stroke-width="1.5"/>
<text x="95.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Аудіовхід PCM</text>
<text x="95.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">8 – 48 кГц (8-16 біт)</text>
<rect x="190.0" y="180.0" width="110.0" height="60.0" rx="6" fill="#f1f5f9" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="245.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сепаратор полос /</text>
<text x="245.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Селектор режиму</text>
<line x1="160.0" y1="210.0" x2="190.0" y2="210.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="330.0" y="60.0" width="280.0" height="90.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="470.0" y="83.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">Мовний рушій SILK (LPC / Skype)</text>
<text x="470.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Оптимізовано для мовлення (6 – 20 кбіт/с)</text>
<text x="470.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Частоти мовлення: 0 – 8 кГц (NB / WB)</text>
<text x="470.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Лінійне передбачення + Noise Shaping</text>
<rect x="330.0" y="270.0" width="280.0" height="90.0" rx="6" fill="#fae8ff" stroke="#c026d3" stroke-width="1.5"/>
<text x="470.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a21caf" text-anchor="middle" font-weight="700">Музичний рушій CELT (MDCT / Xiph.Org)</text>
<text x="470.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Оптимізовано для звуку/музики (&gt; 32 кбіт/с)</text>
<text x="470.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Спектр: 8 – 20 кГц (Superwide / Fullband)</text>
<text x="470.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Ультранизька затримка (від 2.5 мс)</text>
<rect x="330.0" y="170.0" width="280.0" height="80.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="470.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">Гібридний режим (Hybrid Mode)</text>
<text x="470.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• 0–8 кГц кодує SILK (LPC для мовного ядра)</text>
<text x="470.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• &gt;8 кГц кодує CELT (MDCT для ВЧ деталей)</text>
<line x1="300.0" y1="210.0" x2="330.0" y2="105.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
