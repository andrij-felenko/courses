<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -12.6 976 552.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-12.6" width="976" height="552.6" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрія інтерферометричної зйомки (InSAR) та фазовий трикутник</text>
<path d="M 450.0 480.0 L 550.0 475.0 L 660.0 465.0 L 780.0 440.0 L 840.0 455.0 L 930.0 480.0" fill="none" stroke="#15803d" stroke-width="3.0"/>
<line x1="450.0" y1="480.0" x2="930.0" y2="480.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="890.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Опорний еліпсоїд (h = 0)</text>
<line x1="780.0" y1="440.0" x2="780.0" y2="480.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="800.0" y1="480.0" x2="800.0" y2="440.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="825.0" y="460.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Висота h</text>
<line x1="200.0" y1="110.0" x2="350.0" y2="65.0" stroke="#8e44ad" stroke-width="3.0"/>
<line x1="200.0" y1="110.0" x2="350.0" y2="65.0" stroke="#8e44ad" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="275.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="middle" font-weight="700">База B</text>
<line x1="200.0" y1="110.0" x2="780.0" y2="440.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="350.0" y1="65.0" x2="780.0" y2="440.0" stroke="#d35400" stroke-width="2.0"/>
<text x="460.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Похила дальність R₁</text>
<text x="600.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d35400" text-anchor="middle" font-weight="700">Дальність R₂</text>
<line x1="200.0" y1="110.0" x2="200.0" y2="230.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<text x="218.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">θ</text>
<line x1="294.0" y1="163.5" x2="350.0" y2="65.0" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="3,3"/>
<text x="295.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">B_⊥ = B·cos(θ−α)</text>
<circle cx="277.1" cy="1.4" r="4.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="350.0" y1="65.0" x2="277.1" y2="1.4" stroke="#c0392b" stroke-width="4.0"/>
<text x="390.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ΔR = R₁ − R₂</text>
<rect x="145.0" y="90.0" width="110.0" height="40.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="2.0"/>
<text x="200.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">S₁ (Головний)</text>
<rect x="295.0" y="45.0" width="110.0" height="40.0" rx="6" fill="#fef3c7" stroke="#d35400" stroke-width="2.0"/>
<text x="350.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">S₂ (Ведений)</text>
<rect x="20.0" y="310.0" width="380.0" height="200.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="210.0" y="414.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0"></tspan></text>
<text x="210.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтерферометрична фаза:</text>
<text x="210.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="middle" font-weight="700">Δφ = φ₁ − φ₂ = −(4π / λ) · ΔR</text>
<text x="210.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Топографічна чутливість:</text>
<text x="210.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">Δφ_topo = −(4π / λ) · (B_⊥ / (R · sin θ)) · h</text>
<text x="210.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Висота невизначеності (фазовий цикл 2π):</text>
<text x="210.0" y="467.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">h_2π = (λ · R · sin θ) / (2 · B_⊥)</text>
<text x="210.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Зміщення поверхні: Δφ_disp = −(4π / λ) · Δr</text>
</svg>