<rect x="275.0" y="80.0" width="150.0" height="56.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="1.8"/>
<text x="350.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ФІЛЬТР</text>
<text x="350.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-style="italic">(дешевий, у реальному часі)</text>
<rect x="510.0" y="80.0" width="150.0" height="56.0" rx="8" fill="#f1f7f1" stroke="#27ae60" stroke-width="1.6"/>
<text x="585.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="585.0" dy="0.0">чиста</tspan><tspan x="585.0" dy="15.0">оцінка величини</tspan></text>
<line x1="192.0" y1="108.0" x2="273.0" y2="108.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="427.0" y1="108.0" x2="508.0" y2="108.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="350.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">інструменти: ковзне середнє · медіана · експоненційне згладжування</text>
<text x="350.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">…а вибір між ними вирішує компроміс згладжування ↔ затримка</text>
