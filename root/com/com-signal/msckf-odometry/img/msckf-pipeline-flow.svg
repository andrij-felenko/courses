<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повний робочий конвеєр алгоритму MSCKF</text>
<rect x="30.0" y="65.0" width="165.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="112.5" y="84.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="112.5" dy="0.0">1. Швидке IMU (~500 Гц)</tspan><tspan x="112.5" dy="14.3">Інтегрування показів,</tspan><tspan x="112.5" dy="14.3">пророкування стану,</tspan><tspan x="112.5" dy="14.3">накопичення коваріації</tspan></text>
<line x1="195.0" y1="102.5" x2="220.0" y2="102.5" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="220.0" y="65.0" width="165.0" height="75.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="302.5" y="86.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="302.5" dy="0.0">2. Новий кадр (~30 Гц)</tspan><tspan x="302.5" dy="13.0">Клонування стану поз:</tspan><tspan x="302.5" dy="13.0">додавання поточної пози</tspan><tspan x="302.5" dy="13.0">камери до ковзного вікна</tspan></text>
<line x1="385.0" y1="102.5" x2="410.0" y2="102.5" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="410.0" y="65.0" width="165.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="492.5" y="86.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="492.5" dy="0.0">3. Оптичний потік</tspan><tspan x="492.5" dy="13.0">Відстеження точок.</tspan><tspan x="492.5" dy="13.0">Для втрачених треків:</tspan><tspan x="492.5" dy="13.0">3D-тріангуляція орієнтира</tspan></text>
<line x1="575.0" y1="102.5" x2="600.0" y2="102.5" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="600.0" y="65.0" width="165.0" height="75.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="682.5" y="84.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="682.5" dy="0.0">4. Проєкція усунення</tspan><tspan x="682.5" dy="14.3">Обчислення H_X, H_f.</tspan><tspan x="682.5" dy="14.3">QR-розклад H_f.</tspan><tspan x="682.5" dy="14.3">Проєкція r_o = Q₂ᵀ · r</tspan></text>
<line x1="682.5" y1="140.0" x2="682.5" y2="180.0" stroke="#333333" stroke-width="1.5"/>
<line x1="682.5" y1="180.0" x2="492.5" y2="180.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="190.0" y="155.0" width="215.0" height="80.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="297.5" y="177.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="297.5" dy="0.0">5. Корекція фільтра Калмана</tspan><tspan x="297.5" dy="14.3">Розрахунок підсилення K,</tspan><tspan x="297.5" dy="14.3">оновлення похибок поз та IMU,</tspan><tspan x="297.5" dy="14.3">корекція зсувів гіро/аксель</tspan></text>
<line x1="405.0" y1="195.0" x2="435.0" y2="195.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="435.0" y="155.0" width="215.0" height="80.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="542.5" y="177.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="542.5" dy="0.0">6. Маргіналізація вікна</tspan><tspan x="542.5" dy="14.3">Видалення найстарішої</tspan><tspan x="542.5" dy="14.3">або надлишкової пози</tspan><tspan x="542.5" dy="14.3">з вектора стану і матриці P</tspan></text>
<line x1="542.0" y1="235.0" x2="542.0" y2="395.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="542.0" y1="395.0" x2="112.5" y2="395.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="112.5" y1="395.0" x2="112.5" y2="140.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="420.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Оновлений стан повертається для наступних кроків інтегрування IMU</text>
</svg>