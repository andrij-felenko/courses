<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усунення невідомої 3D-точки проєкцією на лівий нуль-простір</text>
<rect x="60.0" y="65.0" width="720.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="420.0" y="88.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Вихідна лінеаризована нев'язка спостережень:</tspan><tspan x="420.0" dy="16.9">r_j = H_X · x̃ + H_f · f̃ + v   (де f̃ — похибка координат 3D-точки, що заважає)</tspan></text>
<line x1="420.0" y1="120.0" x2="420.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="435.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Множення зліва на базисну матрицю Aᵀ (Aᵀ · H_f = 0)</text>
<rect x="60.0" y="160.0" width="720.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="420.0" y="181.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">QR-розклад матриці чутливості до орієнтира:</tspan><tspan x="420.0" dy="15.6">H_f = [Q₁  Q₂] · [ R ;  0 ]   →   Обираємо матрицю A = Q₂  (лівий нуль-простір)</tspan><tspan x="420.0" dy="15.6">Властивість: Q₂ᵀ · H_f = 0  (стовпці Q₂ ортогональні стовпцям H_f)</tspan></text>
<line x1="420.0" y1="225.0" x2="420.0" y2="265.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="435.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Проєкція: r_o = Aᵀ · r_j</text>
<rect x="60.0" y="265.0" width="720.0" height="55.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="288.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Спроєктована нев'язка для кроку корекції фільтра Калмана:</tspan><tspan x="420.0" dy="16.9">r_o = Aᵀ · H_X · x̃ + Aᵀ · v = H_o · x̃ + v_o   (доданок з f̃ зник абсолютно точно!)</tspan></text>
</svg>