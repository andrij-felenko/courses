<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Біти за якість: крута крива з насиченням</text>
<line x1="70.0" y1="300.0" x2="370.0" y2="300.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="70.0" y1="300.0" x2="70.0" y2="70.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="370.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-weight="700">бітрейт →</text>
<text x="74.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="700">↑ якість</text>
<polyline points="70.0,300.0 100.0,203.4 136.0,157.4 184.0,125.2 244.0,102.2 304.0,88.4 370.0,79.2" fill="none" stroke="#2457d6" stroke-width="2.8" stroke-linejoin="round"/>
<circle cx="100.0" cy="203.4" r="5.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="112.0" y="207.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start">мало біт: блочно</text>
<circle cx="160.0" cy="139.0" r="6.5" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="172.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">«коліно»</text>
<text x="172.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start">максимум якості за біт</text>
<circle cx="304.0" cy="88.4" r="5.0" fill="#6b7280" stroke="#1a1a1a" stroke-width="1.0"/>
<text x="304.0" y="78.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">зиск дрібніє</text>
<rect x="430.0" y="96.0" width="250.0" height="196.0" rx="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="555.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">дві стратегії бітрейту</text>
<text x="446.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">CBR — сталий потік</text>
<text x="446.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="446.0" dy="0.0">біти фіксовані, якість гуляє;</tspan><tspan x="446.0" dy="11.7">рівно лягає у вузький канал</tspan></text>
<text x="446.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">VBR — змінний потік</text>
<text x="446.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="446.0" dy="0.0">якість стала, біти стрибають;</tspan><tspan x="446.0" dy="11.7">для запису, та на каналі</tspan><tspan x="446.0" dy="11.7">просить буфер → затримку</tspan></text>
</svg>