<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 730 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="730" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що фільтр тримає в стані: карту прикмет чи лише свої пози</text>
<rect x="40.0" y="54.0" width="300.0" height="38.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="190.0" y="78.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">Класичний EKF-SLAM</tspan></text>
<rect x="380.0" y="54.0" width="300.0" height="38.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="530.0" y="78.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">MSCKF: пози, не карта</tspan></text>
<rect x="40.0" y="114.0" width="300.0" height="30.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="190.0" y="133.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">поза апарата</tspan></text>
<rect x="40.0" y="154.0" width="300.0" height="26.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.1"/><text x="190.0" y="170.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">координати прикмети 1 (x,y,z)</tspan></text>
<rect x="40.0" y="184.0" width="300.0" height="26.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.1"/><text x="190.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">координати прикмети 2 (x,y,z)</tspan></text>
<rect x="40.0" y="214.0" width="300.0" height="26.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.1"/><text x="190.0" y="230.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">координати прикмети 3 (x,y,z)</tspan></text>
<rect x="40.0" y="244.0" width="300.0" height="26.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.1"/><text x="190.0" y="260.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">координати прикмети 4 (x,y,z)</tspan></text>
<text x="190.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-style="italic">… + сотні таких — стан росте як N²</text>
<rect x="380.0" y="114.0" width="300.0" height="30.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/><text x="530.0" y="133.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">поза (кадр t)</tspan></text>
<rect x="380.0" y="148.0" width="300.0" height="30.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/><text x="530.0" y="167.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">поза (кадр t−1)</tspan></text>
<rect x="380.0" y="182.0" width="300.0" height="30.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/><text x="530.0" y="201.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">поза (кадр t−2)</tspan></text>
<text x="530.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-style="italic">мале ковзне вікно — стан не росте</text>
<rect x="380.0" y="264.0" width="300.0" height="28.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.3"/><text x="530.0" y="281.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">прикмета → обмеження на пози → зникає</tspan></text>
<text x="530.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle">(проєкція в нуль-простір: у стані її нема)</text>
<text x="360.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Ліворуч кожна прикмета осідає в стані назавжди; праворуч — лише свідчить і йде.</text>
</svg>