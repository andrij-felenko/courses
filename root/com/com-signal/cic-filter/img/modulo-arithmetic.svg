<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="800.0" height="360.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="400.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Числове коло 2's Complement: чому переповнення інтегратора не спотворює результат</text><circle cx="220.0" cy="180.0" r="100.0" fill="#fdfdfd" stroke="#333333" stroke-width="2.0"/><text x="220.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">0</text><text x="344.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">+(2^(B-1) - 1)</text><text x="220.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Мітка переповнення (rollover)</text><text x="92.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">-(2^(B-1))</text><circle cx="284.3" cy="103.4" r="5.0" fill="#2457d6" stroke="#333333" stroke-width="1.0"/><text x="296.3" y="95.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">s[k-1]</text><circle cx="314.0" cy="214.2" r="5.0" fill="#c0392b" stroke="#333333" stroke-width="1.0"/><text x="328.0" y="226.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">s[k]</text><path d="M 284.3 103.4 A 100 100 0 0 1 314.0 214.2" fill="none" stroke="#27ae60" stroke-width="4" stroke-dasharray="2,2"/><text x="265.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Справжня різниця Δs</text><rect x="425.0" y="60.0" width="350.0" height="260.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.0"/><text x="600.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Теорема про модульну різницю</text><text x="440.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">1. Інтегратор неперервно накопичує суму:</text><text x="440.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   y[n] невпинно зростає і робить повні оберти</text><text x="440.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   довкола кільця 2^B (переповнюється).</text><text x="440.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"></text><text x="440.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">2. Гребінка обчислює різницю відліків:</text><text x="440.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   Δ = (s[k] − s[k−1]) mod 2^B</text><text x="440.0" y="217.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"></text><text x="440.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">3. Доки повний динамічний діапазон сигналу</text><text x="440.0" y="251.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   на виході фільтра вміщується в 2^B,</text><text x="440.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   віднімання точно повертає довжину дуги Δs,</text><text x="440.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">   незалежно від кількості повних обертів!</text>
</svg>