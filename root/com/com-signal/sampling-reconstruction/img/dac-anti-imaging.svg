<text x="300.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Фіксатор ZOH</text>
<line x1="370" y1="107" x2="420" y2="107" stroke="#333333" stroke-width="2"/>
<polygon points="420,102 430,107 420,112" fill="#333333"/>
<text x="400.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ступені</text>
<rect x="430" y="70" width="160" height="75" fill="#f4f6f8" rx="6" stroke="#27ae60" stroke-width="2"/>
<text x="510.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Згладжувальний</text>
<text x="510.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ФНЧ (Anti-imaging)</text>
