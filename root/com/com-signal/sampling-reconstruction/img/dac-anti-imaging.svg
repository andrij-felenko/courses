<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320">
<rect width="760" height="320" fill="#ffffff"/>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратне відновлення: ЦАП та згладжувальний ФНЧ (Anti-imaging)</text>
<rect x="40" y="70" width="130" height="75" fill="#f4f6f8" rx="6" stroke="#333333" stroke-width="1.5"/>
