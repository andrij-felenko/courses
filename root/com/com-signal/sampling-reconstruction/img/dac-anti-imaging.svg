<text x="105.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">відліки x[n]</text>
<line x1="170" y1="107" x2="220" y2="107" stroke="#333333" stroke-width="2"/>
<polygon points="220,102 230,107 220,112" fill="#333333"/>
<rect x="230" y="70" width="140" height="75" fill="#f4f6f8" rx="6" stroke="#c0392b" stroke-width="2"/>
