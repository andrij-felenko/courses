<polyline points="190,222.0 195,223.5 200,225.3 205,227.5 210,230.0 215,227.2 220,224.1 225,220.8 230,217.4 235,213.8 240,210.2 245,206.5 250,202.9 255,199.4 260,196.1 265,193.1 270,190.3 275,187.9 280,185.8 285,184.2 290,183.0 295,182.2 300,182.0 305,182.2 310,183.0 315,184.2 320,185.8 325,187.9 330,190.3 335,193.1 340,196.1 345,199.4 350,202.9 355,206.5 360,210.2 365,213.8 370,217.4 375,220.8 380,224.1 385,227.2 390,230.0 395,227.5 400,225.3 405,223.5 410,222.0" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="380.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">sinc-обвідна ЦАП</text>
<text x="550.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Спектр після ФНЧ (чистий):</text>
<line x1="460" y1="230" x2="640" y2="230" stroke="#333333" stroke-width="1.5"/>
<polygon points="520,230 550,190 580,230" fill="#27ae60" fill-opacity="0.5" stroke="#27ae60" stroke-width="2"/>
<text x="550.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0</text>
<rect x="15.0" y="275.0" width="730.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="296.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">ЦАП створює ступені з вищими гармоніками (образами). Аналоговий ФНЧ (anti-imaging filter) зрізає ці образи вище fs/2, перетворюючи ступені на гладеньку напругу.</tspan></text>
</svg>