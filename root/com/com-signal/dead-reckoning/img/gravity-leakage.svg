<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Витік сили тяжіння через кутову похибку орієнтації</text>
<line x1="380.0" y1="90.0" x2="380.0" y2="350.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="370.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">Справжня вертикаль (земна)</text>
<line x1="380.0" y1="90.0" x2="380.0" y2="310.0" stroke="#2457d6" stroke-width="3.0" marker-end="url(#arrow)"/>
<text x="368.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="end" font-weight="700">Справжня сила тяжіння g</text>
<line x1="380.0" y1="90.0" x2="460.8" y2="321.4" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="465.8" y="316.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start">Оцінена алгоритмом вісь (помилкова)</text>
<polyline points="380.0,160.0 381.3,160.0 382.6,160.0 383.9,159.9 385.2,159.8 386.5,159.7 387.8,159.6 389.1,159.4 390.4,159.2 391.7,159.0 393.0,158.8 394.3,158.5 395.5,158.3 396.8,157.9 398.1,157.6 399.3,157.3" fill="none" stroke="#c0392b" stroke-width="1.8"/>
<text x="406.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">δθ</text>
<line x1="380.0" y1="310.0" x2="440.8" y2="301.4" stroke="#c0392b" stroke-width="2.8" marker-end="url(#arrow)"/>
<text x="420.4" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Хибне прискорення δa ≈ g · δθ</text>
<rect x="60.0" y="350.0" width="640.0" height="85.0" rx="6" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="381.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Похибка кута нахилу всього 0.1° (0.00175 рад) викликає горизонтальне хибне прискорення:</tspan><tspan x="380.0" dy="15.6">δa = g · sin(δθ) ≈ 9.81 · 0.00175 ≈ 0.017 м/с²</tspan><tspan x="380.0" dy="15.6">За 1 хвилину це дає похибку швидкості 1.0 м/с та похибку позиції 31 метр на рівному місці!</tspan></text>
</svg>