<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 962 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="962" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура комплексування БІНС із давачами швидкості (ESKF / Fusion)</text>
<rect x="40.0" y="70.0" width="740.0" height="150.0" rx="6" fill="#f4f9f9" stroke="#16a085" stroke-width="1.5"/>
<text x="60.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#117864" text-anchor="start" font-weight="700">Високочастотний контур прямого числення БІНС (200 – 1000 Гц, плавний, без затримок)</text>
<rect x="60.0" y="120.0" width="130.0" height="70.0" rx="6" fill="#ffffff" stroke="#16a085" stroke-width="1.5"/><text x="125.0" y="144.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">IMU давачі</tspan><tspan x="125.0" dy="15.0">(акселерометр,</tspan><tspan x="125.0" dy="15.0">гіроскоп)</tspan></text>
<rect x="250.0" y="120.0" width="240.0" height="70.0" rx="6" fill="#ffffff" stroke="#16a085" stroke-width="1.5"/><text x="370.0" y="144.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Кінематичний інтегратор</tspan><tspan x="370.0" dy="14.3">Орієнтація R_b^n -&gt; Компенсація g</tspan><tspan x="370.0" dy="14.3">Швидкість v_ins -&gt; Позиція p_ins</tspan></text>
<rect x="570.0" y="120.0" width="180.0" height="70.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="660.0" y="146.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">Оцінка навігаційного стану</tspan><tspan x="660.0" dy="11.7">(p, v, q)</tspan><tspan x="660.0" dy="11.7">Висока частота для керування</tspan></text>
<line x1="190.0" y1="155.0" x2="250.0" y2="155.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="490.0" y1="155.0" x2="570.0" y2="155.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="260.0" width="740.0" height="195.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/>
<text x="60.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b7950b" text-anchor="start" font-weight="700">Контур корекції похибок та спостереження (20 – 50 Гц або аперіодично)</text>
<rect x="60.0" y="310.0" width="170.0" height="115.0" rx="6" fill="#ffffff" stroke="#d4ac0d" stroke-width="1.5"/><text x="145.0" y="346.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Давачі обмеження дрейфу:</tspan><tspan x="145.0" dy="12.3">• Одометрія коліс (v_wheel)</tspan><tspan x="145.0" dy="12.3">• Детектор зупинки (ZUPT)</tspan><tspan x="145.0" dy="12.3">• Оптичний потік (Flow)</tspan><tspan x="145.0" dy="12.3">• Неголономні зв'язки (NHC)</tspan></text>
<rect x="280.0" y="335.0" width="180.0" height="70.0" rx="6" fill="#ffffff" stroke="#d4ac0d" stroke-width="1.5"/><text x="370.0" y="360.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="370.0" dy="0.0">Обчислення нев'язки</tspan><tspan x="370.0" dy="13.0">Δv = v_ins − R_b^n · v_wheel</tspan><tspan x="370.0" dy="13.0">(різниця швидкостей)</tspan></text>
<rect x="520.0" y="325.0" width="230.0" height="90.0" rx="6" fill="#fef5e7" stroke="#c0392b" stroke-width="1.5"/><text x="635.0" y="360.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="635.0" dy="0.0">Фільтр помилок стану (ESKF)</tspan><tspan x="635.0" dy="13.0">Оцінює вектор помилок:</tspan><tspan x="635.0" dy="13.0">δp, δv, δθ, зміщення bias b_a, b_g</tspan></text>
<line x1="230.0" y1="370.0" x2="280.0" y2="370.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="460.0" y1="370.0" x2="520.0" y2="370.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="370.0" y1="190.0" x2="370.0" y2="335.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="380.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">v_ins</text>
<line x1="635.0" y1="325.0" x2="635.0" y2="190.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="645.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Корекція стану: -δp, -δv, -δθ
та оновлення зміщень bias</text>
</svg>