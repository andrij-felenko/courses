<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 855 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="855" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр безплатформного інерціального числення (Strapdown INS)</text>
<rect x="40.0" y="90.0" width="150.0" height="70.0" rx="6" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/><text x="115.0" y="115.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">Гіроскоп (IMU)</tspan><tspan x="115.0" dy="13.0">кутова швидкість ω_b</tspan><tspan x="115.0" dy="13.0">[рад/с]</tspan></text>
<rect x="40.0" y="270.0" width="150.0" height="70.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="115.0" y="293.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0.0">Акселерометр (IMU)</tspan><tspan x="115.0" dy="15.6">питома сила f_b</tspan><tspan x="115.0" dy="15.6">[м/с²]</tspan></text>
<rect x="250.0" y="90.0" width="170.0" height="70.0" rx="6" fill="#ebf5fb" stroke="#2471a3" stroke-width="1.5"/><text x="335.0" y="116.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">Інтегрування кутів</tspan><tspan x="335.0" dy="11.7">Кватерніон q / Матриця R_b^n</tspan><tspan x="335.0" dy="11.7">(дискретний крок Δt)</tspan></text>
<line x1="190.0" y1="125.0" x2="250.0" y2="125.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="220.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">ω_b</text>
<rect x="250.0" y="270.0" width="170.0" height="70.0" rx="6" fill="#fcf3cf" stroke="#b7950b" stroke-width="1.5"/><text x="335.0" y="301.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">Поворот у навігаційну СК</tspan><tspan x="335.0" dy="14.3">f_n = R_b^n · f_b</tspan></text>
<line x1="190.0" y1="305.0" x2="250.0" y2="305.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="220.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">f_b</text>
<line x1="335.0" y1="160.0" x2="335.0" y2="270.0" stroke="#2980b9" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="345.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2471a3" text-anchor="start">R_b^n (орієнтація)</text>
<rect x="480.0" y="270.0" width="140.0" height="70.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="550.0" y="293.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Компенсація g</tspan><tspan x="550.0" dy="15.6">a_n = f_n − g_n</tspan><tspan x="550.0" dy="15.6">[0, 0, 9.81]</tspan></text>
<line x1="420.0" y1="305.0" x2="480.0" y2="305.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="450.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">f_n</text>
<line x1="550.0" y1="210.0" x2="550.0" y2="270.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="550.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Вектор g_n (вертикаль)</text>
<rect x="480.0" y="390.0" width="140.0" height="65.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="550.0" y="412.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">Інтеграл швидкості</tspan><tspan x="550.0" dy="13.7">v_n = ∫ a_n dt</tspan><tspan x="550.0" dy="13.7">v[k+1] = v[k] + a·Δt</tspan></text>
<line x1="550.0" y1="340.0" x2="550.0" y2="390.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="560.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">a_n</text>
<rect x="680.0" y="390.0" width="130.0" height="65.0" rx="6" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/><text x="745.0" y="413.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="745.0" dy="0.0">Інтеграл позиції</tspan><tspan x="745.0" dy="11.7">p_n = ∫ v_n dt</tspan><tspan x="745.0" dy="11.7">p[k+1] = p[k] + v·Δt</tspan></text>
<line x1="620.0" y1="422.0" x2="680.0" y2="422.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="650.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">v_n</text>
<line x1="810.0" y1="422.0" x2="835.0" y2="422.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="160.0" y="470.0" width="480.0" height="36.0" rx="4" fill="#fdfefe" stroke="#6b7280" stroke-width="1.5"/><text x="400.0" y="491.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">Зовнішні корекції (GNSS, одометрія коліс, оптичний потік, ZUPT) стабілізують дрейф</tspan></text>
</svg>