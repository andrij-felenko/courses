<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
<rect width="960" height="360" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="480.0" y="30.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як це працює: частоти вище fs/2 «складаються» дзеркалом</text>
<text x="480.0" y="52.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">усе, що вище за Найквіста (fs/2), відбивається назад у чутний діапазон</text>
<line x1="70.0" y1="250.0" x2="910.0" y2="250.0" stroke="#1b1b1b" stroke-width="2" marker-end="url(#aInk)"/>
<text x="900.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">частота, Гц</text>
<line x1="70.0" y1="245.0" x2="70.0" y2="255.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<text x="70.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">0</text>
<line x1="275.0" y1="245.0" x2="275.0" y2="255.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<text x="275.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">250</text>
<line x1="480.0" y1="245.0" x2="480.0" y2="255.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<text x="480.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">500</text>
<line x1="685.0" y1="245.0" x2="685.0" y2="255.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<text x="685.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">750</text>
<line x1="890.0" y1="245.0" x2="890.0" y2="255.0" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round"/>
<text x="890.0" y="272.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">1000</text>
<line x1="480.0" y1="90.0" x2="480.0" y2="250.0" stroke="#c0271e" stroke-width="2" stroke-dasharray="6,4" stroke-linecap="round"/>
<text x="480.0" y="82.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">Найквіст fs/2 = 500</text>
<circle cx="316.0" cy="250.0" r="5.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="316.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">300 — нижче, лишається</text>
<circle cx="644.0" cy="250.0" r="5.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="644.0" y="238.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">700</text>
<path d="M 644.0 244 Q 480.0 160 316.0 244" fill="none" stroke="#1f47b5" stroke-width="2" stroke-dasharray="5,4"/>
<text x="480.0" y="150.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.5" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">700 → дзеркало → 300</text>
<rect x="150.0" y="300.0" width="660.0" height="44.0" rx="9" fill="#e9eefb" stroke="#1f47b5" stroke-width="1.3"/>
<text x="480.0" y="320.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9.6" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Аліас(f) = |f − k·fs|. При fs = 1000: сигнал 700 Гц з'явиться як хибні 300 Гц</text>
<text x="480.0" y="337.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">— нерозрізнянно від справжніх 300 Гц.</text>
</svg>
