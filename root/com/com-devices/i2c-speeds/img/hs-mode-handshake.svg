<rect x="40.0" y="304.0" width="800.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="322.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Ведучий транслює Master Code (0000 1XXX) на стандартній швидкості Fm. Hs-сумісні ведені</tspan><tspan x="440.0" dy="15.0">вимикають 50-нс фільтр завад (вмикають 10-нс) і переходять на 3.4 Мбіт/с після повторного старту (Sr).</tspan></text>
