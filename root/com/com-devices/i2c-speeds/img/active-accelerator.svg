<rect x="40.0" y="304.0" width="760.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="322.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Детектор фіксує перетин порогу VIL і вмикає потужний PMOS-генератор струму на ~30 нс.</tspan><tspan x="420.0" dy="15.0">Лінія миттєво долає ємність до рівня VIH, після чого прискорювач вимикається без статичних втрат.</tspan></text>
