<text x="410.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">EPR умикається лише коли готові всі троє: джерело · пристрій · кабель з e-marker</text>
