<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="860" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">240 Вт: напругою, а не струмом</text>
<rect x="45.0" y="58.0" width="360.0" height="300.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="225.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Низька напруга</text>
<rect x="100.0" y="150.0" width="250.0" height="18.0" rx="6" fill="#d9a5a0" stroke="#c0392b" stroke-width="1.4"/>
<polyline points="115,140 127,124 139,140 151,124 163,140 175,124 187,140 199,124 211,140 223,124 235,140 247,124 259,140 271,124 283,140 295,124 307,140 319,124 331,140 343,124" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="225.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">20 В × 12 А = 240 Вт</text>
<text x="225.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle">грів жили ∝ 12² = 144</text>
<text x="225.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">12 А — понад стелю роз'єму 5 А:</text>
<text x="225.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle">контакти б перегрілися</text>
<rect x="455.0" y="58.0" width="360.0" height="300.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="635.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#2457d6" text-anchor="middle" font-weight="700">Висока напруга</text>
<rect x="510.0" y="150.0" width="250.0" height="18.0" rx="6" fill="#a7bdf0" stroke="#2457d6" stroke-width="1.4"/>
<text x="635.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">48 В × 5 А = 240 Вт</text>
<text x="635.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle">грів жили ∝ 5² = 25</text>
<text x="635.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">5 А — у межах USB-C:</text>
<text x="635.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle">кабель лишається холодним</text>
<rect x="71.2" y="373.8" width="717.5" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="394.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Та сама потужність — але майже вшестеро менший грів. Тому EPR піднімає напругу, а не струм</tspan></text>
</svg>