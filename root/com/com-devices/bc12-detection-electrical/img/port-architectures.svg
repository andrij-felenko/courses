<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура та характеристики портів SDP, CDP та DCP за стандартом BC 1.2</text>
<rect x="40.0" y="45.0" width="210.0" height="250.0" rx="10" fill="#f8fafc" stroke="#2457d6" stroke-width="1.6"/>
<text x="145.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">SDP</text>
<text x="145.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Standard Downstream</text>
<text x="145.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стандартний порт ПК</text>
<line x1="60.0" y1="128.0" x2="230.0" y2="128.0" stroke="#2457d6" stroke-width="1.0"/>
<rect x="50.0" y="140.0" width="190.0" height="140.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="145.0" y="195.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Лінії D+/D− підтягнуті</tspan><tspan x="145.0" dy="11.7">до GND через R_PD = 15 кОм</tspan><tspan x="145.0" dy="11.7">Дані: USB 2.0 (480 Мбіт/с)</tspan><tspan x="145.0" dy="11.7">Струм: 100 мА / 500 мА (900 мА USB 3.0)</tspan></text>
