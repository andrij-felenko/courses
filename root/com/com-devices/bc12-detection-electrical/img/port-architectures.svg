<text x="380.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Charging Downstream</text>
<text x="380.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">ПК з посиленим живленням</text>
<line x1="295.0" y1="128.0" x2="465.0" y2="128.0" stroke="#27ae60" stroke-width="1.0"/>
<rect x="285.0" y="140.0" width="190.0" height="140.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="380.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Активна схема рукостискання:</tspan><tspan x="380.0" dy="13.0">повертає 0.6 В на пробу D+</tspan><tspan x="380.0" dy="13.0">Дані: USB 2.0 під час зарядки</tspan><tspan x="380.0" dy="13.0">Струм: до 1.5 А при 5 В</tspan></text>
<rect x="510.0" y="45.0" width="210.0" height="250.0" rx="10" fill="#f0fdf4" stroke="#c0392b" stroke-width="1.6"/>
