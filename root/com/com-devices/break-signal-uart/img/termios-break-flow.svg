<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Маршрут обробки Break-сигналу в термінальному драйвері (termios / TTY)</text>
<rect x="45.2" y="61.1" width="169.6" height="57.8" rx="6" fill="#fde8e8" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Апаратний UART</tspan><tspan x="130.0" dy="13.7">Фіксація FE + 0x00</tspan><tspan x="130.0" dy="13.7">IRQ: BI (Break Interrupt)</tspan></text>
<rect x="272.2" y="61.1" width="175.6" height="57.8" rx="6" fill="#fef6e7" stroke="#c0392b" stroke-width="1.5"/><text x="360.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">Драйвер ядра / serial_core</tspan><tspan x="360.0" dy="13.7">Перевірка Magic SysRq</tspan><tspan x="360.0" dy="13.7">(CONFIG_MAGIC_SYSRQ)</tspan></text>
