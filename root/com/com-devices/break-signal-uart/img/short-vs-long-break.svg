<svg xmlns="http://www.w3.org/2000/svg" viewBox="-72.5 -10 912.5 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-72.5" y="-10" width="912.5" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація: короткий (Short Break) та довгий (Long Break) сигнали</text>
<rect x="40.0" y="60.0" width="360.0" height="290.0" rx="8" fill="#fbfcff" stroke="#27ae60" stroke-width="1.5"/>
<text x="220.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Короткий Break (Short Break)</text>
<line x1="60.0" y1="102.0" x2="380.0" y2="102.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="60.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тривалість:</text>
<text x="145.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">10–20 бітових інтервалів (зазвичай 11–13 Tbit)</text>
<text x="60.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Призначення:</text>
<text x="145.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Внутрішньопротокольна синхронізація кадрів</text>
<text x="60.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Швидкість:</text>
<text x="145.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Формується з прив'язкою до поточної швидкості baud</text>
<text x="60.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приклади:</text>
<text x="80.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• DMX512: Break ≥ 88 мкс (початок пакета світла)</text>
<text x="80.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• LIN-bus: Synch Break ≥ 13 бітів (синхронізація ведених)</text>
<text x="80.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• RDM: розділення запитів та відповідей</text>
<text x="60.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наслідок:</text>
<text x="145.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Скидає лічильник байтів, не зупиняючи зв'язок</text>
<rect x="440.0" y="60.0" width="360.0" height="290.0" rx="8" fill="#fbfcff" stroke="#c0392b" stroke-width="1.5"/>
<text x="620.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Довгий Break (Long Break)</text>
<line x1="460.0" y1="102.0" x2="780.0" y2="102.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="460.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тривалість:</text>
<text x="545.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">200–500 мс (сотні / тисячі бітових інтервалів)</text>
<text x="460.0" y="137.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Призначення:</text>
<text x="545.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Позасмугове системне керування та апаратний скид</text>
<text x="460.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Швидкість:</text>
<text x="545.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Не залежить від baud rate (абсолютний час)</text>
<text x="460.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приклади:</text>
<text x="480.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Linux Magic SysRq: аварійне відновлення ядра</text>
<text x="480.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• ROM Bootloader: перехід MCU в режим ISP-прошивки</text>
<text x="480.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Модемне скидання: розрив зв'язку AT-модема</text>
<text x="460.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наслідок:</text>
<text x="545.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Примусове переривання роботи процесора / ОС</text>
</svg>