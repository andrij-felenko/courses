<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="860.0" height="440.0" rx="8" fill="#fafbfc" stroke="#6b7280" stroke-width="1.0"/>
<text x="450.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двосторонній DShot (Bi-directional DShot) у контурі регулювання PID</text>
<line x1="60.0" y1="95.0" x2="840.0" y2="95.0" stroke="#333333" stroke-width="1.5"/>
<text x="60.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Початок циклу PID (t = 0)</text>
<text x="840.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700">Наступний цикл PID (125 мкс / 8 кГц)</text>
<rect x="60.0" y="115.0" width="200.0" height="110.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="2.0"/>
<text x="160.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">FC → ESC (Пакет газу)</text>
<text x="160.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">16 бітів (Інвертований DShot)</text>
<text x="160.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Тривалість: 26.7 мкс</text>
<text x="160.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">FC пін: Вихід (TX Active Low)</text>
<rect x="270.0" y="115.0" width="120.0" height="110.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="330.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Guard Time</text>
<text x="330.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">≈ 30 мкс</text>
<text x="330.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Перемикання TX/RX</text>
<text x="330.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Лінія підтягнута до VCC</text>
<rect x="400.0" y="115.0" width="260.0" height="110.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="2.0"/>
<text x="530.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ESC → FC (Пакет телеметрії eGCR)</text>
<text x="530.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">21 біт (GCR 5b4b кодування)</text>
<text x="530.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">16 бітів ERPM періоду + CRC</text>
<text x="530.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ESC пін: Вихід (TX) | FC: Вхід (RX/Timer Capture)</text>
<rect x="670.0" y="115.0" width="170.0" height="110.0" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
<text x="755.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7e22ce" text-anchor="middle" font-weight="700">FC: Обробка</text>
<text x="755.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Декодування GCR</text>
<text x="755.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7e22ce" text-anchor="middle" font-weight="700">RPM Notch Filter</text>
<text x="755.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">PID Loop Step</text>
<text x="60.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Фізичний стан сигнальної лінії (Half-Duplex Single Wire):</text>
<rect x="60.0" y="270.0" width="780.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<path d="M 70 285 L 70 320 L 85 320 L 85 285 L 100 285 L 100 320 L 125 320 L 125 285 L 240 285 L 380 285 L 400 285 L 400 320 L 415 320 L 415 285 L 430 285 L 430 320 L 445 320 L 445 285 L 640 285 L 830 285" fill="none" stroke="#333333" stroke-width="2"/>
<text x="150.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Інвертований DShot (FC TX)</text>
<text x="325.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Line Idle (3.3V)</text>
<text x="520.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">GCR Телеметрія (ESC TX)</text>
<text x="735.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Line Idle</text>
<rect x="40.0" y="370.0" width="820.0" height="70.0" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="450.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">GCR (Group Code Recording) перетворює 4-бітні ніблі в 5-бітні коди, усуваючи довгі серії нулів чи одиниць.</text>
<text x="450.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Це дозволяє польотному контролеру точно відновити синхронізацію прийому без окремої лінії тактування.</text>
</svg>