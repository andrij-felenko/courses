<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="840.0" height="480.0" rx="8" fill="#fafbfc" stroke="#6b7280" stroke-width="1.0"/>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формат 16-бітного кадру DShot та модуляція бітових інтервалів</text>
<text x="40.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">А. Розподіл бітів у кадрі (MSB First):</text>
<rect x="40.0" y="100.0" width="440.0" height="75.0" rx="6" fill="#dbeafe" stroke="#2457d6" stroke-width="1.8"/>
<text x="260.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">11 бітів: Значення газу або команди (Throttle / Command)</text>
<text x="260.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Біти 15..5 (0 = Stop, 1..47 = Команди, 48..2047 = Газ 0..100%)</text>
<text x="260.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">2000 градацій роздільної здатності</text>
<rect x="490.0" y="100.0" width="120.0" height="75.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
<text x="550.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="middle" font-weight="700">1 біт: TLM</text>
<text x="550.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Бит 4</text>
<text x="550.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Запит телеметрії</text>
<rect x="620.0" y="100.0" width="220.0" height="75.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.8"/>
<text x="730.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">4 біти: CRC (Checksum)</text>
<text x="730.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Біти 3..0 (XOR-сума трьох ніблів)</text>
<text x="730.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">(data ^ (data&gt;&gt;4) ^ (data&gt;&gt;8)) &amp; 0x0F</text>
<text x="40.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Б. Фізичне кодування логічного нуля та одиниці (Шпаруватість у межах T_bit):</text>
<rect x="60.0" y="240.0" width="360.0" height="170.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="240.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Логічний 0 (Шпаруватість ≈ 33.3% / 1:2)</text>
<path d="M 120 360 L 120 300 L 200.0 300 L 200.0 360 L 360 360" fill="none" stroke="#2457d6" stroke-width="2.5"/>
<rect x="120.0" y="300.0" width="80.0" height="60.0" rx="6" fill="#eff6ff" stroke="none" stroke-width="1.5"/>
<text x="160.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">T_high = 33.3% T</text>
<text x="280.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">T_low = 66.7% T</text>
<line x1="120.0" y1="390.0" x2="360.0" y2="390.0" stroke="#333333" stroke-width="1.2"/>
<text x="240.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Період T_bit</text>
<rect x="460.0" y="240.0" width="360.0" height="170.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="640.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Логічна 1 (Шпаруватість ≈ 66.7% / 2:1)</text>
<path d="M 520 360 L 520 300 L 680.0 300 L 680.0 360 L 760 360" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<rect x="520.0" y="300.0" width="160.0" height="60.0" rx="6" fill="#fee2e2" stroke="none" stroke-width="1.5"/>
<text x="600.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">T_high = 66.7% T</text>
<text x="720.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">T_low = 33.3% T</text>
<line x1="520.0" y1="390.0" x2="760.0" y2="390.0" stroke="#333333" stroke-width="1.2"/>
<text x="640.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Період T_bit</text>
<rect x="40.0" y="430.0" width="800.0" height="55.0" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="440.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">DShot150: T_bit = 6.67 мкс (Кадр 106.7 мкс)  |  DShot300: T_bit = 3.33 мкс (Кадр 53.3 мкс)</text>
<text x="440.0" y="472.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">DShot600: T_bit = 1.67 мкс (Кадр 26.7 мкс)  |  DShot1200: T_bit = 0.83 мкс (Кадр 13.3 мкс)</text>
</svg>