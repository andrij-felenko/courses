<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чип не видає 5 В — VBUS беремо одним із трьох способів</text>
<rect x="250.0" y="61.0" width="260.0" height="49.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="380.0" y="82.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">МК-host (3.3 В)</tspan><tspan x="380.0" dy="16.9">потрібні 5 В на VBUS</tspan></text>
<rect x="65.0" y="173.5" width="170.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="150.0" y="194.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Ключ на платі</tspan></text>
<line x1="380.0" y1="110.0" x2="150.0" y2="168.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="150.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="150.0" dy="0.0">load switch,</tspan><tspan x="150.0" dy="14.3">GPIO-enable</tspan></text>
<rect x="295.0" y="173.5" width="170.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="380.0" y="194.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Зовнішні 5 В</tspan></text>
<line x1="380.0" y1="110.0" x2="380.0" y2="168.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="380.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="380.0" dy="0.0">окреме джерело,</tspan><tspan x="380.0" dy="14.3">повербанк</tspan></text>
<rect x="525.0" y="173.5" width="170.0" height="33.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="610.0" y="194.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="610.0" dy="0.0">Живлений хаб</tspan></text>
<line x1="380.0" y1="110.0" x2="610.0" y2="168.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="610.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="610.0" dy="0.0">хаб сам живить</tspan><tspan x="610.0" dy="14.3">периферію</tspan></text>
<rect x="90.0" y="286.0" width="580.0" height="76.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="380.0" y="312.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Стеля типового гнізда host-DevKit — близько 500 мА.</tspan><tspan x="380.0" dy="15.6">Старий 2.5″ HDD чи потужний Wi-Fi-свисток виходять за неї:</tspan><tspan x="380.0" dy="15.6">звідси просадки VBUS і збої енумерації. Ліки — хаб або зовнішнє джерело.</tspan></text>
