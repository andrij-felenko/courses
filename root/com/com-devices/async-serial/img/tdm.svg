<text x="610.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">приймач (синхронно)</text>
<rect x="70.0" y="250.0" width="620.0" height="130.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="380.0" y="272.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Лінію ділять на кілька каналів — скажімо, чотири, по одному на оператора.</tspan><tspan x="380.0" dy="15.6">Обертова щітка по черзі під'єднує до спільного дроту то A, то B, то C, то D:</tspan><tspan x="380.0" dy="15.6">кожному дістається свій короткий інтервал, у який його п'ять елементів летять</tspan><tspan x="380.0" dy="15.6">лінією. На тому кінці таке саме колесо, що крутиться синхронно, роздає прийняте</tspan><tspan x="380.0" dy="15.6">по принтерах. Це поділ часу (TDM) — живе й досі, від мобільного зв'язку до шин</tspan><tspan x="380.0" dy="15.6">у процесорі. Ахіллесова п'ята: обидва колеса мусять крутитися в один такт,</tspan><tspan x="380.0" dy="15.6">інакше дані A потраплять у принтер B′.</tspan></text>
</svg>