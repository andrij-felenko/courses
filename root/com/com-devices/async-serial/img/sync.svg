<rect x="80.0" y="262.0" width="600.0" height="96.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="380.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Передавач не лише виставляє біт на лінії даних, а й цокає тактом: ось фронт —</tspan><tspan x="380.0" dy="15.6">дивись зараз. Мить кожного біта задана явно, дротом, тож приймачеві не</tspan><tspan x="380.0" dy="15.6">потрібен власний точний годинник, і лінію можна навіть спинити посеред</tspan><tspan x="380.0" dy="15.6">передачі. Ціна — зайвий дріт такту (дані + такт + земля), а на відстані</tspan><tspan x="380.0" dy="15.6">повертається перекіс, але вже між даними й тактом.</tspan></text>
