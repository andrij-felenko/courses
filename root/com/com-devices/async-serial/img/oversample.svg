<rect x="70.0" y="270.0" width="760.0" height="96.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Внутрішній годинник приймача біжить ≈16× швидше за baud. Зловивши спад,</tspan><tspan x="450.0" dy="15.6">він відлічує ≈8 тиків до середини старту й перевіряє, що там і досі «0» — так</tspan><tspan x="450.0" dy="15.6">відсіюються короткі завади. Далі бере відлік кожні 16 тиків, тобто посеред</tspan><tspan x="450.0" dy="15.6">кожного біта: середина найдалі від країв-переходів, де сигнал ще хитається.</tspan><tspan x="450.0" dy="15.6">Цей запас і дає терпіти невеликий розсинхрон годинників.</tspan></text>
