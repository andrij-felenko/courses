<rect x="100.0" y="340.0" width="220.0" height="32.0" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/><text x="210.0" y="359.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Керуючі виводи: CS#, CLK</tspan></text>
<rect x="460.0" y="340.0" width="220.0" height="32.0" rx="6" fill="#d4efdf" stroke="#27ae60" stroke-width="1.5"/><text x="570.0" y="359.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Шина даних: IO0, IO1, IO2, IO3</tspan></text>
</svg>