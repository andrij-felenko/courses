<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="50.0" y="15.0" width="700.0" height="36.0" rx="6" fill="#eaf2f8" stroke="#2457d6" stroke-width="1.5"/><text x="400.0" y="37.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="400.0" dy="0.0">Системна шина мікроконтролера (AHB / AXI Matrix 32/64-біт, до 480 МГц)</tspan></text>
<line x1="200.0" y1="51.0" x2="200.0" y2="85.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="550.0" y1="51.0" x2="550.0" y2="85.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="85.0" width="720.0" height="230.0" rx="8" fill="#fdfefe" stroke="#7f8c8d" stroke-width="1.5"/>
<text x="400.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="700">Апаратний периферійний модуль QSPI (Регістрова логіка та кінцевий автомат)</text>
<rect x="60.0" y="125.0" width="300.0" height="65.0" rx="6" fill="#fcf3cf" stroke="#f39c12" stroke-width="1.5"/><text x="210.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Memory-Mapped Address Decoder</tspan><tspan x="210.0" dy="14.3">(Трансляція 0x90000000..0x9FFFFFFF</tspan><tspan x="210.0" dy="14.3">у фізичні адреси Flash-пам'яті)</tspan></text>
<rect x="400.0" y="125.0" width="340.0" height="65.0" rx="6" fill="#e8f8f5" stroke="#1abc9c" stroke-width="1.5"/><text x="570.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">Керуючі регістри контролера</tspan><tspan x="570.0" dy="14.3">QUADSPI_CR (Prescaler, Modes, IRQ)</tspan><tspan x="570.0" dy="14.3">QUADSPI_CCR (5 фаз протоколу) · QUADSPI_DCR</tspan></text>
<rect x="60.0" y="210.0" width="300.0" height="85.0" rx="6" fill="#f4f6f7" stroke="#34495e" stroke-width="1.5"/><text x="210.0" y="235.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Апаратний кінцевий автомат (FSM)</tspan><tspan x="210.0" dy="13.7">• Генерація опкоду та адрес</tspan><tspan x="210.0" dy="13.7">• Керування бітами Mode (0xA5)</tspan><tspan x="210.0" dy="13.7">• Відлік Dummy-тактів та реверс ліній</tspan></text>
<rect x="400.0" y="210.0" width="340.0" height="85.0" rx="6" fill="#f4f6f7" stroke="#34495e" stroke-width="1.5"/><text x="570.0" y="235.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Блок передачі та буферизації</tspan><tspan x="570.0" dy="13.7">• 32-бітний FIFO прийому/передачі (16 слів)</tspan><tspan x="570.0" dy="13.7">• 4-бітний зсувний регістр (Shift Engine)</tspan><tspan x="570.0" dy="13.7">• Дільник частоти SCK (до 133 МГц)</tspan></text>
<line x1="210.0" y1="190.0" x2="210.0" y2="210.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="570.0" y1="190.0" x2="570.0" y2="210.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="360.0" y1="252.0" x2="400.0" y2="252.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
