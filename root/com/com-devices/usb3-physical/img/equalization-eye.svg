<rect x="20.0" y="20.0" width="185.0" height="160.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="112.5" y="82.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="112.5" dy="0.0">1. Передавач (TX)</tspan><tspan x="112.5" dy="14.3">De-emphasis (−3.5 дБ)</tspan><tspan x="112.5" dy="14.3">Ослаблення низьких</tspan><tspan x="112.5" dy="14.3">частот перед лінією</tspan></text><rect x="235.0" y="20.0" width="185.0" height="160.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="327.5" y="75.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="327.5" dy="0.0">2. Кабель і доріжки</tspan><tspan x="327.5" dy="14.3">Skin-effect + Dielectric</tspan><tspan x="327.5" dy="14.3">Завал ВЧ (−15...−20 дБ)</tspan><tspan x="327.5" dy="14.3">Міжсимвольна</tspan><tspan x="327.5" dy="14.3">інтерференція (ISI)</tspan></text><rect x="450.0" y="20.0" width="185.0" height="160.0" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="542.5" y="75.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="542.5" dy="0.0">3. Приймач: CTLE</tspan><tspan x="542.5" dy="14.3">Лінійний еквалайзер</tspan><tspan x="542.5" dy="14.3">Аналоговий підйом ВЧ</tspan><tspan x="542.5" dy="14.3">на частоті Найквіста</tspan><tspan x="542.5" dy="14.3">(2.5 / 5.0 ГГц)</tspan></text><rect x="660.0" y="20.0" width="185.0" height="160.0" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="752.5" y="75.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="752.5" dy="0.0">4. Приймач: DFE</tspan><tspan x="752.5" dy="14.3">Зворотний зв'язок</tspan><tspan x="752.5" dy="14.3">Нелінійне віднімання</tspan><tspan x="752.5" dy="14.3">хвостів ISI без</tspan><tspan x="752.5" dy="14.3">підсилення шумів</tspan></text><line x1="205.0" y1="100.0" x2="235.0" y2="100.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><line x1="420.0" y1="100.0" x2="450.0" y2="100.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><line x1="635.0" y1="100.0" x2="660.0" y2="100.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/><rect x="60.0" y="200.0" width="320.0" height="190.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Сигнал після каналу без еквалайзингу</text><line x1="90.0" y1="300.0" x2="350.0" y2="300.0" stroke="#e2e8f0" stroke-width="1.0"/><line x1="90.0" y1="255.0" x2="350.0" y2="335.0" stroke="#fca5a5" stroke-width="1.5"/><line x1="90.0" y1="335.0" x2="350.0" y2="255.0" stroke="#fca5a5" stroke-width="1.5"/><line x1="90.0" y1="280.0" x2="350.0" y2="310.0" stroke="#f87171" stroke-width="1.5"/><line x1="90.0" y1="310.0" x2="350.0" y2="280.0" stroke="#f87171" stroke-width="1.5"/><line x1="90.0" y1="260.0" x2="350.0" y2="290.0" stroke="#ef4444" stroke-width="1.8"/><line x1="90.0" y1="330.0" x2="350.0" y2="305.0" stroke="#ef4444" stroke-width="1.8"/><circle cx="220.0" cy="295.0" r="12.0" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">X</text><rect x="90.0" y="345.0" width="260.0" height="35.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="359.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">Око закрите: 100% помилок</tspan><tspan x="220.0" dy="13.0">Неможливо розрізнити 0 і 1</tspan></text><line x1="390.0" y1="295.0" x2="470.0" y2="295.0" stroke="#27ae60" stroke-width="3.0" marker-end="u