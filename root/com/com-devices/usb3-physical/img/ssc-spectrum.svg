<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="400.0" height="370.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Частотна модуляція SSC (Down-Spread)</text><line x1="50.0" y1="240.0" x2="380.0" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="50.0" y1="240.0" x2="50.0" y2="70.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><text x="380.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">t</text><text x="35.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">f</text><line x1="45.0" y1="100.0" x2="370.0" y2="100.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,4"/><text x="130.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">f_nom = 5.000 ГГц (0 ppm)</text><line x1="45.0" y1="190.0" x2="370.0" y2="190.0" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4,4"/><text x="145.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">f_min = 4.975 ГГц (−5000 ppm, −0.5%)</text><polyline points="50,100 110,190 170,100 230,190 290,100 350,190" fill="none" stroke="#7c3aed" stroke-width="2.5"/><line x1="50.0" y1="215.0" x2="170.0" y2="215.0" stroke="#7c3aed" stroke-width="1.2"/><text x="110.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c3aed" text-anchor="middle" font-weight="700">T_mod (30–33 кГц)</text><rect x="35.0" y="270.0" width="360.0" height="95.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="215.0" y="303.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Параметри модуляції:</tspan><tspan x="215.0" dy="11.7">• Форма: симетричний трикутник (Hershey-profile)</tspan><tspan x="215.0" dy="11.7">• Швидкість модуляції: 30–33 кГц (поза звуковим діапазоном)</tspan><tspan x="215.0" dy="11.7">• Девіація: −5000 ppm (лише вниз, щоб не перевищити ліміт f_max)</tspan></text><rect x="435.0" y="15.0" width="410.0" height="370.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спектр випромінювання та конфлікт 2.4 ГГц</text><line x1="470.0" y1="240.0" x2="810.0" y2="240.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="470.0" y1="240.0" x2="470.0" y2="70.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><text x="810.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">f</text><text x="450.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">дБм</text><line x1="465.0" y1="130.0" x2="800.0" y2="130.0" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,4"/><text x="725.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">Ліміт завад FCC</text><line x1="535.0" y1="240.0" x2="535.0" y2="85.0" stroke="#c0392b" stroke-width="3.0"/><rect x="485.0" y="80.0" width="100.0" height="38.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="535.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">Без SSC:</tspan><tspan x="535.0" dy="13.0">гострий пік</tspan></text><polygon points="630,240 645,160 705,160 720,240" fill="#dbeafe" stroke="#2457d6" stroke-width="2"/><rect x="625.0" y="175.0" width="100.0" height="48.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="675.0" y="189.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="675.0" dy="0.0">З SSC: смуга</tspan><tspan x="675.0" dy="13.0">25 МГц</tspan><tspan x="675.0" dy="13.0">(−15 дБ)</tspan></text><rect x="455.0" y="270.0" width="370.0" height="95.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="640.0" y="303.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">Чому ламається Wi-Fi / Bluetooth (2.4 ГГц):</tspan><tspan x="640.0" dy="11.7">• 1-ша гармоніка SuperSpeed (2.5 ГГц) лежить поруч із Wi-Fi 2.4 ГГц</tspan><tspan x="640.0" dy="11.7">• Неекранований роз'єм або кабель випромінює завади прямо в антену</tspan><tspan x="640.0" dy="11.7">• SSC розмиває пік, але для стабільного радіо потрібен і якісний екран</tspan></text>
</svg>