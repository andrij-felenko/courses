<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Генератор baud — це дільник: f / (16 × DIV)</text>
<text x="430.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">периферійну частоту ділять на ЦІЛЕ число й на передискретизацію (типово 16×)</text>
<rect x="60.0" y="118.0" width="150.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="135.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">f периферії</text>
<text x="135.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">напр. 16 МГц</text>
<line x1="214.0" y1="150.0" x2="258.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="260.0" y="118.0" width="130.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="325.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">÷ DIV</text>
<text x="325.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">ціле число</text>
<line x1="394.0" y1="150.0" x2="438.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="440.0" y="118.0" width="150.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="515.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">÷ 16</text>
<text x="515.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">передискретизація</text>
<line x1="594.0" y1="150.0" x2="638.0" y2="150.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="118.0" width="150.0" height="64.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.8"/>
<text x="715.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">baud</text>
<text x="715.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">біт/с (тут 2 рівні)</text>
<text x="430.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">baud = f периферії / (16 × DIV)</text>
<rect x="120.0" y="256.0" width="620.0" height="78.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="430.0" y="283.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">DIV мусить бути ЦІЛИМ, а формула рідко дає рівне число — його округлюють, тож</tspan><tspan x="430.0" dy="16.2">реальна швидкість трохи відходить від бажаної. Ось перше джерело похибки baud:</tspan><tspan x="430.0" dy="16.2">воно з'їдає частину допуску ще до того, як підключено другий пристрій.</tspan></text>
</svg>