<text x="450.0" y="424.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Звідси практичне правило: кожна сторона має триматися в межах ≈ ±2%.</text>
