<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 918.7 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="918.7" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Еволюція інтерфейсу камери: від паралельного DVP до диференційного MIPI CSI-2</text>
<rect x="30.0" y="55.0" width="390.0" height="340.0" rx="8" fill="#fffaf9" stroke="#c0392b" stroke-width="1.5"/>
<text x="225.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Паралельна шина (DVP / Parallel CPI)</text>
