<text x="85.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="85.0" dy="0.0">Сенсор</tspan><tspan x="85.0" dy="14.3">камери</tspan><tspan x="85.0" dy="14.3">(DVP TX)</tspan></text>
<rect x="328.0" y="105.0" width="74.0" height="180.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="439.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="439.0" dy="0.0">Процесор</tspan><tspan x="439.0" dy="14.3">(SoC / ISP</tspan><tspan x="439.0" dy="14.3">RX)</tspan></text>
