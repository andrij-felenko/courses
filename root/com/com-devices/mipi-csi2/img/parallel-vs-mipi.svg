<line x1="752.0" y1="170.0" x2="758.0" y2="170.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="552.0" y1="201.0" x2="752.0" y2="201.0" stroke="#2457d6" stroke-width="1.6"/>
<line x1="552.0" y1="209.0" x2="752.0" y2="209.0" stroke="#2457d6" stroke-width="1.6"/>
<line x1="752.0" y1="205.0" x2="758.0" y2="205.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="552.0" y1="250.0" x2="758.0" y2="250.0" stroke="#333333" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="655.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Clock Lane (диф. пара такту)</text>
<text x="655.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Data Lane 0 (диф. пара даних)</text>
<text x="655.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Data Lane 1..3 (додаткові лінії)</text>
<text x="655.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">CCI (I2C / I3C — конфігурація сенсора)</text>
<rect x="474.0" y="297.0" width="362.0" height="85.0" rx="4" fill="#edf8f1" stroke="#27ae60" stroke-width="1.2"/>
<text x="482.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">• Диференційні пари SLVS (200 мВ) — захист від завад</text>
<text x="482.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">• Швидкість до 2.5–4.5 Гбіт/с на лінію (4K60 / HDR легко)</text>
<text x="482.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">• Мінімум пінів: лише 4–10 провідників у тонкому шлейфі</text>
<text x="482.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">• Гнучке енергозбереження: динамічний перехід LP ↔ HS</text>
</svg>