<line x1="122.0" y1="155.0" x2="328.0" y2="155.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="122.0" y1="180.0" x2="328.0" y2="180.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="122.0" y1="205.0" x2="328.0" y2="205.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="122.0" y1="230.0" x2="328.0" y2="230.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="122.0" y1="260.0" x2="328.0" y2="260.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="225.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">12–18 однофазних ліній 1.8V / 3.3V CMOS</text>
<text x="225.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">D[0..11] паралельні дані</text>
<text x="225.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">PCLK спільний такт</text>
<text x="225.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">HSYNC / VSYNC строби</text>
<rect x="44.0" y="297.0" width="362.0" height="85.0" rx="4" fill="#fff2f0" stroke="#c0392b" stroke-width="1.2"/>
<text x="52.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Невиправний часовий перекіс (skew) ліній &gt; 100 МГц</text>
<text x="52.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Високі паразитні наводки (EMI) та шум перемикань</text>
<text x="52.0" y="351.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Громіздкий шлейф (20–30 контактів) і зайві виводи чипа</text>
<text x="52.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Нездатність пропустити 1080p60 / 4K відеопотоки</text>
<rect x="460.0" y="55.0" width="390.0" height="340.0" rx="8" fill="#f9fdfa" stroke="#27ae60" stroke-width="1.5"/>
<text x="655.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Послідовний інтерфейс MIPI CSI-2 (D-PHY)</text>
<rect x="478.0" y="105.0" width="74.0" height="180.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="515.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="515.0" dy="0.0">Сенсор</tspan><tspan x="515.0" dy="14.3">камери</tspan><tspan x="515.0" dy="14.3">(CSI-2 TX)</tspan></text>
<rect x="758.0" y="105.0" width="74.0" height="180.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
