<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сопряження логічних рівнів: TTL/CMOS, RS-232 та USB-UART</text>
<rect x="30.0" y="60.0" width="220.0" height="320.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="140.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="700">Мікроконтролер (MCU)</text>
<rect x="50.0" y="110.0" width="180.0" height="110.0" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="140.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">Рівні CMOS / TTL</text>
<text x="140.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle">Логічна 1: +3.3V / +5V</text>
<text x="140.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle">Логічний 0: 0V (GND)</text>
<text x="140.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Пряма полярність</text>
<rect x="290.0" y="60.0" width="240.0" height="150.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="410.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1d4ed8" text-anchor="middle" font-weight="700">Трансивер RS-232 (MAX3232)</text>
<text x="410.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">Насос заряду (Charge Pump)</text>
<text x="410.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="700">Логічна 1: -3V ... -15V</text>
<text x="410.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="700">Логічний 0: +3V ... +15V</text>
<text x="410.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle">Інверсна полярність!</text>
<rect x="560.0" y="90.0" width="220.0" height="90.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
<text x="670.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle" font-weight="700">Кабель RS-232 / DB9</text>
<text x="670.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">Дальність до 15 метрів</text>
<line x1="250.0" y1="130.0" x2="290.0" y2="130.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="135.0" x2="560.0" y2="135.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="290.0" y="230.0" width="240.0" height="150.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<text x="410.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">Мост USB-UART (CP2102/CH340)</text>
<text x="410.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle">Апаратний контролер USB</text>
<text x="410.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle">Перетворення пакети &lt;-&gt; байти</text>
<text x="410.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700">Віртуальний COM-порт на ПК</text>
<rect x="560.0" y="260.0" width="220.0" height="90.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="670.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">Комп'ютер (Host ПК)</text>
<text x="670.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle">Шина USB (D+ / D-)</text>
<line x1="250.0" y1="305.0" x2="290.0" y2="305.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="305.0" x2="560.0" y2="305.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>