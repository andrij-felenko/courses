<line x1="410.0" y1="360.0" x2="425.0" y2="360.0" stroke="#333333" stroke-width="1.5"/>
<polyline points="421.0,357.0 426.0,360.0 421.0,363.0" fill="none" stroke="#333333" stroke-width="1.5"/>
