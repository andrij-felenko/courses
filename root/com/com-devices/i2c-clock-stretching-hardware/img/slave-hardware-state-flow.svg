<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="810.0" height="410.0" rx="8" fill="#fafbfc" stroke="#333333" stroke-width="1.2"/>
<text x="420.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність апаратних станів контролера I2C Slave при розтягуванні такту</text>
<rect x="25.0" y="80.0" width="130.0" height="180.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="90.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1</text>
<text x="90.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Стан IDLE / START</text>
<line x1="35.0" y1="132.0" x2="145.0" y2="132.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="90.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Очікування умови START.</text>
<text x="90.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Зсувний регістр вхідних</text>
<text x="90.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">бітів очищено.</text>
<rect x="175.0" y="80.0" width="130.0" height="180.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="240.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2</text>
<text x="240.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прийом адреси</text>
<line x1="185.0" y1="132.0" x2="295.0" y2="132.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="240.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Прийом 7-біт адреси + R/W.</text>
<text x="240.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Апаратне порівняння</text>
<text x="240.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">з регістром I2C_OAR1.</text>
<rect x="325.0" y="80.0" width="130.0" height="180.0" rx="6" fill="#fdecea" stroke="#d9534f" stroke-width="1.6"/>
<text x="390.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d9534f" text-anchor="middle" font-weight="700">3</text>
<text x="390.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Збіг і утримання SCL</text>
<line x1="335.0" y1="132.0" x2="445.0" y2="132.0" stroke="#d9534f" stroke-width="1.0"/>
<text x="390.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Збіг! Встановлено біт ADDR.</text>
<text x="390.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Апаратний розтяг: SCL = 0.</text>
<text x="390.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Генерація переривання MCU.</text>
<rect x="475.0" y="80.0" width="130.0" height="180.0" rx="6" fill="#faf5ff" stroke="#8e44ad" stroke-width="1.6"/>
<text x="540.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">4</text>
<text x="540.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Обслуговування ISR</text>
<line x1="485.0" y1="132.0" x2="595.0" y2="132.0" stroke="#8e44ad" stroke-width="1.0"/>
<text x="540.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Прошивка читає I2C_ISR/SR1,</text>
<text x="540.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">скидає прапорець ADDR</text>
<text x="540.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">або вичитує I2C_RXDR.</text>
<rect x="625.0" y="80.0" width="130.0" height="180.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="690.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">5</text>
<text x="690.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відпускання SCL</text>
<line x1="635.0" y1="132.0" x2="745.0" y2="132.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="690.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Апаратний MOSFET закривається.</text>
<text x="690.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Лінія SCL піднімається до 3.3В.</text>
<text x="690.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Майстер продовжує такт.</text>
<line x1="155.0" y1="170.0" x2="175.0" y2="170.0" stroke="#333333" stroke-width="1.8"/>
<polyline points="170.0,166.0 176.0,170.0 170.0,174.0" fill="none" stroke="#333333" stroke-width="1.8"/>
<line x1="305.0" y1="170.0" x2="325.0" y2="170.0" stroke="#333333" stroke-width="1.8"/>
<polyline points="320.0,166.0 326.0,170.0 320.0,174.0" fill="none" stroke="#333333" stroke-width="1.8"/>
<line x1="455.0" y1="170.0" x2="475.0" y2="170.0" stroke="#333333" stroke-width="1.8"/>
<polyline points="470.0,166.0 476.0,170.0 470.0,174.0" fill="none" stroke="#333333" stroke-width="1.8"/>
<line x1="605.0" y1="170.0" x2="625.0" y2="170.0" stroke="#333333" stroke-width="1.8"/>
<polyline points="620.0,166.0 626.0,170.0 620.0,174.0" fill="none" stroke="#333333" stroke-width="1.8"/>
<rect x="30.0" y="285.0" width="780.0" height="125.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="45.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Цикл прийому байта даних (Data Phase) та розтягування перед ACK/NACK:</text>
<rect x="45.0" y="322.0" width="170.0" height="75.0" rx="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.3"/>
<text x="130.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">8 бітів зсуваються в регістр</text>
<text x="130.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Майстер тактує SCL.</text>
<text x="130.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Slave приймає 8 біт даних.</text>
<rect x="235.0" y="322.0" width="170.0" height="75.0" rx="4" fill="#f4f6f8" stroke="#0284c7" stroke-width="1.3"/>
<text x="320.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0284c7" text-anchor="middle" font-weight="700">Перенесення в I2C_RXDR</text>
<text x="320.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Дані скопійовано в буфер.</text>
<text x="320.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Встановлюється прапорець RXNE.</text>
<rect x="425.0" y="322.0" width="170.0" height="75.0" rx="4" fill="#f4f6f8" stroke="#d9534f" stroke-width="1.3"/>
<text x="510.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d9534f" text-anchor="middle" font-weight="700">Апаратне утримання SCL</text>
<text x="510.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Перед 9-м тактом (ACK) SCL=0.</text>
<text x="510.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Шина заморожена до вичитки!</text>
<rect x="615.0" y="322.0" width="170.0" height="75.0" rx="4" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.3"/>
<text x="700.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Читання RXDR -&gt; ACK</text>
<text x="700.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">MCU вичитує RXDR -&gt; SCL=1,</text>
<text x="700.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Slave виставляє ACK (SDA=0).</text>
