<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">WHO_AM_I: найперша перевірка перед будь-чим</text>
<text x="450.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">прочитати сталий ID-регістр і звірити з очікуваним</text>
<rect x="80.0" y="100.0" width="320.0" height="130.0" rx="12" fill="none" stroke="#e0e0e0" stroke-width="2.0"/>
<text x="240.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">читаємо 0x75 (WHO_AM_I)</text>
<text x="240.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">очікуємо: 0x68</text>
<text x="240.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">отримали: 0x68 ✓</text>
<line x1="410.0" y1="165.0" x2="478.0" y2="165.0" stroke="#27ae60" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="490.0" y="120.0" width="330.0" height="90.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="655.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">збіглося →</text>
<text x="655.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">це той чіп, адреса й дроти справні</text>
<text x="655.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">можна налаштовувати далі</text>
<rect x="60.0" y="250.0" width="780.0" height="80.0" rx="10" fill="#fbecec" stroke="#c0392b" stroke-width="1.4"/>
<text x="450.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Не збіглося (0x00, 0xFF, інше) → не починай налаштування: спершу розберись із дротами й адресою.</text>
<text x="450.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">0xFF на всіх регістрах — типова ознака обірваної лінії; 0x00 — часто відсутнє живлення.</text>
<text x="450.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Один обмін відділяє «чіп живий» від «щось із підключенням».</text>
</svg>