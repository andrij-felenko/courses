<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Протокол + даташит = розмова з будь-яким чіпом</text>
<text x="450.0" y="54.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">механіка I2C однакова для всіх; даташит підставляє адресу, регістри й масштаби</text>
<rect x="80.0" y="100.0" width="320.0" height="120.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="240.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">протокол I2C</text>
<text x="240.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(універсальний)</text>
<text x="100.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">старт · адреса · R/W · ACK</text>
<text x="100.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">регістри · повторний старт · пакет</text>
<text x="420.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="26" fill="#1a1a1a" text-anchor="middle" font-weight="700">+</text>
<rect x="470.0" y="100.0" width="350.0" height="120.0" rx="12" fill="#e9eefb" stroke="#2457d6" stroke-width="2.0"/>
<text x="645.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">даташит чіпа</text>
<text x="645.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(специфічний для пристрою)</text>
<text x="490.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">адреса · карта регістрів</text>
<text x="490.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">біти налаштувань · масштаби</text>
<rect x="60.0" y="244.0" width="780.0" height="80.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/>
<text x="450.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Знаючи протокол, нову мікросхему вмикаєш швидко: відкрив даташит, знайшов адресу й регістри — і говориш.</text>
<text x="450.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Суть уміння: не завчити один давач, а вміти прочитати й оживити будь-який.</text>
<text x="450.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Готові бібліотеки — зручність, але тепер видно, що саме вони роблять усередині.</text>
</svg>