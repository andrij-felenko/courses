<line x1="190.0" y1="110.0" x2="190.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="110.0" y="150.0" width="160.0" height="120.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/>
<text x="190.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">7-бітний</text>
<text x="190.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0x48 (1001000b)</text>
<text x="190.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">11110xx ≠ 0x48</text>
<text x="190.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">→ мовчить (NACK)</text>
<line x1="390.0" y1="110.0" x2="390.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="310.0" y="150.0" width="160.0" height="120.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/>
<text x="390.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">7-бітний</text>
<text x="390.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0x68 (1101000b)</text>
<text x="390.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">11110xx ≠ 0x68</text>
<text x="390.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">→ мовчить (NACK)</text>
<line x1="610.0" y1="110.0" x2="610.0" y2="150.0" stroke="#1a1a1a" stroke-width="1.8"/>
<rect x="520.0" y="150.0" width="180.0" height="120.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="610.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">10-бітний</text>
<text x="610.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0x248 (10 0100 1000b)</text>
<text x="610.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">A9..A8 збіглися → ACK 1</text>
<text x="610.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">A7..A0 збіглися → ACK 2</text>
<text x="610.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">→ приймає дані</text>
<rect x="60.0" y="304.0" width="720.0" height="34.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="324.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">7-бітні чіпи ігнорують префікс 11110 і другий байт адреси, тому обидва стандарти безпечно ділять спільну пару дротів</tspan></text>
