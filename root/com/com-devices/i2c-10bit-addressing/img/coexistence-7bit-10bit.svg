<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Співіснування 7-бітних та 10-бітних ведених на одній шині</text>
<line x1="80.0" y1="110.0" x2="760.0" y2="110.0" stroke="#c0392b" stroke-width="3.0"/>
