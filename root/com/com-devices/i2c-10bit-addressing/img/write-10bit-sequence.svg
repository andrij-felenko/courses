<text x="13.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">2. На 2-й байт відгукується лише один цільовий ведений (збіг A7..A0); решта відпадає</text>
