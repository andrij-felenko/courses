<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що з цього треба насправді</text>
<rect x="60.0" y="64.0" width="360.0" height="180.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="240.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">майже завжди: ОДИН ведучий</text>
<text x="240.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">один МК керує всіма давачами</text>
<text x="240.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">арбітраж не потрібен зовсім</text>
<text x="240.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">розтягування такту — ЧАСТО</text>
<text x="240.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">(ним користуються давачі — підтримай його!)</text>
<rect x="420.0" y="64.0" width="360.0" height="180.0" rx="12" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.8"/>
<text x="600.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">рідко: КІЛЬКА ведучих</text>
<text x="600.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">два МК на спільних давачах,</text>
<text x="600.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">хост + співпроцесор</text>
<text x="600.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">тут потрібні арбітраж</text>
<text x="600.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">і виявлення вільної шини</text>
<rect x="60.0" y="274.0" width="720.0" height="42.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.5"/><text x="420.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Пріоритет: розтягування стосується тебе майже завжди; арбітраж — лише коли на шині справді кілька ведучих.</tspan></text>
</svg>