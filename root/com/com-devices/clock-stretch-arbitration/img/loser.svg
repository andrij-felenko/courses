<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="840" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто жене «1», а читає «0», той тихо відступає</text>
<rect x="70.0" y="70.0" width="340.0" height="150.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="240.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">ведучий A</text>
<text x="240.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">жене 0  →  читає 0</text>
<text x="240.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">усе, як хотів</text>
<text x="240.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">веде повідомлення ДАЛІ</text>
<text x="240.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">навіть не помітив суперника</text>
<rect x="430.0" y="70.0" width="340.0" height="150.0" rx="12" fill="#fbecec" stroke="#c0392b" stroke-width="2.0"/>
<text x="600.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">ведучий B</text>
<text x="600.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">жене 1  →  читає 0</text>
<text x="600.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">розбіжність → «я програв»</text>
<text x="600.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">негайно замовкає, відступає</text>
<text x="600.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">повторить пізніше або стане веденим</text>
<rect x="60.0" y="274.0" width="720.0" height="62.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="294.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Недеструктивність: повідомлення переможця проходить ЦІЛИМ, без жодного зіпсованого байта.</tspan><tspan x="420.0" dy="14.3">Жодних колізій, повторів чи сміття — один проходить, інший чемно чекає наступної нагоди.</tspan><tspan x="420.0" dy="14.3">І все це — лише тому, що «0» на спільній лінії сильніший за «1».</tspan></text>
</svg>