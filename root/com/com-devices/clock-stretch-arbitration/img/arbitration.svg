<text x="345.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">A жене 0, B жене 1 → лінія = 0</text>
<text x="345.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b08900" text-anchor="middle" font-weight="700">B бачить 0, хоч хотів 1 → програв</text>
<rect x="60.0" y="330.0" width="740.0" height="36.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Поки біти однакові — нічого не видно. На першій розбіжності монтажне «І» дає 0; хто жене «0», той виграв.</tspan></text>
