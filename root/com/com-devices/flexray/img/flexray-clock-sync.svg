<svg xmlns="http://www.w3.org/2000/svg" viewBox="-91 -10 1022.1 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-91" y="-10" width="1022.1" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм розподіленої синхронізації годинників у FlexRay</text>
<rect x="40.0" y="50.0" width="760.0" height="90.0" rx="6" fill="#fafbfc" stroke="#6b7280" stroke-width="1.5"/>
<text x="420.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Двоуровнева часова ієрархія вузла</text>
<rect x="60.0" y="85.0" width="330.0" height="40.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="225.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Мікротакт (Microtick / µt)</text>
<text x="225.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Прив'язаний до локального кварцу (напр. 12.5 або 25 нс)</text>
<line x1="400.0" y1="105.0" x2="430.0" y2="105.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="440.0" y="85.0" width="340.0" height="40.0" rx="4" fill="#eef6ef" stroke="#27ae60" stroke-width="1.2"/>
<text x="610.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Макротакт (Macrotick / MT)</text>
<text x="610.0" y="116.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Глобальна синхронізована одиниця часу мережі (напр. 1.0 мкс)</text>
<rect x="40.0" y="155.0" width="760.0" height="135.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="420.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Процес вимірювання та коригування в кожному циклі</text>
<rect x="60.0" y="190.0" width="220.0" height="85.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/>
<text x="170.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">1. Вимірювання часу</text>
<text x="170.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Зчитування часу приходу Sync-кадрів</text>
<text x="170.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">від Sync-вузлів у статичному сегменті.</text>
<rect x="310.0" y="190.0" width="220.0" height="85.0" rx="4" fill="#fff3cd" stroke="#856404" stroke-width="1.4"/>
<text x="420.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#856404" text-anchor="middle" font-weight="700">2. FTM Алгоритм</text>
<text x="420.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Обчислення відхилень фази (Offset) та</text>
<text x="420.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">частоти (Rate) за допомогою FTM.</text>
<rect x="560.0" y="190.0" width="220.0" height="85.0" rx="4" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/>
<text x="670.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">3. Коригування в NIT</text>
<text x="670.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Зміна кількості мікротактів у макротакті</text>
<text x="670.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">та зсув початку циклу в NIT.</text>
<line x1="285.0" y1="232.0" x2="305.0" y2="232.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="535.0" y1="232.0" x2="555.0" y2="232.0" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="-81.0" y="309.5" width="1002.1" height="31.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/><text x="420.0" y="328.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">FlexRay не має єдиного Master-годинника. Синхронізація є розподіленою: щонайменше 2 Sync-вузли забезпечують стійкість до відмов окремих кварців.</tspan></text>
</svg>