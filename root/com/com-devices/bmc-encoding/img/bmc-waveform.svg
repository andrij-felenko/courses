<rect x="43.2" y="425.4" width="753.6" height="45.3" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="444.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">BMC міняє рівень на початку кожного біта. Логічна '1' додає перехід у середині інтервалу, '0' лишає рівень незмінним.</tspan><tspan x="420.0" dy="14.3">Інформація закодована в наявності переходів, а не в полярності напруги, тому інверсія сигналу не спотворює дані.</tspan></text>
