<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура пакета USB Power Delivery на фізичному рівні CC</text>
<rect x="35.0" y="70.0" width="150.0" height="85.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2.0"/>
<text x="110.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Преамбула (Preamble)</text>
<text x="110.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">64 біти (0101...01)</text>
<text x="110.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Синхронізація ФАПЧ</text>
<rect x="190.0" y="70.0" width="140.0" height="85.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2.0"/>
<text x="260.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">SOP Ordered Set</text>
<text x="260.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">4 символи 4b/5b (20 біт)</text>
<text x="260.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Sync-1, Sync-1, Sync-1, Sync-2</text>
<rect x="335.0" y="70.0" width="125.0" height="85.0" rx="6" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.0"/>
<text x="397.5" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Заголовок (Header)</text>
<text x="397.5" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">16 біт (20 біт у 4b/5b)</text>
<text x="397.5" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Тип, ID, к-сть об'єктів</text>
<rect x="465.0" y="70.0" width="155.0" height="85.0" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.0"/>
<text x="542.5" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дані (Data Objects)</text>
<text x="542.5" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0 .. 7 об'єктів по 32 біти</text>
<text x="542.5" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(PDO, RDO, запити)</text>
<rect x="625.0" y="70.0" width="115.0" height="85.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2.0"/>
<text x="682.5" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">CRC-32</text>
<text x="682.5" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">32 біти (40 біт у 4b/5b)</text>
<text x="682.5" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Контрольна сума</text>
<rect x="745.0" y="70.0" width="80.0" height="85.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2.0"/>
<text x="785.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">EOP</text>
<text x="785.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1 символ 4b/5b</text>
<text x="785.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Кінець пакета</text>
<line x1="35.0" y1="180.0" x2="825.0" y2="180.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Послідовність передачі бітів у лінію CC (MSB/LSB правила) →</text>
<rect x="35.0" y="220.0" width="790.0" height="125.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="430.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр перетворення даних перед виходом у провід</text>
<rect x="50.0" y="260.0" width="175.0" height="70.0" rx="4" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
<text x="137.5" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Дані (Payload)</text>
<text x="137.5" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Заголовок, PDO, CRC-32</text>
<text x="137.5" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(розбиття по 4 біти)</text>
<rect x="245.0" y="260.0" width="175.0" height="70.0" rx="4" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
<text x="332.5" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Таблиця 4b/5b</text>
<text x="332.5" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Перетворення у 5 біт</text>
<text x="332.5" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(K-коди SOP, без '000')</text>
<rect x="440.0" y="260.0" width="175.0" height="70.0" rx="4" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
<text x="527.5" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. BMC модулятор</text>
<text x="527.5" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Генерація фронтів</text>
<text x="527.5" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(300 кбіт/с, 3.33 мкс)</text>
<rect x="635.0" y="260.0" width="170.0" height="70.0" rx="4" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
<text x="720.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Лінія CC</text>
<text x="720.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Аналоговий сигнал</text>
<text x="720.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(0 .. 1.12 В, кабель)</text>
<line x1="226.0" y1="295.0" x2="244.0" y2="295.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="421.0" y1="295.0" x2="439.0" y2="295.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="616.0" y1="295.0" x2="634.0" y2="295.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="97.1" y="367.4" width="665.8" height="45.3" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="430.0" y="386.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">Преамбула стабілізує поріг компаратора приймача. Стартова послідовність SOP визначає тип адресата</tspan><tspan x="430.0" dy="14.3">(пристрій чи e-marker кабелю). Корисні байти кодуються 4b/5b для контролю фронтів і захищаються CRC-32.</tspan></text>
</svg>