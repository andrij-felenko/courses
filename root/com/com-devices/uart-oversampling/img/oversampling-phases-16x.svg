<rect x="770.0" y="210.0" width="100.0" height="24.0" rx="4" fill="#fbecec" stroke="#c0392b" stroke-width="1.0"/>
<text x="820.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">спад / джиттер</text>
<rect x="70.0" y="275.0" width="800.0" height="115.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="314.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Кожен біт ділиться на 16 квантів часу. Спадом стартового біта лічильник синхронізується в 0.</tspan><tspan x="470.0" dy="15.0">Перші 2 такти (0-1) і останні 2 такти (14-15) поглинають перехідні процеси, завал фронтів і фазовий джиттер.</tspan><tspan x="470.0" dy="15.0">У центрі (такти 7, 8, 9) апаратура робить три вибірки S7, S8, S9 і визначає значення біта за більшістю голосів.</tspan><tspan x="470.0" dy="15.0">Завдяки передискретизації 16× похибка початкової прив'язки до спаду не перевищує ±1/16 біта (±6.25%).</tspan></text>
