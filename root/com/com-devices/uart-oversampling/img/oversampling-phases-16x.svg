<text x="470.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тривалість бітового інтервалу t_bit (16 тактів f_sample = 16 × baud)</text>
<rect x="70.0" y="210.0" width="100.0" height="24.0" rx="4" fill="#fbecec" stroke="#c0392b" stroke-width="1.0"/>
