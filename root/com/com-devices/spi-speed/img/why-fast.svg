<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="330" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому SPI швидкий: чотири рішення разом</text>
<rect x="23.0" y="70.0" width="168.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/>
<text x="107.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">двотактний вихід</text>
<text x="107.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="107.0" dy="0.0">активно жене вгору й вниз —</tspan><tspan x="107.0" dy="13.0">різкі фронти, не повільний RC</tspan></text>
<rect x="205.0" y="70.0" width="168.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/>
<text x="289.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">такт у дроті</text>
<text x="289.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="289.0" dy="0.0">не треба передискретизації</tspan><tspan x="289.0" dy="13.0">й ресинхрону, як в UART</tspan></text>
<rect x="387.0" y="70.0" width="168.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="2.0"/>
<text x="471.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">мінімум протоколу</text>
<text x="471.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="471.0" dy="0.0">ні адрес, ні ACK, ні старт-стопу —</tspan><tspan x="471.0" dy="13.0">8 тактів несуть 8 біт</tspan></text>
<rect x="569.0" y="70.0" width="168.0" height="150.0" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<text x="653.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">окремі лінії</text>
<text x="653.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="653.0" dy="0.0">MOSI й MISO роздільні —</tspan><tspan x="653.0" dy="13.0">повний дуплекс</tspan></text>
<rect x="60.0" y="250.0" width="640.0" height="46.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.3"/>
<text x="380.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Разом: різкі фронти + чесний такт + майже нуль накладних = найшвидша з простих шин.</text>
</svg>