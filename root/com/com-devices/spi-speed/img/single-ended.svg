<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">SPI однополюсний і без узгодження — не для довгих ліній</text>
<text x="220.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">однополюсний (SPI)</text>
<line x1="100.0" y1="190.0" x2="170.0" y2="190.0" stroke="#1a1a1a" stroke-width="2.4"/>
<line x1="170.0" y1="190.0" x2="170.0" y2="140.0" stroke="#1a1a1a" stroke-width="2.4"/>
<polyline points="170.0,140.0 170.0,140.0 174.6,143.8 179.2,146.9 183.8,149.2 188.5,150.6 193.1,151.1 197.7,150.9 202.3,150.0 206.9,148.5 211.5,146.7 216.2,144.6 220.8,142.5 225.4,140.5 230.0,138.7 234.6,137.2 239.2,136.0 243.8,135.3 248.5,135.0 253.1,135.0 257.7,135.3 262.3,135.9 266.9,136.7 271.5,137.7 276.2,138.6 280.8,139.6 285.4,140.4 290.0,141.1 294.6,141.7 299.2,142.1 303.8,142.3 308.5,142.3 313.1,142.2 317.7,141.9 322.3,141.6 326.9,141.2 331.5,140.7 336.2,140.3 340.8,139.9 345.4,139.6 350.0,139.3" fill="none" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="220.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">дзвін/відбиття від кінця дроту</text>
<text x="220.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">+ ловить завади (нема чим гасити)</text>
<text x="560.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">диференційний (для метрів)</text>
<polyline points="470.0,142.0 510.0,142.0 510.0,178.0 570.0,178.0 570.0,142.0 630.0,142.0 630.0,178.0 700.0,178.0" fill="none" stroke="#27ae60" stroke-width="2.4" stroke-linejoin="miter" stroke-linecap="round"/>
<polyline points="470.0,198.0 510.0,198.0 510.0,162.0 570.0,162.0 570.0,198.0 630.0,198.0 630.0,162.0 700.0,162.0" fill="none" stroke="#2457d6" stroke-width="2.0" stroke-linejoin="miter" stroke-linecap="round"/>
<text x="560.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">дві протифазні лінії: завада однакова</text>
<text x="560.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">на обох — у різниці гаситься</text>
<rect x="60.0" y="268.0" width="640.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/>
<text x="380.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">SPI — однополюсний і неузгоджений: чудово на короткій платі, погано на метрах кабелю.</text>
<text x="380.0" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Для відстані беруть диференційні шини (RS-485, CAN, LVDS), де завада гаситься різницею.</text>
<text x="380.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">SPI — житель плати: між сусідніми чіпами, а не між приладами через кабель.</text>
</svg>