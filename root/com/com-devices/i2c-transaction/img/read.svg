<rect x="60.0" y="282.0" width="780.0" height="44.0" rx="6" fill="#fff4e0" stroke="#c87f0a" stroke-width="1.5"/><text x="450.0" y="300.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Між фазами немає стопу — лише Sr, тож «вказав регістр» і «читаю» зшиті в одне неподільне ціле.</tspan><tspan x="450.0" dy="15.0">Стоп на мить звільнив би шину, і чужий ведучий міг би вклинитися й збити покажчик регістра.</tspan></text>
