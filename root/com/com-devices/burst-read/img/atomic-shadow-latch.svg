<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Узгодженість вимірювань: запобігання розриву слова (Word Tearing)</text>
<text x="460.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">як механізм Block Data Update (BDU) та тіньові регістри захищають від спотворення 16-бітних слів</text>
<rect x="40.0" y="75.0" width="405.0" height="380.0" rx="8" fill="#fdfefe" stroke="#c0392b" stroke-width="1.5"/>
<text x="242.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">БЕЗ блокування (BDU = 0)</text>
<text x="242.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ADC оновлює регістри посеред читання</text>
<rect x="55.0" y="140.0" width="375.0" height="48.0" rx="4" fill="#fadbd8" stroke="#c0392b" stroke-width="1.0"/>
<text x="75.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вибірка N:</text>
<text x="190.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">0x00FF (255)</text>
<text x="75.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вибірка N+1:</text>
<text x="190.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">0x0100 (256)</text>
<rect x="55.0" y="200.0" width="375.0" height="42.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="70.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Читання OUTX_L:</text>
<text x="280.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">взято 0xFF (з N)</text>
<rect x="55.0" y="252.0" width="375.0" height="38.0" rx="4" fill="#fdedec" stroke="#c0392b" stroke-width="1.2"/>
<text x="242.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">⚡ ADC завершив перетворення N+1! Регістри перезаписано</text>
<rect x="55.0" y="300.0" width="375.0" height="42.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="70.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Читання OUTX_H:</text>
<text x="280.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">взято 0x01 (з N+1)</text>
<rect x="55.0" y="355.0" width="375.0" height="85.0" rx="6" fill="#f9ebea" stroke="#c0392b" stroke-width="1.5"/>
<text x="242.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">РЕЗУЛЬТАТ ОБ'ЄДНАННЯ:</text>
<text x="242.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">(0x01 &lt;&lt; 8) | 0xFF = 0x01FF (511 відліків!)</text>
<text x="242.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Фальшивий сплеск на 100% шкали замість плавного 255 → 256</text>
<rect x="475.0" y="75.0" width="405.0" height="380.0" rx="8" fill="#fdfefe" stroke="#27ae60" stroke-width="1.5"/>
<text x="677.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">З ТІНЬОВИМИ РЕГІСТРАМИ (BDU = 1)</text>
<text x="677.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Атомарна фіксація вихідного банку</text>
<rect x="490.0" y="140.0" width="375.0" height="48.0" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.0"/>
<text x="510.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вибірка N:</text>
<text x="625.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">0x00FF (255)</text>
<text x="510.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вибірка N+1:</text>
<text x="625.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0x0100 (чекає в буфері ADC)</text>
<rect x="490.0" y="200.0" width="375.0" height="42.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="505.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Читання OUTX_L:</text>
<text x="715.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">взято 0xFF (замок активний)</text>
<rect x="490.0" y="252.0" width="375.0" height="38.0" rx="4" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.2"/>
<text x="677.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#117864" text-anchor="middle" font-weight="700">🔒 ADC завершив N+1, але вихідні регістри ЗАМОРОЖЕНО</text>
<rect x="490.0" y="300.0" width="375.0" height="42.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="505.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Читання OUTX_H:</text>
<text x="715.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">взято 0x00 (з тої ж вибірки N)</text>
<rect x="490.0" y="355.0" width="375.0" height="85.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="677.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">РЕЗУЛЬТАТ ОБ'ЄДНАННЯ:</text>
<text x="677.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">(0x00 &lt;&lt; 8) | 0xFF = 0x00FF (255 відліків)</text>
<text x="677.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Ідеальна фізична узгодженість. Замок знімається після читання MSB</text>
</svg>