<text x="831.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">7 бітів</text>
<rect x="869.0" y="115.0" width="24.0" height="50.0" rx="4" fill="#d5dbdb" stroke="#333333" stroke-width="1.0"/>
