<text x="45.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">CMD52: Прямий доступ до регістру (IO_RW_DIRECT) — 1 байт за транзакцію</text>
<text x="890.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-style="italic">Не займає лінії даних DAT[0..3]</text>
