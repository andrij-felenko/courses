<text x="319.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7d6608" text-anchor="middle" font-weight="700">RAW</text>
<text x="319.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1/0</text>
<rect x="344.0" y="115.0" width="38.0" height="50.0" rx="4" fill="#eaeded" stroke="#333333" stroke-width="1.0"/>
<text x="363.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Stuff</text>
<text x="363.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0</text>
<rect x="385.0" y="115.0" width="255.0" height="50.0" rx="4" fill="#eaf2f8" stroke="#333333" stroke-width="1.0"/>
<text x="512.5" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Register Address</text>
<text x="512.5" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">17 бітів (0x00000 .. 0x1FFFF)</text>
<rect x="643.0" y="115.0" width="150.0" height="50.0" rx="4" fill="#fdedec" stroke="#333333" stroke-width="1.0"/>
<text x="718.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Write Data</text>
<text x="718.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">8 бітів (байт запису)</text>
<rect x="796.0" y="115.0" width="70.0" height="50.0" rx="4" fill="#f4ecf7" stroke="#333333" stroke-width="1.0"/>
