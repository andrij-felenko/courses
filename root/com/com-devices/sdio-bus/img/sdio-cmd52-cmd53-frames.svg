<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формати кадрів керування SDIO: команди прямого (CMD52) та розширеного (CMD53) доступу</text>
<text x="470.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">48-бітні командні послідовності на лінії CMD та структура полів аргументу</text>
