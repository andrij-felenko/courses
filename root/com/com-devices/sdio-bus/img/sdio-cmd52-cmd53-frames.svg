<rect x="45.0" y="174.0" width="415.0" height="75.0" rx="4" fill="#fbfcfc" stroke="#6b7280" stroke-width="1.0"/>
<text x="55.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Прапорець RAW (Read After Write, біт 27):</text>
<text x="55.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• 0 = у відповіді повертається стан регістру ДО запису;</text>
<text x="55.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• 1 = повертається оновлене значення ПІСЛЯ виконання запису.</text>
<text x="55.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start">Дозволяє атомарно записати керівний біт і перевірити результат.</text>
<rect x="475.0" y="174.0" width="420.0" height="75.0" rx="4" fill="#fbfcfc" stroke="#6b7280" stroke-width="1.0"/>
<text x="485.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Відповідь R5 (48 біт у зворотному напрямку):</text>
<text x="485.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• 8 бітів прочитаних даних (Read Data) з адресованого регістру;</text>
<text x="485.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">• 8 бітів прапорців стану SDIO (COM_CRC_ERR, ILLEGAL_CMD, ERROR);</text>
<text x="485.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start">• Прапорці стану функції (IO_CURRENT_STATE) та апаратні біти помилок.</text>
<rect x="30.0" y="280.0" width="880.0" height="205.0" rx="8" fill="#fdfefe" stroke="#27ae60" stroke-width="1.5"/>
<rect x="30.0" y="280.0" width="880.0" height="32.0" rx="8" fill="#e8f8f5" stroke="#27ae60" stroke-width="1.5"/>
<text x="45.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">CMD53: Розширений доступ (IO_RW_EXTENDED) — пакетний / блоковий обмін через DAT[0..3]</text>
<text x="890.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-style="italic">Потоки FIFO та блоки до 512 байтів</text>
