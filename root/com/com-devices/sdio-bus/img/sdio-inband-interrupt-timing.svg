<line x1="790.0" y1="207.0" x2="905.0" y2="207.0" stroke="#6b7280" stroke-width="1.5"/>
<rect x="35.0" y="385.0" width="870.0" height="75.0" rx="6" fill="#fdfefe" stroke="#6b7280" stroke-width="1.0"/>
<text x="45.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Ключові аспекти внутрішньосмугової сигналізації переривань:</text>
<text x="45.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">1. Не потребує окремого фізичного виводу IRQ на друкованій платі — заощаджує виводи хоста та площу модуля;</text>
<text x="45.0" y="437.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">2. Переривання активне лише між передачею блоків (Interrupt Period). Під час пакетного обміну воно тимчасово блокується;</text>
<text x="45.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start">3. Асинхронний режим дозволяє пристрою розбудити хост при зупиненій тактовій частоті шини CLK (енергозбереження).</text>
</svg>