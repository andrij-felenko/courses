<text x="470.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Апаратний механізм внутрішньосмугового переривання (SDIO In-band Interrupt) на лінії DAT1</text>
<text x="470.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Мультиплексування лінії даних DAT1 між передачею корисних бітів та сигналізацією запиту IRQ</text>
