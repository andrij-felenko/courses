<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Матриця чотирьох режимів SPI (Motorola)</text><rect x="178.3" y="52.0" width="223.5" height="45.9" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="290.0" y="71.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">CPOL = 0</tspan><tspan x="290.0" dy="16.9">(SCLK спокій = 0 В, низький)</tspan></text><rect x="490.9" y="52.0" width="238.3" height="45.9" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="610.0" y="71.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">CPOL = 1</tspan><tspan x="610.0" dy="16.9">(SCLK спокій = 3.3 В, високий)</tspan></text><rect x="28.8" y="163.6" width="112.3" height="62.8" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/><text x="85.0" y="182.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="85.0" dy="0.0">CPHA = 0</tspan><tspan x="85.0" dy="16.9">1-й фронт:</tspan><tspan x="85.0" dy="16.9">вибірка даних</tspan></text><rect x="28.8" y="333.6" width="112.3" height="62.8" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="85.0" y="352.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="85.0" dy="0.0">CPHA = 1</tspan><tspan x="85.0" dy="16.9">2-й фронт:</tspan><tspan x="85.0" dy="16.9">вибірка даних</tspan></text><rect x="170.0" y="120.0" width="240.0" height="150.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="2.0"/><text x="290.0" y="174.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Mode 0 (0, 0)</tspan><tspan x="290.0" dy="11.7">• 1-й фронт (наростання): ВИБІРКА (Sample)</tspan><tspan x="290.0" dy="11.7">• 2-й фронт (спадання): ЗМІНА (Shift)</tspan><tspan x="290.0" dy="11.7">• MSB виставляється по спаду /CS</tspan><tspan x="290.0" dy="11.7">★ Стандарт де-факто (Flash, SD, АЦП)</tspan></text><rect x="490.0" y="120.0" width="240.0" height="150.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="610.0" y="174.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Mode 2 (1, 0)</tspan><tspan x="610.0" dy="11.7">• 1-й фронт (спадання): ВИБІРКА (Sample)</tspan><tspan x="610.0" dy="11.7">• 2-й фронт (наростання): ЗМІНА (Shift)</tspan><tspan x="610.0" dy="11.7">• MSB виставляється по спаду /CS</tspan><tspan x="610.0" dy="11.7">Рідкісний інверсний режим</tspan></text><rect x="170.0" y="290.0" width="240.0" height="150.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="290.0" y="344.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Mode 1 (0, 1)</tspan><tspan x="290.0" dy="11.7">• 1-й фронт (наростання): ЗМІНА (Shift)</tspan><tspan x="290.0" dy="11.7">• 2-й фронт (спадання): ВИБІРКА (Sample)</tspan><tspan x="290.0" dy="11.7">• MSB виставляється на 1-му фронті SCLK</tspan><tspan x="290.0" dy="11.7">Використовується в деяких DSP / ASIC</tspan></text><rect x="490.0" y="290.0" width="240.0" height="150.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="2.0"/><text x="610.0" y="344.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Mode 3 (1, 1)</tspan><tspan x="610.0" dy="11.7">• 1-й фронт (спадання): ЗМІНА (Shift)</tspan><tspan x="610.0" dy="11.7">• 2-й фронт (наростання): ВИБІРКА (Sample)</tspan><tspan x="610.0" dy="11.7">• MSB виставляється на 1-му фронті SCLK</tspan><tspan x="610.0" dy="11.7">★ Стандарт Flash-пам'яті (сумісний з Mode 0)</tspan></text>
</svg>