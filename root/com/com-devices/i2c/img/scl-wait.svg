<text x="236.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end"><tspan x="236.0" dy="0.0">що робить майстер</tspan><tspan x="236.0" dy="15.0">(його намір)</tspan></text>
<text x="236.0" y="487.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="700"><tspan x="236.0" dy="0.0">що насправді</tspan><tspan x="236.0" dy="15.0">на лінії SCL</tspan></text>
<line x1="250.0" y1="532.0" x2="630.0" y2="532.0" stroke="#c0392b" stroke-width="1.8"/><line x1="250.0" y1="527.0" x2="250.0" y2="537.0" stroke="#c0392b" stroke-width="1.8"/><line x1="630.0" y1="527.0" x2="630.0" y2="537.0" stroke="#c0392b" stroke-width="1.8"/>
<text x="440.0" y="552.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ведений тримає SCL внизу</text>
<line x1="644.0" y1="532.0" x2="720.0" y2="532.0" stroke="#27ae60" stroke-width="1.8"/><line x1="644.0" y1="527.0" x2="644.0" y2="537.0" stroke="#27ae60" stroke-width="1.8"/><line x1="720.0" y1="527.0" x2="720.0" y2="537.0" stroke="#27ae60" stroke-width="1.8"/>
<text x="682.0" y="552.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">дійшов лише другий такт</text>
<rect x="250.0" y="566.0" width="690.0" height="34.0" rx="6" fill="#fdeeea" stroke="#c0392b" stroke-width="1.5"/><text x="595.0" y="587.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Першого такту на лінії не було: майстер відлічив два біти, ведений — один, і кадр поїхав</tspan></text>
