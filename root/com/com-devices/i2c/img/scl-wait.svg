<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 618" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="618" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відпустити SCL — ще не означає, що SCL піднявся</text>
<text x="24.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Майстер зчитує лінію: відпустив — і чекає, поки вона справді піднялася</text>
<rect x="250.0" y="184.0" width="350.0" height="58.0" rx="4" fill="#fbeeee" stroke="#f1d7d7" stroke-width="1.0"/>
<polyline points="250.0,146.0 330.0,146.0 338.0,104.0 800.0,104.0 808.0,146.0 940.0,146.0" fill="none" stroke="#6b7280" stroke-width="2.8" stroke-linejoin="round"/>
<polyline points="250.0,232.0 600.0,232.0 614.0,190.0 800.0,190.0 808.0,232.0 940.0,232.0" fill="none" stroke="#1a1a1a" stroke-width="3.0" stroke-linejoin="round"/>
<text x="236.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end"><tspan x="236.0" dy="0.0">що робить майстер</tspan><tspan x="236.0" dy="15.0">(його намір)</tspan></text>
