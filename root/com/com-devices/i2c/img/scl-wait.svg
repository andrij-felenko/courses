<line x1="250.0" y1="252.0" x2="600.0" y2="252.0" stroke="#c0392b" stroke-width="1.8"/><line x1="250.0" y1="247.0" x2="250.0" y2="257.0" stroke="#c0392b" stroke-width="1.8"/><line x1="600.0" y1="247.0" x2="600.0" y2="257.0" stroke="#c0392b" stroke-width="1.8"/>
<text x="425.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ведений тримає SCL внизу</text>
<line x1="614.0" y1="252.0" x2="800.0" y2="252.0" stroke="#27ae60" stroke-width="1.8"/><line x1="614.0" y1="247.0" x2="614.0" y2="257.0" stroke="#27ae60" stroke-width="1.8"/><line x1="800.0" y1="247.0" x2="800.0" y2="257.0" stroke="#27ae60" stroke-width="1.8"/>
<text x="707.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">повний t_HIGH</text>
<rect x="250.0" y="286.0" width="690.0" height="34.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="595.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Такт на лінії почався з реального підйому — ведений побачив фронт і зарахував біт</tspan></text>
<text x="24.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Майстер наосліп: відпустив і одразу відлічує високий такт за таймером</text>
<rect x="250.0" y="464.0" width="380.0" height="58.0" rx="4" fill="#fbeeee" stroke="#f1d7d7" stroke-width="1.0"/>
<polyline points="250.0,426.0 330.0,426.0 338.0,384.0 460.0,384.0 468.0,426.0 590.0,426.0 598.0,384.0 720.0,384.0 728.0,426.0 940.0,426.0" fill="none" stroke="#6b7280" stroke-width="2.8" stroke-linejoin="round"/>
