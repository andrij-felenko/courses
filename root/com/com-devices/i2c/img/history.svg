<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 736" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="736" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві нитки однієї історії: як росла специфікація і як мінялися права на неї</text>
<circle cx="232.0" cy="74.0" r="6.5" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="246.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">специфікація шини</text>
<circle cx="560.0" cy="74.0" r="6.5" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<text x="574.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">права, ліцензія та імена</text>
<line x1="194.0" y1="106.0" x2="194.0" y2="702.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="168.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">1980</text>
<circle cx="194.0" cy="128.0" r="6.5" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="218.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">31 жовтня — пріоритет патенту Philips на дводротову шину</text>
<text x="168.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">1982</text>
<circle cx="194.0" cy="174.0" r="6.5" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="218.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">шина в кремнії: перші чипи для телевізорів Philips</text>
<text x="168.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">1984</text>
<circle cx="194.0" cy="220.0" r="6.5" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<text x="218.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">видано європейський патент EP 0051332</text>
<text x="168.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">1987</text>
<circle cx="194.0" cy="266.0" r="6.5" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<text x="218.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">видано патент США 4 689 740 (згас 2004 року)</text>
<text x="168.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">1992</text>
<circle cx="194.0" cy="312.0" r="6.5" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="218.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">редакція 1.0: швидкий режим 400 кбіт/с і 10-бітні адреси</text>
<text x="168.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">1994</text>
<circle cx="194.0" cy="358.0" r="6.5" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<text x="218.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">Intel і Duracell будують SMBus — підмножину I²C</text>
<text x="168.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">1998</text>
<circle cx="194.0" cy="404.0" r="6.5" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="218.0" y="409.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">редакція 2.0: надшвидкий режим 3.4 Мбіт/с</text>
<text x="168.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">кін. 1990-х</text>
<circle cx="194.0" cy="450.0" r="6.5" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<text x="218.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">у чужих даташитах з'являється TWI замість імені I²C</text>
<text x="168.0" y="501.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">2006</text>
<circle cx="194.0" cy="496.0" r="6.5" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<text x="218.0" y="501.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">1 жовтня знято ліцензійну плату; Philips виділяє NXP</text>
<text x="168.0" y="547.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">2007</text>
<circle cx="194.0" cy="542.0" r="6.5" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="218.0" y="547.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">редакція 3.0: швидкий-плюс 1 Мбіт/с</text>
<text x="168.0" y="593.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">2012</text>
<circle cx="194.0" cy="588.0" r="6.5" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="218.0" y="593.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">редакція 4.0: однонапрямний UFm 5 Мбіт/с</text>
<text x="168.0" y="639.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">2017</text>
<circle cx="194.0" cy="634.0" r="6.5" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<text x="218.0" y="639.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">MIPI оголошує I3C — наступника на тих самих двох дротах</text>
<text x="168.0" y="685.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="end" font-weight="700">2021</text>
<circle cx="194.0" cy="680.0" r="6.5" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="218.0" y="685.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start">редакція 7.0: майстер/ведений → контролер/ціль</text>
</svg>