<text x="450.0" y="396.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Виняток — навмисна зміна SDA при високому SCL: це сигнали СТАРТ і СТОП.</text>
