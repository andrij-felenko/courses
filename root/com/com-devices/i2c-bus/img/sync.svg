<text x="450.0" y="392.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Ціна — третій дріт (SCL) проти UART; зате на ньому вживається БАГАТО пристроїв.</text>
