<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400">
<rect width="880" height="400" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
</defs>
<text x="440.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ролі на шині: ведучий веде такт, ведений відгукується</text>
<text x="440.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">ведучий (master/controller) завжди керує SCL і починає обмін; SDA тримають по черзі</text>
<rect x="90.0" y="110.0" width="200.0" height="150.0" rx="12" fill="#eef6ef" stroke="#1f8a3b" stroke-width="2.2"/>
<text x="190.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1f8a3b" text-anchor="middle" font-weight="bold" font-style="normal">ВЕДУЧИЙ</text>
<text x="190.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(master / controller)</text>
<text x="110.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• завжди генерує SCL</text>
<text x="110.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• починає й завершує обмін</text>
<text x="110.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• називає адресу ВЕДЕНОГО</text>
<rect x="590.0" y="110.0" width="200.0" height="150.0" rx="12" fill="#fbfbfb" stroke="#1b1b1b" stroke-width="2.2"/>
<text x="690.0" y="138.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">ВЕДЕНИЙ</text>
<text x="690.0" y="158.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal">(slave / target)</text>
<text x="610.0" y="186.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• слухає свою адресу</text>
<text x="610.0" y="208.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• відповідає (ACK, дані)</text>
<text x="610.0" y="230.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="normal" font-style="normal">• такт не генерує*</text>
<line x1="290.0" y1="150.0" x2="590.0" y2="150.0" stroke="#1f47b5" stroke-width="2.4" marker-end="url(#aBlue)"/>
<text x="440.0" y="140.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1f47b5" text-anchor="middle" font-weight="bold" font-style="normal">SCL (такт) — лише від ведучого</text>
<line x1="290.0" y1="200.0" x2="590.0" y2="200.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<line x1="590.0" y1="224.0" x2="290.0" y2="224.0" stroke="#c0271e" stroke-width="2.2" marker-end="url(#aRed)"/>
<text x="440.0" y="192.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#c0271e" text-anchor="middle" font-weight="bold" font-style="normal">SDA (дані) — по черзі в обидва боки</text>
<rect x="60.0" y="300.0" width="760.0" height="80.0" rx="10" fill="#f3f3f3" stroke="#8a8a8a" stroke-width="1.3"/>
<text x="440.0" y="324.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Зазвичай ведучий — мікроконтролер, ведені — давачі та дисплеї.</text>
<text x="440.0" y="346.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">* виняток: ведений може ПРИТРИМАТИ такт (clock stretching).</text>
<text x="440.0" y="366.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Сучасна специфікація вживає «controller/target», даташити досі — «master/slave».</text>
</svg>
