<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 452" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="452" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три числа роздільності: крок, опір, дільник</text>
<text x="40.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Прямий заряд: крок напруги ворушить струм через опір шляху</text>
<rect x="40.0" y="108.0" width="170.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="125.0" y="140.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">PPS</tspan><tspan x="125.0" dy="17.6">крок ΔU = 20 мВ</tspan></text>
<line x1="214.0" y1="145.0" x2="292.0" y2="145.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="292.0" y="108.0" width="200.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="392.0" y="140.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="392.0" dy="0.0">R = ESR + провідники</tspan><tspan x="392.0" dy="17.6">≈ 30 мОм</tspan></text>
<line x1="496.0" y1="145.0" x2="574.0" y2="145.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="574.0" y="108.0" width="180.0" height="74.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="664.0" y="140.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="664.0" dy="0.0">Комірка</tspan><tspan x="664.0" dy="17.6">EMF ≈ 4.40 В</tspan></text>
<text x="768.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">ΔU повністю</text>
<text x="768.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">лягає на R</text>
<rect x="292.0" y="202.0" width="400.0" height="40.0" rx="6" fill="#fff8e1" stroke="#c0392b" stroke-width="1.5"/><text x="492.0" y="226.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="492.0" dy="0.0">ΔI = ΔU / R = 20 мВ / 30 мОм ≈ 0.67 А</tspan></text>
<text x="40.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Дільник 2:1: половинить крок напруги, подвоює крок струму</text>
<rect x="40.0" y="300.0" width="170.0" height="74.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="125.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="125.0" dy="0.0">PPS</tspan><tspan x="125.0" dy="17.6">ΔU = 20 мВ</tspan></text>
<line x1="214.0" y1="337.0" x2="292.0" y2="337.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="292.0" y="300.0" width="200.0" height="74.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="392.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="392.0" dy="0.0">Дільник 2:1</tspan><tspan x="392.0" dy="17.6">(заряд-помпа)</tspan></text>
<line x1="496.0" y1="337.0" x2="574.0" y2="337.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="574.0" y="300.0" width="180.0" height="74.0" rx="6" fill="#eef2ff" stroke="#2457d6" stroke-width="1.5"/><text x="664.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="664.0" dy="0.0">Комірка</tspan><tspan x="664.0" dy="17.6">крок = 10 мВ</tspan></text>
<text x="470.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">на комірці 10 мВ (÷2)     ·     I комірки = 2·I входу     ·     опір комірки з входу × 4</text>
</svg>