<text x="303.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Bit 10 (Запит)</text>
<rect x="362.0" y="250.0" width="80.0" height="42.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="402.0" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Резерв</text>
