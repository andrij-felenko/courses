<rect x="594.0" y="154.0" width="131.0" height="44.0" rx="3" fill="#93c5fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="659.5" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Message Type</text>
<text x="659.5" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Bits 4..0 (Тип)</text>
