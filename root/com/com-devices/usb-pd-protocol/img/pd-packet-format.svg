<text x="585.5" y="267.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Data Size (Розмір даних у байтах)</text>
<text x="585.5" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Bits 8..0 (0..260 байтів у повному повідомленні)</text>
<text x="40.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">•  Num Data Objects = 0 → Керівне повідомлення (Control Message: GoodCRC, Accept, Reject, Wait, Soft_Reset тощо)</text>
<text x="40.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">•  Num Data Objects = 1..7 (Ext = 0) → Повідомлення даних (Data Message: Source_Capabilities, Request, BIST, VDM)</text>
<text x="40.0" y="369.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">•  Ext = 1 → Розширене повідомлення (Extended Message: дані до 260 байт, chunked фрагментація по 26 байт)</text>
</svg>