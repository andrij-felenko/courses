<text x="610.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">32 біти (4 Байти)</text>
<rect x="670.0" y="48.0" width="65.0" height="46.0" rx="4" fill="#f1f5f9" stroke="#333333" stroke-width="1.5"/>
<text x="702.5" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">EOP</text>
<text x="702.5" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1 K-код</text>
