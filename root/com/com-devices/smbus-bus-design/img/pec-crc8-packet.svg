<text x="410.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="700">Апаратний або програмний поліном CRC-8</text>
<text x="410.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Поліном: C(x) = x⁸ + x² + x¹ + 1   (двійкове 100000111b = 0x107 / 0x07)</text>
<text x="410.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Початкове значення залишку: 0x00 · Вхідний потік: адреси, команди, дані</text>
<line x1="550.0" y1="150.0" x2="640.0" y2="100.0" stroke="#db2777" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="245.0" width="720.0" height="65.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="410.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700">• При читанні з Repeated START адреса веденого з бітом R (0x5B) повторно входить до потоку CRC!</text>
<text x="410.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Якщо ведений отримує некоректний PEC при записі, він зобов'язаний виставити NACK і відкинути дані.</text>
<text x="410.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Якщо хост фіксує невідповідність PEC при читанні, транзакція відкидається без пошкодження стану ОС.</text>
</svg>