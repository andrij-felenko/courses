<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ніжка CS: компенсація кабелю та її побічний ефект</text>
<text x="250.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">як CS піднімає VBUS</text>
<rect x="179.3" y="146.5" width="141.4" height="27.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="250.0" y="163.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">струм у кабель росте</tspan></text>
<line x1="250.0" y1="176.0" x2="250.0" y2="199.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="160.5" y="201.5" width="179.0" height="27.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="250.0" y="218.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">CS тягне струм із вузла FB</tspan></text>
<line x1="250.0" y1="231.0" x2="250.0" y2="254.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="151.1" y="256.5" width="197.8" height="27.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="250.0" y="273.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">регулятор бачить занижений FB</tspan></text>
<line x1="250.0" y1="286.0" x2="250.0" y2="309.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="144.8" y="311.5" width="210.4" height="27.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.4"/><text x="250.0" y="328.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">і піднімає свій вихід до ≈5.2 В</tspan></text>
<line x1="250.0" y1="341.0" x2="250.0" y2="364.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="122.9" y="366.5" width="254.3" height="27.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/><text x="250.0" y="383.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">на дальньому кінці кабелю — знову ≈5 В</tspan></text>
<text x="700.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">чим це віддається на підписі</text>
<line x1="700.0" y1="390.0" x2="700.0" y2="170.0" stroke="#1a1a1a" stroke-width="2.0"/>
<rect x="670.0" y="196.8" width="60.0" height="146.6" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="660.0" y="347.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">1.9 В</text>
<text x="660.0" y="200.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">2.1 В</text>
<text x="752.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">стеля вікна 2.1 В</text>
<line x1="660.0" y1="270.1" x2="744.0" y2="270.1" stroke="#2457d6" stroke-width="2.0"/>
<circle cx="700.0" cy="270.1" r="4.5" fill="#2457d6" stroke="#2457d6" stroke-width="1.0"/>
<text x="752.0" y="274.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">2.00 В — при VBUS 5.0 В</text>
<line x1="660.0" y1="211.4" x2="744.0" y2="211.4" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="700.0" cy="211.4" r="4.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="752.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">2.08 В — при VBUS 5.2 В</text>
<rect x="166.1" y="426.5" width="567.8" height="27.0" rx="6" fill="#fdf6e3" stroke="#b8901f" stroke-width="1.3"/><text x="450.0" y="443.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">компенсація кабелю рятує ватти — і водночас підпихає вузол класу 2.0 до стелі його вікна</tspan></text>
