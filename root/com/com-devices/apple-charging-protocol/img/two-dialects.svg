<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дільник проти BC1.2 і автовизначення</text>
<text x="380.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">одна пара ліній — дві несумісні вимоги</text>
<rect x="58.0" y="64.0" width="276.0" height="104.0" rx="9" fill="#fdf6e3" stroke="#b8901f" stroke-width="1.6"/>
<text x="196.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8901f" text-anchor="middle" font-weight="700">BC1.2 вимагає</text>
<text x="196.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">D+ замкнено на D−</text>
<text x="196.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">наскрізь, ≤200 Ом</text>
<text x="196.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">одна напруга на двох лініях</text>
<rect x="426.0" y="64.0" width="276.0" height="104.0" rx="9" fill="#f2ecf8" stroke="#7a4fb0" stroke-width="1.6"/>
<text x="564.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a4fb0" text-anchor="middle" font-weight="700">дільник вимагає</text>
<text x="564.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">D+ = 2.7 В, D− = 2.0 В</text>
<text x="564.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">різниця 0.7 В між лініями</text>
<text x="564.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">замкнеш — код зникне</text>
<circle cx="380.0" cy="116.0" r="20.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="380.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">✗</text>
<text x="380.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">вихід — не обидва разом, а перемикання за поведінкою пристрою</text>
<line x1="267.4" y1="282.0" x2="502.9" y2="282.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="380.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">пристрій потяг D+ униз → це BC1.2-проба</text>
<line x1="502.9" y1="320.0" x2="267.4" y2="320.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="380.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">D+ &lt; 330 мВ → пристрій від'єднано</text>
<rect x="116.6" y="268.2" width="146.8" height="63.6" rx="6" fill="#f2ecf8" stroke="#7a4fb0" stroke-width="1.8"/><text x="190.0" y="289.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7a4fb0" text-anchor="middle" font-weight="700"><tspan x="190.0" dy="0.0">режим дільника</tspan><tspan x="190.0" dy="14.3">2.7 В / 2.0 В</tspan><tspan x="190.0" dy="14.3">(за замовчуванням)</tspan></text>
<rect x="506.9" y="268.2" width="126.3" height="63.6" rx="6" fill="#fdf6e3" stroke="#b8901f" stroke-width="1.8"/><text x="570.0" y="289.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8901f" text-anchor="middle" font-weight="700"><tspan x="570.0" dy="0.0">режим замикання</tspan><tspan x="570.0" dy="14.3">D+ ↔ D−</tspan><tspan x="570.0" dy="14.3">≤200 Ом</tspan></text>
<rect x="158.8" y="384.5" width="442.4" height="27.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/><text x="380.0" y="401.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">той самий блок обслуговує обидва діалекти — по черзі, а не одночасно</tspan></text>
</svg>