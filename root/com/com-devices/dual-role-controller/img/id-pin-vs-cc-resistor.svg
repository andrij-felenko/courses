<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хто оголошує роль: приварений пін vs перемикний резистор</text>
<rect x="30.0" y="60.0" width="430.0" height="300.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="2.0"/>
<rect x="500.0" y="60.0" width="430.0" height="300.0" rx="6" fill="#f2faf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="245.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">До USB-C: вирішує КАБЕЛЬ</text>
<text x="715.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">USB-C: вирішує РЕЗИСТОР</text>
<rect x="46.0" y="115.0" width="398.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="245.0" y="140.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Штекер mini-A заземляє пін ID →</tspan><tspan x="245.0" dy="15.6">я A-пристрій: і хост, і джерело VBUS.</tspan></text>
<rect x="46.0" y="185.0" width="398.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="245.0" y="210.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">HNP міняє лише РОЛЬ ДАНИХ</tspan><tspan x="245.0" dy="15.6">(хост ↔ периферія) — живлення ніколи.</tspan></text>
<rect x="46.0" y="255.0" width="398.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="245.0" y="280.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Напрям живлення приварено до штекера:</tspan><tspan x="245.0" dy="15.6">A-пристрій годує весь сеанс.</tspan></text>
<rect x="516.0" y="115.0" width="398.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="715.0" y="140.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Rp (вгору) = «можу бути джерелом»,</tspan><tspan x="715.0" dy="15.6">Rd (вниз) = «можу бути стоком».</tspan></text>
<rect x="516.0" y="185.0" width="398.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="715.0" y="210.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Резистор перемикають ПРОГРАМНО →</tspan><tspan x="715.0" dy="15.6">порт DRP чергує Rp ↔ Rd.</tspan></text>
<rect x="516.0" y="255.0" width="398.0" height="58.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="715.0" y="280.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">PD додає PR_Swap: РОЛЬ ЖИВЛЕННЯ</tspan><tspan x="715.0" dy="15.6">міняється наживо, без перетику кабелю.</tspan></text>
<rect x="160.1" y="418.8" width="639.9" height="32.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="480.0" y="439.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Від «кабель вирішує роль — і назавжди» до «порт вирішує сам і може передумати на ходу».</tspan></text>
</svg>