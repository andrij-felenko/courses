<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому пристрій мусить упізнавати порт</text>
<rect x="40.0" y="60.0" width="300.0" height="250.0" rx="10" fill="#eef4ff" stroke="#2457d6" stroke-width="1.4"/>
<rect x="380.0" y="60.0" width="300.0" height="250.0" rx="10" fill="#fdf6e3" stroke="#b8901f" stroke-width="1.4"/>
<text x="190.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Хост-порт (ПК)</text>
<text x="530.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8901f" text-anchor="middle" font-weight="700">Блок у розетку</text>
<rect x="70.0" y="110.0" width="100.0" height="50.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/><text x="120.0" y="131.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0.0">ПК</tspan><tspan x="120.0" dy="14.3">(є процесор)</tspan></text>
<rect x="210.0" y="110.0" width="100.0" height="50.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="260.0" y="138.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="260.0" dy="0.0">пристрій</tspan></text>
<line x1="170.0" y1="126.0" x2="208.0" y2="126.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="208.0" y1="144.0" x2="170.0" y2="144.0" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="190.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">D+/D−: енумерація</text>
<text x="190.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(домовляються)</text>
<text x="190.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">хост дозволяє</text>
<text x="190.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0.5 А (USB2) / 0.9 А (USB3)</text>
<text x="190.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">є з ким говорити —</text>
<text x="190.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">беремо рівно дозволене</text>
<rect x="410.0" y="110.0" width="100.0" height="50.0" rx="6" fill="#ffffff" stroke="#b8901f" stroke-width="1.6"/><text x="460.0" y="131.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8901f" text-anchor="middle" font-weight="700"><tspan x="460.0" dy="0.0">блок</tspan><tspan x="460.0" dy="14.3">(нема CPU)</tspan></text>
<rect x="550.0" y="110.0" width="100.0" height="50.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/><text x="600.0" y="138.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">пристрій</tspan></text>
<line x1="510.0" y1="135.0" x2="548.0" y2="135.0" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="530.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">нема з ким</text>
<text x="530.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">D+/D−: розмови нема</text>
<text x="530.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">скільки можна взяти?</text>
<text x="530.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">забагато → просадка</text>
<text x="530.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">чи перегрів блока</text>
<text x="530.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8901f" text-anchor="middle" font-weight="700">треба впізнати порт</text>
<text x="530.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">самими D+/D− (BC1.2)</text>
<rect x="107.5" y="324.5" width="505.1" height="27.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/><text x="360.0" y="341.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">BC1.2 дає пристрою впізнати тип порту самими лініями даних — без жодного хоста</tspan></text>
</svg>