<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підпис зарядки: D+ замкнено на D−</text>
<rect x="60.0" y="80.0" width="250.0" height="170.0" rx="10" fill="#fdf6e3" stroke="#b8901f" stroke-width="1.5"/>
<text x="185.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b8901f" text-anchor="middle" font-weight="700">DCP: тупий блок</text>
<line x1="90.0" y1="150.0" x2="280.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="90.0" y1="200.0" x2="280.0" y2="200.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="86.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">D+</text>
<text x="86.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">D−</text>
<line x1="250.0" y1="150.0" x2="250.0" y2="200.0" stroke="#27ae60" stroke-width="2.4"/>
<text x="262.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">≤200 Ом</text>
<text x="185.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">увесь «підпис» — одна перемичка</text>
<rect x="430.0" y="80.0" width="230.0" height="170.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="545.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">пристрій: проба</text>
<text x="545.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">подає ~0.6 В на D+</text>
<line x1="455.0" y1="156.0" x2="635.0" y2="156.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="545.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">дивиться на D−</text>
<text x="545.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">напруга перетекла →</text>
<text x="545.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">лінії замкнені → це зарядка</text>
<line x1="312.0" y1="165.0" x2="428.0" y2="165.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
</svg>