<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два механізми в одному роз'ємі</text>
<rect x="40.0" y="70.0" width="230.0" height="190.0" rx="10" fill="#fdf6e3" stroke="#b8901f" stroke-width="1.5"/>
<text x="155.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b8901f" text-anchor="middle" font-weight="700">легасі-світ</text>
<text x="155.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">коди на D+/D−</text>
<text x="155.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">BC1.2 + фірмові</text>
<text x="155.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8901f" text-anchor="middle" font-weight="700">межа ≈ 1.5 А (7.5 Вт)</text>
<text x="155.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">для старих пристроїв</text>
<text x="155.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">і перехідників</text>
<rect x="450.0" y="70.0" width="230.0" height="190.0" rx="10" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="565.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">сучасний світ</text>
<text x="565.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">резистори CC + PD</text>
<text x="565.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">на лініях CC</text>
<text x="565.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">CC → 15 Вт, PD → 240 Вт</text>
<text x="565.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">для USB-C</text>
<text x="565.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">пристроїв</text>
<line x1="295.0" y1="165.0" x2="272.0" y2="165.0" stroke="#b8901f" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="425.0" y1="165.0" x2="448.0" y2="165.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="295.0" y="137.2" width="130.0" height="55.6" rx="6" fill="#f6f4ec" stroke="#1a1a1a" stroke-width="2.0"/><text x="360.0" y="161.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="360.0" dy="0.0">сучасний</tspan><tspan x="360.0" dy="15.6">зарядний</tspan></text>
<rect x="88.7" y="282.5" width="542.7" height="27.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/><text x="360.0" y="299.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">добрий зарядний говорить обома мовами — кожен пристрій бере зрозуміле йому запитання</tspan></text>
</svg>