<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 800" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="980" height="800" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат споживача: де кремній, де хост і куди веде «тупий DCP»</text>
<rect x="360.0" y="49.0" width="280.0" height="58.0" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.6"/><text x="500.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">IDLE</text><text x="500.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">VBUS нема, драйвери в HiZ</text>
<rect x="320.0" y="140.0" width="360.0" height="100.0" rx="8" fill="#f0e9f8" stroke="#7a4fb0" stroke-width="1.6"/><text x="500.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a4fb0" text-anchor="middle" font-weight="700">DETECT — робить сам чип</text><text x="500.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">BC1.2: то хто там узагалі</text><text x="500.0" y="199.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">D+ = 0.6 В, утримання 1.25 с</text><text x="500.0" y="216.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">D− впала? отже, блок уміє QC</text>
<rect x="320.0" y="276.0" width="360.0" height="58.0" rx="8" fill="#f4f6f8" stroke="#7a4fb0" stroke-width="1.6"/><text x="500.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a4fb0" text-anchor="middle" font-weight="700">CLASSIFY — читаємо VBUS_STAT</text><text x="500.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">вердикт кремнію, а не здогад</text>
<rect x="360.0" y="372.0" width="280.0" height="76.0" rx="8" fill="#f4f6f8" stroke="#7a4fb0" stroke-width="1.6"/><text x="500.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a4fb0" text-anchor="middle" font-weight="700">CODE — просимо 9 В</text><text x="500.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">D+ = 3.3 / D− = 0.6</text><text x="500.0" y="431.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">чекаємо 80 мс + 200 мс</text>
<rect x="350.0" y="481.0" width="300.0" height="58.0" rx="8" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="500.0" y="502.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">АЦП: VBUS справді ≈ 9 В?</text><text x="500.0" y="523.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">єдина відповідь, яку дає світ</text>
<rect x="350.0" y="576.0" width="300.0" height="58.0" rx="8" fill="#f4f6f8" stroke="#7a4fb0" stroke-width="1.6"/><text x="500.0" y="597.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#7a4fb0" text-anchor="middle" font-weight="700">CONT — безперервний режим</text><text x="500.0" y="618.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">D+ = 0.6 / D− = 3.3, тримати 80 мс</text>
<rect x="350.0" y="662.0" width="300.0" height="76.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="500.0" y="683.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">TUNE — крок 200 мВ</text><text x="500.0" y="704.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">імпульс ≥ 300 мкс, лік свій</text><text x="500.0" y="721.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">аудит АЦП раз на секунду</text>
<rect x="50.0" y="435.0" width="230.0" height="90.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="165.0" y="456.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">LEGACY_5V</text><text x="165.0" y="477.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">звичайний DCP:</text><text x="165.0" y="494.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">лишаємось на 5 В —</text><text x="165.0" y="511.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">і це правильно</text>
<rect x="755.0" y="671.0" width="200.0" height="58.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="855.0" y="692.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">RESYNC</text><text x="855.0" y="713.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">код 5 В, лік := 5000</text>
