<line x1="165.0" y1="305.0" x2="165.0" y2="433.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="252.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">VBUS_STAT = 011 (DCP)</text>
<line x1="500.0" y1="448.0" x2="500.0" y2="479.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="500.0" y1="539.0" x2="500.0" y2="574.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="510.0" y="560.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">так</text>
<line x1="350.0" y1="510.0" x2="282.0" y2="510.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="330.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">ні</text>
<line x1="500.0" y1="634.0" x2="500.0" y2="660.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="650.0" y1="715.0" x2="753.0" y2="715.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="701.0" y="707.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">лік ≠ виміру</text>
<line x1="855.0" y1="671.0" x2="855.0" y2="605.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="855.0" y1="605.0" x2="654.0" y2="605.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="754.0" y="596.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">скидаємось у 5 В і лічимо наново</text>
<rect x="210.4" y="749.4" width="559.2" height="45.3" rx="6" fill="#fff8e6" stroke="#b8860b" stroke-width="1.3"/><text x="490.0" y="768.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">У КОЖНОМУ стані фоном: WD_RST раз на 20 с.</tspan><tspan x="490.0" dy="14.3">Проспали сторожа 40 с — DP_DAC/DM_DAC самі стають HiZ, блок губить код і падає на 5 В.</tspan></text>
