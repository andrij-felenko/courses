<rect x="695.0" y="378.9" width="330.0" height="42.1" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.1"/><text x="860.0" y="396.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="860.0" dy="0.0">і малий струм у шнурі, І майже нема</tspan><tspan x="860.0" dy="13.7">тепла в телефоні. Обидві правди.</tspan></text>
<text x="230.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">що йде в ШНУРІ</text>
