<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1030" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="515.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розвилка 2014-го: канал вибирає протокол</text>
<rect x="25.0" y="46.0" width="310.0" height="400.0" rx="10" fill="#ffffff" stroke="#7a4fb0" stroke-width="1.6"/>
<text x="180.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#7a4fb0" text-anchor="middle" font-weight="700">Qualcomm · QC 2.0</text>
<rect x="38.0" y="89.8" width="284.0" height="28.5" rx="6" fill="#f2ecf8" stroke="#7a4fb0" stroke-width="1.4"/><text x="180.0" y="108.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7a4fb0" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">рівні на D+/D−</tspan></text>
<text x="180.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">у виділеного блока лінії даних</text>
<text x="180.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">усе одно замкнені перемичкою —</text>
<text x="180.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">отже, вільні. Блок читає на них</text>
<text x="180.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">0.6 і 3.3 В двома порогами</text>
<text x="180.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ЗДОБУЛИ</text>
<rect x="38.0" y="268.9" width="284.0" height="42.1" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="180.0" y="286.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">жодного нового дроту:</tspan><tspan x="180.0" dy="13.7">будь-який наявний шнур і блок</tspan></text>
<text x="180.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ЗАПЛАТИЛИ</text>
<rect x="38.0" y="370.1" width="284.0" height="55.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="180.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">три стани на лінію, п'ять кодів;</tspan><tspan x="180.0" dy="13.7">безпеку нема чим купити,</tspan><tspan x="180.0" dy="13.7">окрім часу — витримка 1.25 с</tspan></text>
<rect x="360.0" y="46.0" width="310.0" height="400.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="515.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">MediaTek · Pump Express+</text>
<rect x="373.0" y="89.8" width="284.0" height="28.5" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.4"/><text x="515.0" y="108.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="515.0" dy="0.0">імпульси струму на VBUS</tspan></text>
<text x="515.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">ліній даних не чіпають узагалі.</text>
<text x="515.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Лінію живлення веде блок — тож</text>
<text x="515.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">телефон модулює те, чим керує:</text>
<text x="515.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">власне споживання, а блок лічить</text>
<text x="515.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ЗДОБУЛИ</text>
<rect x="373.0" y="268.9" width="284.0" height="42.1" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="515.0" y="286.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">канал там, де дроту для нього нема:</tspan><tspan x="515.0" dy="13.7">повідомлення несе навантаження</tspan></text>
<text x="515.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ЗАПЛАТИЛИ</text>
<rect x="373.0" y="376.9" width="284.0" height="42.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="515.0" y="394.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">рукостискання нема взагалі;</tspan><tspan x="515.0" dy="13.7">крок аж 0.5 В (PE+ 2.0)</tspan></text>
<rect x="695.0" y="46.0" width="310.0" height="400.0" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="850.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">OPPO · VOOC</text>
<rect x="708.0" y="89.8" width="284.0" height="28.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="850.0" y="108.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="850.0" dy="0.0">власні контакти в роз'ємі</tspan></text>
<text x="850.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">наявним каналом не користуються:</text>
<text x="850.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">свій кабель, свої жили, свій MCU</text>
<text x="850.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">у блоці. Не треба вигадувати мову</text>
<text x="850.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">для двох дротів — додай дротів</text>
<text x="850.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ЗДОБУЛИ</text>
<rect x="708.0" y="268.9" width="284.0" height="42.1" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.2"/><text x="850.0" y="286.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">повна свобода: 5 В × 4.5 А ≈ 20 Вт,</tspan><tspan x="850.0" dy="13.7">а перетворювач аж у розетці</tspan></text>
<text x="850.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ЗАПЛАТИЛИ</text>
<rect x="708.0" y="376.9" width="284.0" height="42.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="850.0" y="394.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="850.0" dy="0.0">власний кабель і власний блок;</tspan><tspan x="850.0" dy="13.7">без них — ті самі 5 В / 2 А</tspan></text>
<rect x="158.0" y="475.5" width="714.0" height="29.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/><text x="515.0" y="493.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="515.0" dy="0.0">одне питання — «як безмозкий блок дізнається, чого хоче телефон?» — і три різні дроти, якими на нього відповіли</tspan></text>
</svg>