<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">18 ватів по одному шнуру: п'ять вольтів проти дев'яти</text>
<rect x="40.0" y="62.0" width="330.0" height="272.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="205.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">5 В — стеля легасі</text>
<line x1="66.0" y1="102.0" x2="344.0" y2="102.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="205.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">18 Вт ÷ 5 В = 3.6 А</text>
<text x="205.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">втрати в шнурі: 3.6² × 0.2 = 2.6 Вт</text>
<text x="205.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">падіння: 3.6 × 0.2 = 0.72 В</text>
<text x="205.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">доходить 4.28 В</text>
<text x="205.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">комірці треба 4.2 В, та ще й</text>
<text x="205.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">запас перетворювачеві зверху</text>
<text x="205.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">→ запасу не лишилось узагалі</text>
<rect x="410.0" y="62.0" width="330.0" height="272.0" rx="10" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="575.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">9 В — Quick Charge</text>
<line x1="436.0" y1="102.0" x2="714.0" y2="102.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="575.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">18 Вт ÷ 9 В = 2.0 А</text>
<text x="575.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">втрати в шнурі: 2.0² × 0.2 = 0.8 Вт</text>
<text x="575.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">падіння: 2.0 × 0.2 = 0.40 В</text>
<text x="575.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#27ae60" text-anchor="middle" font-weight="700">доходить 8.60 В</text>
<text x="575.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">перетворювач спокійно</text>
<text x="575.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">знижує 8.6 В до 4.2 В</text>
<text x="575.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">→ запасу вдосталь</text>
<rect x="80.0" y="361.5" width="619.9" height="29.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.3"/><text x="390.0" y="379.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">та сама потужність, той самий шнур 0.2 Ом: утричі менші втрати — і, головне, живий запас напруги</tspan></text>
</svg>