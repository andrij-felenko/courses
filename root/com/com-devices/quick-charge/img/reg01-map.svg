<rect x="149.2" y="225.1" width="521.6" height="73.9" rx="6" fill="#fff8e6" stroke="#b8860b" stroke-width="1.3"/><text x="410.0" y="244.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Скидання REG01 = 0x01 → VINDPM_OS = 1, тобто зсув VINDPM 600 мВ.</tspan><tspan x="410.0" dy="14.3">Записали байт «цілком» — і зсув тихо став 400 мВ, а дозвіл на 12 В зник.</tspan><tspan x="410.0" dy="14.3">Лікування: тінь регістра. Прочитати REG01 ОДИН раз, далі міняти лише біти [7:2].</tspan><tspan x="410.0" dy="14.3">Та сама тінь рятує й таймінг: крок — ОДИН запис, без читання перед ним.</tspan></text>
