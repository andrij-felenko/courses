<text x="155.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">a-spot 1</text>
<text x="255.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">a-spot 2</text>
<rect x="75.0" y="195.0" width="300.0" height="40.0" rx="6" fill="#fdebd0" stroke="#d35400" stroke-width="1.5"/>
<text x="225.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d35400" text-anchor="middle" font-weight="700">Язичок штекера (Au/Ni/Cu)</text>
<text x="225.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Фактична площа контакту A_r &lt;&lt; A_геом (≈ 1–2%)</text>
<text x="225.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Опір стягування: R_c = ρ / (2 · Σ a_i)</text>
<text x="225.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Струм 5 А створює високу густину в плямах</text>
<text x="225.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Локальне джоулеве нагрівання в точках дотику</text>
<rect x="435.0" y="50.0" width="360.0" height="350.0" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2.0"/>
<text x="615.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2c3e50" text-anchor="middle" font-weight="700">Металургійний захисний стек</text>
<rect x="455.0" y="96.0" width="320.0" height="42.0" rx="4" fill="#fef9e7" stroke="#f1c40f" stroke-width="1.8"/>
<text x="615.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#f1c40f" text-anchor="middle" font-weight="700">Тверде золото (Hard Gold / Au-Co)</text>
<text x="615.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">0.76 мкм (30 μin) — захист від окиснення</text>
<rect x="455.0" y="148.0" width="320.0" height="48.0" rx="4" fill="#eaeded" stroke="#95a5a6" stroke-width="1.8"/>
<text x="615.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#95a5a6" text-anchor="middle" font-weight="700">Нікелевий підшар (Ni Barrier)</text>
<text x="615.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">1.27–2.54 мкм — бар'єр проти дифузії Cu в Au</text>
<rect x="455.0" y="206.0" width="320.0" height="54.0" rx="4" fill="#fbeee6" stroke="#e67e22" stroke-width="1.8"/>
<text x="615.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="middle" font-weight="700">Мідна основа (CuSn / CuBe сплав)</text>
<text x="615.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Пружна фосфориста бронза / берилієва мідь</text>
<text x="615.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2c3e50" text-anchor="middle" font-weight="700">Сила притискання: F_n = 0.3–0.5 Н на контакт</text>
<text x="615.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">R_контакту: номінал 30–40 мОм (макс. 50 мОм)</text>
<text x="615.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Знос золота після 10 000 циклів оголює нікель</text>
<rect x="15.7" y="419.0" width="808.6" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="420.0" y="439.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Опір контакту визначається мікроплямами a-spots. Покриття золотом з нікелевим бар'єром рятує від окиснення</tspan></text>
</svg>