<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Найпростіший sink: два резистори — і дзеркальні граблі</text>
<text x="195.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Рецепт</text>
<rect x="40.0" y="74.0" width="310.0" height="32.0" rx="6" fill="#eaf3ea" stroke="#27ae60" stroke-width="1.2"/>
<text x="195.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Rd 5.1 кОм: CC1 → земля</text>
<rect x="40.0" y="114.0" width="310.0" height="32.0" rx="6" fill="#eaf3ea" stroke="#27ae60" stroke-width="1.2"/>
<text x="195.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Rd 5.1 кОм: CC2 → земля</text>
<rect x="40.0" y="154.0" width="310.0" height="32.0" rx="6" fill="#eaf3ea" stroke="#27ae60" stroke-width="1.2"/>
<text x="195.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">VBUS → ваші 5 В</text>
<rect x="40.0" y="194.0" width="310.0" height="32.0" rx="6" fill="#eaf3ea" stroke="#27ae60" stroke-width="1.2"/>
<text x="195.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">(опц.) CC → АЦП: дізнатись струм</text>
<rect x="40.0" y="234.0" width="310.0" height="32.0" rx="6" fill="#eaf3ea" stroke="#27ae60" stroke-width="1.2"/>
<text x="195.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">не брати більше дозволеного</text>
<text x="545.0" y="64.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Граблі</text>
