<text x="545.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">забув Rd → нема VBUS</text>
<rect x="390.0" y="114.0" width="310.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="545.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">Rd лише на одному CC → один бік</text>
<rect x="390.0" y="154.0" width="310.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="545.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">4.7 кОм замість 5.1 → ігнор</text>
<rect x="390.0" y="194.0" width="310.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="545.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">3 А там, де порт дає 0.9 → просадка</text>
<rect x="103.8" y="292.0" width="512.5" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="360.0" y="312.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">У USB-C навіть «нічого не робити» означає поставити правильні резистори.</tspan></text>
