<text x="792.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">додаси другу — швидкість падає</text>
<line x1="60.0" y1="348.0" x2="900.0" y2="348.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="5,6"/>
<text x="480.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">Кожне навантаження додає ємність, кожне відгалуження — відбиття;</text>
<text x="480.0" y="406.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">тому вища частота купується меншою кількістю пристроїв на сегменті.</text>
<text x="480.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">У кінці цієї дороги «спільна шина» обслуговує один пристрій — тобто перестає бути шиною.</text>
