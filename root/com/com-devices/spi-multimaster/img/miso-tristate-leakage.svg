<rect x="550.0" y="160.0" width="80.0" height="60.0" rx="4" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="590.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Slave 0 (CS=0)</text>
<text x="590.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle">Драйвер ON</text>
<text x="590.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">R_on ≈ 30Ω</text>
<line x1="590.0" y1="130.0" x2="590.0" y2="160.0" stroke="#27ae60" stroke-width="2.0"/>
