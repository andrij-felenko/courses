<text x="150.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">R_on ≈ 30Ω</text>
<line x1="150.0" y1="205.0" x2="215.0" y2="205.0" stroke="#2457d6" stroke-width="1.5"/>
