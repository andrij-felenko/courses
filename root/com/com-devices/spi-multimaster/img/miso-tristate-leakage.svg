<text x="690.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Slave 1 (High-Z)</text>
<text x="690.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle">C_out ≈ 10 пФ</text>
<text x="690.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d9534f" text-anchor="middle">I_leak ≤ 1 мкА</text>
<line x1="690.0" y1="130.0" x2="690.0" y2="160.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="745.0" y="160.0" width="75.0" height="60.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="782.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Slave N (High-Z)</text>
<text x="782.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle">C_out ≈ 10 пФ</text>
<text x="782.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d9534f" text-anchor="middle">I_leak ≤ 1 мкА</text>
<line x1="782.0" y1="130.0" x2="782.0" y2="160.0" stroke="#6b7280" stroke-width="1.2"/>
<rect x="450.0" y="240.0" width="360.0" height="105.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.4"/>
<text x="630.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle" font-weight="700">Сумарна ємність та час наростання фронту:</text>
<text x="630.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">C_total = C_master + N · C_pin + C_trace ≈ 200...400 пФ</text>
<text x="630.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d9534f" text-anchor="middle" font-weight="700">t_rise ≈ 2.2 · R_on · C_total  →  обмежує частоту шини (f_max)</text>
<text x="630.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">При N &gt; 10 зростання t_rise деформує меандр на SCK/MISO</text>
<text x="430.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Тристабільна логіка виходу MISO та накопичення паразитної ємності при підключенні десятків мікросхем</text>
