<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Схемотехнічні рішення для роботи з підвищеною ємністю шини</text>
<rect x="30.0" y="60.0" width="240.0" height="270.0" rx="6" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="40.0" y="72.0" width="220.0" height="28.0" rx="6" fill="#eaf0fd" stroke="#3b82f6" stroke-width="1.5"/><text x="150.0" y="89.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">1. Буфер/Повторювач (PCA9515)</tspan></text>
<line x1="50.0" y1="140.0" x2="110.0" y2="140.0" stroke="#2457d6" stroke-width="2.0"/>
<rect x="110.0" y="125.0" width="80.0" height="30.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="150.0" y="143.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Буфер</tspan></text>
<line x1="190.0" y1="140.0" x2="250.0" y2="140.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="80.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Сегмент A
(Cb1 ≤ 400 пФ)</text>
<text x="220.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Сегмент B
(Cb2 ≤ 400 пФ)</text>
<rect x="40.0" y="210.0" width="220.0" height="105.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="150.0" y="233.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">• Розділяє шину на ізольовані</tspan><tspan x="150.0" dy="13.0">  ємнісні домени.</tspan><tspan x="150.0" dy="13.0">• Кожен сегмент має власні</tspan><tspan x="150.0" dy="13.0">  підтяжки Rp1 та Rp2.</tspan><tspan x="150.0" dy="13.0">• Сумарна ємність сегментів</tspan><tspan x="150.0" dy="13.0">  не додається!</tspan></text>
<rect x="300.0" y="60.0" width="240.0" height="270.0" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/>
<rect x="310.0" y="72.0" width="220.0" height="28.0" rx="6" fill="#eaf7ed" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="89.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">2. Прискорювач RTA (LTC4311)</tspan></text>
<line x1="320.0" y1="140.0" x2="520.0" y2="140.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="420.0" y1="140.0" x2="420.0" y2="165.0" stroke="#27ae60" stroke-width="2.0"/>
<rect x="370.0" y="165.0" width="100.0" height="28.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="420.0" y="182.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0.0">Генератор струму</tspan></text>
<rect x="310.0" y="210.0" width="220.0" height="105.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="420.0" y="233.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">• Відстежує наростання dV/dt.</tspan><tspan x="420.0" dy="13.0">• Тимчасово впорскує сильний</tspan><tspan x="420.0" dy="13.0">  струм заряду (до 10-30 мА).</tspan><tspan x="420.0" dy="13.0">• Відключається біля VDD.</tspan><tspan x="420.0" dy="13.0">• Працює з Cb &gt; 1000 пФ</tspan><tspan x="420.0" dy="13.0">  при пасивних Rp = 10 кОм.</tspan></text>
<rect x="570.0" y="60.0" width="240.0" height="270.0" rx="6" fill="#f8fafc" stroke="#8b5cf6" stroke-width="1.5"/>
<rect x="580.0" y="72.0" width="220.0" height="28.0" rx="6" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/><text x="690.0" y="89.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0.0">3. Диференційний I²C (PCA9615)</tspan></text>
<rect x="585.0" y="125.0" width="60.0" height="30.0" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/><text x="615.0" y="143.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">dI2C Tx</tspan></text>
<line x1="645.0" y1="133.0" x2="735.0" y2="133.0" stroke="#8b5cf6" stroke-width="1.5"/>
<line x1="645.0" y1="147.0" x2="735.0" y2="147.0" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="690.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8b5cf6" text-anchor="middle">Вита пара (DSDA+, DSDA−)</text>
<rect x="735.0" y="125.0" width="60.0" height="30.0" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/><text x="765.0" y="143.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="765.0" dy="0.0">dI2C Rx</tspan></text>
<rect x="580.0" y="210.0" width="220.0" height="105.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="690.0" y="233.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">• Перетворює SDA/SCL на дві</tspan><tspan x="690.0" dy="13.0">  диференційні пари.</tspan><tspan x="690.0" dy="13.0">• Нечутливий до синфазних</tspan><tspan x="690.0" dy="13.0">  шумів та ємності кабелю.</tspan><tspan x="690.0" dy="13.0">• Дальність до 3-10 метрів</tspan><tspan x="690.0" dy="13.0">  на швидкості 1 МГц (Fm+).</tspan></text>
</svg>