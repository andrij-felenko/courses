<text x="420.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">Синхронізація SCL: лінія тримається LOW найповільнішим ведучим і падає LOW найшвидшим</text>
