<circle cx="240.0" cy="170.0" r="3.5" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="300.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Ведучий 2 вклинюється зі START!</text>
<text x="220.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Наслідок: Ведучий 1 налаштував регістр,</text>
<text x="220.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d9534f" text-anchor="middle" font-weight="700">але читання здійснює вже з іншого давача!</text>
<text x="220.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d9534f" text-anchor="middle" font-weight="700">Вразливість до стану гонитви (Race Condition)</text>
