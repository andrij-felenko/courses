<rect x="35.0" y="376.4" width="850.0" height="37.3" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="391.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Алгоритм: 1) Перевести SCL/SDA в GPIO Open-Drain; 2) Якщо SDA=0, генерувати до 9 тактів на SCL (t_LOW ≥ 5 мкс, t_HIGH ≥ 5 мкс);</tspan><tspan x="460.0" dy="14.3">3) Перевіряти SDA на кожному такті; щойно SDA=1 — ведений відпустив шину; 4) Згенерувати умову STOP; 5) Відновити I2C HAL.</tspan></text>
