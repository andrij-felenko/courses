<rect x="450.0" y="110.0" width="400.0" height="50.0" rx="4" fill="#eff6ff" stroke="#2457d6" stroke-width="1.0"/>
<text x="650.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">МК перезавантажився, SCL підтягнуто до 3.3 В резистором Rp</text>
<text x="650.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Периферія I2C МК бачить SDA = 0 В і виставляє прапорець BUSY</text>
<rect x="450.0" y="230.0" width="400.0" height="60.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="650.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ЗАВИСАННЯ: ведений тримає SDA = 0 В (N-MOSFET відкритий)</text>
<text x="650.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Ведений чекає тактів SCL для видачі решти бітів (3, 2, 1, 0, ACK)</text>
<rect x="40.0" y="340.4" width="820.0" height="59.2" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="358.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Чому звичайний рестарт МК безсилий: апаратний модуль I2C не може згенерувати START-умову</tspan><tspan x="450.0" dy="15.6">(перепад SDA з HIGH в LOW при високому SCL), оскільки лінія SDA вже фізично заземлена веденим чіпом.</tspan><tspan x="450.0" dy="15.6">Програмний рестарт периферії MCU не надсилає тактових імпульсів на шину.</tspan></text>
</svg>