<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="920.0" height="470.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Паразитне живлення датчика (Phantom Powering) через ESD-діоди ліній I²C</text>
<rect x="30.0" y="65.0" width="190.0" height="345.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.5"/>
<text x="125.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мікроконтролер (MCU)</text>
<text x="125.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">V_DD_MCU = 3.3 В (ON)</text>
<rect x="160.0" y="155.0" width="50.0" height="24.0" rx="3" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="185.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">SCL</text>
<rect x="160.0" y="225.0" width="50.0" height="24.0" rx="3" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="185.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">SDA</text>
<rect x="160.0" y="325.0" width="50.0" height="24.0" rx="3" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="185.0" y="341.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">PWR_EN</text>
<rect x="270.0" y="65.0" width="270.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="405.0" y="87.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">P-MOSFET Ключ (High-Side)</text>
<text x="405.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">СТАН: РОЗІРВАНО (OFF)</text>
<text x="405.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Прямий шлях живлення розімкнено</text>
<polyline points="210.0,337.0 245.0,337.0 245.0,102.0 270.0,102.0" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="240.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Керування</text>
<rect x="270.0" y="160.0" width="270.0" height="115.0" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.2"/>
<text x="405.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Помилка: Rp підтягнуті до 3.3 В MCU</text>
<rect x="345.0" y="195.0" width="45.0" height="20.0" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="367.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Rp1</text>
<rect x="420.0" y="195.0" width="45.0" height="20.0" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="442.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Rp2</text>
<text x="405.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Струм витоку: ~0.5..1.0 мА</text>
<text x="405.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">I = (3.3 В − 0.6 В) / Rp</text>
<rect x="590.0" y="65.0" width="315.0" height="345.0" rx="6" fill="#f1f5f9" stroke="#333333" stroke-width="1.5"/>
<text x="747.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Завислий I²C Давач (Sensor IC)</text>
<rect x="605.0" y="115.0" width="95.0" height="24.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="652.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">VDD_SENSOR</text>
<rect x="605.0" y="195.0" width="45.0" height="24.0" rx="3" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="627.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">SCL</text>
<rect x="605.0" y="255.0" width="45.0" height="24.0" rx="3" fill="#ffffff" stroke="#333333" stroke-width="1.0"/>
<text x="627.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">SDA</text>
<rect x="680.0" y="165.0" width="205.0" height="130.0" rx="4" fill="#faf5ff" stroke="#8e44ad" stroke-width="1.2"/>
<text x="782.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">ESD-діоди захисту</text>
<circle cx="725.0" cy="235.0" r="10.0" fill="#ffffff" stroke="#8e44ad" stroke-width="1.2"/>
<text x="725.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle">▲</text>
<text x="725.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#8e44ad" text-anchor="middle">ESD1</text>
<circle cx="795.0" cy="235.0" r="10.0" fill="#ffffff" stroke="#8e44ad" stroke-width="1.2"/>
<text x="795.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle">▲</text>
<text x="788.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#8e44ad" text-anchor="middle">ESD2</text>
<rect x="680.0" y="310.0" width="205.0" height="65.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="782.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ПАРАЗИТНА НАПРУГА:</text>
<text x="782.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">V_DD_SENSOR ≈ 2.7 В</text>
<text x="782.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Чіп НЕ скидається (немає POR)!</text>
<polyline points="210.0,167.0 367.0,167.0 367.0,195.0" fill="none" stroke="#c0392b" stroke-width="2.0"/>
<polyline points="210.0,237.0 442.0,237.0 442.0,195.0" fill="none" stroke="#c0392b" stroke-width="2.0"/>
<polyline points="367.0,215.0 367.0,207.0 605.0,207.0" fill="none" stroke="#c0392b" stroke-width="2.0"/>
<polyline points="442.0,215.0 442.0,267.0 605.0,267.0" fill="none" stroke="#c0392b" stroke-width="2.0"/>
<polyline points="650.0,207.0 725.0,207.0 725.0,225.0" fill="none" stroke="#c0392b" stroke-width="2.0"/>
<polyline points="650.0,267.0 795.0,267.0 795.0,225.0" fill="none" stroke="#c0392b" stroke-width="2.0"/>
<polyline points="725.0,245.0 725.0,280.0 845.0,280.0 845.0,127.0 700.0,127.0" fill="none" stroke="#c0392b" stroke-width="2.0"/>
<polyline points="795.0,245.0 795.0,280.0" fill="none" stroke="#c0392b" stroke-width="2.0"/>
<rect x="229.5" y="293.5" width="351.0" height="33.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="405.0" y="307.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="405.0" dy="0.0">Шлях струму: 3.3 В MCU → Резистори Rp → Лінії SDA/SCL →</tspan><tspan x="405.0" dy="13.0">→ ESD-діоди давача → Внутрішня шина VDD (2.7 В)</tspan></text>
<rect x="25.0" y="429.4" width="890.0" height="37.3" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="444.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Як уникнути пастки: 1) Підтяжки Rp підключати до комутованого V_DD_SENSOR (після ключа);</tspan><tspan x="470.0" dy="14.3">2) Перед вимкненням живлення МК переводить піни SCL/SDA в LOW (0 В); 3) Встановити розрядний резистор (10–100 кОм) на V_DD_SENSOR.</tspan></text>
</svg>