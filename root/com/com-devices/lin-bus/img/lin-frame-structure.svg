<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 290" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="290" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формат кадру LIN (Header передає Master, Response — Slave/Master)</text>
<rect x="40.0" y="60.0" width="360.0" height="160.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="220.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">HEADER (Заголовок від Master)</text>
<rect x="55.0" y="105.0" width="100.0" height="85.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="105.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Break Field</text>
<text x="105.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">≥13 біт Low</text>
<text x="105.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">+ Delimiter ≥1b</text>
<rect x="165.0" y="105.0" width="100.0" height="85.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="215.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Sync Byte</text>
<text x="215.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">0x55</text>
<text x="215.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">01010101b</text>
<rect x="275.0" y="105.0" width="110.0" height="85.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="330.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">PID Byte</text>
<text x="330.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ID (6b) + P0,P1</text>
<text x="330.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0x00 .. 0x3F</text>
<rect x="430.0" y="60.0" width="370.0" height="160.0" rx="8" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="615.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">RESPONSE (Відповідь від адресованого вузла)</text>
<rect x="450.0" y="105.0" width="200.0" height="85.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="550.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Data Bytes (1 .. 8 байт)</text>
<text x="550.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Байт 1 ... Байт N</text>
<text x="550.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Корисне навантаження</text>
<rect x="665.0" y="105.0" width="115.0" height="85.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="722.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Checksum</text>
<text x="722.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Classic / Enhanced</text>
<text x="722.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1 байт CRC</text>
<text x="420.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Між Header і Response допускається пауза (Response Space) для перемикання напрямку шини</text>
</svg>