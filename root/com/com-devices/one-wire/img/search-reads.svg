<rect x="228.0" y="260.0" width="252.0" height="46.0" rx="4" fill="#fdecea" stroke="#d6dae0" stroke-width="1.3"/><text x="354.0" y="287.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ніхто не відповів</text>
<rect x="480.0" y="260.0" width="240.0" height="46.0" rx="4" fill="#fdecea" stroke="#d6dae0" stroke-width="1.3"/><text x="600.0" y="287.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">порожня шина або збій</text>
<text x="380.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">розвилку (0,0) видно тому, що один ведений відпускає жилу, а інший притискає — виходить 0 в обох читаннях</text>
