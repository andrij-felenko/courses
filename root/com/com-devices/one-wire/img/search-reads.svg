<rect x="132.0" y="84.0" width="96.0" height="34.0" rx="4" fill="#eef1f4" stroke="#d6dae0" stroke-width="1.3"/><text x="180.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">інверсне</text>
