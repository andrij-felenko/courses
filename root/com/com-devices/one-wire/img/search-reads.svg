<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Search ROM: два читання на біт розрізняють згоду й розвилку</text>
<text x="380.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">на кожен біт ведучий робить ДВА читання — прямий біт і його інверсію;</text>
<text x="380.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">відкритий стік дає монтажне І: лінія = 0, якщо хоч один ведений притиснув</text>
