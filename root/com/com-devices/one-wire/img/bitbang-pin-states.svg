<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відкритий стік на звичайній ніжці: вихід-0 або вхід-Z</text>
<text x="390.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Ніжку не «ставлять у 1» — перемикають лише її НАПРЯМ (DDR); біт даних (PORT) завжди 0</text>
