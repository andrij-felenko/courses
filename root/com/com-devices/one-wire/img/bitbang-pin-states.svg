<text x="390.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-style="italic">PORTD-біт лишається 0 назавжди → внутрішню підтяжку вимкнено, «1» на лінію не подаємо; високий рівень дає лише зовнішній Rp</text>
