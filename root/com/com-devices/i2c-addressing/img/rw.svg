<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Біт R/W: одна адреса, два напрямки обміну</text>
<rect x="60.0" y="70.0" width="320.0" height="120.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="220.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">R/W = 0 : запис</text>
<rect x="95.0" y="116.0" width="90.0" height="50.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="140.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">ведучий</text>
<rect x="265.0" y="116.0" width="90.0" height="50.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="310.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">0x68</text>
<line x1="185.0" y1="141.0" x2="263.0" y2="141.0" stroke="#2457d6" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="224.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">дані →</text>
<rect x="420.0" y="70.0" width="320.0" height="120.0" rx="12" fill="#e9eefb" stroke="#2457d6" stroke-width="2.0"/>
<text x="580.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">R/W = 1 : читання</text>
<rect x="455.0" y="116.0" width="90.0" height="50.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="500.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">ведучий</text>
<rect x="625.0" y="116.0" width="90.0" height="50.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="670.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">0x68</text>
<line x1="625.0" y1="141.0" x2="547.0" y2="141.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="586.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">← дані</text>
<text x="400.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Адреса вибирає, з ким говорити; біт R/W — у який бік ідуть дані.</text>
<rect x="70.0" y="276.0" width="660.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="400.0" y="297.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="400.0" dy="0.0">0x68 із R/W=0 → байт 0xD0 на лінії;  0x68 із R/W=1 → байт 0xD1.</tspan><tspan x="400.0" dy="15.0">це та сама адреса — лише по-різному записана</tspan></text>
</svg>