<text x="320.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">SCK / SCLK</text>
<text x="490.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start">SCK</text>
<text x="650.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">SCK / CLK</text>
<rect x="90.0" y="262.0" width="720.0" height="44.0" rx="0" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
