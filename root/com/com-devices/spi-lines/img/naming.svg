<rect x="60.0" y="320.0" width="780.0" height="36.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="342.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">Пастка: на веденому чіпі SDO — це його ВИХІД, тобто MISO; SDI — його вхід, тобто MOSI.</tspan></text>
