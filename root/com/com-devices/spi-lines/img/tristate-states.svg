<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три стани виходу: «0», «1» і відключено (Z)</text>
<text x="450.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">вхід OE (вмикання виходу) вирішує: тягнути лінію чи відпустити її в Z</text>
<path d="M156,150 L156,214 L228,182 Z" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="190.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">OE = 1, вхід = 1</text>
<text x="180.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">1</text>
<line x1="228" y1="182" x2="268" y2="182" stroke="#c0392b" stroke-width="2.4"/>
<text x="192.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">жене «1»</text>
<text x="190.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">OE</text>
<line x1="190.0" y1="126.0" x2="190.0" y2="150.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="2,2"/>
<path d="M416,150 L416,214 L488,182 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<text x="450.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">OE = 1, вхід = 0</text>
<text x="440.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#2457d6" text-anchor="middle" font-weight="700">0</text>
<line x1="488" y1="182" x2="528" y2="182" stroke="#2457d6" stroke-width="2.4"/>
<text x="452.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">жене «0»</text>
<text x="450.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">OE</text>
<line x1="450.0" y1="126.0" x2="450.0" y2="150.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="2,2"/>
<path d="M676,150 L676,214 L748,182 Z" fill="#f4f4f4" stroke="#6b7280" stroke-width="2"/>
<text x="710.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">OE = 0</text>
<text x="700.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#8a8a8a" text-anchor="middle" font-weight="700">Z</text>
<line x1="748" y1="182" x2="788" y2="182" stroke="#8a8a8a" stroke-width="2.4" stroke-dasharray="4,4"/>
<text x="712.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">вихід у Z</text>
<text x="710.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">OE</text>
<line x1="710.0" y1="126.0" x2="710.0" y2="150.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="2,2"/>
<rect x="60.0" y="300.0" width="780.0" height="64.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="320.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Звичайний двотактний вихід уміє лише «0» і «1» — він завжди тягне лінію. Третій стан додає</tspan><tspan x="450.0" dy="15.6">вибір «нічого»: за OE = 0 транзистори замкнені обидва, вихід має дуже високий опір (Z) і для</tspan><tspan x="450.0" dy="15.6">лінії наче зник. Це й дозволяє кільком виходам ділити один провід — за умови, що активний лише один.</tspan></text>
</svg>