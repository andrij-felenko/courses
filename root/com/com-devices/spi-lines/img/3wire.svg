<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="700">Економний варіант: 3-дротовий SPI (одна лінія даних)</text>
<text x="450.0" y="56.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">MOSI і MISO зливають в одну двонапрямлену лінію — менше дротів, але напівдуплекс</text>
<rect x="70.0" y="100.0" width="360.0" height="140.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="2.0"/>
<text x="250.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">4-дротовий (звичайний)</text>
<line x1="110.0" y1="150.0" x2="390.0" y2="150.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="100.0" y="154.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="end" font-weight="700">SCK</text>
<line x1="110.0" y1="174.0" x2="390.0" y2="174.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="100.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="end" font-weight="700">MOSI</text>
<line x1="110.0" y1="198.0" x2="390.0" y2="198.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="100.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="end" font-weight="700">MISO</text>
<line x1="110.0" y1="222.0" x2="390.0" y2="222.0" stroke="#b08900" stroke-width="2.0"/>
<text x="100.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b08900" text-anchor="end" font-weight="700">CS</text>
<text x="250.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">повний дуплекс, 4 лінії</text>
<rect x="470.0" y="100.0" width="360.0" height="140.0" rx="12" fill="none" stroke="#e4e4e4" stroke-width="2.0"/>
<text x="650.0" y="124.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">3-дротовий</text>
<line x1="510.0" y1="156.0" x2="790.0" y2="156.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="500.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="end" font-weight="700">SCK</text>
<line x1="510.0" y1="186.0" x2="790.0" y2="186.0" stroke="#7a2bd6" stroke-width="2.0"/>
<text x="500.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7a2bd6" text-anchor="end" font-weight="700">SDIO</text>
<line x1="510.0" y1="216.0" x2="790.0" y2="216.0" stroke="#b08900" stroke-width="2.0"/>
<text x="500.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b08900" text-anchor="end" font-weight="700">CS</text>
<text x="650.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7a2bd6" text-anchor="middle" font-weight="700">дані в обидва боки по черзі</text>
<text x="650.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">напівдуплекс, 3 лінії</text>
<rect x="60.0" y="262.0" width="780.0" height="56.0" rx="10" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/>
<text x="450.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3-дротовий SPI економить ніжку там, де дані й так ідуть по черзі (багато дисплеїв, дрібні чіпи).</text>
<text x="450.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Той самий компроміс «менше дротів за менше одночасності», що й між I2C та SPI.</text>
</svg>