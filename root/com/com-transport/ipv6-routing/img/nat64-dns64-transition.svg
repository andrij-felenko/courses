<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Взаємодія IPv6-клієнта з IPv4-сервером через DNS64 та NAT64</text>
<rect x="40.0" y="75.0" width="140.0" height="80.0" rx="6" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="110.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">IPv6 Клієнт</text>
<text x="110.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">2001:db8::100</text>
<text x="110.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">не має адреси IPv4</text>
<rect x="240.0" y="75.0" width="160.0" height="80.0" rx="6" fill="#fdf6e7" stroke="#d97706" stroke-width="1.8"/>
<text x="320.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700">DNS64 Сервер</text>
<text x="320.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Синтез AAAA запису</text>
<text x="320.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">64:ff9b:: + IPv4</text>
<rect x="460.0" y="75.0" width="150.0" height="80.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="535.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6d28d9" text-anchor="middle" font-weight="700">NAT64 Шлюз</text>
<text x="535.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Трансляція заголовків</text>
<text x="535.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Stateful L4 Translation</text>
<rect x="660.0" y="75.0" width="120.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="720.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">IPv4 Сервер</text>
<text x="720.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">198.51.100.42</text>
<text x="720.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">тільки IPv4</text>
<line x1="185.0" y1="95.0" x2="235.0" y2="95.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="210.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">1. AAAA?</text>
<line x1="235.0" y1="125.0" x2="185.0" y2="125.0" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="210.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle" font-weight="700">2. AAAA</text>
<line x1="110.0" y1="160.0" x2="500.0" y2="160.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">3. IPv6 Пакет: Src=2001:db8::100, Dst=64:ff9b::c633:642a</text>
<line x1="615.0" y1="115.0" x2="655.0" y2="115.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="635.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">4. IPv4</text>
<rect x="40.0" y="205.0" width="740.0" height="150.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="410.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Порядок роботи зв'язки DNS64 + NAT64:</tspan><tspan x="410.0" dy="13.0"></tspan><tspan x="410.0" dy="13.0">1. Клієнт запитує AAAA (IPv6) для web.example.com. Сервер має лише A-запис (198.51.100.42).</tspan><tspan x="410.0" dy="13.0">2. DNS64 бере IPv4-адресу (198.51.100.42 = 0xc6.0x33.0x64.0x2a) і склеює її з префіксом Well-Known</tspan><tspan x="410.0" dy="13.0">   (64:ff9b::/96) → синтезує фіктивну IPv6-адресу 64:ff9b::c633:642a і повертає клієнту.</tspan><tspan x="410.0" dy="13.0">3. Клієнт надсилає IPv6-пакет на адресу 64:ff9b::c633:642a. Маршрутизатор направляє цей префікс до NAT64.</tspan><tspan x="410.0" dy="13.0">4. NAT64 вилучає IPv4-адресу з молодших 32 бітів Dst IPv6, замінює IPv6-заголовок на IPv4, призначає</tspan><tspan x="410.0" dy="13.0">   публічну IPv4-адресу та динамічний порт джерела (PAT) і відправляє у чисту мережу IPv4.</tspan></text>
</svg>