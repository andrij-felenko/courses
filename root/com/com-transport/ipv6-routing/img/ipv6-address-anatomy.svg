<text x="60.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Solicited-Node Multicast (ff02::1:ff00:0/104):</text>
<rect x="60.0" y="220.0" width="440.0" height="52.0" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
<text x="280.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6d28d9" text-anchor="middle" font-weight="700">ff02 : 0000 : 0000 : 0000 : 0000 : 0001 : ff</text>
<text x="280.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Фіксований префікс групи (104 біти)</text>
