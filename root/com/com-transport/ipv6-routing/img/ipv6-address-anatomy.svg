<text x="632.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ethernet Multicast MAC:  33 : 33 : ff : 33 : 44 : 55</text>
<text x="632.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">апаратна фільтрація мережевою картою (NIC)</text>
<rect x="60.0" y="290.0" width="380.0" height="68.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="250.0" y="314.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="250.0" dy="0.0">Solicited-Node група дозволяє звертатися до конкретного вузла</tspan><tspan x="250.0" dy="13.0">без broadcast-штормів: мережеві карти інших вузлів фільтрують</tspan><tspan x="250.0" dy="13.0">кадр на рівні кремнію за хешем MAC 33:33:xx:xx:xx:xx.</tspan></text>
</svg>