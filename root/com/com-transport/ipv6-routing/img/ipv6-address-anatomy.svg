<text x="365.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Subnet ID (16 біт)</text>
<rect x="440.0" y="78.0" width="320.0" height="52.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="600.0" y="93.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">0211 : 22ff : fe33 : 4455</text>
<text x="600.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Interface ID (64 біти)</text>
