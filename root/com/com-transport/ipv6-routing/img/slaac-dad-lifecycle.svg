<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автоконфігурація SLAAC та перевірка унікальності DAD</text>
<rect x="40.0" y="65.0" width="170.0" height="215.0" rx="5" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/>
<text x="125.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Link-Local</text>
<rect x="48.0" y="102.0" width="154.0" height="168.0" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.0"/><text x="125.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="125.0" dy="0.0">Генерація Link-Local:</tspan><tspan x="125.0" dy="13.0">fe80:: + Interface ID.</tspan><tspan x="125.0" dy="13.0"></tspan><tspan x="125.0" dy="13.0">Стан: TENTATIVE</tspan><tspan x="125.0" dy="13.0">(тимчасова, не активна).</tspan><tspan x="125.0" dy="13.0"></tspan><tspan x="125.0" dy="13.0">DAD: надсилання NS на</tspan><tspan x="125.0" dy="13.0">власну solicited-node</tspan><tspan x="125.0" dy="13.0">адресу. Якщо 1 с тиша —</tspan><tspan x="125.0" dy="13.0">адреса активна.</tspan></text>
<line x1="215.0" y1="170.0" x2="235.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="240.0" y="65.0" width="170.0" height="215.0" rx="5" fill="#eaf2fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="325.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2. Запит шлюзу</text>
<rect x="248.0" y="102.0" width="154.0" height="168.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.0"/><text x="325.0" y="142.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="325.0" dy="0.0">Вузол шле RS на ff02::2</tspan><tspan x="325.0" dy="11.7">(усі маршрутизатори).</tspan><tspan x="325.0" dy="11.7"></tspan><tspan x="325.0" dy="11.7">Маршрутизатор вертає RA</tspan><tspan x="325.0" dy="11.7">(періодично або у відповідь):</tspan><tspan x="325.0" dy="11.7">• Префікс мережі (/64)</tspan><tspan x="325.0" dy="11.7">• Прапорець A=1 (SLAAC)</tspan><tspan x="325.0" dy="11.7">• Прапорці M/O (DHCPv6)</tspan><tspan x="325.0" dy="11.7">• Lifetime та RDNSS DNS.</tspan></text>
<line x1="415.0" y1="170.0" x2="435.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="440.0" y="65.0" width="170.0" height="215.0" rx="5" fill="#fdf6e7" stroke="#d97706" stroke-width="1.5"/>
<text x="525.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700">3. Збірка GUA</text>
<rect x="448.0" y="102.0" width="154.0" height="168.0" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.0"/><text x="525.0" y="142.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="525.0" dy="0.0">Вузол склеює:</tspan><tspan x="525.0" dy="11.7">Префікс з RA (/64)</tspan><tspan x="525.0" dy="11.7">+ Interface ID (/64)</tspan><tspan x="525.0" dy="11.7">= Global Unicast (GUA).</tspan><tspan x="525.0" dy="11.7"></tspan><tspan x="525.0" dy="11.7">Нова адреса знову входить</tspan><tspan x="525.0" dy="11.7">у стан TENTATIVE.</tspan><tspan x="525.0" dy="11.7"></tspan><tspan x="525.0" dy="11.7">Запуск DAD для GUA.</tspan></text>
<line x1="615.0" y1="170.0" x2="635.0" y2="170.0" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="640.0" y="65.0" width="140.0" height="215.0" rx="5" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="710.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">4. Готово</text>
<rect x="648.0" y="102.0" width="124.0" height="168.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/><text x="710.0" y="148.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="710.0" dy="0.0">Адреса валідна!</tspan><tspan x="710.0" dy="11.7"></tspan><tspan x="710.0" dy="11.7">Вузол додає:</tspan><tspan x="710.0" dy="11.7">• GUA адресу на IF</tspan><tspan x="710.0" dy="11.7">• Дефолтний маршрут</tspan><tspan x="710.0" dy="11.7">  ::/0 через link-local</tspan><tspan x="710.0" dy="11.7">  адресу роутера</tspan><tspan x="710.0" dy="11.7">• DNS сервери.</tspan></text>
<rect x="40.0" y="295.0" width="740.0" height="70.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.3"/><text x="410.0" y="319.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">SLAAC (RFC 4862) дає повну автоконфігурацію без централізованого сервера DHCP.</tspan><tspan x="410.0" dy="14.3">DAD (Duplicate Address Detection) гарантує відсутність колізій IP: адреса не обслуговує трафік,</tspan><tspan x="410.0" dy="14.3">доки вузол не переконається, що на запит NS ніхто в сегменті не відповів NA.</tspan></text>
</svg>