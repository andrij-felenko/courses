<rect x="430.0" y="205.0" width="330.0" height="140.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="595.0" y="233.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Чому Next Hop — це Link-Local (fe80::2%eth0):</tspan><tspan x="595.0" dy="13.0"></tspan><tspan x="595.0" dy="13.0">1. Незалежність від зміни ISP (Renumbering):</tspan><tspan x="595.0" dy="13.0">   якщо провайдер змінить глобальний префікс з</tspan><tspan x="595.0" dy="13.0">   2001:db8:: на 2001:cafe::, внутрішня таблиця</tspan><tspan x="595.0" dy="13.0">   маршрутизації та OSPF/IS-IS сусідства не падають.</tspan><tspan x="595.0" dy="13.0">2. Економія адрес: інтерфейси роутерів не потребують</tspan><tspan x="595.0" dy="13.0">   глобальних підмереж на transit-лінках.</tspan></text>
