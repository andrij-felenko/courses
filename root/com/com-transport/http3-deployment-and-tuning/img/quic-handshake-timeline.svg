<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хронологія встановитися з'єднання: TCP+TLS vs QUIC</text>
<text x="220.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">TCP + TLS 1.3 (2 RTT до першого HTTP-запиту)</text>
<line x1="80.0" y1="85.0" x2="80.0" y2="315.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="360.0" y1="85.0" x2="360.0" y2="315.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="80.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Клієнт</text>
<text x="360.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сервер</text>
<line x1="80.0" y1="105.0" x2="360.0" y2="135.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="220.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">TCP SYN</text>
<line x1="360.0" y1="135.0" x2="80.0" y2="165.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="220.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">TCP SYN-ACK</text>
<line x1="80.0" y1="175.0" x2="360.0" y2="205.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="220.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">TLS ClientHello + ACK</text>
<line x1="360.0" y1="205.0" x2="80.0" y2="235.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="220.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">TLS ServerHello + Finished</text>
<line x1="80.0" y1="245.0" x2="360.0" y2="275.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="220.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">HTTP GET (Дані прикладного рівня)</text>
<text x="660.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">QUIC (1 RTT / 0 RTT злитий хендшейк)</text>
<line x1="520.0" y1="85.0" x2="520.0" y2="315.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="800.0" y1="85.0" x2="800.0" y2="315.0" stroke="#6b7280" stroke-width="2.0"/>
<text x="520.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Клієнт</text>
<text x="800.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сервер</text>
<line x1="520.0" y1="105.0" x2="800.0" y2="145.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="660.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">QUIC Initial (ClientHello + Transport Params)</text>
<line x1="800.0" y1="145.0" x2="520.0" y2="185.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="660.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">QUIC Handshake (ServerHello + EE + Finished)</text>
<line x1="520.0" y1="195.0" x2="800.0" y2="235.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="660.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">HTTP/3 GET (1 RTT / або 0-RTT з ранніми даними)</text>
<text x="60.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">У TCP+TLS транспортне з'єднання та криптографічний сеанс узгоджуються послідовно (2-3 RTT).</text>
<text x="60.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">QUIC передає параметри транспорту та криптографії у першому ж пакеті Initial (1 RTT).</text>
<text x="60.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start">При повторному підключенні QUIC підтримує 0-RTT, передаючи HTTP-дані у першому польоті.</text>
</svg>