<rect x="60.0" y="250.0" width="820.0" height="70.0" rx="9" fill="#eef6ef" stroke="#1f8a3b" stroke-width="1.4"/>
<text x="470.0" y="274.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Реакція: автопілот сам виконує failsafe — повернення додому (RTL) чи м'яка посадка.</text>
<text x="470.0" y="296.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">Головна думка: у реальному часі «правильно, але запізно» = неправильно. Дані керування мають дедлайн.</text>
