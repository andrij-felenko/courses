<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розв'язання проблеми CNAME на вершині зони через HTTPS AliasMode</text>
<text x="40.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Розв'язання проблеми CNAME на вершині зони (Apex) через HTTPS AliasMode</text>
<rect x="30.0" y="55.0" width="475.0" height="495.0" rx="8" fill="#fdf2f2" stroke="#fca5a5" stroke-width="1.2"/>
<text x="50.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Тупик CNAME на вершині зони (RFC 1034 §3.6.2)</text>
<rect x="50.0" y="95.0" width="435.0" height="120.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="267.5" y="137.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="267.5" dy="0.0">Обов'язкові записи Apex-домену example.com:</tspan><tspan x="267.5" dy="14.3">• SOA (Start of Authority) — параметри зони</tspan><tspan x="267.5" dy="14.3">• NS (Name Server) — авторитетні сервери зони</tspan><tspan x="267.5" dy="14.3">• MX, TXT, DNSKEY... — пошта, підписи тощо</tspan></text>
<rect x="50.0" y="230.0" width="435.0" height="110.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="267.5" y="260.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="267.5" dy="0.0">Залізне правило CNAME:</tspan><tspan x="267.5" dy="14.3">«Якщо для вузла є CNAME, ЖОДЕН інший тип запису</tspan><tspan x="267.5" dy="14.3">не може існувати для цього самого імені».</tspan><tspan x="267.5" dy="14.3"></tspan><tspan x="267.5" dy="14.3">CNAME витісняє все, включаючи SOA та NS!</tspan></text>
<rect x="50.0" y="355.0" width="435.0" height="175.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="267.5" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="267.5" dy="0.0">Наслідки для CDN:</tspan><tspan x="267.5" dy="13.0">• Не можна делегувати apex (example.com) на CDN через CNAME.</tspan><tspan x="267.5" dy="13.0">• Провайдери винайшли «костилі»: CNAME flattening, ANAME, ALIAS.</tspan><tspan x="267.5" dy="13.0">• «Костилі» ламають DNSSEC (підпис руйнується авторитетним сервером)</tspan><tspan x="267.5" dy="13.0">  та гео-роутинг (сервер резолвить IP замість клієнта).</tspan></text>
<rect x="535.0" y="55.0" width="475.0" height="495.0" rx="8" fill="#eef8f1" stroke="#86efac" stroke-width="1.2"/>
<text x="555.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Чисте рішення: HTTPS AliasMode (RFC 9460)</text>
<rect x="555.0" y="95.0" width="435.0" height="120.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="772.5" y="137.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="772.5" dy="0.0">Зона example.com залишається абсолютно валідною:</tspan><tspan x="772.5" dy="14.3">example.com.  IN  SOA    ns1.example.com. ...</tspan><tspan x="772.5" dy="14.3">example.com.  IN  NS     ns1.example.com.</tspan><tspan x="772.5" dy="14.3">example.com.  IN  HTTPS  0  customer.cdn-provider.net.</tspan></text>
<rect x="555.0" y="230.0" width="435.0" height="110.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="772.5" y="260.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="772.5" dy="0.0">Правило сумісності SVCB/HTTPS:</tspan><tspan x="772.5" dy="14.3">«Запис HTTPS (Type 65) із SvcPriority = 0 є звичайним</tspan><tspan x="772.5" dy="14.3">типом даних і вільно співіснує з SOA, NS, MX, DNSKEY».</tspan><tspan x="772.5" dy="14.3"></tspan><tspan x="772.5" dy="14.3">Ніякого конфлікту на рівні протоколу DNS!</tspan></text>
<rect x="555.0" y="355.0" width="435.0" height="175.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="772.5" y="422.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="772.5" dy="0.0">Переваги AliasMode:</tspan><tspan x="772.5" dy="11.7">• Працює безпосередньо в протоколі DNS без пропрієтарних хаків.</tspan><tspan x="772.5" dy="11.7">• Повністю сумісний з DNSSEC: запис HTTPS 0 підписується RRSIG зони apex.</tspan><tspan x="772.5" dy="11.7">• Клієнт або рекурсивний резолвер сам резолвить IP цілі CDN з урахуванням</tspan><tspan x="772.5" dy="11.7">  власної підмережі (EDNS Client Subnet) для оптимальної доставки контенту.</tspan></text>
</svg>