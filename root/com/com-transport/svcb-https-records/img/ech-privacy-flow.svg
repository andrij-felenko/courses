<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист конфіденційності SNI через ECH у записі HTTPS</text>
<text x="40.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Захист конфіденційності імені хоста (SNI) через Encrypted Client Hello (ECH)</text>
<rect x="30.0" y="55.0" width="980.0" height="115.0" rx="8" fill="#eef3fb" stroke="#93c5fd" stroke-width="1.2"/>
<text x="50.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Крок 1: Захищений DNS-запит (DoH / DoT) отримує ECHConfig</text>
<rect x="50.0" y="95.0" width="940.0" height="60.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="520.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">Клієнт запитує HTTPS-запис для private.example.com через зашифрований DoH-канал.</tspan><tspan x="520.0" dy="14.3">Відповідь: HTTPS 1 . alpn=&quot;h3,h2&quot; ech=&quot;AEn+...&quot; (містить публічний ключ шифрування сервера HPKE).</tspan></text>
<rect x="30.0" y="185.0" width="980.0" height="245.0" rx="8" fill="#fdf3e6" stroke="#fcd34d" stroke-width="1.2"/>
<text x="50.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="start" font-weight="700">Крок 2: Формування розщепленого TLS 1.3 ClientHello (ClientHelloOuter + ClientHelloInner)</text>
<rect x="50.0" y="225.0" width="445.0" height="185.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="272.5" y="278.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="272.5" dy="0.0">ClientHelloOuter (Відкрита обгортка):</tspan><tspan x="272.5" dy="14.3">• Видима всім спостерігачам у мережі.</tspan><tspan x="272.5" dy="14.3">• SNI = «public-cdn.com» (покривне/фасадне ім'я CDN).</tspan><tspan x="272.5" dy="14.3">• Містить розширення encrypted_client_hello</tspan><tspan x="272.5" dy="14.3">  із зашифрованим корисним навантаженням.</tspan><tspan x="272.5" dy="14.3"></tspan><tspan x="272.5" dy="14.3">Мережевий провайдер чи цензор бачить лише public-cdn.com!</tspan></text>
<rect x="545.0" y="225.0" width="445.0" height="185.0" rx="6" fill="#eef8f1" stroke="#27ae60" stroke-width="1.5"/><text x="767.5" y="278.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="767.5" dy="0.0">ClientHelloInner (Зашифроване ядро):</tspan><tspan x="767.5" dy="14.3">• Зашифровано публічним ключем сервера (HPKE).</tspan><tspan x="767.5" dy="14.3">• Справжній SNI = «private.example.com».</tspan><tspan x="767.5" dy="14.3">• Внутрішній ALPN, криптографічні параметри,</tspan><tspan x="767.5" dy="14.3">  сесійні квитки та розширення.</tspan><tspan x="767.5" dy="14.3"></tspan><tspan x="767.5" dy="14.3">Розшифрувати може ТІЛЬКИ кінцевий веб-сервер або CDN!</tspan></text>
<rect x="30.0" y="445.0" width="980.0" height="125.0" rx="8" fill="#eef8f1" stroke="#86efac" stroke-width="1.2"/>
<text x="50.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Крок 3: Результат — повне приховування метаданих користувача</text>
<rect x="50.0" y="485.0" width="940.0" height="70.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="520.0" y="509.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">• Усунено останній відкритий витік ідентифікатора веб-сайту в протоколі TLS 1.3.</tspan><tspan x="520.0" dy="14.3">• Шпигуни, інтернет-провайдери та транзитні оператори не можуть відстежувати конкретні сайти користувача.</tspan><tspan x="520.0" dy="14.3">• Блокування та цензура за іменем окремого домену стають неможливими без блокування всього CDN.</tspan></text>
</svg>