<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура записів SVCB та HTTPS у бінарному форматі DNS</text>
<text x="40.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Структура записів SVCB (Type 64) та HTTPS (Type 65) у бінарному форматі DNS (RDATA)</text>
<rect x="30.0" y="55.0" width="980.0" height="115.0" rx="8" fill="#eef3fb" stroke="#93c5fd" stroke-width="1.2"/>
<text x="50.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">Поля фіксованого заголовка RDATA запису SVCB / HTTPS (RFC 9460):</text>
<rect x="50.0" y="95.0" width="260.0" height="55.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="180.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="180.0" dy="0.0">SvcPriority (2 байти, uint16)</tspan><tspan x="180.0" dy="14.3">0 = AliasMode, &gt;0 = ServiceMode</tspan></text>
<rect x="340.0" y="95.0" width="360.0" height="55.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="520.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">TargetName (змінна довжина, DNS Name)</tspan><tspan x="520.0" dy="14.3">Доменне ім'я вузла (або '.' для query name)</tspan></text>
<rect x="730.0" y="95.0" width="260.0" height="55.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="860.0" y="119.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="860.0" dy="0.0">SvcParams (0 або більше байтів)</tspan><tspan x="860.0" dy="14.3">Список пар Key-Value (TLV)</tspan></text>
<rect x="30.0" y="190.0" width="475.0" height="405.0" rx="8" fill="#fdf3e6" stroke="#fcd34d" stroke-width="1.2"/>
<text x="50.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b45309" text-anchor="start" font-weight="700">Режим псевдоніма: AliasMode (SvcPriority = 0)</text>
<rect x="50.0" y="230.0" width="435.0" height="110.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="267.5" y="253.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="267.5" dy="0.0">Формат запису:</tspan><tspan x="267.5" dy="14.3">example.com.  IN  HTTPS  0  svc.cdn.net.</tspan><tspan x="267.5" dy="14.3"></tspan><tspan x="267.5" dy="14.3">• SvcPriority = 0 вмикає режим перенаправлення (аліасингу).</tspan><tspan x="267.5" dy="14.3">• TargetName вказує на канонічне ім'я служби.</tspan><tspan x="267.5" dy="14.3">• SvcParams заборонені (RDATA не містить параметрів).</tspan></text>
<rect x="50.0" y="355.0" width="435.0" height="220.0" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/><text x="267.5" y="418.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="267.5" dy="0.0">Як працює резолвер:</tspan><tspan x="267.5" dy="14.3">1. Клієнт запитує HTTPS для apex-домену example.com.</tspan><tspan x="267.5" dy="14.3">2. Сервер повертає пріоритет 0 і ціль svc.cdn.net.</tspan><tspan x="267.5" dy="14.3">3. Резолвер повторює запит HTTPS для svc.cdn.net.</tspan><tspan x="267.5" dy="14.3">4. Отримує кінцеві параметри служби (ServiceMode).</tspan><tspan x="267.5" dy="14.3"></tspan><tspan x="267.5" dy="14.3">Головне призначення: заміна CNAME на вершині зони (Apex),</tspan><tspan x="267.5" dy="14.3">де звичайний CNAME заборонений стандартом DNS (RFC 1034).</tspan></text>
<rect x="535.0" y="190.0" width="475.0" height="405.0" rx="8" fill="#eef8f1" stroke="#86efac" stroke-width="1.2"/>
<text x="555.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">Режим параметрів: ServiceMode (SvcPriority &gt; 0)</text>
<rect x="555.0" y="230.0" width="435.0" height="110.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="772.5" y="253.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="772.5" dy="0.0">Формат запису:</tspan><tspan x="772.5" dy="14.3">example.com.  IN  HTTPS  1  .  alpn=&quot;h3,h2&quot; ipv4hint=198.51.100.1</tspan><tspan x="772.5" dy="14.3"></tspan><tspan x="772.5" dy="14.3">• SvcPriority &gt; 0 (1..65535) вказує на пріоритет ендпоінта.</tspan><tspan x="772.5" dy="14.3">• TargetName = '.' означає «використовуй те саме ім'я».</tspan><tspan x="772.5" dy="14.3">• SvcParams містить TLV-блоки конфігурації з'єднання.</tspan></text>
<rect x="555.0" y="355.0" width="435.0" height="220.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="772.5" y="418.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="772.5" dy="0.0">Стандартні ключі параметрів SvcParams (TLV):</tspan><tspan x="772.5" dy="14.3">• Key 0 (mandatory): критичні ключі, обов'язкові для клієнта.</tspan><tspan x="772.5" dy="14.3">• Key 1 (alpn): список підтримуваних протоколів (h3, h2).</tspan><tspan x="772.5" dy="14.3">• Key 2 (no-default-alpn): заборона відкату до HTTP/1.1.</tspan><tspan x="772.5" dy="14.3">• Key 3 (port): нестандартний порт служби (наприклад 8443).</tspan><tspan x="772.5" dy="14.3">• Key 4 (ipv4hint): список IPv4 адрес для швидкого старту.</tspan><tspan x="772.5" dy="14.3">• Key 5 (ech): відкритий ключ ECHConfigList для TLS.</tspan><tspan x="772.5" dy="14.3">• Key 6 (ipv6hint): список IPv6 адрес для Happy Eyeballs.</tspan></text>
</svg>