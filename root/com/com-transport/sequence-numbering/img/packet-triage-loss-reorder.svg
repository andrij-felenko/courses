<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 874.4 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="874.4" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм розпізнавання: черговість, втрати, перевпорядкування та дублікати</text>
<text x="420.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Тріаж вхідного пакета через знакову модульну дистанцію d = (intN_t)(seq - seq_expected)</text>
<rect x="6.1" y="89.3" width="247.9" height="41.3" rx="6" fill="#f0f4f8" stroke="#333333" stroke-width="1.5"/><text x="130.0" y="106.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">Вхідний пакет із номером seq</tspan><tspan x="130.0" dy="14.3">Поточний очікуваний номер: seq_exp</tspan></text>
<line x1="240.0" y1="110.0" x2="310.0" y2="110.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="311.5" y="88.8" width="237.0" height="42.5" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="430.0" y="106.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">Знакова різниця за модулем 2^N:</tspan><tspan x="430.0" dy="15.0">Δ = (intN_t)(seq - seq_exp)</tspan></text>
<line x1="430.0" y1="140.0" x2="160.0" y2="220.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="34.8" y="226.3" width="250.4" height="67.4" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="243.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Δ = 0: Очікуваний пакет (In-Order)</tspan><tspan x="160.0" dy="13.7">• Віддати застосунку негайно</tspan><tspan x="160.0" dy="13.7">• Зсунути seq_exp = seq + 1</tspan><tspan x="160.0" dy="13.7">• Перевірити буфер перевпорядкування</tspan></text>
<text x="250.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Δ = 0 (черга)</text>
<line x1="430.0" y1="140.0" x2="430.0" y2="220.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="265.8" y="229.4" width="328.5" height="81.1" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="430.0" y="246.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0.0">0 &lt; Δ &lt; 2^(N-1): Випередження (Gap)</tspan><tspan x="430.0" dy="13.7">• Зафіксувати втрату пакетів: [seq_exp .. seq-1]</tspan><tspan x="430.0" dy="13.7">• Збільшити лічильник втрат: loss += Δ</tspan><tspan x="430.0" dy="13.7">• Зберегти поточний seq у буфер черги</tspan><tspan x="430.0" dy="13.7">• Оновити seq_max = seq</tspan></text>
<text x="440.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Δ &gt; 0 (пропуск)</text>
<line x1="430.0" y1="140.0" x2="700.0" y2="220.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="545.5" y="229.4" width="308.9" height="81.1" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="700.0" y="246.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0"> -2^(N-1) &lt; Δ &lt; 0: Минулий пакет</tspan><tspan x="700.0" dy="13.7">• Перевірити вікно прийому (бітову маску)</tspan><tspan x="700.0" dy="13.7">• Якщо біт = 1 → ДУБЛІКАТ (відкинути)</tspan><tspan x="700.0" dy="13.7">• Якщо біт = 0 → ПЕРЕВПОРЯДКОВАНИЙ</tspan><tspan x="700.0" dy="13.7">  (заповнити дірку в буфері, відновити потік)</tspan></text>
<text x="610.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Δ &lt; 0 (минуле)</text>
<rect x="60.0" y="370.0" width="720.0" height="75.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="420.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підсумок класифікації та реакція приймача</text>
<text x="420.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Помилкова класифікація унеможливлюється, якщо затримка перевпорядкування не перевищує 2^(N-1) пакетів</text>
<text x="420.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Коректна обробка вимагає ковзної маски отриманих пакетів або черги відкладеної доставки</text>
</svg>