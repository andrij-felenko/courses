<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="90.0" y="33.4" width="260.0" height="63.2" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="53.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">1. DNS Resolution</tspan><tspan x="220.0" dy="15.6">Запити A та AAAA одночасно.</tspan><tspan x="220.0" dy="15.6">Таймер Resolution Delay (50 мс)</tspan></text>
<rect x="519.8" y="33.4" width="280.4" height="63.2" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="53.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">2. Address Interleaving</tspan><tspan x="660.0" dy="15.6">Сортування RFC 6724 + чергування:</tspan><tspan x="660.0" dy="15.6">[IPv6_0, IPv4_0, IPv6_1, IPv4_1...]</tspan></text>
<line x1="360.0" y1="65.0" x2="510.0" y2="65.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="435.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Списки IP</text>
<rect x="467.7" y="158.4" width="384.6" height="63.2" rx="6" fill="#fffaf0" stroke="#d97706" stroke-width="1.5"/><text x="660.0" y="178.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">3. Connection Scheduler</tspan><tspan x="660.0" dy="15.6">Запуск спроб із Connection Attempt Delay (250 мс)</tspan><tspan x="660.0" dy="15.6">Неблокуючі сокети connect()</tspan></text>
<line x1="660.0" y1="105.0" x2="660.0" y2="150.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="57.5" y="158.4" width="325.0" height="63.2" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="178.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">4. Socket Racing Pool</tspan><tspan x="220.0" dy="15.6">Асинхронний цикл подій (epoll/kqueue)</tspan><tspan x="220.0" dy="15.6">Паралельний моніторинг готовності сокетів</tspan></text>
<line x1="510.0" y1="190.0" x2="360.0" y2="190.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="435.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Додати сокет</text>
<rect x="68.6" y="298.4" width="302.7" height="63.2" rx="6" fill="#e8f6ed" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="318.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="220.0" dy="0.0">5. Winner Handshake</tspan><tspan x="220.0" dy="15.6">Перший сокет з успішним SYN-ACK</tspan><tspan x="220.0" dy="15.6">передається додатку для передачі даних</tspan></text>
<line x1="220.0" y1="235.0" x2="220.0" y2="285.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="165.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">TCP Handshake OK</text>
<rect x="497.5" y="298.4" width="325.0" height="63.2" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="660.0" y="318.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="660.0" dy="0.0">6. Cleanup &amp; Reset (RST)</tspan><tspan x="660.0" dy="15.6">Негайне закриття всіх інших сокетів пулу.</tspan><tspan x="660.0" dy="15.6">Звільнення ресурсів клієнта й сервера</tspan></text>
<line x1="360.0" y1="330.0" x2="510.0" y2="330.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="435.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Скасувати невдах</text>
<rect x="210.0" y="423.4" width="460.0" height="63.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="443.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">7. Historical RDA State / Кеш працездатності</tspan><tspan x="440.0" dy="15.6">Збереження RTT та збоїв для префіксів / інтерфейсів.</tspan><tspan x="440.0" dy="15.6">Тимчасовий backoff для непрацездатних родин адрес</tspan></text>
<line x1="220.0" y1="375.0" x2="350.0" y2="420.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="660.0" y1="375.0" x2="530.0" y2="420.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="250.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Успіх RTT</text>
<text x="620.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Збій IPv6</text>
</svg>