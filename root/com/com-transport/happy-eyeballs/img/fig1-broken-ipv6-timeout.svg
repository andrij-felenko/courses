<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="70.0" y="22.0" width="180.0" height="45.9" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="160.0" y="41.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">Клієнт (Dual-Stack)</tspan><tspan x="160.0" dy="16.9">POSIX getaddrinfo()</tspan></text>
<rect x="350.0" y="22.0" width="180.0" height="45.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="440.0" y="41.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Мережа / Фаєрвол</tspan><tspan x="440.0" dy="16.9">(IPv6 Black Hole)</tspan></text>
<rect x="607.2" y="22.0" width="225.6" height="45.9" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="720.0" y="41.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="720.0" dy="0.0">Сервер (Dual-Stack)</tspan><tspan x="720.0" dy="16.9">2001:db8::1 / 198.51.100.1</tspan></text>
<line x1="160.0" y1="75.0" x2="160.0" y2="485.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="440.0" y1="75.0" x2="440.0" y2="485.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="720.0" y1="75.0" x2="720.0" y2="485.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
<line x1="160.0" y1="105.0" x2="720.0" y2="105.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="440.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. DNS запит (A та AAAA) → отримано IPv6 і IPv4</text>
<line x1="720.0" y1="125.0" x2="160.0" y2="125.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="440.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">2. Відповідь DNS: AAAA 2001:db8::1, A 198.51.100.1</text>
<rect x="75.0" y="140.0" width="170.0" height="24.0" rx="4" fill="#fbeae8" stroke="#c0392b" stroke-width="1.2"/>
<text x="160.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Спроба 1: IPv6 (RFC 6724)</text>
<line x1="160.0" y1="175.0" x2="440.0" y2="175.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="300.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">TCP SYN [IPv6: 2001:db8::1] (t = 0 с)</text>
<circle cx="440.0" cy="175.0" r="12.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="440.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">✖</text>
<text x="535.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">Пакет мовчки відкинуто</text>
<rect x="15.0" y="195.0" width="290.0" height="145.0" rx="6" fill="#fffaf9" stroke="#c0392b" stroke-width="1.0"/>
<text x="160.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Експоненційний відступ SYN-ретрансмісій ядра:</text>
<text x="160.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• t = 1 с: повторний TCP SYN #1 (втрачено)</text>
<text x="160.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• t = 3 с: повторний TCP SYN #2 (втрачено)</text>
<text x="160.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• t = 7 с: повторний TCP SYN #3 (втрачено)</text>
<text x="160.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">• t = 15 с: повторний TCP SYN #4 (втрачено)</text>
<text x="160.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">t = 21–31 с: ETIMEDOUT (збій сокета IPv6)</text>
<rect x="459.8" y="220.6" width="280.4" height="78.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="600.0" y="240.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">Користувач бачить затримку 21–31 с!</tspan><tspan x="600.0" dy="15.6">Браузер показує порожню сторінку.</tspan><tspan x="600.0" dy="15.6">Користувач закриває вкладку</tspan><tspan x="600.0" dy="15.6">та вимикає IPv6 в системі.</tspan></text>
<rect x="75.0" y="355.0" width="170.0" height="24.0" rx="4" fill="#e8f6ed" stroke="#27ae60" stroke-width="1.2"/>
<text x="160.0" y="371.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Спроба 2: IPv4 Fallback</text>
<line x1="160.0" y1="395.0" x2="720.0" y2="395.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="440.0" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">TCP SYN [IPv4: 198.51.100.1] (t = 25.0 с)</text>
<line x1="720.0" y1="425.0" x2="160.0" y2="425.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="440.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">TCP SYN-ACK [IPv4] (t = 25.04 с, RTT = 40 мс)</text>
<line x1="160.0" y1="455.0" x2="720.0" y2="455.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="440.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">TCP ACK [IPv4] → З'єднання встановлено успішно (t = 25.08 с)</text>
<rect x="40.0" y="468.0" width="680.0" height="26.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/>
<text x="440.0" y="485.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підсумок: послідовний перебір робить мережу повільною та непридатною при будь-яких збоях IPv6</text>
</svg>