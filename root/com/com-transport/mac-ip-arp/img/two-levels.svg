<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві адреси на одному пристрої — і навіщо обидві</text>
<rect x="295.0" y="175.1" width="170.0" height="49.9" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.5"/><text x="380.0" y="196.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Пристрій</tspan><tspan x="380.0" dy="16.9">(Wi-Fi/Ethernet)</tspan></text>
<rect x="40.0" y="95.0" width="250.0" height="210.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="165.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">MAC — апаратна</text>
<text x="165.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">канальний рівень</text>
<rect x="60.0" y="158.0" width="210.0" height="30.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="165.0" y="177.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">DE:AD:BE:EF:12:34</tspan></text>
<text x="165.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">• випалена в чіп на заводі</tspan><tspan x="165.0" dy="17.1">• незмінна, своя в кожного</tspan><tspan x="165.0" dy="17.1">• плоска: лише «хто», не «де»</tspan></text>
<line x1="290.0" y1="200.0" x2="295.0" y2="200.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="470.0" y="95.0" width="250.0" height="210.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="595.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">IP — логічна</text>
<text x="595.0" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">мережевий рівень</text>
<rect x="490.0" y="158.0" width="210.0" height="30.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="595.0" y="177.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">192.168.1.42</tspan></text>
<text x="595.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">• видана мережею (DHCP)</tspan><tspan x="595.0" dy="17.1">• змінюється з місцем</tspan><tspan x="595.0" dy="17.1">• ієрархічна: підмережа + вузол</tspan></text>
<line x1="470.0" y1="200.0" x2="465.0" y2="200.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="380.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">MAC каже, ХТО на дроті; IP каже, ДЕ він у топології мереж.</text>
</svg>