<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ланцюг черг на шляху датаграми</text>
<rect x="50.0" y="66.0" width="330.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="97.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">застосунок: sendto()</tspan></text>
<rect x="430.0" y="66.0" width="460.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="89.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="660.0" dy="0.0">повертає число — це «ядро взяло у себе»,</tspan><tspan x="660.0" dy="15.6">а не «адресат отримав»</tspan></text>
<line x1="215.0" y1="120.0" x2="215.0" y2="142.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="144.0" width="330.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="167.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">черга сокета</tspan><tspan x="215.0" dy="16.9">(відправка)</tspan></text>
<rect x="430.0" y="144.0" width="460.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="167.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="660.0" dy="0.0">переповнення: ENOBUFS</tspan><tspan x="660.0" dy="15.6">або тихе відкидання</tspan></text>
<line x1="215.0" y1="198.0" x2="215.0" y2="220.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="222.0" width="330.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="253.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">черга мережевого інтерфейсу</tspan></text>
<rect x="430.0" y="222.0" width="460.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="245.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="660.0" dy="0.0">генеруємо швидше,</tspan><tspan x="660.0" dy="15.6">ніж лінк устигає віддавати</tspan></text>
<line x1="215.0" y1="276.0" x2="215.0" y2="298.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="300.0" width="330.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="331.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">лінк: радіо або дріт</tspan></text>
<rect x="430.0" y="300.0" width="460.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="323.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="660.0" dy="0.0">спотворення → кадр не проходить</tspan><tspan x="660.0" dy="15.6">перевірку → відкинуто</tspan></text>
<line x1="215.0" y1="354.0" x2="215.0" y2="376.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="378.0" width="330.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="401.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">черга маршрутизатора</tspan><tspan x="215.0" dy="16.9">на вузькому місці</tspan></text>
<rect x="430.0" y="378.0" width="460.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="401.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="660.0" dy="0.0">черга скінченна: повна —</tspan><tspan x="660.0" dy="15.6">нові пакети за борт</tspan></text>
<line x1="215.0" y1="432.0" x2="215.0" y2="454.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="456.0" width="330.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="487.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">фаєрвол і NAT</tspan></text>
<rect x="430.0" y="456.0" width="460.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="479.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="660.0" dy="0.0">немає дозволу чи запису трансляції —</tspan><tspan x="660.0" dy="15.6">ковтає мовчки</tspan></text>
<line x1="215.0" y1="510.0" x2="215.0" y2="532.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="534.0" width="330.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="557.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">черга сокета</tspan><tspan x="215.0" dy="16.9">(прийом)</tspan></text>
<rect x="430.0" y="534.0" width="460.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="557.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="660.0" dy="0.0">застосунок читає повільніше,</tspan><tspan x="660.0" dy="15.6">ніж надходить</tspan></text>
<line x1="215.0" y1="588.0" x2="215.0" y2="610.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="50.0" y="612.0" width="330.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="215.0" y="643.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">застосунок: recvfrom()</tspan></text>
<rect x="430.0" y="612.0" width="460.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="660.0" y="635.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="660.0" dy="0.0">замалий буфер — хвіст датаграми</tspan><tspan x="660.0" dy="15.6">відрізано назавжди</tspan></text>
</svg>