<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1020" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="510.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що з чого вийшло: розділення TCP на шари</text>
<rect x="210.0" y="62.0" width="600.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="107.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">Transmission Control Program (1974–1977)</tspan></text>
<text x="510.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">адресація, маршрут, надійність, порядок, порти — усе в одному</text>
<line x1="510.0" y1="142.0" x2="510.0" y2="186.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="280.0" y="188.0" width="460.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="510.0" y="210.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">нарада в ISI, Марина-дель-Рей (1977):</tspan><tspan x="510.0" dy="18.2">розділити на шари</tspan></text>
<line x1="510.0" y1="244.0" x2="175.0" y2="294.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="510.0" y1="244.0" x2="510.0" y2="294.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="510.0" y1="244.0" x2="845.0" y2="294.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="45.0" y="298.0" width="260.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="330.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="175.0" dy="0.0">IP</tspan><tspan x="175.0" dy="18.2">адреса, маршрут,</tspan><tspan x="175.0" dy="18.2">доставка одного пакета</tspan></text>
<rect x="380.0" y="298.0" width="260.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="330.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="510.0" dy="0.0">TCP</tspan><tspan x="510.0" dy="18.2">з'єднання, повтори,</tspan><tspan x="510.0" dy="18.2">порядок — поверх IP</tspan></text>
<rect x="715.0" y="298.0" width="260.0" height="92.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="845.0" y="330.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="845.0" dy="0.0">UDP</tspan><tspan x="845.0" dy="18.2">порти, довжина, сума —</tspan><tspan x="845.0" dy="18.2">і нічого більше</tspan></text>
<rect x="35.0" y="416.0" width="280.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="175.0" y="454.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="175.0" dy="0.0">спільний низ:</tspan><tspan x="175.0" dy="15.6">мережа лише передає,</tspan><tspan x="175.0" dy="15.6">нічого не обіцяючи</tspan></text>
<rect x="370.0" y="416.0" width="280.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="510.0" y="454.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="510.0" dy="0.0">для файлів і пошти:</tspan><tspan x="510.0" dy="15.6">повнота важить</tspan><tspan x="510.0" dy="15.6">більше за час</tspan></text>
<rect x="705.0" y="416.0" width="280.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="845.0" y="454.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle"><tspan x="845.0" dy="0.0">для мови, радара, відео:</tspan><tspan x="845.0" dy="15.6">час важить</tspan><tspan x="845.0" dy="15.6">більше за повноту</tspan></text>
</svg>