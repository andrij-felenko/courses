<text x="775.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">RAND, AUTN = (SQN ⊕ AK || AMF || MAC)</text>
