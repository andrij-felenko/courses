<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12.8 -10 785.6 410" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-12.8" y="-10" width="785.6" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Подвоїста декомпозиція оптимізації мережевих utility (Kelly's NUM)</text>
<rect x="40.0" y="120.0" width="200.0" height="160.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="2.0"/>
<text x="140.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">ДЖЕРЕЛА (Sources)</text>
<text x="140.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Оптимізація корисності:</tspan><tspan x="140.0" dy="14.3">max U_i(x_i) - p_path * x_i</tspan><tspan x="140.0" dy="14.3"></tspan><tspan x="140.0" dy="14.3">Адаптація швидкостей x_i(t)</tspan></text>
<rect x="520.0" y="120.0" width="200.0" height="160.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="620.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">ВУЗЛИ МЕРЕЖІ (Links)</text>
<text x="620.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Вимірювання черг / надлишку:</tspan><tspan x="620.0" dy="14.3">y_e = sum(x_i) vs C_e</tspan><tspan x="620.0" dy="14.3"></tspan><tspan x="620.0" dy="14.3">Оновлення цін p_e(t+1)</tspan></text>
<line x1="240.0" y1="230.0" x2="520.0" y2="230.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="284.1" y="219.5" width="191.8" height="21.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="380.0" y="226.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Потік даних: швидкість x_i(t)</tspan></text>
<line x1="520.0" y1="170.0" x2="240.0" y2="170.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="252.7" y="159.5" width="254.5" height="21.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="166.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Сигнал затору: ціна p_e(t) / ECN / Drop</tspan></text>
<rect x="-2.8" y="339.0" width="765.6" height="32.0" rx="6" fill="#fff7ee" stroke="#333333" stroke-width="1.5"/><text x="380.0" y="359.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Подвоїста декомпозиція Келлі: Мережа обчислює ціни заторів у вузлах, а джерела незалежно регулюють швидкості.</tspan></text>
</svg>