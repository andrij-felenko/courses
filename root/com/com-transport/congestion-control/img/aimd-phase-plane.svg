<line x1="265.0" y1="175.0" x2="192.5" y2="267.5" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 3"/>
<line x1="192.5" y1="267.5" x2="260.0" y2="200.0" stroke="#2457d6" stroke-width="2.0"/>
<rect x="451.7" y="115.0" width="216.6" height="170.0" rx="6" fill="#fff7ee" stroke="#333333" stroke-width="1.5"/><text x="560.0" y="132.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Динаміка AIMD:</tspan><tspan x="560.0" dy="14.3"></tspan><tspan x="560.0" dy="14.3">1. Адитивний ріст (+α):</tspan><tspan x="560.0" dy="14.3">   Рух під кутом 45° паралельно</tspan><tspan x="560.0" dy="14.3">   лінії справедливості.</tspan><tspan x="560.0" dy="14.3"></tspan><tspan x="560.0" dy="14.3">2. Мультиплікативний зріз (×β):</tspan><tspan x="560.0" dy="14.3">   Променеве скорочення до нуля.</tspan><tspan x="560.0" dy="14.3"></tspan><tspan x="560.0" dy="14.3">Результат: Збіжність до точки</tspan><tspan x="560.0" dy="14.3">справедливого оптимуму!</tspan></text>
</svg>