<line x1="120.0" y1="360.0" x2="400.0" y2="80.0" stroke="#27ae60" stroke-width="2.0" stroke-dasharray="5 4"/>
<text x="320.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Лінія справедливості: x1 = x2</text>
