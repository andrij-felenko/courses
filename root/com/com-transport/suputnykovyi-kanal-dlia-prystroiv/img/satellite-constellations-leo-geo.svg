<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння супутникових угруповань GEO та LEO для IoT</text>
<rect x="10.0" y="10.0" width="800.0" height="440.0" rx="10" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="30.0" y="35.0" width="365.0" height="400.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="212.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Геостаціонарна орбіта (GEO)</text>
<text x="212.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Inmarsat, Thuraya, Viasat</text>
<rect x="45.0" y="95.0" width="335.0" height="62.0" rx="6" fill="#f0f4fd" stroke="#2457d6" stroke-width="1.0"/><text x="212.5" y="116.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Висота орбіти: 35 786 км над екватором</tspan><tspan x="212.5" dy="13.0">Період обертання: 23 год 56 хв (синхронно із Землею)</tspan><tspan x="212.5" dy="13.0">Видимість: постійна фіксована точка на небосхилі</tspan></text>
<rect x="45.0" y="170.0" width="335.0" height="110.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/><text x="212.5" y="204.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Властивості радіоканалу:</tspan><tspan x="212.5" dy="11.7">• Велика затримка: RTT = 500…600 мс</tspan><tspan x="212.5" dy="11.7">• Величезні втрати простору: FSPL ≈ 190…200 дБ (L-діапазон)</tspan><tspan x="212.5" dy="11.7">• Доплерівський зсув: Δf ≈ 0 Гц (відносна швидкість нульова)</tspan><tspan x="212.5" dy="11.7">• Сліпа зона: полярні широти (&gt;75° пн./пд. ш.) поза зоною зв'язку</tspan></text>
<rect x="45.0" y="292.0" width="335.0" height="130.0" rx="6" fill="#fff8e1" stroke="#f0b429" stroke-width="1.0"/><text x="212.5" y="335.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">Вимоги до абонентського термінала:</tspan><tspan x="212.5" dy="12.3">• Спрямована антена або громіздкий тарілчастий опромінювач</tspan><tspan x="212.5" dy="12.3">• Висока випромінювана потужність (EIRP &gt; 15…25 дБВт)</tspan><tspan x="212.5" dy="12.3">• Високе енергоспоживання (складно живити від батарейок)</tspan><tspan x="212.5" dy="12.3">• Стаціонарне або морське використання (буї, судна, вишки)</tspan></text>
<rect x="425.0" y="35.0" width="365.0" height="400.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<text x="607.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Низька орбіта (LEO / IoT Nanosats)</text>
<text x="607.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Iridium, Swarm (SpaceX), Globalstar, Astrocast</text>
<rect x="440.0" y="95.0" width="335.0" height="62.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.0"/><text x="607.5" y="115.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="607.5" dy="0.0">Висота орбіти: 500…1400 км</tspan><tspan x="607.5" dy="14.3">Швидкість руху: v ≈ 7.5 км/с (період ~90…100 хв)</tspan><tspan x="607.5" dy="14.3">Видимість супутника: динамічне вікно 5…12 хвилин</tspan></text>
<rect x="440.0" y="170.0" width="335.0" height="110.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/><text x="607.5" y="204.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="607.5" dy="0.0">Властивості радіоканалу:</tspan><tspan x="607.5" dy="11.7">• Низька затримка: RTT = 10…40 мс (міжвузловий час)</tspan><tspan x="607.5" dy="11.7">• Помірні втрати простору: FSPL ≈ 155…165 дБ (L-діапазон)</tspan><tspan x="607.5" dy="11.7">• Значний доплерівський зсув: Δf до ±38 кГц на 1.6 ГГц</tspan><tspan x="607.5" dy="11.7">• Повне покриття: полярні орбіти охоплюють 100% поверхні Землі</tspan></text>
<rect x="440.0" y="292.0" width="335.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.0"/><text x="607.5" y="336.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="607.5" dy="0.0">Вимоги до абонентського термінала:</tspan><tspan x="607.5" dy="11.7">• Компактна всеспрямована керамічна патч-антена (RHCP)</tspan><tspan x="607.5" dy="11.7">• Передавач 1…2 Вт у коротких імпульсах (Short Burst Data)</tspan><tspan x="607.5" dy="11.7">• Можливість автономного живлення від первинних літієвих батарей</tspan><tspan x="607.5" dy="11.7">• Оптимально для трекерів, сенсорів, датчиків дикої природи</tspan></text>
</svg>