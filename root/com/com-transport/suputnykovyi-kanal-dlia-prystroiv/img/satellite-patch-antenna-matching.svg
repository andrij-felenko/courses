<text x="210.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle">25 × 25 × 4 мм</text>
<circle cx="185.0" cy="175.0" r="5.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="185.0" y1="175.0" x2="150.0" y2="195.0" stroke="#c0392b" stroke-width="1.2"/>
<text x="145.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Зміщена точка запитки (RHCP)</text>
<line x1="130.0" y1="118.0" x2="143.0" y2="105.0" stroke="#d97706" stroke-width="2.0"/>
<line x1="277.0" y1="205.0" x2="290.0" y2="192.0" stroke="#d97706" stroke-width="2.0"/>
<text x="275.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">зрізи кутів
(зсув фази 90°)</text>
<rect x="40.0" y="240.0" width="340.0" height="155.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/><text x="210.0" y="297.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Вимоги до антени супутникового вузла:</tspan><tspan x="210.0" dy="11.7">• Права кругова поляризація (RHCP, Axial Ratio &lt; 3 дБ)</tspan><tspan x="210.0" dy="11.7">• Екранує втрати від обертання площини Фарадея в іоносфері</tspan><tspan x="210.0" dy="11.7">• Чистий горизонт (Sky View) без металевих перешкод</tspan><tspan x="210.0" dy="11.7">• Розмір екранної площини задає резонансну частоту та КСХ</tspan></text>
<rect x="425.0" y="30.0" width="370.0" height="380.0" rx="8" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="610.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Буферизація імпульсного струму (до 2 А)</text>
<rect x="440.0" y="80.0" width="80.0" height="50.0" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
