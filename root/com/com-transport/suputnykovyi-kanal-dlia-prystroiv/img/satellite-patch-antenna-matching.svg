<text x="480.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Li-SOCl2 (3.6В)</text>
<rect x="540.0" y="80.0" width="95.0" height="50.0" rx="4" fill="#fff8e1" stroke="#f0b429" stroke-width="1.4"/>
