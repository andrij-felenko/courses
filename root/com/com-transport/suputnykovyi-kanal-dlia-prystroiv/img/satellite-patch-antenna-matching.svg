<text x="587.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">I_max ≤ 150 мА</text>
<rect x="655.0" y="80.0" width="125.0" height="50.0" rx="4" fill="#eafaf1" stroke="#27ae60" stroke-width="1.4"/>
<text x="717.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Суперконденсатор</text>
<text x="717.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">0.22…0.5 Ф (ESR &lt; 50 мОм)</text>
