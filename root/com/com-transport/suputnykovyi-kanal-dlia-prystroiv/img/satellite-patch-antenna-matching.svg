<rect x="80.0" y="75.0" width="260.0" height="150.0" rx="4" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/>
<text x="210.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Плата заземлення (Ground Plane ≥ 50 × 50 мм)</text>
