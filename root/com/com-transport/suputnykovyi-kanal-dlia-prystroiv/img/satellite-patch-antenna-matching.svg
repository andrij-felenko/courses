<line x1="717.0" y1="165.0" x2="717.0" y2="185.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="745.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Піковий імпульс
1.5…2.0 А (8.3 мс)</text>
<rect x="480.0" y="185.0" width="270.0" height="45.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.6"/>
<text x="615.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Підсилювач потужності (PA Transceiver)</text>
<text x="615.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Iridium 9603N / Swarm M138</text>
<rect x="440.0" y="245.0" width="340.0" height="150.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/><text x="610.0" y="299.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Фізична проблема просідання напруги (Brownout):</tspan><tspan x="610.0" dy="11.7">• Первинні батареї мають високий внутрішній опір (ESR &gt; 5…15 Ом)</tspan><tspan x="610.0" dy="11.7">• Стрибок струму 2 А викликає падіння ΔU = I · R_esr &gt; 10 В (колапс!)</tspan><tspan x="610.0" dy="11.7">• Суперконденсатор накопичує енергію E = 0.5 · C · (U1² - U2²)</tspan><tspan x="610.0" dy="11.7">• Soft-start обмежує струм заряду, запобігаючи скиданню мікроконтролера</tspan></text>
</svg>