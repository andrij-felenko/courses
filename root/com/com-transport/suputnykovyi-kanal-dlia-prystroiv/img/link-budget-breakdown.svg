<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -10 860 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-40" y="-10" width="860" height="430" fill="#ffffff"/>
