<text x="410.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Аналіз енергетичного запасу радіолінії (Link Margin):</text>
<rect x="60.0" y="312.0" width="330.0" height="66.0" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.0"/><text x="225.0" y="335.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">Тепловий шум приймача (B = 25 кГц, NF = 3 дБ):</tspan><tspan x="225.0" dy="13.0">P_noise = k · T · B + NF ≈ -127.0 дБм</tspan><tspan x="225.0" dy="13.0">Поріг демодуляції QPSK (Eb/N0 = 6 дБ): -134.0 дБм</tspan></text>
<rect x="410.0" y="312.0" width="350.0" height="66.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/><text x="585.0" y="336.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="585.0" dy="0.0">Підсумковий запас каналу (Link Margin):</tspan><tspan x="585.0" dy="11.7">Margin = P_rx - P_threshold = -121.1 - (-134.0) = +12.9 дБ</tspan><tspan x="585.0" dy="11.7">Запас гарантує стійкий зв'язок під час дощу та низьких кутів місця (&gt;15°)</tspan></text>
