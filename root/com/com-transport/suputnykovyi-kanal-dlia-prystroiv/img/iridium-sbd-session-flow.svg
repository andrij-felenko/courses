<text x="595.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Gateway ACK + Вхідний MT-пакет (якщо є)</text>
<line x1="490.0" y1="345.0" x2="290.0" y2="345.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="390.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Супутник повертає підтвердження модему</text>
<line x1="290.0" y1="375.0" x2="100.0" y2="375.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="195.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">+SBDIX: 0, 321, 1, 14, 28, 0 (MO успіх, MT прийнято)</text>
<line x1="100.0" y1="400.0" x2="290.0" y2="400.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="195.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">AT+SBDRB (вичитування 28 байтів MT з буфера)</text>
</svg>