<text x="290.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="290.0" dy="0.0">Супутниковий модем</tspan><tspan x="290.0" dy="12.0">(Iridium 9603N / DCE)</tspan></text>
<line x1="290.0" y1="88.0" x2="290.0" y2="420.0" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4,4"/>
