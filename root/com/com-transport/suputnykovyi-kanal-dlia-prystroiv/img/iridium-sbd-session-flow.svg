<rect x="630.0" y="50.0" width="140.0" height="38.0" rx="5" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="700.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="700.0" dy="0.0">Шлюз мережі</tspan><tspan x="700.0" dy="12.0">(Iridium Gateway / NOC)</tspan></text>
