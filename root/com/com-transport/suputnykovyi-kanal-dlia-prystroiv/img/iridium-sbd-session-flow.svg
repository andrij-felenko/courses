<text x="595.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Inter-Satellite Link (Ka-band) → Downlink до шлюзу</text>
