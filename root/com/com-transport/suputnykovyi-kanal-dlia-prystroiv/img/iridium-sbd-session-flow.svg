<text x="490.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Супутник LEO</tspan><tspan x="490.0" dy="12.0">(Iridium NEXT)</tspan></text>
