<line x1="100.0" y1="110.0" x2="290.0" y2="110.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="195.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">AT+SBDWB=42 (запис 42 байтів)</text>
<line x1="290.0" y1="135.0" x2="100.0" y2="135.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="195.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">READY\r\n</text>
