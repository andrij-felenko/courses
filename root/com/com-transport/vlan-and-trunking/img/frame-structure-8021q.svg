<text x="45.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Маркований кадр 802.1Q (IEEE 802.3ac):</text>
