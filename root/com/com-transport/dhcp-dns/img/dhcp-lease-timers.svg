<rect x="30.0" y="200.0" width="245.0" height="115.0" rx="6" fill="#f0faf4" stroke="#27ae60" stroke-width="1.5"/><text x="152.5" y="239.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="152.5" dy="0.0">Звичайна робота (0 - 50%):</tspan><tspan x="152.5" dy="14.3">Клієнт спокійно використовує IP.</tspan><tspan x="152.5" dy="14.3">Жодних запитів до мережі не</tspan><tspan x="152.5" dy="14.3">надсилається.</tspan></text>
