<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="100%" height="100%">
<style>
  .bg { fill: #0f172a; }
  .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8px; }
  .hex { stroke-width: 2; fill-opacity: 0.15; }
  .hex-f1 { stroke: #38bdf8; fill: #38bdf8; }
  .hex-f2 { stroke: #4ade80; fill: #4ade80; }
  .hex-f3 { stroke: #f43f5e; fill: #f43f5e; }
  .sec-line { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,3; }
  .tower-beam { fill-opacity: 0.25; stroke-width: 1; }
  .beam-s1 { fill: #38bdf8; stroke: #38bdf8; }
  .beam-s2 { fill: #4ade80; stroke: #4ade80; }
  .beam-s3 { fill: #fbbf24; stroke: #fbbf24; }
  .txt-title { font-family: sans-serif; font-size: 14px; font-weight: 700; fill: #f8fafc; }
  .txt-sub { font-family: sans-serif; font-size: 11px; fill: #94a3b8; }
  .txt-bold { font-family: sans-serif; font-size: 12px; font-weight: 700; fill: #f1f5f9; }
  .txt-sec { font-family: sans-serif; font-size: 10px; font-weight: 600; fill: #cbd5e1; }
  .legend-box { fill: #1e293b; stroke: #475569; stroke-width: 1; rx: 4px; }
  .badge { fill: #0f172a; stroke-width: 1; rx: 4px; }
</style>
<rect class="bg" width="960" height="500" />
<rect class="card" x="20" y="20" width="450" height="460" />
<text class="txt-title" font-size="14" x="40" y="48">Повторне використання частот (Reuse N=3 vs N=1)</text>
<text class="txt-sub" font-size="11" x="40" y="68">Мінімізація міжсотової інтерференції (ICI) на межах сот</text>
<polygon class="hex hex-f1" points="185.0,186.0 140.0,212.0 95.0,186.0 95.0,134.0 140.0,108.0 185.0,134.0" />
<circle cx="140" cy="160" r="3" fill="#ffffff" />
<text class="txt-bold" font-size="12" x="140" y="152" text-anchor="middle">f₁</text>
<text class="txt-sub" font-size="11" x="140" y="178" text-anchor="middle">Сота A</text>
<polygon class="hex hex-f2" points="275.0,186.0 230.0,212.0 185.0,186.0 185.0,134.0 230.0,108.0 275.0,134.0" />
<circle cx="230" cy="160" r="3" fill="#ffffff" />
