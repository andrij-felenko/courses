<rect class="legend-box" x="40" y="390" width="410" height="70" />
<circle cx="58" cy="412" r="6" class="hex-f1" fill-opacity="1" />
<text class="txt-sub" font-size="11" x="75" y="416">Канал f₁: смуга A (наприклад, EARFCN 1300)</text>
<circle cx="58" cy="438" r="6" class="hex-f2" fill-opacity="1" />
<text class="txt-sub" font-size="11" x="75" y="442">Канали f₂, f₃: суміжні піддіапазони без накладання</text>
<rect class="card" x="490" y="20" width="450" height="460" />
<text class="txt-title" font-size="14" x="510" y="48">Трьохсекторна базова станція (eNodeB / gNodeB)</text>
<text class="txt-sub" font-size="11" x="510" y="68">Секторизація по 120° спрямованими панелями (PCI = 3·Group + Sec)</text>
<path class="tower-beam beam-s1" d="M 715 230 L 660 130 A 120 120 0 0 1 770 130 Z" />
<path class="tower-beam beam-s2" d="M 715 230 L 830 225 A 120 120 0 0 1 735 345 Z" />
<path class="tower-beam beam-s3" d="M 715 230 L 695 345 A 120 120 0 0 1 600 225 Z" />
<line class="sec-line" x1="715" y1="215" x2="715" y2="110" />
<line class="sec-line" x1="730" y1="240" x2="820" y2="290" />
<line class="sec-line" x1="700" y1="240" x2="610" y2="290" />
<circle cx="715" cy="230" r="12" fill="#334155" stroke="#64748b" stroke-width="2" />
<polygon points="715,223 720,233 710,233" fill="#f8fafc" />
<rect class="badge" x="780" y="120" width="125" height="42" stroke="#38bdf8" />
<text class="txt-bold" font-size="12" x="790" y="138" fill="#38bdf8">Сектор 0 (0°)</text>
<text class="txt-sec" font-size="10" x="790" y="154">Cell ID = 3k+0</text>
<rect class="badge" x="780" y="315" width="125" height="42" stroke="#4ade80" />
<text class="txt-bold" font-size="12" x="790" y="333" fill="#4ade80">Сектор 1 (120°)</text>
<text class="txt-sec" font-size="10" x="790" y="349">Cell ID = 3k+1</text>
<rect class="badge" x="525" y="315" width="125" height="42" stroke="#fbbf24" />
<text class="txt-bold" font-size="12" x="535" y="333" fill="#fbbf24">Сектор 2 (240°)</text>
<text class="txt-sec" font-size="10" x="535" y="349">Cell ID = 3k+2</text>
<rect class="legend-box" x="510" y="390" width="410" height="70" />
<text class="txt-sub" font-size="11" x="525" y="416">• Секторизація зменшує взаємну інтерференцію в 3 рази</text>
<text class="txt-sub" font-size="11" x="525" y="442">• Окремий RF-тракт на кожен сектор (MIMO 2x2/4x4/Massive)</text>
</svg>