<polygon class="hex hex-f2" points="140.0,264.0 95.0,290.0 50.0,264.0 50.0,212.0 95.0,186.0 140.0,212.0" />
<circle cx="95" cy="238" r="3" fill="#ffffff" />
<text class="txt-bold" font-size="12" x="95" y="230" text-anchor="middle">f₂</text>
