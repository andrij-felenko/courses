<polygon class="hex hex-f1" points="185.0,342.0 140.0,368.0 95.0,342.0 95.0,290.0 140.0,264.0 185.0,290.0" />
<circle cx="140" cy="316" r="3" fill="#ffffff" />
<text class="txt-bold" font-size="12" x="140" y="308" text-anchor="middle">f₁</text>
<text class="txt-sub" font-size="11" x="140" y="334" text-anchor="middle">Сота H</text>
<polygon class="hex hex-f2" points="275.0,342.0 230.0,368.0 185.0,342.0 185.0,290.0 230.0,264.0 275.0,290.0" />
<circle cx="230" cy="316" r="3" fill="#ffffff" />
<text class="txt-bold" font-size="12" x="230" y="308" text-anchor="middle">f₂</text>
<text class="txt-sub" font-size="11" x="230" y="334" text-anchor="middle">Сота I</text>
<polygon class="hex hex-f3" points="365.0,342.0 320.0,368.0 275.0,342.0 275.0,290.0 320.0,264.0 365.0,290.0" />
