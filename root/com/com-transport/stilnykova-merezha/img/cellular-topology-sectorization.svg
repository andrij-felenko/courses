<text class="txt-sub" font-size="11" x="275" y="256" text-anchor="middle">Сота F</text>
<polygon class="hex hex-f2" points="410.0,264.0 365.0,290.0 320.0,264.0 320.0,212.0 365.0,186.0 410.0,212.0" />
<circle cx="365" cy="238" r="3" fill="#ffffff" />
