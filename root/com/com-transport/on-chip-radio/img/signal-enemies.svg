<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому радіо ненадійне: що псує сигнал у дорозі</text>
<rect x="50.0" y="150.0" width="80.0" height="56.0" rx="6" fill="#eaf6ec" stroke="#27ae60" stroke-width="1.5"/><text x="90.0" y="182.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">TX</tspan></text>
<line x1="130.0" y1="150.0" x2="130.0" y2="130.0" stroke="#2457d6" stroke-width="2.0"/><line x1="130.0" y1="130.0" x2="124.0" y2="122.0" stroke="#2457d6" stroke-width="2.0"/><line x1="130.0" y1="130.0" x2="136.0" y2="122.0" stroke="#2457d6" stroke-width="2.0"/>
<rect x="630.0" y="150.0" width="80.0" height="56.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="670.0" y="182.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="670.0" dy="0.0">RX</tspan></text>
<line x1="630.0" y1="150.0" x2="630.0" y2="130.0" stroke="#2457d6" stroke-width="2.0"/><line x1="630.0" y1="130.0" x2="624.0" y2="122.0" stroke="#2457d6" stroke-width="2.0"/><line x1="630.0" y1="130.0" x2="636.0" y2="122.0" stroke="#2457d6" stroke-width="2.0"/>
<path d="M 130.0 124.0 A 8.0 8.0 0 0 1 130.0 140.0" fill="none" stroke="#2457d6" stroke-width="1.8"/><path d="M 130.0 114.0 A 18.0 18.0 0 0 1 130.0 150.0" fill="none" stroke="#2457d6" stroke-width="1.8"/><path d="M 130.0 104.0 A 28.0 28.0 0 0 1 130.0 160.0" fill="none" stroke="#2457d6" stroke-width="1.8"/>
<line x1="170" y1="178" x2="620" y2="178" stroke="#2457d6" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<text x="400.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">сигнал слабшає й спотворюється</text>
<line x1="250.0" y1="178.0" x2="250.0" y2="220.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="3,3"/>
<text x="250.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">стіна</text>
<text x="250.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">поглинає</text>
<line x1="360.0" y1="178.0" x2="360.0" y2="220.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="3,3"/>
<text x="360.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">відстань</text>
<text x="360.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">слабшає</text>
<line x1="470.0" y1="178.0" x2="470.0" y2="220.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="3,3"/>
<text x="470.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">інше радіо</text>
<text x="470.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">завада/колізія</text>
<line x1="560.0" y1="178.0" x2="560.0" y2="220.0" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="3,3"/>
<text x="560.0" y="238.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">відбиття</text>
<text x="560.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">багатопроменевість</text>
<rect x="40.0" y="278.0" width="680.0" height="48.0" rx="6" fill="#fbecec" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="298.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">Жоден із цих ворогів не діє на дріт — у повітрі вони є завжди.</tspan><tspan x="380.0" dy="14.3">Частина бітів псується, а цілі пакети просто ЗНИКАЮТЬ.</tspan></text>
</svg>