<text x="380.0" y="37.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джерела виникнення джитеру в мережевому тракті</text>
