<text x="150.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">CSMA/CA та колізії</text>
<text x="150.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Випадковий бекофф (Backoff)</text>
<text x="150.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Конкуренція за радіоефір</text>
<rect x="275.0" y="325.0" width="210.0" height="65.0" rx="4" fill="#f8fafc" stroke="#333333" stroke-width="1.0"/>
<text x="380.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">MAC Retransmissions</text>
<text x="380.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Повторні спроби на L2</text>
<text x="380.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">+10..60 мс на кожну спробу</text>
<rect x="505.0" y="325.0" width="210.0" height="65.0" rx="4" fill="#f8fafc" stroke="#333333" stroke-width="1.0"/>
<text x="610.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#8e44ad" text-anchor="middle" font-weight="700">Агрегація кадрів (A-MPDU)</text>
