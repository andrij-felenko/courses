<text x="202.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1. Буферне голодування (Underrun)</text>
<text x="202.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Пакет прибув ПІСЛЯ дедлайну відтворення:</text>
<text x="202.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">t_arrive &gt; t_play_deadline</text>
<text x="202.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Декодер отримує порожнечу (клік/тиша)</text>
<text x="202.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Вмикається маскування втрат (PLC)</text>
<text x="202.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">• Запізнілий пакет відкидається як непотрібний</text>
<rect x="395.0" y="245.0" width="325.0" height="155.0" rx="6" fill="#fef5e7" stroke="#e67e22" stroke-width="1.4"/>
<text x="557.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#e67e22" text-anchor="middle" font-weight="700">2. Переповнення буфера (Overrun)</text>
<text x="557.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Сплеск затримки роздуває чергу:</text>
<text x="557.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#e67e22" text-anchor="middle" font-weight="700">Queue_Depth &gt; Max_Buffer_Capacity</text>
<text x="557.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Нові або найстаріші пакети скидаються</text>
<text x="557.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">• Загальна інтерактивна затримка зростає</text>
<text x="557.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e67e22" text-anchor="middle" font-weight="700">• Потрібне прискорення відтворення (WSOLA)</text>
