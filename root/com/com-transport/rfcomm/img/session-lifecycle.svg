<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовність фаз сесії RFCOMM від запуску до розриву</text>
<rect x="40.0" y="58.0" width="680.0" height="37.0" rx="5" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="200.0" y="80.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">1. Підключення L2CAP</text>
<text x="420.0" y="80.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Відкриття каналу до PSM 0x0003, виділення CID</text>
<line x1="70.0" y1="96.0" x2="70.0" y2="102.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="40.0" y="103.0" width="680.0" height="37.0" rx="5" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="200.0" y="125.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">2. Запуск MUX (DLCI 0)</text>
<text x="420.0" y="125.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">SABM(0) → UA(0): старт мультиплексора керування</text>
<line x1="70.0" y1="141.0" x2="70.0" y2="147.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="40.0" y="148.0" width="680.0" height="37.0" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="200.0" y="170.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700">3. Узгодження PN</text>
<text x="420.0" y="170.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">PN(DLCI k): MTU, пріоритет, кредитний режим CBFC</text>
<line x1="70.0" y1="186.0" x2="70.0" y2="192.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="40.0" y="193.0" width="680.0" height="37.0" rx="5" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.5"/>
<text x="200.0" y="215.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a855f7" text-anchor="start" font-weight="700">4. Відкриття DLCI k</text>
<text x="420.0" y="215.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">SABM(k) → UA(k): активація віртуального порту даних</text>
<line x1="70.0" y1="231.0" x2="70.0" y2="237.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="40.0" y="238.0" width="680.0" height="37.0" rx="5" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="200.0" y="260.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#475569" text-anchor="start" font-weight="700">5. Сигнали ліній RS-232</text>
<text x="420.0" y="260.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">MSC(k): передача стану ліній RTS, CTS, DTR, DSR, CD</text>
<line x1="70.0" y1="276.0" x2="70.0" y2="282.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="40.0" y="283.0" width="680.0" height="37.0" rx="5" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="200.0" y="305.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">6. Потік даних (UIH)</text>
<text x="420.0" y="305.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Двосторонній обмін корисними байтами під контролем CBFC</text>
<line x1="70.0" y1="321.0" x2="70.0" y2="327.0" stroke="#6b7280" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="40.0" y="328.0" width="680.0" height="37.0" rx="5" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="200.0" y="350.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">7. Закриття каналу</text>
<text x="420.0" y="350.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">DISC(k) → UA(k); DISC(0) → UA(0) для зупинки MUX</text>
</svg>