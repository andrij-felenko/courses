<text x="180.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Керування сесією, кадри PN, MSC, RPN, RLS, TEST</text>
<line x1="320.0" y1="65.0" x2="340.0" y2="87.5" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="103.0" width="280.0" height="44.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.6"/>
<text x="180.0" y="119.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">DLCI 2: Канал даних SPP</text>
<text x="180.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Віртуальний термінал UART (Server Channel 1, потік байтів)</text>
<line x1="320.0" y1="125.0" x2="340.0" y2="132.5" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="163.0" width="280.0" height="44.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="180.0" y="179.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">DLCI 4: Канал даних DUN</text>
<text x="180.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Модемні AT-команди та пакетний трафік PPP (Server Channel 2)</text>
<line x1="320.0" y1="185.0" x2="340.0" y2="177.5" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="223.0" width="280.0" height="44.0" rx="6" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.6"/>
<text x="180.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#a855f7" text-anchor="middle" font-weight="700">DLCI 6: Канал OBEX / PBAP</text>
<text x="180.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Синхронізація контактів та файлів (Server Channel 3)</text>
<line x1="320.0" y1="245.0" x2="340.0" y2="222.5" stroke="#a855f7" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="340.0" y="45.0" width="200.0" height="220.0" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2.0"/>
<text x="440.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мульти-</text>
<text x="440.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">плексор</text>
<text x="440.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">RFCOMM</text>
<text x="440.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(DLCI 0..30)</text>
<line x1="540.0" y1="155.0" x2="570.0" y2="155.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="535.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Єдиний потік кадрів</text>
<rect x="570.0" y="105.0" width="150.0" height="100.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="645.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Канал L2CAP</text>
<text x="645.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">PSM = 0x0003</text>
<text x="645.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Фіксований CID</text>
<text x="645.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">(єдиний канал зв'язку)</text>
<text x="380.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-style="italic">До 30 незалежних послідовних портів обслуговуються одним з'єднанням L2CAP</text>
</svg>