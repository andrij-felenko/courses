<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 770 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="770" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мультиплексування віртуальних каналів DLCI у протоколі RFCOMM</text>
<rect x="40.0" y="43.0" width="280.0" height="44.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.6"/>
