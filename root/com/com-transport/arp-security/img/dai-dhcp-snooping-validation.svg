<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Захист на рівні комутатора: Dynamic ARP Inspection (DAI)</text>
<rect x="30.0" y="60.0" width="210.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="135.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Недовірений порт (Untrusted)</text>
<rect x="40.0" y="95.0" width="190.0" height="65.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="135.0" y="113.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Вхідний ARP-пакет:</tspan><tspan x="135.0" dy="11.7">Eth Src: MM:MM:MM:MM:MM:MM</tspan><tspan x="135.0" dy="11.7">ARP Sender MAC: MM:MM:..</tspan><tspan x="135.0" dy="11.7">ARP Sender IP: 192.168.1.1</tspan></text>
<line x1="240.0" y1="115.0" x2="290.0" y2="115.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="295.0" y="55.0" width="495.0" height="365.0" rx="6" fill="#f8fafc" stroke="#2457d6" stroke-width="1.8"/>
<text x="542.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Комутатор L2: Блок перевірки Dynamic ARP Inspection</text>
<rect x="315.0" y="98.0" width="455.0" height="36.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.1"/><text x="542.5" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="542.5" dy="0.0">Крок 1. Перевірка цілісності (DAI Validation):</tspan><tspan x="542.5" dy="13.0">Eth Src MAC == ARP Sender MAC? (Захист від підміни заголовка L2)</tspan></text>
<rect x="315.0" y="145.0" width="455.0" height="105.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/>
<text x="542.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Крок 2. Зіставлення з DHCP Snooping Binding Table</text>
<rect x="325.0" y="178.0" width="435.0" height="62.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="542.5" y="200.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="542.5" dy="0.0">Таблиця прив'язок комутатора (Lease Database):</tspan><tspan x="542.5" dy="11.7">MAC: AA:AA:.. → IP: 192.168.1.50 | Port: Fa0/1 | VLAN: 10</tspan><tspan x="542.5" dy="11.7">MAC: GG:GG:.. → IP: 192.168.1.1  | Port: Gi0/1 (Trusted) | Static ARP ACL</tspan></text>
<line x1="542.0" y1="255.0" x2="542.0" y2="280.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="315.0" y="285.0" width="215.0" height="115.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
<text x="422.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Невідповідність (Denied)</text>
<rect x="325.0" y="315.0" width="195.0" height="75.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="422.5" y="338.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="422.5" dy="0.0">1. Пакет скидається (DROP)</tspan><tspan x="422.5" dy="11.7">2. Syslog: %SW_DAI-4-DENY</tspan><tspan x="422.5" dy="11.7">3. Лічильник rate-limit +1</tspan><tspan x="422.5" dy="11.7">(Перевищення → errdisable)</tspan></text>
<rect x="555.0" y="285.0" width="215.0" height="115.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/>
<text x="662.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Валідний (Permitted)</text>
<rect x="565.0" y="315.0" width="195.0" height="75.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="662.5" y="338.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="662.5" dy="0.0">1. ARP комутується далі</tspan><tspan x="662.5" dy="11.7">2. MAC-таблиця оновлюється</tspan><tspan x="662.5" dy="11.7">3. Довірені порти (Trunk/Uplink)</tspan><tspan x="662.5" dy="11.7">проходять без перевірок</tspan></text>
<line x1="470.0" y1="275.0" x2="422.0" y2="285.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="610.0" y1="275.0" x2="662.0" y2="285.0" stroke="#27ae60" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="410.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">DAI апаратно фільтрує фальшиві ARP на недовірених портах, використовуючи таблицю легітимних IP-MAC.</text>
</svg>