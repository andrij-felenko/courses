<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Gratuitous ARP: легітимне перемикання vs отруєння</text>
<rect x="30.0" y="60.0" width="365.0" height="335.0" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.5"/>
<text x="212.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Легітимний випадок (VRRP / Failover)</text>
<rect x="72.0" y="108.5" width="280.0" height="43.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="212.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="212.0" dy="0.0">Основний шлюз Master впав!</tspan><tspan x="212.0" dy="13.0">Резервний Backup стає Master</tspan></text>
<rect x="55.0" y="175.0" width="315.0" height="45.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="212.5" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="212.5" dy="0.0">GARP Broadcast (Opcode=2 / Reply):</tspan><tspan x="212.5" dy="11.7">Sender IP: 192.168.1.1 (VIP) | Sender MAC: BB:BB</tspan><tspan x="212.5" dy="11.7">Target IP: 192.168.1.1 | Target MAC: FF:FF</tspan></text>
<line x1="212.0" y1="225.0" x2="212.0" y2="260.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="45.2" y="275.5" width="333.5" height="69.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="212.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="212.0" dy="0.0">Результат для підмережі:</tspan><tspan x="212.0" dy="13.0">1. Комутатор перевчає MAC-таблицю на новий порт</tspan><tspan x="212.0" dy="13.0">2. Хости оновлюють рядок VIP у кеші без перерви зв'язку</tspan><tspan x="212.0" dy="13.0">(Час збіжності &lt; 1 секунди)</tspan></text>
<rect x="425.0" y="60.0" width="365.0" height="335.0" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.5"/>
<text x="607.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Зловмисна експлуатація (Poisoning)</text>
<rect x="467.0" y="108.5" width="280.0" height="43.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="607.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="607.0" dy="0.0">Атакувальник підключається до VLAN</tspan><tspan x="607.0" dy="13.0">і генерує незапитаний GARP</tspan></text>
<rect x="450.0" y="175.0" width="315.0" height="45.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="607.5" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="607.5" dy="0.0">Підроблений GARP (Broadcast / Unicast):</tspan><tspan x="607.5" dy="11.7">Sender IP: 192.168.1.1 (VIP) | Sender MAC: MM:MM</tspan><tspan x="607.5" dy="11.7">Target IP: 192.168.1.1 | Target MAC: FF:FF</tspan></text>
<line x1="607.0" y1="225.0" x2="607.0" y2="260.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="447.0" y="275.5" width="320.0" height="69.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="607.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="607.0" dy="0.0">Вразливість безстановості (Stateless):</tspan><tspan x="607.0" dy="13.0">1. Хости не перевіряють, чи робили вони запит</tspan><tspan x="607.0" dy="13.0">2. Будь-який отриманий GARP перезаписує кеш</tspan><tspan x="607.0" dy="13.0">3. Трафік шлюзу захоплено зловмисником</tspan></text>
<text x="410.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Протокол ARP не розрізняє благородне оновлення IP кластера та вороже перехоплення.</text>
</svg>