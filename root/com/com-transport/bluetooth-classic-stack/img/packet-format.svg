<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 350" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формат пакетів Baseband, заголовок кадру та Payload</text>
<text x="50.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Загальна структура пакета Baseband (BR):</text>
<rect x="50.0" y="75.0" width="180.0" height="48.0" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
<text x="140.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">Access Code</text>
<text x="140.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">72 біти (Синхронізація)</text>
<rect x="235.0" y="75.0" width="230.0" height="48.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="350.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">Packet Header</text>
<text x="350.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">54 біти (18 корисних бітів + FEC 1/3)</text>
<rect x="470.0" y="75.0" width="320.0" height="48.0" rx="4" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="630.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">Payload (Корисне навантаження)</text>
<text x="630.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0 – 2745 бітів (Залежно від типу DH1..5 / DM1..5)</text>
<text x="50.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Поля заголовка Packet Header (18 бітів до кодування FEC 1/3):</text>
<rect x="50.0" y="170.0" width="60.0" height="42.0" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/>
<text x="80.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">LT_ADDR</text>
<text x="80.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">3 б</text>
<rect x="116.0" y="170.0" width="75.0" height="42.0" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2"/>
<text x="153.5" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">TYPE</text>
<text x="153.5" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">4 б</text>
<rect x="197.0" y="170.0" width="50.0" height="42.0" rx="3" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/>
<text x="222.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">FLOW</text>
<text x="222.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1 б</text>
<rect x="253.0" y="170.0" width="50.0" height="42.0" rx="3" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
<text x="278.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ARQN</text>
<text x="278.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1 б</text>
<rect x="309.0" y="170.0" width="50.0" height="42.0" rx="3" fill="#fce7f3" stroke="#ec4899" stroke-width="1.2"/>
<text x="334.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">SEQN</text>
<text x="334.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1 б</text>
<rect x="365.0" y="170.0" width="95.0" height="42.0" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
<text x="412.5" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">HEC (CRC)</text>
<text x="412.5" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">8 б</text>
<text x="476.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="start" font-weight="700">× 3 (Потрійне повторення) = 54 біти</text>
<text x="50.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Структура корисного навантаження ACL (Payload):</text>
<rect x="50.0" y="260.0" width="140.0" height="44.0" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="120.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700">Payload Header</text>
<text x="120.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">1–2 байти (L_CH, Length)</text>
<rect x="196.0" y="260.0" width="460.0" height="44.0" rx="3" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2"/>
<text x="426.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700">Дані вищих рівнів (L2CAP PDU)</text>
<text x="426.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Сегменти L2CAP або кадрів вищих протоколів</text>
<rect x="662.0" y="260.0" width="128.0" height="44.0" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1.2"/>
<text x="726.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">CRC-16</text>
<text x="726.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">2 байти (Для DM/DH)</text>
</svg>