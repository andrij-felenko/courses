<text x="455.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">Корисні дані протоколу вищого рівня (SDU, наприклад 1000 байтів)</text>
<text x="455.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Цілісний блок даних до сегментації</text>
