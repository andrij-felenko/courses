<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сегментація та збирання (SAR) і маршрутизація каналів (CID) у L2CAP</text>
<text x="50.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. L2CAP SDU від протоколу вищого рівня (наприклад, RFCOMM / SDP):</text>
