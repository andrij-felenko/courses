<text x="420.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приймач збирає фрагменти за індикатором PB (Packet Boundary) та передає повний SDU на відповідний канал CID</text>
<text x="420.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">CID 0x0001 = SDP · CID 0x0002 = Signaling · CID 0x0040+ = Динамічні канали застосунків (RFCOMM, AVDTP)</text>
