<line x1="450.0" y1="120.0" x2="420.0" y2="155.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="680.0" y1="120.0" x2="700.0" y2="155.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="420.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0369a1" text-anchor="middle" font-weight="700">Сегментація SAR на рівні L2CAP під MTU Baseband</text>
<text x="50.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Фрагментовані ACL Data пакети (передаються через HCI до контролера):</text>
