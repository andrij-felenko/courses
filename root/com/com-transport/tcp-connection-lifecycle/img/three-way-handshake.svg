<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 824.54 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="824.54" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Трикрокове рукостискання TCP з узгодженням опцій</text>
<line x1="160.0" y1="70.0" x2="160.0" y2="390.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4 4"/>
<rect x="77.0" y="24.3" width="166.0" height="41.3" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="160.0" y="41.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">КЛІЄНТ (Active)</tspan><tspan x="160.0" dy="14.3">SYN_SENT → ESTABLISHED</tspan></text>
<line x1="600.0" y1="70.0" x2="600.0" y2="390.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4 4"/>
<rect x="486.3" y="24.3" width="227.4" height="41.3" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="600.0" y="41.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">СЕРВЕР (Passive)</tspan><tspan x="600.0" dy="14.3">LISTEN → SYN_RCVD → ESTABLISHED</tspan></text>
<line x1="160.0" y1="120.0" x2="600.0" y2="155.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="243.8" y="111.9" width="272.4" height="36.1" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="380.0" y="119.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">1. SYN [SEQ = ISN_c = 1000]</tspan><tspan x="380.0" dy="13.7">Опції: MSS=1460, WS=7, SACK=1, TSval=100</tspan></text>
<text x="145.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-weight="700">SYN_SENT</text>
<text x="615.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="start" font-weight="700">SYN_RCVD
(виділено TCB)</text>
<line x1="600.0" y1="205.0" x2="160.0" y2="240.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="208.0" y="196.9" width="344.0" height="36.1" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.4"/><text x="380.0" y="204.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">2. SYN + ACK [SEQ = ISN_s = 5000, ACK = 1001]</tspan><tspan x="380.0" dy="13.7">Опції: MSS=1460, WS=7, SACK=1, TSval=200, TSecr=100</tspan></text>
<line x1="160.0" y1="290.0" x2="600.0" y2="325.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="237.3" y="281.9" width="285.4" height="36.1" rx="6" fill="#fdfefe" stroke="#1a1a1a" stroke-width="1.4"/><text x="380.0" y="289.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">3. ACK [SEQ = 1001, ACK = 5001]</tspan><tspan x="380.0" dy="13.7">(може нести перші корисні дані застосунку)</tspan></text>
<text x="145.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="end" font-weight="700">ESTABLISHED</text>
<text x="615.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">ESTABLISHED
(перенесено в accept_queue)</text>
<line x1="160.0" y1="370.0" x2="600.0" y2="370.0" stroke="#27ae60" stroke-width="2.5"/>
<text x="380.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Двосторонній потік даних: full-duplex потік байтів</text>
</svg>