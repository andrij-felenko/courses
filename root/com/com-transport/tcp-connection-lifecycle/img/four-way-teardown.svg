<rect x="288.8" y="103.5" width="182.5" height="23.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/><text x="380.0" y="118.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">1. FIN [SEQ = u, ACK = v]</tspan></text>
<text x="145.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">FIN_WAIT_1</text>
<text x="615.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start" font-weight="700">CLOSE_WAIT
(ядро шле ACK, read()=0)</text>
<line x1="600.0" y1="175.0" x2="160.0" y2="205.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
