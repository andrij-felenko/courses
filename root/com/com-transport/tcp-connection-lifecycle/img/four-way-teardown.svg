<line x1="600.0" y1="65.0" x2="600.0" y2="420.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4 4"/>
<rect x="510.2" y="31.5" width="179.7" height="27.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/><text x="600.0" y="48.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">ПАСИВНА СТОРОНА (Server)</tspan></text>
<text x="145.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="end">shutdown(SHUT_WR)
або close()</text>
