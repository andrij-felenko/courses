<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20.52 -10 815.62 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-20.52" y="-10" width="815.62" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотирикрокове закриття з'єднання та напівзакритий стан</text>
<line x1="160.0" y1="65.0" x2="160.0" y2="420.0" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4 4"/>
