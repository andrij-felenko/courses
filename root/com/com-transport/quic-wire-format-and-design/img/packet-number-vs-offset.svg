<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усунення неоднозначності повторів у QUIC завдяки розділенню Packet Number та Offset</text>
<rect x="40.0" y="20.0" width="740.0" height="34.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="41.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Розділення номера пакета (Packet Number) та зсуву потоку (Stream Offset)</tspan></text>
<rect x="50.0" y="68.0" width="330.0" height="32.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="87.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="215.0" dy="0.0">TCP: Неоднозначність повторів (Retransmission Ambiguity)</tspan></text>
<rect x="60.0" y="110.0" width="310.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="128.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Спроба 1: Сегмент Seq = 1000, Len = 500</tspan><tspan x="215.0" dy="12.3">[Надіслано о t = 0 мс] -&gt; Втрачено</tspan></text>
<rect x="60.0" y="160.0" width="310.0" height="42.0" rx="6" fill="#fff8e6" stroke="#d48800" stroke-width="1.5"/><text x="215.0" y="178.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Спроба 2: Сегмент Seq = 1000, Len = 500</tspan><tspan x="215.0" dy="12.3">[Повтор о t = 200 мс після таймауту]</tspan></text>
<rect x="60.0" y="210.0" width="310.0" height="52.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="215.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="215.0" dy="0.0">Приймач шле ACK = 1500 о t = 250 мс.</tspan><tspan x="215.0" dy="12.3">Питання: Це підтвердження спроби 1 (RTT = 250 мс)</tspan><tspan x="215.0" dy="12.3">чи спроби 2 (RTT = 50 мс)? TCP не знає без опцій!</tspan></text>
<rect x="440.0" y="68.0" width="330.0" height="32.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="605.0" y="87.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="605.0" dy="0.0">QUIC: Суворе монотонне зростання номера пакета</tspan></text>
<rect x="450.0" y="110.0" width="310.0" height="42.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="605.0" y="128.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Спроба 1: Пакет PN = 42</tspan><tspan x="605.0" dy="12.3">[Кадр STREAM: Offset = 1000, Len = 500] -&gt; Втрачено</tspan></text>
<rect x="450.0" y="160.0" width="310.0" height="42.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="605.0" y="178.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="605.0" dy="0.0">Спроба 2: Пакет PN = 43 (НОВИЙ номер!)</tspan><tspan x="605.0" dy="12.3">[Кадр STREAM: Offset = 1000, Len = 500]</tspan></text>
<rect x="450.0" y="210.0" width="310.0" height="52.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="605.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="605.0" dy="0.0">Приймач шле кадр ACK: Largest Acknowledged = 43.</tspan><tspan x="605.0" dy="12.3">Передавач точно знає: підтверджено пакет 43!</tspan><tspan x="605.0" dy="12.3">Розрахунок RTT є кристально точним і однозначним.</tspan></text>
<rect x="50.0" y="285.0" width="720.0" height="60.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Ключовий принцип QUIC:</tspan><tspan x="410.0" dy="13.7">• Номер пакета (Packet Number) належить виключно транспортному пакету й НІКОЛИ не повторюється.</tspan><tspan x="410.0" dy="13.7">• Зсув потоку (Stream Offset) належить прикладним даним і вказує точне місце байтів у файлі.</tspan></text>
<rect x="50.0" y="360.0" width="720.0" height="45.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="410.0" y="379.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Вигода для контролю перевантаження: точна оцінка RTT дозволяє алгоритмам BBR та CUBIC</tspan><tspan x="410.0" dy="13.7">миттєво реагувати на стан черг у маршрутизаторах без хибних таймаутів.</tspan></text>
</svg>