<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26.87 -10 873.74 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-26.87" y="-10" width="873.74" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Формати двійкових заголовків QUIC Long Header та Short Header із механізмом Header Protection</text>
<rect x="40.0" y="15.0" width="740.0" height="32.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="42.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">Двійкова структура пакетів QUIC: Long Header проти Short Header (1-RTT)</tspan></text>
<text x="50.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Long Header (Використовується під час встановлення з'єднання: Initial, Handshake, 0-RTT, Retry)</text>
<rect x="50.0" y="80.0" width="80.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="90.0" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="90.0" dy="0.0">Прапорці</tspan><tspan x="90.0" dy="11.7">Header Form=1</tspan><tspan x="90.0" dy="11.7">Type (2 біти)</tspan></text>
<rect x="135.0" y="80.0" width="90.0" height="46.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="180.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Версія</tspan><tspan x="180.0" dy="12.3">QUIC v1 (4B)</tspan><tspan x="180.0" dy="12.3">0x00000001</tspan></text>
<rect x="230.0" y="80.0" width="120.0" height="46.0" rx="6" fill="#fff8e6" stroke="#d48800" stroke-width="1.5"/><text x="290.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Dest Conn ID</tspan><tspan x="290.0" dy="12.3">(0..20 байтів)</tspan><tspan x="290.0" dy="12.3">DCIL + DCID</tspan></text>
<rect x="355.0" y="80.0" width="120.0" height="46.0" rx="6" fill="#fff8e6" stroke="#d48800" stroke-width="1.5"/><text x="415.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="415.0" dy="0.0">Src Conn ID</tspan><tspan x="415.0" dy="12.3">(0..20 байтів)</tspan><tspan x="415.0" dy="12.3">SCIL + SCID</tspan></text>
<rect x="480.0" y="80.0" width="85.0" height="46.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="522.5" y="94.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="522.5" dy="0.0">Token</tspan><tspan x="522.5" dy="11.7">(Varint len</tspan><tspan x="522.5" dy="11.7">+ Token data)</tspan></text>
<rect x="570.0" y="80.0" width="90.0" height="46.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="615.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="615.0" dy="0.0">Довжина +</tspan><tspan x="615.0" dy="12.3">Номер пакета</tspan><tspan x="615.0" dy="12.3">(1..4 байти)</tspan></text>
<rect x="665.0" y="80.0" width="115.0" height="46.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="722.5" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="722.5" dy="0.0">Захищений</tspan><tspan x="722.5" dy="12.3">Payload</tspan><tspan x="722.5" dy="12.3">(Кадри + AEAD)</tspan></text>
<text x="50.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Short Header 1-RTT (Мінімальний оверхед для передачі прикладних даних)</text>
<rect x="50.0" y="170.0" width="160.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="130.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="130.0" dy="0.0">Прапорці (1 байт):</tspan><tspan x="130.0" dy="12.3">Form=0, Spin, KeyPhase,</tspan><tspan x="130.0" dy="12.3">Packet Number Length</tspan></text>
<rect x="215.0" y="170.0" width="190.0" height="48.0" rx="6" fill="#fff8e6" stroke="#d48800" stroke-width="1.5"/><text x="310.0" y="191.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="310.0" dy="0.0">Destination Connection ID</tspan><tspan x="310.0" dy="11.7">(Узгоджена довжина, 0..20 байтів)</tspan></text>
<rect x="410.0" y="170.0" width="140.0" height="48.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="480.0" y="185.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Packet Number</tspan><tspan x="480.0" dy="11.7">(1..4 байти, масковано</tspan><tspan x="480.0" dy="11.7">через Header Protection)</tspan></text>
<rect x="555.0" y="170.0" width="225.0" height="48.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="667.5" y="191.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="667.5" dy="0.0">Зашифроване корисне навантаження (Payload)</tspan><tspan x="667.5" dy="11.7">Кадри STREAM, ACK, MAX_DATA + Тег AEAD (16B)</tspan></text>
<text x="50.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Механізм захисту заголовків (Header Protection) проти відстеження проміжними вузлами:</text>
<rect x="50.0" y="260.0" width="220.0" height="60.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="160.0" y="280.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Вибірка з Payload (16B):</tspan><tspan x="160.0" dy="13.0">Беруться перші 16 байтів</tspan><tspan x="160.0" dy="13.0">зашифрованого навантаження</tspan></text>
<line x1="275.0" y1="290.0" x2="315.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="320.0" y="260.0" width="210.0" height="60.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="425.0" y="280.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="425.0" dy="0.0">Криптографічна маска:</tspan><tspan x="425.0" dy="13.0">AES-ECB / ChaCha20</tspan><tspan x="425.0" dy="13.0">із ключем hp_key</tspan></text>
<line x1="535.0" y1="290.0" x2="575.0" y2="290.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="580.0" y="260.0" width="200.0" height="60.0" rx="6" fill="#fff8e6" stroke="#d48800" stroke-width="1.5"/><text x="680.0" y="280.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Операція XOR:</tspan><tspan x="680.0" dy="13.0">Маскування 4 бітів прапорців</tspan><tspan x="680.0" dy="13.0">та 1..4 байтів Packet Number</tspan></text>
<rect x="40.0" y="345.0" width="740.0" height="65.0" rx="6" fill="#eef2f7" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="367.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Результат захисту: Проміжні маршрутизатори та інспекційні пристрої (Middleboxes) бачать лише UDP-заголовок</tspan><tspan x="410.0" dy="13.7">та фіксований Connection ID. Номери пакетів, ознака фази ключів, біти кадрування та вміст повністю приховані,</tspan><tspan x="410.0" dy="13.7">що унеможливлює маніпуляції з трафіком на магістралях інтернету.</tspan></text>
</svg>