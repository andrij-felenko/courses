<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Часова діаграма рукостискання QUIC: порівняння 1-RTT та 0-RTT Resumption</text>
<text x="210.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Звичайне підключення (1-RTT Handshake)</text>
<text x="630.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повторне підключення (0-RTT Resumption)</text>
<text x="60.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Клієнт</text>
<text x="360.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сервер</text>
<line x1="60.0" y1="65.0" x2="60.0" y2="350.0" stroke="#333333" stroke-width="1.5"/>
<line x1="360.0" y1="65.0" x2="360.0" y2="350.0" stroke="#333333" stroke-width="1.5"/>
<line x1="60.0" y1="90.0" x2="360.0" y2="130.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="210.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">QUIC Initial [ClientHello + Transport Params]</text>
<line x1="360.0" y1="150.0" x2="60.0" y2="190.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="210.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Handshake [ServerHello, EE, Cert, Finished]</text>
<line x1="60.0" y1="210.0" x2="360.0" y2="250.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="210.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Handshake Finished + 1-RTT HTTP/3 Data</text>
<line x1="360.0" y1="270.0" x2="60.0" y2="310.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="210.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">1-RTT HTTP/3 Відповідь сервера</text>
<rect x="50.0" y="370.0" width="320.0" height="65.0" rx="6" fill="#fff8e6" stroke="#d48800" stroke-width="1.5"/><text x="210.0" y="392.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Час до першої відповіді: 1 RTT</tspan><tspan x="210.0" dy="13.7">(У TCP+TLS 1.2 було 3 RTT,</tspan><tspan x="210.0" dy="13.7">у TCP+TLS 1.3 було 2 RTT)</tspan></text>
<line x1="420.0" y1="20.0" x2="420.0" y2="445.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="480.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Клієнт</text>
<text x="780.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сервер</text>
<line x1="480.0" y1="65.0" x2="480.0" y2="350.0" stroke="#333333" stroke-width="1.5"/>
<line x1="780.0" y1="65.0" x2="780.0" y2="350.0" stroke="#333333" stroke-width="1.5"/>
<line x1="480.0" y1="90.0" x2="780.0" y2="130.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="630.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Initial [ClientHello, PSK] + 0-RTT Early Data (GET /)</text>
<line x1="780.0" y1="150.0" x2="480.0" y2="190.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="630.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Handshake [ServerHello, Finished] + HTTP/3 200 OK</text>
<line x1="480.0" y1="210.0" x2="780.0" y2="250.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="630.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Handshake Finished + наступні 1-RTT запити</text>
<rect x="470.0" y="370.0" width="320.0" height="65.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="392.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Час початку надсилання даних: 0 RTT!</tspan><tspan x="630.0" dy="13.7">Клієнт надсилає прикладний HTTP-запит</tspan><tspan x="630.0" dy="13.7">у найпершому UDP-пакеті разом із PSK.</tspan></text>
</svg>