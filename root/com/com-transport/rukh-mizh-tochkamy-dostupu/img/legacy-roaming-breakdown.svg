<text x="450.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Open System Auth</tspan><tspan x="450.0" dy="13.1">Req / Resp</tspan><tspan x="450.0" dy="13.1">5–15 мс</tspan></text>
