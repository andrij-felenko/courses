<text x="560.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Reassoc Req / Resp</tspan><tspan x="560.0" dy="13.1">Перереєстрація на AP2</tspan><tspan x="560.0" dy="13.1">10–25 мс</tspan></text>
