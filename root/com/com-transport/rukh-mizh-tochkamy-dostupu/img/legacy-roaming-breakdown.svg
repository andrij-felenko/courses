<text x="695.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">WPA2/WPA3 генерація PTK</tspan><tspan x="695.0" dy="13.1">(EAPOL 1/4..4/4)</tspan><tspan x="695.0" dy="13.1">40–120 мс</tspan></text>
