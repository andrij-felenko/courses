<text x="467.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Втрата пакетів голосового зв'язку (VoIP), зупинка відеотрансляцій, затримка TCP ACK</text>
