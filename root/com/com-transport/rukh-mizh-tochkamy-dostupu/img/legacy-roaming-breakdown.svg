<text x="105.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="105.0" dy="0.0">Сигнал &lt; -75 dBm</tspan><tspan x="105.0" dy="13.1">Втрата beacon-кадрів</tspan></text>
