<text x="280.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2. Повне сканування</text>
<text x="280.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Active/Passive скан 36 каналів</tspan><tspan x="280.0" dy="13.1">Ефір зайнятий зондуванням</tspan><tspan x="280.0" dy="13.1">Блекаут: 150–400 мс</tspan></text>
