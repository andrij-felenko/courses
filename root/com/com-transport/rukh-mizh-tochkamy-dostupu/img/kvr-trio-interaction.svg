<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тріада оптимізації безшовного роумінгу: 802.11k / 802.11v / 802.11r</text>
<rect x="40.0" y="55.0" width="230.0" height="235.0" rx="8" fill="#eef3ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="155.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">802.11k (RRM)</text>
<text x="155.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Радіовимірювання</text>
<line x1="55.0" y1="105.0" x2="255.0" y2="105.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="60.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="60.0" dy="0.0">ЗАПИТАННЯ: КУДИ ПЕРЕХОДИТИ?</tspan><tspan x="60.0" dy="13.7"></tspan><tspan x="60.0" dy="13.7">• AP надсилає Neighbor Report</tspan><tspan x="60.0" dy="13.7">• Список BSSID та їхніх каналів</tspan><tspan x="60.0" dy="13.7">• Станція сканує 2–3 канали</tspan><tspan x="60.0" dy="13.7">замість усіх 36</tspan><tspan x="60.0" dy="13.7">• Час сканування: &lt; 25 мс</tspan></text>
<rect x="295.0" y="55.0" width="230.0" height="235.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="410.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">802.11v (BTM)</text>
<text x="410.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Керування BSS-переходом</text>
<line x1="310.0" y1="105.0" x2="510.0" y2="105.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="315.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="315.0" dy="0.0">ЗАПИТАННЯ: КОЛИ ТА ЧОМУ?</tspan><tspan x="315.0" dy="13.7"></tspan><tspan x="315.0" dy="13.7">• AP надсилає BSS Transition Req</tspan><tspan x="315.0" dy="13.7">• Балансування клієнтів між AP</tspan><tspan x="315.0" dy="13.7">• Переведення на 5/6 ГГц смуги</tspan><tspan x="315.0" dy="13.7">• Попередження про вимкнення AP</tspan><tspan x="315.0" dy="13.7">• Усунення «липких» клієнтів</tspan></text>
<rect x="550.0" y="55.0" width="230.0" height="235.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="665.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">802.11r (FT)</text>
<text x="665.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Швидкий перехід (Fast BSS)</text>
<line x1="565.0" y1="105.0" x2="765.0" y2="105.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="570.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="570.0" dy="0.0">ЗАПИТАННЯ: ЯК БЕЗ ЗАТРИМКИ?</tspan><tspan x="570.0" dy="13.7"></tspan><tspan x="570.0" dy="13.7">• Дворівнева ієрархія ключів</tspan><tspan x="570.0" dy="13.7">• PMK-R0 (домен) → PMK-R1 (AP)</tspan><tspan x="570.0" dy="13.7">• Без повного 4-Way Handshake</tspan><tspan x="570.0" dy="13.7">• Over-the-Air або Over-the-DS</tspan><tspan x="570.0" dy="13.7">• Затримка хендоверу: &lt; 30 мс</tspan></text>
<rect x="40.0" y="305.0" width="740.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="410.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спільний ефект: 11k знаходить кандидата + 11v вчасно надсилає команду + 11r перемикає ключ</text>
<text x="410.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Сумарна затримка падає з 400 мс до &lt; 30 мс — непомітно для людського слуху в реальному часі</text>
</svg>