<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія ключів 802.11r (FT Key Hierarchy)</text>
<rect x="230.0" y="55.0" width="340.0" height="55.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="400.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">MSK (Master Session Key) / PMK</text>
<text x="400.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Отримується при первинному вході (WPA2/WPA3-Enterprise або PSK)</text>
<line x1="400.0" y1="110.0" x2="400.0" y2="135.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="200.0" y="135.0" width="400.0" height="60.0" rx="6" fill="#fff7e6" stroke="#c0392b" stroke-width="1.6"/>
<text x="400.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">PMK-R0 (First-level Key)</text>
<text x="400.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">PMK-R0 = KDF(PMK, SSID, MDID, R0KH-ID, STA-MAC)</text>
<text x="400.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Зберігається на ключовому контролері R0KH у домені мобільності MDID</text>
<line x1="400.0" y1="195.0" x2="400.0" y2="215.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="210.0" y1="215.0" x2="590.0" y2="215.0" stroke="#c0392b" stroke-width="1.5"/>
<line x1="210.0" y1="215.0" x2="210.0" y2="240.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="590.0" y1="215.0" x2="590.0" y2="240.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60.0" y="240.0" width="300.0" height="65.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/>
<text x="210.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">PMK-R1 (для Точки Доступу 1)</text>
<text x="210.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">PMK-R1 = KDF(PMK-R0, R1KH-ID_AP1, STA-MAC)</text>
<text x="210.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">R1KH-ID = BSSID_AP1 (зберігається локально на AP1)</text>
<rect x="440.0" y="240.0" width="300.0" height="65.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/>
<text x="590.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">PMK-R1 (для Точки Доступу 2)</text>
<text x="590.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">PMK-R1 = KDF(PMK-R0, R1KH-ID_AP2, STA-MAC)</text>
<text x="590.0" y="293.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">R1KH-ID = BSSID_AP2 (зберігається локально на AP2)</text>
<line x1="210.0" y1="305.0" x2="210.0" y2="330.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="590.0" y1="305.0" x2="590.0" y2="330.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="75.0" y="330.0" width="270.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="210.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">PTK (Сесійний ключ AP1 ↔ STA)</text>
<text x="210.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">KDF(PMK-R1, SNonce, ANonce, MACs)</text>
<rect x="455.0" y="330.0" width="270.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.3"/>
<text x="590.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">PTK (Сесійний ключ AP2 ↔ STA)</text>
<text x="590.0" y="367.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Миттєвий розрахунок під час 2 кадрів FT Reassoc!</text>
<text x="400.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Клієнт і нова AP самостійно обчислюють однаковий PTK без виклику RADIUS-сервера</text>
</svg>