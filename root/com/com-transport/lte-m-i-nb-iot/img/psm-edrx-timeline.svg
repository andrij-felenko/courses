<text x="515.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Модем зберігає реєстрацію в MME/HSS без потреби повторного Attach при пробудженні</text>
<rect x="40.0" y="375.0" width="800.0" height="48.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="440.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">PSM мінімізує струм до мікроампер під час простою, а eDRX скорочує витрати під час очікування вхідних даних.</tspan><tspan x="440.0" dy="11.9">Пристрій сам ініціює вихід із PSM у будь-який момент за апаратним перериванням від датчика.</tspan></text>
