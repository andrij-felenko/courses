<text x="647.5" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="700">Висока швидкість: прямий тракт даних без навантаження на MME</text>
<rect x="40.0" y="400.0" width="800.0" height="48.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="440.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Control Plane (DoNAS) ідеальний для поодиноких телеметричних звітів (≤ 100 байтів у NB-IoT),</tspan><tspan x="440.0" dy="11.9">тоді як User Plane оптимізація переважає при передачі пачок даних, оновленні прошивки (FOTA) та в LTE-M.</tspan></text>
