<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="25.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Спектральне розміщення каналів NB-IoT та смуги LTE-M</text>
<rect x="20.0" y="55.0" width="840.0" height="195.0" rx="8" fill="#f8fafc" stroke="#6b7280" stroke-width="1.0"/>
<text x="40.0" y="77.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Три режими розгортання NB-IoT (смуга 180 кГц = 1 PRB LTE):</text>
<rect x="40.0" y="95.0" width="240.0" height="135.0" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
<text x="160.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0891b2" text-anchor="middle" font-weight="700">1. Автономний (Standalone)</text>
<rect x="60.0" y="135.0" width="200.0" height="40.0" rx="4" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
<text x="160.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">GSM 200 кГц (Refarming)</text>
<rect x="75.0" y="140.0" width="170.0" height="30.0" rx="3" fill="#0891b2" stroke="#0e7490" stroke-width="1.0"/>
<text x="160.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">NB-IoT 180 кГц</text>
<text x="160.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="160.0" dy="0.0">Окремий канал 200 кГц</tspan><tspan x="160.0" dy="11.4">поза спектром LTE (2G/3G)</tspan></text>
<rect x="320.0" y="95.0" width="240.0" height="135.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="440.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">2. Захисна смуга (Guard-Band)</text>
<rect x="335.0" y="135.0" width="80.0" height="40.0" rx="3" fill="#e2e8f0" stroke="#6b7280" stroke-width="1.0"/>
<text x="375.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">LTE несуча</text>
<rect x="420.0" y="137.0" width="60.0" height="36.0" rx="3" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.0"/>
<text x="450.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">180 кГц</text>
<rect x="485.0" y="135.0" width="60.0" height="40.0" rx="3" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.0"/>
<text x="515.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Захист</text>
<text x="440.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="440.0" dy="0.0">У невикористаній захисній</tspan><tspan x="440.0" dy="11.4">смузі LTE-носія (≥10 МГц)</tspan></text>
<rect x="600.0" y="95.0" width="240.0" height="135.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="720.0" y="117.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">3. Усередині смуги (In-Band)</text>
<rect x="615.0" y="135.0" width="210.0" height="40.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="1.0"/>
<rect x="685.0" y="137.0" width="70.0" height="36.0" rx="3" fill="#16a34a" stroke="#15803d" stroke-width="1.0"/>
<text x="720.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="700">1 PRB IoT</text>
<text x="650.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">PRB LTE</text>
<text x="790.0" y="159.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">PRB LTE</text>
<text x="720.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle"><tspan x="720.0" dy="0.0">Виділення 1 PRB (180 кГц)</tspan><tspan x="720.0" dy="11.4">із проколюванням CRS LTE</tspan></text>
<rect x="20.0" y="265.0" width="840.0" height="195.0" rx="8" fill="#fdf4ff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="40.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="700">Смуга LTE-M (eMTC / Cat-M1) — 1.4 МГц (6 PRB) у широкосмуговому LTE-каналі:</text>
<rect x="40.0" y="313.0" width="800.0" height="65.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
<text x="140.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Широкосмуговий канал LTE (5 / 10 / 20 МГц — до 100 PRB)</text>
<rect x="80.0" y="343.0" width="120.0" height="30.0" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
<text x="140.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Вузькосмуга #1 (6 PRB)</text>
<rect x="240.0" y="343.0" width="120.0" height="30.0" rx="4" fill="#ddd6fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="300.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle" font-weight="700">Вузькосмуга #2 (6 PRB)</text>
<rect x="480.0" y="343.0" width="120.0" height="30.0" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
<text x="540.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Вузькосмуга #3 (6 PRB)</text>
<rect x="680.0" y="343.0" width="120.0" height="30.0" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.0"/>
<text x="740.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Вузькосмуга #4 (6 PRB)</text>
<line x1="200.0" y1="358.0" x2="235.0" y2="358.0" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="365.0" y1="358.0" x2="475.0" y2="358.0" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="605.0" y1="358.0" x2="675.0" y2="358.0" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="440.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">LTE-M оперує вузькою смугою 1.4 МГц (6 ресурсних блоків PRB = 1.08 МГц даних + захисні інтервали),</tspan><tspan x="440.0" dy="13.0">виконуючи динамічний стрибок частоти (Frequency Hopping) між різними ділянками широкого спектра LTE.</tspan></text>
</svg>