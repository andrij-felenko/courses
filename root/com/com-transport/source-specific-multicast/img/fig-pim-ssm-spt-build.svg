<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Побудова дерева найкоротшого шляху (SPT) за протоколом PIM-SSM</text>
<rect x="40.0" y="155.0" width="120.0" height="75.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="100.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Джерело S</text>
<text x="100.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">198.51.100.1</text>
<text x="100.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Відеопотік / Фінанси</text>
<circle cx="240.0" cy="192.0" r="26.0" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="240.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">FHR</text>
<text x="240.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">First-Hop Router</text>
<circle cx="420.0" cy="192.0" r="26.0" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="420.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">R_Core</text>
<text x="420.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Транзитний роутер</text>
<circle cx="600.0" cy="192.0" r="26.0" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
<text x="600.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">LHR</text>
<text x="600.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Last-Hop Router</text>
<rect x="700.0" y="155.0" width="110.0" height="75.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
<text x="755.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Отримувач</text>
<text x="755.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">192.0.2.50</text>
<text x="755.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Клієнтський хост</text>
<line x1="700.0" y1="172.0" x2="628.0" y2="172.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="664.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">1. IGMPv3 INCLUDE (S, G)</text>
<line x1="574.0" y1="178.0" x2="448.0" y2="178.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="511.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">2. PIM Join (S, G)</text>
<line x1="394.0" y1="178.0" x2="268.0" y2="178.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="331.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">3. PIM Join (S, G)</text>
<line x1="162.0" y1="205.0" x2="212.0" y2="205.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="268.0" y1="205.0" x2="392.0" y2="205.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="448.0" y1="205.0" x2="572.0" y2="205.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="628.0" y1="205.0" x2="698.0" y2="205.0" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="420.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">▼ 4. Прямий датаграмний потік (S, G) вниз по дереву SPT ▼</text>
<rect x="40.0" y="275.0" width="760.0" height="98.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="420.0" y="301.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Алгоритм сигналізації PIM-SSM:</tspan><tspan x="420.0" dy="13.0">1. Отримувач надсилає IGMPv3 Membership Report із записом MODE_IS_INCLUDE (S, G).</tspan><tspan x="420.0" dy="13.0">2. Останній маршрутизатор (LHR) виконує RPF-перевірку до IP-адреси S і надсилає PIM Join (S, G) сусіду.</tspan><tspan x="420.0" dy="13.0">3. Повідомлення Join поширюється вгору до першого маршрутизатора (FHR), формуючи стан (S, G) в таблицях mroute.</tspan><tspan x="420.0" dy="13.0">4. Трафік тече виключно найкоротшим шляхом від S до отримувача без затримок і без участі Rendezvous Point.</tspan></text>
<rect x="40.0" y="385.0" width="760.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="420.0" y="400.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">PIM-SSM скорочує затримку встановлення з'єднання до часу одного проходження сигналу (RTT),</tspan><tspan x="420.0" dy="13.7">виключаючи складну фазу реєстрації в RP та усуваючи єдину точку відмови в топології мережі.</tspan></text>
</svg>