<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат фільтрації джерел на вузлі та агрегація на інтерфейсі</text>
<rect x="30.0" y="50.0" width="235.0" height="330.0" rx="8" fill="#f8fafc" stroke="#2457d6" stroke-width="1.5"/>
<text x="147.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Рівень сокетів додатків</text>
<text x="147.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Кожен процес обирає свій фільтр</text>
<rect x="45.0" y="108.0" width="205.0" height="56.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/>
<text x="147.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Сокет A (IPTV Плеєр)</text>
<text x="147.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Фільтр: INCLUDE {S1, S2}</text>
<text x="147.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Приймати лише S1 та S2</text>
<rect x="45.0" y="172.0" width="205.0" height="56.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/>
<text x="147.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Сокет B (Аналізатор)</text>
<text x="147.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Фільтр: INCLUDE {S2, S3}</text>
<text x="147.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Приймати лише S2 та S3</text>
<rect x="45.0" y="236.0" width="205.0" height="56.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/>
<text x="147.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Сокет C (ASM спадщина)</text>
<text x="147.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Фільтр: EXCLUDE {S4}</text>
<text x="147.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Приймати всіх, крім S4</text>
<rect x="45.0" y="302.0" width="205.0" height="68.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="147.5" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="147.5" dy="0.0">Ядро ОС об'єднує сокети:</tspan><tspan x="147.5" dy="12.3">якщо хоча б один сокет EXCLUDE,</tspan><tspan x="147.5" dy="12.3">весь інтерфейс переходить в EX.</tspan></text>
<rect x="290.0" y="50.0" width="260.0" height="330.0" rx="8" fill="#fdfbf7" stroke="#333333" stroke-width="1.5"/>
<text x="420.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Агрегація в ядрі ОС</text>
<text x="420.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Правила об'єднання станів</text>
<rect x="305.0" y="108.0" width="230.0" height="80.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="420.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">1. Лише INCLUDE сокети:</tspan><tspan x="420.0" dy="13.0">Режим інтерфейсу = INCLUDE</tspan><tspan x="420.0" dy="13.0">Список джерел = S_A ∪ S_B</tspan><tspan x="420.0" dy="13.0">{S1, S2} ∪ {S2, S3} = {S1, S2, S3}</tspan></text>
<rect x="305.0" y="196.0" width="230.0" height="80.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="420.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">2. Наявний EXCLUDE сокет:</tspan><tspan x="420.0" dy="13.0">Режим інтерфейсу = EXCLUDE</tspan><tspan x="420.0" dy="13.0">Список виключень = S_EX ∖ S_IN</tspan><tspan x="420.0" dy="13.0">Інтерфейс приймає всіх, крім S4</tspan></text>
<rect x="305.0" y="284.0" width="230.0" height="86.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="420.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Генерація повідомлень IGMPv3:</tspan><tspan x="420.0" dy="12.3">Зміна списку → ALLOW / BLOCK</tspan><tspan x="420.0" dy="12.3">Зміна режиму → TO_IN / TO_EX</tspan></text>
<rect x="575.0" y="50.0" width="235.0" height="330.0" rx="8" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/>
<text x="692.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Стан порту маршрутизатора</text>
<text x="692.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Таймери джерел (Source Timers)</text>
<rect x="590.0" y="108.0" width="205.0" height="62.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.3"/>
<text x="692.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Група G: Режим INCLUDE</text>
<text x="692.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Джерело S1: Timer = 260s</text>
<text x="692.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Джерело S2: Timer = 260s</text>
<rect x="590.0" y="178.0" width="205.0" height="62.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.3"/>
<text x="692.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Група G: Режим EXCLUDE</text>
<text x="692.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Group Timer = 260s</text>
<text x="692.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">• Блоковано S4 (Timer = 260s)</text>
<rect x="590.0" y="248.0" width="205.0" height="122.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="692.5" y="288.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="692.5" dy="0.0">Маршрутизатор скидає таймери:</tspan><tspan x="692.5" dy="11.7">при отриманні чергового звіту</tspan><tspan x="692.5" dy="11.7">Membership Report.</tspan><tspan x="692.5" dy="11.7">Якщо таймер джерела спливає,</tspan><tspan x="692.5" dy="11.7">потік (S, G) обрізається через PIM.</tspan></text>
<line x1="267.0" y1="136.0" x2="288.0" y2="136.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="267.0" y1="236.0" x2="288.0" y2="236.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="552.0" y1="136.0" x2="573.0" y2="136.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="552.0" y1="236.0" x2="573.0" y2="236.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="30.0" y="387.0" width="780.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="420.0" y="404.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Агрегація станів дозволяє ядру ОС і маршрутизатору точно відстежувати потреби багатьох процесів:</tspan><tspan x="420.0" dy="13.7">у мережу передається лише математично необхідний мінімум запитів без надлишкової дуплікації трафіку.</tspan></text>
</svg>