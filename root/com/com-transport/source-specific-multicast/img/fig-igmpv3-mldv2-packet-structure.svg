<rect x="40.0" y="360.0" width="760.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="420.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Типи записів (Record Type):</tspan><tspan x="420.0" dy="13.0">• 1 = MODE_IS_INCLUDE (поточний стан INCLUDE)  |  2 = MODE_IS_EXCLUDE (поточний стан EXCLUDE)</tspan><tspan x="420.0" dy="13.0">• 3 = CHANGE_TO_INCLUDE_MODE (зміна на IN)     |  4 = CHANGE_TO_EXCLUDE_MODE (зміна на EX)</tspan><tspan x="420.0" dy="13.0">• 5 = ALLOW_NEW_SOURCES (додати нові джерела)  |  6 = BLOCK_OLD_SOURCES (вилучити джерела)</tspan></text>
