<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння моделей групової розсилки: класичний ASM проти SSM</text>
<rect x="25.0" y="50.0" width="385.0" height="330.0" rx="8" fill="#fdf8f8" stroke="#c0392b" stroke-width="1.5"/>
<text x="217.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Any-Source Multicast (ASM, модель (*, G))</text>
<text x="217.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Джерело невідоме заздалегідь · Потрібна точка рандеву (RP)</text>
<circle cx="70.0" cy="145.0" r="20.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="70.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">S1</text>
<text x="70.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Джерело 1</text>
<circle cx="70.0" cy="225.0" r="20.0" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
<text x="70.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">S2</text>
<text x="70.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Зловмисник</text>
<rect x="170.0" y="168.0" width="85.0" height="40.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/>
<text x="212.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">RP (Точка РВ)</text>
<circle cx="355.0" cy="145.0" r="20.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="355.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">R1</text>
<text x="355.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Запит (*, G)</text>
<circle cx="355.0" cy="225.0" r="20.0" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="355.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">R2</text>
<text x="355.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Запит (*, G)</text>
<line x1="92.0" y1="145.0" x2="168.0" y2="180.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="92.0" y1="225.0" x2="168.0" y2="195.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="257.0" y1="180.0" x2="333.0" y2="150.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="257.0" y1="195.0" x2="333.0" y2="225.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="35.0" y="275.0" width="365.0" height="95.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="217.5" y="306.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="217.5" dy="0.0">• Клієнт підписується на групу (*, G), не знаючи джерела.</tspan><tspan x="217.5" dy="13.0">• Трафік іде через спільне дерево (Shared Tree) і точку RP.</tspan><tspan x="217.5" dy="13.0">• Будь-який вузол може надсилати спам/DoS у спільну групу G.</tspan><tspan x="217.5" dy="13.0">• Складний механізм перемикання SPT Switchover та MSDP.</tspan></text>
<rect x="430.0" y="50.0" width="385.0" height="330.0" rx="8" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/>
<text x="622.0" y="75.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Source-Specific Multicast (SSM, модель (S, G))</text>
<text x="622.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Джерело відоме заздалегідь · Пряме дерево найкоротшого шляху (SPT)</text>
<circle cx="475.0" cy="145.0" r="20.0" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="475.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">S1</text>
<text x="475.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Джерело S1</text>
<circle cx="475.0" cy="225.0" r="20.0" fill="#fee2e2" stroke="#6b7280" stroke-width="1.5"/>
<text x="475.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">S2</text>
<text x="475.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Заблоковано</text>
<rect x="575.0" y="125.0" width="95.0" height="40.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/>
<text x="622.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Маршрутизатор</text>
<circle cx="765.0" cy="145.0" r="20.0" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="765.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">R1</text>
<text x="765.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Запит (S1, G)</text>
<circle cx="765.0" cy="225.0" r="20.0" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="765.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">R2</text>
<text x="765.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Запит (S1, G)</text>
<line x1="497.0" y1="145.0" x2="573.0" y2="145.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="497.0" y1="225.0" x2="565.0" y2="225.0" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="535.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">✕ Drop</text>
<line x1="672.0" y1="145.0" x2="743.0" y2="145.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="655.0" y1="167.0" x2="743.0" y2="225.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="440.0" y="275.0" width="365.0" height="95.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.0"/><text x="622.5" y="308.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="622.5" dy="0.0">• Клієнт явно вказує (S, G): «Хочу потік G лише від джерела S1».</tspan><tspan x="622.5" dy="11.7">• Дерево найкоротшого шляху (SPT) будується безпосередньо до S1.</tspan><tspan x="622.5" dy="11.7">• Немає точки RP, спільного дерева (*, G) та протоколу MSDP.</tspan><tspan x="622.5" dy="11.7">• Повний захист: спам від невідомих джерел відкидається на вході.</tspan></text>
<rect x="25.0" y="390.0" width="790.0" height="40.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="420.0" y="406.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">SSM замінює відкриту багатоточкову модель на безпечну канальну модель: приймач сам обирає джерело,</tspan><tspan x="420.0" dy="13.7">усуваючи потребу в глобальній координації адрес та складних протоколах пошуку джерел.</tspan></text>
</svg>