<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 472" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="472" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Скінченний автомат станів сусідства OSPF (Neighbor FSM)</text>
<rect x="50.0" y="55.0" width="160.0" height="42.0" rx="6" fill="#f5f5f5" stroke="#6b7280" stroke-width="1.5"/>
<text x="130.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Down</text>
<rect x="50.0" y="115.0" width="160.0" height="42.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="130.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2. Init</text>
<rect x="50.0" y="175.0" width="160.0" height="42.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="130.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">3. 2-Way</text>
<rect x="50.0" y="235.0" width="160.0" height="42.0" rx="6" fill="#fff7e6" stroke="#6b7280" stroke-width="1.5"/>
<text x="130.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. ExStart</text>
<rect x="50.0" y="295.0" width="160.0" height="42.0" rx="6" fill="#fff7e6" stroke="#6b7280" stroke-width="1.5"/>
<text x="130.0" y="320.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">5. Exchange</text>
<rect x="50.0" y="355.0" width="160.0" height="42.0" rx="6" fill="#fff7e6" stroke="#6b7280" stroke-width="1.5"/>
<text x="130.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">6. Loading</text>
<rect x="50.0" y="410.0" width="160.0" height="42.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="2.0"/>
<text x="130.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">7. Full</text>
<line x1="130.0" y1="97.0" x2="130.0" y2="115.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="130.0" y1="157.0" x2="130.0" y2="175.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="130.0" y1="217.0" x2="130.0" y2="235.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="130.0" y1="277.0" x2="130.0" y2="295.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="130.0" y1="337.0" x2="130.0" y2="355.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="130.0" y1="397.0" x2="130.0" y2="410.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="230.0" y="60.0" width="580.0" height="46.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="245.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Відправка Hello: отримано перший Hello без нашого Router ID у списку сусідів.</text>
<text x="245.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Пакет: Hello (тип 1) на мультикаст 224.0.0.5 (AllSPFRouters)</text>
<rect x="230.0" y="116.0" width="580.0" height="46.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="245.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Двосторонній зв'язок: отримано Hello, де наш Router ID є в списку сусідів.</text>
<text x="245.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">У широкомовних мережах на цьому етапі обираються DR та BDR.</text>
<rect x="230.0" y="172.0" width="580.0" height="52.0" rx="6" fill="#fdf7f7" stroke="#c0392b" stroke-width="1.2"/>
<text x="245.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">⚠️ Увага: між двома DROther-роутерами стан залишається 2-Way назавжди!</text>
<text x="245.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Повне сусідство (Full) встановлюється виключно з DR та BDR.</text>
<rect x="230.0" y="232.0" width="580.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="245.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Початок обміну: визначення Master/Slave та стартового Sequence Number.</text>
<text x="245.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Пакет: порожні DBD з прапорцями I=1 (Init), M=1 (More), MS=1 (Master).</text>
<rect x="230.0" y="290.0" width="580.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="245.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Обмін описами баз: передача заголовків усіх відомих LSA.</text>
<text x="245.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Пакет: DBD (Database Description, тип 2), порівняння версій за Sequence Number.</text>
<rect x="230.0" y="348.0" width="580.0" height="50.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="245.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Запит та передача повних LSA: вивантаження відсутніх або новіших записів.</text>
<text x="245.0" y="384.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Пакети: LSR (тип 3 запит) → LSU (тип 4 оновлення) → LSAck (тип 5 квитанція).</text>
<rect x="230.0" y="406.0" width="580.0" height="46.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/>
<text x="245.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Повна синхронізація: бази LSDB маршрутизаторів стовідсотково ідентичні.</text>
<text x="245.0" y="442.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Маршрутизатор запускає SPF і записує найкращі маршрути в таблицю IP (FIB).</text>
</svg>