<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 810 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="810" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="400.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Встановлення сусідства MLE та розрахунок вартості шляхів RIPng</text>
<rect x="30.0" y="40.0" width="355.0" height="355.0" rx="8" fill="#fafbfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="207.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Рукостискання лінку MLE (Link Est.)</text>
<rect x="60.0" y="85.0" width="90.0" height="30.0" rx="4" fill="#eef4ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="105.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Router A</text>
<rect x="260.0" y="85.0" width="90.0" height="30.0" rx="4" fill="#eef4ff" stroke="#2457d6" stroke-width="1.4"/>
<text x="305.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Router B</text>
<line x1="105.0" y1="115.0" x2="105.0" y2="340.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="305.0" y1="115.0" x2="305.0" y2="340.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
<line x1="105.0" y1="150.0" x2="305.0" y2="170.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="205.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">MLE Link Request</text>
<text x="205.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">TLV: Challenge, Mode, ScanMask</text>
<line x1="305.0" y1="205.0" x2="105.0" y2="225.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="205.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">MLE Link Accept and Request</text>
<text x="205.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">TLV: Response, Challenge, Link Margin</text>
<line x1="105.0" y1="260.0" x2="305.0" y2="280.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="205.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">MLE Link Accept</text>
<text x="205.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">TLV: Response, Link Margin, Route64</text>
<text x="207.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Двосторонній зв'язок підтверджено</text>
<text x="207.0" y="333.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Оцінено RSSI та якість лінку (Link Quality In/Out)</text>
<text x="207.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Обміняно 16-бітними адресами RLOC16</text>
<rect x="415.0" y="40.0" width="355.0" height="355.0" rx="8" fill="#fafbfc" stroke="#6b7280" stroke-width="1.2"/>
<text x="592.0" y="65.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Маршрутизація Distance Vector (RIPng)</text>
<rect x="435.0" y="90.0" width="315.0" height="60.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.4"/>
<text x="592.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7d6608" text-anchor="middle" font-weight="700">MLE Advertisement (Мультикаст ff02::1)</text>
<text x="592.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Таймер Trickle: інтервал від 1 с до 32 с</text>
<text x="592.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Містить Route64 TLV (вартість до всіх Router ID)</text>
<rect x="435.0" y="165.0" width="315.0" height="110.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="592.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розрахунок вартості шляху (Path Cost):</text>
<text x="592.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Cost(Hop) = LinkQualityCost(In, Out)</text>
<text x="592.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Link Margin &gt; 20 dB → LQ = 3 (Cost = 1)</text>
<text x="592.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Link Margin 10..20 dB → LQ = 2 (Cost = 2)</text>
<text x="592.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">• Link Margin 2..10 dB → LQ = 1 (Cost = 4)</text>
<text x="592.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">• Link Margin &lt; 2 dB → LQ = 0 (Непридатний, ∞)</text>
<rect x="435.0" y="290.0" width="315.0" height="85.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/>
<text x="592.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Вибір наступного стрибка (Next Hop):</text>
<text x="592.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Router обирає шлях з мінімальною сумою Cost</text>
<text x="592.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">При відмові лінку вартість зростає до 16 (Infinity)</text>
<text x="592.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">Мережа самовідновлюється за 1..3 секунди</text>
</svg>