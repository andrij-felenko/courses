<text x="457.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">NAV (встановлено за полем Duration у RTS: CTS + DATA + ACK + 3×SIFS)</text>
<rect x="310.0" y="300.0" width="390.0" height="20.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
