<text x="420.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Кадр CTS резервує ефір навколо приймача, примушуючи мовчати навіть ті вузли, які не чули RTS.</text>
