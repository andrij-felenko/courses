<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фрагментація в IPv6: базовий заголовок і Fragment Extension Header</text>
<rect x="60.0" y="60.0" width="320.0" height="56.0" rx="4" fill="#eef3ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="220.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Базовий заголовок IPv6 (40 байтів)</text>
<text x="220.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Next Header = 44 (Fragment Header)</text>
<line x1="380.0" y1="88.0" x2="430.0" y2="88.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="430.0" y="60.0" width="330.0" height="56.0" rx="4" fill="#fff7e6" stroke="#c0392b" stroke-width="1.8"/>
<text x="595.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Fragment Header (8 байтів / 64 біти)</text>
<text x="595.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Додається ТІЛЬКИ хостом-відправником</text>
<text x="410.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура Fragment Extension Header (RFC 8200):</text>
<rect x="90.0" y="140.0" width="160.0" height="44.0" rx="3" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/>
<text x="170.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Next Hdr</text>
<text x="170.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">8 бітів</text>
<rect x="250.0" y="140.0" width="160.0" height="44.0" rx="3" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<text x="330.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Reserved</text>
<text x="330.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">8 бітів</text>
<rect x="410.0" y="140.0" width="260.0" height="44.0" rx="3" fill="#eafaf0" stroke="#27ae60" stroke-width="1.4"/>
<text x="540.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Fragment Offset</text>
<text x="540.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">13 бітів (блок 8 B)</text>
<rect x="670.0" y="140.0" width="40.0" height="44.0" rx="3" fill="#ffffff" stroke="#333333" stroke-width="1.4"/>
<text x="690.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Res</text>
<rect x="710.0" y="140.0" width="20.0" height="44.0" rx="3" fill="#fee2e2" stroke="#c0392b" stroke-width="1.4"/>
<text x="720.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">M</text>
<rect x="90.0" y="188.0" width="640.0" height="44.0" rx="3" fill="#eef3ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="410.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Identification (32 біти — розширено з 16 біт IPv4!)</text>
<text x="410.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Запобігає колізіям ID на швидкостях 100+ Гбіт/с</text>
<rect x="90.0" y="246.0" width="640.0" height="75.0" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.3"/>
<text x="105.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">🔑 Ключові відмінності IPv6:</text>
<text x="105.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Маршрутизатори НІКОЛИ не фрагментують: пакет &gt; MTU → відкидання + ICMPv6 Packet Too Big.</text>
<text x="105.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Мінімальний гарантований MTU для будь-якої мережі IPv6 = 1280 байтів (проти 576 B у IPv4).</text>
</svg>