<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 702" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="702" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Три запити DNS перед першим пакетом протоколу</text>
<text x="40.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Клієнт тримає лише ім'я: sip:olena@example.com</text>
<rect x="30.0" y="60.0" width="980.0" height="170.0" rx="10" fill="#eef3fb" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="52.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">Крок 1 — який транспорт пропонує домен</text>
<rect x="182.4" y="141.2" width="95.2" height="47.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="161.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">запит NAPTR</tspan><tspan x="230.0" dy="15.6">example.com</tspan></text>
<rect x="641.3" y="133.4" width="177.3" height="63.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="153.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">«є SIPS поверх TCP,</tspan><tspan x="730.0" dy="15.6">питай далі ім'я</tspan><tspan x="730.0" dy="15.6">_sips._tcp.example.com»</tspan></text>
<line x1="287.6" y1="165.0" x2="631.3" y2="165.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="480.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">з'явився транспорт</text>
<rect x="30.0" y="250.0" width="980.0" height="170.0" rx="10" fill="#fdf3e6" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="52.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">Крок 2 — який вузол і на якому порту</text>
<rect x="144.8" y="331.2" width="170.5" height="47.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="351.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">запит SRV</tspan><tspan x="230.0" dy="15.6">_sips._tcp.example.com</tspan></text>
<rect x="641.3" y="323.4" width="177.3" height="63.2" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="343.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">«пріоритет 10, вага 60,</tspan><tspan x="730.0" dy="15.6">порт 5061,</tspan><tspan x="730.0" dy="15.6">вузол sip1.example.com»</tspan></text>
<line x1="325.2" y1="355.0" x2="631.3" y2="355.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="480.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">з'явилися вузол і порт</text>
<rect x="30.0" y="440.0" width="980.0" height="170.0" rx="10" fill="#eef8f1" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="52.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="start" font-weight="700">Крок 3 — яка в цього вузла адреса</text>
<rect x="165.3" y="521.2" width="129.4" height="47.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="230.0" y="541.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">запит A / AAAA</tspan><tspan x="230.0" dy="15.6">sip1.example.com</tspan></text>
<rect x="672.1" y="521.2" width="115.8" height="47.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="730.0" y="541.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">«198.51.100.9»</tspan><tspan x="730.0" dy="15.6">«2001:db8::9»</tspan></text>
<line x1="304.7" y1="545.0" x2="662.1" y2="545.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="480.0" y="528.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">з'явилася адреса</text>
<rect x="30.0" y="630.0" width="0.0" height="0.0" rx="6" fill="none" stroke="none" stroke-width="0.0"/>
<rect x="30.0" y="626.0" width="980.0" height="56.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="520.0" y="658.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Аж тепер є з чим стукати: TCP на 198.51.100.9:5061, TLS — і сертифікат мусить називати example.com</tspan></text>
</svg>