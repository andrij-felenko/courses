<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Тури жеребкування RFC 2782 дають весь порядок обходу</text>
<text x="40.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">Жереб не вибирає одну ціль — він розкладає всю групу пріоритету в порядок обходу</text>
<rect x="30.0" y="60.0" width="980.0" height="150.0" rx="10" fill="#eef3fb" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="52.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Тур 1 — у грі всі три записи</text>
<rect x="60.0" y="104.0" width="180.0" height="92.0" rx="6" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="150.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">sip1</tspan><tspan x="150.0" dy="15.6">вага 60</tspan><tspan x="150.0" dy="15.6">сума 60</tspan></text>
<rect x="260.0" y="104.0" width="180.0" height="92.0" rx="6" fill="#fde8d7" stroke="#94a3b8" stroke-width="1.5"/><text x="350.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">sip2</tspan><tspan x="350.0" dy="15.6">вага 30</tspan><tspan x="350.0" dy="15.6">сума 90</tspan></text>
<rect x="460.0" y="104.0" width="180.0" height="92.0" rx="6" fill="#e2f4e8" stroke="#94a3b8" stroke-width="1.5"/><text x="550.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="550.0" dy="0.0">sip3</tspan><tspan x="550.0" dy="15.6">вага 10</tspan><tspan x="550.0" dy="15.6">сума 100</tspan></text>
<rect x="660.0" y="104.0" width="320.0" height="92.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="820.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">r = 88 з [0 … 100]</tspan><tspan x="820.0" dy="15.6">перша сума ≥ 88 — це 90</tspan><tspan x="820.0" dy="15.6">вибрано sip2</tspan></text>
<rect x="30.0" y="230.0" width="980.0" height="150.0" rx="10" fill="#fdf3e6" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="52.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Тур 2 — sip2 викинуто, суми пораховані наново</text>
