<rect x="260.0" y="274.0" width="180.0" height="92.0" rx="6" fill="#e2f4e8" stroke="#94a3b8" stroke-width="1.5"/><text x="350.0" y="308.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="350.0" dy="0.0">sip3</tspan><tspan x="350.0" dy="15.6">вага 10</tspan><tspan x="350.0" dy="15.6">сума 70</tspan></text>
<rect x="660.0" y="274.0" width="320.0" height="92.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="820.0" y="308.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">r = 64 з [0 … 70]</tspan><tspan x="820.0" dy="15.6">перша сума ≥ 64 — це 70</tspan><tspan x="820.0" dy="15.6">вибрано sip3</tspan></text>
<rect x="30.0" y="400.0" width="980.0" height="150.0" rx="10" fill="#eef8f1" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="52.0" y="426.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">Тур 3 — лишився один запис</text>
<rect x="60.0" y="444.0" width="180.0" height="92.0" rx="6" fill="#dbeafe" stroke="#94a3b8" stroke-width="1.5"/><text x="150.0" y="478.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">sip1</tspan><tspan x="150.0" dy="15.6">вага 60</tspan><tspan x="150.0" dy="15.6">сума 60</tspan></text>
<rect x="660.0" y="444.0" width="320.0" height="92.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="820.0" y="486.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="820.0" dy="0.0">жеребкувати нема з чого</tspan><tspan x="820.0" dy="15.6">вибрано sip1</tspan></text>
<rect x="30.0" y="580.0" width="980.0" height="56.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="520.0" y="612.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Порядок обходу: sip2 → sip3 → sip1 — найважчий вузол цього разу останній</tspan></text>
</svg>