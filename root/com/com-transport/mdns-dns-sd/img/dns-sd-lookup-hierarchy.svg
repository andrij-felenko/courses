<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Триступеневий резолвінг DNS-SD (RFC 6763)</text>
<rect x="40.0" y="55.0" width="960.0" height="145.0" rx="8" fill="#eef3fb" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="50.0" y="65.0" width="940.0" height="28.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="65.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">1. Пошук екземплярів служби (Запит PTR)</text>
<text x="65.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Запит: PTR _http._tcp.local</text>
<text x="65.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start">Відповідь PTR: «Датчик Вітальні._http._tcp.local» (Shared Record)</text>
<text x="65.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Результат: клієнт бачить зрозумілу людині назву служби</text>
<rect x="40.0" y="225.0" width="960.0" height="145.0" rx="8" fill="#fdf3e6" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="50.0" y="235.0" width="940.0" height="28.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="65.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700">2. Отримання хоста, порту та метаданих (Запит SRV + TXT)</text>
<text x="65.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start">Відповідь SRV: Priority=0, Weight=0, Port=80, Target=sensor-node.local</text>
<text x="65.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start">Відповідь TXT: txtvers=1, model=BME280, path=/api/v1, id=0x4A12</text>
<text x="65.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="start" font-weight="700">Результат: відомі мережевий порт, параметри та канонічне ім'я хоста</text>
<rect x="40.0" y="415.0" width="960.0" height="145.0" rx="8" fill="#eef8f1" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="50.0" y="425.0" width="940.0" height="28.0" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="65.0" y="444.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="start" font-weight="700">3. Розв'язання імені хоста в IP-адресу (Запит A / AAAA)</text>
<text x="65.0" y="493.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start">Відповідь A: 192.168.1.120 (IPv4 Link-Local: 169.254.88.14)</text>
<text x="65.0" y="513.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="start">Відповідь AAAA: fe80::208:22ff:fe8a:4b01 (IPv6 Link-Local)</text>
<text x="65.0" y="533.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700">Результат: клієнт має IP:PORT для негайного встановлення TCP-з'єднання</text>
<rect x="40.0" y="570.0" width="960.0" height="40.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="520.0" y="593.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Оптимізація DNS-SD: респондер пакує PTR (Answer), SRV+TXT (Authority/Additional) та A/AAAA (Additional) в одну UDP-відповідь!</tspan></text>
</svg>