<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контроль трафіку в mDNS: захист від мультикаст-штормів</text>
<rect x="40.0" y="50.0" width="960.0" height="150.0" rx="8" fill="#eef3fb" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="50.0" y="60.0" width="940.0" height="28.0" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
<text x="65.0" y="79.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">1. Придушення відомих відповідей (Known-Answer Suppression)</text>
<text x="65.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="start">Проблема: якщо 20 пристроїв питають про одну службу, ефір заб'ється однаковими відповідями.</text>
<text x="65.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Механізм: запитувач вкладає в секцію Answer запита свої вже відомі записи та їхній залишковий TTL.</text>
<text x="65.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="start" font-weight="700">Респондер: якщо клієнт уже має дійсний запис із залишком TTL &gt; 50% від номіналу — респондер МОВЧИТЬ.</text>
<rect x="40.0" y="220.0" width="960.0" height="150.0" rx="8" fill="#fdf3e6" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="50.0" y="230.0" width="940.0" height="28.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="65.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700">2. Випадкова затримка та дублікати (Random Response Delay &amp; Duplicate Suppression)</text>
<text x="65.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="start">Проблема: на запит PTR _http._tcp.local 100 веб-серверів одночасно надішлють UDP-пакети (колізія).</text>
<text x="65.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Механізм: кожен респондер для спільних записів обирає випадкову затримку від 20 до 120 мс.</text>
<text x="65.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="start" font-weight="700">Дублікати: якщо респондер почув чужу відповідь з тими самими даними раніше свого таймера — його відповідь СКАСОВУЄТЬСЯ.</text>
<rect x="40.0" y="390.0" width="960.0" height="150.0" rx="8" fill="#eef8f1" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="50.0" y="400.0" width="940.0" height="28.0" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="65.0" y="419.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#16a34a" text-anchor="start" font-weight="700">3. Оголошення про вихід (Good-bye Announcement)</text>
<text x="65.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b91c1c" text-anchor="start">Проблема: вимкнений пристрій «зависає» в кешах клієнтів на 75 хвилин (TTL за замовчуванням).</text>
<text x="65.0" y="470.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Механізм: при плановому вимкненні вузол надсилає фінальний пакет mDNS із TTL = 0 для всіх своїх записів.</text>
<text x="65.0" y="492.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700">Результат: усі клієнти в мережі миттєво видаляють службу зі списків доступних пристроїв без тайм-аутів.</text>
<rect x="40.0" y="550.0" width="960.0" height="38.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="520.0" y="573.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Комбінація цих трьох механізмів скорочує обсяг мультикаст-трафіку в типовій локальній мережі на 95–99%</tspan></text>
</svg>