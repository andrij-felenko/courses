<rect x="150.0" y="268.0" width="480.0" height="42.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="390.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Ніхто не тримає карти цілого світу. Кожен R вирішує лише: кому передати ЗАРАЗ,</tspan><tspan x="390.0" dy="13.0">щоб пакет став ближче до цілі — і передає сусідові. Разом ведуть пакет будь-куди.</tspan></text>
<text x="390.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Як водій за дорожніми знаками: знаєш поворот на цьому перехресті, не всю карту.</text>
