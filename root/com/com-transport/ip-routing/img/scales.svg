<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="380" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Той самий механізм на всіх масштабах — змінюється лише розмір таблиці</text>
<rect x="50.0" y="70.0" width="220.0" height="150.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="160.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Телефон / МК</text>
<text x="160.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">~2 рядки у таблиці</text>
<text x="160.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">своя мережа</tspan><tspan x="160.0" dy="16.5">default → роутер</tspan></text>
<line x1="271.0" y1="145.0" x2="284.0" y2="145.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="285.0" y="70.0" width="220.0" height="150.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/>
<text x="395.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Домашній роутер</text>
<text x="395.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">кілька рядків у таблиці</text>
<text x="395.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">своя LAN</tspan><tspan x="395.0" dy="16.5">default → провайдер</tspan></text>
<line x1="506.0" y1="145.0" x2="519.0" y2="145.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="520.0" y="70.0" width="220.0" height="150.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="630.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Магістраль</text>
<text x="630.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">сотні тисяч у таблиці</text>
<text x="630.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">мережі з усього</tspan><tspan x="630.0" dy="16.5">світу · динамічно</tspan></text>
<rect x="80.0" y="250.0" width="620.0" height="52.0" rx="6" fill="#fff7e6" stroke="#6b7280" stroke-width="1.4"/><text x="390.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">ОДНЕ правило на всіх: наклади маску → порівняй номер мережі →</tspan><tspan x="390.0" dy="13.0">візьми найдовший збіг → віддай пакет на next hop. Код той самий; росте лише кількість рядків.</tspan></text>
<text x="390.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">У телефоні майже все йде за default; у провайдера рядки живі (динамічна маршрутизація). Логіка незмінна.</text>
</svg>