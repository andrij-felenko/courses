<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 472" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="472" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класифікація типів NAT за правилами фільтрації та мапінгу</text>
<rect x="40.0" y="52.0" width="365.0" height="175.0" rx="8" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/>
<text x="222.5" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Full Cone NAT</text>
<text x="222.5" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Повний конус (EIM / EIF)</text>
<rect x="52.0" y="106.0" width="341.0" height="105.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.0"/><text x="222.5" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="222.5" dy="0.0">Правило пропуску:</tspan><tspan x="222.5" dy="11.7">• Мапінг прив'язаний лише до внутрішнього сокета.</tspan><tspan x="222.5" dy="11.7">• Будь-який зовнішній вузол може слати пакети на відкритий зовнішній порт.</tspan></text>
<rect x="435.0" y="52.0" width="365.0" height="175.0" rx="8" fill="#f0f5ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="617.5" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Restricted Cone NAT</text>
<text x="617.5" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Обмежений за адресою (EIM / ADF)</text>
<rect x="447.0" y="106.0" width="341.0" height="105.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/><text x="617.5" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="617.5" dy="0.0">Правило пропуску:</tspan><tspan x="617.5" dy="11.7">• Зовнішній вузол може відповісти, лише якщо клієнт раніше надсилав пакет</tspan><tspan x="617.5" dy="11.7">• на його IP-адресу (порт відправника значення не має).</tspan></text>
<rect x="40.0" y="245.0" width="365.0" height="175.0" rx="8" fill="#fff8e8" stroke="#c0392b" stroke-width="1.5"/>
<text x="222.5" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Port Restricted Cone</text>
<text x="222.5" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Обмежений за портом (EIM / APDF)</text>
<rect x="52.0" y="299.0" width="341.0" height="105.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="222.5" y="342.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="222.5" dy="0.0">Правило пропуску:</tspan><tspan x="222.5" dy="11.7">• Зовнішній вузол може відповісти, лише якщо клієнт раніше надсилав пакет</tspan><tspan x="222.5" dy="11.7">• на точну пару (IP_dest, Port_dest).</tspan></text>
<rect x="435.0" y="245.0" width="365.0" height="175.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="617.5" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Symmetric NAT</text>
<text x="617.5" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Симетричний NAT (ADM / APDF)</text>
<rect x="447.0" y="299.0" width="341.0" height="105.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="617.5" y="342.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="617.5" dy="0.0">Правило пропуску:</tspan><tspan x="617.5" dy="11.7">• Для кожної нової зовнішньої адреси призначається НОВИЙ зовнішній порт.</tspan><tspan x="617.5" dy="11.7">• Прямий P2P-траверс неможливий — потрібен релей TURN.</tspan></text>
<rect x="60.0" y="420.0" width="720.0" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.1"/><text x="420.0" y="439.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Cone NAT зберігає однаковий зовнішній порт для всіх цілей (EIM); Symmetric виділяє новий порт для кожної цілі.</tspan></text>
</svg>