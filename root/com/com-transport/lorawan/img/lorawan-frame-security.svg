<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Структура кадру LoRaWAN MAC та схема дворівневого криптозахисту</text>
<text x="430.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Загальна структура кадру LoRaWAN PHYPayload:</text>
<rect x="40.0" y="60.0" width="110.0" height="45.0" rx="3" fill="#fff3cd" stroke="#e0a800" stroke-width="1.5"/>
<text x="95.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#856404" text-anchor="middle" font-weight="700">MHDR (1 Б)</text>
<text x="95.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Тип кадру, версія</text>
<rect x="155.0" y="60.0" width="550.0" height="45.0" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="430.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">MACPayload (7 .. 250 байтів) — Заголовок FHDR, Порт та Дані</text>
<text x="430.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">FHDR (7..23 Б) | FPort (0..1 Б) | FRMPayload (0..N Б)</text>
<rect x="710.0" y="60.0" width="110.0" height="45.0" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="765.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">MIC (4 Б)</text>
<text x="765.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Код цілісності</text>
<text x="430.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розгортання полів MACPayload:</text>
<rect x="60.0" y="150.0" width="100.0" height="42.0" rx="3" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="110.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">DevAddr (4 Б)</text>
<text x="110.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Адреса вузла</text>
<rect x="165.0" y="150.0" width="100.0" height="42.0" rx="3" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="215.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">FCtrl (1 Б)</text>
<text x="215.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ADR, ACK, FOptsLen</text>
<rect x="270.0" y="150.0" width="100.0" height="42.0" rx="3" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="320.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">FCnt (2 Б)</text>
<text x="320.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Лічильник кадру</text>
<rect x="375.0" y="150.0" width="110.0" height="42.0" rx="3" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="430.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">FOpts (0..15 Б)</text>
<text x="430.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">MAC-команди</text>
<rect x="490.0" y="150.0" width="80.0" height="42.0" rx="3" fill="#fff3cd" stroke="#e0a800" stroke-width="1.2"/>
<text x="530.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#856404" text-anchor="middle" font-weight="700">FPort (1 Б)</text>
<text x="530.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">0: MAC / 1+: App</text>
<rect x="575.0" y="150.0" width="225.0" height="42.0" rx="3" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="687.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">FRMPayload (Зашифровано AES-CTR)</text>
<text x="687.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Корисні дані датчика / додатку</text>
<text x="430.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дворівневе розділення криптографічних ключів:</text>
<rect x="50.0" y="245.0" width="360.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="276.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">1. Рівень мережі: Цілісність кадру (NwkSKey)</tspan><tspan x="230.0" dy="12.3"></tspan><tspan x="230.0" dy="12.3">• Блок B0 (DevAddr, FCnt, Len, Dir)</tspan><tspan x="230.0" dy="12.3">• Алгоритм: AES-CMAC над (B0 | MHDR | MACPayload)</tspan><tspan x="230.0" dy="12.3">• Результат: 4-байтний підпис MIC</tspan><tspan x="230.0" dy="12.3">• Захищає від: підробки кадру, спотворення адрес,</tspan><tspan x="230.0" dy="12.3">  повтору старих пакетів (Replay Attack)</tspan></text>
<rect x="450.0" y="245.0" width="360.0" height="130.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="630.0" y="276.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="630.0" dy="0.0">2. Рівень додатку: Шифрування даних (AppSKey)</tspan><tspan x="630.0" dy="12.3"></tspan><tspan x="630.0" dy="12.3">• Блоки Ai (DevAddr, FCnt, BlockIndex i)</tspan><tspan x="630.0" dy="12.3">• Алгоритм: AES-128 в режимі CTR (потоковий гаммувальний)</tspan><tspan x="630.0" dy="12.3">• Результат: FRMPayload = Plaintext ⊕ AES(AppSKey, Ai)</tspan><tspan x="630.0" dy="12.3">• Захищає від: перехоплення та читання даних</tspan><tspan x="630.0" dy="12.3">  (Мережевий сервер NS не бачить вмісту FRMPayload)</tspan></text>
<rect x="50.0" y="385.0" width="760.0" height="32.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="430.0" y="405.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Наскрізна ізоляція: NS перевіряє MIC і керує мережею, але розшифрувати дані може лише Application Server.</text>
</svg>