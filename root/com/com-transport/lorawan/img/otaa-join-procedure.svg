<rect x="20.0" y="350.0" width="200.0" height="80.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="120.0" y="368.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Деривація в пристрої:</tspan><tspan x="120.0" dy="12.3">• Дешифрування Join-Accept</tspan><tspan x="120.0" dy="12.3">• Збереження DevAddr, NetID</tspan><tspan x="120.0" dy="12.3">• NwkSKey = AES(AppKey, 0x01...)</tspan><tspan x="120.0" dy="12.3">• AppSKey = AES(AppKey, 0x02...)</tspan></text>
<rect x="240.0" y="365.0" width="520.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="390.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Результат OTAA:</tspan><tspan x="500.0" dy="11.7">Вузол і сервери узгодили динамічну 32-бітну адресу DevAddr та сесійні ключі NwkSKey і AppSKey.</tspan><tspan x="500.0" dy="11.7">Лічильники FCntUp і FCntDown скинуті в 0. Пристрій готовий до передачі даних.</tspan></text>
