<rect x="695.0" y="155.0" width="160.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="775.0" y="178.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">Обробка в JS:</tspan><tspan x="775.0" dy="11.7">1. Перевірка DevNonce</tspan><tspan x="775.0" dy="11.7">2. Розрахунок MIC з AppKey</tspan><tspan x="775.0" dy="11.7">3. Генерація AppNonce</tspan><tspan x="775.0" dy="11.7">4. Деривація NwkSKey / AppSKey</tspan><tspan x="775.0" dy="11.7">5. Шифрування Join-Accept</tspan></text>
