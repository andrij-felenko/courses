<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Алгоритм динамічного керування швидкістю (ADR) та аварійного відновлення зв'язку</text>
<text x="230.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Оптимізація на стороні сервера (NS)</text>
<text x="650.0" y="35.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Захисний відкат на стороні вузла (Node)</text>
<line x1="430.0" y1="45.0" x2="430.0" y2="375.0" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
<rect x="40.0" y="65.0" width="360.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="220.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">1. Збір статистики SNR:</tspan><tspan x="220.0" dy="12.3">Network Server збирає історію SNR за останні 20 пакетів.</tspan><tspan x="220.0" dy="12.3">Визначається максимальне значення: max(SNR).</tspan></text>
<line x1="220.0" y1="125.0" x2="220.0" y2="155.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="155.0" width="360.0" height="75.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">2. Розрахунок запасу SNR_margin:</tspan><tspan x="220.0" dy="11.7">SNR_margin = max(SNR) − SNR_req(DR) − Device_Margin (10 дБ)</tspan><tspan x="220.0" dy="11.7">Кількість кроків покращення: N_steps = floor(SNR_margin / 3 дБ).</tspan></text>
<line x1="220.0" y1="230.0" x2="220.0" y2="260.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="260.0" width="360.0" height="95.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="220.0" y="293.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">3. Застосування кроків (LinkADRReq):</tspan><tspan x="220.0" dy="11.7">• Крок 1: Зменшення SF (SF12 → SF11 → ... → SF7) → скорочення ToA.</tspan><tspan x="220.0" dy="11.7">• Крок 2: Зниження TX Power (14 дБм → 12 → ... → 2 дБм) → економія батареї.</tspan><tspan x="220.0" dy="11.7">• Сервер надсилає команду LinkADRReq у найближчому Downlink.</tspan></text>
<rect x="460.0" y="65.0" width="360.0" height="60.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="640.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">1. Підрахунок пакетів без підтвердження:</tspan><tspan x="640.0" dy="12.3">Пристрій інкрементує лічильник ADR_ACK_CNT.</tspan><tspan x="640.0" dy="12.3">Якщо за 64 пакети немає Downlink — виставляється біт ADRACKReq.</tspan></text>
<line x1="640.0" y1="125.0" x2="640.0" y2="155.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="460.0" y="155.0" width="360.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="640.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">2. Очікування відповіді (ADR_ACK_DELAY):</tspan><tspan x="640.0" dy="11.7">Якщо за наступні 32 пакети Downlink так і не отримано:</tspan><tspan x="640.0" dy="11.7">Пристрій перемикає потужність передавача TX Power на максимум (+14 дБм).</tspan></text>
<line x1="640.0" y1="230.0" x2="640.0" y2="260.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="460.0" y="260.0" width="360.0" height="95.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="640.0" y="293.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="640.0" dy="0.0">3. Покрокове підвищення коефіцієнта розширення:</tspan><tspan x="640.0" dy="11.7">• Кожні наступні 32 передачі SF збільшується на 1 (SF7 → SF8 → ... → SF12).</tspan><tspan x="640.0" dy="11.7">• Якщо досягнуто SF12 і зв'язку немає — скидання на базові канали (868.1–868.5).</tspan><tspan x="640.0" dy="11.7">• Досягається максимальна дальність для відновлення контакту.</tspan></text>
<rect x="40.0" y="375.0" width="780.0" height="35.0" rx="4" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="430.0" y="397.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">Баланс ADR: мінімальний час у ефірі та найнижче споживання в нормі + надійний автоматичний вихід із глухого кута.</text>
</svg>