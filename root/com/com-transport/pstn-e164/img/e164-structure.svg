<line x1="615.0" y1="110.0" x2="615.0" y2="135.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="510.0" y1="230.0" x2="510.0" y2="255.0" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="720.0" y1="230.0" x2="720.0" y2="255.0" stroke="#b9770e" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="365.0" width="780.0" height="35.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="430.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Приклад: +380 (CC) 44 (NDC) 1234567 (SN) → Загальна довжина 12 цифр (&lt;= 15 цифр E.164)</text>
