<text x="370.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#d97706" text-anchor="middle" font-weight="700">Код == 0x01 (Вставити 0x00)</text>
<line x1="680.0" y1="115.0" x2="680.0" y2="80.0" stroke="#2457d6" stroke-width="1.6"/>
<line x1="680.0" y1="80.0" x2="740.0" y2="80.0" stroke="#2457d6" stroke-width="1.6"/>
<line x1="740.0" y1="80.0" x2="740.0" y2="115.0" stroke="#2457d6" stroke-width="1.6"/>
