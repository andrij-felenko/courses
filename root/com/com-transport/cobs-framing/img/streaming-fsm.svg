<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Автомат станів потокового декодера COBS</text>
<rect x="15.0" y="15.0" width="810.0" height="350.0" rx="8" fill="#fafbfc" stroke="#d0d7de" stroke-width="1.2"/>
<text x="35.0" y="45.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Скінченний автомат потокового декодера COBS (байт-за-байтом):</text>
<rect x="66.8" y="128.2" width="126.3" height="63.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="130.0" y="149.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">ОЧІКУВАННЯ</tspan><tspan x="130.0" dy="14.3">РОЗДІЛЮВАЧА</tspan><tspan x="130.0" dy="14.3">(Синхронізація)</tspan></text>
<rect x="333.7" y="128.2" width="112.7" height="63.6" rx="6" fill="#fff3cd" stroke="#d97706" stroke-width="1.8"/><text x="390.0" y="149.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700"><tspan x="390.0" dy="0.0">ЧИТАННЯ</tspan><tspan x="390.0" dy="14.3">ПОКАЖЧИКА</tspan><tspan x="390.0" dy="14.3">(Offset Code)</tspan></text>
<rect x="610.0" y="128.2" width="139.9" height="63.6" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="680.0" y="149.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="680.0" dy="0.0">ЗБИРАННЯ</tspan><tspan x="680.0" dy="14.3">ДАНИХ БЛОКУ</tspan><tspan x="680.0" dy="14.3">(Лічильник N &gt; 0)</tspan></text>
<line x1="40.0" y1="160.0" x2="60.0" y2="160.0" stroke="#333333" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="50.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">Старт</text>
<line x1="200.0" y1="140.0" x2="320.0" y2="140.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="260.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Байт == 0x00 (Межа)</text>
<line x1="460.0" y1="140.0" x2="600.0" y2="140.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="530.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Код &gt; 0x01 (Дані є)</text>
<line x1="390.0" y1="205.0" x2="390.0" y2="245.0" stroke="#d97706" stroke-width="1.6"/>
<line x1="390.0" y1="245.0" x2="350.0" y2="245.0" stroke="#d97706" stroke-width="1.6"/>
<line x1="350.0" y1="245.0" x2="350.0" y2="205.0" stroke="#d97706" stroke-width="1.6"/>
