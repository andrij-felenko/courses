<text x="710.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">Байт != 0x00 (--N)</text>
<line x1="600.0" y1="180.0" x2="460.0" y2="180.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="530.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">N == 0 (Вставити 0x00 якщо Code &lt; 0xFF)</text>
<line x1="680.0" y1="205.0" x2="680.0" y2="310.0" stroke="#c0392b" stroke-width="1.6"/>
<line x1="680.0" y1="310.0" x2="130.0" y2="310.0" stroke="#c0392b" stroke-width="1.6"/>
<line x1="130.0" y1="310.0" x2="130.0" y2="215.0" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="410.0" y="325.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Неочікуваний 0x00 під час збору даних (Помилка кадрування → Скидання)</text>
</svg>