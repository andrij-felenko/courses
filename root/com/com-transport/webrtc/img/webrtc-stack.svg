<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура стеку протоколів WebRTC</text>
<rect x="40.0" y="50.0" width="800.0" height="45.0" rx="6" fill="#fdf3e0" stroke="#333333" stroke-width="1.5"/>
<text x="440.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Прикладний шар (JavaScript API / Нативний додаток: MediaStream, RTCDataChannel)</text>
<rect x="40.0" y="105.0" width="380.0" height="230.0" rx="6" fill="#fef5f5" stroke="#c0392b" stroke-width="1.5"/>
<text x="230.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Медіа-тракт (Аудіо / Відео)</text>
<rect x="60.0" y="140.0" width="340.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="161.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">Кодеки: Opus (аудіо), H.264 / VP8 / VP9 / AV1 (відео)</tspan></text>
<rect x="60.0" y="185.0" width="340.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="206.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">RTP (корисний вантаж) / RTCP (зворотний зв'язок)</tspan></text>
<rect x="60.0" y="230.0" width="340.0" height="36.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="230.0" y="251.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">SRTP / SRTCP (шифрування AES-GCM / HMAC-SHA1)</tspan></text>
<rect x="60.0" y="275.0" width="340.0" height="45.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0.0">DTLS (узгодження ключів для SRTP через RFC 5764)</tspan></text>
<rect x="460.0" y="105.0" width="380.0" height="230.0" rx="6" fill="#f0f4fe" stroke="#2457d6" stroke-width="1.5"/>
<text x="650.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Тракт довільних даних (DataChannel)</text>
<rect x="480.0" y="140.0" width="340.0" height="36.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="650.0" y="161.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">Бінарні повідомлення / Текстові кадри (UTF-8)</tspan></text>
<rect x="480.0" y="185.0" width="340.0" height="36.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/><text x="650.0" y="206.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="650.0" dy="0.0">SCTP (потоковий контроль, надійний / ненадійний режим)</tspan></text>
<rect x="480.0" y="230.0" width="340.0" height="90.0" rx="6" fill="#eaf6ee" stroke="#27ae60" stroke-width="1.5"/><text x="650.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">DTLS (інкапсуляція та захист усього SCTP-трафіку)</tspan><tspan x="650.0" dy="13.0">Шифрування TLS 1.2 / 1.3 на транспортному рівні</tspan></text>
<rect x="40.0" y="345.0" width="800.0" height="38.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="440.0" y="368.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">UDP (User Datagram Protocol) — мультиплексування потоків через BUNDLE на єдиному сокеті</tspan></text>
<rect x="40.0" y="390.0" width="800.0" height="38.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="413.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">ICE (Interactive Connectivity Establishment) + STUN / TURN (NAT Traversal)</tspan></text>
<rect x="40.0" y="435.0" width="800.0" height="32.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="454.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">IP (IPv4 / IPv6) — мережевий шар</tspan></text>
</svg>