<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Криптографічний захист від Middlebox: TCP/TLS 1.2 проти QUIC/TLS 1.3</text>
<rect x="30.0" y="48.0" width="375.0" height="420.0" rx="6" fill="#fffaf9" stroke="#c0392b" stroke-width="1.4"/>
<text x="217.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Стек TCP + TLS 1.2 (Прозорий для Middlebox)</text>
<rect x="45.0" y="92.0" width="345.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="217.5" y="112.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="217.5" dy="0.0">IP Header (L3): Відкритий</tspan><tspan x="217.5" dy="12.3">src IP, dst IP, TTL, Don't Fragment flag</tspan></text>
<rect x="45.0" y="144.0" width="345.0" height="82.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="217.5" y="164.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="217.5" dy="0.0">TCP Header (L4): ПОВНІСТЮ ВІДКРИТИЙ</tspan><tspan x="217.5" dy="11.7">• Порти: 443 / 52140</tspan><tspan x="217.5" dy="11.7">• Seq/Ack номери (підміна, desync)</tspan><tspan x="217.5" dy="11.7">• Прапорці: SYN, ACK, FIN, RST (фальшиві скидання)</tspan><tspan x="217.5" dy="11.7">• Опції: WScale, SACK, Timestamps (вирізання)</tspan></text>
<rect x="45.0" y="232.0" width="345.0" height="82.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="217.5" y="252.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="217.5" dy="0.0">TLS 1.2 Record Header &amp; Handshake: ВІДКРИТИЙ</tspan><tspan x="217.5" dy="11.7">• Content Type, Version (0x0303)</tspan><tspan x="217.5" dy="11.7">• ClientHello: SNI домен, Cipher Suites, Extensions</tspan><tspan x="217.5" dy="11.7">• ServerHello, Server Certificate (сертифікат у відкритому вигляді!)</tspan><tspan x="217.5" dy="11.7">• Можливість вибіркового блокування та підміни</tspan></text>
<rect x="45.0" y="320.0" width="345.0" height="48.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.0"/><text x="217.5" y="341.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="217.5" dy="0.0">TLS 1.2 Application Data: Зашифровано</tspan><tspan x="217.5" dy="12.3">Зашифрований корисний потік (HTTP/1.1 або HTTP/2)</tspan></text>
<rect x="45.0" y="380.0" width="345.0" height="75.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.1"/><text x="217.5" y="403.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="217.5" dy="0.0">Вразливість до втручання:</tspan><tspan x="217.5" dy="11.7">✔ Блокування нових TCP-опцій</tspan><tspan x="217.5" dy="11.7">✔ Маніпуляція номерами послідовності</tspan><tspan x="217.5" dy="11.7">✔ Фільтрація та підміна за SNI/Сертифікатом</tspan></text>
<rect x="435.0" y="48.0" width="375.0" height="420.0" rx="6" fill="#f8fafc" stroke="#27ae60" stroke-width="1.4"/>
<text x="622.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Стек QUIC + TLS 1.3 (Криптографічна броня)</text>
<rect x="450.0" y="92.0" width="345.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="622.5" y="112.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="622.5" dy="0.0">IP Header (L3): Відкритий</tspan><tspan x="622.5" dy="12.3">src IP, dst IP (стандартний маршрут)</tspan></text>
<rect x="450.0" y="144.0" width="345.0" height="46.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="622.5" y="164.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="622.5" dy="0.0">UDP Header (L4): Стандартний</tspan><tspan x="622.5" dy="12.3">src Port, dst Port = 443 (Універсальний пропуск через NAT)</tspan></text>
<rect x="450.0" y="196.0" width="345.0" height="52.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.0"/><text x="622.5" y="213.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="622.5" dy="0.0">QUIC Short/Long Header: Мінімальний відкритий</tspan><tspan x="622.5" dy="11.7">• 1-біт Spin Bit (вимір RTT)</tspan><tspan x="622.5" dy="11.7">• Destination Connection ID (не прив'язаний до IP/порту)</tspan></text>
<rect x="450.0" y="254.0" width="345.0" height="114.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.3"/><text x="622.5" y="284.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="622.5" dy="0.0">ЗАШИФРОВАНО ТА АВТЕНТИФІКОВАНО (AEAD):</tspan><tspan x="622.5" dy="11.7">• Номери пакетів (Packet Numbers захищені від інспекції)</tspan><tspan x="622.5" dy="11.7">• Увесь транспортний стан: ACK frames, Stream frames</tspan><tspan x="622.5" dy="11.7">• TLS 1.3 Handshake: сертифікати, розширення, ALPN</tspan><tspan x="622.5" dy="11.7">• Flow Control, Congestion Signals, Connection Close</tspan><tspan x="622.5" dy="11.7">• Будь-яка зміна біта middlebox → відкидання пакета!</tspan></text>
<rect x="450.0" y="380.0" width="345.0" height="75.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.1"/><text x="622.5" y="403.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="622.5" dy="0.0">Результат для еволюції мережі:</tspan><tspan x="622.5" dy="11.7">✔ Неможливо підробити Seq/Ack чи скинути сесію</tspan><tspan x="622.5" dy="11.7">✔ Неможливо вирізати нові транспортні розширення</tspan><tspan x="622.5" dy="11.7">✔ Захист від цензури та відновлення швидкості оновлень</tspan></text>
</svg>