<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 370" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="370" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Канали «точка-точка»: класична маска /30 проти стандарту RFC 3021 (/31)</text>
<rect x="30.0" y="55.0" width="385.0" height="285.0" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="222.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Традиційна маска /30 (4 адреси на лінк)</text>
<text x="45.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="45.0" dy="0.0">Блок: 198.51.100.0/30 (маска 255.255.255.252)</tspan><tspan x="45.0" dy="14.9">-----------------------------------------------</tspan><tspan x="45.0" dy="14.9">198.51.100.0  -&gt;  Мережева адреса (НЕ використовується)</tspan><tspan x="45.0" dy="14.9">198.51.100.1  -&gt;  Інтерфейс Router A</tspan><tspan x="45.0" dy="14.9">198.51.100.2  -&gt;  Інтерфейс Router B</tspan><tspan x="45.0" dy="14.9">198.51.100.3  -&gt;  Широкомовна адреса (НЕ використовується)</tspan></text>
<rect x="50.3" y="232.2" width="343.4" height="55.6" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/><text x="222.0" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="222.0" dy="0.0">Ефективність: 50%</tspan><tspan x="222.0" dy="14.3">Втрачається 2 із 4 адрес на кожному лінку!</tspan><tspan x="222.0" dy="14.3">На 1 000 P2P-з'єднань марнується 2 000 IP-адрес.</tspan></text>
<rect x="445.0" y="55.0" width="385.0" height="285.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="637.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Сучасний стандарт RFC 3021 (/31)</text>
<text x="460.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="460.0" dy="0.0">Блок: 198.51.100.0/31 (маска 255.255.255.254)</tspan><tspan x="460.0" dy="14.9">-----------------------------------------------</tspan><tspan x="460.0" dy="14.9">198.51.100.0  -&gt;  Інтерфейс Router A (вузол 0)</tspan><tspan x="460.0" dy="14.9">198.51.100.1  -&gt;  Інтерфейс Router B (вузол 1)</tspan><tspan x="460.0" dy="14.9"></tspan><tspan x="460.0" dy="14.9">Широкомовлення та номер мережі відсутні:</tspan><tspan x="460.0" dy="14.9">на каналі точка-точка є лише два учасники.</tspan></text>
<rect x="479.0" y="232.2" width="316.1" height="55.6" rx="6" fill="#dcfce7" stroke="#27ae60" stroke-width="1.5"/><text x="637.0" y="249.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="637.0" dy="0.0">Ефективність: 100%</tspan><tspan x="637.0" dy="14.3">Усі 2 адреси використовуються інтерфейсами!</tspan><tspan x="637.0" dy="14.3">Економія 50% адресного простору магістралей.</tspan></text>
</svg>