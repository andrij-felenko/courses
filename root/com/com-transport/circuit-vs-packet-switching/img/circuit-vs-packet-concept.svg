<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Фундаментальні концепції: комутація каналів проти комутації пакетів</text>
<rect x="20.0" y="45.0" width="840.0" height="230.0" rx="6" fill="#fcfdfe" stroke="#333333" stroke-width="1.2"/>
<text x="40.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">1. Комутація каналів (Circuit Switching — PSTN, TDM, оптичні лямбди)</text>
<rect x="40.0" y="95.0" width="100.0" height="45.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.5"/><text x="90.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="90.0" dy="0.0">Абонент A</tspan><tspan x="90.0" dy="14.3">(Вхід)</tspan></text>
<rect x="210.0" y="95.0" width="110.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="265.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="265.0" dy="0.0">Комутатор 1</tspan><tspan x="265.0" dy="14.3">(Вузол S1)</tspan></text>
<rect x="390.0" y="95.0" width="110.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="445.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="445.0" dy="0.0">Комутатор 2</tspan><tspan x="445.0" dy="14.3">(Вузол S2)</tspan></text>
<rect x="570.0" y="95.0" width="110.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="625.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="625.0" dy="0.0">Комутатор 3</tspan><tspan x="625.0" dy="14.3">(Вузол S3)</tspan></text>
<rect x="740.0" y="95.0" width="100.0" height="45.0" rx="6" fill="#eef3ff" stroke="#2457d6" stroke-width="1.5"/><text x="790.0" y="114.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Абонент B</tspan><tspan x="790.0" dy="14.3">(Вихід)</tspan></text>
<line x1="140.0" y1="117.0" x2="210.0" y2="117.0" stroke="#c0392b" stroke-width="3.5"/>
<line x1="320.0" y1="117.0" x2="390.0" y2="117.0" stroke="#c0392b" stroke-width="3.5"/>
<line x1="500.0" y1="117.0" x2="570.0" y2="117.0" stroke="#c0392b" stroke-width="3.5"/>
<line x1="680.0" y1="117.0" x2="740.0" y2="117.0" stroke="#c0392b" stroke-width="3.5"/>
<line x1="140.0" y1="117.0" x2="180.0" y2="117.0" stroke="#c0392b" stroke-width="3.5" marker-end="url(#arrow)"/>
<line x1="320.0" y1="117.0" x2="360.0" y2="117.0" stroke="#c0392b" stroke-width="3.5" marker-end="url(#arrow)"/>
<line x1="500.0" y1="117.0" x2="540.0" y2="117.0" stroke="#c0392b" stroke-width="3.5" marker-end="url(#arrow)"/>
<line x1="680.0" y1="117.0" x2="715.0" y2="117.0" stroke="#c0392b" stroke-width="3.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="155.0" width="800.0" height="105.0" rx="6" fill="#fffaf0" stroke="#d97706" stroke-width="1.5"/><text x="440.0" y="189.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">• Фази: Встановлення каналу (Setup) → Неперервна передача даних (Data) → Розрив з'єднання (Teardown)</tspan><tspan x="440.0" dy="14.3">• Ресурси: Жорстко зарезервована смуга (наприклад, 64 кбіт/с DS0 або оптична довжина хвилі)</tspan><tspan x="440.0" dy="14.3">• Властивості: Затримка суворо детермінована, джитер дорівнює нулю, проміжні буфери відсутні</tspan><tspan x="440.0" dy="14.3">• Недолік: Під час пауз мовчання виділена смуга блокується і марнується для інших абонентів</tspan></text>
<rect x="20.0" y="290.0" width="840.0" height="235.0" rx="6" fill="#fcfdfe" stroke="#333333" stroke-width="1.2"/>
<text x="40.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">2. Комутація пакетів (Packet Switching — IP дейтаграми, MPLS, Ethernet)</text>
<rect x="40.0" y="335.0" width="95.0" height="45.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="87.5" y="354.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="87.5" dy="0.0">Вузол A</tspan><tspan x="87.5" dy="14.3">(Хост 1)</tspan></text>
<rect x="210.0" y="335.0" width="115.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="267.5" y="354.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="267.5" dy="0.0">Маршрутизатор R1</tspan><tspan x="267.5" dy="11.7">(Store &amp; Forward)</tspan></text>
<rect x="410.0" y="335.0" width="115.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="467.5" y="354.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="467.5" dy="0.0">Маршрутизатор R2</tspan><tspan x="467.5" dy="11.7">(Store &amp; Forward)</tspan></text>
<rect x="610.0" y="335.0" width="115.0" height="45.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="667.5" y="354.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="667.5" dy="0.0">Маршрутизатор R3</tspan><tspan x="667.5" dy="11.7">(Store &amp; Forward)</tspan></text>
<rect x="755.0" y="335.0" width="85.0" height="45.0" rx="6" fill="#eaf7ee" stroke="#27ae60" stroke-width="1.5"/><text x="797.5" y="354.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="797.5" dy="0.0">Вузол B</tspan><tspan x="797.5" dy="14.3">(Хост 2)</tspan></text>
<line x1="135.0" y1="357.0" x2="210.0" y2="357.0" stroke="#333333" stroke-width="1.5"/>
<line x1="325.0" y1="357.0" x2="410.0" y2="357.0" stroke="#333333" stroke-width="1.5"/>
<line x1="525.0" y1="357.0" x2="610.0" y2="357.0" stroke="#333333" stroke-width="1.5"/>
<line x1="725.0" y1="357.0" x2="755.0" y2="357.0" stroke="#333333" stroke-width="1.5"/>
<rect x="145.0" y="345.0" width="52.0" height="24.0" rx="3" fill="#dbeafe" stroke="#2457d6" stroke-width="1.2"/>
<text x="171.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Пакет 3</text>
<rect x="338.0" y="345.0" width="52.0" height="24.0" rx="3" fill="#dbeafe" stroke="#2457d6" stroke-width="1.2"/>
<text x="364.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Пакет 2</text>
<rect x="538.0" y="345.0" width="52.0" height="24.0" rx="3" fill="#dbeafe" stroke="#2457d6" stroke-width="1.2"/>
<text x="564.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Пакет 1</text>
<rect x="40.0" y="395.0" width="800.0" height="115.0" rx="6" fill="#f4fbf7" stroke="#27ae60" stroke-width="1.5"/><text x="440.0" y="434.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">• Дискретизація: Повідомлення розбиваються на окремі пакети із заголовками (Header)</tspan><tspan x="440.0" dy="14.3">• Статистичне мультиплексування: Канал передачі динамічно ділиться між усіма активними потоками</tspan><tspan x="440.0" dy="14.3">• Буферизація (Store-and-Forward): Вузол повністю приймає пакет, перевіряє суму та ставить у чергу</tspan><tspan x="440.0" dy="14.3">• Компроміс: Висока ефективність утилізації смуги, але ризик переповнення буфера та змінна затримка</tspan></text>
</svg>