<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 834.3 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="834.3" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мультистрімінг SCTP проти блокування черги (HoLB)</text>
<rect x="45.9" y="48.5" width="318.2" height="33.0" rx="6" fill="#fdf2e9" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="69.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">TCP: один байтовий потік на з'єднання</tspan></text>
<rect x="55.0" y="110.0" width="300.0" height="40.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="105.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Pkt 1 [OK]</text>
<rect x="165.0" y="115.0" width="80.0" height="30.0" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/>
<text x="205.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Pkt 2 [ВТРАТА]</text>
<text x="295.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Pkt 3 [OK]</text>
<line x1="205.0" y1="155.0" x2="205.0" y2="195.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="92.7" y="200.2" width="224.6" height="59.6" rx="6" fill="#fde8e8" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="219.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">Буфер приймача TCP:</tspan><tspan x="205.0" dy="14.3">Pkt 3 заблоковано в очікуванні</tspan><tspan x="205.0" dy="14.3">повторної передачі Pkt 2!</tspan></text>
<line x1="205.0" y1="270.0" x2="205.0" y2="310.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="106.3" y="305.2" width="197.3" height="59.6" rx="6" fill="#f9d5d5" stroke="#c0392b" stroke-width="1.5"/><text x="205.0" y="324.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="205.0" dy="0.0">Прикладний застосунок:</tspan><tspan x="205.0" dy="14.3">ПОВНЕ ЗАВИСАННЯ ВСІХ СЕСІЙ</tspan><tspan x="205.0" dy="14.3">(Head-of-Line Blocking)</tspan></text>
<rect x="476.0" y="48.5" width="277.9" height="33.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="615.0" y="69.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">SCTP: множина незалежних потоків</tspan></text>
<rect x="465.0" y="105.0" width="300.0" height="32.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.2"/>
<text x="525.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Потік 0 (SSN=0,1):</text>
<text x="665.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Всі чанки доставлено [OK]</text>
<rect x="465.0" y="143.0" width="300.0" height="32.0" rx="6" fill="#fef3e8" stroke="#c0392b" stroke-width="1.2"/>
<text x="525.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Потік 1 (SSN=0,1):</text>
<text x="665.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Втрачено SSN=0 -&gt; Чекає</text>
<rect x="465.0" y="181.0" width="300.0" height="32.0" rx="6" fill="#e8f0fe" stroke="#2457d6" stroke-width="1.2"/>
<text x="525.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Потік 2 (SSN=0,1):</text>
<text x="665.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Всі чанки доставлено [OK]</text>
<line x1="615.0" y1="220.0" x2="615.0" y2="260.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="499.3" y="270.2" width="231.4" height="59.6" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="615.0" y="289.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">Приймач SCTP (демультиплексор):</tspan><tspan x="615.0" dy="14.3">Потік 0 та Потік 2 передаються</tspan><tspan x="615.0" dy="14.3">застосунку НЕГАЙНО!</tspan></text>
<line x1="615.0" y1="345.0" x2="615.0" y2="380.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="472.0" y="380.2" width="286.0" height="59.6" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/><text x="615.0" y="399.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0.0">Прикладний застосунок:</tspan><tspan x="615.0" dy="14.3">Блокується ЛИШЕ транзакція Потоку 1.</tspan><tspan x="615.0" dy="14.3">Решта транзакцій працюють без затримок!</tspan></text>
<rect x="5.7" y="444.0" width="808.6" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="410.0" y="464.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="410.0" dy="0.0">TSN гарантує надійність на рівні всієї асоціації, а окремі SSN забезпечують впорядкування всередині потоку</tspan></text>
</svg>