<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="580" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Де саме діє кожна опція: шлях відправлення і шлях приймання</text>
<rect x="20.0" y="52.0" width="434.0" height="492.0" rx="10" fill="#fcfcfd" stroke="#6b7280" stroke-width="1.4"/>
<rect x="486.0" y="52.0" width="454.0" height="492.0" rx="10" fill="#fcfcfd" stroke="#6b7280" stroke-width="1.4"/>
<text x="237.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">шлях відправлення</text>
<text x="713.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">шлях приймання</text>
<rect x="43.0" y="96.0" width="388.0" height="44.0" rx="6" fill="#fffdf0" stroke="#b08900" stroke-width="1.7"/><text x="237.0" y="114.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="237.0" dy="0.0">sendto(fd, …, 239.1.2.3:5000)</tspan><tspan x="237.0" dy="15.6">застосунок віддає датаграму</tspan></text>
<line x1="237.0" y1="143.0" x2="237.0" y2="157.0" stroke="#333333" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="43.0" y="160.0" width="388.0" height="44.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.7"/><text x="237.0" y="178.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="237.0" dy="0.0">IP_MULTICAST_IF</tspan><tspan x="237.0" dy="15.6">з якого інтерфейсу вона вийде</tspan></text>
<line x1="237.0" y1="207.0" x2="237.0" y2="221.0" stroke="#333333" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="43.0" y="224.0" width="388.0" height="44.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.7"/><text x="237.0" y="242.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="237.0" dy="0.0">IP_MULTICAST_TTL</tspan><tspan x="237.0" dy="15.6">скільки маршрутизаторів переживе (типово 1)</tspan></text>
<line x1="237.0" y1="271.0" x2="237.0" y2="285.0" stroke="#333333" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="43.0" y="288.0" width="388.0" height="44.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.7"/><text x="237.0" y="306.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="237.0" dy="0.0">IP_MULTICAST_LOOP</tspan><tspan x="237.0" dy="15.6">чи лишити копію собі (типово так)</tspan></text>
<line x1="237.0" y1="335.0" x2="237.0" y2="349.0" stroke="#333333" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="43.0" y="352.0" width="388.0" height="44.0" rx="6" fill="#f7f9fc" stroke="#6b7280" stroke-width="1.7"/><text x="237.0" y="370.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="237.0" dy="0.0">кадр у мережу</tspan><tspan x="237.0" dy="15.6">приєднання для відправлення не потрібне</tspan></text>
<text x="237.0" y="432.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">приєднання тут не бере участі взагалі —</text>
<text x="237.0" y="452.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">слати в групу вільно кожному, хто знає адресу</text>
<text x="237.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">у Winsock LOOP керує приймальним боком,</text>
<text x="237.0" y="500.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-style="italic">а не відправним — дзеркально до POSIX</text>
<rect x="509.0" y="96.0" width="408.0" height="44.0" rx="6" fill="#f7f9fc" stroke="#6b7280" stroke-width="1.7"/><text x="713.0" y="114.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="713.0" dy="0.0">кадр на 01:00:5E:01:02:03</tspan><tspan x="713.0" dy="15.6">апаратний фільтр картки</tspan></text>
<line x1="713.0" y1="143.0" x2="713.0" y2="157.0" stroke="#333333" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="509.0" y="160.0" width="408.0" height="44.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.7"/><text x="713.0" y="178.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="713.0" dy="0.0">IP_ADD_MEMBERSHIP</tspan><tspan x="713.0" dy="15.6">чи слухає ядро цю групу на цьому інтерфейсі</tspan></text>
<line x1="713.0" y1="207.0" x2="713.0" y2="221.0" stroke="#333333" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="509.0" y="224.0" width="408.0" height="44.0" rx="6" fill="#fffdf0" stroke="#b08900" stroke-width="1.7"/><text x="713.0" y="242.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="713.0" dy="0.0">bind(адреса : порт)</tspan><tspan x="713.0" dy="15.6">фільтр за адресою призначення</tspan></text>
<line x1="713.0" y1="271.0" x2="713.0" y2="285.0" stroke="#333333" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="509.0" y="288.0" width="408.0" height="44.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.7"/><text x="713.0" y="306.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="713.0" dy="0.0">SO_REUSEADDR / SO_REUSEPORT</tspan><tspan x="713.0" dy="15.6">скільки сокетів дістануть копію</tspan></text>
<line x1="713.0" y1="335.0" x2="713.0" y2="349.0" stroke="#333333" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="509.0" y="352.0" width="408.0" height="44.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.7"/><text x="713.0" y="370.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="713.0" dy="0.0">IP_MULTICAST_ALL (лише Linux)</tspan><tspan x="713.0" dy="15.6">чи віддавати ще й чужі групи</tspan></text>
<line x1="713.0" y1="399.0" x2="713.0" y2="413.0" stroke="#333333" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="509.0" y="416.0" width="408.0" height="44.0" rx="6" fill="#fffdf0" stroke="#b08900" stroke-width="1.7"/><text x="713.0" y="434.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="713.0" dy="0.0">recvmsg + IP_PKTINFO</tspan><tspan x="713.0" dy="15.6">куди саме прийшло: група й інтерфейс</tspan></text>
<line x1="713.0" y1="463.0" x2="713.0" y2="477.0" stroke="#333333" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="509.0" y="480.0" width="408.0" height="44.0" rx="6" fill="#f7f9fc" stroke="#6b7280" stroke-width="1.7"/><text x="713.0" y="498.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="713.0" dy="0.0">застосунок</tspan><tspan x="713.0" dy="15.6">датаграма нарешті в буфері</tspan></text>
<text x="480.0" y="564.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">опція, поставлена не на тому поверсі, не дає ні помилки, ні ефекту</text>
</svg>