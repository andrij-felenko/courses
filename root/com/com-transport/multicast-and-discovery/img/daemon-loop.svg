<text x="300.0" y="530.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">поки в мережі тихо — програма спить у poll і не витрачає нічого</text>
