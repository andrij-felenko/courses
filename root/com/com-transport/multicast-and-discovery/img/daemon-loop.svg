<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 555" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="555" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Служба виявлення: один сокет, один цикл, три строки</text>
<rect x="160.0" y="60.0" width="440.0" height="66.0" rx="6" fill="#f7f9fc" stroke="#2457d6" stroke-width="1.8"/><text x="380.0" y="89.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">1 · getifaddrs(): перебрати інтерфейси</tspan><tspan x="380.0" dy="16.9">IP_ADD_MEMBERSHIP на КОЖНОМУ (imr_ifindex ≠ 0)</tspan></text>
<rect x="160.0" y="160.0" width="440.0" height="66.0" rx="6" fill="#f7f9fc" stroke="#2457d6" stroke-width="1.8"/><text x="380.0" y="189.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">2 · один сокет UDP: bind 0.0.0.0:7711</tspan><tspan x="380.0" dy="16.9">SO_REUSEADDR · IP_PKTINFO · IP_MULTICAST_TTL 1</tspan></text>
<rect x="160.0" y="260.0" width="440.0" height="66.0" rx="6" fill="#fffdf0" stroke="#b08900" stroke-width="1.8"/><text x="380.0" y="297.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="380.0" dy="0.0">3 · poll(sock, найближчий строк − зараз)</tspan></text>
<rect x="640.0" y="46.0" width="292.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="786.0" y="66.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="786.0" dy="0.0">eth0 · ifindex 2</tspan></text>
<rect x="640.0" y="86.0" width="292.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="786.0" y="106.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="786.0" dy="0.0">wlan0 · ifindex 3</tspan></text>
<rect x="640.0" y="126.0" width="292.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/><text x="786.0" y="146.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="786.0" dy="0.0">docker0 · ifindex 4 — теж група</tspan></text>
<line x1="606.0" y1="92.0" x2="634.0" y2="92.0" stroke="#333333" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="640.0" y="250.0" width="292.0" height="104.0" rx="6" fill="#fffdf0" stroke="#b08900" stroke-width="1.6"/><text x="786.0" y="282.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="786.0" dy="0.0">строк = найменший із трьох:</tspan><tspan x="786.0" dy="15.6">· наступне оголошення   40 с ±20 %</tspan><tspan x="786.0" dy="15.6">· відкладена відповідь   20–120 мс</tspan><tspan x="786.0" dy="15.6">· найближче протухання   120 с</tspan></text>
<line x1="606.0" y1="300.0" x2="634.0" y2="300.0" stroke="#333333" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="100.0" y="380.0" width="250.0" height="74.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.6"/><text x="225.0" y="405.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="225.0" dy="0.0">прийшов пакет</tspan><tspan x="225.0" dy="15.6">recvmsg + IP_PKTINFO → ifindex</tspan><tspan x="225.0" dy="15.6">оновити таблицю сусідів</tspan></text>
<rect x="410.0" y="380.0" width="250.0" height="74.0" rx="6" fill="#fdf0ee" stroke="#c0392b" stroke-width="1.6"/><text x="535.0" y="405.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="535.0" dy="0.0">минув строк</tspan><tspan x="535.0" dy="15.6">оголосити · відповісти</tspan><tspan x="535.0" dy="15.6">вичистити протухле</tspan></text>
<line x1="300.0" y1="328.0" x2="225.0" y2="376.0" stroke="#333333" stroke-width="1.7" marker-end="url(#arrow)"/>
