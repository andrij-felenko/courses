<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 780" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="780" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві долі одного винаходу: від 1985 до 2020 року</text>
<line x1="158.0" y1="100.0" x2="158.0" y2="676.0" stroke="#c9ced6" stroke-width="2.4"/>
<circle cx="113.0" cy="66.0" r="6.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="211.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">спільний корінь</text>
<circle cx="383.0" cy="66.0" r="6.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<text x="481.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">між доменами — згасає</text>
<circle cx="668.0" cy="66.0" r="6.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.4"/>
<text x="766.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">у сегменті — живе</text>
<text x="96.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1985</text>
<circle cx="158.0" cy="122.0" r="6.5" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<rect x="184.0" y="107.0" width="716.0" height="30.0" rx="6" fill="#f2f5fd" stroke="#2457d6" stroke-width="1.4"/><text x="542.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="542.0" dy="0.0">RFC 966: адреса називає групу, а не машину (Deering, Cheriton, Стенфорд)</tspan></text>
<text x="96.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1986</text>
<circle cx="158.0" cy="160.0" r="6.5" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<rect x="184.0" y="145.0" width="716.0" height="30.0" rx="6" fill="#f2f5fd" stroke="#2457d6" stroke-width="1.4"/><text x="542.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="542.0" dy="0.0">RFC 988: з'являється IGMP — вузол оголошує членство вголос</tspan></text>
<text x="96.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1988</text>
<circle cx="158.0" cy="198.0" r="6.5" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<rect x="184.0" y="183.0" width="716.0" height="30.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.4"/><text x="542.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="542.0" dy="0.0">DVMRP (RFC 1075): маршрутизація груп зі статусом Experimental</tspan></text>
<text x="96.0" y="241.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1989</text>
<circle cx="158.0" cy="236.0" r="6.5" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<rect x="184.0" y="221.0" width="716.0" height="30.0" rx="6" fill="#f2f5fd" stroke="#2457d6" stroke-width="1.4"/><text x="542.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="542.0" dy="0.0">RFC 1112 → STD 5: стандарт для вузлів, відображення на 01:00:5E</tspan></text>
<text x="96.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1992</text>
<circle cx="158.0" cy="274.0" r="6.5" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<rect x="184.0" y="259.0" width="716.0" height="30.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.4"/><text x="542.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="542.0" dy="0.0">MBone: тунелі поверх інтернету, звук із IETF у Сан-Дієго на ~20 майданчиків</tspan></text>
<text x="96.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">1996</text>
<circle cx="158.0" cy="312.0" r="6.5" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<rect x="184.0" y="297.0" width="716.0" height="30.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.4"/><text x="542.0" y="316.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="542.0" dy="0.0">RTP (RFC 1889): транспорт медіа, народжений на MBone</tspan></text>
<text x="96.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">1998</text>
<circle cx="158.0" cy="350.0" r="6.5" fill="#ffffff" stroke="#27ae60" stroke-width="2.4"/>
<rect x="184.0" y="335.0" width="716.0" height="30.0" rx="6" fill="#f1faf4" stroke="#27ae60" stroke-width="1.4"/><text x="542.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="542.0" dy="0.0">RFC 2365: смуга 239/8 — далі межі організації не йде</tspan></text>
<text x="96.0" y="393.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">1999</text>
<circle cx="158.0" cy="388.0" r="6.5" fill="#ffffff" stroke="#27ae60" stroke-width="2.4"/>
<rect x="184.0" y="373.0" width="716.0" height="30.0" rx="6" fill="#f1faf4" stroke="#27ae60" stroke-width="1.4"/><text x="542.0" y="392.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="542.0" dy="0.0">SSDP: чернетка Microsoft і HP; протухне, але піде в UPnP</tspan></text>
<text x="96.0" y="431.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2002</text>
<circle cx="158.0" cy="426.0" r="6.5" fill="#ffffff" stroke="#27ae60" stroke-width="2.4"/>
<rect x="184.0" y="411.0" width="716.0" height="30.0" rx="6" fill="#f1faf4" stroke="#27ae60" stroke-width="1.4"/><text x="542.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="542.0" dy="0.0">Apple Rendezvous у складі Mac OS X 10.2</tspan></text>
<text x="96.0" y="469.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2003</text>
<circle cx="158.0" cy="464.0" r="6.5" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<rect x="184.0" y="449.0" width="716.0" height="30.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.4"/><text x="542.0" y="468.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="542.0" dy="0.0">MSDP (RFC 3618): клей між доменами, статус Experimental назавжди</tspan></text>
<text x="96.0" y="507.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2005</text>
<circle cx="158.0" cy="502.0" r="6.5" fill="#ffffff" stroke="#27ae60" stroke-width="2.4"/>
<rect x="184.0" y="487.0" width="716.0" height="30.0" rx="6" fill="#f1faf4" stroke="#27ae60" stroke-width="1.4"/><text x="542.0" y="506.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="542.0" dy="0.0">перейменування на Bonjour після позову TIBCO</tspan></text>
<text x="96.0" y="545.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2006</text>
<circle cx="158.0" cy="540.0" r="6.5" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<rect x="184.0" y="525.0" width="716.0" height="30.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.4"/><text x="542.0" y="544.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="542.0" dy="0.0">SSM (RFC 4607): канал у 232/8 мусить назвати відправника</tspan></text>
<text x="96.0" y="583.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">2013</text>
<circle cx="158.0" cy="578.0" r="6.5" fill="#ffffff" stroke="#27ae60" stroke-width="2.4"/>
<rect x="184.0" y="563.0" width="716.0" height="30.0" rx="6" fill="#f1faf4" stroke="#27ae60" stroke-width="1.4"/><text x="542.0" y="582.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="542.0" dy="0.0">RFC 6762 і RFC 6763: mDNS і DNS-SD нарешті стандарт</tspan></text>
<text x="96.0" y="621.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2015</text>
<circle cx="158.0" cy="616.0" r="6.5" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<rect x="184.0" y="601.0" width="716.0" height="30.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.4"/><text x="542.0" y="620.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="542.0" dy="0.0">AMT (RFC 7450): знову тунель — як у MBone двадцять три роки перед тим</tspan></text>
<text x="96.0" y="659.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">2020</text>
<circle cx="158.0" cy="654.0" r="6.5" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<rect x="184.0" y="639.0" width="716.0" height="30.0" rx="6" fill="#fdf3f2" stroke="#c0392b" stroke-width="1.4"/><text x="542.0" y="658.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="542.0" dy="0.0">RFC 8815 (BCP 229): міждоменний ASM визнано застарілим</tspan></text>
<text x="470.0" y="716.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">спільний корінь один, а долі різні: між провайдерами — експеримент за експериментом,</text>
<text x="470.0" y="736.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">у межах сегмента — мільйони пристроїв, що працюють просто зараз</text>
</svg>