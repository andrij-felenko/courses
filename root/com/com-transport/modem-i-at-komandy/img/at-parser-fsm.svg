<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="100%" height="100%"><style>
        .bg { fill: #ffffff; }
        .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; }
        .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; }
        .box-state { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 8px; }
        .box-state-wait { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 8px; }
        .box-state-raw { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 8px; }
        .box-classifier { fill: #f8fafc; stroke: #475569; stroke-width: 1.5; rx: 6px; }
        .state-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; }
        .state-desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #334155; }
        .trans-line { stroke: #334155; stroke-width: 1.5; fill: none; }
        .trans-line-err { stroke: #dc2626; stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; }
        .trans-arrow { fill: #334155; }
        .trans-lbl { font-family: 'Consolas', monospace; font-size: 10px; font-weight: bold; fill: #1e293b; }
        .trans-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9.5px; fill: #64748b; }
    </style><rect width="100%" height="100%" class="bg" /><g transform="translate(0,0)"><text x="520" y="24" class="title" text-anchor="middle" font-size="15">Архітектура та кінцевий автомат (FSM) неблокуючого AT-парсера</text><text x="520" y="42" class="subtitle" text-anchor="middle" font-size="11">Розділення потоку відповідей на фінальні коди, проміжні дані, промпти ('&gt; ') та асинхронні URC</text><rect x="50" y="95" width="210" height="80" class="box-state" /><text x="155" y="121" class="state-title" text-anchor="middle" font-size="13">STATE_IDLE</text><text x="155" y="141" class="state-desc" text-anchor="middle" font-size="10">Очікування першого байта</text><text x="155" y="159" class="state-desc" text-anchor="middle" font-size="10">UART RX DMA → Ring Buffer</text><rect x="370" y="95" width="230" height="80" class="box-state" /><text x="485" y="121" class="state-title" text-anchor="middle" font-size="13">STATE_COLLECT_LINE</text><text x="485" y="141" class="state-desc" text-anchor="middle" font-size="10">Накопичення символів у буфер</text><text x="485" y="159" class="state-desc" text-anchor="middle" font-size="10">Пошук розділювача &lt;CR&gt;&lt;LF&gt;</text><line x1="260" y1="135" x2="370" y2="135" class="trans-line" /><polygon points="364,131 370,135 364,139" class="trans-arrow" /><text x="315" y="123" class="trans-lbl" text-anchor="middle" font-size="10">Новий байт</text><rect x="710" y="95" width="270" height="80" class="box-classifier" /><text x="845" y="120" class="state-title" text-anchor="middle" font-size="13">КЛАСИФІКАТОР РЯДКА</text><text x="845" y="140" class="state-desc" text-anchor="middle" font-size="10">Порівняння з таблицею URC</text><text x="845" y="157" class="state-desc" text-anchor="middle" font-size="10">та очікуваною командою</text><line x1="600" y1="135" x2="710" y2="135" class="trans-line" /><polygon points="704,131 710,135 704,139" class="trans-arrow" /><text x="655" y="123" class="trans-lbl" text-anchor="middle" font-size="10">&lt;CR&gt;&lt;LF&gt;</text><rect x="50" y="270" width="210" height="95" class="box-state-wait" /><text x="155" y="294" class="state-title" fill="#1d4ed8" text-anchor="middle" font-size="13">Фінальна відповідь</text><text x="155" y="314" class="trans-lbl" text-anchor="middle" font-size="10">OK / ERROR / CME/CMS</text><text x="155" y="335" class="state-desc" text-anchor="middle" font-size="10">Зняття блокування транзакції,</text><text x="155" y="352" class="state-desc" text-anchor="middle" font-size="10">зупинка тайм-ауту</text><rect x="285" y="270" width="210" height="95" class="box-state-wait" /><text x="390" y="294" class="state-title" fill="#1d4ed8" text-anchor="middle" font-size="13">Проміжні дані</text><text x="390" y="314" class="trans-lbl" text-anchor="middle" font-size="10">+CSQ: 24,99 / +QIRD: ...</text><text x="390" y="335" class="state-desc" text-anchor="middle" font-size="10">Копіювання у буфер результату</text><text x="390" y="352" class="state-desc" text-anchor="middle" font-size="10">поточної команди</text><rect x="520" y="270" width="220" height="95" class="box-state" /><text x="630" y="294" class="state-title" fill="#15803d" text-anchor="middle" font-size="13">Асинхронний URC</text><text x="630" y="314" class="trans-lbl" text-anchor="middle" font-size="10">+CREG: / +QIURC: / RING</text><text x="630" y="335" class="state-desc" text-anchor="middle" font-size="10">Виклик зареєстрованого callback</text><text x="630" y="352" class="state-desc" text-anchor="middle" font-size="10">НЕ впливає на очікування OK</text><rect x="765" y="270" width="215" height="95" class="box-state-raw" /><text x="872" y="294" class="state-title" fill="#b91c1c" text-anchor="middle" font-size="13">Промпт / Сирі дані</text><text x="872" y="314" class="trans-lbl" text-anchor="middle" font-size="10">'&gt; ' / Binary Payload</text><text x="872" y="335" class="state-desc" text-anchor="middle" font-size="10">Пряме пересилання N байт</text><text x="872" y="352" class="state-desc" text-anchor="middle" font-size="10">без пошуку &lt;CR&gt;&lt;LF&gt;</text><path d="M 740 175 L 740 210 L 155 210 L 155 270" class="trans-line" /><polygon points="151,264 155,270 159,264" class="trans-arrow" /><path d="M 780 175 L 780 225 L 390 225 L 390 270" class="trans-line" /><polygon points="386,264 285,270 394,264" class="trans-arrow" /><path d="M 820 175 L 820 240 L 630 240 L 630 270" class="trans-line" /><polygon points="626,264 520,270 634,264" class="trans-arrow" /><path d="M 890 175 L 890 270" class="trans-line" /><polygon points="886,264 890,270 894,264" class="trans-arrow" /><path d="M 155 365 L 155 430 L 155 430 L 155 175" class="trans-line" /><polygon points="151,181 155,175 159,181" class="trans-arrow" /><text x="215" y="422" class="trans-sub" text-anchor="middle" font-size="10">Повернення до очікування</text><path d="M 485 175 L 485 430 L 175 430" class="trans-line-err" /><text x="495" y="201" class="trans-lbl" fill="#dc2626" font-size="10">Тайм-аут (T &gt; 3000ms)</text><text x="495" y="217" class="trans-sub" fill="#dc2626" font-size="10">Скидання буфера й синхронізація</text></g></svg>