<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 450" width="100%" height="100%"><style>
        .bg { fill: #ffffff; }
        .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; }
        .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; }
        .box-frame { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; rx: 4px; }
        .box-field { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.2; rx: 3px; }
        .box-payload { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.2; rx: 3px; }
        .box-fcs { fill: #fdf2f8; stroke: #db2777; stroke-width: 1.2; rx: 3px; }
        .box-dlc { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 6px; }
        .lbl-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #0f172a; }
        .lbl-field { font-family: 'Consolas', monospace; font-size: 11px; font-weight: bold; fill: #1e293b; }
        .lbl-desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9.5px; fill: #475569; }
        .line-mux { stroke: #2563eb; stroke-width: 1.5; }
        .arrow-mux { fill: #2563eb; }
        .line-bus { stroke: #0f172a; stroke-width: 3; }
    </style><rect width="100%" height="100%" class="bg" /><g transform="translate(0,0)"><text x="520" y="24" class="title" text-anchor="middle" font-size="15">Мультиплексування GSM 07.10 (3GPP TS 27.010 CMUX)</text><text x="520" y="42" class="subtitle" text-anchor="middle" font-size="11">Одночасна передача IP-трафіку, AT-команд та GPS через один фізичний послідовний UART</text><text x="40" y="85" class="lbl-title" text-anchor="start" font-size="12">Структура фрейму CMUX (Basic Mode):</text><rect x="40" y="95" width="85" height="54" class="box-field" /><text x="82" y="116" class="lbl-field" text-anchor="middle" font-size="11">Flag</text><text x="82" y="134" class="lbl-desc" text-anchor="middle" font-size="10">0xF9 (1B)</text><rect x="130" y="95" width="140" height="54" class="box-field" /><text x="200" y="116" class="lbl-field" text-anchor="middle" font-size="11">Address</text><text x="200" y="134" class="lbl-desc" text-anchor="middle" font-size="10">DLCI + C/R (1B)</text><rect x="275" y="95" width="145" height="54" class="box-field" /><text x="347" y="116" class="lbl-field" text-anchor="middle" font-size="11">Control</text><text x="347" y="134" class="lbl-desc" text-anchor="middle" font-size="10">UIH / SABM (1B)</text><rect x="425" y="95" width="130" height="54" class="box-field" /><text x="490" y="116" class="lbl-field" text-anchor="middle" font-size="11">Length</text><text x="490" y="134" class="lbl-desc" text-anchor="middle" font-size="10">1 або 2 Байти</text><rect x="560" y="95" width="285" height="54" class="box-payload" /><text x="702" y="116" class="lbl-field" text-anchor="middle" font-size="11">Information (Payload)</text><text x="702" y="134" class="lbl-desc" text-anchor="middle" font-size="10">Дані віртуального каналу (N Байт)</text><rect x="850" y="95" width="90" height="54" class="box-fcs" /><text x="895" y="116" class="lbl-field" text-anchor="middle" font-size="11">FCS</text><text x="895" y="134" class="lbl-desc" text-anchor="middle" font-size="10">CRC-8 (1B)</text><rect x="945" y="95" width="85" height="54" class="box-field" /><text x="987" y="116" class="lbl-field" text-anchor="middle" font-size="11">Flag</text><text x="987" y="134" class="lbl-desc" text-anchor="middle" font-size="10">0xF9 (1B)</text><line x1="40" y1="280" x2="440" y2="280" class="line-bus" /><text x="240" y="268" class="lbl-title" text-anchor="middle" font-size="12">Фізичний UART (TXD / RXD, 921600 біт/с)</text><rect x="460" y="180" width="120" height="240" class="box-frame" fill="#f1f5f9" /><text x="520" y="295" class="lbl-title" text-anchor="middle" font-size="12">CMUX</text><text x="520" y="315" class="lbl-desc" text-anchor="middle" font-size="10">Демультиплексор</text><line x1="440" y1="280" x2="460" y2="280" class="line-bus" /><rect x="620" y="190" width="380" height="46" class="box-dlc" /><text x="635" y="209" class="lbl-title" font-size="11" text-anchor="start">DLC 0: Control Channel</text><text x="635" y="225" class="lbl-desc" font-size="10" text-anchor="start">Керування сесією CMUX, узгодження параметрів (PN, PSC, CLD)</text><line x1="580" y1="213" x2="620" y2="213" class="line-mux" /><polygon points="614,209 620,213 614,217" class="arrow-mux" /><rect x="620" y="250" width="380" height="46" class="box-dlc" /><text x="635" y="269" class="lbl-title" font-size="11" text-anchor="start">DLC 1: AT Commands &amp; URC</text><text x="635" y="285" class="lbl-desc" font-size="10" text-anchor="start">Синхронні AT-запити, читання RSSI (+CSQ), мережеві статуси</text><line x1="580" y1="273" x2="620" y2="273" class="line-mux" /><polygon points="614,269 620,273 614,277" class="arrow-mux" /><rect x="620" y="310" width="380" height="46" class="box-dlc" /><text x="635" y="329" class="lbl-title" font-size="11" text-anchor="start">DLC 2: High-Speed IP Data</text><text x="635" y="345" class="lbl-desc" font-size="10" text-anchor="start">Прозорий потік TCP/UDP або PPP (без переривання через '+++')</text><line x1="580" y1="333" x2="620" y2="333" class="line-mux" /><polygon points="614,329 620,333 614,337" class="arrow-mux" /><rect x="620" y="370" width="380" height="46" class="box-dlc" /><text x="635" y="389" class="lbl-title" font-size="11" text-anchor="start">DLC 3: GNSS / NMEA Stream</text><text x="635" y="405" class="lbl-desc" font-size="10" text-anchor="start">Асинхронні координати $GPRMC, $GPGGA у фоновому режимі</text><line x1="580" y1="393" x2="620" y2="393" class="line-mux" /><polygon points="614,389 620,393 614,397" class="arrow-mux" /></g></svg>