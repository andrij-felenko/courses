<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="100%" height="100%"><style>
        .bg { fill: #ffffff; }
        .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; }
        .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; }
        .box-lvl0 { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; rx: 6px; }
        .box-lvl1 { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; rx: 6px; }
        .box-lvl2 { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; rx: 6px; }
        .box-lvl3 { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.5; rx: 6px; }
        .box-lvl4 { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 6px; }
        .box-timing { fill: #f8fafc; stroke: #64748b; stroke-width: 1.2; rx: 6px; }
        .lvl-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #0f172a; }
        .lvl-desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 10px; fill: #475569; }
        .timing-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #0f172a; }
        .sig-name { font-family: 'Consolas', monospace; font-size: 10px; font-weight: bold; fill: #1e293b; }
        .sig-wave { stroke: #2563eb; stroke-width: 2; fill: none; }
        .sig-wave-pwr { stroke: #dc2626; stroke-width: 2; fill: none; }
        .sig-time { font-family: 'Consolas', monospace; font-size: 9px; fill: #64748b; }
        .arrow-down { fill: #64748b; }
        .line-down { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 3,3; }
    </style><rect width="100%" height="100%" class="bg" /><g transform="translate(0,0)"><text x="520" y="24" class="title" text-anchor="middle" font-size="15">Ескалаційна драбина відновлення модема та часові діаграми скидання</text><text x="520" y="42" class="subtitle" text-anchor="middle" font-size="11">Послідовність відновлення від програмного повтору до аварійного знеструмлення VBAT</text><rect x="30" y="70" width="440" height="70" class="box-lvl0" /><text x="45" y="96" class="lvl-title" font-size="12">Рівень 0: Програмний повтор і AT-пінг</text><text x="45" y="118" class="lvl-desc" font-size="10">Тайм-аут (3000 мс) → Очищення буфера UART → Повтор команди (до 3 разів)</text><line x1="250" y1="140" x2="250" y2="156" class="line-down" /><polygon points="246,152 250,156 254,152" class="arrow-down" /><rect x="30" y="156" width="440" height="70" class="box-lvl1" /><text x="45" y="182" class="lvl-title" font-size="12">Рівень 1: Програмний перезапуск (Soft Reset)</text><text x="45" y="204" class="lvl-desc" font-size="10">Команда AT+CFUN=1,1 або AT+QRST=1 → Коректне від'єднання від мережі</text><line x1="250" y1="226" x2="250" y2="242" class="line-down" /><polygon points="246,238 250,242 254,238" class="arrow-down" /><rect x="30" y="242" width="440" height="70" class="box-lvl2" /><text x="45" y="268" class="lvl-title" font-size="12">Рівень 2: Контрольований цикл PWRKEY</text><text x="45" y="290" class="lvl-desc" font-size="10">Імпульс PWRKEY Low (2.0 с) → Очікування STATUS=0 → Імпульс PWRKEY Low (1.5 с)</text><line x1="250" y1="312" x2="250" y2="328" class="line-down" /><polygon points="246,324 250,328 254,324" class="arrow-down" /><rect x="30" y="328" width="440" height="70" class="box-lvl3" /><text x="45" y="354" class="lvl-title" font-size="12">Рівень 3: Аварійне скидання (RESET Pin)</text><text x="45" y="376" class="lvl-desc" font-size="10">Імпульс RESET_N Low (150–500 мс) → Апаратний перезапуск процесора Baseband</text><line x1="250" y1="398" x2="250" y2="414" class="line-down" /><polygon points="246,410 250,414 254,410" class="arrow-down" /><rect x="30" y="414" width="440" height="70" class="box-lvl4" /><text x="45" y="440" class="lvl-title" font-size="12">Рівень 4: Повне знеструмлення (Cold Power Cut)</text><text x="45" y="462" class="lvl-desc" font-size="10">Розмикання P-MOSFET на VBAT на 5.0 с → Повний розряд конденсаторів 1000 µF</text><rect x="500" y="70" width="500" height="420" class="box-timing" /><text x="750" y="95" class="timing-title" text-anchor="middle" font-size="12">Часові діаграми апаратного керування (Timing)</text><text x="520" y="130" class="lvl-title" font-size="11">1. Запуск через PWRKEY (Power ON):</text><text x="525" y="155" class="sig-name" font-size="10">VBAT (3.8V)</text><path d="M 610 151 L 970 151" class="sig-wave-pwr" /><text x="525" y="185" class="sig-name" font-size="10">PWRKEY</text><path d="M 610 173 L 650 173 L 650 191 L 780 191 L 780 173 L 970 173" class="sig-wave" /><text x="715" y="207" class="sig-time" text-anchor="middle" font-size="9">t &gt; 1500 мс (Pull-Down)</text><text x="525" y="235" class="sig-name" font-size="10">STATUS</text><path d="M 610 241 L 810 241 L 810 225 L 970 225" class="sig-wave" /><text x="890" y="253" class="sig-time" text-anchor="middle" font-size="9">Модем активний</text><text x="520" y="310" class="lvl-title" font-size="11">2. Аварійне скидання (Hardware RESET):</text><text x="525" y="340" class="sig-name" font-size="10">RESET_N</text><path d="M 610 331 L 660 331 L 660 349 L 740 349 L 740 331 L 970 331" class="sig-wave" /><text x="700" y="365" class="sig-time" text-anchor="middle" font-size="9">150–500 мс</text><text x="525" y="395" class="sig-name" font-size="10">STATUS</text><path d="M 610 383 L 665 383 L 665 399 L 850 399 L 850 383 L 970 383" class="sig-wave" /><text x="760" y="413" class="sig-time" text-anchor="middle" font-size="9">Перезапуск Baseband (~2-5 с)</text><text x="520" y="450" class="lvl-desc" fill="#b91c1c" font-weight="bold" font-size="10">УВАГА: RESET_N не скидає буфери флеш-пам'яті (ризик пошкодження NVRAM).</text><text x="520" y="467" class="lvl-desc" fill="#b91c1c" font-size="10">Застосовувати лише у разі повної відсутності реакції на UART та PWRKEY.</text></g></svg>