<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 530" width="100%" height="100%"><style>
        .bg { fill: #ffffff; }
        .box-mcu { fill: #f8fafc; stroke: #2563eb; stroke-width: 2; rx: 8px; }
        .box-modem { fill: #f8fafc; stroke: #dc2626; stroke-width: 2; rx: 8px; }
        .box-pwr { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.5; rx: 6px; }
        .box-shifter { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4,4; rx: 6px; }
        .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; }
        .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #475569; }
        .hdr-mcu { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #1d4ed8; }
        .hdr-modem { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #b91c1c; }
        .sig-lbl { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; font-weight: bold; fill: #1e293b; }
        .sig-desc { font-family: 'Segoe UI', Arial, sans-serif; font-size: 9.5px; fill: #475569; }
        .line-data { stroke: #2563eb; stroke-width: 1.8; }
        .line-ctrl { stroke: #059669; stroke-width: 1.5; }
        .line-pwr { stroke: #dc2626; stroke-width: 2.2; }
        .line-pwr-dim { stroke: #ea580c; stroke-width: 1.5; }
        .arrow-data { fill: #2563eb; }
        .arrow-ctrl { fill: #059669; }
        .arrow-pwr { fill: #dc2626; }
    </style><rect width="100%" height="100%" class="bg" /><g transform="translate(0,0)"><text x="520" y="24" class="title" text-anchor="middle" font-size="15">Апаратний інтерфейс зв'язку хост-мікроконтролера зі стільниковим модемом</text><text x="520" y="42" class="subtitle" text-anchor="middle" font-size="11">Розподіл живлення VBAT, рівнів 3.3V / 1.8V, повнодуплексного UART та сигналів керування</text><rect x="30" y="65" width="230" height="440" class="box-mcu" /><text x="145" y="89" class="hdr-mcu" text-anchor="middle" font-size="13">Хост-мікроконтролер (MCU)</text><text x="145" y="105" class="sig-desc" text-anchor="middle" font-size="10">Логічні рівні: 3.3V CMOS</text><rect x="780" y="65" width="230" height="440" class="box-modem" /><text x="895" y="89" class="hdr-modem" text-anchor="middle" font-size="13">Стільниковий модем (DCE)</text><text x="895" y="105" class="sig-desc" text-anchor="middle" font-size="10">Baseband I/O: 1.8V (V_GLOBAL_IO)</text><rect x="380" y="135" width="280" height="370" class="box-shifter" /><text x="520" y="155" class="title" text-anchor="middle" font-size="12">Зсувач рівнів (3.3V ⇄ 1.8V)</text><text x="520" y="170" class="sig-desc" text-anchor="middle" font-size="10">TXS0108E / SN74AVC4T245 (без автовизначення на RTS/CTS)</text><rect x="380" y="65" width="280" height="55" class="box-pwr" /><text x="520" y="85" class="hdr-modem" text-anchor="middle" font-size="12">Джерело VBAT (3.8V, I_peak = 2.0A)</text><text x="520" y="103" class="sig-desc" text-anchor="middle" font-size="10">1000 µF Low-ESR + 100 nF кераміка біля пінів</text><line x1="660" y1="92" x2="780" y2="92" class="line-pwr" /><polygon points="774,88 780,92 774,96" class="arrow-pwr" /><text x="790" y="96" class="sig-lbl" fill="#dc2626" font-size="11">VBAT</text><line x1="380" y1="92" x2="260" y2="92" class="line-pwr-dim" /><text x="190" y="96" class="sig-lbl" fill="#ea580c" font-size="11">VCC 3.3V</text><text x="40" y="199" class="sig-lbl" font-size="11">TXD (UART TX)</text><text x="1000" y="199" class="sig-lbl" text-anchor="end" font-size="11">RXD (UART RX)</text><line x1="260" y1="195" x2="380" y2="195" class="line-data" /><line x1="380" y1="195" x2="660" y2="195" class="line-data" stroke-dasharray="2,2" /><line x1="660" y1="195" x2="780" y2="195" class="line-data" /><polygon points="774,191 780,195 774,199" class="arrow-data" /><text x="520" y="191" class="sig-desc" text-anchor="middle" font-size="10">Команди хоста (DTE → DCE)</text><text x="40" y="234" class="sig-lbl" font-size="11">RXD (UART RX)</text><text x="1000" y="234" class="sig-lbl" text-anchor="end" font-size="11">TXD (UART TX)</text><line x1="260" y1="230" x2="380" y2="230" class="line-data" /><line x1="380" y1="230" x2="660" y2="230" class="line-data" stroke-dasharray="2,2" /><line x1="660" y1="230" x2="780" y2="230" class="line-data" /><polygon points="266,226 260,230 266,234" class="arrow-data" /><text x="520" y="226" class="sig-desc" text-anchor="middle" font-size="10">Відповіді й URC (DCE → DTE)</text><text x="40" y="269" class="sig-lbl" font-size="11">RTS (Out)</text><text x="1000" y="269" class="sig-lbl" text-anchor="end" font-size="11">RTS (In)</text><line x1="260" y1="265" x2="380" y2="265" class="line-data" /><line x1="380" y1="265" x2="660" y2="265" class="line-data" stroke-dasharray="2,2" /><line x1="660" y1="265" x2="780" y2="265" class="line-data" /><polygon points="774,261 780,265 774,269" class="arrow-data" /><text x="520" y="261" class="sig-desc" text-anchor="middle" font-size="10">Хост готовий приймати</text><text x="40" y="304" class="sig-lbl" font-size="11">CTS (In)</text><text x="1000" y="304" class="sig-lbl" text-anchor="end" font-size="11">CTS (Out)</text><line x1="260" y1="300" x2="380" y2="300" class="line-data" /><line x1="380" y1="300" x2="660" y2="300" class="line-data" stroke-dasharray="2,2" /><line x1="660" y1="300" x2="780" y2="300" class="line-data" /><polygon points="266,296 260,300 266,304" class="arrow-data" /><text x="520" y="296" class="sig-desc" text-anchor="middle" font-size="10">Модем готовий приймати</text><text x="40" y="339" class="sig-lbl" font-size="11">DTR (Sleep/Esc)</text><text x="1000" y="339" class="sig-lbl" text-anchor="end" font-size="11">DTR (In)</text><line x1="260" y1="335" x2="380" y2="335" class="line-ctrl" /><line x1="380" y1="335" x2="660" y2="335" class="line-ctrl" stroke-dasharray="2,2" /><line x1="660" y1="335" x2="780" y2="335" class="line-ctrl" /><polygon points="774,331 780,335 774,339" class="arrow-ctrl" /><text x="520" y="331" class="sig-desc" text-anchor="middle" font-size="10">Керування сном і вихід із Data Mode</text><text x="40" y="374" class="sig-lbl" font-size="11">RI (Ring/Wake)</text><text x="1000" y="374" class="sig-lbl" text-anchor="end" font-size="11">RI (Out)</text><line x1="260" y1="370" x2="380" y2="370" class="line-ctrl" /><line x1="380" y1="370" x2="660" y2="370" class="line-ctrl" stroke-dasharray="2,2" /><line x1="660" y1="370" x2="780" y2="370" class="line-ctrl" /><polygon points="266,366 260,370 266,374" class="arrow-ctrl" /><text x="520" y="366" class="sig-desc" text-anchor="middle" font-size="10">Імпульс URC для пробудження MCU</text><text x="40" y="409" class="sig-lbl" font-size="11">PWRKEY (Open-Drn)</text><text x="1000" y="409" class="sig-lbl" text-anchor="end" font-size="11">PWRKEY (In)</text><line x1="260" y1="405" x2="380" y2="405" class="line-ctrl" /><line x1="380" y1="405" x2="660" y2="405" class="line-ctrl" stroke-dasharray="2,2" /><line x1="660" y1="405" x2="780" y2="405" class="line-ctrl" /><polygon points="774,401 780,405 774,409" class="arrow-ctrl" /><text x="520" y="401" class="sig-desc" text-anchor="middle" font-size="10">Імпульс увімкнення/вимкнення</text><text x="40" y="444" class="sig-lbl" font-size="11">RESET_N (Open-Drn)</text><text x="1000" y="444" class="sig-lbl" text-anchor="end" font-size="11">RESET_N (In)</text><line x1="260" y1="440" x2="380" y2="440" class="line-ctrl" /><line x1="380" y1="440" x2="660" y2="440" class="line-ctrl" stroke-dasharray="2,2" /><line x1="660" y1="440" x2="780" y2="440" class="line-ctrl" /><polygon points="774,436 780,440 774,444" class="arrow-ctrl" /><text x="520" y="436" class="sig-desc" text-anchor="middle" font-size="10">Аварійне апаратне скидання</text><text x="40" y="479" class="sig-lbl" font-size="11">STATUS (In)</text><text x="1000" y="479" class="sig-lbl" text-anchor="end" font-size="11">STATUS (Out)</text><line x1="260" y1="475" x2="380" y2="475" class="line-ctrl" /><line x1="380" y1="475" x2="660" y2="475" class="line-ctrl" stroke-dasharray="2,2" /><line x1="660" y1="475" x2="780" y2="475" class="line-ctrl" /><polygon points="266,471 260,475 266,479" class="arrow-ctrl" /><text x="520" y="471" class="sig-desc" text-anchor="middle" font-size="10">Індикація активності Baseband</text></g></svg>