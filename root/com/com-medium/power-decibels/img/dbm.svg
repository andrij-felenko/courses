<text x="438.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">1 мВт</text>
<line x1="554.0" y1="143.0" x2="554.0" y2="157.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="554.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">+20</text>
<text x="554.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">100 мВт</text>
<line x1="670.0" y1="143.0" x2="670.0" y2="157.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="670.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">+30</text>
<text x="670.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">1 Вт</text>
<text x="438.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">точка відліку: 0 dBm = 1 мВт</text>
<rect x="80.0" y="214.0" width="600.0" height="52.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="380.0" y="236.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">Маленька «m» = «відносно 1 мВт». Від'ємні dBm — слабші за 1 мВт сигнали;</tspan><tspan x="380.0" dy="15.0">чим глибше в мінус, тим слабший. Уся «трильйонність» лягає в +30…−110 dBm.</tspan></text>
</svg>