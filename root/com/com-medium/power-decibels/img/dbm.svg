<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">dBm — абсолютна потужність відносно 1 мілівата</text>
<line x1="90.0" y1="150.0" x2="670.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0"/>
<line x1="650.0" y1="150.0" x2="670.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="90.0" y1="143.0" x2="90.0" y2="157.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="90.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">−90 dBm</text>
<text x="90.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">1 пВт</text>
<line x1="206.0" y1="143.0" x2="206.0" y2="157.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="206.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">−60</text>
<text x="206.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1 нВт</text>
<line x1="322.0" y1="143.0" x2="322.0" y2="157.0" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="322.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">−30</text>
<text x="322.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1 мкВт</text>
<line x1="438.0" y1="143.0" x2="438.0" y2="157.0" stroke="#1a1a1a" stroke-width="1.4"/>
