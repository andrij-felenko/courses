<rect x="200.0" y="147.0" width="380.0" height="28.0" rx="6" fill="#fff9e6" stroke="#d4ac0d" stroke-width="1.5"/><text x="390.0" y="157.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7d6608" text-anchor="middle"><tspan x="390.0" dy="0.0">Контур зворотного струму (визначає паразитну L і чутливість до завад)</tspan></text>
<rect x="45.0" y="225.0" width="330.0" height="95.0" rx="6" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="250.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Прямий і зворотний струми:</tspan><tspan x="210.0" dy="13.0">Сигнал існує не сам по собі, а як різниця потенціалів</tspan><tspan x="210.0" dy="13.0">між доріжкою та землею. Зворотний струм тече</tspan><tspan x="210.0" dy="13.0">найкоротшим шляхом під доріжкою. Якщо земля</tspan><tspan x="210.0" dy="13.0">віддалена — площа петлі S зростає, а з нею й L.</tspan></text>
<rect x="405.0" y="225.0" width="330.0" height="95.0" rx="6" fill="#fdfefe" stroke="#333333" stroke-width="1.5"/><text x="570.0" y="247.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Розподілені параметри (L_line, C_line):</tspan><tspan x="570.0" dy="14.3">Кожен міліметр провідника має власну ємність</tspan><tspan x="570.0" dy="14.3">на землю (~1 пФ/см) та індуктивність (~5 нГн/см).</tspan><tspan x="570.0" dy="14.3">Вони формують хвильовий опір Z₀ = √(L/C)</tspan><tspan x="570.0" dy="14.3">і визначають швидкість поширення сигналу v.</tspan></text>
<rect x="45.0" y="335.0" width="690.0" height="85.0" rx="6" fill="#f4f6f8" stroke="#475569" stroke-width="1.5"/><text x="390.0" y="367.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Головний висновок: Одностороння лінія завжди складається з ДВОХ провідників — сигнального</tspan><tspan x="390.0" dy="13.7">і опорного (GND). Будь-який розрив полігону землі або довгий тонкий провід GND збільшує площу петлі,</tspan><tspan x="390.0" dy="13.7">збільшує паразитну індуктивність L_line і перетворює з'єднання на антену для наведення та випромінювання шумів.</tspan></text>
</svg>