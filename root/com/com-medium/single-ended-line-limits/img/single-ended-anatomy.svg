<text x="390.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Опорний провідник землі (GND Plane / Return Path)</text>
<line x1="470.0" y1="178.0" x2="410.0" y2="178.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
