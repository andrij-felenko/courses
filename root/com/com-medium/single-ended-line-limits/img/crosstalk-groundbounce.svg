<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 790 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="790" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Паразитні зв'язки: перехресні наведення (Crosstalk) та підстрибування землі (SSN)</text>
<text x="195.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. Наведення між лініями (Crosstalk)</text>
<line x1="45.0" y1="95.0" x2="345.0" y2="95.0" stroke="#c0392b" stroke-width="2.4"/>
<text x="45.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Агресор (швидкий фронт dV/dt, di/dt)</text>
<line x1="45.0" y1="160.0" x2="345.0" y2="160.0" stroke="#2457d6" stroke-width="2.4"/>
<text x="45.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">Жертва (тиха лінія '0' або '1')</text>
<line x1="140.0" y1="95.0" x2="140.0" y2="120.0" stroke="#b03a2e" stroke-width="1.2"/>
<line x1="130.0" y1="120.0" x2="150.0" y2="120.0" stroke="#b03a2e" stroke-width="1.6"/>
<line x1="130.0" y1="126.0" x2="150.0" y2="126.0" stroke="#b03a2e" stroke-width="1.6"/>
<line x1="140.0" y1="126.0" x2="140.0" y2="160.0" stroke="#b03a2e" stroke-width="1.2"/>
<text x="160.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b03a2e" text-anchor="start">C_m (ємнісний струм i = C_m·dV/dt)</text>
<circle cx="260.0" cy="127.0" r="10.0" fill="none" stroke="#b03a2e" stroke-width="1.4"/>
<text x="260.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b03a2e" text-anchor="middle" font-weight="700">M</text>
<text x="278.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b03a2e" text-anchor="start">L_m (ЕРС v = L_m·di/dt)</text>
<line x1="45.0" y1="220.0" x2="170.0" y2="220.0" stroke="#2457d6" stroke-width="1.8"/>
<line x1="170.0" y1="220.0" x2="190.0" y2="195.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="190.0" y1="195.0" x2="210.0" y2="220.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="210.0" y1="220.0" x2="345.0" y2="220.0" stroke="#2457d6" stroke-width="1.8"/>
<text x="195.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Хибний імпульс (Glitch)!</text>
<text x="585.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">2. Підстрибування землі (Ground Bounce)</text>
<rect x="430.0" y="85.0" width="150.0" height="125.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="505.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мікроконтролер (IC)</text>
<line x1="580.0" y1="125.0" x2="710.0" y2="125.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="670.0" y1="125.0" x2="610.0" y2="125.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="580.0" y1="145.0" x2="710.0" y2="145.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="670.0" y1="145.0" x2="610.0" y2="145.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="580.0" y1="165.0" x2="710.0" y2="165.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="670.0" y1="165.0" x2="610.0" y2="165.0" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="645.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">N ліній: '1' → '0'</text>
<text x="645.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Сумарний струм N · di/dt</text>
<line x1="480.0" y1="190.0" x2="480.0" y2="210.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="472.0" y1="210.0" x2="488.0" y2="210.0" stroke="#7c3aed" stroke-width="3.5"/>
<text x="500.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c3aed" text-anchor="start" font-weight="700">L_pkg (1–5 нГн)</text>
<line x1="480.0" y1="215.0" x2="480.0" y2="235.0" stroke="#6b7280" stroke-width="2.0"/>
<line x1="460.0" y1="235.0" x2="500.0" y2="235.0" stroke="#6b7280" stroke-width="2.5"/>
<text x="505.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">GND_die ≠ GND_pcb</text>
<text x="505.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">V_bounce = N·L·(di/dt)</text>
<line x1="390.0" y1="50.0" x2="390.0" y2="260.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
<rect x="45.0" y="265.0" width="330.0" height="85.0" rx="6" fill="#fdfefe" stroke="#6b7280" stroke-width="1.5"/><text x="210.0" y="292.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Захист від перехресних наведень:</tspan><tspan x="210.0" dy="12.3">• Правило 3W (відстань між трасами ≥ 3 ширини).</tspan><tspan x="210.0" dy="12.3">• Копланарне екранування (доріжка землі між лініями).</tspan><tspan x="210.0" dy="12.3">• Чергування сигнальних жил і землі в шлейфі (S-G-S-G).</tspan></text>
<rect x="405.0" y="265.0" width="330.0" height="85.0" rx="6" fill="#fdfefe" stroke="#6b7280" stroke-width="1.5"/><text x="570.0" y="292.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="570.0" dy="0.0">Захист від підстрибування землі:</tspan><tspan x="570.0" dy="12.3">• Блокувальні керамічні конденсатори впритул до чіпа.</tspan><tspan x="570.0" dy="12.3">• Кілька виводів GND у корпусі паралельно (BGA/QFN).</tspan><tspan x="570.0" dy="12.3">• Програмне обмеження швидкості наростання (Slew Rate).</tspan></text>
<rect x="45.0" y="365.0" width="690.0" height="80.0" rx="6" fill="#f4f6f8" stroke="#475569" stroke-width="1.5"/><text x="390.0" y="394.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Спільний наслідок: І Crosstalk, і Ground Bounce створюють хибні сплески напруги на спокійних лініях.</tspan><tspan x="390.0" dy="14.3">Якщо сплеск перевищує поріг логічного перемикання V_IL (зазвичай ~0.8 В для 3.3 В логіки),</tspan><tspan x="390.0" dy="14.3">мікроконтролер фіксує фантомне переривання або бітову помилку в сусідньому інтерфейсі.</tspan></text>
</svg>