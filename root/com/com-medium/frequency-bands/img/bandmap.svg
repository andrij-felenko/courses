<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 710 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="710" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="350.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Карта діапазонів: угору за частотою — менше дальності, більше даних</text>
<rect x="150.0" y="70.0" width="360.0" height="44.0" rx="5" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/>
<text x="160.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">AM/MF ~1 МГц</text>
<text x="160.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">величезна дальність, крихта даних (радіо)</text>
<rect x="150.0" y="122.0" width="360.0" height="44.0" rx="5" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/>
<text x="160.0" y="141.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">HF/КХ 3–30 МГц</text>
<text x="160.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">відбивається від іоносфери — дістає глобально</text>
<rect x="150.0" y="174.0" width="360.0" height="44.0" rx="5" fill="#f4f6f8" stroke="#2457d6" stroke-width="2.0"/>
<text x="160.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">VHF/UHF</text>
<text x="160.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">FM, ТБ, рації — помірно</text>
<rect x="150.0" y="226.0" width="360.0" height="44.0" rx="5" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/>
<text x="160.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">433/868/915 МГц</text>
<text x="160.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">далеко й крізь стіни, мало даних (LoRa)</text>
<rect x="150.0" y="278.0" width="360.0" height="44.0" rx="5" fill="#f4f6f8" stroke="#27ae60" stroke-width="2.0"/>
<text x="160.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">2.4 ГГц</text>
<text x="160.0" y="314.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">помірна дальність і дані (Wi-Fi, BT)</text>
<rect x="150.0" y="330.0" width="360.0" height="44.0" rx="5" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<text x="160.0" y="349.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">5 ГГц</text>
<text x="160.0" y="366.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">багато даних, мала дальність</text>
<rect x="150.0" y="382.0" width="360.0" height="44.0" rx="5" fill="#f4f6f8" stroke="#c0392b" stroke-width="2.0"/>
<text x="160.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">мм-хвилі 24–60 ГГц</text>
<text x="160.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">гігабіти лише в межах кімнати (5G, радари)</text>
<line x1="538.0" y1="426.0" x2="538.0" y2="70.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="554.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="554.0" dy="0.0">частота</tspan><tspan x="554.0" dy="14.3">↑</tspan></text>
<line x1="120.0" y1="70.0" x2="120.0" y2="426.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="104.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="end"><tspan x="104.0" dy="0.0">дальність</tspan><tspan x="104.0" dy="14.3">↑</tspan></text>
</svg>