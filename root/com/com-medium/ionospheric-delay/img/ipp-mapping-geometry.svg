<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="840" height="450">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/></marker></defs>
<rect x="0.0" y="0.0" width="840.0" height="450.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0.0"/>
<text x="420.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="700">Геометрія проходження радіопроменя крізь тонкий шар іоносфери (IPP)</text>
<path d="M 30 350 A 760 760 0 0 1 460 302" fill="none" stroke="#0f172a" stroke-width="2.5"/>
<text x="180.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0f172a" text-anchor="middle" font-weight="700">Поверхня Землі (R_E ≈ 6371 км)</text>
<circle cx="230.0" cy="302.0" r="7.0" fill="#dc2626" stroke="#0f172a" stroke-width="1.5"/>
<text x="215.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="end" font-weight="700">Приймач (Rx)</text>
<path d="M 30 240 A 870 870 0 0 1 480 190" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,4"/>
<text x="430.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700">Тонкий шар іоносфери (hm = 350 км)</text>
<rect x="590.0" y="65.0" width="40.0" height="20.0" rx="3" fill="#334155" stroke="#0f172a" stroke-width="1.0"/>
<text x="610.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">Супутник (Sat)</text>
<line x1="610.0" y1="75.0" x2="230.0" y2="302.0" stroke="#2563eb" stroke-width="2.0"/>
<circle cx="450.4" cy="170.3" r="6.0" fill="#d97706" stroke="#0f172a" stroke-width="1.5"/>
<text x="462.4" y="158.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700">IPP (пробійна точка)</text>
<line x1="450.4" y1="125.3" x2="450.4" y2="225.3" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="440.4" y="210.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="end" font-weight="700">VTEC (зенитний)</text>
<line x1="230.0" y1="222.0" x2="230.0" y2="322.0" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="220.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="end">Зенит</text>
<text x="305.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle" font-weight="700">e (елевація)</text>
<text x="245.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">z</text>
<rect x="482.7" y="320.9" width="314.7" height="88.2" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/><text x="640.0" y="340.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle"><tspan x="640.0" dy="0.0">Похилий промінь: STEC = F(e) · VTEC</tspan><tspan x="640.0" dy="14.3"></tspan><tspan x="640.0" dy="14.3">Картографічний фактор F(e):</tspan><tspan x="640.0" dy="14.3">F(e) = 1 / sqrt(1 − (R_E·cos(e) / (R_E + hm))²)</tspan><tspan x="640.0" dy="14.3">Зростає від 1.0 (зенит) до ~3.0 (горизонт)</tspan></text>
 </svg>