<rect x="450.0" y="60.0" width="250.0" height="270.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="575.0" y="155.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">• Елемент площі сфери:</tspan><tspan x="575.0" dy="14.3">  dA = r² · sin(θ) · dθ · dϕ</tspan><tspan x="575.0" dy="14.3">• Повна потужність P_rad:</tspan><tspan x="575.0" dy="14.3">  ∫ ∫ U(θ,ϕ)·sin(θ) dθ dϕ</tspan><tspan x="575.0" dy="14.3">• sin(θ) стискає площу біля полюсів</tspan><tspan x="575.0" dy="14.3">• Рівновіддалена сітка вимагає</tspan><tspan x="575.0" dy="14.3">  вагових коефіцієнтів sin(θ_i)</tspan></text>
