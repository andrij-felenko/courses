<rect x="460.0" y="60.0" width="240.0" height="270.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="580.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">• Форма: симетричний тор (бублик)</tspan><tspan x="580.0" dy="13.0">• U(θ) = U_max · sin²(θ)</tspan><tspan x="580.0" dy="13.0">• Азимутальна симетрія</tspan><tspan x="580.0" dy="13.0">• Нулі: уздовж дроту (θ=0°, 180°)</tspan><tspan x="580.0" dy="13.0">• Максимум: впоперек (θ=90°)</tspan><tspan x="580.0" dy="13.0">• Підсилення: D_max = 1.64 (2.15 дБі)</tspan></text>
