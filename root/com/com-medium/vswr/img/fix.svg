<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
<rect width="900" height="320" fill="#ffffff"/>
<defs>
  <marker id="aInk" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1b1b1b"/></marker>
  <marker id="aRed" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#c0271e"/></marker>
  <marker id="aBlue" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f47b5"/></marker>
  <marker id="aGreen" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#1f8a3b"/></marker>
  <marker id="aGrey" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#8a8a8a"/></marker>
  <marker id="aAmb" markerWidth="11" markerHeight="11" refX="8" refY="3.2" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8.5,3.2 L0,6.4 Z" fill="#b08900"/></marker>
</defs>
<text x="450.0" y="34.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="19" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Як полагодити неузгодження</text>
<text x="450.0" y="56.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="italic">три рівні дій — від найпростішого до тонкого налаштування</text>
<rect x="50.0" y="86.0" width="270.0" height="180.0" rx="12" fill="#fbfbfb" stroke="#1f8a3b" stroke-width="2"/>
<circle cx="82.0" cy="118.0" r="16.0" fill="#1f8a3b" stroke="#1f8a3b" stroke-width="0"/>
<text x="82.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="106.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f8a3b" text-anchor="start" font-weight="bold" font-style="normal">Правильна довжина</text>
<text x="185.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Підстрой антену до резонансу</text>
<text x="185.0" y="181.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">— часто КСХ падає сам собою.</text>
<text x="185.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<rect x="340.0" y="86.0" width="270.0" height="180.0" rx="12" fill="#fbfbfb" stroke="#1f47b5" stroke-width="2"/>
<circle cx="372.0" cy="118.0" r="16.0" fill="#1f47b5" stroke="#1f47b5" stroke-width="0"/>
<text x="372.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<text x="396.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1f47b5" text-anchor="start" font-weight="bold" font-style="normal">Правильні 50 Ом</text>
<text x="475.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">Той самий опір по всій трасі:</text>
<text x="475.0" y="181.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">кабель, роз'єми, доріжка</text>
<text x="475.0" y="200.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">один «не той» кабель псує все.</text>
<text x="475.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<rect x="630.0" y="86.0" width="270.0" height="180.0" rx="12" fill="#fbfbfb" stroke="#b08900" stroke-width="2"/>
<circle cx="662.0" cy="118.0" r="16.0" fill="#b08900" stroke="#b08900" stroke-width="0"/>
<text x="662.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<text x="686.0" y="124.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#b08900" text-anchor="start" font-weight="bold" font-style="normal">Узгоджувальна ланка</text>
<text x="765.0" y="162.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">L-ланка, шлейф або балун</text>
<text x="765.0" y="181.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.3" fill="#1b1b1b" text-anchor="middle" font-weight="normal" font-style="normal">«перетворюють» опір до Z₀.</text>
<text x="765.0" y="246.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" fill="#8a8a8a" text-anchor="middle" font-weight="normal" font-style="normal"></text>
<text x="450.0" y="300.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#1b1b1b" text-anchor="middle" font-weight="bold" font-style="normal">Ціль — КСХ &lt; 1.5…2 на робочій частоті. Тоді майже вся потужність іде в антену, а передавач у безпеці.</text>
</svg>
