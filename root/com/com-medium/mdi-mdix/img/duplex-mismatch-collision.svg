<svg xmlns="http://www.w3.org/2000/svg" viewBox="-130.4 -10 1249.4 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-130.4" y="-10" width="1249.4" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм та наслідки розсинхронізації дуплексу (Duplex Mismatch)</text>
<text x="470.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Чому виникають пізні колізії (Late Collisions), втрачаються кадри і колапсує пропускна здатність TCP</text>
<rect x="78.6" y="64.3" width="182.8" height="71.4" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/><text x="170.0" y="83.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0.0">Вузол A: Full Duplex (FD)</tspan><tspan x="170.0" dy="13.7">(Примусово або комутатор)</tspan><tspan x="170.0" dy="13.7">CSMA/CD ВИМКНЕНО</tspan><tspan x="170.0" dy="13.7">Передає будь-коли!</tspan></text>
<rect x="662.4" y="64.3" width="215.3" height="71.4" rx="6" fill="#fff1f2" stroke="#c0392b" stroke-width="1.5"/><text x="770.0" y="83.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Вузол B: Half Duplex (HD)</tspan><tspan x="770.0" dy="13.7">(Внаслідок Parallel Detection)</tspan><tspan x="770.0" dy="13.7">CSMA/CD УВІМКНЕНО</tspan><tspan x="770.0" dy="13.7">Слухає колізії (RX+TX)</tspan></text>
<line x1="170.0" y1="150.0" x2="170.0" y2="515.0" stroke="#2457d6" stroke-width="2.0"/>
<line x1="770.0" y1="150.0" x2="770.0" y2="515.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="785.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">1. Вузол B перевіряє лінію (вільно) і починає передачу кадру</text>
<line x1="770.0" y1="190.0" x2="190.0" y2="225.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="470.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle">Кадр від B ──► (передано 64 байти / вікно колізії минуло)</text>
<text x="155.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="end" font-weight="700">2. Вузол A отримує пакет від ОС і починає передачу!</text>
<text x="155.0" y="259.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="end">(Full Duplex не виконує Carrier Sense)</text>
<line x1="170.0" y1="255.0" x2="750.0" y2="290.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<circle cx="720.0" cy="300.0" r="14.0" fill="#fee2e2" stroke="#c0392b" stroke-width="2.0"/>
<text x="720.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">💥</text>
<text x="745.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">3. КОЛІЗІЯ на вузлі B!</text>
<text x="745.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Сталася після передачі 64 байтів (Late Collision)</text>
<rect x="180.7" y="349.0" width="578.6" height="82.0" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="470.0" y="367.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Катастрофічні наслідки Duplex Mismatch на мережевих рівнях:</tspan><tspan x="470.0" dy="13.0">• Half Duplex (B) фіксує Late Collision: MAC НЕ ПОВТОРЮЄ передачу (кадр викидається);</tspan><tspan x="470.0" dy="13.0">• Full Duplex (A) отримує понівечений фрагмент: викидає через помилку FCS / CRC;</tspan><tspan x="470.0" dy="13.0">• Ping (ICMP) проходить (1 пакет/с, нульова ймовірність колізії), але потік TCP гине:</tspan><tspan x="470.0" dy="13.0">  втрати пакетів ACK викликають таймаути RTO, вікно згортається до 1 MSS, швидкість падає до нуля!</tspan></text>
</svg>