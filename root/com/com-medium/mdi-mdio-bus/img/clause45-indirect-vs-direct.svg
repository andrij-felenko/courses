<text x="62.5" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">PRE</text>
<rect x="85.0" y="80.0" width="55.0" height="24.0" rx="2" fill="#fadbd8" stroke="#333333" stroke-width="1.1"/>
<text x="112.5" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">ST (00)</text>
<rect x="140.0" y="80.0" width="55.0" height="24.0" rx="2" fill="#aed6f1" stroke="#333333" stroke-width="1.1"/>
<text x="167.5" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">OP (00)</text>
