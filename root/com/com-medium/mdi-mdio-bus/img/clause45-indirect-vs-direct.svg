<text x="232.5" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">PRTAD (5б)</text>
<rect x="270.0" y="80.0" width="75.0" height="24.0" rx="2" fill="#fdebd0" stroke="#333333" stroke-width="1.1"/>
<text x="307.5" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">DEVAD (5б)</text>
<rect x="345.0" y="80.0" width="50.0" height="24.0" rx="2" fill="#fadbd8" stroke="#333333" stroke-width="1.1"/>
<text x="370.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">TA (10)</text>
<rect x="395.0" y="80.0" width="260.0" height="24.0" rx="2" fill="#ebdef0" stroke="#333333" stroke-width="1.1"/>
<text x="525.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">16-бітна адреса регістра (0x0000..0xFFFF)</text>
<rect x="655.0" y="80.0" width="45.0" height="24.0" rx="2" fill="#f4f6f8" stroke="#333333" stroke-width="1.1"/>
<text x="677.5" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">IDLE</text>
<text x="40.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Кадр даних (OP = 01 Запис / 11 Читання / 10 Читання з автоінкрементом):</text>
<rect x="40.0" y="128.0" width="45.0" height="24.0" rx="2" fill="#eaeded" stroke="#333333" stroke-width="1.1"/>
<text x="62.5" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">PRE</text>
<rect x="85.0" y="128.0" width="55.0" height="24.0" rx="2" fill="#fadbd8" stroke="#333333" stroke-width="1.1"/>
<text x="112.5" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">ST (00)</text>
<rect x="140.0" y="128.0" width="75.0" height="24.0" rx="2" fill="#aed6f1" stroke="#333333" stroke-width="1.1"/>
<text x="177.5" y="144.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700">OP (01/11/10)</text>
