<text x="540.0" y="50.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Особливість BMSR Bit 2 (Link Status, LL):</text>
<rect x="377.4" y="70.1" width="325.2" height="139.7" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/><text x="540.0" y="89.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Чому звичайне опитування не губить обрив лінка:</tspan><tspan x="540.0" dy="13.7"></tspan><tspan x="540.0" dy="13.7">1. Нормальний стан: Кабель підключено, Link = 1.</tspan><tspan x="540.0" dy="13.7">2. Подія збою: Кабель висмикнули й вставили назад.</tspan><tspan x="540.0" dy="13.7">   Аналоговий лінк відновився (1), але внутрішній</tspan><tspan x="540.0" dy="13.7">   тригер засувки зафіксував обрив (Latch = 0).</tspan><tspan x="540.0" dy="13.7">3. 1-ше читання BMSR: Повертає «0» (повідомляє стек</tspan><tspan x="540.0" dy="13.7">   про те, що лінк падав!) і скидає засувку.</tspan><tspan x="540.0" dy="13.7">4. 2-ге читання BMSR: Повертає реальний стан «1».</tspan></text>
